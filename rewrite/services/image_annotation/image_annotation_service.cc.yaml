# Android retains ordinary image annotation while physically omitting Manta/Anchovy integration.
substitutions:
- description: 'Android concrete AI source/provider removal: services/image_annotation/image_annotation_service.cc'
  regex:
    re_pattern: '\ \ \ \ mojo::PendingReceiver<mojom::ImageAnnotationService>\ receiver,\

      \ \ \ \ std::string\ api_key,\

      \ \ \ \ scoped_refptr<network::SharedURLLoaderFactory>\ shared_url_loader_factory,\

      \ \ \ \ std::unique_ptr<manta::AnchovyProvider>\ anchovy_provider,\

      \ \ \ \ std::unique_ptr<Annotator::Client>\ annotator_client\)\

      \ \ \ \ :\ receiver_\(this,\ std::move\(receiver\)\),\

      \ \ \ \ \ \ annotator_\(GURL\(kPixelsServerUrl\),\

      '
    replace: "    mojo::PendingReceiver<mojom::ImageAnnotationService> receiver,\n    std::string api_key,\n    scoped_refptr<network::SharedURLLoaderFactory> shared_url_loader_factory,\n#if !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<manta::AnchovyProvider> anchovy_provider,\n#endif  // !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<Annotator::Client> annotator_client)\n    : receiver_(this, std::move(receiver)),\n      annotator_(GURL(kPixelsServerUrl),\n"
- description: 'Android concrete AI source/provider removal: services/image_annotation/image_annotation_service.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ kBatchSize,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ kMinOcrConfidence,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ shared_url_loader_factory,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::move\(anchovy_provider\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::move\(annotator_client\)\)\ \{\}\

      \

      ImageAnnotationService::\~ImageAnnotationService\(\)\ =\ default;\

      \

      '
    replace: "                 kBatchSize,\n                 kMinOcrConfidence,\n                 shared_url_loader_factory,\n#if !BUILDFLAG(IS_ANDROID)\n                 std::move(anchovy_provider),\n#endif  // !BUILDFLAG(IS_ANDROID)\n                 std::move(annotator_client)) {\n}\n\nImageAnnotationService::~ImageAnnotationService() = default;\n\n"
