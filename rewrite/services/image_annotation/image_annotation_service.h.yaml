# Android retains ordinary image annotation while physically omitting Manta/Anchovy integration.
substitutions:
- description: 'Android concrete AI source/provider removal: services/image_annotation/image_annotation_service.h'
  regex:
    re_pattern: '\#include\ <string>\

      \

      \#include\ "base/memory/scoped_refptr\.h"\

      \#include\ "mojo/public/cpp/bindings/pending_receiver\.h"\

      \#include\ "mojo/public/cpp/bindings/receiver\.h"\

      \#include\ "services/image_annotation/annotator\.h"\

      '
    replace: '#include <string>


      #include "base/memory/scoped_refptr.h"

      #include "build/build_config.h"

      #include "mojo/public/cpp/bindings/pending_receiver.h"

      #include "mojo/public/cpp/bindings/receiver.h"

      #include "services/image_annotation/annotator.h"

      '
- description: 'Android concrete AI source/provider removal: services/image_annotation/image_annotation_service.h'
  regex:
    re_pattern: '\ \ \ \ \ \ mojo::PendingReceiver<mojom::ImageAnnotationService>\ receiver,\

      \ \ \ \ \ \ std::string\ api_key,\

      \ \ \ \ \ \ scoped_refptr<network::SharedURLLoaderFactory>\ shared_url_loader_factory,\

      \ \ \ \ \ \ std::unique_ptr<manta::AnchovyProvider>\ anchovy_provider,\

      \ \ \ \ \ \ std::unique_ptr<Annotator::Client>\ annotator_client\);\

      \

      \ \ ImageAnnotationService\(const\ ImageAnnotationService\&\)\ =\ delete;\

      '
    replace: "      mojo::PendingReceiver<mojom::ImageAnnotationService> receiver,\n      std::string api_key,\n      scoped_refptr<network::SharedURLLoaderFactory> shared_url_loader_factory,\n#if !BUILDFLAG(IS_ANDROID)\n      std::unique_ptr<manta::AnchovyProvider> anchovy_provider,\n#endif  // !BUILDFLAG(IS_ANDROID)\n      std::unique_ptr<Annotator::Client> annotator_client);\n\n  ImageAnnotationService(const ImageAnnotationService&) = delete;\n"
