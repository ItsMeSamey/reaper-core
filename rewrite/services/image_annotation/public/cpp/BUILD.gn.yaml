substitutions:
- description: Define dedicated annotation backend and processor targets only on non-Android platforms
  regex:
    pattern: "# Copyright 2019 The Chromium Authors\n# Use of this source code is governed by a BSD-style license that can\
      \ be\n# found in the LICENSE file.\n\nsource_set(\"cpp\") {\n  sources = [\n    \"image_processor.cc\",\n    \"image_processor.h\"\
      ,\n  ]\n\n  public_deps = [\n    \"//base\",\n    \"//services/image_annotation:lib\",\n    \"//services/image_annotation/public/mojom\"\
      ,\n    \"//skia\",\n    \"//ui/gfx/codec\",\n  ]\n}\n\nsource_set(\"tests\") {\n  testonly = true\n\n  sources = [ \"\
      image_processor_unittest.cc\" ]\n\n  deps = [\n    \":cpp\",\n    \"//base\",\n    \"//base/test:test_support\",\n \
      \   \"//services/image_annotation:lib\",\n    \"//testing/gmock\",\n    \"//testing/gtest\",\n    \"//ui/gfx/codec\"\
      ,\n  ]\n}\n"
    replace: "# Copyright 2019 The Chromium Authors\n# Use of this source code is governed by a BSD-style license that can\
      \ be\n# found in the LICENSE file.\n\nif (!is_android) {\n  source_set(\"cpp\") {\n    sources = [\n      \"image_processor.cc\"\
      ,\n      \"image_processor.h\",\n    ]\n\n    public_deps = [\n      \"//base\",\n      \"//services/image_annotation:lib\"\
      ,\n      \"//services/image_annotation/public/mojom\",\n      \"//skia\",\n      \"//ui/gfx/codec\",\n    ]\n  }\n\n\
      \  source_set(\"tests\") {\n    testonly = true\n\n    sources = [ \"image_processor_unittest.cc\" ]\n\n    deps = [\n\
      \      \":cpp\",\n      \"//base\",\n      \"//base/test:test_support\",\n      \"//services/image_annotation:lib\"\
      ,\n      \"//testing/gmock\",\n      \"//testing/gtest\",\n      \"//ui/gfx/codec\",\n    ]\n  }\n}\n"
  count: 1
