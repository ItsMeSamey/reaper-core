- description: 'Android direct Annotator callback lifetime: services/image_annotation/annotator.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ ClientResult::kSucceeded\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ ClientResult::kFailed;\

      \

      \ \ //\ Notify\ clients\ of\ success\ or\ failure\.\

      \ \ for\ \(auto\&\ info\ :\ request_info_it\->second\)\ \{\

      \ \ \ \ std::move\(info\.callback\)\.Run\(image_result\.Clone\(\)\);\

      \ \ \ \ ReportClientResult\(client_result\);\

      \ \ \}\

      \ \ request_infos_\.erase\(request_info_it\);\

      \}\

      \

      void\ Annotator::ProcessResults\(\

      \ \ \ \ const\ std::set<RequestKey>\&\ request_keys,\

      \ \ \ \ const\ std::map<std::string,\ mojom::AnnotateImageResultPtr>\&\ results\)\ \{\

      \ \ //\ Process\ each\ request\ key\ for\ which\ we\ expect\ to\ have\ results\.\

      \ \ for\ \(const\ RequestKey\&\ request_key\ :\ request_keys\)\ \{\

      \ \ \ \ ProcessResult\(request_key,\ results\);\

      \ \ \}\

      \}\

      \

      '
    replace: "                                 ? ClientResult::kSucceeded\n                                 : ClientResult::kFailed;\n\n#if BUILDFLAG(IS_ANDROID)\n  // Finish bookkeeping before client code can retry this image or destroy us.\n  auto completed_requests = std::move(request_info_it->second);\n  request_infos_.erase(request_info_it);\n  for (auto& info : completed_requests) {\n    // Disconnect handlers hold iterators into the old request list. Cancel them\n    // before callbacks can run a nested message loop.\n    info.image_processor.reset();\n  }\n  const auto weak_this = weak_factory_.GetWeakPtr();\n  for (auto& info : completed_requests) {\n    ReportClientResult(client_result);\n    std::move(info.callback).Run(image_result.Clone());\n    if (!weak_this) {\n      return;\n    }\n  }\n#else\n  // Notify clients of success or failure.\n  for (auto& info : request_info_it->second) {\n    std::move(info.callback).Run(image_result.Clone());\n    ReportClientResult(client_result);\n\
      \  }\n  request_infos_.erase(request_info_it);\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n\nvoid Annotator::ProcessResults(\n    const std::set<RequestKey>& request_keys,\n    const std::map<std::string, mojom::AnnotateImageResultPtr>& results) {\n#if BUILDFLAG(IS_ANDROID)\n  const auto weak_this = weak_factory_.GetWeakPtr();\n#endif  // BUILDFLAG(IS_ANDROID)\n  // Process each request key for which we expect to have results.\n  for (const RequestKey& request_key : request_keys) {\n    ProcessResult(request_key, results);\n#if BUILDFLAG(IS_ANDROID)\n    if (!weak_this) {\n      return;\n    }\n#endif  // BUILDFLAG(IS_ANDROID)\n  }\n}\n\n"
