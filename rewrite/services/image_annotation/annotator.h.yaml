# Android retains ordinary image annotation while physically omitting Manta/Anchovy integration.
substitutions:
- description: 'Android concrete AI source/provider removal: services/image_annotation/annotator.h'
  regex:
    re_pattern: '\#include\ "base/memory/weak_ptr\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "base/timer/timer\.h"\

      \#include\ "components/manta/anchovy/anchovy_provider\.h"\

      \#include\ "mojo/public/cpp/bindings/pending_receiver\.h"\

      \#include\ "mojo/public/cpp/bindings/pending_remote\.h"\

      \#include\ "mojo/public/cpp/bindings/receiver_set\.h"\

      '
    replace: '#include "base/memory/weak_ptr.h"

      #include "base/time/time.h"

      #include "base/timer/timer.h"

      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/manta/anchovy/anchovy_provider.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "mojo/public/cpp/bindings/pending_receiver.h"

      #include "mojo/public/cpp/bindings/pending_remote.h"

      #include "mojo/public/cpp/bindings/receiver_set.h"

      '
- description: 'Android concrete AI source/provider removal: services/image_annotation/annotator.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ int\ batch_size,\

      \ \ \ \ \ \ \ \ \ \ \ \ double\ min_ocr_confidence,\

      \ \ \ \ \ \ \ \ \ \ \ \ scoped_refptr<network::SharedURLLoaderFactory>\ url_loader_factory,\

      \ \ \ \ \ \ \ \ \ \ \ \ std::unique_ptr<manta::AnchovyProvider>\ anchovy_provider,\

      \ \ \ \ \ \ \ \ \ \ \ \ std::unique_ptr<Client>\ client\);\

      \

      \ \ Annotator\(const\ Annotator\&\)\ =\ delete;\

      '
    replace: "            int batch_size,\n            double min_ocr_confidence,\n            scoped_refptr<network::SharedURLLoaderFactory> url_loader_factory,\n#if !BUILDFLAG(IS_ANDROID)\n            std::unique_ptr<manta::AnchovyProvider> anchovy_provider,\n#endif  // !BUILDFLAG(IS_ANDROID)\n            std::unique_ptr<Client> client);\n\n  Annotator(const Annotator&) = delete;\n"
- description: 'Android concrete AI source/provider removal: services/image_annotation/annotator.h'
  regex:
    re_pattern: '\ \ void\ OnServerResponseReceived\(const\ std::set<RequestKey>\&\ request_keys,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ UrlLoaderList::iterator\ server_request_it,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::optional<std::string>\ json_response\);\

      \ \ //\ Called\ once\ a\ response\ comes\ back\ from\ anchovy_provider_\.\

      \ \ void\ OnMantaResponseReceived\(const\ RequestKey\&\ request_key,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::Time\ request_time,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::DictValue\ dict,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ manta::MantaStatus\ status\);\

      \

      \ \ //\ Called\ when\ the\ data\ decoder\ service\ provides\ parsed\ JSON\ data\ for\ a\ server\

      \ \ //\ response\.\

      '
    replace: "  void OnServerResponseReceived(const std::set<RequestKey>& request_keys,\n                                UrlLoaderList::iterator server_request_it,\n                                std::optional<std::string> json_response);\n#if !BUILDFLAG(IS_ANDROID)\n  // Called once a response comes back from anchovy_provider_.\n  void OnMantaResponseReceived(const RequestKey& request_key,\n                               base::Time request_time,\n                               base::DictValue dict,\n                               manta::MantaStatus status);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  // Called when the data decoder service provides parsed JSON data for a server\n  // response.\n"
- description: 'Android concrete AI source/provider removal: services/image_annotation/annotator.h'
  regex:
    re_pattern: '\ \ //\ Handle\ the\ reply\ with\ the\ server\ languages\.\

      \ \ void\ OnServerLangsResponseReceived\(std::optional<std::string>\ json_response\);\

      \

      \ \ const\ std::unique_ptr<manta::AnchovyProvider>\ anchovy_provider_;\

      \ \ const\ std::unique_ptr<Client>\ client_;\

      \

      \ \ //\ Maps\ from\ request\ key\ to\ previously\-obtained\ annotation\ results\.\

      '
    replace: "  // Handle the reply with the server languages.\n  void OnServerLangsResponseReceived(std::optional<std::string> json_response);\n\n#if !BUILDFLAG(IS_ANDROID)\n  const std::unique_ptr<manta::AnchovyProvider> anchovy_provider_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n  const std::unique_ptr<Client> client_;\n\n  // Maps from request key to previously-obtained annotation results.\n"
