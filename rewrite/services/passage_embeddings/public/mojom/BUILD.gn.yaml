substitutions:
- description: Exclude the dedicated passage service Mojo target on Android after its utility and producer admission edges
    are retired; preserve the desktop target.
  regex:
    pattern: "mojom(\"mojom\") {\n  sources = [ \"passage_embeddings.mojom\" ]\n  public_deps = [\n    \"//mojo/public/mojom/base\"\
      ,\n    \"//sandbox/policy/mojom\",\n  ]\n}\n"
    replace: "if (!is_android) {\n  mojom(\"mojom\") {\n    sources = [ \"passage_embeddings.mojom\" ]\n    public_deps =\
      \ [\n      \"//mojo/public/mojom/base\",\n      \"//sandbox/policy/mojom\",\n    ]\n  }\n}\n"
  count: 1
