substitutions:
  - description: Keep Android translation download progress without model execution dependencies
    regex:
      pattern: "# found in the LICENSE file.\n\nimport(\"//mojo/public/tools/bindings/mojom.gni\")\n\nmojom(\"mojom\") {\n  generate_blink = true\n"
      replace: "# found in the LICENSE file.\n\nimport(\"//mojo/public/tools/bindings/mojom.gni\")\n\n# Android translation needs download progress, not model execution types.\n# Keep the existing non-Android target and its generated outputs unchanged.\nif (is_android) {\n  mojom(\"download_observer\") {\n    generate_blink = true\n    sources = [ \"download_observer.mojom\" ]\n    webui_module_path = \"/\"\n    export_class_attribute_blink = \"PLATFORM_EXPORT\"\n    export_define_blink = \"BLINK_PLATFORM_IMPLEMENTATION=1\"\n    export_header_blink = \"third_party/blink/renderer/platform/platform_export.h\"\n    generate_legacy_js_bindings = true\n    generate_java = true\n  }\n}\n\nmojom(\"mojom\") {\n  generate_blink = true\n"
    count: 1
  - description: Keep Android translation download progress without model execution dependencies
    regex:
      pattern: "    \"//sandbox/policy/mojom\",\n    \"//skia/public/mojom\",\n  ]\n  webui_module_path = \"/\"\n\n  export_class_attribute_blink = \"PLATFORM_EXPORT\"\n"
      replace: "    \"//sandbox/policy/mojom\",\n    \"//skia/public/mojom\",\n  ]\n  if (is_android) {\n    # Each schema must have one generator even if a test requests the full API.\n    sources -= [ \"download_observer.mojom\" ]\n    public_deps += [ \":download_observer\" ]\n  }\n  webui_module_path = \"/\"\n\n  export_class_attribute_blink = \"PLATFORM_EXPORT\"\n"
    count: 1
