substitutions:
- description: Stop importing the Android generative backend into the otherwise independent native service
  regex:
    pattern: "    if (is_android) {\n      deps += [ \"//services/on_device_model/android\" ]\n    }\n"
    replace: ''
  count: 1
- description: Do not define the generative model backend component on Android
  regex:
    pattern: "component(\"backend_interfaces\") {\n  sources = [\n    \"backend.h\",\n    \"backend_model.cc\",\n    \"backend_model.h\"\
      ,\n    \"backend_session.h\",\n  ]\n  deps = [\n    \"//base\",\n    \"//services/on_device_model/public/cpp\",\n  \
      \  \"//services/on_device_model/public/mojom\",\n  ]\n  defines = [ \"IS_ON_DEVICE_MODEL_IMPL\" ]\n}\n"
    replace: "if (!is_android) {\n  component(\"backend_interfaces\") {\n    sources = [\n      \"backend.h\",\n      \"backend_model.cc\"\
      ,\n      \"backend_model.h\",\n      \"backend_session.h\",\n    ]\n    deps = [\n      \"//base\",\n      \"//services/on_device_model/public/cpp\"\
      ,\n      \"//services/on_device_model/public/mojom\",\n    ]\n    defines = [ \"IS_ON_DEVICE_MODEL_IMPL\" ]\n  }\n}\n"
  count: 1
- description: Do not define generative model service and service-only tests on Android
  regex:
    pattern: if (use_blink || (is_ios && build_with_internal_optimization_guide)) {
    replace: "if (!is_android &&\n    (use_blink || (is_ios && build_with_internal_optimization_guide))) {"
  count: 1
