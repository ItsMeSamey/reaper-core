substitutions:
- description: Include explicit platform build flags
  regex:
    pattern: '#include "services/metrics/public/cpp/ukm_entry_builder.h"

      '
    replace: '#include "services/metrics/public/cpp/ukm_entry_builder.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Keep desktop metric update test; assert empty Android builder and no recorder callbacks
  regex:
    pattern: "// Tests that calling `SetMetric` repeatedly on an `UkmEntryBuilder` updates the\n// value stored for the metric.\n\
      TEST(UkmEntryBuilderTest, BuilderAllowsUpdatingMetrics) {\n  UkmEntryBuilder builder(kInvalidSourceId, \"Kangaroo.Jumped\"\
      );\n  builder.SetMetric(\"Length\", 4);\n  EXPECT_THAT(builder.GetEntryForTesting()->metrics, ElementsAre(Pair(_, 4)));\n\
      \n  builder.SetMetric(\"Length\", 5);\n  EXPECT_THAT(builder.GetEntryForTesting()->metrics, ElementsAre(Pair(_, 5)));\n\
      }\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\nnamespace {\n\nclass MockUkmRecorder : public UkmRecorder {\n public:\n  MOCK_METHOD(void,\
      \ AddEntry, (mojom::UkmEntryPtr entry), (override));\n  MOCK_METHOD(void,\n              RecordWebDXFeatures,\n    \
      \          (SourceId, const std::set<int32_t>&, size_t),\n              (override));\n  MOCK_METHOD(void, UpdateSourceURL,\
      \ (SourceId, const GURL&), (override));\n  MOCK_METHOD(void,\n              UpdateAppURL,\n              (SourceId,\
      \ const GURL&, AppType),\n              (override));\n  MOCK_METHOD(void,\n              RecordNavigation,\n       \
      \       (SourceId, const UkmSource::NavigationData&),\n              (override));\n  MOCK_METHOD(void, MarkSourceForDeletion,\
      \ (SourceId), (override));\n};\n\n}  // namespace\n\nTEST(UkmEntryBuilderTest, AndroidMetricUpdatesDoNotAllocateAnEntry)\
      \ {\n  UkmEntryBuilder builder(ConvertToSourceId(1, SourceIdType::NAVIGATION_ID),\n                          \"Kangaroo.Jumped\"\
      );\n  EXPECT_TRUE(builder.GetEntryForTesting().is_null());\n  builder.SetMetric(\"Length\", 4);\n  builder.SetMetric(\"\
      Length\", 5);\n  EXPECT_TRUE(builder.GetEntryForTesting().is_null());\n  EXPECT_TRUE(builder.TakeEntry().is_null());\n\
      \  EXPECT_TRUE(builder.TakeEntry().is_null());\n}\n\nTEST(UkmEntryBuilderTest, AndroidRecordNeverCallsTheRecorder) {\n\
      \  testing::StrictMock<MockUkmRecorder> recorder;\n  UkmEntryBuilder builder(ConvertToSourceId(2, SourceIdType::NAVIGATION_ID),\n\
      \                          \"Kangaroo.Jumped\");\n  builder.SetMetric(\"Length\", 4);\n  builder.Record(&recorder);\n\
      \  builder.Record(&recorder);\n  EXPECT_TRUE(builder.GetEntryForTesting().is_null());\n  EXPECT_TRUE(builder.TakeEntry().is_null());\n\
      }\n#else\n// Tests that calling `SetMetric` repeatedly on an `UkmEntryBuilder` updates the\n// value stored for the\
      \ metric.\nTEST(UkmEntryBuilderTest, BuilderAllowsUpdatingMetrics) {\n  UkmEntryBuilder builder(kInvalidSourceId, \"\
      Kangaroo.Jumped\");\n  builder.SetMetric(\"Length\", 4);\n  EXPECT_THAT(builder.GetEntryForTesting()->metrics, ElementsAre(Pair(_,\
      \ 4)));\n\n  builder.SetMetric(\"Length\", 5);\n  EXPECT_THAT(builder.GetEntryForTesting()->metrics, ElementsAre(Pair(_,\
      \ 5)));\n}\n#endif\n"
  count: 1
