substitutions:
  - description: "Add compile-time Android platform guard"
    regex:
      pattern: "\nnamespace "
      replace: "\n#include \"build/build_config.h\"\n\nnamespace "
    count: 1
  - description: "Omit Android UkmEntry allocation and source/event field preparation"
    regex:
      pattern: "UkmEntryBuilderBase::UkmEntryBuilderBase(ukm::SourceId source_id,\n                                         uint64_t event_hash)\n    : entry_(mojom::UkmEntry::New()) {\n  entry_->source_id = source_id;\n  entry_->event_hash = event_hash;\n}"
      replace: "#if BUILDFLAG(IS_ANDROID)\nUkmEntryBuilderBase::UkmEntryBuilderBase(ukm::SourceId source_id,\n                                         uint64_t event_hash) {}\n#else\nUkmEntryBuilderBase::UkmEntryBuilderBase(ukm::SourceId source_id,\n                                         uint64_t event_hash)\n    : entry_(mojom::UkmEntry::New()) {\n  entry_->source_id = source_id;\n  entry_->event_hash = event_hash;\n}\n#endif"
    count: 1
  - description: "Omit Android UkmEntry allocation and source/event field preparation"
    regex:
      pattern: "UkmEntryBuilderBase::UkmEntryBuilderBase(ukm::SourceIdObj source_id,\n                                         uint64_t event_hash)\n    : entry_(mojom::UkmEntry::New()) {\n  entry_->source_id = source_id.ToInt64();\n  entry_->event_hash = event_hash;\n}"
      replace: "#if BUILDFLAG(IS_ANDROID)\nUkmEntryBuilderBase::UkmEntryBuilderBase(ukm::SourceIdObj source_id,\n                                         uint64_t event_hash) {}\n#else\nUkmEntryBuilderBase::UkmEntryBuilderBase(ukm::SourceIdObj source_id,\n                                         uint64_t event_hash)\n    : entry_(mojom::UkmEntry::New()) {\n  entry_->source_id = source_id.ToInt64();\n  entry_->event_hash = event_hash;\n}\n#endif"
    count: 1
  - description: "Android no-op void UkmEntryBuilderBase::SetMetricInternal"
    regex:
      pattern: "{\n  entry_->metrics.insert_or_assign(metric_hash, value);\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  entry_->metrics.insert_or_assign(metric_hash, value);\n#endif\n}"
    count: 1
  - description: "Android no-op void UkmEntryBuilderBase::Record"
    regex:
      pattern: "{\n  if (recorder) {\n    recorder->AddEntry(std::move(entry_));\n  } else {\n    entry_.reset();\n  }\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (recorder) {\n    recorder->AddEntry(std::move(entry_));\n  } else {\n    entry_.reset();\n  }\n#endif\n}"
    count: 1
