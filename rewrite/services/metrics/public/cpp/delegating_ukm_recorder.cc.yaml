substitutions:
  - description: "Add compile-time Android platform guard"
    regex:
      pattern: "\nnamespace "
      replace: "\n#include \"build/build_config.h\"\n\nnamespace "
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::AddDelegate("
    regex:
      pattern: "{\n  bool multiple_delegates = false;\n  {\n    base::AutoLock auto_lock(lock_);\n    delegates_.insert(\n        {delegate.get(),\n         Delegate(base::SequencedTaskRunner::GetCurrentDefault(), delegate)});\n    multiple_delegates = delegates_.size() > 1;\n  }\n  // If multiple delegates are present, allow all clients to send an IPC to\n  // browser process for AddEntry. This is because delegates can have different\n  // parameters and be attached to different clients, and if an event being\n  // observed by any of the clients occurs, all the clients should be able to\n  // send UkmInterface::AddEntry IPC. Multiple Delegates should only be present\n  // in test environment.\n  if (multiple_delegates) {\n    metrics::UkmRecorderClientInterfaceRegistry::NotifyMultipleDelegates();\n  }\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  bool multiple_delegates = false;\n  {\n    base::AutoLock auto_lock(lock_);\n    delegates_.insert(\n        {delegate.get(),\n         Delegate(base::SequencedTaskRunner::GetCurrentDefault(), delegate)});\n    multiple_delegates = delegates_.size() > 1;\n  }\n  // If multiple delegates are present, allow all clients to send an IPC to\n  // browser process for AddEntry. This is because delegates can have different\n  // parameters and be attached to different clients, and if an event being\n  // observed by any of the clients occurs, all the clients should be able to\n  // send UkmInterface::AddEntry IPC. Multiple Delegates should only be present\n  // in test environment.\n  if (multiple_delegates) {\n    metrics::UkmRecorderClientInterfaceRegistry::NotifyMultipleDelegates();\n  }\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::RemoveDelegate("
    regex:
      pattern: "{\n  base::AutoLock auto_lock(lock_);\n  delegates_.erase(delegate);\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  base::AutoLock auto_lock(lock_);\n  delegates_.erase(delegate);\n#endif\n}"
    count: 1
  - description: "Android no-op bool DelegatingUkmRecorder::HasMultipleDelegates("
    regex:
      pattern: "{\n  base::AutoLock lock(lock_);\n  return delegates_.size() > 1;\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n  return false;\n#else\n  base::AutoLock lock(lock_);\n  return delegates_.size() > 1;\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::UpdateSourceURL("
    regex:
      pattern: "{\n  if (GetSourceIdType(source_id) == SourceIdType::NAVIGATION_ID ||\n      GetSourceIdType(source_id) == SourceIdType::APP_ID) {\n    DLOG(FATAL)\n        << \"UpdateSourceURL invoked for NAVIGATION_ID or APP_ID SourceId\";\n    return;\n  }\n\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_)\n    iterator.second.UpdateSourceURL(source_id, url);\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (GetSourceIdType(source_id) == SourceIdType::NAVIGATION_ID ||\n      GetSourceIdType(source_id) == SourceIdType::APP_ID) {\n    DLOG(FATAL)\n        << \"UpdateSourceURL invoked for NAVIGATION_ID or APP_ID SourceId\";\n    return;\n  }\n\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_)\n    iterator.second.UpdateSourceURL(source_id, url);\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::RecordNavigation("
    regex:
      pattern: "{\n  if (GetSourceIdType(source_id) != SourceIdType::NAVIGATION_ID) {\n    DLOG(FATAL) << \"UpdateNavigationURL invoked for non-NAVIGATION_ID SourceId\";\n    return;\n  }\n\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_) {\n    iterator.second.RecordNavigation(source_id, navigation_data);\n  }\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (GetSourceIdType(source_id) != SourceIdType::NAVIGATION_ID) {\n    DLOG(FATAL) << \"UpdateNavigationURL invoked for non-NAVIGATION_ID SourceId\";\n    return;\n  }\n\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_) {\n    iterator.second.RecordNavigation(source_id, navigation_data);\n  }\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::UpdateAppURL("
    regex:
      pattern: "{\n  if (GetSourceIdType(source_id) != SourceIdType::APP_ID) {\n    DLOG(FATAL) << \"UpdateAppURL invoked for non-APP_ID SourceId\";\n    return;\n  }\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_)\n    iterator.second.UpdateAppURL(source_id, url, app_type);\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (GetSourceIdType(source_id) != SourceIdType::APP_ID) {\n    DLOG(FATAL) << \"UpdateAppURL invoked for non-APP_ID SourceId\";\n    return;\n  }\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_)\n    iterator.second.UpdateAppURL(source_id, url, app_type);\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::AddEntry("
    regex:
      pattern: "{\n  base::AutoLock auto_lock(lock_);\n  // If there is exactly one delegate, just forward the call.\n  if (delegates_.size() == 1) {\n    delegates_.begin()->second.AddEntry(std::move(entry));\n    return;\n  }\n  // Otherwise, make a copy for each delegate.\n  for (auto& iterator : delegates_)\n    iterator.second.AddEntry(entry->Clone());\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  base::AutoLock auto_lock(lock_);\n  // If there is exactly one delegate, just forward the call.\n  if (delegates_.size() == 1) {\n    delegates_.begin()->second.AddEntry(std::move(entry));\n    return;\n  }\n  // Otherwise, make a copy for each delegate.\n  for (auto& iterator : delegates_)\n    iterator.second.AddEntry(entry->Clone());\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::RecordWebDXFeatures("
    regex:
      pattern: "{\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_) {\n    iterator.second.RecordWebDXFeatures(source_id, features, max_feature_value);\n  }\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_) {\n    iterator.second.RecordWebDXFeatures(source_id, features, max_feature_value);\n  }\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::MarkSourceForDeletion("
    regex:
      pattern: "{\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_)\n    iterator.second.MarkSourceForDeletion(source_id);\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  base::AutoLock auto_lock(lock_);\n  for (auto& iterator : delegates_)\n    iterator.second.MarkSourceForDeletion(source_id);\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::Delegate::UpdateSourceURL("
    regex:
      pattern: "{\n  if (task_runner_->RunsTasksInCurrentSequence()) {\n    if (ptr_) {\n      ptr_->UpdateSourceURL(source_id, url);\n    }\n    return;\n  }\n  task_runner_->PostTask(\n      FROM_HERE,\n      base::BindOnce(&UkmRecorder::UpdateSourceURL, ptr_, source_id, url));\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (task_runner_->RunsTasksInCurrentSequence()) {\n    if (ptr_) {\n      ptr_->UpdateSourceURL(source_id, url);\n    }\n    return;\n  }\n  task_runner_->PostTask(\n      FROM_HERE,\n      base::BindOnce(&UkmRecorder::UpdateSourceURL, ptr_, source_id, url));\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::Delegate::UpdateAppURL("
    regex:
      pattern: "{\n  if (task_runner_->RunsTasksInCurrentSequence()) {\n    if (ptr_) {\n      ptr_->UpdateAppURL(source_id, url, app_type);\n    }\n    return;\n  }\n  task_runner_->PostTask(\n      FROM_HERE, base::BindOnce(&UkmRecorder::UpdateAppURL, ptr_, source_id,\n                                url, app_type));\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (task_runner_->RunsTasksInCurrentSequence()) {\n    if (ptr_) {\n      ptr_->UpdateAppURL(source_id, url, app_type);\n    }\n    return;\n  }\n  task_runner_->PostTask(\n      FROM_HERE, base::BindOnce(&UkmRecorder::UpdateAppURL, ptr_, source_id,\n                                url, app_type));\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::Delegate::RecordNavigation("
    regex:
      pattern: "{\n  if (task_runner_->RunsTasksInCurrentSequence()) {\n    if (ptr_) {\n      ptr_->RecordNavigation(source_id, navigation_data);\n    }\n    return;\n  }\n  task_runner_->PostTask(\n      FROM_HERE, base::BindOnce(&UkmRecorder::RecordNavigation, ptr_, source_id,\n                                navigation_data));\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (task_runner_->RunsTasksInCurrentSequence()) {\n    if (ptr_) {\n      ptr_->RecordNavigation(source_id, navigation_data);\n    }\n    return;\n  }\n  task_runner_->PostTask(\n      FROM_HERE, base::BindOnce(&UkmRecorder::RecordNavigation, ptr_, source_id,\n                                navigation_data));\n#endif\n}"
    count: 1
  - description: "Android no-op void DelegatingUkmRecorder::Delegate::AddEntry("
    regex:
      pattern: "{\n  if (task_runner_->RunsTasksInCurrentSequence()) {\n    if (ptr_) {\n      ptr_->AddEntry(std::move(entry));\n    }\n    return;\n  }\n  task_runner_->PostTask(FROM_HERE, base::BindOnce(&UkmRecorder::AddEntry, ptr_,\n                                                   std::move(entry)));\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (task_runner_->RunsTasksInCurrentSequence()) {\n    if (ptr_) {\n      ptr_->AddEntry(std::move(entry));\n    }\n    return;\n  }\n  task_runner_->PostTask(FROM_HERE, base::BindOnce(&UkmRecorder::AddEntry, ptr_,\n                                                   std::move(entry)));\n#endif\n}"
    count: 1
