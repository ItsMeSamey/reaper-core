substitutions:
  - description: "Add compile-time Android platform guard"
    regex:
      pattern: "\nnamespace "
      replace: "\n#include \"build/build_config.h\"\n\nnamespace "
    count: 1
  - description: "Omit Android dynamic event-name hashing"
    regex:
      pattern: "UkmEntryBuilder::UkmEntryBuilder(ukm::SourceId source_id,\n                                 std::string_view event_name)\n    : ukm::internal::UkmEntryBuilderBase(source_id,\n                                         base::HashMetricName(event_name)) {}"
      replace: "#if BUILDFLAG(IS_ANDROID)\nUkmEntryBuilder::UkmEntryBuilder(ukm::SourceId source_id,\n                                 std::string_view event_name)\n    : ukm::internal::UkmEntryBuilderBase(source_id, 0) {}\n#else\nUkmEntryBuilder::UkmEntryBuilder(ukm::SourceId source_id,\n                                 std::string_view event_name)\n    : ukm::internal::UkmEntryBuilderBase(source_id,\n                                         base::HashMetricName(event_name)) {}\n#endif"
    count: 1
  - description: "Android no-op void UkmEntryBuilder::SetMetric"
    regex:
      pattern: "{\n  SetMetricInternal(base::HashMetricName(metric_name), value);\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  SetMetricInternal(base::HashMetricName(metric_name), value);\n#endif\n}"
    count: 1
