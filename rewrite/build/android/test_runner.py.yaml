substitutions:
- description: 'Optional Android native-test owned display routing: edit 1'
  regex:
    pattern: "    \"\"\"Adds gtest options to |parser|.\"\"\"\n\n    parser = parser.add_argument_group('gtest\
      \ arguments')\n\n    parser.add_argument(\n        '--additional-apk',\n"
    replace: "    \"\"\"Adds gtest options to |parser|.\"\"\"\n\n    parser = parser.add_argument_group('gtest\
      \ arguments')\n\n    parser.add_argument(\n        '--test-launch-display-id',\n        type=int,\n\
      \        default=None,\n        help='Launch native test APK activities on this existing Android\
      \ display. '\n        'Invalid, unavailable or inaccessible displays fail without fallback.',\n\
      \    )\n\n    parser.add_argument(\n        '--additional-apk',\n"
  count: 1
- description: Route Java test activities to an explicitly owned display 1
  regex:
    pattern: "    \"\"\"Adds Instrumentation test options to |parser|.\"\"\"\n\n    parser = parser.add_argument_group('instrumentation arguments')\n\n    parser.add_argument(\n        '--additional-apex',\n"
    replace: "    \"\"\"Adds Instrumentation test options to |parser|.\"\"\"\n\n    parser = parser.add_argument_group('instrumentation arguments')\n\n    parser.add_argument(\n        '--test-launch-display-id',\n        type=int,\n        default=None,\n        help='Launch activities created by BaseActivityTestRule on this existing '\n        'Android display. Invalid or unavailable displays fail without fallback.',\n    )\n\n    parser.add_argument(\n        '--additional-apex',\n"
  count: 1
- description: 'Owned Android native test data and explicit no-device-recovery: edit 1'
  regex:
    pattern: "        '(increases flakiness)',\n    )\n    parser.add_argument(\n        '--recover-devices',\n        action='store_true',\n        help='Attempt to recover devices prior to the final retry. Warning: '\n"
    replace: "        '(increases flakiness)',\n    )\n    parser.add_argument(\n        '--disable-device-recovery',\n        action='store_true',\n        help='Require one explicit online --device. Disable discovery ADB/USB '\n        'recovery and crash/reconnect retries during setup, test discovery and '\n        'execution. Incompatible with --recover-devices.',\n    )\n    parser.add_argument(\n        '--recover-devices',\n        action='store_true',\n        help='Attempt to recover devices prior to the final retry. Warning: '\n"
  count: 1
- description: 'Owned Android native test data and explicit no-device-recovery: edit 2'
  regex:
    pattern: "        '--coverage-dir',\n        type=os.path.realpath,\n        help='Directory in which to place all generated coverage files.',\n    )\n    parser.add_argument(\n        '--use-existing-test-data',\n"
    replace: "        '--coverage-dir',\n        type=os.path.realpath,\n        help='Directory in which to place all generated coverage files.',\n    )\n    parser.add_argument(\n        '--test-data-root-name',\n        help='Native test APK data directory under external storage. Use a unique '\n        'chromium_tests_root_<token> name owned by this run; omission preserves '\n        'the shared default. This option does not establish directory ownership.',\n    )\n    parser.add_argument(\n        '--use-existing-test-data',\n"
  count: 1
- description: 'Preserve shared Android device state: edit 1'
  regex:
    pattern: "    parser = parser.add_argument_group('device arguments')\n\n    parser.add_argument(\n        '--adb-path',\n        type=os.path.realpath,\n        help='Specify the absolute path of the adb binary that should be used.',\n"
    replace: "    parser = parser.add_argument_group('device arguments')\n\n    parser.add_argument(\n        '--preserve-shared-device-state',\n        action='store_true',\n        default=False,\n        help='Skip automatic browser-role, debug-app, system-modal and keyboard '\n        'changes, and retain native logcat buffers. Test-package data and '\n        'dependency files are not preserved.',\n    )\n\n    parser.add_argument(\n        '--adb-path',\n        type=os.path.realpath,\n        help='Specify the absolute path of the adb binary that should be used.',\n"
  count: 1
- description: 'Preserve shared Android device state: edit 2'
  regex:
    pattern: "    \"\"\"Adds Instrumentation test options to |parser|.\"\"\"\n\n    parser = parser.add_argument_group('instrumentation arguments')\n\n    parser.add_argument(\n        '--test-launch-display-id',\n"
    replace: "    \"\"\"Adds Instrumentation test options to |parser|.\"\"\"\n\n    parser = parser.add_argument_group('instrumentation arguments')\n\n\n    parser.add_argument(\n        '--test-launch-display-id',\n"
  count: 1
