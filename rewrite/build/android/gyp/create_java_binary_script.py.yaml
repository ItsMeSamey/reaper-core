substitutions:
  - description: Opt in bytecode compiler wrappers to runtime-verified owned-cgroup JVM settings without changing ordinary or initialized JUnit launchers.
    regex:
      re_pattern: 'parser\.add_argument\(''\-\-classpath''\)\

        '
      replace: 'parser.add_argument(''--classpath'')

        parser.add_argument(''--reaper-owned-cgroup-jvm'', action=''store_true'')

        '
    count: 1
  - description: Opt in bytecode compiler wrappers to runtime-verified owned-cgroup JVM settings without changing ordinary or initialized JUnit launchers.
    regex:
      re_pattern: '\{extra_flags\}\

        java_cmd\ \+='
      replace: "{extra_flags}\n# Compiler callers opt in at execution time. Other wrappers, including JUnit,\n# retain their existing JVM environment and standalone runtime dependencies.\nif known_args.reaper_owned_cgroup_jvm:\n  sys.path.insert(0, os.path.normpath(os.path.join(self_dir, {gyp_dir})))\n  from util import build_utils\n  java_cmd += build_utils.ReaperExplicitCgroupJvmFlags({max_heap_size})\njava_cmd +="
    count: 1
  - description: Opt in bytecode compiler wrappers to runtime-verified owned-cgroup JVM settings without changing ordinary or initialized JUnit launchers.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ java_path=repr\(java_path\),\

        '
      replace: "                java_path=repr(java_path),\n                gyp_dir=repr(os.path.relpath(\n                    os.path.dirname(os.path.dirname(build_utils.__file__)),\n                    run_dir)),\n                max_heap_size=repr(args.max_heap_size),\n"
    count: 1
