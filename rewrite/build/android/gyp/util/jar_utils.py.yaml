substitutions:
  - description: Reject failed Android jdeps output and register ordinary regression coverage
    regex:
      pattern: "            if result.returncode:\n                # Pack all the information into the error message since that is the last\n                # thing visible in the output.\n                raise RuntimeError(\n                    f'\\nFilepath:\\n{filepath}\\ncmd:\\n{\" \".join(cmd)}\\n'\n                    f'stdout:\\n{result.stdout}\\nstderr:{result.stderr}\\n'\n                )\n"
      replace: "    if result.returncode:\n        # Pack all the information into the error message since that is the last\n        # thing visible in the output.\n        raise RuntimeError(\n            f'\\\\nFilepath:\\\\n{filepath}\\\\ncmd:\\\\n{\" \".join(result.args)}\\\\n'\n            f'stdout:\\\\n{result.stdout}\\\\nstderr:{result.stderr}\\\\n'\n        )\n"
    count: 1
