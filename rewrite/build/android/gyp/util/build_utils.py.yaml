substitutions:
  - description: Use explicit JVM ergonomics only after verifying the owned displaced-namespace hard cgroup; retain compiler diagnostics and explicit heaps.
    regex:
      re_pattern: 'def\ JavaCmd\(xmx=''1G''\):'
      replace: "def ReaperExplicitCgroupJvmFlags(xmx, prefix='', environment=None):\n    \"\"\"Use explicit JVM ergonomics only inside a verified Reaper hard scope.\n\n    HotSpot cannot resolve a scope above the inherited cgroup namespace root.\n    Its automatic container detection is not the kernel memory controller.\n    Retain every compiler/JVM diagnostic; replace only that inaccurate resource\n    discovery with finite heap and worker settings while rechecking kernel caps.\n    The root controller sets this private marker after its normal scope admission.\n    \"\"\"\n    environment = os.environ if environment is None else environment\n    scope = environment.get('REAPER_INTERNAL_VERIFIED_HARD_CGROUP', '')\n    if not scope:\n        return []\n\n    def require(condition, message):\n        if not condition:\n            raise RuntimeError('Reaper explicit JVM budget: ' + message)\n\n    require(os.path.isabs(scope), 'scope path must be absolute')\n    scope = os.path.realpath(scope)\n    name = os.path.basename(scope)\n    require(re.fullmatch(r'reaper-root[0-9]+-build-[0-9a-f]{16}\\.scope', name),\n            'unexpected owned scope name')\n    # Exact reviewed profiles: high, hard, swap and maximum explicit heap GiB.\n    profiles = {'6144': (5, 6, 2, 4), '10240': (8, 10, 4, 8)}\n    budget = environment.get('REAPER_INTERNAL_SELECTED_RSS_MIB', '')\n    require(budget in profiles, 'requires a reviewed six/ten-GiB controller')\n    high_gib, hard_gib, swap_gib, heap_gib = profiles[budget]\n    jobs = environment.get('REAPER_INTERNAL_SELECTED_JOBS', '')\n    require(jobs in ('1', '2'), 'requires the reviewed one/two-job controller')\n    require(0 < len(os.sched_getaffinity(0)) <= int(jobs),\n            'affinity exceeds the selected controller jobs')\n    require(not any(environment.get(k) for k in (\n        'JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', '_JAVA_OPTIONS',\n        'JDK_JAVAC_OPTIONS', 'JAVA_OPTS', 'KOTLIN_OPTS')),\n        'inherited JVM option override is not admitted')\n\n    def read(path):\n        with open(path, encoding='utf-8') as stream:\n            return stream.read().strip()\n\n    membership = read('/proc/self/cgroup')\n    require(re.fullmatch(r'0::/(?:\\.\\./)+app\\.slice/' + re.escape(name),\n                         membership),\n            'not the known displaced cgroup namespace layout')\n    for filename, expected in (\n            ('memory.high', high_gib * 1024**3),\n            ('memory.max', hard_gib * 1024**3),\n            ('memory.swap.max', swap_gib * 1024**3)):\n        require(read(os.path.join(scope, filename)) == str(expected),\n                filename + ' differs from the reviewed hard limit')\n    require(str(os.getpid()) in read(os.path.join(scope, 'cgroup.procs')).split(),\n            'this JVM launcher is not in the verified scope')\n    heap = re.fullmatch(r'([1-9][0-9]*)([kKmMgG]?)', xmx)\n    require(heap is not None, 'heap must be an explicit finite size')\n    heap_bytes = int(heap[1]) * {'': 1, 'k': 1024, 'm': 1024**2,\n                               'g': 1024**3}[heap[2].lower()]\n    require(0 < heap_bytes <= heap_gib * 1024**3,\n            'heap must leave space below the selected hard cap')\n    initial = min(16 * 1024**2, heap_bytes)\n    return [prefix + option for option in (\n        '-XX:-UseContainerSupport', '-XX:ActiveProcessorCount=1',\n        '-XX:+UseSerialGC', '-Xms' + str(initial))]\n\n\ndef JavaCmd(xmx='1G'):"
    count: 1
  - description: Use explicit JVM ergonomics only after verifying the owned displaced-namespace hard cgroup; retain compiler diagnostics and explicit heaps.
    regex:
      re_pattern: '\ \ \ \ ret\ \+=\ \[''\-Xmx''\ \+\ xmx\]\

        '
      replace: "    ret += ['-Xmx' + xmx]\n    ret += ReaperExplicitCgroupJvmFlags(xmx)\n"
    count: 1
