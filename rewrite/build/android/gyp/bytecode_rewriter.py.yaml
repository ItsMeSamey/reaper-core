substitutions:
  - description: Opt in bytecode compiler wrappers to runtime-verified owned-cgroup JVM settings without changing ordinary or initialized JUnit launchers.
    regex:
      re_pattern: 'import\ argparse\

        '
      replace: 'import argparse

        import os

        '
    count: 1
  - description: Opt in bytecode compiler wrappers to runtime-verified owned-cgroup JVM settings without changing ordinary or initialized JUnit launchers.
    regex:
      re_pattern: '\ \ \ \ build_utils\.CheckOutput\(cmd,\ print_stdout=True\)\

        '
      replace: "    if os.environ.get('REAPER_INTERNAL_VERIFIED_HARD_CGROUP'):\n        cmd.insert(1, '--reaper-owned-cgroup-jvm')\n    build_utils.CheckOutput(cmd, print_stdout=True)\n"
    count: 1
