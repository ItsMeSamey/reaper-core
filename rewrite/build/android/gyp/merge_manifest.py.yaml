# Manifest merger preserves raw diagnostics and tolerates only exact JUL parser-pool INFO records.
substitutions:
  - description: "Exact manifest-merger parser-pool INFO handling span 1"
    regex:
      pattern: "import os\n"
      replace: "import os\nimport re\n"
    count: 1
  - description: "Exact manifest-merger parser-pool INFO handling span 2"
    regex:
      pattern: "@contextlib.contextmanager\ndef _ProcessMainManifest("
      replace: "# PositionXmlParser's bounded parser pool emits this JUL INFO record while\n# parsing large manifest closures. Accept only a stream consisting entirely of\n# these exact records; any warning, error, traceback or unfamiliar output still\n# reaches CheckOutput unchanged and remains subject to --warnings-as-errors.\n_POOL_INFO_RE = re.compile(\n    r'(?:(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) '\n    r'(?:[1-9]|[12][0-9]|3[01]), [0-9]{4} '\n    r'(?:[1-9]|1[0-2]):[0-5][0-9]:[0-5][0-9] (?:AM|PM) '\n    r'com\\\\.android\\\\.utils\\\\.PositionXmlParser\\\\$SaxParserPool '\n    r'checkLimitWhenCreate\\\\r?\\\\n'\n    r'INFO: Maximum pool size reached in com\\\\.android\\\\.utils\\\\.PositionXmlParser\\\\r?\\\\n)+'\n)\n\n\ndef _FilterParserPoolInfo(stderr):\n    if _POOL_INFO_RE.fullmatch(stderr):\n        # Keep the original diagnostics visible, including on a nonzero exit\n        # or missing/stale output. Only their failure classification changes.\n        sys.stderr.write(stderr)\n        return ''\n    return stderr\n\n\n@contextlib.contextmanager\ndef _ProcessMainManifest("
    count: 1
  - description: "Exact manifest-merger parser-pool INFO handling span 3"
    regex:
      pattern: "                fail_on_output=args.warnings_as_errors,"
      replace: "                stderr_filter=_FilterParserPoolInfo,\n                fail_on_output=args.warnings_as_errors,"
    count: 1
