substitutions:
  - description: Opt in bytecode compiler wrappers to runtime-verified owned-cgroup JVM settings without changing ordinary or initialized JUnit launchers.
    regex:
      re_pattern: '\ \ \ \ logging\.debug\(''\ ''\.join\(cmd\)\)\

        '
      replace: "    if os.environ.get('REAPER_INTERNAL_VERIFIED_HARD_CGROUP'):\n        cmd.insert(1, '--reaper-owned-cgroup-jvm')\n\n    logging.debug(' '.join(cmd))\n"
    count: 1
