    def testRealLogcatMonitorPreservesBufferAndStillStartsCapture(self):\n        module = local_device_gtest_run.logcat_monitor\n        for preserve in (False, True):\n            with self.subTest(preserve=preserve):\n                adb = mock.Mock(spec=module.adb_wrapper.AdbWrapper)\n                monitor = module.LogcatMonitor(adb, clear=not preserve, check_error=False)\n                monitor._record_file = mock.Mock()\n                with mock.patch.object(monitor, '_StartRecording') as start:\n                    monitor.Start()\n                    start.assert_called_once()\n                    if preserve:\n                        adb.Logcat.assert_not_called()\n                    else:\n                        adb.Logcat.assert_called_once_with(clear=True, check_error=False)\n                monitor.Close()\n\n    def testApkDataRootUsesSameNameAsInstrumentation(self):\n        device = mock.Mock()\n"
