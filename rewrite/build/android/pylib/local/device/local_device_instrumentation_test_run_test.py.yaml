      replace: "            as_root=False,\n        )\n\n    def test_GetTestsFromRunner_launchDisplayPropagatesWithoutChangingListing(self):\n        module = local_device_instrumentation_test_run\n        key = 'org.chromium.base.test.BaseActivityTestRule.LaunchDisplayId'\n        device = mock.MagicMock()\n        device.StartInstrumentation.return_value = ['test-list-output']\n        self._ti.junit4_runner_class = 'org.chromium.base.test.BaseChromiumAndroidJUnitRunner'\n        self._ti.test_package = 'com.example.test'\n        self._ti.webview_process_mode = None\n        self._ti.timeout_scale = 1\n        self._ti.wait_for_java_debugger = False\n        self._ti.has_chromium_test_listener = True\n        expected = [{'class': 'ExampleTest', 'methods': []}]\n        parallel = mock.MagicMock()\n        self._env.parallel_devices.pMap.side_effect = (\n            lambda fn: parallel.configure_mock(**{'pGet.return_value': [fn(device)]})\n            or parallel\n        )\n        with mock.patch.object(self._obj, '_ArchiveLogcat',\n                               return_value=contextlib.nullcontext()), (\n            mock.patch.object(module.crash_handler, 'RetryOnSystemCrash',\n                              side_effect=lambda fn, dev: fn(dev))\n        ), mock.patch.object(module, '_ParseTestListOutputFromChromiumListener',\n                             return_value=expected):\n            for display_extras in ({}, {key: 1560}):\n                with self.subTest(display_extras=display_extras):\n                    self._ti.test_launch_display_extras = display_extras\n                    self.assertEqual(expected, self._obj._GetTestsFromRunner(False))\n                    extras = device.StartInstrumentation.call_args.kwargs['extras']\n                    self.assertEqual('true', extras['log'])\n                    self.assertEqual('net.bytebuddy', extras['notPackage'])\n                    self.assertEqual(1560 if display_extras else None, extras.get(key))\n                    self.assertEqual(0, device.StartInstrumentation.call_args.kwargs['retries'])\n                    self.assertEqual({key: 1560} if display_extras else {}, display_extras)\n\n\ndef create_test(annotation_dict, class_name, method_name):\n    # Helper function to generate test dict\n"
