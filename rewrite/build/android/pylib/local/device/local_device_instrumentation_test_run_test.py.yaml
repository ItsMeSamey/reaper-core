substitutions:
  - description: "Exercise real instrumentation SetUp and DeviceUtils install policy with six platform-mocked regression cases."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ self\\._obj\\ =\\ local_device_instrumentation_test_run\\.LocalDeviceInstrumentationTestRun\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ self\\._env,\\ self\\._ti\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\)\\\n\\\n\\ \\ \\ \\ \\#\\ TODO\\(crbug\\.com/41361955\\):\\ Decide\\ whether\\ the\\ _ShouldRetry\\ hook\\ is\\ worth\\\n\\ \\ \\ \\ \\#\\ retaining\\ and\\ remove\\ these\\ tests\\ if\\ not\\.\\\n"
      replace: "        self._obj = local_device_instrumentation_test_run.LocalDeviceInstrumentationTestRun(\n            self._env, self._ti\n        )\n\n    def _SetUpInstallPolicy(self, skip_clear_data, install_failure=None):\n        module = local_device_instrumentation_test_run\n        self._env.skip_clear_data = skip_clear_data\n        self._env.concurrent_adb = False\n        self._ti.store_data_dependencies_in_temp = False\n        self._ti.replace_system_package = None\n        self._ti.system_packages_to_remove = []\n        self._ti.additional_apexs = []\n        self._ti.test_apk_incremental_install_json = None\n        self._ti.test_apk_as_instant = False\n        self._ti.apk_under_test_incremental_install_json = None\n        self._ti.use_webview_provider = False\n        self._ti.voice_interaction_service = None\n        self._ti.run_setup_commands = []\n        self._ti.store_tombstones = False\n        self._ti.wait_for_java_debugger = False\n        self._ti.modules = self._ti.fake_modules = None\n        self._ti.additional_locales = None\n        self._ti.GetDataDependencies.return_value = []\n        self._ti.IsApkInstant.return_value = False\n        self._ti.IsApkForceQueryable.return_value = False\n        apks = [mock.MagicMock(name=name) for name in\n                ('additional', 'test', 'under_test')]\n        for apk in apks:\n            apk.GetPackageName.return_value = 'com.example.' + apk._mock_name\n            apk.GetPermissions.return_value = ['android.permission.INTERNET']\n        self._ti.additional_apks = [apks[0]]\n        self._ti.test_apk, self._ti.apk_under_test = apks[1:]\n        device = mock.MagicMock()\n        device.GetExternalStoragePath.return_value = '/sdcard'\n        device.IsOnline.return_value = True\n        device.Install.side_effect = install_failure\n        self._install_device = device\n        self._env.parallel_devices.pMap.side_effect = (\n            lambda fn, deps: fn(device, deps))\n\n        def run_install_step(step, dev):\n            # Exercise real SetUp scheduling and its install closure, without\n            # unrelated fixture, role, keyboard, or device setup operations.\n            if step.__name__ == 'install_helper_internal':\n                return step(dev)\n            return None\n\n        with contextlib.ExitStack() as stack:\n            for owner, name, effect in (\n                (module.local_device_environment, 'handle_shard_failures_with',\n                 lambda *_a, **_k: lambda fn: fn),\n                (module.measures, 'timed_func',\n                 lambda *_a, **_k: lambda fn: fn),\n                (module.trace_event, 'traced', lambda fn: fn),\n                (module.instrumentation_tracing, 'no_tracing', lambda fn: fn),\n                (module.crash_handler, 'RetryOnSystemCrash', run_install_step),\n            ):\n                stack.enter_context(mock.patch.object(owner, name,\n                                                       side_effect=effect))\n            stack.enter_context(mock.patch.object(module.tempfile, 'mkdtemp',\n                                                   return_value='/mock/skia'))\n            stack.enter_context(mock.patch.object(\n                module.gold_utils, 'AndroidSkiaGoldSessionManager'))\n            stack.enter_context(mock.patch.object(\n                module.exception_recorder, 'register'))\n            self._obj.SetUp()\n        return device, apks\n\n    def testSetUp_skipClearDataPreservesEveryInstalledApk(self):\n        device, apks = self._SetUpInstallPolicy(True)\n        self.assertEqual(device.Install.call_count, 3)\n        for apk, call in zip(apks, device.Install.call_args_list):\n            self.assertIs(call.args[0], apk)\n            self.assertIs(call.kwargs.get('reinstall', False), True)\n            self.assertIs(call.kwargs['force_queryable'], False)\n        device.Uninstall.assert_not_called()\n        device.ClearApplicationState.assert_not_called()\n\n    def testSetUp_defaultInstallIsolationUnchanged(self):\n        device, apks = self._SetUpInstallPolicy(False)\n        self.assertEqual(device.Install.call_count, len(apks))\n        for call in device.Install.call_args_list:\n            self.assertIs(call.kwargs.get('reinstall', False), False)\n\n    def testSetUp_skipClearDataInstallFailureHasNoFallback(self):\n        failure = local_device_instrumentation_test_run.device_errors.CommandFailedError(\n            'INSTALL_FAILED_UPDATE_INCOMPATIBLE')\n        with self.assertRaises(type(failure)) as raised:\n            self._SetUpInstallPolicy(True, failure)\n        self.assertIs(raised.exception, failure)\n        self._install_device.Install.assert_called_once()\n        self.assertIs(self._install_device.Install.call_args.kwargs['reinstall'],\n                      True)\n        self._install_device.Uninstall.assert_not_called()\n        self._install_device.ClearApplicationState.assert_not_called()\n\n    def _MockDeviceUtilsInstall(self, changed, failure=None):\n        device = mock.MagicMock()\n        device._GetApplicationPathsInternal.return_value = ['/installed/base.apk']\n        host_apk = '/host/test.apk'\n        device._ComputeStaleApks.return_value = (\n            [host_apk] if changed else [], [], {})\n        device._cache = {'package_apk_hashes': {}, 'package_apk_paths': {}}\n        device.IsApplicationInstalled.return_value = True\n        device.adb.Install.side_effect = failure\n        apk = mock.MagicMock()\n        apk.GetPackageName.return_value = 'org.chromium.chrome.tests'\n        return device, apk, host_apk\n\n    def testDeviceUtils_reinstallSignerFailureDoesNotResetPackage(self):\n        module = local_device_instrumentation_test_run\n        failure = module.device_errors.CommandFailedError(\n            'INSTALL_FAILED_UPDATE_INCOMPATIBLE')\n        device, apk, host_apk = self._MockDeviceUtilsInstall(True, failure)\n        with mock.patch.object(module.device_utils.os.path, 'exists',\n                               return_value=True):\n            with self.assertRaises(type(failure)) as raised:\n                module.device_utils.DeviceUtils._InstallInternal(\n                    device, apk, [host_apk], reinstall=True,\n                    permissions=[], streaming=False)\n        self.assertIs(raised.exception, failure)\n        device.adb.Install.assert_called_once()\n        self.assertIs(device.adb.Install.call_args.kwargs['reinstall'], True)\n        device.Uninstall.assert_not_called()\n        device.ClearApplicationState.assert_not_called()\n        device.RunShellCommand.assert_not_called()\n\n    def testDeviceUtils_reinstallIdenticalApkDoesNotClearData(self):\n        module = local_device_instrumentation_test_run\n        device, apk, host_apk = self._MockDeviceUtilsInstall(False)\n        with mock.patch.object(module.device_utils.os.path, 'exists',\n                               return_value=True):\n            module.device_utils.DeviceUtils._InstallInternal(\n                device, apk, [host_apk], reinstall=True,\n                permissions=[], streaming=False)\n        device.adb.Install.assert_not_called()\n        device.Uninstall.assert_not_called()\n        device.ClearApplicationState.assert_not_called()\n        device.ForceStop.assert_called_once_with('org.chromium.chrome.tests')\n\n    def testDeviceUtils_defaultChangedApkIsolationUnchanged(self):\n        module = local_device_instrumentation_test_run\n        device, apk, host_apk = self._MockDeviceUtilsInstall(True)\n        with mock.patch.object(module.device_utils.os.path, 'exists',\n                               return_value=True):\n            module.device_utils.DeviceUtils._InstallInternal(\n                device, apk, [host_apk], reinstall=False,\n                permissions=[], streaming=False)\n        device.Uninstall.assert_called_once_with('org.chromium.chrome.tests')\n        self.assertIs(device.adb.Install.call_args.kwargs['reinstall'], False)\n\n    # TODO(crbug.com/41361955): Decide whether the _ShouldRetry hook is worth\n    # retaining and remove these tests if not.\n"
