substitutions:
  - description: "Unwrap only the exact Reaper collector argument prefix in existing remote handler"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ if\\ args\\[0\\]\\ ==\\ \"/bin/sh\":\\\n\\ \\ \\ \\ \\ \\ \\ \\ args\\ =\\ args\\[2\\]\\.split\\(\"\\ \"\\)\\\n\\ \\ \\ \\ for\\ i,\\ arg\\ in\\ enumerate\\(args\\):\\\n"
      replace: "    if args[0] == \"/bin/sh\":\n        args = args[2].split(\" \")\n    reaper_link_wrapper = (len(args) > 4 and args[1] == \"-I\" and args[2] == \"-B\" and args[3].endswith(\"/brave/build/android/reaper_link_provenance.py\"))\n    if reaper_link_wrapper:\n        args = args[args.index(\"--\") + 1:]\n    for i, arg in enumerate(args):\n"
  - description: "Retain original argument indexing except in collector branch"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ clang_base\\ =\\ ctx\\.fs\\.canonpath\\(path\\.dir\\(path\\.dir\\(cmd\\.args\\[i\\ \\+\\ 1\\]\\)\\)\\)\\\n"
      replace: "            link_args = args if reaper_link_wrapper else cmd.args\n            clang_base = ctx.fs.canonpath(path.dir(path.dir(link_args[i + 1])))\n"
  - description: "Bind actual collector and unchanged wrapper dependencies in Unix input_deps"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ return\\ clang_all\\.input_deps\\(ctx\\)\\\n"
      replace: "    inputs = clang_all.input_deps(ctx)\n    inputs.update({\n        \"brave/build/android/reaper_link_provenance.py\": [\n            \"build/toolchain/gcc_solink_wrapper.py\",\n            \"build/toolchain/gcc_link_wrapper.py\",\n            \"build/toolchain/whole_archive.py\",\n            \"build/toolchain/wrapper_utils.py\",\n        ],\n        \"brave/build/android/reaper_link_provenance.py:link\": [\n            \"brave/build/android/reaper_link_provenance.py\",\n            \"build/toolchain/gcc_solink_wrapper.py\",\n            \"build/toolchain/gcc_link_wrapper.py\",\n            \"build/toolchain/whole_archive.py\",\n            \"build/toolchain/wrapper_utils.py\",\n        ],\n    })\n    return inputs\n"
