substitutions:
- description: Import the toolchain-scoped Android desktop variant flag.
  regex:
    pattern: import("//build/config/cast.gni")
    replace: 'import("//build/config/cast.gni")

      import("//build/config/chrome_build.gni")'
- description: Enable curated FreeType by default only for the Android desktop variant.
  regex:
    pattern: '  enable_freetype = !is_android && !is_ios && !is_castos && !is_fuchsia'
    replace: "  # Android extension printer providers reuse PDFium without enabling the\n  # browser PDF viewer. Keep Chromium's curated FreeType and Skia font backend.\n  # chrome_build.gni clears is_desktop_android in non-Android toolchains.\n  enable_freetype =\n      (!is_android && !is_ios && !is_castos && !is_fuchsia) || is_desktop_android"
