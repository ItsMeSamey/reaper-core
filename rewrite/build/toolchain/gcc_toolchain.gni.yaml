substitutions:
  - description: "declare opt-in"
    count: 1
    regex:
      re_pattern: "declare_args\\(\\)\\ \\{\\\n"
      replace: "declare_args() {\n  # Reaper-only opt-in; other Android and host builds preserve existing commands.\n  reaper_emit_link_provenance = false\n\n"
  - description: "solink opt-in wrapper"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ command\\ \\+=\\ \"\\-\\-\\ \\$link_command\\ \\$solink_extra_flags\"\\\n"
      replace: "      command += \"-- $link_command $solink_extra_flags\"\n\n      if (current_os == \"android\" && reaper_emit_link_provenance) {\n        assert(enable_linker_map, \"Reaper link provenance requires linker maps\")\n        reaper_link_receipt = \"$sofile_with_symbols.link-provenance.json\"\n        reaper_link_collector = rebase_path(\n                \"//brave/build/android/reaper_link_provenance.py\",\n                root_build_dir)\n        reaper_source_root = rebase_path(\"//\", root_build_dir)\n        command = \"\\\\\"$python_path\\\\\" -I -B \\\\\"$reaper_link_collector\\\\\" --source-root=\\\\\"$reaper_source_root\\\\\" --receipt=\\\\\"$reaper_link_receipt\\\\\" --output=\\\\\"$sofile\\\\\" --unstripped=\\\\\"$sofile_with_symbols\\\\\" --map=\\\\\"$map_file\\\\\" -- \" + command\n      }\n"
  - description: "solink_module opt-in wrapper"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ command\\ =\\ \"\\\\\"\\$python_path\\\\\"\\ \\\\\"\\$link_wrapper\\\\\"\\ \\-\\-output=\\\\\"\\$sofile\\\\\"\\$strip_switch\\$map_switch\\ \\-\\-\\ \\$link_command\"\\\n"
      replace: "      command = \"\\\\\"$python_path\\\\\" \\\\\"$link_wrapper\\\\\" --output=\\\\\"$sofile\\\\\"$strip_switch$map_switch -- $link_command\"\n\n      if (current_os == \"android\" && reaper_emit_link_provenance) {\n        assert(enable_linker_map, \"Reaper link provenance requires linker maps\")\n        reaper_link_receipt = \"$sofile_with_symbols.link-provenance.json\"\n        reaper_link_collector = rebase_path(\n                \"//brave/build/android/reaper_link_provenance.py\",\n                root_build_dir)\n        reaper_source_root = rebase_path(\"//\", root_build_dir)\n        command = \"\\\\\"$python_path\\\\\" -I -B \\\\\"$reaper_link_collector\\\\\" --source-root=\\\\\"$reaper_source_root\\\\\" --receipt=\\\\\"$reaper_link_receipt\\\\\" --output=\\\\\"$sofile\\\\\" --unstripped=\\\\\"$sofile_with_symbols\\\\\" --map=\\\\\"$map_file\\\\\" -- \" + command\n      }\n"
  - description: "solink declare receipt"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ tool\\(\"solink\"\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ soname\\ =\\ \"\\{\\{target_output_name\\}\\}\\{\\{output_extension\\}\\}\"\\ \\ \\#\\ e\\.g\\.\\ \"libfoo\\.so\"\\.\\\n\\ \\ \\ \\ \\ \\ sofile\\ =\\ \"\\{\\{output_dir\\}\\}/\\$soname\"\\ \\ \\#\\ Possibly\\ including\\ toolchain\\ dir\\.\\\n\\ \\ \\ \\ \\ \\ rspfile\\ =\\ sofile\\ \\+\\ \"\\.rsp\"\\\n\\\n\\ \\ \\ \\ \\ \\ pool\\ =\\ \"//build/toolchain:link_pool\\(\\$default_toolchain\\)\"\\\n\\\n\\ \\ \\ \\ \\ \\ if\\ \\(defined\\(invoker\\.strip\\)\\ \\|\\|\\ use_mold_separate_debug_file\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ sofile_with_symbols\\ =\\ \"\\{\\{root_out_dir\\}\\}/lib\\.unstripped/\\$soname\"\\\n\\ \\ \\ \\ \\ \\ \\}\\ else\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ sofile_with_symbols\\ =\\ sofile\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ \\#\\ These\\ variables\\ are\\ not\\ built\\ into\\ GN\\ but\\ are\\ helpers\\ that\\\n\\ \\ \\ \\ \\ \\ \\#\\ implement\\ \\(1\\)\\ linking\\ to\\ produce\\ a\\ \\.so,\\ \\(2\\)\\ extracting\\ the\\ symbols\\\n\\ \\ \\ \\ \\ \\ \\#\\ from\\ that\\ file\\ \\(3\\)\\ if\\ the\\ extracted\\ list\\ differs\\ from\\ the\\ existing\\\n\\ \\ \\ \\ \\ \\ \\#\\ \\.TOC\\ file,\\ overwrite\\ it,\\ otherwise,\\ don't\\ change\\ it\\.\\\n\\ \\ \\ \\ \\ \\ tocfile\\ =\\ sofile\\ \\+\\ \"\\.TOC\"\\\n\\\n\\ \\ \\ \\ \\ \\ soname_flag\\ =\\ \"\"\\\n\\ \\ \\ \\ \\ \\ if\\ \\(current_os\\ !=\\ \"aix\"\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\#\\ \\-soname\\ flag\\ is\\ not\\ available\\ on\\ aix\\ ld\\\n\\ \\ \\ \\ \\ \\ \\ \\ soname_flag\\ =\\ \"\\-Wl,\\-soname=\\\\\"\\$soname\\\\\"\"\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ if\\ \\(use_mold_separate_debug_file\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ main_so_file\\ =\\ sofile\\\n\\ \\ \\ \\ \\ \\ \\}\\ else\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ main_so_file\\ =\\ sofile_with_symbols\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ link_command\\ =\\ \"\\$ld\\ \\-shared\\ \\$soname_flag\\ \\{\\{ldflags\\}\\}\\$\\{extra_ldflags\\}\\ \\-o\\ \\\\\"\\$main_so_file\\\\\"\\ \"\\\n\\\n\\ \\ \\ \\ \\ \\ if\\ \\(use_mold_separate_debug_file\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\#\\ TODO\\(40208899\\):\\ See\\ if\\ it\\ adding\\ \\-\\-detach\\ for\\ local\\ builds\\ helps\\.\\\n\\ \\ \\ \\ \\ \\ \\ \\ link_command\\ \\+=\\ \"\\\\\"\\-Wl,\\-\\-separate\\-debug\\-file=\\$sofile_with_symbols\\\\\"\\ \\-Wl,\\-\\-no\\-detach\\ \"\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ link_command\\ \\+=\\ \"@\\\\\"\\$rspfile\\\\\"\\ \\{\\{rlibs\\}\\}\"\\\n\\\n\\ \\ \\ \\ \\ \\ \\#\\ Generate\\ a\\ map\\ file\\ to\\ be\\ used\\ for\\ binary\\ size\\ analysis\\.\\\n\\ \\ \\ \\ \\ \\ \\#\\ Map\\ file\\ adds\\ \\~10%\\ to\\ the\\ link\\ time\\ on\\ a\\ z620\\.\\\n\\ \\ \\ \\ \\ \\ \\#\\ With\\ target_os=\"android\",\\ libchrome\\.so\\.map\\.gz\\ is\\ \\~20MB\\.\\\n\\ \\ \\ \\ \\ \\ map_switch\\ =\\ \"\"\\\n\\ \\ \\ \\ \\ \\ if\\ \\(enable_linker_map\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ map_file\\ =\\ \"\\$sofile_with_symbols\\.map\\.gz\"\\\n\\ \\ \\ \\ \\ \\ \\ \\ map_switch\\ =\\ \"\\ \\-\\-map\\-file\\ \\\\\"\\$map_file\\\\\"\"\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ assert\\(defined\\(readelf\\),\\ \"to\\ solink\\ you\\ must\\ have\\ a\\ readelf\"\\)\\\n\\ \\ \\ \\ \\ \\ assert\\(defined\\(nm\\),\\ \"to\\ solink\\ you\\ must\\ have\\ an\\ nm\"\\)\\\n\\ \\ \\ \\ \\ \\ strip_switch\\ =\\ \"\"\\\n\\ \\ \\ \\ \\ \\ if\\ \\(defined\\(invoker\\.strip\\)\\ \\&\\&\\ !use_mold_separate_debug_file\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ strip_switch\\ =\\ \"\\-\\-strip=\\$\\{invoker\\.strip\\}\\ \"\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ \\#\\ This\\ needs\\ a\\ Python\\ script\\ to\\ avoid\\ using\\ a\\ complex\\ shell\\ command\\\n\\ \\ \\ \\ \\ \\ \\#\\ requiring\\ sh\\ control\\ structures,\\ pipelines,\\ and\\ POSIX\\ utilities\\.\\\n\\ \\ \\ \\ \\ \\ \\#\\ The\\ host\\ might\\ not\\ have\\ a\\ POSIX\\ shell\\ and\\ utilities\\ \\(e\\.g\\.\\ Windows\\)\\.\\\n\\ \\ \\ \\ \\ \\ solink_wrapper\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ rebase_path\\(\"//build/toolchain/gcc_solink_wrapper\\.py\",\\ root_build_dir\\)\\\n\\ \\ \\ \\ \\ \\ solink_extra_flags\\ =\\ \"\"\\\n\\ \\ \\ \\ \\ \\ if\\ \\(current_os\\ ==\\ \"aix\"\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\#\\ to\\ be\\ intercepted\\ by\\ solink_wrapper,\\ so\\ that\\ we\\ exit\\ immediately\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\#\\ after\\ linking\\ the\\ shared\\ object,\\ without\\ generating\\ the\\ TOC\\ file\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\#\\ \\(skipped\\ on\\ Aix\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ solink_extra_flags\\ =\\ \"\\-\\-partitioned\\-library\"\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ command\\ =\\ \"\\\\\"\\$python_path\\\\\"\\ \\\\\"\\$solink_wrapper\\\\\"\\ \\-\\-readelf=\\\\\"\\$readelf\\\\\"\\ \\-\\-nm=\\\\\"\\$nm\\\\\"\\ \\$strip_switch\\ \\-\\-tocfile=\\\\\"\\$tocfile\\\\\"\\$map_switch\\ \\-\\-output=\\\\\"\\$sofile\\\\\"\\ \"\\\n\\ \\ \\ \\ \\ \\ if\\ \\(sofile_with_symbols\\ !=\\ sofile\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ command\\ \\+=\\ \"\\-\\-symbols\\-file=\\\\\"\\$sofile_with_symbols\\\\\"\\ \"\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ command\\ \\+=\\ \"\\-\\-\\ \\$link_command\\ \\$solink_extra_flags\"\\\n\\\n\\ \\ \\ \\ \\ \\ if\\ \\(current_os\\ ==\\ \"android\"\\ \\&\\&\\ reaper_emit_link_provenance\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ assert\\(enable_linker_map,\\ \"Reaper\\ link\\ provenance\\ requires\\ linker\\ maps\"\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ reaper_link_receipt\\ =\\ \"\\$sofile_with_symbols\\.link\\-provenance\\.json\"\\\n\\ \\ \\ \\ \\ \\ \\ \\ reaper_link_collector\\ =\\ rebase_path\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \"//brave/build/android/reaper_link_provenance\\.py\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ root_build_dir\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ reaper_source_root\\ =\\ rebase_path\\(\"//\",\\ root_build_dir\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ command\\ =\\ \"\\\\\"\\$python_path\\\\\"\\ \\-I\\ \\-B\\ \\\\\"\\$reaper_link_collector\\\\\"\\ \\-\\-source\\-root=\\\\\"\\$reaper_source_root\\\\\"\\ \\-\\-receipt=\\\\\"\\$reaper_link_receipt\\\\\"\\ \\-\\-output=\\\\\"\\$sofile\\\\\"\\ \\-\\-unstripped=\\\\\"\\$sofile_with_symbols\\\\\"\\ \\-\\-map=\\\\\"\\$map_file\\\\\"\\ \\-\\-\\ \"\\ \\+\\ command\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ if\\ \\(target_cpu\\ ==\\ \"mipsel\"\\ \\&\\&\\ is_component_build\\ \\&\\&\\ is_android\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ rspfile_content\\ =\\ \"\\-Wl,\\-\\-start\\-group\\ \\-Wl,\\-\\-whole\\-archive\\ \\{\\{inputs\\}\\}\\ \\{\\{solibs\\}\\}\\ \\-Wl,\\-\\-no\\-whole\\-archive\\ \\{\\{libs\\}\\}\\ \\-Wl,\\-\\-end\\-group\"\\\n\\ \\ \\ \\ \\ \\ \\}\\ else\\ if\\ \\(current_os\\ ==\\ \"aix\"\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\#\\ \\-\\-whole\\-archive,\\ \\-\\-no\\-whole\\-archive\\ flags\\ are\\ not\\ available\\ on\\ the\\ aix\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\#\\ ld\\.\\\n\\ \\ \\ \\ \\ \\ \\ \\ rspfile_content\\ =\\ \"\\{\\{inputs\\}\\}\\ \\{\\{solibs\\}\\}\\ \\{\\{libs\\}\\}\"\\\n\\ \\ \\ \\ \\ \\ \\}\\ else\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ rspfile_content\\ =\\ \"\\-Wl,\\-\\-whole\\-archive\\ \\{\\{inputs\\}\\}\\ \\{\\{solibs\\}\\}\\ \\-Wl,\\-\\-no\\-whole\\-archive\\ \\{\\{libs\\}\\}\"\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ description\\ =\\ \"SOLINK\\ \\$sofile\"\\\n\\\n\\ \\ \\ \\ \\ \\ \\#\\ Use\\ this\\ for\\ \\{\\{output_extension\\}\\}\\ expansions\\ unless\\ a\\ target\\ manually\\\n\\ \\ \\ \\ \\ \\ \\#\\ overrides\\ it\\ \\(in\\ which\\ case\\ \\{\\{output_extension\\}\\}\\ will\\ be\\ what\\ the\\ target\\\n\\ \\ \\ \\ \\ \\ \\#\\ specifies\\)\\.\\\n\\ \\ \\ \\ \\ \\ default_output_extension\\ =\\ default_shlib_extension\\\n\\\n\\ \\ \\ \\ \\ \\ default_output_dir\\ =\\ \"\\{\\{root_out_dir\\}\\}\\$\\{default_shlib_subdir\\}\"\\\n\\\n\\ \\ \\ \\ \\ \\ output_prefix\\ =\\ \"lib\"\\\n\\\n\\ \\ \\ \\ \\ \\ \\#\\ Since\\ the\\ above\\ commands\\ only\\ updates\\ the\\ \\.TOC\\ file\\ when\\ it\\ changes,\\ ask\\\n\\ \\ \\ \\ \\ \\ \\#\\ Ninja\\ to\\ check\\ if\\ the\\ timestamp\\ actually\\ changed\\ to\\ know\\ if\\ downstream\\\n\\ \\ \\ \\ \\ \\ \\#\\ dependencies\\ should\\ be\\ recompiled\\.\\\n\\ \\ \\ \\ \\ \\ restat\\ =\\ true\\\n\\\n\\ \\ \\ \\ \\ \\ \\#\\ Tell\\ GN\\ about\\ the\\ output\\ files\\.\\ It\\ will\\ link\\ to\\ the\\ sofile\\ but\\ use\\ the\\\n\\ \\ \\ \\ \\ \\ \\#\\ tocfile\\ for\\ dependency\\ management\\.\\\n\\ \\ \\ \\ \\ \\ outputs\\ =\\ \\[\\\n\\ \\ \\ \\ \\ \\ \\ \\ sofile,\\\n\\ \\ \\ \\ \\ \\ \\ \\ tocfile,\\\n\\ \\ \\ \\ \\ \\ \\]\\\n\\ \\ \\ \\ \\ \\ if\\ \\(sofile\\ !=\\ sofile_with_symbols\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ outputs\\ \\+=\\ \\[\\ sofile_with_symbols\\ \\]\\\n\\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(defined\\(invoker\\.use_unstripped_as_runtime_outputs\\)\\ \\&\\&\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ invoker\\.use_unstripped_as_runtime_outputs\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ runtime_outputs\\ =\\ \\[\\ sofile_with_symbols\\ \\]\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ if\\ \\(defined\\(map_file\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ outputs\\ \\+=\\ \\[\\ map_file\\ \\]\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ link_output\\ =\\ sofile\\\n\\ \\ \\ \\ \\ \\ depend_output\\ =\\ tocfile\\\n\\ \\ \\ \\ \\}\\\n"
      replace: "    tool(\"solink\") {\n      soname = \"{{target_output_name}}{{output_extension}}\"  # e.g. \"libfoo.so\".\n      sofile = \"{{output_dir}}/$soname\"  # Possibly including toolchain dir.\n      rspfile = sofile + \".rsp\"\n\n      pool = \"//build/toolchain:link_pool($default_toolchain)\"\n\n      if (defined(invoker.strip) || use_mold_separate_debug_file) {\n        sofile_with_symbols = \"{{root_out_dir}}/lib.unstripped/$soname\"\n      } else {\n        sofile_with_symbols = sofile\n      }\n\n      # These variables are not built into GN but are helpers that\n      # implement (1) linking to produce a .so, (2) extracting the symbols\n      # from that file (3) if the extracted list differs from the existing\n      # .TOC file, overwrite it, otherwise, don't change it.\n      tocfile = sofile + \".TOC\"\n\n      soname_flag = \"\"\n      if (current_os != \"aix\") {\n        # -soname flag is not available on aix ld\n        soname_flag = \"-Wl,-soname=\\\\\"$soname\\\\\"\"\n      }\n      if (use_mold_separate_debug_file) {\n        main_so_file = sofile\n      } else {\n        main_so_file = sofile_with_symbols\n      }\n      link_command = \"$ld -shared $soname_flag {{ldflags}}${extra_ldflags} -o \\\\\"$main_so_file\\\\\" \"\n\n      if (use_mold_separate_debug_file) {\n        # TODO(40208899): See if it adding --detach for local builds helps.\n        link_command += \"\\\\\"-Wl,--separate-debug-file=$sofile_with_symbols\\\\\" -Wl,--no-detach \"\n      }\n      link_command += \"@\\\\\"$rspfile\\\\\" {{rlibs}}\"\n\n      # Generate a map file to be used for binary size analysis.\n      # Map file adds ~10% to the link time on a z620.\n      # With target_os=\"android\", libchrome.so.map.gz is ~20MB.\n      map_switch = \"\"\n      if (enable_linker_map) {\n        map_file = \"$sofile_with_symbols.map.gz\"\n        map_switch = \" --map-file \\\\\"$map_file\\\\\"\"\n      }\n\n      assert(defined(readelf), \"to solink you must have a readelf\")\n      assert(defined(nm), \"to solink you must have an nm\")\n      strip_switch = \"\"\n      if (defined(invoker.strip) && !use_mold_separate_debug_file) {\n        strip_switch = \"--strip=${invoker.strip} \"\n      }\n\n      # This needs a Python script to avoid using a complex shell command\n      # requiring sh control structures, pipelines, and POSIX utilities.\n      # The host might not have a POSIX shell and utilities (e.g. Windows).\n      solink_wrapper =\n          rebase_path(\"//build/toolchain/gcc_solink_wrapper.py\", root_build_dir)\n      solink_extra_flags = \"\"\n      if (current_os == \"aix\") {\n        # to be intercepted by solink_wrapper, so that we exit immediately\n        # after linking the shared object, without generating the TOC file\n        # (skipped on Aix)\n        solink_extra_flags = \"--partitioned-library\"\n      }\n      command = \"\\\\\"$python_path\\\\\" \\\\\"$solink_wrapper\\\\\" --readelf=\\\\\"$readelf\\\\\" --nm=\\\\\"$nm\\\\\" $strip_switch --tocfile=\\\\\"$tocfile\\\\\"$map_switch --output=\\\\\"$sofile\\\\\" \"\n      if (sofile_with_symbols != sofile) {\n        command += \"--symbols-file=\\\\\"$sofile_with_symbols\\\\\" \"\n      }\n      command += \"-- $link_command $solink_extra_flags\"\n\n      if (current_os == \"android\" && reaper_emit_link_provenance) {\n        assert(enable_linker_map, \"Reaper link provenance requires linker maps\")\n        reaper_link_receipt = \"$sofile_with_symbols.link-provenance.json\"\n        reaper_link_collector = rebase_path(\n                \"//brave/build/android/reaper_link_provenance.py\",\n                root_build_dir)\n        reaper_source_root = rebase_path(\"//\", root_build_dir)\n        command = \"\\\\\"$python_path\\\\\" -I -B \\\\\"$reaper_link_collector\\\\\" --source-root=\\\\\"$reaper_source_root\\\\\" --receipt=\\\\\"$reaper_link_receipt\\\\\" --output=\\\\\"$sofile\\\\\" --unstripped=\\\\\"$sofile_with_symbols\\\\\" --map=\\\\\"$map_file\\\\\" -- \" + command\n      }\n\n      if (target_cpu == \"mipsel\" && is_component_build && is_android) {\n        rspfile_content = \"-Wl,--start-group -Wl,--whole-archive {{inputs}} {{solibs}} -Wl,--no-whole-archive {{libs}} -Wl,--end-group\"\n      } else if (current_os == \"aix\") {\n        # --whole-archive, --no-whole-archive flags are not available on the aix\n        # ld.\n        rspfile_content = \"{{inputs}} {{solibs}} {{libs}}\"\n      } else {\n        rspfile_content = \"-Wl,--whole-archive {{inputs}} {{solibs}} -Wl,--no-whole-archive {{libs}}\"\n      }\n\n      description = \"SOLINK $sofile\"\n\n      # Use this for {{output_extension}} expansions unless a target manually\n      # overrides it (in which case {{output_extension}} will be what the target\n      # specifies).\n      default_output_extension = default_shlib_extension\n\n      default_output_dir = \"{{root_out_dir}}${default_shlib_subdir}\"\n\n      output_prefix = \"lib\"\n\n      # Since the above commands only updates the .TOC file when it changes, ask\n      # Ninja to check if the timestamp actually changed to know if downstream\n      # dependencies should be recompiled.\n      restat = true\n\n      # Tell GN about the output files. It will link to the sofile but use the\n      # tocfile for dependency management.\n      outputs = [\n        sofile,\n        tocfile,\n      ]\n      if (sofile != sofile_with_symbols) {\n        outputs += [ sofile_with_symbols ]\n        if (defined(invoker.use_unstripped_as_runtime_outputs) &&\n            invoker.use_unstripped_as_runtime_outputs) {\n          runtime_outputs = [ sofile_with_symbols ]\n        }\n      }\n\n      if (defined(map_file)) {\n        outputs += [ map_file ]\n      }\n      if (defined(reaper_link_receipt)) {\n        outputs += [ reaper_link_receipt ]\n      }\n      link_output = sofile\n      depend_output = tocfile\n    }\n"
