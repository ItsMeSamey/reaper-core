      replace: "    tool(\"solink\") {\n      soname = \"{{target_output_name}}{{output_extension}}\"  # e.g. \"libfoo.so\".\n      sofile = \"{{output_dir}}/$soname\"  # Possibly including toolchain dir.\n      rspfile = sofile + \".rsp\"\n\n      pool = \"//build/toolchain:link_pool($default_toolchain)\"\n\n      if (defined(invoker.strip) || use_mold_separate_debug_file) {\n        sofile_with_symbols = \"{{root_out_dir}}/lib.unstripped/$soname\"\n      } else {\n        sofile_with_symbols = sofile\n      }\n\n      # These variables are not built into GN but are helpers that\n      # implement (1) linking to produce a .so, (2) extracting the symbols\n      # from that file (3) if the extracted list differs from the existing\n      # .TOC file, overwrite it, otherwise, don't change it.\n      tocfile = sofile + \".TOC\"\n\n      soname_flag = \"\"\n      if (current_os != \"aix\") {\n        # -soname flag is not available on aix ld\n        soname_flag = \"-Wl,-soname=\\\\\"$soname\\\\\"\"\n      }\n      if (use_mold_separate_debug_file) {\n        main_so_file = sofile\n      } else {\n        main_so_file = sofile_with_symbols\n      }\n      link_command = \"$ld -shared $soname_flag {{ldflags}}${extra_ldflags} -o \\\\\"$main_so_file\\\\\" \"\n\n      if (use_mold_separate_debug_file) {\n        # TODO(40208899): See if it adding --detach for local builds helps.\n        link_command += \"\\\\\"-Wl,--separate-debug-file=$sofile_with_symbols\\\\\" -Wl,--no-detach \"\n      }\n      link_command += \"@\\\\\"$rspfile\\\\\" {{rlibs}}\"\n\n      # Generate a map file to be used for binary size analysis.\n      # Map file adds ~10% to the link time on a z620.\n      # With target_os=\"android\", libchrome.so.map.gz is ~20MB.\n      map_switch = \"\"\n      if (enable_linker_map) {\n        map_file = \"$sofile_with_symbols.map.gz\"\n        map_switch = \" --map-file \\\\\"$map_file\\\\\"\"\n      }\n\n      assert(defined(readelf), \"to solink you must have a readelf\")\n      assert(defined(nm), \"to solink you must have an nm\")\n      strip_switch = \"\"\n      if (defined(invoker.strip) && !use_mold_separate_debug_file) {\n        strip_switch = \"--strip=${invoker.strip} \"\n      }\n\n      # This needs a Python script to avoid using a complex shell command\n      # requiring sh control structures, pipelines, and POSIX utilities.\n      # The host might not have a POSIX shell and utilities (e.g. Windows).\n      solink_wrapper =\n          rebase_path(\"//build/toolchain/gcc_solink_wrapper.py\", root_build_dir)\n      solink_extra_flags = \"\"\n      if (current_os == \"aix\") {\n        # to be intercepted by solink_wrapper, so that we exit immediately\n        # after linking the shared object, without generating the TOC file\n        # (skipped on Aix)\n        solink_extra_flags = \"--partitioned-library\"\n      }\n      command = \"\\\\\"$python_path\\\\\" \\\\\"$solink_wrapper\\\\\" --readelf=\\\\\"$readelf\\\\\" --nm=\\\\\"$nm\\\\\" $strip_switch --tocfile=\\\\\"$tocfile\\\\\"$map_switch --output=\\\\\"$sofile\\\\\" \"\n      if (sofile_with_symbols != sofile) {\n        command += \"--symbols-file=\\\\\"$sofile_with_symbols\\\\\" \"\n      }\n      command += \"-- $link_command $solink_extra_flags\"\n\n      if (current_os == \"android\" && reaper_emit_link_provenance) {\n        assert(enable_linker_map, \"Reaper link provenance requires linker maps\")\n        inputs = [ \"//brave/build/android/reaper_link_provenance.py\" ]\n"
