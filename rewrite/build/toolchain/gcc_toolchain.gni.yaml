      replace: "    tool(\"solink_module\") {\n      soname = \"{{target_output_name}}{{output_extension}}\"  # e.g. \"libfoo.so\".\n      sofile = \"{{output_dir}}/$soname\"\n      rspfile = sofile + \".rsp\"\n\n      pool = \"//build/toolchain:link_pool($default_toolchain)\"\n\n      if (defined(invoker.strip) || use_mold_separate_debug_file) {\n        sofile_with_symbols = \"{{root_out_dir}}/lib.unstripped/$soname\"\n      } else {\n        sofile_with_symbols = sofile\n      }\n\n      soname_flag = \"\"\n      whole_archive_flag = \"\"\n      no_whole_archive_flag = \"\"\n      if (current_os != \"aix\") {\n        # -soname, --whole-archive, --no-whole-archive flags are not available\n        # on aix ld\n        soname_flag = \"-Wl,-soname=\\\\\"$soname\\\\\"\"\n        whole_archive_flag = \"-Wl,--whole-archive\"\n        no_whole_archive_flag = \"-Wl,--no-whole-archive\"\n      }\n\n      if (use_mold_separate_debug_file) {\n        main_so_file = sofile\n      } else {\n        main_so_file = sofile_with_symbols\n      }\n      link_command = \"$ld -shared $soname_flag {{ldflags}}${extra_ldflags} -o \\\\\"$main_so_file\\\\\" \"\n\n      if (use_mold_separate_debug_file) {\n        # TODO(40208899): See if it adding --detach for local builds helps.\n        link_command += \"\\\\\"-Wl,--separate-debug-file=$sofile_with_symbols\\\\\" -Wl,--no-detach \"\n      }\n      link_command += \"@\\\\\"$rspfile\\\\\" {{rlibs}}\"\n\n      # Generate a map file to be used for binary size analysis.\n      # Map file adds ~10% to the link time on a z620.\n      # With target_os=\"android\", libchrome.so.map.gz is ~20MB.\n      map_switch = \"\"\n      if (enable_linker_map) {\n        map_file = \"$sofile_with_symbols.map.gz\"\n        map_switch = \" --map-file \\\\\"$map_file\\\\\"\"\n      }\n\n      strip_switch = \"\"\n      if (defined(invoker.strip) && !use_mold_separate_debug_file) {\n        strip_switch = \" --strip=\\\\\"${invoker.strip}\\\\\" --symbols-file=\\\\\"$sofile_with_symbols\\\\\"\"\n      }\n\n      link_wrapper =\n          rebase_path(\"//build/toolchain/gcc_link_wrapper.py\", root_build_dir)\n      command = \"\\\\\"$python_path\\\\\" \\\\\"$link_wrapper\\\\\" --output=\\\\\"$sofile\\\\\"$strip_switch$map_switch -- $link_command\"\n\n      if (current_os == \"android\" && reaper_emit_link_provenance) {\n        assert(enable_linker_map, \"Reaper link provenance requires linker maps\")\n        reaper_link_receipt = \"$sofile_with_symbols.link-provenance.json\"\n        reaper_link_collector = rebase_path(\n                \"//brave/build/android/reaper_link_provenance.py\",\n                root_build_dir)\n        reaper_source_root = rebase_path(\"//\", root_build_dir)\n        command = \"\\\\\"$python_path\\\\\" -I -B \\\\\"$reaper_link_collector\\\\\" --source-root=\\\\\"$reaper_source_root\\\\\" --receipt=\\\\\"$reaper_link_receipt\\\\\" --output=\\\\\"$sofile\\\\\" --unstripped=\\\\\"$sofile_with_symbols\\\\\" --map=\\\\\"$map_file\\\\\" -- \" + command\n      }\n      rspfile_content = \"$whole_archive_flag {{inputs}} {{solibs}} $no_whole_archive_flag {{libs}} {{rlibs}}\"\n\n      description = \"SOLINK_MODULE $sofile\"\n\n      # Use this for {{output_extension}} expansions unless a target manually\n      # overrides it (in which case {{output_extension}} will be what the target\n      # specifies).\n      if (defined(invoker.loadable_module_extension)) {\n        default_output_extension = invoker.loadable_module_extension\n      } else {\n        default_output_extension = default_shlib_extension\n      }\n\n      default_output_dir = \"{{root_out_dir}}${default_shlib_subdir}\"\n\n      output_prefix = \"lib\"\n\n      outputs = [ sofile ]\n      if (sofile != sofile_with_symbols) {\n        outputs += [ sofile_with_symbols ]\n        if (defined(invoker.use_unstripped_as_runtime_outputs) &&\n            invoker.use_unstripped_as_runtime_outputs) {\n          runtime_outputs = [ sofile_with_symbols ]\n        }\n      }\n      if (defined(map_file)) {\n        outputs += [ map_file ]\n      }\n      if (defined(reaper_link_receipt)) {\n        outputs += [ reaper_link_receipt ]\n      }\n    }\n"
