substitutions:
  - description: Declare Android product-branding modules as GRIT action inputs.
    regex:
      re_pattern: "\\ \\ \\ \\ inputs\\ =\\ \\[\\ invoker\\.source\\ \\]\\\n"
      replace: "    inputs = [ invoker.source ]\n    if (is_android) {\n      inputs += [\n        \"//brave/script/reaper_android_branding.py\",\n        \"//brave/chromium_src/tools/grit/grit/node/message.py\",\n        \"//tools/grit/grit/node/message.py\",\n      ]\n    }\n"
    count: 1
