substitutions:
  - description: Load the normal Brave override after the upstream message definitions.
    regex:
      re_pattern: "\\Z"
      replace: "\nfrom brave_chromium_utils import inline_chromium_src_override; inline_chromium_src_override(globals(), locals())\n"
    count: 1
