substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: 'def\ ReadDataPackFromString\(data\):\

      \ \ """Reads\ a\ data\ pack\ file\ and\ returns\ a\ dictionary\."""\

      \ \ \#\ Read\ the\ header\.\

      \ \ version\ =\ struct\.unpack\(''<I'',\ data\[:4\]\)\[0\]\

      \ \ if\ version\ ==\ 4:\

      \ \ \ \ resource_count,\ encoding\ =\ struct\.unpack\(''<IB'',\ data\[4:9\]\)\

      \ \ \ \ alias_count\ =\ 0\

      \ \ \ \ header_size\ =\ 9\

      \ \ elif\ version\ ==\ 5:\

      \ \ \ \ encoding,\ resource_count,\ alias_count\ =\ struct\.unpack\(''<BxxxHH'',\ data\[4:12\]\)\

      \ \ \ \ header_size\ =\ 12\

      \ \ else:\

      '
    replace: "def ReadDataPackFromString(data):\n  \"\"\"Reads a data pack file and returns a dictionary.\"\"\"\n  # Read the header.\n  if len(data) < 4:\n    raise CorruptDataPack('Incomplete file header')\n  version = struct.unpack('<I', data[:4])[0]\n  if version == 4:\n    if len(data) < 9:\n      raise CorruptDataPack('Incomplete v4 file header')\n    resource_count, encoding = struct.unpack('<IB', data[4:9])\n    alias_count = 0\n    header_size = 9\n  elif version == 5:\n    if len(data) < 12:\n      raise CorruptDataPack('Incomplete v5 file header')\n    encoding, resource_count, alias_count = struct.unpack('<BxxxHH', data[4:12])\n    header_size = 12\n  else:\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\

      \ \ resources\ =\ \{\}\

      \ \ kIndexEntrySize\ =\ 2\ \+\ 4\ \ \#\ Each\ entry\ is\ a\ uint16\ and\ a\ uint32\.\

      \

      \ \ def\ entry_at_index\(idx\):\

      \ \ \ \ offset\ =\ header_size\ \+\ idx\ \*\ kIndexEntrySize\

      \ \ \ \ return\ struct\.unpack\(''<HI'',\ data\[offset\ :\ offset\ \+\ kIndexEntrySize\]\)\

      \

      \ \ prev_resource_id,\ prev_offset\ =\ entry_at_index\(0\)\

      \ \ for\ i\ in\ range\(1,\ resource_count\ \+\ 1\):\

      \ \ \ \ resource_id,\ offset\ =\ entry_at_index\(i\)\

      \ \ \ \ resources\[prev_resource_id\]\ =\ data\[prev_offset:offset\]\

      \ \ \ \ prev_resource_id,\ prev_offset\ =\ resource_id,\ offset\

      \

      \ \ id_table_size\ =\ \(resource_count\ \+\ 1\)\ \*\ kIndexEntrySize\

      \ \ \#\ Read\ the\ alias\ table\.\

      \ \ kAliasEntrySize\ =\ 2\ \+\ 2\ \ \#\ uint16,\ uint16\

      \

      \ \ def\ alias_at_index\(idx\):\

      \ \ \ \ offset\ =\ header_size\ \+\ id_table_size\ \+\ idx\ \*\ kAliasEntrySize\

      '
    replace: "\n  resources = {}\n  kIndexEntrySize = 2 + 4  # Each entry is a uint16 and a uint32.\n  kAliasEntrySize = 2 + 2  # uint16, uint16\n  id_table_size = (resource_count + 1) * kIndexEntrySize\n  alias_table_size = alias_count * kAliasEntrySize\n  data_offset = header_size + id_table_size + alias_table_size\n  if data_offset > len(data):\n    raise CorruptDataPack('Resource or alias table exceeds file bounds')\n\n  def entry_at_index(idx):\n    offset = header_size + idx * kIndexEntrySize\n    return struct.unpack('<HI', data[offset : offset + kIndexEntrySize])\n\n  prev_resource_id, prev_offset = entry_at_index(0)\n  if not data_offset <= prev_offset <= len(data):\n    raise CorruptDataPack('Resource offset outside payload bounds')\n  for i in range(1, resource_count + 1):\n    resource_id, offset = entry_at_index(i)\n    if not prev_offset <= offset <= len(data):\n      raise CorruptDataPack('Resource offsets exceed bounds or decrease')\n    if prev_resource_id in resources:\n      raise CorruptDataPack('Duplicate canonical resource ID')\n    resources[prev_resource_id] = data[prev_offset:offset]\n    prev_resource_id, prev_offset = resource_id, offset\n\n  # Read the alias table.\n\n  def alias_at_index(idx):\n    offset = header_size + id_table_size + idx * kAliasEntrySize\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ aliases\ =\ \{\}\

      \ \ for\ i\ in\ range\(alias_count\):\

      \ \ \ \ resource_id,\ index\ =\ alias_at_index\(i\)\

      \ \ \ \ aliased_id\ =\ entry_at_index\(index\)\[0\]\

      \ \ \ \ aliases\[resource_id\]\ =\ aliased_id\

      \ \ \ \ resources\[resource_id\]\ =\ resources\[aliased_id\]\

      \

      \ \ alias_table_size\ =\ kAliasEntrySize\ \*\ alias_count\

      \ \ sizes\ =\ DataPackSizes\(\

      \ \ \ \ header_size,\

      \ \ \ \ id_table_size,\

      '
    replace: "  aliases = {}\n  for i in range(alias_count):\n    resource_id, index = alias_at_index(i)\n    if index >= resource_count:\n      raise CorruptDataPack('Alias index outside canonical resource table')\n    if resource_id in resources:\n      raise CorruptDataPack('Duplicate resource ID in alias table')\n    aliased_id = entry_at_index(index)[0]\n    aliases[resource_id] = aliased_id\n    resources[resource_id] = resources[aliased_id]\n\n  sizes = DataPackSizes(\n    header_size,\n    id_table_size,\n"
