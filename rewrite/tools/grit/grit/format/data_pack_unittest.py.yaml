substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ \)\

      \ \ \ \ loaded\ =\ data_pack\.ReadDataPackFromString\(expected_data\)\

      \ \ \ \ self\.assertDictEqual\(expected_data_pack\.__dict__,\ loaded\.__dict__\)\

      \

      \ \ def\ testRePackUnittest\(self\):\

      \ \ \ \ expected_with_allowlist\ =\ \{\

      '
    replace: "    )\n    loaded = data_pack.ReadDataPackFromString(expected_data)\n    self.assertDictEqual(expected_data_pack.__dict__, loaded.__dict__)\n\n  def testReadDataPackRejectsOffsetBeyondEOF(self):\n    # Actual 24-byte CLI witness: the sentinel claims byte25 exists. Python\n    # slicing previously returned an empty resource instead of rejecting it.\n    data = bytes.fromhex(\n      '05000000 00000000 01000000 140018000000 000019000000'\n    )\n    with self.assertRaises(data_pack.CorruptDataPack):\n      data_pack.ReadDataPackFromString(data)\n\n  def testReadDataPackRejectsDuplicateCanonicalIDs(self):\n    # Actual32-byte CLI witness: the second ID20 previously overwrote payload A.\n    data = bytes.fromhex(\n      '05000000 00000000 02000000 14001e000000 14001f000000 '\n      '000020000000 4142'\n    )\n    with self.assertRaises(data_pack.CorruptDataPack):\n      data_pack.ReadDataPackFromString(data)\n\n  def testReadDataPackRejectsTruncatedHeadersAndTables(self):\n    fixtures = (\n      '',\n      '050000',\n      '04000000',\n      '04000000 00000000',\n      '05000000 00000000 000000',\n      # Complete headers without the mandatory sentinel entry.\n      '04000000 00000000 00',\n      '05000000 00000000 00000000',\n      # Huge v4 count must fail before reading or iterating the table.\n      '04000000 ffffffff 00',\n      # One alias is declared, but its last byte is missing.\n      '05000000 00000000 01000100 14001c000000 00001c000000 1f0000',\n    )\n    for literal in fixtures:\n      with self.subTest(literal=literal):\n        with self.assertRaises(data_pack.CorruptDataPack):\n          data_pack.ReadDataPackFromString(bytes.fromhex(literal))\n\n  def testReadDataPackRejectsInvalidPayloadOffsets(self):\n    fixtures = (\n      # The first payload overlaps its header/index table.\n      '05000000 00000000 01000000 140000000000 000018000000',\n      # The first payload begins past EOF, even if both offsets are equal.\n      '05000000 00000000 01000000 14001a000000 00001a000000 41',\n      # In-bounds offsets decrease; slicing used to hide the malformed range.\n      '05000000 00000000 01000000 140019000000 000018000000 41',\n    )\n    for literal in fixtures:\n      with self.subTest(literal=literal):\n        with self.assertRaises(data_pack.CorruptDataPack):\n          data_pack.ReadDataPackFromString(bytes.fromhex(literal))\n\n  def testReadDataPackRejectsInvalidAliasTables(self):\n    fixtures = (\n      # Index1 cannot address a one-entry canonical table.\n      '05000000 00000000 01000100 14001c000000 00001d000000 1f000100 41',\n      # An empty canonical table cannot be aliased.\n      '05000000 00000000 00000100 000016000000 1f000000',\n      # An alias cannot overwrite a canonical payload with the same ID.\n      '05000000 00000000 01000100 14001c000000 00001d000000 14000000 41',\n      # Duplicate alias IDs cannot silently collapse in the result dictionary.\n      '05000000 00000000 01000200 140020000000 000021000000 '\n      '1f000000 1f000000 41',\n    )\n    for literal in fixtures:\n      with self.subTest(literal=literal):\n        with self.assertRaises(data_pack.CorruptDataPack):\n          data_pack.ReadDataPackFromString(bytes.fromhex(literal))\n\n  def testReadDataPackValidBoundaryFormats(self):\n    fixtures = (\n      ('04000000 00000000 00 00000f000000', 4, {}, {}),\n      ('05000000 00000000 00000000 000012000000', 5, {}, {}),\n      ('04000000 01000000 00 140015000000 000015000000',\n       4, {20: b''}, {}),\n      ('05000000 00000000 01000000 140018000000 000018000000',\n       5, {20: b''}, {}),\n      ('05000000 00000000 01000100 14001c000000 00001d000000 1f000000 41',\n       5, {20: b'A', 31: b'A'}, {31: 20}),\n      ('05000000 00000000 01000100 14001c000000 00001c000000 1f000000',\n       5, {20: b'', 31: b''}, {31: 20}),\n    )\n    for literal, version, resources, aliases in fixtures:\n      with self.subTest(literal=literal):\n        loaded = data_pack.ReadDataPackFromString(bytes.fromhex(literal))\n        self.assertEqual(loaded.version, version)\n        self.assertEqual(loaded.encoding, data_pack.BINARY)\n        self.assertEqual(loaded.resources, resources)\n        self.assertEqual(loaded.aliases, aliases)\n\n  def testReadDataPackPreservesExistingInspectionCompatibility(self):\n    # The utility fix does not adopt the auditor's stricter writer-only rules:\n    # unused trailing bytes, an ignored sentinel ID, gaps and unique unsorted\n    # IDs remain readable. These are not claims of native lookup compatibility.\n    fixtures = (\n      ('05000000 00000000 01000000 140018000000 000019000000 4142',\n       {20: b'A'}),\n      ('05000000 00000000 01000000 140018000000 ffff19000000 41',\n       {20: b'A'}),\n      ('05000000 00000000 01000000 140019000000 00001a000000 0041',\n       {20: b'A'}),\n      ('05000000 00000000 02000000 14001e000000 0a001f000000 '\n       '000020000000 4142', {20: b'A', 10: b'B'}),\n    )\n    for literal, resources in fixtures:\n      with self.subTest(literal=literal):\n        loaded = data_pack.ReadDataPackFromString(bytes.fromhex(literal))\n        self.assertEqual(loaded.resources, resources)\n        self.assertEqual(loaded.aliases, {})\n\n  def testRePackUnittest(self):\n    expected_with_allowlist = {\n"
