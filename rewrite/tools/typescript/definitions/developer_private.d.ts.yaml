substitutions:
- description: Android explicit local CRX picker and ordinary result handling
  regex:
    pattern: "      export function getExtensionSize(id: string): Promise<string>;\n      export function getProfileConfiguration(): Promise<ProfileInfo>;\n      export function installDroppedFile(): Promise<void>;\n      export function loadUnpacked(options: LoadUnpackedOptions):\n          Promise<LoadError|null>;\n      export function notifyDragInstallInProgress(): void;\n"
    replace: "      export function getExtensionSize(id: string): Promise<string>;\n      export function getProfileConfiguration(): Promise<ProfileInfo>;\n      export function installDroppedFile(): Promise<void>;\n      export function installFromFile(): Promise<boolean>;\n      export function loadUnpacked(options: LoadUnpackedOptions):\n          Promise<LoadError|null>;\n      export function notifyDragInstallInProgress(): void;\n"
  count: 1
- description: Type the optional Android interrupted local import profile notice
  regex:
    pattern: "        isMv2DeprecationNoticeDismissed: boolean;\n        extensionsPinnedByDefault:\
      \ boolean;\n"
    replace: "        isMv2DeprecationNoticeDismissed: boolean;\n        extensionsPinnedByDefault:\
      \ boolean;\n        // Optional Android notice; absent when no local import\
      \ was interrupted.\n        interruptedLocalImport?: boolean;\n"
  count: 1
