{
  "substitutions": [
    {
      "description": "Android JUnit stdout skip reporting: literal source operation 1",
      "regex": {
        "re_pattern": "import\\ java\\.io\\.PrintStream;\\\n",
        "replace": "import java.io.PrintStream;\nimport java.util.Collections;\n"
      }
    },
    {
      "description": "Android JUnit stdout skip reporting: literal source operation 2",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ /\\*\\*\\ Logs\\ the\\ start\\ of\\ a\\ test\\ case\\.\\ \\*/\\\n",
        "replace": "    /** Logs a skipped individual test without reporting it as passing. */\n    public void testSkipped(Description test, long elapsedTimeMillis) {\n        mOutputStream.format(\n                \"[  SKIPPED ] %s.%s (%d ms)\",\n                test.getClassName(), test.getMethodName(), elapsedTimeMillis);\n        mOutputStream.println();\n    }\n\n    /** Logs the start of a test case. */\n"
      }
    },
    {
      "description": "Android JUnit stdout skip reporting: literal source operation 3",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ public\\ void\\ testRunFinished\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ int\\ passedTestCount,\\ Set<Description>\\ failedTests,\\ long\\ elapsedTimeMillis\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ int\\ totalTestCount\\ =\\ passedTestCount\\ \\+\\ failedTests\\.size\\(\\);\\\n",
        "replace": "    public void testRunFinished(\n            int passedTestCount, Set<Description> failedTests, long elapsedTimeMillis) {\n        testRunFinished(passedTestCount, failedTests, Collections.emptySet(), elapsedTimeMillis);\n    }\n\n    /** Logs a test run with skipped outcomes counted separately from passes. */\n    public void testRunFinished(\n            int passedTestCount,\n            Set<Description> failedTests,\n            Set<Description> skippedTests,\n            long elapsedTimeMillis) {\n        int totalTestCount = passedTestCount + failedTests.size() + skippedTests.size();\n"
      }
    },
    {
      "description": "Android JUnit stdout skip reporting: literal source operation 4",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ \\ \\ \\ \\ mOutputStream\\.format\\(\"\\[\\ \\ PASSED\\ \\ \\]\\ %d\\ tests\\.\",\\ passedTestCount\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ mOutputStream\\.println\\(\\);\\\n",
        "replace": "        mOutputStream.format(\"[  PASSED  ] %d tests.\", passedTestCount);\n        mOutputStream.println();\n        if (!skippedTests.isEmpty()) {\n            mOutputStream.format(\n                    \"[  SKIPPED ] %d test%s, listed below:\",\n                    skippedTests.size(), skippedTests.size() == 1 ? \"\" : \"s\");\n            mOutputStream.println();\n            for (Description d : skippedTests) {\n                mOutputStream.format(\"[  SKIPPED ] %s.%s\", d.getClassName(), d.getMethodName());\n                mOutputStream.println();\n            }\n        }\n"
      }
    }
  ]
}
