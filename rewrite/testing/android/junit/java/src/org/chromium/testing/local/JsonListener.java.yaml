{
  "substitutions": [
    {
      "description": "Android JUnit JSON assumption/ignored reporting: literal source operation 1",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ private\\ boolean\\ mCurrentTestPassed;\\\n",
        "replace": "    private boolean mCurrentTestPassed;\n    private boolean mCurrentTestSkipped;\n"
      }
    },
    {
      "description": "Android JUnit JSON assumption/ignored reporting: literal source operation 2",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ \\ \\ \\ \\ mCurrentTestPassed\\ =\\ true;\\\n",
        "replace": "        mCurrentTestPassed = true;\n        mCurrentTestSkipped = false;\n"
      }
    },
    {
      "description": "Android JUnit JSON assumption/ignored reporting: literal source operation 3",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ \\ \\ \\ \\ mJsonLogger\\.addTestResultInfo\\(d,\\ mCurrentTestPassed,\\ testElapsedTimeMillis\\);\\\n",
        "replace": "        String status =\n                !mCurrentTestPassed ? \"FAILURE\" : (mCurrentTestSkipped ? \"SKIPPED\" : \"SUCCESS\");\n        mJsonLogger.addTestResultInfo(d, status, testElapsedTimeMillis);\n"
      }
    },
    {
      "description": "Android JUnit JSON assumption/ignored reporting: literal source operation 4",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ public\\ void\\ testFailure\\(Failure\\ f\\)\\ throws\\ Exception\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mCurrentTestPassed\\ =\\ false;\\\n\\ \\ \\ \\ \\}\\\n",
        "replace": "    public void testFailure(Failure f) throws Exception {\n        mCurrentTestPassed = false;\n    }\n\n    /** Called when an assumption aborts the current test. */\n    @Override\n    public void testAssumptionFailure(Failure f) {\n        mCurrentTestSkipped = true;\n    }\n\n    /** Ignored tests do not receive testStarted or testFinished callbacks. */\n    @Override\n    public void testIgnored(Description d) {\n        mJsonLogger.addTestResultInfo(d, \"SKIPPED\", 0);\n    }\n"
      }
    }
  ]
}
