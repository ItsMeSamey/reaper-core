    },
    {
      "description": "Android JUnit stdout skip reporting: literal source operation 6",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ \\ \\ \\ \\ mCurrentTestPassed\\ =\\ true;\\\n\\ \\ \\ \\ \\ \\ \\ \\ mLogger\\.testStarted\\(d\\);\\\n",
        "replace": "        mCurrentTestPassed = true;\n        mCurrentTestSkipped = false;\n        mLogger.testStarted(d);\n"
      }
    },
    {
      "description": "Android JUnit stdout skip reporting: literal source operation 7",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ \\ \\ \\ \\ mLogger\\.testFinished\\(d,\\ mCurrentTestPassed,\\ testElapsedTimeMillis\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(mCurrentTestPassed\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\+\\+mTestsPassed;\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\ else\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mFailedTests\\.add\\(d\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n",
        "replace": "        if (!mCurrentTestPassed) {\n            mLogger.testFinished(d, false, testElapsedTimeMillis);\n            mFailedTests.add(d);\n        } else if (mCurrentTestSkipped) {\n            mLogger.testSkipped(d, testElapsedTimeMillis);\n            mSkippedTests.add(d);\n        } else {\n            mLogger.testFinished(d, true, testElapsedTimeMillis);\n            ++mTestsPassed;\n        }\n"
      }
    },
    {
      "description": "Android JUnit stdout skip reporting: literal source operation 8",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ public\\ void\\ testFailure\\(Failure\\ f\\)\\ throws\\ Exception\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mCurrentTestPassed\\ =\\ false;\\\n\\ \\ \\ \\ \\ \\ \\ \\ mLogger\\.testFailed\\(f\\);\\\n\\ \\ \\ \\ \\}\\\n",
        "replace": "    public void testFailure(Failure f) throws Exception {\n        mCurrentTestPassed = false;\n        mLogger.testFailed(f);\n    }\n\n    /** Called when an assumption aborts the current test. */\n    @Override\n    public void testAssumptionFailure(Failure f) {\n        mCurrentTestSkipped = true;\n    }\n\n    /** Ignored tests receive neither a start nor a finish callback. */\n    @Override\n    public void testIgnored(Description d) {\n        mLogger.testSkipped(d, 0);\n        mSkippedTests.add(d);\n    }\n"
