        "re_pattern": "\\ \\ \\ \\ \\ \\ \\ \\ mFailedTests\\ =\\ new\\ HashSet<Description>\\(\\);\\\n",
        "replace": "        mFailedTests = new HashSet<Description>();\n        mSkippedTests = new HashSet<Description>();\n"
