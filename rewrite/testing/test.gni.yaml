# Isolated Android script-loader native tests; ordinary defaults preserved.
substitutions:
- description: "Isolate script-loader test startup and resource inputs (1)."
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ _library_target_name\\ =\\ \"\\$\\{target_name\\}__library\"\\\n"
    replace: "      _reaper_isolation_vars = [\n        \"reaper_isolated_script_loader_apk\",\n        \"reaper_script_loader_asset_sources\",\n        \"reaper_script_loader_asset_paths\",\n        \"reaper_script_loader_asset_deps\",\n      ]\n      _library_target_name = \"${target_name}__library\"\n"
- description: "Isolate script-loader test startup and resource inputs (2)."
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\]\\ \\+\\ _apk_specific_vars\\ \\+\\ _wrapper_script_vars\\ \\+\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ TESTONLY_AND_VISIBILITY\\)"
    replace: "                ] + _apk_specific_vars + _wrapper_script_vars +\n                _reaper_isolation_vars + TESTONLY_AND_VISIBILITY)"
- description: "Isolate script-loader test startup and resource inputs (3)."
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(use_rts\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ data_deps\\ =\\ \\[\\ \":\\$\\{invoker\\.target_name\\}__rts_filters\"\\ \\]\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ test_runner_script\\(_test_runner_target\\)\\ \\{"
    replace: "        if (use_rts) {\n          data_deps = [ \":${invoker.target_name}__rts_filters\" ]\n        }\n      }\n\n      # Separate opt-in test containers; the ordinary APK and runner stay\n      # intact.\n      if (defined(invoker.reaper_isolated_script_loader_apk) &&\n          invoker.reaper_isolated_script_loader_apk) {\n        assert(_use_default_launcher && _generate_final_jni)\n        assert(!defined(invoker.android_manifest) &&\n               !defined(invoker.android_manifest_template))\n        assert(invoker.target_name == \"unit_tests\" ||\n               invoker.target_name == \"extensions_unittests\")\n        _isolated_assets = \"${target_name}__reaper_script_loader_assets\"\n\n        android_assets(_isolated_assets) {\n          renaming_sources = invoker.reaper_script_loader_asset_sources\n          renaming_destinations = invoker.reaper_script_loader_asset_paths\n          deps = invoker.reaper_script_loader_asset_deps\n        }\n\n        unittest_apk(\"${target_name}__reaper_script_loader_apk\") {\n          forward_variables_from(invoker, _apk_specific_vars)\n          apk_name = \"${_apk_name}_reaper_script_loader\"\n          final_apk_path =\n              \"$root_build_dir/${apk_name}_apk/${apk_name}-debug.apk\"\n          android_manifest_template = \"//brave/test/android/isolated_script_loader/AndroidManifest.xml.jinja2\"\n          shared_library = \":$_library_target_name\"\n          srcjar_deps = [ \"${shared_library}__jni_registration\" ]\n          if (defined(invoker.deps)) {\n            deps = invoker.deps\n          } else {\n            deps = []\n          }\n          if (defined(loadable_module_deps)) {\n            deps += loadable_module_deps\n          }\n          deps += [\n            \":$_isolated_assets\",\n            \"//base/test:test_support_java\",\n            \"//third_party/icu:icu_assets\",\n          ]\n          if (defined(_unwind_table_asset_name)) {\n            deps += [ \":${_unwind_table_asset_name}\" ]\n          }\n        }\n      }\n    }\n\n    test_runner_script(_test_runner_target) {"

- description: "Isolate four Android container browser tests without changing ordinary defaults (1)."
  regex:
    pattern: "        \"reaper_script_loader_asset_sources\",\n        \"reaper_script_loader_asset_paths\",\n        \"reaper_script_loader_asset_deps\",\n      ]\n      _library_target_name = \"${target_name}__library\"\n      _library_crate_name = \"${target_name}_library\"\n"
    replace: "        \"reaper_script_loader_asset_sources\",\n        \"reaper_script_loader_asset_paths\",\n        \"reaper_script_loader_asset_deps\",\n        \"reaper_isolated_container_browser_apk\",\n        \"reaper_container_browser_manifest\",\n        \"reaper_container_browser_manifest_dep\",\n        \"reaper_container_browser_asset_sources\",\n        \"reaper_container_browser_asset_paths\",\n      ]\n      _library_target_name = \"${target_name}__library\"\n      _library_crate_name = \"${target_name}_library\"\n"
  count: 1
- description: "Isolate four Android container browser tests without changing ordinary defaults (2)."
  regex:
    pattern: "            \"//base/test:test_support_java\",\n            \"//third_party/icu:icu_assets\",\n          ]\n          if (defined(_unwind_table_asset_name)) {\n            deps += [ \":${_unwind_table_asset_name}\" ]\n          }\n"
    replace: "            \"//base/test:test_support_java\",\n            \"//third_party/icu:icu_assets\",\n          ]\n          if (defined(_unwind_table_asset_name)) {\n            deps += [ \":${_unwind_table_asset_name}\" ]\n          }\n        }\n      }\n\n      # Browser fixtures retain their browser launcher and JNI closure.\n      if (defined(invoker.reaper_isolated_container_browser_apk) &&\n          invoker.reaper_isolated_container_browser_apk) {\n        assert(!_use_default_launcher && _generate_final_jni)\n        assert(invoker.target_name == \"android_browsertests\")\n        _browser_assets = \"${target_name}__reaper_container_browser_assets\"\n        android_assets(_browser_assets) {\n          renaming_sources = invoker.reaper_container_browser_asset_sources\n          renaming_destinations = invoker.reaper_container_browser_asset_paths\n        }\n        unittest_apk(\"${target_name}__reaper_container_browser_apk\") {\n          _browser_apk_vars = _apk_specific_vars - [\n                                \"android_manifest\",\n                                \"android_manifest_dep\",\n                                \"android_manifest_template\",\n                              ]\n          forward_variables_from(invoker, _browser_apk_vars)\n          apk_name = \"${_apk_name}_reaper_container_browser\"\n          final_apk_path =\n              \"$root_build_dir/${apk_name}_apk/${apk_name}-debug.apk\"\n          android_manifest = invoker.reaper_container_browser_manifest\n          android_manifest_dep = invoker.reaper_container_browser_manifest_dep\n          shared_library = \":$_library_target_name\"\n          srcjar_deps = [ \"${shared_library}__jni_registration\" ]\n          deps = invoker.deps\n          if (defined(loadable_module_deps)) {\n            deps += loadable_module_deps\n          }\n          deps += [ \":$_browser_assets\" ]\n          if (defined(_unwind_table_asset_name)) {\n            deps += [ \":${_unwind_table_asset_name}\" ]\n          }\n"
  count: 1

- description: "Retain production reflection targets in the isolated browser APK."
  count: 1
  regex:
    pattern: "          forward_variables_from(invoker, _browser_apk_vars)\n          apk_name = \"${_apk_name}_reaper_container_browser\"\n"
    replace: "          forward_variables_from(invoker, _browser_apk_vars)\n          if (defined(proguard_enabled) && proguard_enabled) {\n            # Match the production browser's reflection retention rules.\n            proguard_configs += [ \"//brave/android/java/proguard.flags\" ]\n          }\n          apk_name = \"${_apk_name}_reaper_container_browser\"\n"

- description: "Retain exact handwritten JNI helper descriptors in the isolated browser fixture."
  count: 1
  regex:
    pattern: "            proguard_configs += [ \"//brave/android/java/proguard.flags\" ]\n"
    replace: "            proguard_configs += [\n              \"//brave/android/java/proguard.flags\",\n              \"//brave/test/android/isolated_container_browser/proguard.flags\",\n            ]\n"
