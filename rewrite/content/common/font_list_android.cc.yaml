# Enumerate selectable Android system font families.
substitutions:
- description: Enumerate selectable Android font manager families on the existing blocking font task runner
  regex:
    re_pattern: '//\ Copyright\ 2013\ The\ Chromium\ Authors\

      //\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      //\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "content/common/font_list\.h"\

      \

      \#include\ <memory>\

      \

      \#include\ "base/values\.h"\

      \

      namespace\ content\ \{\

      \

      base::ListValue\ GetFontList_SlowBlocking\(\)\ \{\

      \ \ return\ base::ListValue\(\);\

      \}\

      \

      \}\ \ //\ namespace\ content\

      '
    replace: "// Copyright 2013 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\n#include \"content/common/font_list.h\"\n\n#include <set>\n#include <string>\n#include <utility>\n\n#include \"base/strings/string_util.h\"\n#include \"base/values.h\"\n#include \"skia/ext/font_utils.h\"\n#include \"third_party/skia/include/core/SkFontMgr.h\"\n#include \"third_party/skia/include/core/SkString.h\"\n#include \"third_party/skia/include/core/SkTypeface.h\"\n\nnamespace content {\n\nbase::ListValue GetFontList_SlowBlocking() {\n  const auto font_manager = skia::DefaultFontMgr();\n  if (!font_manager) {\n    return {};\n  }\n\n  // Enumerate names selectable by the same Android font manager used to render\n  // them. Its catalog excludes unnamed fallback families; no directory scan or\n  // separate Android font API is needed.\n  std::set<std::string> names;\n  auto add_family = [&font_manager, &names](const char* name) {\n    if (!name || !*name || !base::IsStringUTF8(name)) {\n      return;\n    }\n    const auto styles = font_manager->matchFamily(name);\n    if (!styles) {\n      return;\n    }\n    for (int index = 0; index < styles->count(); ++index) {\n      const auto typeface = styles->createTypeface(index);\n      if (typeface && typeface->countGlyphs() > 0) {\n        names.emplace(name);\n        return;\n      }\n    }\n  };\n  for (int index = 0; index < font_manager->countFamilies(); ++index) {\n    SkString name;\n    font_manager->getFamilyName(index, &name);\n    add_family(name.c_str());\n  }\n  // Keep the previous generic choices when they resolve to an actual family,\n  // even if a platform manager does not enumerate its aliases separately.\n  for (const char* alias : {\"sans-serif\", \"serif\", \"monospace\", \"cursive\"}) {\n    add_family(alias);\n  }\n\n  base::ListValue result;\n  for (const auto& name : names) {\n    base::ListValue entry;\n    entry.Append(name);\n    // Android's manager has canonical names, not localized family labels.\n    entry.Append(name);\n    result.Append(std::move(entry));\n  }\n  return result;\n}\n\n}  // namespace content\n"
