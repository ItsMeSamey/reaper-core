# Enumerate selectable Android system font families.
substitutions:
- description: Declare containers used by the real Android font catalog regression
  regex:
    re_pattern: \#include\ <string_view>
    replace: '#include <set>

      #include <string>

      #include <string_view>'
- description: Use the Android rendering font manager to validate returned family names
  regex:
    re_pattern: '\#include\ "testing/gtest/include/gtest/gtest\.h"\

      '
    replace: '#include "testing/gtest/include/gtest/gtest.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "skia/ext/font_utils.h"

      #include "third_party/skia/include/core/SkFontMgr.h"

      #include "third_party/skia/include/core/SkString.h"

      #include "third_party/skia/include/core/SkTypeface.h"

      #endif

      '
- description: Keep desktop font assertions separate from the real Android catalog test
  regex:
    re_pattern: //\ GetFontList\ is\ not\ implemented\ on\ Android\ and\ Fuchsia\.
    replace: // These platform-specific expected fonts apply to desktop systems.
- description: Validate complete selectable system families, generic aliases, ordering and duplicates on Android
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_WIN\)\

      TEST\(FontList,\ GetFontListLocalized\)'
    replace: "#if BUILDFLAG(IS_ANDROID)\nTEST(FontList, AndroidNamedFamiliesAreSelectableAndSorted) {\n  base::test::TaskEnvironment task_environment;\n  content::GetFontListTaskRunner()->PostTask(\n      FROM_HERE, base::BindOnce([] {\n        const auto manager = skia::DefaultFontMgr();\n        ASSERT_TRUE(manager);\n        const base::ListValue fonts = content::GetFontList_SlowBlocking();\n        ASSERT_FALSE(fonts.empty());\n        std::set<std::string> names;\n        std::string previous;\n        for (const auto& value : fonts) {\n          ASSERT_TRUE(value.is_list());\n          const auto& entry = value.GetList();\n          ASSERT_EQ(2u, entry.size());\n          ASSERT_TRUE(entry[0].is_string());\n          ASSERT_TRUE(entry[1].is_string());\n          const std::string& name = entry[0].GetString();\n          ASSERT_FALSE(name.empty());\n          EXPECT_TRUE(base::IsStringUTF8(name));\n          EXPECT_EQ(name, entry[1].GetString());\n          EXPECT_TRUE(previous.empty() || previous < name);\n          EXPECT_TRUE(names.insert(name).second);\n          previous = name;\n          const auto styles = manager->matchFamily(name.c_str());\n          ASSERT_TRUE(styles);\n          bool usable = false;\n          for (int i = 0; i < styles->count(); ++i) {\n            const auto face = styles->createTypeface(i);\n            usable |= face && face->countGlyphs() > 0;\n          }\n          EXPECT_TRUE(usable) << name;\n        }\n        // Check the real system catalog, not a fixed list of four aliases. This\n        // includes OEM families without making assumptions about their names.\n        for (int i = 0; i < manager->countFamilies(); ++i) {\n          SkString name;\n          manager->getFamilyName(i, &name);\n          const auto styles = manager->createStyleSet(i);\n          if (name.isEmpty() || !base::IsStringUTF8(name.c_str()) || !styles) {\n            continue;\n          }\n          for (int style = 0; style < styles->count(); ++style) {\n            const auto face = styles->createTypeface(style);\n            if (face && face->countGlyphs() > 0) {\n              EXPECT_TRUE(names.contains(name.c_str())) << name.c_str();\n              break;\n            }\n          }\n        }\n        for (const char* alias : {\"sans-serif\", \"serif\", \"monospace\", \"cursive\"}) {\n          const auto styles = manager->matchFamily(alias);\n          if (!styles) {\n            continue;\n          }\n          for (int i = 0; i < styles->count(); ++i) {\n            const auto face = styles->createTypeface(i);\n            if (face && face->countGlyphs() > 0) {\n              EXPECT_TRUE(names.contains(alias)) << alias;\n              break;\n            }\n          }\n        }\n      }));\n  task_environment.RunUntilIdle();\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n#if BUILDFLAG(IS_WIN)\nTEST(FontList, GetFontListLocalized)"
- description: Format Android font enumeration and regression sources
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ break;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ for\ \(const\ char\*\ alias\ :\ \{"sans\-serif",\ "serif",\ "monospace",\ "cursive"\}\)\ \{\

      \ \ \ \ \ \ \ \ \ \ const\ auto\ styles\ =\ manager\->matchFamily\(alias\);\

      \ \ \ \ \ \ \ \ \ \ if\ \(!styles\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ continue;\

      \ \ \ \ \ \ \ \ \ \ \}\

      '
    replace: "              break;\n            }\n          }\n        }\n        for (const char* alias :\n             {\"sans-serif\", \"serif\", \"monospace\", \"cursive\"}) {\n          const auto styles = manager->matchFamily(alias);\n          if (!styles) {\n            continue;\n          }\n"
