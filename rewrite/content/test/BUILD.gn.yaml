substitutions:
- description: Exclude the dedicated annotator browser fixture on Android
  regex:
    pattern: "  if (is_android) {\n    sources += [\n      \"../browser/gpu/gpu_background_kill_android_browsertest.cc\","
    replace: "  if (is_android) {\n    sources -= [\n      \"../renderer/accessibility/annotations/ax_image_annotator_browsertest.cc\"\
      ,\n    ]\n    sources += [\n      \"../browser/gpu/gpu_background_kill_android_browsertest.cc\","
  count: 1
- description: Remove browser fixture dependencies after the common dependency list is initialized
  regex:
    pattern: '  if (!(is_chromeos && target_cpu == "arm64" && current_cpu == "arm")) {'
    replace: "  if (is_android) {\n    deps -= [\n      \"//services/image_annotation/public/cpp\",\n      \"//services/image_annotation/public/mojom\"\
      ,\n    ]\n  }\n\n  if (!(is_chromeos && target_cpu == \"arm64\" && current_cpu == \"arm\")) {"
  count: 1
- description: Exclude dedicated stopword unit fixture while retaining general accessibility tests
  regex:
    pattern: "    \"test_render_frame_host_unittest.cc\",\n  ]\n"
    replace: "    \"test_render_frame_host_unittest.cc\",\n  ]\n\n  if (is_android) {\n    sources -= [\n      \"../renderer/accessibility/annotations/ax_image_stopwords_unittest.cc\"\
      ,\n    ]\n  }\n"
  count: 1
