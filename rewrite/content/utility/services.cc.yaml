substitutions:
- description: Exclude dedicated generative model factory headers on Android
  regex:
    pattern: '#include "services/on_device_model/on_device_model_service.h"

      #include "services/on_device_model/public/mojom/on_device_model_service.mojom.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "services/on_device_model/on_device_model_service.h"

      #include "services/on_device_model/public/mojom/on_device_model_service.mojom.h"

      #endif

      '
  count: 1
- description: Exclude dedicated generative model utility service factory on Android
  regex:
    pattern: "auto RunOnDeviceModel(\n    mojo::PendingReceiver<on_device_model::mojom::OnDeviceModelService>\n        receiver)\
      \ {\n  return on_device_model::OnDeviceModelService::Create(std::move(receiver));\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nauto RunOnDeviceModel(\n    mojo::PendingReceiver<on_device_model::mojom::OnDeviceModelService>\n\
      \        receiver) {\n  return on_device_model::OnDeviceModelService::Create(std::move(receiver));\n}\n#endif\n"
  count: 1
- description: Do not register the generative utility service on Android
  regex:
    pattern: '  services.Add(RunOnDeviceModel);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  services.Add(RunOnDeviceModel);\n#endif\n"
  count: 1
