substitutions:
- description: Remove only generative-model utility implementation, IPC and sandbox dependencies on Android
  regex:
    pattern: '  # When library CDMs are supported, we support running the CDM in the utility

      '
    replace: "  if (is_android) {\n    deps -= [\n      \"//content/utility/on_device_model:on_device_model_sandbox_init\"\
      ,\n      \"//services/on_device_model:on_device_model_service\",\n      \"//services/on_device_model/public/cpp\",\n\
      \      \"//services/on_device_model/public/mojom\",\n    ]\n  }\n\n  # When library CDMs are supported, we support running\
      \ the CDM in the utility\n"
  count: 1
