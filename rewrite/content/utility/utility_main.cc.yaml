substitutions:
- description: Exclude the generative-service-specific utility startup header on Android
  regex:
    pattern: '#include "content/utility/on_device_model/on_device_model_sandbox_init.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "content/utility/on_device_model/on_device_model_sandbox_init.h"

      #endif

      '
  count: 1
- description: Exclude the generative-service-specific utility startup header on Android
  regex:
    pattern: '#include "services/on_device_model/public/mojom/on_device_model_service.mojom.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "services/on_device_model/public/mojom/on_device_model_service.mojom.h"

      #endif

      '
  count: 1
- description: Exclude only generative-service PreSandboxInit hook on Android
  regex:
    pattern: "  if (utility_sub_type == on_device_model::mojom::OnDeviceModelService::Name_) {\n    CHECK(on_device_model::PreSandboxInit());\n\
      \  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (utility_sub_type == on_device_model::mojom::OnDeviceModelService::Name_) {\n\
      \    CHECK(on_device_model::PreSandboxInit());\n  }\n#endif\n"
  count: 1
- description: Exclude only generative-service Shutdown hook on Android
  regex:
    pattern: "  if (utility_sub_type == on_device_model::mojom::OnDeviceModelService::Name_) {\n    CHECK(on_device_model::Shutdown());\n\
      \  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (utility_sub_type == on_device_model::mojom::OnDeviceModelService::Name_) {\n\
      \    CHECK(on_device_model::Shutdown());\n  }\n#endif\n"
  count: 1
