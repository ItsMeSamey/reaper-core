# Android DevTools profile ownership and phone entry.
substitutions:
- description: Ship kDigitalGoodsApi disabled.
  set_feature_flag_default_state:
    feature_name: kDigitalGoodsApi
    value: base::FEATURE_DISABLED_BY_DEFAULT
- description: Ship kEmailVerificationProtocol disabled.
  set_feature_flag_default_state:
    feature_name: kEmailVerificationProtocol
    value: base::FEATURE_DISABLED_BY_DEFAULT
- description: Ship kFedCm disabled.
  set_feature_flag_default_state:
    feature_name: kFedCm
    value: base::FEATURE_DISABLED_BY_DEFAULT
- description: Ship kPrefetchProxy disabled.
  set_feature_flag_default_state:
    feature_name: kPrefetchProxy
    value: base::FEATURE_DISABLED_BY_DEFAULT
- description: Ship kPrivacySandboxAdsAPIsOverride disabled.
  set_feature_flag_default_state:
    feature_name: kPrivacySandboxAdsAPIsOverride
    value: base::FEATURE_DISABLED_BY_DEFAULT
- description: Ship kPwaNavigationCapturing disabled on Windows, Mac and Linux.
  set_feature_flag_default_state:
    feature_name: kPwaNavigationCapturing
    value: "\n#if BUILDFLAG(IS_WIN) || BUILDFLAG(IS_MAC) || BUILDFLAG(IS_LINUX)\n  base::FEATURE_DISABLED_BY_DEFAULT\n#else\n  base::FEATURE_ENABLED_BY_DEFAULT\n#endif\n"
- description: Ship kServiceWorkerAutoPreload disabled.
  set_feature_flag_default_state:
    feature_name: kServiceWorkerAutoPreload
    value: base::FEATURE_DISABLED_BY_DEFAULT
- description: Ship kWebIdentityDigitalCredentials disabled.
  set_feature_flag_default_state:
    feature_name: kWebIdentityDigitalCredentials
    value: base::FEATURE_DISABLED_BY_DEFAULT
- description: Ship kWebIdentityDigitalCredentialsCreation disabled.
  set_feature_flag_default_state:
    feature_name: kWebIdentityDigitalCredentialsCreation
    value: base::FEATURE_DISABLED_BY_DEFAULT
- description: Ship kWebOTP disabled.
  set_feature_flag_default_state:
    feature_name: kWebOTP
    value: base::FEATURE_DISABLED_BY_DEFAULT
- description: Enable the complete Android consent/capture/notification path.
  regex:
    pattern: BASE_FEATURE(kUserMediaScreenCapturing, base::FEATURE_DISABLED_BY_DEFAULT);
    replace: BASE_FEATURE(kUserMediaScreenCapturing, base::FEATURE_ENABLED_BY_DEFAULT);
- description: Normalize inherited patch whitespace.
  regex:
    pattern: "BASE_OVERRIDDEN_FEATURE(kPwaNavigationCapturing, \n"
    replace: 'BASE_OVERRIDDEN_FEATURE(kPwaNavigationCapturing,

      '
- description: Enable the real Android frontend only in the desktop-Android extension build
  regex:
    re_pattern: BASE_FEATURE\(kAndroidDevToolsFrontend,\ base::FEATURE_DISABLED_BY_DEFAULT\);
    replace: "BASE_FEATURE(kAndroidDevToolsFrontend,\n#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(IS_DESKTOP_ANDROID)\n             base::FEATURE_ENABLED_BY_DEFAULT\n#else\n             base::FEATURE_DISABLED_BY_DEFAULT\n#endif\n);"
