# Resumable native Android TTS with bounded synthesized audio.
substitutions:
- description: Use bounded synthesized audio for resumable Android speech
  regex:
    re_pattern: '\ \ \]\

      \ \ resources_package\ =\ "org\.chromium\.content"\

      \

      \ \ sources\ =\ \[\

      \ \ \ \ "java/src/org/chromium/content/browser/AdditionalNavigationParamsImpl\.java",\

      \ \ \ \ "java/src/org/chromium/content/browser/AppWebMessagePort\.java",\

      \ \ \ \ "java/src/org/chromium/content/browser/AudioFocusDelegate\.java",\

      \ \ \ \ "java/src/org/chromium/content/browser/BackgroundSyncNetworkObserver\.java",\

      '
    replace: "  ]\n  resources_package = \"org.chromium.content\"\n\n  sources = [\n    \"//brave/android/java/org/chromium/content/browser/ReaperTtsAudioPlayback.java\",\n    \"java/src/org/chromium/content/browser/AdditionalNavigationParamsImpl.java\",\n    \"java/src/org/chromium/content/browser/AppWebMessagePort.java\",\n    \"java/src/org/chromium/content/browser/AudioFocusDelegate.java\",\n    \"java/src/org/chromium/content/browser/BackgroundSyncNetworkObserver.java\",\n"
- description: Use bounded synthesized audio for resumable Android speech
  regex:
    re_pattern: '\

      robolectric_binary\("content_junit_tests"\)\ \{\

      \ \ resources_package\ =\ "org\.chromium\.content"\

      \ \ sources\ =\ \[\

      \ \ \ \ "junit/src/org/chromium/content/browser/AudioFocusDelegateTest\.java",\

      \ \ \ \ "junit/src/org/chromium/content/browser/BindingManagerTest\.java",\

      \ \ \ \ "junit/src/org/chromium/content/browser/ChildProcessConnectionMetricsUnitTest\.java",\

      \ \ \ \ "junit/src/org/chromium/content/browser/ChildProcessRankingTest\.java",\

      '
    replace: "\nrobolectric_binary(\"content_junit_tests\") {\n  resources_package = \"org.chromium.content\"\n  sources = [\n    \"//brave/android/junit/src/org/chromium/content/browser/ReaperTtsAudioPlaybackTest.java\",\n    \"junit/src/org/chromium/content/browser/AudioFocusDelegateTest.java\",\n    \"junit/src/org/chromium/content/browser/BindingManagerTest.java\",\n    \"junit/src/org/chromium/content/browser/ChildProcessConnectionMetricsUnitTest.java\",\n    \"junit/src/org/chromium/content/browser/ChildProcessRankingTest.java\",\n"
