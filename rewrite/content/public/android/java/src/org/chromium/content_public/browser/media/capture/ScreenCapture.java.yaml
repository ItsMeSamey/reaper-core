- description: Bind Android capture consent and frame delivery to its owned lifetime.
  regex:
    pattern: "\n    @Override\n    public void recreateImageHandler(CaptureState captureState) {\n        // If the native side was destroyed, then don't bother recreating the ImageHandler.\n        if (mNativeDesktopCapturerAndroid == 0) return;\n\n        recreateListener(captureState);\n    }\n\n    @NativeMethods\n    interface Natives {\n        void onRgbaFrameAvailable(\n                long nativeDesktopCapturerAndroid,\n                Runnable releaseCb,\n                long timestampNs,\n"
    replace: "\n    @Override\n    public void recreateImageHandler(CaptureState captureState) {\n        // If the native side was destroyed, then don't bother recreating the ImageHandler.\n        if (isCaptureStopped()) return;\n\n        recreateListener(captureState);\n    }\n\n    @NativeMethods\n    interface Natives {\n        boolean registerDocumentObserver(\n                @JniType(\"content::WebContents*\") WebContents owner,\n                @JniType(\"content::RenderFrameHost*\") RenderFrameHost frame,\n                int sourceId);\n\n        void releaseDocumentObserver(int sourceId);\n\n        void onRgbaFrameAvailable(\n                long nativeDesktopCapturerAndroid,\n                Runnable releaseCb,\n                long timestampNs,\n"
- description: Validate the exact projection consent result consumed by the platform API
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ mMediaProjection\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ manager\.getMediaProjection\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ pick\.mActivityResult\.getResultCode\(\),\ pick\.mActivityResult\.getData\(\)\);'
    replace: "            final var projectionData = pick.mActivityResult.getData();\n            if (projectionData == null) return failStart();\n            mMediaProjection =\n                    manager.getMediaProjection(\n                            pick.mActivityResult.getResultCode(), projectionData);"
