substitutions:
- description: Keep Android cancellation handles safe across proxy detach and profile destruction.
  regex:
    pattern: '#include "base/functional/callback_forward.h"'
    replace: '#include "base/functional/callback_forward.h"

      #include "base/memory/weak_ptr.h"'
- description: Expose a revocable handle to the current proxy attachment.
  regex:
    pattern: '  virtual ~WebAuthenticationRequestProxy() = default;'
    replace: "  virtual ~WebAuthenticationRequestProxy() = default;\n\n  // A handle is valid only while the same proxy attachment remains active.\n  // Embedders invalidate it after completing detached requests, before another\n  // extension can attach. This permits cancellation without retaining a raw\n  // keyed-service pointer or rerouting through a changed origin policy.\n  base::WeakPtr<WebAuthenticationRequestProxy> GetWeakPtr() {\n    return weak_factory_.GetWeakPtr();\n  }"
- description: Let the existing extension service revoke all handles when detached.
  regex:
    pattern: '  virtual void CancelRequest(RequestId request_id) = 0;

      };'
    replace: "  virtual void CancelRequest(RequestId request_id) = 0;\n\n protected:\n  void InvalidateProxyHandles() { weak_factory_.InvalidateWeakPtrs(); }\n\n private:\n  base::WeakPtrFactory<WebAuthenticationRequestProxy> weak_factory_{this};\n};"
- description: Correct Android extension compiler diagnostics while preserving existing embedder policies and callback behavior
  regex:
    re_pattern: '\

      \#include\ "base/functional/callback_forward\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "third_party/blink/public/mojom/webauthn/authenticator\.mojom\-forward\.h"\

      \

      namespace\ url\ \{\

      '
    replace: '

      #include "base/functional/callback_forward.h"

      #include "base/memory/weak_ptr.h"

      #include "build/build_config.h"

      #include "content/common/content_export.h"

      #include "third_party/blink/public/mojom/webauthn/authenticator.mojom-forward.h"


      namespace url {

      '
- description: Correct Android extension compiler diagnostics while preserving existing embedder policies and callback behavior
  regex:
    re_pattern: '\}\

      \

      namespace\ content\ \{\

      \

      //\ WebAuthentcationRequestProxy\ allows\ the\ embedder\ to\ intercept\ and\ handle\ Web\

      //\ Authentication\ API\ requests\.\

      '
    replace: '}


      namespace content {


      #if BUILDFLAG(IS_ANDROID)

      class BrowserContext;

      class RenderFrameHost;

      #endif


      // WebAuthentcationRequestProxy allows the embedder to intercept and handle Web

      // Authentication API requests.

      '
- description: Correct Android extension compiler diagnostics while preserving existing embedder policies and callback behavior
  regex:
    re_pattern: '\ \ //\ It\ is\ invoked\ with\ the\ result\ of\ the\ proxied\ request\.\

      \ \ using\ IsUvpaaCallback\ =\ base::OnceCallback<void\(bool\ is_available\)>;\

      \

      \ \ virtual\ \~WebAuthenticationRequestProxy\(\)\ =\ default;\

      \

      \ \ //\ A\ handle\ is\ valid\ only\ while\ the\ same\ proxy\ attachment\ remains\ active\.\

      \ \ //\ Embedders\ invalidate\ it\ after\ completing\ detached\ requests,\ before\ another\

      '
    replace: "  // It is invoked with the result of the proxied request.\n  using IsUvpaaCallback = base::OnceCallback<void(bool is_available)>;\n\n#if BUILDFLAG(IS_ANDROID)\n  CONTENT_EXPORT WebAuthenticationRequestProxy();\n  CONTENT_EXPORT virtual ~WebAuthenticationRequestProxy();\n\n  // Forward Android callers to the embedder's existing WebAuthn policies\n  // without exposing ContentClient outside content. Neither method retains its\n  // inputs.\n  CONTENT_EXPORT static WebAuthenticationRequestProxy* MaybeGetRequestProxy(\n      BrowserContext* browser_context,\n      const url::Origin& caller_origin);\n  CONTENT_EXPORT static bool IsSecurityLevelAcceptableForWebAuthn(\n      RenderFrameHost* render_frame_host,\n      const url::Origin& caller_origin);\n#else\n  virtual ~WebAuthenticationRequestProxy() = default;\n#endif\n\n  // A handle is valid only while the same proxy attachment remains active.\n  // Embedders invalidate it after completing detached requests, before another\n"
