# Android selected-tab device chooser lifetime.
substitutions:
- description: Allow the embedder to retain request validation across posted device selection
  regex:
    re_pattern: \ \ virtual\ bool\ CanAskForScanningPermission\(\);
    replace: "  virtual bool CanAskForScanningPermission();\n\n  // Optional validation immediately before a posted successful selection is\n  // delivered to the service that grants device access. Implementations can\n  // transfer document/tab lifetime tracking out of the closing chooser. Empty\n  // preserves the existing behavior. This is called only while handling SELECTED.\n  virtual base::OnceCallback<bool()> TakeSelectionValidator() { return {}; }"
- description: Format Android chooser lifetime changes
  regex:
    re_pattern: '\

      \ \ //\ Optional\ validation\ immediately\ before\ a\ posted\ successful\ selection\ is\

      \ \ //\ delivered\ to\ the\ service\ that\ grants\ device\ access\.\ Implementations\ can\

      \ \ //\ transfer\ document/tab\ lifetime\ tracking\ out\ of\ the\ closing\ chooser\.\ Empty\

      \ \ //\ preserves\ the\ existing\ behavior\.\ This\ is\ called\ only\ while\ handling\ SELECTED\.\

      \ \ virtual\ base::OnceCallback<bool\(\)>\ TakeSelectionValidator\(\)\ \{\ return\ \{\};\ \}\

      \

      \ \ //\ Lets\ the\ chooser\ tell\ the\ user\ the\ state\ of\ the\ Bluetooth\ adapter\.\ This\

      \ \ //\ defaults\ to\ POWERED_ON\.\

      '
    replace: "\n  // Optional validation immediately before a posted successful selection is\n  // delivered to the service that grants device access. Implementations can\n  // transfer document/tab lifetime tracking out of the closing chooser. Empty\n  // preserves the existing behavior. This is called only while handling\n  // SELECTED.\n  virtual base::OnceCallback<bool()> TakeSelectionValidator() { return {}; }\n\n  // Lets the chooser tell the user the state of the Bluetooth adapter. This\n  // defaults to POWERED_ON.\n"
- description: Correct Android extension compiler diagnostics while preserving existing embedder policies and callback behavior
  regex:
    re_pattern: '\ \ //\ transfer\ document/tab\ lifetime\ tracking\ out\ of\ the\ closing\ chooser\.\ Empty\

      \ \ //\ preserves\ the\ existing\ behavior\.\ This\ is\ called\ only\ while\ handling\

      \ \ //\ SELECTED\.\

      \ \ virtual\ base::OnceCallback<bool\(\)>\ TakeSelectionValidator\(\)\ \{\ return\ \{\};\ \}\

      \

      \ \ //\ Lets\ the\ chooser\ tell\ the\ user\ the\ state\ of\ the\ Bluetooth\ adapter\.\ This\

      \ \ //\ defaults\ to\ POWERED_ON\.\

      '
    replace: "  // transfer document/tab lifetime tracking out of the closing chooser. Empty\n  // preserves the existing behavior. This is called only while handling\n  // SELECTED.\n  virtual base::OnceCallback<bool()> TakeSelectionValidator();\n\n  // Lets the chooser tell the user the state of the Bluetooth adapter. This\n  // defaults to POWERED_ON.\n"
