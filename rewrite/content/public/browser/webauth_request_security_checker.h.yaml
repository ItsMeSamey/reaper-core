substitutions:
- description: Expose existing shared WebAuthn validation to the Android proxy adapter.
  regex:
    pattern: '#include <string>'
    replace: '#include <string>

      #include <vector>'
- description: Declare the descriptor type without adding device dependencies to public content.
  regex:
    pattern: namespace webauthn {
    replace: 'namespace device {

      class PublicKeyCredentialDescriptor;

      }


      namespace webauthn {'
- description: Reuse the existing ancestor, AppID and descriptor-list checks instead of reimplementing security policy.
  regex:
    pattern: ' protected:

      '
    replace: "  virtual blink::mojom::AuthenticatorStatus ValidateAncestorOrigins(\n      const url::Origin& origin, RequestType type, bool* is_cross_origin) = 0;\n  virtual blink::mojom::AuthenticatorStatus ValidateAppIdExtension(\n      std::string appid, url::Origin caller_origin,\n      const std::optional<RemoteDesktopParams>& remote_desktop_override,\n      std::string* out_app_id) = 0;\n  [[nodiscard]] virtual bool DeduplicateCredentialDescriptorListAndValidateLength(\n      std::vector<device::PublicKeyCredentialDescriptor>* list) = 0;\n\n protected:\n"
