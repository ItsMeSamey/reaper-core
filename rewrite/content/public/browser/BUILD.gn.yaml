substitutions:
  - description: Add the Brave content public browser sources.
    add_literal_to_list:
      target: browser_sources
      list_name: sources
      literal: brave_content_public_browser_sources
      import: //brave/content/public/browser/sources.gni
  - description: Keep Android translation download progress without model execution dependencies
    regex:
      pattern: "    \"//ui/base/dragdrop/mojom:mojom_headers\",\n    \"//ui/base/mojom:ui_base_types\",\n  ]\n  deps = [\n    \"//cc\",\n    \"//components/input\",\n"
      replace: "    \"//ui/base/dragdrop/mojom:mojom_headers\",\n    \"//ui/base/mojom:ui_base_types\",\n  ]\n  if (is_android) {\n    # Android public browser interfaces do not expose model execution APIs.\n    public_deps -= [\n      \"//services/on_device_model/public/cpp\",\n      \"//services/on_device_model/public/mojom\",\n    ]\n  }\n  deps = [\n    \"//cc\",\n    \"//components/input\",\n"
    count: 1
