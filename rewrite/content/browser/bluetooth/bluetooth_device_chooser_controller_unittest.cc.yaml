# Android selected-tab device chooser lifetime.
substitutions:
- description: Test the actual asynchronous Bluetooth success delivery and default compatibility
  regex:
    re_pattern: \#include\ "device/bluetooth/bluetooth_discovery_filter\.h"
    replace: '#include "device/bluetooth/bluetooth_discovery_filter.h"

      #include "base/functional/bind.h"

      #include "base/run_loop.h"

      #include "base/test/bind.h"

      #include "content/public/browser/bluetooth_chooser.h"

      #include "content/public/test/test_renderer_host.h"

      #include "device/bluetooth/test/mock_bluetooth_adapter.h"'
- description: Regress late validation denial, exact-once completion, and untouched desktop defaults
  regex:
    re_pattern: class\ BluetoothDeviceChooserControllerTest\ :\ public\ testing::Test\ \{\};
    replace: "class BluetoothDeviceChooserControllerTest : public testing::Test {};\n\nclass BluetoothDeviceChooserSelectionTest : public RenderViewHostTestHarness {\n public:\n  class Chooser final : public BluetoothChooser {\n   public:\n    explicit Chooser(base::OnceCallback<bool()> validator)\n        : validator_(std::move(validator)) {}\n    base::OnceCallback<bool()> TakeSelectionValidator() override {\n      return std::move(validator_);\n    }\n   private:\n    base::OnceCallback<bool()> validator_;\n  };\n  void QueueSelection(base::OnceCallback<bool()> validator,\n                      BluetoothDeviceChooserController::Callback callback) {\n    controller_ = std::make_unique<BluetoothDeviceChooserController>(\n        nullptr, *main_rfh(),\n        base::MakeRefCounted<testing::NiceMock<device::MockBluetoothAdapter>>());\n    controller_->chooser_ = std::make_unique<Chooser>(std::move(validator));\n    controller_->options_ = blink::mojom::WebBluetoothRequestDeviceOptions::New();\n    controller_->callback_ = std::move(callback);\n    controller_->OnBluetoothChooserEvent(BluetoothChooserEvent::SELECTED, \"chosen\");\n    EXPECT_FALSE(controller_->chooser_);\n  }\n  void TearDown() override {\n    controller_.reset();\n    RenderViewHostTestHarness::TearDown();\n  }\n private:\n  std::unique_ptr<BluetoothDeviceChooserController> controller_;\n};\n\nTEST_F(BluetoothDeviceChooserSelectionTest, RejectInvalidatedSelectionAfterUiCloses) {\n  bool invalidated = false;\n  bool called = false;\n  QueueSelection(base::BindLambdaForTesting([&] { return !invalidated; }),\n      base::BindLambdaForTesting(\n          [&](blink::mojom::WebBluetoothResult result,\n              blink::mojom::WebBluetoothRequestDeviceOptionsPtr options,\n              const std::string& address) {\n            called = true;\n            EXPECT_EQ(blink::mojom::WebBluetoothResult::CHOOSER_CANCELLED, result);\n            EXPECT_FALSE(options);\n            EXPECT_TRUE(address.empty());\n          }));\n  EXPECT_FALSE(called);\n  invalidated = true;\n  base::RunLoop().RunUntilIdle();\n  EXPECT_TRUE(called);\n}\n\nTEST_F(BluetoothDeviceChooserSelectionTest, EmptyValidatorPreservesDesktopSelection) {\n  bool called = false;\n  QueueSelection({}, base::BindLambdaForTesting(\n      [&](blink::mojom::WebBluetoothResult result,\n          blink::mojom::WebBluetoothRequestDeviceOptionsPtr options,\n          const std::string& address) {\n        called = true;\n        EXPECT_EQ(blink::mojom::WebBluetoothResult::SUCCESS, result);\n        EXPECT_TRUE(options);\n        EXPECT_EQ(\"chosen\", address);\n      }));\n  EXPECT_FALSE(called);\n  base::RunLoop().RunUntilIdle();\n  EXPECT_TRUE(called);\n}\n\nTEST_F(BluetoothDeviceChooserSelectionTest, ValidatedSelectionCompletesOnce) {\n  int calls = 0;\n  int validations = 0;\n  QueueSelection(base::BindLambdaForTesting([&] { ++validations; return true; }),\n      base::BindLambdaForTesting(\n          [&](blink::mojom::WebBluetoothResult result,\n              blink::mojom::WebBluetoothRequestDeviceOptionsPtr options,\n              const std::string& address) {\n            ++calls;\n            EXPECT_EQ(blink::mojom::WebBluetoothResult::SUCCESS, result);\n          }));\n  EXPECT_EQ(0, validations);\n  base::RunLoop().RunUntilIdle();\n  EXPECT_EQ(1, validations);\n  EXPECT_EQ(1, calls);\n}"
