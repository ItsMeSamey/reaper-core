- description: Format Android chooser lifetime changes
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ :\ validator_\(std::move\(validator\)\)\ \{\}\

      \ \ \ \ base::OnceCallback<bool\(\)>\ TakeSelectionValidator\(\)\ override\ \{\

      \ \ \ \ \ \ return\ std::move\(validator_\);\

      \ \ \ \ \}\

      \ \ \ private:\

      \ \ \ \ base::OnceCallback<bool\(\)>\ validator_;\

      \ \ \};\

      \ \ void\ QueueSelection\(base::OnceCallback<bool\(\)>\ validator,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ BluetoothDeviceChooserController::Callback\ callback\)\ \{\

      \ \ \ \ controller_\ =\ std::make_unique<BluetoothDeviceChooserController>\(\

      \ \ \ \ \ \ \ \ nullptr,\ \*main_rfh\(\),\

      \ \ \ \ \ \ \ \ base::MakeRefCounted<testing::NiceMock<device::MockBluetoothAdapter>>\(\)\);\

      \ \ \ \ controller_\->chooser_\ =\ std::make_unique<Chooser>\(std::move\(validator\)\);\

      \ \ \ \ controller_\->options_\ =\ blink::mojom::WebBluetoothRequestDeviceOptions::New\(\);\

      \ \ \ \ controller_\->callback_\ =\ std::move\(callback\);\

      \ \ \ \ controller_\->OnBluetoothChooserEvent\(BluetoothChooserEvent::SELECTED,\ "chosen"\);\

      \ \ \ \ EXPECT_FALSE\(controller_\->chooser_\);\

      \ \ \}\

      \ \ void\ TearDown\(\)\ override\ \{\

      \ \ \ \ controller_\.reset\(\);\

      \ \ \ \ RenderViewHostTestHarness::TearDown\(\);\

      \ \ \}\

      \ private:\

      \ \ std::unique_ptr<BluetoothDeviceChooserController>\ controller_;\

      \};\

      \

      TEST_F\(BluetoothDeviceChooserSelectionTest,\ RejectInvalidatedSelectionAfterUiCloses\)\ \{\

      \ \ bool\ invalidated\ =\ false;\

      \ \ bool\ called\ =\ false;\

      \ \ QueueSelection\(base::BindLambdaForTesting\(\[\&\]\ \{\ return\ !invalidated;\ \}\),\

      \ \ \ \ \ \ base::BindLambdaForTesting\(\

      \ \ \ \ \ \ \ \ \ \ \[\&\]\(blink::mojom::WebBluetoothResult\ result,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ blink::mojom::WebBluetoothRequestDeviceOptionsPtr\ options,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::string\&\ address\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ called\ =\ true;\

      \ \ \ \ \ \ \ \ \ \ \ \ EXPECT_EQ\(blink::mojom::WebBluetoothResult::CHOOSER_CANCELLED,\ result\);\

      \ \ \ \ \ \ \ \ \ \ \ \ EXPECT_FALSE\(options\);\

      \ \ \ \ \ \ \ \ \ \ \ \ EXPECT_TRUE\(address\.empty\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \}\)\);\

      \ \ EXPECT_FALSE\(called\);\

      '
    replace: "        : validator_(std::move(validator)) {}\n    base::OnceCallback<bool()> TakeSelectionValidator() override {\n      return std::move(validator_);\n    }\n\n   private:\n    base::OnceCallback<bool()> validator_;\n  };\n  void QueueSelection(base::OnceCallback<bool()> validator,\n                      BluetoothDeviceChooserController::Callback callback) {\n    controller_ = std::make_unique<BluetoothDeviceChooserController>(\n        nullptr, *main_rfh(),\n        base::MakeRefCounted<\n            testing::NiceMock<device::MockBluetoothAdapter>>());\n    controller_->chooser_ = std::make_unique<Chooser>(std::move(validator));\n    controller_->options_ =\n        blink::mojom::WebBluetoothRequestDeviceOptions::New();\n    controller_->callback_ = std::move(callback);\n    controller_->OnBluetoothChooserEvent(BluetoothChooserEvent::SELECTED,\n                                         \"chosen\");\n    EXPECT_FALSE(controller_->chooser_);\n  }\n  void TearDown() override {\n    controller_.reset();\n    RenderViewHostTestHarness::TearDown();\n  }\n\n private:\n  std::unique_ptr<BluetoothDeviceChooserController> controller_;\n};\n\nTEST_F(BluetoothDeviceChooserSelectionTest,\n       RejectInvalidatedSelectionAfterUiCloses) {\n  bool invalidated = false;\n  bool called = false;\n  QueueSelection(\n      base::BindLambdaForTesting([&] { return !invalidated; }),\n      base::BindLambdaForTesting(\n          [&](blink::mojom::WebBluetoothResult result,\n              blink::mojom::WebBluetoothRequestDeviceOptionsPtr options,\n              const std::string& address) {\n            called = true;\n            EXPECT_EQ(blink::mojom::WebBluetoothResult::CHOOSER_CANCELLED,\n                      result);\n            EXPECT_FALSE(options);\n            EXPECT_TRUE(address.empty());\n          }));\n  EXPECT_FALSE(called);\n"
- description: Format Android chooser lifetime changes
  regex:
    re_pattern: '\ \ base::RunLoop\(\)\.RunUntilIdle\(\);\

      \ \ EXPECT_TRUE\(called\);\

      \}\

      \

      TEST_F\(BluetoothDeviceChooserSelectionTest,\ EmptyValidatorPreservesDesktopSelection\)\ \{\

      \ \ bool\ called\ =\ false;\

      \ \ QueueSelection\(\{\},\ base::BindLambdaForTesting\(\

      \ \ \ \ \ \ \[\&\]\(blink::mojom::WebBluetoothResult\ result,\

      \ \ \ \ \ \ \ \ \ \ blink::mojom::WebBluetoothRequestDeviceOptionsPtr\ options,\

      \ \ \ \ \ \ \ \ \ \ const\ std::string\&\ address\)\ \{\

      \ \ \ \ \ \ \ \ called\ =\ true;\

      \ \ \ \ \ \ \ \ EXPECT_EQ\(blink::mojom::WebBluetoothResult::SUCCESS,\ result\);\

      \ \ \ \ \ \ \ \ EXPECT_TRUE\(options\);\

      \ \ \ \ \ \ \ \ EXPECT_EQ\("chosen",\ address\);\

      \ \ \ \ \ \ \}\)\);\

      \ \ EXPECT_FALSE\(called\);\

      \ \ base::RunLoop\(\)\.RunUntilIdle\(\);\

      \ \ EXPECT_TRUE\(called\);\

      \}\

      \

      TEST_F\(BluetoothDeviceChooserSelectionTest,\ ValidatedSelectionCompletesOnce\)\ \{\

      \ \ int\ calls\ =\ 0;\

      \ \ int\ validations\ =\ 0;\

      \ \ QueueSelection\(base::BindLambdaForTesting\(\[\&\]\ \{\ \+\+validations;\ return\ true;\ \}\),\

      \ \ \ \ \ \ base::BindLambdaForTesting\(\

      \ \ \ \ \ \ \ \ \ \ \[\&\]\(blink::mojom::WebBluetoothResult\ result,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ blink::mojom::WebBluetoothRequestDeviceOptionsPtr\ options,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::string\&\ address\)\ \{\

      '
    replace: "  base::RunLoop().RunUntilIdle();\n  EXPECT_TRUE(called);\n}\n\nTEST_F(BluetoothDeviceChooserSelectionTest,\n       EmptyValidatorPreservesDesktopSelection) {\n  bool called = false;\n  QueueSelection(\n      {}, base::BindLambdaForTesting(\n              [&](blink::mojom::WebBluetoothResult result,\n                  blink::mojom::WebBluetoothRequestDeviceOptionsPtr options,\n                  const std::string& address) {\n                called = true;\n                EXPECT_EQ(blink::mojom::WebBluetoothResult::SUCCESS, result);\n                EXPECT_TRUE(options);\n                EXPECT_EQ(\"chosen\", address);\n              }));\n  EXPECT_FALSE(called);\n  base::RunLoop().RunUntilIdle();\n  EXPECT_TRUE(called);\n}\n\nTEST_F(BluetoothDeviceChooserSelectionTest, ValidatedSelectionCompletesOnce) {\n  int calls = 0;\n  int validations = 0;\n  QueueSelection(\n      base::BindLambdaForTesting([&] {\n        ++validations;\n        return true;\n      }),\n      base::BindLambdaForTesting(\n          [&](blink::mojom::WebBluetoothResult result,\n              blink::mojom::WebBluetoothRequestDeviceOptionsPtr options,\n              const std::string& address) {\n"
