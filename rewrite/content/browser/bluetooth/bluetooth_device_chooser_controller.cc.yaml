# Android selected-tab device chooser lifetime.
substitutions:
- description: Revalidate asynchronous Bluetooth selection before OnGetDevice grants access
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ base::BindOnce\(std::move\(callback_\),\ WebBluetoothResult::SUCCESS,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::move\(options_\),\ device_address\)\)\)\ \{'
    replace: "          base::BindOnce(\n              [](base::OnceCallback<bool()> validate,\n                 Callback callback,\n                 blink::mojom::WebBluetoothRequestDeviceOptionsPtr options,\n                 std::string address) {\n                if (validate && !std::move(validate).Run()) {\n                  std::move(callback).Run(WebBluetoothResult::CHOOSER_CANCELLED,\n                                          nullptr, std::string());\n                  return;\n                }\n                std::move(callback).Run(WebBluetoothResult::SUCCESS,\n                                        std::move(options), address);\n              }, chooser_ ? chooser_->TakeSelectionValidator() : base::OnceCallback<bool()>(), std::move(callback_),\n              std::move(options_), device_address))) {"
