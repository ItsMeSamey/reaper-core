substitutions:
  - description: Add the Brave content browser sources.
    add_literal_to_list:
      target: browser
      list_name: sources
      literal: brave_content_browser_sources
      import: //brave/content/browser/sources.gni

  - description: Add the Brave content browser deps.
    add_literal_to_list:
      target: browser
      list_name: deps
      literal: brave_content_browser_deps
      import: //brave/content/browser/sources.gni

  - description: Widen the content test visibility for Brave.
    add_literal_to_list:
      target: for_content_tests
      list_name: visibility
      literal: brave_content_browser_for_content_tests_visibility
      import: //brave/content/browser/sources.gni

  - description: 'Android concrete AI source/provider removal: content/browser/BUILD.gn'
    regex:
      re_pattern: '\#\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

        \#\ found\ in\ the\ LICENSE\ file\.\

        \

        import\("//brave/content/browser/sources\.gni"\)\

        import\("//base/allocator/partition_allocator/partition_alloc\.gni"\)\

        import\("//build/buildflag_header\.gni"\)\

        import\("//build/config/compiler/pgo/pgo\.gni"\)\

        import\("//build/config/features\.gni"\)\

        '
      replace: '# Use of this source code is governed by a BSD-style license that can be

        # found in the LICENSE file.


        import("//base/allocator/partition_allocator/partition_alloc.gni")

        import("//brave/content/browser/sources.gni")

        import("//build/buildflag_header.gni")

        import("//build/config/compiler/pgo/pgo.gni")

        import("//build/config/features.gni")

        '
  - description: 'Android concrete AI source/provider removal: content/browser/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "worker_host/worker_util\.cc",\

        \ \ \ \ "worker_host/worker_util\.h",\

        \ \ \]\

        \ \ sources\ \+=\ brave_content_browser_sources\

        \

        \ \ if\ \(is_android\)\ \{\

        '
      replace: "    \"worker_host/worker_util.cc\",\n    \"worker_host/worker_util.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"ai/echo_ai_language_model.cc\",\n      \"ai/echo_ai_language_model.h\",\n      \"ai/echo_ai_manager_impl.cc\",\n      \"ai/echo_ai_manager_impl.h\",\n      \"ai/echo_ai_proofreader.cc\",\n      \"ai/echo_ai_proofreader.h\",\n      \"ai/echo_ai_rewriter.cc\",\n      \"ai/echo_ai_rewriter.h\",\n      \"ai/echo_ai_semantic_embedder.cc\",\n      \"ai/echo_ai_semantic_embedder.h\",\n      \"ai/echo_ai_summarizer.cc\",\n      \"ai/echo_ai_summarizer.h\",\n      \"ai/echo_ai_writer.cc\",\n      \"ai/echo_ai_writer.h\",\n    ]\n  }\n  sources += brave_content_browser_sources\n\n  if (is_android) {\n"
  - description: Remove the browser broker IPC dependency after guarding its Android default binder API
    regex:
      pattern: "  if (is_android) {\n    sources -= [\n"
      replace: "  if (is_android) {\n    deps -= [ \"//components/optimization_guide/public/mojom\" ]\n  }\n\n  if (is_android)\
        \ {\n    sources -= [\n"
    count: 1
  - description: Exact private authored telemetry compile-out hunk at reviewed before lines 2389-2394
    regex:
      pattern: "    \"worker_host/worker_util.h\",\n  ]\n  if (is_android) {\n    deps -= [ \"//components/optimization_guide/public/mojom\"\
        \ ]\n  }\n\n"
      replace: "    \"worker_host/worker_util.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"ukm_internals_ui.cc\"\
        ,\n      \"ukm_internals_ui.h\",\n    ]\n    deps -= [ \"//components/ukm/debug:util\" ]\n  }\n  if (is_android) {\n\
        \    deps -= [ \"//components/optimization_guide/public/mojom\" ]\n  }\n\n"
    count: 1
