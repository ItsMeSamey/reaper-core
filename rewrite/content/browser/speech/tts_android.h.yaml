# Resumable native Android TTS with bounded synthesized audio.
substitutions:
- description: Receive actual native player pause and resume transitions
  regex:
    re_pattern: \ \ void\ OnStartEvent\(JNIEnv\*\ env,\ int32_t\ utterance_id\);
    replace: "  void OnStartEvent(JNIEnv* env, int32_t utterance_id);\n  void OnPauseEvent(JNIEnv* env, int32_t utterance_id);\n  void OnResumeEvent(JNIEnv* env, int32_t utterance_id);\n  bool CanSpeakNow(JNIEnv* env, int32_t utterance_id);"
- description: Destroy buffered playback and platform engines on browser shutdown
  regex:
    re_pattern: \ \ bool\ IsSpeaking\(\)\ override;
    replace: "  bool IsSpeaking() override;\n  void Shutdown() override;"
- description: Remember a pause requested while SSML is still being parsed
  regex:
    re_pattern: \ \ int\ utterance_id_;
    replace: "  int utterance_id_;\n  bool requested_paused_ = false;"
