# Resumable native Android TTS with bounded synthesized audio.
substitutions:
- description: Preserve the next utterance across synchronous completion callbacks
  regex:
    re_pattern: '\ \ TtsController::GetInstance\(\)\->OnTtsEvent\(utterance_id_,\ event_type,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ char_index,\ \-1,\ std::string\(\)\);\

      \ \ utterance_id_\ =\ 0;\

      \ \ utterance_\.clear\(\);'
    replace: "  // OnTtsEvent may synchronously start the next queued utterance. Retire the\n  // completed one first so its cleanup cannot erase the new utterance's state.\n  utterance_id_ = 0;\n  utterance_.clear();\n  TtsController::GetInstance()->OnTtsEvent(utterance_id, event_type,\n                                           char_index, -1, std::string());"
- description: Format the modified implementation with Chromium style
  regex:
    re_pattern: '\ \ //\ OnTtsEvent\ may\ synchronously\ start\ the\ next\ queued\ utterance\.\ Retire\ the\

      \ \ //\ completed\ one\ first\ so\ its\ cleanup\ cannot\ erase\ the\ new\ utterance''s\ state\.\

      \ \ utterance_id_\ =\ 0;\

      \ \ utterance_\.clear\(\);\

      \ \ TtsController::GetInstance\(\)\->OnTtsEvent\(utterance_id,\ event_type,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ char_index,\ \-1,\ std::string\(\)\);\

      \}\

      \

      //\ static\

      TtsPlatformImplAndroid\*\ TtsPlatformImplAndroid::GetInstance\(\)\ \{\

      '
    replace: "  // OnTtsEvent may synchronously start the next queued utterance. Retire the\n  // completed one first so its cleanup cannot erase the new utterance's state.\n  utterance_id_ = 0;\n  utterance_.clear();\n  TtsController::GetInstance()->OnTtsEvent(utterance_id, event_type, char_index,\n                                           -1, std::string());\n}\n\n// static\nTtsPlatformImplAndroid* TtsPlatformImplAndroid::GetInstance() {\n"
- description: Close Java playback exactly once at platform shutdown
  regex:
    re_pattern: 'TtsPlatformImplAndroid::\~TtsPlatformImplAndroid\(\)\ \{\

      \ \ JNIEnv\*\ env\ =\ AttachCurrentThread\(\);\

      \ \ Java_TtsPlatformImpl_destroy\(env,\ java_ref_\);\

      \}'
    replace: "TtsPlatformImplAndroid::~TtsPlatformImplAndroid() {\n  Shutdown();\n}\n\nvoid TtsPlatformImplAndroid::Shutdown() {\n  StopSpeaking();\n  if (!java_ref_.is_null()) {\n    Java_TtsPlatformImpl_destroy(AttachCurrentThread(), java_ref_);\n    java_ref_.Reset();\n  }\n}"
- description: Keep zero available as a valid first utterance identifier
  regex:
    re_pattern: TtsPlatformImplAndroid::TtsPlatformImplAndroid\(\)\ :\ utterance_id_\(0\)
    replace: 'TtsPlatformImplAndroid::TtsPlatformImplAndroid() : utterance_id_(-1)'
- description: Bind asynchronous speech preparation to the current native request
  regex:
    re_pattern: \ \ //\ Parse\ SSML\ and\ process\ speech\.
    replace: "  if (java_ref_.is_null()) {\n    std::move(did_start_speaking_callback).Run(false);\n    return;\n  }\n\n  // Cancel stale parsing before accepting a new utterance. A pause can arrive\n  // while the isolated XML parser is still running.\n  weak_factory_.InvalidateWeakPtrs();\n  utterance_id_ = utterance_id;\n  utterance_.clear();\n  requested_paused_ = false;\n\n  // Parse SSML and process speech."
- description: Retire a rejected request before its callback advances the queue
  regex:
    re_pattern: '\ \ std::move\(did_start_speaking_callback\)\

      \ \ \ \ \ \ \.Run\(StartSpeakingNow\(utterance_id,\ lang,\ params,\ parsed_utterance,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ voice\.engine_id\)\);'
    replace: "  const bool started = StartSpeakingNow(utterance_id, lang, params,\n                                       parsed_utterance, voice.engine_id);\n  if (!started && utterance_id_ == utterance_id) {\n    utterance_id_ = -1;\n    utterance_.clear();\n    requested_paused_ = false;\n  }\n  // The callback can immediately advance the controller's queue.\n  std::move(did_start_speaking_callback).Run(started);"
- description: Recheck request ownership and the existing visible-activity policy
  regex:
    re_pattern: '\ \ if\ \(!environment_android_\->CanSpeakNow\(\)\)\

      \ \ \ \ return\ false;'
    replace: "  if (java_ref_.is_null() || utterance_id_ != utterance_id ||\n      !environment_android_->CanSpeakNow())\n    return false;"
- description: Set current text before any Java playback callback
  regex:
    re_pattern: '\ \ JNIEnv\*\ env\ =\ AttachCurrentThread\(\);\

      \ \ const\ bool\ did_start\ =\ Java_TtsPlatformImpl_speak\('
    replace: "  utterance_ = parsed_utterance;\n  JNIEnv* env = AttachCurrentThread();\n  const bool did_start = Java_TtsPlatformImpl_speak("
- description: Pass a pre-playback pause into the synthesized-audio state machine
  regex:
    re_pattern: '\ \ \ \ \ \ base::android::ConvertUTF8ToJavaString\(env,\ engine_id\),\ params\.rate,\

      \ \ \ \ \ \ params\.pitch,\ params\.volume\);\

      \ \ if\ \(!did_start\)\

      \ \ \ \ return\ false;\

      \

      \ \ utterance_\ =\ parsed_utterance;\

      \ \ utterance_id_\ =\ utterance_id;\

      \ \ return\ true;'
    replace: "      base::android::ConvertUTF8ToJavaString(env, engine_id), params.rate,\n      params.pitch, params.volume, requested_paused_);\n  return did_start;"
- description: Pause native playback without discarding its utterance and invalidate preparation on stop
  regex:
    re_pattern: 'bool\ TtsPlatformImplAndroid::StopSpeaking\(\)\ \{\

      \ \ JNIEnv\*\ env\ =\ AttachCurrentThread\(\);\

      \ \ Java_TtsPlatformImpl_stop\(env,\ java_ref_\);\

      \ \ utterance_id_\ =\ 0;\

      \ \ utterance_\.clear\(\);\

      \ \ return\ true;\

      \}\

      \

      void\ TtsPlatformImplAndroid::Pause\(\)\ \{\

      \ \ StopSpeaking\(\);\

      \}\

      \

      void\ TtsPlatformImplAndroid::Resume\(\)\ \{\}\

      \

      bool\ TtsPlatformImplAndroid::IsSpeaking\(\)\ \{\

      \ \ return\ \(utterance_id_\ !=\ 0\);\

      \}'
    replace: "bool TtsPlatformImplAndroid::StopSpeaking() {\n  weak_factory_.InvalidateWeakPtrs();\n  utterance_id_ = -1;\n  utterance_.clear();\n  requested_paused_ = false;\n  if (!java_ref_.is_null()) {\n    Java_TtsPlatformImpl_stop(AttachCurrentThread(), java_ref_);\n  }\n  return true;\n}\n\nvoid TtsPlatformImplAndroid::Pause() {\n  if (utterance_id_ < 0) {\n    return;\n  }\n  requested_paused_ = true;\n  Java_TtsPlatformImpl_pause(AttachCurrentThread(), java_ref_);\n}\n\nvoid TtsPlatformImplAndroid::Resume() {\n  if (utterance_id_ < 0) {\n    return;\n  }\n  if (!environment_android_->CanSpeakNow()) {\n    TtsController::GetInstance()->Stop();\n    return;\n  }\n  requested_paused_ = false;\n  Java_TtsPlatformImpl_resume(AttachCurrentThread(), java_ref_);\n}\n\nbool TtsPlatformImplAndroid::IsSpeaking() {\n  return utterance_id_ >= 0;\n}"
- description: Do not query voices on a destroyed Java engine
  regex:
    re_pattern: \ \ if\ \(!Java_TtsPlatformImpl_isInitialized\(env,\ java_ref_\)\)
    replace: '  if (java_ref_.is_null() || !Java_TtsPlatformImpl_isInitialized(env, java_ref_))'
- description: Ignore a late initialization notification after shutdown
  regex:
    re_pattern: 'void\ TtsPlatformImplAndroid::VoicesChanged\(JNIEnv\*\ env\)\ \{\

      \ \ TtsController::GetInstance\(\)\->VoicesChanged\(\);'
    replace: "void TtsPlatformImplAndroid::VoicesChanged(JNIEnv* env) {\n  if (!java_ref_.is_null()) {\n    TtsController::GetInstance()->VoicesChanged();\n  }"
- description: Advertise supported native playback transitions
  regex:
    re_pattern: \ \ \ \ data\.events\.insert\(TTS_EVENT_ERROR\);
    replace: "    data.events.insert(TTS_EVENT_ERROR);\n    data.events.insert(TTS_EVENT_PAUSE);\n    data.events.insert(TTS_EVENT_RESUME);"
- description: Report the actual JavaScript text length at completion
  regex:
    re_pattern: static_cast<int>\(utterance_\.size\(\)\)
    replace: static_cast<int>(base::UTF8ToUTF16(utterance_).size())
- description: Forward real player transitions without inventing a text-position estimate
  regex:
    re_pattern: '\ \ TtsController::GetInstance\(\)\->OnTtsEvent\(utterance_id_,\ TTS_EVENT_START,\ 0,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ utterance_\.size\(\),\ std::string\(\)\);\

      \}'
    replace: "  TtsController::GetInstance()->OnTtsEvent(\n      utterance_id_, TTS_EVENT_START, 0,\n      static_cast<int>(base::UTF8ToUTF16(utterance_).size()), std::string());\n}\n\nvoid TtsPlatformImplAndroid::OnPauseEvent(JNIEnv* env, int32_t utterance_id) {\n  if (utterance_id != utterance_id_) {\n    return;\n  }\n  TtsController::GetInstance()->OnTtsEvent(utterance_id, TTS_EVENT_PAUSE,\n                                         -1, -1, std::string());\n}\n\nvoid TtsPlatformImplAndroid::OnResumeEvent(JNIEnv* env, int32_t utterance_id) {\n  if (utterance_id != utterance_id_) {\n    return;\n  }\n  TtsController::GetInstance()->OnTtsEvent(utterance_id, TTS_EVENT_RESUME,\n                                         -1, -1, std::string());\n}"
- description: Recheck request and activity ownership before automatic audio-focus resume
  regex:
    re_pattern: void\ TtsPlatformImplAndroid::SendFinalTtsEvent\(int\ utterance_id,
    replace: "bool TtsPlatformImplAndroid::CanSpeakNow(JNIEnv* env, int32_t utterance_id) {\n  return !java_ref_.is_null() && utterance_id >= 0 && utterance_id == utterance_id_ &&\n         !requested_paused_ && environment_android_->CanSpeakNow();\n}\n\nvoid TtsPlatformImplAndroid::SendFinalTtsEvent(int utterance_id,"
- description: Preserve completion-before-callback ordering for buffered playback
  regex:
    re_pattern: '\ \ utterance_id_\ =\ 0;\

      \ \ utterance_\.clear\(\);\

      \ \ TtsController::GetInstance\(\)\->OnTtsEvent\(utterance_id,\ event_type,\ char_index,'
    replace: "  utterance_id_ = -1;\n  utterance_.clear();\n  requested_paused_ = false;\n  TtsController::GetInstance()->OnTtsEvent(utterance_id, event_type, char_index,"
- description: Format the modified implementation with Chromium style
  regex:
    re_pattern: '\ \ \ \ const\ UtteranceContinuousParameters\&\ params,\

      \ \ \ \ base::OnceCallback<void\(bool\)>\ did_start_speaking_callback,\

      \ \ \ \ const\ std::string\&\ parsed_utterance\)\ \{\

      \ \ const\ bool\ started\ =\ StartSpeakingNow\(utterance_id,\ lang,\ params,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ parsed_utterance,\ voice\.engine_id\);\

      \ \ if\ \(!started\ \&\&\ utterance_id_\ ==\ utterance_id\)\ \{\

      \ \ \ \ utterance_id_\ =\ \-1;\

      \ \ \ \ utterance_\.clear\(\);\

      \ \ \ \ requested_paused_\ =\ false;\

      '
    replace: "    const UtteranceContinuousParameters& params,\n    base::OnceCallback<void(bool)> did_start_speaking_callback,\n    const std::string& parsed_utterance) {\n  const bool started = StartSpeakingNow(utterance_id, lang, params,\n                                        parsed_utterance, voice.engine_id);\n  if (!started && utterance_id_ == utterance_id) {\n    utterance_id_ = -1;\n    utterance_.clear();\n    requested_paused_ = false;\n"
- description: Format the modified implementation with Chromium style
  regex:
    re_pattern: '\}\

      \

      void\ TtsPlatformImplAndroid::GetVoices\(std::vector<VoiceData>\*\ out_voices\)\ \{\

      \ \ JNIEnv\*\ env\ =\ AttachCurrentThread\(\);\

      \ \ if\ \(java_ref_\.is_null\(\)\ \|\|\ !Java_TtsPlatformImpl_isInitialized\(env,\ java_ref_\)\)\

      \ \ \ \ return;\

      \

      \ \ int\ count\ =\ Java_TtsPlatformImpl_getVoiceCount\(env,\ java_ref_\);\

      \ \ for\ \(int\ i\ =\ 0;\ i\ <\ count;\ \+\+i\)\ \{\

      '
    replace: "}\n\nvoid TtsPlatformImplAndroid::GetVoices(std::vector<VoiceData>* out_voices) {\n  JNIEnv* env = AttachCurrentThread();\n  if (java_ref_.is_null() ||\n      !Java_TtsPlatformImpl_isInitialized(env, java_ref_))\n    return;\n\n  int count = Java_TtsPlatformImpl_getVoiceCount(env, java_ref_);\n  for (int i = 0; i < count; ++i) {\n"
- description: Format the modified implementation with Chromium style
  regex:
    re_pattern: 'void\ TtsPlatformImplAndroid::OnPauseEvent\(JNIEnv\*\ env,\ int32_t\ utterance_id\)\ \{\

      \ \ if\ \(utterance_id\ !=\ utterance_id_\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \ \ TtsController::GetInstance\(\)\->OnTtsEvent\(utterance_id,\ TTS_EVENT_PAUSE,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \-1,\ \-1,\ std::string\(\)\);\

      \}\

      \

      void\ TtsPlatformImplAndroid::OnResumeEvent\(JNIEnv\*\ env,\ int32_t\ utterance_id\)\ \{\

      \ \ if\ \(utterance_id\ !=\ utterance_id_\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \ \ TtsController::GetInstance\(\)\->OnTtsEvent\(utterance_id,\ TTS_EVENT_RESUME,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \-1,\ \-1,\ std::string\(\)\);\

      \}\

      \

      bool\ TtsPlatformImplAndroid::CanSpeakNow\(JNIEnv\*\ env,\ int32_t\ utterance_id\)\ \{\

      \ \ return\ !java_ref_\.is_null\(\)\ \&\&\ utterance_id\ >=\ 0\ \&\&\ utterance_id\ ==\ utterance_id_\ \&\&\

      \ \ \ \ \ \ \ \ \ !requested_paused_\ \&\&\ environment_android_\->CanSpeakNow\(\);\

      \}\

      \

      void\ TtsPlatformImplAndroid::SendFinalTtsEvent\(int\ utterance_id,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TtsEventType\ event_type,\

      '
    replace: "void TtsPlatformImplAndroid::OnPauseEvent(JNIEnv* env, int32_t utterance_id) {\n  if (utterance_id != utterance_id_) {\n    return;\n  }\n  TtsController::GetInstance()->OnTtsEvent(utterance_id, TTS_EVENT_PAUSE, -1,\n                                           -1, std::string());\n}\n\nvoid TtsPlatformImplAndroid::OnResumeEvent(JNIEnv* env, int32_t utterance_id) {\n  if (utterance_id != utterance_id_) {\n    return;\n  }\n  TtsController::GetInstance()->OnTtsEvent(utterance_id, TTS_EVENT_RESUME, -1,\n                                           -1, std::string());\n}\n\nbool TtsPlatformImplAndroid::CanSpeakNow(JNIEnv* env, int32_t utterance_id) {\n  return !java_ref_.is_null() && utterance_id >= 0 &&\n         utterance_id == utterance_id_ && !requested_paused_ &&\n         environment_android_->CanSpeakNow();\n}\n\nvoid TtsPlatformImplAndroid::SendFinalTtsEvent(int utterance_id,\n                                               TtsEventType event_type,\n"
