# Android extension text-to-speech engine integration.
substitutions:
- description: Dispatch non-native voices to the supplied engine on Android
  regex:
    re_pattern: '\ \ if\ \(!voice\.native\)\ \{\

      \#if\ !BUILDFLAG\(IS_ANDROID\)'
    replace: '  if (!voice.native) {'
- description: Preserve the shared extension utterance completion and queue
  regex:
    re_pattern: '\ \ \ \ \ \ SpeakNextUtterance\(\);\

      \ \ \ \ \}\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      \ \ \}\ else\ \{'
    replace: "      SpeakNextUtterance();\n    }\n  } else {"
- description: Retain current utterance ownership after event delegates
  regex:
    re_pattern: "\\ \\ current_utterance_\\->OnTtsEvent\\(event_type,\\ char_index,\\ length,\\ error_message\\);\\\n\\ \\ if\\ \\(current_utterance_\\->IsFinished\\(\\)\\)\\ \\{"
    replace: "  current_utterance_->OnTtsEvent(event_type, char_index, length, error_message);\n#if BUILDFLAG(IS_ANDROID)\n  // Event delegates may synchronously stop or replace the current utterance.\n  if (!current_utterance_ || current_utterance_->GetId() != utterance_id) {\n    return;\n  }\n#endif\n  if (current_utterance_->IsFinished()) {"
- description: Retain replacement utterance after error delegates
  regex:
    re_pattern: "\\ \\ current_utterance_\\->OnTtsEvent\\(TTS_EVENT_ERROR,\\ kInvalidCharIndex,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ kInvalidLength,\\ GetTtsPlatform\\(\\)\\->GetError\\(\\)\\);\\\n\\ \\ SetCurrentUtterance\\(nullptr\\);"
    replace: "  current_utterance_->OnTtsEvent(TTS_EVENT_ERROR, kInvalidCharIndex,\n                                 kInvalidLength, GetTtsPlatform()->GetError());\n#if BUILDFLAG(IS_ANDROID)\n  // An error delegate may have already retired this utterance or started another.\n  if (!current_utterance_ || current_utterance_->GetId() != utterance_id) {\n    return;\n  }\n#endif\n  SetCurrentUtterance(nullptr);"
