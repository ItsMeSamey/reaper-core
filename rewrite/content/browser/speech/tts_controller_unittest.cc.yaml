# Android extension text-to-speech engine integration.
substitutions:
- description: Exercise the same delegate lifecycle on Android
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ //\ TtsEngineDelegate\ isn''t\ set\ for\ Android\ in\ ChromeContentBrowserClient\

      \ \ \ \ //\ since\ it\ has\ no\ extensions\.\

      \ \ \ \ controller\(\)\->SetTtsEngineDelegate\(\&engine_delegate_\);\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)'
    replace: '    controller()->SetTtsEngineDelegate(&engine_delegate_);'
- description: Regress non-native voice dispatch and final completion on Android
  regex:
    re_pattern: TEST_F\(TtsControllerTest,\ EngineIdSetNoDelegateSpeakPauseResumeStop\)\ \{
    replace: "TEST_F(TtsControllerTest, ExtensionVoiceDispatchAndCompletion) {\n  VoiceData voice;\n  voice.native = false;\n  voice.engine_id = \"extension-engine\";\n  voice.name = \"Extension test voice\";\n  voice.events.insert(TTS_EVENT_END);\n  engine_delegate()->set_voices({voice});\n  auto utterance = TtsUtterance::Create(browser_context(), true);\n  utterance->SetEngineId(voice.engine_id);\n  utterance->SetText(\"Android extension speech\");\n  const int id = utterance->GetId();\n  controller()->SpeakOrEnqueue(std::move(utterance));\n  EXPECT_EQ(id, engine_delegate()->utterance_id());\n  ASSERT_TRUE(TtsControllerCurrentUtterance());\n  EXPECT_TRUE(controller()->IsSpeaking());\n  controller()->OnTtsEvent(id, TTS_EVENT_END, 24, 0, {});\n  EXPECT_FALSE(TtsControllerCurrentUtterance());\n  EXPECT_FALSE(controller()->IsSpeaking());\n}\n\nTEST_F(TtsControllerTest, EngineIdSetNoDelegateSpeakPauseResumeStop) {"
