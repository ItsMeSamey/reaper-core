- description: Bind Android capture consent and frame delivery to its owned lifetime.
  regex:
    pattern: "#include \"third_party/webrtc/modules/desktop_capture/desktop_capturer.h\"\n\nnamespace content {\n\nclass CONTENT_EXPORT DesktopCapturerAndroidJniInterface {\n public:\n  virtual ~DesktopCapturerAndroidJniInterface() = default;\n  virtual base::android::ScopedJavaLocalRef<jobject> Create(\n      JNIEnv* env,\n      int64_t native_ptr) = 0;\n  virtual bool StartCapture(JNIEnv* env,\n                            const base::android::JavaRef<jobject>& obj) = 0;\n  virtual void Destroy(JNIEnv* env,\n                       const base::android::JavaRef<jobject>& obj) = 0;\n};\n\n"
    replace: "#include \"third_party/webrtc/modules/desktop_capture/desktop_capturer.h\"\n\nnamespace content {\n\nclass RenderFrameHost;\nclass WebContents;\n\n// UI-thread registry for a consent grant's exact initiating document. The\n// callback revokes Java's grant; release after normal completion does not call\n// it.\nCONTENT_EXPORT bool RegisterScreenCaptureDocument(WebContents* owner,\n                                                  RenderFrameHost* frame,\n                                                  int32_t source_id,\n                                                  base::OnceClosure on_revoke);\nCONTENT_EXPORT void ReleaseScreenCaptureDocument(int32_t source_id);\n\nclass CONTENT_EXPORT DesktopCapturerAndroidJniInterface {\n public:\n  virtual ~DesktopCapturerAndroidJniInterface() = default;\n  virtual base::android::ScopedJavaLocalRef<jobject> Create(\n      JNIEnv* env,\n      int64_t native_ptr) = 0;\n  virtual bool StartCapture(JNIEnv* env,\n                            const base::android::JavaRef<jobject>& obj,\n                            int32_t source_id) = 0;\n  virtual void Destroy(JNIEnv* env,\n                       const base::android::JavaRef<jobject>& obj) = 0;\n};\n\n"
- description: Bind Android capture consent and frame delivery to its owned lifetime.
  regex:
    pattern: "  };\n\n  void Shutdown();\n\n  void ProcessRgbaFrame(int64_t timestamp_ns, PlaneInfo plane);\n\n  raw_ptr<Callback> callback_ = nullptr;\n  base::android::ScopedJavaGlobalRef<jobject> screen_capture_;\n\n  std::unique_ptr<webrtc::DesktopFrame> next_frame_;\n"
    replace: "  };\n\n  void Shutdown();\n\n  void SetFrameMetadata(webrtc::DesktopFrame& frame, int64_t timestamp_ns);\n  void ProcessRgbaFrame(int64_t timestamp_ns, PlaneInfo plane);\n\n  // The picker allocates positive Java int IDs for one capture session.\n  std::optional<int32_t> source_id_;\n  raw_ptr<Callback> callback_ = nullptr;\n  base::android::ScopedJavaGlobalRef<jobject> screen_capture_;\n\n  std::unique_ptr<webrtc::DesktopFrame> next_frame_;\n"
