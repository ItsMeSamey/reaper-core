    replace: "}\n\nTEST_F(DesktopCapturerAndroidTest, StartFailurePermanentError) {\n  StartCapturer(/*start_success=*/false);\n  const auto& [result, frame] = CaptureFrame();\n  EXPECT_EQ(result, webrtc::DesktopCapturer::Result::ERROR_PERMANENT);\n  EXPECT_EQ(frame, nullptr);\n}\n\nTEST_F(DesktopCapturerAndroidTest, MinimumSourceIdPassedToJava) {\n  StartCapturer(/*start_success=*/true, 1);\n}\n\nTEST_F(DesktopCapturerAndroidTest, MaximumSourceIdPassedToJava) {\n  StartCapturer(/*start_success=*/true, std::numeric_limits<int32_t>::max());\n}\n\nTEST_F(DesktopCapturerAndroidTest, RepeatedSelectionBeforeStart) {\n  ASSERT_TRUE(capturer_->SelectSource(kSourceId));\n  StartCapturer(/*start_success=*/true);\n}\n\nTEST_F(DesktopCapturerAndroidTest, DestroyWithoutStartDoesNotCallJava) {\n  EXPECT_CALL(*jni_interface_, Create).Times(0);\n  EXPECT_CALL(*jni_interface_, StartCapture).Times(0);\n  EXPECT_CALL(*jni_interface_, Destroy).Times(0);\n  jni_interface_ = nullptr;\n  capturer_.reset();\n}\n\nTEST_F(DesktopCapturerAndroidTest, MissingSourceDoesNotCallJava) {\n  EXPECT_CALL(*jni_interface_, Create).Times(0);\n  EXPECT_CALL(*jni_interface_, StartCapture).Times(0);\n  EXPECT_CALL(*jni_interface_, Destroy).Times(0);\n  capturer_->Start(this);\n  EXPECT_FALSE(capturer_->SelectSource(kSourceId));\n  const auto& [result, frame] = CaptureFrame();\n  EXPECT_EQ(result, webrtc::DesktopCapturer::Result::ERROR_PERMANENT);\n  EXPECT_EQ(frame, nullptr);\n}\n\nclass DesktopCapturerAndroidInvalidSourceTest\n    : public DesktopCapturerAndroidTest,\n      public testing::WithParamInterface<webrtc::DesktopCapturer::SourceId> {};\n\nTEST_P(DesktopCapturerAndroidInvalidSourceTest, RejectsWithoutCallingJava) {\n  EXPECT_CALL(*jni_interface_, Create).Times(0);\n  EXPECT_CALL(*jni_interface_, StartCapture).Times(0);\n  EXPECT_CALL(*jni_interface_, Destroy).Times(0);\n  EXPECT_FALSE(capturer_->SelectSource(GetParam()));\n  EXPECT_FALSE(capturer_->SelectSource(kSourceId));\n  capturer_->Start(this);\n  const auto& [result, frame] = CaptureFrame();\n  EXPECT_EQ(result, webrtc::DesktopCapturer::Result::ERROR_PERMANENT);\n  EXPECT_EQ(frame, nullptr);\n}\n\nINSTANTIATE_TEST_SUITE_P(\n    InvalidSourceIds,\n    DesktopCapturerAndroidInvalidSourceTest,\n    testing::Values(\n        0,\n        -1,\n        std::numeric_limits<webrtc::DesktopCapturer::SourceId>::min()));\n\nTEST_F(DesktopCapturerAndroidTest, OversizedSourceDoesNotCallJava) {\n  if constexpr (sizeof(webrtc::DesktopCapturer::SourceId) <= sizeof(int32_t)) {\n    GTEST_SKIP() << \"SourceId cannot represent an oversized Java int\";\n  }\n  EXPECT_CALL(*jni_interface_, Create).Times(0);\n  EXPECT_CALL(*jni_interface_, StartCapture).Times(0);\n  EXPECT_CALL(*jni_interface_, Destroy).Times(0);\n  const int64_t oversized_id =\n      static_cast<int64_t>(std::numeric_limits<int32_t>::max()) + 1;\n  EXPECT_FALSE(capturer_->SelectSource(\n      static_cast<webrtc::DesktopCapturer::SourceId>(oversized_id)));\n  capturer_->Start(this);\n  const auto& [result, frame] = CaptureFrame();\n  EXPECT_EQ(result, webrtc::DesktopCapturer::Result::ERROR_PERMANENT);\n  EXPECT_EQ(frame, nullptr);\n}\n\nTEST_F(DesktopCapturerAndroidTest, ChangedSourceBeforeStartDoesNotCallJava) {\n  EXPECT_CALL(*jni_interface_, Create).Times(0);\n  EXPECT_CALL(*jni_interface_, StartCapture).Times(0);\n  EXPECT_CALL(*jni_interface_, Destroy).Times(0);\n  ASSERT_TRUE(capturer_->SelectSource(kSourceId));\n  EXPECT_FALSE(capturer_->SelectSource(kSourceId + 1));\n  capturer_->Start(this);\n  const auto& [result, frame] = CaptureFrame();\n  EXPECT_EQ(result, webrtc::DesktopCapturer::Result::ERROR_PERMANENT);\n  EXPECT_EQ(frame, nullptr);\n}\n\nTEST_F(DesktopCapturerAndroidTest, SelectionAfterStartFailsPermanently) {\n  StartCapturer(/*start_success=*/true);\n  EXPECT_FALSE(capturer_->SelectSource(kSourceId));\n  const auto& [result, frame] = CaptureFrame();\n  EXPECT_EQ(result, webrtc::DesktopCapturer::Result::ERROR_PERMANENT);\n  EXPECT_EQ(frame, nullptr);\n}\n\nTEST_F(DesktopCapturerAndroidTest, RepeatedStartDoesNotCallJavaAgain) {\n  StartCapturer(/*start_success=*/true);\n  PushRgbaFrame();\n  testing::StrictMock<MockDesktopCaptureCallback> replacement_callback;\n  capturer_->Start(&replacement_callback);\n  const auto& [result, frame] = CaptureFrame();\n  EXPECT_EQ(result, webrtc::DesktopCapturer::Result::ERROR_PERMANENT);\n  EXPECT_EQ(frame, nullptr);\n}\n\nTEST_F(DesktopCapturerAndroidTest, FailedStartCannotBeRetried) {\n  StartCapturer(/*start_success=*/false);\n  capturer_->OnStop(env_);\n  capturer_->OnStop(env_);\n  capturer_->Start(this);\n  const auto& [result, frame] = CaptureFrame();\n  EXPECT_EQ(result, webrtc::DesktopCapturer::Result::ERROR_PERMANENT);\n  EXPECT_EQ(frame, nullptr);\n}\n\nTEST_F(DesktopCapturerAndroidTest, CreateFailureDoesNotStartOrDestroyJava) {\n  ASSERT_TRUE(capturer_->SelectSource(kSourceId));\n  EXPECT_CALL(*jni_interface_, Create)\n      .WillOnce(Return(base::android::ScopedJavaLocalRef<jobject>()));\n  EXPECT_CALL(*jni_interface_, StartCapture).Times(0);\n  EXPECT_CALL(*jni_interface_, Destroy).Times(0);\n  capturer_->Start(this);\n  capturer_->OnStop(env_);\n  capturer_->Start(this);\n  const auto& [result, frame] = CaptureFrame();\n  EXPECT_EQ(result, webrtc::DesktopCapturer::Result::ERROR_PERMANENT);\n  EXPECT_EQ(frame, nullptr);\n}\n\n// Layouts: planar, separate stride-two planes, NV12, NV21.\nclass DesktopCapturerAndroidYuvTest\n    : public DesktopCapturerAndroidTest,\n      public testing::WithParamInterface<std::tuple<int, bool>> {};\n\nTEST_P(DesktopCapturerAndroidYuvTest, PaddedCroppedKnownColors) {\n  StartCapturer(/*start_success=*/true);\n  const auto [layout, odd_crop] = GetParam();\n  const int uv_pixel_stride = layout == 0 ? 1 : 2;\n  const int y_stride = 8;\n  const int u_stride = layout >= 2 ? 8 : 3 * uv_pixel_stride + 2;\n  const int v_stride = layout >= 2 ? 8 : 3 * uv_pixel_stride + 4;\n  // Only the bytes through the final sample are mapped, not final-row padding.\n  std::vector<uint8_t> y(y_stride * 3 + 6, 0xcd);\n  std::vector<uint8_t> u_storage(u_stride + 2 * uv_pixel_stride + 1, 0xcd);\n  std::vector<uint8_t> v_storage(v_stride + 2 * uv_pixel_stride + 1, 0xcd);\n  std::vector<uint8_t> interleaved(8 + 6, 0xcd);\n  base::span<uint8_t> u(u_storage);\n  base::span<uint8_t> v(v_storage);\n  if (layout >= 2) {\n    u = base::span(interleaved).subspan(layout == 2 ? 0u : 1u);\n    v = base::span(interleaved).subspan(layout == 2 ? 1u : 0u);\n  }\n\n  // BT.601 limited-range red, green and blue in two-by-two chroma blocks.\n  constexpr std::array<std::array<uint8_t, 3>, 3> kYuv = {\n      {{81, 90, 240}, {145, 54, 34}, {41, 240, 110}}};\n  constexpr std::array<std::array<uint8_t, 3>, 3> kRgb = {\n      {{255, 0, 0}, {0, 255, 0}, {0, 0, 255}}};\n  for (int row = 0; row < 4; ++row) {\n    for (int column = 0; column < 6; ++column) {\n      base::span(y)[row * y_stride + column] =\n          kYuv[(row / 2 + column / 2) % 3][0];\n    }\n  }\n  for (int row = 0; row < 2; ++row) {\n    for (int column = 0; column < 3; ++column) {\n      u[row * u_stride + column * uv_pixel_stride] =\n          kYuv[(row + column) % 3][1];\n      v[row * v_stride + column * uv_pixel_stride] =\n          kYuv[(row + column) % 3][2];\n    }\n  }\n  const gfx::Rect crop =\n      odd_crop ? gfx::Rect(1, 1, 3, 3) : gfx::Rect(2, 0, 3, 3);\n  PushI420Frame(y, u, v, y_stride, u_stride, v_stride, uv_pixel_stride, crop);\n  const auto& [result, frame] = CaptureFrame();\n  ASSERT_EQ(result, webrtc::DesktopCapturer::Result::SUCCESS);\n  ASSERT_TRUE(frame);\n  ASSERT_EQ(frame->size().width(), crop.width());\n  ASSERT_EQ(frame->size().height(), crop.height());\n  EXPECT_EQ(frame->pixel_format(), webrtc::FOURCC_ABGR);\n  EXPECT_EQ(frame->capture_time_ms(), 0);\n  const webrtc::DesktopRegion region(\n      webrtc::DesktopRect::MakeSize(frame->size()));\n  EXPECT_TRUE(frame->updated_region().Equals(region));\n  // SAFETY: BasicDesktopFrame owns str