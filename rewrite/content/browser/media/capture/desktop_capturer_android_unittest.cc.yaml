    replace: "}  // namespace\n\nnamespace content {\n\nclass ScreenCaptureDocumentRegistryTest : public RenderViewHostTestHarness {\n public:\n  void SetUp() override {\n    RenderViewHostTestHarness::SetUp();\n    NavigateAndCommit(GURL(\"https://capture.test/\"));\n  }\n\n  void TearDown() override {\n    ReleaseScreenCaptureDocument(kSourceId);\n    ReleaseScreenCaptureDocument(kSourceId + 1);\n    RenderViewHostTestHarness::TearDown();\n  }\n\n  bool Register(RenderFrameHost* frame, int32_t id = kSourceId) {\n    return RegisterScreenCaptureDocument(\n        web_contents(), frame, id,\n        base::BindOnce([](int* revoked) { ++*revoked; }, &revocations_));\n  }\n\n protected:\n  int revocations_ = 0;\n};\n\nTEST_F(ScreenCaptureDocumentRegistryTest,\n       RejectsMissingInvalidAndDuplicateSource) {\n  EXPECT_FALSE(Register(nullptr));\n  EXPECT_FALSE(Register(main_rfh(), 0));\n  ASSERT_TRUE(Register(main_rfh()));\n  EXPECT_FALSE(Register(main_rfh()));\n  ReleaseScreenCaptureDocument(kSourceId);\n  EXPECT_EQ(0, revocations_);\n}\n\nTEST_F(ScreenCaptureDocumentRegistryTest,\n       SubframeNavigationRevokesOnlyItsGrant) {\n  auto* child =\n      RenderFrameHostTester::For(main_rfh())->AppendChild(\"requester\");\n  ASSERT_TRUE(Register(child));\n  ASSERT_TRUE(Register(main_rfh(), kSourceId + 1));\n  auto navigation = NavigationSimulator::CreateRendererInitiated(\n      GURL(\"https://capture.test/replacement\"), child);\n  navigation->Start();\n  EXPECT_EQ(1, revocations_);\n  navigation->Commit();\n  EXPECT_EQ(1, revocations_);\n  // Explicit normal release of the main-frame grant must not revoke it.\n  ReleaseScreenCaptureDocument(kSourceId + 1);\n  EXPECT_EQ(1, revocations_);\n}\n\nTEST_F(ScreenCaptureDocumentRegistryTest,\n       SameDocumentAndOtherFrameNavigationPreserveGrant) {\n  ASSERT_TRUE(Register(main_rfh()));\n  auto navigation = NavigationSimulator::CreateRendererInitiated(\n      GURL(\"https://capture.test/#same\"), main_rfh());\n  navigation->CommitSameDocument();\n  auto* child =\n      RenderFrameHostTester::For(main_rfh())->AppendChild(\"unrelated\");\n  NavigationSimulator::NavigateAndCommitFromDocument(\n      GURL(\"https://capture.test/child\"), child);\n  EXPECT_EQ(0, revocations_);\n}\n\nTEST_F(ScreenCaptureDocumentRegistryTest, DeletedSubframeRevokesExactlyOnce) {\n  auto* child =\n      RenderFrameHostTester::For(main_rfh())->AppendChild(\"requester\");\n  ASSERT_TRUE(Register(child));\n  RenderFrameHostTester::For(child)->Detach();\n  EXPECT_EQ(1, revocations_);\n  ReleaseScreenCaptureDocument(kSourceId);\n  EXPECT_EQ(1, revocations_);\n}\n\nTEST_F(ScreenCaptureDocumentRegistryTest,\n       CallbackMayReleaseItsOwnRegistryEntry) {\n  ASSERT_TRUE(RegisterScreenCaptureDocument(\n      web_contents(), main_rfh(), kSourceId,\n      base::BindOnce(\n          [](int* revoked) {\n            ReleaseScreenCaptureDocument(kSourceId);\n            ++*revoked;\n          },\n          &revocations_)));\n  NavigateAndCommit(GURL(\"https://capture.test/replacement\"));\n  EXPECT_EQ(1, revocations_);\n}\n\nclass MockDesktopCapturerAndroidJni\n    : public DesktopCapturerAndroidJniInterface {\n public:\n  ~MockDesktopCapturerAndroidJni() override = default;\n"
