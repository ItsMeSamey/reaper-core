- description: Bind Android capture consent and frame delivery to its owned lifetime.
  regex:
    pattern: "    int32_t unchecked_crop_left,\n    int32_t unchecked_crop_top,\n    int32_t unchecked_crop_right,\n    int32_t unchecked_crop_bottom) {\n  // TODO(crbug.com/352187279): Implement processing of I420 frames.\n  NOTREACHED();\n}\n\nvoid DesktopCapturerAndroid::OnStop(JNIEnv* env) {\n  Shutdown();\n}\n\nvoid DesktopCapturerAndroid::Shutdown() {\n  CHECK(!finishing_);\n  finishing_ = true;\n}\n\nvoid DesktopCapturerAndroid::ProcessRgbaFrame(int64_t timestamp_ns,\n                                              PlaneInfo plane) {\n"
    replace: "    int32_t unchecked_crop_left,\n    int32_t unchecked_crop_top,\n    int32_t unchecked_crop_right,\n    int32_t unchecked_crop_bottom) {\n  base::ScopedClosureRunner release(base::BindOnce(\n      &jni_zero::RunRunnable,\n      base::android::ScopedJavaGlobalRef<jobject>(env, release_cb)));\n  if (finishing_) {\n    return;\n  }\n\n  // YUV_420_888 has one-byte Y pixels and matching U/V pixel strides.\n  if (unchecked_crop_left < 0 || unchecked_crop_top < 0 ||\n      unchecked_crop_right <= unchecked_crop_left ||\n      unchecked_crop_bottom <= unchecked_crop_top ||\n      unchecked_crop_right > media::limits::kMaxDimension ||\n      unchecked_crop_bottom > media::limits::kMaxDimension ||\n      y_unchecked_pixel_stride != 1 ||\n      (u_unchecked_pixel_stride != 1 && u_unchecked_pixel_stride != 2) ||\n      u_unchecked_pixel_stride != v_unchecked_pixel_stride) {\n    Shutdown();\n    return;\n  }\n\n  // Convert from a chroma-aligned origin so odd crops retain the original\n  // two-by-two chroma sampling. Remove the leading edge after conversion.\n  const int left = unchecked_crop_left & ~1;\n  const int top = unchecked_crop_top & ~1;\n  const int width = unchecked_crop_right - left;\n  const int height = unchecked_crop_bottom - top;\n  if (int64_t{width} * height > media::limits::kMaxCanvas) {\n    Shutdown();\n    return;\n  }\n  const auto y =\n      GetCroppedPlaneData(env, y_buf, y_unchecked_pixel_stride,\n                          y_unchecked_row_stride, left, top, width, height);\n  const auto u = GetCroppedPlaneData(env, u_buf, u_unchecked_pixel_stride,\n                                     u_unchecked_row_stride, left / 2, top / 2,\n                                     (width + 1) / 2, (height + 1) / 2);\n  const auto v = GetCroppedPlaneData(env, v_buf, v_unchecked_pixel_stride,\n                                     v_unchecked_row_stride, left / 2, top / 2,\n                                     (width + 1) / 2, (height + 1) / 2);\n  if (!y || !u || !v) {\n    Shutdown();\n    return;\n  }\n\n  auto converted = std::make_unique<webrtc::BasicDesktopFrame>(\n      webrtc::DesktopSize(width, height), webrtc::FOURCC_ABGR);\n  if (libyuv::Android420ToABGR(\n          y->data(), y_unchecked_row_stride, u->data(), u_unchecked_row_stride,\n          v->data(), v_unchecked_row_stride, u_unchecked_pixel_stride,\n          converted->data(), converted->stride(), width, height) != 0) {\n    Shutdown();\n    return;\n  }\n\n  const webrtc::DesktopVector offset(unchecked_crop_left - left,\n                                     unchecked_crop_top - top);\n  if (offset.is_zero()) {\n    next_frame_ = std::move(converted);\n  } else {\n    const webrtc::DesktopSize size(unchecked_crop_right - unchecked_crop_left,\n                                   unchecked_crop_bottom - unchecked_crop_top);\n    next_frame_ =\n        std::make_unique<webrtc::BasicDesktopFrame>(size, webrtc::FOURCC_ABGR);\n    next_frame_->CopyPixelsFrom(*converted, offset,\n                                webrtc::DesktopRect::MakeSize(size));\n  }\n  SetFrameMetadata(*next_frame_, timestamp_ns);\n}\n\nvoid DesktopCapturerAndroid::OnStop(JNIEnv* env) {\n  Shutdown();\n}\n\nvoid DesktopCapturerAndroid::Shutdown() {\n  finishing_ = true;\n  next_frame_.reset();\n}\n\nvoid DesktopCapturerAndroid::SetFrameMetadata(webrtc::DesktopFrame& frame,\n                                              int64_t timestamp_ns) {\n  // We don't have access to this information to Android, but this is only\n  // used for mouse cursor stuff, which we don't support currently.\n  frame.set_top_left(webrtc::DesktopVector());\n\n  // We don't have damage information on Android, so damage the whole frame.\n  frame.mutable_updated_region()->SetRect(\n      webrtc::DesktopRect::MakeSize(frame.size()));\n\n  // TODO(crbug.com/352187279): Set DPI based on display.\n  frame.set_dpi(webrtc::DesktopVector());\n\n  // TODO(crbug.com/352187279): The cursor is captured for screen capture but\n  // not for window capture. Currently there is no way to determine if we are\n  // doing screen or window capture on Android. If we can determine this and set\n  // it conditionally here we also need a way to get the cursor position by\n  // implementing `MouseCursorMonitor`.\n  frame.set_may_contain_cursor(true);\n\n  // Calculate the time delta from the previous frame's timestamp. It does not\n  // seem guaranteed that the timestamp we get from Android is always monotonic,\n  // and there's no guarantee about how it is not monotonic (e.g. unsigned\n  // wrapping), so don't provide a timestamp in this case.\n  if (last_frame_time_ns_ == 0 || timestamp_ns <= last_frame_time_ns_) {\n    frame.set_capture_time_ms(0);\n  } else {\n    frame.set_capture_time_ms((timestamp_ns - last_frame_time_ns_) /\n                              base::Time::kNanosecondsPerMillisecond);\n  }\n  last_frame_time_ns_ = timestamp_ns;\n\n  // TODO(crbug.com/352187279): Create `DesktopCapturerId` for Android.\n  frame.set_capturer_id(webrtc::DesktopCapturerId::kUnknown);\n\n  // There is no way to get an ICC profile on Android.\n  frame.set_icc_profile({});\n}\n\nvoid DesktopCapturerAndroid::ProcessRgbaFrame(int64_t timestamp_ns,\n                                              PlaneInfo plane) {\n"
