  regex:
    pattern: "// found in the LICENSE file.\n\n#include \"content/browser/media/capture/desktop_capturer_android.h\"\n\n#include \"base/android/callback_android.h\"\n#include \"base/android/jni_android.h\"\n#include \"base/android/jni_bytebuffer.h\"\n#include \"base/numerics/checked_math.h\"\n#include \"third_party/webrtc/api/video/video_common.h\"\n\n// Must come after all headers that specialize FromJniType() / ToJniType().\n#include \"content/public/android/content_jni_headers/ScreenCapture_jni.h\"\n\nnamespace content {\n\nnamespace {\n\nclass DesktopCapturerAndroidJni : public DesktopCapturerAndroidJniInterface {\n public:\n  ~DesktopCapturerAndroidJni() override = default;\n"
    replace: "// found in the LICENSE file.\n\n#include \"content/browser/media/capture/desktop_capturer_android.h\"\n\n#include <map>\n\n#include \"base/android/callback_android.h\"\n#include \"base/android/jni_android.h\"\n#include \"base/android/jni_bytebuffer.h\"\n#include \"base/containers/span.h\"\n#include \"base/functional/bind.h\"\n#include \"base/functional/callback_helpers.h\"\n#include \"base/no_destructor.h\"\n#include \"base/numerics/checked_math.h\"\n#include \"base/numerics/safe_conversions.h\"\n#include \"content/public/browser/browser_thread.h\"\n#include \"content/public/browser/navigation_handle.h\"\n#include \"content/public/browser/render_frame_host.h\"\n#include \"content/public/browser/weak_document_ptr.h\"\n#include \"content/public/browser/web_contents.h\"\n#include \"content/public/browser/web_contents_observer.h\"\n#include \"media/base/limits.h\"\n#include \"third_party/libyuv/include/libyuv/convert_argb.h\"\n#include \"third_party/webrtc/api/video/video_common.h\"\n\n// Must come after all headers that specialize FromJniType() / ToJniType().\n#include \"content/public/android/content_jni_headers/ScreenCapture_jni.h\"\n\nnamespace content {\n\nnamespace {\n\n// A Java WebContents observer alone cannot see a requesting subframe enter\n// BFCache, navigate, or disappear. Keep the original document until grant\n// expiry or projection completion, including after the picker itself has been\n// destroyed.\nclass ScreenCaptureDocumentObserver final : public WebContentsObserver {\n public:\n  static bool Register(WebContents* owner,\n                       RenderFrameHost* frame,\n                       int32_t source_id,\n                       base::OnceClosure on_revoke) {\n    DCHECK_CURRENTLY_ON(BrowserThread::UI);\n    if (!owner || owner->IsBeingDestroyed() || !frame || !frame->IsActive() ||\n        WebContents::FromRenderFrameHost(frame) != owner || source_id <= 0 ||\n        !on_revoke || Observers().contains(source_id)) {\n      return false;\n    }\n    Observers().emplace(source_id,\n                        std::make_unique<ScreenCaptureDocumentObserver>(\n                            frame, source_id, std::move(on_revoke)));\n    return true;\n  }\n\n  static void Release(int32_t source_id) {\n    DCHECK_CURRENTLY_ON(BrowserThread::UI);\n    Observers().erase(source_id);\n  }\n\n  ScreenCaptureDocumentObserver(RenderFrameHost* frame,\n                                int32_t source_id,\n                                base::OnceClosure on_revoke)\n      : WebContentsObserver(WebContents::FromRenderFrameHost(frame)),\n        document_(frame->GetWeakDocumentPtr()),\n        frame_id_(frame->GetGlobalId()),\n        source_id_(source_id),\n        on_revoke_(std::move(on_revoke)) {}\n\n  void DidStartNavigation(NavigationHandle* navigation) override {\n    auto* frame = document_.AsRenderFrameHostIfValid();\n    if (!frame ||\n        (!navigation->IsSameDocument() &&\n         navigation->GetFrameTreeNodeId() == frame->GetFrameTreeNodeId())) {\n      Revoke();\n    }\n  }\n\n  void DidFinishNavigation(NavigationHandle* navigation) override {\n    if (!document_.AsRenderFrameHostIfValid())\n      Revoke();\n  }\n\n  void RenderFrameHostStateChanged(\n      RenderFrameHost* frame,\n      RenderFrameHost::LifecycleState old_state,\n      RenderFrameHost::LifecycleState new_state) override {\n    if (frame->GetGlobalId() == frame_id_ &&\n        new_state != RenderFrameHost::LifecycleState::kActive)\n      Revoke();\n  }\n\n  void RenderFrameDeleted(RenderFrameHost* frame) override {\n    if (frame->GetGlobalId() == frame_id_)\n      Revoke();\n  }\n\n  void WebContentsDestroyed() override { Revoke(); }\n\n private:\n  static std::map<int32_t, std::unique_ptr<ScreenCaptureDocumentObserver>>&\n  Observers() {\n    static base::NoDestructor<\n        std::map<int32_t, std::unique_ptr<ScreenCaptureDocumentObserver>>>\n        observers;\n    return *observers;\n  }\n\n  void Revoke() {\n    DCHECK_CURRENTLY_ON(BrowserThread::UI);\n    auto it = Observers().find(source_id_);\n    if (it == Observers().end() || it->second.get() != this)\n      return;\n    // Remove the entry before Java can synchronously release it. Keep this\n    // observer alive until the callback returns, with no remaining\n    // observations.\n    auto keep_alive = std::move(it->second);\n    Observers().erase(it);\n    Observe(nullptr);\n    std::move(on_revoke_).Run();\n  }\n\n  const WeakDocumentPtr document_;\n  const GlobalRenderFrameHostId frame_id_;\n  const int32_t source_id_;\n  base::OnceClosure on_revoke_;\n};\n\n// Android planes may omit the final row's padding from their ByteBuffer.\nstd::optional<base::span<const uint8_t>> GetCroppedPlaneData(\n    JNIEnv* env,\n    const base::android::JavaRef<jobject>& buffer,\n    int pixel_stride,\n    int row_stride,\n    int left,\n    int top,\n    int width,\n    int height) {\n  if (buffer.is_null() || pixel_stride <= 0 || row_stride <= 0 || left < 0 ||\n      top < 0 || width <= 0 || height <= 0) {\n    return std::nullopt;\n  }\n  auto bytes = base::android::MaybeJavaByteBufferToSpan(env, buffer);\n  if (!bytes) {\n    return std::nullopt;\n  }\n  const auto row_end =\n      (base::CheckedNumeric<size_t>(left) + width - 1) * pixel_stride + 1;\n  size_t checked_row_end;\n  size_t checked_end;\n  size_t checked_offset;\n  if (!row_end.AssignIfValid(&checked_row_end) ||\n      checked_row_end > static_cast<size_t>(row_stride) ||\n      !((base::CheckedNumeric<size_t>(top) + height - 1) * row_stride + row_end)\n           .AssignIfValid(&checked_end) ||\n      checked_end > bytes->size() ||\n      !(base::CheckedNumeric<size_t>(top) * row_stride +\n        base::CheckedNumeric<size_t>(left) * pixel_stride)\n           .AssignIfValid(&checked_offset)) {\n    return std::nullopt;\n  }\n  return bytes->subspan(checked_offset, checked_end - checked_offset);\n}\n\nclass DesktopCapturerAndroidJni : public DesktopCapturerAndroidJniInterface {\n public:\n  ~DesktopCapturerAndroidJni() override = default;\n"
