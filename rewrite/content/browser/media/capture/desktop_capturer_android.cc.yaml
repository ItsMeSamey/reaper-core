- description: Bind Android capture consent and frame delivery to its owned lifetime.
  regex:
    pattern: "    std::unique_ptr<DesktopCapturerAndroidJniInterface> jni_interface)\n    : jni_interface_(std::move(jni_interface)) {}\n\nDesktopCapturerAndroid::~DesktopCapturerAndroid() {\n  JNIEnv* env = base::android::AttachCurrentThread();\n  jni_interface_->Destroy(env, screen_capture_);\n}\n\nvoid DesktopCapturerAndroid::Start(Callback* callback) {\n  callback_ = callback;\n\n  JNIEnv* env = base::android::AttachCurrentThread();\n  screen_capture_.Reset(\n      jni_interface_->Create(env, reinterpret_cast<intptr_t>(this)));\n\n  if (!jni_interface_->StartCapture(env, screen_capture_)) {\n    // Error immediately if we can't start capture.\n    finishing_ = true;\n  }\n}\n\nvoid DesktopCapturerAndroid::SetSharedMemoryFactory(\n"
    replace: "    std::unique_ptr<DesktopCapturerAndroidJniInterface> jni_interface)\n    : jni_interface_(std::move(jni_interface)) {}\n\nDesktopCapturerAndroid::~DesktopCapturerAndroid() {\n  if (!screen_capture_.is_null()) {\n    JNIEnv* env = base::android::AttachCurrentThread();\n    jni_interface_->Destroy(env, screen_capture_);\n  }\n}\n\nvoid DesktopCapturerAndroid::Start(Callback* callback) {\n  CHECK(callback);\n  // A consumed picker grant cannot be used to start another session.\n  if (callback_) {\n    Shutdown();\n    return;\n  }\n  callback_ = callback;\n  if (finishing_ || !source_id_) {\n    Shutdown();\n    return;\n  }\n\n  JNIEnv* env = base::android::AttachCurrentThread();\n  screen_capture_.Reset(\n      jni_interface_->Create(env, reinterpret_cast<intptr_t>(this)));\n\n  if (screen_capture_.is_null() ||\n      !jni_interface_->StartCapture(env, screen_capture_, *source_id_)) {\n    Shutdown();\n  }\n}\n\nvoid DesktopCapturerAndroid::SetSharedMemoryFactory(\n"
