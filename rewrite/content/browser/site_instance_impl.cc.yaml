substitutions:
  - description: "Include the Android build flag for scoped container initialization."
    count: 1
    regex:
      pattern: "#include \"content/browser/bad_message.h\""
      replace: "#include \"build/build_config.h\"\n#include \"content/browser/bad_message.h\""
  - description: "Preserve the known container partition for an unassigned Android SiteInstance."
    count: 1
    regex:
      pattern: "  CHECK(browsing_instance, base::NotFatalUntil::M158);\n}\n\nSiteInstanceImpl::~SiteInstanceImpl()"
      replace: "  CHECK(browsing_instance, base::NotFatalUntil::M158);\n#if BUILDFLAG(IS_ANDROID)\n  // Native pages can leave a related SiteInstance unassigned. Keep its security\n  // principal in the already admitted container partition without assigning a\n  // site or registering this instance with the BrowsingInstance.\n  const auto& partition_config = browsing_instance_->storage_partition_config_;\n  if (browsing_instance_->is_fixed_storage_partition() &&\n      !GetIsolationContext().is_guest() && !GetIsolationContext().is_fenced() &&\n      partition_config && !partition_config->is_default() &&\n      GetContentClient()->browser()->ShouldInheritStoragePartition(\n          *partition_config)) {\n    site_info_ = SiteInfo(GetBrowserContext(), *partition_config);\n  }\n#endif\n}\n\nSiteInstanceImpl::~SiteInstanceImpl()"
  - description: "Use existing public SiteInfo constructor for Android unassigned container partition"
    count: 1
    regex:
      pattern: "    site_info_ = SiteInfo(GetBrowserContext(), *partition_config);\n"
      replace: "    site_info_ = SiteInfo(\n        AgentClusterKey(), /*site_url=*/GURL(), /*is_sandboxed=*/false,\n        UrlInfo::kInvalidUniqueSandboxId, *partition_config,\n        WebExposedIsolationInfo::CreateNonIsolated(),\n        WebExposedIsolationLevel::kNotIsolated, /*is_guest=*/false,\n        /*does_site_request_dedicated_process_for_coop=*/false,\n        /*is_jit_disabled=*/false, /*are_v8_optimizations_disabled=*/false,\n        /*is_fenced=*/false, GetBrowserContext()->UniqueToken(),\n        EmbedderIsolationInfo::CreateNone());\n"
