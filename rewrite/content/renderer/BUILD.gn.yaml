substitutions:
- description: Exclude dedicated renderer annotator, stopwords, processing/Mojom dependencies and annotation strings on Android
  regex:
    pattern: "  if (is_android) {\n    deps += [\n      # Used by Android WebView only."
    replace: "  if (is_android) {\n    sources -= [\n      \"accessibility/annotations/ax_image_annotator.cc\",\n      \"\
      accessibility/annotations/ax_image_annotator.h\",\n      \"accessibility/annotations/ax_image_stopwords.cc\",\n    \
      \  \"accessibility/annotations/ax_image_stopwords.h\",\n    ]\n    deps -= [\n      \"//services/image_annotation/public/cpp\"\
      ,\n      \"//services/image_annotation/public/mojom\",\n      \"//ui/strings:auto_image_annotation_strings_grit\",\n\
      \    ]\n\n    deps += [\n      # Used by Android WebView only."
  count: 1
