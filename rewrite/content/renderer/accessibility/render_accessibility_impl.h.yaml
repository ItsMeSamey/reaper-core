substitutions:
- description: Include the platform build flags directly for the Android member boundary
  regex:
    pattern: '#include "base/time/time.h"

      '
    replace: '#include "base/time/time.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Remove annotation-only tutor/debug state from the Android renderer object
  regex:
    pattern: "  // The AxID of the first unlabeled image we have encountered in this tree.\n  //\n  // Used to ensure that\
      \ the tutor message that explains to screen reader users\n  // how to turn on automatic image labels is provided only\
      \ once.\n  mutable std::optional<int32_t> first_unlabeled_image_id_ = std::nullopt;\n\n  // Whether we should highlight\
      \ annotation results visually on the page\n  // for debugging.\n  bool image_annotation_debugging_ = false;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // The AxID of the first unlabeled image we have encountered in this tree.\n \
      \ //\n  // Used to ensure that the tutor message that explains to screen reader users\n  // how to turn on automatic\
      \ image labels is provided only once.\n  mutable std::optional<int32_t> first_unlabeled_image_id_ = std::nullopt;\n\n\
      \  // Whether we should highlight annotation results visually on the page\n  // for debugging.\n  bool image_annotation_debugging_\
      \ = false;\n#endif\n"
  count: 1
- description: Keep the dedicated annotation test friendship only with its non-Android fixture
  regex:
    pattern: '  friend class AXImageAnnotatorTest;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  friend class AXImageAnnotatorTest;\n#endif\n"
  count: 1
