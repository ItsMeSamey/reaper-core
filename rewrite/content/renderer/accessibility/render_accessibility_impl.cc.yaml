substitutions:
- description: Retain the ordinary DCHECK document lifecycle guard on Android without annotation-debug state
  regex:
    pattern: "  // (Skip if image_annotation_debugging_ is enabled because it adds\n  // style attributes to images, affecting\
      \ the document lifecycle\n  // during accessibility.)\n  std::unique_ptr<blink::WebDisallowTransitionScope> disallow;\n\
      \  if (!image_annotation_debugging_) {\n    disallow = std::make_unique<blink::WebDisallowTransitionScope>(&document);\n\
      \  }\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  blink::WebDisallowTransitionScope disallow(&document);\n#else\n  // (Skip if image_annotation_debugging_\
      \ is enabled because it adds\n  // style attributes to images, affecting the document lifecycle\n  // during accessibility.)\n\
      \  std::unique_ptr<blink::WebDisallowTransitionScope> disallow;\n  if (!image_annotation_debugging_) {\n    disallow\
      \ = std::make_unique<blink::WebDisallowTransitionScope>(&document);\n  }\n#endif\n"
  count: 1
