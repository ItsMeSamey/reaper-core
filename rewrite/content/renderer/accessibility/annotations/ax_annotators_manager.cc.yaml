substitutions:
- description: Use the complete generic AXAnnotator interface without the removed Android image annotator
  regex:
    pattern: '#include "content/renderer/accessibility/annotations/ax_image_annotator.h"

      '
    replace: '#if BUILDFLAG(IS_ANDROID)

      #include "content/renderer/accessibility/annotations/ax_annotator.h"

      #else

      #include "content/renderer/accessibility/annotations/ax_image_annotator.h"

      #endif

      '
  count: 1
- description: Construct no dedicated image annotator on Android; retain other annotator loops and construction
  regex:
    pattern: "  ax_annotators_.emplace_back(\n      std::make_unique<AXImageAnnotator>(render_accessibility_));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  ax_annotators_.emplace_back(\n      std::make_unique<AXImageAnnotator>(render_accessibility_));\n\
      #endif\n"
  count: 1
