substitutions:
- description: 'Register sandboxed Android PWG conversion service #include "chrome/services/printing/printing_service.h"'
  regex:
    re_pattern: '\#if\ BUILDFLAG\(ENABLE_PRINT_PREVIEW\)\ \|\|\ \\\

      \ \ \ \ \(BUILDFLAG\(ENABLE_PRINTING\)\ \&\&\ BUILDFLAG\(IS_WIN\)\)\

      \#include\ "chrome/services/printing/printing_service\.h"'
    replace: "#if BUILDFLAG(ENABLE_PRINT_PREVIEW) || \\\\\n    (BUILDFLAG(ENABLE_PRINTING) && BUILDFLAG(IS_WIN)) || \\\\\n    (BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE))\n#include \"chrome/services/printing/printing_service.h\""
- description: Register sandboxed Android PWG conversion service auto RunPrintingService(
  regex:
    re_pattern: '\#if\ BUILDFLAG\(ENABLE_PRINT_PREVIEW\)\ \|\|\ \\\

      \ \ \ \ \(BUILDFLAG\(ENABLE_PRINTING\)\ \&\&\ BUILDFLAG\(IS_WIN\)\)\

      auto\ RunPrintingService\('
    replace: "#if BUILDFLAG(ENABLE_PRINT_PREVIEW) || \\\\\n    (BUILDFLAG(ENABLE_PRINTING) && BUILDFLAG(IS_WIN)) || \\\\\n    (BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE))\nauto RunPrintingService("
- description: Register sandboxed Android PWG conversion service   services.Add(RunPrintingService);
  regex:
    re_pattern: '\#if\ BUILDFLAG\(ENABLE_PRINT_PREVIEW\)\ \|\|\ \\\

      \ \ \ \ \(BUILDFLAG\(ENABLE_PRINTING\)\ \&\&\ BUILDFLAG\(IS_WIN\)\)\

      \ \ services\.Add\(RunPrintingService\);'
    replace: "#if BUILDFLAG(ENABLE_PRINT_PREVIEW) || \\\\\n    (BUILDFLAG(ENABLE_PRINTING) && BUILDFLAG(IS_WIN)) || \\\\\n    (BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE))\n  services.Add(RunPrintingService);"

