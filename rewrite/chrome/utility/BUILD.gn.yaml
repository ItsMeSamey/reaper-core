substitutions:
- description: Add the brave/utility sources to `static_library("utility")`.
  add_literal_to_list:
    target: utility
    list_name: sources
    literal: brave_utility_sources
    import: //brave/utility/sources.gni
- description: Add the brave/utility deps to `static_library("utility")`.
  add_literal_to_list:
    target: utility
    list_name: deps
    literal: brave_utility_deps
    import: //brave/utility/sources.gni
- description: Add the brave/utility public_deps to `static_library("utility")`.
  add_literal_to_list:
    target: utility
    list_name: public_deps
    literal: brave_utility_public_deps
    import: //brave/utility/sources.gni
- description: Link the PWG-only printing utility on Android extension builds.
  regex:
    re_pattern: '\ \ \ \ if\ \(!is_android\)\ \{\

      \ \ \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ \ \ "//chrome/services/printing:lib",'
    replace: "    if (!is_android || enable_extensions_core) {\n      deps += [\n        \"//chrome/services/printing:lib\","

- description: 'Android concrete AI source/provider removal: chrome/utility/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//third_party/zlib/google:zip",\

      \ \ \ \ "//ui/base:buildflags",\

      \ \ \]\

      \ \ deps\ \+=\ brave_utility_deps\

      \

      \ \ if\ \(is_win\)\ \{\

      '
    replace: "    \"//third_party/zlib/google:zip\",\n    \"//ui/base:buildflags\",\n  ]\n  if (is_android) {\n    deps -= [ \"//components/private_ai/oak_session_service\" ]\n  }\n  deps += brave_utility_deps\n\n  if (is_win) {\n"
- description: Reviewed literal source edit 1
  regex:
    pattern: "\n  if (is_android) {\n    deps += [ \"//chrome/services/readaloud\" ]\n  }\n"
    replace: ''
  count: 1
