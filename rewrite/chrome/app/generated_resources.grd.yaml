- description: Use the actual Android Extensions menu in the install success dialog
  regex:
    pattern: "        <if expr=\"not is_chromeos and not is_macosx\">\n          <message\
      \ name=\"IDS_EXTENSION_INSTALLED_MANAGE_INFO\" desc=\"Text displayed in the\
      \ InfoBubble with instructions on how to find the chrome://extensions/ management\
      \ page\">\n            Manage your extensions by clicking Extensions in the\
      \ Tools menu.\n          </message>\n        </if>\n"
    replace: "        <if expr=\"is_android\">\n          <message name=\"IDS_EXTENSION_INSTALLED_MANAGE_INFO\"\
      \ desc=\"Text displayed in the post install dialog explaining how to open Extensions\
      \ from the three-dot main menu on Android.\">\n            Manage your extensions\
      \ by tapping Extensions in the three-dot menu.\n          </message>\n     \
      \   </if>\n        <if expr=\"not is_android and not is_chromeos and not is_macosx\"\
      >\n          <message name=\"IDS_EXTENSION_INSTALLED_MANAGE_INFO\" desc=\"Text\
      \ displayed in the InfoBubble with instructions on how to find the chrome://extensions/\
      \ management page\">\n            Manage your extensions by clicking Extensions\
      \ in the Tools menu.\n          </message>\n        </if>\n"
  count: 1
