substitutions:
  - description: "Exclude developer AI sidebar promotion text on Android."
    regex:
      pattern: "  <message name=\"IDS_EXTENSIONS_MODERN_WEB_GUIDANCE_PROMO\" desc=\"The promotional text displayed in the sidebar of the chrome://extensions page when Developer Mode is enabled. It encourages developers to download the Chrome Extensions and Chrome Web Store skill for their AI coding agents to get latest API updates and best practices.\">\n    Using AI coding agents to build extensions? Install the <ph name=\"BEGIN_LINK\">&lt;a target=\"_blank\" href=\"$1\"&gt;</ph><ph name=\"CHROME_EXTENSIONS\">Chrome Extensions<ex>Chrome Extensions</ex></ph> and <ph name=\"WEB_STORE_SKILL\">Chrome Web Store skill<ex>Chrome Web Store skill</ex></ph><ph name=\"END_LINK\">&lt;/a&gt;</ph> to teach your coding agent the latest API updates and best practices.\n  </message>\n"
      replace: "<if expr=\"not is_android\">\n  <message name=\"IDS_EXTENSIONS_MODERN_WEB_GUIDANCE_PROMO\" desc=\"The promotional text displayed in the sidebar of the chrome://extensions page when Developer Mode is enabled. It encourages developers to download the Chrome Extensions and Chrome Web Store skill for their AI coding agents to get latest API updates and best practices.\">\n    Using AI coding agents to build extensions? Install the <ph name=\"BEGIN_LINK\">&lt;a target=\"_blank\" href=\"$1\"&gt;</ph><ph name=\"CHROME_EXTENSIONS\">Chrome Extensions<ex>Chrome Extensions</ex></ph> and <ph name=\"WEB_STORE_SKILL\">Chrome Web Store skill<ex>Chrome Web Store skill</ex></ph><ph name=\"END_LINK\">&lt;/a&gt;</ph> to teach your coding agent the latest API updates and best practices.\n  </message>\n</if>\n"
    count: 1
  - description: Android explicit local CRX picker and ordinary result handling
    regex:
      pattern: "    Got it\n  </message>\n</if>\n</grit-part>\n"
      replace: "    Got it\n  </message>\n</if>\n  <if expr=\"is_android\">\n    <message name=\"IDS_EXTENSIONS_INSTALL_CRX\" desc=\"Button to choose a local signed extension package on Android.\">\n      Install CRX…\n    </message>\n    <message name=\"IDS_EXTENSIONS_INSTALL_CRX_DONE\" desc=\"Installation completed. This does not imply the extension is enabled.\">\n      Extension installed. Review its status in Extensions.\n    </message>\n    <message name=\"IDS_EXTENSIONS_INSTALL_CRX_FILE_ERROR\" desc=\"Error when a selected local extension package does not have the CRX extension.\">\n      Choose a .crx extension package.\n    </message>\n    <message name=\"IDS_EXTENSIONS_INSTALL_CRX_ERROR\" desc=\"Fallback when a local extension package could not be installed.\">\n      The extension could not be installed.\n    </message>\n  </if>\n</grit-part>\n"
    count: 1
  - description: Recover Android extension manager initialization with explicit retry and retained successful data
    regex:
      re_pattern: '\ \ <message\ name="IDS_EXTENSIONS_ITEM_RELOADING"\ desc="Text\ displayed\ in\ a\ toast\ popup\ message\ when\ an\ extension\ is\ reloading\.">\

        \ \ \ \ Reloading\.\.\.\

        \ \ </message>\

        \ \ <message\ name="IDS_EXTENSIONS_LOAD_ERROR_HEADING"\ desc="The\ title\ of\ the\ dialog\ displaying\ the\ error\ when\ loading\ an\ unpacked\ extension\ fails\.">\

        \ \ \ \ Failed\ to\ load\ extension\

        \ \ </message>\

        '
      replace: "  <message name=\"IDS_EXTENSIONS_ITEM_RELOADING\" desc=\"Text displayed in a toast popup message when an extension is reloading.\">\n    Reloading...\n  </message>\n  <if expr=\"is_android\">\n    <message name=\"IDS_EXTENSIONS_MANAGER_LOADING\" desc=\"Status while the Android extensions page loads its list and settings.\">\n      Loading extensions…\n    </message>\n    <message name=\"IDS_EXTENSIONS_MANAGER_LOAD_ERROR\" desc=\"Error on the Android extensions page when its initial list or settings cannot be loaded. A Retry button follows.\">\n      Couldn’t load extensions. Try again.\n    </message>\n  </if>\n  <message name=\"IDS_EXTENSIONS_LOAD_ERROR_HEADING\" desc=\"The title of the dialog displaying the error when loading an unpacked extension fails.\">\n    Failed to load extension\n  </message>\n"

  - description: Report interrupted Android local import without resuming an invalid sender
    regex:
      re_pattern: '\ \ \ \ <message\ name="IDS_EXTENSIONS_INSTALL_CRX_DONE"\ desc="Installation\ completed\.\ This\ does\ not\ imply\ the\ extension\ is\ enabled\.">\

        \ \ \ \ \ \ Extension\ installed\.\ Review\ its\ status\ in\ Extensions\.\

        \ \ \ \ </message>\

        \ \ \ \ <message\ name="IDS_EXTENSIONS_INSTALL_CRX_FILE_ERROR"\ desc="Error\ when\ a\ selected\ local\ extension\ package\ does\ not\ have\ the\ CRX\ extension\.">\

        \ \ \ \ \ \ Choose\ a\ \.crx\ extension\ package\.\

        \ \ \ \ </message>\

        '
      replace: "    <message name=\"IDS_EXTENSIONS_INSTALL_CRX_DONE\" desc=\"Installation completed. This does not imply the extension is enabled.\">\n      Extension installed. Review its status in Extensions.\n    </message>\n    <message name=\"IDS_EXTENSIONS_IMPORT_INTERRUPTED\" desc=\"Notice after an Android local extension import lost its initiating renderer. The user should check current installed extensions before explicitly trying again.\">\n      Extension import was interrupted. Check Extensions before trying again.\n    </message>\n    <message name=\"IDS_EXTENSIONS_INSTALL_CRX_FILE_ERROR\" desc=\"Error when a selected local extension package does not have the CRX extension.\">\n      Choose a .crx extension package.\n    </message>\n"
    count: 1
