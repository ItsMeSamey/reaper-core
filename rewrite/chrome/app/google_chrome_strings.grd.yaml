substitutions:
- description: Remove the standalone Android-only survey invitation resource.
  regex:
    pattern: "      <if expr=\"is_android\">\n        <message name=\"IDS_MESSAGE_ACT_SURVEY_INVITATION\" desc=\"Survey invitation\
      \ text that's shown in a pop up. The user can then ignore the invitation or accept it, which will cause the survey to\
      \ be shown.\">\n          Help us improve Incognito by taking this 1 minute survey.\n        </message>\n      </if>\n"
    replace: ''
  count: 1
- description: Remove the retired Android-only survey resource section comment.
  regex:
    pattern: '      <!-- HaTS invitations on Android -->

      '
    replace: ''
  count: 1
