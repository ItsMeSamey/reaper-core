substitutions:
  - description: Use generated Reaper product artwork only in Android WebUI.
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ <structure\\ type=\"chrome_scaled_image\"\\ name=\"IDR_PRODUCT_LOGO_32\"\\ file=\"\\$\\{branding_path_component\\}/product_logo_32\\.png\"\\ />"
      replace: "      <if expr=\"is_android\">\n        <then>\n          <if expr=\"context == 'default_200_percent'\">\n            <then>\n              <structure type=\"chrome_scaled_image\" name=\"IDR_PRODUCT_LOGO_32\" file=\"${reaper_theme_assets}/default_200_percent/reaper/product_logo_32.png\" />\n            </then>\n            <else>\n              <if expr=\"context == 'default_300_percent'\">\n                <then>\n                  <structure type=\"chrome_scaled_image\" name=\"IDR_PRODUCT_LOGO_32\" file=\"${reaper_theme_assets}/default_300_percent/reaper/product_logo_32.png\" />\n                </then>\n                <else>\n                  <structure type=\"chrome_scaled_image\" name=\"IDR_PRODUCT_LOGO_32\" file=\"${reaper_theme_assets}/default_100_percent/reaper/product_logo_32.png\" />\n                </else>\n              </if>\n            </else>\n          </if>\n        </then>\n        <else>\n          <structure type=\"chrome_scaled_image\" name=\"IDR_PRODUCT_LOGO_32\" file=\"${branding_path_component}/product_logo_32.png\" />\n        </else>\n      </if>"
    count: 1
