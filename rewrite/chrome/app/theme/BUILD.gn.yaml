substitutions:
  - description: Add the Brave theme resources on desktop.
    add_literal_to_list:
      target: webui_theme_resources
      list_name: deps
      literal: '[ "//brave/app/theme:brave_theme_resources" ]'
      conditional: '!is_android'

  - description: |-
      Add the Brave unscaled resources on desktop

      The target declares no `deps` to add a conditional after.
    append_to_target:
      target: chrome_unscaled_resources
      code: |-
        if (!is_android) {
          deps = [ "//brave/app/theme:brave_unscaled_resources" ]
        }
  - description: Use generated Reaper product artwork in Android WebUI resources.
    append_to_target:
      target: theme_resources
      code: |-
        if (is_android) {
          reaper_theme_assets =
              get_label_info("//brave/android/reaper:brand_files", "target_gen_dir") +
              "/brand/theme"
          inputs += [
            "$reaper_theme_assets/default_100_percent/reaper/product_logo_32.png",
            "$reaper_theme_assets/default_200_percent/reaper/product_logo_32.png",
            "$reaper_theme_assets/default_300_percent/reaper/product_logo_32.png",
          ]
          deps += [ "//brave/android/reaper:brand_files" ]
          grit_flags = [
            "-E",
            "reaper_theme_assets=" + rebase_path(reaper_theme_assets,
                                               "//chrome/app/theme/default_100_percent"),
          ]
        }
