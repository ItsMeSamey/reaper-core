substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\

      \ \ \ \ private\ final\ IBrowserNativeMessageService\.Stub\ mBinder\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ new\ IBrowserNativeMessageService\.Stub\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ connectExtension\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ String\ extensionId,\

      '
    replace: "\n    private final IBrowserNativeMessageService.Stub mBinder =\n            new IBrowserNativeMessageService.Stub() {\n                @Override\n                public void connectAuthorizedExtension(\n                        String extensionId,\n                        Bundle extensionInfo,\n                        IConnectExtensionCallback callback) {\n                    // The legacy echo fixture is not an authenticated companion. Do not alias\n                    // this entry to its deliberately permissive legacy connectExtension method.\n                    try {\n                        callback.onError(\"Authenticated companion contract is unsupported\");\n                    } catch (RemoteException e) {\n                        Log.e(TAG, \"RemoteException rejecting authenticated connection\", e);\n                    }\n                }\n\n                @Override\n                public void connectExtension(\n                        String extensionId,\n"
