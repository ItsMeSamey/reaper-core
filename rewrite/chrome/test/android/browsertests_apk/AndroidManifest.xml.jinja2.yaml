# Isolated container browser fixture; ordinary browser-test defaults preserved.
substitutions:
- description: "Keep isolated container browser fixtures in their own test package (1)."
  count: 1
  regex:
    re_pattern: "\\\n\\ \\ \\ \\ <uses\\-feature\\ android:glEsVersion=\"0x00020000\"\\ />\\\n\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.ACCESS_COARSE_LOCATION\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.ACCESS_NETWORK_STATE\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.CAMERA\"\\ />\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.INTERNET\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.MANAGE_EXTERNAL_STORAGE\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.MODIFY_AUDIO_SETTINGS\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.RECEIVE_BOOT_COMPLETED\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.RECORD_AUDIO\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.USE_FINGERPRINT\"\\ />\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.VIBRATE\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.WAKE_LOCK\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.POST_NOTIFICATIONS\"/>\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.WRITE_EXTERNAL_STORAGE\"/>\\\n\\ \\ \\ \\ \\{%\\ block\\ extra_uses_permissions\\ %\\}\\\n\\ \\ \\ \\ \\{%\\ endblock\\ %\\}\\\n\\\n"
    replace: "\n    <uses-feature android:glEsVersion=\"0x00020000\" />\n\n{% if not reaper_isolated_container_browser_tests|default(false) %}\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\n{% endif %}\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n{% if not reaper_isolated_container_browser_tests|default(false) %}\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n{% endif %}\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n{% if not reaper_isolated_container_browser_tests|default(false) %}\n    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\"/>\n{% endif %}\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\"/>\n    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>\n{% if not reaper_isolated_container_browser_tests|default(false) %}\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n{% endif %}\n    <uses-permission android:name=\"android.permission.USE_FINGERPRINT\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\"/>\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>\n{% if not reaper_isolated_container_browser_tests|default(false) %}\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n{% endif %}\n{% if not reaper_isolated_container_browser_tests|default(false) %}\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>\n{% endif %}\n    {% block extra_uses_permissions %}\n    {% endblock %}\n\n"
- description: "Keep isolated container browser fixtures in their own test package (2)."
  count: 1
  regex:
    re_pattern: "\\\n\\ \\ \\ \\ <application\\ android:name=\"org\\.chromium\\.android_browsertests_apk\\.ChromeBrowserTestsApplication\"\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ android:label=\"ChromeBrowserTests\"\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ android:requestLegacyExternalStorage=\"true\">\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ <!\\-\\-\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ The\\ default\\ Activity\\ started\\ by\\ Android\\ browser\\ tests\\.\\\n"
    replace: "\n    <application android:name=\"org.chromium.android_browsertests_apk.ChromeBrowserTestsApplication\"\n            android:label=\"ChromeBrowserTests\"\n{% if not reaper_isolated_container_browser_tests|default(false) %}\n            android:requestLegacyExternalStorage=\"true\"\n{% endif %}\n            >\n\n        <!--\n          The default Activity started by Android browser tests.\n"
- description: "Keep isolated test storage declarations scoped to private cache (1)."
  count: 1
  regex:
    pattern: "    <uses-feature android:glEsVersion=\"0x00020000\" />\n\n"
    replace: "    <uses-feature android:glEsVersion=\"0x00020000\" />\n\n{% if reaper_isolated_container_browser_tests|default(false) %}\n    <!-- Private test data and results never use shared external storage. -->\n    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" tools:node=\"remove\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" tools:node=\"remove\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" tools:node=\"remove\" />\n{% endif %}\n"
- description: "Keep isolated test storage declarations scoped to private cache (2)."
  count: 1
  regex:
    pattern: "{% if not reaper_isolated_container_browser_tests|default(false) %}\n            android:requestLegacyExternalStorage=\"true\"\n{% endif %}"
    replace: "{% if reaper_isolated_container_browser_tests|default(false) %}\n            tools:remove=\"android:requestLegacyExternalStorage\"\n{% else %}\n            android:requestLegacyExternalStorage=\"true\"\n{% endif %}"
