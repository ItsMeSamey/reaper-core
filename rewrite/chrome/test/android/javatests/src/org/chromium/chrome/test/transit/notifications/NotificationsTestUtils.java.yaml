# Android Lens implementation exclusion from regression helpers.
substitutions:
- description: Remove the unused Lens controller import from the retained notifications helper
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensController;\\\n"
    replace: ""
  count: 1
- description: Remove only the obsolete Lens launch branch from the retained notifications helper
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ case\\ TipsNotificationsFeatureType\\.GOOGLE_LENS:\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ LensController\\ lensController\\ =\\ \\(LensController\\)\\ extraArgs\\[0\\];\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ ChromeTabbedActivity\\.interceptMoveTaskToBackForTesting\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ settingsButtonElement\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.clickTo\\(\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.waitForAnd\\(new\\ LensIntentFulfilledCondition\\(lensController\\)\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.exitFacility\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ return\\ null;\\\n"
    replace: ""
  count: 1
