substitutions:
- description: Exclude complete Notebook-owned target definitions from Android
  regex:
    re_pattern: 'build_webui_tests\("build"\)\ \{\

      \ \ cc_test_files\ =\ \[\ "notebooks_internals_browsertest\.cc"\ \]\

      \

      \ \ files\ =\ \[\

      \ \ \ \ "notebooks_internals_test\.ts",\

      \ \ \ \ "test_notebooks_internals_page_handler\.ts",\

      \ \ \]\

      \

      \ \ ts_path_mappings\ =\ \[\ "chrome://notebooks\-internals/\*\|"\ \+\ rebase_path\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "\$root_gen_dir/components/notebooks/internals/webui/resources/tsc/\*",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ target_gen_dir\)\ \]\

      \

      \ \ ts_deps\ =\ \[\

      \ \ \ \ "//components/notebooks/internals/webui/resources:build_ts",\

      \ \ \ \ "//ui/webui/resources/js:build_ts",\

      \ \ \]\

      \}\

      '
    replace: "if (!is_android) {\n  build_webui_tests(\"build\") {\n    cc_test_files\
      \ = [ \"notebooks_internals_browsertest.cc\" ]\n\n    files = [\n      \"notebooks_internals_test.ts\"\
      ,\n      \"test_notebooks_internals_page_handler.ts\",\n    ]\n\n    ts_path_mappings\
      \ = [ \"chrome://notebooks-internals/*|\" + rebase_path(\n                 \
      \            \"$root_gen_dir/components/notebooks/internals/webui/resources/tsc/*\"\
      ,\n                             target_gen_dir) ]\n\n    ts_deps = [\n     \
      \ \"//components/notebooks/internals/webui/resources:build_ts\",\n      \"//ui/webui/resources/js:build_ts\"\
      ,\n    ]\n  }\n}\n"
  count: 1
