      ,\n    \"browser_tests/glic_experimental_triggering_message_handler_browsertest.ts\",\n    \"browser_tests/glic_drag_and_drop_browsertest.ts\"\
      ,\n    \"browser_tests/glic_focus_browsertest.ts\",\n    \"browser_tests/glic_android_browsertest.ts\",\n    \"browser_tests/glic_browser_test_android.ts\"\
      ,\n    \"browser_tests/minimal_client.ts\",\n    \"api_boot.ts\",\n    \"test_client/client.ts\",\n    \"test_client/test_client.ts\"\
      ,\n    \"test_client/page_element_types.ts\",\n    \"test_client/sections/capture_region.ts\",\n    \"test_client/sections/audio_capture.ts\"\
      ,\n    \"test_client/sections/autofill_dialog.ts\",\n    \"test_client/sections/get_page_context.ts\",\n    \"test_client/sections/page_metadata.ts\"\
      ,\n    \"test_client/sections/apc.ts\",\n    \"test_client/sections/multi_tab.ts\",\n    \"test_client/sections/scroll_to.ts\"\
