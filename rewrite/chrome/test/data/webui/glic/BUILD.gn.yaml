      ,\n    \":move_html\",\n    \":test_client_api_deps\",\n    \":test_client_external_files\",\n    \":test_glic_deps\"\
      ,\n  ]\n}\n\nts_library(\"build_extra_ts\") {\n  out_dir = out_dir\n  in_files = [\n    \"browser_tests/browser_test_base.ts\"\
      ,\n    \"browser_tests/geic_api_browsertest.ts\",\n    \"browser_tests/glic_api_browsertest.ts\",\n    \"browser_tests/glic_chrome_tools_browsertest.ts\"\
      ,\n    \"browser_tests/glic_api_skills_browsertest.ts\",\n    \"browser_tests/glic_api_zss_browsertest.ts\",\n    \"\
