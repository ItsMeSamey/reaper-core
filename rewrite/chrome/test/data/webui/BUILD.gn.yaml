substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ if\ \(enable_extensions_core\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "extensions/extensions_browsertest\.cc"\ \]\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/ui/webui/extensions:test_support"\ \]\

      \ \ \}\

      \

      \ \ if\ \(enable_extensions\)\ \{\

      '
    replace: "  if (enable_extensions_core) {\n    sources += [ \"extensions/extensions_browsertest.cc\" ]\n    deps += [ \"//chrome/browser/ui/webui/extensions:test_support\" ]\n    if (is_android && enable_guest_view) {\n      deps += [\n        \"//extensions/browser/api:extensions_api_client\",\n        \"//extensions/common\",\n      ]\n    }\n  }\n\n  if (enable_extensions) {\n"
- description: Exclude Notebook-only browser fixture and provider dependency on Android
  regex:
    re_pattern: '\ \ if\ \(!is_android\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/ui/webui/net_internals:test_support"\
      \]\

      '
    replace: "  if (is_android) {\n    sources -= [ \"notebooks_internals/notebooks_internals_browsertest.cc\"\
      \ ]\n    deps -= [ \"//components/notebooks/public\" ]\n  }\n\n  if (!is_android)\
      \ {\n    deps += [ \"//chrome/browser/ui/webui/net_internals:test_support\"\
      \ ]\n"
  count: 1
- description: Exclude Notebook-only WebUI test resources on Android
  regex:
    re_pattern: '\ \ \ \ "\$target_gen_dir/usb_internals/resources\.grdp",\

      \ \ \]\

      '
    replace: "    \"$target_gen_dir/usb_internals/resources.grdp\",\n  ]\n\n  if (is_android)\
      \ {\n    deps -= [ \"notebooks_internals:build_grdp\" ]\n    grdp_files -= [\
      \ \"$target_gen_dir/notebooks_internals/resources.grdp\" ]\n  }\n"
  count: 1

