# Android-only extensions viewport and responsive controls.
substitutions:
  - description: Adapt the extensions WebUI and existing layout coverage for Android phone widths
    regex:
      re_pattern: \ \ test\('Filtering',\ async\ \(\)\ =>\ \{
      replace: "  // <if expr=\"is_android\">\n  test('AndroidPhoneWidths', async () => {\n    for (const direction of ['ltr', 'rtl']) {\n      itemList.dir = direction;\n      for (const width of [320, 360, 393, 768]) {\n        itemList.style.width = `${width}px`;\n        await microtasksFinished();\n        const bounds = itemList.getBoundingClientRect();\n        const cards =\n            itemList.shadowRoot.querySelectorAll('extensions-item');\n        assertTrue(cards.length > 0);\n        for (const card of cards) {\n          const rect = card.getBoundingClientRect();\n          assertTrue(rect.width > 0);\n          assertTrue(rect.left >= bounds.left);\n          assertTrue(rect.right <= bounds.right);\n          assertTrue(rect.width <= 400);\n        }\n        const wrapper =\n            itemList.shadowRoot.querySelector<HTMLElement>('#content-wrapper')!;\n        assertTrue(wrapper.scrollWidth <= wrapper.clientWidth);\n      }\n    }\n  });\n  // </if>\n\n  test('Filtering', async () => {"
  - description: Cover Android empty-search feedback while retaining Web Store discovery
    regex:
      re_pattern: "\\ \\ test\\('Filtering',\\ async\\ \\(\\)\\ =>\\ \\{"
      replace: "  // <if expr=\"is_android\">\n  test('AndroidSearchNoticePreservesStoreDiscovery', async () => {\n    await microtasksFinished();\n    boundTestVisible('#no-items', true);\n    boundTestVisible('#no-search-results', false);\n\n    itemList.filter = 'non-existent name';\n    await microtasksFinished();\n    boundTestVisible('#no-items', true);\n    boundTestVisible('#no-search-results', true);\n    assertEquals(\n        0, itemList.shadowRoot.querySelectorAll('extensions-item').length);\n\n    itemList.filter = 'Alpha';\n    await microtasksFinished();\n    boundTestVisible('#no-items', true);\n    boundTestVisible('#no-search-results', false);\n    assertEquals(\n        1, itemList.shadowRoot.querySelectorAll('extensions-item').length);\n\n    for (const filter of ['', '   ']) {\n      itemList.filter = filter;\n      await microtasksFinished();\n      boundTestVisible('#no-items', true);\n      boundTestVisible('#no-search-results', false);\n      assertEquals(\n          4, itemList.shadowRoot.querySelectorAll('extensions-item').length);\n    }\n\n    itemList.extensions = [];\n    itemList.apps = [];\n    itemList.filter = 'non-existent name';\n    await microtasksFinished();\n    boundTestVisible('#no-items', true);\n    boundTestVisible('#no-search-results', false);\n    assertEquals(\n        0, itemList.shadowRoot.querySelectorAll('extensions-item').length);\n  });\n  // </if>\n\n  test('Filtering', async () => {"
  - description: Match existing Android Store discovery visibility in the item list fixtures
    count: 5
    regex:
      re_pattern: "\\ \\ \\ \\ boundTestVisible\\('\\#no\\-items',\\ false\\);\\\n"
      replace: "    // <if expr=\"is_android\">\n    boundTestVisible('#no-items', true);\n    // </if>\n    // <if expr=\"not is_android\">\n    boundTestVisible('#no-items', false);\n    // </if>\n"
