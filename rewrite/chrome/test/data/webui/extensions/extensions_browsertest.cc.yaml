      replace: "IN_PROC_BROWSER_TEST_F(CrExtensionsNavigationHelperTest, SupportedRoutes) {\n  RunTestCase(\"SupportedRoutes\");\n}\n\n#if BUILDFLAG(IS_ANDROID)\n#if BUILDFLAG(ENABLE_GUEST_VIEW)\nclass CrExtensionsRealOptionsGuestTest\n    : public CrExtensionsOptionsDialogTest,\n      public content::WebContentsObserver {\n protected:\n  void OnWebContentsAvailable(content::WebContents* contents) override {\n    WebUIMochaBrowserTest::OnWebContentsAvailable(contents);\n    Observe(contents);\n    guest_manager_ = guest_manager_factory_.GetOrCreateTestGuestViewManager(\n        contents->GetBrowserContext(),\n        extensions::ExtensionsAPIClient::Get()->CreateGuestViewManagerDelegate());\n    ASSERT_EQ(0u, guest_manager_->num_guests_created());\n    guest_manager_->SetWillAttachCallback(base::BindOnce(\n        &CrExtensionsRealOptionsGuestTest::OnWillAttachGuest,\n        weak_factory_.GetWeakPtr()));\n  }\n\n  GURL expected_options_url_;\n  bool native_guest_verified_ = false;\n  raw_ptr<guest_view::TestGuestViewManager> guest_manager_ = nullptr;\n\n private:\n  void OnWillAttachGuest(guest_view::GuestViewBase* guest) {\n    // The callback runs before AttachGuest. Waiting here would deadlock it.\n    base::SingleThreadTaskRunner::GetCurrentDefault()->PostTask(\n        FROM_HERE,\n        base::BindOnce(&CrExtensionsRealOptionsGuestTest::VerifyAttachedGuest,\n                       weak_factory_.GetWeakPtr(), guest->guest_instance_id()));\n  }\n\n  void VerifyAttachedGuest(int instance_id) {\n    // Re-read the live guest each time: no raw guest pointer crosses a wait,\n    // and the same main-frame load condition works for MPArch and legacy.\n    const bool loaded = base::test::RunUntil([&] {\n      if (!web_contents()) {\n        return true;\n      }\n      auto* guest = guest_manager_->GetLastGuestViewCreated();\n      return guest && guest->guest_instance_id() == instance_id &&\n             guest->attached() && guest->GetGuestMainFrame() &&\n             guest->GetGuestMainFrame()->GetLastCommittedURL() ==\n                 expected_options_url_ &&\n             guest->GetGuestMainFrame()\n                 ->IsDocumentOnLoadCompletedInMainFrame();\n    });\n    auto* guest = guest_manager_->GetLastGuestViewCreated();\n    native_guest_verified_ =\n        loaded && web_contents() && guest && guest->attached() &&\n        guest->guest_instance_id() == instance_id &&\n        guest->GetViewType() == \"extensionoptions\" &&\n        guest->owner_web_contents() == web_contents() &&\n        guest->GetGuestMainFrame() &&\n        guest->GetGuestMainFrame()->GetLastCommittedURL() == expected_options_url_ &&\n        guest_manager_->GetCurrentGuestCount() == 1;\n    EXPECT_TRUE(native_guest_verified_);\n    if (web_contents()) {\n      // Coordinate assertions only. No guest event or callback is fabricated.\n      EXPECT_TRUE(content::ExecJs(\n          web_contents(),\n          content::JsReplace(\"window.reaperResolveOptionsGuestReady($1);\",\n                             native_guest_verified_)));\n    }\n  }\n\n  // Register the testing factory before any browser context can create guests.\n  guest_view::TestGuestViewManagerFactory guest_manager_factory_;\n  base::WeakPtrFactory<CrExtensionsRealOptionsGuestTest> weak_factory_{this};\n};\n\nIN_PROC_BROWSER_TEST_F(CrExtensionsRealOptionsGuestTest,\n                       AndroidDirectOptionsGuestRendersAndCloses) {\n  const extensions::Extension* extension = InstallExtensionWithInPageOptions();\n  ASSERT_TRUE(extension);\n  expected_options_url_ = extension->GetResourceURL(\"options.html\");\n  RunTestWithoutTestLoader(\n      \"extensions/options_dialog_test.js\",\n      \"window.reaperOptionsGuestReady = new Promise(resolve => {\"\n      \"  window.reaperResolveOptionsGuestReady = resolve;\"\n      \"});\"\n      \"runMochaTest('ExtensionRealOptionsGuestTests', \"\n      \"'AndroidDirectOptionsGuestRendersAndCloses');\");\n  EXPECT_TRUE(native_guest_verified_);\n  ASSERT_TRUE(guest_manager_);\n  EXPECT_EQ(1u, guest_manager_->num_guests_created());\n  guest_manager_->WaitForAllGuestsDeleted();\n  EXPECT_EQ(0u, guest_manager_->GetCurrentGuestCount());\n}\n#endif  // BUILDFLAG(ENABLE_GUEST_VIEW)\n#endif  // BUILDFLAG(IS_ANDROID)\n"
