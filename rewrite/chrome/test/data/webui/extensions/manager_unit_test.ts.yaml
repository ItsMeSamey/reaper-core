      pattern: "    assertTrue(manager.$.toolbar.isSearchFocused());\n  });\n\n  test('UninstallRaceCondition', async () => {\n    assertEquals(0, getExtensions().length);\n\n"
      replace: "    assertTrue(manager.$.toolbar.isSearchFocused());\n  });\n\n  // <if expr=\"is_android\">\n  function focusUninstallToolbarControl(): HTMLButtonElement {\n    const toggle = manager.$.toolbar.$.devMode;\n    const leoToggle = toggle.shadowRoot.querySelector('leo-toggle')!;\n    const button = leoToggle.shadowRoot!.querySelector<HTMLButtonElement>(\n        'button[role=\"switch\"]')!;\n    assertFalse(button.disabled);\n    button.focus();\n    assertEquals(button, getDeepActiveElement());\n    return button;\n  }\n\n  async function flushUninstallFocus(timer: MockTimer) {\n    await manager.updateComplete;\n    await manager.$.itemsList.updateComplete;\n    await Promise.resolve();\n    timer.tick(0);\n    await Promise.resolve();\n  }\n\n  test('AndroidUninstallTimerPreservesNewToolbarFocus', async () => {\n    const first = createExtensionInfo({name: 'Alpha', id: 'a'.repeat(32)});\n    const second = createExtensionInfo({name: 'Bravo', id: 'b'.repeat(32)});\n    const third = createExtensionInfo({name: 'Charlie', id: 'c'.repeat(32)});\n    simulateExtensionInstall(first);\n    simulateExtensionInstall(second);\n    simulateExtensionInstall(third);\n    await microtasksFinished();\n    const list = manager.$.itemsList;\n    const timer = new MockTimer();\n    timer.install();\n    try {\n      list.getRemoveButton(first.id)!.focus();\n      service.itemStateChangedTarget.callListeners({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: first.id,\n      });\n      await flushUninstallFocus(timer);\n      // The original next-card fallback still moves actual focus.\n      assertTrue(list.getRemoveButton(second.id)!.matches(':focus-within'));\n      assertEquals(2, getExtensions().length);\n\n      service.itemStateChangedTarget.callListeners({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: second.id,\n      });\n      const chosen = focusUninstallToolbarControl();\n      await flushUninstallFocus(timer);\n      assertEquals(chosen, getDeepActiveElement());\n      assertEquals(1, getExtensions().length);\n      assertEquals(third.id, getExtension(0).id);\n      assertFalse(manager.$.toolbar.isSearchFocused());\n    } finally {\n      timer.uninstall();\n    }\n  });\n\n  test('AndroidUninstallSearchRenderPreservesNewToolbarFocus', async () => {\n    const extension = createExtensionInfo({name: 'Alpha', id: 'a'.repeat(32)});\n    simulateExtensionInstall(extension);\n    await microtasksFinished();\n    manager.$.itemsList.getRemoveButton(extension.id)!.focus();\n    const search = manager.$.toolbar.$.toolbar.getSearchField();\n    const descriptor = Object.getOwnPropertyDescriptor(search, 'updateComplete');\n    let finishRender: (result: boolean) => void = () => {};\n    const pendingRender = new Promise<boolean>(resolve => finishRender = resolve);\n    Object.defineProperty(search, 'updateComplete', {\n      configurable: true,\n      get: () => pendingRender,\n    });\n    const restoreDescriptor = () => {\n      if (descriptor) {\n        Object.defineProperty(search, 'updateComplete', descriptor);\n      } else {\n        Reflect.deleteProperty(search, 'updateComplete');\n      }\n    };\n    const timer = new MockTimer();\n    timer.install();\n    try {\n      service.itemStateChangedTarget.callListeners({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: extension.id,\n      });\n      await flushUninstallFocus(timer);\n      assertTrue(search.showingSearch);\n      assertEquals(0, getExtensions().length);\n      const chosen = focusUninstallToolbarControl();\n      finishRender(true);\n      await Promise.resolve();\n      await Promise.resolve();\n      assertEquals(chosen, getDeepActiveElement());\n      assertFalse(manager.$.toolbar.isSearchFocused());\n\n      restoreDescriptor();\n      await search.updateComplete;\n      // With no intervening focus claim, final-item removal still focuses search.\n      const recovery = createExtensionInfo({name: 'Bravo', id: 'b'.repeat(32)});\n      simulateExtensionInstall(recovery);\n      await manager.updateComplete;\n      await manager.$.itemsList.updateComplete;\n      service.itemStateChangedTarget.callListeners({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: recovery.id,\n      });\n      await flushUninstallFocus(timer);\n      await search.updateComplete;\n      await Promise.resolve();\n      assertEquals(0, getExtensions().length);\n      assertTrue(manager.$.toolbar.isSearchFocused());\n      assertEquals(search.getSearchInput(), getDeepActiveElement());\n    } finally {\n      finishRender(true);\n      restoreDescriptor();\n      timer.uninstall();\n    }\n  });\n  // </if>\n  test('UninstallRaceCondition', async () => {\n    assertEquals(0, getExtensions().length);\n\n"
