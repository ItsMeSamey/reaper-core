earchFocused());\n          if (succeeds) {\n            resolve(profile);\n          } else {\n            reject(new Error('Retry profile failure'));\n          }\n          await microtasksFinished();\n          assertEquals(chosenFocus, getDeepActiveElement());\n          assertFalse(retry.disabled);\n          assertEquals(succeeds, retry.hidden);\n          assertEquals(focusOwner === 'dialog', dialog.open);\n        } finally {\n          if (dialog.open) {\n            dialog.close();\n          }\n          dialog.remove();\n        }\n      }\n    }\n  });\n  // </if>"
