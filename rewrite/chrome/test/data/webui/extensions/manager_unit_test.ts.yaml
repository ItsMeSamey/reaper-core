    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ assertEquals\\(third\\.id,\\ getExtension\\(0\\)\\.id\\);\\\n\\ \\ \\ \\ \\ \\ assertFalse\\(manager\\.\\$\\.toolbar\\.isSearchFocused\\(\\)\\);\\\n\\ \\ \\ \\ \\}\\ finally\\ \\{\\\n"
      replace: "      assertEquals(third.id, getExtension(0).id);\n      assertFalse(manager.$.toolbar.isSearchFocused());\n\n      // A removal arriving from another manager must preserve an unaffected card.\n      const fourth = createExtensionInfo({name: 'Delta', id: 'd'.repeat(32)});\n      simulateExtensionInstall(fourth);\n      await manager.updateComplete;\n      await list.updateComplete;\n      simulateExtensionInstall(first);\n      await manager.updateComplete;\n      await list.updateComplete;\n      const unaffectedItem = list.shadowRoot.querySelector(`#${third.id}`)!;\n      const unaffected = list.getDetailsButton(third.id)!;\n      unaffected.focus();\n      assertTrue(unaffected.matches(':focus-within'));\n      const unaffectedFocus = getDeepActiveElement();\n      // Removing an earlier card must not rebind the focused middle slot to Delta.\n      service.itemStateChangedTarget.callListeners({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: first.id,\n      });\n      await flushUninstallFocus(timer);\n      assertEquals(2, getExtensions().length);\n      assertEquals(third.id, getExtension(0).id);\n      assertEquals(fourth.id, getExtension(1).id);\n      assertEquals(unaffectedItem, list.shadowRoot.querySelector(`#${third.id}`));\n      assertEquals(unaffected, list.getDetailsButton(third.id));\n      assertEquals(unaffectedFocus, getDeepActiveElement());\n\n      // Removing a later card must preserve the same host, control and deep focus.\n      service.itemStateChangedTarget.callListeners({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: fourth.id,\n      });\n      await flushUninstallFocus(timer);\n      assertEquals(unaffectedItem, list.shadowRoot.querySelector(`#${third.id}`));\n      assertEquals(unaffected, list.getDetailsButton(third.id));\n      assertEquals(unaffectedFocus, getDeepActiveElement());\n      assertEquals(1, getExtensions().length);\n      assertEquals(third.id, getExtension(0).id);\n\n      // Keep a real matching card available so a mistaken next-card focus is visible.\n      simulateExtensionInstall(fourth);\n      await manager.updateComplete;\n      await list.updateComplete;\n      const search = manager.$.toolbar.$.toolbar.getSearchField();\n      search.setValue('a');\n      await manager.updateComplete;\n      await list.updateComplete;\n      await search.showAndFocus();\n      const input = search.getSearchInput();\n      assertEquals(input, getDeepActiveElement());\n      assertTrue(list.getRemoveButton(fourth.id)!.getClientRects().length > 0);\n      service.itemStateChangedTarget.callListeners({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: third.id,\n      });\n      await flushUninstallFocus(timer);\n      assertEquals(input, getDeepActiveElement());\n      assertEquals('a', input.value);\n      assertEquals('a', list.filter);\n      assertEquals(1, getExtensions().length);\n      assertEquals(fourth.id, getExtension(0).id);\n\n      // The final-item fallback must also respect a pre-existing toolbar focus.\n      const existingToolbarFocus = focusUninstallToolbarControl();\n      service.itemStateChangedTarget.callListeners({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: fourth.id,\n      });\n      await flushUninstallFocus(timer);\n      assertEquals(0, getExtensions().length);\n      assertEquals(existingToolbarFocus, getDeepActiveElement());\n      assertFalse(manager.$.toolbar.isSearchFocused());\n    } finally {\n"
