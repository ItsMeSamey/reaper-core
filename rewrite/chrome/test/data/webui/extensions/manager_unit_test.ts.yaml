  - description: "Android manager visible return focus and real-control fixture (2)"
    count: 1
    regex:
      pattern: "  // <if expr=\"is_android\">\n  function focusUninstallToolbarControl()"
      replace: "  // <if expr=\"is_android\">\n  test('AndroidDetailsAndErrorsReturnFocusToVisibleItem', async () => {\n    const id = 'a'.repeat(32);\n    const extension = createExtensionInfo({\n      id,\n      manifestErrors: [{\n        id: 1,\n        type: chrome.developerPrivate.ErrorType.MANIFEST,\n        extensionId: id,\n        fromIncognito: false,\n        source: 'manifest.json',\n        message: 'Test manifest error',\n        manifestKey: 'name',\n      }],\n    });\n    manager.inDevMode = true;\n    simulateExtensionInstall(extension);\n    await microtasksFinished();\n\n    const list = manager.$.itemsList;\n    for (const page of [Page.DETAILS, Page.ERRORS]) {\n      const button = page === Page.DETAILS ? list.getDetailsButton(id) :\n                                           list.getErrorsButton(id);\n      assertTrue(!!button);\n      assertTrue(list.classList.contains('active'));\n      assertTrue(button.getClientRects().length > 0);\n      button.focus();\n      assertTrue(button.matches(':focus-within'));\n      const focusedButton = getDeepActiveElement();\n      assertTrue(!!focusedButton);\n      button.click();\n      await microtasksFinished();\n      assertEquals(page, navigation.getCurrentPage().page);\n      assertFalse(list.classList.contains('active'));\n      assertEquals(0, button.getClientRects().length);\n\n      const view = manager.$.viewManager.querySelector<HTMLElement>('.active')!;\n      const close = view.shadowRoot!.querySelector<HTMLElement>('#closeButton')!;\n      assertTrue(!!close);\n      close.focus();\n      assertEquals(close, getDeepActiveElement());\n      close.click();\n      await microtasksFinished();\n\n      assertEquals(Page.LIST, navigation.getCurrentPage().page);\n      assertTrue(list.classList.contains('active'));\n      assertTrue(button.getClientRects().length > 0);\n      assertTrue(button.matches(':focus-within'));\n      assertEquals(focusedButton, getDeepActiveElement());\n    }\n\n    // A different destination must not return focus to the hidden item card.\n    list.getDetailsButton(id)!.click();\n    await microtasksFinished();\n    navigation.navigateTo({page: Page.SHORTCUTS});\n    await microtasksFinished();\n    assertEquals(Page.SHORTCUTS, navigation.getCurrentPage().page);\n    assertFalse(list.classList.contains('active'));\n    assertFalse(list.matches(':focus-within'));\n    navigation.navigateTo({page: Page.LIST});\n    await microtasksFinished();\n\n    // Removing the Details item returns through history to an empty list.\n    list.getDetailsButton(id)!.click();\n    await microtasksFinished();\n    const removedView =\n        manager.$.viewManager.querySelector<HTMLElement>('.active')!;\n    const removedClose =\n        removedView.shadowRoot!.querySelector<HTMLElement>('#closeButton')!;\n    assertTrue(removedClose.getClientRects().length > 0);\n    removedClose.focus();\n    assertEquals(removedClose, getDeepActiveElement());\n    const whenRemoved = eventToPromise('popstate', window);\n    service.itemStateChangedTarget.callListeners({\n      event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n      item_id: id,\n    });\n    await whenRemoved;\n    await microtasksFinished();\n    assertEquals(Page.LIST, navigation.getCurrentPage().page);\n    assertTrue(list.classList.contains('active'));\n    assertEquals(0, getExtensions().length);\n    assertFalse(!!list.getDetailsButton(id));\n    assertTrue(search.showingSearch);\n    assertTrue(input.isConnected);\n    assertTrue(input.getClientRects().length > 0);\n    assertEquals(input, getDeepActiveElement());\n    assertFalse(removedView.matches(':focus-within'));\n\n    // A different history entry uses synchronous routing. A newer focus claim\n    // while the search field renders must win over the removal fallback.\n    const recovery = createExtensionInfo({name: 'Bravo', id: 'b'.repeat(32)});\n    simulateExtensionInstall(recovery);\n    await microtasksFinished();\n    search.showingSearch = false;\n    await search.updateComplete;\n    navigation.navigateTo({page: Page.SHORTCUTS});\n    navigation.navigateTo({page: Page.DETAILS, extensionId: recovery.id});\n    await microtasksFinished();\n    const recoveryView =\n        manager.$.viewManager.querySelector<HTMLElement>('.active')!;\n    const recoveryClose =\n        recoveryView.shadowRoot!.querySelector<HTMLElement>('#closeButton')!;\n    assertTrue(recoveryClose.getClientRects().length > 0);\n    recoveryClose.focus();\n    assertEquals(recoveryClose, getDeepActiveElement());\n    const descriptor = Object.getOwnPropertyDescriptor(search, 'updateComplete');\n    let finishRender: (result: boolean) => void = () => {};\n    const pendingRender = new Promise<boolean>(resolve => finishRender = resolve);\n    Object.defineProperty(search, 'updateComplete', {\n      configurable: true,\n      get: () => pendingRender,\n    });\n    try {\n      service.itemStateChangedTarget.callListeners({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: recovery.id,\n      });\n      await microtasksFinished();\n      assertEquals(Page.LIST, navigation.getCurrentPage().page);\n      assertTrue(list.classList.contains('active'));\n      assertEquals(0, getExtensions().length);\n      // The new fallback has reached its search-render await.\n      assertTrue(search.showingSearch);\n      assertFalse(manager.$.toolbar.isSearchFocused());\n      const chosen = focusUninstallToolbarControl();\n      finishRender(true);\n      await microtasksFinished();\n      assertEquals(chosen, getDeepActiveElement());\n      assertFalse(manager.$.toolbar.isSearchFocused());\n    } finally {\n      finishRender(true);\n      if (descriptor) {\n        Object.defineProperty(search, 'updateComplete', descriptor);\n      } else {\n        Reflect.deleteProperty(search, 'updateComplete');\n      }\n    }\n  });\n\n  function focusUninstallToolbarControl()"
  - description: "Extend the existing Android return-focus case with real toolbar search routing"
    count: 1
    regex:
      pattern: "    // A different destination must not return focus to the hidden item card.\n"
      replace: "    const search = manager.$.toolbar.$.toolbar.getSearchField();\n    const input = search.getSearchInput();\n    for (const page of [Page.DETAILS, Page.ERRORS]) {\n      for (const query of [extension.name, 'No matching extension']) {\n        search.setValue('');\n        await microtasksFinished();\n        const button = page === Page.DETAILS ? list.getDetailsButton(id) :\n                                             list.getErrorsButton(id);\n        assertTrue(!!button);\n        button.click();\n        await microtasksFinished();\n        assertEquals(page, navigation.getCurrentPage().page);\n        assertFalse(list.classList.contains('active'));\n\n        await search.showAndFocus();\n        assertEquals(input, getDeepActiveElement());\n        // Use the real search control's change event and normal routing.\n        search.setValue(query);\n        await microtasksFinished();\n\n        assertEquals(Page.LIST, navigation.getCurrentPage().page);\n        assertTrue(list.classList.contains('active'));\n        assertEquals(query, list.filter);\n        assertEquals(query, input.value);\n        assertTrue(input.isConnected);\n        assertTrue(input.getClientRects().length > 0);\n        assertEquals(input, getDeepActiveElement());\n        assertTrue(manager.$.toolbar.isSearchFocused());\n        assertFalse(list.matches(':focus-within'));\n        testVisible(list, '#no-search-results', query !== extension.name);\n        assertEquals(query === extension.name, !!list.getDetailsButton(id));\n      }\n    }\n    search.setValue('');\n    await microtasksFinished();\n\n    // A different destination must not return focus to the hidden item card.\n"
