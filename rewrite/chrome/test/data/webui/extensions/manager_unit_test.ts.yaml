  - description: Recover Android extension manager initialization with explicit retry and retained successful data
    regex:
      re_pattern: '\ \ let\ manager:\ ExtensionsManagerElement;\

        \ \ let\ service:\ TestService;\

        \

        \ \ setup\(function\(\)\ \{\

        \ \ \ \ document\.body\.innerHTML\ =\ window\.trustedTypes!\.emptyHTML;\

        \

        \ \ \ \ service\ =\ new\ TestService\(\);\

        '
      replace: "  let manager: ExtensionsManagerElement;\n  let service: TestService;\n\n  setup(async function() {\n    document.body.innerHTML = window.trustedTypes!.emptyHTML;\n\n    service = new TestService();\n"
  - description: Recover Android extension manager initialization with explicit retry and retained successful data
    regex:
      re_pattern: '\

        \ \ \ \ //\ Wait\ until\ Manager\ calls\ fetches\ data\ and\ initializes\ itself\ before\

        \ \ \ \ //\ making\ any\ assertions\.\

        \ \ \ \ return\ Promise\.all\(\[\

        \ \ \ \ \ \ service\.whenCalled\(''getExtensionsInfo''\),\

        \ \ \ \ \ \ service\.whenCalled\(''getProfileConfiguration''\),\

        \ \ \ \ \]\);\

        \ \ \}\);\

        \

        \ \ /\*\*\

        \ \ \ \*\ Trigger\ an\ event\ that\ indicates\ that\ an\ extension\ was\ installed\.\

        '
      replace: "\n    // Wait until Manager calls fetches data and initializes itself before\n    // making any assertions.\n    await Promise.all([\n      service.whenCalled('getExtensionsInfo'),\n      service.whenCalled('getProfileConfiguration'),\n    ]);\n    // <if expr=\"is_android\">\n    // Call notifications precede the initialization promise callbacks.\n    await microtasksFinished();\n    // </if>\n  });\n\n  // <if expr=\"is_android\">\n  test('AndroidInitializationCompletesAcrossDetachAndReattach', async () => {\n    manager.remove();\n    service = new TestService();\n    Service.setInstance(service);\n    const api: ServiceInterface = service;\n    const profile = await api.getProfileConfiguration();\n    let resolveProfile!: (value: chrome.developerPrivate.ProfileInfo) => void;\n    let resolveList!: (value: chrome.developerPrivate.ExtensionInfo[]) => void;\n    const profileResult = new Promise<chrome.developerPrivate.ProfileInfo>(yes => {\n      resolveProfile = yes;\n    });\n    const listResult = new Promise<chrome.developerPrivate.ExtensionInfo[]>(yes => {\n      resolveList = yes;\n    });\n    let profileCalls = 0;\n    let listCalls = 0;\n    api.getProfileConfiguration = () => { ++profileCalls; return profileResult; };\n    api.getExtensionsInfo = () => { ++listCalls; return listResult; };\n    manager = document.createElement('extensions-manager');\n    document.body.appendChild(manager);\n    await microtasksFinished();\n    manager.remove();\n    resolveProfile(profile);\n    resolveList([createExtensionInfo({id: 'a'.repeat(32), name: 'Loaded while detached'})]);\n    await microtasksFinished();\n    document.body.appendChild(manager);\n    await microtasksFinished();\n    assertFalse(manager.$.itemsList.hidden);\n    assertEquals(1, manager.$.itemsList.extensions.length);\n    assertTrue(manager.shadowRoot.querySelector<HTMLElement>('#initializationStatus')!.hidden);\n    assertEquals(1, profileCalls);\n    assertEquals(1, listCalls);\n    simulateExtensionInstall(createExtensionInfo({id: 'b'.repeat(32), name: 'After reconnect'}));\n    await microtasksFinished();\n    assertEquals(2, manager.$.itemsList.extensions.length);\n  });\n\n  test('AndroidInitializationFailureRetryPreservesSuccessfulData', async () => {\n    for (const failedCall of ['list', 'profile']) {\n      manager.remove();\n      service = new TestService();\n      Service.setInstance(service);\n      const api: ServiceInterface = service;\n      const profile = await api.getProfileConfiguration();\n      const extensions = failedCall === 'profile' ?\n          [createExtensionInfo({id: 'a'.repeat(32), name: 'Retained extension'})] : [];\n      let resolveProfile!: (value: chrome.developerPrivate.ProfileInfo) => void;\n      let rejectProfile!: (error: Error) => void;\n      let resolveList!: (value: chrome.developerPrivate.ExtensionInfo[]) => void;\n      let rejectList!: (error: Error) => void;\n      let profileResult = new Promise<chrome.developerPrivate.ProfileInfo>((yes, no) => {\n        resolveProfile = yes;\n        rejectProfile = no;\n      });\n      let listResult = new Promise<chrome.developerPrivate.ExtensionInfo[]>((yes, no) => {\n        resolveList = yes;\n        rejectList = no;\n      });\n      let profileCalls = 0;\n      let listCalls = 0;\n      api.getProfileConfiguration = () => { ++profileCalls; return profileResult; };\n      api.getExtensionsInfo = () => { ++listCalls; return listResult; };\n      manager = document.createElement('extensions-manager');\n      document.body.appendChild(manager);\n      await microtasksFinished();\n      const status = manager.shadowRoot.querySelector<HTMLElement>('#initializationStatus')!;\n      const retry = manager.shadowRoot.querySelector<CrButtonElement>('#initializationRetry')!;\n      assertEquals('true', status.getAttribute('aria-busy'));\n      assertFalse(status.hidden);\n      assertTrue(retry.hidden);\n      assertTrue(manager.$.itemsList.hidden);\n      assertEquals(1, listCalls);\n      assertEquals(1, profileCalls);\n      const internalError = new Error('Internal API request denied');\n      if (failedCall === 'list') {\n        resolveProfile(profile);\n        rejectList(internalError);\n      } else {\n        resolveList(extensions);\n        rejectProfile(internalError);\n      }\n      await microtasksFinished();\n      assertEquals('false', status.getAttribute('aria-busy'));\n      assertFalse(retry.hidden);\n      assertFalse(retry.disabled);\n      assertEquals(manager.i18n('managerLoadError'),\n          status.querySelector('[role=\"alert\"]')!.textContent!.trim());\n      assertFalse(status.textContent!.includes(internalError.message));\n      assertEquals(extensions.length, manager.$.itemsList.extensions.length);\n      assertEquals(failedCall === 'list', manager.$.itemsList.hidden);\n\n      // A second failed attempt must neither start an automatic loop nor\n      // erase the data/listener supplied by the other successful query.\n      let rejectRetry!: (error: Error) => void;\n      if (failedCall === 'list') {\n        listResult = new Promise((_yes, no) => { rejectRetry = no; });\n      } else {\n        profileResult = new Promise((_yes, no) => { rejectRetry = no; });\n      }\n      retry.focus();\n      retry.click();\n      retry.click();\n      await microtasksFinished();\n      assertTrue(retry.disabled);\n      assertEquals('true', status.getAttribute('aria-busy'));\n      assertEquals(failedCall === 'list' ? 2 : 1, listCalls);\n      assertEquals(failedCall === 'profile' ? 2 : 1, profileCalls);\n      rejectRetry(internalError);\n      await microtasksFinished();\n      assertFalse(retry.disabled);\n      assertEquals(extensions.length, manager.$.itemsList.extensions.length);\n      assertEquals(failedCall === 'list' ? 2 : 1, listCalls);\n      assertEquals(failedCall === 'profile' ? 2 : 1, profileCalls);\n      assertEquals(retry, getDeepActiveElement());\n\n      // Only the explicit retry reissues the failed API. Empty success is a\n      // valid loaded list, distinct from pending or failed initialization.\n      listResult = Promise.resolve(extensions);\n      profileResult = Promise.resolve(profile);\n      retry.click();\n      await microtasksFinished();\n      assertTrue(status.hidden);\n      assertFalse(manager.$.itemsList.hidden);\n      assertEquals(extensions.length, manager.$.itemsList.extensions.length);\n      assertEquals(failedCall === 'list' ? 3 : 1, listCalls);\n      assertEquals(failedCall === 'profile' ? 3 : 1, profileCalls);\n      assertTrue(manager.$.toolbar.isSearchFocused());\n      simulateExtensionInstall(createExtensionInfo({id: 'b'.repeat(32), name: 'New extension'}));\n      await microtasksFinished();\n      assertEquals(extensions.length + 1, manager.$.itemsList.extensions.length);\n    }\n  });\n  // </if>\n\n  /**\n   * Trigger an event that indicates that an extension was installed.\n"
