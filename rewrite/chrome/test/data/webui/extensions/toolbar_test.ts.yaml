abel);\n            assertEquals(null, marker.parentNode);\n            const input = document.createElement('input');\n            document.body.appendChild(input);\n            input.focus();\n            if (outcome === 'success') {\n              resolveUpdate();\n            } else {\n              rejectUpdate(new Error('Local update failed'));\n            }\n            await microtasksFinished();\n            assertEquals(mode !== 'detached' && outcome === 'error' ? 1 : 0, errors);\n            assertTrue(toastManager.isToastOpen);\n            assertEquals(label, toastManager.$.content.textContent);\n            assertEquals(3210, toastManager.duration);\n            assertEquals(input, getDeepActiveElement());\n\n            // A settled attempt releases the synchronous guard for explicit retry.\n            if (!pendingToolbar.isConnected) {\n              document.body.appendChild(pendingToolbar);\n              await microtasksFinished();\n            }\n            pendingToolbar.$.updateNow.click();\n            assertEquals(2, calls);\n            pendingToolbar.remove();\n            assertFalse(toastManager.isToastOpen);\n            assertTrue(toastManager.duration > 0);\n            resolveUpdate();\n            await microtasksFinished();\n            assertFalse(toastManager.isToastOpen);\n            input.remove();\n          }\n        }\n        // </if>\n      });\n\n"
