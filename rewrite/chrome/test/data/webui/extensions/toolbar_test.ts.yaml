eButton.disabled);\n      } else {\n        assertEquals(chosenFocus, getDeepActiveElement());\n      }\n    }\n  }\n\n  async function checkAndroidUnpackedErrorDialogReturnsFocus() {\n    toolbar.inDevMode = true;\n    toolbar.canLoadUnpacked = true;\n    await microtasksFinished();\n    let reject!: (error: Error) => void;\n    mockDelegate.loadUnpacked = () => new Promise<boolean>((_yes, no) => {\n      reject = no;\n    });\n    const dialog = document.createElement('extensions-load-error');\n    dialog.delegate = mockDelegate;\n    let opened!: () => void;\n    const shown = new Promise<void>(resolve => { opened = resolve; });\n    // Match the manager's deferred dialog presentation after load-error.\n    toolbar.addEventListener('load-error', event => {\n      setTimeout(async () => {\n        dialog.loadError = (event as CustomEvent<Error>).detail;\n        document.body.appendChild(dialog);\n        await dialog.updateComplete;\n        dialog.show();\n        opened();\n      }, 0);\n    }, {once: true});\n    const button = toolbar.$.loadUnpacked;\n    button.focus();\n    button.click();\n    await microtasksFinished();\n    reject(new Error('Unreadable unpacked extension'));\n    await shown;\n    await microtasksFinished();\n    assertTrue(dialog.$.dialog.getNative().open);\n    assertFalse(button.matches(':focus-within'));\n    dialog.close();\n    await microtasksFinished();\n    assertEquals(button, toolbar.shadowRoot.activeElement);\n    dialog.remove();\n  }\n\n  test('AndroidInstallCrxPendingCancellationErrorAndRetry', async () => {"
