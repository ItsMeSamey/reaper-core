);\n      }\n      await microtasksFinished();\n\n      assertFalse(button.disabled);\n      assertEquals('false', button.getAttribute('aria-busy'));\n      testVisible(toolbar, '#loadUnpackedProgress', false);\n      assertEquals(outcome === 'success', toastManager.isToastOpen);\n      assertEquals(expectedErrors, errors.length);\n      if (outcome === 'error') {\n        assertEquals(loadError, errors[errors.length - 1]);\n      }\n    }\n  });\n  // </if>\n\n  test('DevModeToggle', async () => {"
