substitutions:
- description: Use the existing PromiseResolver utility only in the Android regression.
  regex:
    pattern: 'import {loadTimeData} from ''chrome://resources/js/load_time_data.js'';

      '
    replace: 'import {loadTimeData} from ''chrome://resources/js/load_time_data.js'';

      // <if expr="is_android">

      import {PromiseResolver} from ''chrome://resources/js/promise_resolver.js'';

      // </if>

      '
  count: 1
- description: Extend existing Layout with ordinary sequential A/B reply loading and size assertions.
  regex:
    pattern: "    assertTrue(testIsVisible('extensions-host-permissions-toggle-list'));\n  });\n\n  test('LayoutSource', async\
      \ () => {\n"
    replace: "    assertTrue(testIsVisible('extensions-host-permissions-toggle-list'));\n    // <if expr=\"is_android\">\n\
      \n    // Reusing the view must keep the new item's size loading until its own\n    // request completes, even when the\
      \ previous item's request finishes first.\n    const size = item.shadowRoot.querySelector<HTMLElement>('#size span')!;\n\
      \    const spinner =\n        item.shadowRoot.querySelector<HTMLElement>('#size .spinner')!;\n    assertEquals('10 MB',\
      \ size.textContent!.trim());\n    assertTrue(spinner.hidden);\n\n    const sizeRequests:\n        Array<{id: string,\
      \ resolver: PromiseResolver<string>}> = [];\n    mockDelegate.getExtensionSize = id => {\n      const resolver = new\
      \ PromiseResolver<string>();\n      sizeRequests.push({id, resolver});\n      return resolver.promise;\n    };\n   \
      \ const firstId = 'a'.repeat(32);\n    const secondId = 'b'.repeat(32);\n    await updateItemData({id: firstId});\n\
      \    assertEquals('', size.textContent!.trim());\n    assertFalse(spinner.hidden);\n    await updateItemData({id: secondId});\n\
      \    assertDeepEquals([firstId, secondId], sizeRequests.map(request => request.id));\n    assertEquals('', size.textContent!.trim());\n\
      \    assertFalse(spinner.hidden);\n\n    sizeRequests[0]!.resolver.resolve('20 MB');\n    await microtasksFinished();\n\
      \    assertEquals(secondId, item.data.id);\n    assertEquals('', size.textContent!.trim());\n    assertFalse(spinner.hidden);\n\
      \n    sizeRequests[1]!.resolver.resolve('30 MB');\n    await microtasksFinished();\n    assertEquals('30 MB', size.textContent!.trim());\n\
      \    assertTrue(spinner.hidden);\n    // </if>\n  });\n\n  test('LayoutSource', async () => {\n"
  count: 1
- description: "ESLint6 actual541: preserve inherited rules and remove only unnecessary erased non-null assertions."
  regex:
    re_pattern: "\\ \\ \\ \\ assertEquals\\('10\\ MB',\\ size\\.textContent!\\.trim\\(\\)\\);\\\n\\ \\ \\ \\ assertTrue\\(spinner\\.hidden\\);\\\n\\\n\\ \\ \\ \\ const\\ sizeRequests:\\\n\\ \\ \\ \\ \\ \\ \\ \\ Array<\\{id:\\ string,\\ resolver:\\ PromiseResolver<string>\\}>\\ =\\ \\[\\];\\\n\\ \\ \\ \\ mockDelegate\\.getExtensionSize\\ =\\ id\\ =>\\ \\{\\\n\\ \\ \\ \\ \\ \\ const\\ resolver\\ =\\ new\\ PromiseResolver<string>\\(\\);\\\n\\ \\ \\ \\ \\ \\ sizeRequests\\.push\\(\\{id,\\ resolver\\}\\);\\\n\\ \\ \\ \\ \\ \\ return\\ resolver\\.promise;\\\n\\ \\ \\ \\ \\};\\\n\\ \\ \\ \\ const\\ firstId\\ =\\ 'a'\\.repeat\\(32\\);\\\n\\ \\ \\ \\ const\\ secondId\\ =\\ 'b'\\.repeat\\(32\\);\\\n\\ \\ \\ \\ await\\ updateItemData\\(\\{id:\\ firstId\\}\\);\\\n\\ \\ \\ \\ assertEquals\\('',\\ size\\.textContent!\\.trim\\(\\)\\);\\\n\\ \\ \\ \\ assertFalse\\(spinner\\.hidden\\);\\\n\\ \\ \\ \\ await\\ updateItemData\\(\\{id:\\ secondId\\}\\);\\\n\\ \\ \\ \\ assertDeepEquals\\(\\[firstId,\\ secondId\\],\\ sizeRequests\\.map\\(request\\ =>\\ request\\.id\\)\\);\\\n\\ \\ \\ \\ assertEquals\\('',\\ size\\.textContent!\\.trim\\(\\)\\);\\\n\\ \\ \\ \\ assertFalse\\(spinner\\.hidden\\);\\\n\\\n\\ \\ \\ \\ sizeRequests\\[0\\]!\\.resolver\\.resolve\\('20\\ MB'\\);\\\n\\ \\ \\ \\ await\\ microtasksFinished\\(\\);\\\n\\ \\ \\ \\ assertEquals\\(secondId,\\ item\\.data\\.id\\);\\\n\\ \\ \\ \\ assertEquals\\('',\\ size\\.textContent!\\.trim\\(\\)\\);\\\n\\ \\ \\ \\ assertFalse\\(spinner\\.hidden\\);\\\n\\\n\\ \\ \\ \\ sizeRequests\\[1\\]!\\.resolver\\.resolve\\('30\\ MB'\\);\\\n\\ \\ \\ \\ await\\ microtasksFinished\\(\\);\\\n\\ \\ \\ \\ assertEquals\\('30\\ MB',\\ size\\.textContent!\\.trim\\(\\)\\);\\\n"
    replace: "    assertEquals('10 MB', size.textContent.trim());\n    assertTrue(spinner.hidden);\n\n    const sizeRequests:\n        Array<{id: string, resolver: PromiseResolver<string>}> = [];\n    mockDelegate.getExtensionSize = id => {\n      const resolver = new PromiseResolver<string>();\n      sizeRequests.push({id, resolver});\n      return resolver.promise;\n    };\n    const firstId = 'a'.repeat(32);\n    const secondId = 'b'.repeat(32);\n    await updateItemData({id: firstId});\n    assertEquals('', size.textContent.trim());\n    assertFalse(spinner.hidden);\n    await updateItemData({id: secondId});\n    assertDeepEquals([firstId, secondId], sizeRequests.map(request => request.id));\n    assertEquals('', size.textContent.trim());\n    assertFalse(spinner.hidden);\n\n    sizeRequests[0]!.resolver.resolve('20 MB');\n    await microtasksFinished();\n    assertEquals(secondId, item.data.id);\n    assertEquals('', size.textContent.trim());\n    assertFalse(spinner.hidden);\n\n    sizeRequests[1]!.resolver.resolve('30 MB');\n    await microtasksFinished();\n    assertEquals('30 MB', size.textContent.trim());\n"
  count: 1
