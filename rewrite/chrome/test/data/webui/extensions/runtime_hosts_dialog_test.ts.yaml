substitutions:
  - description: "Expect zero Android measurement while preserving page action assertions"
    regex:
      pattern: "    assertEquals(\n        metricsPrivateMock.getUserActionCount(\n            'Extensions.Settings.Hosts.AddHostDialogSubmitted'),\n        1);\n"
      replace: "    // <if expr=\"not is_android\">\n    assertEquals(\n        metricsPrivateMock.getUserActionCount(\n            'Extensions.Settings.Hosts.AddHostDialogSubmitted'),\n        1);\n    // </if>\n    // <if expr=\"is_android\">\n    assertEquals(\n        metricsPrivateMock.getUserActionCount(\n            'Extensions.Settings.Hosts.AddHostDialogSubmitted'),\n        0);\n    // </if>\n"
    count: 1
