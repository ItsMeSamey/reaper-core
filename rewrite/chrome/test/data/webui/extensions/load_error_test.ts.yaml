substitutions:
  - description: "Android load-error UI 2/1: Preserve desktop/delegate behavior and existing five cases; Android long-path/error body/footer wrap with real geometry and normal focus regression."
    regex:
      re_pattern: "\\ \\ test\\('GenericError',\\ async\\ \\(\\)\\ =>\\ \\{\\\n"
      replace: "  // <if expr=\"is_android\">\n  test('AndroidLongPathAndErrorWrapAtPhoneWidths', async () => {\n    const path =\n        'content://com.android.externalstorage.documents/document/' +\n        'primary%3ADownload%2F' + 'UnbrokenExtensionDirectory'.repeat(12);\n    const message = 'MANIFEST_ERROR_' + 'UnbrokenErrorDetail'.repeat(16);\n    for (const hasFile of [true, false]) {\n      loadError.loadError = hasFile ?\n          {...stubLoadError, path, error: message} : new Error(message);\n      await microtasksFinished();\n      loadError.show();\n      const dialog = loadError.$.dialog;\n      const nativeDialog = dialog.getNative();\n      const body = dialog.shadowRoot!.querySelector<HTMLElement>('#container')!;\n      assertTrue(nativeDialog.open);\n      assertEquals(\n          !hasFile,\n          loadError.shadowRoot.querySelector<HTMLElement>('#file')!.hidden);\n      for (const width of [280, 360]) {\n        // Keep the width case within the actual viewport's normal phone margin.\n        const dialogWidth =\n            Math.min(width, document.documentElement.clientWidth - 32);\n        dialog.style.setProperty('--cr-dialog-width', `${dialogWidth}px`);\n        for (const fontSize of [13, 26]) {\n          loadError.style.fontSize = `${fontSize}px`;\n          for (const direction of ['ltr', 'rtl']) {\n            loadError.dir = direction;\n            await new Promise<void>(resolve => {\n              requestAnimationFrame(() => resolve());\n            });\n            assertTrue(\n                Math.abs(nativeDialog.getBoundingClientRect().width - dialogWidth) <\n                1);\n            assertTrue(body.scrollWidth <= body.clientWidth + 1);\n            const dialogBounds = nativeDialog.getBoundingClientRect();\n            const footer = loadError.shadowRoot.querySelector<HTMLElement>(\n                '[slot=button-container]')!;\n            assertTrue(footer.scrollWidth <= footer.clientWidth + 1);\n            for (const selector of ['.cancel-button', '.action-button']) {\n              const button =\n                  loadError.shadowRoot.querySelector<HTMLElement>(selector)!;\n              // A fixed smaller font must not conceal a large-text overflow.\n              assertEquals(fontSize, parseFloat(getComputedStyle(button).fontSize));\n              assertFalse(button.hasAttribute('disabled'));\n              assertTrue(button.tabIndex >= 0);\n              button.focus();\n              assertEquals(button, loadError.shadowRoot.activeElement);\n              const bounds = button.getBoundingClientRect();\n              assertTrue(bounds.width > 0 && bounds.height > 0);\n              assertTrue(bounds.left >= dialogBounds.left - 1);\n              assertTrue(bounds.right <= dialogBounds.right + 1);\n              assertTrue(bounds.top >= dialogBounds.top - 1);\n              assertTrue(bounds.bottom <= dialogBounds.bottom + 1);\n              assertTrue(bounds.left >= -1 && bounds.top >= -1);\n              assertTrue(\n                  bounds.right <= document.documentElement.clientWidth + 1);\n              assertTrue(\n                  bounds.bottom <= document.documentElement.clientHeight + 1);\n              const textRange = document.createRange();\n              textRange.selectNodeContents(button);\n              const textRects = Array.from(textRange.getClientRects())\n                                    .filter(rect => rect.width && rect.height);\n              assertTrue(textRects.length > 0);\n              for (const rect of textRects) {\n                assertTrue(rect.left >= bounds.left - 1);\n                assertTrue(rect.right <= bounds.right + 1);\n                assertTrue(rect.top >= bounds.top - 1);\n                assertTrue(rect.bottom <= bounds.bottom + 1);\n              }\n            }\n            for (const id of hasFile ? ['file', 'error'] : ['error']) {\n              const row =\n                  loadError.shadowRoot.querySelector<HTMLElement>(`#${id}`)!;\n              const value = row.querySelector<HTMLElement>('.row-value')!;\n              assertEquals(id === 'file' ? path : message, value.textContent);\n              const rowBounds = row.getBoundingClientRect();\n              const valueBounds = value.getBoundingClientRect();\n              assertTrue(valueBounds.width > 0);\n              assertTrue(valueBounds.left >= rowBounds.left - 1);\n              assertTrue(valueBounds.right <= rowBounds.right + 1);\n              assertTrue(value.scrollWidth <= value.clientWidth + 1);\n              const range = document.createRange();\n              range.selectNodeContents(value);\n              const lines = Array.from(range.getClientRects());\n              assertTrue(lines.length > 1);\n              assertTrue(\n                  range.getBoundingClientRect().height >\n                  Math.max(...lines.map(line => line.height)) + 1);\n            }\n          }\n        }\n      }\n      loadError.shadowRoot.querySelector<HTMLElement>('.cancel-button')!.click();\n      assertFalse(nativeDialog.open);\n    }\n  });\n  // </if>\n\n  test('GenericError', async () => {\n"
    count: 1
  - description: "ESLint6 actual541: preserve inherited rules and remove only unnecessary erased non-null assertions."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ const\\ body\\ =\\ dialog\\.shadowRoot!\\.querySelector<HTMLElement>\\('\\#container'\\)!;\\\n"
      replace: "      const body = dialog.shadowRoot.querySelector<HTMLElement>('#container')!;\n"
    count: 1

  - description: "Android focus597 load_error_test source hunk 1"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ //\\ A\\ fixed\\ smaller\\ font\\ must\\ not\\ conceal\\ a\\ large\\-text\\ overflow\\.\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ assertEquals\\(fontSize,\\ parseFloat\\(getComputedStyle\\(button\\)\\.fontSize\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ assertFalse\\(button\\.hasAttribute\\('disabled'\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ assertTrue\\(button\\.tabIndex\\ >=\\ 0\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ button\\.focus\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ assertEquals\\(button,\\ loadError\\.shadowRoot\\.activeElement\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ const\\ bounds\\ =\\ button\\.getBoundingClientRect\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ assertTrue\\(bounds\\.width\\ >\\ 0\\ \\&\\&\\ bounds\\.height\\ >\\ 0\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ assertTrue\\(bounds\\.left\\ >=\\ dialogBounds\\.left\\ \\-\\ 1\\);\\\n"
      replace: "              // A fixed smaller font must not conceal a large-text overflow.\n              assertEquals(fontSize, parseFloat(getComputedStyle(button).fontSize));\n              assertFalse(button.hasAttribute('disabled'));\n              // Brave delegates host focus to the native Leo control.\n              const nativeButton = button.shadowRoot\n                  ?.querySelector('leo-button')?.shadowRoot\n                  ?.querySelector('button');\n              assertTrue(nativeButton instanceof HTMLButtonElement);\n              assertFalse(nativeButton.disabled);\n              assertTrue(nativeButton.tabIndex >= 0);\n              button.focus();\n              assertEquals(button, loadError.shadowRoot.activeElement);\n              assertEquals(\n                  nativeButton,\n                  (nativeButton.getRootNode() as ShadowRoot).activeElement);\n              const bounds = button.getBoundingClientRect();\n              assertTrue(bounds.width > 0 && bounds.height > 0);\n              assertTrue(bounds.left >= dialogBounds.left - 1);\n"
    count: 1

  - description: "Android724 retry dialog: reject duplicate dispatch; preserve pending-state regression 1"
    regex:
      re_pattern: "import\\ \\{assertEquals,\\ assertFalse,\\ assertTrue\\}\\ from\\ 'chrome://webui\\-test/chai_assert\\.js';\\\n"
      replace: "// <if expr=\"is_android\">\nimport {PromiseResolver} from 'chrome://resources/js/promise_resolver.js';\n// </if>\nimport {assertEquals, assertFalse, assertTrue} from 'chrome://webui-test/chai_assert.js';\n"
    count: 1

  - description: "Android724 retry dialog: reject duplicate dispatch; preserve pending-state regression 2"
    regex:
      re_pattern: "\\\n\\ \\ \\ \\ mockDelegate\\.setRetryLoadUnpackedError\\(stubLoadError\\);\\\n"
      replace: "\n    // <if expr=\"is_android\">\n    const pendingRetry = new PromiseResolver<boolean>();\n    const originalRetry = mockDelegate.retryLoadUnpacked.bind(mockDelegate);\n    mockDelegate.retryLoadUnpacked = (guid: string) => {\n      mockDelegate.methodCalled('retryLoadUnpacked', guid);\n      return pendingRetry.promise;\n    };\n    const retryButton =\n        loadError.shadowRoot.querySelector<HTMLElement>('.action-button')!;\n    const spinner = loadError.shadowRoot.querySelector<HTMLElement>('.spinner')!;\n    // Both clicks happen before Lit has rendered the disabled state.\n    retryButton.click();\n    retryButton.click();\n    assertEquals(1, mockDelegate.getCallCount('retryLoadUnpacked'));\n    assertEquals(fakeGuid, mockDelegate.getArgs('retryLoadUnpacked')[0]);\n    await microtasksFinished();\n    assertTrue(retryButton.hasAttribute('disabled'));\n    assertFalse(spinner.hidden);\n    pendingRetry.reject(stubLoadError);\n    await microtasksFinished();\n    assertTrue(isElementVisible(dialogElement));\n    assertFalse(retryButton.hasAttribute('disabled'));\n    assertTrue(spinner.hidden);\n    assertEquals(1, mockDelegate.getCallCount('retryLoadUnpacked'));\n    mockDelegate.retryLoadUnpacked = originalRetry;\n    mockDelegate.resetResolver('retryLoadUnpacked');\n    // </if>\n\n    mockDelegate.setRetryLoadUnpackedError(stubLoadError);\n"
    count: 1
