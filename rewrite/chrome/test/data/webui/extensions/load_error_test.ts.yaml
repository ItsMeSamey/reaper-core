      replace: "    loadError.shadowRoot.querySelector<HTMLElement>('.cancel-button')!.click();\n    assertFalse(isElementVisible(dialogElement));\n    // <if expr=\"is_android\">\n    await checkAndroidRetryErrorPreservesNewerFocusAndClosedDialog();\n    // </if>\n  });"
