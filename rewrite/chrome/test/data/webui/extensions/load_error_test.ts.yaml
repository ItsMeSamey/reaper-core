  - description: Android import completion preserves keyboard focus ownership
    regex:
      pattern: "  test('RetrySuccess', async function() {"
      replace: "  // <if expr=\"is_android\">\n  async function checkAndroidRetryErrorPreservesNewerFocusAndClosedDialog() {\n    for (const scenario of ['cancel-focus', 'closed', 'detached']) {\n      document.body.appendChild(loadError);\n      await microtasksFinished();\n      loadError.show();\n      const pending = new PromiseResolver<boolean>();\n      mockDelegate.retryLoadUnpacked = () => pending.promise;\n      const retry = loadError.shadowRoot.querySelector<HTMLElement>('.action-button')!;\n      const cancel = loadError.shadowRoot.querySelector<HTMLElement>('.cancel-button')!;\n      retry.focus();\n      assertTrue(retry.matches(':focus-within'));\n      retry.click();\n      await microtasksFinished();\n      assertTrue(retry.hasAttribute('disabled'));\n      if (scenario === 'cancel-focus') {\n        cancel.focus();\n      } else {\n        loadError.close();\n        if (scenario === 'detached') {\n          loadError.remove();\n        }\n      }\n      const chosenFocus = getDeepActiveElement();\n      pending.reject({...stubLoadError, error: 'Retry still failed'});\n      await microtasksFinished();\n      assertEquals(chosenFocus, getDeepActiveElement());\n      assertFalse(retry.hasAttribute('disabled'));\n      assertEquals(scenario === 'cancel-focus', loadError.$.dialog.getNative().open);\n      loadError.close();\n    }\n  }\n  // </if>\n\n  test('RetrySuccess', async function() {"
    count: 1
  - description: Android load-error Retry delivers only to its current presentation
    regex:
      pattern: "    assertFalse(isElementVisible(dialogElement));\n    // <if expr=\"is_android\">\n    await checkAndroidRetryErrorPreservesNewerFocusAndClosedDialog();\n    // </if>\n  });\n\n"
      replace: "    assertFalse(isElementVisible(dialogElement));\n    // <if expr=\"is_android\">\n    await checkAndroidRetryErrorPreservesNewerFocusAndClosedDialog();\n    await checkAndroidSupersededRetryPreservesNewError();\n    await checkAndroidSupersededRetryDuringFocusRender();\n    // </if>\n  });\n\n"
    count: 1
  - description: Android load-error Retry delivers only to its current presentation
    regex:
      pattern: "      assertFalse(retry.hasAttribute('disabled'));\n      assertEquals(scenario === 'cancel-focus', loadError.$.dialog.getNative().open);\n      loadError.close();\n    }\n  }\n  // </if>\n"
      replace: "      assertFalse(retry.hasAttribute('disabled'));\n      assertEquals(scenario === 'cancel-focus', loadError.$.dialog.getNative().open);\n      loadError.close();\n    }\n  }\n  // </if>\n\n  // <if expr=\"is_android\">\n  async function checkAndroidSupersededRetryPreservesNewError() {\n    for (const outcome of ['success', 'failure']) {\n      for (const sameError of [false, true]) {\n        loadError.remove();\n        loadError = document.createElement('extensions-load-error');\n        loadError.delegate = mockDelegate;\n        loadError.loadError = stubLoadError;\n        document.body.appendChild(loadError);\n        await microtasksFinished();\n        loadError.show();\n        const oldRetry = new PromiseResolver<boolean>();\n        mockDelegate.retryLoadUnpacked = () => oldRetry.promise;\n        const retry = loadError.shadowRoot.querySelector<HTMLElement>('.action-button')!;\n        const cancel = loadError.shadowRoot.querySelector<HTMLElement>('.cancel-button')!;\n        retry.focus();\n        retry.click();\n        await microtasksFinished();\n        assertTrue(retry.hasAttribute('disabled'));\n\n        // manager.onLoadError_ reuses the open dialog and calls show() for\n        // each new event, including a repeated presentation of the same Error.\n        const newerError = sameError ? stubLoadError :\n            {...stubLoadError, error: 'Newer failure', retryGuid: 'newer-guid'};\n        loadError.loadError = newerError;\n        loadError.show();\n        await microtasksFinished();\n        assertTrue(retry.hasAttribute('disabled'));\n        cancel.focus();\n        const chosenFocus = getDeepActiveElement();\n        if (outcome === 'success') {\n          oldRetry.resolve(true);\n        } else {\n          oldRetry.reject({...stubLoadError, error: 'Old retry failed'});\n        }\n        await microtasksFinished();\n        assertTrue(loadError.$.dialog.getNative().open);\n        assertEquals(newerError, loadError.loadError);\n        assertEquals(chosenFocus, getDeepActiveElement());\n        assertFalse(retry.hasAttribute('disabled'));\n\n        // A subsequent explicit Retry still delivers the current result.\n        const currentRetry = new PromiseResolver<boolean>();\n        mockDelegate.retryLoadUnpacked = () => currentRetry.promise;\n        retry.click();\n        await microtasksFinished();\n        assertTrue(retry.hasAttribute('disabled'));\n        currentRetry.resolve(true);\n        await microtasksFinished();\n        assertFalse(loadError.$.dialog.getNative().open);\n      }\n    }\n  }\n\n  async function checkAndroidSupersededRetryDuringFocusRender() {\n    for (const startNewRetry of [false, true]) {\n      loadError.remove();\n      loadError = document.createElement('extensions-load-error');\n      loadError.delegate = mockDelegate;\n      loadError.loadError = stubLoadError;\n      document.body.appendChild(loadError);\n      await microtasksFinished();\n      loadError.show();\n      const oldRetry = new PromiseResolver<boolean>();\n      mockDelegate.retryLoadUnpacked = () => oldRetry.promise;\n      const retry = loadError.shadowRoot.querySelector<HTMLElement>('.action-button')!;\n      const cancel = loadError.shadowRoot.querySelector<HTMLElement>('.cancel-button')!;\n      retry.focus();\n      retry.click();\n      await microtasksFinished();\n\n      // Hold only the callback's render await; Lit still performs real updates.\n      const renderGate = new PromiseResolver<boolean>();\n      let awaitedRender = false;\n      Object.defineProperty(loadError, 'updateComplete', {\n        configurable: true,\n        get: () => {\n          awaitedRender = true;\n          return renderGate.promise;\n        },\n      });\n      try {\n        oldRetry.reject({...stubLoadError, error: 'Old retry failed'});\n        await microtasksFinished();\n        assertTrue(awaitedRender);\n        assertFalse(retry.hasAttribute('disabled'));\n        const newerError = {...stubLoadError, error: 'Newer failure'};\n        loadError.loadError = newerError;\n        loadError.show();\n        await microtasksFinished();\n        const currentRetry = new PromiseResolver<boolean>();\n        mockDelegate.retryLoadUnpacked = () => currentRetry.promise;\n        if (startNewRetry) {\n          retry.click();\n          await microtasksFinished();\n          assertTrue(retry.hasAttribute('disabled'));\n          cancel.focus();\n        } else {\n          cancel.focus();\n          cancel.blur();\n          // The old focus condition accepts body; only request ownership may\n          // stop its late continuation from focusing the newer presentation.\n          assertEquals(document.body, getDeepActiveElement());\n        }\n        const chosenFocus = getDeepActiveElement();\n        renderGate.resolve(true);\n        await microtasksFinished();\n        assertTrue(loadError.$.dialog.getNative().open);\n        assertEquals(newerError, loadError.loadError);\n        assertEquals(startNewRetry, retry.hasAttribute('disabled'));\n        assertEquals(chosenFocus, getDeepActiveElement());\n        if (startNewRetry) {\n          currentRetry.resolve(true);\n          await microtasksFinished();\n          assertFalse(loadError.$.dialog.getNative().open);\n        }\n      } finally {\n        Reflect.deleteProperty(loadError, 'updateComplete');\n        renderGate.resolve(true);\n        loadError.close();\n      }\n    }\n  }\n  // </if>\n"
    count: 1
