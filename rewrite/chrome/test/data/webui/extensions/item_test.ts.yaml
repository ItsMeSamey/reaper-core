# Android-only extensions viewport and responsive controls.
substitutions:
  - description: Adapt the extensions WebUI and existing layout coverage for Android phone widths
    regex:
      re_pattern: \ \ test\('ElementVisibilityNormalState',\ async\ \(\)\ =>\ \{
      replace: "  // <if expr=\"is_android\">\n  test('AndroidWrappedActionControls', async () => {\n    // A 320px phone leaves a 288px card after the list's side padding.\n    item.style.display = 'block';\n    item.style.width = '288px';\n    const upload = createStoreItemData({canUploadAsAccountExtension: true});\n    const unpacked = createExtensionInfo(\n        {location: chrome.developerPrivate.Location.UNPACKED});\n    const corrupt = createStoreItemData();\n    corrupt.state = chrome.developerPrivate.ExtensionState.DISABLED;\n    corrupt.disableReasons.corruptInstall = true;\n    const terminated = createStoreItemData(\n        {state: chrome.developerPrivate.ExtensionState.TERMINATED});\n    const cases = [\n      {data: upload, devMode: false, control: '#account-upload-button'},\n      {data: unpacked, devMode: true, control: '#dev-reload-button'},\n      {data: corrupt, devMode: false, control: '#repair-button'},\n      {data: terminated, devMode: false, control: '#terminated-reload-button'},\n    ];\n    for (const entry of cases) {\n      entry.data.runtimeErrors = [createRuntimeError(entry.data.id)];\n      item.data = entry.data;\n      item.inDevMode = entry.devMode;\n      await microtasksFinished();\n      testVisible(item, '#errors-button', true);\n      testVisible(item, entry.control, true);\n      // Exercise long localized labels without depending on a UI locale.\n      for (const button of item.shadowRoot.querySelectorAll(\n               '#button-strip cr-button')) {\n        for (const node of button.childNodes) {\n          if (node.nodeType === Node.TEXT_NODE && node.textContent?.trim()) {\n            node.textContent = 'Extension action with a long localized label';\n          }\n        }\n      }\n      for (const fontSize of [13, 26]) {\n        item.style.fontSize = `${fontSize}px`;\n        for (const direction of ['ltr', 'rtl']) {\n          item.dir = direction;\n          const card = item.shadowRoot.querySelector<HTMLElement>('#card')!;\n          const bounds = card.getBoundingClientRect();\n          const controls = item.shadowRoot.querySelectorAll<HTMLElement>(\n              '#button-strip cr-button, #button-strip cr-icon-button, ' +\n              '#button-strip cr-toggle');\n          const rects: DOMRect[] = [];\n          for (const control of controls) {\n            const rect = control.getBoundingClientRect();\n            if (!rect.width || !rect.height) {\n              continue;\n            }\n            assertTrue(rect.left >= bounds.left && rect.right <= bounds.right);\n            assertTrue(rect.top >= bounds.top && rect.bottom <= bounds.bottom);\n            if (control.tagName !== 'CR-TOGGLE') {\n              assertTrue(rect.height >= 48);\n            }\n            if (control.tagName === 'CR-BUTTON') {\n              assertEquals(`${fontSize}px`, getComputedStyle(control).fontSize);\n            }\n            for (const other of rects) {\n              assertFalse(\n                  rect.left < other.right && rect.right > other.left &&\n                  rect.top < other.bottom && rect.bottom > other.top);\n            }\n            rects.push(rect);\n          }\n          assertTrue(rects.length >= 4);\n          assertTrue(card.scrollWidth <= card.clientWidth);\n        }\n      }\n    }\n  });\n  // </if>\n\n  test('ElementVisibilityNormalState', async () => {"
  - description: Adapt the extensions WebUI and existing layout coverage for Android phone widths
    regex:
      re_pattern: '\ \ \ \ function\ assertCardHeight\(expected:\ number\)\ \{\

        \ \ \ \ \ \ assertEquals\(expected,\ Math\.round\(card\.getBoundingClientRect\(\)\.height\)\);\

        \ \ \ \ \}'
      replace: "    function assertCardHeight(expected: number) {\n      // <if expr=\"is_android\">\n      // Android cards may grow to keep wrapped controls reachable.\n      assertTrue(Math.round(card.getBoundingClientRect().height) >= expected);\n      // </if>\n      // <if expr=\"not is_android\">\n      assertEquals(expected, Math.round(card.getBoundingClientRect().height));\n      // </if>\n    }"

  - description: Click the real Android Leo switch in the existing item delegate test
    regex:
      re_pattern: "\\ \\ \\ \\ await\\ mockDelegate\\.testClickingCalls\\(\\n\\ \\ \\ \\ \\ \\ \\ \\ item\\.\\$\\.enableToggle,\\ 'setItemEnabled',\\ \\[item\\.data\\.id,\\ false\\]\\);\\n"
      replace: "    // <if expr=\"is_android\">\n    // Brave's toggle handles clicks on the inner Leo switch.\n    const leoToggle =\n        item.$.enableToggle.shadowRoot.querySelector('leo-toggle');\n    assertTrue(!!leoToggle);\n    const enableButton =\n        leoToggle.shadowRoot!.querySelector<HTMLButtonElement>(\n            'button[role=\"switch\"]');\n    assertTrue(!!enableButton);\n    await mockDelegate.testClickingCalls(\n        enableButton, 'setItemEnabled', [item.data.id, false]);\n    // </if>\n    // <if expr=\"not is_android\">\n    await mockDelegate.testClickingCalls(\n        item.$.enableToggle, 'setItemEnabled', [item.data.id, false]);\n    // </if>\n"
    count: 1
  - description: Preserve newer Android reload toast ownership 1
    regex:
      re_pattern: "\\\nimport\\ type\\ \\{CrIconElement,\\ ExtensionsItemElement\\}\\ from\\ 'chrome://extensions/extensions\\.js';\\\nimport\\ \\{navigation,\\ Page\\}\\ from\\ 'chrome://extensions/extensions\\.js';\\\nimport\\ \\{loadTimeData\\}\\ from\\ 'chrome://resources/js/load_time_data\\.js';\\\nimport\\ \\{assertDeepEquals,\\ assertEquals,\\ assertFalse,\\ assertTrue\\}\\ from\\ 'chrome://webui\\-test/chai_assert\\.js';\\\nimport\\ \\{isChildVisible,\\ microtasksFinished\\}\\ from\\ 'chrome://webui\\-test/test_util\\.js';\\\n"
      replace: "\nimport type {CrIconElement, ExtensionsItemElement} from 'chrome://extensions/extensions.js';\nimport {navigation, Page} from 'chrome://extensions/extensions.js';\n// <if expr=\"is_android\">\nimport {getToastManager} from 'chrome://resources/cr_elements/cr_toast/cr_toast_manager.js';\nimport {MockTimer} from 'chrome://webui-test/mock_timer.js';\n// </if>\nimport {loadTimeData} from 'chrome://resources/js/load_time_data.js';\nimport {assertDeepEquals, assertEquals, assertFalse, assertTrue} from 'chrome://webui-test/chai_assert.js';\nimport {isChildVisible, microtasksFinished} from 'chrome://webui-test/test_util.js';\n"
    count: 1
  - description: Preserve newer Android reload toast ownership 2
    regex:
      re_pattern: "\\ \\ \\ \\ item\\.shadowRoot\\.querySelector<HTMLElement>\\('\\#dev\\-reload\\-button'\\)!\\.click\\(\\);\\\n\\ \\ \\ \\ id\\ =\\ await\\ proxyDelegate\\.whenCalled\\('reloadItem'\\);\\\n\\ \\ \\ \\ assertEquals\\(item\\.data\\.id,\\ id\\);\\\n\\ \\ \\ \\ return\\ verifyEventPromise\\(true\\);\\\n\\ \\ \\}\\);\\\n\\\n\\ \\ test\\('Description',\\ async\\ \\(\\)\\ =>\\ \\{\\\n"
      replace: "    item.shadowRoot.querySelector<HTMLElement>('#dev-reload-button')!.click();\n    id = await proxyDelegate.whenCalled('reloadItem');\n    assertEquals(item.data.id, id);\n    // <if expr=\"not is_android\">\n    return verifyEventPromise(true);\n    // </if>\n    // <if expr=\"is_android\">\n    await verifyEventPromise(true);\n    const toast = getToastManager();\n    assertTrue(toast.duration > 0, 'Owned reload failure restores finite duration');\n    assertFalse(toast.isToastOpen);\n\n    // Different cards may reload concurrently; both use the same label and\n    // singleton toast. A's completion must not retire B's newer status.\n    for (const finishBFirst of [false, true]) {\n      for (const failA of [false, true]) {\n        const second = document.createElement('extensions-item');\n        second.data = createExtensionInfo({\n          id: 'b'.repeat(32),\n          location: chrome.developerPrivate.Location.UNPACKED,\n        });\n        const firstDelegate = new TestService();\n        const secondDelegate = new TestService();\n        let finishA: () => void = () => {};\n        let finishB: () => void = () => {};\n        const calls: string[] = [];\n        const loadError = {message: 'Expected first reload failure'};\n        firstDelegate.reloadItem = (id: string) => {\n          calls.push(id);\n          return new Promise<void>((resolve, reject) => {\n            finishA = failA ? () => reject(loadError) : resolve;\n          });\n        };\n        secondDelegate.reloadItem = (id: string) => {\n          calls.push(id);\n          return new Promise<void>(resolve => { finishB = resolve; });\n        };\n        item.delegate = firstDelegate;\n        second.delegate = secondDelegate;\n        document.body.appendChild(second);\n        await microtasksFinished();\n        const timer = new MockTimer();\n        timer.install();\n        try {\n          const first = item.reloadItem().then(\n              () => null, error => error);\n          const firstMarker = toast.$.content.lastChild!;\n          assertEquals(Node.COMMENT_NODE, firstMarker.nodeType);\n          const secondReload = second.reloadItem();\n          const secondMarker = toast.$.content.lastChild!;\n          assertEquals(Node.COMMENT_NODE, secondMarker.nodeType);\n          assertEquals(null, firstMarker.parentNode);\n          assertDeepEquals([item.data!.id, second.data!.id], calls);\n          assertTrue(toast.isToastOpen);\n          assertEquals(0, toast.duration);\n          if (finishBFirst) {\n            finishB();\n            await secondReload;\n            await toast.updateComplete;\n            await toast.$.toast.updateComplete;\n            const duration = toast.duration;\n            const elapsed = Math.floor(duration / 2);\n            assertTrue(elapsed > 0);\n            assertTrue(toast.isToastOpen);\n            const completedContent = toast.$.content.lastChild;\n            timer.tick(elapsed);\n            finishA();\n            assertEquals(failA ? loadError : null, await first);\n            await toast.updateComplete;\n            await toast.$.toast.updateComplete;\n            assertTrue(toast.isToastOpen, 'Stale A must not hide completed B');\n            assertEquals(duration, toast.duration);\n            assertEquals(completedContent, toast.$.content.lastChild);\n            assertEquals(loadTimeData.getString('itemReloaded'),\n                toast.$.content.textContent);\n            timer.tick(duration - elapsed - 1);\n            assertTrue(toast.isToastOpen);\n            timer.tick(1);\n            assertFalse(toast.isToastOpen, 'B retains its original auto-hide deadline');\n          } else {\n            finishA();\n            assertEquals(failA ? loadError : null, await first);\n            assertTrue(toast.isToastOpen, 'A must not hide B pending status');\n            assertEquals(0, toast.duration, 'A must not shorten B pending status');\n            assertEquals(secondMarker, toast.$.content.lastChild);\n            assertEquals(loadTimeData.getString('itemReloading'),\n                toast.$.content.textContent);\n            finishB();\n            await secondReload;\n            assertEquals(null, secondMarker.parentNode);\n            assertTrue(toast.isToastOpen);\n            assertTrue(toast.duration > 0);\n            assertEquals(loadTimeData.getString('itemReloaded'),\n                toast.$.content.textContent);\n          }\n        } finally {\n          toast.hide();\n          await toast.$.toast.updateComplete;\n          timer.uninstall();\n          second.remove();\n        }\n      }\n    }\n    // </if>\n  });\n\n  test('Description', async () => {\n"
    count: 1
