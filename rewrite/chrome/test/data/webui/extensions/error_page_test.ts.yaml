      replace: "  });\n  // <if expr=\"is_android\">\n\n  function createSourceResponse(highlight: string):\n      chrome.developerPrivate.RequestFileSourceResponse {\n    return {\n      source: {\n        beforeHighlight: '',\n        highlight,\n        afterHighlight: '',\n      },\n      message: '',\n      title: '',\n    };\n  }\n\n  async function resolveSource(\n      resolver:\n          PromiseResolver<chrome.developerPrivate.RequestFileSourceResponse>,\n      highlight: string) {\n    const response = createSourceResponse(highlight);\n    resolver.resolve(response);\n    await resolver.promise;\n    await microtasksFinished();\n    return response;\n  }\n\n  function displayedCode() {\n    return errorPage.shadowRoot.querySelector('extensions-code-section')!.code;\n  }\n\n  function errorButtons() {\n    return errorPage.shadowRoot.querySelectorAll<HTMLElement>(\n        '.error-item .start');\n  }\n\n  async function setTwoErrors() {\n    const data = structuredClone(extensionData);\n    data.runtimeErrors.push({\n      ...data.runtimeErrors[0]!,\n      id: 2,\n      message: 'Other error',\n      source: 'chrome-extension://' + extensionId + '/other_source.html',\n    });\n    errorPage.data = data;\n    await microtasksFinished();\n    return data.runtimeErrors;\n  }\n\n  function stackFrame(url: string, lineNumber: number):\n      chrome.developerPrivate.StackFrame {\n    return {url, lineNumber, columnNumber: 1, functionName: 'frame'};\n  }\n\n  function mixedStack() {\n    return [\n      stackFrame('extensions::internal-first', 1),\n      stackFrame('chrome-extension://' + extensionId + '/first.js', 11),\n      stackFrame('extensions::internal-middle', 2),\n      stackFrame('chrome-extension://' + extensionId + '/last.js', 33),\n      stackFrame('extensions::internal-last', 3),\n    ];\n  }\n\n  async function setStack(\n      stackTrace: chrome.developerPrivate.StackFrame[]) {\n    const data = structuredClone(extensionData);\n    data.runtimeErrors[0]!.stackTrace = stackTrace;\n    errorPage.data = data;\n    await microtasksFinished();\n    return errorPage.shadowRoot.querySelectorAll<HTMLLIElement>(\n        '.stack-trace-container li');\n  }\n\n  test('SourceResponseFollowsErrorSelection', async () => {\n    const errors = await setTwoErrors();\n    const firstRequest = mockDelegate.requestFileSourceResolver;\n    errorButtons()[1]!.click();\n    await microtasksFinished();\n    const secondRequest = mockDelegate.requestFileSourceResolver;\n    assertTrue(firstRequest !== secondRequest);\n    assertEquals(errors[1], errorPage.getSelectedError());\n    assertEquals(\n        'other_source.html', mockDelegate.requestFileSourceArgs!.pathSuffix);\n\n    const secondCode = await resolveSource(secondRequest, 'second error');\n    assertEquals(secondCode, displayedCode());\n    await resolveSource(firstRequest, 'stale first error');\n    assertEquals(errors[1], errorPage.getSelectedError());\n    assertEquals(secondCode, displayedCode());\n  });\n\n  test('SourceResponseFollowsStackFrameSelection', async () => {\n    const frames = await setStack([\n      stackFrame('chrome-extension://' + extensionId + '/first.js', 11),\n      stackFrame('chrome-extension://' + extensionId + '/last.js', 33),\n    ]);\n    frames[0]!.click();\n    await microtasksFinished();\n    const firstRequest = mockDelegate.requestFileSourceResolver;\n    frames[1]!.click();\n    await microtasksFinished();\n    const secondRequest = mockDelegate.requestFileSourceResolver;\n    assertTrue(firstRequest !== secondRequest);\n    assertEquals(null, displayedCode());\n    assertEquals('last.js', mockDelegate.requestFileSourceArgs!.pathSuffix);\n    assertEquals(33, mockDelegate.requestFileSourceArgs!.lineNumber);\n\n    const secondCode = await resolveSource(secondRequest, 'second frame');\n    assertEquals(secondCode, displayedCode());\n    await resolveSource(firstRequest, 'stale first frame');\n    assertTrue(frames[1]!.classList.contains('selected'));\n    assertEquals(0, frames[1]!.tabIndex);\n    assertEquals(secondCode, displayedCode());\n  });\n\n  test('SourceResponseFollowsRepeatedSelection', async () => {\n    const errors = await setTwoErrors();\n    const firstRequest = mockDelegate.requestFileSourceResolver;\n    errorButtons()[1]!.click();\n    await microtasksFinished();\n    const secondRequest = mockDelegate.requestFileSourceResolver;\n    errorButtons()[0]!.click();\n    await microtasksFinished();\n    const currentRequest = mockDelegate.requestFileSourceResolver;\n    assertTrue(currentRequest !== firstRequest);\n\n    const currentCode = await resolveSource(currentRequest, 'current first');\n    await resolveSource(secondRequest, 'stale second');\n    await resolveSource(firstRequest, 'stale first');\n    assertEquals(errors[0], errorPage.getSelectedError());\n    assertEquals(currentCode, displayedCode());\n  });\n\n  test('SourceResponseInvalidatedByCollapse', async () => {\n    await microtasksFinished();\n    const pending = mockDelegate.requestFileSourceResolver;\n    errorButtons()[0]!.click();\n    await microtasksFinished();\n    assertEquals(null, errorPage.getSelectedError());\n    assertEquals(null, displayedCode());\n    await resolveSource(pending, 'collapsed request');\n    assertEquals(null, displayedCode());\n\n    errorButtons()[0]!.click();\n    await microtasksFinished();\n    assertEquals(null, displayedCode());\n    const currentCode = await resolveSource(\n        mockDelegate.requestFileSourceResolver, 'reopened request');\n    assertEquals(currentCode, displayedCode());\n  });\n\n  test('SourceResponseInvalidatedByInvalidUrl', async () => {\n    await microtasksFinished();\n    const pending = mockDelegate.requestFileSourceResolver;\n    const data = structuredClone(extensionData);\n    data.runtimeErrors[0]!.source = 'invalid_url';\n    errorPage.data = data;\n    await microtasksFinished();\n    assertEquals(pending, mockDelegate.requestFileSourceResolver);\n    assertEquals(null, displayedCode());\n    await resolveSource(pending, 'old valid URL');\n    assertEquals(data.runtimeErrors[0], errorPage.getSelectedError());\n    assertEquals(null, displayedCode());\n  });\n\n  test('SourceResponseInvalidatedByClearedData', async () => {\n    for (const unset of [false, true]) {\n      errorPage.data = structuredClone(extensionData);\n      await microtasksFinished();\n      const pending = mockDelegate.requestFileSourceResolver;\n      if (unset) {\n        errorPage.data = undefined;\n      } else {\n        const empty = structuredClone(extensionData);\n        empty.runtimeErrors = [];\n        errorPage.data = empty;\n      }\n      await microtasksFinished();\n      assertEquals(null, errorPage.getSelectedError());\n      assertEquals(\n          null, errorPage.shadowRoot.querySelector('extensions-code-section'));\n\n      const restored = structuredClone(extensionData);\n      restored.runtimeErrors[0]!.source =\n          'chrome-extension://' + extensionId + '/restored.js';\n      errorPage.data = restored;\n      await microtasksFinished();\n      const currentRequest = mockDelegate.requestFileSourceResolver;\n      assertTrue(currentRequest !== pending);\n      await resolveSource(pending, 'old cleared selection');\n      assertEquals(null, displayedCode());\n      const currentCode = await resolveSource(currentRequest, 'restored source');\n      assertEquals(currentCode, displayedCode());\n    }\n  });\n\n  test('InitialStackSelectionSkipsInternalFrames', async () => {\n    const frames = await setStack(mixedStack());\n    assertEquals(5, frames.length);\n    assertTrue(frames[0]!.hidden);\n    assertTrue(frames[2]!.hidden);\n    assertTrue(frames[4]!.hidden);\n    assertFalse(frames[1]!.hidden);\n    assertTrue(frames[1]!.classList.contains('selected'));\n    assertEquals(0, frames[1]!.tabIndex);\n    assertEquals(-1, frames[0]!.tabIndex);\n    assertEquals(-1, frames[2]!.tabIndex);\n    assertEquals(-1, frames[3]!.tabIndex);\n    assertEquals(-1, frames[4]!.tabIndex);\n    assertEquals('first.js', mockDelegate.requestFileSourceArgs!.pathSuffix);\n    assertEquals(11, mockDelegate.requestFileSourceArgs!.lineNumber);\n  });\n\n  test('StackKeyboardNavigationSkipsInternalFrames', async () => {\n    const frames = await setStack(mixedStack());\n    // Select a visible frame explicitly so initial selection cannot mask\n    // a separate regression in keyboard navigation.\n    frames[1]!.click();\n    await microtasksFinished();\n    frames[1]!.focus();\n\n    const firstRequest = mockDelegate.requestFileSourceResolver;\n    frames[1]!.dispatchEvent(new KeyboardEvent('keydown', {\n      key: 'ArrowUp',\n      bubbles: true,\n      cancelable: true,\n    }));\n    await microtasksFinished();\n    assertEquals(firstRequest, mockDelegate.requestFileSourceResolver);\n    assertEquals(frames[1], errorPage.shadowRoot.activeElement);\n\n    frames[1]!.dispatchEvent(new KeyboardEvent('keydown', {\n      key: 'ArrowDown',\n      bubbles: true,\n      cancelable: true,\n    }));\n    await microtasksFinished();\n    assertTrue(frames[3]!.classList.contains('selected'));\n    assertEquals(0, frames[3]!.tabIndex);\n    assertEquals(-1, frames[1]!.tabIndex);\n    assertEquals(frames[3], errorPage.shadowRoot.activeElement);\n    assertEquals('last.js', mockDelegate.requestFileSourceArgs!.pathSuffix);\n    assertEquals(33, mockDelegate.requestFileSourceArgs!.lineNumber);\n\n    const lastRequest = mockDelegate.requestFileSourceResolver;\n    frames[3]!.dispatchEvent(new KeyboardEvent('keydown', {\n      key: 'ArrowDown',\n      bubbles: true,\n      cancelable: true,\n    }));\n    await microtasksFinished();\n    assertEquals(lastRequest, mockDelegate.requestFileSourceResolver);\n    assertEquals(frames[3], errorPage.shadowRoot.activeElement);\n\n    frames[3]!.dispatchEvent(new KeyboardEvent('keydown', {\n      key: 'ArrowUp',\n      bubbles: true,\n      cancelable: true,\n    }));\n    await microtasksFinished();\n    assertTrue(frames[1]!.classList.contains('selected'));\n    assertEquals(0, frames[1]!.tabIndex);\n    assertEquals(-1, frames[3]!.tabIndex);\n    assertEquals(frames[1], errorPage.shadowRoot.activeElement);\n    assertEquals('first.js', mockDelegate.requestFileSourceArgs!.pathSuffix);\n    assertEquals(11, mockDelegate.requestFileSourceArgs!.lineNumber);\n  });\n\n  test('StackSelectionWithNoVisibleFrames', async () => {\n    for (const stack of [\n      [],\n      [\n        stackFrame('extensions::internal-first', 1),\n        stackFrame('extensions::internal-last', 2),\n      ],\n    ]) {\n      const frames = await setStack(stack);\n      assertEquals(stack.length, frames.length);\n      for (const frame of frames) {\n        assertTrue(frame.hidden);\n        assertEquals(-1, frame.tabIndex);\n        assertFalse(frame.classList.contains('selected'));\n      }\n      assertEquals('source.html', mockDelegate.requestFileSourceArgs!.pathSuffix);\n      assertEquals(0, mockDelegate.requestFileSourceArgs!.lineNumber);\n\n      const pending = mockDelegate.requestFileSourceResolver;\n      const list = errorPage.shadowRoot.querySelector<HTMLUListElement>(\n          '.stack-trace-container')!;\n      list.dispatchEvent(new KeyboardEvent('keydown', {\n        key: 'ArrowDown',\n        bubbles: true,\n        cancelable: true,\n      }));\n      await microtasksFinished();\n      assertEquals(pending, mockDelegate.requestFileSourceResolver);\n    }\n  });\n  // </if>\n});\n"
