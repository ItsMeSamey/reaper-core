sertEquals(2, infoCalls);\n      assertEquals(0, installCalls);\n      assertFalse(notice.hidden);\n      assertTrue(notice.getBoundingClientRect().height > 0);\n      assertTrue(retry.hidden);\n    } finally {\n      service.getProfileConfiguration = originalProfile;\n      service.getExtensionsInfo = originalInfo;\n      service.installFromFile = originalInstall;\n      manager.remove();\n    }\n  });\n\n  async function withInitialHistoryInfoHeld(\n      targetExists: boolean,\n      run: (id: string, releaseInfo: () => Promise<void>) => Promise<void>) {\n"
