- description: Retire queued Android load-error presentation ownership
  regex:
    pattern: "  async function flushOptionsPresentation(timer: MockTimer) {"
    replace: "  // Use the real native dialog; only hold the manager's presentation timer.\n  async function withPendingLoadError(\n      run: (flush: () => Promise<void>) => Promise<void>) {\n    const timer = new MockTimer();\n    const callbackResults: Array<Promise<void>> = [];\n    const callbackErrors: unknown[] = [];\n    timer.install();\n    const mockSetTimeout = window.setTimeout.bind(window);\n    window.setTimeout = ((\n        handler: TimerHandler, delay?: number, ...args: unknown[]) => {\n      if (typeof handler !== 'function') {\n        return mockSetTimeout(handler, delay, ...args);\n      }\n      return mockSetTimeout(() => {\n        try {\n          const result = handler(...args);\n          if (result instanceof Promise) {\n            callbackResults.push(result.then(\n                () => {}, error => {callbackErrors.push(error);}));\n          }\n        } catch (error) {\n          callbackErrors.push(error);\n        }\n      }, delay);\n    }) as typeof window.setTimeout;\n    const flush = async () => {\n      timer.tick(0);\n      await Promise.all(callbackResults);\n      await manager.updateComplete;\n      assertEquals(0, callbackErrors.length, String(callbackErrors[0]));\n    };\n    try {\n      await run(flush);\n      await Promise.all(callbackResults);\n      assertEquals(0, callbackErrors.length, String(callbackErrors[0]));\n    } finally {\n      timer.uninstall();\n    }\n  }\n\n  function queueLoadError(error: Error) {\n    manager.dispatchEvent(new CustomEvent('load-error', {detail: error}));\n  }\n\n  test('AndroidDetachedLoadErrorPresentationIsRetired', async () => {\n    await withPendingLoadError(async flush => {\n      const input = document.createElement('input');\n      document.body.appendChild(input);\n      try {\n        for (const scenario of ['detached', 'reattached', 'detached-event']) {\n          const reattachBeforeFlush = scenario !== 'detached';\n          queueLoadError(new Error('retired error'));\n          await manager.updateComplete;\n          const oldDialog =\n              manager.shadowRoot.querySelector('extensions-load-error')!;\n          await oldDialog.updateComplete;\n          manager.remove();\n          if (scenario === 'detached-event') {\n            queueLoadError(new Error('late detached child error'));\n          }\n          input.focus();\n          assertEquals(input, getDeepActiveElement());\n          if (reattachBeforeFlush) {\n            document.body.appendChild(manager);\n          }\n          await flush();\n          assertFalse(oldDialog.$.dialog.getNative().open);\n          assertEquals(input, getDeepActiveElement());\n          if (!manager.isConnected) {\n            document.body.appendChild(manager);\n          }\n          const first = new Error('superseded error');\n          const latest = new Error('latest connected error');\n          queueLoadError(first);\n          queueLoadError(latest);\n          await flush();\n          const dialog =\n              manager.shadowRoot.querySelector('extensions-load-error')!;\n          assertEquals(latest, dialog.loadError);\n          assertTrue(dialog.$.dialog.getNative().open);\n          assertTrue(dialog.matches(':focus-within'));\n          const closed = eventToPromise('close', dialog.$.dialog.getNative());\n          dialog.close();\n          await closed;\n          await manager.updateComplete;\n          assertFalse(!!manager.shadowRoot.querySelector('extensions-load-error'));\n        }\n      } finally {\n        if (!manager.isConnected) {\n          document.body.appendChild(manager);\n        }\n        input.remove();\n      }\n    });\n  });\n\n  test('AndroidLoadErrorReplacementPreservesCurrentOwner', async () => {\n    await withPendingLoadError(async flush => {\n      for (const closeBeforePresentation of [true, false]) {\n        queueLoadError(new Error('first error'));\n        await flush();\n        const dialog =\n            manager.shadowRoot.querySelector('extensions-load-error')!;\n        assertTrue(dialog.$.dialog.getNative().open);\n        const oldClosed = eventToPromise('close', dialog.$.dialog.getNative());\n        let oldCloseDelivered = false;\n        void oldClosed.then(() => oldCloseDelivered = true);\n        dialog.close();\n        assertFalse(oldCloseDelivered);\n        const latest = new Error('next error');\n        queueLoadError(latest);\n        if (closeBeforePresentation) {\n          await oldClosed;\n          await manager.updateComplete;\n          assertTrue(dialog ===\n              manager.shadowRoot.querySelector('extensions-load-error'));\n          await flush();\n        } else {\n          await flush();\n          assertFalse(oldCloseDelivered);\n          await oldClosed;\n          await manager.updateComplete;\n        }\n        assertEquals(latest, dialog.loadError);\n        assertTrue(dialog ===\n            manager.shadowRoot.querySelector('extensions-load-error'));\n        assertTrue(dialog.$.dialog.getNative().open);\n        assertTrue(dialog.matches(':focus-within'));\n        const closed = eventToPromise('close', dialog.$.dialog.getNative());\n        dialog.close();\n        await closed;\n        await manager.updateComplete;\n        assertFalse(!!manager.shadowRoot.querySelector('extensions-load-error'));\n      }\n\n      queueLoadError(new Error('retry owner'));\n      await flush();\n      const dialog =\n          manager.shadowRoot.querySelector('extensions-load-error')!;\n      const pendingRetry = new PromiseResolver<boolean>();\n      dialog.delegate = {retryLoadUnpacked: () => pendingRetry.promise};\n      const retry = dialog.shadowRoot.querySelector<HTMLElement>('.action-button')!;\n      retry.click();\n      await dialog.updateComplete;\n      assertTrue(retry.hasAttribute('disabled'));\n      const rendered = dialog.updateComplete;\n      const renderReached = new PromiseResolver<void>();\n      const releaseRender = new PromiseResolver<boolean>();\n      let held = false;\n      Object.defineProperty(dialog, 'updateComplete', {\n        configurable: true,\n        get() {\n          if (!held) {\n            held = true;\n            renderReached.resolve();\n            return releaseRender.promise;\n          }\n          return rendered;\n        },\n      });\n      const latest = new Error('replacement after pending Retry');\n      const stale = new Error('older Retry failure during render');\n      let presentation: Promise<void>|null = null;\n      try {\n        queueLoadError(latest);\n        presentation = flush();\n        await renderReached.promise;\n        pendingRetry.reject(stale);\n        await pendingRetry.promise.catch(() => {});\n        assertEquals(stale, dialog.loadError);\n        releaseRender.resolve(true);\n        await presentation;\n      } finally {\n        releaseRender.resolve(true);\n        Reflect.deleteProperty(dialog, 'updateComplete');\n        if (presentation) {\n          await presentation;\n        }\n      }\n      await dialog.updateComplete;\n      assertEquals(latest, dialog.loadError);\n      assertTrue(dialog.$.dialog.getNative().open);\n      assertFalse(retry.hasAttribute('disabled'));\n      const closed = eventToPromise('close', dialog.$.dialog.getNative());\n      dialog.close();\n      await closed;\n      await manager.updateComplete;\n      assertFalse(!!manager.shadowRoot.querySelector('extensions-load-error'));\n    });\n  });\n\n  async function flushOptionsPresentation(timer: MockTimer) {"
