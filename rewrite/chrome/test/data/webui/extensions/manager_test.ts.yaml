    replace: "  // <if expr=\"is_android\">\n  async function withInitialHistoryInfoHeld(\n      targetExists: boolean,\n      run: (id: string, releaseInfo: () => Promise<void>) => Promise<void>) {\n    const service = Service.getInstance();\n    const originalGetExtensionsInfo = service.getExtensionsInfo;\n    const originalPage = navigation.getCurrentPage();\n    const extension = createExtensionInfo({\n      id: 'cccccccccccccccccccccccccccccccc',\n      name: 'Held history extension',\n    });\n    const id = targetExists ? extension.id : 'dddddddddddddddddddddddddddddddd';\n    let resolveInfo:\n        (items: chrome.developerPrivate.ExtensionInfo[]) => void = () => {};\n    const pendingInfo = new Promise<chrome.developerPrivate.ExtensionInfo[]>(\n        resolve => resolveInfo = resolve);\n    manager.remove();\n    navigation.updateHistory({page: Page.DETAILS, extensionId: id}, true);\n    service.getExtensionsInfo = () => pendingInfo;\n    manager = document.createElement('extensions-manager');\n    document.body.appendChild(manager);\n    try {\n      await manager.updateComplete;\n      await manager.$.toolbar.updateComplete;\n      assertTrue(manager.$.itemsList.hidden);\n      await run(id, async () => {\n        resolveInfo([extension]);\n        await manager.whenPageInitializedForTest();\n        await microtasksFinished();\n      });\n    } finally {\n      service.getExtensionsInfo = originalGetExtensionsInfo;\n      resolveInfo([extension]);\n      await manager.whenPageInitializedForTest();\n      manager.remove();\n      navigation.updateHistory(originalPage, true);\n    }\n  }\n\n  async function goBackToInitialHistoryDetails(id: string) {\n    manager.shadowRoot.querySelector(\n                          'extensions-sidebar')!.$.sectionsShortcuts.click();\n    await microtasksFinished();\n    assertEquals(Page.SHORTCUTS, navigation.getCurrentPage().page);\n    const back = eventToPromise('popstate', window);\n    window.history.back();\n    await back;\n    await microtasksFinished();\n    assertEquals(Page.DETAILS, navigation.getCurrentPage().page);\n    assertEquals(id, navigation.getCurrentPage().extensionId);\n  }\n\n  test('AndroidHistoryBackBeforeInitialInfoRetainsDetails', async () => {\n    await withInitialHistoryInfoHeld(true, async (id, releaseInfo) => {\n      await goBackToInitialHistoryDetails(id);\n      await releaseInfo();\n      assertEquals(Page.DETAILS, navigation.getCurrentPage().page);\n      assertEquals(id, navigation.getCurrentPage().extensionId);\n      assertViewActive('extensions-detail-view');\n    });\n  });\n\n  test('AndroidHistoryBackMissingIdRedirectsAfterInitialInfo', async () => {\n    await withInitialHistoryInfoHeld(false, async (id, releaseInfo) => {\n      await goBackToInitialHistoryDetails(id);\n      await releaseInfo();\n      assertEquals(Page.LIST, navigation.getCurrentPage().page);\n      assertEquals(undefined, navigation.getCurrentPage().extensionId);\n      assertEquals(1, getExtensions().length);\n      assertViewActive('extensions-item-list');\n    });\n  });\n  // </if>\n  test('ChangePages', async () => {\n"
