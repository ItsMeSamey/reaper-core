    replace: "    await microtasksFinished();\n    assertViewActive('extensions-item-list');\n  });\n\n  // <if expr=\"is_android\">\n  async function focusWideSidebar() {\n    manager.$.toolbar.narrow = false;\n    await microtasksFinished();\n    const left = manager.shadowRoot.querySelector<HTMLElement>('#left')!;\n    const sidebar = left.querySelector('extensions-sidebar')!;\n    assertFalse(left.hidden);\n    sidebar.$.sectionsShortcuts.focus();\n    assertEquals(sidebar.$.sectionsShortcuts, sidebar.shadowRoot.activeElement);\n    assertTrue(left.matches(':focus-within'));\n    return {left, sidebar};\n  }\n\n  test('AndroidNarrowEntryMovesHiddenSidebarFocusToSearch', async () => {\n    const {left} = await focusWideSidebar();\n    const page = navigation.getCurrentPage().page;\n    manager.$.toolbar.narrow = true;\n    await microtasksFinished();\n    assertTrue(left.hidden);\n    assertTrue(manager.$.toolbar.isSearchFocused());\n    assertEquals(page, navigation.getCurrentPage().page);\n  });\n\n  test('AndroidNarrowEntryPreservesNewContentFocus', async () => {\n    await focusWideSidebar();\n    const button = manager.$.itemsList.getDetailsButton(getExtensions()[0]!.id)!;\n    assertTrue(!!button);\n    const moveFocus = (event: Event) => {\n      if ((event as CustomEvent<{value: boolean}>).detail.value) {\n        button.focus();\n      }\n    };\n    manager.$.toolbar.addEventListener('narrow-changed', moveFocus);\n    try {\n      manager.$.toolbar.narrow = true;\n      await microtasksFinished();\n      assertEquals(button, (button.getRootNode() as ShadowRoot).activeElement);\n      assertFalse(manager.$.toolbar.isSearchFocused());\n    } finally {\n      manager.$.toolbar.removeEventListener('narrow-changed', moveFocus);\n    }\n  });\n\n  test('AndroidSearchRenderPreservesNewContentFocusWhileNarrow', async () => {\n    const {left} = await focusWideSidebar();\n    const search = manager.$.toolbar.$.toolbar.getSearchField();\n    const descriptor = Object.getOwnPropertyDescriptor(search, 'updateComplete');\n    let finishRender: (result: boolean) => void = () => {};\n    const pendingRender = new Promise<boolean>(resolve => finishRender = resolve);\n    Object.defineProperty(search, 'updateComplete', {\n      configurable: true,\n      get: () => pendingRender,\n    });\n    try {\n      const narrowed = eventToPromise('narrow-changed', manager.$.toolbar);\n      manager.$.toolbar.narrow = true;\n      await narrowed;\n      await manager.updateComplete;\n      await Promise.resolve();\n      assertTrue(left.hidden);\n      assertTrue(search.showingSearch);\n      assertFalse(manager.$.toolbar.isSearchFocused());\n\n      // Keep the same layout request alive while a real content control\n      // claims focus between the manager and search render boundaries.\n      const button = manager.$.itemsList.getDetailsButton(getExtensions()[0]!.id)!;\n      assertTrue(!!button);\n      button.focus();\n      assertEquals(button, (button.getRootNode() as ShadowRoot).activeElement);\n      assertTrue(manager.$.toolbar.narrow);\n      finishRender(true);\n      await microtasksFinished();\n      assertTrue(left.hidden);\n      assertTrue(manager.$.toolbar.narrow);\n      assertEquals(button, (button.getRootNode() as ShadowRoot).activeElement);\n      assertFalse(manager.$.toolbar.isSearchFocused());\n    } finally {\n      finishRender(true);\n      if (descriptor) {\n        Object.defineProperty(search, 'updateComplete', descriptor);\n      } else {\n        Reflect.deleteProperty(search, 'updateComplete');\n      }\n    }\n  });\n\n  test('AndroidNarrowReversalBeforeRenderKeepsSidebarFocus', async () => {\n    const {left, sidebar} = await focusWideSidebar();\n    // Deliver the public layout notifications in one render turn to cover\n    // width changes that reverse before the hidden sidebar is committed.\n    for (const value of [true, false]) {\n      manager.$.toolbar.dispatchEvent(\n          new CustomEvent('narrow-changed', {detail: {value}}));\n    }\n    await microtasksFinished();\n    assertFalse(left.hidden);\n    assertEquals(sidebar.$.sectionsShortcuts, sidebar.shadowRoot.activeElement);\n    assertFalse(manager.$.toolbar.isSearchFocused());\n  });\n\n  test('AndroidRotationBeforeSearchRenderCannotStealNewFocus', async () => {\n    const {left} = await focusWideSidebar();\n    const search = manager.$.toolbar.$.toolbar.getSearchField();\n    const descriptor = Object.getOwnPropertyDescriptor(search, 'updateComplete');\n    let finishRender: (result: boolean) => void = () => {};\n    const pendingRender = new Promise<boolean>(resolve => finishRender = resolve);\n    Object.defineProperty(search, 'updateComplete', {\n      configurable: true,\n      get: () => pendingRender,\n    });\n    try {\n      const narrowed = eventToPromise('narrow-changed', manager.$.toolbar);\n      manager.$.toolbar.narrow = true;\n      await narrowed;\n      await manager.updateComplete;\n      await Promise.resolve();\n      assertTrue(left.hidden);\n      assertTrue(search.showingSearch);\n      assertFalse(manager.$.toolbar.isSearchFocused());\n\n      const widened = eventToPromise('narrow-changed', manager.$.toolbar);\n      manager.$.toolbar.narrow = false;\n      await widened;\n      await manager.updateComplete;\n      const button = manager.$.itemsList.getDetailsButton(getExtensions()[0]!.id)!;\n      button.focus();\n      finishRender(true);\n      await microtasksFinished();\n      assertFalse(left.hidden);\n      assertEquals(button, (button.getRootNode() as ShadowRoot).activeElement);\n      assertFalse(manager.$.toolbar.isSearchFocused());\n    } finally {\n      finishRender(true);\n      if (descriptor) {\n        Object.defineProperty(search, 'updateComplete', descriptor);\n      } else {\n        Reflect.deleteProperty(search, 'updateComplete');\n      }\n    }\n  });\n\n  test('AndroidDetachedNarrowFocusRequestCannotClaimPageFocus', async () => {\n    await focusWideSidebar();\n    manager.$.toolbar.dispatchEvent(\n        new CustomEvent('narrow-changed', {detail: {value: true}}));\n    manager.remove();\n    const button = document.createElement('button');\n    document.body.appendChild(button);\n    button.focus();\n    try {\n      await microtasksFinished();\n      assertEquals(button, document.activeElement);\n    } finally {\n      button.remove();\n    }\n  });\n  // </if>\n\n  test('CloseDrawerOnNarrowModeExit', async function() {\n    manager.$.toolbar.narrow = true;\n"
