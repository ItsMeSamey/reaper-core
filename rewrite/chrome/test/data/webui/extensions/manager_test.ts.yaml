    replace: "    assertTrue(hasAppWithName('Packaged App Test'));\n  });\n\n  // <if expr=\"is_android\">\n  async function flushOptionsPresentation(timer: MockTimer) {\n    timer.tick(0);\n    // The first render removes the old owner; the second mounts the new one.\n    await manager.updateComplete;\n    await manager.updateComplete;\n    const dialog =\n        manager.shadowRoot.querySelector('extensions-options-dialog');\n    if (dialog) {\n      await dialog.updateComplete;\n    }\n    await Promise.resolve();\n    return dialog;\n  }\n\n  // Hold the actual manager's zero-delay presentation boundary. Guest creation\n  // is a separate options-dialog suite; here we observe the public show call.\n  async function withPendingOptions(\n      run: (timer: MockTimer, shownIds: string[]) => Promise<void>) {\n    const prototype = customElements.get('extensions-options-dialog')!\n                          .prototype as ExtensionsOptionsDialogElement;\n    const originalShow = prototype.show;\n    const shownIds: string[] = [];\n    const timer = new MockTimer();\n    prototype.show = function(info: chrome.developerPrivate.ExtensionInfo) {\n      shownIds.push(info.id);\n    };\n    timer.install();\n    const mockSetTimeout = window.setTimeout.bind(window);\n    const callbackResults: Array<Promise<void>> = [];\n    const callbackErrors: unknown[] = [];\n    // MockTimer ignores callback return values. Observe the actual async\n    // presentation callback so a rejected stale DOM lookup fails this test.\n    window.setTimeout = ((\n        handler: TimerHandler, delay?: number, ...args: unknown[]) => {\n      if (typeof handler !== 'function') {\n        return mockSetTimeout(handler, delay, ...args);\n      }\n      return mockSetTimeout(() => {\n        const result = handler(...args);\n        if (result instanceof Promise) {\n          // Attach both handlers immediately; do not leave a stray rejected\n          // promise for browser-global error handling after the test ends.\n          callbackResults.push(result.then(\n              () => {}, error => {callbackErrors.push(error);}));\n        }\n      }, delay);\n    }) as typeof window.setTimeout;\n    try {\n      await run(timer, shownIds);\n      await Promise.all(callbackResults);\n      assertEquals(0, callbackErrors.length, String(callbackErrors[0]));\n    } finally {\n      timer.uninstall();\n      prototype.show = originalShow;\n      navigation.navigateTo({page: Page.LIST});\n    }\n  }\n\n  test('AndroidBackCancelsQueuedOptionsOpen', async () => {\n    const extension = getExtensionByName('My extension 1')!;\n    await withPendingOptions(async (timer, shownIds) => {\n      navigation.navigateTo({\n        page: Page.DETAILS,\n        extensionId: extension.id,\n        subpage: Dialog.OPTIONS,\n      });\n      navigation.navigateTo({page: Page.LIST});\n      await manager.updateComplete;\n      await flushOptionsPresentation(timer);\n      assertEquals(0, shownIds.length);\n      assertFalse(!!manager.shadowRoot.querySelector('extensions-options-dialog'));\n      assertViewActive('extensions-item-list');\n    });\n  });\n\n  test('AndroidLatestQueuedOptionsRouteWins', async () => {\n    const first = getExtensionByName('My extension 1')!;\n    const second = createExtensionInfo({\n      id: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',\n      name: 'Second options route',\n    });\n    const target = Service.getInstance().getItemStateChangedTarget() as\n        ChromeEventWithDispatch;\n    target.dispatch<chrome.developerPrivate.EventData>({\n      event_type: chrome.developerPrivate.EventType.INSTALLED,\n      item_id: second.id,\n      extensionInfo: second,\n    });\n    await microtasksFinished();\n    await withPendingOptions(async (timer, shownIds) => {\n      for (const extension of [first, second]) {\n        navigation.navigateTo({\n          page: Page.DETAILS,\n          extensionId: extension.id,\n          subpage: Dialog.OPTIONS,\n        });\n      }\n      await manager.updateComplete;\n      await flushOptionsPresentation(timer);\n      assertEquals(1, shownIds.length);\n      assertEquals(second.id, shownIds[0]);\n    });\n    target.dispatch<chrome.developerPrivate.EventData>({\n      event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n      item_id: second.id,\n    });\n  });\n\n  test('AndroidDetachedManagerCancelsQueuedOptionsOpen', async () => {\n    const extension = getExtensionByName('My extension 1')!;\n    await withPendingOptions(async (timer, shownIds) => {\n      navigation.navigateTo({\n        page: Page.DETAILS,\n        extensionId: extension.id,\n        subpage: Dialog.OPTIONS,\n      });\n      manager.remove();\n      await flushOptionsPresentation(timer);\n      assertEquals(0, shownIds.length);\n    });\n  });\n\n  test('AndroidMissingOptionsTargetMakesQueuedShowInert', async () => {\n    const extension = getExtensionByName('My extension 1')!;\n    await withPendingOptions(async (timer, shownIds) => {\n      navigation.navigateTo({\n        page: Page.DETAILS,\n        extensionId: extension.id,\n        subpage: Dialog.OPTIONS,\n      });\n      const shadowRoot = manager.shadowRoot;\n      const originalQuery = shadowRoot.querySelector.bind(shadowRoot);\n      const descriptor =\n          Object.getOwnPropertyDescriptor(shadowRoot, 'querySelector');\n      // Hold the final lookup at the public DOM boundary, after Lit has mounted.\n      Object.defineProperty(shadowRoot, 'querySelector', {\n        configurable: true,\n        value: (selector: string) => selector === 'extensions-options-dialog' ?\n            null : originalQuery(selector),\n      });\n      try {\n        await flushOptionsPresentation(timer);\n        assertEquals(0, shownIds.length);\n      } finally {\n        if (descriptor) {\n          Object.defineProperty(shadowRoot, 'querySelector', descriptor);\n        } else {\n          Reflect.deleteProperty(shadowRoot, 'querySelector');\n        }\n      }\n    });\n  });\n\n  interface ControlledOptionsGuest extends HTMLElement {\n    extension: string;\n    onclose: () => void;\n    onpreferredsizechanged:\n        ((e: {height: number, width: number}) => void)|null;\n  }\n\n  async function withControlledManagerOptions(\n      initialReadyState: DocumentReadyState,\n      run: (timer: MockTimer, guests: ControlledOptionsGuest[],\n            finishDocument: () => void) => Promise<void>) {\n    const originalCreate = document.createElement.bind(document);\n    const descriptors = new Map([\n      ['createElement', Object.getOwnPropertyDescriptor(document, 'createElement')],\n      ['readyState', Object.getOwnPropertyDescriptor(document, 'readyState')],\n    ]);\n    let readyState = initialReadyState;\n    const guests: ControlledOptionsGuest[] = [];\n    const timer = new MockTimer();\n    timer.install();\n    Object.defineProperty(document, 'readyState', {\n      configurable: true,\n      get: () => readyState,\n    });\n    Object.defineProperty(document, 'createElement', {\n      configurable: true,\n      value: (name: string, options?: ElementCreationOptions) => {\n        if (name.toLowerCase() === 'extensionoptions') {\n          const guest = originalCreate('div') as ControlledOptionsGuest;\n          guests.push(guest);\n          return guest;\n        }\n        return originalCreate(name, options);\n      },\n    });\n    try {\n      await run(timer, guests, () => {\n        readyState = 'complete';\n        document.dispatchEvent(new Event('readystatechange'));\n      });\n    } finally {\n      navigation.navigateTo({page: Page.LIST});\n      await manager.updateComplete;\n      timer.uninstall();\n      for (const [key, descriptor] of descriptors) {\n        if (descriptor) {\n          Object.defineProperty(document, key, descriptor);\n        } else {\n          Reflect.deleteProperty(document, key);\n        }\n      }\n    }\n  }\n\n  test('AndroidBackRetiresActualManagerDocumentReadyRequest', async () => {\n    const extension = getExtensionByName('My extension 1')!;\n    await withControlledManagerOptions('loading', async (timer, guests, ready) => {\n      navigation.navigateTo({\n        page: Page.DETAILS,\n        extensionId: extension.id,\n        subpage: Dialog.OPTIONS,\n      });\n      const oldDialog = await flushOptionsPresentation(timer);\n      assertTrue(!!oldDialog);\n      assertEquals(0, guests.length);\n      navigation.navigateTo({page: Page.LIST});\n      await manager.updateComplete;\n      ready();\n      await Promise.resolve();\n      assertEquals(0, guests.length);\n      assertFalse(oldDialog.isConnected);\n      assertFalse(oldDialog.open);\n      assertEquals(Page.LIST, navigation.getCurrentPage().page);\n      assertViewActive('extensions-item-list');\n    });\n  });\n\n  test('AndroidQueuedNativeCloseCannotOwnNextOptionsRoute', async () => {\n    const first = getExtensionByName('My extension 1')!;\n    const second = createExtensionInfo({\n      id: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',\n      name: 'Second options route',\n      optionsPage: {\n        openInTab: false,\n        url: 'chrome-extension://bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb/options.html',\n      },\n    });\n    const target = Service.getInstance().getItemStateChangedTarget() as\n        ChromeEventWithDispatch;\n    target.dispatch<chrome.developerPrivate.EventData>({\n      event_type: chrome.developerPrivate.EventType.INSTALLED,\n      item_id: second.id,\n      extensionInfo: second,\n    });\n    await microtasksFinished();\n    try {\n      await withControlledManagerOptions('complete', async (timer, guests) => {\n        navigation.navigateTo({\n          page: Page.DETAILS,\n          extensionId: first.id,\n          subpage: Dialog.OPTIONS,\n        });\n        const oldDialog = (await flushOptionsPresentation(timer))!;\n        assertEquals(1, guests.length);\n        guests[0]!.onpreferredsizechanged!({width: 420, height: 200});\n        await oldDialog.$.dialog.updateComplete;\n        assertTrue(oldDialog.open);\n        const oldClosed = eventToPromise('close', oldDialog.$.dialog.getNative());\n        let oldCloseDelivered = false;\n        void oldClosed.then(() => oldCloseDelivered = true);\n        guests[0]!.onclose();  // Actual native close queues an animation-frame event.\n        navigation.navigateTo({\n          page: Page.DETAILS,\n          extensionId: second.id,\n          subpage: Dialog.OPTIONS,\n        });\n        const newDialog = (await flushOptionsPresentation(timer))!;\n        assertFalse(newDialog === oldDialog);\n        assertFalse(oldDialog.isConnected);\n        assertEquals(2, guests.length);\n        guests[1]!.onpreferredsizechanged!({width: 430, height: 210});\n        await newDialog.$.dialog.updateComplete;\n        assertTrue(newDialog.open);\n        assertFalse(oldCloseDelivered);\n        // MockTimer does not intercept this native queued event.\n        await oldClosed;\n        assertTrue(oldCloseDelivered);\n        assertEquals(second.id, navigation.getCurrentPage().extensionId);\n        assertEquals(Dialog.OPTIONS, navigation.getCurrentPage().subpage);\n        assertTrue(newDialog === manager.shadowRoot.querySelector(\n            'extensions-options-dialog'));\n        assertTrue(newDialog.open);\n\n        const details =\n            manager.shadowRoot.querySelector('extensions-detail-view')!;\n        const originalFocus = details.focusOptionsButton.bind(details);\n        let focused = 0;\n        details.focusOptionsButton = () => {\n          ++focused;\n          originalFocus();\n        };\n        try {\n          const newClosed =\n              eventToPromise('close', newDialog.$.dialog.getNative());\n          guests[1]!.onclose();\n          await newClosed;\n          await manager.updateComplete;\n          assertEquals(Page.DETAILS, navigation.getCurrentPage().page);\n          assertEquals(second.id, navigation.getCurrentPage().extensionId);\n          assertEquals(undefined, navigation.getCurrentPage().subpage);\n          assertFalse(!!manager.shadowRoot.querySelector(\n              'extensions-options-dialog'));\n          assertEquals(1, focused);\n          assertEquals(\n              details.$.extensionsOptions, details.shadowRoot.activeElement);\n        } finally {\n          details.focusOptionsButton = originalFocus;\n        }\n      });\n    } finally {\n      target.dispatch<chrome.developerPrivate.EventData>({\n        event_type: chrome.developerPrivate.EventType.UNINSTALLED,\n        item_id: second.id,\n      });\n    }\n  });\n  // </if>\n\n  test('ChangePages', async () => {\n    // We start on the item list.\n    manager.shadowRoot.querySelector(\n"
