    replace: "  });\n\n  // <if expr=\"is_android\">\n  test('AndroidWideCommandControlsStayOnOneRow', async function() {\n    keyboardShortcuts.style.display = 'block';\n    keyboardShortcuts.style.width = '680px';\n    keyboardShortcuts.items = [oneCommand];\n    await microtasksFinished();\n    const card = keyboardShortcuts.shadowRoot.querySelector<HTMLElement>(\n        '.shortcut-card')!;\n    const groups = card.querySelectorAll<HTMLElement>(\n        '.command-name, .shortcut-input-container, .shortcut-scope-container');\n    assertEquals(3, groups.length);\n    for (const direction of ['ltr', 'rtl']) {\n      keyboardShortcuts.dir = direction;\n      const bounds = card.getBoundingClientRect();\n      const rects = Array.from(groups, group => group.getBoundingClientRect());\n      // Ordinary controls must still share a row, not become a phone stack.\n      assertTrue(\n          Math.max(...rects.map(rect => rect.top)) <\n          Math.min(...rects.map(rect => rect.bottom)));\n      for (let i = 0; i < rects.length; ++i) {\n        const rect = rects[i]!;\n        assertTrue(rect.width > 0 && rect.height > 0);\n        assertTrue(rect.left >= bounds.left - 1);\n        assertTrue(rect.right <= bounds.right + 1);\n        if (i > 0) {\n          const previous = rects[i - 1]!;\n          if (direction === 'ltr') {\n            assertTrue(previous.right <= rect.left + 1);\n          } else {\n            assertTrue(previous.left >= rect.right - 1);\n          }\n        }\n      }\n    }\n  });\n\n  test('AndroidResponsiveCommandControls', async function() {\n    // The card is the query container, so this also exercises a narrow split\n    // window without depending on the WebUI test runner's viewport size.\n    keyboardShortcuts.style.display = 'block';\n"
- description: Keep Android extension shortcut controls responsive within their card
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ ''\.shortcut\-card''\)!;\

      \ \ \ \ const\ command\ =\ card\.querySelector<HTMLElement>\(''\.command\-entry''\)!;\

      \ \ \ \ const\ shortcutInput\ =\ command\.querySelector\(''cr\-shortcut\-input''\)!;\

      \ \ \ \ for\ \(const\ label\ of\ command\.querySelectorAll\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ ''\.shortcut\-input\-label,\ \.shortcut\-scope\-label''\)\)\ \{\

      \ \ \ \ \ \ label\.textContent\ =\ longLabel;\

      \ \ \ \ \}\

      \

      \ \ \ \ //\ Include\ a\ width\ below\ the\ input''s\ usual\ 200px\ size,\ alongside\ ordinary\

      \ \ \ \ //\ phone\ widths,\ to\ catch\ overflow\ hidden\ inside\ the\ input''s\ shadow\ root\.\

      \ \ \ \ for\ \(const\ width\ of\ \[200,\ 320,\ 360,\ 430\]\)\ \{\

      \ \ \ \ \ \ keyboardShortcuts\.style\.width\ =\ `\$\{width\}px`;\

      \ \ \ \ \ \ for\ \(const\ fontSize\ of\ \[13,\ 26\]\)\ \{\

      \ \ \ \ \ \ \ \ keyboardShortcuts\.style\.fontSize\ =\ `\$\{fontSize\}px`;\

      \ \ \ \ \ \ \ \ for\ \(const\ direction\ of\ \[''ltr'',\ ''rtl''\]\)\ \{\

      \ \ \ \ \ \ \ \ \ \ keyboardShortcuts\.dir\ =\ direction;\

      \ \ \ \ \ \ \ \ \ \ const\ bounds\ =\ card\.getBoundingClientRect\(\);\

      \ \ \ \ \ \ \ \ \ \ const\ groups\ =\ command\.querySelectorAll<HTMLElement>\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ ''\.command\-name,\ \.shortcut\-input\-container,\ ''\ \+\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ ''\.shortcut\-scope\-container''\);\

      \ \ \ \ \ \ \ \ \ \ let\ previousBottom\ =\ command\.getBoundingClientRect\(\)\.top;\

      \ \ \ \ \ \ \ \ \ \ for\ \(const\ group\ of\ groups\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ const\ rect\ =\ group\.getBoundingClientRect\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.width\ >\ 0\ \&\&\ rect\.height\ >\ 0\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.left\ >=\ bounds\.left\ \-\ 1\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.right\ <=\ bounds\.right\ \+\ 1\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.top\ >=\ previousBottom\ \-\ 1\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.bottom\ <=\ bounds\.bottom\ \+\ 1\);\

      \ \ \ \ \ \ \ \ \ \ \ \ previousBottom\ =\ rect\.bottom;\

      \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ const\ controls\ =\ \[\

      \ \ \ \ \ \ \ \ \ \ \ \ shortcutInput\.shadowRoot\.querySelector<HTMLElement>\(''\#main''\)!,\

      \ \ \ \ \ \ \ \ \ \ \ \ shortcutInput\.\$\.input,\

      \ \ \ \ \ \ \ \ \ \ \ \ command\.querySelector<HTMLElement>\(''select''\)!,\

      \ \ \ \ \ \ \ \ \ \ \ \ card\.querySelector<HTMLElement>\(''\.card\-title\ span''\)!,\

      \ \ \ \ \ \ \ \ \ \ \];\

      \ \ \ \ \ \ \ \ \ \ for\ \(const\ control\ of\ controls\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ const\ rect\ =\ control\.getBoundingClientRect\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.width\ >\ 0\ \&\&\ rect\.height\ >\ 0\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.left\ >=\ bounds\.left\ \-\ 1\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.right\ <=\ bounds\.right\ \+\ 1\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.top\ >=\ bounds\.top\ \-\ 1\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(rect\.bottom\ <=\ bounds\.bottom\ \+\ 1\);\

      \ \ \ \ \ \ \ \ \ \ \ \ assertTrue\(control\.scrollWidth\ <=\ control\.clientWidth\ \+\ 1\);\

      \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ assertTrue\(card\.scrollWidth\ <=\ card\.clientWidth\ \+\ 1\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \ \ \}\);\

      '
    replace: "        '.shortcut-card')!;\n    const command = card.querySelector<HTMLElement>('.command-entry')!;\n    const shortcutInput = command.querySelector('cr-shortcut-input')!;\n    const labels = command.querySelectorAll<HTMLElement>(\n        '.shortcut-input-label, .shortcut-scope-label');\n    for (const label of labels) {\n      label.textContent = longLabel;\n    }\n\n    const rootStyle = document.documentElement.style;\n    const originalRootFontSize = rootStyle.getPropertyValue('font-size');\n    const originalRootFontPriority = rootStyle.getPropertyPriority('font-size');\n    try {\n      // Include the inner input cap and both sides of the layout breakpoint.\n      for (const width of [200, 320, 360, 430, 600, 601, 680]) {\n        keyboardShortcuts.style.width = `${width}px`;\n        for (const fontSize of [13, 26]) {\n          keyboardShortcuts.style.fontSize = `${fontSize}px`;\n          let smallRootLabelSize = 0;\n          for (const rootFontSize of [16, 32]) {\n            rootStyle.setProperty('font-size', `${rootFontSize}px`, 'important');\n            const labelSize = Number.parseFloat(\n                getComputedStyle(labels[0]!).fontSize);\n            if (rootFontSize === 16) {\n              smallRootLabelSize = labelSize;\n            } else {\n              // Ensure this tests actual rem growth, not just inherited fonts.\n              assertTrue(labelSize > smallRootLabelSize);\n            }\n            for (const direction of ['ltr', 'rtl']) {\n              keyboardShortcuts.dir = direction;\n              const bounds = card.getBoundingClientRect();\n              const groups = command.querySelectorAll<HTMLElement>(\n                  '.command-name, .shortcut-input-container, ' +\n                  '.shortcut-scope-container');\n              const groupRects: DOMRect[] = [];\n              for (const group of groups) {\n                const rect = group.getBoundingClientRect();\n                assertTrue(rect.width > 0 && rect.height > 0);\n                assertTrue(rect.left >= bounds.left - 1);\n                assertTrue(rect.right <= bounds.right + 1);\n                assertTrue(rect.top >= bounds.top - 1);\n                assertTrue(rect.bottom <= bounds.bottom + 1);\n                assertTrue(group.scrollWidth <= group.clientWidth + 1);\n                for (const previous of groupRects) {\n                  if (width <= 600) {\n                    assertTrue(rect.top >= previous.bottom - 1);\n                  }\n                  // Both horizontal rows and vertical stacks must not overlap.\n                  assertTrue(\n                      rect.right <= previous.left + 1 ||\n                      rect.left >= previous.right - 1 ||\n                      rect.bottom <= previous.top + 1 ||\n                      rect.top >= previous.bottom - 1);\n                }\n                groupRects.push(rect);\n              }\n              const controls = [\n                shortcutInput.shadowRoot.querySelector<HTMLElement>('#main')!,\n                shortcutInput.$.input,\n                command.querySelector<HTMLElement>('select')!,\n                card.querySelector<HTMLElement>('.card-title span')!,\n                ...labels,\n              ];\n              for (const control of controls) {\n                const rect = control.getBoundingClientRect();\n                assertTrue(rect.width > 0 && rect.height > 0);\n                assertTrue(rect.left >= bounds.left - 1);\n                assertTrue(rect.right <= bounds.right + 1);\n                assertTrue(rect.top >= bounds.top - 1);\n                assertTrue(rect.bottom <= bounds.bottom + 1);\n                assertTrue(control.scrollWidth <= control.clientWidth + 1);\n              }\n              assertTrue(card.scrollWidth <= card.clientWidth + 1);\n            }\n          }\n        }\n      }\n    } finally {\n      if (originalRootFontSize) {\n        rootStyle.setProperty(\n            'font-size', originalRootFontSize, originalRootFontPriority);\n      } else {\n        rootStyle.removeProperty('font-size');\n      }\n    }\n  });\n"
- description: "Preserve Android shortcut capture ownership 1"
  regex:
    pattern: "    arg = await testDelegate.whenCalled('setShortcutHandlingSuspended');\n    assertFalse(arg);\n  });\n});\n"
    replace: "    arg = await testDelegate.whenCalled('setShortcutHandlingSuspended');\n    assertFalse(arg);\n  });\n  // <if expr=\"is_android\">\n  test('AndroidLastCardRemovalReleasesCapture', async function() {\n    keyboardShortcuts.items = [oneCommand];\n    await microtasksFinished();\n    const input = keyboardShortcuts.shadowRoot.querySelector('cr-shortcut-input')!;\n    input.$.edit.click();\n    await microtasksFinished();\n    assertTrue(input.isCapturing());\n    assertTrue(await testDelegate.whenCalled('setShortcutHandlingSuspended'));\n    testDelegate.reset();\n\n    keyboardShortcuts.items = [];\n    await microtasksFinished();\n    assertFalse(input.isConnected);\n    assertFalse(input.isCapturing());\n    assertFalse(await testDelegate.whenCalled('setShortcutHandlingSuspended'));\n    assertEquals(1, testDelegate.getCallCount('setShortcutHandlingSuspended'));\n    assertEquals(0, testDelegate.getCallCount('updateExtensionCommandKeybinding'));\n  });\n\n  test('AndroidRemovedCommandCannotRetargetCapturedInput', async function() {\n    keyboardShortcuts.items = [twoCommands];\n    await microtasksFinished();\n    const input = keyboardShortcuts.shadowRoot.querySelector('cr-shortcut-input')!;\n    input.$.edit.click();\n    await microtasksFinished();\n    assertTrue(input.isCapturing());\n    testDelegate.reset();\n\n    keyboardShortcuts.items = [{\n      ...twoCommands,\n      commands: [twoCommands.commands[1]!],\n    }];\n    await microtasksFinished();\n    const remaining =\n        keyboardShortcuts.shadowRoot.querySelector('cr-shortcut-input')!;\n    assertFalse(input === remaining);\n    assertFalse(input.isConnected);\n    assertFalse(input.isCapturing());\n    assertFalse(remaining.isCapturing());\n    assertFalse(await testDelegate.whenCalled('setShortcutHandlingSuspended'));\n    assertEquals(0, testDelegate.getCallCount('updateExtensionCommandKeybinding'));\n  });\n\n  test('AndroidDisconnectCancelsPendingCaptureStart', async function() {\n    keyboardShortcuts.items = [oneCommand];\n    await microtasksFinished();\n    const input = keyboardShortcuts.shadowRoot.querySelector('cr-shortcut-input')!;\n    input.$.edit.click();\n    // Edit focuses synchronously; startCapture_ is now awaiting its update.\n    // Disconnect before that pending start can notify the page.\n    assertTrue(input.isCapturing());\n    assertEquals(0, testDelegate.getCallCount('setShortcutHandlingSuspended'));\n    keyboardShortcuts.remove();\n    await microtasksFinished();\n    assertFalse(input.isCapturing());\n    assertEquals(0, testDelegate.getCallCount('setShortcutHandlingSuspended'));\n    assertEquals(0, testDelegate.getCallCount('updateExtensionCommandKeybinding'));\n  });\n\n  test('AndroidLateEndCannotReleaseReplacementOrRecapturedInput', async function() {\n    keyboardShortcuts.items = [oneCommand, twoCommands];\n    await microtasksFinished();\n    const inputs = keyboardShortcuts.shadowRoot.querySelectorAll('cr-shortcut-input');\n    const first = inputs[0]!;\n    const second = inputs[1]!;\n    first.$.edit.click();\n    await microtasksFinished();\n    assertTrue(first.isCapturing());\n    testDelegate.reset();\n\n    second.$.edit.click();\n    assertTrue(second.isCapturing());\n    // Deliver the second real capture before the old blur's awaited end.\n    second.dispatchEvent(new CustomEvent('input-capture-change', {\n      bubbles: true, composed: true, detail: true,\n    }));\n    await microtasksFinished();\n    assertTrue(second.isCapturing());\n    assertDeepEquals([true], testDelegate.getArgs('setShortcutHandlingSuspended'));\n    testDelegate.reset();\n\n    first.dispatchEvent(new CustomEvent('input-capture-change', {\n      bubbles: true, composed: true, detail: false,\n    }));\n    await microtasksFinished();\n    assertTrue(second.isCapturing());\n    assertEquals(0, testDelegate.getCallCount('setShortcutHandlingSuspended'));\n\n    second.cancelCapture();\n    await microtasksFinished();\n    assertFalse(second.isCapturing());\n    assertDeepEquals([false], testDelegate.getArgs('setShortcutHandlingSuspended'));\n    testDelegate.reset();\n    second.$.edit.click();\n    await microtasksFinished();\n    assertTrue(second.isCapturing());\n    assertDeepEquals([true], testDelegate.getArgs('setShortcutHandlingSuspended'));\n    testDelegate.reset();\n    // A delayed duplicate end from its previous capture must not end this one.\n    second.dispatchEvent(new CustomEvent('input-capture-change', {\n      bubbles: true, composed: true, detail: false,\n    }));\n    await microtasksFinished();\n    assertTrue(second.isCapturing());\n    assertEquals(0, testDelegate.getCallCount('setShortcutHandlingSuspended'));\n    assertEquals(0, testDelegate.getCallCount('updateExtensionCommandKeybinding'));\n  });\n\n  test('AndroidDelegateReplacementReleasesOnlyOriginalOwner', async function() {\n    keyboardShortcuts.items = [oneCommand];\n    await microtasksFinished();\n    const input = keyboardShortcuts.shadowRoot.querySelector('cr-shortcut-input')!;\n    input.$.edit.click();\n    await microtasksFinished();\n    assertTrue(input.isCapturing());\n    testDelegate.reset();\n    const replacement = new TestService();\n\n    keyboardShortcuts.delegate = replacement;\n    await microtasksFinished();\n    assertFalse(input.isCapturing());\n    assertFalse(await testDelegate.whenCalled('setShortcutHandlingSuspended'));\n    assertEquals(1, testDelegate.getCallCount('setShortcutHandlingSuspended'));\n    assertEquals(0, replacement.getCallCount('setShortcutHandlingSuspended'));\n    assertEquals(0, replacement.getCallCount('updateExtensionCommandKeybinding'));\n  });\n\n  test('AndroidExitingViewRejectsCaptureUntilReentered', async function() {\n    keyboardShortcuts.items = [oneCommand];\n    await microtasksFinished();\n    const input = keyboardShortcuts.shadowRoot.querySelector('cr-shortcut-input')!;\n    input.$.edit.click();\n    await microtasksFinished();\n    assertTrue(input.isCapturing());\n    testDelegate.reset();\n\n    keyboardShortcuts.dispatchEvent(new CustomEvent('view-exit-start'));\n    await microtasksFinished();\n    assertFalse(input.isCapturing());\n    assertFalse(await testDelegate.whenCalled('setShortcutHandlingSuspended'));\n    testDelegate.reset();\n    // The outgoing view remains connected while its normal fade completes.\n    input.$.edit.click();\n    await microtasksFinished();\n    assertFalse(input.isCapturing());\n    assertEquals(0, testDelegate.getCallCount('setShortcutHandlingSuspended'));\n\n    keyboardShortcuts.dispatchEvent(new CustomEvent('view-enter-start'));\n    input.$.edit.click();\n    await microtasksFinished();\n    assertTrue(input.isCapturing());\n    assertTrue(await testDelegate.whenCalled('setShortcutHandlingSuspended'));\n    assertEquals(0, testDelegate.getCallCount('updateExtensionCommandKeybinding'));\n  });\n\n  // </if>\n});\n"
  count: 1
