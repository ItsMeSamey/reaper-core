substitutions:
- description: Allow Android extension warning rows to pan while retaining switch behavior
  regex:
    pattern: "// Copyright 2017 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\nimport 'chrome://extensions/extensions.js';\n\nimport type {ExtensionsToggleRowElement} from 'chrome://extensions/extensions.js';\nimport {getTrustedHTML} from 'chrome://extensions/extensions.js';\nimport {assertFalse, assertTrue} from 'chrome://webui-test/chai_assert.js';\nimport {eventToPromise} from 'chrome://webui-test/test_util.js';\n\nsuite('extensions-toggle-row', function() {\n  let row: ExtensionsToggleRowElement;\n\n  setup(function() {\n    document.body.innerHTML = getTrustedHTML`\n      <extensions-toggle-row id=\"row\">\n        <span id=\"label\">Description</span>\n      </extensions-toggle-row>\n    `;\n\n    row = document.querySelector('extensions-toggle-row')!;\n    assertFalse(row.checked);\n  });\n\n\n  // Test that the control is toggled when the user taps on the text label.\n  test('TestToggleByLabelTap',\
      \ async function() {\n    let whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertTrue(row.checked);\n\n    whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertFalse(row.checked);\n  });\n});\n"
    replace: "// Copyright 2017 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\nimport 'chrome://extensions/extensions.js';\n\nimport type {ExtensionsToggleRowElement} from 'chrome://extensions/extensions.js';\nimport {getTrustedHTML} from 'chrome://extensions/extensions.js';\n// <if expr=\"is_android\">\nimport {assertEquals} from 'chrome://webui-test/chai_assert.js';\n// </if>\nimport {assertFalse, assertTrue} from 'chrome://webui-test/chai_assert.js';\nimport {eventToPromise} from 'chrome://webui-test/test_util.js';\n\nsuite('extensions-toggle-row', function() {\n  let row: ExtensionsToggleRowElement;\n\n  setup(function() {\n    document.body.innerHTML = getTrustedHTML`\n      <extensions-toggle-row id=\"row\">\n        <span id=\"label\">Description</span>\n      </extensions-toggle-row>\n    `;\n\n    row = document.querySelector('extensions-toggle-row')!;\n    assertFalse(row.checked);\n  });\n\n\n \
      \ // <if expr=\"is_android\">\n  test('AndroidWarningRowAllowsPanningAndRetainsToggleSemantics', async () => {\n    await row.updateComplete;\n    const toggle = row.$.crToggle;\n    await toggle.updateComplete;\n    const warning = row.querySelector<HTMLElement>('#label')!;\n\n    // The browser intersects touch-action along the hit target's ancestors.\n    // Warning/label gestures can pan vertically; the switch keeps its own drag.\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n    assertEquals('auto', getComputedStyle(warning).touchAction);\n    assertEquals('auto', getComputedStyle(row.getLabel()).touchAction);\n    assertEquals('none', getComputedStyle(toggle).touchAction);\n    assertFalse(row.checked);\n\n    let changes = 0;\n    row.addEventListener('change', () => ++changes);\n    row.disabled = true;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    row.getLabel().click();\n    toggle.click();\n    await row.updateComplete;\n    assertEquals(0,\
      \ changes);\n    assertFalse(row.checked);\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n\n    row.disabled = false;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    let changed = eventToPromise('change', row);\n    row.getLabel().click();\n    await changed;\n    assertTrue(row.checked);\n    assertEquals(1, changes);\n\n    changed = eventToPromise('change', row);\n    toggle.click();\n    await changed;\n    assertFalse(row.checked);\n    assertEquals(2, changes);\n  });\n  // </if>\n\n  // Test that the control is toggled when the user taps on the text label.\n  test('TestToggleByLabelTap', async function() {\n    let whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertTrue(row.checked);\n\n    whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertFalse(row.checked);\n  });\n});\n"
  count: 1
- description: Exercise the retained Brave nested native switch in the Android row regression
  regex:
    pattern: "// Copyright 2017 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\nimport 'chrome://extensions/extensions.js';\n\nimport type {ExtensionsToggleRowElement} from 'chrome://extensions/extensions.js';\nimport {getTrustedHTML} from 'chrome://extensions/extensions.js';\n// <if expr=\"is_android\">\nimport {assertEquals} from 'chrome://webui-test/chai_assert.js';\n// </if>\nimport {assertFalse, assertTrue} from 'chrome://webui-test/chai_assert.js';\nimport {eventToPromise} from 'chrome://webui-test/test_util.js';\n\nsuite('extensions-toggle-row', function() {\n  let row: ExtensionsToggleRowElement;\n\n  setup(function() {\n    document.body.innerHTML = getTrustedHTML`\n      <extensions-toggle-row id=\"row\">\n        <span id=\"label\">Description</span>\n      </extensions-toggle-row>\n    `;\n\n    row = document.querySelector('extensions-toggle-row')!;\n    assertFalse(row.checked);\n  });\n\n\n  // <if expr=\"is_android\">\n  test('AndroidWarningRowAllowsPanningAndRetainsToggleSemantics', async () => {\n    await row.updateComplete;\n    const toggle = row.$.crToggle;\n    await toggle.updateComplete;\n    const warning = row.querySelector<HTMLElement>('#label')!;\n\n    // The browser intersects touch-action along the hit target's ancestors.\n    // Warning/label gestures can pan vertically; the switch keeps its own drag.\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n    assertEquals('auto', getComputedStyle(warning).touchAction);\n    assertEquals('auto', getComputedStyle(row.getLabel()).touchAction);\n    assertEquals('none', getComputedStyle(toggle).touchAction);\n    assertFalse(row.checked);\n\n    let changes = 0;\n    row.addEventListener('change', () => ++changes);\n    row.disabled = true;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    row.getLabel().click();\n    toggle.click();\n    await row.updateComplete;\n    assertEquals(0, changes);\n    assertFalse(row.checked);\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n\n    row.disabled = false;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    let changed = eventToPromise('change', row);\n    row.getLabel().click();\n    await changed;\n    assertTrue(row.checked);\n    assertEquals(1, changes);\n\n    changed = eventToPromise('change', row);\n    toggle.click();\n    await changed;\n    assertFalse(row.checked);\n    assertEquals(2, changes);\n  });\n  // </if>\n\n  // Test that the control is toggled when the user taps on the text label.\n  test('TestToggleByLabelTap', async function() {\n    let whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertTrue(row.checked);\n\n    whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertFalse(row.checked);\n  });\n});\n"
    replace: "// Copyright 2017 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\nimport 'chrome://extensions/extensions.js';\n\nimport type {ExtensionsToggleRowElement} from 'chrome://extensions/extensions.js';\nimport {getTrustedHTML} from 'chrome://extensions/extensions.js';\n// <if expr=\"is_android\">\nimport {assertEquals} from 'chrome://webui-test/chai_assert.js';\nimport {microtasksFinished} from 'chrome://webui-test/test_util.js';\n// </if>\nimport {assertFalse, assertTrue} from 'chrome://webui-test/chai_assert.js';\nimport {eventToPromise} from 'chrome://webui-test/test_util.js';\n\nsuite('extensions-toggle-row', function() {\n  let row: ExtensionsToggleRowElement;\n\n  setup(function() {\n    document.body.innerHTML = getTrustedHTML`\n      <extensions-toggle-row id=\"row\">\n        <span id=\"label\">Description</span>\n      </extensions-toggle-row>\n    `;\n\n    row = document.querySelector('extensions-toggle-row')!;\n    assertFalse(row.checked);\n  });\n\n\n  // <if expr=\"is_android\">\n  test('AndroidWarningRowAllowsPanningAndRetainsToggleSemantics', async () => {\n    await row.updateComplete;\n    const toggle = row.$.crToggle;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    // Brave's cr-toggle delegates activation to Nala's native switch button.\n    // Clicking the outer host only stops propagation; it does not toggle.\n    const getToggleButton = (): HTMLButtonElement => {\n      const button = toggle.$.toggle.shadowRoot?.querySelector('button');\n      assertTrue(button instanceof HTMLButtonElement);\n      assertEquals('switch', button.getAttribute('role'));\n      return button;\n    };\n    assertFalse(getToggleButton().disabled);\n    const warning = row.querySelector<HTMLElement>('#label')!;\n\n    // The browser intersects touch-action along the hit target's ancestors.\n    // Warning/label gestures can pan vertically; the switch keeps its own drag.\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n    assertEquals('auto', getComputedStyle(warning).touchAction);\n    assertEquals('auto', getComputedStyle(row.getLabel()).touchAction);\n    assertEquals('none', getComputedStyle(toggle).touchAction);\n    assertFalse(row.checked);\n\n    let changes = 0;\n    row.addEventListener('change', () => ++changes);\n    row.disabled = true;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    assertTrue(getToggleButton().disabled);\n    row.getLabel().click();\n    getToggleButton().click();\n    await row.updateComplete;\n    assertEquals(0, changes);\n    assertFalse(row.checked);\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n\n    row.disabled = false;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    assertFalse(getToggleButton().disabled);\n    let changed = eventToPromise('change', row);\n    row.getLabel().click();\n    await changed;\n    assertTrue(row.checked);\n    assertEquals(1, changes);\n\n    await microtasksFinished();\n    assertEquals('true', getToggleButton().getAttribute('aria-checked'));\n    changed = eventToPromise('change', row);\n    getToggleButton().click();\n    await changed;\n    assertFalse(row.checked);\n    assertEquals(2, changes);\n  });\n  // </if>\n\n  // Test that the control is toggled when the user taps on the text label.\n  test('TestToggleByLabelTap', async function() {\n    let whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertTrue(row.checked);\n\n    whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertFalse(row.checked);\n  });\n});\n"
  count: 1
- description: Verify Android native switch live label association and reconnect
  regex:
    pattern: "// Copyright 2017 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\nimport 'chrome://extensions/extensions.js';\n\nimport type {ExtensionsToggleRowElement} from 'chrome://extensions/extensions.js';\nimport {getTrustedHTML} from 'chrome://extensions/extensions.js';\n// <if expr=\"is_android\">\nimport {assertEquals} from 'chrome://webui-test/chai_assert.js';\nimport {microtasksFinished} from 'chrome://webui-test/test_util.js';\n// </if>\nimport {assertFalse, assertTrue} from 'chrome://webui-test/chai_assert.js';\nimport {eventToPromise} from 'chrome://webui-test/test_util.js';\n\nsuite('extensions-toggle-row', function() {\n  let row: ExtensionsToggleRowElement;\n\n  setup(function() {\n    document.body.innerHTML = getTrustedHTML`\n      <extensions-toggle-row id=\"row\">\n        <span id=\"label\">Description</span>\n      </extensions-toggle-row>\n    `;\n\n    row = document.querySelector('extensions-toggle-row')!;\n    assertFalse(row.checked);\n  });\n\n\n  // <if expr=\"is_android\">\n  test('AndroidWarningRowAllowsPanningAndRetainsToggleSemantics', async () => {\n    await row.updateComplete;\n    const toggle = row.$.crToggle;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    // Brave's cr-toggle delegates activation to Nala's native switch button.\n    // Clicking the outer host only stops propagation; it does not toggle.\n    const getToggleButton = (): HTMLButtonElement => {\n      const button = toggle.$.toggle.shadowRoot?.querySelector('button');\n      assertTrue(button instanceof HTMLButtonElement);\n      assertEquals('switch', button.getAttribute('role'));\n      return button;\n    };\n    assertFalse(getToggleButton().disabled);\n    const warning = row.querySelector<HTMLElement>('#label')!;\n\n    // The browser intersects touch-action along the hit target's ancestors.\n    // Warning/label gestures can pan vertically; the switch keeps its own drag.\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n    assertEquals('auto', getComputedStyle(warning).touchAction);\n    assertEquals('auto', getComputedStyle(row.getLabel()).touchAction);\n    assertEquals('none', getComputedStyle(toggle).touchAction);\n    assertFalse(row.checked);\n\n    let changes = 0;\n    row.addEventListener('change', () => ++changes);\n    row.disabled = true;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    assertTrue(getToggleButton().disabled);\n    row.getLabel().click();\n    getToggleButton().click();\n    await row.updateComplete;\n    assertEquals(0, changes);\n    assertFalse(row.checked);\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n\n    row.disabled = false;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    assertFalse(getToggleButton().disabled);\n    let changed = eventToPromise('change', row);\n    row.getLabel().click();\n    await changed;\n    assertTrue(row.checked);\n    assertEquals(1, changes);\n\n    await microtasksFinished();\n    assertEquals('true', getToggleButton().getAttribute('aria-checked'));\n    changed = eventToPromise('change', row);\n    getToggleButton().click();\n    await changed;\n    assertFalse(row.checked);\n    assertEquals(2, changes);\n  });\n  // </if>\n\n  // Test that the control is toggled when the user taps on the text label.\n  test('TestToggleByLabelTap', async function() {\n    let whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertTrue(row.checked);\n\n    whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertFalse(row.checked);\n  });\n});\n"
    replace: "// Copyright 2017 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\nimport 'chrome://extensions/extensions.js';\n\nimport type {ExtensionsToggleRowElement} from 'chrome://extensions/extensions.js';\nimport {getTrustedHTML} from 'chrome://extensions/extensions.js';\n// <if expr=\"is_android\">\nimport {assertEquals} from 'chrome://webui-test/chai_assert.js';\nimport {microtasksFinished} from 'chrome://webui-test/test_util.js';\n// </if>\nimport {assertFalse, assertTrue} from 'chrome://webui-test/chai_assert.js';\nimport {eventToPromise} from 'chrome://webui-test/test_util.js';\n\nsuite('extensions-toggle-row', function() {\n  let row: ExtensionsToggleRowElement;\n\n  setup(function() {\n    document.body.innerHTML = getTrustedHTML`\n      <extensions-toggle-row id=\"row\">\n        <span id=\"label\">Description</span>\n      </extensions-toggle-row>\n    `;\n\n    row = document.querySelector('extensions-toggle-row')!;\n    assertFalse(row.checked);\n  });\n\n\n  // <if expr=\"is_android\">\n  test('AndroidSwitchReferencesLiveRowLabel', async () => {\n    await row.updateComplete;\n    const toggle = row.$.crToggle;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    const button = toggle.$.toggle.shadowRoot?.querySelector('button');\n    assertTrue(button instanceof HTMLButtonElement);\n    assertEquals('switch', button.getAttribute('role'));\n    assertEquals(1, button.ariaLabelledByElements?.length);\n    assertEquals(row.getLabel(), button.ariaLabelledByElements?.[0]);\n\n    const warning = row.querySelector<HTMLElement>('#label')!;\n    warning.textContent = 'Updated extension permission';\n    await microtasksFinished();\n    // This verifies the live relation, not a computed accessibility-tree name.\n    const labelSlot = row.getLabel().querySelector('slot')!;\n    assertEquals(warning, labelSlot.assignedElements()[0]);\n    assertEquals('Updated extension permission', warning.textContent);\n    assertEquals(row.getLabel(), button.ariaLabelledByElements?.[0]);\n    assertFalse(button.hasAttribute('aria-label'));\n  });\n\n  test('AndroidSwitchLabelSurvivesRowReconnect', async () => {\n    await row.updateComplete;\n    const toggle = row.$.crToggle;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    const previousButton = toggle.$.toggle.shadowRoot?.querySelector('button');\n    assertTrue(previousButton instanceof HTMLButtonElement);\n    row.remove();\n    document.body.appendChild(row);\n    await row.updateComplete;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    const button = toggle.$.toggle.shadowRoot?.querySelector('button');\n    assertTrue(button instanceof HTMLButtonElement);\n    assertFalse(button === previousButton);\n    assertEquals(1, button.ariaLabelledByElements?.length);\n    assertEquals(row.getLabel(), button.ariaLabelledByElements?.[0]);\n  });\n\n  test('AndroidWarningRowAllowsPanningAndRetainsToggleSemantics', async () => {\n    await row.updateComplete;\n    const toggle = row.$.crToggle;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    // Brave's cr-toggle delegates activation to Nala's native switch button.\n    // Clicking the outer host only stops propagation; it does not toggle.\n    const getToggleButton = (): HTMLButtonElement => {\n      const button = toggle.$.toggle.shadowRoot?.querySelector('button');\n      assertTrue(button instanceof HTMLButtonElement);\n      assertEquals('switch', button.getAttribute('role'));\n      return button;\n    };\n    assertFalse(getToggleButton().disabled);\n    const warning = row.querySelector<HTMLElement>('#label')!;\n\n    // The browser intersects touch-action along the hit target's ancestors.\n    // Warning/label gestures can pan vertically; the switch keeps its own drag.\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n    assertEquals('auto', getComputedStyle(warning).touchAction);\n    assertEquals('auto', getComputedStyle(row.getLabel()).touchAction);\n    assertEquals('none', getComputedStyle(toggle).touchAction);\n    assertFalse(row.checked);\n\n    let changes = 0;\n    row.addEventListener('change', () => ++changes);\n    row.disabled = true;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    assertTrue(getToggleButton().disabled);\n    row.getLabel().click();\n    getToggleButton().click();\n    await row.updateComplete;\n    assertEquals(0, changes);\n    assertFalse(row.checked);\n    assertEquals('pan-y', getComputedStyle(row).touchAction);\n\n    row.disabled = false;\n    await row.updateComplete;\n    await toggle.updateComplete;\n    await microtasksFinished();\n    assertFalse(getToggleButton().disabled);\n    let changed = eventToPromise('change', row);\n    row.getLabel().click();\n    await changed;\n    assertTrue(row.checked);\n    assertEquals(1, changes);\n\n    await microtasksFinished();\n    assertEquals('true', getToggleButton().getAttribute('aria-checked'));\n    changed = eventToPromise('change', row);\n    getToggleButton().click();\n    await changed;\n    assertFalse(row.checked);\n    assertEquals(2, changes);\n  });\n  // </if>\n\n  // Test that the control is toggled when the user taps on the text label.\n  test('TestToggleByLabelTap', async function() {\n    let whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertTrue(row.checked);\n\n    whenChanged = eventToPromise('change', row);\n    row.getLabel().click();\n    await whenChanged;\n    assertFalse(row.checked);\n  });\n});\n"
  count: 1
