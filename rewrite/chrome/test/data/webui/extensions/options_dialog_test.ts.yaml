      replace: "  });\n\n  test('AndroidHeightFitsShrunkViewportWithResizeWithheld', async () => {\n    // Use a real child viewport so CSS receives new vh units while resize\n    // delivery is held. Keep the previous JS-requested height unchanged.\n    const viewport = document.createElement('iframe');\n    viewport.style.cssText =\n        'display: block; width: 600px; height: 700px; border: 0';\n    const loaded = eventToPromise('load', viewport);\n    document.body.appendChild(viewport);\n    try {\n      await loaded;\n      const viewportWindow = viewport.contentWindow!;\n      const viewportDocument = viewport.contentDocument!;\n      await optionsDialog.updateComplete;\n      await optionsDialog.$.dialog.updateComplete;\n\n      // Constructed sheets cannot follow nodes into another document. Copy\n      // their real compiled rules, including nested cr-dialog/close styles,\n      // before adopting the existing component; do not mock its layout CSS.\n      const sheets = new Map<ShadowRoot, string>();\n      const rememberSheets = (root: ShadowRoot): void => {\n        sheets.set(root, root.adoptedStyleSheets.map(\n            sheet => Array.from(sheet.cssRules, rule => rule.cssText).join('\\n'))\n                             .join('\\n'));\n        for (const element of root.querySelectorAll('*')) {\n          if (element.shadowRoot) {\n            rememberSheets(element.shadowRoot);\n          }\n        }\n      };\n      rememberSheets(optionsDialog.shadowRoot);\n      viewportDocument.body.appendChild(optionsDialog);\n      for (const [root, css] of sheets) {\n        const style = viewportDocument.createElement('style');\n        style.textContent = css;\n        root.appendChild(style);\n      }\n\n      const dialog = optionsDialog.$.dialog;\n      dialog.style.setProperty('--dialog-width', '410px');\n      dialog.style.setProperty('--dialog-height', '500px');\n      dialog.style.setProperty('--dialog-opacity', '1');\n      await dialog.showModal();\n      await new Promise<void>(resolve => {\n        viewportWindow.requestAnimationFrame(() => resolve());\n      });\n      const nativeDialog = dialog.getNative();\n      assertEquals(500, nativeDialog.getBoundingClientRect().height);\n      assertEquals(700, viewportWindow.innerHeight);\n\n      let deliveredResizes = 0;\n      const onResize = () => ++deliveredResizes;\n      let resizeBlocked: () => void = () => {};\n      const blockedResize = new Promise<void>(resolve => {\n        resizeBlocked = resolve;\n      });\n      const holdResize = (event: Event) => {\n        event.stopImmediatePropagation();\n        resizeBlocked();\n      };\n      viewportWindow.addEventListener('resize', holdResize, true);\n      viewportWindow.addEventListener('resize', onResize);\n      try {\n        viewport.style.height = '240px';\n        await blockedResize;\n        assertEquals(240, viewportWindow.innerHeight);\n        assertEquals(0, deliveredResizes);\n        assertEquals(\n            '500px', dialog.style.getPropertyValue('--dialog-height'));\n        const rect = nativeDialog.getBoundingClientRect();\n        assertTrue(rect.height > 0);\n        assertLE(rect.height, viewportWindow.innerHeight - 32);\n        assertGE(rect.top, 0);\n        assertLE(rect.bottom, viewportWindow.innerHeight);\n        const close = dialog.shadowRoot.querySelector<HTMLElement>('#close');\n        assertTrue(!!close);\n        const closeRect = close.getBoundingClientRect();\n        assertTrue(closeRect.height > 0);\n        assertGE(closeRect.top, rect.top);\n        assertLE(closeRect.bottom, rect.bottom);\n      } finally {\n        viewportWindow.removeEventListener('resize', holdResize, true);\n        viewportWindow.removeEventListener('resize', onResize);\n      }\n    } finally {\n      optionsDialog.remove();\n      viewport.remove();\n    }\n  });\n  // </if>\n\n  // <if expr=\"is_android\">\n  interface ControlledOptionsGuest"
