      replace: "    assertEquals(data.name, nameElement.textContent.trim());\n  });\n});\n\n// <if expr=\"is_android\">\nsuite('ExtensionRealOptionsGuestTests', function() {\n  async function beforeDeadline<T>(signal: Promise<T>): Promise<T> {\n    let deadline = 0;\n    try {\n      return await Promise.race([\n        signal,\n        new Promise<T>((_resolve, reject) => {\n          deadline = window.setTimeout(\n              () => reject(new Error('Timed out waiting for real options guest')),\n              10000);\n        }),\n      ]);\n    } finally {\n      window.clearTimeout(deadline);\n    }\n  }\n\n  test('AndroidDirectOptionsGuestRendersAndCloses', async () => {\n    const previousPage = navigation.getCurrentPage();\n    const testWindow = window as Window&{\n      reaperOptionsGuestReady: Promise<boolean>,\n    };\n    const manager: ExtensionsManagerElement =\n        document.createElement('extensions-manager');\n    const cleanup: {sizeObserver?: MutationObserver} = {};\n    try {\n      document.body.innerHTML = window.trustedTypes!.emptyHTML;\n      navigation.replaceWith({page: Page.LIST});\n      document.body.appendChild(manager);\n      await beforeDeadline(manager.whenPageInitializedForTest());\n      await manager.updateComplete;\n      const info = await beforeDeadline(Service.getInstance().getExtensionsInfo());\n      assertEquals(1, info.length);\n      const data = info[0]!;\n      assertTrue(!!data.optionsPage);\n      assertFalse(data.optionsPage.openInTab);\n      const opened = eventToPromise('cr-dialog-open', manager);\n      navigation.navigateTo({\n        page: Page.DETAILS,\n        extensionId: data.id,\n        subpage: Dialog.OPTIONS,\n      });\n      assertTrue(await beforeDeadline(testWindow.reaperOptionsGuestReady));\n      await beforeDeadline(opened);\n      const optionsDialog = manager.shadowRoot.querySelector(\n          'extensions-options-dialog');\n      assertTrue(!!optionsDialog);\n      const guest = optionsDialog.$.body.querySelector('extensionoptions') as\n          (HTMLElement&{extension: string})|null;\n      assertTrue(!!guest);\n      assertEquals('extensionoptions', guest.localName);\n      assertEquals(data.id, guest.extension);\n      assertTrue(guest.isConnected);\n      const dialog = optionsDialog.$.dialog;\n      const nativeDialog = dialog.getNative();\n      let onRendered: () => void = () => {};\n      const rendered = new Promise<void>(resolve => {\n        onRendered = resolve;\n      });\n      const check = () => {\n        const rect = nativeDialog.getBoundingClientRect();\n        if (nativeDialog.open && rect.width > 0 && rect.height > 0 &&\n            dialog.style.getPropertyValue('--dialog-opacity') === '1') {\n          cleanup.sizeObserver?.disconnect();\n          onRendered();\n        }\n      };\n      cleanup.sizeObserver = new MutationObserver(check);\n      cleanup.sizeObserver.observe(dialog, {\n        attributes: true,\n        attributeFilter: ['style'],\n      });\n      check();\n      await beforeDeadline(rendered);\n      const rect = nativeDialog.getBoundingClientRect();\n      assertGE(rect.width, Math.min(OptionsDialogMinWidth, window.innerWidth - 32));\n      assertLE(rect.width, window.innerWidth - 32);\n      assertLE(rect.height, OptionsDialogMaxHeight);\n      assertGE(rect.left, 0);\n      assertLE(rect.right, window.innerWidth);\n      assertGE(rect.top, 0);\n      assertLE(rect.bottom, window.innerHeight);\n      const guestRect = guest.getBoundingClientRect();\n      assertTrue(guestRect.width > 0);\n      assertTrue(guestRect.height > 0);\n      assertGE(guestRect.left, rect.left);\n      assertLE(guestRect.right, rect.right);\n      assertGE(guestRect.top, rect.top);\n      assertLE(guestRect.bottom, rect.bottom);\n      assertGE(guestRect.left, 0);\n      assertLE(guestRect.right, window.innerWidth);\n      assertGE(guestRect.top, 0);\n      assertLE(guestRect.bottom, window.innerHeight);\n      const closed = eventToPromise('close', optionsDialog);\n      const closeButton = dialog.shadowRoot.querySelector<HTMLElement>('#close');\n      assertTrue(!!closeButton);\n      closeButton.click();\n      await beforeDeadline(closed);\n      await manager.updateComplete;\n      assertFalse(nativeDialog.open);\n      assertFalse(guest.isConnected);\n      assertEquals(null, manager.shadowRoot.querySelector('extensions-options-dialog'));\n      const route = navigation.getCurrentPage();\n      assertEquals(Page.DETAILS, route.page);\n      assertEquals(data.id, route.extensionId);\n      assertEquals(undefined, route.subpage);\n    } finally {\n      cleanup.sizeObserver?.disconnect();\n      manager.remove();\n      navigation.replaceWith(previousPage);\n      Reflect.deleteProperty(window, 'reaperOptionsGuestReady');\n      Reflect.deleteProperty(window, 'reaperResolveOptionsGuestReady');\n    }\n  });\n});\n// </if>\n"
