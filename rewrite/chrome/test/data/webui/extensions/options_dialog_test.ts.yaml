      replace: "  });\n  // </if>\n\n  // <if expr=\"is_android\">\n  interface ControlledOptionsGuest extends HTMLElement {\n    extension: string;\n    onclose: () => void;\n    onpreferredsizechanged:\n        ((e: {height: number, width: number}) => void)|null;\n  }\n\n  // Use the real dialog and lifecycle. Hold only document readiness and the\n  // native guest element boundary so callback ordering is deterministic.\n  function controlOptionsGuest(initialReadyState: DocumentReadyState) {\n    const originalCreate = document.createElement.bind(document);\n    const descriptors = new Map([\n      ['createElement', Object.getOwnPropertyDescriptor(document, 'createElement')],\n      ['readyState', Object.getOwnPropertyDescriptor(document, 'readyState')],\n    ]);\n    const guest = originalCreate('div') as ControlledOptionsGuest;\n    let readyState = initialReadyState;\n    let creations = 0;\n    const timer = new MockTimer();\n    timer.install();\n    Object.defineProperty(document, 'readyState', {\n      configurable: true,\n      get: () => readyState,\n    });\n    Object.defineProperty(document, 'createElement', {\n      configurable: true,\n      value: (name: string, options?: ElementCreationOptions) => {\n        if (name.toLowerCase() === 'extensionoptions') {\n          ++creations;\n          return guest;\n        }\n        return originalCreate(name, options);\n      },\n    });\n    return {\n      guest,\n      timer,\n      creations: () => creations,\n      finishDocument: () => {\n        readyState = 'complete';\n        document.dispatchEvent(new Event('readystatechange'));\n      },\n      restore: () => {\n        optionsDialog.remove();\n        timer.uninstall();\n        for (const [key, descriptor] of descriptors) {\n          if (descriptor) {\n            Object.defineProperty(document, key, descriptor);\n          } else {\n            Reflect.deleteProperty(document, key);\n          }\n        }\n      },\n    };\n  }\n\n  test('AndroidCancelBeforeDocumentReadyDoesNotCreateOptionsGuest', async () => {\n    const control = controlOptionsGuest('loading');\n    try {\n      optionsDialog.show(data);\n      optionsDialog.cancelPendingShow();\n      control.finishDocument();\n      await Promise.resolve();\n      assertEquals(0, control.creations());\n      assertFalse(optionsDialog.open);\n    } finally {\n      control.restore();\n    }\n  });\n\n  test('AndroidUnmountBeforeDocumentReadyDoesNotCreateOptionsGuest', async () => {\n    const control = controlOptionsGuest('loading');\n    try {\n      optionsDialog.show(data);\n      optionsDialog.remove();\n      control.finishDocument();\n      await Promise.resolve();\n      assertEquals(0, control.creations());\n      assertFalse(optionsDialog.open);\n    } finally {\n      control.restore();\n    }\n  });\n\n  test('AndroidLatestDocumentReadyRequestOwnsGuest', async () => {\n    const control = controlOptionsGuest('loading');\n    try {\n      const second = {...data, id: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'};\n      optionsDialog.show(data);\n      optionsDialog.show(second);\n      control.finishDocument();\n      await Promise.resolve();\n      assertEquals(1, control.creations());\n      assertEquals(second.id, control.guest.extension);\n    } finally {\n      control.restore();\n    }\n  });\n\n  test('AndroidOldGuestCallbacksCannotOpenOrCloseNewOptions', async () => {\n    const control = controlOptionsGuest('complete');\n    try {\n      optionsDialog.show(data);\n      await Promise.resolve();\n      const oldSize = control.guest.onpreferredsizechanged!;\n      const oldClose = control.guest.onclose;\n      const second = {...data, id: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'};\n      optionsDialog.show(second);\n      await Promise.resolve();\n      assertEquals(1, control.creations());\n      assertEquals(second.id, control.guest.extension);\n\n      oldSize({width: 300, height: 120});\n      assertFalse(optionsDialog.open);\n      control.guest.onpreferredsizechanged!({width: 320, height: 120});\n      assertTrue(optionsDialog.open);\n      oldClose();\n      assertTrue(optionsDialog.open);\n      control.guest.onclose();\n      assertFalse(optionsDialog.open);\n    } finally {\n      control.restore();\n    }\n  });\n\n  test('AndroidResizeBeforeGuestSizeAndCloseBeforeDebounce', async () => {\n    const control = controlOptionsGuest('complete');\n    try {\n      optionsDialog.show(data);\n      await Promise.resolve();\n      // Capture actual listener exceptions explicitly, including the old null\n      // preferred-size dereference, rather than depending on Mocha's globals.\n      const errors: ErrorEvent[] = [];\n      const onError = (event: ErrorEvent) => {\n        errors.push(event);\n        event.preventDefault();\n      };\n      window.addEventListener('error', onError);\n      try {\n        window.dispatchEvent(new Event('resize'));\n      } finally {\n        window.removeEventListener('error', onError);\n      }\n      assertEquals(0, errors.length);\n      assertFalse(optionsDialog.open);\n      assertEquals(\n          '', optionsDialog.$.dialog.style.getPropertyValue('--dialog-opacity'));\n\n      control.guest.onpreferredsizechanged!({width: 410, height: 120});\n      control.timer.tick(50);\n      assertTrue(optionsDialog.open);\n      const width =\n          optionsDialog.$.dialog.style.getPropertyValue('--dialog-width');\n      assertEquals(\n          '1', optionsDialog.$.dialog.style.getPropertyValue('--dialog-opacity'));\n      control.guest.onpreferredsizechanged!({width: 550, height: 240});\n      control.guest.onclose();\n      control.timer.tick(50);\n      assertFalse(optionsDialog.open);\n      assertEquals(\n          width, optionsDialog.$.dialog.style.getPropertyValue('--dialog-width'));\n    } finally {\n      control.restore();\n    }\n  });\n\n  test('AndroidGuestCallbacksAfterUnmountAreInert', async () => {\n    const control = controlOptionsGuest('complete');\n    try {\n      optionsDialog.show(data);\n      await Promise.resolve();\n      const size = control.guest.onpreferredsizechanged!;\n      const close = control.guest.onclose;\n      optionsDialog.remove();\n      size({width: 320, height: 120});\n      close();\n      control.timer.tick(50);\n      assertFalse(optionsDialog.open);\n      assertEquals(1, control.creations());\n    } finally {\n      control.restore();\n    }\n  });\n  test('AndroidClosingDialogIgnoresLateGuestSize', async () => {\n    const previousPage = navigation.getCurrentPage();\n    const control = controlOptionsGuest('complete');\n    let closes = 0;\n    const onClose = () => ++closes;\n    optionsDialog.addEventListener('close', onClose);\n    try {\n      for (const {closeMode, sizeAfterReshow} of [\n        {closeMode: 'guest', sizeAfterReshow: true},\n        {closeMode: 'cancel', sizeAfterReshow: true},\n        {closeMode: 'close', sizeAfterReshow: true},\n        {closeMode: 'cancel', sizeAfterReshow: false},\n        {closeMode: 'close', sizeAfterReshow: false},\n      ]) {\n        navigation.replaceWith({\n          page: Page.DETAILS,\n          extensionId: data.id,\n          subpage: Dialog.OPTIONS,\n        });\n        optionsDialog.show(data);\n        await Promise.resolve();\n        let size = control.guest.onpreferredsizechanged!;\n        size({width: 410, height: 120});\n        control.timer.tick(50);\n        assertTrue(optionsDialog.open);\n\n        // Re-show on the same already open native dialog. Its new request must\n        // still remember that this show has opened before an ordinary close.\n        optionsDialog.show(data);\n        await Promise.resolve();\n        size = control.guest.onpreferredsizechanged!;\n        assertTrue(optionsDialog.open);\n        if (sizeAfterReshow) {\n          size({width: 410, height: 120});\n          control.timer.tick(50);\n          assertTrue(optionsDialog.open);\n        }\n\n        if (closeMode === 'guest') {\n          // A prevented native cancel must leave this already open dialog live.\n          // Dispatch only cancel; do not fabricate a native default close.\n          const cancelForwarded = eventToPromise('cancel', optionsDialog);\n          const nativeDialog = optionsDialog.$.dialog.getNative();\n          nativeDialog.addEventListener(\n              'cancel', event => event.preventDefault(), {once: true});\n          const cancel = new Event('cancel', {cancelable: true});\n          nativeDialog.dispatchEvent(cancel);\n          await cancelForwarded;\n          assertTrue(cancel.defaultPrevented);\n          assertTrue(nativeDialog.open);\n          assertTrue(optionsDialog.open);\n          size({width: 430, height: 130});\n          control.timer.tick(50);\n          assertEquals(\n              '430px',\n              optionsDialog.$.dialog.style.getPropertyValue('--dialog-width'));\n          assertEquals(Dialog.OPTIONS, navigation.getCurrentPage().subpage);\n        }\n\n        const width =\n            optionsDialog.$.dialog.style.getPropertyValue('--dialog-width');\n        if (sizeAfterReshow) {\n          size({width: 550, height: 240});\n        }\n        const closed = eventToPromise('close', optionsDialog);\n        if (closeMode === 'guest') {\n          control.guest.onclose();\n        } else if (closeMode === 'cancel') {\n          optionsDialog.$.dialog.cancel();\n        } else {\n          optionsDialog.$.dialog.close();\n        }\n        assertFalse(optionsDialog.open);\n        assertFalse(optionsDialog.$.dialog.getNative().open);\n        // Keep the valid close owner until the actual native event is delivered.\n        assertEquals(Dialog.OPTIONS, navigation.getCurrentPage().subpage);\n        size({width: 610, height: 300});\n        control.timer.tick(50);\n        assertFalse(optionsDialog.open);\n        assertEquals(\n            width, optionsDialog.$.dialog.style.getPropertyValue('--dialog-width'));\n        await closed;\n        const route = navigation.getCurrentPage();\n        assertEquals(Page.DETAILS, route.page);\n        assertEquals(data.id, route.extensionId);\n        assertEquals(undefined, route.subpage);\n        assertFalse(optionsDialog.open);\n      }\n      assertEquals(5, closes);\n    } finally {\n      optionsDialog.removeEventListener('close', onClose);\n      control.restore();\n      navigation.replaceWith(previousPage);\n    }\n  });\n\n  test('AndroidGuestCloseBeforeSizeRetiresOptionsRoute', async () => {\n    const previousPage = navigation.getCurrentPage();\n    const control = controlOptionsGuest('complete');\n    let closes = 0;\n    const onClose = () => ++closes;\n    optionsDialog.addEventListener('close', onClose);\n    try {\n      navigation.replaceWith({\n        page: Page.DETAILS,\n        extensionId: data.id,\n        subpage: Dialog.OPTIONS,\n      });\n      optionsDialog.show(data);\n      await Promise.resolve();\n      const size = control.guest.onpreferredsizechanged!;\n      const close = control.guest.onclose;\n      const closed = eventToPromise('close', optionsDialog);\n      assertFalse(optionsDialog.open);\n      close();\n      const route = navigation.getCurrentPage();\n      assertEquals(Page.DETAILS, route.page);\n      assertEquals(data.id, route.extensionId);\n      assertEquals(undefined, route.subpage);\n      assertEquals(null, control.guest.onpreferredsizechanged);\n      size({width: 610, height: 300});\n      close();\n      control.timer.tick(50);\n      await closed;\n      assertFalse(optionsDialog.open);\n      assertFalse(optionsDialog.$.dialog.getNative().open);\n      assertEquals(1, closes);\n      assertEquals(\n          '', optionsDialog.$.dialog.style.getPropertyValue('--dialog-opacity'));\n    } finally {\n      optionsDialog.removeEventListener('close', onClose);\n      control.restore();\n      navigation.replaceWith(previousPage);\n    }\n  });\n  // </if>\n\n  test('Layout', async function() {\n    // Try showing the dialog.\n    assertFalse(isDialogVisible());\n"
