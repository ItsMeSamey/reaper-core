substitutions:
- description: Wait for Android site-permission extension metadata before displaying a matching ID
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ assertEquals\(\

      \ \ \ \ \ \ \ \ \ \ \ \ HostAccess\.ON_ALL_SITES,\ extensionSiteAccessSelects\[0\]!\.value\);\

      \ \ \ \ \ \ \}\);\

      \

      \ \ test\(''editing\ extension\ site\ access'',\ async\ function\(\)\ \{\

      \ \ \ \ element\.site\ =\ ''example\.com'';\

      '
    replace: "        assertEquals(\n            HostAccess.ON_ALL_SITES, extensionSiteAccessSelects[0]!.value);\n      });\n\n  // <if expr=\"is_android\">\n  test('matching metadata preserves draft access', async () => {\n    loadTimeData.overrideValues({'enableUserPermittedSites': false});\n    element.remove();\n    element =\n        document.createElement('site-permissions-edit-permissions-dialog');\n    element.delegate = delegate;\n    element.extensions = [extensions[0]!];\n    element.site = 'http://example.com';\n    element.originalSiteSet = SiteSet.USER_RESTRICTED;\n    document.body.appendChild(element);\n    await microtasksFinished();\n\n    // The matching response already includes test_2, whose installation\n    // metadata is still waiting for its icon. Render known test_1 anyway.\n    const customize = element.shadowRoot.querySelector<HTMLElement>(\n        `cr-radio-button[name=${SiteSet.EXTENSION_SPECIFIED}]`);\n    assertTrue(!!customize);\n    customize.click();\n    assertEquals(\n        'http://example.com/',\n        await delegate.whenCalled('getMatchingExtensionsForSite'));\n    await microtasksFinished();\n\n    let selects = element.shadowRoot.querySelectorAll('select');\n    assertEquals(1, selects.length);\n    assertEquals(\n        'test_1',\n        element.shadowRoot.querySelector('.extension-name')!.textContent);\n    changeHostAccess(selects[0]!, HostAccess.ON_SPECIFIC_SITES);\n\n    // The later metadata event retries the matching query. Keep the\n    // user's unsaved choice for test_1 when test_2 becomes displayable.\n    delegate.resetResolver('getMatchingExtensionsForSite');\n    element.extensions = [extensions[0]!, extensions[1]!];\n    await delegate.whenCalled('getMatchingExtensionsForSite');\n    await microtasksFinished();\n    selects = element.shadowRoot.querySelectorAll('select');\n    assertEquals(2, selects.length);\n    assertEquals(HostAccess.ON_SPECIFIC_SITES, selects[0]!.value);\n    assertEquals(HostAccess.ON_SPECIFIC_SITES, selects[1]!.value);\n    assertEquals(\n        'test_2',\n        element.shadowRoot.querySelectorAll('.extension-name')[1]!\n            .textContent);\n    assertEquals(0, delegate.getCallCount('updateSiteAccess'));\n\n    const closed = eventToPromise('close', element);\n    element.$.submit.click();\n    assertDeepEquals(\n        [SiteSet.USER_RESTRICTED, ['http://example.com']],\n        await delegate.whenCalled('removeUserSpecifiedSites'));\n    assertDeepEquals(\n        [\n          'http://example.com/',\n          [{id: 'test_1', siteAccess: HostAccess.ON_SPECIFIC_SITES}],\n        ],\n        await delegate.whenCalled('updateSiteAccess'));\n    await closed;\n    assertFalse(element.$.dialog.open);\n  });\n  // </if>\n\n  test('editing extension site access', async function() {\n    element.site = 'example.com';\n"
