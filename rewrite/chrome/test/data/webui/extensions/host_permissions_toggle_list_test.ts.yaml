substitutions:
  - description: "Keep desktop measurement assertion import scoped"
    regex:
      pattern: "import {UserAction} from 'chrome://extensions/extensions.js';\n"
      replace: "// <if expr=\"not is_android\">\nimport {UserAction} from 'chrome://extensions/extensions.js';\n// </if>\n"
    count: 1
  - description: "Retain host permission behavior assertions and expect no Android measurement"
    regex:
      pattern: "    const metricName = await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.LEARN_MORE, metricName);\n"
      replace: "    // <if expr=\"not is_android\">\n    const metricName = await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.LEARN_MORE, metricName);\n    // </if>\n    // <if expr=\"is_android\">\n    assertEquals(0, delegate.getCallCount('recordUserAction'));\n    // </if>\n"
    count: 1
  - description: "Retain host permission behavior assertions and expect no Android measurement"
    regex:
      pattern: "    const metricName = await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.ALL_TOGGLED_ON, metricName);\n"
      replace: "    // <if expr=\"not is_android\">\n    const metricName = await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.ALL_TOGGLED_ON, metricName);\n    // </if>\n    // <if expr=\"is_android\">\n    assertEquals(0, delegate.getCallCount('recordUserAction'));\n    // </if>\n"
    count: 1
  - description: "Retain host permission behavior assertions and expect no Android measurement"
    regex:
      pattern: "    const metricName: UserAction =\n        await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.ALL_TOGGLED_OFF, metricName);\n"
      replace: "    // <if expr=\"not is_android\">\n    const metricName: UserAction =\n        await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.ALL_TOGGLED_OFF, metricName);\n    // </if>\n    // <if expr=\"is_android\">\n    assertEquals(0, delegate.getCallCount('recordUserAction'));\n    // </if>\n"
    count: 1
  - description: "Retain host permission behavior assertions and expect no Android measurement"
    regex:
      pattern: "    let metricName: UserAction = await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.SPECIFIC_TOGGLED_OFF, metricName);\n    delegate.resetResolver('recordUserAction');\n"
      replace: "    // <if expr=\"not is_android\">\n    let metricName: UserAction = await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.SPECIFIC_TOGGLED_OFF, metricName);\n    delegate.resetResolver('recordUserAction');\n    // </if>\n    // <if expr=\"is_android\">\n    assertEquals(0, delegate.getCallCount('recordUserAction'));\n    // </if>\n"
    count: 1
  - description: "Retain host permission behavior assertions and expect no Android measurement"
    regex:
      pattern: "    metricName = await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.SPECIFIC_TOGGLED_ON, metricName);\n"
      replace: "    // <if expr=\"not is_android\">\n    metricName = await delegate.whenCalled('recordUserAction');\n    assertEquals(UserAction.SPECIFIC_TOGGLED_ON, metricName);\n    // </if>\n    // <if expr=\"is_android\">\n    assertEquals(0, delegate.getCallCount('recordUserAction'));\n    // </if>\n"
    count: 1
  - description: "Retain host permission behavior assertions and expect no Android measurement"
    regex:
      pattern: "        const metricName = await delegate.whenCalled('recordUserAction');\n        assertEquals(UserAction.SPECIFIC_TOGGLED_ON, metricName);\n"
      replace: "        // <if expr=\"not is_android\">\n        const metricName = await delegate.whenCalled('recordUserAction');\n        assertEquals(UserAction.SPECIFIC_TOGGLED_ON, metricName);\n        // </if>\n        // <if expr=\"is_android\">\n        assertEquals(0, delegate.getCallCount('recordUserAction'));\n        // </if>\n"
    count: 1
