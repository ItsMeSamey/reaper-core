substitutions:
- description: Round2 reviewed Android scripting repair
  regex:
    re_pattern: '\ \ \ \ chrome\.test\.succeed\(\);\

      \ \ \},\

      \

      \ \ //\ Test\ that\ unregisterContentScripts\ with\ empty\ filter\ ids\ unregisters\ all\

      \ \ //\ content\ scripts\.\

      \ \ //\ TODO\(crbug\.com/40216362\):\ This\ is\ incorrect,\ when\ filter\ ids\ is\ empty\ it\

      \ \ //\ should\ not\ unregister\ any\ script\.\

      \ \ async\ function\ unregisterScript_EmptyFilterIds\(\)\ \{\

      \ \ \ \ await\ chrome\.scripting\.unregisterContentScripts\(\);\

      \

      '
    replace: "    chrome.test.succeed();\n  },\n\n  // Android distinguishes an explicitly empty ID list from an omitted filter.\n  // Desktop retains the upstream behavior pending crbug.com/40216362.\n  async function unregisterScript_EmptyFilterIds() {\n    await chrome.scripting.unregisterContentScripts();\n\n"
- description: Round2 reviewed Android scripting repair
  regex:
    re_pattern: '\ \ \ \ chrome\.test\.assertEq\(\

      \ \ \ \ \ \ \ \ \[''injected'',\ ''injected_2''\],\ await\ getInjectedElementIds\(tab\.id\)\);\

      \

      \ \ \ \ //\ Unregister\ all\ content\ scripts\.\

      \ \ \ \ await\ chrome\.scripting\.unregisterContentScripts\(\{ids:\ \[\]\}\);\

      \

      \ \ \ \ //\ Verify\ all\ content\ scripts\ are\ removed\.\

      \ \ \ \ const\ registeredContentScripts\ =\

      \ \ \ \ \ \ \ \ await\ chrome\.scripting\.getRegisteredContentScripts\(\);\

      \ \ \ \ chrome\.test\.assertEq\(0,\ registeredContentScripts\.length\);\

      \

      \ \ \ \ //\ Re\-navigate\ to\ the\ requested\ url,\ and\ verify\ no\ script\ is\ injected\.\

      \ \ \ \ tab\ =\ await\ navigateToRequestedUrl\(\);\

      \ \ \ \ chrome\.test\.assertEq\(\[\],\ await\ getInjectedElementIds\(tab\.id\)\);\

      \

      \ \ \ \ chrome\.test\.succeed\(\);\

      \ \ \},\

      '
    replace: "    chrome.test.assertEq(\n        ['injected', 'injected_2'], await getInjectedElementIds(tab.id));\n\n    const isAndroid = (await chrome.runtime.getPlatformInfo()).os === 'android';\n    const before = await chrome.scripting.getRegisteredContentScripts();\n    const emptySelection =\n        await chrome.scripting.getRegisteredContentScripts({ids: []});\n    chrome.test.assertEq(isAndroid ? [] : before, emptySelection);\n\n    await chrome.scripting.unregisterContentScripts({ids: []});\n    const after = await chrome.scripting.getRegisteredContentScripts();\n    chrome.test.assertEq(isAndroid ? before : [], after);\n\n    // Confirm the surviving registrations still inject into a fresh document.\n    tab = await navigateToRequestedUrl();\n    chrome.test.assertEq(\n        isAndroid ? ['injected', 'injected_2'] : [],\n        await getInjectedElementIds(tab.id));\n\n    if (isAndroid) {\n      // An omitted ids field remains unfiltered, and removes every script.\n      chrome.test.assertEq(\n          before, await chrome.scripting.getRegisteredContentScripts({}));\n      await chrome.scripting.unregisterContentScripts({});\n      chrome.test.assertEq(\n          [], await chrome.scripting.getRegisteredContentScripts());\n      tab = await navigateToRequestedUrl();\n      chrome.test.assertEq([], await getInjectedElementIds(tab.id));\n    }\n\n    chrome.test.succeed();\n  },\n"
