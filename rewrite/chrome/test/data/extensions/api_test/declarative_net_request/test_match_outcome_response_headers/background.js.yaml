- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\

      \ \ \ \ chrome\.test\.succeed\(\);\

      \ \ \},\

      \]\);\

      '
    replace: "\n    chrome.test.succeed();\n  },\n];\n\nchrome.test.getConfig(config => {\n  // This additional regression is selected only by the Android native test.\n  if (config.customArg === 'android-valid-header-values') {\n    tests.push(async function testValidResponseHeaderValues() {\n      const ruleIds = [3, 4, 5];\n      const condition = {\n        requestDomains: ['header-values.example'],\n        resourceTypes: ['main_frame'],\n      };\n      await chrome.declarativeNetRequest.updateSessionRules({\n        addRules: [\n          {\n            id: 3,\n            priority: 1,\n            action: {type: 'block'},\n            condition: {\n              ...condition,\n              responseHeaders: [{\n                header: 'content-type',\n                values: ['text/html; charset=utf-8'],\n              }],\n            },\n          },\n          {\n            id: 4,\n            priority: 1,\n            action: {type: 'block'},\n            condition: {\n              ...condition,\n              responseHeaders: [{\n                header: 'example-header',\n                values: ['value with spaces', 'value; parameter=ok', 'value'],\n              }],\n            },\n          },\n          {\n            id: 5,\n            priority: 1,\n            action: {type: 'block'},\n            condition: {\n              ...condition,\n              responseHeaders: [{header: 'empty-header'}],\n            },\n          },\n        ],\n      });\n      try {\n        const cases = [\n          {\n            responseHeaders: {'content-type': ['text/html; charset=utf-8']},\n            ruleId: 3,\n          },\n          {\n            responseHeaders: {'example-header': ['value with spaces']},\n            ruleId: 4,\n          },\n          {\n            responseHeaders: {'example-header': ['value; parameter=ok']},\n            ruleId: 4,\n          },\n          {responseHeaders: {'example-header': ['value']}, ruleId: 4},\n          {responseHeaders: {'empty-header': ['']}, ruleId: 5},\n          {responseHeaders: {'empty-header': []}, ruleId: 5},\n          {\n            responseHeaders: {'content-type': ['application/json; charset=utf-8']},\n          },\n        ];\n        for (const {responseHeaders, ruleId} of cases) {\n          const result = await chrome.declarativeNetRequest.testMatchOutcome({\n            url: 'https://header-values.example/path',\n            type: 'main_frame',\n            method: 'get',\n            responseHeaders,\n          });\n          const matchedRules = ruleId === undefined ? [] :\n              [{ruleId, rulesetId: chrome.declarativeNetRequest.SESSION_RULESET_ID}];\n          chrome.test.assertEq({matchedRules}, result);\n        }\n      } finally {\n        await chrome.declarativeNetRequest.updateSessionRules({\n          removeRuleIds: ruleIds,\n        });\n      }\n      chrome.test.succeed();\n    });\n  }\n  chrome.test.runTests(tests);\n});\n"
