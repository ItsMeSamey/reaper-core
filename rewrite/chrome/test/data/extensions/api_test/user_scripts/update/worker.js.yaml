substitutions:
- description: Pass3 reviewed Android api globs repair
  regex:
    re_pattern: '\ \ \ \ chrome\.test\.succeed\(\);\

      \ \ \},\

      \

      \ \ //\ Tests\ that\ the\ script\ id\ is\ the\ only\ required\ field\ when\ calling\

      \ \ //\ userScripts\.update\.\ Such\ call\ will\ be\ successful\ and\ have\ no\ effect\.\

      \ \ async\ function\ scriptUpdated_requiredFields\(\)\ \{\

      '
    replace: "    chrome.test.succeed();\n  },\n\n  // Updates to globs must affect both returned metadata and actual injection.\n  async function scriptUpdated_GlobsAndroid() {\n    const platform = await chrome.runtime.getPlatformInfo();\n    if (platform.os !== 'android') {\n      chrome.test.succeed();\n      return;\n    }\n    await chrome.userScripts.unregister();\n\n    const id = 'globs';\n    await chrome.userScripts.register([{\n      id,\n      matches: ['*://hostperms-a.com/*'],\n      includeGlobs: ['*://hostperms-b.com:*/*'],\n      excludeGlobs: ['*exclude-before*'],\n      js: [{file: 'user_script.js'}],\n      runAt: 'document_end',\n    }]);\n    const config = await chrome.test.getConfig();\n    async function expectInjection(host, query, injected) {\n      const url = `http://${host}:${config.testServer.port}/simple.html${query}`;\n      const tab = await openTab(url);\n      chrome.test.assertEq(\n          injected ? ['injected_user_script'] : [],\n          await getInjectedElementIds(tab.id));\n      await chrome.tabs.remove(tab.id);\n    }\n    await expectInjection('hostperms-a.com', '', true);\n    await expectInjection('hostperms-a.com', '?exclude-before', false);\n    await expectInjection('hostperms-b.com', '', true);\n\n    const includeGlobs = ['*include-after*'];\n    const excludeGlobs = ['*exclude-after*'];\n    await chrome.userScripts.update([{id, includeGlobs, excludeGlobs}]);\n    let [script] = await chrome.userScripts.getScripts({ids: [id]});\n    chrome.test.assertEq(includeGlobs, script.includeGlobs);\n    chrome.test.assertEq(excludeGlobs, script.excludeGlobs);\n    chrome.test.assertEq(['*://hostperms-a.com/*'], script.matches);\n    chrome.test.assertEq('document_end', script.runAt);\n    await expectInjection('hostperms-a.com', '?exclude-before', true);\n    await expectInjection('hostperms-a.com', '?exclude-after', false);\n    await expectInjection('hostperms-b.com', '', false);\n    await expectInjection('hostperms-b.com', '?include-after', true);\n    await expectInjection('hostperms-b.com', '?include-after&exclude-after', false);\n\n    // Omitting globs in another update preserves both new lists.\n    await chrome.userScripts.update([{id, allFrames: true}]);\n    [script] = await chrome.userScripts.getScripts({ids: [id]});\n    chrome.test.assertEq(includeGlobs, script.includeGlobs);\n    chrome.test.assertEq(excludeGlobs, script.excludeGlobs);\n    chrome.test.assertTrue(script.allFrames);\n    await expectInjection('hostperms-a.com', '?exclude-after', false);\n    await expectInjection('hostperms-b.com', '?include-after', true);\n\n    // A supplied empty array clears a list; it is different from omission.\n    await chrome.userScripts.update([{id, includeGlobs: [], excludeGlobs: []}]);\n    [script] = await chrome.userScripts.getScripts({ids: [id]});\n    chrome.test.assertEq(undefined, script.includeGlobs);\n    chrome.test.assertEq(undefined, script.excludeGlobs);\n    await expectInjection('hostperms-a.com', '?exclude-after', true);\n    await expectInjection('hostperms-b.com', '?include-after', false);\n    await chrome.userScripts.unregister({ids: [id]});\n    chrome.test.succeed();\n  },\n\n  // Tests that the script id is the only required field when calling\n  // userScripts.update. Such call will be successful and have no effect.\n  async function scriptUpdated_requiredFields() {\n"
