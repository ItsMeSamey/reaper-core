substitutions:
- description: Android user script world edits at capacity
  regex:
    re_pattern: '\ \ async\ function\ canOnlyInjectIn10ActiveWorldsInADocument\(\)\ \{\

      '
    replace: "  async function androidCanUpdateConfiguredWorldsAtCapacity() {\n    if ((await chrome.runtime.getPlatformInfo()).os !== 'android') {\n      chrome.test.succeed();\n      return;\n    }\n    await cleanUpState();\n\n    await chrome.userScripts.configureWorld({csp: 'default original'});\n    for (let i = 0; i < 99; ++i) {\n      await chrome.userScripts.configureWorld({\n        worldId: `capacity-${i}`,\n        csp: 'named original',\n        messaging: true,\n      });\n    }\n    chrome.test.assertEq(\n        100, (await chrome.userScripts.getWorldConfigurations()).length);\n\n    // A named-world edit preserves omitted properties and consumes no slot.\n    await chrome.userScripts.configureWorld({\n      worldId: 'capacity-0',\n      csp: 'named updated',\n    });\n    await chrome.userScripts.configureWorld({worldId: 'capacity-0'});\n    let worlds = await chrome.userScripts.getWorldConfigurations();\n    const named = worlds.find(world => world.worldId === 'capacity-0');\n    chrome.test.assertEq('named updated', named.csp);\n    chrome.test.assertTrue(named.messaging);\n\n    // Empty and omitted IDs both update the already-configured default world.\n    await chrome.userScripts.configureWorld({\n      worldId: '',\n      csp: 'default updated',\n    });\n    await chrome.userScripts.configureWorld({messaging: true});\n    await chrome.userScripts.configureWorld({});\n    worlds = await chrome.userScripts.getWorldConfigurations();\n    const defaultWorld = worlds.find(world => world.worldId === undefined);\n    chrome.test.assertEq('default updated', defaultWorld.csp);\n    chrome.test.assertTrue(defaultWorld.messaging);\n    chrome.test.assertEq(100, worlds.length);\n\n    await chrome.test.assertPromiseRejects(\n        chrome.userScripts.configureWorld({worldId: 'one more', csp: 'new'}),\n        'Error: You may only configure up to 100 ' +\n            'individual user script worlds.');\n    chrome.test.assertEq(\n        100, (await chrome.userScripts.getWorldConfigurations()).length);\n\n    // Removing one configuration releases exactly one slot for a new world.\n    await chrome.userScripts.resetWorldConfiguration('capacity-98');\n    await chrome.userScripts.configureWorld({worldId: 'one more', csp: 'new'});\n    worlds = await chrome.userScripts.getWorldConfigurations();\n    chrome.test.assertEq(100, worlds.length);\n    chrome.test.assertEq('new', worlds.find(world => world.worldId === 'one more').csp);\n    await cleanUpState();\n    chrome.test.succeed();\n  },\n\n  async function canOnlyInjectIn10ActiveWorldsInADocument() {\n"
