# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser_exposed_mojom_targets.gni'
  regex:
    re_pattern: '\ \ "//url/mojom:url_mojom_origin",\

      \ \ "//url/mojom:url_mojom_scheme_host_port",\

      \]\

      \

      if\ \(!is_android\)\ \{\

      \ \ browser_exposed_mojom_targets\ \+=\ \[\

      '
    replace: "  \"//url/mojom:url_mojom_origin\",\n  \"//url/mojom:url_mojom_scheme_host_port\",\n]\nif (is_android) {\n  browser_exposed_mojom_targets -= [\n    \"//chrome/browser/actor/ui:mojo_bindings\",\n    \"//chrome/browser/contextual_cueing/internals:mojo_bindings\",\n    \"//chrome/browser/contextual_tasks:mojo_bindings\",\n    \"//chrome/browser/glic:mojo_bindings\",\n    \"//chrome/browser/ui/webui/context_hub:mojo_bindings\",\n    \"//chrome/browser/ui/webui/omnibox/aim_eligibility:mojo_bindings\",\n    \"//chrome/browser/ui/webui/skills:mojo_bindings\",\n    \"//chrome/common/compose:mojo_bindings\",\n    \"//components/actor/public/mojom:mojo_bindings\",\n    \"//components/compose/core/browser:mojo_bindings\",\n    \"//components/omnibox/composebox:mojo_bindings\",\n    \"//ui/webui/resources/cr_components/composebox:mojo_bindings\",\n  ]\n}\n\nif (!is_android) {\n  browser_exposed_mojom_targets += [\n"
- description: Do not generate or expose GEIC Mojo bindings on Android
  regex:
    re_pattern: '\ \ \ \ "//chrome/browser/contextual_tasks:mojo_bindings",\

      \ \ \ \ "//chrome/browser/glic:mojo_bindings",\

      '
    replace: "    \"//chrome/browser/contextual_tasks:mojo_bindings\",\n    \"//chrome/browser/geic:mojo_bindings\"\
      ,\n    \"//chrome/browser/glic:mojo_bindings\",\n"
  count: 1
- description: Exclude Notebook Mojo interface target from Android browser exposure
  regex:
    re_pattern: '\ \ \ \ "//chrome/browser/geic:mojo_bindings",\

      '
    replace: "    \"//chrome/browser/geic:mojo_bindings\",\n    \"//components/notebooks/internals/webui:mojo_bindings\"\
      ,\n"
  count: 1

- description: 'Exclude optional history/composebox AI frontend targets on Android: chrome/browser_exposed_mojom_targets.gni'
  regex:
    re_pattern: '\ \ \ \ "//ui/webui/resources/cr_components/composebox:mojo_bindings",\

      '
    replace: "    \"//ui/webui/resources/cr_components/composebox:mojo_bindings\",\n    \"//ui/webui/resources/cr_components/history_embeddings:mojo_bindings\",\n"
  count: 1
