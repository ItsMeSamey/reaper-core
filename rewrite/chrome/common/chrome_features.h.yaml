substitutions:
- description: Declare GEIC feature symbols only outside Android
  regex:
    re_pattern: 'COMPONENT_EXPORT\(CHROME_FEATURES\)\ BASE_DECLARE_FEATURE\(kGeic\);\

      COMPONENT_EXPORT\(CHROME_FEATURES\)\

      extern\ const\ base::FeatureParam<std::string>\ kGeicGuestURL;\

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      COMPONENT_EXPORT(CHROME_FEATURES) BASE_DECLARE_FEATURE(kGeic);

      COMPONENT_EXPORT(CHROME_FEATURES)

      extern const base::FeatureParam<std::string> kGeicGuestURL;

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Remove the dedicated Android BoardingPass admission or flag; retain adjacent ordinary behavior
  regex:
    pattern: 'COMPONENT_EXPORT(CHROME_FEATURES)

      BASE_DECLARE_FEATURE(kBoardingPassDetector);

      COMPONENT_EXPORT(CHROME_FEATURES)

      extern const base::FeatureParam<std::string> kBoardingPassDetectorUrlParam;

      COMPONENT_EXPORT(CHROME_FEATURES)

      extern const char kBoardingPassDetectorUrlParamName[];

      '
    replace: ''
  count: 1
