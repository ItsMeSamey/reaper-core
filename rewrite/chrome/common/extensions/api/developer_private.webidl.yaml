substitutions:
- description: Android explicit local CRX picker and ordinary result handling
  regex:
    pattern: "  required AccessModifier incognitoAccess;\n  required AccessModifier userScriptsAccess;\n  required boolean incognitoAccessPendingChange;\n  required sequence<DOMString> installWarnings;\n  required boolean isCommandRegistrationHandledExternally;\n  DOMString launchUrl;\n"
    replace: "  required AccessModifier incognitoAccess;\n  required AccessModifier userScriptsAccess;\n  required boolean incognitoAccessPendingChange;\n  required boolean isSplitMode;\n  required sequence<DOMString> installWarnings;\n  required boolean isCommandRegistrationHandledExternally;\n  DOMString launchUrl;\n"
  count: 1
- description: Android explicit local CRX picker and ordinary result handling
  regex:
    pattern: "  // page.\n  static Promise<undefined> installDroppedFile();\n\n  // Notifies the browser that a user began a drag in order to install an\n  // extension.\n  static undefined notifyDragInstallInProgress();\n"
    replace: "  // page.\n  static Promise<undefined> installDroppedFile();\n\n  // Android manager-only local CRX selection. False means picker/prompt was\n  // cancelled; true means installation finished, not necessarily enabled.\n  // |PromiseValue|: installed\n  static Promise<boolean> installFromFile();\n\n  // Notifies the browser that a user began a drag in order to install an\n  // extension.\n  static undefined notifyDragInstallInProgress();\n"
  count: 1

- description: Report interrupted Android local import without resuming an invalid sender
  regex:
    re_pattern: '\ \ required\ boolean\ isChildAccount;\

      \ \ required\ boolean\ isMv2DeprecationNoticeDismissed;\

      \ \ required\ boolean\ extensionsPinnedByDefault;\

      \};\

      \

      dictionary\ GetExtensionsInfoOptions\ \{\

      '
    replace: "  required boolean isChildAccount;\n  required boolean isMv2DeprecationNoticeDismissed;\n  required boolean extensionsPinnedByDefault;\n  // Android-only, one-shot notice for this tab after a local import lost its\n  // initiating renderer. This does not resume or grant an installation.\n  boolean interruptedLocalImport;\n};\n\ndictionary GetExtensionsInfoOptions {\n"
  count: 1
