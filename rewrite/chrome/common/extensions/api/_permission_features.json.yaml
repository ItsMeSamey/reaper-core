substitutions:

  - description: "Allow animation policy modify permission on Android extensions."
    regex:
      pattern: "  \"accessibilityFeatures.modify\": {\n    \"channel\": \"stable\",\n    \"extension_types\": [\"extension\", \"platform_app\"],\n    // \"desktop_android\" is not supported.\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\"]"
      replace: "  \"accessibilityFeatures.modify\": {\n    \"channel\": \"stable\",\n    \"extension_types\": [\"extension\", \"platform_app\"],\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\", \"desktop_android\"]"

  - description: "Allow animation policy read permission on Android extensions."
    regex:
      pattern: "  \"accessibilityFeatures.read\": [{\n    \"channel\": \"stable\",\n    \"extension_types\": [\"extension\", \"platform_app\"],\n    // \"desktop_android\" is not supported.\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\"]"
      replace: "  \"accessibilityFeatures.read\": [{\n    \"channel\": \"stable\",\n    \"extension_types\": [\"extension\", \"platform_app\"],\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\", \"desktop_android\"]"

  - description: "Allow the existing privileged MV3 proxy permission on Android extensions."
    regex:
      pattern: "  \"webAuthenticationProxy\": {\n    \"channel\": \"stable\",\n    \"extension_types\": [\"extension\"],\n    \"min_manifest_version\": 3,\n    \"platforms\": [\"linux\", \"mac\", \"win\"]"
      replace: "  \"webAuthenticationProxy\": {\n    \"channel\": \"stable\",\n    \"extension_types\": [\"extension\"],\n    \"min_manifest_version\": 3,\n    \"platforms\": [\"linux\", \"mac\", \"win\", \"desktop_android\"]"
