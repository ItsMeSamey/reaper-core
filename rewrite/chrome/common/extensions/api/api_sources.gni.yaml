substitutions:

  - description: "Generate shared animation policy settings for Android extensions."
    regex:
      pattern: "types_only_schema_sources_ = []"
      replace: "types_only_schema_sources_ = [ \"accessibility_features.json\" ]"

  - description: "Avoid duplicating the accessibility settings schema on desktop."
    regex:
      pattern: "    \"accessibility_features.json\",\n"
      replace: ""

  - description: "Generate WebAuthn proxy API types and registration for Android extensions."
    regex:
      pattern: "if (enable_service_discovery) {"
      replace: "if (is_android) {\n  schema_sources_ += [ \"web_authentication_proxy.webidl\" ]\n}\n\nif (enable_service_discovery) {"

  - description: 'Android concrete AI source/provider removal: chrome/common/extensions/api/api_sources.gni'
    regex:
      re_pattern: '\ \ "webrtc_logging_private\.idl",\

        \ \ "windows\.json",\

        \]\

        \

        if\ \(is_android\)\ \{\

        \ \ schema_sources_\ \+=\ \[\ "web_authentication_proxy\.webidl"\ \]\

        '
      replace: "  \"webrtc_logging_private.idl\",\n  \"windows.json\",\n]\nif (is_android) {\n  schema_sources_ -= [ \"glic_private.webidl\" ]\n}\n\nif (is_android) {\n  schema_sources_ += [ \"web_authentication_proxy.webidl\" ]\n"
  - description: 'Android concrete AI source/provider removal: chrome/common/extensions/api/api_sources.gni'
    regex:
      re_pattern: 'types_only_schema_sources_\ =\ \[\ "accessibility_features\.json"\ \]\

        \

        if\ \(enable_extensions\)\ \{\

        \ \ types_only_schema_sources_\ \+=\ \[\

        \ \ \ \ "proxy_override_rules_private\.json",\

        \ \ \]\

        \ \ schema_sources_\ \+=\ \[\

        \ \ \ \ "autofill_private\.idl",\

        \ \ \ \ "autotest_private\.webidl",\

        '
      replace: "types_only_schema_sources_ = [ \"accessibility_features.json\" ]\n\nif (enable_extensions) {\n  types_only_schema_sources_ += [ \"proxy_override_rules_private.json\" ]\n  schema_sources_ += [\n    \"autofill_private.idl\",\n    \"autotest_private.webidl\",\n"
  - description: 'Android concrete AI source/provider removal: chrome/common/extensions/api/api_sources.gni'
    regex:
      re_pattern: '\ \ \ \ \#\ as\ such\ do\ not\ belong\ in\ a\ conditional\.\

        \ \ \ \ "webrtc_desktop_capture_private\.idl",\

        \ \ \]\

        \

        \ \ if\ \(is_win\ \|\|\ is_mac\ \|\|\ is_linux\)\ \{\

        \ \ \ \ schema_sources_\ \+=\ \[\ "web_authentication_proxy\.webidl"\ \]\

        '
      replace: "    # as such do not belong in a conditional.\n    \"webrtc_desktop_capture_private.idl\",\n  ]\n  if (is_android) {\n    schema_sources_ -= [ \"experimental_actor.webidl\" ]\n  }\n\n  if (is_win || is_mac || is_linux) {\n    schema_sources_ += [ \"web_authentication_proxy.webidl\" ]\n"
  - description: 'Android concrete AI source/provider removal: chrome/common/extensions/api/api_sources.gni'
    regex:
      re_pattern: '\

        \ \ if\ \(is_win\ \|\|\ is_mac\ \|\|\ is_linux\ \|\|\ is_chromeos\)\ \{\

        \ \ \ \ schema_sources_\ \+=\ \[\ "contextual_tasks_private\.webidl"\ \]\

        \ \ \}\

        \

        \ \ if\ \(is_chromeos\)\ \{\

        '
      replace: "\n  if (is_win || is_mac || is_linux || is_chromeos) {\n    schema_sources_ += [ \"contextual_tasks_private.webidl\" ]\n    if (is_android) {\n      schema_sources_ -= [ \"contextual_tasks_private.webidl\" ]\n    }\n  }\n\n  if (is_chromeos) {\n"
