substitutions:
  - description: Depend on the Brave channel info.
    insert_into_list:
      target: channel_info
      list_name: public_deps
      values:
        - //brave/common:channel_info

  - description: Add the Brave common sources.
    add_literal_to_list:
      target: common_lib
      list_name: sources
      literal: brave_chrome_common_sources
      import: //brave/common/sources.gni

  - description: Add the Brave common deps.
    add_literal_to_list:
      target: common_lib
      list_name: deps
      literal: brave_chrome_common_deps
      import: //brave/common/sources.gni

  - description: Add the Brave common public_deps.
    add_literal_to_list:
      target: common_lib
      list_name: public_deps
      literal: brave_chrome_common_public_deps
      import: //brave/common/sources.gni

  - description: Build the non-code constants with the Brave constants config.
    add_literal_to_list:
      target: non_code_constants
      list_name: configs
      literal: '[ "//brave/common:constants_configs" ]'

  - description: Add the Brave constants deps.
    add_literal_to_list:
      target: constants
      list_name: deps
      literal: brave_chrome_constants_deps
      import: //brave/common/sources.gni

  - description: 'Android concrete AI source/provider removal: chrome/common/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "webui_util\.cc",\

        \ \ \ \ "webui_util\.h",\

        \ \ \]\

        \ \ sources\ \+=\ brave_chrome_common_sources\

        \ \ defines\ =\ \[\]\

        \

        '
      replace: "    \"webui_util.cc\",\n    \"webui_util.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"actor/action_result.cc\",\n      \"actor/action_result.h\",\n      \"actor/actor_constants.h\",\n    ]\n  }\n  sources += brave_chrome_common_sources\n  defines = []\n\n"
  - description: 'Android concrete AI source/provider removal: chrome/common/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//ui/resources",\

        \ \ \ \ "//url",\

        \ \ \]\

        \ \ public_deps\ \+=\ brave_chrome_common_public_deps\

        \

        \ \ deps\ =\ \[\

        '
      replace: "    \"//ui/resources\",\n    \"//url\",\n  ]\n  if (is_android) {\n    public_deps -= [ \"//components/actor/core:task_id\" ]\n  }\n  public_deps += brave_chrome_common_public_deps\n\n  deps = [\n"
  - description: 'Android concrete AI source/provider removal: chrome/common/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "tab_context_decryption_token_extension\.mojom",\

        \ \ \ \ "trusted_vault_encryption_keys_extension\.mojom",\

        \ \ \]\

        \

        \ \ deps\ =\ \[\ "//components/lens:lens_mojo"\ \]\

        \

        '
      replace: "    \"tab_context_decryption_token_extension.mojom\",\n    \"trusted_vault_encryption_keys_extension.mojom\",\n  ]\n  if (is_android) {\n    sources -= [ \"actor.mojom\" ]\n  }\n\n  deps = [ \"//components/lens:lens_mojo\" ]\n\n"
  - description: 'Android concrete AI source/provider removal: chrome/common/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//url/mojom:url_mojom_gurl",\

        \ \ \ \ "//url/mojom:url_mojom_origin",\

        \ \ \]\

        \

        \ \ if\ \(is_mac\)\ \{\

        \ \ \ \ public_deps\ \+=\ \[\

        '
      replace: "    \"//url/mojom:url_mojom_gurl\",\n    \"//url/mojom:url_mojom_origin\",\n  ]\n  if (is_android) {\n    public_deps -= [ \"//components/actor/public/mojom:mojo_bindings\" ]\n  }\n\n  if (is_mac) {\n    public_deps += [\n"
  - description: 'Android concrete AI source/provider removal: chrome/common/BUILD.gn'
    regex:
      re_pattern: '\ \ \}\

        \}\

        \

        mojom\("glic_enums_mojom"\)\ \{\

        \ \ sources\ =\ \[\ "glic_enums\.mojom"\ \]\

        \

        \ \ webui_module_path\ =\ "/"\

        \

        \ \ generate_legacy_js_bindings\ =\ true\

        \

        \ \ public_deps\ =\ \[\ "//mojo/public/mojom/base"\ \]\

        \}\

        \

        mojom\("actor_webui_mojom"\)\ \{\

        \ \ sources\ =\ \[\ "actor_webui\.mojom"\ \]\

        \

        \ \ webui_module_path\ =\ "/"\

        \

        \ \ generate_legacy_js_bindings\ =\ true\

        \

        \ \ public_deps\ =\ \[\

        \ \ \ \ ":glic_enums_mojom",\

        \ \ \ \ "//mojo/public/mojom/base",\

        \ \ \ \ "//skia/public/mojom",\

        \ \ \ \ "//url/mojom:url_mojom_origin",\

        \ \ \]\

        \}\

        \

        mojom\("supervised_user_commands_mojom"\)\ \{\

        '
      replace: "  }\n}\n\nif (!is_android) {\n  mojom(\"glic_enums_mojom\") {\n    sources = [ \"glic_enums.mojom\" ]\n    if (is_android) {\n      sources -= [ \"glic_enums.mojom\" ]\n    }\n\n    webui_module_path = \"/\"\n\n    generate_legacy_js_bindings = true\n\n    public_deps = [ \"//mojo/public/mojom/base\" ]\n  }\n}\n\nif (!is_android) {\n  mojom(\"actor_webui_mojom\") {\n    sources = [ \"actor_webui.mojom\" ]\n    if (is_android) {\n      sources -= [ \"actor_webui.mojom\" ]\n    }\n\n    webui_module_path = \"/\"\n\n    generate_legacy_js_bindings = true\n\n    public_deps = [\n      \":glic_enums_mojom\",\n      \"//mojo/public/mojom/base\",\n      \"//skia/public/mojom\",\n      \"//url/mojom:url_mojom_origin\",\n    ]\n    if (is_android) {\n      public_deps -= [ \":glic_enums_mojom\" ]\n    }\n  }\n}\n\nmojom(\"supervised_user_commands_mojom\") {\n"
  - description: Reviewed literal source edit 1
    regex:
      pattern: '    sources -= [ "actor.mojom" ]

        '
      replace: "    sources -= [\n      \"actor.mojom\",\n      \"readaloud/read_aloud.mojom\",\n    ]\n"
    count: 1
