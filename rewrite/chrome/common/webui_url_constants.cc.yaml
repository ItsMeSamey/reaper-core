substitutions:
  - description: |
      Add Brave's WebUI hosts to ChromeURLHosts

      Anchored at the end of the host list rather than on a specific existing
      entry, since the list has no meaningful ordering of its own and any
      given neighboring entry could be renamed or removed later.
    regex:
      re_pattern:
        '(kChromeURLHosts =
        std::to_array<base::cstring_view>\(\{.*?\n)(\s*\}\);)'
      re_flags: [DOTALL]
      replace: |-
        \1      kAdblockHost,
              kAdblockInternalsHost,
              kRewardsPageHost,
              kRewardsInternalsHost,
              kWelcomeHost,
        #if BUILDFLAG(ENABLE_BRAVE_WALLET)
              kWalletPageHost,
        #endif
              kTorInternalsHost,
              kSkusInternalsHost,
              kAdsInternalsHost,
              kNewTabTakeoverHost,
        \2

  - description: "Android Finds compile-out: Remove Android Finds dependency or source"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ kChromeUIChromeFindsInternalsHost,\\\n"
      replace: ""
    count: 1
  - description: Remove remaining Android-only promotional notifications console aggregates and binder
    regex:
      pattern: "      kChromeUIInspectHost,\n      kChromeUINewTabPageHost,\n      kChromeUINewTabPageThirdPartyHost,\n#if BUILDFLAG(IS_ANDROID)\n      kChromeUINotificationsInternalsHost,\n#endif\n      kChromeUISettingsHost,\n      kChromeUISystemInfoHost,\n#if !BUILDFLAG(IS_CHROMEOS)\n"
      replace: "      kChromeUIInspectHost,\n      kChromeUINewTabPageHost,\n      kChromeUINewTabPageThirdPartyHost,\n      kChromeUISettingsHost,\n      kChromeUISystemInfoHost,\n#if !BUILDFLAG(IS_CHROMEOS)\n"
    count: 1
