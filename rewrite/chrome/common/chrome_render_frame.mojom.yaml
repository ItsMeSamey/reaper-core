substitutions:
- description: Exclude Android Actor import
  regex:
    pattern: 'import "chrome/common/actor.mojom";

      '
    replace: '[EnableIfNot=is_android]

      import "chrome/common/actor.mojom";

      '
  count: 1
- description: Exclude Android Actor import
  regex:
    pattern: 'import "components/actor/public/mojom/actor_types.mojom";

      '
    replace: '[EnableIfNot=is_android]

      import "components/actor/public/mojom/actor_types.mojom";

      '
  count: 1
- description: Exclude Android Actor method InitializeTool
  regex:
    pattern: '  InitializeTool('
    replace: "  [EnableIfNot=is_android]\n  InitializeTool("
  count: 1
- description: Exclude Android Actor method ExecuteTool
  regex:
