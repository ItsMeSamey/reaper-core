# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/chrome_paks.gni'
  regex:
    re_pattern: '\ \ \ \ \ \ "\$root_gen_dir/ui/resources/ui_lottie_resources\.pak",\

      \ \ \ \ \ \ "\$root_gen_dir/ui/webui/resources/webui_resources\.pak",\

      \ \ \ \ \]\

      \

      \ \ \ \ if\ \(enable_webui_ntp\)\ \{\

      \ \ \ \ \ \ sources\ \+=\ \[\

      '
    replace: "      \"$root_gen_dir/ui/resources/ui_lottie_resources.pak\",\n      \"$root_gen_dir/ui/webui/resources/webui_resources.pak\",\n    ]\n    if (is_android) {\n      sources -= [\n        \"$root_gen_dir/chrome/browser/glic/resources/glic_browser_resources.pak\",\n        \"$root_gen_dir/chrome/contextual_tasks_resources.pak\",\n        \"$root_gen_dir/chrome/glic_experimental_opt_in_resources.pak\",\n        \"$root_gen_dir/chrome/glic_resources.pak\",\n      ]\n    }\n\n    if (enable_webui_ntp) {\n      sources += [\n"
- description: 'Android concrete AI source/provider removal: chrome/chrome_paks.gni'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/resources:ui_lottie_resources_grd",\

      \ \ \ \ \ \ "//ui/webui/resources",\

      \ \ \ \ \]\

      \ \ \ \ if\ \(defined\(invoker\.deps\)\)\ \{\

      \ \ \ \ \ \ deps\ \+=\ invoker\.deps\

      \ \ \ \ \}\

      '
    replace: "      \"//ui/resources:ui_lottie_resources_grd\",\n      \"//ui/webui/resources\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/glic/resources:browser_resources\" ]\n    }\n    if (defined(invoker.deps)) {\n      deps += invoker.deps\n    }\n"
- description: 'Android concrete AI source/provider removal: chrome/chrome_paks.gni'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ "\$root_gen_dir/content/browser/tracing/tracing_resources\.pak",\

      \ \ \ \ \ \ \ \ "\$root_gen_dir/content/traces_internals_resources\.pak",\

      \ \ \ \ \ \ \]\

      \

      \ \ \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ \ \ "//chrome/browser/actor/resources:browser_resources",\

      '
    replace: "        \"$root_gen_dir/content/browser/tracing/tracing_resources.pak\",\n        \"$root_gen_dir/content/traces_internals_resources.pak\",\n      ]\n      if (is_android) {\n        sources -= [\n          \"$root_gen_dir/chrome/actor_overlay_resources.pak\",\n          \"$root_gen_dir/chrome/browser/actor/resources/actor_browser_resources.pak\",\n          \"$root_gen_dir/chrome/browser/actor/resources/actor_common_resources.pak\",\n          \"$root_gen_dir/chrome/contextual_cueing_internals_resources.pak\",\n          \"$root_gen_dir/chrome/glic_untrusted_resources.pak\",\n        ]\n      }\n\n      deps += [\n        \"//chrome/browser/actor/resources:browser_resources\",\n"
- description: 'Android concrete AI source/provider removal: chrome/chrome_paks.gni'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ "//components/headless/command_handler",\

      \ \ \ \ \ \ \ \ "//content/browser/tracing:resources",\

      \ \ \ \ \ \ \]\

      \ \ \ \ \ \ if\ \(is_chrome_branded\)\ \{\

      \ \ \ \ \ \ \ \ sources\ \+=\ \[\

      \ \ \ \ \ \ \ \ \ \ "\$root_gen_dir/chrome/browser/nearby_sharing/internal/icons/nearby_share_internal_icons\.pak",\

      '
    replace: "        \"//components/headless/command_handler\",\n        \"//content/browser/tracing:resources\",\n      ]\n      if (is_android) {\n        deps -= [\n          \"//chrome/browser/actor/resources:browser_resources\",\n          \"//chrome/browser/resources/contextual_cueing/internals:resources\",\n        ]\n      }\n      if (is_chrome_branded) {\n        sources += [\n          \"$root_gen_dir/chrome/browser/nearby_sharing/internal/icons/nearby_share_internal_icons.pak\",\n"
- description: 'Android concrete AI source/provider removal: chrome/chrome_paks.gni'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ "\$root_gen_dir/chrome/ai_overlay_dialog_untrusted_resources\.pak",\

      \ \ \ \ \ \ \ \ "\$root_gen_dir/chrome/discards_resources\.pak",\

      \ \ \ \ \ \ \]\

      \ \ \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ \ \ "//chrome/browser/resources/discards:resources",\

      \ \ \ \ \ \ \ \ "//chrome/browser/ttc/resources",\

      '
    replace: "        \"$root_gen_dir/chrome/ai_overlay_dialog_untrusted_resources.pak\",\n        \"$root_gen_dir/chrome/discards_resources.pak\",\n      ]\n      if (is_android) {\n        sources -=\n            [ \"$root_gen_dir/chrome/ai_overlay_dialog_untrusted_resources.pak\" ]\n      }\n      deps += [\n        \"//chrome/browser/resources/discards:resources\",\n        \"//chrome/browser/ttc/resources\",\n"
- description: 'Android concrete AI source/provider removal: chrome/chrome_paks.gni'
  regex:
    re_pattern: '\

      \ \ \ \ if\ \(is_win\ \|\|\ is_mac\ \|\|\ is_linux\ \|\|\ is_chromeos\)\ \{\

      \ \ \ \ \ \ sources\ \+=\ \[\ "\$root_gen_dir/chrome/skills_resources\.pak"\ \]\

      \ \ \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/resources/skills:resources"\ \]\

      \ \ \ \ \}\

      \

      \ \ \ \ if\ \(enable_extensions_core\)\ \{\

      '
    replace: "\n    if (is_win || is_mac || is_linux || is_chromeos) {\n      sources += [ \"$root_gen_dir/chrome/skills_resources.pak\" ]\n      if (is_android) {\n        sources -= [ \"$root_gen_dir/chrome/skills_resources.pak\" ]\n      }\n      deps += [ \"//chrome/browser/resources/skills:resources\" ]\n      if (is_android) {\n        deps -= [ \"//chrome/browser/resources/skills:resources\" ]\n      }\n    }\n\n    if (enable_extensions_core) {\n"
- description: 'Android concrete AI source/provider removal: chrome/chrome_paks.gni'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ "\$root_gen_dir/extensions/extensions_renderer_resources\.pak",\

      \ \ \ \ \ \ \ \ "\$root_gen_dir/extensions/extensions_resources\.pak",\

      \ \ \ \ \ \ \]\

      \ \ \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ \ \ "//chrome/browser/resources/contextual_tasks/extension:resources",\

      \ \ \ \ \ \ \ \ "//chrome/browser/resources/extensions:resources",\

      \ \ \ \ \ \ \ \ "//chrome/browser/resources/omnibox/aim_eligibility_extension:resources",\

      \ \ \ \ \ \ \ \ "//extensions:extensions_resources",\

      \ \ \ \ \ \ \]\

      \ \ \ \ \}\ else\ if\ \(is_android\)\ \{\

      \ \ \ \ \ \ sources\ \+=\ \[\ "\$root_gen_dir/chrome/guest_view_shared_resources\.pak"\ \]\

      \ \ \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/resources/guest_view_shared:resources"\ \]\

      '
    replace: "        \"$root_gen_dir/extensions/extensions_renderer_resources.pak\",\n        \"$root_gen_dir/extensions/extensions_resources.pak\",\n      ]\n      if (is_android) {\n        sources -= [\n          \"$root_gen_dir/chrome/aim_eligibility_extension_resources.pak\",\n          \"$root_gen_dir/chrome/contextual_tasks_extension_resources.pak\",\n        ]\n      }\n      deps += [\n        \"//chrome/browser/resources/contextual_tasks/extension:resources\",\n        \"//chrome/browser/resources/extensions:resources\",\n        \"//chrome/browser/resources/omnibox/aim_eligibility_extension:resources\",\n        \"//extensions:extensions_resources\",\n      ]\n      if (is_android) {\n        deps -= [\n          \"//chrome/browser/resources/contextual_tasks/extension:resources\",\n          \"//chrome/browser/resources/omnibox/aim_eligibility_extension:resources\",\n        ]\n      }\n    } else if (is_android) {\n      sources += [ \"$root_gen_dir/chrome/guest_view_shared_resources.pak\" ]\n      deps += [ \"//chrome/browser/resources/guest_view_shared:resources\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/chrome_paks.gni'
  regex:
    re_pattern: '\

      \ \ \ \ if\ \(enable_compose\)\ \{\

      \ \ \ \ \ \ sources\ \+=\ \[\ "\$root_gen_dir/chrome/compose_resources\.pak"\ \]\

      \ \ \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/resources/compose:resources"\ \]\

      \ \ \ \ \}\

      \

      \ \ \ \ if\ \(enterprise_watermark\)\ \{\

      '
    replace: "\n    if (enable_compose) {\n      sources += [ \"$root_gen_dir/chrome/compose_resources.pak\" ]\n      if (is_android) {\n        sources -= [ \"$root_gen_dir/chrome/compose_resources.pak\" ]\n      }\n      deps += [ \"//chrome/browser/resources/compose:resources\" ]\n      if (is_android) {\n        deps -= [ \"//chrome/browser/resources/compose:resources\" ]\n      }\n    }\n\n    if (enterprise_watermark) {\n"
- description: Android omits the TTC and AI overlay implementation.
  count: 1
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \"//chrome/browser/resources/discards:resources\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \"//chrome/browser/ttc/resources\",\\\n\\ \\ \\ \\ \\ \\ \\]\\\n"
    replace: "        \"//chrome/browser/resources/discards:resources\",\n        \"//chrome/browser/ttc/resources\",\n      ]\n      if (is_android) {\n        deps -= [ \"//chrome/browser/ttc/resources\" ]\n      }\n"
