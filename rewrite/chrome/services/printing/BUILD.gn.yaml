substitutions:
- description: Add the Brave printing service sources.
  add_literal_to_list:
    target: lib
    list_name: sources
    literal: brave_services_printing_sources
    import: //brave/services/printing/sources.gni
- description: Add the Brave printing service deps.
  add_literal_to_list:
    target: lib
    list_name: deps
    literal: brave_services_printing_deps
    import: //brave/services/printing/sources.gni
- description: Import narrow Android printing build prerequisites.
  regex:
    re_pattern: import\("//printing/buildflags/buildflags\.gni"\)
    replace: 'import("//extensions/buildflags/buildflags.gni")

      import("//printing/buildflags/buildflags.gni")'
- description: Keep Brave desktop bitmap conversion sources outside Android.
  regex:
    re_pattern: \ \ sources\ \+=\ brave_services_printing_sources
    replace: "  if (!is_android) {\n    sources += brave_services_printing_sources\n  }"
- description: Keep Brave desktop bitmap conversion deps outside Android.
  regex:
    re_pattern: \ \ deps\ \+=\ brave_services_printing_deps
    replace: "  if (!is_android) {\n    deps += brave_services_printing_deps\n  }"
- description: Build the portable PDF-to-PWG utility without desktop print preview.
  regex:
    re_pattern: \ \ if\ \(enable_oop_printing\)\ \{
    replace: "  if (is_android && enable_extensions_core) {\n    assert(!enable_print_preview)\n    sources += [\n      \"pdf_to_pwg_raster_converter.cc\",\n      \"pdf_to_pwg_raster_converter.h\",\n    ]\n    deps += [\n      \"//components/pwg_encoder\",\n      \"//pdf\",\n      \"//printing/mojom\",\n    ]\n  }\n\n  if (enable_oop_printing) {"
- description: Expose buildflags included by the public printing service header.
  regex:
    re_pattern: \ \ public_deps\ =\ \[
    replace: "  public_deps = [\n    \"//extensions/buildflags\","
