substitutions:
- description: Use core-extension gating only for the Android PWG service.
  regex:
    re_pattern: \#include\ "printing/buildflags/buildflags\.h"
    replace: '#include "printing/buildflags/buildflags.h"

      #include "extensions/buildflags/buildflags.h"'
- description: Expose PWG receiver without exposing preview N-up conversion.
  regex:
    re_pattern: \ \ void\ BindPdfToPwgRasterConverter\(
    replace: "#endif\n#if BUILDFLAG(ENABLE_PRINT_PREVIEW) || \\\\\n    (BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE))\n  void BindPdfToPwgRasterConverter("
