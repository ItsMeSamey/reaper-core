substitutions:
- description: Add the Brave printing mojom sources.
  add_literal_to_list:
    target: mojom
    list_name: sources
    literal: brave_services_printing_public_mojom_sources
    import: //brave/services/printing/public/mojom/sources.gni
- description: Add the Brave printing mojom public_deps.
  add_literal_to_list:
    target: mojom
    list_name: public_deps
    literal: brave_services_printing_public_mojom_public_deps
    import: //brave/services/printing/public/mojom/sources.gni
- description: Import core feature selection for Android conversion bindings.
  regex:
    re_pattern: import\("//mojo/public/tools/bindings/mojom\.gni"\)
    replace: 'import("//extensions/buildflags/buildflags.gni")

      import("//mojo/public/tools/bindings/mojom.gni")'
- description: Select PWG-only Android printing service bindings.
  regex:
    re_pattern: \ \ enabled_features\ =\ \[\]
    replace: "  enabled_features = []\n  if (is_android && enable_extensions_core) {\n    enabled_features += [ \"enable_android_extension_printing\" ]\n  }"
