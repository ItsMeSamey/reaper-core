substitutions:
- description: Expose only PWG conversion on Android.
  regex:
    re_pattern: '\ \ \[EnableIf=enable_print_preview\]\

      \ \ BindPdfToPwgRasterConverter'
    replace: "  [EnableIf=enable_print_preview|enable_android_extension_printing]\n  BindPdfToPwgRasterConverter"
