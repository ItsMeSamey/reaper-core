substitutions:
- description: Use core-extension gating only for the Android PWG service.
  regex:
    re_pattern: \#include\ "printing/buildflags/buildflags\.h"
    replace: '#include "printing/buildflags/buildflags.h"

      #include "extensions/buildflags/buildflags.h"'
- description: Include only the PWG converter for Android.
  regex:
    re_pattern: \#include\ "chrome/services/printing/pdf_to_pwg_raster_converter\.h"
    replace: "#endif\n#if BUILDFLAG(ENABLE_PRINT_PREVIEW) || \\\\\n    (BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE))\n#include \"chrome/services/printing/pdf_to_pwg_raster_converter.h\""
- description: Bind the PWG converter for Android printer providers.
  regex:
    re_pattern: void\ PrintingService::BindPdfToPwgRasterConverter\(
    replace: "#endif\n\n#if BUILDFLAG(ENABLE_PRINT_PREVIEW) || \\\\\n    (BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE))\nvoid PrintingService::BindPdfToPwgRasterConverter("
