substitutions:
- description: Import the Android VPN build flag for native library packaging.
  regex:
    pattern: import("//base/android/resource_exclusions.gni")
    replace: 'import("//base/android/resource_exclusions.gni")

      import("//brave/components/brave_vpn/common/buildflags/buildflags.gni")'
- description: Preserve Brave resource exclusion exceptions.
  regex:
    pattern: "      \"*ic_lock.*\",  # Bottom edge seems misaligned.\n    ]"
    replace: "      \"*ic_lock.*\",  # Bottom edge seems misaligned.\n    ]\n    resource_exclusion_exceptions += brave_resources_exclusion_exceptions"
- description: Preserve Brave Java shrinker rules.
  regex:
    pattern: '      proguard_configs = [ "//chrome/android/proguard/main.flags" ]'
    replace: "      proguard_configs = [ \"//chrome/android/proguard/main.flags\" ]\n      proguard_configs += [ \"//brave/android/java/proguard.flags\" ]"
- description: Package WireGuard only when the Android VPN implementation is built.
  regex:
    pattern: "                                 \"version_code\",\n                                 \"version_name\",\n                               ])"
    replace: "                                 \"version_code\",\n                                 \"version_name\",\n                               ])\n    if (enable_brave_vpn) {\n      _wireguard_target =\n          \"//brave/third_party/android_deps:com_wireguard_android_J__unpack_aar\"\n      deps += [ _wireguard_target ]\n      _libwireguard_dir = get_label_info(\n                              \"//brave/third_party/android_deps:com_wireguard_android($default_toolchain)\",\n                              \"target_out_dir\") +\n                          \"/com_wireguard_android_java/jni\"\n      loadable_modules += [ \"$_libwireguard_dir/$android_app_abi/libwg-go.so\" ]\n    }"
- description: Import the real extensions GN build flags for manifest variable binding.
  regex:
    pattern: 'import("//device/vr/buildflags/buildflags.gni")

      '
    replace: 'import("//device/vr/buildflags/buildflags.gni")

      import("//extensions/buildflags/buildflags.gni")

      '
  count: 1
- description: Pass the exact implementation GN flag into the normal Chrome manifest Jinja variables.
  regex:
    pattern: '  "is_desktop_android=$is_desktop_android",

      '
    replace: "  \"is_desktop_android=$is_desktop_android\",\n  \"enable_desktop_android_extensions=$enable_desktop_android_extensions\"\
      ,\n"
  count: 1
