# Android real split persistence and recently-closed restoration.
substitutions:
- description: Cover the real startup restore path with remapped IDs, delayed members, profile isolation and native rejection
  count: 1
  regex:
    re_pattern: '\ \ \ \ @Before\

      \ \ \ \ public\ void\ setUp\(\)'
    replace: "    private void initializeSplitRestoreStore() {\n        mPersistentStore = new TabPersistentStoreImpl(TabOrchestratorType.TABBED,\n                mPersistencePolicy, mTabModelSelector, mTabCreatorManager, mTabWindowManager,\n                mCipherFactory, /* isAuthoritative= */ true, /* recordLegacyTabCountMetrics= */ true);\n        mPersistentStore.initializeRestoreVars(false, false);\n    }\n\n    private Tab restoreSavedSplitMember(int savedId, int actualId, int position, double ratio,\n            boolean incognito) {\n        TabState state = new TabState();\n        state.contentsState = mock(WebContentsState.class);\n        state.isIncognito = incognito;\n        state.splitTabId = new Token(73, 91);\n        state.splitLayout = 1;\n        state.splitRatio = ratio;\n        state.splitPosition = position;\n        Tab tab = mock(Tab.class);\n        when(tab.getId()).thenReturn(actualId);\n        when(tab.isIncognito()).thenReturn(incognito);\n        when(tab.getUrl()).thenReturn(new GURL(RESTORE_TAB_STRING_1));\n        TabCreator creator = incognito ? mIncognitoTabCreator : mNormalTabCreator;\n        TabModelInternal model = incognito ? mIncognitoTabModel : mNormalTabModel;\n        when(creator.createFrozenTab(eq(state), eq(savedId), anyInt())).thenReturn(tab);\n        when(model.getTabById(actualId)).thenReturn(tab);\n        mPersistentStore.restoreTab(new TabRestoreDetails(savedId, position,\n                incognito ? TriState.TRUE : TriState.FALSE, RESTORE_TAB_STRING_1, false), state, false);\n        return tab;\n    }\n\n    @Test\n    public void testRestoreSplitWaitsForBothMembersAndUsesRemappedIds() {\n        initializeSplitRestoreStore();\n        Tab trailing = restoreSavedSplitMember(31, 131, 1, 0.37, false);\n        verify(mNormalTabModel, never()).restoreSplit(any());\n        Tab leading = restoreSavedSplitMember(32, 132, 0, 0.37, false);\n        when(mNormalTabModel.restoreSplit(any())).thenReturn(true);\n        verify(mNormalTabModel, never()).restoreSplit(any());\n        mPersistentStore.restorePendingSplits();\n        verify(mNormalTabModel).restoreSplit(argThat(info -> info.getToken().equals(new Token(73, 91))\n                && info.getFirstTabId() == 132 && info.getSecondTabId() == 131\n                && info.getLayout() == 1 && info.getRatio() == 0.37));\n        verify(leading, never()).setSplitData(any(), anyInt(), org.mockito.ArgumentMatchers.anyDouble(), anyInt());\n        verify(trailing, never()).setSplitData(any(), anyInt(), org.mockito.ArgumentMatchers.anyDouble(), anyInt());\n        mPersistentStore.restorePendingSplits();\n        verify(mNormalTabModel, times(1)).restoreSplit(any());\n    }\n\n    @Test\n    public void testRestoreSplitRejectsMissingAndMismatchedMembers() {\n        initializeSplitRestoreStore();\n        Tab leading = restoreSavedSplitMember(31, 131, 0, 0.37, false);\n        mPersistentStore.restorePendingSplits();\n        verify(mNormalTabModel, never()).restoreSplit(any());\n        verify(leading).setSplitData(null, 0, 0.5, -1);\n\n        initializeSplitRestoreStore();\n        Tab first = restoreSavedSplitMember(31, 131, 0, 0.37, false);\n        Tab second = restoreSavedSplitMember(32, 132, 1, 0.63, false);\n        mPersistentStore.restorePendingSplits();\n        verify(mNormalTabModel, never()).restoreSplit(any());\n        verify(first).setSplitData(null, 0, 0.5, -1);\n        verify(second).setSplitData(null, 0, 0.5, -1);\n    }\n\n    @Test\n    public void testRestoreSplitNeverJoinsProfilesAndClearsRejectedNativePair() {\n        initializeSplitRestoreStore();\n        Tab regular = restoreSavedSplitMember(31, 131, 0, 0.37, false);\n        Tab incognito = restoreSavedSplitMember(32, 132, 1, 0.37, true);\n        mPersistentStore.restorePendingSplits();\n        verify(mNormalTabModel, never()).restoreSplit(any());\n        verify(mIncognitoTabModel, never()).restoreSplit(any());\n        verify(regular).setSplitData(null, 0, 0.5, -1);\n        verify(incognito).setSplitData(null, 0, 0.5, -1);\n\n        initializeSplitRestoreStore();\n        Tab first = restoreSavedSplitMember(31, 131, 0, 0.37, false);\n        Tab second = restoreSavedSplitMember(32, 132, 1, 0.37, false);\n        when(mNormalTabModel.restoreSplit(any())).thenReturn(false);\n        mPersistentStore.restorePendingSplits();\n        verify(mNormalTabModel).restoreSplit(any());\n        verify(first).setSplitData(null, 0, 0.5, -1);\n        verify(second).setSplitData(null, 0, 0.5, -1);\n    }\n\n\n    @Test\n    public void testFailedSavedSplitDoesNotClearAnExistingLivePair() {\n        initializeSplitRestoreStore();\n        Tab first = restoreSavedSplitMember(31, 131, 0, 0.37, false);\n        Tab second = restoreSavedSplitMember(32, 132, 1, 0.37, false);\n        SplitInfo live = new SplitInfo(new Token(83, 97), 131, 132, 0, 0.5);\n        when(mNormalTabModel.getSplitInfoForTab(131)).thenReturn(live);\n        when(mNormalTabModel.getSplitInfoForTab(132)).thenReturn(live);\n        when(mNormalTabModel.restoreSplit(any())).thenReturn(false);\n        mPersistentStore.restorePendingSplits();\n        verify(mNormalTabModel).restoreSplit(any());\n        verify(first, never()).setSplitData(any(), anyInt(), org.mockito.ArgumentMatchers.anyDouble(), anyInt());\n        verify(second, never()).setSplitData(any(), anyInt(), org.mockito.ArgumentMatchers.anyDouble(), anyInt());\n    }\n    @Before\n    public void setUp()"
