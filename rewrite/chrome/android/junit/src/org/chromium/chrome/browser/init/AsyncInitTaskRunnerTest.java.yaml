- description: Keep the existing true-flag startup-completion case without remote fetching
  regex:
    pattern: '    public void fetchVariationsTest() throws InterruptedException {'
    replace: '    public void libraryLoaderWithLegacyFetchFlagTest() throws InterruptedException {'
  count: 1
- description: Retain the native initialization and success assertions for the compatibility flag
  regex:
    pattern: '        verify(mVariationsSeedFetcher).fetchSeed(anyString(), anyString(), anyString());

      '
