substitutions:
- description: Keep ordinary custom-tab resume setup on the same real false price eligibility result
  regex:
    pattern: "        org.chromium.components.commerce.core.CommerceFeatureUtils.Natives commerceJni =\n                mock(org.chromium.components.commerce.core.CommerceFeatureUtils.Natives.class);\n\
      \        org.chromium.components.commerce.core.CommerceFeatureUtilsJni.setInstanceForTesting(\n                commerceJni);\n\
      \        when(commerceJni.isPriceAnnotationsEnabled(anyLong())).thenReturn(false);\n"
    replace: ''
  count: 1
- description: Remove only the now-unused long matcher import
  regex:
    pattern: 'import static org.mockito.ArgumentMatchers.anyLong;

      '
    replace: ''
  count: 1
