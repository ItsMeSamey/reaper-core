  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ ObservableSuppliers\.createMonotonic\(\);\

      \

      \ \ \ \ private\ DownloadPage\ mDownloadPage;\

      \

      \ \ \ \ @Before\

      \ \ \ \ public\ void\ setup\(\)\ \{\

      '
    replace: "            ObservableSuppliers.createMonotonic();\n\n    private DownloadPage mDownloadPage;\n    private final DownloadActivityLauncher mRevealLauncher = new DownloadActivityLauncher();\n    private final List<Boolean> mRevealResults = new ArrayList<>();\n    private Activity mRevealHost;\n    private long mRevealToken;\n    @Captor private ArgumentCaptor<Callback<Boolean>> mRevealCallback;\n\n\n    @Before\n    public void setup() {\n"
- description: Android Downloads exact-item reveal integration (6).
  regex:
    re_pattern: '\

      \ \ \ \ \ \ \ \ verify\(mMockBackPressManager\)\.removeHandler\(mHandlerCaptor\.getValue\(\)\);\

      \ \ \ \ \}\

      \}\

      '
    replace: "\n        verify(mMockBackPressManager).removeHandler(mHandlerCaptor.getValue());\n    }\n\n    private Activity makeRevealHost() {\n        mRevealHost = mock(Activity.class);\n        when(mRevealHost.getPackageName()).thenReturn(\"org.chromium.chrome\");\n        ApplicationStatus.onStateChangeForTesting(mRevealHost, ActivityState.CREATED);\n        ApplicationStatus.onStateChangeForTesting(mRevealHost, ActivityState.RESUMED);\n        when(mProfile.getOriginalProfile()).thenReturn(mProfile);\n        return mRevealHost;\n    }\n\n    private DownloadActivity launchReveal(Profile itemProfile) {\n        Activity host = makeRevealHost();\n        mRevealToken =\n                mRevealLauncher.showDownloadItem(\n                        host,\n                        itemProfile,\n                        new ContentId(\"LEGACY_DOWNLOAD\", \"reveal-guid\"),\n                        mRevealResults::add);\n        assertTrue(mRevealToken != 0);\n        ArgumentCaptor<Intent> intent = ArgumentCaptor.forClass(Intent.class);\n        verify(host).startActivity(intent.capture());\n        DownloadActivity activity = mock(DownloadActivity.class);\n        when(activity.getIntent()).thenReturn(intent.getValue());\n        assertTrue(mRevealLauncher.prepareDownloadItemActivity(activity));\n        return activity;\n    }\n\n    private DownloadManagerCoordinator beginReveal(DownloadActivity activity) {\n        DownloadManagerCoordinator coordinator = mock(DownloadManagerCoordinator.class);\n        mRevealLauncher.revealDownloadItem(activity, coordinator);\n        verify(coordinator).revealItem(eq(new ContentId(\"LEGACY_DOWNLOAD\", \"reveal-guid\")),\n                mRevealCallback.capture());\n        return coordinator;\n    }\n\n    @After\n    public void finishRevealRequest() {\n        mRevealLauncher.cancelDownloadItem(mRevealToken);\n        if (mRevealHost != null) {\n            ApplicationStatus.onStateChangeForTesting(mRevealHost, ActivityState.DESTROYED);\n        }\n    }\n\n    @Test\n    public void testItemRevealCompletesOnceAndRejectsRestoredToken() {\n        DownloadActivity activity = launchReveal(mProfile);\n        beginReveal(activity);\n        mRevealCallback.getValue().onResult(true);\n        mRevealCallback.getValue().onResult(false);\n        mRevealLauncher.onDownloadItemActivityClosed(activity);\n        assertEquals(List.of(true), mRevealResults);\n        // Successful Downloads UI recreation must no longer be treated as an orphaned request.\n        assertFalse(DownloadActivityLauncher.isDownloadItemIntent(activity.getIntent()));\n        assertFalse(mRevealLauncher.prepareDownloadItemActivity(activity));\n    }\n\n    @Test\n    public void testItemRevealUsesActualPrimaryOtrProfile() {\n        Profile otr = mock(Profile.class);\n        OtrProfileId id = OtrProfileId.getPrimaryOtrProfileId();\n        when(otr.getOriginalProfile()).thenReturn(mProfile);\n        when(otr.getOtrProfileId()).thenReturn(id);\n        when(mProfile.getOffTheRecordProfile(id, false)).thenReturn(otr);\n        DownloadActivity activity = launchReveal(otr);\n        assertEquals(OtrProfileId.serialize(id),\n                activity.getIntent().getStringExtra(DownloadUtils.EXTRA_OTR_PROFILE_ID));\n        beginReveal(activity);\n        mRevealCallback.getValue().onResult(true);\n        assertEquals(List.of(true), mRevealResults);\n    }\n\n    @Test\n    public void testItemRevealRejectsChangedProfileBeforeCompletion() {\n        DownloadActivity activity = launchReveal(mProfile);\n        DownloadManagerCoordinator coordinator = beginReveal(activity);\n        ProfileManager.setLastUsedProfileForTesting(mock(Profile.class));\n        mRevealCallback.getValue().onResult(true);\n        assertEquals(List.of(false), mRevealResults);\n        verify(coordinator).cancelRevealItem();\n        verify(activity).finish();\n    }\n\n    @Test\n    public void testItemRevealCancellationIgnoresLateCoordinatorResult() {\n        DownloadActivity activity = launchReveal(mProfile);\n        DownloadManagerCoordinator coordinator = beginReveal(activity);\n        mRevealLauncher.cancelDownloadItem(mRevealToken);\n        mRevealCallback.getValue().onResult(true);\n        mRevealLauncher.cancelDownloadItem(mRevealToken);\n        assertEquals(List.of(false), mRevealResults);\n        verify(coordinator, times(1)).cancelRevealItem();\n        verify(activity, times(1)).finish();\n    }\n\n    @Test\n    public void testItemRevealProfileShutdownFailsOnce() {\n        DownloadActivity activity = launchReveal(mProfile);\n        DownloadManagerCoordinator coordinator = beginReveal(activity);\n        ProfileManager.onProfileDestroyed(mProfile);\n        mRevealCallback.getValue().onResult(true);\n        ProfileManager.onProfileDestroyed(mProfile);\n        assertEquals(List.of(false), mRevealResults);\n        verify(coordinator, times(1)).cancelRevealItem();\n        verify(activity, times(1)).finish();\n    }\n\n    @Test\n    public void testItemRevealActivityCloseFailsPendingLoad() {\n        DownloadActivity activity = launchReveal(mProfile);\n        DownloadManagerCoordinator coordinator = beginReveal(activity);\n        mRevealLauncher.onDownloadItemActivityClosed(activity);\n        mRevealCallback.getValue().onResult(true);\n        assertEquals(List.of(false), mRevealResults);\n        verify(coordinator).cancelRevealItem();\n    }\n\n    @Test\n    public void testItemRevealLaunchRejectionCompletesWithoutRetainingProfile() {\n        Activity host = makeRevealHost();\n        doThrow(new SecurityException(\"background launch rejected\")).when(host).startActivity(any());\n        assertEquals(0, mRevealLauncher.showDownloadItem(host, mProfile,\n                new ContentId(\"LEGACY_DOWNLOAD\", \"reveal-guid\"), mRevealResults::add));\n        ProfileManager.onProfileDestroyed(mProfile);\n        assertEquals(List.of(false), mRevealResults);\n    }\n\n    @Test\n    public void testItemRevealRejectsBackgroundHost() {\n        Activity host = makeRevealHost();\n        ApplicationStatus.onStateChangeForTesting(host, ActivityState.PAUSED);\n        assertEquals(0, mRevealLauncher.showDownloadItem(host, mProfile,\n                new ContentId(\"LEGACY_DOWNLOAD\", \"reveal-guid\"), mRevealResults::add));\n        assertEquals(List.of(false), mRevealResults);\n    }\n}\n"
