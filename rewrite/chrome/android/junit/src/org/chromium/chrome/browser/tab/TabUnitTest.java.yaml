# Android real split persistence and recently-closed restoration.
substitutions:
- description: Exercise real TabImpl visibility ordering, repeated transitions, reentrant hiding and destruction, and lazy native initialization
  count: 1
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ @SmallTest\

      \ \ \ \ public\ void\ testOnAddedToTabModel_SendsDidInsertUpdate\(\)'
    replace: "    private void prepareVisibilityTestTab() {\n        mTab = spy(mTab);\n        mTab.setNativePtrForTesting(1);\n        // Keep the production show/hide state machine, without creating a renderer.\n        doReturn(false).when(mTab).loadIfNeeded(anyBoolean());\n    }\n\n    @Test\n    @SmallTest\n    public void testVisibilityTransitionsNotifyOnceInOrder() {\n        prepareVisibilityTestTab();\n        doAnswer(invocation -> {\n                    assertFalse(mTab.isHidden());\n                    return null;\n                }).when(mNativeMock).sendDidBecomeVisibleUpdate(1);\n        doAnswer(invocation -> {\n                    assertFalse(mTab.isHidden());\n                    return null;\n                }).when(mNativeMock).sendWillBecomeHiddenUpdate(1);\n\n        mTab.show(TabSelectionType.FROM_USER);\n        mTab.show(TabSelectionType.FROM_USER);\n        mTab.hide(TabHidingType.CHANGED_TABS);\n        mTab.hide(TabHidingType.CHANGED_TABS);\n        mTab.show(TabSelectionType.FROM_USER);\n        mTab.hide(TabHidingType.CHANGED_TABS);\n\n        assertTrue(mTab.isHidden());\n        InOrder order = inOrder(mNativeMock, mObserver);\n        order.verify(mNativeMock).sendDidBecomeVisibleUpdate(1);\n        order.verify(mNativeMock).onShow(1);\n        order.verify(mObserver).onShown(mTab, TabSelectionType.FROM_USER);\n        order.verify(mNativeMock).sendWillBecomeHiddenUpdate(1);\n        order.verify(mObserver).onHidden(mTab, TabHidingType.CHANGED_TABS);\n        order.verify(mNativeMock).sendDidBecomeVisibleUpdate(1);\n        order.verify(mNativeMock).onShow(1);\n        order.verify(mObserver).onShown(mTab, TabSelectionType.FROM_USER);\n        order.verify(mNativeMock).sendWillBecomeHiddenUpdate(1);\n        order.verify(mObserver).onHidden(mTab, TabHidingType.CHANGED_TABS);\n        verify(mNativeMock, times(2)).sendDidBecomeVisibleUpdate(1);\n        verify(mNativeMock, times(2)).sendWillBecomeHiddenUpdate(1);\n        verify(mNativeMock, never()).sendDidActivateUpdate(anyLong());\n        verify(mNativeMock, never()).sendWillDeactivateUpdate(anyLong());\n    }\n\n    @Test\n    @SmallTest\n    public void testDidBecomeVisibleObserverCanHideBeforeShowWork() {\n        prepareVisibilityTestTab();\n        doAnswer(invocation -> {\n                    mTab.hide(TabHidingType.CHANGED_TABS);\n                    return null;\n                }).when(mNativeMock).sendDidBecomeVisibleUpdate(1);\n\n        mTab.show(TabSelectionType.FROM_USER);\n\n        assertTrue(mTab.isHidden());\n        verify(mNativeMock).sendDidBecomeVisibleUpdate(1);\n        verify(mNativeMock).sendWillBecomeHiddenUpdate(1);\n        verify(mTab, never()).loadIfNeeded(anyBoolean());\n        verify(mNativeMock, never()).onShow(anyLong());\n        verify(mObserver, never()).onShown(any(), anyInt());\n        verify(mObserver).onHidden(mTab, TabHidingType.CHANGED_TABS);\n    }\n\n    @Test\n    @SmallTest\n    public void testWillBecomeHiddenObserverCannotDispatchHideTwice() {\n        prepareVisibilityTestTab();\n        mTab.show(TabSelectionType.FROM_USER);\n        doAnswer(invocation -> {\n                    assertFalse(mTab.isHidden());\n                    mTab.hide(TabHidingType.CHANGED_TABS);\n                    assertFalse(mTab.isHidden());\n                    return null;\n                }).when(mNativeMock).sendWillBecomeHiddenUpdate(1);\n\n        mTab.hide(TabHidingType.CHANGED_TABS);\n\n        assertTrue(mTab.isHidden());\n        verify(mNativeMock).sendWillBecomeHiddenUpdate(1);\n        verify(mObserver).onHidden(mTab, TabHidingType.CHANGED_TABS);\n    }\n\n    @Test\n    @SmallTest\n    @EnableFeatures({ChromeFeatureList.ABORT_NAVIGATIONS_FROM_TAB_CLOSURES})\n    public void testDidBecomeVisibleObserverCanDestroyTab() {\n        prepareVisibilityTestTab();\n        doAnswer(invocation -> {\n                    mTab.clearNativePtr();\n                    return null;\n                }).when(mNativeMock).destroy(1);\n        doAnswer(invocation -> {\n                    mTab.destroy();\n                    return null;\n                }).when(mNativeMock).sendDidBecomeVisibleUpdate(1);\n\n        mTab.show(TabSelectionType.FROM_USER);\n        mTab.show(TabSelectionType.FROM_USER);\n        mTab.hide(TabHidingType.CHANGED_TABS);\n\n        assertTrue(mTab.isDestroyed());\n        verify(mNativeMock).sendDidBecomeVisibleUpdate(1);\n        verify(mNativeMock).destroy(1);\n        verify(mNativeMock, never()).onShow(anyLong());\n        verify(mNativeMock, never()).sendWillBecomeHiddenUpdate(anyLong());\n        verify(mTab, never()).loadIfNeeded(anyBoolean());\n        verify(mObserver, never()).onShown(any(), anyInt());\n    }\n\n    @Test\n    @SmallTest\n    public void testShowStillLoadsWhenNativePeerInitiallyAbsent() {\n        prepareVisibilityTestTab();\n        mTab.clearNativePtr();\n        doAnswer(invocation -> {\n                    mTab.setNativePtrForTesting(1);\n                    return false;\n                }).when(mTab).loadIfNeeded(false);\n\n        mTab.show(TabSelectionType.FROM_USER);\n\n        assertFalse(mTab.isHidden());\n        verify(mTab).loadIfNeeded(false);\n        verify(mNativeMock).onShow(1);\n        verify(mNativeMock, never()).sendDidBecomeVisibleUpdate(anyLong());\n        verify(mObserver).onShown(mTab, TabSelectionType.FROM_USER);\n    }\n\n    @Test\n    @SmallTest\n    public void testOnAddedToTabModel_SendsDidInsertUpdate()"
- description: Activation alone must not manufacture native visibility changes
  count: 1
  regex:
    re_pattern: \ \ \ \ \ \ \ \ verify\(mNativeMock\)\.sendDidActivateUpdate\(anyLong\(\)\);
    replace: "        verify(mNativeMock).sendDidActivateUpdate(anyLong());\n        verify(mNativeMock, never()).sendDidBecomeVisibleUpdate(anyLong());\n        verify(mNativeMock, never()).sendWillBecomeHiddenUpdate(anyLong());"
- description: Deactivation alone must leave other visible split panes visible
  count: 1
  regex:
    re_pattern: \ \ \ \ \ \ \ \ verify\(mNativeMock\)\.sendWillDeactivateUpdate\(anyLong\(\)\);
    replace: "        verify(mNativeMock).sendWillDeactivateUpdate(anyLong());\n        verify(mNativeMock, never()).sendDidBecomeVisibleUpdate(anyLong());\n        verify(mNativeMock, never()).sendWillBecomeHiddenUpdate(anyLong());"
