# Android compositor tests for retained browser features.
substitutions:
- description: "Remove the test for the compiled-out Glic button renderer."
  regex:
    pattern: "    @Test\n    public void testGetButtonTextBitmap() {\n        Bitmap buttonBitmap = mFactory.getButtonTextBitmap(\"Button Label\");\n        assertNotNull(\"Button text bitmap should not be null.\", buttonBitmap);\n        assertTrue(\"Button text bitmap width should be positive.\", buttonBitmap.getWidth() > 0);\n    }\n\n"
    replace: ""
  count: 1
- description: "Keep the mixed rendering sequence on retained title, favicon and group APIs."
  regex:
    pattern: "        Bitmap buttonText = mFactory.getButtonTextBitmap(\"Action\");\n"
    replace: ""
  count: 1
- description: "Remove the corresponding removed-button assertion only."
  regex:
    pattern: "        assertNotNull(buttonText);\n"
    replace: ""
  count: 1
