      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ StripLayoutTab\.DYNAMIC_GLIC_ACTUATION_INDICATOR_WIDTH,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tab\.getAlertIndicatorWidth\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 0\.0f\);\

      \ \ \ \ \}'
    replace: "    @Test\n    public void testLegacyRemovedAlertsDoNotReplaceOrdinaryRecordingState()\
      \ {\n        StripLayoutTab tab = createStripLayoutTab(false);\n        int[]\
      \ removedAlerts = {TabAlert.ACTOR_ACCESSING, TabAlert.ACTOR_WAITING_ON_USER,\n\
      \                TabAlert.GLIC_ACCESSING, TabAlert.GLIC_SHARING};\n        for\
      \ (int alert : removedAlerts) {\n            tab.setAlertState(TabAlert.MEDIA_RECORDING);\n\
