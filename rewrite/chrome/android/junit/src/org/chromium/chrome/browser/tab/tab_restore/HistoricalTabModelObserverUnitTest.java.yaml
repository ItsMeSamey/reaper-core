# Android real split persistence and recently-closed restoration.
substitutions:
- description: Use strict mocked tabs to verify historical snapshot lifetime ordering
  count: 1
  regex:
    re_pattern: import\ static\ org\.mockito\.Mockito\.never;
    replace: 'import static org.mockito.Mockito.mock;

      import static org.mockito.Mockito.never;'
- description: Consume closing snapshots before clearing them and release non-restorable values
  count: 1
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ public\ void\ testEmpty\(\)\ \{'
    replace: "    @Test\n    public void testClosingSnapshotClearedAfterHistoryAndWithoutHistory() {\n        Tab tab = mock(Tab.class);\n        org.mockito.InOrder order = org.mockito.Mockito.inOrder(mHistoricalTabSaver, tab);\n        mObserver.onFinishingMultipleTabClosure(java.util.List.of(tab), true);\n        order.verify(mHistoricalTabSaver).createHistoricalTab(tab);\n        order.verify(tab).clearSplitDataForClosure();\n        Tab excluded = mock(Tab.class);\n        mObserver.onFinishingMultipleTabClosure(java.util.List.of(excluded), false);\n        verify(excluded).clearSplitDataForClosure();\n        verify(mHistoricalTabSaver, never()).createHistoricalTab(excluded);\n    }\n\n    @Test\n    public void testEmpty() {"
