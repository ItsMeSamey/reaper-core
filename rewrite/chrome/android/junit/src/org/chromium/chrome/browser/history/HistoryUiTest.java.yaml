  - description: Reaper Android physical Actor-history and AI-starter-pack decoration
      closure; retain real ordinary history and favicon behavior and disclosed fixture
      assertions.
    regex:
      re_pattern: '\

        \ \ \ \ @Test\

        \ \ \ \ @SmallTest\

        \ \ \ \ public\ void\ testSparkVisibility\(\)\ \{\

        \ \ \ \ \ \ \ \ //\ Use\ a\ timestamp\ older\ than\ the\ ones\ in\ setUp\(\)\
        to\ ensure\ they\ appear\ after\ Item\ 1\ and\ 2\.\

        \ \ \ \ \ \ \ \ long\ timestamp\ =\ mItem2\.getTimestamp\(\)\ \-\ 1000;\

        \

        \ \ \ \ \ \ \ \ //\ Item\ with\ spark\ \(actor\ visit,\ not\ blocked\)\

        \ \ \ \ \ \ \ \ HistoryItem\ actorItem\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ StubbedHistoryProvider\.createHistoryItem\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 0,\ timestamp,\ /\*\ blockedVisit=\
        \*/\ false,\ /\*\ isActorVisit=\ \*/\ true\);\

        \

        \ \ \ \ \ \ \ \ //\ Item\ without\ spark\ \(not\ actor\ visit\)\

        \ \ \ \ \ \ \ \ HistoryItem\ nonActorItem\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ StubbedHistoryProvider\.createHistoryItem\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 1,\ timestamp\ \-\ 1,\ /\*\
        blockedVisit=\ \*/\ false,\ /\*\ isActorVisit=\ \*/\ false\);\

        \

        \ \ \ \ \ \ \ \ //\ Item\ without\ spark\ \(actor\ visit,\ but\ blocked\)\

        \ \ \ \ \ \ \ \ HistoryItem\ blockedActorItem\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ StubbedHistoryProvider\.createHistoryItem\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 2,\ timestamp\ \-\ 2,\ /\*\
        blockedVisit=\ \*/\ true,\ /\*\ isActorVisit=\ \*/\ true\);\

        '
      replace: "\n    @Test\n    @SmallTest\n    public void testLegacyActorVisitKeepsOrdinarySelectionAndItems()\
        \ {\n        // Use a timestamp older than the ones in setUp() to ensure they\
        \ appear after Item 1 and 2.\n        long timestamp = mItem2.getTimestamp()\
        \ - 1000;\n\n        // Legacy actor visit, not blocked\n        HistoryItem\
        \ actorItem =\n                StubbedHistoryProvider.createHistoryItem(\n \
        \                       0, timestamp, /* blockedVisit= */ false, /* isActorVisit=\
        \ */ true);\n\n        // Ordinary visit\n        HistoryItem nonActorItem =\n\
        \                StubbedHistoryProvider.createHistoryItem(\n               \
        \         1, timestamp - 1, /* blockedVisit= */ false, /* isActorVisit= */ false);\n\
        \n        // Blocked legacy actor visit\n        HistoryItem blockedActorItem\
        \ =\n                StubbedHistoryProvider.createHistoryItem(\n           \
        \             2, timestamp - 2, /* blockedVisit= */ true, /* isActorVisit= */\
        \ true);\n"
  - description: Reaper Android physical Actor-history and AI-starter-pack decoration
      closure; retain real ordinary history and favicon behavior and disclosed fixture
      assertions.
    regex:
      re_pattern: '\

        \ \ \ \ \ \ \ \ HistoryItemView\ actorView\ =\ \(HistoryItemView\)\ getItemView\(4\);\

        \ \ \ \ \ \ \ \ Assert\.assertEquals\(actorItem,\ actorView\.getItem\(\)\);\

        \ \ \ \ \ \ \ \ Assert\.assertEquals\(View\.VISIBLE,\ actorView\.getSparkContainerForTests\(\)\.getVisibility\(\)\);\

        \

        \ \ \ \ \ \ \ \ //\ Select\ the\ actor\ visit\ item\ and\ check\ that\ the\
        spark\ is\ hidden\.\

        \ \ \ \ \ \ \ \ toggleItemSelection\(4\);\

        \ \ \ \ \ \ \ \ Assert\.assertEquals\(View\.GONE,\ actorView\.getSparkContainerForTests\(\)\.getVisibility\(\)\);\

        \

        \ \ \ \ \ \ \ \ //\ Unselect\ the\ actor\ visit\ item\ and\ check\ that\ the\
        spark\ is\ shown\ again\.\

        \ \ \ \ \ \ \ \ toggleItemSelection\(4\);\

        \ \ \ \ \ \ \ \ Assert\.assertEquals\(View\.VISIBLE,\ actorView\.getSparkContainerForTests\(\)\.getVisibility\(\)\);\

        \

        \ \ \ \ \ \ \ \ HistoryItemView\ nonActorView\ =\ \(HistoryItemView\)\ getItemView\(5\);\

        \ \ \ \ \ \ \ \ Assert\.assertEquals\(nonActorItem,\ nonActorView\.getItem\(\)\);\

        \ \ \ \ \ \ \ \ Assert\.assertEquals\(View\.GONE,\ nonActorView\.getSparkContainerForTests\(\)\.getVisibility\(\)\);\

        \

        \ \ \ \ \ \ \ \ HistoryItemView\ blockedActorView\ =\ \(HistoryItemView\)\ getItemView\(6\);\

        \ \ \ \ \ \ \ \ Assert\.assertEquals\(blockedActorItem,\ blockedActorView\.getItem\(\)\);\

        \ \ \ \ \ \ \ \ Assert\.assertEquals\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ View\.GONE,\ blockedActorView\.getSparkContainerForTests\(\)\.getVisibility\(\)\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Test\

        '
      replace: "\n        HistoryItemView actorView = (HistoryItemView) getItemView(4);\n\
        \        Assert.assertEquals(actorItem, actorView.getItem());\n        Assert.assertFalse(actorView.isChecked());\n\
        \n        // Legacy visit metadata must retain normal selection behavior.\n\
        \        toggleItemSelection(4);\n        Assert.assertTrue(actorView.isChecked());\n\
        \n        // Unselect the same history item.\n        toggleItemSelection(4);\n\
        \        Assert.assertFalse(actorView.isChecked());\n\n        HistoryItemView\
        \ nonActorView = (HistoryItemView) getItemView(5);\n        Assert.assertEquals(nonActorItem,\
        \ nonActorView.getItem());\n        Assert.assertFalse(nonActorView.isChecked());\n\
        \n        HistoryItemView blockedActorView = (HistoryItemView) getItemView(6);\n\
        \        Assert.assertEquals(blockedActorItem, blockedActorView.getItem());\n\
        \        Assert.assertFalse(blockedActorView.isChecked());\n    }\n\n    @Test\n"
