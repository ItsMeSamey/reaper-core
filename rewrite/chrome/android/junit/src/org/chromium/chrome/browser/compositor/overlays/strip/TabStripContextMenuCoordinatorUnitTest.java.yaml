# Android compositor tests for retained browser features.
substitutions:
- description: "Remove a reference used only by compiled-out Glic menu behavior."
  regex:
    pattern: "import org.chromium.chrome.browser.glic.GlicEnabling;\n"
    replace: ""
  count: 1
- description: "Remove a reference used only by compiled-out Glic menu behavior."
  regex:
    pattern: "import org.chromium.chrome.browser.glic.GlicPrefNames;\n"
    replace: ""
  count: 1
- description: "Remove a reference used only by compiled-out Glic menu behavior."
  regex:
    pattern: "import org.chromium.chrome.browser.ui.messages.snackbar.Snackbar;\n"
    replace: ""
  count: 1
- description: "Remove a reference used only by compiled-out Glic menu behavior."
  regex:
    pattern: "    ChromeFeatureList.GLIC,\n"
    replace: ""
  count: 1
- description: "Remove a reference used only by compiled-out Glic menu behavior."
  regex:
    pattern: "        GlicEnabling.setEnabledForTesting(ChromeFeatureList.isEnabled(ChromeFeatureList.GLIC));\n"
    replace: ""
  count: 1
- description: "Observe that the removed menu does not touch profile preferences."
  regex:
    pattern: "import static org.mockito.Mockito.verify;\n"
    replace: "import static org.mockito.Mockito.verify;\nimport static org.mockito.Mockito.verifyNoInteractions;\n"
  count: 1
- description: "Replace obsolete AI pin/unpin behavior tests with retained-menu absence coverage."
  regex:
    pattern: "    @Test\n    @EnableFeatures({ChromeFeatureList.GLIC, ChromeFeatureList.ENABLE_ANDROID_SIDE_PANEL})\n    public void showMenu_verifyPinGlicOption() {\n        // Arrange.\n        MultiWindowUtils.setMultiInstanceApi31EnabledForTesting(true);\n        when(mPrefService.getBoolean(GlicPrefNames.GLIC_PINNED_TO_TABSTRIP)).thenReturn(false);\n        mCoordinator.showMenu(mRectProvider, false, mActivity);\n        verifyMenuState(/* expectedNumItems= */ 6);\n        assertEquals(\n                R.string.glic_pin, getItemModelAtPosition(5).get(ListMenuItemProperties.TITLE_ID));\n\n        // Act: Select \"Pin Gemini\" option.\n        mCoordinator\n                .getListMenuDelegate(mContentView)\n                .onItemSelected(getItemModelAtPosition(5), mListView);\n\n        // Verify.\n        verify(mPrefService).setBoolean(GlicPrefNames.GLIC_PINNED_TO_TABSTRIP, true);\n        assertFalse(mMenuWindow.isShowing());\n    }\n\n    @Test\n    @EnableFeatures({ChromeFeatureList.GLIC, ChromeFeatureList.ENABLE_ANDROID_SIDE_PANEL})\n    public void showMenu_verifyUnpinGlicOption() {\n        // Arrange.\n        MultiWindowUtils.setMultiInstanceApi31EnabledForTesting(true);\n        when(mPrefService.getBoolean(GlicPrefNames.GLIC_PINNED_TO_TABSTRIP)).thenReturn(true);\n        mCoordinator.showMenu(mRectProvider, false, mActivity);\n        verifyMenuState(/* expectedNumItems= */ 6);\n        assertEquals(\n                R.string.glic_unpin,\n                getItemModelAtPosition(5).get(ListMenuItemProperties.TITLE_ID));\n\n        // Act: Select \"Unpin Gemini\" option.\n        mCoordinator\n                .getListMenuDelegate(mContentView)\n                .onItemSelected(getItemModelAtPosition(5), mListView);\n\n        // Verify.\n        verify(mPrefService).setBoolean(GlicPrefNames.GLIC_PINNED_TO_TABSTRIP, false);\n        verify(mSnackbarManager).showSnackbar(any(Snackbar.class));\n        assertFalse(mMenuWindow.isShowing());\n    }\n\n"
    replace: "    @Test\n    @EnableFeatures({ChromeFeatureList.GLIC, ChromeFeatureList.ENABLE_ANDROID_SIDE_PANEL})\n    public void showMenu_keepsOrdinaryActionsWithoutAiControls() {\n        // Enabling the old flags cannot restore a compiled-out menu or its preference access.\n        MultiWindowUtils.setMultiInstanceApi31EnabledForTesting(true);\n        mCoordinator.showMenu(mRectProvider, false, mActivity);\n\n        int[] expectedIds = {\n            R.id.new_tab_menu_id,\n            R.id.reopen_closed_entry,\n            R.id.bookmark_all_tabs,\n            R.id.name_window\n        };\n        verifyMenuState(expectedIds.length);\n        for (int i = 0; i < expectedIds.length; ++i) {\n            assertEquals(\n                    expectedIds[i],\n                    getItemModelAtPosition(i).get(ListMenuItemProperties.MENU_ITEM_ID));\n        }\n        verifyNoInteractions(mPrefService);\n    }\n\n"
  count: 1
