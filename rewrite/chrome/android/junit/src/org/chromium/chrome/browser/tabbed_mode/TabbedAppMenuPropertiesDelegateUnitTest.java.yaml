    replace: "    public void testPageMenuItems_multiInstance_manageAllWindow() {\n        var preferences = ChromeSharedPreferences.getInstance();\n        boolean hadMultiWindowsPreference =\n                preferences.contains(BravePreferenceKeys.ENABLE_MULTI_WINDOWS);\n        boolean multiWindowsEnabled =\n                preferences.readBoolean(BravePreferenceKeys.ENABLE_MULTI_WINDOWS, false);\n        preferences.writeBoolean(BravePreferenceKeys.ENABLE_MULTI_WINDOWS, true);\n        try {\n            mOverrideContextWrapperTestRule.setIsDesktop(false);\n            DeviceInfo.setIsDesktopForTesting(false);\n            setUpMocksForPageMenu();\n            when(mTabModel.getCount()).thenReturn(1);\n            assertEquals(MenuGroup.PAGE_MENU, mTabbedAppMenuPropertiesDelegate.getMenuGroup());\n            when(mTab.getUrl()).thenReturn(JUnitTestGURLs.SEARCH_URL);\n            MultiWindowTestUtils.enableMultiInstance();\n\n            MultiWindowTestUtils.createInstance(\n                    /* instanceId= */ 0, /* url= */ \"https://url0\", /* tabCount= */ 1, /* taskId= */ 0);\n            assertEquals(1, MultiWindowUtils.getInstanceCount(PersistedInstanceType.ANY));\n\n            ModelList modelList = createMenuForMultiWindow();\n            assertFalse(isMenuVisible(modelList, R.id.manage_all_windows_menu_id));\n\n            MultiWindowTestUtils.createInstance(\n                    /* instanceId= */ 1, /* url= */ \"https://url1\", /* tabCount= */ 1, /* taskId= */ 1);\n            assertEquals(2, MultiWindowUtils.getInstanceCount(PersistedInstanceType.ANY));\n\n            ModelList modelList2 = createMenuForMultiWindow();\n            assertTrue(isMenuVisible(modelList2, R.id.manage_all_windows_menu_id));\n        } finally {\n            if (hadMultiWindowsPreference) {\n                preferences.writeBoolean(\n                        BravePreferenceKeys.ENABLE_MULTI_WINDOWS, multiWindowsEnabled);\n            } else {\n                preferences.removeKey(BravePreferenceKeys.ENABLE_MULTI_WINDOWS);\n            }\n        }\n    }\n"
