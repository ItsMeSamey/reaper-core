- description: Reuse the existing fixture-local activity subclass and public toolbar callback contract.
  regex:
    pattern: '    private ChromeTabbedActivity mActivity;

      '
    replace: "    private static class KeyboardTestChromeTabbedActivity extends TestChromeTabbedActivity {\n        private\
      \ final FullscreenManager mFullscreenManager = mock(FullscreenManager.class);\n        private boolean mBrowserKeyHandled;\n\
      \        private int mLastMenuAction;\n\n        @Override\n        public FullscreenManager getFullscreenManager()\
      \ {\n            return mFullscreenManager;\n        }\n\n        @Override\n        public boolean onKeyDown(int keyCode,\
      \ KeyEvent event) {\n            return mBrowserKeyHandled;\n        }\n\n        @Override\n        public boolean\
      \ onMenuOrKeyboardAction(int id, boolean fromMenu) {\n            mLastMenuAction = id;\n            return true;\n\
      \        }\n    }\n\n    private KeyboardTestChromeTabbedActivity createKeyboardActivity(\n            ExtensionsToolbarCoordinator\
      \ coordinator) {\n        KeyboardTestChromeTabbedActivity activity = new KeyboardTestChromeTabbedActivity();\n    \
      \    activity.setDidFinishNativeInitialization(true);\n        ReflectionHelpers.setField(activity, \"mUiWithNativeInitialized\"\
      , true);\n        ToolbarManager toolbarManager = mock(ToolbarManager.class);\n        when(toolbarManager.getExtensionsToolbarCoordinator()).thenReturn(coordinator);\n\
      \        OneshotSupplierImpl<ToolbarManager> toolbarSupplier = new OneshotSupplierImpl<>();\n        toolbarSupplier.set(toolbarManager);\n\
      \        RootUiCoordinator rootUiCoordinator = mock(RootUiCoordinator.class);\n        when(rootUiCoordinator.getToolbarManagerSupplier()).thenReturn(toolbarSupplier);\n\
      \        ReflectionHelpers.setField(activity, \"mRootUiCoordinator\", rootUiCoordinator);\n        return activity;\n\
      \    }\n\n    private KeyEvent extensionShortcut() {\n        return new KeyEvent(\n                0,\n           \
      \     0,\n                KeyEvent.ACTION_DOWN,\n                KeyEvent.KEYCODE_1,\n                0,\n         \
      \       KeyEvent.META_CTRL_ON | KeyEvent.META_SHIFT_ON);\n    }\n\n    private ChromeTabbedActivity mActivity;\n"
  count: 1
