      \n        verifyNoInteractions(coordinator);\n    }\n\n    @Test\n    @DisableFeatures(ChromeFeatureList.UNIVERSAL_KEYBOARD_HANDLING)\n\
      \    public void testUniversalKeyboardCallbacks_disabledFeatureDoesNotDispatch() {\n        ExtensionsToolbarCoordinator\
      \ coordinator = mock(ExtensionsToolbarCoordinator.class);\n        KeyboardTestChromeTabbedActivity activity = createKeyboardActivity(coordinator);\n\
      \        KeyEvent event = extensionShortcut();\n\n        assertFalse(activity.preHandleKeyboardEvent(event));\n   \
