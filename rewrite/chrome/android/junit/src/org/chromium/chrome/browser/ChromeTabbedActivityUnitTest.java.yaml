      \n        verifyNoInteractions(coordinator);\n    }\n\n    @Test\n    @EnableFeatures(ChromeFeatureList.UNIVERSAL_KEYBOARD_HANDLING)\n\
      \    public void testUniversalKeyboardCallbacks_ignoreKeyUpAndRepeats() {\n        ExtensionsToolbarCoordinator coordinator\
      \ = mock(ExtensionsToolbarCoordinator.class);\n        KeyboardTestChromeTabbedActivity activity = createKeyboardActivity(coordinator);\n\
      \        KeyEvent keyUp = new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_1);\n        KeyEvent repeated = new KeyEvent(0,\
