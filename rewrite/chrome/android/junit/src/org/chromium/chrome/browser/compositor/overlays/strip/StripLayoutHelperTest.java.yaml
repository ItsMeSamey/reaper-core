- description: Replace AI-only positive with actual normal media alert lifecycle using
    the same production helper
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ public\ void\ testOnAlertStateChanged_ActorAlert\(\)\ \{\

      \ \ \ \ \ \ \ \ //\ Initialize\ with\ 2\ tabs\.\

      \ \ \ \ \ \ \ \ initializeTest\(false,\ false,\ 0,\ 2\);\

      \ \ \ \ \ \ \ \ StripLayoutTab\[\]\ tabs\ =\ mStripLayoutHelper\.getStripLayoutTabsForTesting\(\);\

      \

      \ \ \ \ \ \ \ \ Tab\ tab0\ =\ mModel\.getTabAt\(0\);\

      \

      \ \ \ \ \ \ \ \ //\ Initially\ alert\ state\ should\ be\ NONE\.\

      \ \ \ \ \ \ \ \ assertEquals\("Initial\ alert\ state\ should\ be\ NONE\.",\
      TabAlert\.NONE,\ tabs\[0\]\.getAlertState\(\)\);\

      \

      \ \ \ \ \ \ \ \ //\ Update\ to\ ACTOR_WAITING_ON_USER\.\

      \ \ \ \ \ \ \ \ mStripLayoutHelper\.onAlertStateChanged\(tab0,\ TabAlert\.ACTOR_WAITING_ON_USER\);\

      \ \ \ \ \ \ \ \ assertEquals\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Alert\ state\ should\ be\ ACTOR_WAITING_ON_USER\.",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabAlert\.ACTOR_WAITING_ON_USER,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tabs\[0\]\.getAlertState\(\)\);\

      \

      \ \ \ \ \ \ \ \ //\ Update\ to\ NONE\.\

      \ \ \ \ \ \ \ \ mStripLayoutHelper\.onAlertStateChanged\(tab0,\ TabAlert\.NONE\);\

      \ \ \ \ \ \ \ \ assertEquals\("Alert\ state\ should\ be\ NONE\.",\ TabAlert\.NONE,\
      tabs\[0\]\.getAlertState\(\)\);\

      \ \ \ \ \}'
    replace: "    @Test\n    public void testOnAlertStateChanged_MediaAlert() {\n\
      \        // Initialize with 2 tabs.\n        initializeTest(false, false, 0,\
      \ 2);\n        StripLayoutTab[] tabs = mStripLayoutHelper.getStripLayoutTabsForTesting();\n\
      \n        Tab tab0 = mModel.getTabAt(0);\n\n        // Initially alert state\
      \ should be NONE.\n        assertEquals(\"Initial alert state should be NONE.\"\
      , TabAlert.NONE, tabs[0].getAlertState());\n\n        // Update to MEDIA_RECORDING.\n\
      \        mStripLayoutHelper.onAlertStateChanged(tab0, TabAlert.MEDIA_RECORDING);\n\
      \        assertEquals(\n                \"Alert state should be MEDIA_RECORDING.\"\
      ,\n                TabAlert.MEDIA_RECORDING,\n                tabs[0].getAlertState());\n\
      \n        // Update to NONE.\n        mStripLayoutHelper.onAlertStateChanged(tab0,\
      \ TabAlert.NONE);\n        assertEquals(\"Alert state should be NONE.\", TabAlert.NONE,\
      \ tabs[0].getAlertState());\n    }"
