# Reaper Android AI physical-purge core caller adapters.
- description: Remove exclusive AI regression
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ @EnableFeatures\(ChromeFeatureList\.GLIC\)\

      \ \ \ \ public\ void\ testTabUnderlineManagerObserver\(\)\ \{\

      \ \ \ \ \ \ \ \ initializeTest\(/\*\ rtl=\ \*/\ false,\ /\*\ incognito=\ \*/\
      false,\ /\*\ tabIndex=\ \*/\ 0\);\

      \ \ \ \ \ \ \ \ int\ tabId\ =\ mModel\.getTabAt\(0\)\.getId\(\);\

      \

      \ \ \ \ \ \ \ \ TabUnderlineManager\ manager\ =\ mStripLayoutHelper\.getTabUnderlineManagerForTesting\(\);\

      \ \ \ \ \ \ \ \ assertNotNull\("TabUnderlineManager\ should\ be\ initialized\
      when\ Glic\ is\ enabled",\ manager\);\

      \

      \ \ \ \ \ \ \ \ //\ Notify\ via\ the\ manager\ \(simulating\ native\ JNI\ callback\)\.\

      \ \ \ \ \ \ \ \ manager\.setUnderlineState\(tabId,\ /\*\ isUnderlined=\ \*/\
      true\);\

      \ \ \ \ \ \ \ \ assertTrue\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Tab\ should\ show\ underline\ indicator\ when\
      TabUnderlineManager\ notifies\ observer",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mStripLayoutHelper\.getStripLayoutTabsForTesting\(\)\[0\]\.isUnderlinedForTesting\(\)\);\

      \

      \ \ \ \ \ \ \ \ manager\.setUnderlineState\(tabId,\ /\*\ isUnderlined=\ \*/\
      false\);\

      \ \ \ \ \ \ \ \ assertFalse\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Tab\ should\ not\ show\ underline\ indicator\
      when\ TabUnderlineManager\ notifies"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \+\ "\ observer",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mStripLayoutHelper\.getStripLayoutTabsForTesting\(\)\[0\]\.isUnderlinedForTesting\(\)\);\

      \ \ \ \ \}'
    replace: ''
