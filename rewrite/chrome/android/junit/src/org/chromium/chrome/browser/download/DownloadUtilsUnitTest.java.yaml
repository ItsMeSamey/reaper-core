  regex:
    pattern: '    private static ResolveInfo createResolveInfo(String packageName, String className) {'
    replace: "    @Implements(value = DownloadUtils.class, isInAndroidSdk = false)\n    public static class ExtensionCollectionShadow {\n        static Activity activity;\n        static Tab tab;\n        static OtrProfileId otr;\n        static boolean result;\n        static boolean deny;\n\n        @Implementation\n        protected static boolean showDownloadManager(\n                Activity valueActivity, Tab valueTab, OtrProfileId valueOtr, int source) {\n            activity = valueActivity;\n            tab = valueTab;\n            otr = valueOtr;\n            assertEquals(DownloadOpenSource.UNKNOWN, source);\n            if (deny) throw new SecurityException(\"test rejection\");\n            return result;\n        }\n    }\n\n    @Test\n    public void testExtensionCollectionRejectsMissingOrClosingTab() {\n        assertFalse(DownloadManagerService.showDownloadsForExtension(null));\n        Tab tab = mock(Tab.class);\n        when(tab.isDestroyed()).thenReturn(true);\n       \
      \ assertFalse(DownloadManagerService.showDownloadsForExtension(tab));\n        when(tab.isDestroyed()).thenReturn(false);\n        when(tab.isClosing()).thenReturn(true);\n        assertFalse(DownloadManagerService.showDownloadsForExtension(tab));\n    }\n\n    @Test\n    public void testExtensionCollectionRejectsDetachedWindow() {\n        Tab tab = mock(Tab.class);\n        assertFalse(DownloadManagerService.showDownloadsForExtension(tab));\n        WindowAndroid window = mock(WindowAndroid.class);\n        when(tab.getWindowAndroid()).thenReturn(window);\n        when(window.getActivity()).thenReturn(new WeakReference<>(null));\n        assertFalse(DownloadManagerService.showDownloadsForExtension(tab));\n    }\n\n    @Test\n    @Config(shadows = ExtensionCollectionShadow.class)\n    public void testExtensionCollectionForwardsProfileAndReportsUiFailure() {\n        Tab tab = mock(Tab.class);\n        WindowAndroid window = mock(WindowAndroid.class);\n        Activity activity = mock(Activity.class);\n\
      \        Profile profile = mock(Profile.class);\n        OtrProfileId otr = OtrProfileId.getPrimaryOtrProfileId();\n        when(tab.getWindowAndroid()).thenReturn(window);\n        when(window.getActivity()).thenReturn(new WeakReference<>(activity));\n        when(tab.getProfile()).thenReturn(profile);\n        when(profile.getOtrProfileId()).thenReturn(otr);\n        ExtensionCollectionShadow.result = true;\n        ExtensionCollectionShadow.deny = false;\n        assertTrue(DownloadManagerService.showDownloadsForExtension(tab));\n        assertEquals(activity, ExtensionCollectionShadow.activity);\n        assertEquals(tab, ExtensionCollectionShadow.tab);\n        assertEquals(otr, ExtensionCollectionShadow.otr);\n        when(profile.getOtrProfileId()).thenReturn(null);\n        assertTrue(DownloadManagerService.showDownloadsForExtension(tab));\n        assertEquals(null, ExtensionCollectionShadow.otr);\n        ExtensionCollectionShadow.result = false;\n        assertFalse(DownloadManagerService.showDownloadsForExtension(tab));\n\
      \        ExtensionCollectionShadow.deny = true;\n        assertFalse(DownloadManagerService.showDownloadsForExtension(tab));\n        ExtensionCollectionShadow.deny = false;\n        ExtensionCollectionShadow.result = true;\n        when(profile.shutdownStarted()).thenReturn(true);\n        assertFalse(DownloadManagerService.showDownloadsForExtension(tab));\n        when(profile.shutdownStarted()).thenReturn(false);\n        when(activity.isFinishing()).thenReturn(true);\n        assertFalse(DownloadManagerService.showDownloadsForExtension(tab));\n        when(activity.isFinishing()).thenReturn(false);\n        when(activity.isDestroyed()).thenReturn(true);\n        assertFalse(DownloadManagerService.showDownloadsForExtension(tab));\n    }\n\n    private static ResolveInfo createResolveInfo(String packageName, String className) {"
