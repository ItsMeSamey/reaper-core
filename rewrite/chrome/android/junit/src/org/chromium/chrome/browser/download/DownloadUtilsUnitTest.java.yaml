    replace: "        protected static DownloadActivityLauncher getInstance() {\n            return launcher;\n        }\n    }\n\n    /** Real Activity and dialog controller; only presentation is captured by a mock manager. */\n    public static class PdfDialogHost extends Activity implements ModalDialogManagerHolder {\n        final ModalDialogManager manager = mock(ModalDialogManager.class);\n\n        @Override\n        public ModalDialogManager getModalDialogManager() {\n            return manager;\n        }\n    }\n\n    private List<Callback<Activity>> holdPdfDialogActivityCallbacks() {\n        Intent intent = new Intent(Intent.ACTION_VIEW);\n        intent.setDataAndType(Uri.parse(\"file:///empty.pdf\"), \"application/pdf\");\n        // Two handlers select the generic dialog title without resolving an application label.\n        registerIntentHandler(intent, EXTERNAL_APP_PACKAGE, EXTERNAL_APP_CLASS);\n        registerIntentHandler(intent, \"other.pdf.viewer\", \"other.pdf.viewer.Activity\");\n        RevealLauncherShadow.launcher = mock(DownloadActivityLauncher.class);\n        List<Callback<Activity>> callbacks = new ArrayList<>();\n        doAnswer(invocation -> {\n                    callbacks.add(invocation.getArgument(0));\n                    return null;\n                })\n                .when(RevealLauncherShadow.launcher)\n                .getActivityForOpenDialog(any());\n        return callbacks;\n    }\n\n    private static PropertyModel capturePdfDialog(PdfDialogHost host) {\n        ArgumentCaptor<PropertyModel> model = ArgumentCaptor.forClass(PropertyModel.class);\n        verify(host.manager).showDialog(model.capture(), eq(ModalDialogManager.ModalDialogType.TAB));\n        return model.getValue();\n    }\n\n    @Test\n    @Config(shadows = RevealLauncherShadow.class)\n    public void testPdfDialogDelayedHostAfterNativeDestroyDoesNothing() {\n        List<Callback<Activity>> callbacks = holdPdfDialogActivityCallbacks();\n        PrefServ