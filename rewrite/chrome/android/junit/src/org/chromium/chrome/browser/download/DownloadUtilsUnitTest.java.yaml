- description: Android Downloads exact-item reveal integration (3).
  regex:
    re_pattern: '\ \ \ \ public\ void\ tearDown\(\)\ \{\

      \ \ \ \ \ \ \ \ DownloadUtils\.resetLastOpenFileForTesting\(\);\

      \ \ \ \ \ \ \ \ DownloadManagerService\.setDownloadManagerService\(mOriginalDownloadManagerService\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Implements\(value\ =\ DownloadUtils\.class,\ isInAndroidSdk\ =\ false\)\

      '
    replace: "    public void tearDown() {\n        DownloadUtils.resetLastOpenFileForTesting();\n        DownloadManagerService.setDownloadManagerService(mOriginalDownloadManagerService);\n        RevealLauncherShadow.launcher = null;\n    }\n\n    /** Only the Activity launch boundary is replaced; the service host checks run unchanged. */\n    @Implements(value = DownloadActivityLauncher.class, isInAndroidSdk = false)\n    public static class RevealLauncherShadow {\n        static DownloadActivityLauncher launcher;\n\n        @Implementation\n        protected static DownloadActivityLauncher getInstance() {\n            return launcher;\n        }\n    }\n\n    private static class RevealHost implements AutoCloseable {\n        final ActivityController<Activity> controller;\n        final Activity activity;\n        final Tab tab = mock(Tab.class);\n        final Profile profile = mock(Profile.class);\n        final WindowAndroid window = mock(WindowAndroid.class);\n\n        RevealHost() {\n            if (!ApplicationStatus.isInitialized()) {\n                ApplicationStatus.initialize(RuntimeEnvironment.getApplication());\n            }\n            controller = Robolectric.buildActivity(Activity.class).setup();\n            activity = controller.get();\n            when(tab.isInitialized()).thenReturn(true);\n            when(tab.getProfile()).thenReturn(profile);\n            when(tab.getWindowAndroid()).thenReturn(window);\n            when(window.getActivity()).thenReturn(new WeakReference<>(activity));\n            when(profile.isNativeInitialized()).thenReturn(true);\n            when(profile.getOriginalProfile()).thenReturn(profile);\n            assertEquals(ActivityState.RESUMED, ApplicationStatus.getStateForActivity(activity));\n        }\n\n        @Override\n        public void close() {\n            controller.pause().stop().destroy();\n        }\n    }\n\n    @Test\n    public void testExtensionRevealRequiresResumedAttachedTab() {\n        try (RevealHost host = new RevealHost()) {\n            assertTrue(DownloadManagerService.canShowDownloadItemForExtension(\n                    host.tab, host.profile));\n            ApplicationStatus.onStateChangeForTesting(host.activity, ActivityState.PAUSED);\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(\n                    host.tab, host.profile));\n            ApplicationStatus.onStateChangeForTesting(host.activity, ActivityState.RESUMED);\n            when(host.tab.isHidden()).thenReturn(true);\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(\n                    host.tab, host.profile));\n            when(host.tab.isHidden()).thenReturn(false);\n            when(host.tab.isClosing()).thenReturn(true);\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(\n                    host.tab, host.profile));\n            when(host.tab.isClosing()).thenReturn(false);\n            when(host.tab.isDestroyed()).thenReturn(true);\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(\n                    host.tab, host.profile));\n            when(host.tab.isDestroyed()).thenReturn(false);\n            when(host.tab.getWindowAndroid()).thenReturn(null);\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(\n                    host.tab, host.profile));\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(null, host.profile));\n        }\n    }\n\n    @Test\n    public void testExtensionRevealDoesNotBorrowAnotherForegroundActivity() {\n        try (RevealHost host = new RevealHost(); RevealHost other = new RevealHost()) {\n            ApplicationStatus.onStateChangeForTesting(host.activity, ActivityState.PAUSED);\n            assertEquals(ActivityState.RESUMED, ApplicationStatus.getStateForActivity(other.activity));\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(\n                    host.tab, host.profile));\n            // A different foreground host cannot borrow the selected item's original profile.\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(\n                    other.tab, host.profile));\n            assertTrue(DownloadManagerService.canShowDownloadItemForExtension(\n                    other.tab, other.profile));\n        }\n    }\n\n    @Test\n    public void testExtensionRevealRejectsProfileShutdownAndMissingNativeProfile() {\n        try (RevealHost host = new RevealHost()) {\n            when(host.profile.shutdownStarted()).thenReturn(true);\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(\n                    host.tab, host.profile));\n            when(host.profile.shutdownStarted()).thenReturn(false);\n            when(host.profile.isNativeInitialized()).thenReturn(false);\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(\n                    host.tab, host.profile));\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(host.tab, null));\n        }\n    }\n\n    @Test\n    public void testExtensionRevealRequiresExactExistingPrimaryOtr() {\n        try (RevealHost host = new RevealHost()) {\n            Profile otr = mock(Profile.class);\n            OtrProfileId id = OtrProfileId.getPrimaryOtrProfileId();\n            when(otr.isNativeInitialized()).thenReturn(true);\n            when(otr.isOffTheRecord()).thenReturn(true);\n            when(otr.isPrimaryOtrProfile()).thenReturn(true);\n            when(otr.getOriginalProfile()).thenReturn(host.profile);\n            when(otr.getOtrProfileId()).thenReturn(id);\n            when(host.profile.getOffTheRecordProfile(id, false)).thenReturn(otr);\n            assertTrue(DownloadManagerService.canShowDownloadItemForExtension(host.tab, otr));\n            verify(host.profile).getOffTheRecordProfile(id, false);\n            when(host.profile.getOffTheRecordProfile(id, false)).thenReturn(mock(Profile.class));\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(host.tab, otr));\n            when(host.profile.getOffTheRecordProfile(id, false)).thenReturn(null);\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(host.tab, otr));\n            when(host.profile.getOffTheRecordProfile(id, false)).thenReturn(otr);\n            when(otr.isPrimaryOtrProfile()).thenReturn(false);\n            assertFalse(DownloadManagerService.canShowDownloadItemForExtension(host.tab, otr));\n        }\n    }\n\n    @Test\n    @Config(shadows = RevealLauncherShadow.class)\n    public void testExtensionRevealForwardsExactIdentityAndCompletion() {\n        try (RevealHost host = new RevealHost()) {\n            RevealLauncherShadow.launcher = mock(DownloadActivityLauncher.class);\n            List<Boolean> results = new ArrayList<>();\n            ContentId id = new ContentId(\"LEGACY_DOWNLOAD\", TEST_GUID);\n            when(RevealLauncherShadow.launcher.showDownloadItem(\n                    eq(host.activity), eq(host.profile), eq(id), any()))\n                    .thenAnswer(invocation -> {\n                        Callback<Boolean> completion = invocation.getArgument(3);\n                        completion.onResult(true);\n                        return 41L;\n                    });\n            assertEquals(41L, DownloadManagerService.showDownloadItemForExtension(\n                    host.tab, host.profile, id.namespace, id.id, results::add));\n            assertEquals(List.of(true), results);\n            verify(RevealLauncherShadow.launcher).showDownloadItem(\n                    eq(host.activity), eq(host.profile), eq(id), any());\n            DownloadManagerService.cancelDownloadItemForExtension(41L);\n            verify(RevealLauncherShadow.launcher).cancelDownloadItem(41L);\n        }\n    }\n\n    @Test\n    @Config(shadows = RevealLauncherShadow.class)\n    public void testExtensionRevealInvalidIdentityFailsSynchronouslyOnce() {\n        try (RevealHost host = new RevealHost()) {\n            RevealLauncherShadow.launcher = mock(DownloadActivityLauncher.class);\n            List<Boolean> results = new ArrayList<>();\n            assertEquals(0L, DownloadManagerService.showDownloadItemForExtension(\n                    host.tab, host.profile, \"LEGACY_DOWNLOAD\", \"\", results::add));\n            assertEquals(List.of(false), results);\n            verifyNoInteractions(RevealLauncherShadow.launcher);\n        }\n    }\n\n    @Test\n    @Config(shadows = RevealLauncherShadow.class)\n    public void testExtensionRevealMissingHostFailsSynchronouslyOnce() {\n        RevealLauncherShadow.launcher = mock(DownloadActivityLauncher.class);\n        List<Boolean> results = new ArrayList<>();\n        assertEquals(0L, DownloadManagerService.showDownloadItemForExtension(\n                null, null, \"LEGACY_DOWNLOAD\", TEST_GUID, results::add));\n        assertEquals(List.of(false), results);\n        DownloadManagerService.cancelDownloadItemForExtension(0L);\n        verifyNoInteractions(RevealLauncherShadow.launcher);\n    }\n\n    @Implements(value = DownloadUtils.class, isInAndroidSdk = false)\n"
