# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: remove now-unused Lens-only argument matchers"
  regex:
    re_pattern: "import\\ static\\ org\\.mockito\\.ArgumentMatchers\\.any;\\\nimport\\ static\\ org\\.mockito\\.ArgumentMatchers\\.eq;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: import standard no-side-effect assertion"
  regex:
    re_pattern: "import\\ static\\ org\\.mockito\\.Mockito\\.verify;\\\n"
    replace: "import static org.mockito.Mockito.verify;\nimport static org.mockito.Mockito.verifyNoMoreInteractions;\n"
  count: 1
- description: "Lens extra: replace typed implementation imports with retained enum API"
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensController;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensIntentParams;\\\n"
    replace: "import org.chromium.chrome.browser.lens.LensEntryPoint;\n"
  count: 1
- description: "Lens extra: remove implementation mock"
  regex:
    re_pattern: "\\ \\ \\ \\ @Mock\\ private\\ LensController\\ mLensController;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove implementation singleton setup"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ LensController\\.setInstanceForTesting\\(mLensController\\);\\\n"
    replace: ""
  count: 1
- description: "Lens extra: assert unavailable API and inert callback with no metric/focus/window side effects"
  regex:
    re_pattern: "\\ \\ \\ \\ @Test\\\n\\ \\ \\ \\ public\\ void\\ testOnLensClick\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ UserActionTester\\ userActionTester\\ =\\ new\\ UserActionTester\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ OnClickListener\\ listener\\ =\\ mPropertyModel\\.get\\(SearchBoxProperties\\.LENS_CLICK_CALLBACK\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertNotNull\\(listener\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ listener\\.onClick\\(mView\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ verify\\(mLensController\\)\\.startLens\\(eq\\(mWindowAndroid\\),\\ any\\(LensIntentParams\\.class\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertTrue\\(userActionTester\\.getActions\\(\\)\\.contains\\(\"NewTabPage\\.SearchBox\\.Lens\"\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ userActionTester\\.tearDown\\(\\);\\\n\\ \\ \\ \\ \\}"
    replace: "    @Test\n    public void testOnLensClick() {\n        assertFalse(mMediator.isLensEnabled(LensEntryPoint.NEW_TAB_PAGE, false, false));\n        assertFalse(mMediator.isLensEnabled(LensEntryPoint.NEW_TAB_PAGE, true, true));\n\n        UserActionTester userActionTester = new UserActionTester();\n        OnClickListener listener = mPropertyModel.get(SearchBoxProperties.LENS_CLICK_CALLBACK);\n        assertNotNull(listener);\n        listener.onClick(mView);\n        verifyNoMoreInteractions(mNewTabPageManager, mWindowAndroid);\n        assertFalse(userActionTester.getActions().contains(\"NewTabPage.SearchBox.Lens\"));\n        userActionTester.tearDown();\n    }"
  count: 1
