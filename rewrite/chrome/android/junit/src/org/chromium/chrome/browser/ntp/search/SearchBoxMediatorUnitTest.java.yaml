- description: Use the neutral NTP scroll contract in search-box geometry tests
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.feed\.FeedSurfaceScrollDelegate;\

      '
    replace: 'import org.chromium.chrome.browser.ntp.NtpScrollDelegate;

      '
- description: Keep search-box geometry assertions on the neutral NTP delegate
  regex:
    re_pattern: '@Mock\ private\ FeedSurfaceScrollDelegate\ mScrollDelegate;'
    replace: '@Mock private NtpScrollDelegate mScrollDelegate;'
