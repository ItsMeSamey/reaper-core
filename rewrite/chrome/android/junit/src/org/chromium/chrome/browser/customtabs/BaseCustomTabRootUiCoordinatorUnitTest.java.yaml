# Lens test companions; preserve ordinary test classes and assertions.
- description: "Lens test companion: use existing Chrome menu ID namespace"
  regex:
    re_pattern: "import\\ org\\.chromium\\.base\\.test\\.util\\.HistogramWatcher;\\\n"
    replace: "import org.chromium.base.test.util.HistogramWatcher;\nimport org.chromium.chrome.R;\n"
  count: 1
- description: "Lens test companion: test inherited RootUI dispatcher declines obsolete menu and keyboard action"
  regex:
    re_pattern: "\\ \\ \\ \\ \\}\\\n\\}\\\n"
    replace: "    }\n\n    @Test\n    public void testLensOverlayMenuActionIsUnhandled() {\n        assertFalse(\n                mBaseCustomTabRootUiCoordinator.handleMenuOrKeyboardAction(\n                        R.id.lens_overlay_menu_id, /* fromMenu= */ true));\n        assertFalse(\n                mBaseCustomTabRootUiCoordinator.handleMenuOrKeyboardAction(\n                        R.id.lens_overlay_menu_id, /* fromMenu= */ false));\n    }\n}\n"
  count: 1
