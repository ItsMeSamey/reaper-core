substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ IdentityServicesProvider\.setInstanceForTests\(mIdentityServicesProvider\);\

      \ \ \ \ \ \ \ \ when\(mIdentityServicesProvider\.getIdentityManager\(any\(\)\)\)\.thenReturn\(mIdentityManager\);\

      \ \ \ \ \ \ \ \ when\(mFullscreenManager\.getPersistentFullscreenModeSupplier\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.thenReturn\(ObservableSuppliers\.alwaysFalse\(\)\);\

      \

      \ \ \ \ \ \ \ \ mProfileSupplier\ =\ ObservableSuppliers\.createMonotonic\(\);\

      \ \ \ \ \ \ \ \ mSnackbarManagerSupplier\.set\(mSnackbarManager\);\

      \

      '
    replace: "        IdentityServicesProvider.setInstanceForTests(mIdentityServicesProvider);\n        when(mIdentityServicesProvider.getIdentityManager(any())).thenReturn(mIdentityManager);\n\
      \        when(mFullscreenManager.getPersistentFullscreenModeSupplier())\n                .thenReturn(ObservableSuppliers.alwaysFalse());\n\
      \        when(mFullscreenManager.getBrowserFullscreenModeSupplier())\n                .thenReturn(ObservableSuppliers.alwaysFalse());\n\
      \        when(mFullscreenManager.getFullscreenUiModeSupplier())\n                .thenReturn(ObservableSuppliers.alwaysFalse());\n\
      \        when(mFullscreenManager.getBrowserFullscreenExtensionInfoSupplier())\n                .thenReturn(\n      \
      \                  ObservableSuppliers.createNonNull(\n                                new FullscreenManager.BrowserFullscreenExtensionInfo(\"\
      \", \"\")));\n        when(mBrowserControlsManager.getFullscreenManager()).thenReturn(mFullscreenManager);\n\n     \
      \   mProfileSupplier = ObservableSuppliers.createMonotonic();\n        mSnackbarManagerSupplier.set(mSnackbarManager);\n\
      \n"
