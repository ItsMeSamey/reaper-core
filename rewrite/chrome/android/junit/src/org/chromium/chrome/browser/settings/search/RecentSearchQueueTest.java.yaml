substitutions:
  - description: Refresh app-owned settings search labels from the current available index without rewriting user history.
    regex:
      re_pattern: "\\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ private\\ static\\ SettingsIndexData\\.Entry\\ createEntry\\(String\\ key\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ return\\ new\\ SettingsIndexData\\.Entry\\.Builder\\(\"id_\"\\ \\+\\ key,\\ key,\\ \"Title\\ \"\\ \\+\\ key,\\ \"Parent\"\\)\\\n"
      replace: "    }\n\n    @Test\n    public void testDisplayRefreshesRestoredLabelsWithoutRewritingHistory() {\n        var old = displayEntry(\"about\", \"About Brave\", \"Brave information\", \"Brave privacy\");\n        mQueue.add(old);\n        mQueue.flushIfDirty();\n        String persisted = mPreferences.readString(PREF_KEY, \"\");\n        mQueue.persistToDiskAndReset();\n        mQueue = RecentSearchQueue.getInstance();\n        mQueue.restoreFromDisk();\n\n        var index = new SettingsIndexData();\n        var current = displayEntry(\"about\", \"About Reaper\", \"Reaper information\", \"Reaper privacy\");\n        index.addEntry(current.id, current);\n        var displayed = mQueue.getEntriesForDisplay(index);\n\n        assertEquals(1, displayed.size());\n        assertEquals(\"About Reaper\", displayed.get(0).title);\n        assertEquals(\"Reaper information\", displayed.get(0).summary);\n        assertEquals(\"Reaper privacy\", displayed.get(0).header);\n        assertEquals(\"About Brave\", assumeNonNull(mQueue.get(\"about\")).title);\n        assertEquals(persisted, mPreferences.readString(PREF_KEY, \"\"));\n        mQueue.flushIfDirty();\n        assertEquals(persisted, mPreferences.readString(PREF_KEY, \"\"));\n    }\n\n    @Test\n    public void testDisplayRefreshPreservesOrderAndSelectionArguments() {\n        Bundle arguments = new Bundle();\n        arguments.putString(\"user_selection\", \"retain exactly\");\n        var first =\n                new SettingsIndexData.Entry.Builder(displayEntry(\"one\", \"Old one\", null, null))\n                        .setArguments(arguments)\n                        .setFragment(\"OriginalTarget\")\n                        .setHighlightKey(\"original_highlight\")\n                        .setSubViewPos(7)\n                        .build();\n        var second = displayEntry(\"two\", \"Old two\", null, null);\n        mQueue.add(first);\n        mQueue.add(second);\n        var index = new SettingsIndexData();\n        var freshSecond = displayEntry(\"two\", \"New two\", null, null);\n        var freshFirst =\n                new SettingsIndexData.Entry.Builder(displayEntry(\"one\", \"New one\", null, null))\n                        .setFragment(\"UnrelatedCurrentArguments\")\n                        .build();\n        index.addEntry(freshSecond.id, freshSecond);\n        index.addEntry(freshFirst.id, freshFirst);\n\n        var displayed = mQueue.getEntriesForDisplay(index);\n\n        assertEquals(\"one\", displayed.get(0).key);\n        assertEquals(\"two\", displayed.get(1).key);\n        assertEquals(first.id, displayed.get(0).id);\n        assertEquals(first.parentFragment, displayed.get(0).parentFragment);\n        assertEquals(\"OriginalTarget\", displayed.get(0).fragment);\n        assertEquals(\"original_highlight\", displayed.get(0).highlightKey);\n        assertEquals(7, displayed.get(0).subViewPos);\n        assertSame(arguments, displayed.get(0).extras);\n        assertSame(first, mQueue.get(\"one\"));\n    }\n\n    @Test\n    public void testDisplayFiltersUnavailableEntriesWithoutDeletingHistory() {\n        var missing = displayEntry(\"missing\", \"Missing\", null, null);\n        var hidden = displayEntry(\"hidden\", \"Hidden\", null, null);\n        var visible = displayEntry(\"visible\", \"Visible\", null, null);\n        mQueue.add(missing);\n        mQueue.add(hidden);\n        mQueue.add(visible);\n        mQueue.flushIfDirty();\n        String persisted = mPreferences.readString(PREF_KEY, \"\");\n        var index = new SettingsIndexData();\n        index.addEntry(\n                hidden.id,\n                new SettingsIndexData.Entry.Builder(hidden).setIsSearchable(false).build());\n        index.addEntry(visible.id, visible);\n\n        var displayed = mQueue.getEntriesForDisplay(index);\n\n        assertEquals(1, displayed.size());\n        assertEquals(\"visible\", displayed.get(0).key);\n        assertEquals(3, mQueue.size());\n        mQueue.flushIfDirty();\n        assertEquals(persisted, mPreferences.readString(PREF_KEY, \"\"));\n    }\n\n    @Test\n    public void testDisplayUsesCurrentLabelsAgainAfterIndexRebuild() {\n        var stored = displayEntry(\"about\", \"About Brave\", \"Old summary\", \"Old group\");\n        mQueue.add(stored);\n        var index = new SettingsIndexData();\n        var first = displayEntry(\"about\", \"About Reaper\", \"New summary\", \"New group\");\n        index.addEntry(first.id, first);\n        assertEquals(\"About Reaper\", mQueue.getEntriesForDisplay(index).get(0).title);\n        index.clear();\n        var next = displayEntry(\"about\", \"Reaper info\", null, \"Current group\");\n        index.addEntry(next.id, next);\n\n        var displayed = mQueue.getEntriesForDisplay(index).get(0);\n\n        assertEquals(\"Reaper info\", displayed.title);\n        assertNull(displayed.summary);\n        assertEquals(\"Current group\", displayed.header);\n        assertSame(stored, mQueue.get(\"about\"));\n    }\n\n    @Test\n    public void testDisplayRefreshesParcelableResultHeaderAndLabels() {\n        var old = displayEntry(\"about\", \"About Brave\", \"Brave information\", \"Brave privacy\");\n        Parcel parcel = Parcel.obtain();\n        try {\n            old.writeToParcel(parcel, 0);\n            parcel.setDataPosition(0);\n            var restored = SettingsIndexData.Entry.CREATOR.createFromParcel(parcel);\n            var index = new SettingsIndexData();\n            var current = displayEntry(\"about\", \"About Reaper\", \"Reaper information\", \"Reaper privacy\");\n            index.addEntry(current.id, current);\n\n            var displayed = RecentSearchQueue.resolveEntriesForDisplay(Arrays.asList(restored), index);\n\n            assertEquals(\"About Reaper\", displayed.get(0).title);\n            assertEquals(\"Reaper information\", displayed.get(0).summary);\n            assertEquals(\"Reaper privacy\", displayed.get(0).header);\n            assertEquals(\"About Brave\", restored.title);\n            assertEquals(\"Brave privacy\", restored.header);\n        } finally {\n            parcel.recycle();\n        }\n    }\n\n    @Test\n    public void testDisplayDoesNotReplaceLegalOrUserTextByBrandToken() {\n        var stored = displayEntry(\"legal\", \"Brave licenses\", \"User text: Brave\", \"Legal\");\n        mQueue.add(stored);\n        var index = new SettingsIndexData();\n        index.addEntry(stored.id, stored);\n\n        var displayed = mQueue.getEntriesForDisplay(index).get(0);\n\n        assertEquals(\"Brave licenses\", displayed.title);\n        assertEquals(\"User text: Brave\", displayed.summary);\n        assertEquals(\"Legal\", displayed.header);\n    }\n\n    private static SettingsIndexData.Entry displayEntry(\n            String key, String title, @Nullable String summary,\n            @Nullable String header) {\n        return new SettingsIndexData.Entry.Builder(\n                        PreferenceParser.createUniqueId(\"Parent\", key), key, title, \"Parent\")\n                .setSummary(summary)\n                .setHeader(header)\n                .build();\n    }\n\n    private static SettingsIndexData.Entry createEntry(String key) {\n        return new SettingsIndexData.Entry.Builder(\"id_\" + key, key, \"Title \" + key, \"Parent\")\n"
