substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove actual excluded AI product test dependency; keep this mixed
    core reading fixture compiled
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController;\

      '
    replace: ''
- description: Remove actual excluded AI product test dependency; keep this mixed
    core reading fixture compiled
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.glic\.GlicEnabling;\

      '
    replace: ''
- description: Remove excluded Actor mock from retained reading fixture
  regex:
    re_pattern: '\ \ \ \ @Mock\ private\ ActorUiTabController\ mActorUiTabController;\

      '
    replace: ''
- description: Remove AI-only common fixture configuration
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ GlicEnabling\.setEnabledForTesting\(false\);\

      '
    replace: ''
- description: Remove class-level configuration of physically excluded AI feature
  regex:
    re_pattern: '@DisableFeatures\(ChromeFeatureList\.GLIC\)\

      '
    replace: ''
- description: Replace the historical AI-confirmation positive with actual direct
    distillation behavior; preserve its original successful distillation assertion
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ @Feature\("ReaderMode"\)\

      \ \ \ \ @EnableFeatures\(ChromeFeatureList\.GLIC\)\

      \ \ \ \ public\ void\ testActivateReaderMode_WithActiveTask_Confirm\(\)\ \{\

      \ \ \ \ \ \ \ \ GlicEnabling\.setEnabledForTesting\(true\);\

      \ \ \ \ \ \ \ \ mUserDataHost\.setUserData\(ActorUiTabController\.class,\ mActorUiTabController\);\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.isActorActive\(\)\)\.thenReturn\(true\);\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.showTaskAbortConfirmationDialog\(any\(\)\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.thenAnswer\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ invocation\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Callback<Boolean>\ callback\
      =\ invocation\.getArgument\(0\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ callback\.onResult\(true\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \

      \ \ \ \ \ \ \ \ mManager\.activateReaderMode\(EntryPoint\.APP_MENU\);\

      \

      \ \ \ \ \ \ \ \ verify\(mActorUiTabController\)\.showTaskAbortConfirmationDialog\(any\(\)\);\

      \ \ \ \ \ \ \ \ verify\(mDistillerTabUtilsJniMock\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.distillCurrentPageAndViewIfSuccessful\(eq\(mWebContents\),\
      any\(\)\);\

      \ \ \ \ \}\

      \

      '
    replace: "    @Test\n    @Feature(\"ReaderMode\")\n    public void testActivateReaderMode_StartsWithoutTaskConfirmation()\
      \ {\n        mManager.activateReaderMode(EntryPoint.APP_MENU);\n\n        verify(mDistillerTabUtilsJniMock)\n\
      \                .distillCurrentPageAndViewIfSuccessful(eq(mWebContents), any());\n\
      \    }\n\n"
- description: Remove the dedicated Actor abort-dialog cancellation assertion because
    the actual service/dialog is physically excluded; all ordinary reader assertions
    remain
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ @Feature\("ReaderMode"\)\

      \ \ \ \ @EnableFeatures\(ChromeFeatureList\.GLIC\)\

      \ \ \ \ public\ void\ testActivateReaderMode_WithActiveTask_Cancel\(\)\ \{\

      \ \ \ \ \ \ \ \ GlicEnabling\.setEnabledForTesting\(true\);\

      \ \ \ \ \ \ \ \ mUserDataHost\.setUserData\(ActorUiTabController\.class,\ mActorUiTabController\);\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.isActorActive\(\)\)\.thenReturn\(true\);\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.showTaskAbortConfirmationDialog\(any\(\)\)\)\.thenReturn\(true\);\

      \

      \ \ \ \ \ \ \ \ mManager\.activateReaderMode\(EntryPoint\.APP_MENU\);\

      \

      \ \ \ \ \ \ \ \ verify\(mActorUiTabController\)\.showTaskAbortConfirmationDialog\(any\(\)\);\

      \ \ \ \ \ \ \ \ verify\(mDistillerTabUtilsJniMock,\ never\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.distillCurrentPageAndViewIfSuccessful\(any\(\),\
      any\(\)\);\

      \ \ \ \ \}\

      \

      '
    replace: ''
