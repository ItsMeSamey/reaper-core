# Reaper Android removes Discover-only feedback payload.
substitutions:
- description: Keep feedback-policy coverage on the retained screenshot/context overload.
  regex:
    re_pattern: testShowFeedbackFeed_FeedbackDisallowed
    replace: testShowFeedbackWithScreenshot_FeedbackDisallowed
- description: Use the retained ordinary screenshot/context feedback overload after
    Feed removal.
  regex:
    re_pattern: launcher\.showFeedback\(mActivity,\ "url",\ "category",\ null\);
    replace: launcher.showFeedback(mActivity, "url", "category", ScreenshotMode.DEFAULT,
      null);
- description: Remove Android diagnostic collection and uploading while retaining Help and shared screenshots
  regex:
    pattern: "// Copyright 2026 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\npackage org.chromium.chrome.browser.feedback;\n\nimport static org.mockito.ArgumentMatchers.any;\nimport static org.mockito.Mockito.never;\nimport static org.mockito.Mockito.verify;\nimport static org.mockito.Mockito.when;\n\nimport android.app.Activity;\n\nimport org.junit.After;\nimport org.junit.Assert;\nimport org.junit.Before;\nimport org.junit.Rule;\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\nimport org.mockito.Mock;\nimport org.mockito.junit.MockitoJUnit;\nimport org.mockito.junit.MockitoRule;\n\nimport org.chromium.base.FeatureOverrides;\nimport org.chromium.base.ServiceLoaderUtil;\nimport org.chromium.base.test.BaseRobolectricTestRunner;\nimport org.chromium.chrome.R;\nimport org.chromium.chrome.browser.profiles.Profile;\n\n/** Tests for {@link HelpAndFeedbackLauncher}. */\n@RunWith(BaseRobolectricTestRunner.class)\npublic class HelpAndFeedbackLauncherTest {\n    @Rule public final MockitoRule mMockitoRule = MockitoJUnit.rule();\n\n    @Mock private FeedbackPolicyManager mFeedbackPolicyManager;\n    @Mock private HelpAndFeedbackLauncherDelegate mDelegate;\n    @Mock private Profile mProfile;\n    @Mock private Activity mActivity;\n\n    @Before\n    public void setUp() {\n        FeedbackPolicyManager.setInstanceForTesting(mFeedbackPolicyManager);\n        ServiceLoaderUtil.setInstanceForTesting(HelpAndFeedbackLauncherDelegate.class, mDelegate);\n    }\n\n    @After\n    public void tearDown() {\n        FeatureOverrides.removeAllIncludingAnnotations();\n    }\n\n    @Test\n    public void testGetHelpMenuStringRes_FeedbackAllowed() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(true);\n        Assert.assertEquals(R.string.menu_help, HelpAndFeedbackLauncher.getHelpMenuStringRes());\n    }\n\n    @Test\n    public void testGetHelpMenuStringRes_FeedbackDisallowed() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(false);\n        Assert.assertEquals(\n                R.string.menu_help_no_feedback, HelpAndFeedbackLauncher.getHelpMenuStringRes());\n    }\n\n    @Test\n    public void testShowFeedback_FeedbackDisallowed() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(false);\n        HelpAndFeedbackLauncher launcher = HelpAndFeedbackLauncherImpl.getForProfile(mProfile);\n\n        launcher.showFeedback(mActivity, \"url\", \"category\");\n\n        verify(mDelegate, never()).showFeedback(any(), any());\n    }\n\n    @Test\n    public void testShowFeedbackWithScreenshot_FeedbackDisallowed() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(false);\n        HelpAndFeedbackLauncher launcher = HelpAndFeedbackLauncherImpl.getForProfile(mProfile);\n\n        launcher.showFeedback(mActivity, \"url\", \"category\", ScreenshotMode.DEFAULT, null);\n\n        verify(mDelegate, never()).showFeedback(any(), any());\n    }\n}\n"
    replace: "// Copyright 2026 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\npackage org.chromium.chrome.browser.feedback;\n\nimport static org.mockito.Mockito.clearInvocations;\nimport static org.mockito.Mockito.doThrow;\nimport static org.mockito.Mockito.mock;\nimport static org.mockito.Mockito.never;\nimport static org.mockito.Mockito.verify;\nimport static org.mockito.Mockito.when;\n\nimport android.app.Activity;\nimport android.content.Intent;\nimport android.provider.Browser;\n\nimport org.junit.After;\nimport org.junit.Assert;\nimport org.junit.Before;\nimport org.junit.Rule;\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\nimport org.mockito.ArgumentCaptor;\nimport org.mockito.Mock;\nimport org.mockito.junit.MockitoJUnit;\nimport org.mockito.junit.MockitoRule;\n\nimport org.chromium.base.ContextUtils;\nimport org.chromium.base.FeatureOverrides;\nimport org.chromium.base.test.BaseRobolectricTestRunner;\nimport org.chromium.base.test.RobolectricUtil;\nimport org.chromium.chrome.R;\nimport org.chromium.chrome.browser.profiles.Profile;\n\n/** Tests for the Android help-only factory and its ordinary support navigation. */\n@RunWith(BaseRobolectricTestRunner.class)\npublic class HelpAndFeedbackLauncherTest {\n    private static final String SUPPORT_URL = \"https://community.brave.app/\";\n    private static final String SAFE_BROWSING_URL =\n            \"https://support.brave.app/hc/articles/15222663599629-Safe-Browsing-in-Brave\";\n    private static final String PRIVATE_URL = \"https://example.invalid/private-context\";\n    private static final String SCREENSHOT_TRIPWIRE = \"Help must not capture the Activity window\";\n\n    @Rule public final MockitoRule mMockitoRule = MockitoJUnit.rule();\n\n    @Mock private FeedbackPolicyManager mFeedbackPolicyManager;\n    @Mock private Profile mProfile;\n    @Mock private Activity mActivity;\n\n    @Before\n    public void setUp() {\n        FeedbackPolicyManager.setInstanceForTesting(mFeedbackPolicyManager);\n        when(mActivity.getResources())\n                .thenReturn(ContextUtils.getApplicationContext().getResources());\n        when(mActivity.getPackageName()).thenReturn(\"app.smallthingz.reaper\");\n        doThrow(new AssertionError(SCREENSHOT_TRIPWIRE)).when(mActivity).getWindow();\n    }\n\n    @After\n    public void tearDown() {\n        FeatureOverrides.removeAllIncludingAnnotations();\n    }\n\n    private void assertSupportIntent(String expectedUrl) {\n        // Drain real queued work: a deferred screenshot must not escape this assertion.\n        RobolectricUtil.runAllBackgroundAndUiIncludingDelayed();\n        ArgumentCaptor<Intent> captor = ArgumentCaptor.forClass(Intent.class);\n        verify(mActivity).startActivity(captor.capture());\n        Intent intent = captor.getValue();\n        Assert.assertNotNull(\"The real launcher must synchronously open support\", intent);\n        Assert.assertEquals(Intent.ACTION_VIEW, intent.getAction());\n        Assert.assertEquals(expectedUrl, intent.getDataString());\n        Assert.assertEquals(mActivity.getPackageName(), intent.getPackage());\n        Assert.assertEquals(\n                mActivity.getPackageName(), intent.getStringExtra(Browser.EXTRA_APPLICATION_ID));\n        Assert.assertTrue(intent.getBooleanExtra(Browser.EXTRA_CREATE_NEW_TAB, false));\n        // No current-page URL, profile data, screenshot, category or feedback payload.\n        Assert.assertNotNull(intent.getExtras());\n        Assert.assertEquals(2, intent.getExtras().size());\n        verify(mActivity, never()).getWindow();\n        clearInvocations(mActivity);\n    }\n\n    @Test\n    public void testGetHelpMenuStringRes_FeedbackAllowed() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(true);\n        Assert.assertEquals(R.string.menu_help, HelpAndFeedbackLauncher.getHelpMenuStringRes());\n    }\n\n    @Test\n    public void testGetHelpMenuStringRes_FeedbackDisallowed() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(false);\n        Assert.assertEquals(\n                R.string.menu_help_no_feedback, HelpAndFeedbackLauncher.getHelpMenuStringRes());\n    }\n\n    @Test\n    public void testShowFeedback_FeedbackDisallowed() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(false);\n        HelpAndFeedbackLauncher launcher = HelpAndFeedbackLauncherImpl.getForProfile(mProfile);\n        launcher.showFeedback(mActivity, PRIVATE_URL, \"private-category\");\n        assertSupportIntent(SUPPORT_URL);\n    }\n\n    @Test\n    public void testShowFeedbackWithScreenshot_FeedbackDisallowed() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(false);\n        HelpAndFeedbackLauncher launcher = HelpAndFeedbackLauncherImpl.getForProfile(mProfile);\n        launcher.showFeedback(\n                mActivity, PRIVATE_URL, \"private-category\", ScreenshotMode.DEFAULT, \"private-context\");\n        assertSupportIntent(SUPPORT_URL);\n    }\n\n    @Test\n    public void testFactoryCachesPerProfile() {\n        HelpAndFeedbackLauncher first = HelpAndFeedbackLauncherImpl.getForProfile(mProfile);\n        Assert.assertSame(first, HelpAndFeedbackLauncherImpl.getForProfile(mProfile));\n        Profile other = mock(Profile.class);\n        HelpAndFeedbackLauncher second = HelpAndFeedbackLauncherImpl.getForProfile(other);\n        Assert.assertNotSame(first, second);\n        Assert.assertSame(second, HelpAndFeedbackLauncherImpl.getForProfile(other));\n        first.show(mActivity, mActivity.getResources().getString(R.string.help_context_general), PRIVATE_URL);\n        assertSupportIntent(SUPPORT_URL);\n        second.show(mActivity, mActivity.getResources().getString(R.string.help_context_general), PRIVATE_URL);\n        assertSupportIntent(SUPPORT_URL);\n    }\n\n    @Test\n    public void testShowOpensDefaultSupportWithoutCollection() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(true);\n        HelpAndFeedbackLauncherImpl.getForProfile(mProfile)\n                .show(mActivity, mActivity.getResources().getString(R.string.help_context_general), PRIVATE_URL);\n        assertSupportIntent(SUPPORT_URL);\n    }\n\n    @Test\n    public void testShowOpensSafeBrowsingSupportWithoutCollection() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(true);\n        HelpAndFeedbackLauncherImpl.getForProfile(mProfile)\n                .show(mActivity, mActivity.getResources().getString(R.string.help_context_safe_browsing), PRIVATE_URL);\n        assertSupportIntent(SAFE_BROWSING_URL);\n    }\n\n    @Test\n    public void testShowHelpAndFeedbackForUrlDoesNotForwardContext() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(true);\n        HelpAndFeedbackLauncherImpl.getForProfile(mProfile)\n                .showHelpAndFeedbackForUrl(mActivity, PRIVATE_URL, \"private-action\");\n        assertSupportIntent(SUPPORT_URL);\n    }\n\n    @Test\n    public void testShowFeedbackAllowedWithoutCollection() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(true);\n        HelpAndFeedbackLauncherImpl.getForProfile(mProfile)\n                .showFeedback(mActivity, PRIVATE_URL, \"private-category\");\n        assertSupportIntent(SUPPORT_URL);\n    }\n\n    @Test\n    public void testShowFeedbackWithScreenshotAllowedWithoutCollection() {\n        when(mFeedbackPolicyManager.isUserFeedbackAllowed()).thenReturn(true);\n        HelpAndFeedbackLauncherImpl.getForProfile(mProfile)\n                .showFeedback(\n                        mActivity, PRIVATE_URL, \"private-category\",\n                        ScreenshotMode.ANDROID_VIEW, \"private-context\");\n        assertSupportIntent(SUPPORT_URL);\n    }\n\n    @Test\n    public void testDiagnosticClassesAreAbsent() {\n        // String names avoid reintroducing production diagnostic dependencies for testing.\n        String[] removedClasses = {\n            \"org.chromium.chrome.browser.feedback.ChromeFeedbackCollector\",\n            \"org.chromium.chrome.browser.feedback.ConnectivityChecker\",\n            \"org.chromium.chrome.browser.feedback.ConnectivityFeedbackSource\",\n            \"org.chromium.chrome.browser.feedback.ConnectivityTask\",\n            \"org.chromium.chrome.browser.feedback.FeedbackCollector\",\n            \"org.chromium.chrome.browser.feedback.FallbackHelpAndFeedbackLauncherDelegate\",\n            \"org.chromium.chrome.browser.feedback.HelpAndFeedbackLauncherDelegate\",\n            \"org.chromium.chrome.browser.feedback.ProcessIdFeedbackSource\",\n            \"org.chromium.chrome.browser.feedback.SystemInfoFeedbackSource\",\n            \"org.chromium.chrome.browser.feedback.FamilyInfoFeedbackSource\",\n            \"org.chromium.chrome.browser.feedback.OmniboxFeedbackSource\",\n            \"org.chromium.chrome.browser.night_mode.AutoDarkFeedbackSource\"\n        };\n        for (String name : removedClasses) {\n            Assert.assertThrows(\n                    name,\n                    ClassNotFoundException.class,\n                    () -> Class.forName(name, false, getClass().getClassLoader()));\n        }\n    }\n\n    @Test\n    public void testScreenshotCaptureTripwireIsActive() {\n        // Exercise both real constructors and queued capture paths. This is a\n        // capture tripwire, not a claim that object allocation is observed.\n        for (boolean explicitMode : new boolean[] {false, true}) {\n            ScreenshotTask screenshot =\n                    explicitMode\n                            ? new ScreenshotTask(mActivity, ScreenshotMode.ANDROID_VIEW)\n                            : new ScreenshotTask(mActivity);\n            AssertionError error =\n                    Assert.assertThrows(\n                            AssertionError.class,\n                            () -> {\n                                screenshot.capture(null);\n                                RobolectricUtil.runAllBackgroundAndUiIncludingDelayed();\n                            });\n            Assert.assertEquals(SCREENSHOT_TRIPWIRE, error.getMessage());\n            verify(mActivity).getWindow();\n            clearInvocations(mActivity);\n        }\n    }\n}\n"
  count: 1
