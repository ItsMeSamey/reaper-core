substitutions:
- description: Exercise explicit tab consent, filtering, cancellation and stale OS-prompt isolation.
  regex:
    pattern: "package org.chromium.chrome.browser.media;\n\nimport static org.junit.Assert.assertEquals;\nimport static org.mockito.Mockito.doReturn;\nimport static org.mockito.Mockito.mock;\nimport static org.mockito.Mockito.verify;\n\nimport android.app.Activity;\nimport android.content.Context;\nimport android.content.Intent;\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.fragment.app.FragmentActivity;\nimport androidx.test.ext.junit.rules.ActivityScenarioRule;\nimport androidx.test.filters.SmallTest;\n\nimport org.junit.After;\nimport org.junit.Before;\nimport org.junit.Rule;\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\nimport org.mockito.Mock;\nimport org.mockito.junit.MockitoJUnit;\nimport org.mockito.junit.MockitoRule;\n\nimport org.chromium.base.CallbackUtils;\nimport org.chromium.base.ServiceLoaderUtil;\nimport org.chromium.base.test.BaseRobolectricTestRunner;\nimport org.chromium.chrome.browser.media.MediaCapturePickerHeadlessFragment.CaptureAction;\n\
      import org.chromium.chrome.browser.media.MediaCapturePickerManager.Delegate;\nimport org.chromium.chrome.browser.media.MediaCapturePickerManager.Params;\nimport org.chromium.chrome.browser.tab.Tab;\nimport org.chromium.content_public.browser.WebContents;\nimport org.chromium.content_public.browser.media.capture.ScreenCapture;\nimport org.chromium.ui.base.TestActivity;\n\n/** Tests for MediaCapturePickerInvoker. */\n@RunWith(BaseRobolectricTestRunner.class)\npublic class MediaCapturePickerInvokerTest {\n    @Rule\n    public ActivityScenarioRule<TestActivity> mActivityScenarioRule =\n            new ActivityScenarioRule<>(TestActivity.class);\n\n    @Rule public MockitoRule mMockitoRule = MockitoJUnit.rule();\n\n    @Mock private Delegate mDelegate;\n    @Mock private WebContents mTabWebContents;\n\n    private Activity mActivity;\n    private FakeMediaCapturePickerDelegate mPickerDelegate;\n\n    private static class FakeMediaCapturePickerDelegate implements MediaCapturePickerDelegate\
      \ {\n        private Intent mIntent;\n        private Tab mTab;\n        private boolean mShouldShareAudio;\n        private WebContents mStoppedWebContents;\n\n        @Override\n        public Intent createScreenCaptureIntent(Context context, Params params, Delegate delegate) {\n            return mIntent;\n        }\n\n        @Override\n        public Tab getPickedTab() {\n            return mTab;\n        }\n\n        @Override\n        public boolean shouldShareAudio() {\n            return mShouldShareAudio;\n        }\n\n        @Override\n        public void stopAppContentMediaProjection(WebContents webContents) {\n            mStoppedWebContents = webContents;\n        }\n\n        private WebContents getStoppedWebContents() {\n            return mStoppedWebContents;\n        }\n\n        private void setIntent(Intent intent) {\n            mIntent = intent;\n        }\n\n        private void setPickedTab(Tab tab) {\n            mTab = tab;\n        }\n\n        public void\
      \ setShouldShareAudio(boolean shouldShareAudio) {\n            mShouldShareAudio = shouldShareAudio;\n        }\n    }\n\n    private static MediaCapturePickerManager.Params mediaCaptureParams() {\n        return new MediaCapturePickerManager.Params(\n                mock(WebContents.class),\n                \"\",\n                \"\",\n                /* requestAudio= */ false,\n                /* excludeSystemAudio= */ false,\n                /* windowAudioPreference= */ 0,\n                /* preferredDisplaySurface= */ 0,\n                true,\n                /* excludeSelfBrowserSurface= */ false,\n                /* excludeMonitorTypeSurfaces= */ false,\n                AllowedScreenCaptureLevel.DESKTOP);\n    }\n\n    @Before\n    public void setUp() {\n        mActivityScenarioRule.getScenario().onActivity(activity -> mActivity = activity);\n        mPickerDelegate = new FakeMediaCapturePickerDelegate();\n        ServiceLoaderUtil.setInstanceForTesting(MediaCapturePickerDelegate.class,\
      \ mPickerDelegate);\n        MediaCapturePickerManager.setBringTabToFrontCallbackForTesting(\n                CallbackUtils.emptyCallback());\n    }\n\n    @After\n    public void tearDown() {\n        ScreenCapture.resetStaticStateForTesting();\n    }\n\n    @Test\n    @SmallTest\n    public void testShow_cancel() {\n        mPickerDelegate.setIntent(new Intent());\n        MediaCapturePickerInvoker.show(mActivity, mediaCaptureParams(), mDelegate);\n        MediaCapturePickerHeadlessFragment fragment =\n                MediaCapturePickerHeadlessFragment.getInstance((FragmentActivity) mActivity);\n        fragment.mNextDelegate.onPicked(\n                CaptureAction.CAPTURE_CANCELLED,\n                new ActivityResult(Activity.RESULT_CANCELED, null));\n        verify(mDelegate).onCancel();\n    }\n\n    @Test\n    @SmallTest\n    public void testShow_tabWithAudio() {\n        Tab tab = mock(Tab.class);\n        doReturn(mTabWebContents).when(tab).getWebContents();\n\n        mPickerDelegate.setIntent(new\
      \ Intent());\n        mPickerDelegate.setPickedTab(tab);\n        mPickerDelegate.setShouldShareAudio(true);\n        MediaCapturePickerInvoker.show(mActivity, mediaCaptureParams(), mDelegate);\n        MediaCapturePickerHeadlessFragment fragment =\n                MediaCapturePickerHeadlessFragment.getInstance((FragmentActivity) mActivity);\n        fragment.mNextDelegate.onPicked(\n                CaptureAction.CAPTURE_WINDOW, new ActivityResult(Activity.RESULT_OK, new Intent()));\n        verify(tab).loadIfNeeded(/* forceBackingSize= */ true);\n        verify(mDelegate).onPickTab(mTabWebContents, true);\n    }\n\n    @Test\n    @SmallTest\n    public void testShow_tabWithoutAudio() {\n        Tab tab = mock(Tab.class);\n        doReturn(mTabWebContents).when(tab).getWebContents();\n\n        mPickerDelegate.setIntent(new Intent());\n        mPickerDelegate.setPickedTab(tab);\n        mPickerDelegate.setShouldShareAudio(false);\n        MediaCapturePickerInvoker.show(mActivity, mediaCaptureParams(),\
      \ mDelegate);\n        MediaCapturePickerHeadlessFragment fragment =\n                MediaCapturePickerHeadlessFragment.getInstance((FragmentActivity) mActivity);\n        fragment.mNextDelegate.onPicked(\n                CaptureAction.CAPTURE_WINDOW, new ActivityResult(Activity.RESULT_OK, new Intent()));\n        verify(tab).loadIfNeeded(/* forceBackingSize= */ true);\n        verify(mDelegate).onPickTab(mTabWebContents, false);\n    }\n\n    @Test\n    @SmallTest\n    public void testShow_window() {\n        mPickerDelegate.setIntent(new Intent());\n        Params params = mediaCaptureParams();\n        MediaCapturePickerInvoker.show(mActivity, params, mDelegate);\n        MediaCapturePickerHeadlessFragment fragment =\n                MediaCapturePickerHeadlessFragment.getInstance((FragmentActivity) mActivity);\n        fragment.mNextDelegate.onPicked(\n                CaptureAction.CAPTURE_WINDOW, new ActivityResult(Activity.RESULT_OK, new Intent()));\n        verify(mDelegate).onPickWindow();\n\
      \        assertEquals(params.webContents, mPickerDelegate.getStoppedWebContents());\n    }\n\n    @Test\n    @SmallTest\n    public void testShow_screen() {\n        mPickerDelegate.setIntent(new Intent());\n        Params params = mediaCaptureParams();\n        MediaCapturePickerInvoker.show(mActivity, params, mDelegate);\n        MediaCapturePickerHeadlessFragment fragment =\n                MediaCapturePickerHeadlessFragment.getInstance((FragmentActivity) mActivity);\n        fragment.mNextDelegate.onPicked(\n                CaptureAction.CAPTURE_SCREEN, new ActivityResult(Activity.RESULT_OK, new Intent()));\n        verify(mDelegate).onPickScreen();\n        assertEquals(params.webContents, mPickerDelegate.getStoppedWebContents());\n    }\n}\n"
    replace: "package org.chromium.chrome.browser.media;\n\nimport static org.junit.Assert.assertEquals;\nimport static org.junit.Assert.assertFalse;\nimport static org.junit.Assert.assertNotNull;\nimport static org.junit.Assert.assertTrue;\nimport static org.mockito.Mockito.doReturn;\nimport static org.mockito.Mockito.mock;\nimport static org.mockito.Mockito.never;\nimport static org.mockito.Mockito.verify;\nimport static org.mockito.Mockito.verifyNoInteractions;\n\nimport android.app.Activity;\nimport android.app.AlertDialog;\nimport android.content.Intent;\nimport android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.CheckBox;\nimport android.widget.ListView;\n\nimport androidx.fragment.app.FragmentActivity;\nimport androidx.test.ext.junit.rules.ActivityScenarioRule;\nimport androidx.test.filters.SmallTest;\n\nimport org.chromium.base.CallbackUtils;\nimport org.chromium.base.test.BaseRobolectricTestRunner;\nimport org.chromium.chrome.browser.app.tabmodel.AllTabObserver;\n\
      import org.chromium.chrome.browser.app.tabwindow.TabWindowManagerSingleton;\nimport org.chromium.chrome.browser.media.MediaCapturePickerManager.Delegate;\nimport org.chromium.chrome.browser.media.MediaCapturePickerManager.Params;\nimport org.chromium.chrome.browser.tab.Tab;\nimport org.chromium.chrome.browser.tabwindow.TabWindowManager;\nimport org.chromium.content_public.browser.WebContents;\nimport org.chromium.ui.base.TestActivity;\nimport org.chromium.ui.base.WindowAndroid;\nimport org.chromium.url.GURL;\nimport org.junit.After;\nimport org.junit.Before;\nimport org.junit.Rule;\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\nimport org.mockito.Mock;\nimport org.mockito.junit.MockitoJUnit;\nimport org.mockito.junit.MockitoRule;\nimport org.robolectric.Shadows;\nimport org.robolectric.shadows.ShadowAlertDialog;\n\nimport java.lang.ref.WeakReference;\nimport java.util.List;\n\n/** Exercises the actual chooser rather than an absent ServiceLoader delegate. */\n@RunWith(BaseRobolectricTestRunner.class)\n\
      public class MediaCapturePickerInvokerTest {\n    @Rule\n    public ActivityScenarioRule<TestActivity> mActivityScenarioRule =\n            new ActivityScenarioRule<>(TestActivity.class);\n\n    @Rule public MockitoRule mMockitoRule = MockitoJUnit.rule();\n    @Mock private Delegate mDelegate;\n    @Mock private WebContents mTabWebContents;\n    private Activity mActivity;\n    private Runnable mDismiss = () -> {};\n\n    private Params params(boolean audio) {\n        Params params =\n                new Params(\n                        mock(WebContents.class),\n                        \"Extension\",\n                        \"Extension\",\n                        audio,\n                        false,\n                        0,\n                        0,\n                        false,\n                        false,\n                        false,\n                        AllowedScreenCaptureLevel.DESKTOP);\n        params.allowedSourceTypes = 1;\n        params.captureId = 42;\n\
      \        return params;\n    }\n\n    @Before\n    public void setUp() {\n        mActivityScenarioRule.getScenario().onActivity(activity -> mActivity = activity);\n        TabWindowManager manager = mock(TabWindowManager.class);\n        doReturn(List.of()).when(manager).getAllTabModelSelectors();\n        TabWindowManagerSingleton.setTabWindowManagerForTesting(manager);\n        MediaCapturePickerManager.setBringTabToFrontCallbackForTesting(\n                CallbackUtils.emptyCallback());\n    }\n\n    @After\n    public void tearDown() {\n        mDismiss.run();\n        AllTabObserver.resetForTesting();\n    }\n\n    private Tab addTab() {\n        Tab tab = mock(Tab.class);\n        doReturn(mTabWebContents).when(tab).getWebContents();\n        doReturn(new GURL(\"https://example.test/\")).when(tab).getUrl();\n        doReturn(\"Example\").when(tab).getTitle();\n        AllTabObserver.addCustomTab(tab);\n        return tab;\n    }\n\n    private static <T extends View> T find(View\
      \ root, Class<T> type) {\n        if (type.isInstance(root)) return type.cast(root);\n        if (root instanceof ViewGroup group) {\n            for (int i = 0; i < group.getChildCount(); i++) {\n                T result = find(group.getChildAt(i), type);\n                if (result != null) return result;\n            }\n        }\n        return null;\n    }\n\n    private AlertDialog show(boolean audio) {\n        mDismiss = MediaCapturePickerInvoker.show(mActivity, params(audio), mDelegate);\n        AlertDialog dialog = ShadowAlertDialog.getLatestAlertDialog();\n        assertNotNull(dialog);\n        return dialog;\n    }\n\n    private void select(AlertDialog dialog) {\n        ListView list = find(dialog.getWindow().getDecorView(), ListView.class);\n        assertEquals(1, list.getCount());\n        list.performItemClick(null, 0, 0);\n    }\n\n    @Test\n    @SmallTest\n    public void selectingTabRequiresExplicitShareAndAudioOptIn() {\n        addTab();\n        AlertDialog\
      \ dialog = show(true);\n        assertFalse(dialog.getButton(AlertDialog.BUTTON_POSITIVE).isEnabled());\n        select(dialog);\n        verify(mDelegate, never()).onPickTab(mTabWebContents, false);\n        CheckBox audio = find(dialog.getWindow().getDecorView(), CheckBox.class);\n        assertFalse(audio.isChecked());\n        dialog.getButton(AlertDialog.BUTTON_POSITIVE).performClick();\n        verify(mDelegate).onPickTab(mTabWebContents, false);\n        verify(mDelegate, never()).onPickScreen();\n        verify(mDelegate, never()).onPickWindow();\n    }\n\n    @Test\n    @SmallTest\n    public void userMayOptInToRequestedTabAudio() {\n        addTab();\n        AlertDialog dialog = show(true);\n        select(dialog);\n        find(dialog.getWindow().getDecorView(), CheckBox.class).setChecked(true);\n        dialog.getButton(AlertDialog.BUTTON_POSITIVE).performClick();\n        verify(mDelegate).onPickTab(mTabWebContents, true);\n    }\n\n    @Test\n    @SmallTest\n    public\
      \ void filterIsRecheckedAtConfirmation() {\n        addTab();\n        AlertDialog dialog = show(false);\n        select(dialog);\n        doReturn(true).when(mDelegate).shouldFilterWebContents(mTabWebContents);\n        dialog.getButton(AlertDialog.BUTTON_POSITIVE).performClick();\n        verify(mDelegate).onCancel();\n        verify(mDelegate, never()).onPickTab(mTabWebContents, false);\n    }\n\n    @Test\n    @SmallTest\n    public void removedTabCannotRemainSelected() {\n        Tab tab = addTab();\n        AlertDialog dialog = show(false);\n        select(dialog);\n        AllTabObserver.removeCustomTab(tab);\n        assertFalse(dialog.getButton(AlertDialog.BUTTON_POSITIVE).isEnabled());\n    }\n\n    @Test\n    @SmallTest\n    public void nativeDismissalIsNotASecondResult() {\n        AlertDialog dialog = show(false);\n        mDismiss.run();\n        assertFalse(dialog.isShowing());\n        verifyNoInteractions(mDelegate);\n    }\n\n    @Test\n    @SmallTest\n    public\
      \ void extensionWithoutOwnWindowUsesAuthorizedParent() {\n        Params params = params(false);\n        WindowAndroid parent = mock(WindowAndroid.class);\n        doReturn(new WeakReference<>(mActivity)).when(parent).getContext();\n        params.parentWindow = parent;\n        // The mocked extension WebContents has no top-level native window.\n        mDismiss = MediaCapturePickerManager.showDialog(params, mDelegate);\n        AlertDialog dialog = ShadowAlertDialog.getLatestAlertDialog();\n        assertNotNull(dialog);\n        assertTrue(dialog.isShowing());\n        verifyNoInteractions(mDelegate);\n    }\n\n    @Test\n    @SmallTest\n    public void noAuthorizedSurfaceFailsClosed() {\n        Params params = params(false);\n        params.allowedSourceTypes = 0;\n        mDismiss = MediaCapturePickerInvoker.show(mActivity, params, mDelegate);\n        verify(mDelegate).onCancel();\n        verify(mDelegate, never()).onPickScreen();\n        verify(mDelegate, never()).onPickWindow();\n\
      \    }\n\n    @Test\n    @SmallTest\n    public void cancelledPromptCannotAuthorizeOverlappingRequest() {\n        MediaCapturePickerHeadlessFragment fragment =\n                MediaCapturePickerHeadlessFragment.getInstance((FragmentActivity) mActivity);\n        MediaCapturePickerHeadlessFragment.Delegate first =\n                mock(MediaCapturePickerHeadlessFragment.Delegate.class);\n        MediaCapturePickerHeadlessFragment.Delegate second =\n                mock(MediaCapturePickerHeadlessFragment.Delegate.class);\n        Intent prompt = new Intent(\"capture.test.PROMPT\");\n        assertTrue(fragment.startAndroidCapturePrompt(first, prompt));\n        fragment.cancelPrompt(first);\n        assertFalse(fragment.startAndroidCapturePrompt(second, prompt));\n        Shadows.shadowOf(mActivity).receiveResult(prompt, Activity.RESULT_OK, new Intent());\n        verifyNoInteractions(first, second);\n        assertTrue(fragment.startAndroidCapturePrompt(second, prompt));\n       \
      \ fragment.cancelPrompt(second);\n    }\n}\n"
