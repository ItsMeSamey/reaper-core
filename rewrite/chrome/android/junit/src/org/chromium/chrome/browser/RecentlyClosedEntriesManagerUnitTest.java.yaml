    replace: "\n    private static final int RESTORE_OWNER_ID = 1;\n    private static final int RESTORE_WINDOW_ID = 2;\n    private static final long RESTORED_BROWSER_WINDOW = 0x12345678L;\n\n    private ActivityController<RestoreActivity> mRestoreOwnerController;\n    private ActivityController<RestoreActivity> mRestoredActivityController;\n    private TabModelSelector mClosedRestoreSelector;\n    private TabModelSelector mRestoredSelector;\n    private TabModel mRestoredModel;\n    private ChromeAndroidTaskTracker mRestoreTaskTracker;\n    private ChromeAndroidTask mRestoredTask;\n    private RecentlyClosedEntriesManager.RestoreOperation mRestoreOperation;\n    private JniOnceCallback<Long> mRestoreCallback;\n    private long mRestoreClosureTime;\n\n    @Implements(value = ChromeAndroidTaskTrackerFactory.class, isInAndroidSdk = false)\n    public static class ShadowRestoreTaskTrackerFactory {\n        static ChromeAndroidTaskTracker sTracker;\n\n        @Implementation\n        protected static ChromeAndroidTaskTracker getInstance() {\n            return sTracker;\n        }\n\n        @Resetter\n        public static void reset() {\n            sTracker = null;\n        }\n    }\n\n    /** Gives the two real Activities separate task identities without launching Chrome native code. */\n    public static class RestoreActivity extends Activity {\n        int mTestTaskId;\n\n        @Override\n        public int getTaskId() {\n            return mTestTaskId;\n        }\n    }\n\n    private void setUpWindowRestore() {\n        IncognitoUtils.setShouldOpenIncognitoAsWindowForTesting(false);\n        MultiWindowUtils.setInstanceCountForTesting(1);\n        MultiWindowUtils.setMaxInstancesForTesting(3);\n        MultiWindowUtils.setMultiInstanceApi31EnabledForTesting(true);\n        TabWindowManagerSingleton.setTabWindowManagerForTesting(mTabWindowManager);\n        when(mTabWindowManager.getIdForWindow(any()))\n                .thenReturn(TabWindowManager.INVALID_WINDOW_ID);\n        mRestoreTaskTracker = mock(ChromeAndroidTaskTracker.class);\n        ShadowRestoreTaskTrackerFactory.sTracker = mRestoreTaskTracker;\n        mRestoreCallback = mock();\n        mRestoredTask = mock(ChromeAndroidTask.class);\n        mClosedRestoreSelector = mock(TabModelSelector.class);\n        mRestoredSelector = mock(TabModelSelector.class);\n        mRestoredModel = mock(TabModel.class);\n        when(mClosedRestoreSelector.getModel(false)).thenReturn(mTabModel);\n        when(mClosedRestoreSelector.isTabStateInitialized()).thenReturn(true);\n        when(mRestoredSelector.getModel(false)).thenReturn(mRestoredModel);\n        when(mRestoredModel.getProfile()).thenReturn(mProfile);\n        when(mTabWindowManager.getTabModelSelectorById(RESTORE_WINDOW_ID))\n                .thenReturn(mClosedRestoreSelector);\n        when(mTabWindowManager.getWindowIdForSelector(mClosedRestoreSelector))\n                .thenReturn(RESTORE_WINDOW_ID);\n        when(mTabWindowManager.getWindowIdForSelector(mRestoredSelector))\n                .thenReturn(RESTORE_WINDOW_ID);\n        mRestoreOwnerController = Robolectric.buildActivity(RestoreActivity.class);\n        mRestoreOwnerController.get().mTestTaskId = 101;\n        mRestoreOwnerController.setup();\n        Activity owner = mRestoreOwnerController.get();\n        when(mTabWindowManager.getIdForWindow(owner)).thenReturn(RESTORE_OWNER_ID);\n        when(mTabWindowManager.getWindowIdForSelector(mTabModelSelector))\n                .thenReturn(RESTORE_OWNER_ID);\n        when(mTabWindowManager.getTabModelSelectorById(RESTORE_OWNER_ID))\n                .thenReturn(mTabModelSelector);\n        MultiWindowUtils.setActivityByWindowIdForTesting(RESTORE_OWNER_ID, owner);\n        createRecentlyClosedWindows(1);\n        mRestoreClosureTime = getDaysAgoMillis(1) + 2;\n        idleRestoreChecks();\n    }\n\n    private static void idleRestoreChecks() {\n        // Leave the one-minute timeout pending while delivering immediate lifecycle work.\n        Shadows.shadowOf(Looper.getMainLooper()).idle();\n    }\n\n    private void requestWindowRestore() {\n        mRestoreOperation =\n                RecentlyClosedEntriesManager.restoreWindow(\n                        mProfile, RESTORE_WINDOW_ID, mRestoreClosureTime, mRestoreCallback);\n        idleRestoreChecks();\n    }\n\n    private TabWindowManager.Observer windowRestoreObserver() {\n        ArgumentCaptor<TabWindowManager.Observer> captor =\n                ArgumentCaptor.forClass(TabWindowManager.Observer.class);\n        verify(mTabWindowManager).addObserver(captor.capture());\n        return captor.getValue();\n    }\n\n    private TabModelSelectorObserver restoredSelectorObserver() {\n        ArgumentCaptor<TabModelSelectorObserver> captor =\n                ArgumentCaptor.forClass(TabModelSelectorObserver.class);\n        verify(mRestoredSelector).addObserver(captor.capture());\n        return captor.getValue();\n    }\n\n    private ChromeAndroidTaskTrackerObserver restoreTaskObserver() {\n        ArgumentCaptor<ChromeAndroidTaskTrackerObserver> captor =\n                ArgumentCaptor.forClass(ChromeAndroidTaskTrackerObserver.class);\n        verify(mRestoreTaskTracker).addObserver(captor.capture());\n        return captor.getValue();\n    }\n\n    private void publishRestoredActivity(boolean initialized, long nativeWindow) {\n        mRestoredActivityController = Robolectric.buildActivity(RestoreActivity.class);\n        mRestoredActivityController.get().mTestTaskId = 202;\n        mRestoredActivityController.setup();\n        Activity activity = mRestoredActivityController.get();\n        when(mTabWindowManager.getIdForWindow(activity)).thenReturn(RESTORE_WINDOW_ID);\n        MultiWindowUtils.setActivityByWindowIdForTesting(RESTORE_WINDOW_ID, activity);\n        when(mTabWindowManager.getTabModelSelectorById(RESTORE_WINDOW_ID))\n                .thenReturn(mRestoredSelector);\n        when(mRestoredSelector.isTabStateInitialized()).thenReturn(initialized);\n        when(mRestoredTask.getId()).thenReturn(202);\n        when(mRestoreTaskTracker.get(202)).thenReturn(mRestoredTask);\n        when(mRestoredTask.getNativeBrowserWindowPtr(mProfile, activity)).thenReturn(nativeWindow);\n        windowRestoreObserver().onTabModelSelectorAdded(mRestoredSelector);\n        idleRestoreChecks();\n    }\n\n    private void verifyRestoreFailure() {\n        verify(mRestoreCallback).onResult(0L);\n        verifyNoMoreInteractions(mRestoreCallback);\n    }\n\n    private void verifyRestoreObserversRemoved() {\n        verify(mTabWindowManager).removeObserver(any());\n        verify(mRestoreTaskTracker).removeObserver(any());\n    }\n\n    @After\n    public void tearDownWindowRestore() {\n        if (mRestoreOwnerController == null) return;\n        RecentlyClosedEntriesManager.cancelRestoreOperation(mRestoreOperation);\n        RecentlyClosedEntriesManagerTrackerFactory.getInstance()\n                .destroy(mRecentlyClosedEntriesManager);\n        if (mRestoredActivityController != null\n                && !mRestoredActivityController.get().isDestroyed()) {\n            mRestoredActivityController.pause().stop().destroy();\n        }\n        if (!mRestoreOwnerController.get().isDestroyed()) {\n            mRestoreOwnerController.pause().stop().destroy();\n        }\n        idleRestoreChecks();\n    }\n\n    @Test\n    public void testRestoreWindowWithoutManagerFailsWithoutLaunching() {\n        setUpWindowRestore();\n        RecentlyClosedEntriesManagerTrackerFactory.getInstance()\n                .destroy(mRecentlyClosedEntriesManager);\n\n        requestWindowRestore();\n\n        assertNull(mRestoreOperation);\n        verifyRestoreFailure();\n        verify(mMultiInstanceManager, never()).openWindow(anyInt(), anyInt());\n    }\n\n    @Test\n    public void testRestoreWindowRejectsOffTheRecordProfile() {\n        setUpWindowRestore();\n        when(mProfile.isOffTheRecord()).thenReturn(