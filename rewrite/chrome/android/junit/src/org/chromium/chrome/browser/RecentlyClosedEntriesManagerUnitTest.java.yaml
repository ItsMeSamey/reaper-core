reignModel = mock(TabModel.class);\n        when(foreignModel.getProfile()).thenReturn(mock(Profile.class));\n        when(mClosedRestoreSelector.getModel(false)).thenReturn(foreignModel);\n\n        requestWindowRestore();\n\n        assertNull(mRestoreOperation);\n        verifyRestoreFailure();\n        verify(mMultiInstanceManager, never()).openWindow(anyInt(), anyInt());\n    }\n\n    @Test\n    public void testRestoreWindowLaunchExceptionCompletesOnceAndUnregisters() {\n        setUpWindowRestore();\n        doThrow(new ActivityNotFoundException(\"No target Activity\"))\n                .when(mMultiInstanceManager)\n                .openWindow(RESTORE_WINDOW_ID, NewWindowAppSource.BROWSER_WINDOW_CREATOR);\n\n        requestWindowRestore();\n        RecentlyClosedEntriesManager.cancelRestoreOperation(mRestoreOperation);\n        idleRestoreChecks();\n\n        verifyRestoreFailure();\n        verifyRestoreObserversRemoved();\n    }\n\n    @Test\n    public void testRestoreWindowWaitsForFreshSelectorAndInitializedExactActivity() {\n        setUpWindowRestore();\n        requestWindowRestore();\n        assertNotNull(mRestoreOperation);\n        verify(mMultiInstanceManager)\n                .openWindow(RESTORE_WINDOW_ID, NewWindowAppSource.BROWSER_WINDOW_CREATOR);\n\n        // Persisted headless metadata becoming ready is not a restored browser window.\n        windowRestoreObserver().onTabModelSelectorAdded(mClosedRestoreSelector);\n        windowRestoreObserver().onTabStateInitialized();\n        idleRestoreChecks();\n        verifyNoInteractions(mRestoreCallback);\n        verify(mClosedRestoreSelector, never()).addObserver(any());\n\n        publishRestoredActivity(false, RESTORED_BROWSER_WINDOW);\n        verifyNoInteractions(mRestoreCallback);\n        TabModelSelectorObserver observer = restoredSelectorObserver();\n        when(mRestoredSelector.isTabStateInitialized()).thenReturn(true);\n        observer.onTabStateInitialized();\n        idleRestoreChecks();\n\n        verify(mRestoreCallback).onResult(RESTORED_BROWSER_WINDOW);\n        verifyNoMoreInteractions(mRestoreCallback);\n        verify(mRestoredTask)\n                .getNativeBrowserWindowPtr(mProfile, mRestoredActivityController.get());\n        verify(mRestoredTask, never()).getOrCreateNativeBrowserWindowPtr(any());\n        verifyRestoreObserversRemoved();\n        verify(mRestoredSelector).removeObserver(observer);\n        verify(mRestoredTask).removeAndroidBrowserWindowObserver(any());\n\n        // Already-queued or repeated platform notifications cannot repeat the result.\n        observer.onTabStateInitialized();\n        observer.onDestroyed();\n        RecentlyClosedEntriesManager.cancelRestoreOperation(mRestoreOperation);\n        idleRestoreChecks();\n        verifyNoMoreInteractions(mRestoreCallback);\n    }\n\n    @Test\n    public void testRestoreWindowCannotSucceedWithoutExistingNativeWindow() {\n        setUpWindowRestore();\n        requestWindowRestore();\n        publishRestoredActivity(true, 0L);\n\n        verifyNoInteractions(mRestoreCallback);\n        verify(mRestoredTask, never()).getOrCreateNativeBrowserWindowPtr(any());\n        RecentlyClosedEntriesManager.cancelRestoreOperation(mRestoreOperation);\n        idleRestoreChecks();\n\n        verifyRestoreFailure();\n        verifyRestoreObserversRemoved();\n    }\n\n    @Test\n    public void testRestoreWindowRejectsRestoredRegularModelFromAnotherProfile() {\n        setUpWindowRestore();\n        requestWindowRestore();\n        when(mRestoredModel.getProfile()).thenReturn(mock(Profile.class));\n\n        publishRestoredActivity(true, RESTORED_BROWSER_WINDOW);\n\n        verifyRestoreFailure();\n        verify(mRestoredTask, never()).getNativeBrowserWindowPtr(any(), any());\n        verifyRestoreObserversRemoved();\n    }\n\n    @Test\n    public void testRestoreWindowSelectorDestructionCompletesFailureOnce() {\n        setUpWindowRestore();\n        requestWindowRestore();\n