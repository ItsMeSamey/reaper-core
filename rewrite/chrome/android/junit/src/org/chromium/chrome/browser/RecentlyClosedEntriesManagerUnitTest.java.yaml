umentCaptor.forClass(TabModelSelectorObserver.class);\n        verify(mClosedRestoreSelector).addObserver(captor.capture());\n        return captor.getValue();\n    }\n\n    @Test\n    public void testClosedWindowMetadataAfterRestartMaterializesHeadlessSelectorWithoutListing() {\n        setUpWindowRestore();\n        when(mTabWindowManager.getTabModelSelectorById(RESTORE_WINDOW_ID)).thenReturn(null);\n        when(mClosedRestoreSelector.isTabStateInitialized()).thenReturn(false);\n        when(mTabWindowManager.requestSelectorWithoutActivity(RESTORE_WINDOW_ID, mProfile))\n                .thenAnswer(\n                        invocation -> {\n                            when(mTabWindowManager.getTabModelSelectorById(RESTORE_WINDOW_ID))\n                                    .thenReturn(mClosedRestoreSelector);\n                            return mClosedRestoreSelector;\n                        });\n        JniOnceCallback<RecentlyClosedWindowMetadata> callback = mock();\n\n        RecentlyClosedEntriesManager.getRecentlyClosedWindow(\n                mProfile, RESTORE_WINDOW_ID, callback);\n        idleRestoreChecks();\n\n        verify(mTabWindowManager).requestSelectorWithoutActivity(RESTORE_WINDOW_ID, mProfile);\n        verifyNoInteractions(callback);\n        TabModelSelectorObserver observer = closedMetadataObserver();\n        when(mClosedRestoreSelector.isTabStateInitialized()).thenReturn(true);\n        observer.onTabStateInitialized();\n        idleRestoreChecks();\n\n        ArgumentCaptor<RecentlyClosedWindowMetadata> metadata =\n                ArgumentCaptor.forClass(RecentlyClosedWindowMetadata.class);\n        verify(callback).onResult(metadata.capture());\n        assertEquals(mTabModel, metadata.getValue().tabModel);\n        assertEquals(RESTORE_WINDOW_ID, metadata.getValue().instanceId);\n        assertEquals(mRestoreClosureTime, metadata.getValue().timestamp);\n        verify(mRecentlyClosedTabManager, never()).getRecentlyClosedEntries(anyInt());\