bserver observer = windowRestoreObserver();\n        observer.onTabStateInitialized();\n\n        RecentlyClosedEntriesManager.cancelRestoreOperation(mRestoreOperation);\n        RecentlyClosedEntriesManager.cancelRestoreOperation(mRestoreOperation);\n        Shadows.shadowOf(Looper.getMainLooper()).idleFor(1, TimeUnit.MINUTES);\n\n        verifyRestoreFailure();\n        verifyRestoreObserversRemoved();\n    }\n\n    @Test\n    public void testRestoreWindowTimeoutCompletesPendingHeadlessRequest() {\n        setUpWindowRestore();\n        requestWindowRestore();\n\n        Shadows.shadowOf(Looper.getMainLooper()).idleFor(1, TimeUnit.MINUTES);\n\n        verifyRestoreFailure();\n        verifyRestoreObserversRemoved();\n    }\n\n    @Test\n    public void testRestoreWindowDuplicatePendingRequestDoesNotLaunchAgain() {\n        setUpWindowRestore();\n        requestWindowRestore();\n        JniOnceCallback<Long> duplicateCallback = mock();\n\n        assertNull(\n                RecentlyClosedEntriesManager.restoreWindow(\n                        mProfile, RESTORE_WINDOW_ID, mRestoreClosureTime, duplicateCallback));\n\n        verify(duplicateCallback).onResult(0L);\n        verifyNoMoreInteractions(duplicateCallback);\n        verifyNoInteractions(mRestoreCallback);\n        verify(mMultiInstanceManager)\n                .openWindow(RESTORE_WINDOW_ID, NewWindowAppSource.BROWSER_WINDOW_CREATOR);\n    }\n\n    @Test\n    public void testRestoreWindowCallbackMayCancelAndDestroyOwnerReentrantly() {\n        setUpWindowRestore();\n        requestWindowRestore();\n        doAnswer(\n                        invocation -> {\n                            // All observers must be retired before native can reenter Java.\n                            verifyRestoreObserversRemoved();\n                            verify(mRestoredSelector).removeObserver(any());\n                            verify(mRestoredTask).removeAndroidBrowserWindowObserver(any());\n                            R