# Reaper Source330 optional AtMemory accessory implementation closure.
- description: Reaper Android physical AtMemory accessory and optional Autofill-AI
    promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
    behavior.
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.keyboard_accessory\.sheet_tabs\.AddressAccessorySheetCoordinator;\

      import\ org\.chromium\.chrome\.browser\.keyboard_accessory\.sheet_tabs\.CreditCardAccessorySheetCoordinator;\

      import\ org\.chromium\.chrome\.browser\.keyboard_accessory\.sheet_tabs\.PasswordAccessorySheetCoordinator;\

      import\ org\.chromium\.chrome\.browser\.keyboard_accessory\.utils\.ManualFillingMetricsRecorder;\

      import\ org\.chromium\.chrome\.browser\.profiles\.Profile;\

      import\ org\.chromium\.chrome\.browser\.tab\.Tab;\

      import\ org\.chromium\.chrome\.browser\.tab\.TabHidingType;\

      '
    replace: 'import org.chromium.chrome.browser.keyboard_accessory.sheet_tabs.AddressAccessorySheetCoordinator;

      import org.chromium.chrome.browser.keyboard_accessory.sheet_tabs.CreditCardAccessorySheetCoordinator;

      import org.chromium.chrome.browser.keyboard_accessory.sheet_tabs.PasswordAccessorySheetCoordinator;

      import org.chromium.chrome.browser.profiles.Profile;

      import org.chromium.chrome.browser.tab.Tab;

      import org.chromium.chrome.browser.tab.TabHidingType;

      '
- description: Reaper Android physical AtMemory accessory and optional Autofill-AI
    promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
    behavior.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ assert\ mActivity\ !=\ null;\

      \ \ \ \ \ \ \ \ mWindowAndroid\ =\ windowAndroid;\

      \ \ \ \ \ \ \ \ mKeyboardAccessory\ =\ keyboardAccessory;\

      \ \ \ \ \ \ \ \ mKeyboardAccessory\.setAtMemoryCallback\(this::onAtMemoryClicked\);\

      \ \ \ \ \ \ \ \ mBottomSheetController\ =\ sheetController;\

      \ \ \ \ \ \ \ \ mIsContextualSearchOpened\ =\ isContextualSearchOpened;\

      \ \ \ \ \ \ \ \ mSoftKeyboardDelegate\ =\ keyboardDelegate;\

      '
    replace: "        assert mActivity != null;\n        mWindowAndroid = windowAndroid;\n\
      \        mKeyboardAccessory = keyboardAccessory;\n        mBottomSheetController\
      \ = sheetController;\n        mIsContextualSearchOpened = isContextualSearchOpened;\n\
      \        mSoftKeyboardDelegate = keyboardDelegate;\n"
- description: Reaper Android physical AtMemory accessory and optional Autofill-AI
    promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
    behavior.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ boolean\ isContentEditable\)\ \{\

      \ \ \ \ \ \ \ \ mModel\.set\(SHOULD_SHOW_ON_LARGE_FORM_FACTOR,\ shouldShowOnLargeFormFactor\);\

      \ \ \ \ \ \ \ \ mModel\.set\(IS_CONTENT_EDITABLE,\ isContentEditable\);\

      \ \ \ \ \ \ \ \ showWithKeyboardExtensionState\(waitForKeyboard\);\

      \ \ \ \ \}\

      \

      '
    replace: "            boolean isContentEditable) {\n        mModel.set(SHOULD_SHOW_ON_LARGE_FORM_FACTOR,\
      \ shouldShowOnLargeFormFactor);\n        mModel.set(IS_CONTENT_EDITABLE, isContentEditable);\n\
      \        if (isContentEditable) {\n            hide();\n            return;\n\
      \        }\n        showWithKeyboardExtensionState(waitForKeyboard);\n    }\n\
      \n"
- description: Reaper Android physical AtMemory accessory and optional Autofill-AI
    promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
    behavior.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ Autofill\ suggestions\ are\ invalidated\ on\
      rotation\.\ Dismissing\ all\ filling\ UI\ forces\

      \ \ \ \ \ \ \ \ //\ the\ user\ to\ interact\ with\ the\ field\ they\ want\ to\
      edit\.\ This\ refreshes\ Autofill\.\

      \ \ \ \ \ \ \ \ hideSoftKeyboard\(\);\

      \ \ \ \ \}\

      \

      \ \ \ \ private\ void\ onAtMemoryClicked\(\)\ \{\

      \ \ \ \ \ \ \ \ WebContents\ webContents\ =\ mActivity\.getCurrentWebContents\(\);\

      \ \ \ \ \ \ \ \ if\ \(webContents\ !=\ null\ \&\&\ !webContents\.isDestroyed\(\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ ManualFillingMetricsRecorder\.recordActionSelected\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AccessoryAction\.SHOW_AT_MEMORY_BOTTOMSHEET\);\

      \ \ \ \ \ \ \ \ \ \ \ \ ManualFillingComponentBridge\.onOptionSelectedForWebContents\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ webContents,\ AccessoryAction\.SHOW_AT_MEMORY_BOTTOMSHEET\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      \ \ \ \ private\ void\ updateAtMemoryEnablement\(\)\ \{\

      \ \ \ \ \ \ \ \ WebContents\ webContents\ =\ mActivity\ !=\ null\ \?\ mActivity\.getCurrentWebContents\(\)\
      :\ null;\

      \ \ \ \ \ \ \ \ boolean\ enabled\ =\ false;\

      \ \ \ \ \ \ \ \ if\ \(webContents\ !=\ null\ \&\&\ !webContents\.isDestroyed\(\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ enabled\ =\ ManualFillingComponentBridge\.isAtMemoryEnabled\(webContents\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!enabled\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Hide\ the\ AtMemory\ bottom\ sheet\ if\
      not\ enabled\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ManualFillingComponentBridge\.hideAtMemoryBottomSheet\(webContents\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ mKeyboardAccessory\.setAtMemoryEnabled\(enabled\);\

      \ \ \ \ \ \ \ \ //\ If\ AtMemory\ becomes\ disabled\ while\ focused\ on\ a\
      contenteditable\ element,\ hide\ the\

      \ \ \ \ \ \ \ \ //\ accessory\ to\ avoid\ displaying\ an\ empty\ bar\.\

      \ \ \ \ \ \ \ \ if\ \(mModel\.get\(IS_CONTENT_EDITABLE\)\ \&\&\ !enabled\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ hide\(\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      \ \ \ \ void\ resume\(\)\ \{\

      '
    replace: "        // Autofill suggestions are invalidated on rotation. Dismissing\
      \ all filling UI forces\n        // the user to interact with the field they\
      \ want to edit. This refreshes Autofill.\n        hideSoftKeyboard();\n    }\n\
      \n    void resume() {\n"
- description: Reaper Android physical AtMemory accessory and optional Autofill-AI
    promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
    behavior.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ TraceEvent\.begin\("ManualFillingMediator\#refreshTabs"\);\

      \ \ \ \ \ \ \ \ ManualFillingState\ state\ =\ mStateCache\.getStateFor\(mActivity\.getCurrentWebContents\(\)\);\

      \ \ \ \ \ \ \ \ state\.notifyObservers\(\);\

      \ \ \ \ \ \ \ \ updateAtMemoryEnablement\(\);\

      \ \ \ \ \ \ \ \ //\ For\ contenteditable\ fields,\ provide\ empty\ tabs\ so\
      that\ only\ the\ AtMemory\

      \ \ \ \ \ \ \ \ //\ button\ is\ displayed\ without\ clearing\ cached\ tabs\
      in\ ManualFillingState\.\

      \ \ \ \ \ \ \ \ KeyboardAccessoryData\.Tab\[\]\ tabs\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mModel\.get\(IS_CONTENT_EDITABLE\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ new\ KeyboardAccessoryData\.Tab\[0\]\

      '
    replace: "        TraceEvent.begin(\"ManualFillingMediator#refreshTabs\");\n \
      \       ManualFillingState state = mStateCache.getStateFor(mActivity.getCurrentWebContents());\n\
      \        state.notifyObservers();\n        // Contenteditable fields have no\
      \ supported fallback sheet. Keep their cached tabs\n        // intact for the\
      \ next ordinary form field, and avoid displaying an empty accessory.\n     \
      \   if (mModel.get(IS_CONTENT_EDITABLE)) hide();\n        KeyboardAccessoryData.Tab[]\
      \ tabs =\n                mModel.get(IS_CONTENT_EDITABLE)\n                \
      \        ? new KeyboardAccessoryData.Tab[0]\n"
