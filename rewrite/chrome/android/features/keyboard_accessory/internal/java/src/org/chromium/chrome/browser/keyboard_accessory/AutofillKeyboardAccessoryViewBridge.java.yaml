substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Preserve the previous ordinary acceptance branch with no AI fetch/waiting
    alternative
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ void\ suggestionAccepted\(int\ listIndex\)\ \{\

      \ \ \ \ \ \ \ \ suggestionAccepted\(listIndex,\ false\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Override\

      \ \ \ \ public\ void\ suggestionAccepted\(int\ listIndex,\ boolean\ showLoadingOnAcceptance\)\
      \{\

      \ \ \ \ \ \ \ \ mSelectedListIndex\ =\ null;\

      \ \ \ \ \ \ \ \ if\ \(mManualFillingComponent\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(showLoadingOnAcceptance\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mManualFillingComponent\.setWaitingForFetch\(true\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mManualFillingComponent\.setWaitingForFetch\(false\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mManualFillingComponent\.dismiss\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ if\ \(mNativeAutofillKeyboardAccessory\ ==\ 0\)\ return;\

      \ \ \ \ \ \ \ \ AutofillKeyboardAccessoryViewBridgeJni\.get\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.suggestionAccepted\(mNativeAutofillKeyboardAccessory,\
      listIndex\);\

      \ \ \ \ \}'
    replace: "    @Override\n    public void suggestionAccepted(int listIndex) {\n\
      \        mSelectedListIndex = null;\n        if (mManualFillingComponent !=\
      \ null) {\n            mManualFillingComponent.dismiss();\n        }\n     \
      \   if (mNativeAutofillKeyboardAccessory == 0) return;\n        AutofillKeyboardAccessoryViewBridgeJni.get()\n\
      \                .suggestionAccepted(mNativeAutofillKeyboardAccessory, listIndex);\n\
      \    }"
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Shows\ an\ Autofill\ AI\ suggestion\ details\ /\ suppression\
      confirmation\ dialog\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ title\ The\ title\ for\ the\ dialog\.\

      \ \ \ \ \ \*\ @param\ body\ The\ body\ of\ the\ dialog\.\

      \ \ \ \ \ \*\ @param\ confirmButtonText\ The\ text\ displayed\ on\ the\ negative\
      suppression\ button\ \(e\.g\.,\ "Remove\

      \ \ \ \ \ \*\ \ \ \ \ from\ Chrome"\)\.\

      \ \ \ \ \ \*\ @param\ primaryButtonText\ The\ text\ displayed\ on\ the\ primary\
      acknowledgment\ button\ \(e\.g\.,\ "Got\

      \ \ \ \ \ \*\ \ \ \ \ it"\)\.\

      \ \ \ \ \ \*/\

      \ \ \ \ @CalledByNative\

      \ \ \ \ private\ void\ showAutofillAiSuggestionDetails\(\

      \ \ \ \ \ \ \ \ \ \ \ \ @JniType\("std::u16string"\)\ String\ title,\

      \ \ \ \ \ \ \ \ \ \ \ \ @JniType\("std::u16string"\)\ String\ body,\

      \ \ \ \ \ \ \ \ \ \ \ \ @JniType\("std::u16string"\)\ String\ confirmButtonText,\

      \ \ \ \ \ \ \ \ \ \ \ \ @JniType\("std::u16string"\)\ String\ primaryButtonText\)\
      \{\

      \ \ \ \ \ \ \ \ if\ \(mManualFillingComponent\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ mManualFillingComponent\.showAutofillAiSuggestionDetails\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ title,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ body,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ confirmButtonText,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ primaryButtonText,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ this\.onAutofillAiSuppressionDialogClosed\(/\*\
      confirmed=\ \*/\ true\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ this\.onAutofillAiSuppressionDialogClosed\(/\*\
      confirmed=\ \*/\ false\)\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ void\ showAutofillAiSuggestionDetails\(int\ listIndex\)\ \{\

      \ \ \ \ \ \ \ \ mSelectedListIndex\ =\ null;\

      \ \ \ \ \ \ \ \ if\ \(mNativeAutofillKeyboardAccessory\ ==\ 0\)\ return;\

      \ \ \ \ \ \ \ \ AutofillKeyboardAccessoryViewBridgeJni\.get\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.autofillAiSuggestionDetailsRequested\(mNativeAutofillKeyboardAccessory,\
      listIndex\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ void\ openSettingsForEntityType\(@EntityTypeName\ int\ entityType\)\
      \{\

      \ \ \ \ \ \ \ \ if\ \(mNativeAutofillKeyboardAccessory\ ==\ 0\)\ return;\

      \ \ \ \ \ \ \ \ AutofillKeyboardAccessoryViewBridgeJni\.get\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.openSettingsForEntityType\(mNativeAutofillKeyboardAccessory,\
      entityType\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ private\ void\ onAutofillAiSuppressionDialogClosed\(boolean\
      confirmed\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(mNativeAutofillKeyboardAccessory\ ==\ 0\)\ return;\

      \ \ \ \ \ \ \ \ AutofillKeyboardAccessoryViewBridgeJni\.get\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.onAutofillAiSuppressionDialogClosed\(mNativeAutofillKeyboardAccessory,\
      confirmed\);\

      \ \ \ \ \}'
    replace: ''
- description: The removed AI-only fetch state no longer gates native dismiss; ordinary
    suggestion clearing stays
  regex:
