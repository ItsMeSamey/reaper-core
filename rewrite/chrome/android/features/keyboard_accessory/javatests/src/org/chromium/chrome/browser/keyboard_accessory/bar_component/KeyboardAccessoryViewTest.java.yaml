# Reaper Source330 AtMemory fixture caller/API closure; source-only retained assertions.
  - description: Reaper Android retained ordinary accessory/ManualFilling fixtures;
      remove explicitly disclosed optional-only AtMemory cases and preserve real ordinary
      filling/view assertions.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ AtomicReference<Boolean>\ clickRecorded1\ =\ new\
        AtomicReference<>\(\);\

        \ \ \ \ \ \ \ \ AtomicReference<Boolean>\ clickRecorded2\ =\ new\ AtomicReference<>\(\);\

        \ \ \ \ \ \ \ \ ThreadUtils\.runOnUiThreadBlocking\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mModel\.set\(VISIBLE,\ true\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mModel\.get\(BAR_ITEMS\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.set\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\
        BarItem\[\]\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ createAutofillBarItem\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \ \ \ \ "Johnathan",\ result\ \->\ clickRecorded1\.set\(true\)\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ createAutofillBarItem\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \ \ \ \ "Mark",\ result\ \->\ clickRecorded2\.set\(true\)\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ createSheetOpener\(/\*\ atMemoryEnabled=\ \*/\ true\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

        \

        \ \ \ \ \ \ \ \ onViewWaiting\(withText\("Johnathan"\)\)\.perform\(click\(\)\);\

        \ \ \ \ \ \ \ \ assertTrue\(clickRecorded1\.get\(\)\);\

        \

        \ \ \ \ \ \ \ \ onViewWaiting\(withText\("Mark"\)\)\.perform\(click\(\)\);\

        \ \ \ \ \ \ \ \ assertTrue\(clickRecorded2\.get\(\)\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Test\

        \ \ \ \ @MediumTest\

        '
      replace: "        AtomicReference<Boolean> clickRecorded1 = new AtomicReference<>();\n\
        \        AtomicReference<Boolean> clickRecorded2 = new AtomicReference<>();\n\
        \        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n     \
        \               mModel.set(VISIBLE, true);\n                    mModel.get(BAR_ITEMS)\n\
        \                            .set(\n                                    new\
        \ BarItem[] {\n                                        createAutofillBarItem(\n\
        \                                                \"Johnathan\", result -> clickRecorded1.set(true)),\n\
        \                                        createAutofillBarItem(\n          \
        \                                      \"Mark\", result -> clickRecorded2.set(true)),\n\
        \                                        createSheetOpener()\n             \
        \                       });\n                });\n\n        onViewWaiting(withText(\"\
        Johnathan\")).perform(click());\n        assertTrue(clickRecorded1.get());\n\
        \n        onViewWaiting(withText(\"Mark\")).perform(click());\n        assertTrue(clickRecorded2.get());\n\
        \    }\n\n    @Test\n    @MediumTest\n"
