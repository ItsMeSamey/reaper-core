# Reaper Source330 AtMemory fixture caller/API closure; source-only retained assertions.
  - description: Reaper Android retained ordinary accessory/ManualFilling fixtures;
      remove explicitly disclosed optional-only AtMemory cases and preserve real ordinary
      filling/view assertions.
    regex:
      re_pattern: 'import\ static\ org\.mockito\.Mockito\.verifyNoMoreInteractions;\

        \

        import\ static\ org\.chromium\.chrome\.browser\.keyboard_accessory\.button_group_component\.KeyboardAccessoryButtonGroupProperties\.ACTIVE_TAB;\

        import\ static\ org\.chromium\.chrome\.browser\.keyboard_accessory\.button_group_component\.KeyboardAccessoryButtonGroupProperties\.AT_MEMORY_CALLBACK;\

        import\ static\ org\.chromium\.chrome\.browser\.keyboard_accessory\.button_group_component\.KeyboardAccessoryButtonGroupProperties\.TABS;\

        \

        import\ org\.junit\.Before;\

        '
      replace: 'import static org.mockito.Mockito.verifyNoMoreInteractions;


        import static org.chromium.chrome.browser.keyboard_accessory.button_group_component.KeyboardAccessoryButtonGroupProperties.ACTIVE_TAB;

        import static org.chromium.chrome.browser.keyboard_accessory.button_group_component.KeyboardAccessoryButtonGroupProperties.TABS;


        import org.junit.Before;

        '
  - description: Reaper Android retained ordinary accessory/ManualFilling fixtures;
      remove explicitly disclosed optional-only AtMemory cases and preserve real ordinary
      filling/view assertions.
    regex:
      re_pattern: '\

        \ \ \ \ @Mock\ private\ PropertyObserver<PropertyKey>\ mMockPropertyObserver;\

        \ \ \ \ @Mock\ private\ ListObservable\.ListObserver<Void>\ mMockTabListObserver;\

        \ \ \ \ @Mock\ private\ Runnable\ mMockAtMemoryCallback;\

        \

        \ \ \ \ @Mock\

        \ \ \ \ private\ KeyboardAccessoryButtonGroupCoordinator\.AccessoryTabObserver\
        mMockAccessoryTabObserver;\

        '
      replace: "\n    @Mock private PropertyObserver<PropertyKey> mMockPropertyObserver;\n\
        \    @Mock private ListObservable.ListObserver<Void> mMockTabListObserver;\n\
        \n    @Mock\n    private KeyboardAccessoryButtonGroupCoordinator.AccessoryTabObserver\
        \ mMockAccessoryTabObserver;\n"
  - description: Reaper Android retained ordinary accessory/ManualFilling fixtures;
      remove explicitly disclosed optional-only AtMemory cases and preserve real ordinary
      filling/view assertions.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ mMediator\ =\ mCoordinator\.getMediatorForTesting\(\);\

        \ \ \ \ \ \ \ \ mModel\ =\ mCoordinator\.getModelForTesting\(\);\

        \ \ \ \ \ \ \ \ mCoordinator\.setTabObserver\(mMockAccessoryTabObserver\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Test\

        \ \ \ \ public\ void\ testSetsAtMemoryCallback\(\)\ \{\

        \ \ \ \ \ \ \ \ mCoordinator\.getAtMemoryDelegate\(\)\.setAtMemoryCallback\(mMockAtMemoryCallback\);\

        \ \ \ \ \ \ \ \ assertThat\(mModel\.get\(AT_MEMORY_CALLBACK\),\ is\(mMockAtMemoryCallback\)\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Test\

        '
      replace: "        mMediator = mCoordinator.getMediatorForTesting();\n        mModel\
        \ = mCoordinator.getModelForTesting();\n        mCoordinator.setTabObserver(mMockAccessoryTabObserver);\n\
        \    }\n\n    @Test\n"
