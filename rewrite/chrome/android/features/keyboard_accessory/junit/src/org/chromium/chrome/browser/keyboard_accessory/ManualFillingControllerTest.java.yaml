      \ \ \ \ \ \ \ \ reset\(mManualFillingComponentBridgeJniMock\);\

      \

      \ \ \ \ \ \ \ \ when\(mManualFillingComponentBridgeJniMock\.isAtMemoryEnabled\(any\(\)\)\)\.thenReturn\(false\);\

