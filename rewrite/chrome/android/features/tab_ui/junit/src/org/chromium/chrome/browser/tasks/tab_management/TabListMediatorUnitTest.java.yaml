      \ \ \ \ \ \ \ \ assertThat\(mModelList\.size\(\),\ equalTo\(2\)\);\

      \ \ \ \ \ \ \ \ mTabModelObserverCaptor\.getValue\(\)\.didRemoveTabForClosure\(mTab2\);\

      \ \ \ \ \ \ \ \ assertThat\(mModelList\.size\(\),\ equalTo\(1\)\);\

      \ \ \ \ \ \ \ \ verify\(mTab2\)\.removeObserver\(any\(\)\);\

