      \ \ \ \ \ \ \ \ updateTabAlertState\(mTab1,\ TabAlert\.PIP_PLAYING\);\

      \ \ \ \ \ \ \ \ updateTabAlertState\(mTab2,\ TabAlert\.AUDIO_PLAYING\);\

      \ \ \ \ \ \ \ \ assertEquals\(TabAlert\.PIP_PLAYING,\ mModelList\.get\(0\)\.model\.get\(TabProperties\.ALERT_STATE\)\);\

