      \ \ \ \ \ \ \ \ updateTabAlertState\(mTab2,\ TabAlert\.MEDIA_RECORDING\);\

      \ \ \ \ \ \ \ \ assertEquals\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabAlert\.MEDIA_RECORDING,\ mModelList\.get\(0\)\.model\.get\(TabProperties\.ALERT_STATE\)\);\

      \ \ \ \ \}\

