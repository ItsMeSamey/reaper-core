      \ \ \ \ \ \ \ \ updateTabAlertState\(mTab1,\ TabAlert\.NONE\);\

      \ \ \ \ \ \ \ \ assertEquals\(TabAlert\.AUDIO_MUTING,\ mModelList\.get\(0\)\.model\.get\(TabProperties\.ALERT_STATE\)\);\

