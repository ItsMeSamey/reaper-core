      \ \ \ \ \ \ \ \ assertThat\(mModelList\.size\(\),\ equalTo\(2\)\);\

      \ \ \ \ \ \ \ \ assertThat\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mModelList\.get\(0\)\.model\.get\(TabProperties\.TAB_GROUP_HEADER_ID\),\

