      \ \ \ \ public\ void\ testTabObserverReattachToUndoClosedTab\(\)\ \{\

      \ \ \ \ \ \ \ \ initAndAssertAllProperties\(\);\

      \ \ \ \ \ \ \ \ //\ Called\ twice\ in\ test\ set\ up\ due\ to\ reset\ with\ list\ \&\ adding\ tab\
