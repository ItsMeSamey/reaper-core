      \ \ \ \ private\ void\ setUpTabListMediator\(@TabListMediatorType\ int\ type,\ @TabListMode\ int\
      mode\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(mMediator\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mMediator\.resetWithListOfTabs\(null,\ null,\ false\);\

      \ \ \ \ \ \ \ \ \ \ \ \ mMediator\.destroy\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ mMediator\ =\ null;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ doNothing\(\)\.when\(mTabModel\)\.addTabGroupObserver\(mTabGroupObserverCaptor\.capture\(\)\);\

      \ \ \ \ \ \ \ \ doNothing\(\)\.when\(mTabModel\)\.addObserver\(mTabModelObserverCaptor\.capture\(\)\);\

      \

      \ \ \ \ \ \ \ \ UngroupBarStatusHandler\ handler\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ type\ ==\ TabListMediatorType\.TAB_GRID_DIALOG\ \?\ mUngroupBarStatusHandler\
      :\ null;\

      \ \ \ \ \ \ \ \ mThumbnailProvider\ =\ mode\ ==\ TabListMode\.GRID\ \?\ getTabThumbnailCallback\(\)\
      :\ null;\

      \ \ \ \ \ \ \ \ @TabComponentId\

      \ \ \ \ \ \ \ \ int\ componentId\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ type\ ==\ TabListMediatorType\.VERTICAL_TABS\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ TabComponentId\.VERTICAL_TABS\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ TabComponentId\.GRID_TAB_SWITCHER;\

      \

      \ \ \ \ \ \ \ \ @TabListLayoutType\ int\ layoutType\ =\ TabListLayoutType\.FLAT;\

      \ \ \ \ \ \ \ \ if\ \(type\ ==\ TabListMediatorType\.VERTICAL_TABS\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ layoutType\ =\ TabListLayoutType\.NESTED;\

      \ \ \ \ \ \ \ \ \}\ else\ if\ \(type\ ==\ TabListMediatorType\.TAB_SWITCHER\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ layoutType\ =\ TabListLayoutType\.GROUPED;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ //\ Reuse\ pre\-configured\ TabListConfig\ if\ it\ matches\ the\ target\ layout;\
      otherwise\

      \ \ \ \ \ \ \ \ //\ derive\ defaults\.\

      \ \ \ \ \ \ \ \ boolean\ hasMatchingConfig\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mTabListConfig\ !=\ null\ \&\&\ mTabListConfig\.layoutType\ ==\
      layoutType;\

      \ \ \ \ \ \ \ \ @UiType\

      \ \ \ \ \ \ \ \ int\ tabUiType\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ hasMatchingConfig\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ mTabListConfig\.tabUiType\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ \(mode\ ==\ TabListMode\.BOTTOM_STRIP\ \?\ UiType\.STRIP\
      :\ UiType\.TAB\);\

      \ \ \ \ \ \ \ \ boolean\ supportsMessageCards\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ hasMatchingConfig\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ mTabListConfig\.supportsMessageCards\

