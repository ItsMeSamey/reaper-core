      \ \ \ \ \ \ \ \ when\(mIncognitoTabModel\.getTabById\(id\)\)\.thenReturn\(tab\);\

      \ \ \ \ \ \ \ \ when\(tab\.getProfile\(\)\)\.thenReturn\(mProfile\);\

      \ \ \ \ \ \ \ \ return\ tab;\

