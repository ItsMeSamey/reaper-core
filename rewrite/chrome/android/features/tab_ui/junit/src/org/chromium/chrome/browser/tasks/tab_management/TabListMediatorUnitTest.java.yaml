      \ \ \ \ private\ void\ mockTabIndexes\(Tab\.\.\.\ tabs\)\ \{\

      \ \ \ \ \ \ \ \ for\ \(int\ i\ =\ 0;\ i\ <\ tabs\.length;\ i\+\+\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ Tab\ tab\ =\ tabs\[i\];\

      \ \ \ \ \ \ \ \ \ \ \ \ when\(mTabModel\.getTabAt\(i\)\)\.thenReturn\(tab\);\

      \ \ \ \ \ \ \ \ \ \ \ \ when\(mTabModel\.indexOf\(tab\)\)\.thenReturn\(i\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ when\(mTabModel\.getCount\(\)\)\.thenReturn\(tabs\.length\);\

      \ \ \ \ \}\

