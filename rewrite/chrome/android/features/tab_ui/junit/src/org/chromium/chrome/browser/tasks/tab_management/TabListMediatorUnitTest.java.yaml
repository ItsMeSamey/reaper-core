      \ \ \ \ \ \ \ \ \ \ \ \ @TabListLayoutType\ int\ layoutType\ =\ mTabListConfig\.layoutType;\

      \ \ \ \ \ \ \ \ \ \ \ \ boolean\ isCollapsed\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ layoutType\ !=\ TabListLayoutType\.NESTED\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ mTabModel\.getTabGroupCollapsed\(tabGroupId\);\

      \ \ \ \ \ \ \ \ \ \ \ \ model\.set\(TabProperties\.IS_COLLAPSED,\ isCollapsed\);\

