      \ \ \ \ public\ void\ testOnMenuItemClickedCallback_UngroupInTabSwitcher_IncognitoNoShow\(\)\ \{\

      \ \ \ \ \ \ \ \ mCurrentTabModelSupplier\.set\(mIncognitoTabModel\);\

      \ \ \ \ \ \ \ \ when\(mIncognitoTabModel\.isIncognito\(\)\)\.thenReturn\(true\);\

