      \

      \ \ \ \ \ \ \ \ int\ tabModelObserverCount\ =\ mTabModelObserverCaptor\.getAllValues\(\)\.size\(\);\

      \ \ \ \ \ \ \ \ int\ tabGroupObserverCount\ =\ mTabGroupObserverCaptor\.getAllValues\(\)\.size\(\);\

