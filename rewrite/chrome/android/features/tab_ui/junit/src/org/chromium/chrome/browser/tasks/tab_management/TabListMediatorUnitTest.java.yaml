      \ \ \ \ \ \ \ \ assertEquals\(tabModelObserverCount\ \+\ 1,\ mTabModelObserverCaptor\.getAllValues\(\)\.size\(\)\);\

      \ \ \ \ \ \ \ \ assertEquals\(tabGroupObserverCount\ \+\ 1,\ mTabGroupObserverCaptor\.getAllValues\(\)\.size\(\)\);\

