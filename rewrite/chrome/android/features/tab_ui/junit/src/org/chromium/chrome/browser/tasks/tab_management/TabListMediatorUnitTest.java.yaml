      header\.\

      \ \ \ \ \ \ \ \ assertThat\(mModelList\.size\(\),\ equalTo\(3\)\);\

      \ \ \ \ \ \ \ \ assertThat\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mModelList\.get\(0\)\.model\.get\(TabProperties\.TAB_GROUP_HEADER_ID\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ equalTo\(TAB_GROUP_ID\)\);\

