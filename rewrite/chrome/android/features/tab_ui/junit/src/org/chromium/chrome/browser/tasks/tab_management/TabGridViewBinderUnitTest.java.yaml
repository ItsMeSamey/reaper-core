- description: Container grid badge selected title color 3
  regex:
    pattern: "\n        verify(mViewGroup).setTabActionButtonTint(any());\n        verify(mViewGroup).updateActionButtonBackground(eq(true), eq(false));\n    }\n\n    @Test\n"
    replace: "\n        verify(mViewGroup).setTabActionButtonTint(any());\n        verify(mViewGroup).updateActionButtonBackground(eq(true), eq(false));\n\n        View cardView = new View(mContext);\n        cardView.setBackgroundColor(0);\n        TextView titleView = new TextView(mContext);\n        TextView badgeView = new TextView(mContext);\n        when(mViewGroup.fastFindViewById(R.id.card_view)).thenReturn(cardView);\n        when(mViewGroup.fastFindViewById(R.id.tab_title)).thenReturn(titleView);\n        when(mViewGroup.fastFindViewById(R.id.reaper_tab_container_badge)).thenReturn(badgeView);\n        when(mViewGroup.fastFindViewById(R.id.background_view))\n                .thenReturn(new ImageView(mContext));\n\n        for (boolean isIncognito : new boolean[] {false, true}) {\n            badgeView.setTextColor(0xffff00ff);\n            PropertyModel colorModel =\n                    new PropertyModel.Builder(TabProperties.ALL_KEYS_TAB_GRID)\n                            .with(TabProperties.TAB_ACTION_STATE, TabActionState.CLOSABLE)\n                            .with(TabProperties.IS_INCOGNITO, isIncognito)\n                            .with(TabProperties.IS_SELECTED, true)\n                            .with(TabProperties.TAB_GROUP_CARD_COLOR, null)\n                            .build();\n            // Initial binding must color the badge regardless of property order.\n            var processor =\n                    PropertyModelChangeProcessor.create(\n                            colorModel, mViewGroup, TabGridViewBinder::bindTab);\n            assertThat(\n                    badgeView.getCurrentTextColor(),\n                    equalTo(TabCardThemeUtil.getTitleTextColor(mContext, isIncognito, true, null)));\n            assertThat(badgeView.getCurrentTextColor(), equalTo(titleView.getCurrentTextColor()));\n\n            // A reused card must follow incremental selection and group-color changes.\n            colorModel.set(TabProperties.IS_SELECTED, false);\n            assertThat(\n                    badgeView.getCurrentTextColor(),\n                    equalTo(TabCardThemeUtil.getTitleTextColor(mContext, isIncognito, false, null)));\n            colorModel.set(TabProperties.TAB_GROUP_CARD_COLOR, TabGroupColorId.BLUE);\n            assertThat(\n                    badgeView.getCurrentTextColor(),\n                    equalTo(\n                            TabCardThemeUtil.getTitleTextColor(\n                                    mContext, isIncognito, false, TabGroupColorId.BLUE)));\n            colorModel.set(TabProperties.IS_SELECTED, true);\n            assertThat(\n                    badgeView.getCurrentTextColor(),\n                    equalTo(\n                            TabCardThemeUtil.getTitleTextColor(\n                                    mContext, isIncognito, true, TabGroupColorId.BLUE)));\n            assertThat(badgeView.getCurrentTextColor(), equalTo(titleView.getCurrentTextColor()));\n            processor.destroy();\n        }\n    }\n\n    @Test\n"
