# Retain the shared message-card text style without the excluded Feed resource bundle.
substitutions:
- description: Retain the normal-tab message-card style in the existing Tab UI resource owner
  regex:
    re_pattern: '<resources>\

      '
    replace: "<resources>\n    <style name=\"TextAppearance.ClickableButtonInverse\" parent=\"TextAppearance.Button.Text.Filled\">\n        <item name=\"android:textColor\">@macro/default_text_color_accent1</item>\n    </style>\n\n"
