substitutions:

# Reaper final Android containers UI; preserve the full current raw-pin recipe prefix.
- description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
    parent (1/1).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ android:importantForAccessibility="no"\

      \ \ \ \ \ \ \ \ android:src="@drawable/tab_strip_item_notification_bubble"\

      \ \ \ \ \ \ \ \ tools:ignore="RtlHardcoded"\ />\

      </org\.chromium\.ui\.widget\.ViewLookupCachingFrameLayout>\

      '
    replace: "        android:importantForAccessibility=\"no\"\n        android:src=\"\
      @drawable/tab_strip_item_notification_bubble\"\n        tools:ignore=\"RtlHardcoded\"\
      \ />\n    <TextView\n        android:id=\"@+id/reaper_tab_container_badge\"\n\
      \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
      wrap_content\"\n        android:minHeight=\"15dp\"\n        android:layout_gravity=\"\
      bottom\"\n        android:layout_marginHorizontal=\"3dp\"\n        android:gravity=\"\
      center\"\n        android:textSize=\"9sp\"\n        android:textColor=\"?android:attr/textColorPrimary\"\
      \n        android:singleLine=\"true\"\n        android:ellipsize=\"end\"\n \
      \       android:importantForAccessibility=\"no\"\n        android:visibility=\"\
      gone\" />\n</org.chromium.ui.widget.ViewLookupCachingFrameLayout>\n"
- description: Raise the existing Android container badge to the 11sp lint minimum while retaining scalable sp sizing and
    all layout/accessibility attributes.
  regex:
    pattern: android:textSize="9sp"
    replace: android:textSize="11sp"
  count: 1
