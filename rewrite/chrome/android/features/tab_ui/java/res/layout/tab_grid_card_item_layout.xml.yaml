substitutions:

# Reaper final Android containers UI; preserve the full current raw-pin recipe prefix.
- description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
    parent (1/3).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ android:ellipsize="none"\

      \ \ \ \ \ \ \ \ \ \ android:singleLine="true"\

      \ \ \ \ \ \ \ \ \ \ android:textAppearance="@style/TextAppearance\.TextMediumThick\.Primary"/>\

      \ \ \ \ \ \ \ \ <ImageView\

      \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/alert_indicator_icon"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:layout_height="@dimen/tab_grid_close_button_size"\

      '
    replace: "          android:ellipsize=\"none\"\n          android:singleLine=\"\
      true\"\n          android:textAppearance=\"@style/TextAppearance.TextMediumThick.Primary\"\
      />\n        <TextView\n            android:id=\"@+id/reaper_tab_container_badge\"\
      \n            android:layout_width=\"0dp\"\n            android:layout_height=\"\
      wrap_content\"\n            android:minHeight=\"18dp\"\n            android:singleLine=\"\
      true\"\n            android:ellipsize=\"end\"\n            android:textSize=\"\
      11sp\"\n            android:textColor=\"?android:attr/textColorPrimary\"\n \
      \           android:gravity=\"center_vertical\"\n            android:layout_marginHorizontal=\"\
      6dp\"\n            android:importantForAccessibility=\"no\"\n            android:visibility=\"\
      gone\"\n            app:layout_constraintTop_toBottomOf=\"@id/tab_title\"\n\
      \            app:layout_constraintStart_toStartOf=\"@id/card_view\"\n      \
      \      app:layout_constraintEnd_toEndOf=\"@id/card_view\" />\n        <ImageView\n\
      \            android:id=\"@+id/alert_indicator_icon\"\n            android:layout_height=\"\
      @dimen/tab_grid_close_button_size\"\n"
- description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
    parent (2/3).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ android:id="@\+id/tab_thumbnail"\

      \ \ \ \ \ \ \ \ \ \ android:layout_width="0dp"\

      \ \ \ \ \ \ \ \ \ \ android:layout_height="0dp"\

      \ \ \ \ \ \ \ \ \ \ app:layout_constraintTop_toBottomOf="@id/tab_title"\

      \ \ \ \ \ \ \ \ \ \ app:layout_constraintBottom_toBottomOf="@id/card_view"\

      \ \ \ \ \ \ \ \ \ \ app:layout_constraintStart_toStartOf="@id/card_view"\

      \ \ \ \ \ \ \ \ \ \ app:layout_constraintEnd_toEndOf="@id/card_view"\

      '
    replace: "          android:id=\"@+id/tab_thumbnail\"\n          android:layout_width=\"\
      0dp\"\n          android:layout_height=\"0dp\"\n          app:layout_constraintTop_toBottomOf=\"\
      @id/reaper_tab_container_badge\"\n          app:layout_constraintBottom_toBottomOf=\"\
      @id/card_view\"\n          app:layout_constraintStart_toStartOf=\"@id/card_view\"\
      \n          app:layout_constraintEnd_toEndOf=\"@id/card_view\"\n"
- description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
    parent (3/3).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ <!\-\-\ Legacy\ layout\ for\ price\ cards\.\ To\
      be\ removed\ in\ favor\ of\ tab_card_label\.\ \-\->\

      \ \ \ \ \ \ \ \ <org\.chromium\.chrome\.browser\.tasks\.tab_management\.PriceCardView\

      \ \ \ \ \ \ \ \ \ \ android:id="@\+id/price_info_box_outer"\

      \ \ \ \ \ \ \ \ \ \ app:layout_constraintTop_toBottomOf="@id/tab_title"\

      \ \ \ \ \ \ \ \ \ \ app:layout_constraintStart_toStartOf="@id/card_view"\

      \ \ \ \ \ \ \ \ \ \ app:layout_constraintEnd_toEndOf="@id/card_view"\

      \ \ \ \ \ \ \ \ \ \ android:background="@drawable/price_card_scrim"\

      '
    replace: "        <!-- Legacy layout for price cards. To be removed in favor of\
      \ tab_card_label. -->\n        <org.chromium.chrome.browser.tasks.tab_management.PriceCardView\n\
      \          android:id=\"@+id/price_info_box_outer\"\n          app:layout_constraintTop_toBottomOf=\"\
      @id/reaper_tab_container_badge\"\n          app:layout_constraintStart_toStartOf=\"\
      @id/card_view\"\n          app:layout_constraintEnd_toEndOf=\"@id/card_view\"\
      \n          android:background=\"@drawable/price_card_scrim\"\n"
- description: Remove standalone legacy price card child
  regex:
    pattern: "        <!-- Legacy layout for price cards. To be removed in favor of tab_card_label. -->\n        <org.chromium.chrome.browser.tasks.tab_management.PriceCardView\n\
      \          android:id=\"@+id/price_info_box_outer\"\n          app:layout_constraintTop_toBottomOf=\"@id/reaper_tab_container_badge\"\
      \n          app:layout_constraintStart_toStartOf=\"@id/card_view\"\n          app:layout_constraintEnd_toEndOf=\"@id/card_view\"\
      \n          android:background=\"@drawable/price_card_scrim\"\n          android:layout_width=\"0dp\"\n          android:layout_height=\"\
      56dp\"\n          android:layout_marginStart=\"4dp\"\n          android:visibility=\"gone\"/>\n\n"
    replace: ''
  count: 1
- description: Retain ordinary label stub wording
  regex:
    pattern: '        <!-- New layout for labels including activity updates and price cards. -->

      '
    replace: '        <!-- Stub for ordinary tab-card labels including activity updates. -->

      '
  count: 1
