substitutions:

# Reaper final Android containers UI; preserve the full current raw-pin recipe prefix.
- description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
    parent (1/1).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ android:textAlignment="viewStart"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:textAppearance="@style/TextAppearance\.TextMediumThick\.Primary"\

      \ \ \ \ \ \ \ \ \ \ \ \ app:layout_constraintBottom_toBottomOf="parent"\

      \ \ \ \ \ \ \ \ \ \ \ \ app:layout_constraintEnd_toStartOf="@id/trailing_icon"\

      \ \ \ \ \ \ \ \ \ \ \ \ app:layout_constraintStart_toEndOf="@id/tab_favicon"\

      \ \ \ \ \ \ \ \ \ \ \ \ app:layout_constraintTop_toTopOf="parent"\ />\

      \

      \ \ \ \ \ \ \ \ <ImageView\

      \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/trailing_icon"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:layout_width="@dimen/pinned_tab_strip_item_icon_size"\

      '
    replace: "            android:textAlignment=\"viewStart\"\n            android:textAppearance=\"\
      @style/TextAppearance.TextMediumThick.Primary\"\n            app:layout_constraintBottom_toBottomOf=\"\
      parent\"\n            app:layout_constraintEnd_toStartOf=\"@id/reaper_tab_container_badge\"\
      \n            app:layout_constraintStart_toEndOf=\"@id/tab_favicon\"\n     \
      \       app:layout_constraintTop_toTopOf=\"parent\" />\n\n        <TextView\n\
      \            android:id=\"@+id/reaper_tab_container_badge\"\n            android:layout_width=\"\
      wrap_content\"\n            android:layout_height=\"wrap_content\"\n       \
      \     android:minHeight=\"20dp\"\n            android:maxWidth=\"80dp\"\n  \
      \          android:singleLine=\"true\"\n            android:ellipsize=\"end\"\
      \n            android:textSize=\"10sp\"\n            android:textColor=\"?android:attr/textColorPrimary\"\
      \n            android:gravity=\"center_vertical\"\n            android:layout_marginHorizontal=\"\
      4dp\"\n            android:importantForAccessibility=\"no\"\n            android:visibility=\"\
      gone\"\n            app:layout_constraintEnd_toStartOf=\"@id/trailing_icon\"\
      \n            app:layout_constraintTop_toTopOf=\"parent\"\n            app:layout_constraintBottom_toBottomOf=\"\
      parent\" />\n        <ImageView\n            android:id=\"@+id/trailing_icon\"\
      \n            android:layout_width=\"@dimen/pinned_tab_strip_item_icon_size\"\
      \n"
- description: Raise the existing Android container badge to the 11sp lint minimum while retaining scalable sp sizing and
    all layout/accessibility attributes.
  regex:
    pattern: android:textSize="10sp"
    replace: android:textSize="11sp"
  count: 1
