substitutions:
- description: Remove exact Actor-only actuation_spark view and its dedicated resource
    references; ordinary loading/alerts remain.
  regex:
    re_pattern: '\ \ \ \ <!\-\-\ Actuation\ Indicator\ \(Cursor\ Spark\)\ \-\->\

      \ \ \ \ <ImageView\

      \ \ \ \ \ \ \ \ android:id="@\+id/actuation_spark"\

      \ \ \ \ \ \ \ \ android:layout_width="@dimen/vertical_tab_item_actuation_icon_size"\

      \ \ \ \ \ \ \ \ android:layout_height="@dimen/vertical_tab_item_actuation_icon_size"\

      \ \ \ \ \ \ \ \ android:scaleType="fitCenter"\

      \ \ \ \ \ \ \ \ android:padding="@dimen/vertical_tab_item_actuation_icon_padding"\

      \ \ \ \ \ \ \ \ app:layout_constraintEnd_toStartOf="@id/alert_indicator_icon"\

      \ \ \ \ \ \ \ \ app:layout_constraintTop_toTopOf="parent"\

      \ \ \ \ \ \ \ \ app:layout_constraintBottom_toBottomOf="parent"\

      \ \ \ \ \ \ \ \ android:layout_marginEnd="@dimen/vertical_tab_item_alert_indicator_margin_end"\

      \ \ \ \ \ \ \ \ android:src="@drawable/ic_arrow_selector_spark_24dp"\

      \ \ \ \ \ \ \ \ app:tint="@macro/default_icon_color_accent1"\

      \ \ \ \ \ \ \ \ android:visibility="gone"\

      \ \ \ \ \ \ \ \ android:importantForAccessibility="no"\ />\

      '
    replace: ''
- description: Remove exact Actor-only actuation_spinner view and its dedicated resource
    references; ordinary loading/alerts remain.
  regex:
    re_pattern: '\ \ \ \ <!\-\-\ Actuation\ Spinner\ \(Ring\ Overlay\)\ \-\->\

      \ \ \ \ <ImageView\

      \ \ \ \ \ \ \ \ android:id="@\+id/actuation_spinner"\

      \ \ \ \ \ \ \ \ android:layout_width="@dimen/vertical_tab_item_actuation_icon_size"\

      \ \ \ \ \ \ \ \ android:layout_height="@dimen/vertical_tab_item_actuation_icon_size"\

      \ \ \ \ \ \ \ \ app:layout_constraintStart_toStartOf="@id/actuation_spark"\

      \ \ \ \ \ \ \ \ app:layout_constraintEnd_toEndOf="@id/actuation_spark"\

      \ \ \ \ \ \ \ \ app:layout_constraintTop_toTopOf="@id/actuation_spark"\

      \ \ \ \ \ \ \ \ app:layout_constraintBottom_toBottomOf="@id/actuation_spark"\

      \ \ \ \ \ \ \ \ android:src="@drawable/tab_indicator_spinner"\

      \ \ \ \ \ \ \ \ app:tint="@macro/default_icon_color_accent1"\

      \ \ \ \ \ \ \ \ android:visibility="gone"\

      \ \ \ \ \ \ \ \ android:importantForAccessibility="no"\ />\

      '
    replace: ''
- description: Preserve ordinary title constraint at the existing standard alert control
    after Actor node removal.
  regex:
    re_pattern: app:layout_constraintEnd_toStartOf="@id/actuation_spark"
    replace: app:layout_constraintEnd_toStartOf="@id/alert_indicator_icon"

# Reaper final Android containers UI; preserve the full current raw-pin recipe prefix.
- description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
    parent (1/2).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ app:layout_constrainedWidth="true"\

      \ \ \ \ \ \ \ \ android:layout_height="wrap_content"\

      \ \ \ \ \ \ \ \ app:layout_constraintStart_toEndOf="@id/favicon_container"\

      \ \ \ \ \ \ \ \ app:layout_constraintEnd_toStartOf="@id/alert_indicator_icon"\

      \ \ \ \ \ \ \ \ app:layout_constraintTop_toTopOf="parent"\

      \ \ \ \ \ \ \ \ app:layout_constraintBottom_toBottomOf="parent"\

      \ \ \ \ \ \ \ \ android:layout_marginStart="@dimen/vertical_tab_item_favicon_margin_end"\

      '
    replace: "        app:layout_constrainedWidth=\"true\"\n        android:layout_height=\"\
      wrap_content\"\n        app:layout_constraintStart_toEndOf=\"@id/favicon_container\"\
      \n        app:layout_constraintEnd_toStartOf=\"@id/reaper_tab_container_badge\"\
      \n        app:layout_constraintTop_toTopOf=\"parent\"\n        app:layout_constraintBottom_toBottomOf=\"\
      parent\"\n        android:layout_marginStart=\"@dimen/vertical_tab_item_favicon_margin_end\"\
      \n"
- description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
    parent (2/2).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ android:singleLine="true"\

      \ \ \ \ \ \ \ \ android:ellipsize="end"\

      \ \ \ \ \ \ \ \ android:textAppearance="@style/TextAppearance\.TextMedium\.Primary"\
      />\

      \

      \

      \

      '
    replace: "        android:singleLine=\"true\"\n        android:ellipsize=\"end\"\
      \n        android:textAppearance=\"@style/TextAppearance.TextMedium.Primary\"\
      \ />\n\n    <TextView\n        android:id=\"@+id/reaper_tab_container_badge\"\
      \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
      wrap_content\"\n        android:minHeight=\"20dp\"\n        android:maxWidth=\"\
      80dp\"\n        android:singleLine=\"true\"\n        android:ellipsize=\"end\"\
      \n        android:textSize=\"10sp\"\n        android:textColor=\"?android:attr/textColorPrimary\"\
      \n        android:gravity=\"center_vertical\"\n        android:layout_marginHorizontal=\"\
