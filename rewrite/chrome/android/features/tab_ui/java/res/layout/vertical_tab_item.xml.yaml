      gone\"\n        app:layout_constraintEnd_toStartOf=\"@id/alert_indicator_icon\"\
      \n        app:layout_constraintTop_toTopOf=\"parent\"\n        app:layout_constraintBottom_toBottomOf=\"\
      parent\" />\n\n\n\n"
