substitutions:

# Reaper final Android containers UI; preserve the full current raw-pin recipe prefix.
- description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
    parent (1/1).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ android:textAppearance="@style/TextAppearance\.TextMedium\.Primary"\

      \ \ \ \ \ \ \ \ android:importantForAccessibility="no"\ />\

      \

      \ \ \ \ <!\-\-\ Three\-dot\ menu\ button\ \-\->\

      \ \ \ \ <ImageView\

      \ \ \ \ \ \ \ \ android:id="@\+id/menu_button"\

      '
    replace: "        android:textAppearance=\"@style/TextAppearance.TextMedium.Primary\"\
      \n        android:importantForAccessibility=\"no\" />\n\n    <TextView\n   \
      \     android:id=\"@+id/reaper_tab_container_badge\"\n        android:layout_width=\"\
      wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:minHeight=\"\
      20dp\"\n        android:maxWidth=\"100dp\"\n        android:gravity=\"center_vertical\"\
      \n        android:singleLine=\"true\"\n        android:ellipsize=\"end\"\n \
      \       android:textSize=\"10sp\"\n        android:textColor=\"?android:attr/textColorPrimary\"\
      \n        android:importantForAccessibility=\"no\"\n        android:visibility=\"\
      gone\" />\n\n    <!-- Three-dot menu button -->\n    <ImageView\n        android:id=\"\
      @+id/menu_button\"\n"
- description: Raise the existing Android container badge to the 11sp lint minimum while retaining scalable sp sizing and
    all layout/accessibility attributes.
  regex:
    pattern: android:textSize="10sp"
    replace: android:textSize="11sp"
  count: 1
