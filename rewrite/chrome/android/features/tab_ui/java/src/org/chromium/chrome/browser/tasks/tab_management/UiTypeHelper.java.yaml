substitutions:
- description: Remove price type validation
  regex:
    pattern: '                    UiType.PRICE_MESSAGE,

      '
    replace: ''
  count: 1
- description: Remove price type conversion
  regex:
    pattern: '            case MessageType.PRICE_MESSAGE -> UiType.PRICE_MESSAGE;

      '
    replace: ''
  count: 1
- description: Preserve remaining message type threshold
  regex:
    pattern: return type >= UiType.PRICE_MESSAGE;
    replace: return type >= UiType.INCOGNITO_REAUTH_PROMO_MESSAGE;
  count: 1
- description: Preserve ordinary large-message type
  regex:
    pattern: return type == UiType.PRICE_MESSAGE || type == UiType.INCOGNITO_REAUTH_PROMO_MESSAGE;
    replace: return type == UiType.INCOGNITO_REAUTH_PROMO_MESSAGE;
  count: 1
