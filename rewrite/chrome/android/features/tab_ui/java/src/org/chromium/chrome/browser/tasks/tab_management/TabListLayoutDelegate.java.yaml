substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove exclusive AI implementation import UiTabState.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController\.UiTabState;\

        '
      replace: ''
  - description: Remove Actor-only extension point entirely, rather than leaving a no-op
      service hook.
    regex:
      re_pattern: '\ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Handles\ layout\-specific\ UI\ model\ updates\ when\ a\ tab''s\
        Actor\ UI\ state\ changes\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ updatedTab\ The\ \{@link\ Tab\}\ whose\ Actor\ UI\ state\
        changed\.\

        \ \ \ \ \ \*\ @param\ state\ The\ new\ \{@link\ UiTabState\}\.\

        \ \ \ \ \ \*/\

        \ \ \ \ void\ onUiTabStateChanged\(Tab\ updatedTab,\ UiTabState\ state\)\ \{\}\

        '
      replace: ''
