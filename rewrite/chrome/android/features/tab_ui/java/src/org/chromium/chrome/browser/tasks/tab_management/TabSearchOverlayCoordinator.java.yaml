substitutions:

# Reaper Android ordinary Omnibox caller closure after physical AI purge.
  - description: Remove product-only interface dependency without introducing a replacement
      interface
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.omnibox\.fusebox\.FuseboxControls;\

        '
      replace: ''
  - description: Retain a real late-bound end-session callback to preserve toolbar lifecycle/readiness/current-stub
      guards
    regex:
      re_pattern: \ \ \ \ private\ final\ @Nullable\ FuseboxControls\ mFuseboxControls;
      replace: '    private final @Nullable Runnable mEndOmniboxInput;'
  - description: Narrow to the actual sole ordinary operation needed by Tab Search
    regex:
      re_pattern: \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ FuseboxControls\ fuseboxControls\)\
        \{
      replace: '            @Nullable Runnable endOmniboxInput) {'
  - description: Store the real optional callback, not a captured OmniboxStub
    regex:
      re_pattern: \ \ \ \ \ \ \ \ mFuseboxControls\ =\ fuseboxControls;
      replace: '        mEndOmniboxInput = endOmniboxInput;'
  - description: Preserve conditional end-session invocation and ordering after show/readiness
      guard
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(mFuseboxControls\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mFuseboxControls\.endFuseboxInput\(\);\

        \ \ \ \ \ \ \ \ \}'
      replace: "        if (mEndOmniboxInput != null) {\n            mEndOmniboxInput.run();\n\
        \        }"
  - description: Describe retained ordinary session behavior
    regex:
      re_pattern: any\ active\ Omnibox/Fusebox\ session
      replace: any active Omnibox session
