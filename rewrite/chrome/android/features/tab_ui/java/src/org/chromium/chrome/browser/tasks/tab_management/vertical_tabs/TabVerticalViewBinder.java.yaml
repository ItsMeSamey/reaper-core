substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove exclusive AI implementation import UiTabState.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController\.UiTabState;\

        '
      replace: ''
  - description: Remove exclusive AI implementation import TabIndicatorStatus.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.TabIndicatorStatus;\

        '
      replace: ''
  - description: Remove typed Actor property branch.
    regex:
      re_pattern: '\ else\ if\ \(TabProperties\.ACTOR_UI_STATE\ ==\ propertyKey\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ updateIcons\(model,\ view\);\

        \ \ \ \ \ \ \ \ \ \ \ \ updateContentDescription\(model,\ view\);\

        \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove Glic property branch.
    regex:
      re_pattern: '\ else\ if\ \(TabProperties\.IS_GLIC_ACTIVE\ ==\ propertyKey\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ updateGlicIndicatorBar\(model,\ view\);\

        \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove dedicated AI indicator view lookup/rendering.
    regex:
      re_pattern: '\ \ \ \ /\*\*\ Updates\ the\ visibility\ of\ the\ Glic\ indicator\
        bar\ on\ the\ tab\ row\.\ \*/\

        \ \ \ \ private\ static\ void\ updateGlicIndicatorBar\(PropertyModel\ model,\
        View\ view\)\ \{\

        \ \ \ \ \ \ \ \ View\ glicIndicatorView\ =\ view\.findViewById\(R\.id\.ai_indicator\);\

        \ \ \ \ \ \ \ \ if\ \(glicIndicatorView\ ==\ null\)\ return;\

        \

        \ \ \ \ \ \ \ \ boolean\ isGlicActive\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ model\.containsKey\(TabProperties\.IS_GLIC_ACTIVE\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ model\.get\(TabProperties\.IS_GLIC_ACTIVE\);\

        \ \ \ \ \ \ \ \ glicIndicatorView\.setVisibility\(isGlicActive\ \?\ View\.VISIBLE\
        :\ View\.GONE\);\

        \ \ \ \ \}\

        '
      replace: ''
  - description: Remove actual Actor spinner animation/construction/cancellation surface.
    regex:
      re_pattern: '\ \ \ \ private\ static\ void\ updateActorAnimations\(\

        \ \ \ \ \ \ \ \ \ \ \ \ PropertyModel\ model,\

        \ \ \ \ \ \ \ \ \ \ \ \ View\ actuationSpark,\

        \ \ \ \ \ \ \ \ \ \ \ \ ImageView\ actuationSpinner,\

        \ \ \ \ \ \ \ \ \ \ \ \ boolean\ actorActuationWanted\)\ \{\

        \ \ \ \ \ \ \ \ @Nullable\ UiTabState\ state\ =\ model\.get\(TabProperties\.ACTOR_UI_STATE\);\

        \ \ \ \ \ \ \ \ boolean\ isDynamic\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ actorActuationWanted\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ state\ !=\ null\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ state\.tabIndicator\ ==\
        TabIndicatorStatus\.DYNAMIC;\

        \

        \ \ \ \ \ \ \ \ ObjectAnimator\ animator\ =\ \(ObjectAnimator\)\ actuationSpinner\.getTag\(R\.id\.actuation_spinner\);\

        \

        \ \ \ \ \ \ \ \ if\ \(isDynamic\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ actuationSpark\.setVisibility\(View\.VISIBLE\);\

        \ \ \ \ \ \ \ \ \ \ \ \ actuationSpinner\.setVisibility\(View\.VISIBLE\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(animator\ ==\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ animator\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ObjectAnimator\.ofFloat\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ actuationSpinner,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ View\.ROTATION,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 0f,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ACTUATION_SPINNER_ROTATION_DEGREES\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ animator\.setDuration\(ACTUATION_SPINNER_DURATION_MS\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ animator\.setRepeatCount\(ObjectAnimator\.INFINITE\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ animator\.setInterpolator\(new\ LinearInterpolator\(\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ actuationSpinner\.setTag\(R\.id\.actuation_spinner,\
        animator\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Cancel\ the\ animator\ when\ the\ view\
        is\ recycled\ to\ prevent\ infinite\ background\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ execution\ and\ memory\ leaks\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ViewUtils\.cancelAnimatorOnDetach\(actuationSpinner,\
        R\.id\.actuation_spinner\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!animator\.isRunning\(\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ animator\.start\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}\ else\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(animator\ !=\ null\ \&\&\ animator\.isRunning\(\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ animator\.cancel\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ actuationSpark\.setVisibility\(View\.GONE\);\

        \ \ \ \ \ \ \ \ \ \ \ \ actuationSpinner\.setVisibility\(View\.GONE\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

        '
      replace: ''
  - description: Remove actual Actor-only icon view lookups.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ View\ actuationSpark\ =\ view\.findViewById\(R\.id\.actuation_spark\);\

        \ \ \ \ \ \ \ \ ImageView\ actuationSpinner\ =\ view\.findViewById\(R\.id\.actuation_spinner\);\

        '
      replace: ''
  - description: Remove actual Actor wanted-state calculation.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ @Nullable\ UiTabState\ actorState\ =\ model\.get\(TabProperties\.ACTOR_UI_STATE\);\

        \ \ \ \ \ \ \ \ boolean\ actorActuationWanted\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ actuationSpark\ !=\ null\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ actuationSpinner\ !=\
        null\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ TabListViewBinderUtils\.isActorActive\(actorState\);\

        '
      replace: ''
  - description: Remove Actor-only suppression assignments from normal icon priority.
    count: 2
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ actorActuationWanted\ =\ false;\

        '
      replace: ''
  - description: Remove AI-only priority branch; action/recording/sharing/normal alert/loading/favicon
      priority remains.
    regex:
      re_pattern: '\ else\ if\ \(actorActuationWanted\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ alertWanted\ =\ false;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ loadingWanted\ =\ false;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ faviconWanted\ =\ false;\

        \ \ \ \ \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove actual Actor animation/rendering and layout constraints.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ //\ Actor\ Actuation\ Indicator\ Icons\

        \ \ \ \ \ \ \ \ if\ \(actuationSpark\ !=\ null\ \&\&\ actuationSpinner\ !=\
        null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ updateActorAnimations\(model,\ actuationSpark,\ actuationSpinner,\
        actorActuationWanted\);\

        \ \ \ \ \ \ \ \ \ \ \ \ updateViewConstraints\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ actuationSpark,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isIconCompact,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ UNSET,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.id\.alert_indicator_icon,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ UNSET,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ marginStartDimenId=\ \*/\ 0,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ marginEndDimenId=\ \*/\ R\.dimen\.vertical_tab_item_alert_indicator_margin_end\);\

        \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove AI-only accessibility title augmentation; normal title/pinned/media
      description remains.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ UiTabState\ actorState\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ model\.containsKey\(TabProperties\.ACTOR_UI_STATE\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ model\.get\(TabProperties\.ACTOR_UI_STATE\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ null;\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(TabListViewBinderUtils\.isActorActive\(actorState\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Appends\ "\-\ Gemini\ is\ working\ on\ your\
        task\.\.\."\ to\ the\ title\ when\ Actor\ is\ active\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ title\ =\ context\.getString\(R\.string\.tab_ax_label_actor_accessing,\
        title\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        '
      replace: ''
  - description: Document actual retained ordinary icon priority.
    regex:
      re_pattern: '\ \ \ \ //\ Icons\ priority\ when\ rail\ is\ collapsed:\ action\
        >\ recording/sharing\ alert\ >\ ai\ actuation\ >\

        \ \ \ \ //\ standard\ alert\ >\ loading\ >\ favicon'
      replace: "    // Icons priority when rail is collapsed: action > recording/sharing\
        \ alert > standard alert\n    // > loading > favicon"
  - description: Document actual retained ordinary collapsed priority.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ //\ Priority:\ Close\ >\ Recording/Sharing\ Alert\
        >\ AI\ Actuation\ >\ Standard\ Alert\ >\

        \ \ \ \ \ \ \ \ //\ Loading/Favicon\.'
      replace: '        // Priority: Close > Recording/Sharing Alert > Standard Alert
        > Loading/Favicon.'
  - description: Document ordinary accessibility content without product augmentation.
    regex:
      re_pattern: \ \ \ \ \ \*\ \{@code\ "<Title>\ \[\ \-\ Gemini\ is\ working\.\.\.\],\
        \[Pinned\]\ \[Media\]\ Tab"\}\.
      replace: '     * {@code "<Title>, [Pinned] [Media] Tab"}.'
  - description: Remove Actor-only animation constants.
    regex:
      re_pattern: '\ \ \ \ private\ static\ final\ float\ ACTUATION_SPINNER_ROTATION_DEGREES\
        =\ 360f;\

        '
      replace: ''
  - description: Remove Actor-only animation constants.
    regex:
      re_pattern: '\ \ \ \ private\ static\ final\ long\ ACTUATION_SPINNER_DURATION_MS\
        =\ 2000L;\

        '
      replace: ''
  - description: Remove unused exclusive Actor animation import ObjectAnimator.
    regex:
      re_pattern: 'import\ android\.animation\.ObjectAnimator;\

        '
      replace: ''
  - description: Remove unused exclusive Actor animation import LinearInterpolator.
    regex:
      re_pattern: 'import\ android\.view\.animation\.LinearInterpolator;\

        '
      replace: ''

# Reaper final Android containers UI; preserve the full current raw-pin recipe prefix.
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (1/3).
    regex:
      re_pattern: 'import\ org\.chromium\.base\.metrics\.RecordUserAction;\

        import\ org\.chromium\.build\.annotations\.NullMarked;\

        import\ org\.chromium\.build\.annotations\.Nullable;\

        import\ org\.chromium\.chrome\.browser\.incognito\.IncognitoUtils;\

        import\ org\.chromium\.chrome\.browser\.tab\.TabUtils;\

        import\ org\.chromium\.chrome\.browser\.tab_ui\.TabCardThemeUtil;\

        '
      replace: 'import org.chromium.base.metrics.RecordUserAction;

        import org.chromium.build.annotations.NullMarked;

        import org.chromium.build.annotations.Nullable;

        import org.chromium.chrome.browser.containers.ContainerTabBadge;

        import org.chromium.chrome.browser.incognito.IncognitoUtils;

        import org.chromium.chrome.browser.tab.TabUtils;

        import org.chromium.chrome.browser.tab_ui.TabCardThemeUtil;

        '
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (2/3).
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ //\ RecyclerView''s\ onInterceptTouchEvent\.\

        \ \ \ \ \ \ \ \ view\.setOnContextClickListener\(v\ \->\ true\);\

        \

        \ \ \ \ \ \ \ \ if\ \(TabProperties\.FAVICON_FETCHER\ ==\ propertyKey\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ updateFaviconImage\(model,\ view\);\

        \ \ \ \ \ \ \ \ \}\ else\ if\ \(TabProperties\.IS_LOADING\ ==\ propertyKey\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ updateIcons\(model,\ view\);\

        '
      replace: "        // RecyclerView's onInterceptTouchEvent.\n        view.setOnContextClickListener(v\
        \ -> true);\n\n        if (TabProperties.CONTAINER_BADGE == propertyKey\n  \
        \              || TabProperties.IS_INCOGNITO == propertyKey\n              \
        \  || TabProperties.RAIL_COLLAPSE_STATE == propertyKey) {\n            ContainerTabBadge.bind(\n\
        \                    view,\n                    TabListViewBinderUtils.getContainerBadge(model),\n\
        \                    model.get(TabProperties.RAIL_COLLAPSE_STATE) == RailCollapseState.COLLAPSED);\n\
        \            updateContentDescription(model, view);\n        } else if (TabProperties.FAVICON_FETCHER\
        \ == propertyKey) {\n            updateFaviconImage(model, view);\n        }\
        \ else if (TabProperties.IS_LOADING == propertyKey) {\n            updateIcons(model,\
        \ view);\n"
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (3/3).
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabListViewBinderUtils\.getTabContentDescriptionStringId\(isPinned,\
        alertState\);\

        \ \ \ \ \ \ \ \ \ \ \ \ contentDescriptionString\ =\ context\.getString\(stringRes,\
        title\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ view\.setContentDescription\(contentDescriptionString\);\

        \ \ \ \ \}\

        \

        \ \ \ \ //\ Row\-Specific\ Layout\ Geometry\ \&\ Rotation\ Helpers\

        '
      replace: "                    TabListViewBinderUtils.getTabContentDescriptionStringId(isPinned,\
        \ alertState);\n            contentDescriptionString = context.getString(stringRes,\
        \ title);\n        }\n        view.setContentDescription(\n                ContainerTabBadge.appendDescription(\n\
        \                        contentDescriptionString, TabListViewBinderUtils.getContainerBadge(model)));\n\
        \    }\n\n    // Row-Specific Layout Geometry & Rotation Helpers\n"
