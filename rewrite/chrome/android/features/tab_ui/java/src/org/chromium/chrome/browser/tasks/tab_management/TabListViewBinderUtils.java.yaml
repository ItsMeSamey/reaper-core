substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove exclusive AI implementation import UiTabState.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController\.UiTabState;\

        '
      replace: ''
  - description: Remove exclusive AI implementation import TabIndicatorStatus.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.TabIndicatorStatus;\

        '
      replace: ''
  - description: Remove Actor-only visibility predicate.
    regex:
      re_pattern: '\ \ \ \ /\*\*\ Returns\ whether\ an\ actor\ indicator\ is\ active\
        for\ the\ given\ UI\ state\.\ \*/\

        \ \ \ \ public\ static\ boolean\ isActorActive\(@Nullable\ UiTabState\ state\)\
        \{\

        \ \ \ \ \ \ \ \ return\ state\ !=\ null\ \&\&\ state\.tabIndicator\ !=\ TabIndicatorStatus\.NONE;\

        \ \ \ \ \}\

        '
      replace: ''
  - description: Remove actual Actor indicator/property dispatch.
    regex:
      re_pattern: '\ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Resolves\ the\ ACTOR_UI_STATE\ and\ updates\ the\ accessibility\
        content\ description\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ model\ the\ model\ containing\ the\ tab\ properties\.\

        \ \ \ \ \ \*\ @param\ view\ the\ View\ to\ receive\ the\ accessibility\ content\
        description\.\

        \ \ \ \ \ \*\ @return\ true\ if\ the\ actor\ indicator\ should\ be\ visible,\
        false\ otherwise\.\

        \ \ \ \ \ \*/\

        \ \ \ \ public\ static\ boolean\ setupActorIndicator\(PropertyModel\ model,\
        View\ view\)\ \{\

        \ \ \ \ \ \ \ \ @Nullable\ UiTabState\ state\ =\ model\.get\(TabProperties\.ACTOR_UI_STATE\);\

        \ \ \ \ \ \ \ \ boolean\ shouldBeVisible\ =\ isActorActive\(state\);\

        \ \ \ \ \ \ \ \ updateIndicatorAccessibilityDescription\(model,\ view\);\

        \ \ \ \ \ \ \ \ return\ shouldBeVisible;\

        \ \ \ \ \}\

        '
      replace: ''
  - description: Remove AI-only accessibility augmentation; normal content-description
      property binding remains.
    regex:
      re_pattern: '\ \ \ \ private\ static\ void\ updateIndicatorAccessibilityDescription\(PropertyModel\
        model,\ View\ view\)\ \{\

        \ \ \ \ \ \ \ \ @Nullable\ UiTabState\ actorState\ =\ model\.get\(TabProperties\.ACTOR_UI_STATE\);\

        \ \ \ \ \ \ \ \ boolean\ isActorActive\ =\ isActorActive\(actorState\);\

        \

        \ \ \ \ \ \ \ \ if\ \(isActorActive\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ String\ title\ =\ model\.get\(TabProperties\.TITLE\);\

        \ \ \ \ \ \ \ \ \ \ \ \ String\ accessibilityDesc\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ view\.getResources\(\)\.getString\(R\.string\.tab_ax_label_actor_accessing,\
        title\);\

        \ \ \ \ \ \ \ \ \ \ \ \ view\.setContentDescription\(accessibilityDesc\);\

        \ \ \ \ \ \ \ \ \}\ else\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(model\.containsKey\(TabProperties\.CONTENT_DESCRIPTION_TEXT_RESOLVER\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ model\.get\(TabProperties\.CONTENT_DESCRIPTION_TEXT_RESOLVER\)\
        !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ updateContentDescription\(model,\ view\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ if\ \(model\.containsKey\(TabProperties\.TITLE\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ view\.setContentDescription\(model\.get\(TabProperties\.TITLE\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

        '
      replace: ''

# Reaper final Android containers UI; preserve the full current raw-pin recipe prefix.
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (1/2).
    regex:
      re_pattern: '\

        import\ org\.chromium\.build\.annotations\.NullMarked;\

        import\ org\.chromium\.build\.annotations\.Nullable;\

        import\ org\.chromium\.chrome\.browser\.tab_ui\.TabListFaviconProvider\.TabFaviconFetcher;\

        import\ org\.chromium\.chrome\.tab_ui\.R;\

        import\ org\.chromium\.components\.browser_ui\.util\.TextResolver;\

        '
      replace: '

        import org.chromium.build.annotations.NullMarked;

        import org.chromium.build.annotations.Nullable;

        import org.chromium.chrome.browser.containers.ContainerTabBadge;

        import org.chromium.chrome.browser.tab_ui.TabListFaviconProvider.TabFaviconFetcher;

        import org.chromium.chrome.tab_ui.R;

        import org.chromium.components.browser_ui.util.TextResolver;

        '
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (2/2).
    regex:
      re_pattern: '\ \ \ \ \ \*\ @param\ model\ the\ model\ containing\ the\ tab\ properties\.\

        \ \ \ \ \ \*\ @param\ view\ the\ View\ to\ receive\ the\ accessibility\ content\
        description\.\

        \ \ \ \ \ \*/\

        \ \ \ \ public\ static\ void\ updateContentDescription\(PropertyModel\ model,\
        View\ view\)\ \{\

        \ \ \ \ \ \ \ \ @Nullable\ TextResolver\ contentDescriptionTextResolver\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ model\.get\(TabProperties\.CONTENT_DESCRIPTION_TEXT_RESOLVER\);\

        \ \ \ \ \ \ \ \ @Nullable\ CharSequence\ contentDescriptionString\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabCardViewBinderUtils\.resolveNullSafe\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ contentDescriptionTextResolver,\
        view\.getContext\(\)\);\

        \ \ \ \ \ \ \ \ view\.setContentDescription\(contentDescriptionString\);\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        '
      replace: "     * @param model the model containing the tab properties.\n     *\
        \ @param view the View to receive the accessibility content description.\n \
        \    */\n    public static @Nullable ContainerTabBadge.Info getContainerBadge(PropertyModel\
        \ model) {\n        if (!model.containsKey(TabProperties.CONTAINER_BADGE)\n\
        \                || (model.containsKey(TabProperties.IS_INCOGNITO)\n       \
        \                 && model.get(TabProperties.IS_INCOGNITO))) return null;\n\
        \        return model.get(TabProperties.CONTAINER_BADGE);\n    }\n\n    public\
        \ static void updateContentDescription(PropertyModel model, View view) {\n \
        \       @Nullable TextResolver contentDescriptionTextResolver =\n          \
        \      model.get(TabProperties.CONTENT_DESCRIPTION_TEXT_RESOLVER);\n       \
        \ @Nullable\n        CharSequence contentDescriptionString =\n             \
        \   TabCardViewBinderUtils.resolveNullSafe(\n                        contentDescriptionTextResolver,\
        \ view.getContext());\n        view.setContentDescription(\n               \
        \ ContainerTabBadge.appendDescription(\n                        contentDescriptionString,\
        \ getContainerBadge(model)));\n    }\n\n    /**\n"
  - description: Place the TYPE_USE nullable annotation on the nested type.
    regex:
      pattern: public static @Nullable ContainerTabBadge.Info getContainerBadge(
      replace: public static ContainerTabBadge.@Nullable Info getContainerBadge(
    count: 1
