substitutions:
- description: Remove dedicated price info view and tooltip presentation
  regex:
    pattern: '    private PriceCardView mPriceInfoBox;

      '
    replace: ''
  count: 1
- description: Remove dedicated price info view and tooltip presentation
  regex:
    pattern: '        mPriceInfoBox = findViewById(R.id.price_info_box);

      '
    replace: ''
  count: 1
- description: Remove dedicated price info view and tooltip presentation
  regex:
    pattern: "    /** Setup the price info box. */\n    void setupPriceInfoBox(@Nullable PriceDrop priceDrop) {\n        if\
      \ (priceDrop != null) {\n            mPriceInfoBox.setPriceStrings(priceDrop.price, priceDrop.previousPrice);\n    \
      \        mPriceInfoBox.setVisibility(View.VISIBLE);\n        } else {\n            mPriceInfoBox.setVisibility(View.GONE);\n\
      \        }\n    }\n\n"
    replace: ''
  count: 1
- description: Remove dedicated price info view and tooltip presentation
  regex:
    pattern: "    // TODO(crbug.com/40164330): This method has little to do with this view. Move this function to\n    //\
      \ a\n    // price tracking UI utility class.\n    /**\n     * When user taps on \"Show me\" on PriceWelcomeMessage,\
      \ we scroll them to the binding tab, then a\n     * blue tooltip appears and points to the price drop indicator.\n \
      \    */\n    public static void showPriceDropTooltip(View view) {\n        ViewRectProvider rectProvider = new ViewRectProvider(view);\n\
      \        TextBubble textBubble =\n                new TextBubble.Builder(\n                                view.getContext(),\n\
      \                                view,\n                                rectProvider,\n                            \
      \    R.string.price_drop_spotted_lower_price,\n                                R.string.price_drop_spotted_lower_price)\n\
      \                        .build();\n        textBubble.setFocusable(true);\n        textBubble.setDismissOnTouchInteraction(true);\n\
      \        textBubble.show();\n    }\n\n"
    replace: ''
  count: 1
- description: Remove exclusive PriceDrop import
  regex:
    pattern: 'import org.chromium.chrome.browser.tab.state.ShoppingPersistedTabData.PriceDrop;

      '
    replace: ''
  count: 1
- description: Remove exclusive TextBubble import
  regex:
    pattern: 'import org.chromium.components.browser_ui.widget.textbubble.TextBubble;

      '
    replace: ''
  count: 1
- description: Remove exclusive ViewRectProvider import
  regex:
    pattern: 'import org.chromium.ui.widget.ViewRectProvider;

      '
    replace: ''
  count: 1
