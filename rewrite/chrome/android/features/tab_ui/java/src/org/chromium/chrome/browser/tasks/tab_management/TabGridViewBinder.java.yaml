      pattern: "        } else if (TabProperties.SHOPPING_PERSISTED_TAB_DATA_FETCHER == propertyKey) {\n            fetchPriceDrop(model,\
        \ (priceDrop) -> onPriceDropFetched(view, model, priceDrop), true);\n        } else if (TabProperties.SHOULD_SHOW_PRICE_DROP_TOOLTIP\
        \ == propertyKey) {\n            if (model.get(TabProperties.SHOULD_SHOW_PRICE_DROP_TOOLTIP)) {\n                PriceCardView\
