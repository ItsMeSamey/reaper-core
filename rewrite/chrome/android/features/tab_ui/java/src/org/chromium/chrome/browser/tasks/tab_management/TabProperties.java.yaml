substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove exclusive AI implementation import UiTabState.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController\.UiTabState;\

        '
      replace: ''
  - description: Remove actual Glic implementation property.
    regex:
      re_pattern: '\ \ \ \ /\*\*\ Whether\ Glic\ context\ sharing\ is\ active\ for\
        the\ tab\.\ \*/\

        \ \ \ \ public\ static\ final\ WritableBooleanPropertyKey\ IS_GLIC_ACTIVE\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ new\ WritableBooleanPropertyKey\(\);\

        '
      replace: ''
  - description: Remove actual Actor implementation property.
    regex:
      re_pattern: '\ \ \ \ /\*\*\ The\ \{@link\ ActorUiTabController\.UiTabState\}\
        indicator\ of\ the\ tab\.\ \*/\

        \ \ \ \ public\ static\ final\ WritableObjectPropertyKey<UiTabState>\ ACTOR_UI_STATE\
        =\

        \ \ \ \ \ \ \ \ \ \ \ \ new\ WritableObjectPropertyKey<>\(\);\

        '
      replace: ''
  - description: Remove ACTOR_UI_STATE from actual property arrays; ordinary order/keys
      remain.
    count: 2
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ACTOR_UI_STATE,\

        '
      replace: ''
  - description: Remove IS_GLIC_ACTIVE from actual property arrays; ordinary order/keys
      remain.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ IS_GLIC_ACTIVE,\

        '
      replace: ''
  - description: Remove IS_GLIC_ACTIVE from actual property arrays; ordinary order/keys
      remain.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ IS_GLIC_ACTIVE,\

        '
      replace: ''

# Reaper final Android containers UI; preserve the full current raw-pin recipe prefix.
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (1/5).
    regex:
      re_pattern: '\

        import\ org\.chromium\.base\.Token;\

        import\ org\.chromium\.build\.annotations\.NullMarked;\

        import\ org\.chromium\.chrome\.browser\.tab\.Tab;\

        import\ org\.chromium\.chrome\.browser\.tab_ui\.TabListFaviconProvider;\

        import\ org\.chromium\.chrome\.browser\.tab_ui\.ThumbnailFetcher;\

        '
      replace: '

        import org.chromium.base.Token;

        import org.chromium.build.annotations.NullMarked;

        import org.chromium.chrome.browser.containers.ContainerTabBadge;

        import org.chromium.chrome.browser.tab.Tab;

        import org.chromium.chrome.browser.tab_ui.TabListFaviconProvider;

        import org.chromium.chrome.browser.tab_ui.ThumbnailFetcher;

        '
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (2/5).
    regex:
      re_pattern: '\ \ \ \ public\ static\ final\ WritableObjectPropertyKey<String>\
        TAB_GROUP_SYNC_ID\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ new\ WritableObjectPropertyKey<>\(\);\

        \

        \ \ \ \ /\*\*\ The\ \{@link\ TabAlert\}\ state\ of\ the\ tab\.\ \*/\

        \ \ \ \ public\ static\ final\ WritableIntDefPropertyKey<TabAlert>\ ALERT_STATE\
        =\

        \ \ \ \ \ \ \ \ \ \ \ \ new\ WritableIntDefPropertyKey<>\(TabAlert\.NONE\);\

        \

        \

        \

        \ \ \ \ /\*\*\ Listener\ for\ hover\ state\ changes\ on\ tabs\ and\ tab\ group\
        headers\.\ \*/\

        \ \ \ \ public\ static\ final\ WritableObjectPropertyKey<TabHoverListener>\
        TAB_HOVER_LISTENER\ =\

        '
      replace: "    public static final WritableObjectPropertyKey<String> TAB_GROUP_SYNC_ID\
        \ =\n            new WritableObjectPropertyKey<>();\n\n    /** Native container\
        \ identity for this card; separate from page and group titles. */\n    public\
        \ static final WritableObjectPropertyKey<ContainerTabBadge.Info> CONTAINER_BADGE\
        \ =\n            new WritableObjectPropertyKey<>();\n\n    /** The {@link TabAlert}\
        \ state of the tab. */\n    public static final WritableIntDefPropertyKey<TabAlert>\
        \ ALERT_STATE =\n            new WritableIntDefPropertyKey<>(TabAlert.NONE);\n\
        \n    /** Listener for hover state changes on tabs and tab group headers. */\n\
        \    public static final WritableObjectPropertyKey<TabHoverListener> TAB_HOVER_LISTENER\
        \ =\n"
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (3/5).
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ THUMBNAIL_FETCHER,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SHOW_THUMBNAIL_SPINNER,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TITLE,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ CARD_ALPHA,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ CARD_ANIMATION_STATUS,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TAB_SELECTION_DELEGATE,\

        '
      replace: "                THUMBNAIL_FETCHER,\n                SHOW_THUMBNAIL_SPINNER,\n\
        \                TITLE,\n                CONTAINER_BADGE,\n                CARD_ALPHA,\n\
        \                CARD_ANIMATION_STATUS,\n                TAB_SELECTION_DELEGATE,\n"
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (4/5).
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FAVICON_FETCHER,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ IS_SELECTED,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TITLE,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ HAS_NOTIFICATION_BUBBLE\

        \ \ \ \ \ \ \ \ \ \ \ \ \};\

        \

        '
      replace: "                FAVICON_FETCHER,\n                IS_SELECTED,\n   \
        \             TITLE,\n                CONTAINER_BADGE,\n                HAS_NOTIFICATION_BUBBLE\n\
        \            };\n\n"
  - description: Integrate exact Android container UI source delta on the current Life343/Reader/AI
      parent (5/5).
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TAB_HOVER_LISTENER,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TAB_ID,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TAB_LONG_CLICK_LISTENER,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TITLE\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ go/keep\-sorted\ end\

        \ \ \ \ \ \ \ \ \ \ \ \ \};\

        \

        '
      replace: "                TAB_HOVER_LISTENER,\n                TAB_ID,\n     \
        \           TAB_LONG_CLICK_LISTENER,\n                TITLE,\n             \
        \   CONTAINER_BADGE\n                // go/keep-sorted end\n            };\n\
        \n"
  - description: Remove dedicated price view type and properties preserving other numeric values
    regex:
      pattern: '        UiType.PRICE_MESSAGE,

        '
      replace: ''
    count: 1
  - description: Remove dedicated price view type and properties preserving other numeric values
    regex:
      pattern: '        int PRICE_MESSAGE = 3;

        '
      replace: ''
    count: 1
  - description: Remove dedicated price view type and properties preserving other numeric values
    regex:
      pattern: "    public static final WritableObjectPropertyKey<ShoppingPersistedTabDataFetcher>\n            SHOPPING_PERSISTED_TAB_DATA_FETCHER\
        \ = new WritableObjectPropertyKey<>(true);\n\n    public static final WritableBooleanPropertyKey SHOULD_SHOW_PRICE_DROP_TOOLTIP\
        \ =\n            new WritableBooleanPropertyKey();\n"
      replace: ''
    count: 1
  - description: Remove dedicated price view type and properties preserving other numeric values
    regex:
      pattern: "                        SHOPPING_PERSISTED_TAB_DATA_FETCHER,\n                        SHOULD_SHOW_PRICE_DROP_TOOLTIP,\n"
      replace: ''
    count: 1
  - description: Remove exclusive ShoppingPersistedTabDataFetcher import
    regex:
      pattern: 'import org.chromium.chrome.browser.tasks.tab_management.TabListMediator.ShoppingPersistedTabDataFetcher;

        '
      replace: ''
    count: 1
