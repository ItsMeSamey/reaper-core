substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove exclusive AI implementation import TabUnderlineManager.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.compositor\.overlays\.strip\.TabUnderlineManager;\

        '
      replace: ''
  - description: Remove exclusive AI underline manager config field.
    regex:
      re_pattern: '\ \ \ \ /\*\*\ Manager\ for\ active\ tab\ underline\ indicators\
        \(e\.g\.\ for\ Glic\),\ or\ null\ if\ not\ supported\.\ \*/\

        \ \ \ \ public\ final\ @Nullable\ TabUnderlineManager\ tabUnderlineManager;\

        '
      replace: ''
  - description: Remove AI-only builder assignment.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ tabUnderlineManager\ =\ builder\.mTabUnderlineManager;\

        '
      replace: ''
  - description: Remove exclusive builder storage.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ private\ @Nullable\ TabUnderlineManager\ mTabUnderlineManager;\

        '
      replace: ''
  - description: Remove actual AI-only builder API and documentation.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ /\*\*\

        \ \ \ \ \ \ \ \ \ \*\ @param\ tabUnderlineManager\ Manager\ for\ active\ tab\
        underline\ indicators,\ or\ null\.\

        \ \ \ \ \ \ \ \ \ \*\ @return\ The\ \{@link\ Builder\}\ instance\.\

        \ \ \ \ \ \ \ \ \ \*/\

        \ \ \ \ \ \ \ \ public\ Builder\ setTabUnderlineManager\(@Nullable\ TabUnderlineManager\
        tabUnderlineManager\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mTabUnderlineManager\ =\ tabUnderlineManager;\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ this;\

        \ \ \ \ \ \ \ \ \}\

        '
      replace: ''
