substitutions:
  - description: |-
      Instantiate Brave's tab list editor manager, which hides the "Add tabs to
      new group" multi-select menu item when the "Enable tab groups" master
      switch is off.
    regex:
      re_pattern: |-
        new (TabListEditorManager\()
      replace: |-
        new Brave\1
  - description: Remove dedicated price-controller supplier and message observers
    regex:
      pattern: "    private final PriceMessageUpdateObserver mPriceMessageUpdateObserver =\n            new PriceMessageUpdateObserver()\
        \ {\n                @Override\n                public void onShowPriceWelcomeMessage() {\n                    updateBottomPadding();\n\
        \                }\n\n                @Override\n                public void onRemovePriceWelcomeMessage() {\n     \
        \               updateBottomPadding();\n                }\n\n                @Override\n                public void\
        \ onRestorePriceWelcomeMessage() {\n                    updateBottomPadding();\n                }\n            };\n\n"
      replace: ''
    count: 1
  - description: Remove dedicated price-controller supplier and message observers
    regex:
      pattern: '                            this::getPriceWelcomeMessageController,

        '
      replace: ''
    count: 1
  - description: Remove dedicated price-controller supplier and message observers
    regex:
      pattern: "        PriceWelcomeMessageController priceWelcomeMessageController =\n                getPriceWelcomeMessageController();\n\
        \        if (priceWelcomeMessageController != null) {\n            priceWelcomeMessageController.removeObserver(mPriceMessageUpdateObserver);\n\
        \        }\n"
      replace: ''
    count: 1
  - description: Remove dedicated price-controller supplier and message observers
    regex:
      pattern: "        PriceWelcomeMessageController priceWelcomeMessageController =\n                getPriceWelcomeMessageController();\n"
      replace: ''
    count: 1
  - description: Remove dedicated price-controller supplier and message observers
    regex:
      pattern: '                    /* priceWelcomeMessageReviewActionProvider= */ mMediator,

        '
      replace: ''
    count: 1
  - description: Remove dedicated price-controller supplier and message observers
    regex:
      pattern: "            if (priceWelcomeMessageController != null) {\n                priceWelcomeMessageController.addObserver(mPriceMessageUpdateObserver);\n\
        \            }\n"
      replace: ''
    count: 1
  - description: Remove dedicated price-controller supplier and message observers
    regex:
      pattern: "            if (priceWelcomeMessageController != null) {\n                priceWelcomeMessageController.removeObserver(mPriceMessageUpdateObserver);\n\
        \            }\n"
      replace: ''
    count: 1
  - description: Remove dedicated price-controller supplier and message observers
    regex:
      pattern: "    private @Nullable PriceWelcomeMessageController getPriceWelcomeMessageController() {\n        return mMessageManager.getPriceWelcomeMessageController();\n\
        \    }\n\n"
      replace: ''
    count: 1
  - description: Remove exclusive PriceMessageUpdateObserver import
    regex:
      pattern: 'import org.chromium.chrome.browser.tasks.tab_management.PriceWelcomeMessageController.PriceMessageUpdateObserver;

        '
      replace: ''
    count: 1
