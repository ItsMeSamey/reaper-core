substitutions:
- description: Remove retired price-review interface
  regex:
    pattern: '                PriceWelcomeMessageReviewActionProvider,

      '
    replace: ''
  count: 1
- description: Retain ordinary scrolling method without retired interface override
  regex:
    pattern: "    @Override\n    public void scrollToTab("
    replace: '    public void scrollToTab('
  count: 1
- description: Remove exclusive PriceWelcomeMessageReviewActionProvider import
  regex:
    pattern: 'import org.chromium.chrome.browser.tasks.tab_management.PriceMessageService.PriceWelcomeMessageReviewActionProvider;

      '
    replace: ''
  count: 1
