substitutions:
- description: Remove dedicated price observer, preference or metric wiring
  regex:
    pattern: "    private final TabModelObserver mTabModelObserver =\n            new TabModelObserver() {\n             \
      \   @Override\n                public void didSelectTab(Tab tab, @TabSelectionType int type, int lastId) {\n       \
      \             onTabSelected(tab);\n                }\n            };\n\n"
    replace: ''
  count: 1
- description: Remove dedicated price observer, preference or metric wiring
  regex:
    pattern: '    private final SharedPreferences mSharedPreferences;

      '
    replace: ''
  count: 1
- description: Remove dedicated price observer, preference or metric wiring
  regex:
    pattern: '    private @Nullable OnSharedPreferenceChangeListener mPriceAnnotationsPrefListener;

      '
    replace: ''
  count: 1
- description: Remove dedicated price observer, preference or metric wiring
  regex:
    pattern: '        mSharedPreferences = sharedPreferences;

      '
    replace: ''
  count: 1
- description: Remove dedicated price observer, preference or metric wiring
  regex:
    pattern: "        if (mPriceAnnotationsPrefListener != null) {\n            mSharedPreferences.unregisterOnSharedPreferenceChangeListener(\n\
      \                    mPriceAnnotationsPrefListener);\n        }\n"
    replace: ''
  count: 1
- description: Remove dedicated price observer, preference or metric wiring
  regex:
    pattern: "        if (!PriceTrackingFeatures.isPriceAnnotationsEnabled(profileProvider.getOriginalProfile())\n       \
      \         && getTabListMode() == TabListMode.GRID) {\n            return;\n        }\n        mPriceAnnotationsPrefListener\
      \ =\n                (_, key) -> {\n                    if (!PriceTrackingUtilities.TRACK_PRICES_ON_TABS.equals(key)\n\
      \                            || !mIsVisibleSupplier.get()) {\n                        return;\n                    }\n\
      \                    TabModel tabModel = mTabModelSupplier.get();\n                    TabSwitcherPaneCoordinator coordinator\
      \ = getTabSwitcherPaneCoordinator();\n                    if (tabModel.isActiveModel()\n                           \
      \ && tabModel.isTabModelRestored()\n                            && coordinator != null) {\n                        coordinator.resetWithListOfTabs(tabModel.getRepresentativeTabList());\n\
      \                    }\n                };\n        mSharedPreferences.registerOnSharedPreferenceChangeListener(mPriceAnnotationsPrefListener);\n"
    replace: ''
  count: 1
- description: Remove dedicated price observer, preference or metric wiring
  regex:
    pattern: '            tabModel.addObserver(mTabModelObserver);

      '
    replace: ''
  count: 1
- description: Remove dedicated price observer, preference or metric wiring
  regex:
    pattern: '            tabModel.removeObserver(mTabModelObserver);

      '
    replace: ''
  count: 1
- description: Remove dedicated price observer, preference or metric wiring
  regex:
    pattern: "    private void onTabSelected(@Nullable Tab tab) {\n        if (tab == null) return;\n\n        Profile profile\
      \ = tab.getProfile();\n        if (getTabListMode() == TabListMode.GRID\n                && !profile.isOffTheRecord()\n\
      \                && PriceTrackingUtilities.isTrackPricesOnTabsEnabled(profile)) {\n            RecordUserAction.record(\n\
      \                    \"Commerce.TabGridSwitched.\"\n                            + (ShoppingPersistedTabData.hasPriceDrop(tab)\n\
      \                                    ? \"HasPriceDrop\"\n                                    : \"NoPriceDrop\"));\n\
      \        }\n    }\n\n"
    replace: ''
  count: 1
