substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove exclusive AI implementation import TabUnderlineManager.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.compositor\.overlays\.strip\.TabUnderlineManager;\

        '
      replace: ''
  - description: Remove exclusive AI implementation import ContextualTasksUtils.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.contextual_tasks\.ContextualTasksUtils;\

        '
      replace: ''
  - description: Remove exclusive AI implementation import GlicEnabling.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.glic\.GlicEnabling;\

        '
      replace: ''
  - description: Remove exclusive AI manager lifetime.
    regex:
      re_pattern: '\ \ \ \ private\ final\ @Nullable\ TabUnderlineManager\ mTabUnderlineManager;\

        '
      replace: ''
  - description: Remove actual AI manager construction, rather than disabling it.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(GlicEnabling\.isEnabledByFlags\(\)\ \|\|\ ContextualTasksUtils\.isContextualTasksUiEnabled\(\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mTabUnderlineManager\ =\ new\ TabUnderlineManager\(windowAndroid\);\

        \ \ \ \ \ \ \ \ \}\ else\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mTabUnderlineManager\ =\ null;\

        \ \ \ \ \ \ \ \ \}\

        '
      replace: ''
  - description: Remove actual AI-only builder call.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setTabUnderlineManager\(mTabUnderlineManager\)\

        '
      replace: ''
  - description: Remove exclusive AI teardown; ordinary vertical tab lifetimes remain.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(mTabUnderlineManager\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mTabUnderlineManager\.destroy\(\);\

        \ \ \ \ \ \ \ \ \}\

        '
      replace: ''
  - description: Remove retired price-controller constructor argument
    regex:
      pattern: '                        /* priceWelcomeMessageControllerSupplier */ null,

        '
      replace: ''
    count: 1
