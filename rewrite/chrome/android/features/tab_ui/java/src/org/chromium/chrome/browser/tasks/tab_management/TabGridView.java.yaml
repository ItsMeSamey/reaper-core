substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove exclusive AI implementation import InnerGlowDrawable.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.InnerGlowDrawable;\

        '
      replace: ''
  - description: Remove actual Actor layout inflation, thumbnail glow construction and
      overlay lookup.
    regex:
      re_pattern: '\ \ \ \ private\ @Nullable\ View\ getActorUi\(boolean\ inflateIfMissing\)\
        \{\

        \ \ \ \ \ \ \ \ View\ actorContainer\ =\ fastFindViewById\(R\.id\.actor_ui_container\);\

        \

        \ \ \ \ \ \ \ \ if\ \(actorContainer\ ==\ null\ \&\&\ inflateIfMissing\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ ViewGroup\ contentView\ =\ \(ViewGroup\)\ fastFindViewById\(R\.id\.content_view\);\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(contentView\ ==\ null\)\ return\ null;\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ LayoutInflater\.from\(getContext\(\)\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.inflate\(R\.layout\.actor_gts_tab_indicator,\
        contentView,\ true\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ actorContainer\ =\ fastFindViewById\(R\.id\.actor_ui_container\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ assumeNonNull\(actorContainer\);\

        \ \ \ \ \ \ \ \ \ \ \ \ ImageView\ thumbnailOverlay\ =\ actorContainer\.findViewById\(R\.id\.actor_thumbnail_overlay\);\

        \ \ \ \ \ \ \ \ \ \ \ \ thumbnailOverlay\.setImageDrawable\(InnerGlowDrawable\.createGtsPreviewGlow\(getContext\(\)\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ contentView\.bringChildToFront\(actorContainer\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ return\ actorContainer;\

        \ \ \ \ \}\

        '
      replace: ''
  - description: Remove Actor UI visibility/state implementation.
    regex:
      re_pattern: '\ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Sets\ the\ visibility\ of\ the\ actor\-specific\ tab\ UI\ elements\.\
        Injects\ the\ view\ programmatically\

        \ \ \ \ \ \*\ if\ it\ doesn''t\ exist\ yet\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ visible\ Whether\ the\ actor\ active\ UI\ should\ be\
        shown\.\

        \ \ \ \ \ \*/\

        \ \ \ \ public\ void\ setActorActiveUiVisible\(boolean\ visible\)\ \{\

        \ \ \ \ \ \ \ \ mActorUiVisible\ =\ visible;\

        \ \ \ \ \ \ \ \ if\ \(!mIsAttachedToWindow\)\ return;\

        \

        \ \ \ \ \ \ \ \ View\ actorContainer\ =\ getActorUi\(visible\);\

        \ \ \ \ \ \ \ \ if\ \(actorContainer\ ==\ null\)\ return;\

        \

        \ \ \ \ \ \ \ \ if\ \(visible\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ actorContainer\.setVisibility\(View\.VISIBLE\);\

        \ \ \ \ \ \ \ \ \}\ else\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ actorContainer\.setVisibility\(View\.GONE\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

        '
      replace: ''
  - description: Remove Actor-only attachment replay override, restoring inherited ordinary
      attachment.
    regex:
      re_pattern: '\ \ \ \ @Override\

        \ \ \ \ protected\ void\ onAttachedToWindow\(\)\ \{\

        \ \ \ \ \ \ \ \ super\.onAttachedToWindow\(\);\

        \ \ \ \ \ \ \ \ mIsAttachedToWindow\ =\ true;\

        \ \ \ \ \ \ \ \ setActorActiveUiVisible\(mActorUiVisible\);\

        \ \ \ \ \}\

        '
      replace: ''
  - description: Remove Actor-only attachment state override, restoring inherited ordinary
      detachment.
    regex:
      re_pattern: '\ \ \ \ @Override\

        \ \ \ \ protected\ void\ onDetachedFromWindow\(\)\ \{\

        \ \ \ \ \ \ \ \ super\.onDetachedFromWindow\(\);\

        \ \ \ \ \ \ \ \ mIsAttachedToWindow\ =\ false;\

        \ \ \ \ \}\

        '
      replace: ''
  - description: Remove exclusive Actor visibility state.
    regex:
      re_pattern: '\ \ \ \ private\ boolean\ mActorUiVisible;\

        '
      replace: ''
  - description: Remove attachment duplicate used only by excluded Actor UI.
    regex:
      re_pattern: '\ \ \ \ private\ boolean\ mIsAttachedToWindow;\

        '
      replace: ''
  - description: Remove unused Actor-only import LayoutInflater.
    regex:
      re_pattern: 'import\ android\.view\.LayoutInflater;\

        '
      replace: ''
  - description: Remove unused Actor-only import assumeNonNull.
    regex:
      re_pattern: 'import\ static\ org\.chromium\.build\.NullUtil\.assumeNonNull;\

        '
      replace: ''
