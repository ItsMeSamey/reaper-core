substitutions:
- description: Retain activity label type
  regex:
    pattern: '@IntDef({TabCardLabelType.ACTIVITY_UPDATE, TabCardLabelType.PRICE_DROP})'
    replace: '@IntDef({TabCardLabelType.ACTIVITY_UPDATE})'
  count: 1
- description: Remove dedicated price label type without renumbering activity labels
  regex:
    pattern: "    /** Price drops. */\n    int PRICE_DROP = 0;\n\n"
    replace: ''
  count: 1
