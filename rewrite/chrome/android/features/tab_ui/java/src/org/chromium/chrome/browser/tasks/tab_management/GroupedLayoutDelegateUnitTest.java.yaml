      \ \ \ \ \ \ \ \ //\ Insertion\ index\ should\ be\ offset\ by\ 1\ \(due\ to\ archived\ card\)\ and\
      return\ 1\.\

      \ \ \ \ \ \ \ \ assertEquals\(1,\ insertionIndex\);\

