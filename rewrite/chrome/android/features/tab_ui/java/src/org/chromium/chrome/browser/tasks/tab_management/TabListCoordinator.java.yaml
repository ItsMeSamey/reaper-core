substitutions:
- description: Retain ordinary destroy interface
  regex:
    pattern: implements PriceWelcomeMessageProvider, DestroyObserver
    replace: implements DestroyObserver
  count: 1
- description: Remove dedicated price-provider contract and callback
  regex:
    pattern: "     * @param priceWelcomeMessageControllerSupplier A supplier for a controller to show\n     *     PriceWelcomeMessage.\n"
    replace: ''
  count: 1
- description: Remove dedicated price-provider contract and callback
  regex:
    pattern: "            @Nullable Supplier<@Nullable PriceWelcomeMessageController>\n                    priceWelcomeMessageControllerSupplier,\n"
    replace: ''
  count: 1
- description: Remove dedicated price-provider contract and callback
  regex:
    pattern: '                        priceWelcomeMessageControllerSupplier,

      '
    replace: ''
  count: 1
- description: Remove dedicated price-provider contract and callback
  regex:
    pattern: "    /**\n     * @see TabListMediator#getPriceWelcomeMessageInsertionIndex().\n     */\n    int getPriceWelcomeMessageInsertionIndex()\
      \ {\n        return mMediator.getPriceWelcomeMessageInsertionIndex();\n    }\n\n"
    replace: ''
  count: 1
- description: Remove dedicated price-provider contract and callback
  regex:
    pattern: "    // PriceWelcomeMessageService.PriceWelcomeMessageProvider implementation.\n    @Override\n"
    replace: ''
  count: 1
- description: Remove dedicated price-provider contract and callback
  regex:
    pattern: "    @Override\n    public void showPriceDropTooltip(int index) {\n        if (!mModelList.isValidIndex(index))\
      \ return;\n\n        mModelList.get(index).model.set(TabProperties.SHOULD_SHOW_PRICE_DROP_TOOLTIP, true);\n    }\n\n"
    replace: ''
  count: 1
- description: Remove exclusive PriceWelcomeMessageProvider import
  regex:
    pattern: 'import org.chromium.chrome.browser.tasks.tab_management.PriceMessageService.PriceWelcomeMessageProvider;

      '
    replace: ''
  count: 1
- description: Remove exclusive Supplier import
  regex:
    pattern: 'import java.util.function.Supplier;

      '
    replace: ''
  count: 1
- description: Keep generic full-row example
  regex:
    pattern: pre-selected tab group divider and the large price tracking message
    replace: pre-selected tab group divider and a large message card
  count: 1
