substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove exclusive AI implementation import UiTabState.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController\.UiTabState;\

        '
      replace: ''
  - description: Remove Actor-only grouped-thumbnail observer dispatch; ordinary tab/group
      updates stay.
    regex:
      re_pattern: '\ \ \ \ /\*\*\

        \ \ \ \ \ \*\ When\ a\ tab\ in\ a\ tab\ group\ changes\ Actor\ UI\ state,\ refresh\
        the\ group\ card\ thumbnail\ to\ reflect\

        \ \ \ \ \ \*\ the\ update\.\

        \ \ \ \ \ \*/\

        \ \ \ \ @Override\

        \ \ \ \ void\ onUiTabStateChanged\(Tab\ updatedTab,\ UiTabState\ state\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(mMediator\.isTabInTabGroup\(updatedTab\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ int\ index\ =\ mMediator\.getIndexForTabIdWithRelatedTabs\(updatedTab\.getId\(\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(index\ !=\ TabModel\.INVALID_TAB_INDEX\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PropertyModel\ groupModel\ =\ mModelList\.get\(index\)\.model;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mMediator\.updateThumbnailFetcher\(groupModel,\
        groupModel\.get\(TabProperties\.TAB_ID\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

        '
      replace: ''
