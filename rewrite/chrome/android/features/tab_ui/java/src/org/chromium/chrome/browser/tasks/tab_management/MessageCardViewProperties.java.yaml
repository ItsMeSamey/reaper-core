substitutions:
- description: Remove dedicated price property
  regex:
    pattern: "    // TODO(crbug.com/40731056): Change to a more general property CUSTOM_INFO_OBJECT\n    public static final\
      \ PropertyModel.WritableObjectPropertyKey<ShoppingPersistedTabData.PriceDrop>\n            PRICE_DROP = new PropertyModel.WritableObjectPropertyKey<>();\n\
      \n"
    replace: ''
  count: 1
- description: Remove price property from shared key list
  regex:
    pattern: '                PRICE_DROP,

      '
    replace: ''
  count: 1
- description: Remove exclusive ShoppingPersistedTabData import
  regex:
    pattern: 'import org.chromium.chrome.browser.tab.state.ShoppingPersistedTabData;

      '
    replace: ''
  count: 1
- description: Remove retired price example from generic identifier documentation
  regex:
    pattern: "    // Identifier is the subtype of message. For example, the message with type PRICE_MESSAGE may\n    // have\
      \ the identifier PRICE_WELCOME or PRICE_ALERTS.\n"
    replace: '    // Identifier is the subtype of message.

      '
  count: 1
