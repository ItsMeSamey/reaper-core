  - description: Remove actual AI property initialization from normal tab model.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(TabProperties\.IS_GLIC_ACTIVE,\
        false\)\

        '
      replace: ''
  - description: Remove per-tab Actor observer registration and snapshot update.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ ActorUiTabController\ controller\ =\ ActorUiTabController\.from\(tab\);\

        \ \ \ \ \ \ \ \ if\ \(controller\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ controller\.addObserver\(mActorObserver\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ PropertyModel\ model\ =\ mModelList\.getModelFromTabId\(tab\.getId\(\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(model\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ updateActorUiState\(model,\ controller\.getUiTabState\(\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove per-tab AI underline registration.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(mTabUnderlineManager\ !=\ null\ \&\&\ !tab\.isIncognito\(\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mTabUnderlineManager\.registerTab\(tab\);\

        \ \ \ \ \ \ \ \ \}\

        '
      replace: ''
  - description: Remove per-tab Actor observer teardown.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ ActorUiTabController\ controller\ =\ ActorUiTabController\.from\(tab\);\

        \ \ \ \ \ \ \ \ if\ \(controller\ !=\ null\)\ controller\.removeObserver\(mActorObserver\);\

        '
      replace: ''
  - description: Remove per-tab AI underline teardown.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(mTabUnderlineManager\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mTabUnderlineManager\.unregisterTab\(tab\.getId\(\)\);\

        \ \ \ \ \ \ \ \ \}\

        '
      replace: ''
  - description: Remove actual Actor group-thumbnail ID collection, not a false helper.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ List<Integer>\ actingTabIds\ =\ Collections\.emptyList\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(TabProperties\.isTabGroupHeader\(model\)\ \&\&\
        isInTabGroup\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ actingTabIds\ =\ new\ ArrayList<>\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ for\ \(Tab\ groupTab\ :\ tabModel\.getRelatedTabList\(tabId\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ActorUiTabController\ controller\ =\
        ActorUiTabController\.from\(groupTab\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(controller\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ UiTabState\ state\ =\ controller\.getUiTabState\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(state\ !=\ null\ \&\&\
        state\.tabIndicator\ !=\ TabIndicatorStatus\.NONE\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ actingTabIds\.add\(groupTab\.getId\(\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Use actual preserved four-argument normal thumbnail factory; Root owns
      provider source.
    regex:
      re_pattern: MultiThumbnailMetadata\.createMetadataWithActingTabs\(
      replace: MultiThumbnailMetadata.createMetadataWithoutUrls(
  - description: Remove optional Actor metadata constructor argument; normal tab/group/incognito/color
      inputs remain.
    regex:
