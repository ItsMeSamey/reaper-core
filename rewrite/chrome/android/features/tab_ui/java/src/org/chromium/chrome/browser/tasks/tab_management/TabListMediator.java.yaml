substitutions:
  - description: |-
      Instantiate Brave's touch helper callback, which blocks drag-to-merge tab
      group creation when the "Enable tab groups" master switch is off.
    regex:
      re_pattern: |-
        new (TabGridItemTouchHelperCallback\()
      replace: |-
        new Brave\1

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove exclusive AI implementation import ActorUiTabController.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController;\

        '
      replace: ''
  - description: Remove exclusive AI implementation import UiTabState.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController\.UiTabState;\

        '
      replace: ''
  - description: Remove exclusive AI implementation import TabIndicatorStatus.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.TabIndicatorStatus;\

        '
      replace: ''
  - description: Remove exclusive AI implementation import TabUnderlineManager.
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.compositor\.overlays\.strip\.TabUnderlineManager;\

        '
      replace: ''
  - description: Remove exclusive AI manager lifetime field.
    regex:
      re_pattern: '\ \ \ \ private\ final\ @Nullable\ TabUnderlineManager\ mTabUnderlineManager;\

        '
      replace: ''
  - description: Remove actual Actor observer and typed layout dispatch.
    regex:
      re_pattern: '\ \ \ \ private\ final\ ActorUiTabController\.Observer\ mActorObserver\
        =\

        \ \ \ \ \ \ \ \ \ \ \ \ new\ ActorUiTabController\.Observer\(\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ onUiTabStateChanged\(UiTabState\
        state\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int\ tabId\ =\ state\.tabId;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Tab\ tab\ =\ getCurrentTabModelChecked\(\)\.getTabById\(tabId\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(tab\ ==\ null\)\ return;\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PropertyModel\ model\ =\ mModelList\.getModelFromTabId\(tabId\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(model\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ updateActorUiState\(model,\
        state\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mTabListLayoutDelegate\.onUiTabStateChanged\(tab,\
        state\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \};\

        '
      replace: ''
  - description: Remove actual AI underline observer/property writes.
    regex:
      re_pattern: '\ \ \ \ private\ final\ TabUnderlineManager\.Observer\ mTabUnderlineObserver\
        =\

        \ \ \ \ \ \ \ \ \ \ \ \ new\ TabUnderlineManager\.Observer\(\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ onIndicatorStateChanged\(int\
        tabId,\ boolean\ isActive\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PropertyModel\ model\ =\ mModelList\.getModelFromTabId\(tabId\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(model\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ model\.set\(TabProperties\.IS_GLIC_ACTIVE,\
        isActive\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ onResetAnimationCycle\(int\ tabId\)\
        \{\}\

        \ \ \ \ \ \ \ \ \ \ \ \ \};\

        '
      replace: ''
  - description: Remove actual AI observer registration from normal mediator construction.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ mTabUnderlineManager\ =\ tabListConfig\.tabUnderlineManager;\

        \ \ \ \ \ \ \ \ if\ \(mTabUnderlineManager\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mTabUnderlineManager\.addObserver\(mTabUnderlineObserver\);\

        \ \ \ \ \ \ \ \ \}\

        '
      replace: ''
  - description: Remove Actor snapshot injection from ordinary model update.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ ActorUiTabController\ controller\ =\ ActorUiTabController\.from\(tab\);\

        \ \ \ \ \ \ \ \ updateActorUiState\(model,\ controller\ ==\ null\ \?\ null\
        :\ controller\.getUiTabState\(\)\);\

        '
      replace: ''
  - description: Remove Actor snapshot injection from ordinary tabInfo update.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ ActorUiTabController\ controller\ =\ ActorUiTabController\.from\(tab\);\

        \ \ \ \ \ \ \ \ updateActorUiState\(tabInfo,\ controller\ ==\ null\ \?\ null\
        :\ controller\.getUiTabState\(\)\);\

        '
      replace: ''
  - description: Remove typed Actor snapshot-to-property implementation.
    regex:
      re_pattern: '\ \ \ \ private\ void\ updateActorUiState\(PropertyModel\ model,\
        @Nullable\ UiTabState\ state\)\ \{\

        \ \ \ \ \ \ \ \ boolean\ isTabGroupCard\ =\ TabProperties\.isTabGroupHeader\(model\);\

        \ \ \ \ \ \ \ \ model\.set\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabProperties\.ACTOR_UI_STATE,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(isTabGroupCard\ \|\|\ state\ ==\ null\ \|\|\
        state\.tabIndicator\ ==\ TabIndicatorStatus\.NONE\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ null\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ state\);\

        \ \ \ \ \}\

        '
      replace: ''
  - description: Remove exclusive AI observer teardown, preserving normal manager teardown.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(mTabUnderlineManager\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mTabUnderlineManager\.removeObserver\(mTabUnderlineObserver\);\

        \ \ \ \ \ \ \ \ \}\

        '
      replace: ''
  - description: Remove actual AI property initialization from normal tab model.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(TabProperties\.ACTOR_UI_STATE,\
        null\)\

        '
