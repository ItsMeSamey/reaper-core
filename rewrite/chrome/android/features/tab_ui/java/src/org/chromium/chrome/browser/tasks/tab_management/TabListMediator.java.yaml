        \ \ \ tabGroupColor,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ actingTabIds'
      replace: '                                    tabGroupColor'

