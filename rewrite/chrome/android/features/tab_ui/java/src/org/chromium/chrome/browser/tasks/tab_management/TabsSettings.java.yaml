substitutions:
- description: retire-history-settings-helper-import
  regex:
    pattern: 'import org.chromium.chrome.browser.auxiliary_search.AuxiliarySearchDonationServiceUtils;

      '
    replace: ''
  count: 1
- description: retire-history-settings-key
  regex:
    pattern: "    @VisibleForTesting\n    static final String PREF_CHROME_SUGGESTIONS_IN_OTHER_APPS_SWITCH =\n           \
      \ \"chrome_suggestions_in_other_apps_switch\";\n\n"
    replace: ''
  count: 1
- description: retire-history-settings-configuration-call
  regex:
    pattern: '        configureChromeSuggestionsInOtherAppsSwitch();

      '
    replace: ''
  count: 1
- description: retire-history-settings-pref-read-write
  regex:
    pattern: "    private void configureChromeSuggestionsInOtherAppsSwitch() {\n        ChromeSwitchPreference chromeSuggestionsSwitch\
      \ =\n                (ChromeSwitchPreference)\n                        findPreference(PREF_CHROME_SUGGESTIONS_IN_OTHER_APPS_SWITCH);\n\
      \n        // LINT.IfChange(isChromeSuggestionsInOtherAppsEnabled)\n        if (!isChromeSuggestionsInOtherAppsEnabled())\
      \ {\n            chromeSuggestionsSwitch.setVisible(false);\n            return;\n        }\n        // LINT.ThenChange(:isChromeSuggestionsInOtherAppsEnabledIndex)\n\
      \n        PrefService prefService = UserPrefs.get(getProfile());\n        boolean isEnabled =\n                prefService.getBoolean(Pref.AUXILIARY_SEARCH_BROWSING_DATA_DONATION_ENABLED);\n\
      \        chromeSuggestionsSwitch.setChecked(isEnabled);\n        chromeSuggestionsSwitch.setOnPreferenceChangeListener(\n\
      \                (preference, newValue) -> {\n                    boolean enabled = (boolean) newValue;\n          \
      \          prefService.setBoolean(\n                            Pref.AUXILIARY_SEARCH_BROWSING_DATA_DONATION_ENABLED,\
      \ enabled);\n                    HomeModulesRankingHelper.notifyCardInteracted(\n                            getProfile(),\n\
      \                            HomeModulesMetricsUtils.getModuleName(ModuleType.AUXILIARY_SEARCH));\n                \
      \    return true;\n                });\n    }\n\n"
    replace: ''
  count: 1
- description: retire-history-settings-eligibility
  regex:
    pattern: "    private static boolean isChromeSuggestionsInOtherAppsEnabled() {\n        return AuxiliarySearchDonationServiceUtils.isBrowsingDataDonationEnabled();\n\
      \    }\n\n"
    replace: ''
  count: 1
- description: retire-history-settings-search-index-route
  regex:
    pattern: "                    // LINT.IfChange(isChromeSuggestionsInOtherAppsEnabledIndex)\n                    if (!isChromeSuggestionsInOtherAppsEnabled())\
      \ {\n                        String pref = PREF_CHROME_SUGGESTIONS_IN_OTHER_APPS_SWITCH;\n                        indexData.removeEntry(getUniqueId(pref));\n\
      \                    }\n                    // LINT.ThenChange(:isChromeSuggestionsInOtherAppsEnabled)\n"
    replace: ''
  count: 1
