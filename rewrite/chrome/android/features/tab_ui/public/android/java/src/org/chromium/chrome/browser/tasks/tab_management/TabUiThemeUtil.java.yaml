substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove exclusively AI underline/button resource accessors; regular
    group/close-button focus and tab theme helpers remain
  regex:
    re_pattern: '\ \ \ \ /\*\*\ Returns\ the\ color\ for\ the\ tab\ strip\ tab\ underline\
      gradient\ start\.\ \*/\

      \ \ \ \ public\ static\ @ColorInt\ int\ getTabUnderlineGradientStart\(Context\
      context\)\ \{\

      \ \ \ \ \ \ \ \ return\ context\.getColor\(R\.color\.material_primary_50\);\

      \ \ \ \ \}\

      \

      '
    replace: ''
- description: Remove exclusively AI underline/button resource accessors; regular
    group/close-button focus and tab theme helpers remain
  regex:
    re_pattern: '\ \ \ \ /\*\*\ Returns\ the\ color\ for\ the\ tab\ strip\ tab\ underline\
      gradient\ end\.\ \*/\

      \ \ \ \ public\ static\ @ColorInt\ int\ getTabUnderlineGradientEnd\(Context\
      context\)\ \{\

      \ \ \ \ \ \ \ \ return\ context\.getColor\(R\.color\.material_primary_70\);\

      \ \ \ \ \}\

      \

      '
    replace: ''
- description: Remove exclusively AI underline/button resource accessors; regular
    group/close-button focus and tab theme helpers remain
  regex:
    re_pattern: '\ \ \ \ /\*\*\ Returns\ the\ \{@link\ DrawableRes\.\ for\ the\ Glic\
      button\ keyboard\ focus\ ring\}\ \*/\

      \ \ \ \ public\ static\ @DrawableRes\ int\ getGlicButtonKeyboardFocusDrawableRes\(boolean\
      isSplit\)\ \{\

      \ \ \ \ \ \ \ \ return\ isSplit\ \?\ R\.drawable\.glic_split_button_keyfocus\
      :\ R\.drawable\.glic_button_keyfocus;\

      \ \ \ \ \}\

      \

      '
    replace: ''
