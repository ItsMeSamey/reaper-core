      ]'
    replace: "  internal_tab_management_java_sources -= [\n    \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/PriceCardView.java\"\
      ,\n    \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/PriceDropTextResolver.java\"\
      ,\n    \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/PriceMessageCardViewModel.java\"\
      ,\n    \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/PriceMessageService.java\"\
      ,\n    \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/PriceWelcomeMessageController.java\"\
      ,\n    \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/TabComponentId.java\"\
      ,\n  ]"
