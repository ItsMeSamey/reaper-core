substitutions:
- description: Compile TabComponentId once in the tab UI target instead of chrome_java on Android
  regex:
    pattern: "out.java\",\n  \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/vertical_tabs/VerticalTabsActionDelegate.java\"\
      ,\n  \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/vertical_tabs/VerticalTabsSideUiCoordinator.java\"\
      ,\n]\n"
    replace: "out.java\",\n  \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/vertical_tabs/VerticalTabsActionDelegate.java\"\
      ,\n  \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/vertical_tabs/VerticalTabsSideUiCoordinator.java\"\
      ,\n]\n\nif (is_android) {\n  internal_tab_management_java_sources -= [ \"//chrome/android/features/tab_ui/java/src/org/chromium/chrome/browser/tasks/tab_management/TabComponentId.java\"\
      \ ]\n}\n"
  count: 1
- description: Exclude five dedicated price implementation classes on Android
