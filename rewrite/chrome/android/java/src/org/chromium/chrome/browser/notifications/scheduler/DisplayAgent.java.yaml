substitutions:

  - description: "Android Finds compile-out: Remove Finds-specific notification delivery channel mapping"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ case\\ SchedulerClientType\\.CHROME_FINDS:\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ return\\ ChannelId\\.CHROME_FINDS;\\\n"
      replace: ""
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "\n    private static @ChannelId String getNotificationChannel(@SchedulerClientType int type) {\n        switch (type) {\n            case SchedulerClientType.TIPS:\n                return ChannelId.TIPS_V2;\n            default:\n                return ChannelId.BROWSER;\n        }\n"
      replace: "\n    private static @ChannelId String getNotificationChannel(@SchedulerClientType int type) {\n        switch (type) {\n            default:\n                return ChannelId.BROWSER;\n        }\n"
    count: 1
