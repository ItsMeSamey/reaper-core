substitutions:
- description: Remove exclusive price IPH dependency.
  regex:
    pattern: 'import org.chromium.chrome.browser.bookmarks.PowerBookmarkUtils;

      '
    replace: ''
  count: 1
- description: Remove exclusive price IPH dependency.
  regex:
    pattern: 'import org.chromium.chrome.browser.commerce.ShoppingServiceFactory;

      '
    replace: ''
  count: 1
- description: Remove exclusive price IPH dependency.
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtils;

      '
    replace: ''
  count: 1
- description: Remove dedicated price IPH from successful page-load dispatch.
  regex:
    pattern: '                                showPriceTrackingIph(tab);

      '
    replace: ''
  count: 1
- description: Remove dedicated price-tracking IPH implementation.
  regex:
    pattern: "    /**\n     * Attempt to show the IPH for price tracking.\n     *\n     * @param tab The tab currently being\
      \ displayed to the user.\n     */\n    private void showPriceTrackingIph(Tab tab) {\n        if (tab == null || tab.getWebContents()\
      \ == null) return;\n\n        if (!CommerceFeatureUtils.isShoppingListEligible(\n                        ShoppingServiceFactory.getForProfile(tab.getProfile()))\n\
      \                || !PowerBookmarkUtils.isPriceTrackingEligible(tab)) {\n            return;\n        }\n\n        mUserEducationHelper.requestShowIph(\n\
      \                new IphCommandBuilder(\n                                mActivity.getResources(),\n               \
      \                 FeatureConstants.SHOPPING_LIST_MENU_ITEM_FEATURE,\n                                R.string.iph_price_tracking_menu_item,\n\
      \                                R.string.iph_price_tracking_menu_item_accessibility)\n                        .setAnchorView(mMenuButtonAnchorView)\n\
      \                        .setOnShowCallback(\n                                () ->\n                              \
      \          turnOnHighlightForMenuItem(\n                                                R.id.enable_price_tracking_menu_id))\n\
      \                        .setOnDismissCallback(this::turnOffHighlightForMenuItem)\n                        .build());\n\
      \    }\n\n"
    replace: ''
  count: 1
