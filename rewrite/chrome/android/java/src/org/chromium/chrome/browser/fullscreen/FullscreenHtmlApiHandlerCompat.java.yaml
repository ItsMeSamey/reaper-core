substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '\ \ \ \ //\ View\.OnApplyWindowInsetsListener\

      \

      \ \ \ \ @Override\

      \ \ \ \ public\ WindowInsets\ onApplyWindowInsets\(View\ v,\ WindowInsets\ insets\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(mTabInFullscreen\ !=\ null\ \&\&\ getPersistentFullscreenMode\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mHandler\.sendEmptyMessageDelayed\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MSG_ID_SET_VISIBILITY_FOR_SYSTEM_BARS,\ ANDROID_CONTROLS_SHOW_DURATION_MS\);\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: "    // View.OnApplyWindowInsetsListener\n\n    @Override\n    public WindowInsets onApplyWindowInsets(View v,\
      \ WindowInsets insets) {\n        onBrowserFullscreenInsetsChanged();\n        if (mTabInFullscreen != null && getPersistentFullscreenMode())\
      \ {\n            mHandler.sendEmptyMessageDelayed(\n                    MSG_ID_SET_VISIBILITY_FOR_SYSTEM_BARS, ANDROID_CONTROLS_SHOW_DURATION_MS);\n\
      \        }\n"
