substitutions:
- description: Remove the dedicated store-info supplier field
  regex:
    pattern: "    private final @Nullable MonotonicObservableSupplier<StoreInfoActionHandler>\n            mStoreInfoActionHandlerSupplier;\n"
    replace: ''
  count: 1
- description: Remove its retired parameter documentation
  regex:
    pattern: '     * @param storeInfoActionHandlerSupplier Supplier of {@link StoreInfoActionHandler}.

      '
    replace: ''
  count: 1
- description: Remove only the merchant constructor parameter
  regex:
    pattern: "            @Nullable MonotonicObservableSupplier<StoreInfoActionHandler>\n                    storeInfoActionHandlerSupplier,\n"
    replace: ''
  count: 1
- description: Remove its assignment
  regex:
    pattern: '        mStoreInfoActionHandlerSupplier = storeInfoActionHandlerSupplier;

      '
    replace: ''
  count: 1
- description: Keep ordinary delegate construction without merchant forwarding
  regex:
    pattern: '                        mStoreInfoActionHandlerSupplier,

      '
    replace: ''
  count: 1
- description: Remove only the now-unused StoreInfoActionHandler import
  regex:
    pattern: 'import org.chromium.chrome.browser.merchant_viewer.PageInfoStoreInfoController.StoreInfoActionHandler;

      '
    replace: ''
  count: 1
- description: Remove only the now-unused MonotonicObservableSupplier import
  regex:
    pattern: 'import org.chromium.base.supplier.MonotonicObservableSupplier;

      '
    replace: ''
  count: 1
