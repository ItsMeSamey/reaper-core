substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Keep real ordinary address observer, remove AI entity observer
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ implements\ PersonalDataManager\.PersonalDataManagerObserver,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ EntityDataManager\.EntityDataManagerObserver\
      \{'
    replace: '        implements PersonalDataManager.PersonalDataManagerObserver {'
- description: Remove concrete AI delegate construction/lifetime
  regex:
    re_pattern: '\ \ \ \ private\ final\ AutofillAiDelegate\ mAutofillAiDelegate\
      =\

      \ \ \ \ \ \ \ \ \ \ \ \ new\ AutofillAiDelegate\(this,\ this,\ /\*\ toggleConfig=\
      \*/\ null\);\

      \

      '
    replace: ''
- description: Use retained ordinary address title without an AI-page alternate
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(ChromeFeatureList\.isEnabled\(ChromeFeatureList\.YOUR_SAVED_INFO_SETTINGS_PAGE_ANDROID\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mPageTitle\.set\(getString\(R\.string\.autofill_contact_info_title\)\);\

      \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mPageTitle\.set\(getString\(R\.string\.autofill_addresses_settings_title\)\);\

      \ \ \ \ \ \ \ \ \}'
    replace: '        mPageTitle.set(getString(R.string.autofill_addresses_settings_title));'
- description: Remove actual AI-only delegate lifecycle/entity/search condition
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.isEnabled\(ChromeFeatureList\.YOUR_SAVED_INFO_SETTINGS_PAGE_ANDROID\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ AutofillAiDelegate\.maybeAddDisabledWalletDataSharingDataCard\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ indexData,\ profile,\ prefFragmentName\);\

      \ \ \ \ \ \ \ \ \}'
    replace: ''
- description: Remove actual AI-only delegate lifecycle/entity/search condition
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.isEnabled\(ChromeFeatureList\.YOUR_SAVED_INFO_SETTINGS_PAGE_ANDROID\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mAutofillAiDelegate\.onDestroyView\(\);\

      \ \ \ \ \ \ \ \ \}'
    replace: ''
- description: Remove actual AI-only delegate lifecycle/entity/search condition
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.isEnabled\(ChromeFeatureList\.YOUR_SAVED_INFO_SETTINGS_PAGE_ANDROID\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mAutofillAiDelegate\.onActivityCreated\(\);\

      \ \ \ \ \ \ \ \ \}'
    replace: ''
- description: Remove actual AI-only delegate lifecycle/entity/search condition
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.isEnabled\(ChromeFeatureList\.YOUR_SAVED_INFO_SETTINGS_PAGE_ANDROID\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mAutofillAiDelegate\.addAutofillAiEntities\(screen,\
      /\*\ typeFilter=\ \*/\ null\);\

      \ \ \ \ \ \ \ \ \}'
    replace: ''
- description: Remove actual AI-only delegate lifecycle/entity/search condition
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.isEnabled\(ChromeFeatureList\.YOUR_SAVED_INFO_SETTINGS_PAGE_ANDROID\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mAutofillAiDelegate\.maybeAddDisabledWalletDataSharingDataCard\(screen\);\

      \ \ \ \ \ \ \ \ \}'
    replace: ''
- description: Remove actual AI-only delegate lifecycle/entity/search condition
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.isEnabled\(ChromeFeatureList\.YOUR_SAVED_INFO_SETTINGS_PAGE_ANDROID\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mAutofillAiDelegate\.onConfigurationChanged\(\);\

      \ \ \ \ \ \ \ \ \}'
    replace: ''
- description: Remove AI disabled settings card from actual address list
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mAutofillAiDelegate\.maybeAddDisabledSettingsInfoCard\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ screen,\ AutofillOptionsReferrer\.AUTOFILL_PROFILES_FRAGMENT\);\

      \

      '
    replace: ''
- description: Remove actual AI-only delegate condition and body without a fallback
    service
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(ChromeFeatureList\.isEnabled\(ChromeFeatureList\.AUTOFILL_AI_WITH_DATA_SCHEMA\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ var\ category\ =\ new\ ChromeBasePreferenceCategory\(getStyledContext\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ category\.setTitle\(R\.string\.autofill_addresses_section_title\);\

      \ \ \ \ \ \ \ \ \ \ \ \ category\.setKey\("autofill_section_title"\);\

      \ \ \ \ \ \ \ \ \ \ \ \ screen\.addPreference\(category\);\

      \ \ \ \ \ \ \ \ \}'
    replace: ''
- description: Keep normal address search entries without AI policy cards
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillAiDelegate\.maybeAddDisabledSettingsInfoCard\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ indexData,\ profile,\
      getPrefFragmentName\(\)\);\

      '
    replace: ''
- description: Remove actual AI-only dynamic search data-sharing card
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.isEnabled\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.YOUR_SAVED_INFO_SETTINGS_PAGE_ANDROID\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillAiDelegate\.maybeAddDisabledWalletDataSharingDataCard\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ indexData,\
      profile,\ getPrefFragmentName\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      '
    replace: ''
- description: Remove AI-only dynamic index mutation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ AutofillAiDelegate\.maybeAddDisabledSettingsInfoCard\(indexData,\
      profile,\ prefFragmentName\);\

      '
    replace: ''
- description: Physically remove AI-only observer/settings route or test hook; preserve
    ordinary native APIs
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ void\ onEntityInstancesChanged\(\)\ \{\

      \ \ \ \ \ \ \ \ rebuildProfileList\(\);\

      \ \ \ \ \ \ \ \ notifyPreferencesUpdated\(\);\

      \ \ \ \ \ \ \ \ if\ \(sObserverForTest\ !=\ null\)\ sObserverForTest\.onEditorDismiss\(\);\

      \ \ \ \ \}'
    replace: ''
- description: Physically remove AI-only observer/settings route or test hook; preserve
    ordinary native APIs
  regex:
    re_pattern: '\ \ \ \ void\ onOpenGoogleWalletForTesting\(boolean\ isPrivateEntity\)\
      \{\

      \ \ \ \ \ \ \ \ mAutofillAiDelegate\.getEntityEditorDelegate\(\)\.onOpenGoogleWallet\(isPrivateEntity\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove now-unused actual AI import
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.autofill\.settings\.options\.AutofillOptionsReferrer;\

      '
    replace: ''
- description: Remove now-unused actual AI import
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.autofill\.autofill_ai\.EntityDataManager;\

      '
    replace: ''
