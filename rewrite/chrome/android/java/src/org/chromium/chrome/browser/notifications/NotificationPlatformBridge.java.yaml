- description: Guard delayed close and clean all existing WebAPK/TWA/local or unsubscribe returns
  regex:
    pattern: "    private void closeNotificationInternal(\n            String notificationId, @Nullable String webApkPackage,\
      \ String scopeUrl) {\n        if (!TextUtils.isEmpty(webApkPackage)) {\n            WebApkServiceClient.getInstance()\n\
      \                    .cancelNotification(webApkPackage, notificationId, PLATFORM_ID);\n            return;\n       \
      \ }\n\n        if (getTwaClient().twaExistsForScope(Uri.parse(scopeUrl))) {\n            getTwaClient().cancelNotification(Uri.parse(scopeUrl),\
      \ notificationId, PLATFORM_ID);\n\n            // There's an edge case where a notification was displayed by Chrome,\
      \ a Trusted Web\n            // Activity is then installed and run then the notification is cancelled by javascript.\n\
      \            // Chrome will attempt to close the notification through the TWA client and not itself.\n            //\
      \ Since NotificationManager#cancel is safe to call if the requested notification\n            // isn't being shown,\
      \ we just call that as well to ensure notifications are cleared.\n        }\n\n        // The \"provisionally unsubscribed\"\
      \ service notification re-uses the tag of the organic\n        // notification it has replaced. Do not let this service\
      \ notification be canceled. If the\n        // user clicks `UNDO_UNSUBSCRIBE`, we will still restore the cancelled notification\
      \ for the\n        // sake of tangibly demonstrating to the user that the unsubscribe action was undone.\n        //\
      \ TODO(crbug.com/359593412): The organic notification is at this point already deleted from\n        // the NotificationDatabase\
      \ in response to it being closed by the developer. If we end up\n        // restoring it, user interactions other than\
      \ \"Unsubscribe\" will not work. Fix this.\n        String origin = getOriginFromNotificationTag(notificationId);\n\
      \        if (origin != null && sOriginsWithProvisionallyRevokedPermissions.containsKey(origin)) {\n            return;\n\
      \        }\n\n        mNotificationManager.cancel(notificationId, PLATFORM_ID);\n    }\n"
    replace: "    private void closeNotificationInternal(\n            String notificationId,\n            Object operation,\n\
      \            @Nullable String webApkPackage,\n            String scopeUrl) {\n        if (!isCurrentNotificationOperation(notificationId,\
      \ operation)) return;\n        try {\n            if (!TextUtils.isEmpty(webApkPackage)) {\n                WebApkServiceClient.getInstance()\n\
      \                        .cancelNotification(webApkPackage, notificationId, PLATFORM_ID);\n                return;\n\
      \            }\n\n            if (getTwaClient().twaExistsForScope(Uri.parse(scopeUrl))) {\n                getTwaClient().cancelNotification(Uri.parse(scopeUrl),\
      \ notificationId, PLATFORM_ID);\n\n                // There's an edge case where a notification was displayed by Chrome,\
      \ a Trusted Web\n                // Activity is then installed and run then the notification is cancelled by javascript.\n\
      \                // Chrome will attempt to close the notification through the TWA client and not itself.\n         \
      \       // Since NotificationManager#cancel is safe to call if the requested notification\n                // isn't\
      \ being shown, we just call that as well to ensure notifications are cleared.\n            }\n\n            // The \"\
      provisionally unsubscribed\" service notification re-uses the tag of the organic\n            // notification it has\
      \ replaced. Do not let this service notification be canceled. If the\n            // user clicks `UNDO_UNSUBSCRIBE`,\
      \ we will still restore the cancelled notification for the\n            // sake of tangibly demonstrating to the user\
      \ that the unsubscribe action was undone.\n            // TODO(crbug.com/359593412): The organic notification is at\
      \ this point already deleted from\n            // the NotificationDatabase in response to it being closed by the developer.\
      \ If we end up\n            // restoring it, user interactions other than \"Unsubscribe\" will not work. Fix this.\n\
      \            String origin = getOriginFromNotificationTag(notificationId);\n            if (origin != null && sOriginsWithProvisionallyRevokedPermissions.containsKey(origin))\
      \ {\n                return;\n            }\n\n            mNotificationManager.cancel(notificationId, PLATFORM_ID);\n\
      \        } finally {\n            finishNotificationOperation(notificationId, operation);\n        }\n    }\n"
  count: 1
