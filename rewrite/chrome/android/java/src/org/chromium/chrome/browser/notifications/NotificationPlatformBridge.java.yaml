      \                  scopeUrl);\n                ChromeWebApkHost.checkChromeBacksWebApkAsync(webApkPackageFound, callback);\n\
      \                return;\n            }\n        }\n        closeNotificationInternal(notificationId, webApkPackage,\
      \ scopeUrl);\n    }\n"
    replace: "    @CalledByNative\n    private void closeNotification(\n            final @JniType(\"std::string\") String\
      \ notificationId,\n            @JniType(\"std::string\") String scopeUrl,\n            boolean hasQueriedWebApkPackage,\n\
      \            @JniType(\"std::string\") String webApkPackage) {\n        if (sInstance != this) return;\n        final\
      \ Object operation = beginNotificationOperation(notificationId);\n        try {\n            if (!hasQueriedWebApkPackage)\
