# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.crash\.CrashUploadCountStore;\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.crash\.MinidumpUploadServiceImpl;\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ /\*\*\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \*\ Initializes\ the\ crash\ reporting\ system\.\ More\ specifically,\ enables\ the\ crash\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \*\ reporting\ system\ if\ it\ is\ user\-permitted,\ and\ initiates\ uploading\ of\ any\ pending\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \*\ crash\ reports\.\ Also\ updates\ some\ UMA\ metrics\ and\ performs\ cleanup\ in\ the\ local\ crash\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \*\ minidump\ storage\ directory\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \*/\

      \ \ \ \ \ \ \ \ \ \ \ \ private\ void\ initCrashReporting\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Crash\ reports\ can\ be\ uploaded\ as\ part\ of\ a\ background\ service\ even\ while\ the\ main\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Chrome\ activity\ is\ not\ running,\ and\ hence\ regular\ metrics\ reporting\ is\ not\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ possible\.\ Instead,\ metrics\ are\ temporarily\ written\ to\ prefs;\ export\ those\ prefs\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ to\ UMA\ metrics\ here\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MinidumpUploadServiceImpl\.storeBreakpadUploadStatsInUma\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ CrashUploadCountStore\.getInstance\(\)\);\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Likewise,\ this\ is\ a\ good\ time\ to\ process\ and\ clean\ up\ any\ pending\ or\ stale\ crash\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ reports\ left\ behind\ by\ previous\ runs\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ CrashFileManager\ crashFileManager\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ CrashFileManager\(ContextUtils\.getApplicationContext\(\)\.getCacheDir\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ crashFileManager\.cleanOutAllNonFreshMinidumpFiles\(\);\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ ANR\ collection\ is\ only\ available\ on\ R\+\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(Build\.VERSION\.SDK_INT\ >=\ Build\.VERSION_CODES\.R\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ crashFileManager\.collectAndWriteAnrs\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Next,\ identify\ any\ minidumps\ that\ lack\ logcat\ output,\ and\ are\ too\ old\ to\ add\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ logcat\ output\ to\.\ Mark\ these\ as\ ready\ for\ upload\.\ If\ there\ is\ a\ fresh\ minidump\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ that\ still\ needs\ logcat\ output\ to\ be\ attached,\ stash\ it\ for\ now\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ File\ minidumpMissingLogcat\ =\ processMinidumpsSansLogcat\(crashFileManager\);\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Now,\ upload\ all\ pending\ crash\ reports\ that\ are\ not\ still\ in\ need\ of\ logcat\ data\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ File\[\]\ minidumps\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ crashFileManager\.getMinidumpsReadyForUpload\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MinidumpUploadServiceImpl\.MAX_TRIES_ALLOWED\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(minidumps\.length\ >\ 0\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Log\.i\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TAG,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Attempting\ to\ upload\ %d\ accumulated\ crash\ dumps\.",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ minidumps\.length\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MinidumpUploadServiceImpl\.scheduleUploadJob\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Finally,\ if\ there\ is\ a\ minidump\ that\ still\ needs\ logcat\ output\ to\ be\ attached,\ do\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ so\ now\.\ Note:\ It''s\ important\ to\ do\ this\ strictly\ after\ calling\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ \|crashFileManager\.getMinidumpsReadyForUpload\(\)\|\.\ Otherwise,\ there\ is\ a\ race\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ between\ appending\ the\ logcat\ and\ getting\ the\ results\ from\ that\ call,\ as\ the\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ minidump\ will\ be\ renamed\ to\ be\ a\ valid\ file\ for\ upload\ upon\ logcat\ extraction\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ success\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(minidumpMissingLogcat\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Note:\ When\ using\ the\ JobScheduler\ API\ to\ schedule\ uploads,\ this\ call\ might\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ result\ in\ a\ duplicate\ request\ to\ schedule\ minidump\ uploads\ \-\-\ if\ the\ call\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ succeeds,\ and\ there\ were\ also\ other\ pending\ minidumps\ found\ above\.\ This\ is\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ fine;\ the\ job\ scheduler\ is\ robust\ to\ such\ duplicate\ calls\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AsyncTask\.THREAD_POOL_EXECUTOR\.execute\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ LogcatExtractionRunnable\(minidumpMissingLogcat\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \

      '
    replace: "            /** Preserves local crash diagnostics and cleans up stale reports. */\n            private void initCrashReporting() {\n                CrashFileManager crashFileManager =\n                        new CrashFileManager(ContextUtils.getApplicationContext().getCacheDir());\n                crashFileManager.cleanOutAllNonFreshMinidumpFiles();\n\n                // ANR collection is only available on R+.\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n                    crashFileManager.collectAndWriteAnrs();\n                }\n                File minidumpMissingLogcat = processMinidumpsSansLogcat(crashFileManager);\n                if (minidumpMissingLogcat != null) {\n                    AsyncTask.THREAD_POOL_EXECUTOR.execute(\n                            new LogcatExtractionRunnable(minidumpMissingLogcat));\n                }\n            }\n\n"
- description: Remove import used solely by excluded Actor startup
  regex:
    pattern: 'import org.chromium.chrome.browser.actor.ActorForegroundServiceManager;

      '
    replace: ''
  count: 1
- description: Remove import used solely by excluded Actor startup
  regex:
    pattern: 'import org.chromium.chrome.browser.glic.GlicEnabling;

      '
    replace: ''
  count: 1
- description: Remove Actor-only foreground-service startup while retaining ordinary native initialization
  regex:
    pattern: "\n        if (GlicEnabling.isEnabledByFlags()) {\n            ActorForegroundServiceManager.initialize();\n\
      \        }\n"
    replace: ''
  count: 1
- description: Remove dedicated price optimization registration
  regex:
    pattern: "                        // OptimizationTypes which we give a guarantee will be registered when we\n        \
      \                // pass the onDeferredStartup() signal to OptimizationGuide.\n                        optimizationGuideBridge.registerOptimizationTypes(\n\
      \                                List.of(OptimizationType.PRICE_TRACKING));\n"
    replace: ''
  count: 1
- description: Remove dedicated price deferred prefetch
  regex:
    pattern: "                    // TODO(crbug.com/40236066) Move to PersistedTabData.onDeferredStartup\n               \
      \     if (PriceTrackingFeatures.isPriceAnnotationsEligible(profile)) {\n                        ShoppingPersistedTabData.onDeferredStartup();\n\
      \                    }\n"
    replace: ''
  count: 1
- description: Remove exclusive PriceTrackingFeatures import
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceTrackingFeatures;

      '
    replace: ''
  count: 1
- description: Remove exclusive ShoppingPersistedTabData import
  regex:
    pattern: 'import org.chromium.chrome.browser.tab.state.ShoppingPersistedTabData;

      '
    replace: ''
  count: 1
- description: Remove exclusive OptimizationType import
  regex:
    pattern: 'import org.chromium.components.optimization_guide.proto.HintsProto.OptimizationType;

      '
    replace: ''
  count: 1
- description: Remove the excluded survey implementation import.
  regex:
    pattern: 'import org.chromium.chrome.browser.ui.hats.SurveyClientFactory;

      '
    replace: ''
  count: 1
- description: Remove survey factory process initialization; retain native privacy and policy initialization.
  regex:
    pattern: "        // Initialize UMA settings for survey component.\n        SurveyClientFactory.initialize(PrivacyPreferencesManagerImpl.getInstance());\n\
      \n"
    replace: ''
  count: 1
