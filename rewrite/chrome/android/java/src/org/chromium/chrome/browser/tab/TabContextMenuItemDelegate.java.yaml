substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove contextual-task implementation dependency from ordinary tab
    context menu
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.contextual_tasks\.ContextualTasksUtils;\

      '
    replace: ''
- description: Preserve normal printing preference policy without the excluded contextual-task
    URL special case
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(ContextualTasksUtils\.isContextualTasksUrl\(mTab\.getUrl\(\)\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: ''
- description: Remove the retired implementation factory import.
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceDropNotificationManagerFactory;

      '
    replace: ''
  count: 1
- description: Retain reading-list and offline-page actions without constructing price-notification code.
  regex:
    pattern: "                            new BookmarkManagerOpenerImpl(),\n                            PriceDropNotificationManagerFactory.create(mTab.getProfile()));"
    replace: '                            new BookmarkManagerOpenerImpl());'
  count: 1
