substitutions:
- description: Remove the import of the excluded Glic snackbar producer.
  regex:
    pattern: 'import org.chromium.chrome.browser.glic.GlicHelper;

      '
    replace: ''
  count: 1
- description: Remove the Glic-only onStart override; inherit the superclass ordinary lifecycle.
  regex:
    pattern: "    @Override\n    protected void onStart() {\n        super.onStart();\n        if (ChromeFeatureList.sGlicShowTaskInProgressSnackbar.getValue())\
      \ {\n            GlicHelper.maybeShowGlicTaskInProgressSnackbar(\n                    this, mProfile, this, GlicHelper.Caller.SETTINGS_ACTIVITY);\n\
      \        }\n    }\n\n"
    replace: ''
  count: 1
