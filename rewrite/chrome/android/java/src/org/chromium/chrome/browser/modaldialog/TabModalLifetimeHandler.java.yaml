- description: Cancel only a queued request whose original owner navigates or is replaced
  regex:
    re_pattern: \ \ \ \ private\ int\ mTabModalSuspendedToken;
    replace: "    private int mTabModalSuspendedToken;\n    private boolean mDestroyed;\n    private final Map<PropertyModel, QueuedDialogObserver> mQueuedDialogObservers =\n            new IdentityHashMap<>();\n\n    private final class QueuedDialogObserver implements TabObserver {\n        private final PropertyModel mModel;\n        private final Tab mOwner;\n        private final @Nullable WebContents mContents;\n        private final boolean mHasOwnerMetadata;\n\n        QueuedDialogObserver(PropertyModel model, Tab owner, @Nullable WebContents contents,\n                boolean hasOwnerMetadata) {\n            mModel = model;\n            mOwner = owner;\n            mContents = contents;\n            mHasOwnerMetadata = hasOwnerMetadata;\n        }\n\n        void onSelectedTabChanged(@Nullable Tab selected) {\n            if (selected == mOwner) return;\n            WebContents selectedContents = selected == null ? null : selected.getWebContents();\n            SplitTabCoordinator coordinator = mContents == null\n                    ? null : SplitTabCoordinator.fromWebContents(mContents);\n            // A modal APP dialog can suspend the presenter while its original split\n            // stays visible. Preserve each queued request independently of that presenter.\n            if (mHasOwnerMetadata && coordinator != null && coordinator.isShown()\n                    && selectedContents != null && coordinator.contains(selectedContents)) return;\n            // Custom models cannot carry their captured owner into presentation and\n            // therefore keep the ordinary switch-to-dismiss behavior.\n            dismiss(DialogDismissalCause.TAB_SWITCHED);\n        }\n\n        @Override\n        public void onPageLoadStarted(Tab tab, GURL url) {\n            if (tab == mOwner) dismiss(DialogDismissalCause.NAVIGATE);\n        }\n\n        @Override\n        public void onDestroyed(Tab tab) {\n            if (tab == mOwner) dismiss(DialogDismissalCause.TAB_DESTROYED);\n        }\n\n        @Override\n        public void onContentChanged(Tab tab) {\n            if (tab == mOwner && tab.getWebContents() != mContents) {\n                dismiss(DialogDismissalCause.WEB_CONTENTS_DESTROYED);\n            }\n        }\n\n        private void dismiss(@DialogDismissalCause int cause) {\n            stopObservingQueuedDialog(mModel);\n            mManager.dismissDialog(mModel, cause);\n        }\n\n        void detach() {\n            mOwner.removeObserver(this);\n        }\n    }\n\n    private void stopObservingQueuedDialog(PropertyModel model) {\n        QueuedDialogObserver observer = mQueuedDialogObservers.remove(model);\n        if (observer != null) observer.detach();\n    }\n\n    private void stopObservingQueuedDialogs() {\n        var observers = new ArrayList<>(mQueuedDialogObservers.values());\n        mQueuedDialogObservers.clear();\n        for (QueuedDialogObserver observer : observers) observer.detach();\n    }\n\n    private void dismissQueuedDialogsOutsideSelectedTab(@Nullable Tab selected) {\n        for (QueuedDialogObserver observer : new ArrayList<>(mQueuedDialogObservers.values())) {\n            observer.onSelectedTabChanged(selected);\n        }\n    }\n\n    @Override\n    public void onDialogQueued(PropertyModel model, @ModalDialogType int dialogType) {\n        if (dialogType != ModalDialogType.TAB || mQueuedDialogObservers.containsKey(model)) return;\n        if (mDestroyed) {\n            mManager.dismissDialog(model, DialogDismissalCause.ACTIVITY_DESTROYED);\n            return;\n        }\n        boolean supportsOwner = model.containsKey(ModalDialogProperties.TAB_MODAL_OWNER);\n        Object requestedOwner = supportsOwner ? model.get(ModalDialogProperties.TAB_MODAL_OWNER) : null;\n        Tab owner;\n        WebContents contents;\n        if (requestedOwner == null) {\n            TabModelSelector selector = mTabModelSelectorSupplier.get();\n            owner = selector == null ? null : selector.getCurrentTab();\n            contents = owner == null ? null : owner.getWebContents();\n        } else if (requestedOwner instanceof WebContents requestedContents\n                && !requestedContents.isDestroyed()) {\n            contents = requestedContents;\n            owner = TabUtils.fromWebContents(contents);\n        } else {\n            mManager.dismissDialog(model, DialogDismissalCause.WEB_CONTENTS_DESTROYED);\n            return;\n        }\n        if (owner == null || owner.isDestroyed()\n                || contents != null && (contents.isDestroyed() || owner.getWebContents() != contents)) {\n            mManager.dismissDialog(model, DialogDismissalCause.TAB_DESTROYED);\n            return;\n        }\n        // Capture legacy models at queue entry, before peer activation can change\n        // which tab the presenter's ordinary current-tab fallback would resolve.\n        boolean hasOwnerMetadata = supportsOwner && contents != null;\n        if (hasOwnerMetadata && requestedOwner == null) {\n            model.set(ModalDialogProperties.TAB_MODAL_OWNER, contents);\n        }\n        QueuedDialogObserver observer =\n                new QueuedDialogObserver(model, owner, contents, hasOwnerMetadata);\n        mQueuedDialogObservers.put(model, observer);\n        owner.addObserver(observer);\n    }"
