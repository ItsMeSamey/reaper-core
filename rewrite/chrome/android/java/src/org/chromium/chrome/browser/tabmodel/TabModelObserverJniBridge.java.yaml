# Connect Android split collections to model and transfer APIs.
substitutions:
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ \ \*/\

      \ \ \ \ private\ TabModelObserverJniBridge\(long\ nativeTabModelObserverJniBridge,\ TabModel\ tabModel\)\ \{\

      \ \ \ \ \ \ \ \ mNativeTabModelObserverJniBridge\ =\ nativeTabModelObserverJniBridge;\

      \ \ \ \ \ \ \ \ mTabModel\ =\ tabModel;\

      \ \ \ \ \}\

      \

      \ \ \ \ //\ TabModelObserver\ implementation\.\

      \ \ \ \ //\ These\ simply\ forward\ events\ to\ the\ corresponding\ native\ implementation\.\

      '
    replace: "     */\n    private TabModelObserverJniBridge(long nativeTabModelObserverJniBridge, TabModel tabModel) {\n        mNativeTabModelObserverJniBridge = nativeTabModelObserverJniBridge;\n        mTabModel = tabModel;\n    }\n\n    @Override\n    public void didChangeSplit(int[] affectedTabIds, boolean membershipChanged) {\n        if (mNativeTabModelObserverJniBridge == 0 || !membershipChanged) return;\n        TabModelObserverJniBridgeJni.get().didChangeSplit(\n                mNativeTabModelObserverJniBridge, affectedTabIds);\n    }\n\n    // TabModelObserver implementation.\n    // These simply forward events to the corresponding native implementation.\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ //\ Native\ functions\ that\ are\ implemented\ by\

      \ \ \ \ //\ browser/ui/android/tab_model/tab_model_observer_jni_bridge\.\*\.\

      \ \ \ \ @NativeMethods\

      \ \ \ \ interface\ Natives\ \{\

      \ \ \ \ \ \ \ \ void\ didSelectTab\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ long\ nativeTabModelObserverJniBridge,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @JniType\("TabAndroid\*"\)\ Tab\ tab,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int\ type,\

      '
    replace: "    // Native functions that are implemented by\n    // browser/ui/android/tab_model/tab_model_observer_jni_bridge.*.\n    @NativeMethods\n    interface Natives {\n        void didChangeSplit(long nativeTabModelObserverJniBridge,\n                @JniType(\"std::vector<int>\") int[] affectedTabIds);\n\n        void didSelectTab(\n                long nativeTabModelObserverJniBridge,\n                @JniType(\"TabAndroid*\") Tab tab,\n                int type,\n"
