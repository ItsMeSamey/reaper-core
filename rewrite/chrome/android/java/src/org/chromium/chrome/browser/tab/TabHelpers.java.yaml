substitutions:
- description: Remove price data prefetch initialization
  regex:
    pattern: "        // The following will start prefetching data for the price drops feature, so\n        // we should only\
      \ do it if the user is eligible for the feature (e.g. has sync enabled).\n        if (!tab.isOffTheRecord()\n      \
      \          && !((TabImpl) tab).isCustomTab()\n                && PriceTrackingFeatures.isPriceAnnotationsEligible(tab.getProfile()))\
      \ {\n            ShoppingPersistedTabData.initialize(tab);\n        }\n"
    replace: ''
  count: 1
- description: Remove exclusive PriceTrackingFeatures import
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceTrackingFeatures;

      '
    replace: ''
  count: 1
- description: Remove exclusive ShoppingPersistedTabData import
  regex:
    pattern: 'import org.chromium.chrome.browser.tab.state.ShoppingPersistedTabData;

      '
    replace: ''
  count: 1
