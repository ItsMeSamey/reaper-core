substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove the contextual-task JNI bridge dependency from ordinary gesture
    navigation
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.contextual_tasks\.ContextualTasksBridge;\

      '
    replace: ''
- description: Remove only the excluded contextual-task panel suppression; retain
    platform, flag and gesture-mode checks
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/527549133\):\ Temporary\ fix\
      for\ Android\ desktop\ when\ side\ panel\ is\ open\.\

      \ \ \ \ \ \ \ \ //\ We\ still\ need\ to\ fix\ back\ gesture\ navigation\ on\
      full\ AIM\ page\.\

      \ \ \ \ \ \ \ \ if\ \(ContextualTasksBridge\.isPanelOpen\(tab\)\)\ return\ false;\

      '
    replace: ''
