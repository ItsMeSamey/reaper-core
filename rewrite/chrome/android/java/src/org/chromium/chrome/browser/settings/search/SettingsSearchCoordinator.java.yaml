substitutions:
  - description:
      'Add Brave imports beneath the Settings search package declaration.'
    regex:
      re_pattern: '^(package [^;]+;\n)'
      re_flags: [MULTILINE]
      replace: |-
        \1
        import org.chromium.chrome.browser.theme.BraveDynamicColors;
        import org.chromium.components.browser_ui.settings.BraveSettingsIconTintUtils;

  - description: |
      Apply the Dynamic Colors tint to the Settings search icon by wrapping
      initializeSearchUi. The upstream body is renamed to
      initializeSearchUi_ChromiumImpl; a thin initializeSearchUi wrapper calls it
      and then applies the tint. Anchored on the method signature (a stable
      landmark), not on an interior statement.
    regex:
      re_pattern:
        '(public void )(initializeSearchUi)(\(@Nullable Bundle savedState\) \{)'
      replace: |-
        \1\2\3
                \2_ChromiumImpl(savedState);
                View searchBox = requireViewById(R.id.search_box);
                BraveSettingsIconTintUtils.applyIconTint(searchBox.requireViewById(R.id.search_icon), BraveDynamicColors.isDynamicColorsEnabled());
            }

            private void \2_ChromiumImpl\3
  - description: Refresh app-owned settings search labels from the current available index without rewriting user history.
    regex:
      re_pattern: "\\\n\\ \\ \\ \\ private\\ Fragment\\ displayRecentSearches\\(boolean\\ addToBackStack\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ var\\ fragment\\ =\\ new\\ RecentSearchesFragment\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ fragment\\.setPreferenceData\\(new\\ ArrayList<>\\(RecentSearchQueue\\.getInstance\\(\\)\\.values\\(\\)\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ fragment\\.setDeleteCallback\\(this::deleteRecentSearches\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ fragment\\.setSelectedCallback\\(this::onResultSelected\\);\\\n"
      replace: "\n    private Fragment displayRecentSearches(boolean addToBackStack) {\n        initIndex();\n        var entries = RecentSearchQueue.getInstance().getEntriesForDisplay(mIndexData);\n        if (entries.isEmpty()) {\n            return clearFragment(R.drawable.settings_zero_state, addToBackStack, emptyRunnable());\n        }\n        var fragment = new RecentSearchesFragment();\n        fragment.setPreferenceData(entries);\n        fragment.setDeleteCallback(this::deleteRecentSearches);\n        fragment.setSelectedCallback(this::onResultSelected);\n"
    count: 1
  - description: Refresh app-owned settings search labels from the current available index without rewriting user history.
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ var\\ fragment\\ =\\ \\(SearchResultsPreferenceFragment\\)\\ fm\\.findFragmentByTag\\(RESULT_FRAGMENT\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(fragment\\ !=\\ null\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ fragment\\.setSelectedCallback\\(this::onResultSelected\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(fragment\\ instanceof\\ RecentSearchesFragment\\ rsf\\)\\ \\{\\\n"
      replace: "        var fragment = (SearchResultsPreferenceFragment) fm.findFragmentByTag(RESULT_FRAGMENT);\n        if (fragment != null) {\n            fragment.refreshEntryLabels(ensureIndexBuilt(mActivity, mProfile));\n            fragment.setSelectedCallback(this::onResultSelected);\n            if (fragment instanceof RecentSearchesFragment rsf) {\n"
    count: 1
  - description: Use existing empty search presentation after restored entries become
      unavailable.
    regex:
      re_pattern: '\ \ \ \ private\ void\ maybeInitSearchResultsFragmentCallback\(Fragment\
        f\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(f\ instanceof\ SearchResultsPreferenceFragment\ srpf\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ srpf\.setSelectedCallback\(this::onResultSelected\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

        \

        '
      replace: "    private void maybeInitSearchResultsFragmentCallback(Fragment f)\
        \ {\n        if (f instanceof SearchResultsPreferenceFragment srpf) {\n    \
        \        srpf.setSelectedCallback(this::onResultSelected);\n            if (!srpf.hasEmptyRefreshedResults()\n\
        \                    || mFragmentState != FS_SEARCH\n                    ||\
        \ !srpf.isResumed()\n                    || mIsDestroyed\n                 \
        \   || mActivity.isFinishing()\n                    || mActivity.isDestroyed())\
        \ {\n                return;\n            }\n            FragmentManager fm\
        \ = getSettingsFragmentManager();\n            if (fm == null || fm.isStateSaved()\n\
        \                    || fm.findFragmentById(getViewIdForSearchDisplay()) !=\
        \ srpf) {\n                return;\n            }\n            // Reuse the\
        \ normal empty presentation only for the current restored search page.\n   \
        \         // Background result fragments and the user's current detail page\
        \ stay untouched.\n            boolean recent = srpf instanceof RecentSearchesFragment;\n\
        \            mResultReturned = false;\n            clearFragment(\n        \
        \            recent ? R.drawable.settings_zero_state : R.drawable.settings_no_match,\n\
        \                    /* addToBackStack= */ false,\n                    recent\
        \ ? emptyRunnable() : this::openHelpCenter);\n        }\n    }\n\n"
    count: 1
  - description: Use existing empty search presentation after restored entries become
      unavailable.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ var\ fragment\ =\ \(SearchResultsPreferenceFragment\)\
        fm\.findFragmentByTag\(RESULT_FRAGMENT\);\

        \ \ \ \ \ \ \ \ if\ \(fragment\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ fragment\.refreshEntryLabels\(ensureIndexBuilt\(mActivity,\
        mProfile\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ fragment\.setSelectedCallback\(this::onResultSelected\);\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(fragment\ instanceof\ RecentSearchesFragment\
        rsf\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ rsf\.setDeleteCallback\(this::deleteRecentSearches\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        '
      replace: "        var fragment = (SearchResultsPreferenceFragment) fm.findFragmentByTag(RESULT_FRAGMENT);\n\
        \        if (fragment != null) {\n            fragment.refreshEntryLabels(ensureIndexBuilt(mActivity,\
        \ mProfile));\n            maybeInitSearchResultsFragmentCallback(fragment);\n\
        \            if (fragment instanceof RecentSearchesFragment rsf) {\n       \
        \         rsf.setDeleteCallback(this::deleteRecentSearches);\n            }\n"
    count: 1
  - description: Use existing empty search presentation after restored entries become
      unavailable.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ enterSearchState\(/\*\ isRestored=\ \*/\ false\);\

        \ \ \ \ \}\

        \

        \ \ \ \ private\ void\ restoreFragmentState\(\)\ \{\

        \ \ \ \ \ \ \ \ var\ fm\ =\ assumeNonNull\(getSettingsFragmentManager\(\)\);\

        \ \ \ \ \ \ \ \ var\ emptyFragment\ =\ \(EmptyFragment\)\ fm\.findFragmentByTag\(EMPTY_FRAGMENT\);\

        \ \ \ \ \ \ \ \ if\ \(emptyFragment\ !=\ null\)\ emptyFragment\.setOpenHelpCenter\(this::openHelpCenter\);\

        '
      replace: "        enterSearchState(/* isRestored= */ false);\n    }\n\n    @VisibleForTesting\n\
        \    void restoreFragmentState() {\n        var fm = assumeNonNull(getSettingsFragmentManager());\n\
        \        var emptyFragment = (EmptyFragment) fm.findFragmentByTag(EMPTY_FRAGMENT);\n\
        \        if (emptyFragment != null) emptyFragment.setOpenHelpCenter(this::openHelpCenter);\n"
    count: 1
