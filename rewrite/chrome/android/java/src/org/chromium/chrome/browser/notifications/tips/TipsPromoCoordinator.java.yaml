substitutions:

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: remove typed Lens imports"
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensController;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensEntryPoint;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensIntentParams;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensMetrics;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove Lens-only stored constructor state"
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ final\\ WindowAndroid\\ mWindowAndroid;\\\n\\ \\ \\ \\ private\\ final\\ boolean\\ mIsIncognito;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove typed Lens field"
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ LensController\\ mLensController;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove Lens-only constructor state writes"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ mWindowAndroid\\ =\\ windowAndroid;\\\n\\ \\ \\ \\ \\ \\ \\ \\ mIsIncognito\\ =\\ isIncognito;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove unconditional provider acquisition"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ mLensController\\ =\\ LensController\\.getInstance\\(\\);\\\n"
    replace: ""
  count: 1
- description: "Lens extra: reject stale Lens tip before promo setup"
  regex:
    re_pattern: "\\ \\ \\ \\ public\\ void\\ showBottomSheet\\(\\)\\ \\{\\\n"
    replace: "    public void showBottomSheet() {\n        if (mFeatureType == TipsNotificationsFeatureType.GOOGLE_LENS) return;\n\n"
  count: 1
- description: "Lens extra: remove Lens launch implementation"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ case\\ TipsNotificationsFeatureType\\.GOOGLE_LENS:\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ LensMetrics\\.recordClicked\\(LensEntryPoint\\.TIPS_NOTIFICATIONS\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mLensController\\.startLens\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mWindowAndroid,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ new\\ LensIntentParams\\.Builder\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ LensEntryPoint\\.TIPS_NOTIFICATIONS,\\ mIsIncognito\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.build\\(\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ break;\\\n"
    replace: "            case TipsNotificationsFeatureType.GOOGLE_LENS:\n                // Ignore stale requests for this removed feature.\n                break;\n"
  count: 1
- description: "Lens extra: remove Lens shown metric"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ LensMetrics\\.recordShown\\(LensEntryPoint\\.TIPS_NOTIFICATIONS,\\ /\\*\\ isShown=\\ \\*/\\ true\\);\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove typed provider testing hook"
  regex:
    re_pattern: "\\ \\ \\ \\ void\\ setLensControllerForTesting\\(LensController\\ lensController\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mLensController\\ =\\ lensController;\\\n\\ \\ \\ \\ \\}\\\n\\\n"
    replace: ""
  count: 1
