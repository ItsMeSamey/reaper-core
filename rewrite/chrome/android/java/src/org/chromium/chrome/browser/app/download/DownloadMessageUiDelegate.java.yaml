    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ void\ removeNotification'
    replace: "    @Override\n    public boolean shouldSuppressDownloadUi(@Nullable String serializedOtrProfileId) {\n        return DownloadManagerService.shouldSuppressDownloadUi(serializedOtrProfileId);\n    }\n\n    @Override\n    public void removeNotification"
