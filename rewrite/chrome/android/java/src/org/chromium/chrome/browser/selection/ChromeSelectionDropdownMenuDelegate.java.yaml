# Keep native selection menu click metadata and view anchors.
substitutions:
  - description: "Preserve a clicked view for native hierarchical selection menus."
    regex:
      pattern: "context, items, (model, view) -> clickListener.onItemClick(model));"
      replace: "context, items, this::onMenuItemClick);"
  - description: "Route submenu clicks through the same extensible dispatch hook."
    regex:
      pattern: "                        (model, _) -> {\n                            assert mClickListener != null;\n                            mClickListener.onItemClick(model);\n                        });"
      replace: "                        this::onMenuItemClick);"
  - description: "Keep stock selection callbacks while permitting native menu callbacks."
    regex:
      pattern: "    @Override\n    public void dismiss() {"
      replace: "    /** Handles a clicked item without losing the view needed for submenu positioning. */\n    protected void onMenuItemClick(PropertyModel model, View view) {\n        assert mClickListener != null;\n        mClickListener.onItemClick(model);\n    }\n\n    @Override\n    public void dismiss() {"
