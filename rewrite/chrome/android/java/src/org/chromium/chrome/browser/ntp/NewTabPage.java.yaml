- description: Construct a single local header without Feed service or mediator
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Create\ and\ initialize\ the\ StaticNtpSurfaceCoordinator\ of\ this\ NewTabPage\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ activity\ The\ activity\ used\ to\ initialize\ the\ view\.\

      \ \ \ \ \ \*\ @param\ windowAndroid\ Provides\ the\ current\ active\ tab\.\

      \ \ \ \ \ \*\ @param\ activityResultTracker\ Tracker\ of\ activity\ results\.\

      \ \ \ \ \ \*\ @param\ snackbarManager\ \{@link\ SnackbarManager\}\ object\.\

      \ \ \ \ \ \*\ @param\ isInNightMode\ \{@code\ true\}\ if\ the\ night\ mode\ setting\ is\ on\.\

      \ \ \ \ \ \*\ @param\ shareDelegateSupplier\ Supplies\ a\ delegate\ used\ to\ open\ SharingHub\.\

      \ \ \ \ \ \*\ @param\ modalDialogManager\ Manager\ for\ displaying\ modal\ dialogs\.\

      \ \ \ \ \ \*\ @param\ edgeToEdgeControllerSupplier\ The\ supplier\ to\ \{@link\ EdgeToEdgeController\}\.\

      \ \ \ \ \ \*\ @param\ startupMetricsTracker\ Used\ to\ record\ NTP\ startup\ metric\.\

      \ \ \ \ \ \*\ @param\ tabModelSelector\ Selector\ for\ accessing\ tab\ models\.\

      \ \ \ \ \ \*\ @param\ moduleRegistrySupplier\ Supplier\ providing\ the\ module\ registry\.\

      \ \ \ \ \ \*/\

      \ \ \ \ @EnsuresNonNull\(\{"mStaticSurface"\}\)\

      \ \ \ \ protected\ void\ initializeStaticNtpSurfaceCoordinator\(\

      \ \ \ \ \ \ \ \ \ \ \ \ Activity\ activity,\

      \ \ \ \ \ \ \ \ \ \ \ \ WindowAndroid\ windowAndroid,\

      \ \ \ \ \ \ \ \ \ \ \ \ ActivityResultTracker\ activityResultTracker,\

      \ \ \ \ \ \ \ \ \ \ \ \ SnackbarManager\ snackbarManager,\

      \ \ \ \ \ \ \ \ \ \ \ \ boolean\ isInNightMode,\

      \ \ \ \ \ \ \ \ \ \ \ \ Supplier<@Nullable\ ShareDelegate>\ shareDelegateSupplier,\

      \ \ \ \ \ \ \ \ \ \ \ \ ModalDialogManager\ modalDialogManager,\

      \ \ \ \ \ \ \ \ \ \ \ \ MonotonicObservableSupplier<EdgeToEdgeController>\ edgeToEdgeControllerSupplier,\

      \ \ \ \ \ \ \ \ \ \ \ \ StartupMetricsTracker\ startupMetricsTracker,\

      \ \ \ \ \ \ \ \ \ \ \ \ TabModelSelector\ tabModelSelector,\

      \ \ \ \ \ \ \ \ \ \ \ \ OneshotSupplier<ModuleRegistry>\ moduleRegistrySupplier\)\ \{\

      \ \ \ \ \ \ \ \ Profile\ profile\ =\ mTab\.getProfile\(\);\

      \

      \ \ \ \ \ \ \ \ FeedSurfaceCoordinator\.ActionDelegateFactory\ createActionDelegate\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ FeedActionDelegateImpl\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ activity,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ windowAndroid,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ activityResultTracker,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SigninAndHistorySyncActivityLauncherImpl\.get\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ DeviceLockActivityLauncherImpl\.get\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ snackbarManager,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ modalDialogManager,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mNewTabPageManager\.getNavigationDelegate\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ BookmarkModel\.getForProfile\(profile\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ profile,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mBottomSheetController\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ openHelpPage\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ NewTabPageUma\.recordAction\(NewTabPageUma\.ACTION_CLICKED_LEARN_MORE\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ super\.openHelpPage\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \};\

      \

      \ \ \ \ \ \ \ \ mStaticSurface\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ FeedSurfaceCoordinator\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ activity,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ snackbarManager,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ windowAndroid,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ SnapScrollHelperImpl\(mNewTabPageManager,\ mNewTabPageCoordinator\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mNewTabPageLayout,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mBrowserControlsStateProvider\.getTopControlsHeight\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isInNightMode,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ this,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ profile,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mBottomSheetController,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ shareDelegateSupplier,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ externalScrollableContainerDelegate=\ \*/\ null,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PrivacyPreferencesManagerImpl\.getInstance\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mToolbarSupplier,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mConstructedTimeNs,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FeedSwipeRefreshLayout\.create\(activity,\ R\.id\.toolbar_container\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ overScrollDisabled=\ \*/\ false,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ createActionDelegate,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mTabStripHeightSupplier,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ edgeToEdgeControllerSupplier,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assumeNonNull\(moduleRegistrySupplier\)\.get\(\)\);\

      \ \ \ \ \ \ \ \ startupMetricsTracker\.registerNtpViewObserver\(mStaticSurface\.getView\(\)\);\

      \ \ \ \ \}\

      \

      '
    replace: "    /** Initialize the local NTP header and its window policies. */\n    @EnsuresNonNull({\"mStaticSurface\"})\n    private void initializeStaticSurface(\n            Activity activity,\n            MonotonicObservableSupplier<EdgeToEdgeController> edgeToEdgeControllerSupplier,\n            StartupMetricsTracker startupMetricsTracker) {\n        mStaticSurface = new StaticNtpSurfaceCoordinator(\n                activity, mTab, mNewTabPageLayout,\n                new SnapScrollHelperImpl(mNewTabPageManager, mNewTabPageCoordinator), this);\n        mStaticSurface.initializeWindow(activity, mTabStripHeightSupplier, edgeToEdgeControllerSupplier);\n        startupMetricsTracker.registerNtpViewObserver(mStaticSurface.getView());\n    }\n\n"
