substitutions:
- description: Remove the import of the excluded Glic snackbar producer.
  regex:
    pattern: 'import org.chromium.chrome.browser.glic.GlicHelper;

      '
    replace: ''
  count: 1
- description: Remove the import of excluded Glic tab-strip pinning.
  regex:
    pattern: 'import org.chromium.chrome.browser.glic.GlicUtils;

      '
    replace: ''
  count: 1
- description: Remove the retired Glic-only menu comment.
  regex:
    pattern: '        // Add "Pin Gemini" option with divider

      '
    replace: ''
  count: 1
- description: Remove the Glic pin menu while retaining original-profile lookup for vertical-tab badges.
  regex:
    pattern: "            if (GlicUtils.isTabStripGlicSupported(profile)) {\n                itemList.add(BasicListMenu.buildMenuDivider(isIncognito));\n\
      \n                boolean isPinned = GlicUtils.isButtonPinnedToTabStrip(profile);\n                itemList.add(\n \
      \                       new ListItemBuilder()\n                                .withTitleRes(isPinned ? R.string.glic_unpin\
      \ : R.string.glic_pin)\n                                .withMenuId(isPinned ? R.id.unpin_glic : R.id.pin_glic)\n  \
      \                              .withIsIncognito(isIncognito)\n                                .build());\n         \
      \   }\n"
    replace: ''
  count: 1
- description: Remove the click delegate profile lookup used only by the retired Glic actions.
  regex:
    pattern: "            Profile profile = mTabModel.getProfile();\n            if (profile != null) {\n                profile\
      \ = profile.getOriginalProfile();\n            }\n"
    replace: ''
  count: 1
- description: Remove Glic pin/unpin callbacks and their optional action recording, preserving adjacent ordinary actions.
  regex:
    pattern: "            } else if (model.get(MENU_ITEM_ID) == R.id.pin_glic) {\n                TabStripMenuMetricsUtils.recordStripMenuUserAction(\n\
      \                        StripMenuAction.PIN_GLIC, mTabStripLayout);\n                if (profile != null) {\n     \
      \               GlicUtils.setButtonPinnedToTabStrip(profile, true);\n                }\n            } else if (model.get(MENU_ITEM_ID)\
      \ == R.id.unpin_glic) {\n                TabStripMenuMetricsUtils.recordStripMenuUserAction(\n                     \
      \   StripMenuAction.UNPIN_GLIC, mTabStripLayout);\n                if (profile != null) {\n                    GlicUtils.setButtonPinnedToTabStrip(profile,\
      \ false);\n                    GlicHelper.showUnpinnedSnackbar(mSnackbarManager, mContext, profile);\n             \
      \   }\n"
    replace: ''
  count: 1
