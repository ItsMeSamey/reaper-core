substitutions:
- description: Restore foreign Android session contents and handle missing restore data (1).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ ResettersForTesting\.register\(\(\)\ \->\ sTryStartActivityResultForTesting\ =\ null\);\

      \ \ \ \ \}\

      \

      \ \ \ \ private\ static\ Intent\ createTrustedPopupIntent\(\

      \ \ \ \ \ \ \ \ \ \ \ \ Context\ context,\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ WindowFeatures\ windowFeatures,\

      '
    replace: "        ResettersForTesting.register(() -> sTryStartActivityResultForTesting = null);\n    }\n\n    @CalledByNativeForTesting\n    public static void clearTryStartActivityResultForTesting() {\n        sTryStartActivityResultForTesting = null;\n    }\n\n    private static Intent createTrustedPopupIntent(\n            Context context,\n            @Nullable WindowFeatures windowFeatures,\n"
