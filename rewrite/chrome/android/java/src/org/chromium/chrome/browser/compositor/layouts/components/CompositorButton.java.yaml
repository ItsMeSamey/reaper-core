substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove excluded AI button types from the actual core button contract
  regex:
    re_pattern: '\

      \ \ \ \ \ \ \ \ ButtonType\.GLIC,\

      '
    replace: '

      '
- description: Remove exclusively AI button type constants; keep numeric values of
    ordinary button types
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ int\ GLIC\ =\ 3;\

      '
    replace: ''
- description: Remove excluded AI button types from the actual core button contract
  regex:
    re_pattern: '\

      \ \ \ \ \ \ \ \ ButtonType\.GLIC_DISMISS_NUDGE,\

      '
    replace: '

      '
- description: Remove exclusively AI button type constants; keep numeric values of
    ordinary button types
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ int\ GLIC_DISMISS_NUDGE\ =\ 4;\

      '
    replace: ''
- description: Remove excluded AI button types from the actual core button contract
  regex:
    re_pattern: '\

      \ \ \ \ \ \ \ \ ButtonType\.GLIC_ACTOR,\

      '
    replace: '

      '
- description: Remove exclusively AI button type constants; keep numeric values of
    ordinary button types
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ int\ GLIC_ACTOR\ =\ 5;\

      '
    replace: ''
- description: Remove actual AI button priority dispatch; retain normal incognito/new-tab/tab-search/close
    accessibility priorities
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ ButtonType\.GLIC,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ButtonType\.GLIC_ACTOR,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ButtonType\.GLIC_DISMISS_NUDGE,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ButtonType\.INCOGNITO_SWITCHER,'
    replace: '            case ButtonType.INCOGNITO_SWITCHER,'
