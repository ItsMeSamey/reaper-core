substitutions:
  - description: Refresh app-owned settings search labels from the current available index without rewriting user history.
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ PreferenceScreen\\ screen\\ =\\ getPreferenceManager\\(\\)\\.createPreferenceScreen\\(requireContext\\(\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ setPreferenceScreen\\(screen\\);\\\n"
      replace: "        }\n\n        if (mDisplayIndex != null) {\n            mPreferenceData =\n                    RecentSearchQueue.resolveEntriesForDisplay(mPreferenceData, mDisplayIndex);\n        }\n        PreferenceScreen screen = getPreferenceManager().createPreferenceScreen(requireContext());\n        setPreferenceScreen(screen);\n"
    count: 1
  - description: Refresh app-owned settings search labels from the current available index without rewriting user history.
    regex:
      re_pattern: "\\ \\ \\ \\ public\\ void\\ setPreferenceData\\(ArrayList<SettingsIndexData\\.Entry>\\ results\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mPreferenceData\\ =\\ results;\\\n\\ \\ \\ \\ \\}\\\n\\\n"
      replace: "    public void setPreferenceData(ArrayList<SettingsIndexData.Entry> results) {\n        mPreferenceData = results;\n    }\n\n    /** Refreshes restored app-owned labels without changing the saved query or selection args. */\n    void refreshEntryLabels(SettingsIndexData index) {\n        mDisplayIndex = index;\n        if (mPreferenceData == null) return;\n        mPreferenceData = RecentSearchQueue.resolveEntriesForDisplay(mPreferenceData, index);\n        PreferenceScreen screen = getPreferenceScreen();\n        if (screen != null) {\n            screen.removeAll();\n            buildPreferences(screen);\n        }\n    }\n\n"
    count: 1
  - description: Refresh app-owned settings search labels from the current available index without rewriting user history.
    regex:
      re_pattern: "\\ \\ \\ \\ protected\\ @Nullable\\ ArrayList<SettingsIndexData\\.Entry>\\ mPreferenceData;\\\n\\ \\ \\ \\ private\\ @Nullable\\ SelectedCallback\\ mSelectedCallback;\\\n\\\n\\ \\ \\ \\ /\\*\\*\\\n"
      replace: "    protected @Nullable ArrayList<SettingsIndexData.Entry> mPreferenceData;\n    private @Nullable SelectedCallback mSelectedCallback;\n    private @Nullable SettingsIndexData mDisplayIndex;\n\n    /**\n"
    count: 1
  - description: Use existing empty search presentation after restored entries become
      unavailable.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ screen\.removeAll\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ buildPreferences\(screen\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        '
      replace: "            screen.removeAll();\n            buildPreferences(screen);\n\
        \        }\n    }\n\n    /** Whether restored entries have been resolved and\
        \ none remain available for display. */\n    boolean hasEmptyRefreshedResults()\
        \ {\n        return mDisplayIndex != null && mPreferenceData != null && mPreferenceData.isEmpty();\n\
        \    }\n\n    /**\n"
    count: 1
