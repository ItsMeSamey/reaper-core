substitutions:
- description: Remove the import of the excluded Glic snackbar producer.
  regex:
    pattern: 'import org.chromium.chrome.browser.glic.GlicHelper;

      '
    replace: ''
  count: 1
- description: Remove the Glic-only onStart override; inherit the superclass ordinary lifecycle.
  regex:
    pattern: "    @Override\n    protected void onStart() {\n        super.onStart();\n        if (ChromeFeatureList.sGlicShowTaskInProgressSnackbar.getValue())\
      \ {\n            getProfileSupplier()\n                    .runSyncOrOnAvailable(\n                            (Profile\
      \ profile) ->\n                                    GlicHelper.maybeShowGlicTaskInProgressSnackbar(\n               \
      \                             this,\n                                            profile,\n                        \
      \                    this,\n                                            GlicHelper.Caller.SNACKBAR_ACTIVITY));\n   \
      \     }\n    }\n\n"
    replace: ''
  count: 1
- description: Remove an import used only by the retired Glic onStart callback.
  regex:
    pattern: 'import org.chromium.chrome.browser.flags.ChromeFeatureList;

      '
    replace: ''
  count: 1
- description: Remove an import used only by the retired Glic onStart callback.
  regex:
    pattern: 'import org.chromium.chrome.browser.profiles.Profile;

      '
    replace: ''
  count: 1
