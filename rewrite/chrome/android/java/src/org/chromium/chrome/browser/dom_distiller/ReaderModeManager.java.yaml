substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove the Actor UI implementation dependency while retaining ordinary
    browser reading/preview behavior
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController;\

      '
    replace: ''
- description: Run the existing Reader Mode activation callback directly, retaining
    its original core logic
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ ActorUiTabController\ controller\ =\ ActorUiTabController\.from\(mTab\);\

      \ \ \ \ \ \ \ \ if\ \(controller\ ==\ null\ \|\|\ !controller\.showTaskAbortConfirmationDialog\(activateCallback\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ activateCallback\.onResult\(true\);\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: '        activateCallback.onResult(true);

      '
