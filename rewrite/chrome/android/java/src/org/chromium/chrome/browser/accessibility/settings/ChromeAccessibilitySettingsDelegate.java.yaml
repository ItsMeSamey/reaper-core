substitutions:
- description: Remove dedicated image descriptions settings delegate method
  regex:
    pattern: "    @Override\n    public boolean shouldShowImageDescriptionsSetting() {\n        return ImageDescriptionsController.getInstance().shouldShowImageDescriptionsMenuItem();\n\
      \    }\n\n"
    replace: ''
  count: 1
- description: Remove import used only by retired image-description code
  regex:
    pattern: 'import org.chromium.chrome.browser.image_descriptions.ImageDescriptionsController;

      '
    replace: ''
  count: 1
