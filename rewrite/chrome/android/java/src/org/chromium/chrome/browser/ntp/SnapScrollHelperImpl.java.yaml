  regex:
    re_pattern: public\ class\ SnapScrollHelperImpl\ implements\ SnapScrollHelper\ \{
    replace: public class SnapScrollHelperImpl {
- description: Remove obsolete interface override annotations
  regex:
    re_pattern: '\

      \ \ \ \ @Override\

      '
