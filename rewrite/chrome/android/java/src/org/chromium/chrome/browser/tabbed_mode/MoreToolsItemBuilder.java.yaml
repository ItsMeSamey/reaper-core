# Android DevTools profile ownership and phone entry.
substitutions:
- description: Read the Android extension build flag
  regex:
    re_pattern: import\ org\.chromium\.build\.annotations\.Contract;
    replace: 'import org.chromium.build.BuildConfig;

      import org.chromium.build.annotations.Contract;'
- description: Allow ordinary-page inspection on extension-enabled Android phones
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ !DeviceFormFactor\.isNonMultiDisplayContextOnTablet\(mContext\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ currentTab\ ==\ null'
    replace: "                || (!BuildConfig.IS_DESKTOP_ANDROID\n                        && !DeviceFormFactor.isNonMultiDisplayContextOnTablet(mContext))\n                || currentTab == null"
