substitutions:
- description: Remove unreachable dedicated Actor getOngoingActorTasks contract implementation
  regex:
    pattern: "        @Override\n        public List<Integer> getOngoingActorTasks() {\n            // Intentionally returning\
      \ an empty list to skip this check.\n            return Collections.emptyList();\n        }\n\n"
    replace: ''
  count: 1
- description: Remove unreachable dedicated Actor showActorTaskDeletionConfirmationDialog contract implementation
  regex:
    pattern: "        @Override\n        public void showActorTaskDeletionConfirmationDialog(\n                Callback<@ActionConfirmationResult\
      \ Integer> onResult) {\n            assert false : \"Ungroup tab does not support actor task deletion dialogs.\";\n\
      \            onResult.onResult(ActionConfirmationResult.IMMEDIATE_CONTINUE);\n        }\n\n"
    replace: ''
  count: 1
- description: Remove the now-unused import owned solely by the Actor empty-list contract
  regex:
    pattern: 'import java.util.Collections;

      '
    replace: ''
  count: 1
