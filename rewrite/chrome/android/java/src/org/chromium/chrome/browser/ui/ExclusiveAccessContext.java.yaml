- {"description": "Android accepted DOM bridge and request metadata 5", "regex": {"re_pattern": "\\ \\ \\ \\ @CalledByNative\\\n\\ \\ \\ \\ public\\ void\\ enterFullscreenModeForTab\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ long\\ displayId,\\ boolean\\ prefersNavigationBar,\\ boolean\\ prefersStatusBar\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(mActiveTab\\ !=\\ null\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ FullscreenOptions\\ options\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ new\\ FullscreenOptions\\(prefersNavigationBar,\\ prefersStatusBar,\\ displayId\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mFullscreenManager\\.onEnterFullscreen\\(mActiveTab,\\ options\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\}\\\n\\\n", "replace": "    @CalledByNative\n    public void enterFullscreenModeForTab(\n            long displayId, boolean prefersNavigationBar, boolean prefersStatusBar) {\n        Tab tab = mActiveTab;\n        if (tab != null) {\n            // Publish the accepted owner before fullscreen observers can reenter.\n            mTabFullscreenRequestTab = tab;\n            mTabFullscreenRequestGeneration++;\n            FullscreenOptions options =\n                    new FullscreenOptions(prefersNavigationBar, prefersStatusBar, displayId);\n            mExclusiveAccessRequestGeneration =\n                    mExclusiveAccessManager == null\n                            ? 0\n                            : mExclusiveAccessManager.onFullscreenRequestAccepted(tab, options);\n            mFullscreenManager.onEnterFullscreen(tab, options);\n        }\n    }\n\n    @CalledByNative\n    public long getTabFullscreenRequestGeneration() {\n        return mTabFullscreenRequestGeneration;\n    }\n\n    @CalledByNative\n    public void exitTabFullscreenMode(long requestGeneration) {\n        Tab tab = mTabFullscreenRequestTab;\n        if (tab == null || requestGeneration != mTabFullscreenRequestGeneration) return;\n        // Retire this request before callbacks. A replacement request keeps its own token.\n        retireTabFullscreenRequest();\n        mFullscreenManager.onExitFullscreen(tab);\n    }\n\n    private void retireTabFullscreenRequest() {\n        Tab tab = mTabFullscreenRequestTab;\n        long requestGeneration = mExclusiveAccessRequestGeneration;\n        mTabFullscreenRequestTab = null;\n        mTabFullscreenRequestGeneration++;\n        mExclusiveAccessRequestGeneration = 0;\n        if (tab != null && mExclusiveAccessManager != null) {\n            mExclusiveAccessManager.onFullscreenRequestExited(tab, requestGeneration);\n        }\n    }\n\n"}}
- {"description": "Android accepted DOM bridge and request metadata 6", "regex": {"re_pattern": "\\ \\ \\ \\ public\\ void\\ exitFullscreenModeForTab\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ //\\ Native\\ context\\ ExitFullscreen\\ exits\\ the\\ window\\.\\ The\\ native\\ DOM\\-to\\-browser\\ return\\\n\\ \\ \\ \\ \\ \\ \\ \\ //\\ branch\\ bypasses\\ this\\ callback\\ and\\ preserves\\ the\\ browser\\ request\\.\\\n\\ \\ \\ \\ \\ \\ \\ \\ mFullscreenManager\\.setBrowserFullscreenMode\\(false\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(mActiveTab\\ !=\\ null\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mFullscreenManager\\.onExitFullscreen\\(mActiveTab\\);\\\n", "replace": "    public void exitFullscreenModeForTab() {\n        // Native context ExitFullscreen exits the window. The native DOM-to-browser return\n        // branch bypasses this callback and preserves the browser request.\n        retireTabFullscreenRequest();\n        mFullscreenManager.setBrowserFullscreenMode(false);\n        if (mActiveTab != null) {\n            mFullscreenManager.onExitFullscreen(mActiveTab);\n"}}
