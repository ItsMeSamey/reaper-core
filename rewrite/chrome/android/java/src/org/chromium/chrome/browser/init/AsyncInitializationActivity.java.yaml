      import\ org\.chromium\.chrome\.browser\.profiles\.Profile;\

      import\ org\.chromium\.chrome\.browser\.profiles\.ProfileProvider;\

      import\ org\.chromium\.chrome\.browser\.tabmodel\.SupportedProfileType;\

      import\ org\.chromium\.chrome\.browser\.util\.BrowserUiUtils;\

      import\ org\.chromium\.components\.browser_ui\.share\.ShareHelper;\

      import\ org\.chromium\.components\.browser_ui\.util\.FirstDrawDetector;\

      import\ org\.chromium\.ui\.base\.ActivityIntentRequestTrackerDelegate;\

      '
    replace: 'import org.chromium.chrome.browser.multiwindow.WindowOcclusionTracker;

      import org.chromium.chrome.browser.profiles.Profile;

      import org.chromium.chrome.browser.profiles.ProfileProvider;

      import org.chromium.chrome.browser.tabmodel.SupportedProfileType;

      import org.chromium.chrome.browser.ui.browser_window.ChromeAndroidTaskTracker;

      import org.chromium.chrome.browser.ui.browser_window.ChromeAndroidTaskTrackerFactory;

      import org.chromium.chrome.browser.util.BrowserUiUtils;

      import org.chromium.components.browser_ui.share.ShareHelper;

      import org.chromium.components.browser_ui.util.FirstDrawDetector;

      import org.chromium.ui.base.ActivityIntentRequestTrackerDelegate;

      '
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
  regex:
    re_pattern: '\

      \ \ \ \ @CallSuper\

      \ \ \ \ @Override\

      \ \ \ \ protected\ void\ onDestroy\(\)\ \{\

      \ \ \ \ \ \ \ \ mDestroyed\ =\ true;\

      \

      \ \ \ \ \ \ \ \ //\ Dispatch\ onDestroy\(\)\ for\ objects\ created\ for\ the\ activity\.\

      \ \ \ \ \ \ \ \ mLifecycleDispatcher\.dispatchOnDestroy\(\);\

      '
    replace: "\n    @CallSuper\n    @Override\n    protected void onDestroy() {\n        Integer pendingId = ChromeAndroidTaskTracker.getPendingTaskIdFromIntent(getIntent());\n\
      \        if (pendingId != null) {\n            ChromeAndroidTaskTrackerFactory.getInstance()\n                    .unregisterPendingTaskActivity(pendingId,\
      \ this);\n        }\n        mDestroyed = true;\n\n        // Dispatch onDestroy() for objects created for the activity.\n\
      \        mLifecycleDispatcher.dispatchOnDestroy();\n"
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (3)
  regex:
    re_pattern: '\

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ @return\ true\ if\ will\ proceed\ with\ Activity\ creation,\ false\ if\ will\ abort\.\

      \ \ \ \ \ \*/\

      \ \ \ \ private\ boolean\ onCreateInternal\(@Nullable\ Bundle\ savedInstanceState\)\ \{\

      \ \ \ \ \ \ \ \ initializeStartupMetrics\(\);\

      \ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.sClearIntentWhenRecreated\.isEnabled\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ setIntent\(IntentHandler\.rewriteFromHistoryIntent\(getIntent\(\),\ null\)\);\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @LaunchIntentDispatcher\.Action\

      \ \ \ \ \ \ \ \ int\ dispatchAction\ =\ maybeDispatchLaunchIntent\(getIntent\(\),\ savedInstanceState\);\

      '
    replace: "\n    /**\n     * @return true if will proceed with Activity creation, false if will abort.\n     */\n    private\
      \ boolean admitPendingBrowserWindowRequest() {\n        Integer pendingId = ChromeAndroidTaskTracker.getPendingTaskIdFromIntent(getIntent());\n\
      \        return pendingId == null\n                || ChromeAndroidTaskTrackerFactory.getInstance()\n              \
      \          .registerPendingTaskActivity(pendingId, this);\n    }\n\n    private boolean onCreateInternal(@Nullable Bundle\
      \ savedInstanceState) {\n        initializeStartupMetrics();\n        if (!ChromeFeatureList.sClearIntentWhenRecreated.isEnabled())\
      \ {\n            setIntent(IntentHandler.rewriteFromHistoryIntent(getIntent(), null));\n        }\n\n        // Validate\
      \ and own an internal request before subclass launch dispatch,\n        // WindowAndroid creation or ProfileProvider\
      \ construction.\n        if (!admitPendingBrowserWindowRequest()) {\n            abortLaunch(LaunchIntentDispatcher.Action.FINISH_ACTIVITY);\n\
      \            return false;\n        }\n\n        @LaunchIntentDispatcher.Action\n        int dispatchAction = maybeDispatchLaunchIntent(getIntent(),\
      \ savedInstanceState);\n"
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (4)
  regex:
    re_pattern: '\ \ \ \ \}\

      \

      \ \ \ \ @Override\

      \ \ \ \ public\ final\ void\ onCreateWithNative\(\)\ \{\

      \ \ \ \ \ \ \ \ mLifecycleDispatcher\.onCreateWithNative\(\);\

      \ \ \ \ \ \ \ \ ChromeBrowserInitializer\.getInstance\(\)\.handlePostNativeStartup\(true,\ this\);\

      \ \ \ \ \}\

      \

      '
    replace: "    }\n\n    @Override\n    public final void onCreateWithNative() {\n        // A Profile can retire while\
      \ the native library is loading. The tracker\n        // also finishes any previously admitted Activity during cancellation;\n\
      \        // existing asynchronous startup delegates then observe isFinishing().\n        if (!admitPendingBrowserWindowRequest())\
      \ {\n            finish();\n            return;\n        }\n        mLifecycleDispatcher.onCreateWithNative();\n   \
      \     ChromeBrowserInitializer.getInstance().handlePostNativeStartup(true, this);\n    }\n\n"
