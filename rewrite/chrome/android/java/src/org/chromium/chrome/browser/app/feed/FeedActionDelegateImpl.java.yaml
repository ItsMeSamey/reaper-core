substitutions:
- description: Remove the retired implementation factory import.
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceDropNotificationManagerFactory;

      '
    replace: ''
  count: 1
- description: Retain ordinary reading-list creation without a price-notification implementation.
  regex:
    pattern: "                            new BookmarkManagerOpenerImpl(),\n                            PriceDropNotificationManagerFactory.create(mProfile));"
    replace: '                            new BookmarkManagerOpenerImpl());'
  count: 1
