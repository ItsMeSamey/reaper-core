# Android mixed native-tab and Java-window session restoration.
substitutions:
- description: Share the existing stateless model-based group reconstruction with native sessions
  regex:
    re_pattern: \ \ \ \ private\ void\ restoreTabGroup\(
    replace: '    private static void restoreTabGroup('
- description: The shared helper receives its exact model directly instead of an instance selector
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ assert\ mTabModelSelector\.getModel\(tabModel\.isIncognito\(\)\)\ ==\ tabModel;\

      \

      '
    replace: '        // Native callers have resolved the exact destination model before reconstruction.

      '
