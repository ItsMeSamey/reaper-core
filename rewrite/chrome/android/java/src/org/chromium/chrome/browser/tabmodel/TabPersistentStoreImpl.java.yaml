    replace: extractTabState(mTab)
- description: Reconstruct complete native splits at the all-tabs-loaded UI barrier
  count: 1
  regex:
    re_pattern: '\ \ \ \ private\ void\ onStateLoaded\(\)\ \{\

      \ \ \ \ \ \ \ \ for\ \(TabPersistentStoreObserver\ observer\ :\ mObservers\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ mergeState\(\)\ starts\ an\ AsyncTask\ to\ call\ this\ and\ this\ calls\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ onTabStateInitialized\ which\ should\ be\ called\ from\ the\ UI\ thread\.\

      \ \ \ \ \ \ \ \ \ \ \ \ PostTask\.runOrPostTask\(TaskTraits\.UI_DEFAULT,\ observer::onStateLoaded\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}'
    replace: "    private void onStateLoaded() {\n        // Merging can finish off-thread; rebuild pairs and signal completion in one UI task.\n        PostTask.runOrPostTask(TaskTraits.UI_DEFAULT, () -> {\n            if (mDestroyed) return;\n            restorePendingSplits();\n            if (mDestroyed) return;\n            for (TabPersistentStoreObserver observer : mObservers) observer.onStateLoaded();\n        });\n    }"
- description: Validate complete pairs and restore them through the native model instead of trusting saved metadata
  count: 1
  regex:
    re_pattern: \ \ \ \ private\ void\ onStateLoaded\(\)\ \{
    replace: "    /** Preserve saved pairs while their second member is still being loaded. */\n    private @Nullable TabState extractTabState(Tab tab) {\n        TabState state = TabStateExtractor.from(tab);\n        Tab.SplitData pending = mPendingSplitRestores.get(tab);\n        if (state != null && pending != null) {\n            state.splitTabId = pending.getToken();\n            state.splitLayout = pending.getLayout();\n            state.splitRatio = pending.getRatio();\n            state.splitPosition = pending.getPosition();\n        }\n        return state;\n    }\n\n    /** Rebuild real native collections only when both saved members have arrived. */\n    @VisibleForTesting\n    void restorePendingSplits() {\n        ThreadUtils.assertOnUiThread();\n        Map<Tab, Tab.SplitData> saved = new HashMap<>(mPendingSplitRestores);\n        mPendingSplitRestores.clear();\n        for (boolean incognito : new boolean[] {false, true}) {\n            if (mDestroyed) return;\n            TabModel model = mTabModelSelector.getModel(incognito);\n            Map<Token, List<Tab>> pairs = new HashMap<>();\n            for (Entry<Tab, Tab.SplitData> entry : saved.entrySet()) {\n                Tab tab = entry.getKey();\n                if (tab.isDestroyed() || tab.isIncognito() != incognito\n                        || model.getTabById(tab.getId()) != tab) continue;\n                pairs.computeIfAbsent(entry.getValue().getToken(), ignored -> new ArrayList<>()).add(tab);\n            }\n            for (List<Tab> members : pairs.values()) {\n                if (mDestroyed) return;\n                members.removeIf(tab -> tab.isDestroyed() || model.getTabById(tab.getId()) != tab);\n                boolean restored = false;\n                if (members.size() == 2) {\n                    Tab first = members.get(0);\n                    Tab second = members.get(1);\n                    Tab.SplitData a = assumeNonNull(saved.get(first));\n                    Tab.SplitData b = assumeNonNull(saved.get(second));\n                    if (a.getPosition() != b.getPosition() && a.getLayout() == b.getLayout()\n                            && Double.compare(a.getRatio(), b.getRatio()) == 0) {\n                        restored = model.restoreSplit(new SplitInfo(a.getToken(),\n                                a.getPosition() == 0 ? first.getId() : second.getId(),\n                                a.getPosition() == 0 ? second.getId() : first.getId(),\n                                a.getLayout(), a.getRatio()));\n                    }\n                }\n                if (mDestroyed) return;\n                if (!restored) {\n                    for (Tab member : members) {\n                        // A user or synchronous observer may already have made a different real pair.\n                        if (!member.isDestroyed() && model.getTabById(member.getId()) == member\n                                && model.getSplitInfoForTab(member.getId()) == null) {\n                            member.setSplitData(null, 0, 0.5, -1);\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    private void onStateLoaded() {"
