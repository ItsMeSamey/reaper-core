    re_pattern: import\ org\.chromium\.base\.ThreadUtils;
    replace: 'import org.chromium.base.ThreadUtils;

      import org.chromium.base.Token;'
- description: Retain immutable saved split metadata separately from live native membership during startup
  count: 1
  regex:
    re_pattern: \ \ \ \ private\ boolean\ mDestroyed;
    replace: "    private boolean mDestroyed;\n\n    // Keep original saved values until both members exist; native attachment may clear the mirror.\n    private final Map<Tab, Tab.SplitData> mPendingSplitRestores = new HashMap<>();"
- description: Collect split restore state using actual returned tabs, including remapped Android IDs
  count: 1
  regex:
    re_pattern: \ \ \ \ \ \ \ \ if\ \(tab\ !=\ null\ \&\&\ tabState\.shouldMigrate\)\ \{
    replace: "        if (tab != null && Tab.SplitData.isValid(tabState.splitTabId, tabState.splitLayout,\n                tabState.splitRatio, tabState.splitPosition)) {\n            mPendingSplitRestores.put(tab, new Tab.SplitData(assumeNonNull(tabState.splitTabId),\n                    tabState.splitLayout, tabState.splitRatio, tabState.splitPosition));\n        }\n        if (tab != null && tabState.shouldMigrate) {"
- description: Release unfinished split restore snapshots when the persistent store is destroyed
  count: 1
  regex:
    re_pattern: \ \ \ \ \ \ \ \ mDestroyed\ =\ true;
    replace: "        mDestroyed = true;\n        mPendingSplitRestores.clear();"
