  - description: Reaper Android physical optional AI caller closure; retain exact ordinary
      launch/tab-menu behavior and disclosed ordinary fixture assertions.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withTitle\(title\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withMenuId\(R\.id\.new_tab_to_the_right_menu_id\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withIsIncognito\(isIncognito\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.build\(\);\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Appends\ the\ "Share\ tab\ with\ Gemini"\ submenu\ \(and\ an\
        "Unshare\ with\ Gemini"\ item\ when\ any\ of\

        \ \ \ \ \ \*\ the\ selected\ tabs\ are\ shared\)\ when\ the\ feature\ is\ enabled\
        and\ Glic\ is\ ready\ for\ the\ profile\.\

        \ \ \ \ \ \*\ No\-op\ otherwise,\ leaving\ the\ menu\ unchanged\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ itemList\ The\ menu\ model\ the\ Glic\ items\ are\ appended\
        to\.\

        \ \ \ \ \ \*\ @param\ tabs\ The\ tab\(s\)\ the\ context\ menu\ is\ acting\ on\.\

        \ \ \ \ \ \*\ @param\ isIncognito\ Whether\ the\ menu\ is\ being\ built\ for\
        an\ incognito\ tab\ model\.\

        \ \ \ \ \ \*/\

        \ \ \ \ private\ void\ appendGlicItems\(ModelList\ itemList,\ List<Tab>\ tabs,\
        boolean\ isIncognito\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(isIncognito\)\ return;\

        \ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.isEnabled\(ChromeFeatureList\.CLANK_GLIC_CONTEXT_MENU\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ !ChromeFeatureList\.getFieldTrialParamByFeatureAsBoolean\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.CLANK_GLIC_CONTEXT_MENU,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PARAM_SHOW_GEMINI_ON_TAB_STRIP,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ defaultValue=\ \*/\ true\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ Profile\ profile\ =\ getTabModel\(\)\.getProfile\(\);\

        \ \ \ \ \ \ \ \ if\ \(profile\ ==\ null\ \|\|\ !GlicEnabling\.isReadyForProfile\(profile\)\)\
        return;\

        \ \ \ \ \ \ \ \ GlicKeyedService\ glicService\ =\ GlicKeyedServiceFactory\.getForProfile\(profile\);\

        \ \ \ \ \ \ \ \ if\ \(glicService\ ==\ null\)\ return;\

        \

        \ \ \ \ \ \ \ \ boolean\ isMultipleTabs\ =\ tabs\.size\(\)\ >\ 1;\

        \ \ \ \ \ \ \ \ //\ Only\ add\ a\ leading\ separator\ when\ the\ previous\ item\
        isn''t\ already\ a\

        \ \ \ \ \ \ \ \ //\ divider,\ and\ never\ add\ a\ trailing\ one;\ the\ following\
        group\ owns\ its\

        \ \ \ \ \ \ \ \ //\ own\ separator,\ so\ this\ stays\ correct\ even\ if\ Glic\
        ends\ the\ menu\.\

        \ \ \ \ \ \ \ \ if\ \(!itemList\.isEmpty\(\)\ \&\&\ itemList\.get\(itemList\.size\(\)\
        \-\ 1\)\.type\ !=\ ListItemType\.DIVIDER\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ itemList\.add\(buildMenuDivider\(isIncognito\)\);\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ List<ListItem>\ submenuItems\ =\ new\ ArrayList<>\(\);\

        \ \ \ \ \ \ \ \ //\ "Start\ new\ chat\ with\ Gemini"\ shares\ the\ tab\(s\)\
        into\ a\ fresh\ conversation\.\

        \ \ \ \ \ \ \ \ submenuItems\.add\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ buildGlicShareItem\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ ListItemBuilder\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withTitleRes\(R\.string\.tab_cxmenu_glic_create_new_chat\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.id\.glic_share_new_chat_sub_menu_id,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isMultipleTabs,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ glicService\.shareTabs\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ new\ ArrayList<>\(tabs\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ /\*\ instanceId=\ \*/\ null,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ /\*\ newConversation=\ \*/\ true,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ GlicKeyedService\.GlicInvocationSource\.TAB_CONTEXT_MENU\)\)\);\

        \

        \ \ \ \ \ \ \ \ List<ConversationInfo>\ recentInstances\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ glicService\.getRecentlyActiveInstances\(MAX_GLIC_RECENT_CONVERSATIONS\);\

        \ \ \ \ \ \ \ \ if\ \(!recentInstances\.isEmpty\(\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ submenuItems\.add\(buildMenuDivider\(isIncognito\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ for\ \(ConversationInfo\ info\ :\ recentInstances\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ submenuItems\.add\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ buildGlicShareItem\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ ListItemBuilder\(\)\.withTitle\(info\.title\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.id\.glic_share_recent_sub_menu_id,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isMultipleTabs,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ glicService\.shareTabs\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \ \ \ \ new\ ArrayList<>\(tabs\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \ \ \ \ info\.instanceId,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \ \ \ \ /\*\ newConversation=\ \*/\ false,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \ \ \ \ GlicKeyedService\.GlicInvocationSource\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.TAB_CONTEXT_MENU\)\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ String\ shareTitle\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mActivity\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.getResources\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.getQuantityString\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.plurals\.tab_cxmenu_glic_start_share,\
        tabs\.size\(\),\ tabs\.size\(\)\);\

        \ \ \ \ \ \ \ \ itemList\.add\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ ListItemBuilder\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withTitle\(shareTitle\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withIsIncognito\(isIncognito\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withSubmenuItems\(submenuItems\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.build\(\)\);\

        \

        \ \ \ \ \ \ \ \ if\ \(glicService\.isTabPinnedToAnyInstance\(tabs\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ itemList\.add\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ ListItemBuilder\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withTitleRes\(R\.string\.tab_cxmenu_glic_unshare\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withMenuId\(R\.id\.glic_unshare_menu_id\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withIsIncognito\(isIncognito\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.build\(\)\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Builds\ a\ "Share\ tab\ with\ Gemini"\ submenu\ entry\ that\ records\
        a\ metric\ and\ runs\ \{@code\ action\}\

        \ \ \ \ \ \*\ when\ clicked\.\ The\ Glic\ submenu\ is\ never\ shown\ in\ incognito,\
        so\ items\ are\ always\ regular\.\

        \ \ \ \ \ \*/\

        \ \ \ \ private\ ListItem\ buildGlicShareItem\(\

        \ \ \ \ \ \ \ \ \ \ \ \ ListItemBuilder\ builder,\ int\ menuId,\ boolean\ isMultipleTabs,\
        Runnable\ action\)\ \{\

        \ \ \ \ \ \ \ \ return\ builder\.withIsIncognito\(false\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withClickListener\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(v\)\ \->\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ recordMenuAction\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ menuId,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isMultipleTabs,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\
        isIncognito=\ \*/\ false,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mTabStripLayout\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ action\.run\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.build\(\);\

        \ \ \ \ \}\

        \

        '
      replace: "                .withTitle(title)\n                .withMenuId(R.id.new_tab_to_the_right_menu_id)\n\
        \                .withIsIncognito(isIncognito)\n                .build();\n\
        \    }\n\n"
