substitutions:
- description: Remove imports of excluded Actor service providers.
  regex:
    pattern: 'import org.chromium.chrome.browser.actor.ActorKeyedService;

      import org.chromium.chrome.browser.actor.ActorKeyedServiceFactory;

      import org.chromium.chrome.browser.actor.StoppedReason;

      '
    replace: ''
  count: 1
- description: Remove the excluded Actor service member.
  regex:
    pattern: '    private @Nullable ActorKeyedService mActorKeyedService;

      '
    replace: ''
  count: 1
- description: Do not query tasks from the excluded Actor feature during ordinary tab removal.
  regex:
    pattern: '        List<Integer> onGoingActorTasks = handler.getOngoingActorTasks();

      '
    replace: ''
  count: 1
- description: Start with retained collaboration handling without the excluded Actor confirmation branch.
  regex:
    pattern: "        boolean hasOnGoingActorTasks = !onGoingActorTasks.isEmpty();\n\n        if (hasOnGoingActorTasks &&\
      \ allowDialog) {\n            handler.showActorTaskDeletionConfirmationDialog(\n                    createActorTaskDeletionConfirmationCallback(handler));\n\
      \            return;\n        } else if (collaborationsDestroyed) {\n"
    replace: "\n        if (collaborationsDestroyed) {\n"
  count: 1
- description: Remove the Actor-only confirmation callback and task-stop implementation.
  regex:
    pattern: "    private Callback<Integer> createActorTaskDeletionConfirmationCallback(\n            TabModelRemoverFlowHandler\
      \ handler) {\n        return (confirmationResult) -> {\n            switch (confirmationResult) {\n                case\
      \ CONFIRMATION_POSITIVE:\n                    stopOngoingActorTasks(handler);\n                    handler.performAction();\n\
      \                    return;\n                case CONFIRMATION_NEGATIVE:\n                    // Intentional no-op.\n\
      \                    return;\n                case IMMEDIATE_CONTINUE: // fallthrough\n                default:\n  \
      \                  assert false : \"Not reached.\";\n            }\n        };\n    }\n\n    // TODO(crbug.com/489134045):\
      \ Move this function to a utility file.\n    private void stopOngoingActorTasks(TabModelRemoverFlowHandler handler)\
      \ {\n        @Nullable ActorKeyedService actorKeyedService = getActorService();\n        if (actorKeyedService == null)\
      \ return;\n        for (Integer taskId : handler.getOngoingActorTasks()) {\n            actorKeyedService.stopTask(taskId,\
      \ StoppedReason.STOPPED_BY_USER);\n        }\n    }\n\n"
    replace: ''
  count: 1
- description: Remove lazy construction of the excluded Actor service.
  regex:
    pattern: "\n    private @Nullable ActorKeyedService getActorService() {\n        if (mActorKeyedService == null) {\n \
      \           Profile profile = getProfile();\n            mActorKeyedService = ActorKeyedServiceFactory.getForProfile(profile);\n\
      \        }\n        return mActorKeyedService;\n    }\n"
    replace: ''
  count: 1
- description: Remove unused dedicated Actor task-list contract
  regex:
    pattern: "        /** Return the ongoing actor task ids. */\n        List<Integer> getOngoingActorTasks();\n\n"
    replace: ''
  count: 1
- description: Remove unused dedicated Actor dialog contract from the ordinary group-removal interface
  regex:
    pattern: "        /**\n         * Requests to show a dialog to confirm whether tab group deletion is intended. The dialog\n\
      \         * may be skipped due to user preferences.\n         *\n         * @param onResult A callback invoked with\
      \ the {@link ActionConfirmationResult} of showing\n         *     the dialog. May be invoked synchronously in some cases.\n\
      \         */\n        void showActorTaskDeletionConfirmationDialog(\n                Callback<@ActionConfirmationResult\
      \ Integer> onResult);\n\n"
    replace: ''
  count: 1
