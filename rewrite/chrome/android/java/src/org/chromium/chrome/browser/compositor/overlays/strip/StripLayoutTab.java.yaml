      the\ Glic\ underline\ opacity\.\ \*/\

      \ \ \ \ public\ static\ final\ FloatProperty<StripLayoutTab>\ UNDERLINE_OPACITY\
      =\

      \ \ \ \ \ \ \ \ \ \ \ \ new\ FloatProperty<>\("underlineOpacity"\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ setValue\(StripLayoutTab\ object,\
      float\ value\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ object\.mUnderlineOpacity\ =\ value;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ Float\ get\(StripLayoutTab\ object\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ object\.getUnderlineOpacity\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \};\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ A\ property\ for\ animations\ to\ use\ for\ changing\ the\ Glic\
      underline\ shimmer\ offset\.\ The\ shimmer\

      \ \ \ \ \ \*\ offset\ drives\ a\ left\-to\-right\ "wave/shimmer"\ effect\ where\
      parts\ of\ the\ underline\ dynamically\

      \ \ \ \ \ \*\ get\ lighter\ or\ darker\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ static\ final\ FloatProperty<StripLayoutTab>\ UNDERLINE_SHIMMER_OFFSET\
      =\

      \ \ \ \ \ \ \ \ \ \ \ \ new\ FloatProperty<>\("underlineShimmerOffset"\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ setValue\(StripLayoutTab\ object,\
      float\ value\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ object\.mUnderlineShimmerOffset\ =\
      value;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ Float\ get\(StripLayoutTab\ object\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ object\.getUnderlineShimmerOffset\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \};\

      \

      '
    replace: ''
