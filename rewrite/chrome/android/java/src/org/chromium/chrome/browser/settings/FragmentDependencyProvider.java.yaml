substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove concrete AI coordinator creation while normal options/editor
    dependency injection stays
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(fragment\ instanceof\ AutofillPersonalContextFragment\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ AutofillPersonalContextCoordinator\.createFor\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(AutofillPersonalContextFragment\)\
      fragment,\ mActivity,\ mProfile\);\

      \ \ \ \ \ \ \ \ \}'
    replace: ''
- description: Drop import with no remaining actual reference
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.autofill\.settings\.personal_context\.AutofillPersonalContextFragment;\

      '
    replace: ''
- description: Drop import with no remaining actual reference
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.autofill\.settings\.personal_context\.AutofillPersonalContextCoordinator;\

      '
    replace: ''
- description: Remove dedicated image descriptions fragment controller injection
  regex:
    pattern: "        if (fragment instanceof ImageDescriptionsSettings) {\n            ImageDescriptionsSettings imageFragment\
      \ = (ImageDescriptionsSettings) fragment;\n            Bundle extras = imageFragment.getArguments();\n            if\
      \ (extras != null) {\n                extras.putBoolean(\n                        ImageDescriptionsSettings.IMAGE_DESCRIPTIONS,\n\
      \                        ImageDescriptionsController.getInstance()\n                                .imageDescriptionsEnabled(mProfile));\n\
      \                extras.putBoolean(\n                        ImageDescriptionsSettings.IMAGE_DESCRIPTIONS_DATA_POLICY,\n\
      \                        ImageDescriptionsController.getInstance().onlyOnWifiEnabled(mProfile));\n            }\n  \
      \          imageFragment.setDelegate(ImageDescriptionsController.getInstance().getDelegate());\n        }\n"
    replace: ''
  count: 1
- description: Remove import used only by retired image-description code
  regex:
    pattern: 'import android.os.Bundle;

      '
    replace: ''
  count: 1
- description: Remove import used only by retired image-description code
  regex:
    pattern: 'import org.chromium.chrome.browser.image_descriptions.ImageDescriptionsController;

      '
    replace: ''
  count: 1
- description: Remove import used only by retired image-description code
  regex:
    pattern: 'import org.chromium.chrome.browser.image_descriptions.ImageDescriptionsSettings;

      '
    replace: ''
  count: 1
