substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove allocation/storage of exclusively AI button text resources
  regex:
    re_pattern: '\ \ \ \ private\ final\ BitmapDynamicResource\ mGlicButtonTextRes;\

      '
    replace: ''
- description: Remove allocation/storage of exclusively AI button text resources
  regex:
    re_pattern: '\ \ \ \ private\ final\ BitmapDynamicResource\ mGlicActorButtonTextRes;\

      '
    replace: ''
- description: Remove allocation/storage of exclusively AI button text resources
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mGlicButtonTextRes\ =\ new\ BitmapDynamicResource\(View\.generateViewId\(\)\);\

      '
    replace: ''
- description: Remove allocation/storage of exclusively AI button text resources
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mGlicActorButtonTextRes\ =\ new\ BitmapDynamicResource\(View\.generateViewId\(\)\);\

      '
    replace: ''
- description: Remove generic-named button measurement used only by the removed Glic/Actor
    trailing button producer; retained tab/group title measurement is unchanged
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ @param\ titleString\ The\ button\ text\ to\ measure\.\

      \ \ \ \ \ \*\ @return\ The\ width\ in\ px\ of\ the\ button\ text\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ int\ getButtonTextWidth\(@Nullable\ String\ titleString\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(titleString\ ==\ null\)\ return\ 0;\

      \ \ \ \ \ \ \ \ return\ mStandardTitleBitmapFactory\.getButtonTextWidth\(titleString\);\

      \ \ \ \ \}\

      \

      '
    replace: ''
- description: Physically remove AI bitmap texture generation, registration and resource
    lifetimes; retain normal tab/group favicon and title caches
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Updates\ the\ Glic\ button\ text\ texture\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ titleString\ The\ text\ to\ be\ displayed\ on\ the\ button\.\

      \ \ \ \ \ \*\ @param\ isActor\ Whether\ the\ button\ is\ the\ actor\ button\.\

      \ \ \ \ \ \*\ @param\ isIncognito\ Whether\ the\ button\ is\ in\ incognito\
      mode\.\

      \ \ \ \ \ \*\ @return\ The\ resource\ ID\ for\ the\ generated\ text\ bitmap\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ int\ getUpdatedGlicButtonText\(\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ String\ titleString,\ boolean\ isActor,\
      boolean\ isIncognito\)\ \{\

      \ \ \ \ \ \ \ \ BitmapDynamicResource\ res\ =\ isActor\ \?\ mGlicActorButtonTextRes\
      :\ mGlicButtonTextRes;\

      \ \ \ \ \ \ \ \ if\ \(TextUtils\.isEmpty\(titleString\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mResourceManager\.getDynamicResourceLoader\(\)\.unregisterResource\(res\.getResId\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ Resources\.ID_NULL;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ TitleBitmapFactory\ titleBitmapFactory\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isIncognito\ \?\ mDarkTitleBitmapFactory\ :\
      mStandardTitleBitmapFactory;\

      \ \ \ \ \ \ \ \ Bitmap\ titleBitmap\ =\ titleBitmapFactory\.getButtonTextBitmap\(titleString\);\

      \ \ \ \ \ \ \ \ res\.setBitmap\(titleBitmap\);\

      \ \ \ \ \ \ \ \ if\ \(mResourceManager\.getDynamicResourceLoader\(\)\.getResource\(res\.getResId\(\)\)\
      ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mResourceManager\.getDynamicResourceLoader\(\)\.registerResource\(res\.getResId\(\),\
      res\);\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ return\ res\.getResId\(\);\

      \ \ \ \ \}\

      \

      '
    replace: ''
