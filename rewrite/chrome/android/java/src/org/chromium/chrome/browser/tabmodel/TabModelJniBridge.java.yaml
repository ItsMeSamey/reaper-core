    replace: "    protected abstract @JniType(\"std::vector<int>\") int[] getTabGroupTabIndices(\n            @JniType(\"base::Token\") Token tabGroupId);\n\n    @CalledByNative\n    protected abstract @JniType(\"std::optional<base::Token>\") @Nullable Token createSplit(\n            @JniType(\"std::vector<TabAndroid*>\") List<Tab> tabs);\n\n    @CalledByNative\n    protected abstract void unsplit(@JniType(\"base::Token\") Token token);\n\n    @CalledByNative\n    protected boolean restoreSplit(\n            @JniType(\"base::Token\") Token token,\n            @JniType(\"std::vector<int>\") int[] tabIds, int layout, double ratio) {\n        if (tabIds.length != 2) return false;\n        try {\n            return restoreSplit(new SplitInfo(token, tabIds[0], tabIds[1], layout, ratio));\n        } catch (IllegalArgumentException invalid) {\n            return false;\n        }\n    }\n\n    @CalledByNative\n    protected abstract @JniType(\"std::optional<base::Token>\") @Nullable Token createTabGroup(\n            @JniType(\"std::vector<TabAndroid*>\") List<Tab> tabs);\n\n    @CalledByNative\n"
