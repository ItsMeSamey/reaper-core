substitutions:
- description: Remove excluded Actor service imports from the tab-removal fixture.
  regex:
    pattern: 'import org.chromium.chrome.browser.actor.ActorKeyedService;

      import org.chromium.chrome.browser.actor.ActorKeyedServiceFactory;

      '
    replace: ''
  count: 1
- description: Remove the excluded Actor service mock.
  regex:
    pattern: '    @Mock private ActorKeyedService mActorKeyedService;

      '
    replace: ''
  count: 1
- description: Remove installation of the excluded Actor mock.
  regex:
    pattern: '        ActorKeyedServiceFactory.setForTesting(mActorKeyedService);

      '
    replace: ''
  count: 1
- description: Remove the testTabRemovalFlow_WithActorTasks case for the excluded Actor feature.
  regex:
    pattern: "    @Test\n    public void testTabRemovalFlow_WithActorTasks() {\n        GroupsPendingDestroy groupsPendingDestroy\
      \ = new GroupsPendingDestroy();\n        when(mHandler.computeGroupsPendingDestroy()).thenReturn(groupsPendingDestroy);\n\
      \        when(mHandler.getOngoingActorTasks()).thenReturn(List.of(1));\n\n        mTabModelRemover.doTabRemovalFlow(mHandler,\
      \ /* allowDialog= */ true);\n\n        mHandlerInOrder.verify(mHandler).computeGroupsPendingDestroy();\n        mHandlerInOrder.verify(mHandler).getOngoingActorTasks();\n\
      \        mHandlerInOrder.verify(mHandler).showActorTaskDeletionConfirmationDialog(any());\n        verifyNoMoreInteractions(mHandler);\n\
      \    }\n\n"
    replace: ''
  count: 1
- description: Remove the testTabRemovalFlow_WithActorTasks_Confirm case for the excluded Actor feature.
  regex:
    pattern: "    @Test\n    public void testTabRemovalFlow_WithActorTasks_Confirm() {\n        GroupsPendingDestroy groupsPendingDestroy\
      \ = new GroupsPendingDestroy();\n        when(mHandler.computeGroupsPendingDestroy()).thenReturn(groupsPendingDestroy);\n\
      \        when(mHandler.getOngoingActorTasks()).thenReturn(List.of(1));\n\n        mTabModelRemover.doTabRemovalFlow(mHandler,\
      \ /* allowDialog= */ true);\n\n        mHandlerInOrder.verify(mHandler).computeGroupsPendingDestroy();\n        mHandlerInOrder.verify(mHandler).getOngoingActorTasks();\n\
      \        mHandlerInOrder\n                .verify(mHandler)\n                .showActorTaskDeletionConfirmationDialog(mOnResultCaptor.capture());\n\
      \n        mOnResultCaptor.getValue().onResult(ActionConfirmationResult.CONFIRMATION_POSITIVE);\n\n        mHandlerInOrder.verify(mHandler).getOngoingActorTasks();\n\
      \        mHandlerInOrder.verify(mHandler).performAction();\n        verifyNoMoreInteractions(mHandler);\n    }\n"
    replace: ''
  count: 1
- description: Remove the obsolete Actor-task query stub.
  regex:
    pattern: '        when(mHandler.getOngoingActorTasks()).thenReturn(Collections.emptyList());

      '
    replace: ''
  count: 1
- description: Remove obsolete Actor-task query verifications while retaining ordinary tab-flow assertions.
  regex:
    pattern: '        mHandlerInOrder.verify(mHandler).getOngoingActorTasks();

      '
    replace: ''
  count: 11
- description: Remove the collection import used only by the removed Actor-task stub.
  regex:
    pattern: 'import java.util.Collections;

      '
    replace: ''
  count: 1
