- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ Context\ context\ =\ ContextUtils\.getApplicationContext\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ TabDelegateFactory\ delegateFactory\ =\ CustomTabDelegateFactory\.createEmpty\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ Tab\ spareTab\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabBuilder\.createDetachedSpareTab\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ context,\ delegateFactory,\ profile,\ webContents\);\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ mSpareTab\ =\ spareTab;\

      \ \ \ \ \ \ \ \ \ \ \ \ assert\ mSpareTab\ !=\ null\ :\ "Building\ a\ spare\ detached\ tab\ shouldn''t\ return\ null\.";\

      '
    replace: "            Context context = ContextUtils.getApplicationContext();\n            TabDelegateFactory delegateFactory = CustomTabDelegateFactory.createEmpty();\n            Tab spareTab =\n                    separateStoragePartitionExperiment\n                            ? TabBuilder.createDetachedSpareTabForSeparateStoragePartitionExperiment(\n                                    context, delegateFactory, profile, assumeNonNull(webContents))\n                            : TabBuilder.createDetachedSpareTab(\n                                    context, delegateFactory, profile, webContents);\n\n            mSpareTab = spareTab;\n            assert mSpareTab != null : \"Building a spare detached tab shouldn't return null.\";\n"
