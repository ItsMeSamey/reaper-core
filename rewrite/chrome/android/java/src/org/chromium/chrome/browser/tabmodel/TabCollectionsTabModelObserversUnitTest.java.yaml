substitutions:

  - description: "Check that group metadata exists at the reparenting notification."
    regex:
      pattern: "import static org.junit.Assert.assertEquals;"
      replace: "import static org.junit.Assert.assertEquals;\nimport static org.junit.Assert.assertFalse;\nimport static org.junit.Assert.assertTrue;"

  - description: "Check that partial and ungrouped transfers do not remove a group."
    regex:
      pattern: "import static org.mockito.Mockito.mock;"
      replace: "import static org.mockito.Mockito.mock;\nimport static org.mockito.Mockito.never;"

  - description: "Cover last-member detach ordering and unaffected transfer paths."
    regex:
      pattern: "    // 27. onTabGroupMoved"
      replace: "    @Test\n    public void testOnTabGroupRemoving_reparentLastMemberBeforeNativeDetach() {\n        MockTab first = createMockTab(101, mProfile);\n        MockTab last = createMockTab(102, mProfile);\n        MockTab ungrouped = createMockTab(103, mProfile);\n        mTabModel.addTab(first, 0, TabLaunchType.FROM_CHROME_UI, TabCreationState.LIVE_IN_FOREGROUND);\n        mTabModel.addTab(last, 1, TabLaunchType.FROM_CHROME_UI, TabCreationState.LIVE_IN_FOREGROUND);\n        mTabModel.addTab(ungrouped, 2, TabLaunchType.FROM_CHROME_UI, TabCreationState.LIVE_IN_FOREGROUND);\n        Token groupId = new Token(1L, 2L);\n        first.setTabGroupId(groupId);\n        last.setTabGroupId(groupId);\n\n        reset(mTabModelObserver);\n        mTabModel.removeTab(first);\n        verify(mTabModelObserver, never()).onTabGroupRemoving(any());\n        assertTrue(mTabModel.tabGroupExists(groupId));\n\n        doAnswer(\n                        invocation -> {\n                            assertTrue(mTabModel.tabGroupExists(groupId));\n                            assertEquals(List.of(last), mTabModel.getTabsInGroup(groupId));\n                            return null;\n                        })\n                .when(mTabModelObserver)\n                .onTabGroupRemoving(eq(groupId));\n        mTabModel.removeTab(last);\n\n        verify(mTabModelObserver).onTabGroupRemoving(eq(groupId));\n        assertFalse(mTabModel.tabGroupExists(groupId));\n        assertEquals(List.of(ungrouped), mTabs);\n    }\n\n    @Test\n    public void testOnTabGroupRemoving_noEventForUngroupedTransfer() {\n        MockTab first = createMockTab(101, mProfile);\n        MockTab second = createMockTab(102, mProfile);\n        mTabModel.addTab(first, 0, TabLaunchType.FROM_CHROME_UI, TabCreationState.LIVE_IN_FOREGROUND);\n        mTabModel.addTab(second, 1, TabLaunchType.FROM_CHROME_UI, TabCreationState.LIVE_IN_FOREGROUND);\n\n        reset(mTabModelObserver);\n        mTabModel.removeTab(first);\n        verify(mTabModelObserver, never()).onTabGroupRemoving(any());\n    }\n\n    // 27. onTabGroupMoved"
  - description: Remove dedicated price fixture support or adapt preserved ordinary behavior in TabCollectionsTabModelObserversUnitTest
    regex:
      pattern: ") {\n        // Required to use MockTab.\n        PriceTrackingFeatures.setIsSignedInAndSyncEnabledForTesting(false);\n\
        \        PriceTrackingFeatures.setPriceAnnotationsEnabledForTesting(false);\n\n        MediaCaptureDevicesDispatcherAn"
      replace: ") {\n        // Required to use MockTab.\n\n        MediaCaptureDevicesDispatcherAn"
    count: 1
  - description: Remove dedicated price fixture support or adapt preserved ordinary behavior in TabCollectionsTabModelObserversUnitTest
    regex:
      pattern: 'ediaCaptureDevicesDispatcherAndroidJni;

        import org.chromium.chrome.browser.price_tracking.PriceTrackingFeatures;

        import org.chromium.chrome.browser.profi'
      replace: 'ediaCaptureDevicesDispatcherAndroidJni;

        import org.chromium.chrome.browser.profi'
    count: 1
