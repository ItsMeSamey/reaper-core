substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Physically remove Glic-only IPH state, descriptor, dispatch and resources;
    preserve existing ordinary enum numeric values
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ IphType\.GLIC_PROMO,\

      '
    replace: ''
- description: Physically remove Glic-only IPH state, descriptor, dispatch and resources;
    preserve existing ordinary enum numeric values
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ /\*\*\ Indicates\ the\ IPH\ is\ triggered\ for\ the\
      Glic\ entry\ point\.\ \*/\

      \ \ \ \ \ \ \ \ int\ GLIC_PROMO\ =\ 4;\

      \

      '
    replace: ''
- description: Physically remove Glic-only IPH state, descriptor, dispatch and resources;
    preserve existing ordinary enum numeric values
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ mGlicIphShowing;\

      '
    replace: ''
- description: Physically remove Glic-only IPH state, descriptor, dispatch and resources;
    preserve existing ordinary enum numeric values
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(iphType\ ==\ IphType\.GLIC_PROMO\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ iphCommandBuilder\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setOnShowCallback\(\(\)\ \->\ mGlicIphShowing\
      =\ true\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setOnDismissCallback\(\(\)\ \->\ mGlicIphShowing\
      =\ false\);\

      \ \ \ \ \ \ \ \ \}\

      \

      '
    replace: ''
- description: Physically remove Glic-only IPH state, descriptor, dispatch and resources;
    preserve existing ordinary enum numeric values
  regex:
    re_pattern: '\ \ \ \ /\*\*\ Returns\ whether\ Glic\ IPH\ is\ currently\ showing\
      on\ the\ tab\ strip\.\ \*/\

      \ \ \ \ public\ boolean\ isGlicIphShowing\(\)\ \{\

      \ \ \ \ \ \ \ \ return\ mGlicIphShowing;\

      \ \ \ \ \}\

      \

      '
    replace: ''
- description: Physically remove Glic-only IPH state, descriptor, dispatch and resources;
    preserve existing ordinary enum numeric values
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ IphType\.GLIC_PROMO:\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ FeatureConstants\.GLIC_PROMO_ANDROID_FEATURE;\

      '
    replace: ''
- description: Physically remove Glic-only IPH state, descriptor, dispatch and resources;
    preserve existing ordinary enum numeric values
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ IphType\.GLIC_PROMO:\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ R\.string\.iph_tab_strip_glic_promo_text;\

      '
    replace: ''
