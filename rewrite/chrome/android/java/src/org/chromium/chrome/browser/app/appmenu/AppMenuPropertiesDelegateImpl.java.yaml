substitutions:
  - description: 'Add import for UrlConstants.'
    regex:
      pattern: 'import org.chromium.chrome.R;'
      replace: |-
        import org.chromium.chrome.R;
        import org.chromium.components.embedder_support.util.UrlConstants;

  - description: |
      Make it possible to add chrome://leo-ai to the Home Screen on Android.
      This patch updates the `shouldShowHomescreenMenuItem` function to whitelist
      chrome://leo-ai.
    regex:
      re_pattern: '(isAddToHomeIntentSupported\(\)\s+)&& (!isNativePage)$'
      re_flags: [MULTILINE]
      replace:
        '\1&& (\2 || (url != null &&
        UrlConstants.CHROME_SCHEME.equals(url.getScheme()) &&
        url.getHost().equals("leo-ai")))'

  - description: |
      Make mAppMenuItemTheme protected.

      To access at BraveTabbedAppMenuPropertiesDelegate
    regex:
      re_pattern: 'private( final AppMenuItemTheme mAppMenuItemTheme;)'
      replace: 'protected\1'
  - description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mContext,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ getAppMenuItemTheme\(\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.id\.extensions_menu_menu_id,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.string\.menu_extensions_menu,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ showIcon\ \?\ R\.drawable\.ic_extension_24dp\ :\ Resources\.ID_NULL,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isMenuIconAtStart\(\)\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ showIcon\);\

        '
      replace: "                        mContext,\n                        getAppMenuItemTheme(),\n                        R.id.extensions_menu_menu_id,\n                        !mIsTablet && !DeviceInfo.isDesktop() && !isSubmenusEnabled(mContext)\n                                ? R.string.menu_extensions\n                                : R.string.menu_extensions_menu,\n                        showIcon ? R.drawable.ic_extension_24dp : Resources.ID_NULL,\n                        isMenuIconAtStart()),\n                showIcon);\n"

# Reaper optional Leo shortcut caller closure; existing recipe flags/prefix retained.
  - description: 'Reaper Android: remove the operational Leo-only homescreen shortcut
      exception; preserve ordinary Chromium native-page, file/content/incognito and
      extension/site menu behavior.'
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ \(!isNativePage\ \|\|\ \(url\
        !=\ null\ \&\&\ UrlConstants\.CHROME_SCHEME\.equals\(url\.getScheme\(\)\)\ \&\&\
        url\.getHost\(\)\.equals\("leo\-ai"\)\)\)\

        '
      replace: '                && !isNativePage

        '
  - description: Remove the sole import owned by the deleted Leo-only shortcut clause.
    regex:
      re_pattern: 'import\ org\.chromium\.components\.embedder_support\.util\.UrlConstants;\

        '
      replace: ''
  - description: Remove price-only unsigned product ID import.
    regex:
      pattern: 'import com.google.common.primitives.UnsignedLongs;


        '
      replace: ''
    count: 1
