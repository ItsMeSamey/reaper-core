# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: 'import\ org\.chromium\.base\.Log;\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \*\ prepends\ the\ logcat\ data\ to\ the\ caller\-provided\ minidump\ file,\ and\ initiates\ upload\ for\ the\ crash\

      \ \*\ report\.\

      '
    replace: ' * prepends the logcat data to the caller-provided minidump file for local diagnostics.

      '
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ private\ static\ final\ String\ TAG\ =\ "LogcatExtraction";\

      \

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ void\ run\(\)\ \{\

      \ \ \ \ \ \ \ \ File\ fileToUpload\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mLogcatExtractor\.attachLogcatToMinidump\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mMinidumpFile,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ CrashFileManager\(ContextUtils\.getApplicationContext\(\)\.getCacheDir\(\)\)\);\

      \ \ \ \ \ \ \ \ uploadMinidump\(fileToUpload,\ false\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ @param\ minidump\ the\ minidump\ file\ to\ be\ uploaded\.\

      \ \ \ \ \ \*\ @param\ uploadNow\ If\ this\ flag\ is\ set\ to\ true,\ we\ will\ upload\ the\ minidump\ immediately,\

      \ \ \ \ \ \*\ otherwise\ the\ upload\ is\ controlled\ by\ the\ job\ scheduler\.\

      \ \ \ \ \ \*/\

      \ \ \ \ /\*\ package\ \*/\ static\ void\ uploadMinidump\(File\ minidump,\ boolean\ uploadNow\)\ \{\

      \ \ \ \ \ \ \ \ //\ Regardless\ of\ success,\ initiate\ the\ upload\.\ That\ way,\ even\ if\ there\ are\ errors\ augmenting\

      \ \ \ \ \ \ \ \ //\ the\ minidump\ with\ logcat\ data,\ the\ service\ can\ still\ upload\ the\ unaugmented\ minidump\.\

      \ \ \ \ \ \ \ \ try\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(uploadNow\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MinidumpUploadServiceImpl\.tryUploadCrashDumpNow\(minidump\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MinidumpUploadServiceImpl\.scheduleUploadJob\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\ catch\ \(SecurityException\ e\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ Log\.w\(TAG,\ e\.toString\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!uploadNow\)\ throw\ e;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}'
    replace: "    @Override\n    public void run() {\n        mLogcatExtractor.attachLogcatToMinidump(\n                mMinidumpFile,\n                new CrashFileManager(ContextUtils.getApplicationContext().getCacheDir()));\n    }"
