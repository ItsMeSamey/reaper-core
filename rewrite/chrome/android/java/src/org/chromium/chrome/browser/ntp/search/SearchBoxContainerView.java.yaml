- description: Remove plus-only touch state
  regex:
    pattern: "    private @Nullable TouchDelegate mTouchDelegate;\n    private @Nullable Rect mLastTouchDelegateRect;\n\n"
    replace: ''
  count: 1
- description: Remove retired click and visibility methods
  regex:
    pattern: "    void setPlusButtonClickListener(@Nullable OnClickListener listener) {\n        mPlusButton.setOnClickListener(listener);\n\
      \    }\n\n    /**\n     * Updates the visibility of the plus button and DSE icon, synchronizing the touch delegate.\n\
      \     *\n     * @param visible Whether the plus button should be visible.\n     */\n    void updateStartIconVisibility(boolean\
      \ visible) {\n        mPlusButton.setVisibility(visible ? View.VISIBLE : View.GONE);\n        mDseIconView.setVisibility(visible\
      \ ? View.GONE : View.VISIBLE);\n        updateTouchDelegate();\n    }\n\n"
    replace: ''
  count: 1
- description: Remove plus-only expanded touch target machinery
  regex:
    pattern: "    private void updateTouchDelegate() {\n        if (mPlusButton.getVisibility() != View.VISIBLE) {\n     \
      \       if (mTouchDelegate != null) {\n                setTouchDelegate(null);\n                mTouchDelegate = null;\n\
      \                mLastTouchDelegateRect = null;\n            }\n            return;\n        }\n\n        Rect bounds\
      \ = new Rect();\n        mPlusButton.getHitRect(bounds);\n        if (bounds.isEmpty()) return;\n\n        int minTargetSize\
      \ = getResources().getDimensionPixelSize(R.dimen.min_touch_target_size);\n        int widthDelta = Math.max(0, minTargetSize\
      \ - bounds.width()) / 2;\n        int heightDelta = Math.max(0, minTargetSize - bounds.height()) / 2;\n        bounds.inset(-widthDelta,\
      \ -heightDelta);\n\n        if (bounds.equals(mLastTouchDelegateRect)) return;\n        mLastTouchDelegateRect = bounds;\n\
      \        mTouchDelegate = new TouchDelegate(bounds, mPlusButton);\n        setTouchDelegate(mTouchDelegate);\n    }\n\
      \n"
    replace: ''
  count: 1
