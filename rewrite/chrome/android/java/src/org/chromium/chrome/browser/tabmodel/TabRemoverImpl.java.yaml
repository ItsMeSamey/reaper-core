substitutions:
- description: Remove the excluded Actor utility import.
  regex:
    pattern: 'import org.chromium.chrome.browser.actor.ActorServiceTabUtils;

      '
    replace: ''
  count: 1
- description: Preserve the handler interface with no tasks for the excluded Actor feature.
  regex:
    pattern: "            List<Tab> tabsToClose =\n                    mOriginalTabClosureParams.isAllTabs\n             \
      \               ? TabModelUtils.convertTabListToListOfTabs(mTabModel)\n                            : mOriginalTabClosureParams.tabs;\n\
      \n            return ActorServiceTabUtils.getOngoingActorTasks(mTabModel, tabsToClose);\n"
    replace: '            return Collections.emptyList();

      '
  count: 1
- description: Remove unreachable dedicated Actor getOngoingActorTasks contract implementation
  regex:
    pattern: "        @Override\n        public List<Integer> getOngoingActorTasks() {\n            return Collections.emptyList();\n\
      \        }\n\n"
    replace: ''
  count: 1
- description: Remove unreachable dedicated Actor getOngoingActorTasks contract implementation
  regex:
    pattern: "        @Override\n        public List<Integer> getOngoingActorTasks() {\n            // Intentionally returning\
      \ an empty list to skip this check.\n            return Collections.emptyList();\n        }\n\n"
    replace: ''
  count: 1
- description: Remove unreachable dedicated Actor showActorTaskDeletionConfirmationDialog contract implementation
  regex:
    pattern: "        @Override\n        public void showActorTaskDeletionConfirmationDialog(Callback<Integer> onResult) {\n\
      \            @Nullable TabModelActionListener listener = takeListener();\n            if (listener != null) {\n    \
      \            listener.willPerformActionOrShowDialog(\n                        DialogType.ACTOR_TASK, /* willSkipDialog=\
      \ */ false);\n            }\n\n            var adaptedCallback = adaptOnResultCallback(onResult, listener, DialogType.ACTOR_TASK);\n\
      \            mActionConfirmationManager.processActorTaskDeletionAttempt(adaptedCallback);\n        }\n\n"
    replace: ''
  count: 1
- description: Remove unreachable dedicated Actor showActorTaskDeletionConfirmationDialog contract implementation
  regex:
    pattern: "        @Override\n        public void showActorTaskDeletionConfirmationDialog(Callback<Integer> onResult) {\n\
      \            assert false : \"removeTab does not support actor task deletion dialogs.\";\n\n            // This behavior\
      \ is a safe default even if the assert trips.\n            onResult.onResult(ActionConfirmationResult.IMMEDIATE_CONTINUE);\n\
      \        }\n\n"
    replace: ''
  count: 1
