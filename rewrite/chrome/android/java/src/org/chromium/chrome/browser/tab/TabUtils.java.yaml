substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ TabAlert\.ACTOR_ACCESSING,\ TabAlert\.ACTOR_WAITING_ON_USER\
      \->\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.drawable\.ic_arrow_selector_spark_24dp;\

      '
    replace: ''
- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ TabAlert\.GLIC_ACCESSING,\ TabAlert\.GLIC_SHARING\
      \->\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.drawable\.ic_screensaver_auto_24dp;\

      '
    replace: ''
- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ TabAlert\.ACTOR_ACCESSING,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabAlert\.ACTOR_WAITING_ON_USER,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabAlert\.GLIC_ACCESSING,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabAlert\.GLIC_SHARING\ \->\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SemanticColorUtils\.getColorPrimary\(context\);\

      '
    replace: ''
- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ TabAlert\.ACTOR_ACCESSING,\ TabAlert\.ACTOR_WAITING_ON_USER\
      \->\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.string\.tooltip_tab_alert_state_actor_accessing;\

      '
    replace: ''
- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ TabAlert\.GLIC_ACCESSING\ \->\ R\.string\.tooltip_tab_alert_state_glic_accessing;\

      '
