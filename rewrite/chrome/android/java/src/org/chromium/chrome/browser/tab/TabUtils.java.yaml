- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ TabAlert\.GLIC_SHARING\ \->\ R\.string\.tooltip_tab_alert_state_glic_sharing;\

      '
    replace: ''
- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ TabAlert\.ACTOR_WAITING_ON_USER\ \->\
      7;\

      '
    replace: ''
- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ TabAlert\.ACTOR_ACCESSING\ \->\ 6;\

      '
    replace: ''
- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ TabAlert\.GLIC_ACCESSING\ \->\ 5;\

      '
    replace: ''
- description: Remove actual AI-only drawable, tint, description or priority dispatch;
    retain normal alert ordering
  regex:
