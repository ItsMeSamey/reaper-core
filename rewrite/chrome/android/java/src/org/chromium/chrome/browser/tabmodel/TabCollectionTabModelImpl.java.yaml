lits;\n    }\n\n    @Override\n    protected @Nullable Token createSplit(List<Tab> tabs) {\n        assertOnUiThread();\n        if (!mSplitViewAvailable || tabs.size() != 2 || tabs.get(0) == tabs.get(1)\n                || (TabStateStorageFlagHelper.isTabStorageEnabled()\n                        && TabStateStorageFlagHelper.isStorageAuthoritative())) return null;\n        Tab first = tabs.get(0);\n        Tab second = tabs.get(1);\n        if (indexOf(first) > indexOf(second)) {\n            first = tabs.get(1);\n            second = tabs.get(0);\n        }\n        if (!canRestoreSplit(first, second)) return null;\n        Token token = Token.createRandom();\n        try (ScopedStorageBatch ignored = mBatchFactory.get();\n                SplitMutation mutation = beginSplitMutation()) {\n            if (!restoreSplitInternal(new SplitInfo(token, first.getId(), second.getId(),\n                    SplitInfo.SIDE_BY_SIDE, 0.5))) return null;\n        }\n        return token;\n    }\n\n    @Override\n    protected void unsplit(Token token) {\n        assertOnUiThread();\n        if (mNativeTabCollectionTabModelImplPtr == 0) return;\n        try (ScopedStorageBatch ignored = mBatchFactory.get();\n                SplitMutation mutation = beginSplitMutation()) {\n            mExplicitlyUnsplit.add(token);\n            TabCollectionTabModelImplJni.get().unsplit(mNativeTabCollectionTabModelImplPtr, token);\n        }\n    }\n\n    private boolean canRestoreSplit(@Nullable Tab first, @Nullable Tab second) {\n        return mNormalSplitWindow && mNativeTabCollectionTabModelImplPtr != 0\n                && first != null && second != null && first != second\n                && getTabById(first.getId()) == first && getTabById(second.getId()) == second\n                && indexOf(first) >= 0 && indexOf(second) == indexOf(first) + 1\n                && !first.isClosing() && !second.isClosing()\n                && first.getProfile() == getProfile() && second.getProfile() == getPro