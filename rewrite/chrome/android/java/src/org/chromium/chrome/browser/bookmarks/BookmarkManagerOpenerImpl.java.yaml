substitutions:
- description: Preserve the existing Brave native bookmark activity substitution.
  regex:
    pattern: '                        BookmarkActivity.class);'
    replace: '                        org.chromium.chrome.browser.app.bookmarks.BraveBookmarkActivity.class);'
- description: Present an actual extension bookmark override in a tab on phones as on tablets.
  regex:
    pattern: "        if (DeviceFormFactor.isNonMultiDisplayContextOnTablet(activity)) {\n            showBookmarkManagerOnTablet(tab, url, profile);"
    replace: "        boolean hasExtensionOverride =\n                isBookmarksPageOverridden(profile.isIncognitoBranded())\n                        && url.equals(UrlConstantResolver.getOriginalBookmarksUrl());\n        if (DeviceFormFactor.isNonMultiDisplayContextOnTablet(activity) || hasExtensionOverride) {\n            showBookmarkManagerOnTablet(tab, url, profile);"
