# Android Chromium Discover implementation exclusion.
substitutions:
- description: Use the neutral local NTP contract
  regex:
    re_pattern: org\.chromium\.chrome\.browser\.feed\.FeedSurfaceScrollDelegate
    replace: org.chromium.chrome.browser.ntp.NtpScrollDelegate
- description: Use the neutral local NTP contract
  regex:
    re_pattern: FeedSurfaceScrollDelegate
    replace: NtpScrollDelegate
  count: 2
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: 'import\ org\.chromium\.build\.annotations\.NullMarked;\

      import\ org\.chromium\.build\.annotations\.Nullable;\

      import\ org\.chromium\.chrome\.R;\

      import\ org\.chromium\.chrome\.browser\.back_press\.BackPressManager;\

      import\ org\.chromium\.chrome\.browser\.ntp\.NtpScrollDelegate;\

      import\ org\.chromium\.chrome\.browser\.lens\.LensEntryPoint;\

      import\ org\.chromium\.chrome\.browser\.omnibox\.LocationBarEmbedder;\

      import\ org\.chromium\.chrome\.browser\.omnibox\.status\.StatusProperties\.StatusIconResource;\

      import\ org\.chromium\.components\.browser_ui\.widget\.gesture\.BackPressHandler;\

      import\ org\.chromium\.ui\.AsyncViewStub;\

      '
    replace: 'import org.chromium.build.annotations.NullMarked;

      import org.chromium.build.annotations.Nullable;

      import org.chromium.chrome.R;

      import org.chromium.chrome.browser.back_press.BackPressManager;

      import org.chromium.chrome.browser.lens.LensEntryPoint;

      import org.chromium.chrome.browser.ntp.NtpScrollDelegate;

      import org.chromium.chrome.browser.omnibox.LocationBarEmbedder;

      import org.chromium.chrome.browser.omnibox.status.StatusProperties.StatusIconResource;

      import org.chromium.components.browser_ui.widget.gesture.BackPressHandler;

      import org.chromium.ui.AsyncViewStub;

      '
