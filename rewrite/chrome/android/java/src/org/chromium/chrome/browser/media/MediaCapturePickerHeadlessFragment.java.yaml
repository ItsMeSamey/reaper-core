substitutions:
- description: Serialize public consent prompts and discard cancelled, stale and recreated-Activity results.
  regex:
    pattern: "package org.chromium.chrome.browser.media;\n\nimport android.app.Activity;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.media.projection.MediaProjectionManager;\nimport android.os.Bundle;\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\nimport androidx.annotation.IntDef;\nimport androidx.fragment.app.Fragment;\nimport androidx.fragment.app.FragmentActivity;\nimport androidx.fragment.app.FragmentManager;\n\nimport org.chromium.build.annotations.NullMarked;\nimport org.chromium.build.annotations.Nullable;\n\nimport java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\n/**\n * Headless fragment used to invoke the MediaProjection API.\n *\n * <p>This is created on a per-Activity basis.\n */\n@NullMarked\npublic class\
      \ MediaCapturePickerHeadlessFragment extends Fragment {\n    private static final String TAG = \"MediaCapturePickerHeadlessFragment\";\n\n    @Retention(RetentionPolicy.SOURCE)\n    @Target(ElementType.TYPE_USE)\n    @IntDef({\n        CaptureAction.CAPTURE_CANCELLED,\n        CaptureAction.CAPTURE_WINDOW,\n        CaptureAction.CAPTURE_SCREEN\n    })\n    @interface CaptureAction {\n        int CAPTURE_CANCELLED = 0;\n        int CAPTURE_WINDOW = 1;\n        int CAPTURE_SCREEN = 2;\n    }\n\n    interface Delegate {\n        void onPicked(@CaptureAction int action, ActivityResult result);\n    }\n\n    private MediaProjectionManager mMediaProjectionManager;\n    private ActivityResultLauncher<Intent> mLauncher;\n    /* package */ @Nullable Delegate mNextDelegate;\n\n    public static MediaCapturePickerHeadlessFragment getInstance(FragmentActivity activity) {\n        FragmentManager fragmentManager = activity.getSupportFragmentManager();\n        var fragment =\n                (MediaCapturePickerHeadlessFragment)\n\
      \                        fragmentManager.findFragmentByTag(MediaCapturePickerHeadlessFragment.TAG);\n\n        if (fragment == null) {\n            fragment = new MediaCapturePickerHeadlessFragment();\n            fragmentManager\n                    .beginTransaction()\n                    .add(fragment, MediaCapturePickerHeadlessFragment.TAG)\n                    .commitNowAllowingStateLoss();\n        }\n        return fragment;\n    }\n\n    @Override\n    public void onCreate(@Nullable Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\n        mMediaProjectionManager =\n                (MediaProjectionManager)\n                        requireActivity().getSystemService(Context.MEDIA_PROJECTION_SERVICE);\n\n        mLauncher =\n                registerForActivityResult(\n                        new ActivityResultContracts.StartActivityForResult(),\n                        result -> {\n                            assert mNextDelegate != null;\n        \
      \                    if (result.getResultCode() == Activity.RESULT_OK\n                                    && result.getData() != null) {\n                                // There is currently no way to differentiate between window and\n                                // screen sharing.\n                                mNextDelegate.onPicked(CaptureAction.CAPTURE_WINDOW, result);\n                            } else {\n                                mNextDelegate.onPicked(CaptureAction.CAPTURE_CANCELLED, result);\n                            }\n                            mNextDelegate = null;\n                        });\n    }\n\n    public void startAndroidCapturePrompt(Delegate delegate, @Nullable Intent intent) {\n        assert mNextDelegate == null;\n        mNextDelegate = delegate;\n        mLauncher.launch(\n                intent != null ? intent : mMediaProjectionManager.createScreenCaptureIntent());\n    }\n}\n"
    replace: "package org.chromium.chrome.browser.media;\n\nimport android.app.Activity;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.media.projection.MediaProjectionManager;\nimport android.os.Bundle;\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\nimport androidx.annotation.IntDef;\nimport androidx.fragment.app.Fragment;\nimport androidx.fragment.app.FragmentActivity;\nimport androidx.fragment.app.FragmentManager;\n\nimport org.chromium.build.annotations.NullMarked;\nimport org.chromium.build.annotations.Nullable;\n\nimport java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\n/**\n * Headless fragment used to invoke the MediaProjection API.\n *\n * <p>This is created on a per-Activity basis.\n */\n@NullMarked\npublic class\
      \ MediaCapturePickerHeadlessFragment extends Fragment {\n    private static final String TAG = \"MediaCapturePickerHeadlessFragment\";\n\n    @Retention(RetentionPolicy.SOURCE)\n    @Target(ElementType.TYPE_USE)\n    @IntDef({\n        CaptureAction.CAPTURE_CANCELLED,\n        CaptureAction.CAPTURE_WINDOW,\n        CaptureAction.CAPTURE_SCREEN\n    })\n    @interface CaptureAction {\n        int CAPTURE_CANCELLED = 0;\n        int CAPTURE_WINDOW = 1;\n        int CAPTURE_SCREEN = 2;\n    }\n\n    interface Delegate {\n        void onPicked(@CaptureAction int action, ActivityResult result);\n    }\n\n    private MediaProjectionManager mMediaProjectionManager;\n    private ActivityResultLauncher<Intent> mLauncher;\n    /* package */ @Nullable Delegate mNextDelegate;\n    private boolean mPromptOutstanding;\n\n    public static MediaCapturePickerHeadlessFragment getInstance(FragmentActivity activity) {\n        FragmentManager fragmentManager = activity.getSupportFragmentManager();\n\
      \        var fragment =\n                (MediaCapturePickerHeadlessFragment)\n                        fragmentManager.findFragmentByTag(MediaCapturePickerHeadlessFragment.TAG);\n\n        if (fragment == null) {\n            fragment = new MediaCapturePickerHeadlessFragment();\n            fragmentManager\n                    .beginTransaction()\n                    .add(fragment, MediaCapturePickerHeadlessFragment.TAG)\n                    .commitNowAllowingStateLoss();\n        }\n        return fragment;\n    }\n\n    @Override\n    public void onCreate(@Nullable Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        mPromptOutstanding =\n                savedInstanceState != null\n                        && savedInstanceState.getBoolean(\"capture_prompt_outstanding\");\n\n        mMediaProjectionManager =\n                (MediaProjectionManager)\n                        requireActivity().getSystemService(Context.MEDIA_PROJECTION_SERVICE);\n\n     \
      \   mLauncher =\n                registerForActivityResult(\n                        new ActivityResultContracts.StartActivityForResult(),\n                        result -> {\n                            Delegate delegate = mNextDelegate;\n                            mNextDelegate = null;\n                            mPromptOutstanding = false;\n                            if (delegate == null) return;\n                            if (result.getResultCode() == Activity.RESULT_OK\n                                    && result.getData() != null) {\n                                // There is currently no way to differentiate between window and\n                                // screen sharing.\n                                delegate.onPicked(CaptureAction.CAPTURE_WINDOW, result);\n                            } else {\n                                delegate.onPicked(CaptureAction.CAPTURE_CANCELLED, result);\n                            }\n                        });\n    }\n\n \
      \   public boolean startAndroidCapturePrompt(Delegate delegate, @Nullable Intent intent) {\n        if (mPromptOutstanding || !isAdded()) return false;\n        mNextDelegate = delegate;\n        mPromptOutstanding = true;\n        try {\n            mLauncher.launch(\n                    intent != null ? intent : mMediaProjectionManager.createScreenCaptureIntent());\n            return true;\n        } catch (RuntimeException error) {\n            mNextDelegate = null;\n            mPromptOutstanding = false;\n            throw error;\n        }\n    }\n\n    public void cancelPrompt(Delegate delegate) {\n        if (mNextDelegate == delegate) mNextDelegate = null;\n        // Keep the prompt reserved until its real result arrives. Otherwise an old\n        // OS result could authorize a different request launched in the same Activity.\n    }\n\n    @Override\n    public void onSaveInstanceState(Bundle state) {\n        state.putBoolean(\"capture_prompt_outstanding\", mPromptOutstanding);\n\
      \        super.onSaveInstanceState(state);\n    }\n\n    @Override\n    public void onDestroy() {\n        Delegate delegate = mNextDelegate;\n        mNextDelegate = null;\n        if (delegate != null) {\n            delegate.onPicked(\n                    CaptureAction.CAPTURE_CANCELLED,\n                    new ActivityResult(Activity.RESULT_CANCELED, null));\n        }\n        super.onDestroy();\n    }\n}\n"
