substitutions:
- description: Remove dedicated positive Shopping action case
  regex:
    pattern: "    @Test\n    public void priceTrackingActionShownSuccessfully() {\n        doReturn(JUnitTestGURLs.EXAMPLE_URL).when(mMockTab).getUrl();\n\
      \        HashMap<Integer, ActionProvider> providers = new HashMap<>();\n        PriceTrackingActionProvider provider\
      \ =\n                new PriceTrackingActionProvider(() -> mShoppingService, () -> mBookmarkModel);\n        providers.put(AdaptiveToolbarButtonVariant.PRICE_TRACKING,\
      \ provider);\n        SignalAccumulator accumulator = new SignalAccumulator(new Handler(), providers);\n        setIsUrlPriceTrackableResult(true);\n\
      \        provider.getAction(mMockTab, accumulator);\n        Assert.assertTrue(accumulator.getSignal(AdaptiveToolbarButtonVariant.PRICE_TRACKING));\n\
      \    }\n\n"
    replace: ''
  count: 1
- description: Remove sole utility-native positive/negative mock helper setIsUrlPriceTrackableResult
  regex:
    pattern: "    private void setIsUrlPriceTrackableResult(boolean hasProductInfo) {\n        ProductInfo testProductInfo\
      \ =\n                new ProductInfo(null, null, 12345L, null, null, 0, null, null);\n        doReturn(true).when(mCommerceFeatureUtilsJniMock).isShoppingListEligible(anyLong());\n\
      \        Mockito.doAnswer(\n                        invocation -> {\n                            ProductInfoCallback\
      \ callback = invocation.getArgument(1);\n                            callback.onResult(\n                          \
      \          invocation.getArgument(0),\n                                    hasProductInfo ? testProductInfo : null);\n\
      \                            return null;\n                        })\n                .when(mShoppingService)\n   \
      \             .getProductInfoForUrl(any(), any());\n    }\n\n"
    replace: ''
  count: 1
- description: Remove sole utility-native positive/negative mock helper setIsBookmarkPriceTrackedResult
  regex:
    pattern: "    private void setIsBookmarkPriceTrackedResult(boolean isBookmarkPriceTracked) {\n        doAnswer(\n    \
      \                    (InvocationOnMock invocation) -> {\n                            Callback<Boolean> callback = invocation.getArgument(2);\n\
      \                            callback.onResult(isBookmarkPriceTracked);\n                            return null;\n\
      \                        })\n                .when(mMockPriceTrackingUtilsJni)\n                .isBookmarkPriceTracked(any(Profile.class),\
      \ anyLong(), any());\n    }\n\n"
    replace: ''
  count: 1
- description: Remove unavailable PriceTrackingUtils native mock
  regex:
    pattern: '    @Mock PriceTrackingUtils.Natives mMockPriceTrackingUtilsJni;

      '
    replace: ''
  count: 1
- description: Use real false tracking completion
  regex:
    pattern: '        PriceTrackingUtilsJni.setInstanceForTesting(mMockPriceTrackingUtilsJni);

      '
    replace: ''
  count: 1
- description: Keep negative action signal using real unavailable eligibility
  regex:
    pattern: "    @Test\n    public void priceTrackingNotShownForNonTrackablePages() {\n        doReturn(JUnitTestGURLs.GOOGLE_URL).when(mMockTab).getUrl();\n\
      \        HashMap<Integer, ActionProvider> providers = new HashMap<>();\n        PriceTrackingActionProvider provider\
      \ =\n                new PriceTrackingActionProvider(() -> mShoppingService, () -> mBookmarkModel);\n        providers.put(AdaptiveToolbarButtonVariant.PRICE_TRACKING,\
      \ provider);\n        SignalAccumulator accumulator = new SignalAccumulator(new Handler(), providers);\n        // URL\
      \ does not support price tracking.\n        setIsUrlPriceTrackableResult(false);\n        // URL is bookmarked.\n  \
      \      doReturn(new BookmarkId(1L, 0)).when(mBookmarkModel).getUserBookmarkIdForTab(mMockTab);\n        // Bookmark\
      \ has no price tracking information.\n        setIsBookmarkPriceTrackedResult(false);\n        provider.getAction(mMockTab,\
      \ accumulator);\n        Assert.assertFalse(accumulator.getSignal(AdaptiveToolbarButtonVariant.PRICE_TRACKING));\n \
      \   }\n\n"
    replace: "    @Test\n    public void priceTrackingNotShownForNonTrackablePages() {\n        doReturn(JUnitTestGURLs.GOOGLE_URL).when(mMockTab).getUrl();\n\
      \        HashMap<Integer, ActionProvider> providers = new HashMap<>();\n        PriceTrackingActionProvider provider\
      \ =\n                new PriceTrackingActionProvider(() -> mShoppingService, () -> mBookmarkModel);\n        providers.put(AdaptiveToolbarButtonVariant.PRICE_TRACKING,\
      \ provider);\n        SignalAccumulator accumulator = new SignalAccumulator(new Handler(), providers);\n        // URL\
      \ is bookmarked.\n        doReturn(new BookmarkId(1L, 0)).when(mBookmarkModel).getUserBookmarkIdForTab(mMockTab);\n\
      \        provider.getAction(mMockTab, accumulator);\n        Assert.assertFalse(accumulator.getSignal(AdaptiveToolbarButtonVariant.PRICE_TRACKING));\n\
      \    }\n\n"
  count: 1
