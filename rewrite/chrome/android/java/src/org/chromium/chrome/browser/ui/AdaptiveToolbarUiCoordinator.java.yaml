- description: Remove dedicated Shopping subscription observer field.
  regex:
    pattern: '    private CurrentTabPriceTrackingStateSupplier mCurrentTabPriceTrackingStateSupplier;

      '
    replace: ''
  count: 1
- description: Remove fields used only by retired commerce sheets; keep ordinary constructor state.
  regex:
    pattern: "    private BottomSheetController mBottomSheetController;\n    private MonotonicObservableSupplier<Profile>\
      \ mProfileSupplier;\n    private Supplier<ScrimManager> mScrimSupplier;\n    private Supplier<@Nullable TabModelSelector>\
      \ mTabModelSelectorSupplier;\n    private @Nullable CommerceBottomSheetContentCoordinator mCommerceBottomSheetContentCoordinator;\n"
    replace: ''
  count: 1
- description: Remove now-unused commerce-only selector initializer parameter.
  regex:
    pattern: '            MonotonicObservableSupplier<TabModelSelector> tabModelSelectorSupplier,

      '
    replace: ''
  count: 1
- description: Remove now-unused commerce-only bookmark action initializer parameter.
  regex:
    pattern: '            Supplier<TabBookmarker> tabBookmarkerSupplier,

      '
    replace: ''
  count: 1
- description: Remove now-unused commerce-only scrim initializer parameter.
  regex:
    pattern: '            Supplier<ScrimManager> scrimSupplier,

      '
    replace: ''
  count: 1
- description: Remove Shopping observer/insights/tracking button construction; preserve following Reader and ordinary providers.
  regex:
    pattern: "        mBottomSheetController = bottomSheetController;\n        mProfileSupplier = profileSupplier;\n     \
      \   mScrimSupplier = scrimSupplier;\n        mTabModelSelectorSupplier = tabModelSelectorSupplier;\n        mCurrentTabPriceTrackingStateSupplier\
      \ =\n                new CurrentTabPriceTrackingStateSupplier(\n                        mActivityTabProvider.asObservable(),\
      \ profileSupplier);\n\n        PriceInsightsButtonController priceInsightsButtonController =\n                new PriceInsightsButtonController(\n\
      \                        mContext,\n                        mActivityTabProvider,\n                        tabModelSelectorSupplier,\n\
      \                        () ->\n                                ShoppingServiceFactory.getForProfile(\n            \
      \                            assertNonNull(profileSupplier.get())),\n                        mModalDialogManagerSupplier.get(),\n\
      \                        bottomSheetController,\n                        snackbarManagerSupplier.get(),\n          \
      \              new PriceInsightsDelegateImpl(\n                                mContext, mCurrentTabPriceTrackingStateSupplier),\n\
      \                        AppCompatResources.getDrawable(mContext, R.drawable.ic_trending_down_24dp),\n             \
      \           this::getCommerceBottomSheetContentController);\n        PriceTrackingButtonController priceTrackingButtonController\
      \ =\n                new PriceTrackingButtonController(\n                        mContext,\n                       \
      \ mActivityTabProvider,\n                        mModalDialogManagerSupplier.get(),\n                        bottomSheetController,\n\
      \                        snackbarManagerSupplier.get(),\n                        tabBookmarkerSupplier,\n          \
      \              profileSupplier,\n                        bookmarkModelSupplier,\n                        mCurrentTabPriceTrackingStateSupplier);\n"
    replace: ''
  count: 1
- description: Remove dedicated discount button construction/registration.
  regex:
    pattern: "        DiscountsButtonController discountsButtonController =\n                new DiscountsButtonController(\n\
      \                        mContext,\n                        mActivityTabProvider,\n                        mModalDialogManagerSupplier.get(),\n\
      \                        mBottomSheetController,\n                        this::getCommerceBottomSheetContentController);\n\
      \        adaptiveToolbarButtonController.addButtonVariant(\n                AdaptiveToolbarButtonVariant.DISCOUNTS,\
      \ discountsButtonController);\n\n"
    replace: ''
  count: 1
- description: Remove price-insights/tracking registrations; retain Reader, ReadAloud, share and translate.
  regex:
    pattern: "        adaptiveToolbarButtonController.addButtonVariant(\n                AdaptiveToolbarButtonVariant.PRICE_INSIGHTS,\
      \ priceInsightsButtonController);\n        adaptiveToolbarButtonController.addButtonVariant(\n                AdaptiveToolbarButtonVariant.PRICE_TRACKING,\
      \ priceTrackingButtonController);\n"
    replace: ''
  count: 1
- description: Preserve public CCT compatibility action without invoking an absent optional provider.
  regex:
    pattern: "    /** Invokes Price Insights UI. */\n    public void runPriceInsightsAction() {\n        mAdaptiveToolbarButtonController.runPriceInsightsAction();\n\
      \    }"
    replace: "    /** Price insights are unavailable; retain the entry point for existing menu callers. */\n    public void\
      \ runPriceInsightsAction() {}"
  count: 1
- description: Remove only retired observer teardown; retain ordinary PCA/provider teardown.
  regex:
    pattern: "        if (mCurrentTabPriceTrackingStateSupplier != null) {\n            mCurrentTabPriceTrackingStateSupplier.destroy();\n\
      \            mCurrentTabPriceTrackingStateSupplier = null;\n        }\n\n"
    replace: ''
  count: 1
- description: Remove all three dedicated content factories and commerce-sheet owner lifecycle.
  regex:
    pattern: "    private PriceTrackingBottomSheetContentCoordinator createPriceTrackingContentProvider() {\n        return\
      \ new PriceTrackingBottomSheetContentCoordinator(\n                mContext,\n                mActivityTabProvider,\n\
      \                new PriceInsightsDelegateImpl(mContext, mCurrentTabPriceTrackingStateSupplier));\n    }\n\n    private\
      \ DiscountsBottomSheetContentCoordinator createDiscountsContentProvider() {\n        return new DiscountsBottomSheetContentCoordinator(mContext,\
      \ mActivityTabProvider);\n    }\n\n    private PriceHistoryBottomSheetContentCoordinator createPriceHistoryContentProvider()\
      \ {\n        return new PriceHistoryBottomSheetContentCoordinator(\n                mContext,\n                mActivityTabProvider,\n\
      \                mTabModelSelectorSupplier,\n                new PriceInsightsDelegateImpl(mContext, mCurrentTabPriceTrackingStateSupplier));\n\
      \    }\n\n    private @Nullable\n            CommerceBottomSheetContentController getCommerceBottomSheetContentController()\
      \ {\n        // This flag is for discounts and commerce bottom sheet as a feature together.\n        if (mCommerceBottomSheetContentCoordinator\
      \ == null\n                && CommerceFeatureUtils.isDiscountInfoApiEnabled(\n                        ShoppingServiceFactory.getForProfile(\n\
      \                                assertNonNull(mProfileSupplier.get())))) {\n\n            List<Supplier<CommerceBottomSheetContentProvider>>\
      \ contentProviderSuppliers =\n                    new ArrayList<>();\n            contentProviderSuppliers.add(this::createPriceTrackingContentProvider);\n\
      \            contentProviderSuppliers.add(this::createDiscountsContentProvider);\n            contentProviderSuppliers.add(this::createPriceHistoryContentProvider);\n\
      \n            mCommerceBottomSheetContentCoordinator =\n                    new CommerceBottomSheetContentCoordinator(\n\
      \                            mContext,\n                            mBottomSheetController,\n                      \
      \      mScrimSupplier,\n                            contentProviderSuppliers);\n        }\n\n        return mCommerceBottomSheetContentCoordinator;\n\
      \    }\n\n"
    replace: ''
  count: 1
