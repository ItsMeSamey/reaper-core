substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove the selected Glic-only IPH timeout metadata.
    regex:
      re_pattern: '\ \ \ \ //\ 5\ seconds\.\

        \ \ \ \ @VisibleForTesting\ static\ final\ int\ GLIC_IPH_AUTO_DISMISS_TIMEOUT_MS\
        =\ 5\ \*\ 1000;\

        '
      replace: ''
  - description: Remove selected Glic promo IPH construction and its dedicated text/feature
      hooks; normal toolbar IPH stays.
    regex:
      re_pattern: '\ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Attempts\ to\ show\ the\ Glic\ Promo\ in\-product\ help\ bubble\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ anchorView\ The\ view\ to\ anchor\ the\ IPH\ bubble\ on\.\

        \ \ \ \ \ \*/\

        \ \ \ \ public\ void\ showGlicIph\(View\ anchorView\)\ \{\

        \ \ \ \ \ \ \ \ mEducationHelper\.requestShowIph\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ IphCommandBuilder\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mContext\.getResources\(\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FeatureConstants\.GLIC_PROMO_ANDROID_FEATURE,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.string\.iph_glic_promo_text,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.string\.iph_glic_promo_accessibility_text\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setAnchorView\(anchorView\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setDismissOnTouch\(true\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setAutoDismissTimeout\(GLIC_IPH_AUTO_DISMISS_TIMEOUT_MS\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.build\(\)\);\

        \ \ \ \ \}\

        '
      replace: ''
