substitutions:
- description: Remove the dedicated store-info supplier field
  regex:
    pattern: "    private final @Nullable MonotonicObservableSupplier<StoreInfoActionHandler>\n            mStoreInfoActionHandlerSupplier;\n"
    replace: ''
  count: 1
- description: Remove only the merchant constructor parameter
  regex:
    pattern: "            @Nullable MonotonicObservableSupplier<StoreInfoActionHandler>\n                    storeInfoActionHandlerSupplier,\n"
    replace: ''
  count: 1
- description: Remove its assignment
  regex:
    pattern: '        mStoreInfoActionHandlerSupplier = storeInfoActionHandlerSupplier;

      '
    replace: ''
  count: 1
- description: Remove only the merchant StoreInfo row while preserving history/about-site/app rows
  regex:
    pattern: "        if (!isIncognito()) {\n            var storeInfoRow = new PageInfoRowView(rowWrapper.getContext(), null);\n\
      \            storeInfoRow.setId(PageInfoStoreInfoController.STORE_INFO_ROW_ID);\n            rowWrapper.addView(storeInfoRow);\n\
      \            controllers.add(\n                    new PageInfoStoreInfoController(\n                            mainController,\n\
      \                            storeInfoRow,\n                            mStoreInfoActionHandlerSupplier,\n         \
      \                   mPageInfoHighlight.shouldHighlightStoreInfo(),\n                            mWebContents,\n    \
      \                        mProfile));\n        }\n"
    replace: ''
  count: 1
- description: Remove the private highlight field used only by that retired row
  regex:
    pattern: '    private final ChromePageInfoHighlight mPageInfoHighlight;

      '
    replace: ''
  count: 1
- description: Remove that field assignment; retain the generic public highlight parameter and ordinary PageInfo highlights
  regex:
    pattern: '        mPageInfoHighlight = pageInfoHighlight;

      '
    replace: ''
  count: 1
- description: Remove only the now-unused StoreInfoActionHandler import
  regex:
    pattern: 'import org.chromium.chrome.browser.merchant_viewer.PageInfoStoreInfoController.StoreInfoActionHandler;

      '
    replace: ''
  count: 1
- description: Remove only the now-unused PageInfoStoreInfoController import
  regex:
    pattern: 'import org.chromium.chrome.browser.merchant_viewer.PageInfoStoreInfoController;

      '
    replace: ''
  count: 1
- description: Remove only the now-unused MonotonicObservableSupplier import
  regex:
    pattern: 'import org.chromium.base.supplier.MonotonicObservableSupplier;

      '
    replace: ''
  count: 1
