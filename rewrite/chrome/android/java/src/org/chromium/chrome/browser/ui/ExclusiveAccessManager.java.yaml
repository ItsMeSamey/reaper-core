      \        ExclusiveAccessManagerJni.get()\n                        .init(this, windowAndroid, mFullscreenManager, activityTabProvider);\n\
      \        // Publish the trusted caller before an initial fullscreen notice is generated.\n        notifyFullscreenExtensionUrl();\n\
      \        // Synchronize a browser request applied before this native manager existed.\n        notifyWindowFullscreenState();\n\
      \n        for (TabModel model : modelSelector.getModels()) {\n            model.addObserver(mTabModelObserver);\n  \
      \      }\n"
