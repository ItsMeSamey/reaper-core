- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
  regex:
    re_pattern: '\ \ \ \ @Nullable\ private\ TabModelSelector\ mTabModelSelector;\

      \ \ \ \ private\ final\ TabModelObserver\ mTabModelObserver;\

      \ \ \ \ private\ final\ SettableNonNullObservableSupplier<Boolean>\ mExclusiveAccessState\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ ObservableSuppliers\.createNonNull\(false\);\

      \ \ \ \ private\ boolean\ mPendingFullscreen;\

      \ \ \ \ @Nullable\ private\ FullscreenOptions\ mLatestFullscreenOptions;\

      \

      \ \ \ \ public\ ExclusiveAccessManager\(\

      \ \ \ \ \ \ \ \ \ \ \ \ FullscreenManager\ fullscreenManager,\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ DesktopWindowStateManager\ desktopWindowStateManager\)\ \{\

      \ \ \ \ \ \ \ \ mFullscreenManager\ =\ fullscreenManager;\

      \ \ \ \ \ \ \ \ if\ \(desktopWindowStateManager\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mDesktopWindowStateManager\ =\ desktopWindowStateManager;\

      \ \ \ \ \ \ \ \ \ \ \ \ mDesktopWindowStateManager\.addObserver\(this\);\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: "    @Nullable private TabModelSelector mTabModelSelector;\n    private final TabModelObserver mTabModelObserver;\n\
      \    private final SettableNonNullObservableSupplier<Boolean> mExclusiveAccessState =\n            ObservableSuppliers.createNonNull(false);\n\
      \    private final NonNullObservableSupplier<FullscreenManager.BrowserFullscreenExtensionInfo>\n            mBrowserFullscreenExtensionInfoSupplier;\n\
      \    private final Callback<FullscreenManager.BrowserFullscreenExtensionInfo>\n            mBrowserFullscreenExtensionInfoObserver\
      \ = unused -> notifyFullscreenExtensionUrl();\n    private final NonNullObservableSupplier<Boolean> mFullscreenUiModeSupplier;\n\
      \    private final Callback<Boolean> mFullscreenUiModeObserver =\n            unused -> notifyWindowFullscreenState();\n\
      \    private boolean mObservingFullscreenUi = true;\n    private boolean mReportedFullscreenUi;\n    private @Nullable\
      \ FullscreenManager.BrowserFullscreenExtensionInfo\n            mReportedFullscreenExtensionInfo;\n    private boolean\
      \ mPendingFullscreen;\n    @Nullable private FullscreenOptions mLatestFullscreenOptions;\n\n    public ExclusiveAccessManager(\n\
      \            FullscreenManager fullscreenManager,\n            @Nullable DesktopWindowStateManager desktopWindowStateManager)\
      \ {\n        mFullscreenManager = fullscreenManager;\n        mFullscreenUiModeSupplier = fullscreenManager.getFullscreenUiModeSupplier();\n\
      \        mBrowserFullscreenExtensionInfoSupplier =\n                fullscreenManager.getBrowserFullscreenExtensionInfoSupplier();\n\
      \        if (desktopWindowStateManager != null) {\n            mDesktopWindowStateManager = desktopWindowStateManager;\n\
      \            mDesktopWindowStateManager.addObserver(this);\n        }\n"
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (3)
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ locks\.\

      \ \ \ \ \ \ \ \ mFullscreenManager\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.getPersistentFullscreenModeSupplier\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.addSyncObserverAndPostIfNonNull\(mExclusiveAccessState::set\);\

      \ \ \ \ \}\

      \

      \ \ \ \ public\ void\ initialize\(\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ TabModelSelector\ modelSelector,\

      '
    replace: "        // locks.\n        mFullscreenManager\n                .getPersistentFullscreenModeSupplier()\n    \
      \            .addSyncObserverAndPostIfNonNull(mExclusiveAccessState::set);\n        // Native window transitions use\
      \ aggregate UI state; the DOM/lock supplier above stays\n        // independent so browser fullscreen never claims renderer\
      \ exclusive access.\n        mBrowserFullscreenExtensionInfoSupplier.addSyncObserverAndPostIfNonNull(\n            \
      \    mBrowserFullscreenExtensionInfoObserver);\n        mFullscreenUiModeSupplier.addSyncObserverAndPostIfNonNull(mFullscreenUiModeObserver);\n\
      \    }\n\n    private void notifyFullscreenExtensionUrl() {\n        if (!mObservingFullscreenUi || mExclusiveAccessManagerAndroidNativePointer\
      \ == 0) return;\n        var info = mBrowserFullscreenExtensionInfoSupplier.get();\n        var previous = mReportedFullscreenExtensionInfo;\n\
      \        if (previous != null\n                && previous.getUrl().equals(info.getUrl())\n                && previous.getName().equals(info.getName()))\
      \ return;\n        mReportedFullscreenExtensionInfo = info;\n        ExclusiveAccessManagerJni.get()\n             \
      \   .setFullscreenExtensionUrl(\n                        mExclusiveAccessManagerAndroidNativePointer, info.getUrl(),\
      \ info.getName());\n    }\n\n    private void notifyWindowFullscreenState() {\n        if (!mObservingFullscreenUi ||\
      \ mExclusiveAccessManagerAndroidNativePointer == 0) return;\n        boolean fullscreen = mFullscreenUiModeSupplier.get();\n\
      \        if (fullscreen == mReportedFullscreenUi) return;\n        mReportedFullscreenUi = fullscreen;\n        ExclusiveAccessManagerJni.get()\n\
      \                .onWindowFullscreenStateChanged(mExclusiveAccessManagerAndroidNativePointer);\n    }\n\n    public\
      \ void initialize(\n            @Nullable TabModelSelector modelSelector,\n"
