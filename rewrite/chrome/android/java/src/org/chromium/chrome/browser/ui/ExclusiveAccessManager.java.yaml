      \

      \ \ \ \ \ \ \ \ for\ \(TabModel\ model\ :\ modelSelector\.getModels\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ model\.addObserver\(mTabModelObserver\);\

      \ \ \ \ \ \ \ \ \}\

      '
