substitutions:
- description: Resolve extension history overrides before choosing a phone or tablet presentation.
  regex:
    pattern: "        Context appContext = ContextUtils.getApplicationContext();\n        if (DeviceFormFactor.isNonMultiDisplayContextOnTablet(activity)) {\n            UrlConstantResolver urlConstantResolver =\n                    UrlConstantResolverFactory.getForProfile(profile);\n\n            // History shows up as a tab on tablets.\n            LoadUrlParams params = new LoadUrlParams(urlConstantResolver.getHistoryPageUrl());"
    replace: "        Context appContext = ContextUtils.getApplicationContext();\n        UrlConstantResolver urlConstantResolver = UrlConstantResolverFactory.getForProfile(profile);\n        String url = urlConstantResolver.getHistoryPageUrl();\n        boolean hasExtensionOverride = url.equals(UrlConstantResolver.getOriginalHistoryUrl());\n        if (DeviceFormFactor.isNonMultiDisplayContextOnTablet(activity) || hasExtensionOverride) {\n            // Reuse tab presentation for extension pages on phones as well.\n            LoadUrlParams params = new LoadUrlParams(url);"
