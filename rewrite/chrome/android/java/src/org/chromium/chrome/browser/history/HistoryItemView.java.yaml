# Reaper Source328 Actor-history and AI-starter-pack decoration implementation closure.
  - description: Reaper Android physical Actor-history and AI-starter-pack decoration
      closure; retain real ordinary history and favicon behavior and disclosed fixture
      assertions.
    regex:
      re_pattern: '\ \ \ \ private\ boolean\ mIsItemRemoved;\

        \ \ \ \ private\ BooleanSupplier\ mShowSourceApp;\

        \ \ \ \ private\ ChipView\ mChipView;\

        \ \ \ \ private\ View\ mSparkContainer;\

        \

        \ \ \ \ public\ HistoryItemView\(Context\ context,\ AttributeSet\ attrs\)\ \{\

        \ \ \ \ \ \ \ \ super\(context,\ attrs\);\

        '
      replace: "    private boolean mIsItemRemoved;\n    private BooleanSupplier mShowSourceApp;\n\
        \    private ChipView mChipView;\n\n    public HistoryItemView(Context context,\
        \ AttributeSet attrs) {\n        super(context, attrs);\n"
  - description: Reaper Android physical Actor-history and AI-starter-pack decoration
      closure; retain real ordinary history and favicon behavior and disclosed fixture
      assertions.
    regex:
      re_pattern: '\

        \ \ \ \ \ \ \ \ mChipView\ =\ findViewById\(R\.id\.chip\);\

        \ \ \ \ \ \ \ \ mChipView\.getPrimaryTextView\(\)\.setEllipsize\(TextUtils\.TruncateAt\.END\);\

        \

        \ \ \ \ \ \ \ \ mSparkContainer\ =\ findViewById\(R\.id\.spark_container\);\

        \ \ \ \ \ \ \ \ //\ Ensure\ the\ spark\ is\ drawn\ on\ top\ of\ the\ favicon\
        and\ its\ background\.\ This\ is\ needed\

        \ \ \ \ \ \ \ \ //\ because\ the\ content\ of\ xml\ is\ added\ first,\ then\
        the\ content\ from\ code\ is\ added\ next\ \(on\

        \ \ \ \ \ \ \ \ //\ top\ of\ the\ xml\ children\)\.\

        \ \ \ \ \ \ \ \ mSparkContainer\.bringToFront\(\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Override\

        '
      replace: "\n        mChipView = findViewById(R.id.chip);\n        mChipView.getPrimaryTextView().setEllipsize(TextUtils.TruncateAt.END);\n\
        \    }\n\n    @Override\n"
  - description: Reaper Android physical Actor-history and AI-starter-pack decoration
      closure; retain real ordinary history and favicon behavior and disclosed fixture
      assertions.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ mRemoveButton\.setOnClickListener\(_\ \->\
        remove\(\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ mRemoveButton\.setContentDescription\(getContext\(\)\.getString\(R\.string\.remove\)\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ updateSparkVisibility\(\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Override\

        \ \ \ \ protected\ void\ updateView\(boolean\ animate\)\ \{\

        \ \ \ \ \ \ \ \ super\.updateView\(animate\);\

        \ \ \ \ \ \ \ \ updateSparkVisibility\(\);\

        \ \ \ \ \}\

        \

        \ \ \ \ private\ void\ updateSparkVisibility\(\)\ \{\

        \ \ \ \ \ \ \ \ HistoryItem\ item\ =\ getItem\(\);\

        \ \ \ \ \ \ \ \ //\ The\ spark\ should\ be\ shown\ only\ if\ the\ item\ is\
        not\ selected\ \(checked\),\ blocked,\ and\ is\ an\

        \ \ \ \ \ \ \ \ //\ actor\ visit\.\

        \ \ \ \ \ \ \ \ boolean\ showSpark\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ item\ !=\ null\ \&\&\ item\.isActorVisit\(\)\
        \&\&\ !item\.wasBlockedVisit\(\)\ \&\&\ !isChecked\(\);\

        \ \ \ \ \ \ \ \ mSparkContainer\.setVisibility\(showSpark\ \?\ View\.VISIBLE\
        :\ View\.GONE\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Initializer\

        '
      replace: "            mRemoveButton.setOnClickListener(_ -> remove());\n     \
        \       mRemoveButton.setContentDescription(getContext().getString(R.string.remove));\n\
        \        }\n    }\n\n    @Initializer\n"
  - description: Reaper Android physical Actor-history and AI-starter-pack decoration
      closure; retain real ordinary history and favicon behavior and disclosed fixture
      assertions.
    regex:
      re_pattern: '\ \ \ \ View\ getRemoveButtonForTests\(\)\ \{\

        \ \ \ \ \ \ \ \ return\ mRemoveButton;\

        \ \ \ \ \}\

        \

        \ \ \ \ @VisibleForTesting\

        \ \ \ \ View\ getSparkContainerForTests\(\)\ \{\

        \ \ \ \ \ \ \ \ return\ mSparkContainer;\

        \ \ \ \ \}\

        \}\

        '
      replace: "    View getRemoveButtonForTests() {\n        return mRemoveButton;\n\
        \    }\n}\n"
