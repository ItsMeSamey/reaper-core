# Android DevTools profile ownership and phone entry.
substitutions:
- description: Represent the frontend privacy mode using the existing custom-tab mode
  regex:
    re_pattern: import\ org\.chromium\.chrome\.browser\.flags\.ActivityType;
    replace: 'import org.chromium.chrome.browser.flags.ActivityType;

      import org.chromium.chrome.browser.flags.CustomTabProfileType;'
- description: Keep the validated profile mode across custom-tab initialization
  regex:
    re_pattern: '\ \ \ \ private\ final\ ColorProvider\ mColorProvider;\

      \

      \ \ \ \ DevToolsIntentDataProvider\(Intent\ intent\)\ \{\

      \ \ \ \ \ \ \ \ mIntent\ =\ intent;'
    replace: "    private final ColorProvider mColorProvider;\n    private final @CustomTabProfileType int mProfileType;\n\n    DevToolsIntentDataProvider(Intent intent, @CustomTabProfileType int profileType) {\n        mIntent = intent;\n        mProfileType = profileType;"
- description: Initialize placeholder tabs and incognito lifecycle in the correct model
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ @ActivityType\ int\ getActivityType\(\)\ \{'
    replace: "    @Override\n    public @CustomTabProfileType int getCustomTabMode() {\n        return mProfileType;\n    }\n\n    @Override\n    public @ActivityType int getActivityType() {"
