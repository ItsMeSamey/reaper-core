      replace: Begin a new Omnibox input session.
  - description: Describe normal input without the removed product name
    regex:
      re_pattern: End\ the\ current\ fusebox\ input\ session\.
      replace: End the current Omnibox input session.
  - description: Describe normal input without the removed product name
