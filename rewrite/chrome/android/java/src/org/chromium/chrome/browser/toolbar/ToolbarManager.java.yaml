        \ \ \ \ public\ void\ beginInput\(AutocompleteInput\ input\)'
      replace: '    public void beginInput(AutocompleteInput input)'
  - description: Remove annotation belonging solely to the omitted interface; public
      functional wrappers remain
    regex:
      re_pattern: '\ \ \ \ @Override\

        \ \ \ \ public\ void\ endInput\(\)'
      replace: '    public void endInput()'
  - description: Remove annotation belonging solely to the omitted interface; public
      functional wrappers remain
    regex:
