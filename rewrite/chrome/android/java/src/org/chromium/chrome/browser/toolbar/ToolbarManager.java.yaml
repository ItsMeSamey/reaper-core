      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabObscuringHandler\.Observer,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FuseboxControls\ \{'
      replace: '                TabObscuringHandler.Observer {'
  - description: Remove annotation belonging solely to the omitted interface; public
