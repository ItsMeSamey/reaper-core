substitutions:
  - description: |-
      Make shouldSuppressToolbarLongPress overridable
    regex:
      re_pattern: |-
        private (boolean shouldSuppressToolbarLongPress\(\))
      replace: |-
        protected \1
  - description: Track the extension toolbar profile and its recreation dependencies.
    regex:
      re_pattern: |2-
            private @Nullable ExtensionsToolbarCoordinator mExtensionsToolbarCoordinator;
      replace: |2-
            private @Nullable ExtensionsToolbarCoordinator mExtensionsToolbarCoordinator;
            private @Nullable ChromeAndroidTaskFeatureKey mExtensionsToolbarFeatureKey;
            private @Nullable Runnable mUpdateExtensionsToolbar;
  - description: Initialize the extension toolbar through its profile-aware lifecycle.
    regex:
      re_pattern: |2-
                ViewStub extensionsToolbarStub =
                        mControlContainer\.findViewById\(R\.id\.extensions_toolbar_container_stub\);
                if \(extensionsToolbarStub != null\) \{
                    ChromeAndroidTask task = mChromeAndroidTaskSupplier\.get\(\);
                    // ChromeAndroidTask is available only on Desktop Android\.
                    if \(task != null\) \{
                        Profile tabModelProfile =
                                assertNonNull\(mTabModelSelector\.getCurrentModel\(\)\.getProfile\(\)\);
                        // Register as an Activity\-scoped feature of \{@link ChromeAndroidTask\}\. This ensures
                        // its C\+\+ UnownedUserData objects are destroyed prior to the host \(BWI\) when a
                        // Profile is destroyed on mobile Android\. Explicit destruction in
                        // ToolbarManager\.destroy\(\) is also preserved for standard Activity teardown\.
                        Runnable cleanup =
                                \(\) \-> \{
                                    if \(mToolbar != null\) \{
                                        mToolbar\.setExtensionsToolbarCoordinator\(null\);
                                    \}
                                    mExtensionsToolbarCoordinator = null;
                                \};
                        mExtensionsToolbarCoordinator =
                                \(ExtensionsToolbarCoordinator\)
                                        task\.addFeature\(
                                                new ChromeAndroidTaskFeatureKey\(
                                                        ExtensionsToolbarCoordinator\.class,
                                                        tabModelProfile,
                                                        \(ActivityWindowAndroid\) mWindowAndroid\),
                                                \(\) \->
                                                        ExtensionsToolbarCoordinator\.maybeCreate\(
                                                                mActivity,
                                                                extensionsToolbarStub,
                                                                mWindowAndroid,
                                                                task,
                                                                tabModelProfile,
                                                                mActivityTabProvider\.asObservable\(\),
                                                                mTabCreatorManager\.getTabCreator\(false\),
                                                                getBrowsingModeThemeColorProvider\(\),
                                                                \(ToolbarTablet\) mToolbarLayout,
                                                                contextMenuPopulatorFactory,
                                                                selectionDropdownMenuDelegate,
                                                                mTabModelSelector,
                                                                mModalDialogManagerSupplier\.get\(\),
                                                                cleanup,
                                                                /\* isWebApp= \*/ false\)\);
                        if \(mExtensionsToolbarCoordinator != null\) \{
                            mToolbar\.setExtensionsToolbarCoordinator\(mExtensionsToolbarCoordinator\);
                        \}
                    \}
                \}\n\n
      replace: |2-
                mUpdateExtensionsToolbar =
                        () ->
                                updateExtensionsToolbarCoordinator(
                                        contextMenuPopulatorFactory, selectionDropdownMenuDelegate);
                mUpdateExtensionsToolbar.run();\n\n
  - description: Release extension recreation dependencies when the toolbar is destroyed.
    regex:
      re_pattern: |2-
                mIsDestroyed = true;

                if \(mAppInstalledDelegate != null\)
      replace: |2-
                mIsDestroyed = true;
                mUpdateExtensionsToolbar = null;

                if (mAppInstalledDelegate != null)
  - description: Remove the extension toolbar through its owning task during teardown.
    regex:
      re_pattern: |2-
                if \(mExtensionsToolbarCoordinator != null\) \{
                    mExtensionsToolbarCoordinator\.destroy\(\);
                    mExtensionsToolbarCoordinator = null;
                \}\n
      replace: |2-
                ChromeAndroidTask task = mChromeAndroidTaskSupplier.get();
                if (task != null && mExtensionsToolbarFeatureKey != null) {
                    task.removeFeature(mExtensionsToolbarFeatureKey);
                }\n
  - description: Rebind extensions when the selected tab or normal/incognito model changes.
    regex:
      re_pattern: |2-
            private void refreshSelectedTab\(@Nullable Tab tab\) \{
                boolean wasIncognitoBranded
      replace: |2-
            private void refreshSelectedTab(@Nullable Tab tab) {
                if (mUpdateExtensionsToolbar != null) {
                    mUpdateExtensionsToolbar.run();
                }
                boolean wasIncognitoBranded
  - description: Recreate extension native state for the selected profile and restore its consumed ViewStub.
    regex:
      re_pattern: |2-
            public @Nullable ExtensionsToolbarCoordinator getExtensionsToolbarCoordinator\(\) \{
                return mExtensionsToolbarCoordinator;
            \}\n
      replace: |2-
            public @Nullable ExtensionsToolbarCoordinator getExtensionsToolbarCoordinator() {
                if (mUpdateExtensionsToolbar != null) {
                    mUpdateExtensionsToolbar.run();
                }
                return mExtensionsToolbarCoordinator;
            }

            private void updateExtensionsToolbarCoordinator(
                    @Nullable ContextMenuPopulatorFactory contextMenuPopulatorFactory,
                    @Nullable SelectionDropdownMenuDelegate selectionDropdownMenuDelegate) {
                if (mIsDestroyed || mTabModelSelector == null) return;
                ChromeAndroidTask task = mChromeAndroidTaskSupplier.get();
                if (task == null || task.isDestroyed()) return;

                TabModel tabModel = mTabModelSelector.getCurrentModel();
                Profile profile = tabModel.getProfile();
                Tab activeTab = mActivityTabProvider.get();
                ActivityWindowAndroid activityWindow = (ActivityWindowAndroid) mWindowAndroid;
                boolean hasBrowserWindow =
                        profile != null
                                && !profile.shutdownStarted()
                                // Tab and model suppliers notify separately during a profile switch.
                                // Wait until both agree before binding native UI to the active tab.
                                && (activeTab == null || activeTab.getProfile() == profile)
                                && task.getValidProfilesForActivity(activityWindow).contains(profile);
                ChromeAndroidTaskFeatureKey key =
                        hasBrowserWindow
                                ? new ChromeAndroidTaskFeatureKey(
                                        ExtensionsToolbarCoordinator.class,
                                        profile,
                                        activityWindow,
                                        tabModel.isIncognito() ? tabModel : null)
                                : null;
                if (key != null && key.equals(mExtensionsToolbarFeatureKey)) return;
                if (mExtensionsToolbarFeatureKey != null) {
                    task.removeFeature(mExtensionsToolbarFeatureKey);
                }
                if (key == null || profile == null) return;

                ViewStub stub = mControlContainer.findViewById(R.id.extensions_toolbar_container_stub);
                if (stub == null || !(stub.getParent() instanceof ViewGroup parent)) return;
                int index = parent.indexOfChild(stub);
                ViewGroup.LayoutParams layoutParams = stub.getLayoutParams();
                mExtensionsToolbarFeatureKey = key;
                Runnable cleanup =
                        () -> {
                            if (!key.equals(mExtensionsToolbarFeatureKey)) return;
                            mExtensionsToolbarFeatureKey = null;
                            mExtensionsToolbarCoordinator = null;
                            mToolbar.setExtensionsToolbarCoordinator(null);
                            // ViewStub.inflate() consumes the stub. Restore one for the next profile.
                            View container = parent.findViewById(R.id.extensions_toolbar_container);
                            if (container != null) {
                                parent.removeView(container);
                                ViewStub replacement = new ViewStub(stub.getContext());
                                replacement.setId(R.id.extensions_toolbar_container_stub);
                                replacement.setInflatedId(R.id.extensions_toolbar_container);
                                parent.addView(
                                        replacement, Math.min(index, parent.getChildCount()), layoutParams);
                            }
                            // The task invokes cleanup before destroying the native coordinator. Defer
                            // recreation until its BrowserWindow/Profile teardown has completed.
                            if (!mIsDestroyed) {
                                mHandler.post(
                                        () -> {
                                            if (mUpdateExtensionsToolbar != null) {
                                                mUpdateExtensionsToolbar.run();
                                            }
                                        });
                            }
                        };
                mExtensionsToolbarCoordinator =
                        (ExtensionsToolbarCoordinator)
                                task.addFeature(
                                        key,
                                        () ->
                                                ExtensionsToolbarCoordinator.maybeCreate(
                                                        mActivity,
                                                        stub,
                                                        mWindowAndroid,
                                                        task,
                                                        profile,
                                                        mActivityTabProvider.asObservable(),
                                                        mTabCreatorManager.getTabCreator(false),
                                                        getBrowsingModeThemeColorProvider(),
                                                        mToolbarLayout,
                                                        contextMenuPopulatorFactory,
                                                        selectionDropdownMenuDelegate,
                                                        mTabModelSelector,
                                                        mModalDialogManagerSupplier.get(),
                                                        cleanup,
                                                        /* isWebApp= */ false));
                if (mExtensionsToolbarCoordinator == null) {
                    mExtensionsToolbarFeatureKey = null;
                }
                mToolbar.setExtensionsToolbarCoordinator(mExtensionsToolbarCoordinator);
            }\n

# Reaper Android ordinary Omnibox caller closure after physical AI purge.
  - description: Rename actual functional ordinary session operations in all selected
      consumers and Brave override
