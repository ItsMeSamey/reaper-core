substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Physically remove AI-only observer/settings route or test hook; preserve
    ordinary native APIs
  regex:
    re_pattern: '\ \ \ \ @CalledByNative\

      \ \ \ \ private\ static\ void\ showAutofillIdentityDocsSettings\(WebContents\
      webContents\)\ \{\

      \ \ \ \ \ \ \ \ WindowAndroid\ windowAndroid\ =\ webContents\.getTopLevelNativeWindow\(\);\

      \ \ \ \ \ \ \ \ if\ \(windowAndroid\ ==\ null\)\ return;\

      \ \ \ \ \ \ \ \ showAutofillIdentityDocsSettings\(windowAndroid\.getActivity\(\)\.get\(\)\);\

      \ \ \ \ \}'
    replace: ''
- description: Physically remove AI-only observer/settings route or test hook; preserve
    ordinary native APIs
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Tries\ showing\ the\ settings\ page\ for\ Identity\ Docs\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ context\ The\ \{@link\ Context\}\ required\ to\ start\
      the\ settings\ page\.\ Noop\ without\ it\.\

      \ \ \ \ \ \*\ @return\ True\ if\ the\ context\ is\ valid\ and\ `startSettings`\
      was\ called\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ static\ boolean\ showAutofillIdentityDocsSettings\(@Nullable\
      Context\ context\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(context\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ SettingsNavigationFactory\.createSettingsNavigation\(context\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.startSettings\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ context,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillIdentityDocsFragment\.class,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ fragmentArgs=\ \*/\ null,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ addToBackStack=\ \*/\ true\);\

      \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \}'
    replace: ''
