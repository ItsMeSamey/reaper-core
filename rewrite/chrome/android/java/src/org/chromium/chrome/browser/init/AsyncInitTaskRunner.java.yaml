substitutions:
- description: Remove a dependency used only by retired remote seed fetching
  regex:
    pattern: 'import org.chromium.base.task.PostTask;

      '
    replace: ''
  count: 1
- description: Remove a dependency used only by retired remote seed fetching
  regex:
    pattern: 'import org.chromium.base.task.TaskTraits;

      '
    replace: ''
  count: 1
- description: Remove a dependency used only by retired remote seed fetching
  regex:
    pattern: 'import org.chromium.base.version_info.VersionInfo;

      '
    replace: ''
  count: 1
- description: Remove a dependency used only by retired remote seed fetching
  regex:
    pattern: 'import org.chromium.build.annotations.MonotonicNonNull;

      '
    replace: ''
  count: 1
- description: Remove a dependency used only by retired remote seed fetching
  regex:
    pattern: 'import org.chromium.chrome.browser.ChromeActivitySessionTracker;

      '
    replace: ''
  count: 1
- description: Remove a dependency used only by retired remote seed fetching
  regex:
    pattern: 'import org.chromium.components.variations.firstrun.VariationsSeedFetcher;

      '
    replace: ''
  count: 1
- description: Describe the retained native-library startup task
  regex:
    pattern: "/**\n * Runs asynchronous startup task that need to be run before the native side is started. Currently\n *\
      \ it runs two tasks: - Native library loading - Fetching the variations seed on first run\n */"
    replace: /** Loads the native library asynchronously before completing native startup. */
  count: 1
- description: Remove the retired seed-fetch task field
  regex:
    pattern: '    private @MonotonicNonNull FetchSeedTask mFetchSeedTask;


      '
    replace: ''
  count: 1
- description: Remove the seed-fetch policy, worker and channel plumbing
  regex:
    pattern: "    @VisibleForTesting\n    boolean shouldFetchVariationsSeedDuringFirstRun() {\n        return VersionInfo.isOfficialBuild();\n\
      \    }\n\n    private class FetchSeedTask implements Runnable {\n        private final String mRestrictMode;\n     \
      \   private final String mMilestone;\n        private final String mChannel;\n\n        public FetchSeedTask(String\
      \ restrictMode) {\n            mRestrictMode = restrictMode;\n            mMilestone = Integer.toString(VersionInfo.getProductMajorVersion());\n\
      \            mChannel = getChannelString();\n        }\n\n        @Override\n        public void run() {\n         \
      \   VariationsSeedFetcher.get().fetchSeed(mRestrictMode, mMilestone, mChannel);\n            PostTask.postTask(TaskTraits.UI_DEFAULT,\
      \ () -> tasksPossiblyComplete(null));\n        }\n\n        private String getChannelString() {\n            if (VersionInfo.isCanaryBuild())\
      \ {\n                return \"canary\";\n            }\n            if (VersionInfo.isDevBuild()) {\n              \
      \  return \"dev\";\n            }\n            if (VersionInfo.isBetaBuild()) {\n                return \"beta\";\n\
      \            }\n            if (VersionInfo.isStableBuild()) {\n                return \"stable\";\n            }\n\
      \            return \"\";\n        }\n    }\n\n"
    replace: ''
  count: 1
- description: Retain the public caller signature without scheduling retired network work
  regex:
    pattern: "     * @param fetchVariationSeed Whether to initialize the variations seed, if it hasn't been\n     *      \
      \                    initialized in a previous run."
    replace: '     * @param fetchVariationSeed Ignored; remote variations seed fetching is disabled.'
  count: 1
- description: Remove seed-fetch scheduling and its pending-success contribution while retaining native library completion
  regex:
    pattern: "        if (fetchVariationSeed && shouldFetchVariationsSeedDuringFirstRun()) {\n            ++mNumPendingSuccesses;\n\
      \n            // Fetching variations restrict mode requires AccountManagerFacade to be initialized.\n            ProcessInitializationHandler.getInstance().initializePreNative();\n\
      \n            ChromeActivitySessionTracker sessionTracker =\n                    ChromeActivitySessionTracker.getInstance();\n\
      \            sessionTracker.getVariationsRestrictModeValue(\n                    restrictMode -> {\n               \
      \         mFetchSeedTask = new FetchSeedTask(restrictMode);\n                        PostTask.postTask(TaskTraits.USER_BLOCKING,\
      \ mFetchSeedTask);\n                    });\n        }\n\n"
    replace: ''
  count: 1
