# Android DevTools profile ownership and phone entry.
substitutions:
- description: Register COPY_CLEAN_LINK at the end of the Action @IntDef list
  regex:
    re_pattern: (@IntDef\(\{[^}]*Action\..+?),?(\n\s*\}\))
    re_flags:
    - DOTALL
    replace: "\\1,\n            Action.COPY_CLEAN_LINK,\\2"
- description: 'Define COPY_CLEAN_LINK at the end of @interface Action


    Notice that the value for `COPY_CLEAN_LINK` is being whatever was the value for

    `NUM_ENTRIES`, which allows us to take over the end of the list.

    '
  regex:
    re_pattern: (@interface Action \{.+?;\n)(\s+)int NUM_ENTRIES = (\d+);
    re_flags:
    - DOTALL
    replace: '\1\2int COPY_CLEAN_LINK = \3;

      \2int NUM_ENTRIES = COPY_CLEAN_LINK + 1;'
- description: Append the COPY_CLEAN_LINK list item after COPY_LINK_ADDRESS
  regex:
    pattern: linkGroup.add(createListItem(Item.COPY_LINK_ADDRESS));
    replace: "linkGroup.add(createListItem(Item.COPY_LINK_ADDRESS));\n                linkGroup.add(createListItem(Item.COPY_CLEAN_LINK));"
- description: Read the Android extension build flag
  regex:
    re_pattern: import\ org\.chromium\.build\.annotations\.NullMarked;
    replace: 'import org.chromium.build.BuildConfig;

      import org.chromium.build.annotations.NullMarked;'
- description: Retain policy checks while allowing existing developer context-menu actions on phones
  regex:
    re_pattern: \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ isTabletScreen\(\);
    replace: '                && (BuildConfig.IS_DESKTOP_ANDROID || isTabletScreen());'

# Reaper Android physical AI caller closure; genuine core behavior retained.
- description: Remove complete optional link menu enablement implementation
  regex:
    re_pattern: '\ \ \ \ @VisibleForTesting\

      \ \ \ \ boolean\ shouldShowAskGeminiForLink\(\)\ \{\

      \ \ \ \ \ \ \ \ //\ Enable\ on\ desktop\ if\ side\ panel\ is\ enabled,\ and\
      enable\ on\ mobile\ if\

      \ \ \ \ \ \ \ \ //\ bottom\ sheet\ is\ enabled\.\

      \ \ \ \ \ \ \ \ return\ ChromeFeatureList\.isEnabled\(ChromeFeatureList\.CLANK_GLIC_CONTEXT_MENU\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ ChromeFeatureList\.getFieldTrialParamByFeatureAsBoolean\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.CLANK_GLIC_CONTEXT_MENU,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PARAM_SHOW_ASK_GEMINI_ON_LINK,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ true\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ \(AndroidSidePanelEnabledFn\.isEnabled\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ TabBottomSheetUtils\.isTabBottomSheetEnabled\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !DeviceInfo\.isAutomotive\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !mItemDelegate\.isIncognito\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ GlicEnabling\.isEnabledForProfile\(getProfile\(\)\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove complete optional page menu enablement implementation
  regex:
    re_pattern: '\ \ \ \ @VisibleForTesting\

      \ \ \ \ boolean\ shouldShowAskGeminiForPage\(\)\ \{\

      \ \ \ \ \ \ \ \ //\ The\ empty\-space\ \(page\)\ entry\ point\ is\ desktop\
      Android\ only,\ where\

      \ \ \ \ \ \ \ \ //\ Glic\ is\ presented\ in\ the\ side\ panel\.\

      \ \ \ \ \ \ \ \ return\ ChromeFeatureList\.isEnabled\(ChromeFeatureList\.CLANK_GLIC_CONTEXT_MENU\)\

