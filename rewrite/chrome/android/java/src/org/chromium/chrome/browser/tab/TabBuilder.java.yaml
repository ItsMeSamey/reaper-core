    replace: "            TabDelegateFactory delegateFactory,\n            Profile profile,\n            @Nullable WebContents webContents) {\n        return createDetachedSpareTab(context, delegateFactory, profile, webContents, false);\n    }\n\n    /** Adopts only the exact temporary partition created by the CCT experiment factory. */\n    public static Tab createDetachedSpareTabForSeparateStoragePartitionExperiment(\n            Context context,\n            TabDelegateFactory delegateFactory,\n            Profile profile,\n            WebContents webContents) {\n        if (!WebContentsFactory.isWebContentsForSeparateStoragePartitionExperiment(\n                profile, webContents)) {\n            throw new IllegalArgumentException(\"Invalid speculative CCT contents\");\n        }\n        return createDetachedSpareTab(context, delegateFactory, profile, webContents, true);\n    }\n\n    private static Tab createDetachedSpareTab(\n            Context context,\n            TabDelegateFactory delegateFactory,\n            Profile profile,\n            @Nullable WebContents webContents,\n            boolean separateStoragePartitionExperiment) {\n        if (sTabForTesting != null) return sTabForTesting;\n\n        if (webContents != null) {\n            String id = ContainersBridge.getContainerId(webContents);\n            boolean matchesExpectedPartition =\n                    separateStoragePartitionExperiment\n                            ? id.isEmpty()\n                                    && WebContentsFactory\n                                            .isWebContentsForSeparateStoragePartitionExperiment(\n                                                    profile, webContents)\n                            : ContainersBridge.isWebContentsInContainer(profile, webContents, id);\n            if (!matchesExpectedPartition) {\n                throw new IllegalArgumentException(\"Invalid spare-tab storage partition\");\n            }\n        }\n        WindowAndroid window = new WindowAndroid(context, /* occlusionTrackingAllowed= */ false);\n\n        // Creates a tab with renderer initialized for spareTab. See https://crbug.com/40255340.\n        TabBuilder builder = TabBuilder.createLiveTab(profile, true);\n        builder.mSeparateStoragePartitionExperiment = separateStoragePartitionExperiment;\n        Tab tab =\n                builder.setWindow(window)\n                        .setLaunchType(TabLaunchType.UNSET)\n                        .setDelegateFactory(delegateFactory)\n                        .setInitiallyHidden(true)\n"
