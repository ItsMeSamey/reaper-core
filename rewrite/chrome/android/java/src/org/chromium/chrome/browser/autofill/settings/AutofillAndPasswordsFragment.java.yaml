substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove actual AI-only preference key definition
  regex:
    re_pattern: '\ \ \ \ public\ static\ final\ String\ PREF_AUTOFILL_IDENTITY_DOCS\
      =\ "autofill_and_passwords_identity_docs";\

      '
    replace: ''
- description: Remove actual AI-only preference key definition
  regex:
    re_pattern: '\ \ \ \ public\ static\ final\ String\ PREF_AUTOFILL_TRAVEL\ =\ "autofill_and_passwords_travel";\

      '
    replace: ''
- description: Remove actual AI-only preference key definition
  regex:
    re_pattern: '\ \ \ \ public\ static\ final\ String\ PREF_AUTOFILL_SHOPPING\ =\
      "autofill_and_passwords_shopping";\

      '
    replace: ''
- description: Remove AI-only preference key
  regex:
    re_pattern: '\ \ \ \ public\ static\ final\ String\ PREF_AUTOFILL_PERSONAL_CONTEXT\
      =\

      \ \ \ \ \ \ \ \ \ \ \ \ "autofill_and_passwords_personal_context";\

      '
    replace: ''
- description: Remove concrete AI pref listener/visibility/construction; normal passwords
    listener stays
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ Preference\ personalContextPref\ =\ findPreference\(PREF_AUTOFILL_PERSONAL_CONTEXT\);\

      \ \ \ \ \ \ \ \ personalContextPref\.setVisible\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillPersonalContextFragment\.shouldShowPersonalContext\(getProfile\(\)\)\);\

      \ \ \ \ \ \ \ \ personalContextPref\.setOnPreferenceClickListener\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ preference\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ RecordUserAction\.record\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillPersonalContextFragment\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.ACTION_ENTRY_FROM_AUTOFILL_AND_PASSWORDS\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SettingsNavigationHelper\.showAutofillPersonalContextSettings\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ getActivity\(\),\ AutofillOptionsReferrer\.AUTOFILL_AND_PASSWORDS_FRAGMENT\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \

      '
    replace: ''
- description: Remove concrete AI document/travel/shopping routes; ordinary addresses/payments/options
    stay
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ Preference\ identityDocsPref\ =\ findPreference\(PREF_AUTOFILL_IDENTITY_DOCS\);\

      \ \ \ \ \ \ \ \ identityDocsPref\.setVisible\(shouldShowAutofillAiSettings\(\)\);\

      \ \ \ \ \ \ \ \ identityDocsPref\.setOnPreferenceClickListener\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ preference\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ recordCategoryLinkClick\(YourSavedInfoDataCategory\.IDENTITY_DOCS\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ SettingsNavigationHelper\.showAutofillIdentityDocsSettings\(getActivity\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \

      \ \ \ \ \ \ \ \ Preference\ travelPref\ =\ findPreference\(PREF_AUTOFILL_TRAVEL\);\

      \ \ \ \ \ \ \ \ travelPref\.setVisible\(shouldShowAutofillAiSettings\(\)\);\

      \ \ \ \ \ \ \ \ travelPref\.setOnPreferenceClickListener\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ preference\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ recordCategoryLinkClick\(YourSavedInfoDataCategory\.TRAVEL\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ SettingsNavigationHelper\.showAutofillTravelSettings\(getActivity\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \

      \ \ \ \ \ \ \ \ Preference\ shoppingPref\ =\ findPreference\(PREF_AUTOFILL_SHOPPING\);\

      \ \ \ \ \ \ \ \ shoppingPref\.setVisible\(shouldShowShopping\(\)\);\

      \ \ \ \ \ \ \ \ shoppingPref\.setOnPreferenceClickListener\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ preference\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ recordCategoryLinkClick\(YourSavedInfoDataCategory\.SHOPPING\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ SettingsNavigationHelper\.showAutofillShoppingSettings\(getActivity\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \

      '
    replace: ''
- description: Physically remove AI-only observer/settings route or test hook; preserve
    ordinary native APIs
  regex:
    re_pattern: '\ \ \ \ private\ static\ boolean\ shouldShowAutofillAiSettings\(\)\
      \{\

      \ \ \ \ \ \ \ \ return\ ChromeFeatureList\.isEnabled\(YOUR_SAVED_INFO_SETTINGS_PAGE_ANDROID\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ ChromeFeatureList\.isEnabled\(ChromeFeatureList\.AUTOFILL_AI_WITH_DATA_SCHEMA\);\

      \ \ \ \ \}'
    replace: ''
- description: Physically remove AI-only observer/settings route or test hook; preserve
    ordinary native APIs
  regex:
    re_pattern: '\ \ \ \ private\ static\ boolean\ shouldShowShopping\(\)\ \{\

      \ \ \ \ \ \ \ \ return\ shouldShowAutofillAiSettings\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ \(ChromeFeatureList\.isEnabled\(ChromeFeatureList\.AUTOFILL_AMBIENT_AUTOFILL\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ ChromeFeatureList\.isEnabled\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.AUTOFILL_AI_WALLET_SHOPPING\)\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove AI-only search entries because their actual XML/preferences/providers
    are omitted, retain normal settings index logic
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!shouldShowAutofillAiSettings\(\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ indexData\.removeEntry\(getUniqueId\(PREF_AUTOFILL_IDENTITY_DOCS\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ indexData\.removeEntry\(getUniqueId\(PREF_AUTOFILL_TRAVEL\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!shouldShowShopping\(\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ indexData\.removeEntry\(getUniqueId\(PREF_AUTOFILL_SHOPPING\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!AutofillPersonalContextFragment\.shouldShowPersonalContext\(profile\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ indexData\.removeEntry\(getUniqueId\(PREF_AUTOFILL_PERSONAL_CONTEXT\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}'
    replace: ''
- description: Remove obsolete AI-only comment; keep real ordinary options title update
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ \ \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/440022435\):\ Remove\ the\ title\
      update\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ \ \ \ \ //\ once\ Autofill\ AI\ is\ launched\.\

      '
    replace: ''
- description: Remove now-unused actual AI import
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.autofill\.settings\.personal_context\.AutofillPersonalContextFragment;\

      '
    replace: ''
- description: Remove now-unused actual AI import
  regex:
    re_pattern: 'import\ org\.chromium\.base\.metrics\.RecordUserAction;\

      '
    replace: ''
- description: Remove settings-index cleanup for preferences already excluded from this fragment
  regex:
    pattern: "                        indexData.removeEntry(getUniqueId(PREF_AUTOFILL_IDENTITY_DOCS));\n                 \
      \       indexData.removeEntry(getUniqueId(PREF_AUTOFILL_TRAVEL));\n                        indexData.removeEntry(getUniqueId(PREF_AUTOFILL_SHOPPING));\n\
      \                        indexData.removeEntry(getUniqueId(PREF_AUTOFILL_PERSONAL_CONTEXT));\n"
    replace: ''
  count: 1
