substitutions:
- description: Use the platform exit-reason query for ordinary local crash recovery
  regex:
    pattern: 'import android.content.SharedPreferences;

      '
    replace: 'import android.app.ActivityManager;

      import android.app.ApplicationExitInfo;

      import android.content.Context;

      import android.content.SharedPreferences;

      '
  count: 1
- description: Admit the existing Android R exit-query contract and application context
  regex:
    pattern: 'import org.chromium.base.shared_preferences.SharedPreferencesManager;

      '
    replace: 'import androidx.annotation.RequiresApi;


      import org.chromium.base.ContextUtils;

      import org.chromium.base.shared_preferences.SharedPreferencesManager;

      '
  count: 1
- description: Remove the retired UMA helper import
  regex:
    pattern: 'import org.chromium.components.crash.browser.ProcessExitReasonFromSystem;

      '
    replace: '

      import java.util.List;

      '
  count: 1
- description: Describe retained local recovery ownership
  regex:
    pattern: /** Records the SystemExitReason for the Browser process. */
    replace: /** Preserves browser process exit information for local crash recovery. */
  count: 1
- description: Remove only the optional exit-reason histogram recording
  regex:
    pattern: "            int reason = prefs.readInt(ChromePreferenceKeys.LAST_SESSION_BROWSER_EXIT_REASON);\n           \
      \ ProcessExitReasonFromSystem.recordAsEnumHistogram(\n                    \"Stability.Android.SystemExitReason.Browser2\"\
      , reason);\n"
    replace: ''
  count: 1
- description: Keep actual OS exit reasons for ordinary crash recovery without the retired measurement class
  regex:
    pattern: '            int reason = ProcessExitReasonFromSystem.getExitReason(previousPid);'
    replace: '            int reason = getExitReason(previousPid);'
  count: 1
- description: Keep the background-to-foreground recovery contract explicit
  regex:
    pattern: "            // If this is a background launch eg. JobScheduler, we may not load native and persist\n       \
      \     // histograms. Store the histrogram value to shared prefs to record it on next\n            // foreground launch."
    replace: "            // Preserve the exit reason across a background-only launch so the next foreground\n           \
      \ // launch can evaluate local crash recovery."
  count: 1
- description: Retain the pure Android exit-query body and its empty/mismatched-PID result semantics
  regex:
    pattern: '

      }

      '
    replace: "\n    @RequiresApi(Build.VERSION_CODES.R)\n    private static int getExitReason(int pid) {\n        ActivityManager\
      \ am =\n                (ActivityManager)\n                        ContextUtils.getApplicationContext()\n          \
      \                      .getSystemService(Context.ACTIVITY_SERVICE);\n        // Request only the most recent record\
      \ for the previous browser process.\n        List<ApplicationExitInfo> reasons =\n                am.getHistoricalProcessExitReasons(/*\
      \ package_name= */ null, pid, /* maxNum= */ 1);\n        if (reasons.isEmpty() || reasons.get(0) == null || reasons.get(0).getPid()\
      \ != pid) {\n            return -1;\n        }\n        return reasons.get(0).getReason();\n    }\n}\n"
  count: 1
