substitutions:
- description: Carry the exact requesting frame to consent registration.
  regex:
    pattern: import org.chromium.content_public.browser.WebContents;
    replace: 'import org.chromium.content_public.browser.WebContents;

      import org.chromium.content_public.browser.RenderFrameHost;'
- description: Pass only explicitly authorized source types to the Android chooser.
  regex:
    pattern: '    public static class Params {'
    replace: "    public static class Params {\n        // Native-authorized mask: 1 = tab, 2 = whole screen. Zero fails closed.\n        public int allowedSourceTypes;\n        public int captureId;\n        public @Nullable RenderFrameHost requestFrame;\n        public @Nullable WindowAndroid parentWindow;"
- description: Use the authorized parent window for extension pages without their own window.
  regex:
    pattern: final Context context = maybeGetContext(params.webContents);
    replace: "final Context context = params.parentWindow != null\n                ? params.parentWindow.getContext().get() : maybeGetContext(params.webContents);"
- description: Return a lifecycle handle so native cancellation dismisses the chooser.
  regex:
    pattern: public static void showDialog(Params params, Delegate delegate)
    replace: public static Runnable showDialog(Params params, Delegate delegate)
- description: Preserve cancellation on missing context with a harmless dismissal handle.
  regex:
    pattern: "            delegate.onCancel();\n            return;\n        }\n        MediaCapturePickerInvoker.show(context, params, delegate);"
    replace: "            delegate.onCancel();\n            return () -> {};\n        }\n        return MediaCapturePickerInvoker.show(context, params, delegate);"
