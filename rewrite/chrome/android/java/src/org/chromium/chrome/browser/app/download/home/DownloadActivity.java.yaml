substitutions:
- description: Android Downloads exact-item reveal integration (1).
  regex:
    re_pattern: '\ \ \ \ private\ static\ final\ String\ BUNDLE_KEY_CURRENT_URL\ =\ "current_url";\

      \

      \ \ \ \ private\ @Nullable\ DownloadManagerCoordinator\ mDownloadCoordinator;\

      \ \ \ \ private\ @Nullable\ AndroidPermissionDelegate\ mPermissionDelegate;\

      \ \ \ \ private\ @Nullable\ ModalDialogManager\ mModalDialogManager;\

      \

      '
    replace: "    private static final String BUNDLE_KEY_CURRENT_URL = \"current_url\";\n\n    private @Nullable DownloadManagerCoordinator mDownloadCoordinator;\n    private boolean mResumed;\n    private boolean mItemRevealStarted;\n    private @Nullable AndroidPermissionDelegate mPermissionDelegate;\n    private @Nullable ModalDialogManager mModalDialogManager;\n\n"
- description: Android Downloads exact-item reveal integration (2).
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ protected\ void\ onProfileAvailable\(Profile\ profile\)\ \{\

      \ \ \ \ \ \ \ \ super\.onProfileAvailable\(profile\);\

      \

      \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/40254448\):\ Update\ DownloadActivity\ to\ use\ ProfileIntentUtils\ instead\ of\

      \ \ \ \ \ \ \ \ //\ the\ existing\ custom\ profile\ passing\ logic\.\

      '
    replace: "    @Override\n    protected void onProfileAvailable(Profile profile) {\n        super.onProfileAvailable(profile);\n\n        if (DownloadActivityLauncher.isDownloadItemIntent(getIntent())\n                && !DownloadActivityLauncher.getInstance().prepareDownloadItemActivity(this)) {\n            finish();\n            return;\n        }\n\n        // TODO(crbug.com/40254448): Update DownloadActivity to use ProfileIntentUtils instead of\n        // the existing custom profile passing logic.\n"
- description: Android Downloads exact-item reveal integration (3).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mDownloadCoordinator\.addObserver\(mUiObserver\);\

      \ \ \ \ \ \ \ \ BackPressHelper\.create\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ this,\ getOnBackPressedDispatcher\(\),\ mDownloadCoordinator\.getBackPressHandlers\(\)\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Override\

      '
    replace: "        mDownloadCoordinator.addObserver(mUiObserver);\n        BackPressHelper.create(\n                this, getOnBackPressedDispatcher(), mDownloadCoordinator.getBackPressHandlers());\n        maybeRevealDownloadItem();\n    }\n\n    @Override\n    protected void onResume() {\n        super.onResume();\n        mResumed = true;\n        maybeRevealDownloadItem();\n    }\n\n    @Override\n    protected void onPause() {\n        mResumed = false;\n        if (DownloadActivityLauncher.isDownloadItemIntent(getIntent())) {\n            DownloadActivityLauncher.getInstance().onDownloadItemActivityClosed(this);\n        }\n        super.onPause();\n    }\n\n    private void maybeRevealDownloadItem() {\n        if (!mResumed\n                || mItemRevealStarted\n                || mDownloadCoordinator == null\n                || !DownloadActivityLauncher.isDownloadItemIntent(getIntent())) {\n            return;\n        }\n        mItemRevealStarted = true;\n        DownloadActivityLauncher.getInstance().revealDownloadItem(this, mDownloadCoordinator);\n    }\n\n    @Override\n"
- description: Android Downloads exact-item reveal integration (4).
  regex:
    re_pattern: '\

      \ \ \ \ @Override\

      \ \ \ \ protected\ void\ onDestroy\(\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(mDownloadCoordinator\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mDownloadCoordinator\.removeObserver\(mUiObserver\);\

      \ \ \ \ \ \ \ \ \ \ \ \ mDownloadCoordinator\.destroy\(\);\

      '
    replace: "\n    @Override\n    protected void onDestroy() {\n        if (DownloadActivityLauncher.isDownloadItemIntent(getIntent())) {\n            DownloadActivityLauncher.getInstance().onDownloadItemActivityClosed(this);\n        }\n        if (mDownloadCoordinator != null) {\n            mDownloadCoordinator.removeObserver(mUiObserver);\n            mDownloadCoordinator.destroy();\n"
