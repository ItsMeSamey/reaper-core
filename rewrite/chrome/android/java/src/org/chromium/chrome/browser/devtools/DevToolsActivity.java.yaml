# Android DevTools profile ownership and phone entry.
substitutions:
- description: Use the existing same-process contents and exact-profile supplier contracts
  regex:
    re_pattern: import\ org\.chromium\.base\.ContextUtils;
    replace: 'import org.chromium.base.ContextUtils;

      import org.chromium.base.IntentUtils;

      import org.chromium.base.library_loader.LibraryLoader;

      import org.chromium.base.supplier.OneshotSupplier;

      import org.chromium.base.supplier.OneshotSupplierImpl;'
- description: Keep the custom-tab session mode consistent with the real frontend
  regex:
    re_pattern: import\ org\.chromium\.chrome\.browser\.app\.metrics\.LaunchCauseMetrics;
    replace: 'import org.chromium.chrome.browser.app.metrics.LaunchCauseMetrics;

      import org.chromium.chrome.browser.flags.CustomTabProfileType;'
- description: Provide the existing frontend profile without creating another OTR context
  regex:
    re_pattern: import\ org\.chromium\.chrome\.browser\.profiles\.Profile;
    replace: 'import org.chromium.chrome.browser.profiles.Profile;

      import org.chromium.chrome.browser.profiles.ProfileProvider;

      import org.chromium.chrome.browser.lifecycle.DestroyObserver;'
- description: Reject stale launches and retain the actual frontend profile in both tab models
  regex:
    re_pattern: '\ \ \ \ @CalledByNative\

      \ \ \ \ /\*\*\ Launches\ the\ DevTools\ activity'
    replace: "    private @Nullable WebContents mFrontendContents;\n    private @Nullable Profile mFrontendProfile;\n\n    @Override\n    protected boolean isStartedUpCorrectly(Intent intent) {\n        // A native-owned frontend can only survive within this browser process.\n        // Do not recreate an incognito profile for an obsolete activity intent.\n        if (!super.isStartedUpCorrectly(intent)\n                || !LibraryLoader.getInstance().isInitialized()) {\n            return false;\n        }\n        intent.setExtrasClassLoader(WebContents.class.getClassLoader());\n        WebContents contents = IntentUtils.safeGetParcelableExtra(intent, WEB_CONTENTS_KEY);\n        if (contents == null || contents.isDestroyed()) return false;\n        Profile profile = Profile.fromWebContents(contents);\n        if (profile == null || profile.shutdownStarted()) return false;\n        mFrontendContents = contents;\n        mFrontendProfile = profile;\n        return true;\n    }\n\n    @Override\n    protected OneshotSupplier<ProfileProvider> createProfileProvider() {\n        Profile frontendProfile = assumeNonNull(mFrontendProfile);\n        getLifecycleDispatcher().register((DestroyObserver) this::releaseUnattachedFrontend);\n        OneshotSupplierImpl<ProfileProvider> supplier = new OneshotSupplierImpl<>();\n        supplier.set(\n                new ProfileProvider() {\n                    @Override\n                    public Profile getOriginalProfile() {\n                        return frontendProfile.getOriginalProfile();\n                    }\n\n                    @Override\n                    public @Nullable Profile getOffTheRecordProfile(boolean createIfNeeded) {\n                        // The frontend already owns the exact primary or DevTools OTR profile.\n                        // Creating a CCT-specific profile would change extension isolation.\n                        if (!frontendProfile.isOffTheRecord()) {\n                            assert !createIfNeeded;\n                            return null;\n                        }\n                        return frontendProfile.shutdownStarted() ? null : frontendProfile;\n                    }\n                });\n        return supplier;\n    }\n\n    @CalledByNative\n    /** Launches the DevTools activity"
- description: Select custom-tab privacy behavior using the actual frontend profile
  regex:
    re_pattern: \ \ \ \ \ \ \ \ return\ new\ DevToolsIntentDataProvider\(intent\);
    replace: "        Profile profile = mFrontendProfile;\n        if (profile == null || profile.shutdownStarted()) return null;\n        int profileType =\n                !profile.isOffTheRecord()\n                        ? CustomTabProfileType.REGULAR\n                        : (profile.isIncognitoBranded()\n                                ? CustomTabProfileType.INCOGNITO\n                                : CustomTabProfileType.EPHEMERAL);\n        return new DevToolsIntentDataProvider(intent, profileType);"
- description: Attach only to the exact profile model and dispose failed launches without a second profile
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ TabModel\ tabModel\ =\ getTabModelSelector\(\)\.getModel\(false\);\

      \ \ \ \ \ \ \ \ Tab\ existingTab\ =\ assumeNonNull\(tabModel\.getCurrentTabSupplier\(\)\.get\(\)\);\

      \

      \ \ \ \ \ \ \ \ //\ Attach\ the\ given\ DevTools\ frontend\ web\ contents\ to\ the\ browser\ window\.\

      \ \ \ \ \ \ \ \ Intent\ intent\ =\ getIntent\(\);\

      \ \ \ \ \ \ \ \ intent\.setExtrasClassLoader\(WebContents\.class\.getClassLoader\(\)\);\

      \ \ \ \ \ \ \ \ WebContents\ webContents\ =\ intent\.getParcelableExtra\(WEB_CONTENTS_KEY\);\

      \ \ \ \ \ \ \ \ ChromeAndroidTask\ task\ =\ getChromeAndroidTaskSupplier\(\)\.get\(\);\

      \ \ \ \ \ \ \ \ Profile\ profile\ =\ tabModel\.getProfile\(\);\

      \ \ \ \ \ \ \ \ //\ NOTE:\ If\ this\ condition\ is\ not\ met,\ this\ activity\ brifly\ shows\ up,\ but\ quickly\ disappears\

      \ \ \ \ \ \ \ \ //\ because\ there\ is\ no\ tab\ in\ the\ tab\ model\ after\ the\ closerTabs\(\)\ call\ below\.\

      \ \ \ \ \ \ \ \ if\ \(webContents\ !=\ null\ \&\&\ task\ !=\ null\ \&\&\ profile\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ DevToolsWindowAndroid\.attachToBrowser\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ webContents,\ task\.getOrCreateNativeBrowserWindowPtr\(profile\)\);\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ //\ Remove\ the\ existing\ blank\ page\ tab\.\

      \ \ \ \ \ \ \ \ tabModel\.getTabRemover\(\)\.closeTabs\(TabClosureParams\.closeTab\(existingTab\)\.build\(\),\ false\);'
    replace: "        WebContents contents = mFrontendContents;\n        Profile profile = mFrontendProfile;\n        ChromeAndroidTask task = getChromeAndroidTaskSupplier().get();\n        if (contents == null\n                || contents.isDestroyed()\n                || profile == null\n                || profile.shutdownStarted()\n                || task == null) {\n            closeUnattachedFrontend();\n            return;\n        }\n\n        TabModel tabModel = getTabModelSelector().getModel(profile.isOffTheRecord());\n        if (tabModel.getProfile() != profile) {\n            closeUnattachedFrontend();\n            return;\n        }\n        Tab placeholder = tabModel.getCurrentTabSupplier().get();\n        getTabModelSelector().selectModel(profile.isOffTheRecord());\n        if (contents.isDestroyed() || profile.shutdownStarted()) {\n            closeUnattachedFrontend();\n            return;\n        }\n        if (!DevToolsWindowAndroid.attachToBrowser(\n                contents, task.getOrCreateNativeBrowserWindowPtr(profile))) {\n            closeUnattachedFrontend();\n            return;\n        }\n        mFrontendContents = null; // The selected tab model now owns it.\n        if (placeholder != null && !placeholder.isDestroyed()) {\n            tabModel.getTabRemover()\n                    .closeTabs(TabClosureParams.closeTab(placeholder).allowUndo(false).build(), false);\n        }\n    }\n\n    private void closeUnattachedFrontend() {\n        releaseUnattachedFrontend();\n        finish();\n    }\n\n    private void releaseUnattachedFrontend() {\n        WebContents contents = mFrontendContents;\n        mFrontendContents = null;\n        if (contents != null && !contents.isDestroyed()) {\n            DevToolsWindowAndroid.closeDevTools(contents);\n        }"
