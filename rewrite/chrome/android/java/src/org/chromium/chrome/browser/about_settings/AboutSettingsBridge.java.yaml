# Android About displays the installed manifest version without changing version metadata.
substitutions:
- description: Read installed APK version for the Android About display
  regex:
    pattern: "// Copyright 2019 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\npackage org.chromium.chrome.browser.about_settings;\n\n\nimport org.jni_zero.JniType;\nimport org.jni_zero.NativeMethods;\n\nimport org.chromium.build.annotations.NullMarked;\n\n/** Bridge providing access to native data about Chrome application and OS. */\n@NullMarked\npublic class AboutSettingsBridge {\n    /**\n     * @return Chrome application name and version number.\n     */\n    public static String getApplicationVersion() {\n        return AboutSettingsBridgeJni.get().getApplicationVersion();\n    }\n\n    /**\n     * @return Android OS version.\n     */\n    public static String getOSVersion() {\n        return AboutSettingsBridgeJni.get().getOSVersion();\n    }\n\n    @NativeMethods\n    interface Natives {\n        @JniType(\"std::string\")\n        String getApplicationVersion();\n\n        @JniType(\"std::string\")\n        String getOSVersion();\n    }\n}\n"
    replace: "// Copyright 2019 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\npackage org.chromium.chrome.browser.about_settings;\n\n\nimport android.content.pm.PackageInfo;\n\nimport org.jni_zero.CalledByNative;\nimport org.jni_zero.JniType;\nimport org.jni_zero.NativeMethods;\n\nimport org.chromium.base.ContextUtils;\nimport org.chromium.base.PackageUtils;\nimport org.chromium.build.annotations.NullMarked;\n\n/** Bridge providing access to native data about Chrome application and OS. */\n@NullMarked\npublic class AboutSettingsBridge {\n    /**\n     * @return Chrome application name and version number.\n     */\n    public static String getApplicationVersion() {\n        return AboutSettingsBridgeJni.get().getApplicationVersion();\n    }\n\n    /**\n     * @return Android OS version.\n     */\n    public static String getOSVersion() {\n        return AboutSettingsBridgeJni.get().getOSVersion();\n    }\n\n    // The About page must describe the installed APK, not the compiled browser version.\n    @CalledByNative\n    private static @JniType(\"std::string\") String getInstalledApplicationVersion() {\n        PackageInfo info =\n                PackageUtils.getPackageInfo(\n                        ContextUtils.getApplicationContext().getPackageName(), 0);\n        return info == null || info.versionName == null ? \"\" : info.versionName;\n    }\n\n    @NativeMethods\n    interface Natives {\n        @JniType(\"std::string\")\n        String getApplicationVersion();\n\n        @JniType(\"std::string\")\n        String getOSVersion();\n    }\n}\n"
  count: 1
