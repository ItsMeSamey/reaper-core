substitutions:
- description: Android PDF dialog callback teardown guard and regression coverage (1).
  regex:
    re_pattern: '\ \ \ \ \ \*/\

      \ \ \ \ @CalledByNative\

      \ \ \ \ public\ void\ showDialog\(Profile\ profile,\ @JniType\("std::string"\)\ String\ guid\)\ \{\

      \ \ \ \ \ \ \ \ List<ResolveInfo>\ result\ =\ MimeUtils\.getPdfIntentHandlers\(\);\

      \ \ \ \ \ \ \ \ if\ \(result\.isEmpty\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ onCancel\(guid\);\

      '
    replace: "     */\n    @CalledByNative\n    public void showDialog(Profile profile, @JniType(\"std::string\") String guid) {\n        if (mNativeOpenDownloadDialogBridge == 0) return;\n        List<ResolveInfo> result = MimeUtils.getPdfIntentHandlers();\n        if (result.isEmpty()) {\n            onCancel(guid);\n"
- description: Android PDF dialog callback teardown guard and regression coverage (2).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ DownloadActivityLauncher\.getInstance\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.getActivityForOpenDialog\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(activity\)\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(activity\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ onCancel\(guid\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

      '
    replace: "        DownloadActivityLauncher.getInstance()\n                .getActivityForOpenDialog(\n                        (activity) -> {\n                            if (mNativeOpenDownloadDialogBridge == 0) return;\n                            if (activity == null) {\n                                onCancel(guid);\n                                return;\n"
- description: Android PDF dialog callback teardown guard and regression coverage (3).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ UserPrefs\.get\(profile\)\.getBoolean\(Pref\.AUTO_OPEN_PDF_ENABLED\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ appName,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(result\)\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(result\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ==\ OpenDownloadDialogEvent\.OPEN_DOWNLOAD_DIALOG_ALWAYS_OPEN\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ UserPrefs\.get\(profile\)\.setBoolean\(Pref\.AUTO_OPEN_PDF_ENABLED,\ true\);\

      '
    replace: "                        UserPrefs.get(profile).getBoolean(Pref.AUTO_OPEN_PDF_ENABLED),\n                        appName,\n                        (result) -> {\n                            if (mNativeOpenDownloadDialogBridge == 0) return;\n                            if (result\n                                    == OpenDownloadDialogEvent.OPEN_DOWNLOAD_DIALOG_ALWAYS_OPEN) {\n                                UserPrefs.get(profile).setBoolean(Pref.AUTO_OPEN_PDF_ENABLED, true);\n"
