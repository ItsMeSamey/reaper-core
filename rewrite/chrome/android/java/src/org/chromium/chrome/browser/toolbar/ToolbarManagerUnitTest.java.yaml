substitutions:
- description: Remove the unused merchant supplier from existing ordinary fixture setup
  regex:
    pattern: "        SettableMonotonicObservableSupplier<MerchantTrustSignalsCoordinator>\n                merchantTrustSignalsCoordinatorSupplier\
      \ = ObservableSuppliers.createMonotonic();\n"
    replace: ''
  count: 1
- description: Adapt only the retired toolbar constructor argument
  regex:
    pattern: '                        merchantTrustSignalsCoordinatorSupplier,

      '
    replace: ''
  count: 1
- description: Remove only the now-unused MerchantTrustSignalsCoordinator import
  regex:
    pattern: 'import org.chromium.chrome.browser.merchant_viewer.MerchantTrustSignalsCoordinator;

      '
    replace: ''
  count: 1
