substitutions:
- description: Remove retired price test-only setup helper
  regex:
    pattern: "    /**\n     * Price tracking has a TabHelper that registers and expects native flags to exist. This is not\n\
      \     * present in C++ unit tests so just disable the feature.\n     */\n    private static void disablePriceTracking()\
      \ {\n        PriceTrackingFeatures.setIsSignedInAndSyncEnabledForTesting(\n                /* isSignedInAndSyncEnabled=\
      \ */ false);\n        PriceTrackingFeatures.setPriceAnnotationsEnabledForTesting(/* enabled= */ false);\n    }\n\n"
    replace: ''
  count: 1
- description: Remove obsolete price setup call
  regex:
    pattern: '        disablePriceTracking();


      '
    replace: ''
  count: 1
- description: Remove exclusive PriceTrackingFeatures import
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceTrackingFeatures;

      '
    replace: ''
  count: 1
