        \ getBrowserFullscreenModeSupplier() {\n        return mBrowserModeSupplier;\n    }\n\n    @Override\n    public NonNullObservableSupplier<Boolean>\
        \ getFullscreenUiModeSupplier() {\n        return mFullscreenUiModeSupplier;\n    }\n\n    private void updateFullscreenUiMode()\
        \ {\n        mFullscreenUiModeSupplier.set(getBrowserFullscreenMode() || getPersistentFullscreenMode());\n    }\n\n\
