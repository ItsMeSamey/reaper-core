        \       return getBrowserFullscreenMode() ? browserFullscreenOptions() : tabOptions;\n    }\n\n    private void applyBrowserFullscreenSystemBars()\
        \ {\n        if (mDestroyed || !getBrowserFullscreenMode() || mActivity.isFinishing()) return;\n        hideSystemBars(mActivity.getWindow().getDecorView(),\
        \ browserFullscreenOptions());\n    }\n\n    @Override\n    public void onBrowserFullscreenInsetsChanged() {\n     \
        \   if (mDestroyed || !getBrowserFullscreenMode()) return;\n        mHandler.removeCallbacks(mReapplyBrowserFullscreen);\n\
