        \        if (mDestroyed || getBrowserFullscreenMode() != fullscreen) return;\n        if (!fullscreen) setBrowserFullscreenExtensionInfo(\"\
        \", \"\");\n        if (fullscreen) {\n            requestBrowserActivityFullscreen();\n        } else if (mBrowserActivityFullscreenToBeExited)\
        \ {\n            mBrowserActivityFullscreenToBeExited = false;\n            if (getPersistentFullscreenMode()) {\n \
        \               // The remaining tab session now owns the expansion of this Activity.\n                mDisplayEdgeToEdgeFullscreenToBeExited\
        \ = true;\n            } else {\n                maybeExitActivityFullscreenMode(null);\n            }\n        }\n\
        \    }\n\n    private void requestBrowserActivityFullscreen() {\n        if (Build.VERSION.SDK_INT < Build.VERSION_CODES.UPSIDE_DOWN_CAKE\n\
        \                || !mActivity.isInMultiWindowMode()\n                || mActivity.isInPictureInPictureMode()) return;\n\
        \        requestActivityFullscreenForOwners();\n    }\n\n    private void requestActivityFullscreenForOwners() {\n \
        \       if (mActivityFullscreenRequestPending\n                || mBrowserActivityFullscreenToBeExited\n           \
        \     || mDisplayEdgeToEdgeFullscreenToBeExited) return;\n        mActivityFullscreenRequestPending = true;\n      \
        \  maybeEnterActivityFullscreenMode(\n                new OutcomeReceiver<>() {\n                    @Override\n   \
        \                 public void onResult(@Nullable Void unused) {\n                        mActivityFullscreenRequestPending\
        \ = false;\n                        if (mDestroyed || mActivity.isFinishing()) return;\n                        if (getBrowserFullscreenMode())\
        \ {\n                            mBrowserActivityFullscreenToBeExited = true;\n                        } else if (mTabActivityFullscreenRequested)\
        \ {\n                            mDisplayEdgeToEdgeFullscreenToBeExited = true;\n                        } else {\n\
        \                            // The ordinary request completed after both fullscreen owners exited.\n              \
        \              maybeExitActivityFullscreenMode(null);\n                        }\n                    }\n\n        \
        \            @Override\n                    public void onError(Throwable error) {\n                        mActivityFullscreenRequestPending\
        \ = false;\n                        // Android can refuse window expansion (for example, in split screen).\n       \
        \                 // Existing immersive bars/controls remain scoped to this Activity.\n                    }\n     \
        \           });\n    }\n\n    @Override\n    public void setBrowserFullscreenExtensionInfo(String extensionUrl, String\
