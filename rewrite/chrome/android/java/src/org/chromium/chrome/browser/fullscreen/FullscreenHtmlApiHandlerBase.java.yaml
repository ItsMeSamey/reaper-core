        \       if (previous.getUrl().equals(extensionUrl) && previous.getName().equals(extensionName))\n            return;\n\
        \        mBrowserExtensionInfoSupplier.set(\n                new BrowserFullscreenExtensionInfo(extensionUrl, extensionName));\n\
        \    }\n\n    @Override\n    public NonNullObservableSupplier<BrowserFullscreenExtensionInfo>\n            getBrowserFullscreenExtensionInfoSupplier()\
