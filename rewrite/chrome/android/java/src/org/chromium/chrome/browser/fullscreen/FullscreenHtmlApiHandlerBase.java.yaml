        \        if (enterFullscreen != null) enterFullscreen.run();\n    }\n\n    @Override\n    public void setBrowserFullscreenMode(boolean\
        \ fullscreen) {\n        if (mDestroyed || (fullscreen && mActivity.isFinishing())) return;\n        if (getBrowserFullscreenMode()\
