substitutions:
- description: Remove excluded Actor service imports from the tab-removal fixture.
  regex:
    pattern: 'import org.chromium.chrome.browser.actor.ActorKeyedService;

      import org.chromium.chrome.browser.actor.ActorKeyedServiceFactory;

      '
    replace: ''
  count: 1
- description: Remove the excluded Actor service mock.
  regex:
    pattern: '    @Mock private ActorKeyedService mActorKeyedService;

      '
    replace: ''
  count: 1
- description: Remove installation of the excluded Actor mock.
  regex:
    pattern: '        ActorKeyedServiceFactory.setForTesting(mActorKeyedService);

      '
    replace: ''
  count: 1
- description: Remove the testCloseTabsHandler_getOngoingActorTasks case for the excluded Actor feature.
  regex:
    pattern: "    @Test\n    public void testCloseTabsHandler_getOngoingActorTasks() {\n        Tab tab0 = mTabModel.addTab(/*\
      \ id= */ 0);\n        TabClosureParams params = TabClosureParams.closeTab(tab0).build();\n\n        mTabRemoverImpl.closeTabs(params,\
      \ /* allowDialog= */ false, mListener);\n        verify(mTabModelRemover).doTabRemovalFlow(mHandlerCaptor.capture(),\
      \ eq(false));\n        TabModelRemoverFlowHandler handler = mHandlerCaptor.getValue();\n\n        when(mActorKeyedService.getActiveTaskIdOnTab(0,\
      \ true)).thenReturn(123);\n\n        List<Integer> taskIds = handler.getOngoingActorTasks();\n        assertEquals(1,\
      \ taskIds.size());\n        assertEquals(Integer.valueOf(123), taskIds.get(0));\n    }\n\n"
    replace: ''
  count: 1
- description: Remove the testCloseTabs_ActorTaskDeletion case for the excluded Actor feature.
  regex:
    pattern: "    @Test\n    public void testCloseTabs_ActorTaskDeletion() {\n        // Use a real TabModelRemover to test\
      \ the full flow, but mock the ActionConfirmationManager.\n        TabModelRemover realRemover =\n                spy(\n\
      \                        new TabModelRemover(\n                                RuntimeEnvironment.application,\n   \
      \                             mModalDialogManager,\n                                () -> mTabModel));\n        when(realRemover.getActionConfirmationManager()).thenReturn(mActionConfirmationManager);\n\
      \        TabRemoverImpl realTabRemoverImpl = new TabRemoverImpl(realRemover);\n\n        Tab tab0 = mTabModel.addTab(/*\
      \ id= */ 0);\n        TabClosureParams params = TabClosureParams.closeTab(tab0).build();\n\n        // Setup ongoing\
      \ task.\n        when(mActorKeyedService.getActiveTaskIdOnTab(0, true)).thenReturn(123);\n\n        realTabRemoverImpl.closeTabs(params,\
      \ /* allowDialog= */ true, mListener);\n\n        // Capture the callback passed to ActionConfirmationManager.\n   \
      \     verify(mActionConfirmationManager)\n                .processActorTaskDeletionAttempt(mOnResultCaptor.capture());\n\
      \n        // Confirm the dialog.\n        mOnResultCaptor.getValue().onResult(ActionConfirmationResult.CONFIRMATION_POSITIVE);\n\
      \n        // Verify task is stopped.\n        verify(mActorKeyedService).stopTask(123, StoppedReason.STOPPED_BY_USER);\n\
      \n        // Verify the action is performed.\n        verify(mTabModel).closeTabs(any(TabClosureParams.class));\n  \
      \  }\n\n"
    replace: ''
  count: 1
- description: Remove the Actor stop-reason import.
  regex:
    pattern: 'import org.chromium.chrome.browser.actor.StoppedReason;

      '
    replace: ''
  count: 1
- description: Remove the runtime environment import used only by the removed Actor integration case.
  regex:
    pattern: 'import org.robolectric.RuntimeEnvironment;

      '
    replace: ''
  count: 1
- description: Remove the dialog-manager import used only by the removed Actor integration case.
  regex:
    pattern: 'import org.chromium.ui.modaldialog.ModalDialogManager;

      '
    replace: ''
  count: 1
- description: Remove the dialog-manager mock used only by the removed Actor integration case.
  regex:
    pattern: '    @Mock private ModalDialogManager mModalDialogManager;

      '
    replace: ''
  count: 1
