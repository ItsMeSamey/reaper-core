substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove exclusively AI button paint/height/offset fields while keeping
    tab/group title paints
  regex:
    re_pattern: '\ \ \ \ private\ final\ TextPaint\ mButtonTextPaint;\

      \ \ \ \ private\ final\ int\ mButtonTextHeight;\

      \ \ \ \ private\ final\ float\ mButtonTextYOffset;\

      \

      '
    replace: ''
- description: Remove AI button font metrics/styles and Glic dimension lookup; preserve
    ordinary title and favicon layout
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ Button\ text\ properties\.\

      \ \ \ \ \ \ \ \ mButtonTextPaint\ =\ new\ TextPaint\(Paint\.ANTI_ALIAS_FLAG\);\

      \ \ \ \ \ \ \ \ if\ \(mIncognito\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mButtonTextPaint\.setColor\(incognitoTextColor\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ StyleUtils\.applyTextAppearanceToTextPaint\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ context,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mButtonTextPaint,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.style\.TextAppearance_TextMediumThick_Primary,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ applyFontFamily=\ \*/\ true,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ applyTextSize=\ \*/\ true,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ !mIncognito\);\

      \ \ \ \ \ \ \ \ mButtonTextPaint\.setFakeBoldText\(fakeBoldText\);\

      \ \ \ \ \ \ \ \ mButtonTextPaint\.density\ =\ density;\

      \ \ \ \ \ \ \ \ float\ maxButtonTextHeight\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tabStripHeightPx\ \-\ res\.getDimension\(R\.dimen\.tab_strip_glic_button_margin_height\);\

      \ \ \ \ \ \ \ \ enforceMaxTextHeight\(mButtonTextPaint,\ maxButtonTextHeight\);\

      \

      \ \ \ \ \ \ \ \ FontMetrics\ buttonTextFontMetrics\ =\ mButtonTextPaint\.getFontMetrics\(\);\

      \ \ \ \ \ \ \ \ mButtonTextHeight\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(int\)\ Math\.ceil\(buttonTextFontMetrics\.bottom\
      \-\ buttonTextFontMetrics\.top\);\

      \ \ \ \ \ \ \ \ mButtonTextYOffset\ =\ \-buttonTextFontMetrics\.top;\

      \

      '
    replace: ''
- description: Remove generic-named button bitmap API with only AI producer consumers;
    tab/group title bitmap APIs remain
  regex:
    re_pattern: '\ \ \ \ /\*\*\ Generates\ a\ generic\ button\ text\ bitmap\ using\
      the\ button\ text\ style\.\ \*/\

      \ \ \ \ public\ @Nullable\ Bitmap\ getButtonTextBitmap\(String\ title\)\ \{\

      \ \ \ \ \ \ \ \ return\ getTitleBitmap\(mButtonTextPaint,\ mButtonTextHeight,\
      mButtonTextYOffset,\ title\);\

      \ \ \ \ \}\

      \

      '
    replace: ''
- description: Remove exclusively AI button text measurement while preserving regular
    title width measurement
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ @param\ titleString\ The\ button\ text\ to\ measure\.\

      \ \ \ \ \ \*\ @return\ The\ width\ in\ px\ of\ the\ button\ text\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ int\ getButtonTextWidth\(String\ titleString\)\ \{\

      \ \ \ \ \ \ \ \ return\ getTitleWidth\(titleString,\ mButtonTextPaint\);\

      \ \ \ \ \}\

      \

      '
    replace: ''
