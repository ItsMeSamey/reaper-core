        \ \ \ \ \ \ \ \ \ \ \ \ mReaderModeIphControllerSupplier\ =\ ObservableSuppliers\.createMonotonic\(\);\

        '
      replace: "    protected @Nullable TopInsetCoordinator mTopInsetCoordinator;\n    private @Nullable ToolbarControlContainer\
        \ mToolbarContainer;\n    private @Nullable DesktopWindowStateManager mDesktopWindowStateManager;\n    private final\
        \ @Nullable ExclusiveAccessManager mExclusiveAccessManager;\n    private final FullscreenBackPressHandler mFullscreenBackPressHandler;\n\
        \    private final PageZoomManager mPageZoomManager;\n    private @Nullable AppHeaderObserver mAppHeaderObserver;\n\
        \    protected final SettableMonotonicObservableSupplier<ReaderModeIphController>\n            mReaderModeIphControllerSupplier\
        \ = ObservableSuppliers.createMonotonic();\n"
  - description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ mExclusiveAccessManager\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ ExclusiveAccessManager\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mFullscreenManager,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mDesktopWindowStateManager\);\

        \ \ \ \ \ \ \ \ \ \ \ \ mBackPressManager\.addHandler\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ ExclusiveAccessManagerBackPressHandler\(mExclusiveAccessManager\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ BackPressHandler\.Type\.FULLSCREEN\);\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ Fullscreen\ manager\ state,\ not\ actual\ window\ state,\ has\ to\ be\ recreated\ as\ soon\
        after\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ RootUiCoordinator\ creations\ as\ possible\.\ It\ is\ needed\ to\ keep\ renderer\ in\ the\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ fullscreen\ state\ if\ recreation\ was\ caused\ by\ the\ window\ move\ to\ another\ display\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ during\ full\ screen\ to\ another\ screen\ call\

        \ \ \ \ \ \ \ \ \ \ \ \ mExclusiveAccessManager\.setFullscreenPendingState\(savedInstanceState\);\

        \ \ \ \ \ \ \ \ \}\ else\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mExclusiveAccessManager\ =\ null;\

        \ \ \ \ \ \ \ \ \ \ \ \ mBackPressManager\.addHandler\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ FullscreenBackPressHandler\(mBrowserControlsManager\.getFullscreenManager\(\)\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ BackPressHandler\.Type\.FULLSCREEN\);\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ mActivityRecreationController\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ ActivityRecreationController\(\

        '
      replace: "            mExclusiveAccessManager =\n                    new ExclusiveAccessManager(\n                   \
        \         mFullscreenManager,\n                            mDesktopWindowStateManager);\n            mFullscreenBackPressHandler\
        \ =\n                    new FullscreenBackPressHandler(\n                            mFullscreenManager,\n        \
        \                    new ExclusiveAccessManagerBackPressHandler(mExclusiveAccessManager));\n            mBackPressManager.addHandler(\n\
        \                    mFullscreenBackPressHandler, BackPressHandler.Type.FULLSCREEN);\n            // Fullscreen manager\
        \ state, not actual window state, has to be recreated as soon after\n            // RootUiCoordinator creations as possible.\
        \ It is needed to keep renderer in the\n            // fullscreen state if recreation was caused by the window move\
        \ to another display\n            // during full screen to another screen call\n            mExclusiveAccessManager.setFullscreenPendingState(savedInstanceState);\n\
        \        } else {\n            mExclusiveAccessManager = null;\n            mFullscreenBackPressHandler =\n        \
        \            new FullscreenBackPressHandler(mBrowserControlsManager.getFullscreenManager());\n            mBackPressManager.addHandler(\n\
        \                    mFullscreenBackPressHandler, BackPressHandler.Type.FULLSCREEN);\n        }\n\n        mActivityRecreationController\
        \ =\n                new ActivityRecreationController(\n"
