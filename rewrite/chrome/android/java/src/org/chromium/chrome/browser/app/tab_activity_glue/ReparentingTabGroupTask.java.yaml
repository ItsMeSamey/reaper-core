# Connect Android split collections to model and transfer APIs.
substitutions:
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.crash\.ChromePureJavaExceptionReporter;\

      import\ org\.chromium\.chrome\.browser\.document\.ChromeLauncherActivity;\

      import\ org\.chromium\.chrome\.browser\.tab\.Tab;\

      import\ org\.chromium\.chrome\.browser\.tabmodel\.TabGroupMetadata;\

      import\ org\.chromium\.chrome\.browser\.tabmodel\.TabReparentingParams;\

      import\ org\.chromium\.ui\.base\.WindowAndroid;\

      \

      import\ java\.util\.List;\

      '
    replace: 'import org.chromium.chrome.browser.crash.ChromePureJavaExceptionReporter;

      import org.chromium.chrome.browser.document.ChromeLauncherActivity;

      import org.chromium.chrome.browser.tab.Tab;

      import org.chromium.chrome.browser.tabmodel.TabGroupMetadata;

      import org.chromium.chrome.browser.tabmodel.SplitInfo;

      import org.chromium.chrome.browser.tabmodel.TabModelSelector;

      import org.chromium.chrome.browser.tabmodel.TabReparentingParams;

      import org.chromium.ui.base.WindowAndroid;


      import java.util.List;

      '
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AsyncTabParamsManagerSingleton\.getInstance\(\)\.remove\(tab\.getId\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ mTabs\ =\ null;\

      \ \ \ \ \ \ \ \ mOriginalWindow\ =\ null;\

      \ \ \ \ \}\

      \

      '
    replace: "            } else {\n                AsyncTabParamsManagerSingleton.getInstance().remove(tab.getId());\n            }\n        }\n        TabModelSelector selector = TabWindowManagerSingleton.getInstance()\n                .getTabModelSelectorById(mTabGroupMetadata.sourceWindowId);\n        if (selector != null) {\n            for (SplitInfo split : mTabGroupMetadata.splits) {\n                selector.getModel(mTabGroupMetadata.isIncognito).restoreSplit(split);\n            }\n        }\n        mTabs = null;\n        mOriginalWindow = null;\n    }\n\n"
