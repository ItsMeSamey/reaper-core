- description: Keep direct core Sync providers without duplicate inherited BraveManageSyncSettings
    alias
  regex:
    re_pattern: ',\n                    org\.chromium\.chrome\.browser\.sync\.settings\.BraveManageSyncSettings\.SEARCH_INDEX_DATA_PROVIDER\);'
    replace: );

