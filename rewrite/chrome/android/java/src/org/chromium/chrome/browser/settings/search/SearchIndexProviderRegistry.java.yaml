# Reaper registered Android container settings search provider.
- description: Index the actually source/GN-registered Android ContainersSettings
    provider; preserve current core, Sync and purge results.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ org\.chromium\.chrome\.browser\.settings\.BraveMainPreferencesBase\.SEARCH_INDEX_DATA_PROVIDER,\

      '
    replace: "                    org.chromium.chrome.browser.settings.BraveMainPreferencesBase.SEARCH_INDEX_DATA_PROVIDER,\n\
      \                    org.chromium.chrome.browser.containers.ContainersSettings.SEARCH_INDEX_DATA_PROVIDER,\n"
