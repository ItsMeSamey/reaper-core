  regex:
    re_pattern: (?m)^                    org\.chromium\.chrome\.browser\.playlist\.settings\.BravePlaylistPreferences\.SEARCH_INDEX_DATA_PROVIDER,\n
    replace: ''
- description: Omit search provider for compiled-out Android BraveLeoDefaultModelPreferences
  regex:
