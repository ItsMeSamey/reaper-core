substitutions:
- description: Remove import used solely by the excluded Actor external-intent veto
  regex:
    pattern: 'import org.chromium.chrome.browser.actor.ActorKeyedServiceFactory;

      '
    replace: ''
  count: 1
- description: Remove import used solely by the excluded Actor external-intent veto
  regex:
    pattern: 'import org.chromium.chrome.browser.glic.GlicEnabling;

      '
    replace: ''
  count: 1
- description: Remove import used solely by the excluded Actor external-intent veto
  regex:
    pattern: 'import org.chromium.chrome.browser.profiles.Profile;

      '
    replace: ''
  count: 1
- description: Use existing ordinary no-Actor external-intent result
  regex:
    pattern: "    public boolean shouldDisableAllExternalIntents() {\n        Profile profile = mTab.getProfile();\n     \
      \   if (profile == null || !GlicEnabling.isEnabledForProfile(profile)) {\n            return false;\n        }\n\n \
      \       var actorService = ActorKeyedServiceFactory.getForProfile(profile);\n        if (actorService == null) {\n \
      \           return false;\n        }\n\n        var activeTaskId = actorService.getActiveTaskIdOnTab(mTab.getId());\n\
      \        return activeTaskId != null;\n    }"
    replace: "    public boolean shouldDisableAllExternalIntents() {\n        return false;\n    }"
  count: 1
