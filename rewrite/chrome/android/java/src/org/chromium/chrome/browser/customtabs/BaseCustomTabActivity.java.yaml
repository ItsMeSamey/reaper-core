substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ int\ supportedProfileType\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isOffTheRecord\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ SupportedProfileType\.OFF_THE_RECORD\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ SupportedProfileType\.REGULAR;\

      \ \ \ \ \ \ \ \ \ \ \ \ initializeChromeAndroidTask\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ browserWindowType,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assumeNonNull\(tabModelOrchestrator\.getTabModelSelector\(\)\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ supportedProfileType,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ multiInstanceManager=\ \*/\ null\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      \ \ \ \ @Override\

      '
    replace: "            int supportedProfileType =\n                    isOffTheRecord\n                            ? SupportedProfileType.OFF_THE_RECORD\n\
      \                            : SupportedProfileType.REGULAR;\n            if (!initializeChromeAndroidTask(\n      \
      \              browserWindowType,\n                    assumeNonNull(tabModelOrchestrator.getTabModelSelector()),\n\
      \                    supportedProfileType,\n                    /* multiInstanceManager= */ null)) {\n             \
      \   return;\n            }\n        }\n    }\n\n    @Override\n"
