# Reaper Android containers lifecycle; complete raw-pin ancestry.
substitutions:
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.WarmupManager;\

      import\ org\.chromium\.chrome\.browser\.browserservices\.intents\.BrowserServicesIntentDataProvider;\

      import\ org\.chromium\.chrome\.browser\.browserservices\.intents\.SessionHolder;\

      import\ org\.chromium\.chrome\.browser\.customtabs\.content\.CustomTabActivityTabController;\

      import\ org\.chromium\.chrome\.browser\.customtabs\.content\.TabObserverRegistrar;\

      import\ org\.chromium\.chrome\.browser\.flags\.ChromeFeatureList;\

      '
    replace: 'import org.chromium.chrome.browser.WarmupManager;

      import org.chromium.chrome.browser.browserservices.intents.BrowserServicesIntentDataProvider;

      import org.chromium.chrome.browser.browserservices.intents.SessionHolder;

      import org.chromium.chrome.browser.content.WebContentsFactory;

      import org.chromium.chrome.browser.customtabs.content.CustomTabActivityTabController;

      import org.chromium.chrome.browser.customtabs.content.TabObserverRegistrar;

      import org.chromium.chrome.browser.flags.ChromeFeatureList;

      '
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ webContents\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ warmupManager\.destroySpareTab\(\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ warmupManager\.createRegularSpareTab\(profile,\ webContents\);\

      \ \ \ \ \ \ \ \ //\ In\ case\ creating\ the\ tab\ fails\ for\ some\ reason\.\

      \ \ \ \ \ \ \ \ //\ See\ above\ as\ to\ why\ we\ can\ always\ pass\ targetsNetwork\ =\ false\.\

      \ \ \ \ \ \ \ \ if\ \(!warmupManager\.hasSpareTab\(profile,\ /\*\ targetsNetwork=\ \*/\ false\)\)\ return;\

      '
    replace: "                && webContents != null) {\n            warmupManager.destroySpareTab();\n        }\n        if (webContents != null\n                && WebContentsFactory.isWebContentsForSeparateStoragePartitionExperiment(\n                        profile, webContents)) {\n            warmupManager.createRegularSpareTabForSeparateStoragePartitionExperiment(\n                    profile, webContents);\n        } else {\n            warmupManager.createRegularSpareTab(profile, webContents);\n        }\n        // In case creating the tab fails for some reason.\n        // See above as to why we can always pass targetsNetwork = false.\n        if (!warmupManager.hasSpareTab(profile, /* targetsNetwork= */ false)) return;\n"
