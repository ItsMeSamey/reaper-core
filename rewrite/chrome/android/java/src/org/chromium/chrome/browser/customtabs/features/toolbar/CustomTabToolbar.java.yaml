substitutions:
- description: Remove only the retired null merchant argument from the ordinary PageInfo constructor
  regex:
    pattern: '                            /* storeInfoActionHandlerSupplier= */ null,

      '
    replace: ''
  count: 1
- description: Remove the obsolete merchant-row comment
  regex:
    pattern: '            // For now we don''t show "store info" row for custom tab.

      '
    replace: ''
  count: 1
- description: Remove exclusive price-menu delegate cast import.
  regex:
    pattern: 'import org.chromium.chrome.browser.app.appmenu.AppMenuPropertiesDelegateImpl;

      '
    replace: ''
  count: 1
- description: Preserve generic unsupported-action guard without retired price wording.
  regex:
    pattern: '        if (menuInfo == null) return; // PriceTracking might not be enabled for showing.

      '
    replace: '        if (menuInfo == null) return;

      '
  count: 1
- description: Remove dedicated tracking and insight fallback cases; preserve Reader Mode and default.
  regex:
    pattern: "            case AdaptiveToolbarButtonVariant.PRICE_TRACKING -> {\n                // Figure out which of the\
      \ two menu items (enable/disable) appears and needs\n                // highlighting.\n                // TODO(crbug.com/424807997):\
      \ Avoid casting.\n                var handler = mAppMenuHandler.get();\n                assumeNonNull(handler);\n  \
      \              var appMenuDelegate =\n                        (AppMenuPropertiesDelegateImpl) handler.getMenuPropertiesDelegate();\n\
      \                var showEnabled = appMenuDelegate.getPriceTrackingMenuItemInfo(getCurrentTab());\n                if\
      \ (showEnabled == null) yield null;\n                yield showEnabled\n                        ? Pair.create(\n   \
      \                             R.id.enable_price_tracking_menu_id,\n                                R.string.enable_price_tracking_menu_item)\n\
      \                        : Pair.create(\n                                R.id.disable_price_tracking_menu_id,\n    \
      \                            R.string.disable_price_tracking_menu_item);\n            }\n            case AdaptiveToolbarButtonVariant.PRICE_INSIGHTS\
      \ ->\n                    Pair.create(R.id.price_insights_menu_id, R.string.price_insights_title);\n"
    replace: ''
  count: 1
