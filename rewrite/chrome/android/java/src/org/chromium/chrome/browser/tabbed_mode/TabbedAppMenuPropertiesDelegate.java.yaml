# Android Chromium Discover implementation exclusion.
substitutions:
- description: 'Make shouldShowDefaultBrowserPromo() overridable.


    BraveTabbedAppMenuPropertiesDelegate shows the default browser menu item

    whenever Brave is not the default browser, instead of relying on the

    upstream promo state and feature flag.'
  regex:
    re_pattern: private (boolean shouldShowDefaultBrowserPromo\(\))
    replace: protected \1
- description: Read the Android extension build flag
  regex:
    re_pattern: import\ org\.chromium\.build\.annotations\.Contract;
    replace: 'import org.chromium.build.BuildConfig;

      import org.chromium.build.annotations.Contract;'
- description: Reuse the DevTools item when the normal phone menu has no More tools submenu
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(mMoreToolsItemBuilder\.shouldShowMoreToolsItem\(currentTab\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ modelList\.add\(buildMoreToolsItem\(currentTab\)\);\

      \ \ \ \ \ \ \ \ \}'
    replace: "        if (mMoreToolsItemBuilder.shouldShowMoreToolsItem(currentTab)) {\n            modelList.add(buildMoreToolsItem(currentTab));\n        } else if (BuildConfig.IS_DESKTOP_ANDROID\n                && !isSubmenusEnabled(mContext)\n                && mMoreToolsItemBuilder.shouldShowDevToolsItem(currentTab)) {\n            modelList.add(mMoreToolsItemBuilder.buildDevToolsItem());\n        }"
- description: Remove the excluded Feed dependency org.chromium.chrome.browser.feed.FeedFeatures
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.feed\.FeedFeatures;\

      '
