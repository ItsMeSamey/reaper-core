    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ TraceEvent\.begin\("Tab\.show"\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!isHidden\(\)\)\ \{'
    replace: "            TraceEvent.begin(\"Tab.show\");\n            if (isDestroyed()) return;\n            if (!isHidden()) {"
- description: Notify actual visibility before reentrant loading or Java observers can hide the tab
  count: 1
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ mIsHidden\ =\ false;\

      \ \ \ \ \ \ \ \ \ \ \ \ updateInteractableState\(\);'
    replace: "            mIsHidden = false;\n            if (mNativeTabAndroid != 0) {\n                // Visible split panes can remain inactive. Notify after the visibility transition,\n                // independently of the current-tab supplier's activation notifications.\n                TabImplJni.get().sendDidBecomeVisibleUpdate(mNativeTabAndroid);\n                if (isDestroyed() || isHidden() || mNativeTabAndroid == 0) return;\n            }\n            updateInteractableState();"
- description: Notify before the hide transition exactly once, without retaining a destroyed native peer
  count: 1
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ if\ \(isHidden\(\)\)\ return;\

      \ \ \ \ \ \ \ \ \ \ \ \ mIsHidden\ =\ true;'
    replace: "            if (isDestroyed() || isHidden() || mDispatchingWillHide) return;\n            if (mNativeTabAndroid != 0) {\n                // The will-hide callback must observe the old visible state. Reentrant hide calls\n                // are already covered by this pending transition.\n                mDispatchingWillHide = true;\n                try {\n                    TabImplJni.get().sendWillBecomeHiddenUpdate(mNativeTabAndroid);\n                } finally {\n                    mDispatchingWillHide = false;\n                }\n                if (isDestroyed() || isHidden()) return;\n            }\n            mIsHidden = true;"
- description: Keep the native visibility and activation notification entrypoints separate
