  regex:
    re_pattern: \ \ \ \ \ \ \ \ void\ sendWillDeactivateUpdate\(long\ nativeTabAndroid\);
    replace: "        void sendWillDeactivateUpdate(long nativeTabAndroid);\n\n        void sendDidBecomeVisibleUpdate(long nativeTabAndroid);\n\n        void sendWillBecomeHiddenUpdate(long nativeTabAndroid);"
