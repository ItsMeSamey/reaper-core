- description: Update persisted split fields only through native membership notifications and retain historical values through unsplit
  count: 1
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ @CalledByNative\

      \ \ \ \ public\ @TabUserAgent\ int\ getUserAgent\(\)'
    replace: "    @Override\n    public @Nullable Token getSplitTabId() { return mSplitTabId; }\n\n    @Override\n    public int getSplitLayout() { return mSplitLayout; }\n\n    @Override\n    public double getSplitRatio() { return mSplitRatio; }\n\n    @Override\n    public int getSplitPosition() { return mSplitPosition; }\n\n    @Override\n    @CalledByNative\n    public void setSplitData(@JniType(\"std::optional<base::Token>\") @Nullable Token token, int layout, double ratio, int position) {\n        if (isDestroyed()) return;\n        if (!Tab.SplitData.isValid(token, layout, ratio, position)) {\n            token = null;\n            layout = 0;\n            ratio = 0.5;\n            position = -1;\n        }\n        if (Objects.equals(mSplitTabId, token) && mSplitLayout == layout\n                && Double.compare(mSplitRatio, ratio) == 0 && mSplitPosition == position) return;\n        mSplitTabId = token;\n        mSplitLayout = layout;\n        mSplitRatio = ratio;\n        mSplitPosition = position;\n        for (TabObserver observer : mObservers) observer.onSplitDataChanged(this);\n    }\n\n    @Override\n    public void captureSplitDataForClosure() {\n        Token token = mSplitTabId;\n        mClosingSplitData = token == null ? null\n                : new Tab.SplitData(token, mSplitLayout, mSplitRatio, mSplitPosition);\n    }\n\n    @Override\n    public @Nullable Tab.SplitData getSplitDataForClosure() { return mClosingSplitData; }\n\n    @Override\n    public void clearSplitDataForClosure() { mClosingSplitData = null; }\n\n    @CalledByNative\n    private @JniType(\"std::optional<base::Token>\") @Nullable Token getHistoricalSplitTabId() {\n        return mClosingSplitData == null ? mSplitTabId : mClosingSplitData.getToken();\n    }\n\n    @CalledByNative\n    private int getHistoricalSplitLayout() {\n        return mClosingSplitData == null ? mSplitLayout : mClosingSplitData.getLayout();\n    }\n\n    @CalledByNative\n    private double getHistoricalSplitRatio() {\n        return mClosingSplitData == null ? mSplitRatio : mClosingSplitData.getRatio();\n    }\n\n    @CalledByNative\n    private int getHistoricalSplitPosition() {\n        return mClosingSplitData == null ? mSplitPosition : mClosingSplitData.getPosition();\n    }\n\n    @Override\n    @CalledByNative\n    public @TabUserAgent int getUserAgent()"
