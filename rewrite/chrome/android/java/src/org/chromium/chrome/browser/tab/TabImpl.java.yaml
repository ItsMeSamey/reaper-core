# Android R build import and nested type-annotation corrections.
substitutions:
- description: Query the compiled extension backend for the Web Store UA exception.
  regex:
    pattern: import org.chromium.chrome.browser.tabwindow.TabWindowManager;
    replace: 'import org.chromium.chrome.browser.tabwindow.TabWindowManager;

      import org.chromium.chrome.browser.ui.extensions.ExtensionUi;'
- description: Use Chromium's desktop UA and client hints only on the HTTPS Web Store host.
  regex:
    pattern: "        boolean shouldRequestDesktopSite =\n                DesktopSiteUtils.shouldOverrideDesktopSite(mProfile, url, getContext());"
    replace: "        // The Web Store serves a non-installable marketing page to mobile UAs.\n        // Reuse the normal desktop UA + client-hint override for this exact host.\n        boolean isExtensionStore =\n                url != null\n                        && \"https\".equals(url.getScheme())\n                        && \"chromewebstore.google.com\".equals(url.getHost())\n                        && ExtensionUi.isEnabled(mProfile);\n        boolean shouldRequestDesktopSite =\n                isExtensionStore\n                        || DesktopSiteUtils.shouldOverrideDesktopSite(mProfile, url, getContext());"
