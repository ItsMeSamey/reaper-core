  - description: Remove actual Glic button provider construction and registration
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(!BottomBarConfigUtils\.isBottomBarEnabled\(mActivity\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mGlicButtonController\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ GlicToolbarButtonController\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mActivity,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mActivityTabProvider,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mToggleGlicCallback,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ trackerSupplier,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mChromeAndroidTaskSupplier,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mBrowserControlsVisibilityManager,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mTabModelSelectorSupplier,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ controller::recomputeUiState\);\

        \ \ \ \ \ \ \ \ \ \ \ \ controller\.addButtonVariant\(AdaptiveToolbarButtonVariant\.GLIC,\
        mGlicButtonController\);\

        \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove exclusive Glic UI observer registration; ordinary voice runnable
      stays
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ mGlicVerticalTabsObserver\ =\ state\ \->\ controller\.recomputeUiState\(\);\

        \ \ \ \ \ \ \ \ mIsVerticalTabsActiveSupplier\.addSyncObserver\(mGlicVerticalTabsObserver\);\

        \ \ \ \ \ \ \ \ mIsGlicPinnedSupplier\.addSyncObserver\(mGlicVerticalTabsObserver\);\

        '
      replace: ''
  - description: Discard stable removed GLIC results without changing ordinary bottom-bar
      New Tab filtering
    regex:
      re_pattern: '\{\

        \ \ \ \ \ \ \ \ boolean\ skipGlic\ =\ mIsVerticalTabsActiveSupplier\.get\(\)\
        \&\&\ mIsGlicPinnedSupplier\.get\(\);\

        \ \ \ \ \ \ \ \ TabModelSelector\ selector\ =\ mTabModelSelectorSupplier\.get\(\);\

        \ \ \ \ \ \ \ \ if\ \(selector\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ Profile\ profile\ =\ selector\.getCurrentModel\(\)\.getProfile\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(profile\ !=\ null\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ mGlicButtonController\ !=\ null\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ mGlicButtonController\.shouldForciblyShowGlicButton\(profile\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !skipGlic\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ AdaptiveToolbarButtonVariant\.GLIC;\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ if\ \(skipGlic\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ List<Integer>\ filteredResults\ =\ new\ ArrayList<>\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ for\ \(int\ result\ :\ segmentationResults\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(result\ !=\ AdaptiveToolbarButtonVariant\.GLIC\)\
        filteredResults\.add\(result\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ segmentationResults\ =\ filteredResults;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ List<Integer>\ filteredResults;\

        \ \ \ \ \ \ \ \ if\ \(!BottomBarConfigUtils\.isBottomBarEnabled\(mActivity\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ filteredResults\ =\ segmentationResults;\

        \ \ \ \ \ \ \ \ \}\ else\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ filteredResults\ =\ new\ ArrayList<>\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ for\ \(int\ result\ :\ segmentationResults\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(result\ !=\ AdaptiveToolbarButtonVariant\.GLIC\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ result\ !=\ AdaptiveToolbarButtonVariant\.NEW_TAB\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ filteredResults\.add\(result\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ return\ AdaptiveToolbarBehavior\.defaultResultFilter\(mActivity,\
        filteredResults\);\

        \ \ \ \ \}'
      replace: "{\n        List<Integer> filteredResults = new ArrayList<>();\n    \
        \    boolean isBottomBarEnabled = BottomBarConfigUtils.isBottomBarEnabled(mActivity);\n\
        \        for (int result : segmentationResults) {\n            if (result !=\
        \ AdaptiveToolbarButtonVariant.GLIC\n                    && (!isBottomBarEnabled\
        \ || result != AdaptiveToolbarButtonVariant.NEW_TAB)) {\n                filteredResults.add(result);\n\
        \            }\n        }\n        return AdaptiveToolbarBehavior.defaultResultFilter(mActivity,\
        \ filteredResults);\n    }"
  - description: Reject historical removed button; preserve genuine bottom-bar New Tab
      behavior
    regex:
      re_pattern: '\{\

        \ \ \ \ \ \ \ \ //\ Ignore\ manual\ overrides\ for\ GLIC\ and\ New\ Tab\ when\
        the\ Android\ Bottom\ Bar\ is\ enabled\ as\

        \ \ \ \ \ \ \ \ //\ these\ buttons\ have\ a\ dedicated\ spot\ in\ the\ bottom\
        bar\.\

        \ \ \ \ \ \ \ \ if\ \(BottomBarConfigUtils\.isBottomBarEnabled\(mActivity\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ \(manualOverride\ ==\ AdaptiveToolbarButtonVariant\.GLIC\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ manualOverride\ ==\ AdaptiveToolbarButtonVariant\.NEW_TAB\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ return\ true;\

        \ \ \ \ \}'
      replace: "{\n        return manualOverride != AdaptiveToolbarButtonVariant.GLIC\n\
        \                && (!BottomBarConfigUtils.isBottomBarEnabled(mActivity)\n \
        \                       || manualOverride != AdaptiveToolbarButtonVariant.NEW_TAB);\n\
        \    }"
  - description: Remove override that only unregistered removed Glic observers; inherit
      ordinary default teardown
