        \ \ \ \ \ \ \ \ \ \ \ \ NonNullObservableSupplier<Boolean>\ isGlicPinnedSupplier\)\
        \{'
      replace: '            MonotonicObservableSupplier<@StripVisibilityState Integer>
        tabStripVisibilitySupplier) {'
