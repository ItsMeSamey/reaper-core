        \ \ \ \ \ \ \ \ if\ \(mGlicVerticalTabsObserver\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mIsVerticalTabsActiveSupplier\.removeObserver\(mGlicVerticalTabsObserver\);\

        \ \ \ \ \ \ \ \ \ \ \ \ mIsGlicPinnedSupplier\.removeObserver\(mGlicVerticalTabsObserver\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}'
      replace: ''
