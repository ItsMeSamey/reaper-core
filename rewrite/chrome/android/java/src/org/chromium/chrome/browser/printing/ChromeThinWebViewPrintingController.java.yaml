substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove contextual-task implementation dependency from core ThinWebView
    printing
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.contextual_tasks\.ContextualTasksUtils;\

      '
    replace: ''
- description: Preserve actual profile and printing-policy checks for core ThinWebView
    printing
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(webContents\ !=\ null\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ ContextualTasksUtils\.isContextualTasksUrl\(webContents\.getVisibleUrl\(\)\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: ''
