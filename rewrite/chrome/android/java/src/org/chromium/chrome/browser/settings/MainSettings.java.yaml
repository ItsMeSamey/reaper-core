substitutions:
  - description: |-
      Never show the address bar preference in the main settings list.

      Brave shows it in its own Appearance settings. Removing it once from
      BraveMainPreferencesBase is not enough, because upstream re-adds it on
      configuration changes and on toolbar position changes, neither of which
      goes through onResume.
    regex:
      re_pattern: |-
        (private static boolean shouldShowAddressBarPref\(Context context\) \{)
      replace: |-
        \1
                if ((true)) return false;
  - description: Remove the import of excluded Glic settings eligibility.
    regex:
      pattern: 'import org.chromium.chrome.browser.glic.GlicEnabling;

        '
      replace: ''
    count: 1
  - description: Keep the retired Glic settings entry absent without calling its excluded eligibility service.
    regex:
      pattern: '        updateGlicPreference();

        '
      replace: '        removePreferenceIfPresent(PREF_GLIC);

        '
    count: 1
  - description: Remove private Glic eligibility and re-addition helpers while preserving ordinary preference updates.
    regex:
      pattern: "    private static boolean shouldShowGlicPreference(Profile profile) {\n        return GlicEnabling.shouldShowSettingsPage(profile);\n\
        \    }\n\n    private void updateGlicPreference() {\n        if (shouldShowGlicPreference(getProfile())) {\n       \
        \     addPreferenceIfAbsent(PREF_GLIC);\n        } else {\n            removePreferenceIfPresent(PREF_GLIC);\n     \
        \   }\n    }\n\n"
      replace: ''
    count: 1
  - description: Always omit the retired Glic entry from settings search while preserving other dynamic entries.
    regex:
      pattern: "                    if (!shouldShowGlicPreference(profile)) {\n                        indexData.removeEntry(getUniqueId(PREF_GLIC));\n\
        \                    }\n"
      replace: '                    indexData.removeEntry(getUniqueId(PREF_GLIC));

        '
    count: 1
