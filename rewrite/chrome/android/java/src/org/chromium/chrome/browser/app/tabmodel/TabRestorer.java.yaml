      \ tabState, int index) {\n        LoadUrlParams params = new LoadUrlParams(assumeNonNull(tabState.url));\n        String\
      \ containerId = tabState.containerId;\n        if (containerId.isEmpty()) {\n            return mTabCreator.createNewTab(params,\
      \ TabLaunchType.FROM_RESTORE, null, index);\n        }\n        Profile profile = mTabModelSelector.getModel(mIncognito).getProfile();\n\
      \        if (mIncognito || profile == null || profile.isOffTheRecord() || profile.shutdownStarted()\n              \
      \  || !ContainersBridge.restoreContainerIdentity(profile, containerId)) return null;\n        if (mTabCreator instanceof\
      \ ChromeTabCreator chromeTabCreator) {\n            return chromeTabCreator.createNewTabInContainer(\n             \
      \       params, TabLaunchType.FROM_RESTORE, containerId, index);\n        }\n        if (mTabCreator instanceof ArchivedTabCreator\
      \ archivedTabCreator) {\n            return archivedTabCreator.createNewTabInContainer(\n                    params,\
      \ TabLaunchType.FROM_RESTORE, containerId, index);\n        }\n        return null;\n    }\n"
  count: 1
