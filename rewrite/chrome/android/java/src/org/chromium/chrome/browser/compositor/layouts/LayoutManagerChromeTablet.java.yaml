# Reaper Android AI physical-purge core caller adapters.
- description: 'Narrow literal adapter hunk: physically remove selected AI callers/state
    while retaining original core browser behavior. Source bytes identical to frozen
    strip-main5 v1.'
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.compositor\.overlays\.strip\.StripLayoutHelperManager\.TabModelStartupInfo;\

      import\ org\.chromium\.chrome\.browser\.data_sharing\.DataSharingTabManager;\

      import\ org\.chromium\.chrome\.browser\.device\.DeviceClassManager;\

      import\ org\.chromium\.chrome\.browser\.glic\.GlicButtonDelegate;\

      import\ org\.chromium\.chrome\.browser\.hub\.HubLayoutDependencyHolder;\

      import\ org\.chromium\.chrome\.browser\.layouts\.LayoutType;\

      import\ org\.chromium\.chrome\.browser\.lifecycle\.ActivityLifecycleDispatcher;\

      import\ org\.chromium\.chrome\.browser\.multiwindow\.MultiInstanceManager;\

      import\ org\.chromium\.chrome\.browser\.multiwindow\.MultiWindowModeStateDispatcher;\

      import\ org\.chromium\.chrome\.browser\.share\.ShareDelegate;\

      import\ org\.chromium\.chrome\.browser\.tab\.TabLaunchType;\

      import\ org\.chromium\.chrome\.browser\.tab\.TabObscuringHandler;\

      '
    replace: 'import org.chromium.chrome.browser.compositor.overlays.strip.StripLayoutHelperManager.TabModelStartupInfo;

      import org.chromium.chrome.browser.data_sharing.DataSharingTabManager;

      import org.chromium.chrome.browser.device.DeviceClassManager;

