- description: Keep closed-window metadata profile-scoped and make its callback once-only before reentry
  regex:
    re_pattern: '\ \ \ \ static\ class\ TabStateInitializedObserver\ implements\ TabModelSelectorObserver\ \{\

      \ \ \ \ \ \ \ \ private\ final\ TabModelSelector\ mTabModelSelector;\

      \ \ \ \ \ \ \ \ private\ final\ long\ mTimestamp;\

      \ \ \ \ \ \ \ \ private\ final\ int\ mInstanceId;\

      \ \ \ \ \ \ \ \ private\ @Nullable\ JniOnceCallback<@Nullable\ RecentlyClosedWindowMetadata>\ mCallback;\

      \

      \ \ \ \ \ \ \ \ TabStateInitializedObserver\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabModelSelector\ selector,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ long\ timestamp,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int\ instanceId,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ JniOnceCallback<@Nullable\ RecentlyClosedWindowMetadata>\ callback\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ assert\ callback\ !=\ null;\

      \ \ \ \ \ \ \ \ \ \ \ \ mTabModelSelector\ =\ selector;\

      \ \ \ \ \ \ \ \ \ \ \ \ mTimestamp\ =\ timestamp;\

      \ \ \ \ \ \ \ \ \ \ \ \ mInstanceId\ =\ instanceId;\

      \ \ \ \ \ \ \ \ \ \ \ \ mCallback\ =\ callback;\

      \ \ \ \ \ \ \ \ \ \ \ \ mTabModelSelector\.addObserver\(this\);\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ void\ onTabStateInitialized\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ Call\ the\ callback\ with\ the\ TabModelSelector\.\

      \ \ \ \ \ \ \ \ \ \ \ \ assumeNonNull\(mCallback\);\

      \ \ \ \ \ \ \ \ \ \ \ \ RecentlyClosedWindowMetadata\ result\ =\ new\ RecentlyClosedWindowMetadata\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ result\.tabModel\ =\ mTabModelSelector\.getCurrentModel\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ result\.timestamp\ =\ mTimestamp;\

      \ \ \ \ \ \ \ \ \ \ \ \ result\.instanceId\ =\ mInstanceId;\

      \ \ \ \ \ \ \ \ \ \ \ \ mCallback\.onResult\(result\);\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ Set\ the\ callback\ to\ null\ to\ indicate\ we\ ran\ it\.\

      \ \ \ \ \ \ \ \ \ \ \ \ mCallback\ =\ null;\

      \ \ \ \ \ \ \ \ \ \ \ \ mTabModelSelector\.removeObserver\(this\);\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ void\ onDestroyed\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ If\ the\ callback\ wasn''t\ called,\ notify\ the\ C\+\+\ side\ so\ it\ can\ continue\.\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(mCallback\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mCallback\.onResult\(null\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mCallback\ =\ null;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ mTabModelSelector\.removeObserver\(this\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      '
    replace: "    private final class TabStateInitializedObserver implements TabModelSelectorObserver {\n        private final TabModelSelector mTabModelSelector;\n        private final long mTimestamp;\n        private final int mInstanceId;\n        private @Nullable JniOnceCallback<@Nullable RecentlyClosedWindowMetadata> mCallback;\n        private final CancelableRunnable mCheck = new CancelableRunnable(this::onTabStateInitialized);\n\n        TabStateInitializedObserver(TabModelSelector selector, long timestamp, int instanceId,\n                JniOnceCallback<@Nullable RecentlyClosedWindowMetadata> callback) {\n            mTabModelSelector = selector;\n            mTimestamp = timestamp;\n            mInstanceId = instanceId;\n            mCallback = callback;\n            mMetadataRequests.add(this);\n            selector.addObserver(this);\n            if (mCallback != null && selector.isTabStateInitialized()) {\n                PostTask.postTask(TaskTraits.UI_DEFAULT, mCheck);\n            }\n        }\n\n        @Override\n        public void onTabStateInitialized() {\n            if (mCallback == null) return;\n            TabModel model = mTabModelSelector.getModel(false);\n            if (mDestroyed || mProfile.shutdownStarted() || model.getProfile() != mProfile\n                    || TabWindowManagerSingleton.getInstance().getTabModelSelectorById(mInstanceId)\n                            != mTabModelSelector\n                    || getRecentlyClosedWindowById(mInstanceId, mTimestamp) == null) {\n                finish(null);\n                return;\n            }\n            RecentlyClosedWindowMetadata result = new RecentlyClosedWindowMetadata();\n            result.tabModel = model;\n            result.timestamp = mTimestamp;\n            result.instanceId = mInstanceId;\n            finish(result);\n        }\n\n        private void finish(@Nullable RecentlyClosedWindowMetadata result) {\n            JniOnceCallback<@Nullable RecentlyClosedWindowMetadata> callback = mCallback;\n            if (callback == null) return;\n            mCallback = null;\n            mCheck.cancel();\n            mTabModelSelector.removeObserver(this);\n            mMetadataRequests.remove(this);\n            callback.onResult(result);\n        }\n\n        @Override\n        public void onDestroyed() {\n            finish(null);\n        }\n    }\n\n"
