- description: Enumerate bounded real closed-window identities without eagerly loading their tabs
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Returns\ the\ TabModel\ and\ other\ metadata\ via\ callback\ for\ a\ recently\ closed\ window\ with\ the'
    replace: "    /**\n     * Returns newest-first pairs of persisted instance ID and closure milliseconds. This snapshot\n     * does not load any tab state: native merges these times with native tab/group session entries\n     * before sequentially requesting metadata for the windows needed by the bounded response.\n     */\n    @CalledByNative\n    public static @JniType(\"std::vector<int64_t>\") long[] getRecentlyClosedWindowSnapshot(\n            @JniType(\"Profile*\") Profile profile, int maxEntries) {\n        if (maxEntries <= 0 || profile.isOffTheRecord() || profile.shutdownStarted()) {\n            return new long[0];\n        }\n        int limit = Math.min(maxEntries, MAX_RECENTLY_CLOSED_TABS_AND_WINDOWS);\n        for (RecentlyClosedEntriesManager manager :\n                RecentlyClosedEntriesManagerTrackerImpl.getInstance().getManagers()) {\n            if (manager.mDestroyed || manager.mProfile != profile) continue;\n            List<RecentlyClosedWindow> windows = manager.getRecentlyClosedWindows();\n            if (manager.mDestroyed || profile.shutdownStarted()) return new long[0];\n            int count = Math.min(limit, windows.size());\n            long[] snapshot = new long[count * 2];\n            for (int i = 0; i < count; ++i) {\n                RecentlyClosedWindow window = windows.get(i);\n                snapshot[i * 2] = window.getInstanceId();\n                snapshot[i * 2 + 1] = window.getTimestamp();\n            }\n            return snapshot;\n        }\n        return new long[0];\n    }\n\n    /**\n     * Returns the TabModel and other metadata via callback for a recently closed window with the"
