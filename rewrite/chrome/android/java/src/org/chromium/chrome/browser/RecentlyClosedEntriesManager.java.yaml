- description: Restore the original persisted Activity instance and await exact ready owner instead of copying URLs
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ If\ the\ tab\ state\ is\ initialized,\ run\ the\ callback\ now\.\ Post\ it\ as\ a\ task\ so\ it''s\

      \ \ \ \ \ \ \ \ //\ always\ async\ from\ the\ C\+\+\ side,\ which\ simplifies\ the\ calling\ code\.\

      \ \ \ \ \ \ \ \ if\ \(selector\.isTabStateInitialized\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ PostTask\.postTask\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TaskTraits\.UI_DEFAULT,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ RecentlyClosedWindowMetadata\ result\ =\ new\ RecentlyClosedWindowMetadata\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ result\.tabModel\ =\ selector\.getCurrentModel\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ result\.timestamp\ =\ timestamp;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ result\.instanceId\ =\ windowInstanceId;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ callback\.onResult\(result\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ //\ Otherwise\ wait\ for\ tab\ state\ to\ be\ initialized\.\ The\ observer\ adds\ and\ removes\ itself\.\

      \ \ \ \ \ \ \ \ new\ TabStateInitializedObserver\(selector,\ timestamp,\ windowInstanceId,\ callback\);\

      \ \ \ \ \}\

      '
    replace: "        // The owned observer also posts already-ready results, revalidates the exact regular\n        // model, and balances pending native callbacks on selector or manager destruction.\n        new TabStateInitializedObserver(selector, timestamp, windowInstanceId, callback);\n    }\n\n    /** A pending persisted-session operation owned by this manager. */\n    public interface RestoreOperation {\n        /** Stops waiting; a successfully launched Android task is not closed. */\n        void cancel();\n    }\n\n    @CalledByNative\n    public static void cancelRestoreOperation(@Nullable RestoreOperation operation) {\n        if (operation != null) operation.cancel();\n    }\n\n    /** Restores the persisted instance, including navigation histories, groups and splits. */\n    @CalledByNative\n    public static @Nullable RestoreOperation restoreWindow(\n            @JniType(\"Profile*\") Profile profile,\n            int instanceId,\n            long expectedClosureTime,\n            @JniType(\"base::OnceCallback<void(int64_t)>&&\") JniOnceCallback<Long> callback) {\n        if (profile.isOffTheRecord() || profile.shutdownStarted()\n                || !MultiWindowUtils.isMultiInstanceApi31Enabled() || !canRestoreWindow()) {\n            callback.onResult(0L);\n            return null;\n        }\n        Set<RecentlyClosedEntriesManager> managers =\n                RecentlyClosedEntriesManagerTrackerImpl.getInstance().getManagers();\n        for (RecentlyClosedEntriesManager manager : managers) {\n            for (WindowRestoreOperation operation : manager.mWindowRestores) {\n                if (operation.mInstanceId == instanceId) {\n                    callback.onResult(0L);\n                    return null;\n                }\n            }\n        }\n        for (RecentlyClosedEntriesManager manager : managers) {\n            if (manager.mDestroyed || manager.mProfile != profile\n                    || !manager.hasLiveOwner()\n                    || manager.getRecentlyClosedWindowById(instanceId, expectedClosureTime) == null) {\n                continue;\n            }\n            TabWindowManager windowManager = TabWindowManagerSingleton.getInstance();\n            TabModelSelector closedSelector = windowManager.getTabModelSelectorById(instanceId);\n            if (closedSelector == null || !closedSelector.isTabStateInitialized()\n                    || closedSelector.getModel(false).getProfile() != profile\n                    || MultiWindowUtils.getActivityById(instanceId) != null\n                    || MultiWindowUtils.readProfileType(instanceId)\n                            == SupportedProfileType.OFF_THE_RECORD) {\n                callback.onResult(0L);\n                return null;\n            }\n            WindowRestoreOperation operation = manager.new WindowRestoreOperation(\n                    instanceId, closedSelector, windowManager, callback);\n            manager.mWindowRestores.add(operation);\n            operation.start();\n            return operation;\n        }\n        callback.onResult(0L);\n        return null;\n    }\n\n    private boolean hasLiveOwner() {\n        TabWindowManager windowManager = TabWindowManagerSingleton.getInstance();\n        int ownerId = windowManager.getWindowIdForSelector(mOwnerSelector);\n        Activity activity = MultiWindowUtils.getActivityById(ownerId);\n        return ownerId != TabWindowManager.INVALID_WINDOW_ID\n                && activity != null && !activity.isFinishing() && !activity.isDestroyed()\n                && windowManager.getIdForWindow(activity) == ownerId\n                && windowManager.getTabModelSelectorById(ownerId) == mOwnerSelector\n                && mOwnerSelector.getModel(false).getProfile() == mProfile;\n    }\n\n    private @Nullable RecentlyClosedWindow getRecentlyClosedWindowById(\n            int instanceId, long expectedClosureTime) {\n        if (mDestroyed || mProfile.shutdownStarted()) return null;\n        for (RecentlyClosedWindow window : getRecentlyClosedWindows()) {\n            if (window.getInstanceId() == instanceId\n                    && window.getTimestamp() == expectedClosureTime) return window;\n        }\n        return null;\n    }\n\n    private final class WindowRestoreOperation\n            implements RestoreOperation, TabWindowManager.Observer, TabModelSelectorObserver,\n                    ApplicationStatus.ActivityStateListener, ChromeAndroidTaskTrackerObserver,\n                    AndroidBrowserWindowObserver {\n        private final int mInstanceId;\n        private final TabModelSelector mClosedSelector;\n        private final TabWindowManager mWindowManager;\n        private final ChromeAndroidTaskTracker mTaskTracker;\n        private final CancelableRunnable mTimeout = new CancelableRunnable(() -> finish(0));\n        private final CancelableRunnable mCheck = new CancelableRunnable(() -> {\n            mCheckQueued = false;\n            checkReady();\n        });\n        private @Nullable JniOnceCallback<Long> mCallback;\n        private @Nullable TabModelSelector mRestoredSelector;\n        private @Nullable Activity mActivity;\n        private @Nullable ChromeAndroidTask mTask;\n        private boolean mCheckQueued;\n        private boolean mLaunchAccepted;\n\n        WindowRestoreOperation(int instanceId, TabModelSelector closedSelector,\n                TabWindowManager windowManager, JniOnceCallback<Long> callback) {\n            mInstanceId = instanceId;\n            mClosedSelector = closedSelector;\n            mWindowManager = windowManager;\n            mTaskTracker = ChromeAndroidTaskTrackerFactory.getInstance();\n            mCallback = callback;\n        }\n\n        void start() {\n            // Observe before launching: selector/task creation can occur during startActivity.\n            mWindowManager.addObserver(this);\n            mTaskTracker.addObserver(this);\n            ApplicationStatus.registerStateListenerForAllActivities(this);\n            PostTask.postDelayedTask(TaskTraits.UI_DEFAULT, mTimeout, TimeUnit.MINUTES.toMillis(1));\n            try {\n                // This path consumes the closed-window record only after Android accepts launch.\n                // It reloads the original persistent session instead of recreating tabs by URL.\n                mMultiInstanceManager.openWindow(mInstanceId, NewWindowAppSource.BROWSER_WINDOW_CREATOR);\n            } catch (ActivityNotFoundException | SecurityException e) {\n                finish(0);\n                return;\n            }\n            mLaunchAccepted = true;\n            scheduleCheck();\n        }\n\n        private void scheduleCheck() {\n            if (mCallback == null || mCheckQueued) return;\n            mCheckQueued = true;\n            PostTask.postTask(TaskTraits.UI_DEFAULT, mCheck);\n        }\n\n        @SuppressWarnings(\"deprecation\") // Read the exact existing Activity/profile window; never create one.\n        private void checkReady() {\n            if (mCallback == null || !mLaunchAccepted) return;\n            if (mDestroyed || mProfile.shutdownStarted() || !hasLiveOwner()) {\n                finish(0);\n                return;\n            }\n            TabModelSelector selector = mWindowManager.getTabModelSelectorById(mInstanceId);\n            if (selector == null || selector == mClosedSelector) return;\n            if (mRestoredSelector != null && selector != mRestoredSelector) {\n                finish(0);\n                return;\n            }\n            Activity activity = MultiWindowUtils.getActivityById(mInstanceId);\n            if (activity == null) return;\n            if (activity.isFinishing() || activity.isDestroyed()\n                    || mWindowManager.getIdForWindow(activity) != mInstanceId\n                    || mWindowManager.getWindowIdForSelector(selector) != mInstanceId\n                    || (mActivity != null && mActivity != activity)) {\n                finish(0);\n                return;\n            }\n            mActivity = activity;\n            if (mRestoredSelector == null) {\n                mRestoredSelector = selector;\n                selector.addObserver(this);\n                if (mCallback == null) return;\n            }\n            ChromeAndroidTask task = mTaskTracker.get(activity.getTaskId());\n            if (task == null) return;\n            if (task.isDestroyed() || (mTask != null && mTask != task)) {\n                finish(0);\n                return;\n            }\n            if (mTask == null) {\n                mTask = task;\n                task.addAndroidBrowserWindowObserver(this);\n                if (mCallback == null) return;\n            }\n            if (!selector.isTabStateInitialized()) return;\n            if (selector.getModel(false).getProfile() != mProfile) {\n                finish(0);\n                return;\n            }\n            long browserWindow = task.getNativeBrowserWindowPtr(mProfile, activity);\n            if (browserWindow != 0) finish(browserWindow);\n        }\n\n        @Override\n        public void cancel() {\n            finish(0);\n        }\n\n        private void finish(long browserWindow) {\n            JniOnceCallback<Long> callback = mCallback;\n            if (callback == null) return;\n            mCallback = null;\n            mTimeout.cancel();\n            mCheck.cancel();\n            mWindowManager.removeObserver(this);\n            mTaskTracker.removeObserver(this);\n            ApplicationStatus.unregisterActivityStateListener(this);\n            if (mRestoredSelector != null) mRestoredSelector.removeObserver(this);\n            if (mTask != null) mTask.removeAndroidBrowserWindowObserver(this);\n            mRestoredSelector = null;\n            mTask = null;\n            mActivity = null;\n            mWindowRestores.remove(this);\n            // Native may reenter cancellation or destroy the manager. Retire all ownership first.\n            callback.onResult(browserWindow);\n        }\n\n        @Override\n        public void onTabModelSelectorAdded(TabModelSelector selector) {\n            scheduleCheck();\n        }\n\n        @Override\n        public void onTabStateInitialized() {\n            scheduleCheck();\n        }\n\n        @Override\n        public void onDestroyed() {\n            finish(0);\n        }\n\n        @Override\n        public void onActivityStateChange(Activity activity, int newState) {\n            if (newState == ActivityState.DESTROYED && (activity == mActivity\n                    || mWindowManager.getIdForWindow(activity) == mInstanceId)) {\n                finish(0);\n            } else {\n                scheduleCheck();\n            }\n        }\n\n        @Override\n        public void onTaskAdded(ChromeAndroidTask task) {\n            scheduleCheck();\n        }\n\n        @Override\n        public void onTaskRemoved(ChromeAndroidTask task) {\n            if (task == mTask) finish(0);\n        }\n\n        @Override\n        public void onBrowserWindowAdded(AndroidBrowserWindowInfo windowInfo) {\n            scheduleCheck();\n        }\n\n        @Override\n        public void onBrowserWindowRemoved(AndroidBrowserWindowInfo windowInfo) {\n            if (windowInfo.mProfile == mProfile\n                    && windowInfo.mActivityWindowAndroid != null\n                    && windowInfo.mActivityWindowAndroid.getActivity().get() == mActivity) finish(0);\n        }\n    }\n\n"
