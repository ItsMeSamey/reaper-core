substitutions:
- description: Keep ordinary menu PageInfo creation without the merchant action supplier
  regex:
    pattern: "                            SupplierUtils.upcast(\n                                    mRootUiCoordinator.getMerchantTrustSignalsCoordinatorSupplier(),\n\
      \                                    StoreInfoActionHandler.class),\n"
    replace: ''
  count: 1
- description: Remove only the now-unused StoreInfoActionHandler import
  regex:
    pattern: 'import org.chromium.chrome.browser.merchant_viewer.PageInfoStoreInfoController.StoreInfoActionHandler;

      '
    replace: ''
  count: 1
- description: Remove only the now-unused SupplierUtils import
  regex:
    pattern: 'import org.chromium.base.supplier.SupplierUtils;

      '
    replace: ''
  count: 1
