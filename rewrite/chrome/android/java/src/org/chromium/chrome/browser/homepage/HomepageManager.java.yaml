substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Preserve exact inherited patch-only Source230/233 source changes before
      new AI adapter.
    regex:
      re_pattern: '\ \ \ \ private\ final\ SharedPreferencesManager\ mSharedPreferencesManager;\

        \ \ \ \ private\ final\ ObserverList<HomepageStateListener>\ mHomepageStateListeners;\

        \

        \ \ \ \ private\ HomepageManager\(\)\ \{\

        \ \ \ \ \ \ \ \ mSharedPreferencesManager\ =\ ChromeSharedPreferences\.getInstance\(\);\

        \ \ \ \ \ \ \ \ mHomepageStateListeners\ =\ new\ ObserverList<>\(\);\

        \ \ \ \ \ \ \ \ HomepagePolicyManager\.getInstance\(\)\.addListener\(this\);\

        '
      replace: "    private final SharedPreferencesManager mSharedPreferencesManager;\n\
        \    private final ObserverList<HomepageStateListener> mHomepageStateListeners;\n\
        \n    HomepageManager() {\n        mSharedPreferencesManager = ChromeSharedPreferences.getInstance();\n\
        \        mHomepageStateListeners = new ObserverList<>();\n        HomepagePolicyManager.getInstance().addListener(this);\n"
  - description: Remove actual optional Actor service lookup
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ ActorUiTabController\ actorUiTabController\
        =\ ActorUiTabController\.from\(currentTab\);\

        '
      replace: ''
  - description: Remove optional Actor task-abort dialog interception; real ordinary
      homepage navigation remains
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ if\ \(actorUiTabController\ !=\ null\ \&\&\
        actorUiTabController\.isActorActive\(\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(actorUiTabController\.showTaskAbortConfirmationDialog\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(confirmed\)\ \->\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(confirmed\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ currentTab\.loadUrl\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ new\ LoadUrlParams\(homePageUrl,\ PageTransition\.HOME_PAGE\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove imports with no retained source reference
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController;\

        '
      replace: ''
