# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ LogcatExtractionRunnable\.uploadMinidump\(minidump,\ true\);\

      '
    replace: '        // PureJavaExceptionReporter already wrote the local dump with sanitized logcat.

      '
- {"count": 3, "description": "Exclude Android crash reporting implementation", "regex": {"re_pattern": "Asynchronously\\ report\\ and\\ upload\\ the\\ stack\\ trace\\ as\\ if\\ it\\ was\\ a\\ crash\\.", "replace": "Asynchronously record the stack trace locally as if it was a crash."}}
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \ \ \ \*\ Asynchronously\ record\ the\ stack\ trace\ locally\ as\ if\ it\ was\ a\ crash\.\ If\ \|withLogging\|,\

      \ \ \ \ \ \*\ include\ the\ exception\ message\ as\ log\ warning\.\ This\ can\ be\ helpful\ e\.g\.\ to\ locate\ the\ logs\

      \ \ \ \ \ \*\ around\ when\ the\ exception\ is\ reported\.\

      '
    replace: "     * Asynchronously record the stack trace locally as if it was a crash. If |withLogging|, include\n     * the exception message as log warning. This can be helpful e.g. to locate the logs around when\n     * the exception is reported.\n"
