# Remove Android rating code and Google Play Review SDK.
substitutions:
- description: 'Import Brave''s tab group sync controller.


    The import is repointed instead of added because leaving the upstream one

    unreferenced trips the UnusedImports check.'
  regex:
    re_pattern: import org\.chromium\.chrome\.browser\.tab_group_sync\.(TabGroupSyncControllerImpl);
    replace: import org.chromium.chrome.browser.tab_group_sync.Brave\1;
- description: 'Instantiate Brave''s tab group sync controller.


    BraveTabGroupSyncControllerImpl hides and shows the tab groups synced from

    the user''s other devices along with the "Show synced tab groups" setting,

    which upstream only consults when a new group arrives from sync.'
  regex:
    re_pattern: new (TabGroupSyncControllerImpl\()
    replace: new Brave\1
- description: Move extension manager imports to the per-profile bridge selector.
  regex:
    pattern: 'import org.chromium.chrome.browser.ui.extensions.side_panel.ExtensionSidePanelManagerBridge;

      import org.chromium.chrome.browser.ui.extensions.side_panel.ExtensionSidePanelManagerBridgeFactory;

      '
    replace: ''
- description: The profile selector now creates an extension manager for each native window.
  regex:
    pattern: "            chromeAndroidTask.addFeature(\n                    new ChromeAndroidTaskFeatureKey(\n                            ExtensionSidePanelManagerBridge.class,\n                            currentlySelectedProfile,\n                            mWindowAndroid),\n                    ExtensionSidePanelManagerBridgeFactory::create);\n\n"
    replace: ''
- description: Remove the retired rating controller import
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.ui\.app_rating\.AppRatingPromoController;\

      '
    replace: ''
- description: Remove the startup rating invocation with its production implementation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(AppRatingPromoController\.maybeShowPromo\(profile,\ mActivity\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ UserEducationUtils\.recordOptionalPromoType\(OptionalPromoType\.APP_RATING_PROMPT\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \ \ \ \ \}\

      \

      '
    replace: ''

# Reaper Android ordinary Omnibox caller closure after physical AI purge.
- description: Adapt the sole actual constructor caller; preserve optional ToolbarManager
    readiness and all other arguments
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mTabObscuringHandlerSupplier\.get\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mToolbarManager\);'
    replace: "                            mTabObscuringHandlerSupplier.get(),\n  \
      \                          mToolbarManager == null ? null : mToolbarManager::endInput);"

# Reaper Android physical AI caller closure; genuine core behavior retained.
