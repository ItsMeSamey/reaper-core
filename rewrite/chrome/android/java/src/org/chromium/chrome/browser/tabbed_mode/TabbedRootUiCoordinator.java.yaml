- description: Remove exclusive Glic promo/menu/service entry point and its implementation
  regex:
    re_pattern: '\ \ \ \ @VisibleForTesting\

      \ \ \ \ boolean\ maybeShowGlicPromo\(\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(CommandLine\.getInstance\(\)\.hasSwitch\(ChromeSwitches\.DISABLE_FIRST_RUN_EXPERIENCE\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ CommandLine\.getInstance\(\)\.hasSwitch\(ChromeSwitches\.DISABLE_STARTUP_PROMOS\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ Profile\ profile\ =\ mProfileSupplier\.get\(\);\

      \ \ \ \ \ \ \ \ if\ \(profile\ ==\ null\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ mActivity\ ==\ null\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ mActivity\.isFinishing\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ mActivity\.isDestroyed\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ boolean\ hasEvaluatedGlicPromo\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeSharedPreferences\.getInstance\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.contains\(ChromePreferenceKeys\.GLIC_PROMO_ACCEPTED\);\

      \

      \ \ \ \ \ \ \ \ if\ \(!GlicEnabling\.isEnabledByFlags\(\)\ \&\&\ hasEvaluatedGlicPromo\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ ChromeSharedPreferences\.getInstance\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.removeKey\(ChromePreferenceKeys\.GLIC_PROMO_ACCEPTED\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.getFieldTrialParamByFeatureAsBoolean\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.GLIC,\ "adaptive\-toolbar\-auto\-pin",\
      true\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ //\ When\ the\ Android\ Bottom\ Bar\ is\ enabled\ the\ promo\
      is\ not\ required\ as\ the\ button\ is\

      \ \ \ \ \ \ \ \ //\ available\ by\ default\.\

      \ \ \ \ \ \ \ \ boolean\ glicEnabled\ =\ GlicEnabling\.isEnabledForProfile\(profile\);\

      \ \ \ \ \ \ \ \ boolean\ bottomBarEnabled\ =\ BottomBarConfigUtils\.isBottomBarEnabled\(mActivity\);\

      \ \ \ \ \ \ \ \ if\ \(!glicEnabled\ \|\|\ bottomBarEnabled\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ if\ \(hasEvaluatedGlicPromo\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ boolean\ isGlicPinned\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AdaptiveToolbarPrefs\.getCustomizationSetting\(\)\
      ==\ AdaptiveToolbarButtonVariant\.GLIC;\

      \ \ \ \ \ \ \ \ boolean\ isToolbarPinned\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AdaptiveToolbarPrefs\.getCustomizationSetting\(\)\
      !=\ AdaptiveToolbarButtonVariant\.AUTO;\

      \ \ \ \ \ \ \ \ //\ We\ use\ wouldTriggerHelpUi\ and\ notifyEvent\ manually\
      instead\ of\ shouldTriggerHelpUi\

      \ \ \ \ \ \ \ \ //\ to\ avoid\ locking\ the\ IPH\ session\ and\ blocking\ other\
      IPHs\ from\ showing\.\

      \ \ \ \ \ \ \ \ Tracker\ tracker\ =\ TrackerFactory\.getTrackerForProfile\(profile\);\

      \ \ \ \ \ \ \ \ boolean\ shouldPinGlic\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tracker\.wouldTriggerHelpUi\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FeatureConstants\.ADAPTIVE_BUTTON_PIN_GLIC_TOOLBAR_BUTTON_FEATURE\);\

      \ \ \ \ \ \ \ \ tracker\.notifyEvent\(EventConstants\.ADAPTIVE_TOOLBAR_GLIC_IPH_TRIGGER\);\

      \

      \ \ \ \ \ \ \ \ //\ Auto\-enable\ the\ Glic\ button\ and\ bypass\ the\ promo\
      if:\

      \ \ \ \ \ \ \ \ //\ 1\.\ Glic\ is\ already\ pinned\ to\ the\ toolbar\.\

      \ \ \ \ \ \ \ \ //\ 2\.\ The\ feature\ engagement\ tracker\ recommends\ pinning\
      Glic\ AND\ the\ user\ has\ not\

      \ \ \ \ \ \ \ \ //\ \ \ \ manually\ customized\ the\ toolbar\ with\ a\ different\
      button\ \(to\ avoid\ overriding\

      \ \ \ \ \ \ \ \ //\ \ \ \ the\ user''s\ explicit\ preference\)\.\

      \ \ \ \ \ \ \ \ if\ \(isGlicPinned\ \|\|\ \(shouldPinGlic\ \&\&\ !isToolbarPinned\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ enableGlicButton\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ if\ \(!ChromeFeatureList\.getFieldTrialParamByFeatureAsBoolean\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.GLIC,\ "glic\-bottom\-sheet\-promo",\
      true\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ showGlicPromo\(\);\

      \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \}'
    replace: ''
- description: Remove exclusive Glic promo/menu/service entry point and its implementation
  regex:
    re_pattern: '\ \ \ \ private\ void\ showGlicPromo\(\)\ \{\

      \ \ \ \ \ \ \ \ ChromeSharedPreferences\.getInstance\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.writeBoolean\(ChromePreferenceKeys\.GLIC_PROMO_ACCEPTED,\
      false\);\

      \

      \ \ \ \ \ \ \ \ Runnable\ onAccepted\ =\ this::enableGlicButton;\

      \ \ \ \ \ \ \ \ Runnable\ onDismissed\ =\ CallbackUtils\.emptyRunnable\(\);\

      \

      \ \ \ \ \ \ \ \ var\ bottomSheetController\ =\ getBottomSheetController\(\);\

      \ \ \ \ \ \ \ \ assert\ bottomSheetController\ !=\ null;\

      \ \ \ \ \ \ \ \ mGlicPromoCoordinator\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ GlicPromoCoordinator\(mActivity,\ bottomSheetController,\
      onAccepted,\ onDismissed\);\

      \ \ \ \ \ \ \ \ mGlicPromoCoordinator\.showBottomSheet\(\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove exclusive Glic promo/menu/service entry point and its implementation
