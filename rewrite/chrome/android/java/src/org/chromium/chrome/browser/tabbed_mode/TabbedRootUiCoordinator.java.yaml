      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mSideUiStateProviderSupplier\.get\(\)\);\

      \ \ \ \ \ \ \ \ \}'
