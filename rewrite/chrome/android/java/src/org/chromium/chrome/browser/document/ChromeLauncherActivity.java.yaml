substitutions:

# Reaper Source313 optional Actor/Glic caller closure.
  - description: Reaper Android physical optional AI caller closure; retain exact ordinary
      launch/tab-menu behavior and disclosed ordinary fixture assertions.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ intent,\ IntentHandler\.BRING_TAB_TO_FRONT_EXTRA,\
        Tab\.INVALID_TAB_ID\);\

        \ \ \ \ \ \ \ \ final\ @TabId\ int\ targetTabId\ =\ IntentHandler\.getBringTabToFrontId\(intent\);\

        \

        \ \ \ \ \ \ \ \ //\ Notifications\ posted\ before\ tabs\ are\ created\ contain\
        Tab\.INVALID_TAB_ID\.\ When\ clicked,\

        \ \ \ \ \ \ \ \ //\ we\ dynamically\ resolve\ the\ current\ tab\ ID\ from\ the\
        active\ Actor\ task\.\

        \ \ \ \ \ \ \ \ //\

        \ \ \ \ \ \ \ \ //\ Stamp\ the\ resolved\ ID\ onto\ the\ intent\ before\ forwarding\
        to\ ChromeTabbedActivity,\

        \ \ \ \ \ \ \ \ //\ because\ ActorMetrics\ consumes\ EXTRA_ACTOR_TASK_ID\ upon\
        receipt,\ preventing\

        \ \ \ \ \ \ \ \ //\ ChromeTabbedActivity\ from\ resolving\ the\ tab\ dynamically\
        itself\.\

        \ \ \ \ \ \ \ \ if\ \(targetTabId\ !=\ intentTabId\ \&\&\ targetTabId\ !=\ Tab\.INVALID_TAB_ID\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ IntentHandler\.setBringTabToFrontId\(intent,\ targetTabId\);\

        \ \ \ \ \ \ \ \ \}\

        '
      replace: "                        intent, IntentHandler.BRING_TAB_TO_FRONT_EXTRA,\
        \ Tab.INVALID_TAB_ID);\n        final @TabId int targetTabId = IntentHandler.getBringTabToFrontId(intent);\n\
        \n        // Keep any resolved tab ID on the intent before forwarding to the\
        \ tabbed activity.\n        if (targetTabId != intentTabId && targetTabId !=\
        \ Tab.INVALID_TAB_ID) {\n            IntentHandler.setBringTabToFrontId(intent,\
        \ targetTabId);\n        }\n"
  - description: Reaper Android physical optional AI caller closure; retain exact ordinary
      launch/tab-menu behavior and disclosed ordinary fixture assertions.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ //\ Check\ if\ we\ should\ launch\ a\ Custom\ Tab\.\

        \ \ \ \ \ \ \ \ if\ \(LaunchIntentDispatcher\.isCustomTabIntent\(intent\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ LaunchIntentDispatcher\.dispatchToCustomTabActivity\(this,\
        intent\);\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ if\ \(LaunchIntentDispatcher\.dispatchGlicExternalTrigger\(this,\
        intent\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ !=\ LaunchIntentDispatcher\.Action\.CONTINUE\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \

        '
      replace: "        // Check if we should launch a Custom Tab.\n        if (LaunchIntentDispatcher.isCustomTabIntent(intent))\
        \ {\n            LaunchIntentDispatcher.dispatchToCustomTabActivity(this, intent);\n\
        \            return;\n        }\n\n"
