  - description: Remove complete actual optional service/feature predicate
    regex:
      re_pattern: '\ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Whether\ to\ show\ the\ "Ask\ Gemini"\ item\ in\ the\ text\ selection\
        menu\.\ Supports\ both\ mobile\

        \ \ \ \ \ \*\ \(floating\ action\ mode\ with\ bottom\ sheet\)\ and\ desktop\
        Android\ \(right\-click\ dropdown\ menu\ with\

        \ \ \ \ \ \*\ side\ panel\)\.\

        \ \ \ \ \ \*/\

        \ \ \ \ private\ boolean\ shouldShowAskGeminiForSelection\(\

        \ \ \ \ \ \ \ \ \ \ \ \ boolean\ isSelectionPassword,\ String\ selectedText\)\
        \{\

        \ \ \ \ \ \ \ \ boolean\ isContainerAvailable\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AndroidSidePanelEnabledFn\.isEnabled\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ TabBottomSheetUtils\.isTabBottomSheetEnabled\(\);\

        \ \ \ \ \ \ \ \ if\ \(!isContainerAvailable\)\ return\ false;\

        \ \ \ \ \ \ \ \ if\ \(TextUtils\.isEmpty\(selectedText\)\ \|\|\ isSelectionPassword\)\
        return\ false;\

        \ \ \ \ \ \ \ \ if\ \(mTab\.isDestroyed\(\)\ \|\|\ mTab\.isIncognito\(\)\)\
        return\ false;\

        \ \ \ \ \ \ \ \ Profile\ profile\ =\ mTab\.getProfile\(\);\

        \ \ \ \ \ \ \ \ if\ \(profile\ ==\ null\)\ return\ false;\

        \ \ \ \ \ \ \ \ return\ ChromeFeatureList\.isEnabled\(ChromeFeatureList\.CLANK_GLIC_CONTEXT_MENU\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ ChromeFeatureList\.getFieldTrialParamByFeatureAsBoolean\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.CLANK_GLIC_CONTEXT_MENU,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PARAM_SHOW_ASK_GEMINI_ON_SELECTION,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ true\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !DeviceInfo\.isAutomotive\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ GlicEnabling\.isEnabledForProfile\(profile\);\

        \ \ \ \ \}'
      replace: ''
  - description: Remove complete product-only menu positioning implementation
    regex:
      re_pattern: '\ \ \ \ private\ void\ setAskGeminiOrderAndCategory\(SelectionMenuItem\.Builder\
        builder\)\ \{\

        \ \ \ \ \ \ \ \ String\ position\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.getFieldTrialParamByFeature\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.CLANK_GLIC_CONTEXT_MENU,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PARAM_ASK_GEMINI_SELECTION_MENU_POSITION\);\

        \ \ \ \ \ \ \ \ //\ By\ default\ "Ask\ Gemini"\ is\ interposed\ among\ the\
        default\ items,\ in\ the\ gap\ just\ before\

        \ \ \ \ \ \ \ \ //\ Web\ Search\ \(see\ SelectionMenuItem\.ItemOrder\.ASK_GEMINI\)\.\
        The\ field\ trial\ can\ opt\ into\

        \ \ \ \ \ \ \ \ //\ the\ primary\ assist\ slot\ \("assist",\ shown\ first\)\
        or\ the\ secondary\ assist\ section\

        \ \ \ \ \ \ \ \ //\ \("secondary",\ shown\ after\ Web\ Search\)\ instead\.\

        \ \ \ \ \ \ \ \ if\ \(ASK_GEMINI_POSITION_ASSIST\.equals\(position\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ builder\.setOrderAndCategory\(0,\ ItemGroupOffset\.ASSIST_ITEMS\);\

        \ \ \ \ \ \ \ \ \}\ else\ if\ \(ASK_GEMINI_POSITION_SECONDARY\.equals\(position\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ builder\.setOrderAndCategory\(0,\ ItemGroupOffset\.SECONDARY_ASSIST_ITEMS\);\

        \ \ \ \ \ \ \ \ \}\ else\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ builder\.setOrderAndCategory\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SelectionMenuItem\.ItemOrder\.ASK_GEMINI,\
        ItemGroupOffset\.DEFAULT_ITEMS\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}'
      replace: ''
