# Preserve native extension commands for touch text selections.
substitutions:
  - description: "Own one captured selection context at a time."
    regex:
      pattern: "    private @Nullable String mSelectedText;"
      replace: "    private @Nullable String mSelectedText;\n    private @Nullable ReaperSelectionMenu mExtensionSelectionMenu;"
  - description: "Expose a native extension menu only for eligible, non-password selections."
    regex:
      pattern: "        List<SelectionMenuItem> items = new ArrayList<>();\n        if (shouldShowReadingMode"
      replace: "        List<SelectionMenuItem> items = new ArrayList<>();\n        if (mExtensionSelectionMenu != null) mExtensionSelectionMenu.destroy();\n        mExtensionSelectionMenu = ReaperSelectionMenu.create(\n                mTab, selectedText, isSelectionPassword, isSelectionReadOnly);\n        if (mExtensionSelectionMenu != null) {\n            items.add(new SelectionMenuItem.Builder(R.string.reaper_selection_extensions)\n                    .setId(R.id.reaper_selection_extensions)\n                    .setGroupId(org.chromium.content.R.id.select_action_menu_delegate_items)\n                    .setOrderAndCategory(0, ItemGroupOffset.ALTERNATIVE_ITEMS)\n                    .setShowAsActionFlags(MenuItem.SHOW_AS_ACTION_NEVER | MenuItem.SHOW_AS_ACTION_WITH_TEXT)\n                    .build());\n        }\n        if (shouldShowReadingMode"
  - description: "Rebuild the captured frame and text for every new selection."
    regex:
      pattern: "    public boolean canReuseCachedSelectionMenu(@MenuType int menuType) {\n        return true;\n    }"
      replace: "    public boolean canReuseCachedSelectionMenu(@MenuType int menuType) {\n        return false;\n    }"
  - description: "Open the hierarchical model without converting away native command metadata."
    regex:
      pattern: "        if (!item.isEnabled) return false;\n        if (item.id == R.id.contextmenu_open_in_reading_mode) {"
      replace: "        if (!item.isEnabled) return false;\n        if (item.id == R.id.reaper_selection_extensions) {\n            return mExtensionSelectionMenu != null && mExtensionSelectionMenu.show(containerView);\n        }\n        if (item.id == R.id.contextmenu_open_in_reading_mode) {"

