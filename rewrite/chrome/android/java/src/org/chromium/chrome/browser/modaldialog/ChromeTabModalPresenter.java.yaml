    replace: "    public void destroy() {\n        mDestroyed = true;\n        if (getDialogModel() != null) {\n            dismissCurrentDialog(DialogDismissalCause.ACTIVITY_DESTROYED);\n        }\n        mBrowserControlsVisibilityManager.removeObserver(this);\n    }\n\n    @Override\n    protected void addDialogView(\n            PropertyModel model,\n            @Nullable Callback<ComponentDialog> onDialogCreatedCallback,\n            @Nullable Callback<View> onDialogShownCallback) {\n        mDialogViewAdded = false;\n        if (mDestroyed) {\n            dismissUnavailableModel(model);\n            return;\n        }\n        Tab current = mTabModelSelector.getCurrentTab();\n        Object requestedOwner = model.containsKey(ModalDialogProperties.TAB_MODAL_OWNER)\n                ? model.get(ModalDialogProperties.TAB_MODAL_OWNER) : null;\n        Tab owner = requestedOwner instanceof WebContents contents && !contents.isDestroyed()\n                ? TabUtils.fromWebContents(contents) : requestedOwner == null ? current : null;\n        if (owner == null || owner.isDestroyed() || current == null || current.isDestroyed()\n                || requestedOwner != null\n                        && mTabModelSelector.getCurrentModel().getTabById(owner.getId()) != owner) {\n            dismissUnavailableModel(model);\n            return;\n        }\n        WebContents contents = owner.getWebContents();\n        if (requestedOwner != null\n                && (contents == null || contents != requestedOwner || contents.isDestroyed())) {\n            dismissUnavailableModel(model);\n            return;\n        }\n        SplitTabCoordinator coordinator = contents == null\n                ? null : SplitTabCoordinator.fromWebContents(contents);\n        if (coordinator != null\n                && (contents == null || coordinator.getDialogHost(contents) == null)) {\n            dismissUnavailableModel(model);\n            return;\n        }\n        WebContents currentContents = current.getWebContents();\n        if (owner != current && (coordinator == null || currentContents == null\n                || !coordinator.contains(currentContents))) {\n            dismissUnavailableModel(model);\n            return;\n        }\n        if (requestedOwner == null && contents != null\n                && model.containsKey(ModalDialogProperties.TAB_MODAL_OWNER)) {\n            // Preserve legacy selected-tab ownership if this dialog is later suspended.\n            model.set(ModalDialogProperties.TAB_MODAL_OWNER, contents);\n        }\n        mDialogOwnerTab = owner;\n        mDialogOwnerContents = contents;\n        mSplitCoordinator = coordinator;\n        mDialogViewAdded = true;\n        owner.addObserver(mDialogOwnerObserver);\n        // Registration cannot reenter with an unavailable pane after the above\n        // same-thread validation. Teardown later dismisses before removing its host.\n        if (coordinator != null && contents != null) {\n            coordinator.addPaneUnavailableObserver(contents, mPaneUnavailable);\n        }\n        super.addDialogView(model, onDialogCreatedCallback, onDialogShownCallback);\n    }\n\n    private void dismissUnavailableModel(PropertyModel model) {\n        // The manager must finish assigning the presenter before its ordinary\n        // denial callback can remove a model for which no view was constructed.\n        ThreadUtils.postOnUiThread(() -> {\n            if (getDialogModel() == model) {\n                dismissCurrentDialog(mDestroyed ? DialogDismissalCause.ACTIVITY_DESTROYED\n                        : DialogDismissalCause.NOT_ATTACHED_TO_WINDOW);\n            }\n        });\n    }\n\n    boolean canKeepDialogForTab(@Nullable Tab tab) {\n        WebContents contents = tab == null ? null : tab.getWebContents();\n        return getDialogModel() != null && tab != null\n                && (mDialogOwnerTab == tab || mSplitCoordinator != null && contents != null\n                        && mSplitCoordinator.contains(contents));\n    }\n\n    boolean shouldHandleBackPress() {\n        return mSplitCoordinator == null || mDialogOwnerContents != null\n                && mSplitCoordinator.isActive(mDialogOwnerContents);\n    }"
