# Android Chromium Discover implementation exclusion.
substitutions:
- description: Use the neutral local NTP contract
  regex:
    re_pattern: FeedSurfaceProvider\.RestoringState
    replace: StaticNtpSurfaceCoordinator.RestoringState
  count: 4
- description: Use the neutral local NTP contract
  regex:
    re_pattern: feed\ surface
    replace: local scroll position
- description: Remove Feed restoration telemetry observer
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ Fallback\ added\ for\ metric\ records\ only\.\

      \ \ \ \ \ \ \ \ restoringState\.addSyncObserverAndPostIfNonNull\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ Callback<Integer>\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ long\ mStart;\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ onResult\(@Nullable\ Integer\ result\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assumeNonNull\(result\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(result\ ==\ StaticNtpSurfaceCoordinator\.RestoringState\.WAITING_TO_RESTORE\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mStart\ =\ TimeUtils\.currentTimeMillis\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ if\ \(result\ ==\ StaticNtpSurfaceCoordinator\.RestoringState\.RESTORED\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ BackPressMetrics\.recordNTPFeedRestorationDuration\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TimeUtils\.currentTimeMillis\(\)\ \-\ mStart\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      '
    replace: ''
- description: Remove the retired surface import assumeNonNull
  regex:
    re_pattern: 'import\ static\ org\.chromium\.build\.NullUtil\.assumeNonNull;\

      '
    replace: ''
- description: Remove the retired surface import TimeUtils
  regex:
    re_pattern: 'import\ org\.chromium\.base\.TimeUtils;\

      '
    replace: ''
- description: Remove the retired surface import Nullable
  regex:
    re_pattern: 'import\ org\.chromium\.build\.annotations\.Nullable;\

      '
    replace: ''
- description: Remove the retired surface import FeedSurfaceProvider
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.feed\.FeedSurfaceProvider;\

      '
    replace: ''
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: 'import\ org\.chromium\.ui\.interpolators\.Interpolators;\

      \

      /\*\*\

      \ \*\ Implementation\ of\ \{@link\ NativePage\.SmoothTransitionDelegate\}\ for\ the\ New\ Tab\ Page\.\ This\ delegate\

      \ \*\ handles\ the\ alpha\ animation\ transition,\ optionally\ waiting\ for\ the\ local\ scroll\ position\ to\ be\ restored\

      \ \*\ before\ starting\.\

      \ \*/\

      @NullMarked\

      @VisibleForTesting\

      public\ class\ NtpSmoothTransitionDelegate\ implements\ NativePage\.SmoothTransitionDelegate\ \{\

      '
    replace: "import org.chromium.ui.interpolators.Interpolators;\n\n/**\n * Implementation of {@link NativePage.SmoothTransitionDelegate} for the New Tab Page. This delegate\n * handles the alpha animation transition, optionally waiting for the local scroll position to be\n * restored before starting.\n */\n@NullMarked\n@VisibleForTesting\npublic class NtpSmoothTransitionDelegate implements NativePage.SmoothTransitionDelegate {\n"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ final\ Callback<Integer>\ mOnScrollStateChanged\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ new\ Callback<>\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ onResult\(Integer\ restoreState\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(restoreState\ ==\ StaticNtpSurfaceCoordinator\.RestoringState\.NO_STATE_TO_RESTORE\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ restoreState\ ==\ StaticNtpSurfaceCoordinator\.RestoringState\.RESTORED\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mAnimator\.start\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mRestoringState\.removeObserver\(this\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mAnimatorStarted\ =\ true;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mHandler\.removeCallbacks\(mFallback\);\

      '
    replace: "    final Callback<Integer> mOnScrollStateChanged =\n            new Callback<>() {\n                @Override\n                public void onResult(Integer restoreState) {\n                    if (restoreState\n                                    == StaticNtpSurfaceCoordinator.RestoringState\n                                            .NO_STATE_TO_RESTORE\n                            || restoreState\n                                    == StaticNtpSurfaceCoordinator.RestoringState.RESTORED) {\n                        mAnimator.start();\n                        mRestoringState.removeObserver(this);\n                        mAnimatorStarted = true;\n                        mHandler.removeCallbacks(mFallback);\n"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ View\ view,\ NonNullObservableSupplier<Integer>\ restoringState\)\ \{\

      \ \ \ \ \ \ \ \ mView\ =\ view;\

      \ \ \ \ \ \ \ \ mAnimator\ =\ buildSmoothTransition\(view\);\

      \ \ \ \ \ \ \ \ mRestoringState\ =\ restoringState;\

      \

      \ \ \ \ \}\

      \

      \ \ \ \ @Override\

      \ \ \ \ public\ void\ prepare\(\)\ \{\

      '
    replace: "            View view, NonNullObservableSupplier<Integer> restoringState) {\n        mView = view;\n        mAnimator = buildSmoothTransition(view);\n        mRestoringState = restoringState;\n    }\n\n    @Override\n    public void prepare() {\n"
