substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '\ \ \ \ //\ View\.OnSystemUiVisibilityChangeListener\

      \

      \ \ \ \ @Override\

      \ \ \ \ public\ void\ onSystemUiVisibilityChange\(int\ visibility\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(mTabInFullscreen\ ==\ null\ \|\|\ !getPersistentFullscreenMode\(\)\)\ return;\

      \ \ \ \ \ \ \ \ mHandler\.sendEmptyMessageDelayed\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MSG_ID_SET_VISIBILITY_FOR_SYSTEM_BARS,\ ANDROID_CONTROLS_SHOW_DURATION_MS\);\

      \ \ \ \ \}\

      '
    replace: "    // View.OnSystemUiVisibilityChangeListener\n\n    @Override\n    public void onSystemUiVisibilityChange(int\
      \ visibility) {\n        onBrowserFullscreenInsetsChanged();\n        if (mTabInFullscreen == null || !getPersistentFullscreenMode())\
      \ return;\n        mHandler.sendEmptyMessageDelayed(\n                MSG_ID_SET_VISIBILITY_FOR_SYSTEM_BARS, ANDROID_CONTROLS_SHOW_DURATION_MS);\n\
      \    }\n"
