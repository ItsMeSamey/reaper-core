substitutions:
- description: Provide an actual consent chooser for filtered native tabs and explicit Android whole-display sharing.
  regex:
    pattern: "package org.chromium.chrome.browser.media;\n\nimport static org.chromium.build.NullUtil.assumeNonNull;\n\nimport android.app.Activity;\nimport android.content.Context;\nimport android.content.Intent;\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.fragment.app.FragmentActivity;\n\nimport org.chromium.base.ContextUtils;\nimport org.chromium.base.Log;\nimport org.chromium.base.ServiceLoaderUtil;\nimport org.chromium.build.annotations.NullMarked;\nimport org.chromium.chrome.browser.media.MediaCapturePickerHeadlessFragment.CaptureAction;\nimport org.chromium.chrome.browser.tab.Tab;\nimport org.chromium.content_public.browser.WebContents;\nimport org.chromium.content_public.browser.media.capture.ScreenCapture;\n\n/** Stub for the new media capture picker UI. */\n@NullMarked\npublic class MediaCapturePickerInvoker {\n    private static final String TAG = \"MediaCapture\";\n\n    /**\n     * Shows the new media capture picker UI.\n     *\n     * @param context\
      \ The {@link Context} to use.\n     * @param params The parameters for showing the media capture picker.\n     * @param delegate The delegate to notify of the user's choice.\n     */\n    public static void show(\n            Context context,\n            MediaCapturePickerManager.Params params,\n            MediaCapturePickerManager.Delegate delegate) {\n        MediaCapturePickerDelegate impl =\n                ServiceLoaderUtil.maybeCreate(MediaCapturePickerDelegate.class);\n        if (impl != null) {\n            Intent intent = impl.createScreenCaptureIntent(context, params, delegate);\n            if (intent != null) {\n                Activity activity = ContextUtils.activityFromContext(context);\n                // We should always get a non-null ChromeActivity which is a FragmentActivity.\n                // Crash here if this is not true for investigation.\n                MediaCapturePickerHeadlessFragment fragment =\n                        MediaCapturePickerHeadlessFragment.getInstance(\n\
      \                                assumeNonNull((FragmentActivity) activity));\n                Log.d(\n                        TAG,\n                        \"PickerInvoker: Starting AndroidCapturePrompt for tab/ window/ screen\"\n                                + \" sharing\");\n                fragment.startAndroidCapturePrompt(\n                        (action, result) ->\n                                onPickAndroidCapturePrompt(\n                                        context,\n                                        action,\n                                        result,\n                                        params.webContents,\n                                        delegate,\n                                        impl),\n                        intent);\n                return;\n            }\n            Log.e(TAG, \"PickerInvoker: Failed to create ScreenCapture Intent, cancel request\");\n            // The delegate will record pre-show failure in createScreenCaptureIntent()\
      \ before\n            // returning null.\n            delegate.onCancel();\n            return;\n        }\n        Log.e(TAG, \"PickerInvoker: No PickerDelegate, cancel request\");\n        MediaCapturePickerManager.recordPreShowFailure(\n                MediaCapturePickerManager.PreShowFailure.PICKER_DELEGATE_NULL_ERROR);\n        delegate.onCancel();\n    }\n\n    private static void onPickAndroidCapturePrompt(\n            Context context,\n            @CaptureAction int action,\n            ActivityResult result,\n            WebContents webContents,\n            MediaCapturePickerManager.Delegate delegate,\n            MediaCapturePickerDelegate impl) {\n        Log.d(TAG, \"PickerInvoker: AndroidCapturePrompt received user action %d\", action);\n        if (action == CaptureAction.CAPTURE_CANCELLED) {\n            delegate.onCancel();\n            MediaCapturePickerManager.recordResult(MediaCapturePickerManager.Result.CANCELLED);\n        } else {\n            Tab tab = (action\
      \ == CaptureAction.CAPTURE_WINDOW) ? impl.getPickedTab() : null;\n            if (tab != null) {\n                // User selected from app provided contents, i.e. a tab.\n                Log.d(\n                        TAG,\n                        \"PickerInvoker: Tab %d with title '%s' was picked\",\n                        tab.getId(),\n                        tab.getTitle());\n                tab.loadIfNeeded(/* forceBackingSize= */ true);\n                WebContents pickedTabwebContents = tab.getWebContents();\n                assert pickedTabwebContents != null;\n\n                // Bring tab and its window to front. This is necessary for tabs belonging to a\n                // minimized window, or sharing will not be able to start.\n                // TODO(crbug.com/454192534): reconsider this behavior when the android system bug\n                // is fixed to keep it consistent with desktop Chrome.\n                MediaCapturePickerManager.bringTabToFront(context, tab);\n\
      \n                impl.startAppContentMediaProjection(webContents, result);\n\n                Log.d(TAG, \"PickerInvoker: call delegate.onPickTab\");\n                delegate.onPickTab(pickedTabwebContents, impl.shouldShareAudio());\n                MediaCapturePickerManager.recordResult(\n                        MediaCapturePickerManager.Result.TAB_SELECTED);\n            } else {\n                // User selected a window or screen.\n                Log.d(TAG, \"PickerInvoker: A window or screen was picked\");\n                // Detach any active tab projection session for this WebContents before starting\n                // the new window/screen MediaProjection, so the old MediaProjection's onStop()\n                // callback will not treat the replacement as a user-initiated stop.\n                impl.stopAppContentMediaProjection(webContents);\n                if (action == CaptureAction.CAPTURE_SCREEN) {\n                    delegate.onPickScreen();\n                  \
      \  MediaCapturePickerManager.recordResult(\n                            MediaCapturePickerManager.Result.SCREEN_SELECTED);\n                } else {\n                    ScreenCapture.onPick(webContents, result);\n                    delegate.onPickWindow();\n                    MediaCapturePickerManager.recordResult(\n                            MediaCapturePickerManager.Result.WINDOW_SELECTED);\n                }\n            }\n        }\n        impl.onFinish(webContents);\n    }\n}\n"
    replace: "package org.chromium.chrome.browser.media;\n\nimport android.app.Activity;\nimport android.app.AlertDialog;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.media.projection.MediaProjectionConfig;\nimport android.media.projection.MediaProjectionManager;\nimport android.os.Build;\nimport android.view.ViewGroup;\nimport android.widget.ArrayAdapter;\nimport android.widget.Button;\nimport android.widget.CheckBox;\nimport android.widget.LinearLayout;\nimport android.widget.ListView;\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.fragment.app.FragmentActivity;\n\nimport org.chromium.base.ActivityState;\nimport org.chromium.base.ApplicationStatus;\nimport org.chromium.base.ContextUtils;\nimport org.chromium.base.Log;\nimport org.chromium.build.annotations.NullMarked;\nimport org.chromium.build.annotations.Nullable;\nimport org.chromium.chrome.R;\nimport org.chromium.chrome.browser.app.tabmodel.AllTabObserver;\nimport org.chromium.chrome.browser.tab.Tab;\n\
      import org.chromium.content_public.browser.WebContents;\nimport org.chromium.content_public.browser.media.capture.ScreenCapture;\n\nimport java.util.ArrayList;\nimport java.util.Comparator;\n\n/** User consent for native tab capture and public Android whole-display capture. */\n@NullMarked\npublic class MediaCapturePickerInvoker {\n    private static final String TAG = \"MediaCapture\";\n\n    /** Returns a dismissal handle that never reports a result after native cancellation. */\n    public static Runnable show(\n            Context context,\n            MediaCapturePickerManager.Params params,\n            MediaCapturePickerManager.Delegate delegate) {\n        Activity activity = ContextUtils.activityFromContext(context);\n        if (!(activity instanceof FragmentActivity fragmentActivity)\n                || activity.isFinishing()\n                || activity.isDestroyed()\n                || fragmentActivity.getSupportFragmentManager().isStateSaved()) {\n            delegate.onCancel();\n\
      \            return () -> {};\n        }\n        Picker picker = new Picker(fragmentActivity, params, delegate);\n        try {\n            picker.show();\n        } catch (RuntimeException error) {\n            Log.w(TAG, \"Unable to show capture chooser\", error);\n            picker.cancel();\n        }\n        return picker::close;\n    }\n\n    private static final class Picker\n            implements MediaCapturePickerTabObserver.Delegate,\n                    MediaCapturePickerHeadlessFragment.Delegate,\n                    ApplicationStatus.ActivityStateListener {\n        private final FragmentActivity mActivity;\n        private final MediaCapturePickerManager.Params mParams;\n        private final MediaCapturePickerManager.Delegate mDelegate;\n        private final ArrayList<Tab> mTabs = new ArrayList<>();\n        private final ArrayAdapter<String> mAdapter;\n        private final CheckBox mAudio;\n        private final ListView mList;\n        private final MediaCapturePickerTabObserver\
      \ mTabObserver;\n        private @Nullable AllTabObserver mAllTabs;\n        private @Nullable AlertDialog mDialog;\n        private @Nullable MediaCapturePickerHeadlessFragment mFragment;\n        private @Nullable Tab mSelected;\n        private boolean mFinished;\n        private boolean mAwaitingSystem;\n\n        Picker(\n                FragmentActivity activity,\n                MediaCapturePickerManager.Params params,\n                MediaCapturePickerManager.Delegate delegate) {\n            mActivity = activity;\n            mParams = params;\n            mDelegate = delegate;\n            mAdapter =\n                    new ArrayAdapter<>(activity, android.R.layout.simple_list_item_single_choice);\n            mList = new ListView(activity);\n            mList.setChoiceMode(ListView.CHOICE_MODE_SINGLE);\n            mList.setAdapter(mAdapter);\n            mList.setOnItemClickListener(\n                    (parent, view, position, id) -> {\n                        if (position\
      \ < 0 || position >= mTabs.size()) return;\n                        mSelected = mTabs.get(position);\n                        updateShareButton();\n                    });\n            mAudio = new CheckBox(activity);\n            mAudio.setText(R.string.desktop_media_picker_also_share_tab_audio);\n            mAudio.setChecked(false);\n            mTabObserver = new MediaCapturePickerTabObserver(this, params, delegate);\n        }\n\n        void show() {\n            boolean tabsAllowed = (mParams.allowedSourceTypes & 1) != 0;\n            boolean screenAllowed =\n                    (mParams.allowedSourceTypes & 2) != 0\n                            && Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q;\n            if (!tabsAllowed && !screenAllowed) {\n                cancel();\n                return;\n            }\n            ApplicationStatus.registerStateListenerForActivity(this, mActivity);\n            LinearLayout content = new LinearLayout(mActivity);\n            content.setOrientation(LinearLayout.VERTICAL);\n\
      \            int padding = Math.round(16 * mActivity.getResources().getDisplayMetrics().density);\n            content.setPadding(padding, padding, padding, 0);\n            if (tabsAllowed) {\n                content.addView(\n                        mList,\n                        new LinearLayout.LayoutParams(\n                                ViewGroup.LayoutParams.MATCH_PARENT, padding * 14));\n                if (mParams.requestAudio) content.addView(mAudio);\n                mAllTabs = new AllTabObserver(mTabObserver);\n            }\n            if (screenAllowed) {\n                Button screen = new Button(mActivity);\n                screen.setText(R.string.desktop_media_picker_source_type_screen);\n                screen.setOnClickListener(view -> chooseScreen());\n                content.addView(screen);\n            }\n            mDialog =\n                    new AlertDialog.Builder(mActivity)\n                            .setTitle(R.string.desktop_media_picker_title)\n\
      \                            .setMessage(\n                                    mActivity.getString(\n                                            R.string.desktop_media_picker_text_delegated,\n                                            mParams.appName,\n                                            mParams.targetName))\n                            .setView(content)\n                            .setPositiveButton(R.string.desktop_media_picker_share, null)\n                            .setNegativeButton(android.R.string.cancel, (dialog, which) -> cancel())\n                            .create();\n            mDialog.setOnDismissListener(\n                    dialog -> {\n                        if (!mFinished && !mAwaitingSystem) cancel();\n                    });\n            mDialog.show();\n            mDialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(view -> chooseTab());\n            updateShareButton();\n        }\n\n        private void updateShareButton() {\n  \
      \          if (mDialog != null && mDialog.isShowing()) {\n                mDialog.getButton(AlertDialog.BUTTON_POSITIVE).setEnabled(mSelected != null);\n            }\n        }\n\n        private void refreshTabs() {\n            if (mFinished) return;\n            mTabs.sort(Comparator.comparingInt(Tab::getId));\n            if (!mTabs.contains(mSelected)) mSelected = null;\n            mAdapter.clear();\n            for (Tab tab : mTabs) {\n                mAdapter.add(tab.getTitle() + \"\\\\n\" + tab.getUrl().getSpec());\n            }\n            mAdapter.notifyDataSetChanged();\n            mList.clearChoices();\n            if (mSelected != null) mList.setItemChecked(mTabs.indexOf(mSelected), true);\n            updateShareButton();\n        }\n\n        @Override\n        public void onTabAdded(Tab tab) {\n            if (mFinished) return;\n            mTabs.add(tab);\n            refreshTabs();\n        }\n\n        @Override\n        public void onTabRemoved(Tab tab) {\n\
      \            mTabs.remove(tab);\n            refreshTabs();\n        }\n\n        @Override\n        public void onTabUpdated(Tab tab) {\n            refreshTabs();\n        }\n\n        private void chooseTab() {\n            if (mFinished || mSelected == null) return;\n            Tab tab = mSelected;\n            WebContents contents = tab.getWebContents();\n            if (tab.isClosing()\n                    || tab.isDestroyed()\n                    || contents == null\n                    || contents.isDestroyed()\n                    || mDelegate.shouldFilterWebContents(contents)) {\n                cancel();\n                return;\n            }\n            boolean audio = mParams.requestAudio && mAudio.isChecked();\n            close();\n            // Native tab capture does not obtain or consume an OS screen projection token.\n            MediaCapturePickerManager.bringTabToFront(mActivity, tab);\n            mDelegate.onPickTab(contents, audio);\n            MediaCapturePickerManager.recordResult(MediaCapturePickerManager.Result.TAB_SELECTED);\n\
      \        }\n\n        private void chooseScreen() {\n            if (mFinished || mAwaitingSystem || (mParams.allowedSourceTypes & 2) == 0) return;\n            MediaProjectionManager manager =\n                    (MediaProjectionManager)\n                            mActivity.getSystemService(Context.MEDIA_PROJECTION_SERVICE);\n            if (manager == null) {\n                cancel();\n                return;\n            }\n            try {\n                // Android 14's default picker can return a window OR a display, and public APIs\n                // do not identify which was chosen. Request the entire display explicitly.\n                Intent intent =\n                        Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE\n                                ? manager.createScreenCaptureIntent(\n                                        MediaProjectionConfig.createConfigForDefaultDisplay())\n                                : manager.createScreenCaptureIntent();\n\
      \                mFragment = MediaCapturePickerHeadlessFragment.getInstance(mActivity);\n                mAwaitingSystem = true;\n                if (!mFragment.startAndroidCapturePrompt(this, intent)) {\n                    mAwaitingSystem = false;\n                    cancel();\n                    return;\n                }\n                if (mDialog != null) mDialog.dismiss();\n                detachTabs();\n            } catch (RuntimeException error) {\n                Log.w(TAG, \"Unable to request screen capture consent\", error);\n                mAwaitingSystem = false;\n                cancel();\n            }\n        }\n\n        @Override\n        public void onPicked(int action, ActivityResult result) {\n            mAwaitingSystem = false;\n            if (mFinished) return;\n            if (result.getResultCode() != Activity.RESULT_OK\n                    || result.getData() == null\n                    || mParams.webContents.isDestroyed()\n                    ||\
      \ mActivity.isFinishing()\n                    || mActivity.isDestroyed()) {\n                cancel();\n                return;\n            }\n            int id = mParams.captureId;\n            if (mParams.requestFrame == null\n                    || !ScreenCapture.onPick(\n                            mParams.webContents,\n                            mParams.requestFrame,\n                            mParams.parentWindow,\n                            result,\n                            id,\n                            () -> MediaCaptureNotificationServiceImpl.finishScreenCapture(id))) {\n                cancel();\n                return;\n            }\n            // Foreground mediaProjection service is started only after real OS consent.\n            if (!MediaCaptureNotificationServiceImpl.prepareScreenCapture(mActivity, id)) {\n                ScreenCapture.cancelPick(id);\n                cancel();\n                return;\n            }\n            close();\n         \
      \   mDelegate.onPickScreen();\n            MediaCapturePickerManager.recordResult(\n                    MediaCapturePickerManager.Result.SCREEN_SELECTED);\n        }\n\n        @Override\n        public void onActivityStateChange(Activity activity, @ActivityState int newState) {\n            if (newState == ActivityState.DESTROYED) cancel();\n        }\n\n        private void detachTabs() {\n            if (mAllTabs != null) {\n                mAllTabs.destroy();\n                mAllTabs = null;\n            }\n            mTabObserver.destroy();\n        }\n\n        private void cancel() {\n            if (mFinished) return;\n            close();\n            mDelegate.onCancel();\n            MediaCapturePickerManager.recordResult(MediaCapturePickerManager.Result.CANCELLED);\n        }\n\n        void close() {\n            if (mFinished) return;\n            mFinished = true;\n            ApplicationStatus.unregisterActivityStateListener(this);\n            if (mFragment != null)\
      \ mFragment.cancelPrompt(this);\n            detachTabs();\n            if (mDialog != null) {\n                mDialog.dismiss();\n                mDialog = null;\n            }\n        }\n    }\n}\n"
