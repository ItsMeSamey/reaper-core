# Android Chromium Discover implementation exclusion.
substitutions:
- description: Use the neutral local NTP contract
  regex:
    re_pattern: org\.chromium\.chrome\.browser\.feed\.FeedSurfaceScrollDelegate
    replace: org.chromium.chrome.browser.ntp.NtpScrollDelegate
- description: Use the neutral local NTP contract
  regex:
    re_pattern: FeedSurfaceScrollDelegate
    replace: NtpScrollDelegate
  count: 3
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: 'import\ org\.chromium\.base\.MathUtils;\

      import\ org\.chromium\.build\.annotations\.NullMarked;\

      import\ org\.chromium\.build\.annotations\.Nullable;\

      import\ org\.chromium\.chrome\.browser\.composeplate\.ComposeplateUtils;\

      import\ org\.chromium\.chrome\.browser\.ntp\.NtpScrollDelegate;\

      import\ org\.chromium\.chrome\.browser\.lens\.LensController;\

      import\ org\.chromium\.chrome\.browser\.lens\.LensEntryPoint;\

      import\ org\.chromium\.chrome\.browser\.lens\.LensIntentParams;\

      import\ org\.chromium\.chrome\.browser\.lens\.LensMetrics;\

      '
    replace: 'import org.chromium.base.MathUtils;

      import org.chromium.build.annotations.NullMarked;

      import org.chromium.build.annotations.Nullable;

      import org.chromium.chrome.browser.composeplate.ComposeplateUtils;

      import org.chromium.chrome.browser.lens.LensController;

      import org.chromium.chrome.browser.lens.LensEntryPoint;

      import org.chromium.chrome.browser.lens.LensIntentParams;

      import org.chromium.chrome.browser.lens.LensMetrics;

      '
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.lifecycle\.ActivityLifecycleDispatcher;\

      import\ org\.chromium\.chrome\.browser\.lifecycle\.DestroyObserver;\

      import\ org\.chromium\.chrome\.browser\.ntp\.NewTabPageManager;\

      import\ org\.chromium\.chrome\.browser\.ntp\.NewTabPageUtils;\

      import\ org\.chromium\.chrome\.browser\.omnibox\.R;\

      import\ org\.chromium\.chrome\.browser\.omnibox\.fusebox\.FuseboxFeatureUtils;\

      import\ org\.chromium\.chrome\.browser\.omnibox\.status\.StatusProperties\.StatusIconResource;\

      import\ org\.chromium\.chrome\.browser\.profiles\.Profile;\

      '
    replace: 'import org.chromium.chrome.browser.lifecycle.ActivityLifecycleDispatcher;

      import org.chromium.chrome.browser.lifecycle.DestroyObserver;

      import org.chromium.chrome.browser.ntp.NewTabPageManager;

      import org.chromium.chrome.browser.ntp.NewTabPageUtils;

      import org.chromium.chrome.browser.ntp.NtpScrollDelegate;

      import org.chromium.chrome.browser.omnibox.R;

      import org.chromium.chrome.browser.omnibox.fusebox.FuseboxFeatureUtils;

      import org.chromium.chrome.browser.omnibox.status.StatusProperties.StatusIconResource;

      import org.chromium.chrome.browser.profiles.Profile;

      '
- description: Remove the excluded Composeplate provider import.
  regex:
    pattern: 'import org.chromium.chrome.browser.composeplate.ComposeplateUtils;

      '
    replace: ''
  count: 1
- description: Remove the excluded Fusebox feature provider import.
  regex:
    pattern: 'import org.chromium.chrome.browser.omnibox.fusebox.FuseboxFeatureUtils;

      '
    replace: ''
  count: 1
- description: Use retained ordinary theme utilities for the existing icon tint behavior.
  regex:
    pattern: 'import org.chromium.chrome.browser.search_engines.TemplateUrlServiceFactory;

      '
    replace: 'import org.chromium.chrome.browser.search_engines.TemplateUrlServiceFactory;

      import org.chromium.chrome.browser.theme.ThemeUtils;

      import org.chromium.chrome.browser.ui.theme.BrandedColorScheme;

      '
  count: 1
- description: Drop the profile field used only by the excluded feature predicates.
  regex:
    pattern: '    private final Profile mProfile;

      '
    replace: ''
  count: 1
- description: Drop the assignment for the retired profile field.
  regex:
    pattern: '        mProfile = profile;

      '
    replace: ''
  count: 1
- description: Preserve both ordinary tint branches locally.
  regex:
    pattern: "    private @Nullable ColorStateList getIconTint() {\n        return ComposeplateUtils.getSearchBoxIconColorTint(\n\
      \                mContext, mModel.get(SearchBoxProperties.APPLY_WHITE_BACKGROUND_AND_SHADOW));\n    }\n"
    replace: "    private @Nullable ColorStateList getIconTint() {\n        return getSearchBoxIconColorTint(\n          \
      \      mModel.get(SearchBoxProperties.APPLY_WHITE_BACKGROUND_AND_SHADOW));\n    }\n\n    private @Nullable ColorStateList\
      \ getSearchBoxIconColorTint(boolean applyWhiteBackground) {\n        if (applyWhiteBackground) {\n            return\
      \ mContext.getColorStateList(R.color.default_icon_color_dark);\n        }\n        return ThemeUtils.getThemedToolbarIconTint(mContext,\
      \ BrandedColorScheme.APP_DEFAULT);\n    }\n"
  count: 1
- description: Select the existing ordinary search-box start icon without the excluded plus feature.
  regex:
    pattern: "        mModel.set(\n                SearchBoxProperties.PLUS_BUTTON_VISIBILITY,\n                FuseboxFeatureUtils.shouldShowNtpPlusButton(\n\
      \                        mContext, mProfile, mTemplateUrlService));\n"
    replace: '        mModel.set(SearchBoxProperties.PLUS_BUTTON_VISIBILITY, false);

      '
  count: 1
- description: Retain exact white-background tint selection through the local ordinary helper.
  regex:
    pattern: "        ColorStateList colorStateList =\n                ComposeplateUtils.getSearchBoxIconColorTint(mContext,\
      \ apply);\n"
    replace: '        ColorStateList colorStateList = getSearchBoxIconColorTint(apply);

      '
  count: 1
- description: Select the no-Composeplate AI chip visibility path.
