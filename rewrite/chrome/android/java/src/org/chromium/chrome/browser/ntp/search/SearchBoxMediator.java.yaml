      '
    replace: ''
  count: 1
- description: Remove retired AI/plus callback or observer dependency
  regex:
    pattern: 'import org.chromium.url.GURL;

      '
    replace: ''
  count: 1
- description: Remove retired AI/plus callback or observer dependency
  regex:
    pattern: '        mTemplateUrlService.addObserver(mTemplateUrlServiceObserver);

      '
    replace: ''
  count: 1
- description: Remove retired AI/plus callback or observer dependency
  regex:
    pattern: '        mTemplateUrlService.removeObserver(mTemplateUrlServiceObserver);

      '
    replace: ''
  count: 1
- description: Remove retired AI/plus callback or observer dependency
  regex:
    pattern: '        mModel.set(SearchBoxProperties.PLUS_BUTTON_CLICK_CALLBACK, this::onPlusButtonClick);

      '
    replace: ''
  count: 1
- description: Remove retired AI/plus callback or observer dependency
  regex:
    pattern: '        mModel.set(SearchBoxProperties.AI_CHIP_CLICK_CALLBACK, this::onAiChipClick);

      '
    replace: ''
  count: 1
- description: Remove retired AI/plus callback or observer dependency
  regex:
    pattern: '        mModel.set(SearchBoxProperties.AI_CHIP_CLICK_CALLBACK, null);

      '
    replace: ''
  count: 1
- description: Remove retired AI/plus callback or observer dependency
  regex:
    pattern: '        mModel.set(SearchBoxProperties.PLUS_BUTTON_CLICK_CALLBACK, null);

      '
    replace: ''
  count: 1
- description: Remove AI-only observer field
  regex:
    pattern: "    private final TemplateUrlServiceObserver mTemplateUrlServiceObserver =\n            this::onTemplateURLServiceChanged;\n"
    replace: ''
  count: 1
- description: Remove retired visibility initialization
  regex:
    pattern: "\n        updateAiChip();\n        updateStartIcon();\n"
    replace: ''
  count: 1
- description: Remove Fusebox plus callback
  regex:
    pattern: "    private void onPlusButtonClick(View v) {\n        mNewTabPageManager.focusSearchBox(\n                /*\
      \ beginVoiceSearch= */ false,\n                AutocompleteRequestType.SEARCH,\n                /* showFuseboxPopup=\
      \ */ true,\n                /* pastedText= */ null);\n    }\n\n"
    replace: ''
  count: 1
- description: Remove retired visibility methods and sole observer callback
  regex:
    pattern: "    private void updateStartIcon() {\n        mModel.set(SearchBoxProperties.PLUS_BUTTON_VISIBILITY, false);\n\
      \    }\n\n    private void onTemplateURLServiceChanged() {\n        updateStartIcon();\n        updateAiChip();\n  \
      \  }\n\n"
    replace: ''
  count: 1
- description: Remove AI chip visibility and URL launch callback
  regex:
    pattern: "\n    private void updateAiChip() {\n        mModel.set(SearchBoxProperties.AI_CHIP_VISIBILITY, false);\n  \
      \  }\n\n    private void onAiChipClick(View view) {\n        GURL url = mTemplateUrlService.getComposeplateUrl();\n\
      \        if (url != null) {\n            mNewTabPageManager.loadUrl(new LoadUrlParams(url), /* incognito= */ false);\n\
      \        }\n    }"
    replace: ''
  count: 1
- description: Remove empty observer cleanup spacing
  regex:
    pattern: "        mSearchEngineIcon = null;\n\n    }"
    replace: "        mSearchEngineIcon = null;\n    }"
  count: 1

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: remove Lens controller implementation import"
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensController;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove Lens intent metrics query implementation imports"
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensIntentParams;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensMetrics;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensQueryParams;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove storage used only by removed Lens launch"
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ final\\ boolean\\ mIsIncognito;\\\n\\ \\ \\ \\ private\\ final\\ WindowAndroid\\ mWindowAndroid;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove only unused Lens storage assignments"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ mIsIncognito\\ =\\ isIncognito;\\\n\\ \\ \\ \\ \\ \\ \\ \\ mWindowAndroid\\ =\\ windowAndroid;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: keep inert private callback without launch or metrics dependency"
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ void\\ onLensClick\\(View\\ v\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ LensMetrics\\.recordClicked\\(LensEntryPoint\\.NEW_TAB_PAGE\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ LensIntentParams\\ lensIntentParams\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ new\\ LensIntentParams\\.Builder\\(LensEntryPoint\\.NEW_TAB_PAGE,\\ mIsIncognito\\)\\.build\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ LensController\\.getInstance\\(\\)\\.startLens\\(mWindowAndroid,\\ lensIntentParams\\);\\\n\\ \\ \\ \\ \\}"
    replace: "    private void onLensClick(View v) {}"
  count: 1
- description: "Lens extra: retain enum-only eligibility API permanently unavailable"
  regex:
    re_pattern: "\\ \\ \\ \\ boolean\\ isLensEnabled\\(@LensEntryPoint\\ int\\ lensEntryPoint,\\ boolean\\ isIncognito,\\ boolean\\ isLff\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ return\\ LensController\\.getInstance\\(\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.isLensEnabled\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ new\\ LensQueryParams\\.Builder\\(lensEntryPoint,\\ isIncognito,\\ isLff\\)\\.build\\(\\)\\);\\\n\\ \\ \\ \\ \\}"
    replace: "    boolean isLensEnabled(@LensEntryPoint int lensEntryPoint, boolean isIncognito, boolean isLff) {\n        return false;\n    }"
  count: 1
