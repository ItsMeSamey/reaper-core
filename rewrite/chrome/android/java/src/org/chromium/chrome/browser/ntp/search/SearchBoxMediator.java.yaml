      \    && ComposeplateUtils.isComposeplateEnabled(mProfile);\n        mModel.set(SearchBoxProperties.AI_CHIP_VISIBILITY,\
      \ shouldShow);\n"
    replace: '        mModel.set(SearchBoxProperties.AI_CHIP_VISIBILITY, false);

      '
  count: 1
- description: Remove retired AI/plus callback or observer dependency
  regex:
    pattern: 'import org.chromium.components.search_engines.TemplateUrlService.TemplateUrlServiceObserver;

      '
    replace: ''
  count: 1
- description: Remove retired AI/plus callback or observer dependency
  regex:
