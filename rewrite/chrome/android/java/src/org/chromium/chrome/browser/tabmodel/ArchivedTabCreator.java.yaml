# Reaper Android containers lifecycle; complete raw-pin ancestry.
substitutions:
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: 'import\ org\.chromium\.build\.annotations\.NullMarked;\

      import\ org\.chromium\.build\.annotations\.Nullable;\

      import\ org\.chromium\.chrome\.browser\.app\.tabmodel\.HeadlessTabDelegateFactory;\

      import\ org\.chromium\.chrome\.browser\.profiles\.Profile;\

      import\ org\.chromium\.chrome\.browser\.tab\.Tab;\

      import\ org\.chromium\.chrome\.browser\.tab\.TabBuilder;\

      '
    replace: 'import org.chromium.build.annotations.NullMarked;

      import org.chromium.build.annotations.Nullable;

      import org.chromium.chrome.browser.app.tabmodel.HeadlessTabDelegateFactory;

      import org.chromium.chrome.browser.containers.ContainersBridge;

      import org.chromium.chrome.browser.profiles.Profile;

      import org.chromium.chrome.browser.tab.Tab;

      import org.chromium.chrome.browser.tab.TabBuilder;

      '
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ @TabLaunchType\ int\ type,\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ Tab\ parent,\

      \ \ \ \ \ \ \ \ \ \ \ \ int\ index\)\ \{\

      \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/331827001\):\ Also\ possible\ to\ change\ the\ entire\ restore\ path\.\

      \ \ \ \ \ \ \ \ assert\ type\ ==\ TabLaunchType\.FROM_RESTORE\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ "ArchivedTabCreator\ only\ supports\ \#createNewTab\ calls\ as\ a\ restore\ fallback\.";\

      \ \ \ \ \ \ \ \ Tab\ tab\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabBuilder\.createForLazyLoad\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assumeNonNull\(mTabModel\.getProfile\(\)\),\ loadUrlParams,\ title\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setWindow\(mWindow\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setLaunchType\(TabLaunchType\.FROM_RESTORE\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setTabResolver\(mTabModel::getTabById\)\

      '
    replace: "            @TabLaunchType int type,\n            @Nullable Tab parent,\n            int index) {\n        return createNewTabInContainer(loadUrlParams, title, type, \"\", index);\n    }\n\n    /** Recreates a missing archived state lazily in its indexed storage container. */\n    public @Nullable Tab createNewTabInContainer(\n            LoadUrlParams loadUrlParams, @TabLaunchType int type, String containerId, int index) {\n        return createNewTabInContainer(loadUrlParams, null, type, containerId, index);\n    }\n\n    private @Nullable Tab createNewTabInContainer(\n            LoadUrlParams loadUrlParams, @Nullable String title,\n            @TabLaunchType int type, String containerId, int index) {\n        if (!ContainersBridge.isContainerIdValid(\n                assumeNonNull(mTabModel.getProfile()), containerId)) return null;\n        // TODO(crbug.com/331827001): Also possible to change the entire restore path.\n        assert type == TabLaunchType.FROM_RESTORE\n                : \"ArchivedTabCreator only supports #createNewTab calls as a restore fallback.\";\n        Tab tab =\n                TabBuilder.createForLazyLoad(\n                                assumeNonNull(mTabModel.getProfile()), loadUrlParams, title)\n                        .setContainerId(containerId)\n                        .setWindow(mWindow)\n                        .setLaunchType(TabLaunchType.FROM_RESTORE)\n                        .setTabResolver(mTabModel::getTabById)\n"
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ @Nullable\ Tab\ createFrozenTab\(TabState\ state,\ int\ id,\ int\ index\)\ \{\

      \ \ \ \ \ \ \ \ assert\ mTabModel\ !=\ null\ :\ "Creating\ frozen\ tab\ before\ native\ library\ initialized\.";\

      \ \ \ \ \ \ \ \ Tab\ tab\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabBuilder\.createFromFrozenState\(assumeNonNull\(mTabModel\.getProfile\(\)\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setWindow\(mWindow\)\

      '
    replace: "    @Override\n    public @Nullable Tab createFrozenTab(TabState state, int id, int index) {\n        assert mTabModel != null : \"Creating frozen tab before native library initialized.\";\n        if (!ContainersBridge.restoreContainerIdentity(\n                assumeNonNull(mTabModel.getProfile()), state.containerId)) return null;\n        Tab tab =\n                TabBuilder.createFromFrozenState(assumeNonNull(mTabModel.getProfile()))\n                        .setWindow(mWindow)\n"
- description: Declare existing four-argument archived implementation; body and private title overload exact
  regex:
    pattern: "    /** Recreates a missing archived state lazily in its indexed storage container. */\n    public @Nullable\
      \ Tab createNewTabInContainer("
    replace: "    /** Recreates a missing archived state lazily in its indexed storage container. */\n    @Override\n    public\
      \ @Nullable Tab createNewTabInContainer("
  count: 1
