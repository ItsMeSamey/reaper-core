      \ finalizeCallback);\n        var paramsManager = AsyncTabParamsManagerSingleton.getInstance();\n        int tabId =\
      \ mTab.getId();\n        paramsManager.add(tabId, params);\n        if (pendingId != null) {\n            // Do not\
      \ retain a Tab after the destination has consumed its params.\n            // Compare the exact entry: another reparenting\
      \ request can reuse the\n            // numeric tab ID, and consumed/reattached tabs have a different owner.\n     \
