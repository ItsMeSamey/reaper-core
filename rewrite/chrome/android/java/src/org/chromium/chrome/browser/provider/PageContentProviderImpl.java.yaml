substitutions:
- description: Remove the dedicated AI proto bridge import.
  regex:
    pattern: 'import org.chromium.components.optimization_guide.content.PageContentProtoProviderBridge;

      '
    replace: ''
  count: 1
- description: Complete the retained nullable proto URI API without AI extraction or URI grants.
  regex:
    pattern: "    public static @Nullable Uri getProtoContentUriForUrl(\n            String url, Supplier<@Nullable Tab> tabSupplier,\
      \ @Nullable String targetPackage) {\n        boolean isGsa = GSA_PACKAGE_NAME.equals(targetPackage);\n        RecordHistogram.recordBooleanHistogram(\n\
      \                \"Android.AssistContent.WebPageContentProvider.TargetPackageProvided\",\n                targetPackage\
      \ != null);\n        String invocationId =\n                getIdForUrl(\n                        url,\n           \
      \             tabSupplier,\n                        targetPackage,\n                        /* addTextUri= */ false,\n\
      \                        /* addProtoUri= */ true,\n                        isGsa);\n        if (invocationId == null)\
      \ {\n            PageContentProviderMetrics.recordPageProviderEvent(\n                    PageContentProviderEvent.GET_CONTENT_URI_FAILED,\
      \ isGsa);\n            return null;\n        }\n\n        PageContentProviderMetrics.recordPageProviderEvent(\n    \
      \            PageContentProviderEvent.GET_CONTENT_URI_SUCCESS, isGsa);\n        return buildProtoFormatUri(invocationId);\n\
      \    }\n"
    replace: "    public static @Nullable Uri getProtoContentUriForUrl(\n            String url, Supplier<@Nullable Tab> tabSupplier,\
      \ @Nullable String targetPackage) {\n        return null;\n    }\n"
  count: 1
- description: Advertise only the retained plain-text format by default.
  regex:
    pattern: "                /* addProtoUri= */ true,\n                /* targetPackage= */ null);"
    replace: "                /* addProtoUri= */ false,\n                /* targetPackage= */ null);"
  count: 1
- description: Suppress AI proto URI advertisement and grants for the retained public overload.
  regex:
    pattern: "            boolean addProtoUri,\n            @Nullable String targetPackage) {\n        boolean isGsa = false;\n"
    replace: "            boolean addProtoUri,\n            @Nullable String targetPackage) {\n        // Android retains\
      \ plain-text extraction without the AI proto backend.\n        addProtoUri = false;\n        boolean isGsa = false;\n"
  count: 1
- description: Describe the retained overload capability accurately.
  regex:
    pattern: '     * @param addProtoUri Whether to include a URI for the proto format.'
    replace: '     * @param addProtoUri Ignored because annotated page-content extraction is unavailable.'
  count: 1
- description: Finish unsupported proto requests through the existing future/error path without the AI bridge.
  regex:
    pattern: "    private Future<byte[]> requestProtoPageContentsAsync(\n            @RequestType int requestType, WebContents\
      \ webContents, boolean isGsa) {\n        var pageContentFuture = new CompletableFuture<byte[]>();\n\n        try (var\
      \ t = TraceEvent.scoped(\"PageContentProvider.requestProtoPageContentsAsync\")) {\n            ThreadUtils.runOnUiThread(\n\
      \                    () -> {\n                        try (var u =\n                                TraceEvent.scoped(\n\
      \                                        \"PageContentProvider.requestProtoPageContentsAsyncOnUiThread\")) {\n     \
      \                       if (webContents == null\n                                    || webContents.isDestroyed()\n\
      \                                    || webContents.getMainFrame() == null) {\n                                PageContentProviderMetrics.recordPageProviderEvent(\n\
      \                                        requestType,\n                                        Format.PROTO,\n     \
      \                                   PageContentProviderEvent.REQUEST_FAILED_EMPTY_RESULT,\n                        \
      \                isGsa);\n                                pageContentFuture.completeExceptionally(\n               \
      \                         new Exception(\"WebContents destroyed\"));\n                                return;\n    \
      \                        }\n                            PageContentProtoProviderBridge.getAiPageContent(\n         \
      \                           webContents,\n                                    result -> {\n                        \
      \                if (result == null) {\n                                            PageContentProviderMetrics.recordPageProviderEvent(\n\
      \                                                    requestType,\n                                                \
      \    Format.PROTO,\n                                                    PageContentProviderEvent\n                 \
      \                                           .REQUEST_FAILED_EMPTY_RESULT,\n                                        \
      \            isGsa);\n                                            pageContentFuture.completeExceptionally(\n       \
      \                                             new Exception(\"Error during extraction\"));\n                       \
      \                 } else {\n                                            pageContentFuture.complete(result.toByteArray());\n\
      \                                        }\n                                    });\n                        }\n   \
      \                 });\n        }\n        return pageContentFuture;\n    }\n"
    replace: "    private Future<byte[]> requestProtoPageContentsAsync(\n            @RequestType int requestType, WebContents\
      \ webContents, boolean isGsa) {\n        var pageContentFuture = new CompletableFuture<byte[]>();\n        pageContentFuture.completeExceptionally(\n\
      \                new UnsupportedOperationException(\"Annotated page content is unavailable\"));\n        return pageContentFuture;\n\
      \    }\n"
  count: 1
- description: Document the existing nullable API after removing its AI provider.
  regex:
    pattern: "     * Generates a URI for the proto format to be shared with the specified package. Only one URI is\n     *\
      \ valid at a time, and only the result from the most recent call to either this or {@link\n     * #getAssistContentStructuredDataForUrl}\
      \ will be valid.\n"
    replace: "     * Annotated page-content extraction is unavailable. This compatibility entrypoint returns null\n     *\
      \ without generating a URI or granting access.\n"
  count: 1
- description: Describe the compatibility API without stale URI-generation or grant claims.
  regex:
    pattern: "    /**\n     * Annotated page-content extraction is unavailable. This compatibility entrypoint returns null\n\
      \     * without generating a URI or granting access.\n     *\n     * @param url The URL of the currently active page,\
      \ the returned URI will only work for this\n     *     URL.\n     * @param tabSupplier Supplier used to ensure that\
      \ {@code url} is still active on all calls to\n     *     {@code query()}\n     * @param targetPackage The package to\
      \ grant access to. If null, the default assistant package\n     *     will be used.\n     * @return A URI to be used\
      \ with the {@code openFile()} method to extract the contents of {@code\n     *     url}.\n     */\n"
    replace: '    /** Returns null because annotated page-content extraction is unavailable. */

      '
  count: 1
- description: Remove the stale claim that the unsupported proto API changes invocation ownership.
  regex:
    pattern: "     * Generates a JSON string to be attached to AssistContent to be shared with the specified\n     * package.\
      \ Only one URI is valid at a time, and only the result from the most recent call to\n     * either this or {@link #getProtoContentUriForUrl}\
      \ will be valid.\n"
    replace: "     * Generates a JSON string to be attached to AssistContent to be shared with the specified\n     * package.\
      \ URI validity and permissions belong to the current invocation.\n"
  count: 1
- description: Remove unused pure-value arguments from the sole private unsupported-proto call
  regex:
    pattern: "                return requestProtoPageContentsAsync(\n                        requestType, currentTabUrlAndWebContents.second,\
      \ isGsa);\n"
    replace: '                return requestProtoPageContentsAsync();

      '
  count: 1
- description: Remove three unused parameters; retain identical exceptional completion
  regex:
    pattern: "    private Future<byte[]> requestProtoPageContentsAsync(\n            @RequestType int requestType, WebContents\
      \ webContents, boolean isGsa) {\n"
    replace: '    private Future<byte[]> requestProtoPageContentsAsync() {

      '
  count: 1
