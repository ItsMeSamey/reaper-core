# Android download UI policy and truthful transfer lifecycle.
substitutions:
- description: Forward policy changes only to an already-created optional UI controller
  regex:
    re_pattern: 'public\ class\ DownloadMessageBridge\ \{\

      '
    replace: "public class DownloadMessageBridge {\n    @CalledByNative\n    public static void onDownloadUiPolicyChanged() {\n        DownloadManagerService.onDownloadUiPolicyChanged();\n    }\n\n"
