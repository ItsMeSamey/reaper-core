# Android real split persistence and recently-closed restoration.
substitutions:
- description: Clear value-owned close snapshots after history consumes them, including filtered and non-restorable tabs
  count: 1
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(tabs\.isEmpty\(\)\ \|\|\ !canRestore\)\ return;\

      \

      \ \ \ \ \ \ \ \ if\ \(tabs\.size\(\)\ ==\ 1\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ Tab\ tab\ =\ tabs\.get\(0\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!isTabGroupWithOneTab\(tab\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mHistoricalTabSaver\.createHistoricalTab\(tab\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ buildGroupsAndCreateClosure\(tabs\);'
    replace: "        try {\n            if (tabs.isEmpty() || !canRestore) return;\n            if (tabs.size() == 1) {\n                Tab tab = tabs.get(0);\n                if (!isTabGroupWithOneTab(tab)) {\n                    mHistoricalTabSaver.createHistoricalTab(tab);\n                    return;\n                }\n            }\n            buildGroupsAndCreateClosure(tabs);\n        } finally {\n            // Native history has copied complete pairs; never retain stale close metadata.\n            for (Tab tab : tabs) tab.clearSplitDataForClosure();\n        }"
