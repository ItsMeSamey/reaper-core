substitutions:
  - description: 'Disable READ_CONTACTS.'
    regex:
      re_pattern:
        '^([ \t]*)(<uses-permission-sdk-23
        android:name="android\.permission\.READ_CONTACTS"[^>]*/>)$'
      re_flags: [MULTILINE]
      replace: |-
        <!--
        \1\2
        -->

  - description: |
      Only request FOREGROUND_SERVICE_CAMERA on desktop Android.

      The feature that would use it (background media capturing) is off by
      default and unused by Brave, and Google requires a declaration with a
      demo video for any app using this permission.
    regex:
      re_pattern:
        '^([ \t]*)(<uses-permission
        android:name="android\.permission\.FOREGROUND_SERVICE_CAMERA"\s*/>)$'
      re_flags: [MULTILINE]
      replace: |-
        \1{% if is_desktop_android == "true" %}
        \1\2
        \1{% endif %}

  - description: |
      Disable FOREGROUND_SERVICE_MEDIA_PROJECTION.

      Brave does not build desktop Android, the only target that would use
      this, and Google requires a declaration with a demo video for any app
      using this permission.
    regex:
      re_pattern:
        '^([ \t]*)(<uses-permission
        android:name="android\.permission\.FOREGROUND_SERVICE_MEDIA_PROJECTION"\s*/>)$'
      re_flags: [MULTILINE]
      replace: |-
        <!--
        \1\2
        -->

  - description: |
      Drop mediaProjection from MediaCaptureNotificationService's foreground
      service type, to match FOREGROUND_SERVICE_MEDIA_PROJECTION being disabled
      above.
    regex:
      pattern: 'android:foregroundServiceType="camera|microphone|mediaProjection|mediaPlayback"'
      replace: 'android:foregroundServiceType="camera|microphone|mediaPlayback"'

  - description: |
      Disable GET_ACCOUNTS, MANAGE_ACCOUNTS and USE_CREDENTIALS.

      Brave does not integrate with Android's account manager.
    count: 3
    regex:
      re_pattern:
        '^([ \t]*)(<uses-permission
        android:name="android\.permission\.(?:GET_ACCOUNTS|MANAGE_ACCOUNTS|USE_CREDENTIALS)"\s*/>)$'
      re_flags: [MULTILINE]
      replace: |-
        <!--
        \1\2
        -->

  - description: |
      Disable NFC.

      The only reason for this permission was WebNFC, which Brave disables in
      BraveContentRendererClient.
    regex:
      re_pattern:
        '^([ \t]*)(<uses-permission
        android:name="android\.permission\.NFC"\s*/>)$'
      re_flags: [MULTILINE]
      replace: |-
        <!--
        \1\2
        -->

  - description: |
      Cap READ_EXTERNAL_STORAGE and WRITE_EXTERNAL_STORAGE at API 32.

      Beyond API 32, scoped storage replaces the need for the broad legacy
      permission.
    count: 2
    regex:
      re_pattern:
        '(<uses-permission
        android:name="android\.permission\.(?:READ|WRITE)_EXTERNAL_STORAGE")\s*/>'
      replace: '\1 android:maxSdkVersion="32"/>'

  - description: |
      Disable CURRENT_ACCOUNT_ACCESS.

      This permission gated access to Google's "Google Now" account
      integration, which Brave does not use.
    regex:
      re_pattern:
        '^([ \t]*)(<uses-permission
        android:name="com\.google\.android\.apps\.now\.CURRENT_ACCOUNT_ACCESS"\s*/>)$'
      re_flags: [MULTILINE]
      replace: |-
        <!--
        \1\2
        -->

  - description: |
      Include Brave's intent filters in the IntentDispatcher alias.

      Keeps Brave-specific intent filters in their own file rather than
      growing this one.
    regex:
      re_pattern:
        '^([ \t]*)(<meta-data android:name="android\.app\.searchable")'
      re_flags: [MULTILINE]
      replace: |-
        \1{% include "//brave/android/java/AndroidManifest_intent_filters.xml" %}
        \1\2

  - description: |
      Disable the Quick Action Search widget.

      Brave does not ship this widget or its dino variant.
    regex:
      re_pattern:
        '(<!-- Quick Action Search widget -->\n)(.*?)(\n([ \t]*)<!-- Bookmarks
        widget -->)'
      re_flags: [DOTALL]
      replace: |-
        \1\4<!--
        \2
        \4-->\3

  - description: |
      Include Brave's widgets ahead of the Bookmarks widget.

      Play Store suggests the first app widget declared in the manifest on
      install, so list Brave's Quick Action Search widget first.
    regex:
      re_pattern: '^([ \t]*)(<!-- Bookmarks widget -->)$'
      re_flags: [MULTILINE]
      replace: |-
        \1{% include "//brave/android/java/AndroidManifest_widgets.xml" %}
        \1\2

  - description: |
      Include Brave's own AndroidManifest.xml.

      Lets Brave declare additional application-level manifest entries
      without further patching this file.
    regex:
      re_pattern: '^([ \t]*)(\{% block extra_application_definitions %\})$'
      re_flags: [MULTILINE]
      replace: |-
        \1{% include "//brave/android/java/AndroidManifest.xml" %}
        \1\2

  - description: Declare the service type required for public MediaProjection consent.
    regex:
      pattern: android:foregroundServiceType="camera|microphone|mediaPlayback"
      replace: android:foregroundServiceType="camera|microphone|mediaPlayback|mediaProjection"

  - description: Exclude Android crash reporting implementation
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ <!\-\-\ Crash\ reporting\ services\.\ \-\->\

        \ \ \ \ \ \ \ \ <service\ android:name="org\.chromium\.chrome\.browser\.crash\.ChromeMinidumpUploadJobService"\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:permission="android\.permission\.BIND_JOB_SERVICE"\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:exported="false"/>\

        \ \ \ \ \ \ \ \ <service\ android:name="org\.chromium\.chrome\.browser\.crash\.MinidumpUploadService"\

        \ \ \ \ \ \ \ \ \ \ \ \ android:exported="false"/>\

        '
      replace: ''

  - description: 'Android concrete AI source/provider removal: chrome/android/java/AndroidManifest.xml'
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ </intent\-filter>\

        \ \ \ \ \ \ \ \ </receiver>\

        \

        \ \ \ \ \ \ \ \ <!\-\-\ Actor\ related\ \-\->\

        \ \ \ \ \ \ \ \ <receiver\ android:name="org\.chromium\.chrome\.browser\.actor\.ActorBroadcastReceiver"\

        \ \ \ \ \ \ \ \ \ \ \ \ android:exported="false">\

        \ \ \ \ \ \ \ \ \ \ \ \ <intent\-filter>\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ <action\ android:name="org\.chromium\.chrome\.browser\.actor\.ACTION_PAUSE"\ />\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ <action\ android:name="org\.chromium\.chrome\.browser\.actor\.ACTION_RESUME"\ />\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ <action\ android:name="org\.chromium\.chrome\.browser\.actor\.ACTION_CANCEL"\ />\

        \ \ \ \ \ \ \ \ \ \ \ \ </intent\-filter>\

        \ \ \ \ \ \ \ \ </receiver>\

        \

        \ \ \ \ \ \ \ \ <!\-\-\ Custom\ Tabs\ \-\->\

        \ \ \ \ \ \ \ \ <activity\ android:name="org\.chromium\.chrome\.browser\.customtabs\.CustomTabActivity"\

        \ \ \ \ \ \ \ \ \ \ \ \ android:theme="@style/Theme\.Chromium\.Activity"\

        '
      replace: "            </intent-filter>\n        </receiver>\n\n        <!-- Custom Tabs -->\n        <activity android:name=\"org.chromium.chrome.browser.customtabs.CustomTabActivity\"\n            android:theme=\"@style/Theme.Chromium.Activity\"\n"
  - description: 'Android concrete AI source/provider removal: chrome/android/java/AndroidManifest.xml'
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ android:exported="false"\

        \ \ \ \ \ \ \ \ \ \ \ \ android:isolatedProcess="true"\

        \ \ \ \ \ \ \ \ \ \ \ \ android:process=":decoder_service"\ />\

        \

        \ \ \ \ \ \ \ \ <!\-\-\ Actor\ foreground\ service\ \-\->\

        \ \ \ \ \ \ \ \ <!\-\-\ TODO:\ This\ service\ needs\ to\ verify\ the\ calling\ app\ and\ its\ certificates\ before\

        \ \ \ \ \ \ \ \ \ \ \ \ \ starting\ the\ actor\ service\.\ Export\ this\ service\ in\ production\ channels\ once\ the\

        \ \ \ \ \ \ \ \ \ \ \ \ \ verification\ is\ handled\ correctly\ in\ the\ service\.\ \-\->\

        \ \ \ \ \ \ \ \ \{%\ if\ channel\ in\ \[''default''\]\ %\}\

        \ \ \ \ \ \ \ \ <service\ android:name="org\.chromium\.chrome\.browser\.actor\.ActorForegroundService"\

        \ \ \ \ \ \ \ \ \ \ \ \ android:foregroundServiceType="dataSync"\

        \ \ \ \ \ \ \ \ \ \ \ \ android:exported="true"\

        \ \ \ \ \ \ \ \ \ \ \ \ tools:ignore="ExportedService">\

        \ \ \ \ \ \ \ \ \ \ \ \ <intent\-filter>\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ <action\ android:name="org\.chromium\.chrome\.browser\.actor\.START_ACTOR_FOREGROUND_SERVICE"\ />\

        \ \ \ \ \ \ \ \ \ \ \ \ </intent\-filter>\

        \ \ \ \ \ \ \ \ </service>\

        \ \ \ \ \ \ \ \ \{%\ else\ %\}\

        \ \ \ \ \ \ \ \ <service\ android:name="org\.chromium\.chrome\.browser\.actor\.ActorForegroundService"\

        \ \ \ \ \ \ \ \ \ \ \ \ android:foregroundServiceType="dataSync"\

        \ \ \ \ \ \ \ \ \ \ \ \ android:exported="false">\

        \ \ \ \ \ \ \ \ </service>\

        \ \ \ \ \ \ \ \ \{%\ endif\ %\}\

        \

        \ \ \ \ \ \ \ \ <!\-\-\ Download\ foreground\ service\ \-\->\

        \ \ \ \ \ \ \ \ <service\ android:name="org\.chromium\.chrome\.browser\.download\.DownloadForegroundService"\

        '
      replace: "            android:exported=\"false\"\n            android:isolatedProcess=\"true\"\n            android:process=\":decoder_service\" />\n\n        <!-- Download foreground service -->\n        <service android:name=\"org.chromium.chrome.browser.download.DownloadForegroundService\"\n"

  - description: Restore the foreground MediaProjection permission required by the existing user-consented Android capture service.
    regex:
      re_pattern: '<!\-\-\

        \ \ \ \ <uses\-permission\ android:name="android\.permission\.FOREGROUND_SERVICE_MEDIA_PROJECTION"\ />\

        \-\->\

        '
      replace: '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

        '
  - description: Remove the non-exported unused Fusebox attachment picker activity declaration
    regex:
      pattern: "        <activity\n            android:name=\"org.chromium.chrome.browser.chrome_item_picker.ChromeItemPickerActivity\"\
        \n            android:theme=\"@style/Theme.Chromium.Activity.FakeTranslucent\"\n            android:exported=\"false\"\
        \n            android:configChanges=\"orientation|keyboardHidden|keyboard|screenSize|mcc|mnc|screenLayout|smallestScreenSize|uiMode\"\
        >\n        </activity>\n"
      replace: ''
    count: 1
  - description: Remove both dedicated price-notification activity declarations; preserve surrounding browser activities.
    regex:
      pattern: "        <activity\n            android:name=\"org.chromium.chrome.browser.price_tracking.PriceDropNotificationManagerImpl$TrampolineActivity\"\
        \n            android:theme=\"@style/Theme.BrowserUI.NoDisplay\"\n            android:exported=\"false\"\n         \
        \   android:autoRemoveFromRecents=\"true\"\n            android:excludeFromRecents=\"true\"\n            android:noHistory=\"\
        true\"/>\n\n        <activity\n            android:name=\"org.chromium.chrome.browser.price_tracking.PriceDropNotificationManagerImpl$DismissNotificationChromeActivity\"\
        \n            android:theme=\"@style/Theme.BrowserUI.NoDisplay\"\n            android:exported=\"false\"\n         \
        \   android:autoRemoveFromRecents=\"true\"\n            android:excludeFromRecents=\"true\"\n            android:noHistory=\"\
        true\"/>\n\n"
      replace: ''
    count: 1

  - description: "Lint-only source-routing change 4.1; preserve existing scoped annotations and normal checks."
    regex:
      re_pattern: "\\ \\ \\ \\ <!\\-\\-\\ Permission\\ for\\ using\\ android\\.hardware\\.hid\\.HidManager\\ on\\ Android\\ 17\\+\\ \\-\\->\\\n\\ \\ \\ \\ <uses\\-permission\\ android:name=\"android\\.permission\\.ACCESS_HID\"/>\\\n"
      replace: "    <!-- Permission for using android.hardware.hid.HidManager on Android 17+.\n         The aconfig-guarded API is not yet in the public SDK 37 permission registry. -->\n    <uses-permission android:name=\"android.permission.ACCESS_HID\"\n        tools:ignore=\"SystemPermissionTypo\"/>\n"
    count: 1

  - description: Inherit the app label for the Android cast notification controller.
    regex:
      pattern: "            android:label=\"Chrome.CafExpandedControllerActivity\"\n"
      replace: ""
