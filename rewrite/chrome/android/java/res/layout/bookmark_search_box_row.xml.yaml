substitutions:
- description: Remove dedicated chip subtree while retaining shared search box layout
  regex:
    pattern: "  <!-- Bookmarks also needs an area for chips. -->\n  <LinearLayout\n    android:id=\"@+id/shopping_filter_chip_container\"\
      \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"48dp\"\n    android:layout_marginTop=\"6dp\"\
      \n    android:orientation=\"horizontal\">\n    <org.chromium.components.browser_ui.widget.chips.ChipView\n      android:id=\"\
      @+id/shopping_filter_chip\"\n      android:layout_width=\"wrap_content\"\n      android:layout_height=\"match_parent\"\
      \ />\n  </LinearLayout>\n\n"
    replace: ''
  count: 1
