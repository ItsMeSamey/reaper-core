# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/android/java/res/layout/fake_search_box_layout.xml'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ android:importantForAccessibility="no"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:src="@drawable/ic_logo_googleg_24dp"/>\

      \

      \ \ \ \ \ \ \ \ <ImageView\

      \ \ \ \ \ \ \ \ \ \ \ \ style="@style/LocationBarActionButtonForFakeSearchBox"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/search_box_plus_button"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:layout_width="@dimen/fake_search_box_icon_size"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:layout_height="@dimen/fake_search_box_icon_size"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:layout_marginEnd="@dimen/fake_search_box_icon_margin_end"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:scaleType="fitCenter"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:focusable="true"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:clickable="true"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:visibility="gone"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:contentDescription="@string/accessibility_omnibox_open_context_popup"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:tooltipText="@string/accessibility_omnibox_open_context_popup"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:src="@drawable/ic_add_24dp"/>\

      \

      \ \ \ \ \ \ \ \ <!\-\-\ TODO\(crbug\.com/40600572\):\ Fix\ and\ remove\ lint\ ignore\ \-\->\

      \ \ \ \ \ \ \ \ <RelativeLayout\

      '
    replace: "            android:importantForAccessibility=\"no\"\n            android:src=\"@drawable/ic_logo_googleg_24dp\"/>\n\n\n        <!-- TODO(crbug.com/40600572): Fix and remove lint ignore -->\n        <RelativeLayout\n"
- description: 'Android concrete AI source/provider removal: chrome/android/java/res/layout/fake_search_box_layout.xml'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ android:visibility="gone"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:pointerIcon="hand"/>\

      \

      \ \ \ \ \ \ \ \ <org\.chromium\.components\.browser_ui\.widget\.chips\.ChipView\

      \ \ \ \ \ \ \ \ \ \ \ \ style="@style/AiModeChip"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/search_box_ai_chip"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:foreground="@drawable/search_box_ai_chip_focus_ring"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:visibility="gone"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:pointerIcon="hand"\

      \ \ \ \ \ \ \ \ \ \ \ \ app:verticalInset="@dimen/ai_chip_vertical_inset"\

      \ \ \ \ \ \ \ \ \ \ \ \ app:horizontalInset="@dimen/ai_chip_horizontal_inset"/>\

      \ \ \ \ </LinearLayout>\

      \

      </org\.chromium\.chrome\.browser\.ntp\.search\.SearchBoxContainerView>\

      '
    replace: "            android:visibility=\"gone\"\n            android:pointerIcon=\"hand\"/>\n\n    </LinearLayout>\n\n</org.chromium.chrome.browser.ntp.search.SearchBoxContainerView>\n"
