substitutions:
- description: Remove stale comment describing the retired second pane.
  regex:
    pattern: "    <!--\n      The save flow can have multiple \"panes\" which represent the bookmark being saved and any\n\
      \      powers attached to it.\n    -->\n"
    replace: ''
  count: 1
- description: Remove the dedicated price-tracking layout subtree.
  regex:
    pattern: "      <!-- Price-tracking section. -->\n      <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
      @+id/price_tracking_container\"\n        android:visibility=\"gone\"\n        app:layout_constraintTop_toBottomOf=\"\
      @id/bookmark_container\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        android:layout_height=\"\
      wrap_content\"\n        android:layout_width=\"match_parent\"\n        style=\"@style/BookmarkSaveFlowContainer\"\n\
      \        android:layout_marginTop=\"2dp\" >\n\n      <ImageView\n          android:id=\"@+id/price_tracking_image\"\n\
      \          app:layout_constraintStart_toStartOf=\"parent\"\n          app:layout_constraintTop_toTopOf=\"parent\"\n\
      \          app:layout_constraintBottom_toBottomOf=\"parent\"\n          android:layout_width=\"24dp\"\n          android:layout_height=\"\
      24dp\"\n          android:src=\"@drawable/price_tracking_disabled\"\n          app:tint=\"@macro/default_icon_color\"\
      \n          android:importantForAccessibility=\"no\" />\n\n      <LinearLayout\n          app:layout_constraintStart_toEndOf=\"\
      @id/price_tracking_image\"\n          app:layout_constraintTop_toTopOf=\"parent\"\n          app:layout_constraintBottom_toBottomOf=\"\
      parent\"\n          android:layout_gravity=\"center\"\n          android:layout_width=\"wrap_content\"\n          android:layout_height=\"\
      wrap_content\"\n          android:layout_marginStart=\"12dp\"\n          android:orientation=\"vertical\">\n       \
      \ <TextView\n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"wrap_content\"\n\
      \            android:text=\"@string/enable_price_tracking_menu_item\"\n            android:textAppearance=\"@style/TextAppearance.TextMedium.Primary\"\
      \ />\n        <TextView\n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"wrap_content\"\
      \n            android:text=\"@string/price_tracking_save_flow_notification_switch_subtitle\"\n            android:textAppearance=\"\
      @style/TextAppearance.TextSmall.Secondary\" />\n      </LinearLayout>\n\n      <com.google.android.material.materialswitch.MaterialSwitch\n\
      \          android:id=\"@+id/price_tracking_switch\"\n          app:layout_constraintTop_toTopOf=\"parent\"\n      \
      \    app:layout_constraintBottom_toBottomOf=\"parent\"\n          app:layout_constraintEnd_toEndOf=\"parent\"\n    \
      \      android:layout_width=\"wrap_content\"\n          android:layout_height=\"match_parent\"/>\n    </androidx.constraintlayout.widget.ConstraintLayout>\n"
    replace: ''
  count: 1
