# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/android/java/res/layout/new_tab_page_layout.xml'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ android:layout_height="wrap_content"\ />\

      \

      \ \ \ \ <!\-\-\ Composeplate\ /\ "AI\ Mode"\ \-\->\

      \ \ \ \ <ViewStub\

      \ \ \ \ \ \ \ \ android:id="@\+id/composeplate_view_stub"\

      \ \ \ \ \ \ \ \ android:layout_width="match_parent"\

      \ \ \ \ \ \ \ \ android:layout_height="@dimen/composeplate_view_height"\

      \ \ \ \ \ \ \ \ android:layout_marginTop="@dimen/composeplate_view_margin_top"\

      \ \ \ \ \ \ \ \ android:layout="@layout/composeplate_view_layout"\

      \ \ \ \ \ \ \ \ />\

      \

      \ \ \ \ <!\-\-\ Most\ Visited\ Tiles\ \-\->\

      \ \ \ \ <ViewStub\

      '
    replace: "        android:layout_height=\"wrap_content\" />\n\n    <!-- Composeplate / \"AI Mode\" -->\n\n    <!-- Most Visited Tiles -->\n    <ViewStub\n"
