substitutions:
- description: Preserve the existing Brave passwords preference class from the qualified patch when introducing its rewrite
    recipe.
  regex:
    pattern: '    <org.chromium.chrome.browser.password_manager.settings.PasswordsPreference

      '
    replace: '    <org.chromium.chrome.browser.password_manager.settings.BravePasswordsPreference

      '
  count: 1
- description: Remove the preference for the already excluded Glic settings provider
  regex:
    pattern: "    <org.chromium.components.browser_ui.settings.ChromeBasePreference\n        android:fragment=\"org.chromium.chrome.browser.glic.GlicSettings\"\
      \n        android:key=\"glic\"\n        android:order=\"25\"\n        android:title=\"@string/glic_setting_label\"/>\n"
    replace: ''
  count: 1
