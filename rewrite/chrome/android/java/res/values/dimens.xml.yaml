# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android optional History/Search icon resource removal: chrome/android/java/res/values/dimens.xml'
  regex:
    re_pattern: '\ \ \ \ <!\-\-\ 18dp\ padding\ is\ added\ to\ each\ side\ of\ the\ remove\ button\ to\ limit\ the\ image\ width\ to\ 20dp\ \(56dp\ \-\ 2\ \*\ 18dp\)\.\ \-\->\

      \ \ \ \ <dimen\ name="history_item_remove_button_lateral_padding">18dp</dimen>\

      \ \ \ \ <dimen\ name="history_item_leading_padding">2dp</dimen>\

      \ \ \ \ <dimen\ name="history_item_spark_size">18dp</dimen>\

      \ \ \ \ <!\-\-\

      \ \ \ \ \ \ \ \ Calculated\ to\ align\ the\ spark\ center\ with\ the\ favicon\ bottom\-right\ corner\.\

      \ \ \ \ \ \ \ \ Favicon\ right\ edge\ =\ list_item_default_margin\(16dp\)\ \+\ list_item_start_icon_width\(36dp\)\ =\ 52dp\.\

      \ \ \ \ \ \ \ \ Spark\ margin\ start\ =\ 52dp\ \-\ \(history_item_spark_size\(18dp\)\ /\ 2\)\ =\ 43dp\.\

      \ \ \ \ \-\->\

      \ \ \ \ <dimen\ name="history_item_spark_margin_start">43dp</dimen>\

      \ \ \ \ <!\-\-\ Calculated\ using\ list_item_min_height\(64dp\)\ /\ 2\.\ \-\->\

      \ \ \ \ <dimen\ name="history_item_spark_margin_top">32dp</dimen>\

      \ \ \ \ <dimen\ name="history_item_spark_padding">4dp</dimen>\

      \

      \ \ \ \ <!\-\-\ Context\ Menu\ Dimensions\ \-\->\

      \ \ \ \ <!\-\-\ Prevent\ the\ chip\ from\ reaching\ the\ edges\ of\ the\ screen\ for\ long\ translations\.\ \-\->\

      '
    replace: "    <!-- 18dp padding is added to each side of the remove button to limit the image width to 20dp (56dp - 2 * 18dp). -->\n    <dimen name=\"history_item_remove_button_lateral_padding\">18dp</dimen>\n    <dimen name=\"history_item_leading_padding\">2dp</dimen>\n\n    <!-- Context Menu Dimensions -->\n    <!-- Prevent the chip from reaching the edges of the screen for long translations. -->\n"

- description: "Android Finds compile-out: Remove Android Finds dependency or source"
  regex:
    re_pattern: "\\ \\ \\ \\ <dimen\\ name=\"finds_opt_in_bottom_sheet_horizontal_margin\">24dp</dimen>\\\n"
    replace: ""
  count: 1
- description: Remove the eighteen dedicated Glic tab-strip dimensions and their group comments
  regex:
    pattern: "    <!-- Tab strip Glic buttons -->\n    <!-- vertical margin = tab strip height - glic background height =\
      \ 40 - 32 = 8dp. -->\n    <dimen name=\"tab_strip_glic_button_margin_height\">8dp</dimen>\n    <dimen name=\"tab_strip_glic_button_bg_width\"\
      >42dp</dimen>\n    <dimen name=\"tab_strip_glic_button_start_padding\">6dp</dimen>\n    <dimen name=\"tab_strip_glic_icon_width\"\
      >16dp</dimen>\n    <dimen name=\"tab_strip_glic_icon_text_padding\">4dp</dimen>\n    <dimen name=\"tab_strip_glic_button_standard_end_padding\"\
      >10dp</dimen>\n    <dimen name=\"tab_strip_glic_button_shortened_end_padding\">4dp</dimen>\n    <dimen name=\"tab_strip_glic_dismiss_icon_width\"\
      >24dp</dimen>\n    <dimen name=\"tab_strip_glic_dismiss_button_y_offset\">7dp</dimen>\n    <dimen name=\"tab_strip_glic_button_corner_radius\"\
      >10dp</dimen>\n    <dimen name=\"tab_strip_glic_button_inner_corner_radius\">2dp</dimen>\n    <dimen name=\"tab_strip_glic_actor_button_gap\"\
      >2dp</dimen>\n    <item name=\"tab_strip_glic_button_bg_hover_alpha\" format=\"float\" type=\"dimen\">0.20</item>\n\
      \    <item name=\"tab_strip_glic_button_bg_pressed_alpha\" format=\"float\" type=\"dimen\">0.30</item>\n    <item name=\"\
      tab_strip_glic_button_icon_focused_alpha\" format=\"float\" type=\"dimen\">1.0</item>\n    <item name=\"tab_strip_glic_button_icon_unfocused_alpha\"\
      \ format=\"float\" type=\"dimen\">0.65</item>\n    <item name=\"tab_strip_glic_button_icon_incognito_alpha\" format=\"\
      float\" type=\"dimen\">0.38</item>\n    <item name=\"tab_strip_glic_button_bg_incognito_alpha\" format=\"float\" type=\"\
      dimen\">0.10</item>\n\n"
    replace: ''
  count: 1
- description: Reviewed literal edit 1
  regex:
    pattern: "    <dimen name=\"shopping_chip_padding\">8dp</dimen>\n\n    <!-- Improved bookmark save flow properties-->\n"
    replace: "\n    <!-- Improved bookmark save flow properties-->\n"
  count: 1
- description: "Future534 2/1: Remove exact unused Android-only radius consumed only by the two excluded backgrounds; retain outer radius/image/widget values."
  regex:
    re_pattern: "\\ \\ \\ \\ <dimen\\ name=\"improved_bookmark_save_flow_inner_radius\">4dp</dimen>\\\n"
    replace: ""
  count: 1
- description: "After535 resource 11/1: Remove only dimensions whose named personal-context/loading consumers are already Android-excluded."
  regex:
    re_pattern: "\\ \\ \\ \\ <dimen\\ name=\"autofill_loading_dialog_spinner_size\">36dp</dimen>\\\n"
    replace: ""
  count: 1
- description: "Reviewed resource8 after538 source 8/1: reviewed literal edit"
  regex:
    re_pattern: "\\ \\ \\ \\ <!\\-\\-\\ Preview\\ tab\\ dimensions\\ \\-\\->\\\n\\ \\ \\ \\ <dimen\\ name=\"preview_tab_favicon_size\">24dp</dimen>\\\n\\\n"
    replace: ""
  count: 1
- description: Exclude Android promotional Tips implementation while retaining core notifications
  regex:
    pattern: "    <!-- Tab Strip Reorder dimensions -->\n    <dimen name=\"tab_strip_dragged_tab_shadow_thickness\">8dp</dimen>\n\n    <!-- Tips Notifications dimensions -->\n    <dimen name=\"tips_notifications_bottom_sheet_button_padding\">4dp</dimen>\n    <dimen name=\"tips_notifications_bottom_sheet_horizontal_margin\">24dp</dimen>\n    <dimen name=\"tips_notifications_bottom_sheet_step_content_margin_start\">16dp</dimen>\n    <dimen name=\"tips_notifications_bottom_sheet_step_number_width\">25dp</dimen>\n    <dimen name=\"tips_notifications_bottom_sheet_title_padding\">24dp</dimen>\n    <dimen name=\"tips_notifications_bottom_sheet_vertical_margin\">20dp</dimen>\n\n    <!-- View list background dimensions -->\n    <dimen name=\"view_list_item_large_radius\">24dp</dimen>\n"
    replace: "    <!-- Tab Strip Reorder dimensions -->\n    <dimen name=\"tab_strip_dragged_tab_shadow_thickness\">8dp</dimen>\n\n\n    <!-- View list background dimensions -->\n    <dimen name=\"view_list_item_large_radius\">24dp</dimen>\n"
  count: 1
- description: Remove proven unused Android Tips and excluded-feature resources
  regex:
    pattern: "    <!-- View list background dimensions -->\n    <dimen name=\"view_list_item_large_radius\">24dp</dimen>\n    <dimen name=\"view_list_item_small_radius\">3dp</dimen>\n\n"
    replace: ""
  count: 1
