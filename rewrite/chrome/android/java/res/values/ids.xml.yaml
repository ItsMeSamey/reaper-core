# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/android/java/res/values/ids.xml'
  regex:
    re_pattern: '\

      \ \ \ \ <!\-\-\ Link\ Group\ \-\->\

      \ \ \ \ <!\-\-\ go/keep\-sorted\ start\ \-\->\

      \ \ \ \ <item\ type="id"\ name="contextmenu_ask_gemini"\ />\

      \ \ \ \ <item\ type="id"\ name="contextmenu_direct_share_link"\ />\

      \ \ \ \ <item\ type="id"\ name="contextmenu_open_in_ephemeral_tab"\ />\

      \ \ \ \ <item\ type="id"\ name="contextmenu_open_in_incognito_tab"\ />\

      '
    replace: "\n    <!-- Link Group -->\n    <!-- go/keep-sorted start -->\n    <item type=\"id\" name=\"contextmenu_direct_share_link\" />\n    <item type=\"id\" name=\"contextmenu_open_in_ephemeral_tab\" />\n    <item type=\"id\" name=\"contextmenu_open_in_incognito_tab\" />\n"

- description: 'Android obsolete Glic tab-menu ID definition removal: chrome/android/java/res/values/ids.xml'
  regex:
    re_pattern: '\ \ \ \ <item\ type="id"\ name="forward_menu_id"\ />\

      \ \ \ \ <item\ type="id"\ name="get_image_descriptions_id"\ />\

      \ \ \ \ <item\ type="id"\ name="glic_menu_id"\ />\

      \ \ \ \ <item\ type="id"\ name="glic_share_new_chat_sub_menu_id"\ />\

      \ \ \ \ <item\ type="id"\ name="glic_share_recent_sub_menu_id"\ />\

      \ \ \ \ <item\ type="id"\ name="glic_unshare_menu_id"\ />\

      \ \ \ \ <item\ type="id"\ name="google_password_manager_menu_id"\ />\

      \ \ \ \ <item\ type="id"\ name="help_id"\ />\

      \ \ \ \ <item\ type="id"\ name="help_parent_menu_id"\ />\

      '
    replace: "    <item type=\"id\" name=\"forward_menu_id\" />\n    <item type=\"id\" name=\"get_image_descriptions_id\" />\n    <item type=\"id\" name=\"glic_menu_id\" />\n    <item type=\"id\" name=\"google_password_manager_menu_id\" />\n    <item type=\"id\" name=\"help_id\" />\n    <item type=\"id\" name=\"help_parent_menu_id\" />\n"

- description: 'Android obsolete Glic app-menu ID definition removal: chrome/android/java/res/values/ids.xml'
  regex:
    re_pattern: '\ \ \ \ <item\ type="id"\ name="find_in_page_id"\ />\

      \ \ \ \ <item\ type="id"\ name="forward_menu_id"\ />\

      \ \ \ \ <item\ type="id"\ name="get_image_descriptions_id"\ />\

      \ \ \ \ <item\ type="id"\ name="glic_menu_id"\ />\

      \ \ \ \ <item\ type="id"\ name="google_password_manager_menu_id"\ />\

      \ \ \ \ <item\ type="id"\ name="help_id"\ />\

      \ \ \ \ <item\ type="id"\ name="help_parent_menu_id"\ />\

      '
    replace: "    <item type=\"id\" name=\"find_in_page_id\" />\n    <item type=\"id\" name=\"forward_menu_id\" />\n    <item type=\"id\" name=\"get_image_descriptions_id\" />\n    <item type=\"id\" name=\"google_password_manager_menu_id\" />\n    <item type=\"id\" name=\"help_id\" />\n    <item type=\"id\" name=\"help_parent_menu_id\" />\n"
