substitutions:
- description: Refresh the visible Brave search setting after the ordinary asynchronous service
    load
  regex:
    re_pattern: '\ \ \ \ public\ void\ testSearchEngineDisabled\(\)\ \{\

      \ \ \ \ \ \ \ \ Mockito\.doReturn\(false\)\.when\(mMockTemplateUrlService\)\.isLoaded\(\);\

      \ \ \ \ \ \ \ \ configureMockSearchEngine\(\);\

      \

      \ \ \ \ \ \ \ \ startSettings\(\);\

      \ \ \ \ \ \ \ \ Preference\ searchEngineSettings\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assertSettingsExists\(MainSettings\.PREF_SEARCH_ENGINE,\
      SearchEngineSettings\.class\);\

      \ \ \ \ \ \ \ \ //\ Verification\ for\ summary\ for\ the\ search\ engine\ and\ the\ homepage\

      \ \ \ \ \ \ \ \ Assert\.assertFalse\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Search\ Engine\ preference\ should\ be\ disabled\ when\
      service\ is\ not\ ready\.",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ searchEngineSettings\.isEnabled\(\)\);\

      \ \ \ \ \ \ \ \ Assert\.assertTrue\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Search\ Engine\ preference\ should\ be\ disabled\ when\
      service\ is\ not\ ready\.",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TextUtils\.isEmpty\(searchEngineSettings\.getSummary\(\)\)\);\

      \ \ \ \ \}\

      '
    replace: "    public void testSearchEngineDisabled() {\n        Mockito.doReturn(false).when(mMockTemplateUrlService).isLoaded();\n\
      \        Mockito.doReturn(true).when(mMockTemplateUrlService).hasNativeService();\n  \
      \      configureMockSearchEngine();\n\n        startSettings();\n        Preference searchEngineSettings\
      \ =\n                assertSettingsExists(MainSettings.PREF_SEARCH_ENGINE, SearchEngineSettings.class);\n\
      \        // Verification for summary for the search engine and the homepage\n        Assert.assertFalse(\n\
      \                \"Search Engine preference should be disabled when service is not ready.\"\
      ,\n                searchEngineSettings.isEnabled());\n        Assert.assertTrue(\n  \
      \              \"Search Engine preference should be disabled when service is not ready.\"\
      ,\n                TextUtils.isEmpty(searchEngineSettings.getSummary()));\n\n        ArgumentCaptor<TemplateUrlService.LoadListener>\
      \ loadListeners =\n                ArgumentCaptor.forClass(TemplateUrlService.LoadListener.class);\n\
      \        verify(mMockTemplateUrlService, atLeastOnce())\n                .registerLoadListener(loadListeners.capture());\n\
      \        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n               \
      \     Preference braveSearchEngine =\n                            mMainSettings.getPreferenceScreen()\n\
      \                                    .findPreference(\"brave_search_engines\");\n    \
      \                Assert.assertNotNull(braveSearchEngine);\n                    Assert.assertFalse(braveSearchEngine.isEnabled());\n\
      \                    Mockito.doReturn(true).when(mMockTemplateUrlService).isLoaded();\n\
      \                    for (TemplateUrlService.LoadListener listener : loadListeners.getAllValues())\
      \ {\n                        listener.onTemplateUrlServiceLoaded();\n                \
      \    }\n                    Assert.assertTrue(\n                            \"The visible\
      \ search setting must enable without reopening Settings.\",\n                        \
      \    braveSearchEngine.isEnabled());\n                });\n    }\n"
  count: 1
