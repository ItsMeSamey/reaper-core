# Android retained-test and resource-consumer compile closure.
substitutions:
  - description: "Retain current Android test/API contract, literal edit 1."
    regex:
      pattern: "                        // If it doesn't fit, it scales to match the Feed width.\n                        int expectedContainerWidthSlack = expectedMvtLateralMargin * 2;\n"
      replace: "                        // Otherwise, local shortcuts share the capped search-box width.\n                        int expectedContainerWidthSlack = width - expectedMvtWidth;\n"
    count: 1
  - description: "Retain current Android test/API contract, literal edit 2."
    regex:
      pattern: "                    int expectedMvtLateralMargin =\n                            ntp.getNewTabPageCoordinator().getLateralMarginToMatchFeeds();\n"
      replace: "                    int searchBoxTwoSideMargin =\n                            ntp.getNewTabPageCoordinator().getSearchBoxTwoSideMarginForTesting();\n                    int maxSearchBoxWidth =\n                            res.getDimensionPixelSize(R.dimen.ntp_search_box_max_width);\n                    int expectedMvtWidth =\n                            Math.min(width - searchBoxTwoSideMargin, maxSearchBoxWidth);\n"
    count: 1
