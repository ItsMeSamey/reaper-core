substitutions:
- description: Remove dedicated price fixture support or adapt preserved ordinary behavior in PersistedTabDataTest
  regex:
    pattern: "dUtils.runOnUiThreadBlocking(() -> {});\n\n        PriceTrackingFeatures.setPriceAnnotationsEnabledForTesting(false);\n\
      \n        PersistedTabDataJni.setInstance"
    replace: "dUtils.runOnUiThreadBlocking(() -> {});\n\n        PersistedTabDataJni.setInstance"
  count: 1
- description: Remove dedicated price fixture support or adapt preserved ordinary behavior in PersistedTabDataTest
  regex:
    pattern: 'chromium.base.test.util.CallbackHelper;

      import org.chromium.chrome.browser.price_tracking.PriceTrackingFeatures;

      import org.chromium.chrome.browser.profi'
    replace: 'chromium.base.test.util.CallbackHelper;

      import org.chromium.chrome.browser.profi'
  count: 1
- description: Remove the dedicated shopping mock
  regex:
    pattern: '    @Mock ShoppingPersistedTabData mShoppingPersistedTabDataMock;

      '
    replace: ''
  count: 1
- description: Remove shopping-only mock initialization from ordinary persistence tests
  regex:
    pattern: "    public void setUp() throws Exception {\n        // TODO(crbug.com/40229155): Remove runOnUiThreadBlocking\
      \ call after code\n        // refactoring/cleanup\n        // ShoppingPersistedTabData must be mocked on the ui thread,\
      \ otherwise a thread assert will\n        // fail. An ObserverList is created when creating the mock. The same ObserverList\
      \ is used\n        // later in the test.\n        ThreadUtils.runOnUiThreadBlocking(() -> {});\n\n"
    replace: '    public void setUp() {

      '
  count: 1
- description: Keep testOnTabClose and verify the actual retained JNI cleanup boundary
  regex:
    pattern: "        tab.getUserDataHost()\n                .setUserData(ShoppingPersistedTabData.class, mShoppingPersistedTabDataMock);\n\
      \        PersistedTabData.onTabClose(tab);\n        verify(mShoppingPersistedTabDataMock, times(1)).disableSaving();\n"
    replace: "        PersistedTabData.onTabClose(tab);\n        verify(mPersistedTabDataJni, times(1)).onTabClose(tab);\n"
  count: 1
