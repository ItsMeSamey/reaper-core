# Android retained-test and resource-consumer compile closure.
substitutions:
  - description: "Retain current Android test/API contract, literal edit 1."
    regex:
      pattern: "        ThreadUtils.runOnUiThreadBlocking(toolbarManager::endFuseboxInput);\n"
      replace: "        ThreadUtils.runOnUiThreadBlocking(toolbarManager::endInput);\n"
    count: 1
  - description: "Retain current Android test/API contract, literal edit 2."
    regex:
      pattern: "                        toolbarManager.beginFuseboxInput(\n"
      replace: "                        toolbarManager.beginInput(\n"
    count: 1
