# Android site-search tests read the retained per-tab input state.
substitutions:
  - description: "Read ordinary input state without restoring excluded Fusebox. APIs and assertions stay intact."
    regex:
      pattern: "                    var state = FuseboxSessionState.from(dataProvider);"
      replace: "                    var inputHost = dataProvider.getInputUserDataHost();\n                    assertNotNull(inputHost);\n                    var state = inputHost.getUserData(LocationBarMediator.InputSession.class);"
    count: 1
