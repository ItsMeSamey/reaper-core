# Android DevTools profile ownership and phone entry.
substitutions:
- description: Assert exact DevTools profile identity and feature-disable behavior
  regex:
    re_pattern: import\ static\ org\.junit\.Assert\.assertTrue;
    replace: 'import static org.junit.Assert.assertTrue;

      import static org.junit.Assert.assertFalse;

      import static org.junit.Assert.assertSame;'
- description: Retain the explicit Android frontend kill switch in regression coverage
  regex:
    re_pattern: import\ org\.chromium\.base\.test\.util\.Features\.EnableFeatures;
    replace: 'import org.chromium.base.test.util.Features.EnableFeatures;

      import org.chromium.base.test.util.Features.DisableFeatures;'
- description: Create a real incognito tab for the frontend profile-transfer regression
  regex:
    re_pattern: import\ org\.chromium\.chrome\.browser\.tabmodel\.TabModel;
    replace: 'import org.chromium.chrome.browser.tabmodel.TabModel;

      import org.chromium.chrome.browser.tabmodel.TabLaunchType;'
- description: Inspect a real about-blank page instead of substituting a profile-only fixture
  regex:
    re_pattern: import\ org\.chromium\.content_public\.browser\.WebContents;
    replace: 'import org.chromium.content_public.browser.WebContents;

      import org.chromium.content_public.browser.LoadUrlParams;'
- description: Exercise regular and primary-OTR ownership through the actual DevTools activity
  regex:
    re_pattern: \ \ \ \ \ \ \ \ Profile\ profile\ =\ inspectedTab\.getProfile\(\);
    replace: "        checkDevToolsProfileAndClose(tabModel, inspectedTab);\n    }\n\n    @Test\n    @MediumTest\n    public void testOpenIncognitoDevToolsRetainsExactProfile() {\n        Tab inspectedTab =\n                runOnUiThreadBlocking(\n                        () ->\n                                mTestRule.getActivity().getTabCreator(true).createNewTab(\n                                        new LoadUrlParams(\"about:blank\"),\n                                        TabLaunchType.FROM_CHROME_UI,\n                                        null));\n        assertTrue(inspectedTab.getProfile().isOffTheRecord());\n        checkDevToolsProfileAndClose(\n                mTestRule.getActivity().getTabModelSelector().getModel(true), inspectedTab);\n    }\n\n    @Test\n    @MediumTest\n    @DisableFeatures(ContentFeatureList.ANDROID_DEV_TOOLS_FRONTEND)\n    public void testFrontendDisableStillBlocksUserEntry() {\n        Tab tab = mTestRule.getActivity().getCurrentTabModel().getCurrentTabSupplier().get();\n        assertFalse(\n                runOnUiThreadBlocking(\n                        () -> DevToolsWindowAndroid.isDevToolsAllowedFor(\n                                tab.getProfile(), tab.getWebContents())));\n    }\n\n    private void checkDevToolsProfileAndClose(TabModel tabModel, Tab inspectedTab) {\n        Profile profile = inspectedTab.getProfile();"
- description: Verify real frontend/model/provider profile equality before testing teardown
  regex:
    re_pattern: \ \ \ \ \ \ \ \ //\ DevToolsActivity\ gets\ closed\ when\ the\ inspected\ tab\ closes\.
    replace: "        CriteriaHelper.pollUiThread(\n                () -> {\n                    Tab frontend = activity.getCurrentTabModel().getCurrentTabSupplier().get();\n                    return frontend != null && \"devtools\".equals(frontend.getUrl().getScheme());\n                },\n                \"DevTools frontend was not attached.\");\n        runOnUiThreadBlocking(\n                () -> {\n                    assertSame(profile, activity.getCurrentTabModel().getProfile());\n                    assertSame(profile,\n                            activity.getCurrentTabModel().getCurrentTabSupplier().get().getProfile());\n                    assertSame(profile.getOriginalProfile(),\n                            activity.getProfileProviderSupplier().get().getOriginalProfile());\n                    if (profile.isOffTheRecord()) {\n                        assertSame(profile,\n                                activity.getProfileProviderSupplier().get().getOffTheRecordProfile());\n                    }\n                });\n\n        // DevToolsActivity gets closed when the inspected tab closes."
