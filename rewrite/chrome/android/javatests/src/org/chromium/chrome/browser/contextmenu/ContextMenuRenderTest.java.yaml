# Generic extension context-menu render fixture uses a retained browser icon.
substitutions:
  - description: "Keep context-menu render coverage independent of removed Lens resources."
    regex:
      pattern: "        Bitmap testBitmap = drawableToBitmap(sActivity.getDrawable(R.drawable.lens_icon));"
      replace: "        Bitmap testBitmap = drawableToBitmap(sActivity.getDrawable(R.drawable.ic_search_24dp));"
    count: 1
