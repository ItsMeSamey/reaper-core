# Android retained omnibox tests follow the compiled ordinary UI.
substitutions:
  - description: "Retain the selected Android omnibox test contract, literal edit 1."
    regex:
      pattern: "import static org.mockito.ArgumentMatchers.any;\n"
      replace: ""
    count: 1
  - description: "Retain the selected Android omnibox test contract, literal edit 2."
    regex:
      pattern: "import org.chromium.chrome.browser.lens.LensController;\n"
      replace: ""
    count: 1
  - description: "Retain the selected Android omnibox test contract, literal edit 3."
    regex:
      pattern: "    @Mock private LensController mLensController;\n"
      replace: ""
    count: 1
  - description: "Retain the selected Android omnibox test contract, literal edit 4."
    regex:
      pattern: "        mLocationBarCoordinator.setLensControllerForTesting(mLensController);\n"
      replace: ""
    count: 1
  - description: "Retain the selected Android omnibox test contract, literal edit 5."
    regex:
      pattern: "    @Test\n    @MediumTest\n    @Restriction(DeviceFormFactor.PHONE)\n    public void testFocusLogic_cameraAssistedSearchLenButtonVisibilityPhone_lensEnabled() {\n        startActivityNormally();\n        doReturn(true).when(mVoiceRecognitionHandler).isVoiceSearchEnabled();\n        doReturn(true).when(mLensController).isLensEnabled(any());\n        mActivityTestRule.loadUrl(mHostUrl);\n\n        onView(withId(R.id.lens_camera_button)).check(matches(not(isDisplayed())));\n        onView(withId(R.id.delete_button)).check(matches(not(isDisplayed())));\n\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mUrlBar.requestFocus();\n                });\n\n        ViewUtils.waitForVisibleView(withId(R.id.lens_camera_button));\n        onView(withId(R.id.lens_camera_button)).check(matches(isDisplayed()));\n        onView(withId(R.id.delete_button)).check(matches(not(isDisplayed())));\n        assertLocationBarButtonsAre(R.id.lens_camera_button, R.id.mic_button);\n\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mLocationBarCoordinator.setOmniboxEditingText(mHostUrl);\n                });\n\n        onView(withId(R.id.lens_camera_button)).check(matches(not(isDisplayed())));\n        onView(withId(R.id.delete_button)).check(matches(isDisplayed()));\n\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mUrlBar.clearFocus();\n                });\n\n        waitForNoView(withId(R.id.delete_button));\n    }\n\n"
      replace: ""
    count: 1
  - description: "Retain the selected Android omnibox test contract, literal edit 6."
    regex:
      pattern: "        doReturn(false).when(mLensController).isLensEnabled(any());\n"
      replace: ""
    count: 1
  - description: "Retain the selected Android omnibox test contract, literal edit 7."
    regex:
      pattern: "        doReturn(true).when(mLensController).isLensEnabled(any());\n"
      replace: ""
    count: 1
  - description: "Retain the selected Android omnibox test contract, literal edit 8."
    regex:
      pattern: "            // With profileDiscEnabled a Signin button appears with priority over the lens button.\n            onView(withId(profileDiscEnabled ? R.id.signin_button : R.id.lens_camera_button))\n                    .check(matches(withEffectiveVisibility(ViewMatchers.Visibility.VISIBLE)));"
      replace: "            // The sign-in button remains available; the removed Lens button stays hidden.\n            onView(withId(profileDiscEnabled ? R.id.signin_button : R.id.lens_camera_button))\n                    .check(\n                            matches(\n                                    withEffectiveVisibility(\n                                            profileDiscEnabled\n                                                    ? ViewMatchers.Visibility.VISIBLE\n                                                    : ViewMatchers.Visibility.GONE)));"
    count: 1
