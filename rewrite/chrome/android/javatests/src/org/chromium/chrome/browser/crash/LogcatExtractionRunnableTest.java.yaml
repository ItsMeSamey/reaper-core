      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: 'import\ org\.chromium\.components\.background_task_scheduler\.TaskIds;\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ private\ static\ class\ TestJobScheduler\ extends\ JobScheduler\ \{\

      \ \ \ \ \ \ \ \ TestJobScheduler\(\)\ \{\}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ void\ cancel\(int\ jobId\)\ \{\}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ void\ cancelAll\(\)\ \{\}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ @SuppressLint\("WrongConstant"\)\

      \ \ \ \ \ \ \ \ public\ int\ enqueue\(JobInfo\ job,\ JobWorkItem\ work\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ 0;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ List<JobInfo>\ getAllPendingJobs\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ null;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ JobInfo\ getPendingJob\(int\ jobId\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ null;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ int\ schedule\(JobInfo\ job\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ Assert\.assertEquals\(TaskIds\.CHROME_MINIDUMP_UPLOADING_JOB_ID,\ job\.getId\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ Assert\.assertEquals\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeMinidumpUploadJobService\.class\.getName\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ job\.getService\(\)\.getClassName\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ JobScheduler\.RESULT_SUCCESS;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      \ \ \ \ //\ Responsible\ for\ verifying\ that\ the\ correct\ intent\ is\ fired\ after\ the\ logcat\ is\ extracted\.\

      \ \ \ \ private\ static\ class\ TestContext\ extends\ AdvancedMockContext\ \{\

      \ \ \ \ \ \ \ \ TestContext\(Context\ realContext\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ super\(realContext\);\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ Object\ getSystemService\(String\ name\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(Context\.JOB_SCHEDULER_SERVICE\.equals\(name\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ new\ TestJobScheduler\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ return\ super\.getSystemService\(name\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ Context\ testContext\ =\ new\ TestContext\(ApplicationProvider\.getApplicationContext\(\)\);\

      '
    replace: ''
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: 'import\ org\.chromium\.components\.minidump_uploader\.CrashTestRule;\

      '
