# Android retained-test and resource-consumer compile closure.
substitutions:
  - description: "Retain current Android test/API contract, literal edit 1."
    regex:
      pattern: "        ThreadUtils.runOnUiThreadBlocking(activity.getToolbarManager()::endFuseboxInput);\n"
      replace: "        ThreadUtils.runOnUiThreadBlocking(activity.getToolbarManager()::endInput);\n"
    count: 1
  - description: "Retain current Android test/API contract, literal edit 2."
    regex:
      pattern: "                            .beginFuseboxInput(\n"
      replace: "                            .beginInput(\n"
    count: 1
