substitutions:
- description: Remove only the unavailable factory JNI import
  regex:
    pattern: 'import org.chromium.chrome.browser.commerce.ShoppingServiceFactoryJni;

      '
    replace: ''
  count: 1
- description: Remove the replaced factory Natives mock field
  regex:
    pattern: '    @Mock private ShoppingServiceFactory.Natives mShoppingServiceFactoryJniMock;

      '
    replace: ''
  count: 1
- description: Remove only the old factory JNI mock registration
  regex:
    pattern: '        ShoppingServiceFactoryJni.setInstanceForTesting(mShoppingServiceFactoryJniMock);

      '
    replace: ''
  count: 1
- description: Reuse the existing resetting factory injection of the same ShoppingService mock
  regex:
    pattern: '        doReturn(mShoppingService).when(mShoppingServiceFactoryJniMock).getForProfile(any());

      '
    replace: '        ShoppingServiceFactory.setShoppingServiceForTesting(mShoppingService);

      '
  count: 1
- description: Use the real unavailable utility instead of its removed JNI mock
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtilsJni;

      '
    replace: ''
  count: 1
- description: Remove only the obsolete default-false utility mock
  regex:
    pattern: '    @Mock private CommerceFeatureUtils.Natives mCommerceFeatureUtilsJniMock;

      '
    replace: ''
  count: 1
- description: Use the production unavailable eligibility result in ordinary setup
  regex:
    pattern: '        CommerceFeatureUtilsJni.setInstanceForTesting(mCommerceFeatureUtilsJniMock);

      '
    replace: ''
  count: 1
- description: Keep the same false eligibility through the real unavailable utility
  regex:
    pattern: '        doReturn(false).when(mCommerceFeatureUtilsJniMock).isShoppingListEligible(anyLong());

      '
    replace: ''
  count: 1
- description: Remove the now-unused utility interface import
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtils;

      '
    replace: ''
  count: 1
- description: Remove only the now-unused anyLong static import
  regex:
    pattern: 'import static org.mockito.ArgumentMatchers.anyLong;

      '
    replace: ''
  count: 1
- description: Remove only the now-unused doReturn static import
  regex:
    pattern: 'import static org.mockito.Mockito.doReturn;

      '
    replace: ''
  count: 1
