substitutions:
- description: Remove only the unavailable factory JNI import
  regex:
    pattern: 'import org.chromium.chrome.browser.commerce.ShoppingServiceFactoryJni;

      '
    replace: ''
  count: 1
- description: Remove the replaced factory Natives mock field
  regex:
    pattern: '    @Mock private ShoppingServiceFactory.Natives mShoppingServiceFactoryJniMock;

      '
    replace: ''
  count: 1
- description: Remove only the old factory JNI mock registration
  regex:
    pattern: '        ShoppingServiceFactoryJni.setInstanceForTesting(mShoppingServiceFactoryJniMock);

      '
    replace: ''
  count: 1
- description: Reuse the existing resetting factory injection of the same ShoppingService mock
  regex:
    pattern: '        doReturn(mShoppingService).when(mShoppingServiceFactoryJniMock).getForProfile(any());

      '
    replace: '        ShoppingServiceFactory.setShoppingServiceForTesting(mShoppingService);

      '
  count: 1
- description: Remove only the dedicated tracked-products filter case for the excluded shopping backend
  regex:
    pattern: "    @Test\n    @MediumTest\n    @Restriction({DeviceFormFactor.PHONE})\n    public void testShoppingFilterInBookmarks()\
      \ throws InterruptedException, ExecutionException {\n        doReturn(true).when(mCommerceFeatureUtilsJniMock).isShoppingListEligible(anyLong());\n\
      \        BookmarkId id = addBookmark(TEST_PAGE_TITLE_GOOGLE, mTestPage);\n        PowerBookmarkMeta.Builder meta =\n\
      \                PowerBookmarkMeta.newBuilder()\n                        .setShoppingSpecifics(\n                  \
      \              ShoppingSpecifics.newBuilder().setProductClusterId(1234L).build());\n        runOnUiThreadBlocking(\n\
      \                () -> {\n                    mBookmarkModel.setPowerBookmarkMeta(id, meta.build());\n             \
      \   });\n        doReturn(true)\n                .when(mShoppingService)\n                .isSubscribedFromCache(\n\
      \                        PowerBookmarkUtils.createCommerceSubscriptionForShoppingSpecifics(\n                      \
      \          meta.build().getShoppingSpecifics()));\n        doCallback((Callback<List<BookmarkId>> callback) -> callback.onResult(Arrays.asList(id)))\n\
      \                .when(mShoppingService)\n                .getAllPriceTrackedBookmarks(any());\n\n        openBookmarkManager();\n\
      \        BookmarkTestUtil.waitForBookmarkModelLoaded();\n        runOnUiThreadBlocking(\n                () -> {\n \
      \                   mDelegate.openFolder(mBookmarkModel.getRootFolderId());\n                });\n\n        onView(withText(\"\
      Tracked products\")).perform(click());\n\n        // Check that we are in the mobile bookmarks folder.\n        assertEquals(\"\
      Bookmarks\", mToolbar.getTitle());\n        assertEquals(\n                \"Shopping bookmark is present.\",\n    \
      \            TEST_PAGE_TITLE_GOOGLE,\n                getNthBookmarkRow(1).getTitleForTesting());\n    }\n\n"
    replace: ''
  count: 1
