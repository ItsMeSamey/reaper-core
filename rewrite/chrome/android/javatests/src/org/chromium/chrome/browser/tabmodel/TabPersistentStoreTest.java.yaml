substitutions:
- description: Use retained archive persistence instead of the removed price product
  regex:
    pattern: 'import org.chromium.chrome.browser.tab.state.ShoppingPersistedTabData;

      '
    replace: 'import org.chromium.chrome.browser.tab.state.ArchivePersistedTabData;

      import org.chromium.chrome.browser.tab.state.PersistedTabData;

      '
  count: 1
- description: Use the existing reset lifecycle for temporary fixture registration
  regex:
    pattern: 'import org.chromium.base.ContextUtils;

      '
    replace: 'import org.chromium.base.ContextUtils;

      import org.chromium.base.ResettersForTesting;

      '
  count: 1
- description: Register Archive only for this fixture and restore exact prior membership
  regex:
    pattern: "    public void testMaintenance() throws Exception {\n        Looper.prepare();\n"
    replace: "    public void testMaintenance() throws Exception {\n        Looper.prepare();\n        ThreadUtils.runOnUiThreadBlocking(\n\
      \                () -> {\n                    if (PersistedTabData.getSupportedMaintenanceClassesForTesting()\n    \
      \                        .add(ArchivePersistedTabData.class)) {\n                        ResettersForTesting.register(\n\
      \                                () ->\n                                        ThreadUtils.runOnUiThreadBlocking(\n\
      \                                                () -> {\n                                                    PersistedTabData\n\
      \                                                            .getSupportedMaintenanceClassesForTesting()\n         \
      \                                                   .remove(ArchivePersistedTabData.class);\n                      \
      \                          }));\n                    }\n                });\n"
  count: 1
- description: Preserve real LevelDB and orphan/live-entry assertions using the public async Archive factory
  regex:
    pattern: "    private static MockTab createTabAndPersistedEntry(final int tabId)\n            throws TimeoutException,\
      \ ExecutionException {\n        CallbackHelper helper = new CallbackHelper();\n        MockTab tab =\n             \
      \   ThreadUtils.runOnUiThreadBlocking(\n                        () -> {\n                            MockTab newTab\
      \ =\n                                    new MockTab(tabId, ProfileManager.getLastUsedRegularProfile());\n         \
      \                   SettableNonNullObservableSupplier<Boolean> observableSupplier =\n                              \
      \      ObservableSuppliers.createNonNull(true);\n                            ShoppingPersistedTabData.from(newTab)\n\
      \                                    .registerIsTabSaveEnabledSupplier(observableSupplier);\n                      \
      \      ShoppingPersistedTabData.from(newTab).save();\n                            ShoppingPersistedTabData.from(newTab)\n\
      \                                    .existsInStorage(\n                                            (res) -> {\n   \
      \                                             assertTrue(res);\n                                                helper.notifyCalled();\n\
      \                                            });\n                            return newTab;\n                     \
      \   });\n        helper.waitForCallback(0);\n        return tab;\n    }\n\n    private static void checkEntryExists(Tab\
      \ tab, boolean expectedExists) throws TimeoutException {\n        CallbackHelper helper = new CallbackHelper();\n  \
      \      ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    ShoppingPersistedTabData.from(tab)\n\
      \                            .existsInStorage(\n                                    (res) -> {\n                   \
      \                     assertEquals(expectedExists, res);\n                                        helper.notifyCalled();\n\
      \                                    });\n                });\n        helper.waitForCallback(0);\n    }\n\n"
    replace: "    private static MockTab createTabAndPersistedEntry(final int tabId)\n            throws TimeoutException,\
      \ ExecutionException {\n        CallbackHelper helper = new CallbackHelper();\n        MockTab tab =\n             \
      \   ThreadUtils.runOnUiThreadBlocking(\n                        () -> {\n                            MockTab newTab\
      \ =\n                                    MockTab.createAndInitialize(\n                                            tabId,\
      \ ProfileManager.getLastUsedRegularProfile());\n                            newTab.setIsInitialized(true);\n       \
      \                     ArchivePersistedTabData.from(\n                                    newTab,\n                 \
      \                   data -> {\n                                        assertNotNull(data);\n                      \
      \                  SettableNonNullObservableSupplier<Boolean> supplier =\n                                         \
      \       ObservableSuppliers.createNonNull(true);\n                                        data.registerIsTabSaveEnabledSupplier(supplier);\n\
      \                                        data.save();\n                                        data.existsInStorage(\n\
      \                                                res -> {\n                                                    assertTrue(res);\n\
      \                                                    helper.notifyCalled();\n                                      \
      \          });\n                                    });\n                            return newTab;\n              \
      \          });\n        helper.waitForCallback(0);\n        return tab;\n    }\n\n    private static void checkEntryExists(Tab\
      \ tab, boolean expectedExists) throws TimeoutException {\n        CallbackHelper helper = new CallbackHelper();\n  \
      \      ThreadUtils.runOnUiThreadBlocking(\n                () ->\n                        ArchivePersistedTabData.from(\n\
      \                                tab,\n                                data -> {\n                                 \
      \   assertNotNull(data);\n                                    data.existsInStorage(\n                              \
      \              res -> {\n                                                assertEquals(expectedExists, res);\n      \
      \                                          helper.notifyCalled();\n                                            });\n\
      \                                }));\n        helper.waitForCallback(0);\n    }\n\n"
  count: 1
