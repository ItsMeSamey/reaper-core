substitutions:
- description: Keep obscured Settings header content hidden from accessibility 1
  regex:
    pattern: "                    assertNotNull(headerGroup);\n\n                    // In single-column mode"
    replace: "                    assertNotNull(headerGroup);\n                    Fragment headerFragment =\n                            settings.getChildFragmentManager()\n                                    .findFragmentById(R.id.preferences_header);\n                    assertNotNull(headerFragment);\n                    View headerContent = headerFragment.requireView();\n\n                    // In single-column mode"
  count: 1
- description: Keep obscured Settings header content hidden from accessibility 2
  regex:
    pattern: "                            headerGroup.getImportantForAccessibility());\n\n                    // In two-column mode"
    replace: "                            headerGroup.getImportantForAccessibility());\n                    assertEquals(\n                            View.IMPORTANT_FOR_ACCESSIBILITY_NO_HIDE_DESCENDANTS,\n                            headerContent.getImportantForAccessibility());\n\n                    // SlidingPaneLayout's provider can expose its direct child during an AX query.\n                    headerGroup.setImportantForAccessibility(View.IMPORTANT_FOR_ACCESSIBILITY_YES);\n                    assertEquals(\n                            View.IMPORTANT_FOR_ACCESSIBILITY_NO_HIDE_DESCENDANTS,\n                            headerContent.getImportantForAccessibility());\n\n                    // In two-column mode"
  count: 1
- description: Keep obscured Settings header content hidden from accessibility 3
  regex:
    pattern: "                            View.IMPORTANT_FOR_ACCESSIBILITY_AUTO,\n                            headerGroup.getImportantForAccessibility());"
    replace: "                            View.IMPORTANT_FOR_ACCESSIBILITY_AUTO,\n                            headerGroup.getImportantForAccessibility());\n                    assertEquals(\n                            View.IMPORTANT_FOR_ACCESSIBILITY_AUTO,\n                            headerContent.getImportantForAccessibility());"
  count: 1
