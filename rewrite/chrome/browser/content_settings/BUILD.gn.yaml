# Match browser- and renderer-initiated Web Store navigation UA behavior.
substitutions:
  - description: Expose extension build flags to the Android navigation observer.
    regex:
      pattern: "    deps += [\n      \"//chrome/browser/notifications\",\n      \"//chrome/browser/notifications:notifications_java_enum_srcjar\",\n    ]"
      replace: |2-
            deps += [
              "//chrome/browser/notifications",
              "//chrome/browser/notifications:notifications_java_enum_srcjar",
              "//extensions/buildflags",
            ]
