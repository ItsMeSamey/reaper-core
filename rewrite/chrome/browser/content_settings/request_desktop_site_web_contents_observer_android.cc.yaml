# Match browser- and renderer-initiated Web Store navigation UA behavior.
substitutions:
  - description: Read the compiled extension backend flag.
    regex:
      pattern: "#include \"content/public/common/content_features.h\""
      replace: |2-
        #include "content/public/common/content_features.h"
        #include "extensions/buildflags/buildflags.h"
  - description: Keep the exact HTTPS Web Store host on desktop UA for renderer links.
    regex:
      pattern: "  desktop_mode |= should_allow_on_external_display;"
      replace: |2-
          desktop_mode |= should_allow_on_external_display;
        #if BUILDFLAG(ENABLE_EXTENSIONS_CORE)
          // Match TabImpl's browser-initiated override; do not persist a site setting.
          desktop_mode |= url.SchemeIs("https") &&
                          url.host() == "chromewebstore.google.com";
        #endif
