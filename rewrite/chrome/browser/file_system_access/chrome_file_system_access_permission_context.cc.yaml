# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/file_system_access/chrome_file_system_access_permission_context.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/file_system_access/chrome_file_system_access_permission_context\.h"\

      \

      \#include\ <algorithm>\

      \#include\ <iterator>\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/file_system_access/chrome_file_system_access_permission_context.h"

      #include "build/build_config.h"


      #include <algorithm>

      #include <iterator>

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/file_system_access/chrome_file_system_access_permission_context.cc'
  regex:
    re_pattern: '\#include\ "base/timer/timer\.h"\

      \#include\ "base/types/expected\.h"\

      \#include\ "base/values\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/browser_process\.h"\

      \#include\ "chrome/browser/content_settings/host_content_settings_map_factory\.h"\

      \#include\ "chrome/browser/download/download_prefs\.h"\

      '
    replace: '#include "base/timer/timer.h"

      #include "base/types/expected.h"

      #include "base/values.h"

      #include "chrome/browser/browser_process.h"

      #include "chrome/browser/content_settings/host_content_settings_map_factory.h"

      #include "chrome/browser/download/download_prefs.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/file_system_access/chrome_file_system_access_permission_context.cc'
  regex:
    re_pattern: '\#include\ "base/android/apk_info\.h"\

      \#include\ "base/android/content_uri_utils\.h"\

      \#include\ "base/strings/string_util\.h"\

      \#include\ "chrome/browser/glic/host/guest_util\.h"\ \ //\ nogncheck\

      \#include\ "chrome/browser/ui/android/tab_model/tab_model\.h"\

      \#include\ "chrome/browser/ui/android/tab_model/tab_model_list\.h"\

      \#else\

      '
    replace: '#include "base/android/apk_info.h"

      #include "base/android/content_uri_utils.h"

      #include "base/strings/string_util.h"

      #include "chrome/browser/ui/android/tab_model/tab_model.h"

      #include "chrome/browser/ui/android/tab_model/tab_model_list.h"

      #else

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/file_system_access/chrome_file_system_access_permission_context.cc'
  regex:
    re_pattern: '\ \ //\ contexts\.\ Note\ that\ on\ desktop,\ <webview>\ is\ explicitly\ allowed\ to\ use\ FSA\

      \ \ //\ in\ the\ block\ above\ to\ avoid\ breaking\ existing\ usage\.\

      \ \ if\ \(rfh\->GetSiteInstance\(\)\->GetSecurityPrincipal\(\)\.IsGuest\(\)\)\ \{\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ //\ Allow\ Glic\ guest\ contexts\ to\ use\ File\ System\ Access\ API\ file\ pickers\.\

      \ \ \ \ content::WebContents\*\ web_contents\ =\

      \ \ \ \ \ \ \ \ content::WebContents::FromRenderFrameHost\(rfh\);\

      \ \ \ \ if\ \(glic::IsGlicGuest\(web_contents\)\ \&\&\

      \ \ \ \ \ \ \ \ glic::GetGuestOrigin\(\)\.IsSameOriginWith\(\

      \ \ \ \ \ \ \ \ \ \ \ \ rfh\->GetLastCommittedOrigin\(\)\)\)\ \{\

      \ \ \ \ \ \ return\ base::ok\(\);\

      \ \ \ \ \}\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ return\ base::unexpected\(kDefaultNotAllowedMessage\);\

      \ \ \}\

      \

      '
    replace: "  // contexts. Note that on desktop, <webview> is explicitly allowed to use FSA\n  // in the block above to avoid breaking existing usage.\n  if (rfh->GetSiteInstance()->GetSecurityPrincipal().IsGuest()) {\n    return base::unexpected(kDefaultNotAllowedMessage);\n  }\n\n"
