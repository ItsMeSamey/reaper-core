substitutions:
- description: Exclude the survey model header from Android registration
  regex:
    pattern: '#include "components/segmentation_platform/embedder/default_model/metrics_clustering.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/segmentation_platform/embedder/default_model/metrics_clustering.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude the survey model registration while preserving every ordinary model
  regex:
    pattern: '  configs.emplace_back(MetricsClustering::GetConfig());

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  configs.emplace_back(MetricsClustering::GetConfig());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove only three unused commerce headers from the existing Android include block; excluded shopping service/protos
    stay excluded.
  regex:
    pattern: '#include "chrome/browser/bookmarks/bookmark_model_factory.h"

      #include "chrome/browser/commerce/shopping_service_factory.h"

      #include "chrome/browser/flags/android/chrome_feature_list.h"

      #include "components/commerce/core/commerce_feature_list.h"

      #include "components/commerce/core/shopping_service.h"

      '
    replace: '#include "chrome/browser/bookmarks/bookmark_model_factory.h"

      #include "chrome/browser/flags/android/chrome_feature_list.h"

      '
  count: 1
- description: Keep chrome_user_engagement include outside Android
  regex:
    pattern: '#include "components/segmentation_platform/embedder/default_model/chrome_user_engagement.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/segmentation_platform/embedder/default_model/chrome_user_engagement.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep feed_user_segment include outside Android
  regex:
    pattern: '#include "components/segmentation_platform/embedder/default_model/feed_user_segment.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/segmentation_platform/embedder/default_model/feed_user_segment.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep low_user_engagement_model include outside Android
  regex:
    pattern: '#include "components/segmentation_platform/embedder/default_model/low_user_engagement_model.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/segmentation_platform/embedder/default_model/low_user_engagement_model.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep shopping_user_model include outside Android
  regex:
    pattern: '#include "components/segmentation_platform/embedder/default_model/shopping_user_model.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/segmentation_platform/embedder/default_model/shopping_user_model.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep selected classifier registration outside Android
  regex:
    pattern: '  configs.emplace_back(LowUserEngagementModel::GetConfig());

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  configs.emplace_back(LowUserEngagementModel::GetConfig());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep selected classifier registration outside Android
  regex:
    pattern: "  configs.emplace_back(FeedUserSegment::GetConfig());\n  configs.emplace_back(ShoppingUserModel::GetConfig());\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  configs.emplace_back(FeedUserSegment::GetConfig());\n  configs.emplace_back(ShoppingUserModel::GetConfig());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep selected classifier registration outside Android
  regex:
    pattern: '  configs.emplace_back(ChromeUserEngagement::GetConfig());

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  configs.emplace_back(ChromeUserEngagement::GetConfig());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
