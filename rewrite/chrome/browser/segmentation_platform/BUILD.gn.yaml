substitutions:
- description: Exclude the Android shopping backend from impl while preserving shared providers and desktop
  regex:
    pattern: "      \"//chrome/browser/ui\",\n      \"//chrome/browser/ui/sync\",\n      \"//chrome/browser/ui/tabs:tab_strip\"\
      ,\n      \"//components/tabs:public\",\n    ]\n  }\n}"
    replace: "      \"//chrome/browser/ui\",\n      \"//chrome/browser/ui/sync\",\n      \"//chrome/browser/ui/tabs:tab_strip\"\
      ,\n      \"//components/tabs:public\",\n    ]\n  }\n  if (is_android) {\n    deps -= [\n      \"//components/commerce/core:shopping_service\"\
      ,\n    ]\n  }\n\n}"
  count: 1
- description: Exclude the Android shopping backend from unit_tests while preserving shared providers and desktop
  regex:
    pattern: "    \"//components/ukm:test_support\",\n    \"//components/visited_url_ranking/public\",\n    \"//components/visited_url_ranking/public:test_support\"\
      ,\n    \"//testing/gmock\",\n    \"//testing/gtest\",\n  ]\n}"
    replace: "    \"//components/ukm:test_support\",\n    \"//components/visited_url_ranking/public\",\n    \"//components/visited_url_ranking/public:test_support\"\
      ,\n    \"//testing/gmock\",\n    \"//testing/gtest\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//components/commerce/core:shopping_service_test_support\"\
      ,\n    ]\n  }\n\n}"
  count: 1
