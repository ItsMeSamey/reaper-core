substitutions:
- description: Make the existing platform condition explicit before guarded test imports
  regex:
    pattern: '#include "chrome/browser/segmentation_platform/segmentation_platform_service_factory.h"

      '
    replace: '#include "chrome/browser/segmentation_platform/segmentation_platform_service_factory.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude only the optional shopping factory test import on Android
  regex:
    pattern: '#include "chrome/browser/commerce/shopping_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/commerce/shopping_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude only shopping test-support implementation import on Android
  regex:
    pattern: '#include "components/commerce/core/mock_shopping_service.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/commerce/core/mock_shopping_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep generic profile and segmentation test setup without an Android shopping mock factory
  regex:
    pattern: "      profile_builder.AddTestingFactory(\n          commerce::ShoppingServiceFactory::GetInstance(),\n     \
      \     base::BindRepeating([](content::BrowserContext* context) {\n            return commerce::MockShoppingService::Build();\n\
      \          }));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      profile_builder.AddTestingFactory(\n          commerce::ShoppingServiceFactory::GetInstance(),\n\
      \          base::BindRepeating([](content::BrowserContext* context) {\n            return commerce::MockShoppingService::Build();\n\
      \          }));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Preserve the shopping model fixture on desktop while excluding its removed Android feature contract
  regex:
    pattern: "TEST_F(SegmentationPlatformServiceFactoryTest, TestShoppingUserModel) {\n  InitServiceAndCacheResults(kShoppingUserSegmentationKey);\n\
      \n  PredictionOptions prediction_options;\n\n  ExpectGetClassificationResult(\n      kShoppingUserSegmentationKey, prediction_options,\
      \ nullptr,\n      /*expected_status=*/PredictionStatus::kSucceeded,\n      /*expected_labels=*/\n      std::vector<std::string>(1,\
      \ kLegacyNegativeLabel));\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nTEST_F(SegmentationPlatformServiceFactoryTest, TestShoppingUserModel) {\n  InitServiceAndCacheResults(kShoppingUserSegmentationKey);\n\
      \n  PredictionOptions prediction_options;\n\n  ExpectGetClassificationResult(\n      kShoppingUserSegmentationKey, prediction_options,\
      \ nullptr,\n      /*expected_status=*/PredictionStatus::kSucceeded,\n      /*expected_labels=*/\n      std::vector<std::string>(1,\
      \ kLegacyNegativeLabel));\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Match the retired Android model declaration in the shared factory fixture
  regex:
    pattern: '#include "components/segmentation_platform/embedder/default_model/metrics_clustering.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/segmentation_platform/embedder/default_model/metrics_clustering.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude only the survey feature entry from shared Android setup
  regex:
    pattern: '         {features::kSegmentationSurveyPage, {}},

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n         {features::kSegmentationSurveyPage, {}},\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep the dedicated real-model regression only where that model is admitted
  regex:
    pattern: "TEST_F(SegmentationPlatformServiceFactoryTest, MetricsClustering) {\n  InitService();\n\n  segmentation_platform::PredictionOptions\
      \ prediction_options =\n      PredictionOptions::ForOnDemand();\n\n  ExpectGetAnnotatedNumericResult(\n      segmentation_platform::MetricsClustering::kMetricsClusteringKey,\n\
      \      prediction_options, nullptr, PredictionStatus::kFailed);\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nTEST_F(SegmentationPlatformServiceFactoryTest, MetricsClustering) {\n  InitService();\n\
      \n  segmentation_platform::PredictionOptions prediction_options =\n      PredictionOptions::ForOnDemand();\n\n  ExpectGetAnnotatedNumericResult(\n\
      \      segmentation_platform::MetricsClustering::kMetricsClusteringKey,\n      prediction_options, nullptr, PredictionStatus::kFailed);\n\
      }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep engagement test include outside Android
  regex:
    pattern: '#include "components/segmentation_platform/embedder/default_model/chrome_user_engagement.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/segmentation_platform/embedder/default_model/chrome_user_engagement.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep classifier service tests outside Android
  regex:
    pattern: "TEST_F(SegmentationPlatformServiceFactoryTest, TestLowUserEngagementModel) {\n  InitServiceAndCacheResults(kChromeLowUserEngagementSegmentationKey);\n\n  PredictionOptions prediction_options;\n\n  ExpectGetClassificationResult(\n      kChromeLowUserEngagementSegmentationKey, prediction_options, nullptr,\n      /*expected_status=*/PredictionStatus::kSucceeded,\n      /*expected_labels=*/\n      std::vector<std::string>(1, kChromeLowUserEngagementUmaName));\n}\n\nTEST_F(SegmentationPlatformServiceFactoryTest, TestChromeUserEngagementModel) {\n  InitServiceAndCacheResults(ChromeUserEngagement::kChromeUserEngagementKey);\n\n  PredictionOptions prediction_options;\n\n  ExpectGetClassificationResult(\n      ChromeUserEngagement::kChromeUserEngagementKey, prediction_options,\n      nullptr,\n      /*expected_status=*/PredictionStatus::kSucceeded,\n      /*expected_labels=*/\n      std::vector<std::string>(1, \"None\"));\n}\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nTEST_F(SegmentationPlatformServiceFactoryTest, TestLowUserEngagementModel) {\n  InitServiceAndCacheResults(kChromeLowUserEngagementSegmentationKey);\n\n  PredictionOptions prediction_options;\n\n  ExpectGetClassificationResult(\n      kChromeLowUserEngagementSegmentationKey, prediction_options, nullptr,\n      /*expected_status=*/PredictionStatus::kSucceeded,\n      /*expected_labels=*/\n      std::vector<std::string>(1, kChromeLowUserEngagementUmaName));\n}\n\nTEST_F(SegmentationPlatformServiceFactoryTest, TestChromeUserEngagementModel) {\n  InitServiceAndCacheResults(ChromeUserEngagement::kChromeUserEngagementKey);\n\n  PredictionOptions prediction_options;\n\n  ExpectGetClassificationResult(\n      ChromeUserEngagement::kChromeUserEngagementKey, prediction_options,\n      nullptr,\n      /*expected_status=*/PredictionStatus::kSucceeded,\n      /*expected_labels=*/\n      std::vector<std::string>(1, \"None\"));\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n\
      \n"
  count: 1
- description: Keep classifier service tests outside Android
  regex:
    pattern: "TEST_F(SegmentationPlatformServiceFactoryTest, TestFeedUserModel) {\n  InitServiceAndCacheResults(segmentation_platform::kFeedUserSegmentationKey);\n  segmentation_platform::PredictionOptions prediction_options;\n\n  ExpectGetClassificationResult(\n      segmentation_platform::kFeedUserSegmentationKey, prediction_options,\n      nullptr,\n      /*expected_status=*/segmentation_platform::PredictionStatus::kSucceeded,\n      /*expected_labels=*/\n      std::vector<std::string>(1, kLegacyNegativeLabel));\n}\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nTEST_F(SegmentationPlatformServiceFactoryTest, TestFeedUserModel) {\n  InitServiceAndCacheResults(segmentation_platform::kFeedUserSegmentationKey);\n  segmentation_platform::PredictionOptions prediction_options;\n\n  ExpectGetClassificationResult(\n      segmentation_platform::kFeedUserSegmentationKey, prediction_options,\n      nullptr,\n      /*expected_status=*/segmentation_platform::PredictionStatus::kSucceeded,\n      /*expected_labels=*/\n      std::vector<std::string>(1, kLegacyNegativeLabel));\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n"
  count: 1
- description: Exclude Android promotional Tips implementation while retaining core notifications
  regex:
    pattern: "      std::vector<std::string>(1, \"FedCmUserLoud\"));\n}\n\nTEST_F(SegmentationPlatformServiceFactoryTest, TestTipsNotificationsRanker) {\n  InitService();\n  PredictionOptions prediction_options;\n"
    replace: "      std::vector<std::string>(1, \"FedCmUserLoud\"));\n}\n\n#if !BUILDFLAG(IS_ANDROID)\nTEST_F(SegmentationPlatformServiceFactoryTest, TestTipsNotificationsRanker) {\n  InitService();\n  PredictionOptions prediction_options;\n"
  count: 1
- description: Exclude Android promotional Tips implementation while retaining core notifications
  regex:
    pattern: "      /*expected_status=*/PredictionStatus::kSucceeded,\n      /*expected_labels=*/std::nullopt);\n}\n\n}  // namespace\n}  // namespace segmentation_platform\n"
    replace: "      /*expected_status=*/PredictionStatus::kSucceeded,\n      /*expected_labels=*/std::nullopt);\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n}  // namespace\n}  // namespace segmentation_platform\n"
  count: 1
