# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_field_trials.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/chrome_browser_field_trials\.h"\

      \

      \#include\ <optional>\

      \#include\ <string>\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/chrome_browser_field_trials.h"

      #include "build/build_config.h"


      #include <optional>

      #include <string>

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_field_trials.cc'
  regex:
    re_pattern: '\#include\ "base/path_service\.h"\

      \#include\ "base/strings/string_util\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/metrics/chrome_browser_sampling_trials\.h"\

      \#include\ "chrome/browser/metrics/chrome_metrics_service_accessor\.h"\

      \#include\ "chrome/browser/metrics/chrome_metrics_service_client\.h"\

      '
    replace: '#include "base/path_service.h"

      #include "base/strings/string_util.h"

      #include "base/time/time.h"

      #include "chrome/browser/metrics/chrome_browser_sampling_trials.h"

      #include "chrome/browser/metrics/chrome_metrics_service_accessor.h"

      #include "chrome/browser/metrics/chrome_metrics_service_client.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_field_trials.cc'
  regex:
    re_pattern: '\#include\ "cc/base/features\.h"\

      \#include\ "chrome/browser/android/flags/chrome_cached_flags\.h"\ \ //\ nogncheck\ crbug\.com/40147906\

      \#include\ "chrome/browser/flags/android/chrome_feature_list\.h"\

      \#include\ "chrome/browser/glic/public/features\.h"\

      \#include\ "chrome/browser/glic/suggestions/contextual_cueing_features\.h"\

      \#include\ "chrome/browser/media/webrtc/desktop_media_picker\.h"\

      \#include\ "chrome/common/chrome_features\.h"\

      \#include\ "components/autofill/core/common/autofill_features\.h"\

      '
    replace: '#include "cc/base/features.h"

      #include "chrome/browser/android/flags/chrome_cached_flags.h"  // nogncheck crbug.com/40147906

      #include "chrome/browser/flags/android/chrome_feature_list.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/public/features.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/suggestions/contextual_cueing_features.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/media/webrtc/desktop_media_picker.h"

      #include "chrome/common/chrome_features.h"

      #include "components/autofill/core/common/autofill_features.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_field_trials.cc'
  regex:
    re_pattern: '\ \ //\ desktop\ Android\ \(AL\);\ disabled\ by\ default\ on\ other\ Android\ form\ factors\.\

      \ \ //\ TODO\(crbug\.com/545717789\):\ Remove\ when\ rollout\ to\ phones/tablets\ is\

      \ \ //\ complete\.\

      \ \ feature_overrides\.EnableFeature\(chrome::android::kClankGlicContextMenu\);\

      \

      \ \ //\ Enables\ media\ capture\ \(tab\+window\+screen\ sharing\)\.\

      \ \ //\ TODO\(crbug\.com/352187279\):\ Remove\ when\ tablet\ rollout\ is\ complete\.\

      '
    replace: "  // desktop Android (AL); disabled by default on other Android form factors.\n  // TODO(crbug.com/545717789): Remove when rollout to phones/tablets is\n  // complete.\n#if !BUILDFLAG(IS_ANDROID)\n  feature_overrides.EnableFeature(chrome::android::kClankGlicContextMenu);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  // Enables media capture (tab+window+screen sharing).\n  // TODO(crbug.com/352187279): Remove when tablet rollout is complete.\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_field_trials.cc'
  regex:
    re_pattern: '\ \ //\ TODO\(crbug\.com/545760718\):\ Remove\ when\ rollout\ is\ complete\ to\ all\ form\

      \ \ //\ factors\.\

      \ \ feature_overrides\.EnableFeature\(chrome::android::kEnableAndroidSidePanel\);\

      \ \ feature_overrides\.EnableFeature\(features::kGlic\);\

      \ \ feature_overrides\.EnableFeature\(features::kGlicActor\);\

      \ \ feature_overrides\.EnableFeature\(features::kGlicAndroidSidePanel\);\

      \ \ feature_overrides\.EnableFeature\(features::kGlicRollout\);\

      \ \ feature_overrides\.EnableFeature\(glic::kContextualCueing\);\

      \

      \ \ //\ As\ of\ writing,\ the\ only\ devices\ that\ can\ make\ use\ of\ browsing\ history\

      \ \ //\ donation\ are\ desktop\ devices\.\

      '
    replace: "  // TODO(crbug.com/545760718): Remove when rollout is complete to all form\n  // factors.\n  feature_overrides.EnableFeature(chrome::android::kEnableAndroidSidePanel);\n#if !BUILDFLAG(IS_ANDROID)\n  feature_overrides.EnableFeature(features::kGlic);\n#endif  // !BUILDFLAG(IS_ANDROID)\n#if !BUILDFLAG(IS_ANDROID)\n  feature_overrides.EnableFeature(features::kGlicActor);\n#endif  // !BUILDFLAG(IS_ANDROID)\n#if !BUILDFLAG(IS_ANDROID)\n  feature_overrides.EnableFeature(features::kGlicAndroidSidePanel);\n#endif  // !BUILDFLAG(IS_ANDROID)\n#if !BUILDFLAG(IS_ANDROID)\n  feature_overrides.EnableFeature(features::kGlicRollout);\n#endif  // !BUILDFLAG(IS_ANDROID)\n#if !BUILDFLAG(IS_ANDROID)\n  feature_overrides.EnableFeature(glic::kContextualCueing);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  // As of writing, the only devices that can make use of browsing history\n  // donation are desktop devices.\n"
- description: Exact private authored telemetry compile-out hunk at reviewed before lines 16-22
  regex:
    pattern: '#include "base/path_service.h"

      #include "base/strings/string_util.h"

      #include "base/time/time.h"

      #include "chrome/browser/metrics/chrome_browser_sampling_trials.h"

      #include "chrome/browser/metrics/chrome_metrics_service_accessor.h"

      #include "chrome/browser/metrics/chrome_metrics_service_client.h"

      #include "chrome/common/channel_info.h"

      '
    replace: '#include "base/path_service.h"

      #include "base/strings/string_util.h"

      #include "base/time/time.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/metrics/chrome_browser_sampling_trials.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/metrics/chrome_metrics_service_accessor.h"

      #include "chrome/browser/metrics/chrome_metrics_service_client.h"

      #include "chrome/common/channel_info.h"

      '
  count: 1
- description: Exact private authored telemetry compile-out hunk at reviewed before lines 77-82
  regex:
    pattern: "\nChromeBrowserFieldTrials::~ChromeBrowserFieldTrials() = default;\n\nvoid ChromeBrowserFieldTrials::SetUpClientSideFieldTrials(\n\
      \    bool has_seed,\n    const variations::EntropyProviders& entropy_providers,\n"
    replace: "\nChromeBrowserFieldTrials::~ChromeBrowserFieldTrials() = default;\n\n#if !BUILDFLAG(IS_ANDROID)\nvoid ChromeBrowserFieldTrials::SetUpClientSideFieldTrials(\n\
      \    bool has_seed,\n    const variations::EntropyProviders& entropy_providers,\n"
  count: 1
- description: Exact private authored telemetry compile-out hunk at reviewed before lines 111-116
  regex:
    pattern: "#endif  // BUILDFLAG(IS_MAC) || BUILDFLAG(IS_LINUX)\n}\n\nvoid ChromeBrowserFieldTrials::RegisterSyntheticTrials()\
      \ {\n#if BUILDFLAG(IS_ANDROID)\n  {\n"
    replace: "#endif  // BUILDFLAG(IS_MAC) || BUILDFLAG(IS_LINUX)\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\nvoid ChromeBrowserFieldTrials::RegisterSyntheticTrials()\
      \ {\n#if BUILDFLAG(IS_ANDROID)\n  {\n"
  count: 1
- description: retire-history-donation-field-trial-enable
  regex:
    pattern: "  // As of writing, the only devices that can make use of browsing history\n  // donation are desktop devices.\n\
      \  // TODO(crbug.com/546011402): Remove this heuristic once we can detect\n  // whether the data consumer will actually\
      \ use the data.\n  feature_overrides.EnableFeature(\n      chrome::android::kAuxiliarySearchHistoryDonation);\n\n"
    replace: ''
  count: 1
