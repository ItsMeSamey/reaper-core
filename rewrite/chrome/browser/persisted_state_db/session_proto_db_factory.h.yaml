substitutions:
- description: Remove the Android-only merchant schema include, preserving desktop schema imports.
  regex:
    pattern: '#else

      #include "components/commerce/core/proto/merchant_signal_db_content.pb.h"

      '
    replace: ''
  count: 1
- description: Exclude dedicated merchant folder constant on Android, preserving desktop projection.
  regex:
    pattern: 'const char kMerchantTrustSignalDBFolder[] = "merchant_signal_db";

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      const char kMerchantTrustSignalDBFolder[] = "merchant_signal_db";

      #endif

      '
  count: 1
- description: Remove only the Android merchant helper declaration.
  regex:
    pattern: '#else

      SessionProtoDBFactory<merchant_signal_db::MerchantSignalContentProto>*

      GetMerchantSignalSessionProtoDBFactory();

      '
    replace: ''
  count: 1
- description: Remove only the Android merchant template branch; keep generic persisted-state/profile/storage mappings.
  regex:
    pattern: "#else\n  } else if (std::is_base_of<merchant_signal_db::MerchantSignalContentProto,\n                      \
      \       T>::value) {\n    return std::make_unique<SessionProtoDB<T>>(\n        proto_database_provider,\n        context->GetPath().AppendASCII(kMerchantTrustSignalDBFolder),\n\
      \        leveldb_proto::ProtoDbType::MERCHANT_TRUST_SIGNAL_DATABASE,\n        content::GetUIThreadTaskRunner({}));\n"
    replace: ''
  count: 1
