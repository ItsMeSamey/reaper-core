# Android retains ordinary phishing detection and the mandatory unavailable Gemini callback.
substitutions:
- description: 'Android optional Gemini provider exclusion preserving ordinary phishing: chrome/browser/safe_browsing/chrome_client_side_detection_host_delegate.cc'
  regex:
    re_pattern: '\#include\ "chrome/browser/safe_browsing/chrome_user_population_helper\.h"\

      \#include\ "chrome/browser/safe_browsing/client_side_detection_intelligent_scan_delegate_factory\.h"\

      \#include\ "chrome/browser/safe_browsing/client_side_detection_service_factory\.h"\

      \#include\ "chrome/browser/safe_browsing/gemini_antiscam_protection/gemini_antiscam_protection_service\.h"\

      \#include\ "chrome/browser/safe_browsing/gemini_antiscam_protection/gemini_antiscam_protection_service_factory\.h"\

      \#include\ "chrome/browser/safe_browsing/safe_browsing_navigation_observer_manager_factory\.h"\

      \#include\ "chrome/browser/safe_browsing/safe_browsing_service\.h"\

      \#include\ "chrome/browser/safe_browsing/user_interaction_observer\.h"\

      '
    replace: '#include "chrome/browser/safe_browsing/chrome_user_population_helper.h"

      #include "chrome/browser/safe_browsing/client_side_detection_intelligent_scan_delegate_factory.h"

      #include "chrome/browser/safe_browsing/client_side_detection_service_factory.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/safe_browsing/gemini_antiscam_protection/gemini_antiscam_protection_service.h"

      #include "chrome/browser/safe_browsing/gemini_antiscam_protection/gemini_antiscam_protection_service_factory.h"

      #endif

      #include "chrome/browser/safe_browsing/safe_browsing_navigation_observer_manager_factory.h"

      #include "chrome/browser/safe_browsing/safe_browsing_service.h"

      #include "chrome/browser/safe_browsing/user_interaction_observer.h"

      '
- description: 'Android optional Gemini provider exclusion preserving ordinary phishing: chrome/browser/safe_browsing/chrome_client_side_detection_host_delegate.cc'
  regex:
    re_pattern: '\ \ \ \ GURL\ url,\

      \ \ \ \ ClientSideDetectionType\ request_type,\

      \ \ \ \ std::optional<bool>\ did_match_high_confidence_allowlist\)\ \{\

      \ \ GeminiAntiscamProtectionService\*\ service\ =\

      \ \ \ \ \ \ GeminiAntiscamProtectionServiceFactory::GetForProfile\(\

      \ \ \ \ \ \ \ \ \ \ Profile::FromBrowserContext\(web_contents_\->GetBrowserContext\(\)\)\);\

      '
    replace: "    GURL url,\n    ClientSideDetectionType request_type,\n    std::optional<bool> did_match_high_confidence_allowlist) {\n#if BUILDFLAG(IS_ANDROID)\n  return;\n#else\n  GeminiAntiscamProtectionService* service =\n      GeminiAntiscamProtectionServiceFactory::GetForProfile(\n          Profile::FromBrowserContext(web_contents_->GetBrowserContext()));\n"
- description: 'Android optional Gemini provider exclusion preserving ordinary phishing: chrome/browser/safe_browsing/chrome_client_side_detection_host_delegate.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ url,\ request_type,\ did_match_high_confidence_allowlist\.value_or\(true\),\

      \ \ \ \ \ \ \ \ web_contents_\->GetPrimaryMainFrame\(\)\->GetLastCommittedURL\(\)\)\);\

      \ \ \}\

      \}\

      \

      void\ ChromeClientSideDetectionHostDelegate::OnInnerTextResult\(\

      '
    replace: "        url, request_type, did_match_high_confidence_allowlist.value_or(true),\n        web_contents_->GetPrimaryMainFrame()->GetLastCommittedURL()));\n  }\n#endif\n}\n\nvoid ChromeClientSideDetectionHostDelegate::OnInnerTextResult(\n"
