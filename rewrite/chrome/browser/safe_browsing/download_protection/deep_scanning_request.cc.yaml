# Android enterprise reporting producer compile-out; retain ordinary scan security.
substitutions:
- description: "0561 Android reporting producer exclusion: Guard report callback only; keep scan metadata/verdict/completion"
  regex:
    pattern: "    auto* reporting_event_router = enterprise_connectors::\n        ReportingEventRouterFactory::GetForBrowserContext(profile);\n    report_callbacks_.AddUnsafe(base::BindOnce(\n        &enterprise_connectors::MaybeReportDeepScanningVerdict,\n        reporting_event_router, this, /*source=*/\"\",\n        /*destination=*/GetDestinationString(download_result),\n        file_metadata.filename, file_metadata.sha256, file_metadata.mime_type,\n        enterprise_connectors::kFileDownloadDataTransferEventTrigger,\n        /*content_transfer_method=*/\"\", GetContentAreaAccountEmail(),\n        file_metadata.size, result, file_metadata.scan_response));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    auto* reporting_event_router = enterprise_connectors::\n        ReportingEventRouterFactory::GetForBrowserContext(profile);\n    report_callbacks_.AddUnsafe(base::BindOnce(\n        &enterprise_connectors::MaybeReportDeepScanningVerdict,\n        reporting_event_router, this, /*source=*/\"\",\n        /*destination=*/GetDestinationString(download_result),\n        file_metadata.filename, file_metadata.sha256, file_metadata.mime_type,\n        enterprise_connectors::kFileDownloadDataTransferEventTrigger,\n        /*content_transfer_method=*/\"\", GetContentAreaAccountEmail(),\n        file_metadata.size, result, file_metadata.scan_response));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "0576 Android native integration boundary for chrome/browser/safe_browsing/download_protection/deep_scanning_request.cc"
  regex:
    pattern: "std::string GetDestinationString(DownloadCheckResult result) {\n  switch (result) {\n    case DownloadCheckResult::FORCE_SAVE_TO_GDRIVE:\n      return \"Google Drive\";\n    case DownloadCheckResult::FORCE_SAVE_TO_ONEDRIVE:\n      return \"OneDrive\";\n    default:\n      return \"\";\n  }\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::string GetDestinationString(DownloadCheckResult result) {\n  switch (result) {\n    case DownloadCheckResult::FORCE_SAVE_TO_GDRIVE:\n      return \"Google Drive\";\n    case DownloadCheckResult::FORCE_SAVE_TO_ONEDRIVE:\n      return \"OneDrive\";\n    default:\n      return \"\";\n  }\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
