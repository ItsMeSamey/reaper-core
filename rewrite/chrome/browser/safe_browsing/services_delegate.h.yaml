substitutions:
- description: Allow a distinct extension-ID database while keeping existing embedders unchanged.
  regex:
    pattern: '  // Initializes internal state using the ServicesCreator.'
    replace: "  // The extension blocklist may use a local list while URL checks use an OS\n  // service. The default preserves the shared desktop database.\n  virtual const scoped_refptr<SafeBrowsingDatabaseManager>&\n  extension_database_manager() const {\n    return database_manager();\n  }\n\n  // Initializes internal state using the ServicesCreator."
- description: Repair reviewed AN Android native compiler integration errors without changing intended behavior
  regex:
    re_pattern: '\ \ //\ The\ extension\ blocklist\ may\ use\ a\ local\ list\ while\ URL\ checks\ use\ an\ OS\

      \ \ //\ service\.\ The\ default\ preserves\ the\ shared\ desktop\ database\.\

      \ \ virtual\ const\ scoped_refptr<SafeBrowsingDatabaseManager>\&\

      \ \ extension_database_manager\(\)\ const\ \{\

      \ \ \ \ return\ database_manager\(\);\

      \ \ \}\

      \

      \ \ //\ Initializes\ internal\ state\ using\ the\ ServicesCreator\.\

      \ \ virtual\ void\ Initialize\(\)\ =\ 0;\

      '
    replace: "  // The extension blocklist may use a local list while URL checks use an OS\n  // service. The default preserves the shared desktop database.\n  virtual const scoped_refptr<SafeBrowsingDatabaseManager>&\n  extension_database_manager() const;\n\n  // Initializes internal state using the ServicesCreator.\n  virtual void Initialize() = 0;\n"
