  regex:
    re_pattern: '\#ifndef\ CHROME_BROWSER_SAFE_BROWSING_NOTIFICATION_CONTENT_DETECTION_NOTIFICATION_CONTENT_DETECTION_UTIL_H_\

      \#define\ CHROME_BROWSER_SAFE_BROWSING_NOTIFICATION_CONTENT_DETECTION_NOTIFICATION_CONTENT_DETECTION_UTIL_H_\

      \

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      \#include\ "third_party/blink/public/mojom/site_engagement/site_engagement\.mojom\-forward\.h"\

      \#include\ "url/gurl\.h"\

      \

      namespace\ content\ \{\

      struct\ NotificationDatabaseData;\

      \}\ \ //\ namespace\ content\

      \

      namespace\ optimization_guide\ \{\

      class\ ModelQualityLogsUploaderService;\

      \}\ \ //\ namespace\ optimization_guide\

      \

      namespace\ safe_browsing\ \{\

      \

      struct\ NotificationContentDetectionMQLSMetadata\ \{\

      \ \ NotificationContentDetectionMQLSMetadata\(\

      \ \ \ \ \ \ bool\ did_show_warning,\

      '
    replace: "#ifndef CHROME_BROWSER_SAFE_BROWSING_NOTIFICATION_CONTENT_DETECTION_NOTIFICATION_CONTENT_DETECTION_UTIL_H_\n#define CHROME_BROWSER_SAFE_BROWSING_NOTIFICATION_CONTENT_DETECTION_NOTIFICATION_CONTENT_DETECTION_UTIL_H_\n\n#include \"build/build_config.h\"\n#if !BUILDFLAG(IS_ANDROID)\n#include \"base/memory/weak_ptr.h\"\n#endif\n#include \"chrome/browser/profiles/profile.h\"\n#if !BUILDFLAG(IS_ANDROID)\n#include \"third_party/blink/public/mojom/site_engagement/site_engagement.mojom-forward.h\"\n#endif\n#include \"url/gurl.h\"\n\nnamespace content {\nstruct NotificationDatabaseData;\n}  // namespace content\n\n#if !BUILDFLAG(IS_ANDROID)\nnamespace optimization_guide {\nclass ModelQualityLogsUploaderService;\n}  // namespace optimization_guide\n\n#endif\nnamespace safe_browsing {\n\n#if !BUILDFLAG(IS_ANDROID)\nstruct NotificationContentDetectionMQLSMetadata {\n  NotificationContentDetectionMQLSMetadata(\n      bool did_show_warning,\n"
- description: 'Android optional model execution boundary: chrome/browser/safe_browsing/notification_content_detection/notification_content_detection_util.h'
  regex:
    re_pattern: '\ \ \ \ bool\ success,\

      \ \ \ \ const\ content::NotificationDatabaseData\&\ notification_database_data\);\

      \

      //\ Used\ for\ logging\ notification\ content\ detection\ warning\ interaction\ UKM\.\ This\

      //\ should\ be\ a\ class\ so\ that\ the\ `UkmRecorder::GetSourceIdForNotificationEvent`\

      //\ method\ can\ be\ used\ for\ obtaining\ the\ source\ id\ for\ a\ given\ origin\.\

      '
    replace: "    bool success,\n    const content::NotificationDatabaseData& notification_database_data);\n\n#endif\n// Used for logging notification content detection warning interaction UKM. This\n// should be a class so that the `UkmRecorder::GetSourceIdForNotificationEvent`\n// method can be used for obtaining the source id for a given origin.\n"
