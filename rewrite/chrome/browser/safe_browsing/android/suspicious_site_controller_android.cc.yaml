- description: Remove Android survey-only function void SuspiciousSiteControllerAndroid::FetchRepeatVisitCount(
  regex:
    pattern: "void SuspiciousSiteControllerAndroid::FetchRepeatVisitCount() {\n  if (dialog_state_.has_fetched_history ||\
      \ !web_contents() ||\n      !web_contents()->GetBrowserContext()) {\n    return;\n  }\n  GURL site_url = web_contents()->GetLastCommittedURL();\n\
      \  if (!site_url.is_valid()) {\n    return;\n  }\n\n  dialog_state_.has_fetched_history = true;\n  Profile* profile\
      \ =\n      Profile::FromBrowserContext(web_contents()->GetBrowserContext());\n  if (!profile) {\n    return;\n  }\n\
      \  // Use IMPLICIT_ACCESS because this history query is an automated background\n  // feature check for survey telemetry\
      \ rather than a direct user interaction\n  // with the History UI.\n  history::HistoryService* history_service =\n \
      \     HistoryServiceFactory::GetForProfile(profile,\n                                           ServiceAccessType::IMPLICIT_ACCESS);\n\
      \  if (history_service) {\n    history_service->GetVisibleVisitCountToHost(\n        site_url,\n        base::BindOnce(&SuspiciousSiteControllerAndroid::OnGetVisibleVisitCount,\n\
      \                       weak_ptr_factory_.GetWeakPtr()),\n        &history_task_tracker_);\n  }\n}"
    replace: ''
  count: 1
- description: Remove Android survey-only function void SuspiciousSiteControllerAndroid::OnGetVisibleVisitCount(
  regex:
    pattern: "void SuspiciousSiteControllerAndroid::OnGetVisibleVisitCount(\n    history::VisibleVisitCountToHostResult result)\
      \ {\n  if (result.success && result.count > 1) {\n    dialog_state_.repeat_visit = true;\n  }\n}"
    replace: ''
  count: 1
- description: Remove background history lookup used only for survey metadata
  regex:
    pattern: "  // Pre-fetch repeat visit count right after populating\n  // current_suspicious_url_.\n  FetchRepeatVisitCount();\n"
    replace: ''
  count: 1
- description: Remove survey-only accumulated visible-time tracking
  regex:
    pattern: "      if (!dialog_shown_time_.is_null()) {\n        dialog_state_.accumulated_visible_time +=\n            base::TimeTicks::Now()\
      \ - dialog_shown_time_;\n        dialog_shown_time_ = base::TimeTicks();\n      }\n"
    replace: ''
  count: 1
- description: Remove survey-only warning presentation timestamp
  regex:
    pattern: '  dialog_shown_time_ = base::TimeTicks::Now();

      '
    replace: ''
  count: 1
- description: Exclude Android survey-only include chrome/browser/history/history_service_factory.h
  regex:
    pattern: '#include "chrome/browser/history/history_service_factory.h"

      '
    replace: ''
  count: 1
