substitutions:
- description: Use the shared local list backend without importing desktop Safe Browsing.
  regex:
    pattern: '#include "base/check_op.h"'
    replace: '#include "base/check_op.h"

      #include "base/functional/bind.h"'
- description: Access the owner configuration and private database path.
  regex:
    pattern: '#include "chrome/browser/safe_browsing/telemetry/android/android_telemetry_service.h"'
    replace: '#include "chrome/browser/safe_browsing/safe_browsing_service.h"

      #include "chrome/browser/safe_browsing/telemetry/android/android_telemetry_service.h"'
- description: Import the local backend and its task runners.
  regex:
    pattern: '#include "content/public/browser/browser_context.h"'
    replace: '#include "content/public/browser/browser_context.h"

      #include "content/public/browser/browser_task_traits.h"

      #include "components/safe_browsing/core/browser/db/sb_local_database_manager.h"'
- description: Expose and configure only the Android extension list.
  regex:
    pattern: void ServicesDelegateAndroid::Initialize() {
    replace: "#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\nconst scoped_refptr<SafeBrowsingDatabaseManager>&\nServicesDelegateAndroid::extension_database_manager() const {\n  return extension_database_manager_;\n}\n\nExtendedReportingLevel\nServicesDelegateAndroid::GetEstimatedExtendedReportingLevel() const {\n  return safe_browsing_service_->estimated_extended_reporting_by_prefs();\n}\n#endif\n\nvoid ServicesDelegateAndroid::Initialize() {\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  extension_database_manager_ =\n      SBLocalDatabaseManager::CreateForExtensionBlocklist(\n          SafeBrowsingServiceImpl::GetBaseFilename().AppendASCII(\"Extensions\"),\n          content::GetUIThreadTaskRunner({}), content::GetIOThreadTaskRunner({}),\n          base::BindRepeating(\n              &ServicesDelegateAndroid::GetEstimatedExtendedReportingLevel,\n              base::Unretained(this)));\n#endif"
- description: Start extension updates under the same Safe Browsing enabled lifecycle.
  regex:
    pattern: '  database_manager_->StartOnUIThread(browser_url_loader_factory, v4_config);'
    replace: "  database_manager_->StartOnUIThread(browser_url_loader_factory, v4_config);\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  extension_database_manager_->StartOnUIThread(browser_url_loader_factory,\n                                               v4_config);\n#endif"
- description: Stop extension updates and cancel checks on disable or shutdown.
  regex:
    pattern: '  database_manager_->StopOnUIThread(shutdown);'
    replace: "  database_manager_->StopOnUIThread(shutdown);\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  extension_database_manager_->StopOnUIThread(shutdown);\n#endif"
