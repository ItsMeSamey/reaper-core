substitutions:
- description: Remove survey-only warning choice data type
  regex:
    pattern: "  // Represents user interaction choices for the suspicious site warning HaTS.\n  enum class UserChoice {\n\
      \    kMarkAsSafe,\n    kBackToSafety,\n    kDismiss,\n    kManualNavigation,\n  };"
    replace: ''
  count: 1
- description: Remove survey-only warning method declaration
  regex:
    pattern: "  // Triggers HaTS survey for suspicious site warnings if feature enabled.\n  void MaybeTriggerHatsSurvey(UserChoice\
      \ user_choice);\n"
    replace: ''
  count: 1
- description: Remove survey-only warning timing state
  regex:
    pattern: "  // Timestamp when the warning dialog was shown.\n  base::TimeTicks dialog_shown_time_;\n"
    replace: ''
  count: 1
- description: Remove survey-only background history methods
  regex:
    pattern: "  // Queries HistoryService to check if user has visited the host before.\n  void FetchRepeatVisitCount();\n\
      \  void OnGetVisibleVisitCount(history::VisibleVisitCountToHostResult result);\n"
    replace: ''
  count: 1
- description: Remove survey-only history and visible-time state
  regex:
    pattern: "    // Tracks if user has visited the suspicious site host previously.\n    bool repeat_visit = false;\n\n \
      \   // Tracks if a history query has already been dispatched for this\n    // navigation.\n    bool has_fetched_history\
      \ = false;\n\n    // Tracks accumulated prompt visible time across tab switches.\n    base::TimeDelta accumulated_visible_time;\n"
    replace: ''
  count: 1
- description: Remove survey-only async query tracker
  regex:
    pattern: "  // Tracker for async history queries.\n  base::CancelableTaskTracker history_task_tracker_;\n"
    replace: ''
  count: 1
- description: Exclude Android survey-only include base/task/cancelable_task_tracker.h
  regex:
    pattern: '#include "base/task/cancelable_task_tracker.h"

      '
    replace: ''
  count: 1
- description: Exclude Android survey-only include components/history/core/browser/history_service.h
  regex:
    pattern: '#include "components/history/core/browser/history_service.h"

      '
    replace: ''
  count: 1
