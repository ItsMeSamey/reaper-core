substitutions:
- description: Guard the optional Android extension-only database by the core buildflag.
  regex:
    pattern: '#include "components/safe_browsing/core/common/safe_browsing_prefs.h"'
    replace: '#include "components/safe_browsing/core/common/safe_browsing_prefs.h"

      #include "extensions/buildflags/buildflags.h"'
- description: Keep the separate extension database private to the Android delegate.
  regex:
    pattern: '  void Initialize() override;'
    replace: "#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  const scoped_refptr<SafeBrowsingDatabaseManager>& extension_database_manager()\n      const override;\n  ExtendedReportingLevel GetEstimatedExtendedReportingLevel() const;\n#endif\n  void Initialize() override;"
- description: Own the extension database for exactly the Safe Browsing service lifetime.
  regex:
    pattern: '  scoped_refptr<SafeBrowsingDatabaseManager> database_manager_;'
    replace: "  scoped_refptr<SafeBrowsingDatabaseManager> database_manager_;\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  scoped_refptr<SafeBrowsingDatabaseManager> extension_database_manager_;\n#endif"
