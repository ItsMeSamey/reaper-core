substitutions:
- description: Remove dedicated survey mock or history-only factory.
  regex:
    pattern: "class MockHatsService : public HatsServiceAndroid {\n public:\n  explicit MockHatsService(Profile* profile)\
      \ : HatsServiceAndroid(profile) {}\n  ~MockHatsService() override = default;\n\n  MOCK_METHOD(HatsService::LaunchError,\n\
      \              LaunchSurveyForWebContents,\n              (const std::string& trigger,\n               content::WebContents*\
      \ web_contents,\n               const SurveyBitsData& product_specific_bits_data,\n               const SurveyStringData&\
      \ product_specific_string_data,\n               base::OnceClosure success_callback,\n               base::OnceClosure\
      \ failure_callback,\n               const std::optional<std::string>& supplied_trigger_id,\n               const SurveyOptions&\
      \ survey_options),\n              (override));\n};\n\n"
    replace: ''
  count: 1
- description: Remove dedicated survey mock or history-only factory.
  regex:
    pattern: "std::unique_ptr<KeyedService> BuildMockHatsService(\n    content::BrowserContext* context) {\n  return std::make_unique<MockHatsService>(\n\
      \      Profile::FromBrowserContext(context));\n}\n\n"
    replace: ''
  count: 1
- description: Remove dedicated survey mock or history-only factory.
  regex:
    pattern: "std::unique_ptr<KeyedService> BuildTestHistoryService(\n    content::BrowserContext* context) {\n  return history::CreateHistoryService(context->GetPath(),\
      \ /*create_db=*/true);\n}\n\n"
    replace: ''
  count: 1
- description: 'Remove the retired Android-only survey case: HatsSurveyTriggeredOnGoBack'
  regex:
    pattern: "TEST_F(SuspiciousSiteControllerAndroidTest, HatsSurveyTriggeredOnGoBack) {\n  base::test::ScopedFeatureList\
      \ feature_list;\n  feature_list.InitAndEnableFeature(kSuspiciousSiteWarningSurvey);\n\n  auto* mock_hats_service = static_cast<MockHatsService*>(\n\
      \      HatsServiceFactory::GetInstance()->SetTestingFactoryAndUse(\n          profile(), base::BindRepeating(&BuildMockHatsService)));\n\
      \n  EXPECT_CALL(\n      *mock_hats_service,\n      LaunchSurveyForWebContents(\n          kHatsSurveyTriggerSuspiciousSiteWarning,\
      \ web_contents(),\n          testing::Contains(testing::Pair(\"did_proceed\", false)),\n          testing::Contains(testing::Pair(\"\
      user_choice\", \"back_to_safety\")),\n          testing::_, testing::_,\n          testing::Optional(std::string(\"\
      LZD24fmuf0tK1KeaPYj0Z79hw2qC\")),\n          testing::_))\n      .Times(1);\n\n  SuspiciousSiteControllerAndroid* controller\
      \ = MakeController();\n  controller->HandleBackNavigation(\n      SuspiciousSiteControllerAndroid::UserInteraction::kBackToSafetyButton);\n\
      }\n\n"
    replace: ''
  count: 1
- description: 'Remove the retired Android-only survey case: HatsSurveyTriggeredOnContinue'
  regex:
    pattern: "TEST_F(SuspiciousSiteControllerAndroidTest, HatsSurveyTriggeredOnContinue) {\n  base::test::ScopedFeatureList\
      \ feature_list;\n  feature_list.InitAndEnableFeature(kSuspiciousSiteWarningSurvey);\n\n  auto* mock_hats_service = static_cast<MockHatsService*>(\n\
      \      HatsServiceFactory::GetInstance()->SetTestingFactoryAndUse(\n          profile(), base::BindRepeating(&BuildMockHatsService)));\n\
      \n  EXPECT_CALL(\n      *mock_hats_service,\n      LaunchSurveyForWebContents(\n          kHatsSurveyTriggerSuspiciousSiteWarning,\
      \ web_contents(),\n          testing::Contains(testing::Pair(\"did_proceed\", true)),\n          testing::Contains(testing::Pair(\"\
      user_choice\", \"mark_as_safe\")),\n          testing::_, testing::_,\n          testing::Optional(std::string(\"HguD8vrc50tK1KeaPYj0R37AzmWa\"\
      )),\n          testing::_))\n      .Times(1);\n\n  SuspiciousSiteControllerAndroid* controller = MakeController();\n\
      \  controller->OnContinueButtonClicked();\n}\n\n"
    replace: ''
  count: 1
- description: 'Remove the retired Android-only survey case: HatsSurveyTriggeredOnDismiss'
  regex:
    pattern: "TEST_F(SuspiciousSiteControllerAndroidTest, HatsSurveyTriggeredOnDismiss) {\n  base::test::ScopedFeatureList\
      \ feature_list;\n  feature_list.InitAndEnableFeature(kSuspiciousSiteWarningSurvey);\n\n  auto* mock_hats_service = static_cast<MockHatsService*>(\n\
      \      HatsServiceFactory::GetInstance()->SetTestingFactoryAndUse(\n          profile(), base::BindRepeating(&BuildMockHatsService)));\n\
      \n  EXPECT_CALL(\n      *mock_hats_service,\n      LaunchSurveyForWebContents(\n          kHatsSurveyTriggerSuspiciousSiteWarning,\
      \ web_contents(),\n          testing::Contains(testing::Pair(\"did_proceed\", true)),\n          testing::Contains(testing::Pair(\"\
      user_choice\", \"dismiss\")),\n          testing::_, testing::_,\n          testing::Optional(std::string(\"HguD8vrc50tK1KeaPYj0R37AzmWa\"\
      )),\n          testing::_))\n      .Times(1);\n\n  std::unique_ptr<ui::WindowAndroid::ScopedWindowAndroidForTesting>\
      \ window =\n      ui::WindowAndroid::CreateForTesting();\n  window->get()->AddChild(web_contents()->GetNativeView());\n\
      \n  SuspiciousSiteControllerAndroid* controller = MakeController();\n  controller->ShowDialog();\n  // Un-suspend controller\
      \ state: in headless unit tests, ShowDialog() calls\n  // Java showDialog() which triggers ACTIVITY_DESTROYED (due to\
      \ null Activity\n  // in testing WindowAndroid), setting is_suspended_ = true.\n  SetIsSuspended(controller, false);\n\
      \  controller->CloseDialog(\n      ui::ModalDialogWrapper::DismissalCause::TOUCH_OUTSIDE);\n}\n\n"
    replace: ''
  count: 1
- description: 'Remove the retired Android-only survey case: FetchRepeatVisitCount_PopulatesRepeatVisitInSurvey'
  regex:
    pattern: "TEST_F(SuspiciousSiteControllerAndroidTest,\n       FetchRepeatVisitCount_PopulatesRepeatVisitInSurvey) {\n\
      \  base::test::ScopedFeatureList feature_list;\n  feature_list.InitAndEnableFeature(kSuspiciousSiteWarningSurvey);\n\
      \n  HistoryServiceFactory::GetInstance()->SetTestingFactory(\n      profile(), base::BindRepeating(&BuildTestHistoryService));\n\
      \n  history::HistoryService* history_service =\n      HistoryServiceFactory::GetForProfile(profile(),\n            \
      \                               ServiceAccessType::EXPLICIT_ACCESS);\n  ASSERT_TRUE(history_service);\n\n  GURL url(\"\
      https://malicious.com\");\n  NavigateAndCommit(url);\n  history_service->AddPage(url, base::Time::Now(), history::SOURCE_BROWSED);\n\
      \  history_service->AddPage(url, base::Time::Now(), history::SOURCE_BROWSED);\n\n  auto* mock_hats_service = static_cast<MockHatsService*>(\n\
      \      HatsServiceFactory::GetInstance()->SetTestingFactoryAndUse(\n          profile(), base::BindRepeating(&BuildMockHatsService)));\n\
      \n  std::unique_ptr<ui::WindowAndroid::ScopedWindowAndroidForTesting> window =\n      ui::WindowAndroid::CreateForTesting();\n\
      \  window->get()->AddChild(web_contents()->GetNativeView());\n\n  SuspiciousSiteControllerAndroid* controller = MakeController();\n\
      \  controller->ShowDialog();\n  // Un-suspend controller state: in headless unit tests, ShowDialog() calls\n  // Java\
      \ showDialog() which triggers ACTIVITY_DESTROYED (due to null Activity\n  // in testing WindowAndroid), setting is_suspended_\
      \ = true.\n  SetIsSuspended(controller, false);\n\n  history::BlockUntilHistoryProcessesPendingRequests(history_service);\n\
      \n  EXPECT_CALL(*mock_hats_service,\n              LaunchSurveyForWebContents(\n                  kHatsSurveyTriggerSuspiciousSiteWarning,\
      \ web_contents(),\n                  testing::Contains(testing::Pair(\"repeat_visit\", true)),\n                  testing::_,\
      \ testing::_, testing::_, testing::_, testing::_))\n      .Times(1);\n\n  controller->CloseDialog(\n      ui::ModalDialogWrapper::DismissalCause::TOUCH_OUTSIDE);\n\
      }\n\n"
    replace: ''
  count: 1
- description: Keep the tab-switch state test, remove survey mocks, and assert the retained suspended state.
  regex:
    pattern: "TEST_F(SuspiciousSiteControllerAndroidTest,\n       CloseDialog_TabSwitched_SuspendsWithoutSurvey) {\n  base::test::ScopedFeatureList\
      \ feature_list;\n  feature_list.InitAndEnableFeature(kSuspiciousSiteWarningSurvey);\n\n  auto* mock_hats_service = static_cast<MockHatsService*>(\n\
      \      HatsServiceFactory::GetInstance()->SetTestingFactoryAndUse(\n          profile(), base::BindRepeating(&BuildMockHatsService)));\n\
      \n  EXPECT_CALL(*mock_hats_service,\n              LaunchSurveyForWebContents(testing::_, testing::_, testing::_,\n\
      \                                         testing::_, testing::_, testing::_,\n                                    \
      \     testing::_, testing::_))\n      .Times(0);\n\n  SuspiciousSiteControllerAndroid* controller = MakeController();\n\
      \  controller->CloseDialog(ui::ModalDialogWrapper::DismissalCause::TAB_SWITCHED);\n}\n\n"
    replace: "TEST_F(SuspiciousSiteControllerAndroidTest,\n       CloseDialog_TabSwitched_SuspendsWithoutSurvey) {\n  SuspiciousSiteControllerAndroid*\
      \ controller = MakeController();\n  controller->CloseDialog(ui::ModalDialogWrapper::DismissalCause::TAB_SWITCHED);\n\
      \  EXPECT_TRUE(GetIsSuspended(controller));\n}\n\n"
  count: 1
