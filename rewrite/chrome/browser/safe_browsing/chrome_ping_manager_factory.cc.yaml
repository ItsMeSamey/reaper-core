substitutions:
- description: Exclude Android survey-only include chrome/browser/ui/hats/hats_service_factory.h
  regex:
    pattern: '#include "chrome/browser/ui/hats/hats_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/hats/hats_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Do not include an Android survey delegate
  regex:
    pattern: '#if BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/safe_browsing/android/chrome_safe_browsing_hats_delegate_android.h"

      #elif BUILDFLAG(FULL_SAFE_BROWSING)'
    replace: '#if BUILDFLAG(FULL_SAFE_BROWSING) && !BUILDFLAG(IS_ANDROID)'
  count: 1
- description: Remove Android survey factory dependency
  regex:
    pattern: "#if BUILDFLAG(FULL_SAFE_BROWSING) || BUILDFLAG(IS_ANDROID)\n  DependsOn(HatsServiceFactory::GetInstance());"
    replace: "#if BUILDFLAG(FULL_SAFE_BROWSING) && !BUILDFLAG(IS_ANDROID)\n  DependsOn(HatsServiceFactory::GetInstance());"
  count: 1
- description: Pass the existing absent-delegate state on Android while retaining real security service creation
  regex:
    pattern: "#if BUILDFLAG(IS_ANDROID)\n  hats_delegate =\n      std::make_unique<ChromeSafeBrowsingHatsDelegateAndroid>(profile);\n\
      #elif BUILDFLAG(FULL_SAFE_BROWSING)"
    replace: '#if BUILDFLAG(FULL_SAFE_BROWSING) && !BUILDFLAG(IS_ANDROID)'
  count: 1
