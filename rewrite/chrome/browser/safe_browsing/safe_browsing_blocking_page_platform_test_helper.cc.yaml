- description: Do not read the retired survey policy on Android while preserving shared constructor transport.
  regex:
    pattern: '  bool is_safe_browsing_surveys_enabled = IsSafeBrowsingSurveysEnabled(*prefs);

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  bool is_safe_browsing_surveys_enabled = false;\n#else\n  bool is_safe_browsing_surveys_enabled\
      \ = IsSafeBrowsingSurveysEnabled(*prefs);\n#endif\n"
