substitutions:
- description: Exclude only retired survey setup from both retained ordinary security regressions
  regex:
    pattern: "  browser()->GetProfile()->GetPrefs()->SetBoolean(\n      prefs::kSafeBrowsingSurveysEnabled, false);"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  browser()->GetProfile()->GetPrefs()->SetBoolean(\n      prefs::kSafeBrowsingSurveysEnabled,\
      \ false);\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 2
