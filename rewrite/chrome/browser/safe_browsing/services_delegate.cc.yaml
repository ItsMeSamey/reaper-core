    re_pattern: '\ \ DCHECK_CURRENTLY_ON\(content::BrowserThread::UI\);\

      \}\

      \

      void\ ServicesDelegate::ShutdownServices\(\)\ \{\

      \}\

      \

      '
    replace: "  DCHECK_CURRENTLY_ON(content::BrowserThread::UI);\n}\n\nconst scoped_refptr<SafeBrowsingDatabaseManager>&\nServicesDelegate::extension_database_manager() const {\n  return database_manager();\n}\n\nvoid ServicesDelegate::ShutdownServices() {\n}\n\n"
