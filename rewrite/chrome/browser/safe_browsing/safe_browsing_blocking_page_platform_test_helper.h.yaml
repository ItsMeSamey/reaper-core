substitutions:
- description: Use explicit Android platform build guards.
  regex:
    pattern: '#include "base/memory/raw_ptr.h"

      '
    replace: '#include "base/memory/raw_ptr.h"


      #include "build/build_config.h"

      '
  count: 1
- description: Exclude dedicated survey-only fixture code on Android.
  regex:
    pattern: "  MOCK_METHOD(void, OnAttachThreatDetailsAndLaunchSurvey, (bool is_tab_closed));\n\n  // Overrides SafeBrowsingUIManager.\n\
      \  void AttachThreatDetailsAndLaunchSurvey(\n      content::BrowserContext* browser_context,\n      std::unique_ptr<ClientSafeBrowsingReportRequest>\
      \ report,\n      bool is_tab_closed) override;\n  void ValidateReportForHats(std::string report_string);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(void, OnAttachThreatDetailsAndLaunchSurvey, (bool is_tab_closed));\n\
      \n  // Overrides SafeBrowsingUIManager.\n  void AttachThreatDetailsAndLaunchSurvey(\n      content::BrowserContext*\
      \ browser_context,\n      std::unique_ptr<ClientSafeBrowsingReportRequest> report,\n      bool is_tab_closed) override;\n\
      \  void ValidateReportForHats(std::string report_string);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude dedicated survey-only fixture code on Android.
  regex:
    pattern: "  void SetExpectEmptyReportForHats(bool expect_empty_report_for_hats);\n  void SetExpectReportUrlForHats(bool\
      \ expect_report_url_for_hats);\n  void SetExpectInterstitialInteractions(\n      int expected_interstitial_interactions);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void SetExpectEmptyReportForHats(bool expect_empty_report_for_hats);\n  void SetExpectReportUrlForHats(bool\
      \ expect_report_url_for_hats);\n  void SetExpectInterstitialInteractions(\n      int expected_interstitial_interactions);\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude dedicated survey-only fixture code on Android.
  regex:
    pattern: "  bool expect_empty_report_for_hats_ = true;\n  bool expect_report_url_for_hats_ = false;\n  std::optional<int>\
      \ expected_interstitial_interactions_;\n  bool should_validate_report_for_hats_ = false;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  bool expect_empty_report_for_hats_ = true;\n  bool expect_report_url_for_hats_\
      \ = false;\n  std::optional<int> expected_interstitial_interactions_;\n  bool should_validate_report_for_hats_ = false;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep survey sentiment mocks outside Android independently of the Safe Browsing mode.
  regex:
    pattern: '#if BUILDFLAG(FULL_SAFE_BROWSING)

      '
    replace: '#if BUILDFLAG(FULL_SAFE_BROWSING) && !BUILDFLAG(IS_ANDROID)

      '
  count: 3
