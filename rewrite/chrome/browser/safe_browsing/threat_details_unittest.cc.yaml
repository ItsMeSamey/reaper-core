substitutions:
- description: Use explicit Android platform build guards.
  regex:
    pattern: '#include "components/safe_browsing/content/browser/threat_details.h"

      '
    replace: '#include "components/safe_browsing/content/browser/threat_details.h"


      #include "build/build_config.h"

      '
  count: 1
- description: Exclude dedicated survey-only fixture code on Android.
  regex:
    pattern: "  MOCK_METHOD(void,\n              AttachThreatDetailsAndLaunchSurvey,\n              (content::BrowserContext\
      \ * browser_context,\n               std::unique_ptr<ClientSafeBrowsingReportRequest> report,\n               bool is_tab_closed),\n\
      \              (override));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(void,\n              AttachThreatDetailsAndLaunchSurvey,\n       \
      \       (content::BrowserContext * browser_context,\n               std::unique_ptr<ClientSafeBrowsingReportRequest>\
      \ report,\n               bool is_tab_closed),\n              (override));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Preserve the destroyed-WebContents regression while excluding only survey setup on Android.
  regex:
    pattern: '  report->SetIsHatsCandidate(true);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  report->SetIsHatsCandidate(true);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep ordinary collection completion assertions while excluding the removed survey mock expectation.
  regex:
    pattern: "  EXPECT_CALL(*ui_manager_,\n              AttachThreatDetailsAndLaunchSurvey(profile(), testing::_,\n     \
      \                                            /*is_tab_closed=*/true))\n      .Times(1);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  EXPECT_CALL(*ui_manager_,\n              AttachThreatDetailsAndLaunchSurvey(profile(),\
      \ testing::_,\n                                                 /*is_tab_closed=*/true))\n      .Times(1);\n#endif \
      \ // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
