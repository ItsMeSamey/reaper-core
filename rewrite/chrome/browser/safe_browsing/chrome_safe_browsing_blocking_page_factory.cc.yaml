substitutions:
- description: Use direct Android platform guard
  regex:
    pattern: '#include "chrome/browser/safe_browsing/chrome_safe_browsing_blocking_page_factory.h"

      '
    replace: '#include "chrome/browser/safe_browsing/chrome_safe_browsing_blocking_page_factory.h"


      #include "build/build_config.h"

      '
  count: 1
- description: Do not query removed survey policy when creating ordinary Android security interstitials
  regex:
    pattern: '  bool is_safe_browsing_surveys_enabled = IsSafeBrowsingSurveysEnabled(*prefs);'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  constexpr bool is_safe_browsing_surveys_enabled = false;\n#else\n  bool is_safe_browsing_surveys_enabled\
      \ = IsSafeBrowsingSurveysEnabled(*prefs);\n#endif  // BUILDFLAG(IS_ANDROID)"
  count: 1
