# Android split pane request ownership and dialog placement.
substitutions:
- description: Keep the data-controls confirmation on its originating tab
  regex:
    re_pattern: \ \ \ \ \ \ CreateDialogModel\(std::move\(on_destructed\)\),\ window\);
    replace: "      CreateDialogModel(std::move(on_destructed)), window,\n      web_contents()->GetJavaWebContents());"
