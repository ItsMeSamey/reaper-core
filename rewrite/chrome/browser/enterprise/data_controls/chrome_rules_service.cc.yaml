# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/enterprise/data_controls/chrome_rules_service.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/enterprise/data_controls/chrome_rules_service\.h"\

      \

      \#include\ "base/memory/ptr_util\.h"\

      \#include\ "base/metrics/histogram_functions\.h"\

      \#include\ "base/no_destructor\.h"\

      \#include\ "base/numerics/safe_conversions\.h"\

      \#include\ "chrome/browser/enterprise/data_protection/data_protection_clipboard_utils\.h"\

      \#include\ "chrome/browser/glic/host/guest_util\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      \#include\ "components/prefs/pref_service\.h"\

      \

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/enterprise/data_controls/chrome_rules_service.h"

      #include "build/build_config.h"


      #include "base/memory/ptr_util.h"

      #include "base/metrics/histogram_functions.h"

      #include "base/no_destructor.h"

      #include "base/numerics/safe_conversions.h"

      #include "chrome/browser/enterprise/data_protection/data_protection_clipboard_utils.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/host/guest_util.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/profiles/profile.h"

      #include "components/prefs/pref_service.h"


      '
- description: 'Android concrete AI source/provider removal: chrome/browser/enterprise/data_controls/chrome_rules_service.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \->IsIncognitoProfile\(\);\

      \ \ \ \ action\.other_profile\ =\ endpoint\.browser_context\(\)\ !=\ profile_;\

      \ \ \}\

      \ \ if\ \(endpoint\.web_contents\(\)\ \&\&\ \(glic::IsGlicGuest\(endpoint\.web_contents\(\)\)\ \|\|\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ glic::IsGlicWebUI\(endpoint\.web_contents\(\)\)\)\)\ \{\

      \ \ \ \ action\.gemini_in_chrome\ =\ true;\

      \ \ \}\

      \ \ return\ action;\

      \}\

      //\ LINT\.ThenChange\(/chrome/browser/enterprise/data_controls/chrome_rules_service\.cc:ExtractPasteActionContextSource\)\

      '
    replace: "                           ->IsIncognitoProfile();\n    action.other_profile = endpoint.browser_context() != profile_;\n  }\n#if !BUILDFLAG(IS_ANDROID)\n  if (endpoint.web_contents() && (glic::IsGlicGuest(endpoint.web_contents()) ||\n                                  glic::IsGlicWebUI(endpoint.web_contents()))) {\n    action.gemini_in_chrome = true;\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  return action;\n}\n// LINT.ThenChange(/chrome/browser/enterprise/data_controls/chrome_rules_service.cc:ExtractPasteActionContextSource)\n"
