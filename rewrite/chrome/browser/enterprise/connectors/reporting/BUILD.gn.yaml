# Android enterprise reporting producer compile-out; retain ordinary scan security.
substitutions:
- description: "0561 Android reporting producer exclusion: Chrome reporting implementation Android test-only"
  regex:
    pattern: "source_set(\"impl\") {\n"
    replace: "source_set(\"impl\") {\n  testonly = is_android\n"
  count: 1
- description: "0561 Android reporting producer exclusion: Explicit Android test implementation ownership"
  regex:
    pattern: "  if (is_chromeos) {\n"
    replace: "  if (is_android) {\n    deps += [ \"//components/enterprise/connectors/core:test_support\" ]\n  }\n\n  if (is_chromeos) {\n"
  count: 1
