substitutions:
- description: Assert no security-upload dispatch through Android SaaS compatibility API
  regex:
    pattern: "  EXPECT_CALL(*client_.get(), UploadSecurityEvent(_, _, _))\n      .WillOnce(\n          [&](bool include_device_info,\n\
      \              ::chrome::cros::reporting::proto::UploadEventsRequest&& request,\n              policy::CloudPolicyClient::ResultCallback\
      \ callback) {\n            EXPECT_EQ(request.events_size(), 1);\n            EXPECT_TRUE(request.events(0).has_saas_usage_report_event());\n\
      \            std::move(callback).Run(\n                policy::CloudPolicyClient::Result(dm_status()));\n          });\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_CALL(*client_.get(), UploadSecurityEvent(_, _, _)).Times(0);\n#else\n  EXPECT_CALL(*client_.get(),\
      \ UploadSecurityEvent(_, _, _))\n      .WillOnce(\n          [&](bool include_device_info,\n              ::chrome::cros::reporting::proto::UploadEventsRequest&&\
      \ request,\n              policy::CloudPolicyClient::ResultCallback callback) {\n            EXPECT_EQ(request.events_size(),\
      \ 1);\n            EXPECT_TRUE(request.events(0).has_saas_usage_report_event());\n            std::move(callback).Run(\n\
      \                policy::CloudPolicyClient::Result(dm_status()));\n          });\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Verify Android callback failure without upload metrics; retain desktop expectations
  regex:
    pattern: "  EXPECT_EQ(captured_result.IsSuccess(), should_succeed());\n  EXPECT_EQ(captured_result.GetDMServerError(),\
      \ dm_status());\n  VerifyStandaloneMetrics(\n      EnterpriseReportingEventType::kSaasUsageReportEvent,\n      \"Enterprise.ReportingEvent.SaasUsage.UploadSuccess.Duration\"\
      ,\n      \"Enterprise.ReportingEvent.SaasUsage.UploadFailure.Duration\");\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_FALSE(captured_result.IsSuccess());\n  EXPECT_EQ(captured_result.GetDMServerError(),\
      \ policy::DM_STATUS_REQUEST_FAILED);\n  histogram_.ExpectTotalCount(\n      \"Enterprise.ReportingEvent.SaasUsage.UploadSuccess.Duration\"\
      , 0);\n  histogram_.ExpectTotalCount(\n      \"Enterprise.ReportingEvent.SaasUsage.UploadFailure.Duration\", 0);\n#else\n\
      \  EXPECT_EQ(captured_result.IsSuccess(), should_succeed());\n  EXPECT_EQ(captured_result.GetDMServerError(), dm_status());\n\
      \  VerifyStandaloneMetrics(\n      EnterpriseReportingEventType::kSaasUsageReportEvent,\n      \"Enterprise.ReportingEvent.SaasUsage.UploadSuccess.Duration\"\
      ,\n      \"Enterprise.ReportingEvent.SaasUsage.UploadFailure.Duration\");\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
