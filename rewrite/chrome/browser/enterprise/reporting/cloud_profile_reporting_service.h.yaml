substitutions:
- description: Own explicit Android platform macro provider
  regex:
    pattern: '#include "base/scoped_observation.h"

      '
    replace: '#include "base/scoped_observation.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Omit Android SaaS scheduler type include
  regex:
    pattern: '#include "components/enterprise/browser/reporting/saas_usage/saas_usage_report_scheduler.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/saas_usage/saas_usage_report_scheduler.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android SaaS profile scheduler ownership
  regex:
    pattern: '  std::unique_ptr<SaasUsageReportScheduler> saas_usage_report_scheduler_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<SaasUsageReportScheduler> saas_usage_report_scheduler_;\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
