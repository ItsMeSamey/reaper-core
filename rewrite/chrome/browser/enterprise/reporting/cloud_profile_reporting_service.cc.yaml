substitutions:
- description: Omit Android SaaS profile-scheduler include
  regex:
    pattern: '#include "chrome/browser/enterprise/reporting/saas_usage/saas_usage_reporting_delegate_factory_impl.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/enterprise/reporting/saas_usage/saas_usage_reporting_delegate_factory_impl.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android SaaS profile-scheduler include
  regex:
    pattern: '#include "components/enterprise/browser/reporting/saas_usage/saas_usage_report_scheduler.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/saas_usage/saas_usage_report_scheduler.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android SaaS profile scheduler creation
  regex:
    pattern: "  if (base::FeatureList::IsEnabled(kSaasUsageReporting)) {\n    auto saas_usage_reporting_delegate_factory =\n\
      \        SaasUsageReportingDelegateFactoryImpl::CreateForProfile(profile_);\n    saas_usage_report_scheduler_ = SaasUsageReportScheduler::Create(\n\
      \        \"profile\", saas_usage_reporting_delegate_factory.get());\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(kSaasUsageReporting)) {\n    auto saas_usage_reporting_delegate_factory\
      \ =\n        SaasUsageReportingDelegateFactoryImpl::CreateForProfile(profile_);\n    saas_usage_report_scheduler_ =\
      \ SaasUsageReportScheduler::Create(\n        \"profile\", saas_usage_reporting_delegate_factory.get());\n  }\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
