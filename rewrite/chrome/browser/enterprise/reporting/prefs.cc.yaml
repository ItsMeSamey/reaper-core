substitutions:
- description: Omit SaaS report/trigger storage registration; preserve domain-policy/UI metadata
  regex:
    pattern: "  registry->RegisterListPref(kSaasUsageDomainUrlsForBrowser);\n  registry->RegisterDictionaryPref(kSaasUsageReport);\n\
      \  registry->RegisterTimePref(kSaasUsageReportLastTriggerTime, base::Time());\n"
    replace: "  registry->RegisterListPref(kSaasUsageDomainUrlsForBrowser);\n#if !BUILDFLAG(IS_ANDROID)\n  registry->RegisterDictionaryPref(kSaasUsageReport);\n\
      \  registry->RegisterTimePref(kSaasUsageReportLastTriggerTime, base::Time());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit SaaS report/trigger storage registration; preserve domain-policy/UI metadata
