    pattern: "  registry->RegisterListPref(kSaasUsageDomainUrlsForProfile);\n  registry->RegisterDictionaryPref(kSaasUsageReport);\n\
      \  registry->RegisterTimePref(kSaasUsageReportLastTriggerTime, base::Time());\n"
    replace: "  registry->RegisterListPref(kSaasUsageDomainUrlsForProfile);\n#if !BUILDFLAG(IS_ANDROID)\n  registry->RegisterDictionaryPref(kSaasUsageReport);\n\
      \  registry->RegisterTimePref(kSaasUsageReportLastTriggerTime, base::Time());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
