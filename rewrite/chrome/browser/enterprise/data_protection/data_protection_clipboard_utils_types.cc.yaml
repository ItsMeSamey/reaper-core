# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/enterprise/data_protection/data_protection_clipboard_utils_types.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/enterprise/data_protection/data_protection_clipboard_utils_types\.h"\

      \

      \#include\ "base/strings/utf_string_conversions\.h"\

      \#include\ "chrome/browser/glic/host/guest_util\.h"\

      \#include\ "content/public/browser/browser_context\.h"\

      \#include\ "content/public/browser/clipboard_types\.h"\

      \#include\ "content/public/browser/web_contents\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/enterprise/data_protection/data_protection_clipboard_utils_types.h"

      #include "build/build_config.h"


      #include "base/strings/utf_string_conversions.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/host/guest_util.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "content/public/browser/browser_context.h"

      #include "content/public/browser/clipboard_types.h"

      #include "content/public/browser/web_contents.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/enterprise/data_protection/data_protection_clipboard_utils_types.cc'
  regex:
    re_pattern: '\ \ if\ \(auto\*\ web_contents\ =\ source\.web_contents\(\)\)\ \{\

      \ \ \ \ cached\.title\ =\ base::UTF16ToUTF8\(web_contents\->GetTitle\(\)\);\

      \ \ \ \ cached\.page_content_type\ =\ web_contents\->GetContentsMimeType\(\);\

      \ \ \ \ cached\.gemini_in_chrome\ =\

      \ \ \ \ \ \ \ \ glic::IsGlicGuest\(web_contents\)\ \|\|\ glic::IsGlicWebUI\(web_contents\);\

      \ \ \}\

      \ \ return\ cached;\

      \}\

      '
    replace: "  if (auto* web_contents = source.web_contents()) {\n    cached.title = base::UTF16ToUTF8(web_contents->GetTitle());\n    cached.page_content_type = web_contents->GetContentsMimeType();\n#if !BUILDFLAG(IS_ANDROID)\n    cached.gemini_in_chrome =\n        glic::IsGlicGuest(web_contents) || glic::IsGlicWebUI(web_contents);\n#endif  // !BUILDFLAG(IS_ANDROID)\n  }\n  return cached;\n}\n"
