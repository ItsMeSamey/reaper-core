# Android Chromium Discover implementation exclusion.
substitutions:
- description: History attribution no longer initializes an absent Discover backend
  regex:
    re_pattern: '\ \ \ \ \ \ ":jni_headers",\

      \ \ \ \ \ \ "//chrome/browser/feed",\

      '
    replace: '      ":jni_headers",

      '
- description: The Android history tests no longer require an absent Discover fake or backend
  regex:
    re_pattern: '\ \ if\ \(is_android\)\ \{\

      \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ "//chrome/browser/feed",\

      \ \ \ \ \ \ "//components/feed/core/v2:feed_core_stubs",\

      \ \ \ \ \ \ "//components/feed/core/v2:feed_core_v2",\

      \ \ \ \ \]\

      \ \ \}\ else\ \{\

      '
    replace: '  if (!is_android) {

      '

- description: 'Android concrete AI source/provider removal: chrome/browser/history/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/base",\

      \ \ \ \ "//url",\

      \ \ \]\

      \

      \ \ if\ \(enable_extensions_core\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/extensions"\ \]\

      '
    replace: "    \"//ui/base\",\n    \"//url\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/actor\" ]\n  }\n\n  if (enable_extensions_core) {\n    deps += [ \"//chrome/browser/extensions\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/history/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//third_party/blink/public/common",\

      \ \ \ \ "//ui/base",\

      \ \ \]\

      \

      \ \ if\ \(!is_android\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//components/webapps/isolated_web_apps:scheme"\ \]\

      '
    replace: "    \"//third_party/blink/public/common\",\n    \"//ui/base\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/actor\",\n      \"//chrome/browser/actor:test_support\",\n    ]\n  }\n\n  if (!is_android) {\n    deps += [ \"//components/webapps/isolated_web_apps:scheme\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/history/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/webui:test_support",\

      \ \ \ \ \ \ "//url",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      '
    replace: "      \"//ui/webui:test_support\",\n      \"//url\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor\",\n        \"//chrome/browser/actor:test_support\",\n        \"//components/actor/core\",\n      ]\n    }\n  }\n}\n"
