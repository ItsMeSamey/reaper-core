# Android Chromium Discover implementation exclusion.
substitutions:
- description: 'Skip saving history for a tab that requested off-the-record browsing.


    Request-OTR lets a user browse a single tab privately without opening a

    full private window, so GetHistoryService must treat such a tab the

    same way it treats an actually off-the-record profile. The helper this

    calls is defined by the chromium_src override at

    brave/chromium_src/chrome/browser/history/history_tab_helper.cc.'
  preempt_function_impl:
    function_name: HistoryTabHelper::GetHistoryService
    code: "if (BraveTabRequestedOffTheRecord(web_contents())) {\n  return nullptr;\n}"
- description: History must not depend on or create the removed Android Discover service
  regex:
    re_pattern: '\#include\ "chrome/browser/feed/feed_service_factory\.h"\

      '
    replace: ''
- description: History must not depend on or create the removed Android Discover service
  regex:
    re_pattern: '\#include\ "components/feed/core/v2/public/feed_api\.h"\ \ //\ nogncheck\ crbug\.com/40147906\

      '
    replace: ''
- description: History must not depend on or create the removed Android Discover service
  regex:
    re_pattern: '\#include\ "components/feed/core/v2/public/feed_service\.h"\ \ //\ nogncheck\ crbug\.com/40147906\

      '
    replace: ''
- description: Remove Discover-only source-attribution lookup
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      bool\ IsNavigationFromFeed\(content::WebContents\&\ web_contents,\ const\ GURL\&\ url\)\ \{\

      \ \ feed::FeedService\*\ feed_service\ =\

      \ \ \ \ \ \ feed::FeedServiceFactory::GetForBrowserContext\(\

      \ \ \ \ \ \ \ \ \ \ web_contents\.GetBrowserContext\(\)\);\

      \ \ if\ \(!feed_service\)\ \{\

      \ \ \ \ return\ false;\

      \ \ \}\

      \

      \ \ return\ feed_service\->GetStream\(\)\->WasUrlRecentlyNavigatedFromFeed\(url\);\

      \}\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      '
    replace: ''
- description: Retain ordinary Most Visited history without an absent Discover attribution branch
  regex:
    re_pattern: 'bool\ ShouldConsiderForNtpMostVisited\(\

      \ \ \ \ content::WebContents\&\ web_contents,\

      \ \ \ \ content::NavigationHandle\*\ navigation_handle\)\ \{\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ //\ Clicks\ on\ content\ suggestions\ on\ the\ NTP\ should\ not\ contribute\ to\ the\

      \ \ //\ Most\ Visited\ tiles\ in\ the\ NTP\.\

      \ \ DCHECK\(!navigation_handle\->GetRedirectChain\(\)\.empty\(\)\);\

      \ \ if\ \(ui::PageTransitionCoreTypeIs\(navigation_handle\->GetPageTransition\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ui::PAGE_TRANSITION_AUTO_BOOKMARK\)\ \&\&\

      \ \ \ \ \ \ IsNavigationFromFeed\(web_contents,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ navigation_handle\->GetRedirectChain\(\)\[0\]\)\)\ \{\

      \ \ \ \ return\ false;\

      \ \ \}\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      \

      \ \ return\ true;\

      \}\

      '
    replace: "bool ShouldConsiderForNtpMostVisited(\n    content::WebContents& web_contents,\n    content::NavigationHandle* navigation_handle) {\n  return true;\n}\n"
- description: Format Android Chromium Discover exclusion
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      using\ base::android::ConvertUTF8ToJavaString;\

      using\ chrome::android::BackgroundTabManager;\

      \#endif\

      \

      \

      bool\ ShouldConsiderForNtpMostVisited\(\

      \ \ \ \ content::WebContents\&\ web_contents,\

      \ \ \ \ content::NavigationHandle\*\ navigation_handle\)\ \{\

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\nusing base::android::ConvertUTF8ToJavaString;\nusing chrome::android::BackgroundTabManager;\n#endif\n\nbool ShouldConsiderForNtpMostVisited(\n    content::WebContents& web_contents,\n    content::NavigationHandle* navigation_handle) {\n"

