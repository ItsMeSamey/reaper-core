# Android Chromium Discover implementation exclusion.
substitutions:
- description: Remove the Discover-only Android test fixture dependency
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \#include\ "chrome/browser/feed/feed_service_factory\.h"\

      \#include\ "components/feed/core/v2/public/feed_service\.h"\ \ //\ nogncheck\ crbug\.com/40147906\

      \#include\ "components/feed/core/v2/public/test/stub_feed_api\.h"\ \ //\ nogncheck\ crbug\.com/40147906\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      '
    replace: ''
- description: Remove the Discover-only Android test fixture dependency
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      class\ TestFeedApi\ :\ public\ feed::StubFeedApi\ \{\

      \ public:\

      \ \ MOCK_METHOD1\(WasUrlRecentlyNavigatedFromFeed,\ bool\(const\ GURL\&\)\);\

      \};\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      '
    replace: ''
- description: Remove the Discover-only Android test fixture dependency
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ feed::FeedServiceFactory::GetInstance\(\)\->SetTestingFactory\(\

      \ \ \ \ \ \ \ \ profile\(\),\

      \ \ \ \ \ \ \ \ base::BindLambdaForTesting\(\[\&\]\(content::BrowserContext\*\ context\)\ \{\

      \ \ \ \ \ \ \ \ \ \ std::unique_ptr<KeyedService>\ result\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ feed::FeedService::CreateForTesting\(\&test_feed_api_\);\

      \ \ \ \ \ \ \ \ \ \ return\ result;\

      \ \ \ \ \ \ \ \ \}\)\);\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      '
    replace: ''
- description: Remove the Discover-only Android test fixture dependency
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ TestFeedApi\ test_feed_api_;\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      '
    replace: ''
- description: Preserve ordinary NTP navigation history without creating any Discover service
  regex:
    re_pattern: TEST_F\(HistoryTabHelperTest,\ NonFeedNavigationsDoContributeToMostVisited\)
    replace: TEST_F(HistoryTabHelperTest, StaticNtpNavigationsContributeToMostVisitedWithoutFeed)
- description: The retained NTP history regression has no fake Discover service
  regex:
    re_pattern: '\ \ EXPECT_CALL\(test_feed_api_,\ WasUrlRecentlyNavigatedFromFeed\(new_url\)\)\

      \ \ \ \ \ \ \.WillOnce\(testing::Return\(false\)\);\

      '
    replace: ''
- description: Remove a regression for intentionally excluded Discover-only attribution
  regex:
    re_pattern: 'TEST_F\(HistoryTabHelperTest,\ FeedNavigationsDoNotContributeToMostVisited\)\ \{\

      \ \ GURL\ new_url\("http://newurl\.com"\);\

      \ \ EXPECT_CALL\(test_feed_api_,\ WasUrlRecentlyNavigatedFromFeed\(new_url\)\)\

      \ \ \ \ \ \ \.WillOnce\(testing::Return\(true\)\);\

      \ \ web_contents_tester\(\)\->NavigateAndCommit\(new_url,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ui::PAGE_TRANSITION_AUTO_BOOKMARK\);\

      \

      \ \ EXPECT_THAT\(GetMostVisitedURLSet\(\),\ testing::Not\(testing::Contains\(new_url\)\)\);\

      \}\

      '
    replace: ''
