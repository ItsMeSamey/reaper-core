substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      package\ org\.chromium\.chrome\.browser\.fullscreen;\

      \

      import\ org\.chromium\.base\.supplier\.NonNullObservableSupplier;\

      import\ org\.chromium\.build\.annotations\.NullMarked;\

      import\ org\.chromium\.components\.browser_ui\.widget\.gesture\.BackPressHandler;\

      \

      /\*\*\

      \ \*\ A\ \{@link\ BackPressHandler\}\ which\ observes\ fullscreen\ mode\ and\ exits\ fullscreen\ mode\ if\ back\

      \ \*\ press\ is\ performed\.\

      \ \*/\

      @NullMarked\

      public\ class\ FullscreenBackPressHandler\ implements\ BackPressHandler\ \{\

      \ \ \ \ private\ final\ FullscreenManager\ mFullscreenManager;\

      \

      \ \ \ \ public\ FullscreenBackPressHandler\(FullscreenManager\ fullscreenManager\)\ \{\

      \ \ \ \ \ \ \ \ mFullscreenManager\ =\ fullscreenManager;\

      \ \ \ \ \}\

      \

      \ \ \ \ @Override\

      \ \ \ \ public\ @BackPressResult\ int\ handleBackPress\(\)\ \{\

      \ \ \ \ \ \ \ \ int\ res\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mFullscreenManager\.getPersistentFullscreenMode\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ BackPressResult\.SUCCESS\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ BackPressResult\.FAILURE;\

      \ \ \ \ \ \ \ \ mFullscreenManager\.exitPersistentFullscreenMode\(\);\

      \ \ \ \ \ \ \ \ return\ res;\

      \ \ \ \ \}\

      \

      \ \ \ \ @Override\

      \ \ \ \ public\ NonNullObservableSupplier<Boolean>\ getHandleBackPressChangedSupplier\(\)\ \{\

      \ \ \ \ \ \ \ \ return\ mFullscreenManager\.getPersistentFullscreenModeSupplier\(\);\

      \ \ \ \ \}\

      \}\

      '
    replace: "// found in the LICENSE file.\n\npackage org.chromium.chrome.browser.fullscreen;\n\nimport org.chromium.base.Callback;\n\
      import org.chromium.base.supplier.NonNullObservableSupplier;\nimport org.chromium.base.supplier.ObservableSuppliers;\n\
      import org.chromium.base.supplier.SettableNonNullObservableSupplier;\nimport org.chromium.build.annotations.NullMarked;\n\
      import org.chromium.build.annotations.Nullable;\nimport org.chromium.components.browser_ui.widget.gesture.BackPressHandler;\n\
      \n/** Exits browser fullscreen while preserving the ordinary tab/exclusive-access Back handler. */\n@NullMarked\npublic\
      \ class FullscreenBackPressHandler implements BackPressHandler {\n    private final FullscreenManager mFullscreenManager;\n\
      \    private boolean mDestroyed;\n    private final @Nullable BackPressHandler mTabHandler;\n    private final NonNullObservableSupplier<Boolean>\
      \ mUiModeSupplier;\n    private final @Nullable NonNullObservableSupplier<Boolean> mTabHandlerSupplier;\n    private\
      \ final SettableNonNullObservableSupplier<Boolean> mHandleBackPressSupplier =\n            ObservableSuppliers.createNonNull(false);\n\
      \    private final Callback<Boolean> mStateChanged = ignored -> updateState();\n\n    public FullscreenBackPressHandler(FullscreenManager\
      \ fullscreenManager) {\n        this(fullscreenManager, null);\n    }\n\n    public FullscreenBackPressHandler(\n  \
      \          FullscreenManager fullscreenManager, @Nullable BackPressHandler tabHandler) {\n        mFullscreenManager\
      \ = fullscreenManager;\n        mTabHandler = tabHandler;\n        mUiModeSupplier = fullscreenManager.getFullscreenUiModeSupplier();\n\
      \        mTabHandlerSupplier =\n                tabHandler == null ? null : tabHandler.getHandleBackPressChangedSupplier();\n\
      \        mUiModeSupplier.addSyncObserverAndPostIfNonNull(mStateChanged);\n        if (mTabHandlerSupplier != null) {\n\
      \            mTabHandlerSupplier.addSyncObserverAndPostIfNonNull(mStateChanged);\n        }\n        updateState();\n\
      \    }\n\n    private void updateState() {\n        if (mDestroyed) return;\n        mHandleBackPressSupplier.set(\n\
      \                mUiModeSupplier.get()\n                        || (mTabHandlerSupplier != null && mTabHandlerSupplier.get()));\n\
      \    }\n\n    @Override\n    public @BackPressResult int handleBackPress() {\n        if (mDestroyed) return BackPressResult.FAILURE;\n\
      \        boolean browserFullscreen = mFullscreenManager.getBrowserFullscreenMode();\n        if (browserFullscreen)\
      \ mFullscreenManager.setBrowserFullscreenMode(false);\n        if (mTabHandler != null) {\n            if (mTabHandlerSupplier\
      \ != null && mTabHandlerSupplier.get()) {\n                return mTabHandler.handleBackPress();\n            }\n  \
      \          return browserFullscreen ? BackPressResult.SUCCESS : BackPressResult.FAILURE;\n        }\n        boolean\
      \ tabFullscreen = mFullscreenManager.getPersistentFullscreenMode();\n        if (tabFullscreen) mFullscreenManager.exitPersistentFullscreenMode();\n\
      \        return browserFullscreen || tabFullscreen\n                ? BackPressResult.SUCCESS\n                : BackPressResult.FAILURE;\n\
      \    }\n\n    @Override\n    public boolean invokeBackActionOnEscape() {\n        return mFullscreenManager.getBrowserFullscreenMode()\n\
      \                || mTabHandler == null\n                || mTabHandler.invokeBackActionOnEscape();\n    }\n\n    @Override\n\
      \    public @Nullable Boolean handleEscPress() {\n        if (mFullscreenManager.getBrowserFullscreenMode()) {\n   \
      \         return handleBackPress() == BackPressResult.SUCCESS;\n        }\n        return mTabHandler == null ? null\
      \ : mTabHandler.handleEscPress();\n    }\n\n    @Override\n    public NonNullObservableSupplier<Boolean> getHandleBackPressChangedSupplier()\
      \ {\n        return mHandleBackPressSupplier;\n    }\n\n    /** Detaches only this wrapper's suppliers; its tab delegate\
      \ remains owned by the caller. */\n    public void destroy() {\n        mDestroyed = true;\n        mUiModeSupplier.removeObserver(mStateChanged);\n\
      \        if (mTabHandlerSupplier != null) mTabHandlerSupplier.removeObserver(mStateChanged);\n    }\n}\n"
