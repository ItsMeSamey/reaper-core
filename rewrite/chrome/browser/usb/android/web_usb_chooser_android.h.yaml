# Android selected-tab device chooser lifetime.
substitutions:
- description: Forward declare exact-document chooser lifetime
  regex:
    re_pattern: class\ UsbChooserDialogAndroid;
    replace: 'class UsbChooserDialogAndroid;

      class ActiveDeviceChooserRequest;'
- description: Retain cancellation until the chooser closes
  regex:
    re_pattern: \ \ std::unique_ptr<UsbChooserDialogAndroid>\ dialog_;
    replace: "  std::unique_ptr<ActiveDeviceChooserRequest> request_;\n  std::unique_ptr<UsbChooserDialogAndroid> dialog_;"
