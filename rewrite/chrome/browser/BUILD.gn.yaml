mponents/leveldb_proto\" ]\n  }\n}\n\n# The following header-only targets exist so that targets like :core and\n# other componentized targets can include these headers without depending\n# on :browser. The .cc files for these headers remain in :browser.\n\nsource_set(\"chrome_browser_main\") {\n  public = [ \"chrome_browser_main.h\" ]\n  deps = [\n    \":after_startup_task_utils\",\n    \":buildflags\",\n    \"//base\",\n    \"//build:buildflag_header_h\",\n    \"//chrome/browser/first_run\",\n    \"//chrome/browser/lifetime\",\n    \"//chrome/browser/ui/startup\",\n    \"//chrome/common:buildflags\",\n    \"//content/public/browser\",\n    \"//content/public/common:result_codes\",\n  ]\n}\n\nsource_set(\"icon_manager\") {\n  public = [ \"icon_manager.h\" ]\n  deps = [\n    \":icon_loader\",\n    \"//base\",\n    \"//ui/gfx\",\n  ]\n}\n\nsource_set(\"memory_details\") {\n  public = [ \"memory_details.h\" ]\n  deps = [\n    \"//base\",\n    \"//content/public/common\",\n    \"//services/resource_coordinator/public/mojom\",\n  ]\n}\n\nsource_set(\"net_benchmarking\") {\n  public = [ \"net_benchmarking.h\" ]\n  deps = [\n    \"//base\",\n    \"//chrome/common:mojo_bindings\",\n    \"//mojo/public/cpp/bindings\",\n  ]\n}\n\nsource_set(\"process_resource_usage\") {\n  public = [ \"process_resource_usage.h\" ]\n  deps = [\n    \"//base\",\n    \"//chrome/common:mojo_bindings\",\n    \"//mojo/public/cpp/bindings\",\n    \"//third_party/blink/public/common:headers\",\n  ]\n}\n\nsource_set(\"renderer_preferences_util\") {\n  public = [ \"renderer_preferences_util.h\" ]\n}\n\nsource_set(\"resources_util\") {\n  public = [ \"resources_util.h\" ]\n  public_deps = [ \"//chrome/app/theme:webui_theme_resources\" ]\n}\n\nsource_set(\"universal_web_contents_observers\") {\n  public = [ \"universal_web_contents_observers.h\" ]\n  deps = [ \"//content/public/browser\" ]\n}\n\nsource_set(\"intranet_redirect_detector\") {\n  public = [ \"intranet_redirect_detector.h\" ]\n  deps = [\n   