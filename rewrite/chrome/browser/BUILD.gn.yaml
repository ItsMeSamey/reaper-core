# Android Chromium Discover implementation exclusion.
substitutions:
- description: Depend on the Brave browser core.
  insert_into_list:
    target: browser
    list_name: public_deps
    values:
    - //brave/browser:core
- description: Add the Brave browser public_deps.
  add_literal_to_list:
    target: browser_public_dependencies
    list_name: public_deps
    literal: brave_chrome_browser_public_deps
    import: //brave/browser/sources.gni
- description: Depend on the Android extensions UI with the core.
  regex:
    pattern: if (enable_desktop_android_extensions) {
    replace: if (is_android && enable_extensions_core) {
- description: Retain the Android storage monitor dependency when extensions use it.
  regex:
    pattern: '    deps -= [ "//components/storage_monitor" ]'
    replace: "    if (!enable_desktop_android_extensions) {\n      deps -= [ \"//components/storage_monitor\" ]\n    }"
- description: Load Android file-type icons through the public framework MIME icon API.
  regex:
    pattern: "    deps += [\n      \"//chrome/android:jni_headers\","
    replace: "    deps += [\n      \"//brave/browser/extensions/android/download_icons:jni_headers\",\n      \"//chrome/android:jni_headers\","
- description: Declare browser-client generic stream ownership dependency
  regex:
    re_pattern: '\ \ if\ \(enable_extensions_core\)\ \{\

      \ \ \ \ deps\ \+=\ \['
    replace: "  if (enable_extensions_core) {\n    deps += [\n      \"//extensions/browser/mime_handler\","
- description: declare direct Android tab headers used by FileSelectHelper
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/android",\

      \ \ \ \ \ \ "//chrome/browser/android:profile_key_startup_accessor",'
    replace: "      \"//chrome/browser/android\",\n      \"//chrome/browser/android:profile_key_startup_accessor\",\n      \"//chrome/browser/android:tabs_public\","
- description: declare Android browser tab-list access used by extension picker owner
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/preloading/android",\

      \ \ \ \ \ \ "//chrome/browser/ui/page_info",'
    replace: "      \"//chrome/browser/preloading/android\",\n      \"//chrome/browser/tab_list\",\n      \"//chrome/browser/ui/page_info\","
- description: declare Android actual-view eligibility used before extension picker launch
  regex:
    re_pattern: '\ \ \ \ \ \ "//services/webnn/public/mojom:features",\

      \ \ \ \ \ \ "//ui/compositor",'
    replace: "      \"//services/webnn/public/mojom:features\",\n      \"//ui/android\",\n      \"//ui/compositor\","
- description: link real Android tab-model picker regression fixture
  regex:
    re_pattern: '\ \ \ \ deps\ \+=\ \[\ "//chrome/browser/android"\ \]\

      \

      \ \ \ \ if\ \(enable_guest_view\ \&\&\ !enable_extensions_core\)\ \{'
    replace: "    deps += [\n      \"//chrome/browser/android\",\n      \"//chrome/browser/android:tabs_public\",\n      \"//chrome/browser/permissions\",\n      \"//chrome/browser/ui/android/tab_model:test_support\",\n    ]\n\n    if (enable_guest_view && !enable_extensions_core) {"
- description: Link opt-in Android global hardware shortcut broker only for extension builds
  regex:
    re_pattern: '\ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ "//brave/browser/extensions/android/download_icons:jni_headers",'
    replace: "    if (enable_extensions_core) {\n      deps += [ \"//brave/browser/extensions/android/global_shortcuts\" ]\n    }\n    deps += [\n      \"//brave/browser/extensions/android/download_icons:jni_headers\","
- description: Exclude Android Discover implementation from the production native or resource graph
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/feed",\

      '
    replace: ''
