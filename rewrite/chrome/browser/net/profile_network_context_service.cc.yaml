substitutions:
- description: Preserve captured inherited source patch context (1)
  regex:
    re_pattern: '\ \ std::vector<std::string>\ excluded\(TranslateStringArray\(ct_excluded\)\);\

      \ \ std::vector<std::string>\ excluded_spkis\(\

      \ \ \ \ \ \ TranslateStringArray\(ct_excluded_spkis\)\);\

      \

      \ \ return\ network::mojom::CTPolicy::New\(std::move\(excluded\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::move\(excluded_spkis\)\);\

      \}\

      \

      '
    replace: "  std::vector<std::string> excluded(TranslateStringArray(ct_excluded));\n  std::vector<std::string> excluded_spkis(\n\
      \      TranslateStringArray(ct_excluded_spkis));\n\n  BRAVE_PROFILE_NETWORK_CONTEXT_SERVICE_GET_CT_POLICY\n  return\
      \ network::mojom::CTPolicy::New(std::move(excluded),\n                                       std::move(excluded_spkis));\n\
      }\n\n"
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/net/profile_network_context_service\.h"\

      \

      \#include\ <memory>\

      \#include\ <string>\

      \#include\ <string_view>\

      \

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/net/profile_network_context_service.h"


      #include <algorithm>

      #include <memory>

      #include <string>

      #include <string_view>


      '
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
  regex:
    re_pattern: '\ \ \ \ network_context_params\->file_paths\->reporting_and_nel_store_database_name\ =\

      \ \ \ \ \ \ \ \ base::FilePath\(chrome::kReportingAndNelStoreFilename\);\

      \#endif\ \ //\ BUILDFLAG\(ENABLE_REPORTING\)\

      \

      \ \ \ \ if\ \(relative_partition_path\.empty\(\)\)\ \{\ \ //\ This\ is\ the\ main\ partition\.\

      \ \ \ \ \ \ network_context_params\->restore_old_session_cookies\ =\

      \ \ \ \ \ \ \ \ \ \ profile_\->ShouldRestoreOldSessionCookies\(\);\

      \ \ \ \ \ \ network_context_params\->persist_session_cookies\ =\

      \ \ \ \ \ \ \ \ \ \ profile_\->ShouldPersistSessionCookies\(\);\

      '
    replace: "    network_context_params->file_paths->reporting_and_nel_store_database_name =\n        base::FilePath(chrome::kReportingAndNelStoreFilename);\n\
      #endif  // BUILDFLAG(ENABLE_REPORTING)\n\n    bool use_profile_session_cookie_policy = relative_partition_path.empty();\n\
      #if BUILDFLAG(IS_ANDROID)\n    // Content stores persistent partitions as Storage/ext/<domain>/<hash>.\n    // Only\
      \ the Containers domain inherits browser-session cookie behavior;\n    // extension/webview partitions keep their existing\
      \ non-default policy.\n    const auto components = relative_partition_path.GetComponents();\n    use_profile_session_cookie_policy\
      \ |=\n        components.size() == 4 && components[0] == \"Storage\" &&\n        components[1] == \"ext\" && components[2]\
      \ == \"containers\" &&\n        components[3].size() == 12 &&\n        std::ranges::all_of(components[3], [](char c)\
      \ {\n          return (c >= '0' && c <= '9') || (c >= 'A' && c <= 'F');\n        });\n#endif\n    if (use_profile_session_cookie_policy)\
      \ {\n      network_context_params->restore_old_session_cookies =\n          profile_->ShouldRestoreOldSessionCookies();\n\
      \      network_context_params->persist_session_cookies =\n          profile_->ShouldPersistSessionCookies();\n"
