# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/net/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//services/network:network_service",\

      \ \ \ \ "//services/strings",\

      \ \ \]\

      \

      \ \ if\ \(enable_extensions_core\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/ui/webui/extensions:headers"\ \]\

      '
    replace: "    \"//services/network:network_service\",\n    \"//services/strings\",\n  ]\n  if (is_android) {\n    deps -= [ \"//components/contextual_tasks/public:feature_list\" ]\n  }\n\n  if (enable_extensions_core) {\n    deps += [ \"//chrome/browser/ui/webui/extensions:headers\" ]\n"
