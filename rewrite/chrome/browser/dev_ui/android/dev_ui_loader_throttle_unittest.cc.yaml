# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/dev_ui/android/dev_ui_loader_throttle_unittest.cc'
  regex:
    re_pattern: '\#include\ <memory>\

      \#include\ <utility>\

      \

      \#include\ "chrome/android/modules/dev_ui/provider/dev_ui_module_provider\.h"\

      \#include\ "chrome/test/base/chrome_render_view_host_test_harness\.h"\

      \#include\ "content/public/common/buildflags\.h"\

      '
    replace: '#include <memory>

      #include <utility>


      #include "build/build_config.h"

      #include "chrome/android/modules/dev_ui/provider/dev_ui_module_provider.h"

      #include "chrome/test/base/chrome_render_view_host_test_harness.h"

      #include "content/public/common/buildflags.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/dev_ui/android/dev_ui_loader_throttle_unittest.cc'
  regex:
    re_pattern: 'namespace\ \{\

      \

      const\ char\*\ const\ kNonDevUiUrls\[\]\ =\ \{\

      \ \ \ \ "https://example\.com",\

      \ \ \ \ "https://example\.com/path\?query\#frag",\

      \ \ \ \ "chrome://credits",\

      '
    replace: "namespace {\n\nconst char* const kNonDevUiUrls[] = {\n#if BUILDFLAG(IS_ANDROID)\n    \"chrome://private-ai-internals\",\n    \"chrome://private-ai-internals/path?query#frag\",\n    \"chrome://actor-internals\",\n    \"chrome://actor-internals/path?query#frag\",\n    \"chrome://context-hub\",\n    \"chrome://context-hub/path?query#frag\",\n#endif\n    \"https://example.com\",\n    \"https://example.com/path?query#frag\",\n    \"chrome://credits\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/dev_ui/android/dev_ui_loader_throttle_unittest.cc'
  regex:
    re_pattern: '\ \ \ \ "chrome://chrome\-finds\-internals/path\?query\#frag",\

      \ \ \ \ "chrome://connectors\-internals",\

      \ \ \ \ "chrome://connectors\-internals/path\?query\#frag",\

      \ \ \ \ "chrome://private\-ai\-internals",\

      \ \ \ \ "chrome://private\-ai\-internals/path\?query\#frag",\

      \ \ \ \ "chrome://regional\-capabilities\-internals",\

      \ \ \ \ "chrome://regional\-capabilities\-internals/path\?query\#frag",\

      \ \ \ \ "chrome://segmentation\-internals",\

      '
    replace: "    \"chrome://chrome-finds-internals/path?query#frag\",\n    \"chrome://connectors-internals\",\n    \"chrome://connectors-internals/path?query#frag\",\n#if !BUILDFLAG(IS_ANDROID)\n    \"chrome://private-ai-internals\",\n    \"chrome://private-ai-internals/path?query#frag\",\n#endif\n    \"chrome://regional-capabilities-internals\",\n    \"chrome://regional-capabilities-internals/path?query#frag\",\n    \"chrome://segmentation-internals\",\n"
