# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/dev_ui/android/dev_ui_loader_throttle.cc'
  regex:
    re_pattern: '\#include\ <string>\

      \

      \#include\ "base/functional/bind\.h"\

      \#include\ "chrome/android/modules/dev_ui/provider/dev_ui_module_provider\.h"\

      \#include\ "chrome/browser/dev_ui/android/dev_ui_loader_error_page\.h"\

      \#include\ "chrome/common/webui_url_constants\.h"\

      \#include\ "components/commerce/core/commerce_constants\.h"\

      \#include\ "components/history_clusters/history_clusters_internals/webui/url_constants\.h"\

      \#include\ "components/optimization_guide/optimization_guide_internals/webui/url_constants\.h"\

      \#include\ "components/private_ai/private_ai_internals/webui/url_constants\.h"\

      \#include\ "components/webui/regional_capabilities_internals/constants\.h"\

      \#include\ "content/public/browser/browser_thread\.h"\

      \#include\ "content/public/browser/navigation_handle\.h"\

      '
    replace: '#include <string>


      #include "base/functional/bind.h"

      #include "build/build_config.h"

      #include "chrome/android/modules/dev_ui/provider/dev_ui_module_provider.h"

      #include "chrome/browser/dev_ui/android/dev_ui_loader_error_page.h"

      #include "chrome/common/webui_url_constants.h"

      #include "components/commerce/core/commerce_constants.h"

      #include "components/history_clusters/history_clusters_internals/webui/url_constants.h"

      #include "components/optimization_guide/optimization_guide_internals/webui/url_constants.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/private_ai/private_ai_internals/webui/url_constants.h"

      #endif

      #include "components/webui/regional_capabilities_internals/constants.h"

      #include "content/public/browser/browser_thread.h"

      #include "content/public/browser/navigation_handle.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/dev_ui/android/dev_ui_loader_throttle.cc'
  regex:
    re_pattern: '\ \ //\ Each\ WebUI\ host\ \(including\ synonyms\)\ in\ the\ DevUI\ DFM\ must\ have\ an\ entry\.\

      \ \ //\ Assume\ linear\ search\ is\ fast\ enough\.\ Can\ optimize\ later\ if\ needed\.\

      \ \ return\ host\ ==\ chrome::kChromeUIAccessibilityHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIActorInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIAutofillInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIBluetoothInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIChromeFindsInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIComponentsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIConnectorsInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIDeviceLogHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIContextHubHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIDownloadInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIFamilyLinkUserInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ chrome::kChromeUIGCMInternalsHost\ \|\|\

      '
    replace: "  // Each WebUI host (including synonyms) in the DevUI DFM must have an entry.\n  // Assume linear search is fast enough. Can optimize later if needed.\n  return host == chrome::kChromeUIAccessibilityHost ||\n#if !BUILDFLAG(IS_ANDROID)\n         host == chrome::kChromeUIActorInternalsHost ||\n#endif\n         host == chrome::kChromeUIAutofillInternalsHost ||\n         host == chrome::kChromeUIBluetoothInternalsHost ||\n         host == chrome::kChromeUIChromeFindsInternalsHost ||\n         host == chrome::kChromeUIComponentsHost ||\n         host == chrome::kChromeUIConnectorsInternalsHost ||\n         host == chrome::kChromeUIDeviceLogHost ||\n#if !BUILDFLAG(IS_ANDROID)\n         host == chrome::kChromeUIContextHubHost ||\n#endif\n         host == chrome::kChromeUIDownloadInternalsHost ||\n         host == chrome::kChromeUIFamilyLinkUserInternalsHost ||\n         host == chrome::kChromeUIGCMInternalsHost ||\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/dev_ui/android/dev_ui_loader_throttle.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ kChromeUIHistoryClustersInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ optimization_guide_internals::\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ kChromeUIOptimizationGuideInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\ private_ai_internals::kChromeUIPrivateAiInternalsHost\ \|\|\

      \ \ \ \ \ \ \ \ \ host\ ==\

      \ \ \ \ \ \ \ \ \ \ \ \ \ regional_capabilities::kChromeUIRegionalCapabilitiesInternalsHost;\

      \}\

      '
    replace: "                     kChromeUIHistoryClustersInternalsHost ||\n         host == optimization_guide_internals::\n                     kChromeUIOptimizationGuideInternalsHost ||\n#if !BUILDFLAG(IS_ANDROID)\n         host == private_ai_internals::kChromeUIPrivateAiInternalsHost ||\n#endif\n         host ==\n             regional_capabilities::kChromeUIRegionalCapabilitiesInternalsHost;\n}\n"

- description: "Android Finds compile-out: Remove Android Finds dependency or source"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ host\\ ==\\ chrome::kChromeUIChromeFindsInternalsHost\\ \\|\\|\\\n"
    replace: ""
  count: 1
