# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/dev_ui/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/strings:ui_strings_grit",\

      \ \ \ \ \ \ "//url",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ source_set\("unit_tests"\)\ \{\

      '
    replace: "      \"//ui/strings:ui_strings_grit\",\n      \"//url\",\n    ]\n    if (is_android) {\n      deps -=\n          [ \"//components/private_ai/private_ai_internals/webui:url_constants\" ]\n    }\n  }\n\n  source_set(\"unit_tests\") {\n"
