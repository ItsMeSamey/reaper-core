# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/critical_actions/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "glic_linkout_handler\.cc",\

      \ \ \ \ "glic_linkout_handler\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\ "//chrome/browser/profiles:profile"\ \]\

      \

      '
    replace: "    \"glic_linkout_handler.cc\",\n    \"glic_linkout_handler.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"glic_linkout_handler.cc\",\n      \"glic_linkout_handler.h\",\n    ]\n  }\n\n  public_deps = [ \"//chrome/browser/profiles:profile\" ]\n\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/critical_actions/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//net",\

      \ \ \ \ "//url",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      '
    replace: "    \"//net\",\n    \"//url\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/glic\" ]\n  }\n}\n\nsource_set(\"unit_tests\") {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/critical_actions/BUILD.gn'
  regex:
    re_pattern: '\

      \ \ if\ \(!is_android\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "glic_linkout_handler_unittest\.cc"\ \]\

      \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ "//chrome/browser/glic/test_support",\

      \ \ \ \ \ \ "//components/tabs:test_support",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      '
    replace: "\n  if (!is_android) {\n    sources += [ \"glic_linkout_handler_unittest.cc\" ]\n    if (is_android) {\n      sources -= [ \"glic_linkout_handler_unittest.cc\" ]\n    }\n    deps += [\n      \"//chrome/browser/glic/test_support\",\n      \"//components/tabs:test_support\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/glic/test_support\" ]\n    }\n  }\n}\n"
