      ,\n      \"//components/tabs:test_support\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/glic/test_support\"\
      \ ]\n    }\n  }\n}\n"
    replace: "if (!is_android) {\n  source_set(\"critical_actions\") {\n    sources = [\n      \"chat_linkout_handler.h\"\
