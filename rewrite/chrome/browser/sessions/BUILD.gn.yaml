substitutions:
  - description: Add the deps the Brave sessions overrides need.
    add_literal_to_list:
      target: impl
      list_name: deps
      literal: brave_chromium_src_chrome_browser_sessions_deps
      conditional: enable_session_service
      import: //brave/chromium_src/chrome/browser/sessions/sources.gni

