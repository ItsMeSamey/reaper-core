# Preserve stable native Android lazy tab identity and API behavior.
substitutions:
  - description: "Preserve native lazy-tab session identity and API behavior (literal 1)"
    regex:
      re_pattern: "\\#include\\ \"components/sessions/content/session_tab_helper\\.h\"\\\n\\\n\\#include\\ \"chrome/browser/buildflags\\.h\"\\\n\\#include\\ \"chrome/common/buildflags\\.h\"\\\n\\#include\\ \"extensions/buildflags/buildflags\\.h\"\\\n\\\n"
      replace: "#include \"components/sessions/content/session_tab_helper.h\"\n\n#include \"chrome/browser/buildflags.h\"\n#include \"build/build_config.h\"\n\n#if BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/android/tab_android.h\"\n#include \"components/tabs/public/tab_handle_factory.h\"\n#endif\n#include \"chrome/common/buildflags.h\"\n#include \"extensions/buildflags/buildflags.h\"\n\n"
  - description: "Preserve native lazy-tab session identity and API behavior (literal 2)"
    regex:
      re_pattern: "\\#else\\\n\\ \\ sessions::SessionTabHelper::DelegateLookup\\ lookup;\\\n\\#endif\\\n\\ \\ sessions::SessionTabHelper::CreateForWebContents\\(contents,\\ std::move\\(lookup\\)\\);\\\n\\\n\\#if\\ BUILDFLAG\\(ENABLE_EXTENSIONS_CORE\\)\\\n\\ \\ auto\\*\\ observer\\ =\\\n"
      replace: "#else\n  sessions::SessionTabHelper::DelegateLookup lookup;\n#endif\n#if BUILDFLAG(IS_ANDROID)\n  std::optional<SessionID> initial_session_id;\n  if (auto* tab = TabAndroid::FromWebContents(contents)) {\n    auto id = tabs::SessionMappedTabHandleFactory::GetInstance()\n                  .GetSessionIdForHandle(tab->GetHandle().raw_value());\n    if (id) {\n      initial_session_id = SessionID::FromSerializedValue(*id);\n    }\n  }\n  sessions::SessionTabHelper::CreateForWebContents(\n      contents, std::move(lookup), initial_session_id);\n#else\n  sessions::SessionTabHelper::CreateForWebContents(contents, std::move(lookup));\n#endif\n\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  auto* observer =\n"
