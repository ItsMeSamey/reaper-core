      replace: "  // Fake replacing the current tab's WebContents with a new one by creating and\n  // selecting a new tab then closing the old one. Using the current tab as the\n  // parent will ensure group state, position, etc. should be kept.\n  auto get_restored_model = [&]() -> TabModel* {\n    if (!profile_weak || !restored_contents) {\n      return nullptr;\n    }\n    auto* model =\n        TabModelList::GetTabModelForWebContents(restored_contents.get());\n    auto* restored_tab = TabAndroid::FromWebContents(restored_contents.get());\n    if (!model || model->GetSessionId() != model_session_id ||\n        model->GetProfile() != profile_weak.get() || !restored_tab ||\n        !model->HasTab(restored_tab) ||\n        restored_tab->GetContainerId() != *container_id) {\n      return nullptr;\n    }\n    return model;\n  };\n  if (disposition == WindowOpenDisposition::CURRENT_TAB) {\n    // Creation calls into Java and can reject the replacement or notify\n    // reentrant observers. Keep the old tab until adoption is proven.\n    tab_model->CreateTab(current_tab, std::move(new_web_contents),\n                        TabModel::kInvalidIndex,\n                        TabModel::TabLaunchType::FROM_RECENT_TABS_FOREGROUND,\n                        /*should_pin=*/false);\n    auto* restored_model = get_restored_model();\n    if (!restored_model) {\n      return nullptr;\n    }\n    if (original_contents) {\n      auto* original_tab = TabAndroid::FromWebContents(original_contents.get());\n      if (original_tab && restored_model->HasTab(original_tab)) {\n        restored_model->CloseTab(original_tab->GetHandle());\n      }\n    }\n    return get_restored_model() ? restored_contents.get() : nullptr;\n  }\n  DCHECK(disposition == WindowOpenDisposition::NEW_FOREGROUND_TAB ||\n         disposition == WindowOpenDisposition::NEW_BACKGROUND_TAB);\n"
