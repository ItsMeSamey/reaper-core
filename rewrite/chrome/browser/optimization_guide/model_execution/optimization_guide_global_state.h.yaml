# Android retains hints, prediction, security and ordinary helpers while omitting optional model execution and quality upload.
substitutions:
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/model_execution/optimization_guide_global_state.h'
  regex:
    re_pattern: '\#include\ "base/memory/ref_counted\.h"\

      \#include\ "base/memory/scoped_refptr\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "chrome/browser/optimization_guide/prediction/chrome_profile_download_service_tracker\.h"\

      \#include\ "components/optimization_guide/core/delivery/optimization_guide_model_provider\.h"\

      \#include\ "components/optimization_guide/core/delivery/prediction_manager\.h"\

      \#include\ "components/optimization_guide/core/delivery/prediction_model_component_update_listener\.h"\

      \#include\ "components/optimization_guide/core/delivery/prediction_model_store\.h"\

      \#include\ "components/optimization_guide/core/model_execution/on_device_capability\.h"\

      \#include\ "components/optimization_guide/core/optimization_guide_enums\.h"\

      \#include\ "services/on_device_model/public/cpp/buildflags\.h"\

      \#include\ "services/on_device_model/public/mojom/on_device_model_service\.mojom\.h"\

      \

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \#include\ "components/optimization_guide/core/model_execution/android/model_broker_android\.h"\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      \

      namespace\ optimization_guide\ \{\

      \

      '
    replace: '#include "base/memory/ref_counted.h"

      #include "base/memory/scoped_refptr.h"

      #include "base/memory/weak_ptr.h"

      #include "build/build_config.h"

      #include "chrome/browser/optimization_guide/prediction/chrome_profile_download_service_tracker.h"

      #include "components/optimization_guide/core/delivery/optimization_guide_model_provider.h"

      #include "components/optimization_guide/core/delivery/prediction_manager.h"

      #include "components/optimization_guide/core/delivery/prediction_model_component_update_listener.h"

      #include "components/optimization_guide/core/delivery/prediction_model_store.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/model_execution/on_device_capability.h"

      #endif

      #include "components/optimization_guide/core/optimization_guide_enums.h"

      #include "services/on_device_model/public/cpp/buildflags.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "services/on_device_model/public/mojom/on_device_model_service.mojom.h"

      #endif


      namespace optimization_guide {


      '
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/model_execution/optimization_guide_global_state.h'
  regex:
    re_pattern: '\ \ //\ Retrieves\ or\ creates\ the\ instance\.\

      \ \ static\ scoped_refptr<OptimizationGuideGlobalState>\ CreateOrGet\(\);\

      \

      \ \ OnDeviceCapability\&\ on_device_capability\(\)\ \{\ return\ \*on_device_capability_;\ \}\

      \

      \ \ PredictionModelStore\&\ prediction_model_store\(\)\ \{\

      \ \ \ \ return\ prediction_manager_\.prediction_model_store\(\);\

      '
    replace: "  // Retrieves or creates the instance.\n  static scoped_refptr<OptimizationGuideGlobalState> CreateOrGet();\n\n#if !BUILDFLAG(IS_ANDROID)\n  OnDeviceCapability& on_device_capability() { return *on_device_capability_; }\n#endif\n\n  PredictionModelStore& prediction_model_store() {\n    return prediction_manager_.prediction_model_store();\n"
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/model_execution/optimization_guide_global_state.h'
  regex:
    re_pattern: '\

      \ \ \~OptimizationGuideGlobalState\(\);\

      \

      \#if\ BUILDFLAG\(USE_ON_DEVICE_MODEL_SERVICE\)\

      \ \ using\ LaunchServiceCallback\ =\ base::RepeatingCallback<void\(\

      \ \ \ \ \ \ mojo::PendingReceiver<on_device_model::mojom::OnDeviceModelService>\)>;\

      \

      '
    replace: "\n  ~OptimizationGuideGlobalState();\n\n#if !BUILDFLAG(IS_ANDROID) && BUILDFLAG(USE_ON_DEVICE_MODEL_SERVICE)\n  using LaunchServiceCallback = base::RepeatingCallback<void(\n      mojo::PendingReceiver<on_device_model::mojom::OnDeviceModelService>)>;\n\n"
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/model_execution/optimization_guide_global_state.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ prediction_manager_\.model_provider\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::BindRepeating\(\&RegisterPredictionModelComponent\)\);\

      \

      \ \ std::unique_ptr<OnDeviceCapability>\ on_device_capability_;\

      \

      \ \ base::WeakPtrFactory<OptimizationGuideGlobalState>\ weak_ptr_factory_\{this\};\

      \};\

      '
    replace: "              prediction_manager_.model_provider(),\n              base::BindRepeating(&RegisterPredictionModelComponent));\n\n#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<OnDeviceCapability> on_device_capability_;\n#endif\n\n  base::WeakPtrFactory<OptimizationGuideGlobalState> weak_ptr_factory_{this};\n};\n"
