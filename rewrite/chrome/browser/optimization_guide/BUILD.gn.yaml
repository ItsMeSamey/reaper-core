# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/optimization_guide/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "prediction/chrome_profile_download_service_tracker\.h",\

      \ \ \ \ "prediction/prediction_model_download_client\.h",\

      \ \ \]\

      \ \ public_deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//chrome/browser:main_extra_parts",\

      '
    replace: "    \"prediction/chrome_profile_download_service_tracker.h\",\n    \"prediction/prediction_model_download_client.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"chrome_model_quality_logs_uploader_service.h\",\n      \"model_validator_keyed_service.h\",\n      \"model_validator_keyed_service_factory.h\",\n    ]\n  }\n  public_deps = [\n    \"//base\",\n    \"//chrome/browser:main_extra_parts\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/optimization_guide/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/webui",\

      \ \ \]\

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ public_deps\ \+=\ \[\

      \ \ \ \ \ \ "//chrome/browser/bookmarks/android",\

      \ \ \ \ \ \ "//chrome/browser/optimization_guide/android:jni_headers",\

      '
    replace: "    \"//ui/webui\",\n  ]\n  if (is_android) {\n    public_deps -= [ \"//components/private_ai\" ]\n  }\n  if (is_android) {\n    public_deps += [\n      \"//chrome/browser/bookmarks/android\",\n      \"//chrome/browser/optimization_guide/android:jni_headers\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/optimization_guide/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "prediction/chrome_profile_download_service_tracker\.cc",\

      \ \ \ \ "prediction/prediction_model_download_client\.cc",\

      \ \ \]\

      \ \ public_deps\ =\ \[\ "//chrome/browser:browser_public_dependencies"\ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":optimization_guide",\

      '
    replace: "    \"prediction/chrome_profile_download_service_tracker.cc\",\n    \"prediction/prediction_model_download_client.cc\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"chrome_model_quality_logs_uploader_service.cc\",\n      \"model_validator_keyed_service.cc\",\n      \"model_validator_keyed_service_factory.cc\",\n    ]\n  }\n  public_deps = [ \"//chrome/browser:browser_public_dependencies\" ]\n  deps = [\n    \":optimization_guide\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/optimization_guide/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/webui",\

      \ \ \]\

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ "//base",\

      \ \ \ \ \ \ "//chrome/browser/commerce/price_tracking/android:price_tracking_notification_bridge",\

      '
    replace: "    \"//ui/webui\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/private_ai\",\n      \"//components/private_ai\",\n    ]\n  }\n  if (is_android) {\n    deps += [\n      \"//base\",\n      \"//chrome/browser/commerce/price_tracking/android:price_tracking_notification_bridge\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/optimization_guide/BUILD.gn'
  regex:
    re_pattern: '\ \ \}\

      \}\

      \

      source_set\("optimization_guide_on_device_model_installer"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "\.\./component_updater/optimization_guide_on_device_model_installer\.cc",\

      \ \ \ \ "\.\./component_updater/optimization_guide_on_device_model_installer\.h",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//build:branding_buildflags",\

      \ \ \ \ "//chrome/browser:browser_process",\

      \ \ \ \ "//components/component_updater",\

      \ \ \ \ "//components/crx_file",\

      \ \ \ \ "//components/optimization_guide/core",\

      \ \ \ \ "//components/update_client",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//crypto",\

      \ \ \]\

      \}\

      \

      source_set\("test_support"\)\ \{\

      '
    replace: "  }\n}\n\nif (!is_android) {\n  source_set(\"optimization_guide_on_device_model_installer\") {\n    sources = [\n      \"../component_updater/optimization_guide_on_device_model_installer.cc\",\n      \"../component_updater/optimization_guide_on_device_model_installer.h\",\n    ]\n\n    deps = [\n      \"//base\",\n      \"//build:branding_buildflags\",\n      \"//chrome/browser:browser_process\",\n      \"//components/component_updater\",\n      \"//components/crx_file\",\n      \"//components/optimization_guide/core\",\n      \"//components/update_client\",\n      \"//content/public/browser\",\n      \"//crypto\",\n    ]\n  }\n}\n\nsource_set(\"test_support\") {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/optimization_guide/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "model_execution/optimization_guide_global_state_unittest\.cc",\

      \ \ \ \ "prediction/chrome_profile_download_service_tracker_unittest\.cc",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":optimization_guide",\

      \ \ \ \ ":test_support",\

      '
    replace: "    \"model_execution/optimization_guide_global_state_unittest.cc\",\n    \"prediction/chrome_profile_download_service_tracker_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [ \"chrome_model_quality_logs_uploader_service_unittest.cc\" ]\n  }\n  deps = [\n    \":optimization_guide\",\n    \":test_support\",\n"

- description: 'Android optional source selection and ordinary test registration: chrome/browser/optimization_guide/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "prediction/chrome_profile_download_service_tracker_unittest\.cc",\

      \ \ \]\

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ sources\ \-=\ \[\ "chrome_model_quality_logs_uploader_service_unittest\.cc"\ \]\

      \ \ \}\

      \ \ deps\ =\ \[\

      \ \ \ \ ":optimization_guide",\

      '
    replace: "    \"prediction/chrome_profile_download_service_tracker_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"chrome_model_quality_logs_uploader_service_unittest.cc\",\n      \"model_execution/optimization_guide_global_state_unittest.cc\",\n    ]\n  }\n  deps = [\n    \":optimization_guide\",\n"
- description: Drop the broker IPC dependency whose Chrome model-execution methods are already nonAndroid
  regex:
    pattern: '    public_deps -= [ "//components/private_ai" ]'
    replace: "    public_deps -= [\n      \"//components/optimization_guide/public/mojom\",\n      \"//components/private_ai\"\
      ,\n    ]"
  count: 1
- description: Exclude only the Android price-notification native bridge dependency
  regex:
    pattern: '      "//chrome/browser/commerce/price_tracking/android:price_tracking_notification_bridge",

      '
    replace: ''
  count: 1
