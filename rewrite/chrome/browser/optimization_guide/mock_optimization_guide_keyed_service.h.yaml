# Android retains hints, prediction, security and ordinary helpers while omitting optional model execution and quality upload.
substitutions:
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/mock_optimization_guide_keyed_service.h'
  regex:
    re_pattern: '\

      \#include\ "base/test/gmock_callback_support\.h"\

      \#include\ "chrome/browser/optimization_guide/optimization_guide_keyed_service\.h"\

      \#include\ "components/optimization_guide/core/model_execution/feature_keys\.h"\

      \#include\ "components/optimization_guide/proto/model_quality_service\.pb\.h"\

      \#include\ "components/optimization_guide/public/mojom/model_broker\.mojom\-forward\.h"\

      \#include\ "testing/gmock/include/gmock/gmock\.h"\

      \

      //\ Mocks\ the\ opt\ guide\ service,\ to\ be\ used\ in\ unittests\.\

      '
    replace: '

      #include "base/test/gmock_callback_support.h"

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/model_execution/feature_keys.h"

      #include "components/optimization_guide/proto/model_quality_service.pb.h"

      #include "components/optimization_guide/public/mojom/model_broker.mojom-forward.h"

      #endif

      #include "testing/gmock/include/gmock/gmock.h"


      // Mocks the opt guide service, to be used in unittests.

      '
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/mock_optimization_guide_keyed_service.h'
  regex:
    re_pattern: '\

      \ \ void\ Shutdown\(\)\ override;\

      \

      \ \ MOCK_METHOD\(std::unique_ptr<optimization_guide::ModelBrokerClient>,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ CreateModelBrokerClient,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(override\)\);\

      \ \ MOCK_METHOD\(void,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ RegisterOptimizationTypes,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(const\ std::vector<optimization_guide::proto::OptimizationType>\&\),\

      '
    replace: "\n  void Shutdown() override;\n\n#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(std::unique_ptr<optimization_guide::ModelBrokerClient>,\n              CreateModelBrokerClient,\n              (),\n              (override));\n#endif\n  MOCK_METHOD(void,\n              RegisterOptimizationTypes,\n              (const std::vector<optimization_guide::proto::OptimizationType>&),\n"
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/mock_optimization_guide_keyed_service.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ std::optional<optimization_guide::proto::RequestContextMetadata>\

      \ \ \ \ \ \ \ \ \ \ \ request_context_metadata\),\

      \ \ \ \ \ \ \(override\)\);\

      \ \ MOCK_METHOD\(std::unique_ptr<optimization_guide::OnDeviceSession>,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ StartSession,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(optimization_guide::mojom::OnDeviceFeature\ feature,\

      '
    replace: "       std::optional<optimization_guide::proto::RequestContextMetadata>\n           request_context_metadata),\n      (override));\n#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(std::unique_ptr<optimization_guide::OnDeviceSession>,\n              StartSession,\n              (optimization_guide::mojom::OnDeviceFeature feature,\n"
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/mock_optimization_guide_keyed_service.h'
  regex:
    re_pattern: '\ \ MOCK_METHOD\(void,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ UploadModelQualityLogs,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(std::unique_ptr<optimization_guide::ModelQualityLogEntry>\)\);\

      \ \ MOCK_METHOD\(void,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ AddObserverForOptimizationTargetModel,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(optimization_guide::proto::OptimizationTarget,\

      '
    replace: "  MOCK_METHOD(void,\n              UploadModelQualityLogs,\n              (std::unique_ptr<optimization_guide::ModelQualityLogEntry>));\n#endif\n  MOCK_METHOD(void,\n              AddObserverForOptimizationTargetModel,\n              (optimization_guide::proto::OptimizationTarget,\n"
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/mock_optimization_guide_keyed_service.h'
  regex:
    re_pattern: '\

      \ \ MOCK_METHOD\(void,\ OnNavigationFinish,\ \(const\ std::vector<GURL>\&\),\ \(override\)\);\

      \

      \ \ MOCK_METHOD\(optimization_guide::OnDeviceModelEligibilityReason,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ GetOnDeviceModelEligibility,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(optimization_guide::mojom::OnDeviceFeature\),\

      '
    replace: "\n  MOCK_METHOD(void, OnNavigationFinish, (const std::vector<GURL>&), (override));\n\n#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(optimization_guide::OnDeviceModelEligibilityReason,\n              GetOnDeviceModelEligibility,\n              (optimization_guide::mojom::OnDeviceFeature),\n"
- description: 'Android optional model execution boundary: chrome/browser/optimization_guide/mock_optimization_guide_keyed_service.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::OnceCallback<\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ void\(optimization_guide::OnDeviceModelEligibilityReason\)>\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(override\)\);\

      \};\

      \

      \#endif\ \ //\ CHROME_BROWSER_OPTIMIZATION_GUIDE_MOCK_OPTIMIZATION_GUIDE_KEYED_SERVICE_H_\

      '
    replace: "               base::OnceCallback<\n                   void(optimization_guide::OnDeviceModelEligibilityReason)>),\n              (override));\n#endif\n};\n\n#endif  // CHROME_BROWSER_OPTIMIZATION_GUIDE_MOCK_OPTIMIZATION_GUIDE_KEYED_SERVICE_H_\n"
