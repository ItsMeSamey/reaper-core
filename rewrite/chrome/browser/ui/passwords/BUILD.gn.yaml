# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/passwords/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//components/desktop_to_mobile_promos",\

      \ \ \ \ \ \ "//components/password_manager/core/browser/features:password_features",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ if\ \(is_win\ \|\|\ is_mac\ \|\|\ is_linux\ \|\|\ is_chromeos\)\ \{\

      '
    replace: "      \"//components/desktop_to_mobile_promos\",\n      \"//components/password_manager/core/browser/features:password_features\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/actor\" ]\n    }\n  }\n\n  if (is_win || is_mac || is_linux || is_chromeos) {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/passwords/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//components/sync:test_support",\

      \ \ \ \ \ \ "//content/test:test_support",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      \

      '
    replace: "      \"//components/sync:test_support\",\n      \"//content/test:test_support\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor\",\n        \"//chrome/browser/actor:test_support\",\n      ]\n    }\n  }\n}\n\n"
