      '
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/ui/views/autofill/popup/popup_search_bar_view_unittest.cc'
  regex:
    re_pattern: '//\ Verifies\ that\ when\ `debounce_delay`\ is\ zero,\ text\ input\ changes\ notify\ the\

      //\ delegate\ on\ the\ current\ tick\ without\ advancing\ mock\ time\.\

      TEST_F\(PopupSearchBarViewTest,\ OnInputChangedIsCalledImmediatelyWithZeroDelay\)\ \{\

      \ \ auto\ view\ =\ std::make_unique<PopupSearchBarView>\(\

      \ \ \ \ \ \ u"placeholder",\ /\*initial_value=\*/u"",\ delegate\(\),\

      \ \ \ \ \ \ /\*show_search_icon_sparkle=\*/false,\ /\*debounce_delay=\*/base::TimeDelta\(\)\);\

      \

      \ \ EXPECT_CALL\(delegate\(\),\ SearchBarOnInputChanged\(Eq\(u"input\ text"\)\)\);\

      \ \ view\->SetInputTextForTesting\(u"input\ text"\);\

      '
    replace: "// Verifies that when `debounce_delay` is zero, text input changes notify the\n// delegate on the current tick without advancing mock time.\nTEST_F(PopupSearchBarViewTest, OnInputChangedIsCalledImmediatelyWithZeroDelay) {\n#if BUILDFLAG(IS_ANDROID)\n  auto view = std::make_unique<PopupSearchBarView>(\n      u\"placeholder\", /*initial_value=*/u\"\", delegate(),\n      /*debounce_delay=*/base::TimeDelta());\n#else\n  auto view = std::make_unique<PopupSearchBarView>(\n      u\"placeholder\", /*initial_value=*/u\"\", delegate(),\n      /*show_search_icon_sparkle=*/false, /*debounce_delay=*/base::TimeDelta());\n#endif\n\n  EXPECT_CALL(delegate(), SearchBarOnInputChanged(Eq(u\"input text\")));\n  view->SetInputTextForTesting(u\"input text\");\n"
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/ui/views/autofill/popup/popup_search_bar_view_unittest.cc'
  regex:
    re_pattern: '\}\

      \

      TEST_F\(PopupSearchBarViewTest,\ InitialText\)\ \{\

      \ \ PopupSearchBarView\*\ view\ =\

      \ \ \ \ \ \ widget\(\)\.SetContentsView\(std::make_unique<PopupSearchBarView>\(\

      \ \ \ \ \ \ \ \ \ \ u"placeholder",\ u"initial\ query",\ delegate\(\),\

      \ \ \ \ \ \ \ \ \ \ /\*show_search_icon_sparkle=\*/false,\

      \ \ \ \ \ \ \ \ \ \ /\*debounce_delay=\*/PopupSearchBarView::kInputChangeCallbackDelay\)\);\

      \ \ widget\(\)\.Show\(\);\

      \

      \ \ EXPECT_EQ\(view\->GetText\(\),\ u"initial\ query"\);\

      '
    replace: "}\n\nTEST_F(PopupSearchBarViewTest, InitialText) {\n#if BUILDFLAG(IS_ANDROID)\n  PopupSearchBarView* view =\n      widget().SetContentsView(std::make_unique<PopupSearchBarView>(\n          u\"placeholder\", u\"initial query\", delegate(),\n          /*debounce_delay=*/PopupSearchBarView::kInputChangeCallbackDelay));\n#else\n  PopupSearchBarView* view =\n      widget().SetContentsView(std::make_unique<PopupSearchBarView>(\n          u\"placeholder\", u\"initial query\", delegate(),\n          /*show_search_icon_sparkle=*/false,\n          /*debounce_delay=*/PopupSearchBarView::kInputChangeCallbackDelay));\n#endif\n  widget().Show();\n\n  EXPECT_EQ(view->GetText(), u\"initial query\");\n"
