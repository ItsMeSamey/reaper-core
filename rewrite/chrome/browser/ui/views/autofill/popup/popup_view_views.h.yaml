# Android omits optional implementation and retains ordinary contracts.
substitutions:
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/ui/views/autofill/popup/popup_view_views.h'
  regex:
    re_pattern: '\#include\ "base/memory/raw_ptr\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "base/timer/timer\.h"\

      \#include\ "chrome/browser/ui/autofill/autofill_popup_view\.h"\

      \#include\ "chrome/browser/ui/views/autofill/popup/password_favicon_loader\.h"\

      \#include\ "chrome/browser/ui/views/autofill/popup/popup_base_view\.h"\

      '
    replace: '#include "base/memory/raw_ptr.h"

      #include "base/memory/weak_ptr.h"

      #include "base/timer/timer.h"

      #include "build/build_config.h"

      #include "chrome/browser/ui/autofill/autofill_popup_view.h"

      #include "chrome/browser/ui/views/autofill/popup/password_favicon_loader.h"

      #include "chrome/browser/ui/views/autofill/popup/popup_base_view.h"

      '
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/ui/views/autofill/popup/popup_view_views.h'
  regex:
    re_pattern: '\ \ static\ constexpr\ int\ kAutofillPopupMaxWidth\ =\ 456;\

      \

      \ \ //\ The\ maximum\ width\ of\ an\ Autofill\ AI\ sub\-popup\.\

      \ \ static\ constexpr\ int\ kAutofillAiSubPopupMaxWidth\ =\ 320;\

      \

      \ \ //\ The\ width\ of\ the\ AtMemory\ popup\.\

      \ \ static\ constexpr\ int\ kAtMemoryPopupWidth\ =\ 320;\

      \

      \ \ //\ The\ maximum\ number\ of\ entries\ shown\ before\ making\ the\ popup\ scrollable\.\ A\

      \ \ //\ decimal\ number\ means\ the\ last\ element\ will\ appear\ "cut\-off"\ to\ indicate\

      '
    replace: "  static constexpr int kAutofillPopupMaxWidth = 456;\n\n  // The maximum width of an Autofill AI sub-popup.\n#if !BUILDFLAG(IS_ANDROID)\n  static constexpr int kAutofillAiSubPopupMaxWidth = 320;\n#endif\n\n  // The width of the AtMemory popup.\n#if !BUILDFLAG(IS_ANDROID)\n  static constexpr int kAtMemoryPopupWidth = 320;\n#endif\n\n  // The maximum number of entries shown before making the popup scrollable. A\n  // decimal number means the last element will appear \"cut-off\" to indicate\n"
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/ui/views/autofill/popup/popup_view_views.h'
  regex:
    re_pattern: '\

      \ \ //\ Reacts\ to\ key\ events\ under\ the\ assumption\ that\ the\ currently\ shown\ popup\

      \ \ //\ contains\ Compose\ content\.\

      \ \ bool\ HandleKeyPressEventForCompose\(\

      \ \ \ \ \ \ const\ input::NativeWebKeyboardEvent\&\ event\);\

      \

      '
    replace: "\n  // Reacts to key events under the assumption that the currently shown popup\n  // contains Compose content.\n#if !BUILDFLAG(IS_ANDROID)\n  bool HandleKeyPressEventForCompose(\n      const input::NativeWebKeyboardEvent& event);\n\n"
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/ui/views/autofill/popup/popup_view_views.h'
  regex:
    re_pattern: '\ \ //\ contains\ AtMemory\ content\.\

      \ \ bool\ HandleKeyPressEventForAtMemory\(\

      \ \ \ \ \ \ const\ input::NativeWebKeyboardEvent\&\ event\);\

      \

      \ \ //\ Handles\ horizontal\ navigation\ \(Left/Right\ arrows\)\ for\ the\ popup,\ which\

      \ \ //\ may\ result\ in\ opening\ or\ closing\ sub\-popups\.\

      '
    replace: "  // contains AtMemory content.\n  bool HandleKeyPressEventForAtMemory(\n      const input::NativeWebKeyboardEvent& event);\n#endif\n\n  // Handles horizontal navigation (Left/Right arrows) for the popup, which\n  // may result in opening or closing sub-popups.\n"
