# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android optional popup/private implementation and dependency exclusion: chrome/browser/ui/views/autofill/popup/BUILD.gn'
  regex:
    re_pattern: '\ \ if\ \(use_ozone\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//ui/ozone"\ \]\

      \ \ \}\

      \}\

      \

      source_set\("popup_view_views"\)\ \{\

      '
    replace: "  if (use_ozone) {\n    deps += [ \"//ui/ozone\" ]\n  }\n\n  if (is_android) {\n    deps -= [ \":popup_at_memory_ai_disclosure_view\" ]\n  }\n}\n\nsource_set(\"popup_view_views\") {\n"
- description: 'Android optional popup/private implementation and dependency exclusion: chrome/browser/ui/views/autofill/popup/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/gfx/geometry",\

      \ \ \ \ "//ui/views",\

      \ \ \]\

      \}\

      \

      source_set\("popup"\)\ \{\

      '
    replace: "    \"//ui/gfx/geometry\",\n    \"//ui/views\",\n  ]\n\n  if (is_android) {\n    deps -= [\n      \":popup_at_memory_ai_disclosure_view\",\n      \"//components/optimization_guide/core:model_execution\",\n    ]\n  }\n}\n\nsource_set(\"popup\") {\n"
- description: 'Android optional popup/private implementation and dependency exclusion: chrome/browser/ui/views/autofill/popup/BUILD.gn'
  regex:
    re_pattern: '\ \ \]\

      \}\

      \

      source_set\("popup_at_memory_ai_disclosure_view"\)\ \{\

      \ \ public\ =\ \[\ "popup_at_memory_ai_disclosure_view\.h"\ \]\

      \ \ sources\ =\ \[\ "popup_at_memory_ai_disclosure_view\.cc"\ \]\

      \ \ public_deps\ =\ \[\

      \ \ \ \ ":popup",\

      \ \ \ \ ":popup_interactive_row_view",\

      \ \ \ \ "//base",\

      \ \ \ \ "//ui/base/metadata",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ "//chrome/browser/profiles:profile",\

      \ \ \ \ "//chrome/browser/ui:chrome_pages",\

      \ \ \ \ "//chrome/browser/ui/autofill",\

      \ \ \ \ "//chrome/common",\

      \ \ \ \ "//components/strings:components_strings",\

      \ \ \ \ "//components/user_education/views",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//ui/accessibility:ax_enums_mojo",\

      \ \ \ \ "//ui/base",\

      \ \ \ \ "//ui/color",\

      \ \ \ \ "//ui/views",\

      \ \ \]\

      \}\

      \

      source_set\("browser_tests"\)\ \{\

      '
    replace: "  ]\n}\n\nif (!is_android) {\n  source_set(\"popup_at_memory_ai_disclosure_view\") {\n    public = [ \"popup_at_memory_ai_disclosure_view.h\" ]\n    sources = [ \"popup_at_memory_ai_disclosure_view.cc\" ]\n    public_deps = [\n      \":popup\",\n      \":popup_interactive_row_view\",\n      \"//base\",\n      \"//ui/base/metadata\",\n    ]\n    deps = [\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/ui:chrome_pages\",\n      \"//chrome/browser/ui/autofill\",\n      \"//chrome/common\",\n      \"//components/strings:components_strings\",\n      \"//components/user_education/views\",\n      \"//content/public/browser\",\n      \"//ui/accessibility:ax_enums_mojo\",\n      \"//ui/base\",\n      \"//ui/color\",\n      \"//ui/views\",\n    ]\n  }\n}\n\nsource_set(\"browser_tests\") {\n"
