# Android omits optional implementation and retains ordinary contracts.
substitutions:
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/ui/views/autofill/popup/popup_search_bar_view.h'
  regex:
    re_pattern: '\#include\ "base/functional/callback\.h"\

      \#include\ "base/memory/raw_ref\.h"\

      \#include\ "base/timer/timer\.h"\

      \#include\ "chrome/browser/ui/autofill/autofill_popup_view\.h"\

      \#include\ "ui/base/interaction/element_identifier\.h"\

      \#include\ "ui/gfx/geometry/point\.h"\

      '
    replace: '#include "base/functional/callback.h"

      #include "base/memory/raw_ref.h"

      #include "base/timer/timer.h"

      #include "build/build_config.h"

      #include "chrome/browser/ui/autofill/autofill_popup_view.h"

      #include "ui/base/interaction/element_identifier.h"

      #include "ui/gfx/geometry/point.h"

      '
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/ui/views/autofill/popup/popup_search_bar_view.h'
  regex:
    re_pattern: '\ \ \ \ \ \ const\ std::u16string\&\ placeholder,\

      \ \ \ \ \ \ const\ std::u16string\&\ initial_value,\

      \ \ \ \ \ \ Delegate\&\ delegate,\

      \ \ \ \ \ \ bool\ show_search_icon_sparkle\ =\ false,\

      \ \ \ \ \ \ base::TimeDelta\ debounce_delay\ =\ kInputChangeCallbackDelay\);\

      \ \ PopupSearchBarView\(const\ PopupSearchBarView\&\)\ =\ delete;\

      \ \ PopupSearchBarView\&\ operator=\(const\ PopupSearchBarView\&\)\ =\ delete;\

      '
    replace: "      const std::u16string& placeholder,\n      const std::u16string& initial_value,\n      Delegate& delegate,\n#if !BUILDFLAG(IS_ANDROID)\n      bool show_search_icon_sparkle = false,\n#endif\n      base::TimeDelta debounce_delay = kInputChangeCallbackDelay);\n  PopupSearchBarView(const PopupSearchBarView&) = delete;\n  PopupSearchBarView& operator=(const PopupSearchBarView&) = delete;\n"
