substitutions:
  - description: |-
      Create the password favicon loader through a Brave factory.

      Upstream's loader fetches favicons through the system network context or
      the original profile, outside an off-the-record profile's network
      context, and in a Tor window outside Tor. `CreatePasswordFaviconLoader`,
      defined in chromium_src, gives off-the-record profiles a loader that
      never fetches.
    regex:
      pattern: 'std::make_unique<PasswordFaviconLoaderImpl>('
      replace: 'CreatePasswordFaviconLoader(profile,'

