substitutions:
  - description: "Require the normal Android native-test task before accessing its native window pointer."
    count: 1
    regex:
      pattern: "        return chromeAndroidTask.getOrCreateNativeBrowserWindowPtr(profile);\n"
      replace: "        assert chromeAndroidTask != null;\n        return chromeAndroidTask.getOrCreateNativeBrowserWindowPtr(profile);\n"
