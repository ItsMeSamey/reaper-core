substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '\ \ \ \ /\*\*\ Returns\ the\ initial\ show\ state\ of\ the\ window\.\ \*/\

      \ \ \ \ @WindowShowState\.EnumType\

      \ \ \ \ int\ getInitialShowState\(\);\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Transfers\ the\ WebContents\ to\ the\ caller\ for\ creating\ a\ new\ window,\ if\ any\.\ After\ this\
      method\

      \ \ \ \ \ \*\ returns,\ the\ WebContents\ held\ by\ this\ class\ will\ be\ set\ to\ null\.\

      \ \ \ \ \ \*/\

      '
    replace: "    /** Returns the initial show state of the window. */\n    @WindowShowState.EnumType\n    int getInitialShowState();\n\
      \n    /** Returns the trusted initial fullscreen extension origin, or an empty string. */\n    default String getFullscreenExtensionUrl()\
      \ {\n        return \"\";\n    }\n\n    /** Returns the approved extension display name copied at native admission,\
      \ or empty. */\n    default String getFullscreenExtensionName() {\n        return \"\";\n    }\n\n    /**\n     * Transfers\
      \ the WebContents to the caller for creating a new window, if any. After this method\n     * returns, the WebContents\
      \ held by this class will be set to null.\n     */\n"
