        \ desktopWindowStateManager,\n                @Nullable BrowserFullscreenDelegate browserFullscreenDelegate) {\n   \
        \         mBrowserFullscreenDelegate = browserFullscreenDelegate;\n            mActivityWindowAndroid = activityWindowAndroid;\n\
        \            mTabModelSelector = tabModelSelector;\n            mBrowserWindowType = browserWindowType;\n          \
        \  assert supportedProfileType != SupportedProfileType.UNSET;\n"
