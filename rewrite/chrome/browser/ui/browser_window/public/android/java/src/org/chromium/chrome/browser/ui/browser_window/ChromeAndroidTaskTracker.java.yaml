      '
    replace: '// found in the LICENSE file.


      package org.chromium.chrome.browser.ui.browser_window;


      import android.app.Activity;

      import android.content.Intent;


      import org.chromium.base.IntentUtils;

      import org.chromium.build.annotations.NullMarked;

      import org.chromium.build.annotations.Nullable;

      import org.chromium.chrome.browser.ui.browser_window.ChromeAndroidTask.ActivityScopedObjects;

      import org.chromium.ui.base.ActivityWindowAndroid;

      '
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
  regex:
    re_pattern: '\ \ \ \ \ \*\ \ \ \ \ pass\ that\ Extra\ value\ as\ the\ pending\ ID\ so\ that\ the\ \{@code\ Activity\}\
      can\ be\ associated\

      \ \ \ \ \ \*\ \ \ \ \ with\ the\ pending\ \{@link\ ChromeAndroidTask\}\.\ In\ other\ cases,\ the\ pending\ ID\ should\
      be\

      \ \ \ \ \ \*\ \ \ \ \ \{@code\ null\}\.\

      \ \ \ \ \ \*/\

      \ \ \ \ ChromeAndroidTask\ obtainTask\(\

      \ \ \ \ \ \ \ \ \ \ \ \ @BrowserWindowType\ int\ browserWindowType,\

      \ \ \ \ \ \ \ \ \ \ \ \ ActivityScopedObjects\ activityScopedObjects,\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ Integer\ pendingId\);\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Returns\ the\ \{@link\ ChromeAndroidTask\}\ with\ the\ given\ \{@code\ taskId\}\.\

      \ \ \ \ \ \*\

      '
    replace: "     *     pass that Extra value as the pending ID so that the {@code Activity} can be associated\n     *  \
      \   with the pending {@link ChromeAndroidTask}. In other cases, the pending ID should be\n     *     {@code null}.\n\
      \     */\n    @Nullable\n    ChromeAndroidTask obtainTask(\n            @BrowserWindowType int browserWindowType,\n\
      \            ActivityScopedObjects activityScopedObjects,\n            @Nullable Integer pendingId);\n\n    /** Returns\
      \ only internally authenticated pending-window request IDs. */\n    static @Nullable Integer getPendingTaskIdFromIntent(Intent\
      \ intent) {\n        if (!IntentUtils.isTrustedIntentFromSelf(intent)\n                || !IntentUtils.safeHasExtra(intent,\
      \ EXTRA_PENDING_BROWSER_WINDOW_TASK_ID)) {\n            return null;\n        }\n        return IntentUtils.safeGetIntExtra(intent,\
      \ EXTRA_PENDING_BROWSER_WINDOW_TASK_ID, -1);\n    }\n\n    /** Checks an existing request without creating a Profile,\
      \ task or native window. */\n    boolean isPendingTaskAvailable(int pendingId);\n\n    /** Tracks the actual request\
      \ Activity before it may obtain a Profile or native window. */\n    boolean registerPendingTaskActivity(int pendingId,\
      \ Activity activity);\n\n    /** Releases only this request's Activity; configuration recreation keeps the request alive.\
      \ */\n    void unregisterPendingTaskActivity(int pendingId, Activity activity);\n\n    /** Owns cleanup only for contents\
      \ transferred to this existing pending request. */\n    boolean registerPendingTaskTransferCleanup(int pendingId, Runnable\
      \ cleanup);\n\n    /**\n     * Returns the {@link ChromeAndroidTask} with the given {@code taskId}.\n     *\n"
