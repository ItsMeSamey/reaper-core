substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '\#endif\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      \

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ //\ An\ optional\ WebContents\ to\ be\ used\ when\ creating\ the\ browser\ window\.\

      \ \ //\ Note:\ On\ Android,\ calls\ to\ CreateBrowserWindow\ will\ release\ this\

      \ \ //\ WebContent''s\ ownership\ to\ an\ AndroidBrowserWindowCreateParams\ object\.\

      \ \ std::unique_ptr<content::WebContents>\ web_contents;\

      '
    replace: "#endif\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if BUILDFLAG(IS_ANDROID)\n  // Trusted extension origin for the\
      \ existing fullscreen security notice.\n  // Generic browser window creators leave this empty.\n  std::string fullscreen_extension_url;\n\
      \n  // An optional WebContents to be used when creating the browser window.\n  // Note: On Android, calls to CreateBrowserWindow\
      \ will release this\n  // WebContent's ownership to an AndroidBrowserWindowCreateParams object.\n  std::unique_ptr<content::WebContents>\
      \ web_contents;\n"
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
  regex:
    re_pattern: 'void\ CreateBrowserWindow\(\

      \ \ \ \ BrowserWindowCreateParams\ create_params,\

      \ \ \ \ base::OnceCallback<void\(BrowserWindowInterface\*\)>\ callback\);\

      \

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      //\ WARNING:\ Use\ of\ this\ is\ DEPRECATED\ and\ exists\ only\ to\ support\ pre\-existing\

      //\ browser\ unittests\.\

      //\ TODO\(crbug\.com/417766643\):\ Remove\ this\ once\ all\ use\ of\ Browser\ in\ unittests\

      '
    replace: "void CreateBrowserWindow(\n    BrowserWindowCreateParams create_params,\n    base::OnceCallback<void(BrowserWindowInterface*)>\
      \ callback);\n\n#if BUILDFLAG(IS_ANDROID)\n// Changes browser fullscreen for an Android window. Entering respects the\n\
      // profile fullscreen policy; leaving also exits tab fullscreen through its\n// normal protocol. Pending windows queue\
      \ the request until their Activity\n// exists.\nvoid SetAndroidBrowserWindowFullscreen(BrowserWindowInterface& browser_window,\n\
      \                                       bool fullscreen,\n                                       const std::string&\
      \ extension_url);\n#endif\n\n#if !BUILDFLAG(IS_ANDROID)\n// WARNING: Use of this is DEPRECATED and exists only to support\
      \ pre-existing\n// browser unittests.\n// TODO(crbug.com/417766643): Remove this once all use of Browser in unittests\n"
