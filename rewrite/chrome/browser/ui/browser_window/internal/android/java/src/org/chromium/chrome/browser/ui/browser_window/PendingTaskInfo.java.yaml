substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '\ \ \ \ \ \*\ profiles\.\

      \ \ \ \ \ \*/\

      \ \ \ \ final\ @Nullable\ JniOnceCallback<Long>\ mTaskCreationCallbackForNative;\

      \

      \ \ \ \ PendingTaskInfo\(\

      \ \ \ \ \ \ \ \ \ \ \ \ int\ pendingTaskId,\

      \ \ \ \ \ \ \ \ \ \ \ \ AndroidBrowserWindowCreateParams\ createParams,\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ JniOnceCallback<Long>\ callback\)\ \{\

      '
    replace: "     * profiles.\n     */\n    final @Nullable JniOnceCallback<Long> mTaskCreationCallbackForNative;\n\n   \
      \ private boolean mOwnsTaskCreationCallback = true;\n\n    PendingTaskInfo(\n            int pendingTaskId,\n      \
      \      AndroidBrowserWindowCreateParams createParams,\n            @Nullable JniOnceCallback<Long> callback) {\n"
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mCreateParams\ =\ createParams;\

      \ \ \ \ \ \ \ \ mTaskCreationCallbackForNative\ =\ callback;\

      \ \ \ \ \}\

      \

      \ \ \ \ void\ destroy\(\)\ \{\

      \ \ \ \ \ \ \ \ mCreateParams\.destroyWebContents\(\);\

      \ \ \ \ \ \ \ \ if\ \(mTaskCreationCallbackForNative\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mTaskCreationCallbackForNative\.destroy\(\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \}\

      '
    replace: "        mCreateParams = createParams;\n        mTaskCreationCallbackForNative = callback;\n    }\n\n    @Nullable\n\
      \    JniOnceCallback<Long> takeTaskCreationCallbackForNative() {\n        if (!mOwnsTaskCreationCallback) return null;\n\
      \        mOwnsTaskCreationCallback = false;\n        return mTaskCreationCallbackForNative;\n    }\n\n    void destroy()\
      \ {\n        var callback = takeTaskCreationCallbackForNative();\n        mCreateParams.destroyWebContents();\n    \
      \    if (callback != null) callback.destroy();\n    }\n}\n"
