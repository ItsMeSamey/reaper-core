      \n    private @Nullable Boolean mFullscreenRequest;\n\n    void requestFullscreen(boolean fullscreen) {\n        ThreadUtils.assertOnUiThread();\n\
      \        mFullscreenRequest = fullscreen;\n    }\n\n    @Nullable\n    Boolean getFullscreenRequest() {\n        ThreadUtils.assertOnUiThread();\n\
      \        return mFullscreenRequest;\n    }\n\n    @Nullable\n    Boolean takeFullscreenRequest() {\n        ThreadUtils.assertOnUiThread();\n\
      \        Boolean fullscreen = mFullscreenRequest;\n        mFullscreenRequest = null;\n        return fullscreen;\n\
