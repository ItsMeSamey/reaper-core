      replace: "    @Test\n    public void getMostRecentlyActivatedTaskOtherThan_callerNotRegistered_returnsExistingTask() {\n        var previousDeps =\n                ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                        /* taskId= */ 1, /* isPendingTask= */ false, /* isDesktopMode= */ true);\n        var pendingTask =\n                assumeNonNull(\n                        mChromeAndroidTaskTracker.createPendingTask(\n                                ChromeAndroidTaskUnitTestSupport\n                                        .createMockAndroidBrowserWindowCreateParams(\n                                                BrowserWindowType.NORMAL),\n                                /* callback= */ null));\n        assertEquals(1, mChromeAndroidTaskTracker.countOfTasks());\n\n        assertEquals(\n                previousDeps.mChromeAndroidTask,\n                mChromeAndroidTaskTracker.getMostRecentlyActivatedTaskOtherThan(pendingTask));\n    }\n\n    @Test\n    public void getMostRecentlyActivatedTaskOtherThan_tiedTimestamps_excludesCaller() {\n        var previousDeps =\n                ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                        /* taskId= */ 1, /* isPendingTask= */ false, /* isDesktopMode= */ true);\n        var currentDeps =\n                ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                        /* taskId= */ 2, /* isPendingTask= */ false, /* isDesktopMode= */ true);\n        assertEquals(\n                previousDeps.mChromeAndroidTask.getLastActivatedTimeMillis(),\n                currentDeps.mChromeAndroidTask.getLastActivatedTimeMillis());\n\n        assertEquals(\n                previousDeps.mChromeAndroidTask,\n                mChromeAndroidTaskTracker.getMostRecentlyActivatedTaskOtherThan(\n                        currentDeps.mChromeAndroidTask));\n    }\n\n    @Test\n    public void getMostRecentlyActivatedTaskOtherThan_skipsMissingClosingAndDestroyedActivities() {\n        var healthy =\n                ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                        /* taskId= */ 1, /* isPendingTask= */ false, /* isDesktopMode= */ true);\n        var missing =\n                ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                        /* taskId= */ 2, /* isPendingTask= */ false, /* isDesktopMode= */ true);\n        var closing =\n                ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                        /* taskId= */ 3, /* isPendingTask= */ false, /* isDesktopMode= */ true);\n        var destroyed =\n                ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                        /* taskId= */ 4, /* isPendingTask= */ false, /* isDesktopMode= */ true);\n        var current =\n                ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                        /* taskId= */ 5, /* isPendingTask= */ false, /* isDesktopMode= */ true);\n        for (var deps : List.of(healthy, missing, closing, destroyed, current)) {\n            mFakeTime.advanceMillis(1L);\n            deps.mChromeAndroidTask.onTopResumedActivityChangedWithNative(true);\n        }\n        var missingWindow = missing.mActivityWindowAndroidMocks.mMockActivityWindowAndroid;\n        var retainedActivityReference = missingWindow.getActivity();\n        when(missingWindow.getActivity()).thenReturn(new WeakReference<>(null));\n        when(closing.mActivityWindowAndroidMocks.mMockActivity.isFinishing()).thenReturn(true);\n        when(destroyed.mActivityWindowAndroidMocks.mMockActivity.isDestroyed()).thenReturn(true);\n        try {\n            assertEquals(\n                    healthy.mChromeAndroidTask,\n                    mChromeAndroidTaskTracker.getMostRecentlyActivatedTaskOtherThan(\n                            current.mChromeAndroidTask));\n        } finally {\n            // Existing task cleanup still needs the fixture Activity reference.\n            when(missingWindow.getActivity()).thenReturn(retainedActivityReference);\n        }\n    }\n\n    @Test\n    public void showInactive_alreadyResumedCallbackBeforeInsertion_predictsFocusLoss() {\n        assertInactiveCreationRequest(PendingAction.SHOW_INACTIVE, /* queueBeforeCreate= */ false);\n    }\n\n    @Test\n    public void showInactive_queuedBeforeAlreadyResumedCreation_retainsPredictionAndCallback() {\n        assertInactiveCreationRequest(PendingAction.SHOW_INACTIVE, /* queueBeforeCreate= */ true);\n    }\n\n    @Test\n    public void deactivate_queuedBeforeAlreadyResumedCreation_retainsPredictionAndCallback() {\n        assertInactiveCreationRequest(PendingAction.DEACTIVATE, /* queueBeforeCreate= */ true);\n    }\n\n    private void assertInactiveCreationRequest(@PendingAction int action, boolean queueBeforeCreate) {\n        var previousDeps =\n                ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                        /* taskId= */ 1, /* isPendingTask= */ false, /* isDesktopMode= */ true);\n        var previousTask = previousDeps.mChromeAndroidTask;\n        var previousWindow = previousDeps.mActivityWindowAndroidMocks.mMockActivityWindowAndroid;\n        var previousActivity = previousDeps.mActivityWindowAndroidMocks.mMockActivity;\n        var previousActivityManager =\n                (ActivityManager) previousActivity.getSystemService(Context.ACTIVITY_SERVICE);\n        when(previousWindow.isTopResumedActivity()).thenReturn(false);\n\n        var profile = mock(Profile.class);\n        var currentMocks = ChromeAndroidTaskUnitTestSupport.createActivityWindowAndroidMocks(2);\n        ChromeAndroidTaskUnitTestSupport.mockDesktopWindowingMode(currentMocks);\n        AppHeaderUtils.setAppInDesktopWindowForTesting(false);\n        when(currentMocks.mMockActivity.isInMultiWindowMode()).thenReturn(false);\n        when(currentMocks.mMockActivityWindowAndroid.isTopResumedActivity()).thenReturn(true);\n        when(currentMocks.mMockActivityLifecycleDispatcher.getCurrentActivityState())\n                .thenReturn(ActivityLifecycleDispatcher.ActivityState.RESUMED_WITH_NATIVE);\n        var currentScopedObjects =\n                ChromeAndroidTaskUnitTestSupport.createMockActivityScopedObjects(\n                        currentMocks.mMockActivityWindowAndroid, profile);\n        assertFalse(\n                AppHeaderUtils.isAppInDesktopWindow(\n                        currentScopedObjects.mDesktopWindowStateManager));\n        JniOnceCallback<Long> callback = mock();\n        var pendingTask =\n                assumeNonNull(\n                        mChromeAndroidTaskTracker.createPendingTask(\n                                ChromeAndroidTaskUnitTestSupport\n                                        .createMockAndroidBrowserWindowCreateParams(\n                                                BrowserWindowType.NORMAL,\n                                                new Rect(),\n                                                WindowShowState.DEFAULT,\n                                                profile),\n                                callback));\n        int pendingId = assumeNonNull(pendingTask.getPendingTaskInfo()).mPendingTaskId;\n        if (queueBeforeCreate) {\n            if (action == PendingAction.SHOW_INACTIVE) {\n                pendingTask.showInactive();\n            } else {\n                pendingTask.deactivate();\n            }\n            assertFalse(pendingTask.isActive());\n        }\n        doAnswer(\n                        invocation -> {\n                            // Completion can precede insertion when the Activity is already resumed.\n                            assertEquals(Integer.valueOf(2), pendingTask.getId());\n                            assertNull(mChromeAndroidTaskTracker.get(2));\n                            assertEquals(1, mChromeAndroidTaskTracker.countOfTasks());\n                            if (!queueBeforeCreate) {\n                                assertEquals(ChromeAndroidTaskImpl.State.IDLE, pendingTask.getState());\n                                pendingTask.showInactive();\n                            }\n                            assertEquals(\n                                    ChromeAndroidTaskImpl.State.PENDING_UPDATE,\n                                    pendingTask.getState());\n                            assertEquals(\n                                    Boolean.FALSE,\n                                    pendingTask\n                                            .getPendingActionManagerForTesting()\n                                            .isActiveFuture(pendingTask.getState()));\n                            assertFalse(pendingTask.isActive());\n                            assertTrue(\n                                    currentMocks.mMockActivityWindowAndroid.isTopResumedActivity());\n                            assertEquals(\n                                    action,\n                                    pendingTask\n                                            .getPendingActionManagerForTesting()\n                                            .getPendingActionsForTesting()[1]);\n                            verify(previousActivityManager, times(1)).moveTaskToFront(eq(1), eq(0));\n                            return null;\n                        })\n                .when(callback)\n                .onResult(ChromeAndroidTaskUnitTestSupport.FAKE_NATIVE_ANDROID_BROWSER_WINDOW_PTR);\n\n        assertEquals(\n                pendingTask,\n                mChromeAndroidTaskTracker.obtainTask(\n                        BrowserWindowType.NORMAL, currentScopedObjects, pendingId));\n        assertEquals(pendingTask, mChromeAndroidTaskTracker.get(2));\n        assertEquals(2, mChromeAndroidTaskTracker.countOfTasks());\n        pendingTask.onTopResumedActivityChangedWithNative(true);\n        assertFalse(pendingTask.isActive());\n        verify(callback, times(1))\n                .onResult(ChromeAndroidTaskUnitTestSupport.FAKE_NATIVE_ANDROID_BROWSER_WINDOW_PTR);\n\n        when(previousWindow.isTopResumedActivity()).thenReturn(true);\n        previousTask.onTopResumedActivityChangedWithNative(true);\n        when(currentMocks.mMockActivityWindowAndroid.isTopResumedActivity()).thenReturn(false);\n        pendingTask.onTopResumedActivityChangedWithNative(false);\n        assertEquals(ChromeAndroidTaskImpl.State.IDLE, pendingTask.getState());\n        assertFalse(pendingTask.isActive());\n        assertTrue(previousTask.isActive());\n        assertNull(\n                pendingTask\n                        .getPendingActionManagerForTesting()\n                        .isActiveFuture(pendingTask.getState()));\n        verify(callback, times(1))\n                .onResult(ChromeAndroidTaskUnitTestSupport.FAKE_NATIVE_ANDROID_BROWSER_WINDOW_PTR);\n    }\n\n    @Test\n    public void getNativeBrowserWindowPtrsOrderedByActivation_withPendingTask_doesNotCrash() {"

