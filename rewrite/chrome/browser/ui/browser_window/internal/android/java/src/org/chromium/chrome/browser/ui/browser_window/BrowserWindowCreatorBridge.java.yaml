substitutions:
- description: Prevent duplicate pending Android authentication popups (1).
  regex:
    re_pattern: 'import\ androidx\.annotation\.VisibleForTesting;\

      \

      import\ org\.jni_zero\.CalledByNative;\

      \

      import\ org\.chromium\.base\.JniOnceCallback;\

      import\ org\.chromium\.base\.Log;\

      '
    replace: 'import androidx.annotation.VisibleForTesting;


      import org.jni_zero.CalledByNative;

      import org.jni_zero.CalledByNativeForTesting;


      import org.chromium.base.JniOnceCallback;

      import org.chromium.base.Log;

      '
- description: Prevent duplicate pending Android authentication popups (2).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ ChromeAndroidTaskTrackerImpl\.getInstance\(\)\.createPendingTask\(createParams,\ callback\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Checks\ whether\ the\ given\ \{@link\ AndroidBrowserWindowCreateParams\}\ can\ be\ used\ to\ create\ a\

      \ \ \ \ \ \*\ window\ on\ Android\.\

      '
    replace: "        ChromeAndroidTaskTrackerImpl.getInstance().createPendingTask(createParams, callback);\n    }\n\n    @CalledByNativeForTesting\n    private static void pauseActivityCreationForTesting() {\n        ChromeAndroidTaskTrackerImpl.getInstance().pausePendingTaskActivityCreationForTesting();\n    }\n\n    @CalledByNativeForTesting\n    private static int[] getHeldPendingTaskIdsForTesting() {\n        return ChromeAndroidTaskTrackerImpl.getInstance().getHeldPendingTaskIdsForTesting();\n    }\n\n    @CalledByNativeForTesting\n    private static void resumePendingTaskActivityCreationForTesting(int pendingTaskId) {\n        ChromeAndroidTaskTrackerImpl.getInstance()\n                .resumePendingTaskActivityCreationForTesting(pendingTaskId);\n    }\n\n    @CalledByNativeForTesting\n    private static void clearActivityCreationPauseForTesting() {\n        ChromeAndroidTaskTrackerImpl.getInstance().clearActivityCreationPauseForTesting();\n    }\n\n    /**\n     * Checks whether the given {@link AndroidBrowserWindowCreateParams} can be used to create a\n     * window on Android.\n"

- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: 'package\ org\.chromium\.chrome\.browser\.ui\.browser_window;\

      \

      import\ androidx\.annotation\.VisibleForTesting;\

      \

      import\ org\.jni_zero\.CalledByNative;\

      import\ org\.jni_zero\.CalledByNativeForTesting;\

      \

      import\ org\.chromium\.base\.JniOnceCallback;\

      import\ org\.chromium\.base\.Log;\

      import\ org\.chromium\.build\.annotations\.NullMarked;\

      import\ org\.chromium\.chrome\.browser\.incognito\.IncognitoUtils;\

      import\ org\.chromium\.ui\.mojom\.WindowShowState;\

      \

      import\ java\.util\.Locale;\

      \

      /\*\*\ Java\ class\ that\ will\ be\ used\ by\ the\ native\ \{@code\ \#CreateBrowserWindow\(\)\}\ function\.\ \*/\

      '
    replace: 'package org.chromium.chrome.browser.ui.browser_window;


      import androidx.annotation.VisibleForTesting;


      import org.chromium.base.JniOnceCallback;

      import org.chromium.base.Log;

      import org.chromium.build.annotations.NullMarked;

      import org.chromium.chrome.browser.incognito.IncognitoUtils;

      import org.chromium.ui.mojom.WindowShowState;

      import org.jni_zero.CalledByNative;

      import org.jni_zero.CalledByNativeForTesting;


      import java.util.Locale;


      /** Java class that will be used by the native {@code #CreateBrowserWindow()} function. */

      '
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
  regex:
    re_pattern: '\ \ \ \ \ \*\ <p>This\ method\ should\ be\ the\ only\ place\ to\ verify\ \{@link\ AndroidBrowserWindowCreateParams\}\.\

      \ \ \ \ \ \*\ Other\ code\ can\ assume\ \{@link\ AndroidBrowserWindowCreateParams\}\ is\ valid\.\

      \ \ \ \ \ \*/\

      \ \ \ \ private\ static\ boolean\ canCreateBrowserWindow\(AndroidBrowserWindowCreateParams\ createParams\)\ \{\

      \ \ \ \ \ \ \ \ @BrowserWindowType\ int\ browserWindowType\ =\ createParams\.getWindowType\(\);\

      \ \ \ \ \ \ \ \ if\ \(browserWindowType\ !=\ BrowserWindowType\.NORMAL\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ browserWindowType\ !=\ BrowserWindowType\.POPUP\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ Log\.e\(TAG,\ String\.format\(Locale\.US,\ "Unsupported\ window\ type:\ %d",\ browserWindowType\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @WindowShowState\.EnumType\ int\ initialShowState\ =\ createParams\.getInitialShowState\(\);\

      \ \ \ \ \ \ \ \ if\ \(initialShowState\ ==\ WindowShowState\.FULLSCREEN\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ Log\.e\(TAG,\ String\.format\(Locale\.US,\ "Unsupported\ show\ state:\ %d",\ initialShowState\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ var\ profile\ =\ createParams\.getProfile\(\);\

      '
    replace: "     * <p>This method should be the only place to verify {@link AndroidBrowserWindowCreateParams}.\n     * Other\
      \ code can assume {@link AndroidBrowserWindowCreateParams} is valid.\n     */\n    private static boolean canCreateBrowserWindow(AndroidBrowserWindowCreateParams\
      \ createParams) {\n        if (createParams.getProfile().shutdownStarted()) return false;\n\n        @BrowserWindowType\
      \ int browserWindowType = createParams.getWindowType();\n        if (browserWindowType != BrowserWindowType.NORMAL\n\
      \                && browserWindowType != BrowserWindowType.POPUP) {\n            Log.e(TAG, String.format(Locale.US,\
      \ \"Unsupported window type: %d\", browserWindowType));\n            return false;\n        }\n\n        var profile\
      \ = createParams.getProfile();\n"
