  - description: "Exercise two live phone tasks, deferred focus loss and duplicate suppression"
    regex:
      re_pattern: "\\ \\ \\ \\ @Test\\\n\\ \\ \\ \\ public\\ void\\ deactivate_notInDesktopWindowingMode_shouldDoNothing\\(\\)\\ \\{\\\n"
      replace: "    @Test\n    public void deactivate_phoneWithTwoLiveTasks_predictsAndSettlesFocusLoss() {\n        var previousDeps = createChromeAndroidTaskWithMockDeps(/* taskId= */ 1);\n        var currentDeps = createChromeAndroidTaskWithMockDeps(/* taskId= */ 2);\n        var previousTask = previousDeps.mChromeAndroidTask;\n        var currentTask = currentDeps.mChromeAndroidTask;\n        var previousWindow = previousDeps.mActivityWindowAndroidMocks.mMockActivityWindowAndroid;\n        var currentWindow = currentDeps.mActivityWindowAndroidMocks.mMockActivityWindowAndroid;\n        var previousActivity = previousDeps.mActivityWindowAndroidMocks.mMockActivity;\n        var currentActivity = currentDeps.mActivityWindowAndroidMocks.mMockActivity;\n        var previousActivityManager =\n                (ActivityManager) previousActivity.getSystemService(Context.ACTIVITY_SERVICE);\n        var currentActivityManager =\n                (ActivityManager) currentActivity.getSystemService(Context.ACTIVITY_SERVICE);\n\n        // Retain the stock metrics fixture while making the focus gate non-desktop.\n        AppHeaderUtils.setAppInDesktopWindowForTesting(false);\n        when(previousActivity.isInMultiWindowMode()).thenReturn(false);\n        when(currentActivity.isInMultiWindowMode()).thenReturn(false);\n        assertFalse(\n                AppHeaderUtils.isAppInDesktopWindow(\n                        currentDeps.mActivityScopedObjects.mDesktopWindowStateManager));\n        assertNotNull(previousWindow.getActivity().get());\n        assertNotNull(currentWindow.getActivity().get());\n        assertEquals(2, ChromeAndroidTaskTrackerImpl.getInstance().countOfTasks());\n\n        when(previousWindow.isTopResumedActivity()).thenReturn(true);\n        previousTask.onTopResumedActivityChangedWithNative(true);\n        mFakeTimeTestRule.advanceMillis(1L);\n        when(previousWindow.isTopResumedActivity()).thenReturn(false);\n        previousTask.onTopResumedActivityChangedWithNative(false);\n        when(currentWindow.isTopResumedActivity()).thenReturn(true);\n        currentTask.onTopResumedActivityChangedWithNative(true);\n        assertTrue(\n                currentTask.getLastActivatedTimeMillis() > previousTask.getLastActivatedTimeMillis());\n        assertEquals(State.IDLE, currentTask.getState());\n        assertTrue(currentTask.isActive());\n        assertFalse(previousTask.isActive());\n        assertTrue(currentTask.isVisible());\n\n        currentTask.deactivate();\n\n        assertEquals(State.PENDING_UPDATE, currentTask.getState());\n        assertEquals(\n                Boolean.FALSE,\n                currentTask\n                        .getPendingActionManagerForTesting()\n                        .isActiveFuture(currentTask.getState()));\n        assertFalse(currentTask.isActive());\n        assertTrue(\"Actual focus waits for the OS callback\", currentWindow.isTopResumedActivity());\n        assertTrue(currentTask.isVisible());\n        verify(previousActivityManager, times(1)).moveTaskToFront(eq(1), eq(0));\n        verify(currentActivityManager, never()).moveTaskToFront(anyInt(), anyInt());\n\n        currentTask.deactivate();\n        verify(previousActivityManager, times(1)).moveTaskToFront(eq(1), eq(0));\n\n        when(previousWindow.isTopResumedActivity()).thenReturn(true);\n        previousTask.onTopResumedActivityChangedWithNative(true);\n        when(currentWindow.isTopResumedActivity()).thenReturn(false);\n        currentTask.onTopResumedActivityChangedWithNative(false);\n\n        assertEquals(State.IDLE, currentTask.getState());\n        assertNoPendingActions(currentTask);\n        assertNull(\n                currentTask\n                        .getPendingActionManagerForTesting()\n                        .isActiveFuture(currentTask.getState()));\n        assertFalse(currentTask.isActive());\n        assertTrue(previousTask.isActive());\n        assertEquals(State.IDLE, previousTask.getState());\n        assertTrue(currentTask.isVisible());\n        // Stock fixture ResettersForTesting removes both tasks and restores the header override.\n    }\n\n    @Test\n    public void deactivate_notInDesktopWindowingMode_shouldDoNothing() {\n"
