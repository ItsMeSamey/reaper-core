    replace: "    /** Returns the last activated live task other than the caller, if one is available. */\n    @Nullable ChromeAndroidTask getMostRecentlyActivatedTaskOtherThan(ChromeAndroidTask caller) {\n        ThreadUtils.assertOnUiThread();\n        @Nullable ChromeAndroidTask mostRecentTask = null;\n        for (var task : getAllTasks()) {\n            if (task == caller || task.isDestroyed()) continue;\n            var windowAndroid = task.getTopActivityWindowAndroid();\n            if (windowAndroid == null) continue;\n            var activity = windowAndroid.getActivity().get();\n            if (activity == null || activity.isFinishing() || activity.isDestroyed()) continue;\n\n            if (mostRecentTask == null\n                    || task.getLastActivatedTimeMillis()\n                            > mostRecentTask.getLastActivatedTimeMillis()) {\n                mostRecentTask = task;\n            }\n        }\n        return mostRecentTask;\n    }\n\n"

