substitutions:
  - description: Add the deps the Brave browser window overrides need.
    add_literal_to_list:
      target: internal
      list_name: deps
      literal: brave_browser_window_internal_deps
      import: //brave/browser/ui/browser_window/internal/sources.gni

  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/browser_window/internal/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//components/saved_tab_groups/public",\

        \ \ \ \ \ \ "//components/search",\

        \ \ \ \ \]\

        \

        \ \ \ \ if\ \(is_win\ \|\|\ is_mac\)\ \{\

        \ \ \ \ \ \ deps\ \+=\ \[\

        '
      replace: "      \"//components/saved_tab_groups/public\",\n      \"//components/search\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor/ui\",\n        \"//chrome/browser/actor/ui/task_list_bubble:controller\",\n        \"//chrome/browser/autocomplete:aim_eligibility_service\",\n        \"//chrome/browser/contextual_tasks:ui\",\n        \"//chrome/browser/glic\",\n        \"//chrome/browser/glic/browser_ui\",\n        \"//chrome/browser/skills:public\",\n        \"//chrome/browser/ui/views/contextual_tasks\",\n      ]\n    }\n\n    if (is_win || is_mac) {\n      deps += [\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/browser_window/internal/BUILD.gn'
    regex:
      re_pattern: '\

        \ \ \ \ if\ \(is_win\ \|\|\ is_mac\ \|\|\ is_linux\ \|\|\ is_chromeos\ \|\|\ is_desktop_android\)\ \{\

        \ \ \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/ui/ai_overlay_dialog"\ \]\

        \ \ \ \ \}\

        \

        \ \ \ \ if\ \(is_chromeos\)\ \{\

        '
      replace: "\n    if (is_win || is_mac || is_linux || is_chromeos || is_desktop_android) {\n      deps += [ \"//chrome/browser/ui/ai_overlay_dialog\" ]\n      if (is_android) {\n        deps -= [ \"//chrome/browser/ui/ai_overlay_dialog\" ]\n      }\n    }\n\n    if (is_chromeos) {\n"

  - description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
    regex:
      re_pattern: '\ \ \ \ \ \ "//chrome/browser/profiles:profile_util",\

        \ \ \ \ \ \ "//chrome/browser/ui/android",\

        \ \ \ \ \ \ "//chrome/browser/ui/blocked_content",\

        \ \ \ \ \ \ "//chrome/browser/ui/navigator",\

        \ \ \ \ \ \ "//components/blocked_content",\

        \ \ \ \ \ \ "//ui/android",\

        \ \ \ \ \]\

        \ \ \}\ else\ \{\

        \ \ \ \ sources\ \+=\ \[\

        \ \ \ \ \ \ "browser_window_features\.cc",\

        '
      replace: "      \"//chrome/browser/profiles:profile_util\",\n      \"//chrome/browser/ui/android\",\n      \"//chrome/browser/ui/blocked_content\"\
        ,\n      \"//chrome/browser/ui/navigator\",\n      \"//chrome/browser/ui:url_identity\",\n      \"//chrome/common:constants\"\
        ,\n      \"//components/blocked_content\",\n      \"//components/prefs\",\n      \"//ui/android\",\n      \"//url\"\
        ,\n    ]\n  } else {\n    sources += [\n      \"browser_window_features.cc\",\n"
  - description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
    regex:
      re_pattern: '\ \ \ \ \ \ "//chrome/browser/ui/browser_window/test:android_browser_test_support",\

        \ \ \ \ \ \ "//chrome/browser/ui/navigator",\

        \ \ \ \ \ \ "//chrome/test:test_support_jni_headers",\

        \ \ \ \ \ \ "//chrome/test:test_support_ui_android",\

        \ \ \ \ \ \ "//components/feed:feature_list",\

        \ \ \ \ \ \ "//net:test_support",\

        \ \ \ \ \ \ "//testing/gtest",\

        \ \ \ \ \ \ "//ui/android",\

        \ \ \ \ \]\

        \ \ \}\

        \}\

        '
      replace: "      \"//chrome/browser/ui/browser_window/test:android_browser_test_support\",\n      \"//chrome/browser/ui/navigator\"\
        ,\n      \"//chrome/test:test_support_jni_headers\",\n      \"//chrome/test:test_support_ui_android\",\n      \"//chrome/common:constants\"\
        ,\n      \"//components/feed:feature_list\",\n      \"//components/prefs\",\n      \"//extensions/buildflags\",\n  \
        \    \"//net:test_support\",\n      \"//testing/gtest\",\n      \"//ui/android\",\n    ]\n    if (enable_extensions_core)\
        \ {\n      deps += [\n        \"//chrome/browser/extensions\",\n        \"//extensions:test_support\",\n      ]\n  \
        \  }\n  }\n}\n"

  - description: "Declare the existing phone context-rule owner in the Android junit target"
    regex:
      pattern: "      \"//chrome/browser/ui/browser_window/test:junit_test_support\",\n      \"//chrome/browser/util:java\",\n"
      replace: "      \"//chrome/browser/ui/browser_window/test:junit_test_support\",\n      \"//chrome/browser/util:java\",\n      \"//chrome/test/android:chrome_java_test_support_common\",\n"
    count: 1
