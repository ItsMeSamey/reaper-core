# Android split pane request ownership and dialog placement.
substitutions:
- description: Preserve the originating contents when dispatching the Android tab dialog
  regex:
    re_pattern: \ \ ui::ModalDialogWrapper::ShowTabModal\(std::move\(dialog_model\),\ window\);
    replace: "  ui::ModalDialogWrapper::ShowTabModal(\n      std::move(dialog_model), window, web_contents->GetJavaWebContents());"
- description: Format modified Android split dialog code
  regex:
    re_pattern: '\#elif\ BUILDFLAG\(IS_ANDROID\)\

      void\ ShowTabModal\(std::unique_ptr<ui::DialogModel>\ dialog_model,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ content::WebContents\*\ web_contents\)\ \{\

      \ \ ui::WindowAndroid\*\ window\ =\ web_contents\->GetTopLevelNativeWindow\(\);\

      \ \ ui::ModalDialogWrapper::ShowTabModal\(\

      \ \ \ \ \ \ std::move\(dialog_model\),\ window,\ web_contents\->GetJavaWebContents\(\)\);\

      \}\

      \#endif\

      \

      \}\ \ //\ namespace\ chrome\

      '
    replace: "#elif BUILDFLAG(IS_ANDROID)\nvoid ShowTabModal(std::unique_ptr<ui::DialogModel> dialog_model,\n                  content::WebContents* web_contents) {\n  ui::WindowAndroid* window = web_contents->GetTopLevelNativeWindow();\n  ui::ModalDialogWrapper::ShowTabModal(std::move(dialog_model), window,\n                                       web_contents->GetJavaWebContents());\n}\n#endif\n\n}  // namespace chrome\n"
