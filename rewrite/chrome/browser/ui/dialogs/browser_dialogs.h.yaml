substitutions:
- description: "Keep ComposeClient type header available on desktop only."
  count: 1
  regex:
    pattern: "#include \"components/compose/core/browser/compose_client.h\"\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/compose/core/browser/compose_client.h\"\n#endif\n"
- description: "Keep the existing Compose dialog controller declaration desktop only."
  count: 1
  regex:
    pattern: "#if BUILDFLAG(ENABLE_COMPOSE)\nnamespace compose {\n"
    replace: "#if BUILDFLAG(ENABLE_COMPOSE) && !BUILDFLAG(IS_ANDROID)\nnamespace compose {\n"
- description: "Keep the existing Compose dialog API declaration desktop only."
  count: 1
  regex:
    pattern: "#if BUILDFLAG(ENABLE_COMPOSE)\nstd::unique_ptr<compose::ComposeDialogController> ShowComposeDialog(\n"
    replace: "#if BUILDFLAG(ENABLE_COMPOSE) && !BUILDFLAG(IS_ANDROID)\nstd::unique_ptr<compose::ComposeDialogController> ShowComposeDialog(\n"
