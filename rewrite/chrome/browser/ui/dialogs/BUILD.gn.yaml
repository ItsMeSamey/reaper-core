substitutions:
- description: "Android browser dialogs must not admit the Compose implementation library."
  count: 1
  regex:
    pattern: "  if (is_android) {\n    deps += [ \"//ui/android\" ]\n  }\n"
    replace: "  if (is_android) {\n    deps += [ \"//ui/android\" ]\n    deps -= [ \"//components/compose/core/browser\" ]\n  }\n"
