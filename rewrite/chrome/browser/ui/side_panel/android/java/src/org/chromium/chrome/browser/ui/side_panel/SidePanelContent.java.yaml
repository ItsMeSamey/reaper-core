# Android extension side panel presentation and profile ownership.
substitutions:
  - description: Mark extension content explicitly for Android presentation.
    regex:
      pattern: "    public final boolean mShowHeader;"
      replace: |2-
            public final boolean mShowHeader;

            /** Whether the native entry is an extension side panel. */
            public final boolean mIsExtension;
  - description: Keep callers compatible while carrying native extension identity.
    regex:
      pattern: "    public SidePanelContent(View view, @Nullable String title, boolean showHeader) {\n        mView = view;\n        mTitle = title;\n        mShowHeader = showHeader;\n    }"
      replace: |2-
            public SidePanelContent(View view, @Nullable String title, boolean showHeader) {
                this(view, title, showHeader, /* isExtension= */ false);
            }

            public SidePanelContent(
                    View view, @Nullable String title, boolean showHeader, boolean isExtension) {
                mView = view;
                mTitle = title;
                mShowHeader = showHeader;
                mIsExtension = isExtension;
            }
