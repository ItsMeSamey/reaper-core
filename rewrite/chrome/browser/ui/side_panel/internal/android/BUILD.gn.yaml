# Android extension side panel presentation and profile ownership.
substitutions:
  - description: Compile the small Android extension overlay presenter.
    regex:
      pattern: "    \"java/src/org/chromium/chrome/browser/ui/side_panel/SidePanelContainerCoordinatorFactory.java\","
      replace: |2-
            "//brave/android/java/org/chromium/chrome/browser/ui/side_panel/ExtensionSidePanelOverlay.java",
            "java/src/org/chromium/chrome/browser/ui/side_panel/SidePanelContainerCoordinatorFactory.java",
  - description: Use the existing extension manager factory for profile registration.
    regex:
      pattern: "    \"//chrome/browser/ui/browser_window/public/android:factory_java\","
      replace: |2-
            "//chrome/browser/ui/android/extensions/side_panel:factory_java",
            "//chrome/browser/ui/android/extensions/side_panel:java",
            "//chrome/browser/ui/browser_window/public/android:factory_java",
  - description: Build overlay dismissal regression tests beside the existing container tests.
    regex:
      pattern: "  sources = [ \"java/src/org/chromium/chrome/browser/ui/side_panel/SidePanelContainerCoordinatorImplUnitTest.java\" ]"
      replace: |2-
          sources = [
            "//brave/android/junit/src/org/chromium/chrome/browser/ui/side_panel/ExtensionSidePanelOverlayUnitTest.java",
            "java/src/org/chromium/chrome/browser/ui/side_panel/SidePanelContainerCoordinatorImplUnitTest.java",
          ]
  - description: Provide the dialog and mock dependencies for overlay lifecycle tests.
    regex:
      pattern: "    \"//chrome/browser/ui/side_ui/public:java\",\n    \"//third_party/junit\",\n  ]\n}\n\nandroid_library(\"javatests\")"
      replace: |2-
            "//chrome/browser/ui/side_ui/public:java",
            "//third_party/junit",
            "//third_party/mockito:mockito_java",
            "//ui/android:ui_java",
            "//ui/android:ui_no_recycler_view_java",
          ]
        }

        android_library("javatests")
  - description: "Add direct genuine task/view fixture dependencies to the existing Android JUnit owner."
    regex:
      pattern: "    \"//base:base_junit_test_support\",\n    \"//chrome/browser/ui/side_panel/android:java\","
      replace: "    \"//base:base_junit_test_support\",\n    \"//chrome/browser/browser_controls/android:java\",\n    \"//chrome/browser/profiles/android:java\",\n    \"//chrome/browser/tabmodel:java\",\n    \"//chrome/browser/ui/android/extensions/side_panel:java\",\n    \"//chrome/browser/ui/browser_window/public/android:factory_java\",\n    \"//chrome/browser/ui/browser_window/public/android:java\",\n    \"//chrome/browser/ui/browser_window/test:junit_test_support\",\n    \"//chrome/browser/ui/side_panel/android:java\","
  - description: "Compile the real ThinWebView callback and WebContents interface fixture."
    regex:
      pattern: "    \"//chrome/browser/ui/side_ui/public:java\",\n    \"//third_party/junit\","
      replace: "    \"//chrome/browser/ui/side_ui/public:java\",\n    \"//components/thin_webview:java\",\n    \"//content/public/android:content_java\",\n    \"//third_party/junit\","
  - description: "Declare supplier and desktop-window fixtures directly on the side-panel JUnit owner."
    regex:
      re_pattern: "(robolectric_library\\(\"junit\"\\) \\{[\\s\\S]*?\\n  deps = \\[[\\s\\S]*?\\n    \"//base:base_junit_test_support\",\\n)([\\s\\S]*?)(    \"//components/thin_webview:java\",)"
      replace: "\\1    \"//base:supplier_java\",\n\\2    \"//components/browser_ui/desktop_windowing/android:java\",\n\\3"
