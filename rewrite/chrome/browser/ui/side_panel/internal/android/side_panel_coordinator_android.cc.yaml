# Android extension side panel presentation and profile ownership.
substitutions:
  - description: Pass native entry identity for layout eligibility.
    regex:
      pattern: "      AttachCurrentThread(), java_coordinator(), browser()->GetProfile());\n  if (has_insufficient_space_)"
      replace: |2-
              AttachCurrentThread(), java_coordinator(), browser()->GetProfile(),
              entry->key().id() == SidePanelEntryId::kExtension);
          if (has_insufficient_space_)
  - description: Pass native entry identity when opening.
    regex:
      pattern: "      title, entry->should_show_header(), suppress_animations);"
      replace: |2-
              title, entry->should_show_header(),
              entry->key().id() == SidePanelEntryId::kExtension, suppress_animations);
  - description: Pass native entry identity when replacing.
    regex:
      pattern: "      title, new_entry->should_show_header());"
      replace: |2-
              title, new_entry->should_show_header(),
              new_entry->key().id() == SidePanelEntryId::kExtension);
  - description: 'Complete deferred side-panel close ordering regression: 1'
    regex:
      pattern: "  state_ = SidePanelState::kClosing;\n  SidePanelEntry* entry = GetEntryForCurrentKeyNonNull();"
      replace: "  // A deferred first-frame replacement still owns pending_hide_reason_.\n  // Complete it before assigning the closing entry's reason or clearing cached\n  // views; otherwise the old entry consumes the new reason and the closing\n  // entry never receives its hidden notifications.\n  if (pending_replaced_entry_) {\n    Java_SidePanelCoordinatorAndroidBridge_completePendingContentReplacement(\n        AttachCurrentThread(), java_coordinator(), browser()->GetProfile());\n  }\n\n  state_ = SidePanelState::kClosing;\n  SidePanelEntry* entry = GetEntryForCurrentKeyNonNull();"
