# Chromium Android side-panel close ordering and deterministic regression.
substitutions:
  - description: 'Complete deferred side-panel close ordering regression: 1'
    regex:
      pattern: '#include "base/memory/raw_ptr.h"'
      replace: '#include "base/functional/callback_helpers.h"

        #include "base/memory/raw_ptr.h"'
  - description: 'Complete deferred side-panel close ordering regression: 2'
    regex:
      pattern: "\nIN_PROC_BROWSER_TEST_F(SidePanelCoordinatorAndroidBrowserTest,\n                       RapidTabSwitch_AutoOpenSidePanel) {"
      replace: "\nIN_PROC_BROWSER_TEST_F(\n    SidePanelCoordinatorAndroidBrowserTest,\n    CloseBeforeReplacementFramePreservesBothEntriesHiddenNotifications) {\n  const SidePanelEntryKey old_key(SidePanelEntryId::kBookmarks);\n  const SidePanelEntryKey new_key(SidePanelEntryId::kAboutThisSite);\n  auto old_entry = CreateSidePanelEntry(old_key, browser_);\n  auto new_entry = CreateSidePanelEntry(new_key, browser_,\n                                       /*use_thin_web_view=*/true);\n  TestSidePanelEntryObserver old_observer(old_entry.get());\n  TestSidePanelEntryObserver new_observer(new_entry.get());\n  SidePanelRegistry::From(browser_)->Register(std::move(old_entry));\n  SidePanelRegistry::From(browser_)->Register(std::move(new_entry));\n\n  coordinator_->SidePanelUIBase::Show(old_key,\n                                     SidePanelOpenTrigger::kToolbarButton,\n                                     /*suppress_animations=*/true);\n  WaitUntilOpened(coordinator_);\n  coordinator_->ConfigDeferredViewReplacementForTesting(true);\n  Java_SidePanelCoordinatorAndroidBrowserTestSupport_holdFrameCallbacks(\n      AttachCurrentThread());\n  base::ScopedClosureRunner release_frames(base::BindOnce([]() {\n    Java_SidePanelCoordinatorAndroidBrowserTestSupport_releaseFrameCallbacks(\n        AttachCurrentThread());\n  }));\n\n  coordinator_->SidePanelUIBase::Show(new_key,\n                                     SidePanelOpenTrigger::kToolbarButton,\n                                     /*suppress_animations=*/true);\n  ASSERT_TRUE(coordinator_->HasPendingReplacedEntryForTesting());\n  EXPECT_EQ(0, old_observer.num_on_entry_hidden_received_);\n  EXPECT_EQ(0, new_observer.num_on_entry_hidden_received_);\n\n  // A user can close a just-replaced panel before its first compositor frame.\n  coordinator_->Close(SidePanelEntryHideReason::kSidePanelClosed,\n                       /*suppress_animations=*/true);\n  WaitUntilClosed(coordinator_);\n  EXPECT_FALSE(coordinator_->HasPendingReplacedEntryForTesting());\n  EXPECT_EQ(1, old_observer.num_on_entry_hidden_received_);\n  EXPECT_EQ(1, old_observer.num_on_entry_hidden_with_reason_received_);\n  EXPECT_EQ(SidePanelEntryHideReason::kReplaced,\n            old_observer.reason_for_last_entry_hidden_with_reason_);\n  EXPECT_EQ(1, new_observer.num_on_entry_hidden_received_);\n  EXPECT_EQ(1, new_observer.num_on_entry_hidden_with_reason_received_);\n  EXPECT_EQ(SidePanelEntryHideReason::kSidePanelClosed,\n            new_observer.reason_for_last_entry_hidden_with_reason_);\n\n  // The compositor callback is not cancellable: running it late must be inert.\n  EXPECT_EQ(1,\n            Java_SidePanelCoordinatorAndroidBrowserTestSupport_releaseFrameCallbacks(\n                AttachCurrentThread()));\n  release_frames.ReplaceClosure(base::NullCallback());\n  EXPECT_EQ(1, old_observer.num_on_entry_hidden_received_);\n  EXPECT_EQ(1, new_observer.num_on_entry_hidden_received_);\n  coordinator_->ConfigDeferredViewReplacementForTesting(false);\n}\n\nIN_PROC_BROWSER_TEST_F(SidePanelCoordinatorAndroidBrowserTest,\n                       RapidTabSwitch_AutoOpenSidePanel) {"
