      replace: "                    () -> {\n                        if (!mDestroyed) {\n                            containerView.performAccessibilityAction(\n                                    AccessibilityNodeInfo.ACTION_ACCESSIBILITY_FOCUS, null);\n                        }\n                    });"
  - description: "Clear the captured request before native callbacks can queue a successor."
    regex:
