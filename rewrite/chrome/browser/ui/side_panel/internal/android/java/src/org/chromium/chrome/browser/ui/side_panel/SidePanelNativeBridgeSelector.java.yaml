# Android extension side panel presentation and profile ownership.
substitutions:
  - description: Use the compiled extension manager factory for every profile.
    regex:
      pattern: "import org.chromium.chrome.browser.ui.browser_window.ChromeAndroidTaskTrackerFactory;"
      replace: |2-
        import org.chromium.chrome.browser.ui.browser_window.ChromeAndroidTaskTrackerFactory;
        import org.chromium.chrome.browser.ui.extensions.side_panel.ExtensionSidePanelManagerBridge;
        import org.chromium.chrome.browser.ui.extensions.side_panel.ExtensionSidePanelManagerBridgeFactory;
  - description: Keep fallback eligibility tied to the selected profile and entry kind.
    regex:
      pattern: "    boolean canShow(Profile profile) {\n        return profile.equals(mTabModelSelector.getCurrentModel().getProfile())\n                && mSidePanelContainerCoordinator.canShow();\n    }"
      replace: |2-
            boolean canShow(Profile profile, boolean isExtension) {
                return profile.equals(mTabModelSelector.getCurrentModel().getProfile())
                        && mSidePanelContainerCoordinator.canShow(isExtension);
            }
  - description: Own extension registration with the profile window and tab model.
    regex:
      pattern: "        mNativeBridges.put(\n                profile, new NativeBridges(coordinatorBridge, windowScopedRegistryBridge));"
      replace: |2-
                mNativeBridges.put(
                        profile, new NativeBridges(coordinatorBridge, windowScopedRegistryBridge));
                mChromeAndroidTask.addFeature(
                        new ChromeAndroidTaskFeatureKey(
                                ExtensionSidePanelManagerBridge.class,
                                profile,
                                mWindowAndroid,
                                mTabModelSelector.getModel(isIncognito)),
                        ExtensionSidePanelManagerBridgeFactory::create);
