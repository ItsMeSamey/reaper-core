# Android extension side panel presentation and profile ownership.
substitutions:
  - description: Scope fallback eligibility to extension entries.
    regex:
      pattern: "    private boolean canShow(@JniType(\"Profile*\") Profile profile) {\n        return mNativeBridgeSelector.canShow(profile);\n    }"
      replace: |2-
            private boolean canShow(@JniType("Profile*") Profile profile, boolean isExtension) {
                return mNativeBridgeSelector.canShow(profile, isExtension);
            }
  - description: Carry the entry kind when opening.
    regex:
      pattern: "            boolean shouldShowHeader,\n            boolean suppressAnimations) {"
      replace: |2-
                    boolean shouldShowHeader,
                    boolean isExtension,
                    boolean suppressAnimations) {
  - description: Keep native extension identity in opened content.
    regex:
      pattern: "new SidePanelContent(sidePanelNativeView, title, shouldShowHeader),"
      replace: |2-
        new SidePanelContent(sidePanelNativeView, title, shouldShowHeader, isExtension),
  - description: Carry the entry kind when replacing.
    regex:
      pattern: "            boolean shouldShowHeader) {"
      replace: |2-
                    boolean shouldShowHeader,
                    boolean isExtension) {
  - description: Keep native extension identity in replacement content.
    regex:
      pattern: "profile, new SidePanelContent(sidePanelNativeView, title, shouldShowHeader));"
      replace: |2-
        profile, new SidePanelContent(sidePanelNativeView, title, shouldShowHeader, isExtension));
