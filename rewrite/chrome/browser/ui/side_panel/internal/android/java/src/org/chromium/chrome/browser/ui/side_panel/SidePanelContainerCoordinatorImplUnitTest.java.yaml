      replace: "import org.chromium.chrome.browser.browser_controls.TopControlsStacker;\nimport org.chromium.chrome.browser.ui.browser_window.ChromeAndroidTask;\nimport org.chromium.chrome.browser.ui.browser_window.ChromeAndroidTaskFeatureKey;\nimport org.chromium.chrome.browser.ui.browser_window.ChromeAndroidTaskTrackerFactory;\nimport org.chromium.chrome.browser.ui.browser_window.ChromeAndroidTaskUnitTestSupport;\nimport org.chromium.chrome.browser.ui.extensions.side_panel.ExtensionSidePanelManagerBridge;\nimport org.chromium.chrome.browser.ui.side_ui.SideUiCoordinator;\nimport org.chromium.chrome.browser.ui.side_ui.SideUiCoordinator.HeightType;\nimport org.chromium.components.thinwebview.ThinWebView;\nimport org.chromium.components.thinwebview.ThinWebViewAttachParams;\nimport org.chromium.content_public.browser.WebContents;\n\nimport java.lang.ref.WeakReference;"
  - description: "Exercise real fixed coordinator teardown and reentrant replacement ownership."
    regex:
      pattern: "\n}\n"
      replace: "\n\n    private static final int TASK_ID = 204067;\n    private static final long NATIVE_COORDINATOR = 204;\n\n    public static class TestActivity extends Activity {\n        @Override\n        public int getTaskId() {\n            return TASK_ID;\n        }\n    }\n\n    /** A real View which queues only the native successful-presentation boundary. */\n    private static class DeferredFrameView extends FrameLayout implements ThinWebView {\n        private Runnable mNextFrame;\n\n        DeferredFrameView(Activity activity) {\n            super(activity);\n        }\n\n        @Override\n        public View getView() {\n            return this;\n        }\n\n        @Override\n        public void attachWebContents(\n                WebContents webContents, View contentView, ThinWebViewAttachParams attachParams) {}\n\n        @Override\n        public void runOnNextFrame(Runnable runnable) {\n            mNextFrame = runnable;\n        }\n\n        Runnable nextFrame() {\n            assertNotNull(mNextFrame);\n            return mNextFrame;\n        }\n\n        @Override\n        public void resizeWebContents(int width, int height) {}\n\n        @Override\n        public void destroy() {}\n    }\n\n    private static class ReplacementFixture implements AutoCloseable {\n        final ActivityController<TestActivity> activityController;\n        final ChromeAndroidTaskUnitTestSupport.ChromeAndroidTaskWithMockDeps task;\n        final ChromeAndroidTask chromeTask;\n        final WeakReference<Activity> originalActivity;\n        final SideUiCoordinator sideUi = mock(SideUiCoordinator.class);\n        final SidePanelCoordinatorAndroidBridge.Natives nativeCoordinator =\n                mock(SidePanelCoordinatorAndroidBridge.Natives.class);\n        final SidePanelContainerCoordinatorImpl coordinator;\n\n        ReplacementFixture() {\n            activityController = Robolectric.buildActivity(TestActivity.class).setup();\n            task = ChromeAndroidTaskUnitTestSupport.createChromeAndroidTaskWithMockDeps(\n                    TASK_ID, /* isPendingTask= */ false, /* isDesktopMode= */ false);\n            chromeTask = ChromeAndroidTaskTrackerFactory.getInstance().get(TASK_ID);\n            assertNotNull(chromeTask);\n            var window = task.mActivityWindowAndroidMocks.mMockActivityWindowAndroid;\n            originalActivity = window.getActivity();\n            when(window.getActivity()).thenReturn(new WeakReference<>(activityController.get()));\n\n            var registryNative = mock(WindowScopedSidePanelRegistryBridge.Natives.class);\n            when(registryNative.create(any(), anyLong())).thenReturn(1L);\n            WindowScopedSidePanelRegistryBridgeJni.setInstanceForTesting(registryNative);\n            when(nativeCoordinator.create(any(), anyLong())).thenReturn(NATIVE_COORDINATOR);\n            SidePanelCoordinatorAndroidBridgeJni.setInstanceForTesting(nativeCoordinator);\n\n            var tabModelSelector = task.mActivityScopedObjects.mTabModelSelector;\n            chromeTask.addFeature(\n                    new ChromeAndroidTaskFeatureKey(\n                            ExtensionSidePanelManagerBridge.class,\n                            task.mMockProfile,\n                            window,\n                            tabModelSelector.getModel(false)),\n                    () -> mock(ExtensionSidePanelManagerBridge.class));\n            coordinator = new SidePanelContainerCoordinatorImpl(\n                    window, sideUi, tabModelSelector, mock(TopControlsStacker.class));\n            coordinator.init();\n            coordinator.configDeferredViewReplacementForTesting(true);\n        }\n\n        DeferredFrameView replace(View oldView) {\n            coordinator.startOpeningPanel(new SidePanelContent(oldView), true);\n            var next = new DeferredFrameView(activityController.get());\n            coordinator.startReplacingPanelContent(new SidePanelContent(next));\n            assertNotNull(next.nextFrame());\n            return next;\n        }\n\n        @Override\n        public void close() {\n            when(task.mActivityScopedObjects.mTabModelSelector.getCurrentModel().getProfile())\n                    .thenReturn(task.mMockProfile);\n            coordinator.destroy();\n            when(task.mActivityWindowAndroidMocks.mMockActivityWindowAndroid.getActivity())\n                    .thenReturn(originalActivity);\n            ChromeAndroidTaskTrackerFactory.getInstance().remove(TASK_ID);\n            activityController.pause().stop().destroy();\n        }\n    }\n\n    @Test\n    @Config(sdk = {33, 34})\n    public void testDestroyCompletesDeferredReplacementOnceBeforeBridgeRemoval() {\n        try (var fixture = new ReplacementFixture()) {\n            var oldView = new View(fixture.activityController.get());\n            var nextView = fixture.replace(oldView);\n            Runnable lateFrame = nextView.nextFrame();\n            when(fixture.task.mActivityScopedObjects.mTabModelSelector\n                            .getCurrentModel().getProfile())\n                    .thenReturn(null);\n            doAnswer(invocation -> {\n                fixture.coordinator.startOpeningPanel(new SidePanelContent(new View(\n                        fixture.activityController.get())), true);\n                fixture.coordinator.startReplacingPanelContent(new SidePanelContent(\n                        new DeferredFrameView(fixture.activityController.get())));\n                return null;\n            }).when(fixture.nativeCoordinator).onPanelContentReplaced(NATIVE_COORDINATOR);\n\n            fixture.coordinator.destroy();\n            fixture.coordinator.destroy();\n            assertNull(fixture.coordinator.getContentView());\n            assertNull(oldView.getParent());\n            assertNull(nextView.getParent());\n            lateFrame.run();\n            lateFrame.run();\n            verify(fixture.nativeCoordinator, times(1))\n                    .onPanelContentReplaced(NATIVE_COORDINATOR);\n            verify(fixture.sideUi, times(1)).unregisterSideUiContainer(fixture.coordinator);\n        }\n    }\n\n    @Test\n    @Config(sdk = {33, 34})\n    public void testCompletionPreservesReentrantDeferredReplacement() {\n        try (var fixture = new ReplacementFixture()) {\n            var oldView = new View(fixture.activityController.get());\n            var firstView = fixture.replace(oldView);\n            var secondView = new DeferredFrameView(fixture.activityController.get());\n            int[] completions = {0};\n            doAnswer(invocation -> {\n                if (++completions[0] == 1) {\n                    fixture.coordinator.startReplacingPanelContent(\n                            new SidePanelContent(secondView));\n                }\n                return null;\n            }).when(fixture.nativeCoordinator).onPanelContentReplaced(NATIVE_COORDINATOR);\n\n            fixture.coordinator.completePendingContentReplacement();\n            assertNull(oldView.getParent());\n            assertNotNull(firstView.getParent());\n            assertNotNull(secondView.nextFrame());\n            assertEquals(secondView, fixture.coordinator.getContentView());\n            fixture.coordinator.completePendingContentReplacement();\n            assertNull(firstView.getParent());\n            assertNotNull(secondView.getParent());\n            firstView.nextFrame().run();\n            secondView.nextFrame().run();\n            verify(fixture.nativeCoordinator, times(2))\n                    .onPanelContentReplaced(NATIVE_COORDINATOR);\n        }\n    }\n\n}\n"
