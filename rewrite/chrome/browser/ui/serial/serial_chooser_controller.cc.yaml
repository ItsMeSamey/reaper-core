# Android selected-tab device chooser lifetime.
substitutions:
- description: Use the shared Android guard at the permission grant boundary
  regex:
    re_pattern: namespace\ \{
    replace: '#if BUILDFLAG(IS_ANDROID)

      #include "brave/browser/ui/android/device_chooser/active_device_chooser_request.h"

      #endif


      namespace {'
- description: Preserve serial chooser document identity and activation state
  regex:
    re_pattern: \ \ origin_\ =\ render_frame_host\->GetMainFrame\(\)\->GetLastCommittedOrigin\(\);
    replace: "#if BUILDFLAG(IS_ANDROID)\n  active_request_ = std::make_unique<ActiveDeviceChooserRequest>(render_frame_host);\n#endif\n  origin_ = render_frame_host->GetMainFrame()->GetLastCommittedOrigin();"
- description: Revalidate before granting a selected serial port
  regex:
    re_pattern: void\ SerialChooserController::Select\(const\ std::vector<size_t>\&\ indices\)\ \{
    replace: "void SerialChooserController::Select(const std::vector<size_t>& indices) {\n#if BUILDFLAG(IS_ANDROID)\n  if (!active_request_ || !active_request_->IsValid()) {\n    RunCallback(/*port=*/nullptr);\n    return;\n  }\n#endif"
- description: Format Android chooser lifetime changes
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ std::move\(allowed_bluetooth_service_class_ids\)\),\

      \ \ \ \ \ \ callback_\(std::move\(callback\)\),\

      \ \ \ \ \ \ initiator_document_\(render_frame_host\->GetWeakDocumentPtr\(\)\)\ \{\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ active_request_\ =\ std::make_unique<ActiveDeviceChooserRequest>\(render_frame_host\);\

      \#endif\

      \ \ origin_\ =\ render_frame_host\->GetMainFrame\(\)\->GetLastCommittedOrigin\(\);\

      \

      \ \ auto\*\ profile\ =\

      '
    replace: "          std::move(allowed_bluetooth_service_class_ids)),\n      callback_(std::move(callback)),\n      initiator_document_(render_frame_host->GetWeakDocumentPtr()) {\n#if BUILDFLAG(IS_ANDROID)\n  active_request_ =\n      std::make_unique<ActiveDeviceChooserRequest>(render_frame_host);\n#endif\n  origin_ = render_frame_host->GetMainFrame()->GetLastCommittedOrigin();\n\n  auto* profile =\n"
