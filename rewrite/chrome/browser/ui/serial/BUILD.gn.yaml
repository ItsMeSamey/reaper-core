# Android selected-tab device chooser lifetime.
substitutions:
- description: Link serial permission-grant guard only on Android
  regex:
    re_pattern: \ \ if\ \(is_chromeos\)\ \{
    replace: "  if (is_android) {\n    deps += [ \"//brave/browser/ui/android/device_chooser\" ]\n  }\n  if (is_chromeos) {"
- description: Link the Android serial test tab and window fixture
  regex:
    re_pattern: \ \ \#\ TODO\(crbug\.com/40031409\)
    replace: "  if (is_android) {\n    deps += [ \"//components/tabs:test_support\", \"//chrome/browser/ui/android/tab_model:test_support\", \"//ui/android\" ]\n  }\n\n  # TODO(crbug.com/40031409)"
