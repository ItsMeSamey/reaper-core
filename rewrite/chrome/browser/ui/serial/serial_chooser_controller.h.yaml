# Android selected-tab device chooser lifetime.
substitutions:
- description: Own Android pending-grant lifetime
  regex:
    re_pattern: \#include\ <string>
    replace: '#include <memory>

      #include <string>'
- description: Scope chooser activation checks to Android
  regex:
    re_pattern: \#include\ "base/scoped_observation\.h"
    replace: '#include "base/scoped_observation.h"

      #include "build/build_config.h"'
- description: Forward declare Android chooser guard
  regex:
    re_pattern: namespace\ content\ \{
    replace: '#if BUILDFLAG(IS_ANDROID)

      class ActiveDeviceChooserRequest;

      #endif


      namespace content {'
- description: Keep the original document and latched activation state until permission grant
  regex:
    re_pattern: \ \ url::Origin\ origin_;
    replace: "  url::Origin origin_;\n#if BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<ActiveDeviceChooserRequest> active_request_;\n#endif"
