substitutions:
- description: Provide a real active Android tab context for existing serial selection regressions
  regex:
    re_pattern: namespace\ \{
    replace: '#if BUILDFLAG(IS_ANDROID)

      #include "components/tabs/public/mock_tab_interface.h"

      #include "content/public/browser/web_contents.h"

      #include "chrome/browser/ui/android/tab_model/tab_model_list.h"

      #include "chrome/browser/ui/android/tab_model/tab_model_test_helper.h"

      #include "ui/android/window_android.h"

      #endif


      namespace {'
- description: Keep existing serial permission tests within the real Android activation contract
  regex:
    re_pattern: \ \ \ \ ChromeRenderViewHostTestHarness::SetUp\(\);
    replace: "    ChromeRenderViewHostTestHarness::SetUp();\n#if BUILDFLAG(IS_ANDROID)\n    window_ = ui::WindowAndroid::CreateForTesting();\n    window_->get()->AddChild(web_contents()->GetNativeView());\n    tabs::TabLookupFromWebContents::CreateForWebContents(web_contents(), &tab_);\n    ON_CALL(tab_, GetContents()).WillByDefault(Return(web_contents()));\n    ON_CALL(tab_, IsActivated()).WillByDefault(Return(true));\n    ON_CALL(tab_, IsVisible()).WillByDefault(Return(true));\n    ON_CALL(tab_, GetProfile()).WillByDefault(Return(profile()));\n    model_ = std::make_unique<TestTabModel>(profile());\n    model_->SetWebContentsList({web_contents()});\n    model_->SetIsActiveModel(true);\n    TabModelList::AddTabModel(model_.get());\n#endif"
- description: Keep mock tab and Android window lifetime valid through test teardown
  regex:
    re_pattern: '\ private:\

      \ \ device::FakeSerialPortManager\ port_manager_;'
    replace: " private:\n#if BUILDFLAG(IS_ANDROID)\n  // WebContents user data must stop referring to the mock before its destruction.\n  void TearDown() override {\n    TabModelList::RemoveTabModel(model_.get());\n    model_.reset();\n    DeleteContents();\n    window_.reset();\n    ChromeRenderViewHostTestHarness::TearDown();\n  }\n  tabs::MockTabInterface tab_;\n  std::unique_ptr<TestTabModel> model_;\n  std::unique_ptr<ui::WindowAndroid::ScopedWindowAndroidForTesting> window_;\n#endif\n  device::FakeSerialPortManager port_manager_;"
- description: Format Android chooser lifetime changes
  regex:
    re_pattern: '\#include\ "testing/gtest/include/gtest/gtest\.h"\

      \#include\ "third_party/blink/public/mojom/serial/serial\.mojom\.h"\

      \

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \#include\ "components/tabs/public/mock_tab_interface\.h"\

      \#include\ "content/public/browser/web_contents\.h"\

      \#include\ "chrome/browser/ui/android/tab_model/tab_model_list\.h"\

      \#include\ "chrome/browser/ui/android/tab_model/tab_model_test_helper\.h"\

      \#include\ "ui/android/window_android\.h"\

      \#endif\

      \

      namespace\ \{\

      '
    replace: '#include "testing/gtest/include/gtest/gtest.h"

      #include "third_party/blink/public/mojom/serial/serial.mojom.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/android/tab_model/tab_model_list.h"

      #include "chrome/browser/ui/android/tab_model/tab_model_test_helper.h"

      #include "components/tabs/public/mock_tab_interface.h"

      #include "content/public/browser/web_contents.h"

      #include "ui/android/window_android.h"

      #endif


      namespace {

      '
- description: Format Android chooser lifetime changes
  regex:
    re_pattern: '\ \ MockBluetoothAdapter\*\ adapter\(\)\ \{\ return\ adapter_\.get\(\);\ \}\

      \

      \ private:\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ //\ WebContents\ user\ data\ must\ stop\ referring\ to\ the\ mock\ before\ its\ destruction\.\

      \ \ void\ TearDown\(\)\ override\ \{\

      \ \ \ \ TabModelList::RemoveTabModel\(model_\.get\(\)\);\

      \ \ \ \ model_\.reset\(\);\

      \ \ \ \ DeleteContents\(\);\

      '
    replace: "  MockBluetoothAdapter* adapter() { return adapter_.get(); }\n\n private:\n#if BUILDFLAG(IS_ANDROID)\n  // WebContents user data must stop referring to the mock before its\n  // destruction.\n  void TearDown() override {\n    TabModelList::RemoveTabModel(model_.get());\n    model_.reset();\n    DeleteContents();\n"
- description: Keep Android serial chooser tests bound to their real weak tab owner
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \#include\ "chrome/browser/ui/android/tab_model/tab_model_list\.h"'
    replace: '#if BUILDFLAG(IS_ANDROID)

      #include "base/memory/weak_ptr.h"

      #include "chrome/browser/ui/android/tab_model/tab_model_list.h"'
- description: Keep Android serial chooser tests bound to their real weak tab owner
  regex:
    re_pattern: \ \ \ \ ON_CALL\(tab_,\ GetContents\(\)\)\.WillByDefault\(Return\(web_contents\(\)\)\);
    replace: "    ON_CALL(tab_, GetWeakPtr()).WillByDefault(\n        [this] { return tab_weak_factory_.GetWeakPtr(); });\n    ON_CALL(tab_, GetContents()).WillByDefault(Return(web_contents()));"
- description: Keep Android serial chooser tests bound to their real weak tab owner
  regex:
    re_pattern: \ \ tabs::MockTabInterface\ tab_;
    replace: "  tabs::MockTabInterface tab_;\n  base::WeakPtrFactory<tabs::MockTabInterface> tab_weak_factory_{&tab_};"
