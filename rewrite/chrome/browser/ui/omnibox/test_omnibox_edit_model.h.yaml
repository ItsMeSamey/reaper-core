substitutions:

# Match retained compiler test helpers to current public APIs; preserve ordinary cases/assertions.
  - description: "Compiler API: explicit_platform_macro_header"
    regex:
      re_pattern: "\\#include\\ \"base/time/time\\.h\"\\\n"
      replace: "#include \"base/time/time.h\"\n#include \"build/build_config.h\"\n"
    count: 1
  - description: "Compiler API: Android_excludes_AI_session_header"
    regex:
      re_pattern: "\\#include\\ \"components/contextual_search/contextual_search_session_handle\\.h\"\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/contextual_search/contextual_search_session_handle.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Compiler API: test_wrapper_matches_base_declaration_guard"
    regex:
      re_pattern: "\\ \\ void\\ NavigateToAiModeWithContextualizerOnContextualizationCompleteForTesting\\(\\\n\\ \\ \\ \\ \\ \\ const\\ std::u16string\\&\\ query_text,\\\n\\ \\ \\ \\ \\ \\ WindowOpenDisposition\\ disposition,\\\n\\ \\ \\ \\ \\ \\ base::WeakPtr<contextual_search::ContextualSearchSessionHandle>\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ session_handle\\);\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  void NavigateToAiModeWithContextualizerOnContextualizationCompleteForTesting(\n      const std::u16string& query_text,\n      WindowOpenDisposition disposition,\n      base::WeakPtr<contextual_search::ContextualSearchSessionHandle>\n          session_handle);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Compiler API: test_using_matches_base_declaration_guards"
    regex:
      re_pattern: "\\ \\ using\\ OmniboxEditModel::NavigateToThirdPartyAiMode;\\\n\\ \\ using\\ OmniboxEditModel::RecordAiModeMetrics;\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  using OmniboxEditModel::NavigateToThirdPartyAiMode;\n  using OmniboxEditModel::RecordAiModeMetrics;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
