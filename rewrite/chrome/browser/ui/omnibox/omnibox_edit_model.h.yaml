# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/omnibox/omnibox_edit_model.h'
  regex:
    re_pattern: '\#include\ <string>\

      \#include\ <string_view>\

      \

      \#include\ "base/compiler_specific\.h"\

      \#include\ "base/gtest_prod_util\.h"\

      \#include\ "base/memory/advanced_memory_safety_checks\.h"\

      '
    replace: '#include <string>

      #include <string_view>


      #include "build/build_config.h"

      #include "base/compiler_specific.h"

      #include "base/gtest_prod_util.h"

      #include "base/memory/advanced_memory_safety_checks.h"

      '
