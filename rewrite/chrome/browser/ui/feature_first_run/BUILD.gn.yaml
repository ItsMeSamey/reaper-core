# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AtMemory provider/source omission: chrome/browser/ui/feature_first_run/BUILD.gn'
  regex:
    re_pattern: '\ \ \]\

      \

      \ \ public_deps\ =\ \[\ "//base"\ \]\

      \}\

      \

      source_set\("impl"\)\ \{\

      '
    replace: "  ]\n\n  public_deps = [ \"//base\" ]\n\n  if (is_android) {\n    sources -= [ \"autofill_ai_first_run_dialog.h\" ]\n  }\n}\n\nsource_set(\"impl\") {\n"
- description: 'Android concrete AtMemory provider/source omission: chrome/browser/ui/feature_first_run/BUILD.gn'
  regex:
    re_pattern: '\ \ \]\

      \

      \ \ public_deps\ =\ \[\ "//chrome/browser:browser_public_dependencies"\ \]\

      \}\

      \

      source_set\("browser_tests"\)\ \{\

      '
    replace: "  ]\n\n  public_deps = [ \"//chrome/browser:browser_public_dependencies\" ]\n\n  if (is_android) {\n    sources -= [ \"autofill_ai_first_run_dialog.cc\" ]\n    deps -= [ \"//components/autofill/core/browser\" ]\n  }\n}\n\nsource_set(\"browser_tests\") {\n"
