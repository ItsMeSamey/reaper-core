substitutions:
- description: Confine merchant implementation headers to non-Android consumers
  regex:
    pattern: '#include "chrome/browser/page_info/merchant_trust_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/page_info/merchant_trust_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Confine merchant implementation headers to non-Android consumers
  regex:
    pattern: '#include "components/page_info/core/merchant_trust_service.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/page_info/core/merchant_trust_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Complete the retained Android PageInfo callback with unavailable merchant data, without constructing a backend
  regex:
    pattern: "void ChromePageInfoUiDelegate::GetMerchantTrustInfo(\n    page_info::MerchantDataCallback callback) {\n  if\
      \ (auto* service =\n          MerchantTrustServiceFactory::GetForProfile(GetProfile())) {\n    service->GetMerchantTrustInfo(web_contents_->GetVisibleURL(),\n\
      \                                  std::move(callback));\n  }\n}\n"
    replace: "void ChromePageInfoUiDelegate::GetMerchantTrustInfo(\n    page_info::MerchantDataCallback callback) {\n#if BUILDFLAG(IS_ANDROID)\n\
      \  std::move(callback).Run(web_contents_->GetVisibleURL(), std::nullopt);\n#else\n  if (auto* service =\n          MerchantTrustServiceFactory::GetForProfile(GetProfile()))\
      \ {\n    service->GetMerchantTrustInfo(web_contents_->GetVisibleURL(),\n                                  std::move(callback));\n\
      \  }\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n"
  count: 1
- description: Compile merchant interaction recording out on Android while preserving the ordinary PageInfo delegate API
  regex:
    pattern: "void ChromePageInfoUiDelegate::RecordMerchantTrustButtonShown() {\n  if (auto* service =\n          MerchantTrustServiceFactory::GetForProfile(GetProfile()))\
      \ {\n    service->RecordMerchantTrustInteraction(\n        web_contents_->GetVisibleURL(),\n        page_info::MerchantTrustInteraction::kPageInfoRowShown);\n\
      \  }\n}\n"
    replace: "void ChromePageInfoUiDelegate::RecordMerchantTrustButtonShown() {\n#if !BUILDFLAG(IS_ANDROID)\n  if (auto* service\
      \ =\n          MerchantTrustServiceFactory::GetForProfile(GetProfile())) {\n    service->RecordMerchantTrustInteraction(\n\
      \        web_contents_->GetVisibleURL(),\n        page_info::MerchantTrustInteraction::kPageInfoRowShown);\n  }\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n}\n"
  count: 1
- description: Compile merchant interaction recording out on Android while preserving the ordinary PageInfo delegate API
  regex:
    pattern: "void ChromePageInfoUiDelegate::RecordMerchantTrustSidePanelOpened() {\n  if (auto* service =\n          MerchantTrustServiceFactory::GetForProfile(GetProfile()))\
      \ {\n    service->RecordMerchantTrustInteraction(\n        web_contents_->GetVisibleURL(),\n        page_info::MerchantTrustInteraction::kSidePanelOpened);\n\
      \  }\n}\n"
    replace: "void ChromePageInfoUiDelegate::RecordMerchantTrustSidePanelOpened() {\n#if !BUILDFLAG(IS_ANDROID)\n  if (auto*\
      \ service =\n          MerchantTrustServiceFactory::GetForProfile(GetProfile())) {\n    service->RecordMerchantTrustInteraction(\n\
      \        web_contents_->GetVisibleURL(),\n        page_info::MerchantTrustInteraction::kSidePanelOpened);\n  }\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n}\n"
  count: 1
