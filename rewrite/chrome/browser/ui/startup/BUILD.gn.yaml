substitutions:
  - description: Add the public_deps the Brave startup additions need.
    add_literal_to_list:
      target: startup_tab
      list_name: public_deps
      literal: brave_browser_ui_startup_public_deps
      import: //brave/browser/ui/startup/sources.gni

  - description: "Android AI closure 410: chrome/browser/ui/startup/BUILD.gn"
    regex:
      pattern: "# Copyright 2019 The Chromium Authors\n# Use of this source code is governed by a BSD-style license that can be\n# found in the LICENSE file.\n\nimport(\"//brave/browser/ui/startup/sources.gni\")\nimport(\"//build/buildflag_header.gni\")\nimport(\"//build/config/chrome_build.gni\")\nimport(\"//build/config/ui.gni\")\nimport(\"//components/signin/features.gni\")\nimport(\"//extensions/buildflags/buildflags.gni\")\nimport(\"//rlz/buildflags/buildflags.gni\")\n\ndeclare_args() {\n  # Allow browser tests that startup with --gcpw-signin flag.\n  # Defaults to !is_chrome_branded, but can be overridden via gn args.\n  can_test_gcpw_signin_startup = !is_chrome_branded\n}\n\nbuildflag_header(\"buildflags\") {\n  header = \"buildflags.h\"\n  flags = [ \"CAN_TEST_GCPW_SIGNIN_STARTUP=$can_test_gcpw_signin_startup\" ]\n}\n\n# TODO(crbug.com/369883710): modularize all the rest.\nsource_set(\"startup_tab\") {\n  sources = [\n    \"startup_tab.cc\",\n    \"startup_tab.h\",\n  ]\n\n  public_deps = [ \"//url\" ]\n  public_deps += brave_browser_ui_startup_public_deps\n}\n\nsource_set(\"startup\") {\n  sources = [\n    \"bad_flags_prompt.h\",\n    \"url_util.h\",\n  ]\n  public_deps = [\n    \"//components/infobars/core\",\n    \"//url\",\n  ]\n\n  if (!is_android) {\n    sources += [\n      \"automation_infobar_delegate.h\",\n      \"features.h\",\n      \"google_api_keys_infobar_delegate.h\",\n      \"google_chrome_scheme_util.h\",\n      \"infobar_utils.h\",\n      \"launch_mode_recorder.h\",\n      \"obsolete_system_infobar_delegate.h\",\n      \"oscryptasync_availability_infobar_delegate.h\",\n      \"profile_launch_observer.h\",\n      \"startup_browser_creator.h\",\n      \"startup_browser_creator_impl.h\",\n      \"startup_infobar_observer.h\",\n      \"startup_tab_provider.h\",\n      \"startup_types.h\",\n    ]\n    public_deps += [\n      \":startup_tab\",\n      \"//base\",\n      \"//chrome/browser/prefs:util\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/search_integrity\",\n      \"//chrome/browser/sessions\",\n      \"//chrome/browser/ui/browser_window\",\n      \"//chrome/browser/ui/tabs:tab_strip_model_observer\",\n      \"//components/infobars/content\",\n      \"//components/signin/public/base:signin_buildflags\",\n    ]\n  }\n\n  if (is_chrome_for_testing) {\n    sources += [ \"chrome_for_testing_infobar_delegate.h\" ]\n  }\n\n  if (is_win || is_mac || is_linux || is_chromeos) {\n    sources += [ \"web_app_startup_utils.h\" ]\n    public_deps += [ \"//components/services/app_service/public/cpp:app_types\" ]\n  }\n\n  if (is_win || is_mac || is_linux) {\n    sources += [\n      \"first_run_service.h\",\n      \"web_app_info_recorder_utils.h\",\n    ]\n\n    public_deps += [\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/ui/profiles\",\n      \"//components/keyed_service/core\",\n    ]\n  }\n\n  if (is_win) {\n    sources += [\n      \"startup_launch_infobar_delegate.h\",\n      \"startup_launch_infobar_manager_impl.h\",\n    ]\n\n    public_deps += [\n      \"//chrome/browser/startup\",\n      \"//chrome/browser/ui:browser_tab_strip\",\n      \"//chrome/browser/ui/tabs:tab_strip_model_observer\",\n    ]\n  }\n\n  if (is_win) {\n    assert(toolkit_views)\n    assert(use_aura)\n\n    sources += [\n      \"credential_provider_signin_dialog_view_with_modal.h\",\n      \"credential_provider_signin_dialog_win.h\",\n      \"credential_provider_signin_info_fetcher_win.h\",\n    ]\n    public_deps += [\n      \":buildflags\",\n      \"//components/web_modal\",\n      \"//google_apis\",\n      \"//ui/views/controls/webview\",\n    ]\n  }\n}\n\nsource_set(\"impl\") {\n  sources = [\n    \"bad_flags_prompt.cc\",\n    \"url_util.cc\",\n  ]\n  deps = [\n    \":startup\",\n    \"//base\",\n    \"//cc/base\",\n    \"//chrome/app:branded_strings\",\n    \"//chrome/app:generated_resources\",\n    \"//chrome/browser:browser_features\",\n    \"//chrome/browser:browser_process\",