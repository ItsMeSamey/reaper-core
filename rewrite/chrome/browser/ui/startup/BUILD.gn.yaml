rome/browser/ui/tabs:test_support\",\n      \"//chrome/common\",\n      \"//chrome/common:non_code_constants\",\n      \"//chrome/common:version_header\",\n      \"//chrome/test:test_support\",\n      \"//components/signin/public/base\",\n      \"//content/test:test_support\",\n      \"//extensions:test_support\",\n      \"//extensions/browser\",\n      \"//testing/gmock\",\n      \"//testing/gtest\",\n      \"//url\",\n    ]\n\n    if (is_win) {\n      assert(toolkit_views)\n      sources += [ \"credential_provider_signin_info_fetcher_win_unittest.cc\" ]\n      deps += [ \":credential_provider_test_utils\" ]\n    }\n  }\n  if (enable_dice_support) {\n    sources += [ \"first_run_service_unittest.cc\" ]\n    deps += [ \":test_support_ui\" ]\n  }\n}\n\nif (!is_android) {\n  source_set(\"browser_tests\") {\n    testonly = true\n    defines = [ \"HAS_OUT_OF_PROC_TEST_RUNNER\" ]\n    sources = [\n      \"oscryptasync_availability_infobar_browsertest.cc\",\n      \"startup_browser_creator_browsertest.cc\",\n    ]\n    deps = [\n      \":startup\",\n      \"//base\",\n      \"//base/test:test_support\",\n      \"//base/version_info\",\n      \"//build:buildflag_header_h\",\n      \"//chrome/app:command_ids\",\n      \"//chrome/app:generated_resources\",\n      \"//chrome/browser:browser_process\",\n      \"//chrome/browser:buildflags\",\n      \"//chrome/browser:chrome_browser_main\",\n      \"//chrome/browser/extensions\",\n      \"//chrome/browser/infobars\",\n      \"//chrome/browser/lifetime\",\n      \"//chrome/browser/prefs:util\",\n      \"//chrome/browser/profiles\",\n      \"//chrome/browser/profiles:misc\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/profiles:profile_util\",\n      \"//chrome/browser/profiles/keep_alive\",\n      \"//chrome/browser/search\",\n      \"//chrome/browser/sessions\",\n      \"//chrome/browser/signin:signin_promo\",\n      \"//chrome/browser/ui:browser_init_state\",\n      \"//chrome/browser/ui:ui_features\