   \"//chrome/browser:browser_public_dependencies\",\n    \"//ui/base/unowned_user_data\",\n  ]\n\n  if (!is_android) {\n    sources += [\n      \"automation_infobar_delegate.cc\",\n      \"features.cc\",\n      \"google_api_keys_infobar_delegate.cc\",\n      \"google_chrome_scheme_util.cc\",\n      \"infobar_utils.cc\",\n      \"launch_mode_recorder.cc\",\n      \"obsolete_system_infobar_delegate.cc\",\n      \"oscryptasync_availability_infobar_delegate.cc\",\n      \"profile_launch_observer.cc\",\n      \"startup_browser_creator.cc\",\n      \"startup_browser_creator_impl.cc\",\n      \"startup_infobar_observer.cc\",\n      \"startup_tab_provider.cc\",\n    ]\n    deps += [\n      \":startup_tab\",\n      \"//apps\",\n      \"//base:i18n\",\n      \"//build:branding_buildflags\",\n      \"//build:buildflag_header_h\",\n      \"//chrome/browser:global_features\",\n      \"//chrome/browser:shell_integration\",\n      \"//chrome/browser/app_mode\",\n      \"//chrome/browser/apps/app_service\",\n      \"//chrome/browser/apps/platform_apps\",\n      \"//chrome/browser/custom_handlers\",\n      \"//chrome/browser/extensions\",\n      \"//chrome/browser/headless:command_processor\",\n      \"//chrome/browser/lifetime\",\n      \"//chrome/browser/obsolete_system\",\n      \"//chrome/browser/prefs\",\n      \"//chrome/browser/prefs:util\",\n      \"//chrome/browser/privacy_sandbox:headers\",\n      \"//chrome/browser/profile_resetter\",\n      \"//chrome/browser/profiles:misc\",\n      \"//chrome/browser/profiles:profile_io_data\",\n      \"//chrome/browser/profiles/keep_alive\",\n      \"//chrome/browser/search\",\n      \"//chrome/browser/search_engines\",\n      \"//chrome/browser/ui:chrome_pages\",\n      \"//chrome/browser/ui:session_crashed_bubble\",\n      \"//chrome/browser/ui:ui_features\",\n      \"//chrome/browser/ui/browser_window\",\n      \"//chrome/browser/ui/extensions\",\n      \"//chrome/browser/ui/navigator\",\n      \"//chrome/browser/ui/omnibox/omnibox