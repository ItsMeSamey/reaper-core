- {"description": "Android accepted DOM bridge and request metadata 3", "regex": {"re_pattern": "\\ \\ \\ \\ //\\ We\\ need\\ to\\ update\\ the\\ fullscreen\\ exit\\ bubble,\\ e\\.g\\.,\\ going\\ from\\ browser\\\n\\ \\ \\ \\ //\\ fullscreen\\ to\\ tab\\ fullscreen\\ will\\ need\\ to\\ show\\ different\\ content\\.\\\n\\ \\ \\ \\ tab_fullscreen_\\ =\\ true;\\\n\\ \\ \\ \\ exclusive_access_manager\\(\\)\\->UpdateBubble\\(base::NullCallback\\(\\)\\);\\\n\\ \\ \\}\\\n\\\n\\ \\ //\\ This\\ is\\ only\\ a\\ change\\ between\\ Browser\\ and\\ Tab\\ fullscreen\\.\\ We\\ generate\\\n", "replace": "    // We need to update the fullscreen exit bubble, e.g., going from browser\n    // fullscreen to tab fullscreen will need to show different content.\n    tab_fullscreen_ = true;\n#if BUILDFLAG(IS_ANDROID)\n    // The window is already fullscreen, but Java still needs the accepted DOM\n    // request after its native owner and browser return state are committed.\n    fullscreen_parameters_ = fullscreen_tab_params;\n    auto weak_ptr = weak_ptr_factory_.GetWeakPtr();\n    exclusive_access_context->EnterFullscreen(\n        GetRequestingOrigin(),\n        exclusive_access_manager()->GetExclusiveAccessExitBubbleType(),\n        fullscreen_tab_params);\n    if (!weak_ptr) {\n      return;\n    }\n#else\n    exclusive_access_manager()->UpdateBubble(base::NullCallback());\n#endif\n  }\n\n  // This is only a change between Browser and Tab fullscreen. We generate\n"}}
- {"description": "Android accepted DOM bridge and request metadata 4", "regex": {"re_pattern": "\\ \\ const\\ bool\\ was_browser_fullscreen\\ =\\\n\\ \\ \\ \\ \\ \\ state_prior_to_tab_fullscreen_\\ ==\\ STATE_BROWSER_FULLSCREEN;\\\n\\\n\\ \\ NotifyTabExclusiveAccessLost\\(\\);\\\n\\ \\ if\\ \\(was_browser_fullscreen\\)\\ \\{\\\n\\ \\ \\ \\ exclusive_access_context\\->UpdateUIForTabFullscreen\\(\\);\\\n\\ \\ \\}\\\n\\\n\\ \\ //\\ For\\ Tab\\ Fullscreen\\ \\->\\ Browser\\ Fullscreen,\\ enter\\ browser\\ fullscreen\\ on\\ the\\\n\\ \\ //\\ display\\ that\\ originated\\ the\\ browser\\ fullscreen\\ prior\\ to\\ the\\ tab\\ fullscreen\\.\\\n\\ \\ //\\ crbug\\.com/40832401\\.\\\n", "replace": "  const bool was_browser_fullscreen =\n      state_prior_to_tab_fullscreen_ == STATE_BROWSER_FULLSCREEN;\n\n#if BUILDFLAG(IS_ANDROID)\n  // Capture the accepted Java request before renderer exit can accept a new one.\n  base::OnceClosure tab_fullscreen_exit;\n  if (was_browser_fullscreen) {\n    tab_fullscreen_exit =\n        exclusive_access_context->GetTabFullscreenExitCallback();\n  }\n  auto weak_ptr = weak_ptr_factory_.GetWeakPtr();\n#endif\n  NotifyTabExclusiveAccessLost();\n#if BUILDFLAG(IS_ANDROID)\n  if (!weak_ptr) {\n    return;\n  }\n#endif\n  if (was_browser_fullscreen) {\n#if BUILDFLAG(IS_ANDROID)\n    if (tab_fullscreen_exit) {\n      std::move(tab_fullscreen_exit).Run();\n    }\n    if (!weak_ptr) {\n      return;\n    }\n#else\n    exclusive_access_context->UpdateUIForTabFullscreen();\n#endif\n  }\n\n#if !BUILDFLAG(IS_ANDROID)\n  // For Tab Fullscreen -> Browser Fullscreen, enter browser fullscreen on the\n  // display that originated the browser fullscreen prior to the tab fullscreen.\n  // crbug.com/40832401.\n"}}
