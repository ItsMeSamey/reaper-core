substitutions:
  # Android DOM fullscreen bridge; immutable raw source pin.
  - {"description": "Android accepted DOM bridge and request metadata 1", "regex": {"re_pattern": "\\\n\\#ifndef\\ CHROME_BROWSER_UI_EXCLUSIVE_ACCESS_EXCLUSIVE_ACCESS_CONTEXT_H_\\\n\\#define\\ CHROME_BROWSER_UI_EXCLUSIVE_ACCESS_EXCLUSIVE_ACCESS_CONTEXT_H_\\\n\\\n\\#include\\ \"chrome/browser/ui/exclusive_access/exclusive_access_bubble_hide_callback\\.h\"\\\n\\#include\\ \"chrome/browser/ui/exclusive_access/exclusive_access_bubble_type\\.h\"\\\n", "replace": "\n#ifndef CHROME_BROWSER_UI_EXCLUSIVE_ACCESS_EXCLUSIVE_ACCESS_CONTEXT_H_\n#define CHROME_BROWSER_UI_EXCLUSIVE_ACCESS_EXCLUSIVE_ACCESS_CONTEXT_H_\n\n#include \"build/build_config.h\"\n\n#if BUILDFLAG(IS_ANDROID)\n#include \"base/functional/callback.h\"\n#endif\n\n#include \"chrome/browser/ui/exclusive_access/exclusive_access_bubble_hide_callback.h\"\n#include \"chrome/browser/ui/exclusive_access/exclusive_access_bubble_type.h\"\n"}}
  - {"description": "Android accepted DOM bridge and request metadata 2", "regex": {"re_pattern": "\\ \\ //\\ updates\\ the\\ UI\\ by\\ showing/hiding\\ the\\ tab\\ strip,\\ toolbar\\ and\\ bookmark\\ bar\\\n\\ \\ //\\ in\\ the\\ browser\\ fullscreen\\.\\ Currently\\ only\\ supported\\ on\\ Mac\\.\\\n\\ \\ virtual\\ void\\ UpdateUIForTabFullscreen\\(\\)\\ \\{\\}\\\n\\\n\\ \\ //\\ Enters\\ fullscreen\\ and\\ updates\\ the\\ exclusive\\ access\\ bubble\\.\\\n\\ \\ virtual\\ void\\ EnterFullscreen\\(const\\ url::Origin\\&\\ origin,\\\n", "replace": "  // updates the UI by showing/hiding the tab strip, toolbar and bookmark bar\n  // in the browser fullscreen. Currently only supported on Mac.\n  virtual void UpdateUIForTabFullscreen() {}\n\n#if BUILDFLAG(IS_ANDROID)\n  // Captures tab-only UI cleanup before renderer exit can accept another request.\n  // Contexts without an Android tab UI bridge need no additional callback.\n  virtual base::OnceClosure GetTabFullscreenExitCallback() { return {}; }\n#endif\n\n  // Enters fullscreen and updates the exclusive access bubble.\n  virtual void EnterFullscreen(const url::Origin& origin,\n"}}
