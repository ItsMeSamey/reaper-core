# Update live Android extension font preferences.
substitutions:
- description: Drain normal preference notifications in the animation policy test.
  regex:
    pattern: '#include "base/path_service.h"'
    replace: '#include "base/path_service.h"

      #include "base/run_loop.h"'
- description: Verify live animation policy updates reach existing renderer preferences.
  regex:
    re_pattern: \Z
    replace: "\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\nIN_PROC_BROWSER_TEST_F(PrefsTabHelperBrowserTest,\n                       AnimationPolicyUpdatesExistingWebPreferences) {\n  PrefService* prefs = chrome_test_utils::GetProfile(this)->GetPrefs();\n  ASSERT_TRUE(prefs->FindPreference(prefs::kAnimationPolicy));\n  content::WebContents* web_contents =\n      chrome_test_utils::GetActiveWebContents(this);\n  using Policy = blink::mojom::ImageAnimationPolicy;\n  EXPECT_EQ(Policy::kImageAnimationPolicyAllowed,\n            web_contents->GetOrCreateWebPreferences().animation_policy);\n\n  prefs->SetString(prefs::kAnimationPolicy, \"none\");\n  base::RunLoop().RunUntilIdle();\n  EXPECT_EQ(Policy::kImageAnimationPolicyNoAnimation,\n            web_contents->GetOrCreateWebPreferences().animation_policy);\n\n  prefs->SetString(prefs::kAnimationPolicy, \"once\");\n  base::RunLoop().RunUntilIdle();\n  EXPECT_EQ(Policy::kImageAnimationPolicyAnimateOnce,\n            web_contents->GetOrCreateWebPreferences().animation_policy);\n\n  prefs->ClearPref(prefs::kAnimationPolicy);\n  base::RunLoop().RunUntilIdle();\n  EXPECT_EQ(Policy::kImageAnimationPolicyAllowed,\n            web_contents->GetOrCreateWebPreferences().animation_policy);\n}\n#endif  // BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n"
- description: Declare the script-pref string dependency used by the Android regression
  regex:
    re_pattern: \#include\ "base/files/file_util\.h"
    replace: '#include <string>


      #include "base/files/file_util.h"'
- description: Require automatic updates of existing cached web preferences after generic font changes
  regex:
    re_pattern: 'IN_PROC_BROWSER_TEST_F\(PrefsTabHelperBrowserTest,\ GenericFontFamilies\)\ \{\

      \ \ PrefService\*\ prefs\ =\ chrome_test_utils::GetProfile\(this\)\->GetPrefs\(\);\

      \ \ prefs\->SetString\(prefs::kWebKitStandardFontFamily,\ "CustomStandard"\);\

      \ \ prefs\->SetString\(prefs::kWebKitSerifFontFamily,\ "CustomSerif"\);\

      \ \ prefs\->SetString\(prefs::kWebKitSansSerifFontFamily,\ "CustomSansSerif"\);\

      \ \ prefs\->SetString\(prefs::kWebKitCursiveFontFamily,\ "CustomCursive"\);\

      \ \ prefs\->SetString\(prefs::kWebKitFantasyFontFamily,\ "CustomFantasy"\);\

      \ \ prefs\->SetString\(prefs::kWebKitFixedFontFamily,\ "CustomFixed"\);\

      \ \ prefs\->SetString\(prefs::kWebKitMathFontFamily,\ "CustomMath"\);\

      \

      \ \ content::WebContents\*\ web_contents\ =\

      \ \ \ \ \ \ chrome_test_utils::GetActiveWebContents\(this\);\

      \ \ web_contents\->NotifyPreferencesChanged\(\);\

      \ \ blink::web_pref::WebPreferences\ web_prefs\ =\

      \ \ \ \ \ \ web_contents\->GetOrCreateWebPreferences\(\);\

      \

      \ \ EXPECT_EQ\(u"CustomStandard",\

      \ \ \ \ \ \ \ \ \ \ \ \ web_prefs\.standard_font_family_map\[blink::web_pref::kCommonScript\]\);\

      \ \ EXPECT_EQ\(u"CustomSerif",\

      \ \ \ \ \ \ \ \ \ \ \ \ web_prefs\.serif_font_family_map\[blink::web_pref::kCommonScript\]\);\

      \ \ EXPECT_EQ\(\

      \ \ \ \ \ \ u"CustomSansSerif",\

      \ \ \ \ \ \ web_prefs\.sans_serif_font_family_map\[blink::web_pref::kCommonScript\]\);\

      \ \ EXPECT_EQ\(u"CustomCursive",\

      \ \ \ \ \ \ \ \ \ \ \ \ web_prefs\.cursive_font_family_map\[blink::web_pref::kCommonScript\]\);\

      \ \ EXPECT_EQ\(u"CustomFantasy",\

      \ \ \ \ \ \ \ \ \ \ \ \ web_prefs\.fantasy_font_family_map\[blink::web_pref::kCommonScript\]\);\

      \ \ EXPECT_EQ\(u"CustomFixed",\

      \ \ \ \ \ \ \ \ \ \ \ \ web_prefs\.fixed_font_family_map\[blink::web_pref::kCommonScript\]\);\

      \ \ EXPECT_EQ\(u"CustomMath",\

      \ \ \ \ \ \ \ \ \ \ \ \ web_prefs\.math_font_family_map\[blink::web_pref::kCommonScript\]\);\

      \}\

      '
    replace: "IN_PROC_BROWSER_TEST_F(PrefsTabHelperBrowserTest, GenericFontFamilies) {\n  content::WebContents* web_contents =\n      chrome_test_utils::GetActiveWebContents(this);\n  // Populate the existing tab's cache before changing preferences. A lazy\n  // first read after the changes would hide a missing observer.\n  web_contents->GetOrCreateWebPreferences();\n  PrefService* prefs = chrome_test_utils::GetProfile(this)->GetPrefs();\n  prefs->SetString(prefs::kWebKitStandardFontFamily, \"CustomStandard\");\n  prefs->SetString(prefs::kWebKitSerifFontFamily, \"CustomSerif\");\n  prefs->SetString(prefs::kWebKitSansSerifFontFamily, \"CustomSansSerif\");\n  prefs->SetString(prefs::kWebKitCursiveFontFamily, \"CustomCursive\");\n  prefs->SetString(prefs::kWebKitFantasyFontFamily, \"CustomFantasy\");\n  prefs->SetString(prefs::kWebKitFixedFontFamily, \"CustomFixed\");\n  prefs->SetString(prefs::kWebKitMathFontFamily, \"CustomMath\");\n\n  // Exercise the real notification path; no forced refresh or navigation.\n  base::RunLoop().RunUntilIdle();\n  blink::web_pref::WebPreferences web_prefs =\n      web_contents->GetOrCreateWebPreferences();\n\n  EXPECT_EQ(u\"CustomStandard\",\n            web_prefs.standard_font_family_map[blink::web_pref::kCommonScript]);\n  EXPECT_EQ(u\"CustomSerif\",\n            web_prefs.serif_font_family_map[blink::web_pref::kCommonScript]);\n  EXPECT_EQ(\n      u\"CustomSansSerif\",\n      web_prefs.sans_serif_font_family_map[blink::web_pref::kCommonScript]);\n  EXPECT_EQ(u\"CustomCursive\",\n            web_prefs.cursive_font_family_map[blink::web_pref::kCommonScript]);\n  EXPECT_EQ(u\"CustomFantasy\",\n            web_prefs.fantasy_font_family_map[blink::web_pref::kCommonScript]);\n  EXPECT_EQ(u\"CustomFixed\",\n            web_prefs.fixed_font_family_map[blink::web_pref::kCommonScript]);\n  EXPECT_EQ(u\"CustomMath\",\n            web_prefs.math_font_family_map[blink::web_pref::kCommonScript]);\n}\n"
- description: Regression for clearFont restoring script fallback in an already-open Android tab
  regex:
    re_pattern: '\#if\ BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\

      IN_PROC_BROWSER_TEST_F\(PrefsTabHelperBrowserTest,\

      '
    replace: "#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\nIN_PROC_BROWSER_TEST_F(PrefsTabHelperBrowserTest,\n                       AndroidClearedScriptFontResetsExistingMapping) {\n  PrefService* prefs = chrome_test_utils::GetProfile(this)->GetPrefs();\n  // Gothic has a registered empty default: clearing its override must restore\n  // fallback to the common script, not retain the old explicit renderer value.\n  const std::string script_pref =\n      std::string(prefs::kWebKitSerifFontFamilyMap) + \".Goth\";\n  ASSERT_TRUE(prefs->FindPreference(script_pref));\n  ASSERT_TRUE(prefs->GetString(script_pref).empty());\n  content::WebContents* web_contents =\n      chrome_test_utils::GetActiveWebContents(this);\n  web_contents->GetOrCreateWebPreferences();\n\n  prefs->SetString(prefs::kWebKitSerifFontFamily, \"serif\");\n  prefs->SetString(script_pref, \"monospace\");\n  base::RunLoop().RunUntilIdle();\n  const auto& updated = web_contents->GetOrCreateWebPreferences();\n  ASSERT_TRUE(updated.serif_font_family_map.contains(\"Goth\"));\n  EXPECT_EQ(u\"monospace\", updated.serif_font_family_map.at(\"Goth\"));\n\n  prefs->ClearPref(script_pref);\n  base::RunLoop().RunUntilIdle();\n  const auto& cleared = web_contents->GetOrCreateWebPreferences();\n  // An explicit empty entry is needed to overwrite the old renderer mapping.\n  ASSERT_TRUE(cleared.serif_font_family_map.contains(\"Goth\"));\n  EXPECT_TRUE(cleared.serif_font_family_map.at(\"Goth\").empty());\n  EXPECT_EQ(u\"serif\", cleared.serif_font_family_map.at(blink::web_pref::kCommonScript));\n}\n#endif  // IS_ANDROID && ENABLE_DESKTOP_ANDROID_EXTENSIONS\n\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\nIN_PROC_BROWSER_TEST_F(PrefsTabHelperBrowserTest,\n"
- description: Format Android extension font preference changes
  regex:
    re_pattern: '\ \ const\ auto\&\ cleared\ =\ web_contents\->GetOrCreateWebPreferences\(\);\

      \ \ //\ An\ explicit\ empty\ entry\ is\ needed\ to\ overwrite\ the\ old\ renderer\ mapping\.\

      \ \ ASSERT_TRUE\(cleared\.serif_font_family_map\.contains\("Goth"\)\);\

      \ \ EXPECT_TRUE\(cleared\.serif_font_family_map\.at\("Goth"\)\.empty\(\)\);\

      \ \ EXPECT_EQ\(u"serif",\ cleared\.serif_font_family_map\.at\(blink::web_pref::kCommonScript\)\);\

      \}\

      \#endif\ \ //\ IS_ANDROID\ \&\&\ ENABLE_DESKTOP_ANDROID_EXTENSIONS\

      \

      \#if\ BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\

      '
    replace: "  const auto& cleared = web_contents->GetOrCreateWebPreferences();\n  // An explicit empty entry is needed to overwrite the old renderer mapping.\n  ASSERT_TRUE(cleared.serif_font_family_map.contains(\"Goth\"));\n  EXPECT_TRUE(cleared.serif_font_family_map.at(\"Goth\").empty());\n  EXPECT_EQ(u\"serif\",\n            cleared.serif_font_family_map.at(blink::web_pref::kCommonScript));\n}\n#endif  // IS_ANDROID && ENABLE_DESKTOP_ANDROID_EXTENSIONS\n\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n"
