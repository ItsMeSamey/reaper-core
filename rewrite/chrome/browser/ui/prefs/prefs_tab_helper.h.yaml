# Update live Android extension font preferences.
substitutions:
- description: Include the flag that controls Android extension font preference registration
  regex:
    re_pattern: \#include\ "content/public/browser/web_contents_user_data\.h"
    replace: '#include "content/public/browser/web_contents_user_data.h"

      #include "extensions/buildflags/buildflags.h"'
- description: Observe font families on Android only when extension font preferences exist
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

      \ \ base::CallbackListSubscription\ default_zoom_level_subscription_;\

      \ \ FontPrefChangeNotifier::Registrar\ font_change_registrar_;\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::CallbackListSubscription default_zoom_level_subscription_;\n#endif\n#if !BUILDFLAG(IS_ANDROID) || BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  FontPrefChangeNotifier::Registrar font_change_registrar_;\n#endif"
