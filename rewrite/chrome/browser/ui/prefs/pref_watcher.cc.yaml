substitutions:

  - description: "Observe animation policy changes for existing Android web contents."
    regex:
      pattern: "#if BUILDFLAG(ENABLE_EXTENSIONS)\n    prefs::kAnimationPolicy,"
      replace: "#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n    prefs::kAnimationPolicy,"
