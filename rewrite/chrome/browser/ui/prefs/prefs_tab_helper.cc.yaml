# Update live Android extension font preferences.
substitutions:
- description: Keep zoom desktop-only while reusing the font notifier for Android extensions
  regex:
    re_pattern: '\ \ \ \ //\ Unretained\ is\ safe\ because\ the\ registrar\ will\ be\ scoped\ to\ this\ class\.\

      \ \ \ \ font_change_registrar_\.Register\('
    replace: "#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if !BUILDFLAG(IS_ANDROID) || BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n    // Unretained is safe because the registrar will be scoped to this class.\n    font_change_registrar_.Register("
- description: Close the font preference registration guard without changing helper ownership
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::Unretained\(this\)\)\);\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      \

      \ \ \ \ PrefWatcher::Get\(profile_\)\->RegisterHelper\(this\);'
    replace: "                            base::Unretained(this)));\n#endif\n\n    PrefWatcher::Get(profile_)->RegisterHelper(this);"
- description: Clear stale per-script renderer mappings when an Android extension font override is removed
  regex:
    re_pattern: 'void\ PrefsTabHelper::NotifyWebkitPreferencesChanged\(\

      \ \ \ \ const\ std::string\&\ pref_name\)\ \{\

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      \ \ OnFontFamilyPrefChanged\(pref_name\);'
    replace: "void PrefsTabHelper::NotifyWebkitPreferencesChanged(\n    const std::string& pref_name) {\n#if !BUILDFLAG(IS_ANDROID) || BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  OnFontFamilyPrefChanged(pref_name);"
