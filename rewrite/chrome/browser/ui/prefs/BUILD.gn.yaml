# Update live Android extension font preferences.
substitutions:
- description: Export the buildflag header required by the public font observer declaration
  regex:
    re_pattern: '\ \ \ \ "//content/public/browser",\

      \ \ \ \ "//mojo/public/cpp/bindings",'
    replace: "    \"//content/public/browser\",\n    \"//extensions/buildflags\",\n    \"//mojo/public/cpp/bindings\","
