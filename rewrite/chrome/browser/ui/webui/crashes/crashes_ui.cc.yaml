# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\#include\ "chrome/browser/metrics/chrome_metrics_service_accessor\.h"\

      \#include\ "chrome/browser/metrics/metrics_reporting_state\.h"\

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/metrics/chrome_metrics_service_accessor.h"

      #include "chrome/browser/metrics/metrics_reporting_state.h"

      #endif

      '
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\ \ //\ Asynchronously\ requests\ a\ user\ triggered\ upload\.\ Called\ from\ JS\.\

      \ \ void\ HandleRequestSingleCrashUpload\(const\ base::ListValue\&\ args\);\

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Asynchronously requests a user triggered upload. Called from JS.\n  void HandleRequestSingleCrashUpload(const base::ListValue& args);\n#endif\n"
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\ \ web_ui\(\)\->RegisterMessageCallback\(\

      \ \ \ \ \ \ crash_reporter::kCrashesUIRequestSingleCrashUpload,\

      \ \ \ \ \ \ base::BindRepeating\(\&CrashesDOMHandler::HandleRequestSingleCrashUpload,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::Unretained\(this\)\)\);\

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  web_ui()->RegisterMessageCallback(\n      crash_reporter::kCrashesUIRequestSingleCrashUpload,\n      base::BindRepeating(&CrashesDOMHandler::HandleRequestSingleCrashUpload,\n                          base::Unretained(this)));\n#endif\n"
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ bool\ crash_reporting_enabled\ =\

      \ \ \ \ \ \ ChromeMetricsServiceAccessor::IsMetricsAndCrashReportingEnabled\(\);\

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  const bool crash_reporting_enabled = false;\n#else\n  bool crash_reporting_enabled =\n      ChromeMetricsServiceAccessor::IsMetricsAndCrashReportingEnabled();\n#endif\n"
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ bool\ manual_uploads_supported\ =\ false;\

      \#if\ BUILDFLAG\(IS_WIN\)\ \|\|\ BUILDFLAG\(IS_MAC\)\ \|\|\ BUILDFLAG\(IS_LINUX\)\ \|\|\ \\\

      \ \ \ \ BUILDFLAG\(IS_ANDROID\)\

      \ \ manual_uploads_supported\ =\ true;\

      \#endif\

      \ \ bool\ allow_manual_uploads\ =\

      \ \ \ \ \ \ manual_uploads_supported\ \&\&\

      \ \ \ \ \ \ \(crash_reporting_enabled\ \|\|\ !metrics::IsMetricsReportingPolicyManaged\(\)\);\

      \

      \ \ //\ Show\ crash\ reports\ regardless\ of\ \|crash_reporting_enabled\|\ when\ it\ is\

      \ \ //\ possible\ to\ manually\ upload\ reports\.\

      \ \ bool\ upload_list\ =\ manual_uploads_supported\ \|\|\ crash_reporting_enabled;\

      \

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  const bool allow_manual_uploads = false;\n  // The local database remains available without a sender or upload permission.\n  const bool upload_list = true;\n#else\n  bool manual_uploads_supported = false;\n#if BUILDFLAG(IS_WIN) || BUILDFLAG(IS_MAC) || BUILDFLAG(IS_LINUX) || \\\\\n    BUILDFLAG(IS_ANDROID)\n  manual_uploads_supported = true;\n#endif\n  bool allow_manual_uploads =\n      manual_uploads_supported &&\n      (crash_reporting_enabled || !metrics::IsMetricsReportingPolicyManaged());\n\n  // Show crash reports regardless of |crash_reporting_enabled| when it is\n  // possible to manually upload reports.\n  bool upload_list = manual_uploads_supported || crash_reporting_enabled;\n\n#endif\n\n"
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: 'void\ CrashesDOMHandler::HandleRequestSingleCrashUpload\(\

      \ \ \ \ const\ base::ListValue\&\ args\)\ \{\

      \ \ //\ Only\ allow\ manual\ uploads\ if\ crash\ uploads\ aren’t\ disabled\ by\ policy\.\

      \ \ if\ \(!ChromeMetricsServiceAccessor::IsMetricsAndCrashReportingEnabled\(\)\ \&\&\

      \ \ \ \ \ \ metrics::IsMetricsReportingPolicyManaged\(\)\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ std::string\ local_id\ =\ args\[0\]\.GetString\(\);\

      \ \ upload_list_\->RequestSingleUploadAsync\(local_id\);\

      \}\

      \

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid CrashesDOMHandler::HandleRequestSingleCrashUpload(\n    const base::ListValue& args) {\n  // Only allow manual uploads if crash uploads aren’t disabled by policy.\n  if (!ChromeMetricsServiceAccessor::IsMetricsAndCrashReportingEnabled() &&\n      metrics::IsMetricsReportingPolicyManaged()) {\n    return;\n  }\n\n  std::string local_id = args[0].GetString();\n  upload_list_->RequestSingleUploadAsync(local_id);\n}\n\n#endif\n"
