substitutions:
  - description: Brave additions to `source_set("searchbox_impl")`.
    regex:
      re_pattern: '(source_set\("searchbox_impl"\).*?)\n\}'
      re_flags: [DOTALL]
      replace: |-
        \1
          import("//brave/chromium_src/chrome/browser/ui/webui/cr_components/searchbox/sources.gni")
          deps += brave_chromium_src_chrome_browser_ui_webui_cr_components_searchbox_deps
        }

  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/cr_components/searchbox/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//components/tabs:public",\

        \ \ \ \ "//third_party/omnibox_proto",\

        \ \ \]\

        \ \ deps\ =\ \[\

        \ \ \ \ "//base",\

        \ \ \ \ "//chrome/browser/autocomplete",\

        '
      replace: "    \"//components/tabs:public\",\n    \"//third_party/omnibox_proto\",\n  ]\n  if (is_android) {\n    public_deps -= [ \"//chrome/browser/contextual_tasks\" ]\n  }\n  deps = [\n    \"//base\",\n    \"//chrome/browser/autocomplete\",\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/cr_components/searchbox/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//ui/gfx",\

        \ \ \ \ "//ui/webui/resources/cr_components/composebox:mojo_bindings",\

        \ \ \]\

        \ \ if\ \(!is_android\)\ \{\

        \ \ \ \ deps\ \+=\ \[\

        \ \ \ \ \ \ "//chrome/browser/ui/views/drive_picker_host:mojo_bindings",\

        '
      replace: "    \"//ui/gfx\",\n    \"//ui/webui/resources/cr_components/composebox:mojo_bindings\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//components/contextual_tasks/public\",\n      \"//components/contextual_tasks/public:query_contextualizer\",\n      \"//components/omnibox/composebox:mojo_bindings\",\n      \"//ui/webui/resources/cr_components/composebox:mojo_bindings\",\n    ]\n  }\n  if (!is_android) {\n    deps += [\n      \"//chrome/browser/ui/views/drive_picker_host:mojo_bindings\",\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/cr_components/searchbox/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//components/sessions",\

        \ \ \ \ "//components/vector_icons",\

        \ \ \]\

        \ \ if\ \(enable_lens_overlay_backend\)\ \{\

        \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/ui/lens:backend_logic_public"\ \]\

        \ \ \}\

        '
      replace: "    \"//components/sessions\",\n    \"//components/vector_icons\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/autocomplete:aim_eligibility_service\",\n      \"//chrome/browser/contextual_search\",\n      \"//chrome/browser/contextual_tasks\",\n      \"//chrome/browser/contextual_tasks:ui\",\n      \"//chrome/browser/contextual_tasks:user_data\",\n      \"//chrome/browser/ui/webui/new_tab_page/composebox/variations\",\n      \"//components/contextual_tasks/public:query_contextualizer\",\n      \"//components/omnibox/browser:fusebox_action_mojo_utils\",\n    ]\n  }\n  if (enable_lens_overlay_backend) {\n    deps += [ \"//chrome/browser/ui/lens:backend_logic_public\" ]\n  }\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/cr_components/searchbox/BUILD.gn'
    regex:
      re_pattern: '\ \ if\ \(enable_dice_support\)\ \{\

        \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/ui/views/search_ai_mode"\ \]\

        \ \ \}\

        \ \ import\("//brave/chromium_src/chrome/browser/ui/webui/cr_components/searchbox/sources\.gni"\)\

        \ \ deps\ \+=\ brave_chromium_src_chrome_browser_ui_webui_cr_components_searchbox_deps\

        \}\

        '
      replace: "  if (enable_dice_support) {\n    deps += [ \"//chrome/browser/ui/views/search_ai_mode\" ]\n  }\n  import(\n      \"//brave/chromium_src/chrome/browser/ui/webui/cr_components/searchbox/sources.gni\")\n  deps +=\n      brave_chromium_src_chrome_browser_ui_webui_cr_components_searchbox_deps\n}\n"
