substitutions:
- description: Move the survey-only feature include behind its platform boundary
  regex:
    pattern: '#include "base/feature_list.h"

      '
    replace: ''
  count: 1
- description: Include the platform predicate for the dedicated survey route
  regex:
    pattern: '#include "base/logging.h"

      '
    replace: '#include "base/logging.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Remove the survey-only include from common UI providers
  regex:
    pattern: '#include "components/segmentation_platform/public/features.h"

      '
    replace: ''
  count: 1
- description: Admit survey-only feature dependencies only on desktop
  regex:
    pattern: '#include "ui/webui/webui_util.h"

      '
    replace: '#include "ui/webui/webui_util.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "base/feature_list.h"

      #include "components/segmentation_platform/public/features.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Compile out the dedicated Android survey route and resource reference while retaining the ordinary internals
    page and desktop behavior
  regex:
    pattern: "  std::string path = web_ui->GetWebContents()->GetURL().GetPath();\n  if (path.starts_with(\"/survey\")) {\n\
      \    if (base::FeatureList::IsEnabled(\n            segmentation_platform::features::kSegmentationSurveyPage) &&\n \
      \       segmentation_platform::features::kSegmentationSurveyInternalsPage\n            .Get()) {\n      webui::SetupWebUIDataSource(\n\
      \          source, kSegmentationInternalsResources,\n          IDR_SEGMENTATION_INTERNALS_SEGMENTATION_SURVEY_HTML);\n\
      \    }\n  } else {\n    webui::SetupWebUIDataSource(\n        source, kSegmentationInternalsResources,\n        IDR_SEGMENTATION_INTERNALS_SEGMENTATION_INTERNALS_HTML);\n\
      \  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::string path = web_ui->GetWebContents()->GetURL().GetPath();\n  if (path.starts_with(\"\
      /survey\")) {\n    if (base::FeatureList::IsEnabled(\n            segmentation_platform::features::kSegmentationSurveyPage)\
      \ &&\n        segmentation_platform::features::kSegmentationSurveyInternalsPage\n            .Get()) {\n      webui::SetupWebUIDataSource(\n\
      \          source, kSegmentationInternalsResources,\n          IDR_SEGMENTATION_INTERNALS_SEGMENTATION_SURVEY_HTML);\n\
      \    }\n    return;\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n  webui::SetupWebUIDataSource(\n      source, kSegmentationInternalsResources,\n\
      \      IDR_SEGMENTATION_INTERNALS_SEGMENTATION_INTERNALS_HTML);\n"
  count: 1
