# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/chrome_untrusted_web_ui_configs.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/ui/webui/chrome_untrusted_web_ui_configs\.h"\

      \

      \#include\ "build/android_buildflags\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/common/buildflags\.h"\

      \#include\ "content/public/browser/webui_config_map\.h"\

      \#include\ "printing/buildflags/buildflags\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/ui/webui/chrome_untrusted_web_ui_configs.h"

      #include "build/build_config.h"


      #include "build/android_buildflags.h"

      #include "chrome/common/buildflags.h"

      #include "content/public/browser/webui_config_map.h"

      #include "printing/buildflags/buildflags.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/chrome_untrusted_web_ui_configs.cc'
  regex:
    re_pattern: '\#if\ defined\(TOOLKIT_VIEWS\)\

      \#include\ "chrome/browser/ui/webui/data_sharing/data_sharing_ui\.h"\

      \#include\ "chrome/browser/ui/webui/side_panel/read_anything/read_anything_untrusted_ui\.h"\

      \#include\ "components/compose/buildflags\.h"\

      \#if\ BUILDFLAG\(ENABLE_COMPOSE\)\

      \#include\ "chrome/browser/ui/webui/compose/compose_untrusted_ui\.h"\

      \#endif\ \ //\ BUILDFLAG\(ENABLE_COMPOSE\)\

      \#include\ "chrome/browser/glic/selection/selection_overlay_untrusted_ui\.h"\

      \#include\ "chrome/browser/ui/lens/lens_overlay_untrusted_ui\.h"\

      \#include\ "chrome/browser/ui/lens/lens_side_panel_untrusted_ui\.h"\

      \#endif\ \ //\ defined\(TOOLKIT_VIEWS\)\

      \

      \#if\ defined\(TOOLKIT_VIEWS\)\ \|\|\ BUILDFLAG\(IS_DESKTOP_ANDROID\)\

      \#include\ "chrome/browser/ui/webui/ai_overlay_dialog/ai_overlay_dialog_untrusted_ui\.h"\

      \#endif\ \ //\ defined\(TOOLKIT_VIEWS\)\ \|\|\ BUILDFLAG\(IS_DESKTOP_ANDROID\)\

      \

      \#if\ BUILDFLAG\(ENABLE_PRINT_PREVIEW\)\

      '
    replace: '#if defined(TOOLKIT_VIEWS)

      #include "chrome/browser/ui/webui/data_sharing/data_sharing_ui.h"

      #include "chrome/browser/ui/webui/side_panel/read_anything/read_anything_untrusted_ui.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/compose/buildflags.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if BUILDFLAG(ENABLE_COMPOSE)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/webui/compose/compose_untrusted_ui.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #endif  // BUILDFLAG(ENABLE_COMPOSE)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/selection/selection_overlay_untrusted_ui.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/lens/lens_overlay_untrusted_ui.h"

      #include "chrome/browser/ui/lens/lens_side_panel_untrusted_ui.h"

      #endif  // defined(TOOLKIT_VIEWS)


      #if defined(TOOLKIT_VIEWS) || BUILDFLAG(IS_DESKTOP_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/webui/ai_overlay_dialog/ai_overlay_dialog_untrusted_ui.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #endif  // defined(TOOLKIT_VIEWS) || BUILDFLAG(IS_DESKTOP_ANDROID)


      #if BUILDFLAG(ENABLE_PRINT_PREVIEW)

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/chrome_untrusted_web_ui_configs.cc'
  regex:
    re_pattern: '\ \ map\.AddUntrustedWebUIConfig\(std::make_unique<DataSharingUIConfig>\(\)\);\

      \

      \#if\ BUILDFLAG\(ENABLE_COMPOSE\)\

      \ \ map\.AddUntrustedWebUIConfig\(std::make_unique<ComposeUIUntrustedConfig>\(\)\);\

      \#endif\ \ //\ BUILDFLAG\(ENABLE_COMPOSE\)\

      \

      \ \ map\.AddUntrustedWebUIConfig\(\

      \ \ \ \ \ \ std::make_unique<glic::SelectionOverlayUntrustedUIConfig>\(\)\);\

      \#endif\ \ //\ defined\(TOOLKIT_VIEWS\)\

      \

      \#if\ defined\(TOOLKIT_VIEWS\)\ \|\|\ BUILDFLAG\(IS_DESKTOP_ANDROID\)\

      \ \ map\.AddUntrustedWebUIConfig\(\

      \ \ \ \ \ \ std::make_unique<ttc::AiOverlayDialogUntrustedUIConfig>\(\)\);\

      \#endif\ \ //\ defined\(TOOLKIT_VIEWS\)\ \|\|\ BUILDFLAG\(IS_DESKTOP_ANDROID\)\

      \

      \#if\ BUILDFLAG\(ENABLE_PRINT_PREVIEW\)\

      '
    replace: "  map.AddUntrustedWebUIConfig(std::make_unique<DataSharingUIConfig>());\n\n#if BUILDFLAG(ENABLE_COMPOSE)\n#if !BUILDFLAG(IS_ANDROID)\n  map.AddUntrustedWebUIConfig(std::make_unique<ComposeUIUntrustedConfig>());\n#endif  // !BUILDFLAG(IS_ANDROID)\n#endif  // BUILDFLAG(ENABLE_COMPOSE)\n\n#if !BUILDFLAG(IS_ANDROID)\n  map.AddUntrustedWebUIConfig(\n      std::make_unique<glic::SelectionOverlayUntrustedUIConfig>());\n#endif  // !BUILDFLAG(IS_ANDROID)\n#endif  // defined(TOOLKIT_VIEWS)\n\n#if defined(TOOLKIT_VIEWS) || BUILDFLAG(IS_DESKTOP_ANDROID)\n#if !BUILDFLAG(IS_ANDROID)\n  map.AddUntrustedWebUIConfig(\n      std::make_unique<ttc::AiOverlayDialogUntrustedUIConfig>());\n#endif  // !BUILDFLAG(IS_ANDROID)\n#endif  // defined(TOOLKIT_VIEWS) || BUILDFLAG(IS_DESKTOP_ANDROID)\n\n#if BUILDFLAG(ENABLE_PRINT_PREVIEW)\n"

# Lens coupled extra production source closure; V2 map declaration matches desktop-only consumers.
- description: "Lens extra: Android Lens JNI/overlay implementation edge 0"
  regex:
    re_pattern: "\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\#include\\ \"chrome/browser/ui/android/lens/lens_overlay_untrusted_ui_android\\.h\"\\\n\\#endif\\ \\ //\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\\n"
    replace: ""
  count: 1
- description: "Lens extra: Android Lens JNI/overlay implementation edge 1"
  regex:
    re_pattern: "\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\ \\ map\\.AddUntrustedWebUIConfig\\(\\\n\\ \\ \\ \\ \\ \\ std::make_unique<lens::LensOverlayUntrustedUIAndroidConfig>\\(\\)\\);\\\n\\#else\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "Lens extra: Match map declaration to remaining Views, print-preview and non-Android registration uses"
  regex:
    re_pattern: "\\#if\\ defined\\(TOOLKIT_VIEWS\\)\\ \\|\\|\\ BUILDFLAG\\(ENABLE_PRINT_PREVIEW\\)\\ \\|\\|\\ \\\\\\\n\\ \\ \\ \\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\ \\ auto\\&\\ map\\ =\\ content::WebUIConfigMap::GetInstance\\(\\);\\\n\\#endif\\ \\ //\\ defined\\(TOOLKIT_VIEWS\\)\\ \\|\\|\\ BUILDFLAG\\(ENABLE_PRINT_PREVIEW\\)\\ \\|\\|\\\n\\ \\ \\ \\ \\ \\ \\ \\ //\\ BUILDFLAG\\(IS_ANDROID\\)\\\n"
    replace: "#if defined(TOOLKIT_VIEWS) || BUILDFLAG(ENABLE_PRINT_PREVIEW) || \\\\\n    !BUILDFLAG(IS_ANDROID)\n  auto& map = content::WebUIConfigMap::GetInstance();\n#endif  // defined(TOOLKIT_VIEWS) || BUILDFLAG(ENABLE_PRINT_PREVIEW) ||\n        // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
