substitutions:
- description: Own Android platform macro for Mojo callback regression test
  regex:
    pattern: '#include "base/values.h"

      '
    replace: '#include "base/values.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Verify Android Mojo reporting response completes without report services or generator code
  regex:
    pattern: TEST_F(ConnectorsInternalsPageHandlerTest, GetProvisioningDomainState) {
    replace: "#if BUILDFLAG(IS_ANDROID)\nTEST_F(ConnectorsInternalsPageHandlerTest, SignalsReportingUnavailableCompletes)\
      \ {\n  base::test::TestFuture<connectors_internals::mojom::SignalsReportingStatePtr>\n      future;\n  page_handler_->GetSignalsReportingState(future.GetCallback());\n\
      \  task_environment_.RunUntilIdle();\n  ASSERT_TRUE(future.IsReady());\n  auto state = future.Take();\n  ASSERT_TRUE(state);\n\
      \  ASSERT_TRUE(state->error_info.has_value());\n  EXPECT_FALSE(state->error_info->empty());\n  EXPECT_FALSE(state->status_report_enabled);\n\
      \  EXPECT_FALSE(state->signals_report_enabled);\n  EXPECT_FALSE(state->can_collect_all_fields);\n  EXPECT_TRUE(state->last_upload_attempt_timestamp.empty());\n\
      \  EXPECT_TRUE(state->last_upload_success_timestamp.empty());\n  EXPECT_TRUE(state->last_signals_upload_config.empty());\n\
      \  EXPECT_FALSE(state->signals_json.has_value());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nTEST_F(ConnectorsInternalsPageHandlerTest,\
      \ GetProvisioningDomainState) {"
  count: 1
