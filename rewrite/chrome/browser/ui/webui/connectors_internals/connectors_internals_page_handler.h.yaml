substitutions:
- description: Omit Android report queue implementation dependency
  regex:
    pattern: '#include "components/enterprise/browser/reporting/report_request.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/report_request.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android report result callback declaration
  regex:
    pattern: "  void OnReportGenerated(\n      GetSignalsReportingStateCallback callback,\n      connectors_internals::mojom::SignalsReportingStatePtr\
      \ state,\n      base::expected<enterprise_reporting::ReportRequestQueue,\n                     enterprise_reporting::ReportGenerationError>\
      \ result);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void OnReportGenerated(\n      GetSignalsReportingStateCallback callback,\n  \
      \    connectors_internals::mojom::SignalsReportingStatePtr state,\n      base::expected<enterprise_reporting::ReportRequestQueue,\n\
      \                     enterprise_reporting::ReportGenerationError> result);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove Android owned collector and incomplete-type destruction dependency
  regex:
    pattern: "  std::unique_ptr<enterprise_reporting::ChromeProfileRequestGenerator>\n      request_generator_;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<enterprise_reporting::ChromeProfileRequestGenerator>\n      request_generator_;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
