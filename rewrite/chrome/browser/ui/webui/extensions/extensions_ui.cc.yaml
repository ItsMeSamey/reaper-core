substitutions:
  - description: |
      Add Brave's extensions resources to the WebUI data source.
    regex:
      re_pattern:
        '(content::WebUIDataSource\*
        CreateAndAddExtensionsSource\([^{]*\{.+?\n)(  return source;)'
      re_flags: [DOTALL]
      replace: |-
        \1  BraveAddExtensionsResources(source, profile);
        \2
  - description: |
      Use Brave's Chrome Web Store item string.
    regex:
      pattern: 'IDS_EXTENSIONS_ITEM_CHROME_WEB_STORE'
      replace: 'IDS_EXTENSIONS_BRAVE_ITEM_CHROME_WEB_STORE'
  - description: |
      Use Brave's webstore item-source string.
    regex:
      pattern: 'IDS_EXTENSIONS_ITEM_SOURCE_WEBSTORE'
      replace: 'IDS_EXTENSIONS_BRAVE_ITEM_SOURCE_WEBSTORE'
  - description: "Exclude developer AI promotion localization on Android."
    regex:
      pattern: "      {\"sidebarDocsPromo\", IDS_EXTENSIONS_MODERN_WEB_GUIDANCE_PROMO},\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n      {\"sidebarDocsPromo\", IDS_EXTENSIONS_MODERN_WEB_GUIDANCE_PROMO},\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Exclude developer AI promotion URL formatting on Android."
    regex:
      pattern: "  source->AddString(\n      \"modernWebGuidanceURL\",\n      base::ASCIIToUTF16(google_util::AppendGoogleLocaleParam(\n                             extension_urls::AppendUtmSource(\n                                 extension_urls::GetModernWebGuidanceURL(),\n                                 extension_urls::kExtensionsSidebarUtmSource),\n                             g_browser_process->GetApplicationLocale())\n                             .spec()));\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  source->AddString(\n      \"modernWebGuidanceURL\",\n      base::ASCIIToUTF16(google_util::AppendGoogleLocaleParam(\n                             extension_urls::AppendUtmSource(\n                                 extension_urls::GetModernWebGuidanceURL(),\n                                 extension_urls::kExtensionsSidebarUtmSource),\n                             g_browser_process->GetApplicationLocale())\n                             .spec()));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Android explicit local CRX picker and ordinary result handling
    regex:
      pattern: "      {\"itemSuspiciousInstallLearnMore\",\n       IDS_EXTENSIONS_ADDED_WITHOUT_KNOWLEDGE_LEARN_MORE},\n      {\"toolbarDevMode\", IDS_EXTENSIONS_DEVELOPER_MODE},\n      {\"toolbarLoadUnpacked\", IDS_EXTENSIONS_TOOLBAR_LOAD_UNPACKED},\n      {\"toolbarLoadUnpackedDone\", IDS_EXTENSIONS_TOOLBAR_LOAD_UNPACKED_DONE},\n      {\"toolbarPack\", IDS_EXTENSIONS_TOOLBAR_PACK},\n"
      replace: "      {\"itemSuspiciousInstallLearnMore\",\n       IDS_EXTENSIONS_ADDED_WITHOUT_KNOWLEDGE_LEARN_MORE},\n      {\"toolbarDevMode\", IDS_EXTENSIONS_DEVELOPER_MODE},\n#if BUILDFLAG(IS_ANDROID)\n      {\"toolbarInstallCrx\", IDS_EXTENSIONS_INSTALL_CRX},\n      {\"toolbarInstallCrxDone\", IDS_EXTENSIONS_INSTALL_CRX_DONE},\n#endif\n      {\"toolbarLoadUnpacked\", IDS_EXTENSIONS_TOOLBAR_LOAD_UNPACKED},\n      {\"toolbarLoadUnpackedDone\", IDS_EXTENSIONS_TOOLBAR_LOAD_UNPACKED_DONE},\n      {\"toolbarPack\", IDS_EXTENSIONS_TOOLBAR_PACK},\n"
    count: 1
  - description: Recover Android extension manager initialization with explicit retry and retained successful data
    regex:
      re_pattern: '\ \ \ \ \ \ \{"loadErrorFileLabel",\ IDS_EXTENSIONS_LOAD_ERROR_FILE_LABEL\},\

        \ \ \ \ \ \ \{"loadErrorErrorLabel",\ IDS_EXTENSIONS_LOAD_ERROR_ERROR_LABEL\},\

        \ \ \ \ \ \ \{"loadErrorRetry",\ IDS_EXTENSIONS_LOAD_ERROR_RETRY\},\

        \ \ \ \ \ \ \{"loadingActivities",\ IDS_EXTENSIONS_LOADING_ACTIVITIES\},\

        \ \ \ \ \ \ \{"matchingRestrictedSitesAllow",\

        \ \ \ \ \ \ \ IDS_EXTENSIONS_MATCHING_RESTRICTED_SITES_ALLOW\},\

        '
      replace: "      {\"loadErrorFileLabel\", IDS_EXTENSIONS_LOAD_ERROR_FILE_LABEL},\n      {\"loadErrorErrorLabel\", IDS_EXTENSIONS_LOAD_ERROR_ERROR_LABEL},\n      {\"loadErrorRetry\", IDS_EXTENSIONS_LOAD_ERROR_RETRY},\n#if BUILDFLAG(IS_ANDROID)\n      {\"managerLoading\", IDS_EXTENSIONS_MANAGER_LOADING},\n      {\"managerLoadError\", IDS_EXTENSIONS_MANAGER_LOAD_ERROR},\n#endif\n      {\"loadingActivities\", IDS_EXTENSIONS_LOADING_ACTIVITIES},\n      {\"matchingRestrictedSitesAllow\",\n       IDS_EXTENSIONS_MATCHING_RESTRICTED_SITES_ALLOW},\n"

  - description: Report interrupted Android local import without resuming an invalid sender
    regex:
      re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

        \ \ \ \ \ \ \{"toolbarInstallCrx",\ IDS_EXTENSIONS_INSTALL_CRX\},\

        \ \ \ \ \ \ \{"toolbarInstallCrxDone",\ IDS_EXTENSIONS_INSTALL_CRX_DONE\},\

        \#endif\

        \ \ \ \ \ \ \{"toolbarLoadUnpacked",\ IDS_EXTENSIONS_TOOLBAR_LOAD_UNPACKED\},\

        \ \ \ \ \ \ \{"toolbarLoadUnpackedDone",\ IDS_EXTENSIONS_TOOLBAR_LOAD_UNPACKED_DONE\},\

        '
      replace: "#if BUILDFLAG(IS_ANDROID)\n      {\"toolbarInstallCrx\", IDS_EXTENSIONS_INSTALL_CRX},\n      {\"toolbarInstallCrxDone\", IDS_EXTENSIONS_INSTALL_CRX_DONE},\n      {\"toolbarImportInterrupted\", IDS_EXTENSIONS_IMPORT_INTERRUPTED},\n#endif\n      {\"toolbarLoadUnpacked\", IDS_EXTENSIONS_TOOLBAR_LOAD_UNPACKED},\n      {\"toolbarLoadUnpackedDone\", IDS_EXTENSIONS_TOOLBAR_LOAD_UNPACKED_DONE},\n"
    count: 1
