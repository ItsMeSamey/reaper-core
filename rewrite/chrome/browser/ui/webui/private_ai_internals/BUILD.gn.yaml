# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/private_ai_internals/BUILD.gn'
  regex:
    re_pattern: '\#\ Copyright\ 2025\ The\ Chromium\ Authors\

      \#\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      \#\ found\ in\ the\ LICENSE\ file\.\

      \

      source_set\("private_ai_internals"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "private_ai_internals_ui\.cc",\

      \ \ \ \ "private_ai_internals_ui\.h",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//chrome:extra_resources",\

      \ \ \ \ "//chrome/browser/private_ai",\

      \ \ \ \ "//chrome/browser/profiles",\

      \ \ \ \ "//chrome/common",\

      \ \ \ \ "//components/private_ai",\

      \ \ \ \ "//components/private_ai/content",\

      \ \ \ \ "//components/private_ai/private_ai_internals/resources",\

      \ \ \ \ "//components/private_ai/private_ai_internals/webui:mojo_bindings",\

      \ \ \ \ "//components/private_ai/private_ai_internals/webui:page_handler",\

      \ \ \ \ "//components/private_ai/private_ai_internals/webui:url_constants",\

      \ \ \ \ "//components/version_info",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//ui/webui",\

      \ \ \]\

      \}\

      '
    replace: "if (!is_android) {\n  # Copyright 2025 The Chromium Authors\n  # Use of this source code is governed by a BSD-style license that can be\n  # found in the LICENSE file.\n\n  source_set(\"private_ai_internals\") {\n    sources = [\n      \"private_ai_internals_ui.cc\",\n      \"private_ai_internals_ui.h\",\n    ]\n\n    deps = [\n      \"//chrome:extra_resources\",\n      \"//chrome/browser/private_ai\",\n      \"//chrome/browser/profiles\",\n      \"//chrome/common\",\n      \"//components/private_ai\",\n      \"//components/private_ai/content\",\n      \"//components/private_ai/private_ai_internals/resources\",\n      \"//components/private_ai/private_ai_internals/webui:mojo_bindings\",\n      \"//components/private_ai/private_ai_internals/webui:page_handler\",\n      \"//components/private_ai/private_ai_internals/webui:url_constants\",\n      \"//components/version_info\",\n      \"//content/public/browser\",\n      \"//ui/webui\",\n    ]\n  }\n}\n"
