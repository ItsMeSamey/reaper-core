substitutions:
- description: "Preserve reviewed Android source projection for chrome/browser/ui/webui/metrics_internals/BUILD.gn (operation 1)."
  regex:
    re_pattern: 'import\("//components/metrics/structured/buildflags/buildflags\.gni"\)\

      \

      source_set\("metrics_internals"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "field_trials_handler\.cc",\

      \ \ \ \ "field_trials_handler\.h",\

      \ \ \ \ "metrics_internals_features\.cc",\

      \ \ \ \ "metrics_internals_features\.h",\

      \ \ \ \ "metrics_internals_handler\.cc",\

      \ \ \ \ "metrics_internals_handler\.h",\

      \ \ \ \ "metrics_internals_ui\.cc",\

      \ \ \ \ "metrics_internals_ui\.h",\

      \ \ \ \ "runtime_mutable_features_handler\.cc",\

      \ \ \ \ "runtime_mutable_features_handler\.h",\

      \ \ \]\

      \ \ public_deps\ =\ \[\ "//content/public/browser"\ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//chrome/browser:browser_process",\

      \ \ \ \ "//chrome/browser/lifetime",\

      \ \ \ \ "//chrome/browser/profiles:profile",\

      \ \ \ \ "//chrome/browser/signin",\

      \ \ \ \ "//chrome/common",\

      \ \ \ \ "//components/metrics",\

      \ \ \ \ "//components/metrics/debug",\

      \ \ \ \ "//components/metrics/debug:resources",\

      \ \ \ \ "//components/metrics/structured/buildflags",\

      \ \ \ \ "//components/metrics_services_manager",\

      \ \ \ \ "//components/signin/public/identity_manager",\

      \ \ \ \ "//components/ukm",\

      \ \ \ \ "//components/variations",\

      \ \ \ \ "//components/variations/service",\

      \ \ \ \ "//content/public/common",\

      \ \ \ \ "//google_apis",\

      \ \ \ \ "//ui/webui",\

      \ \ \]\

      \

      \ \ if\ \(structured_metrics_debug_enabled\)\ \{\

      \ \ \ \ sources\ \+=\ \[\

      \ \ \ \ \ \ "structured_metrics_internals_handler\.cc",\

      \ \ \ \ \ \ "structured_metrics_internals_handler\.h",\

      \ \ \ \ \]\

      \ \ \ \ deps\ \+=\ \[\ "//components/metrics/debug/structured:debug"\ \]\

      \ \ \}\

      \}\

      '
    replace: "import(\"//components/metrics/structured/buildflags/buildflags.gni\")\n\nsource_set(\"metrics_internals\") {\n  if (!is_android) {\n    sources = [\n      \"field_trials_handler.cc\",\n      \"field_trials_handler.h\",\n      \"metrics_internals_features.cc\",\n      \"metrics_internals_features.h\",\n      \"metrics_internals_handler.cc\",\n      \"metrics_internals_handler.h\",\n      \"metrics_internals_ui.cc\",\n      \"metrics_internals_ui.h\",\n      \"runtime_mutable_features_handler.cc\",\n      \"runtime_mutable_features_handler.h\",\n    ]\n    public_deps = [ \"//content/public/browser\" ]\n    deps = [\n      \"//base\",\n      \"//chrome/browser:browser_process\",\n      \"//chrome/browser/lifetime\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/signin\",\n      \"//chrome/common\",\n      \"//components/metrics\",\n      \"//components/metrics/debug\",\n      \"//components/metrics/debug:resources\",\n      \"//components/metrics/structured/buildflags\",\n      \"//components/metrics_services_manager\",\n      \"//components/signin/public/identity_manager\",\n      \"//components/ukm\",\n      \"//components/variations\",\n      \"//components/variations/service\",\n      \"//content/public/common\",\n      \"//google_apis\",\n      \"//ui/webui\",\n    ]\n\n    if (structured_metrics_debug_enabled) {\n      sources += [\n        \"structured_metrics_internals_handler.cc\",\n        \"structured_metrics_internals_handler.h\",\n      ]\n      deps += [ \"//components/metrics/debug/structured:debug\" ]\n    }\n  }\n}\n"
