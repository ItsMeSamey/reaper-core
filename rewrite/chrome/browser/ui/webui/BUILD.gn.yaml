    replace: "      \"//chrome/browser/ui/webui/signin\",\n      \"//chrome/browser/ui/webui/skills\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/ui/webui/skills\" ]\n    }\n\n    if (!is_chromeos) {\n      deps += [\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/BUILD.gn'
  regex:
    re_pattern: '\

      \ \ if\ \(enable_compose\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/ui/webui/compose"\ \]\

