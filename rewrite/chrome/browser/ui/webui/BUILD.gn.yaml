# Android Chromium Discover implementation exclusion.
substitutions:
- description: Brave additions to `source_set("configs")`.
  regex:
    re_pattern: (source_set\("configs"\).*?)\n\}
    re_flags:
    - DOTALL
    replace: "\\1\n  import(\"//brave/browser/ui/webui/sources.gni\")\n  deps += brave_browser_ui_webui_configs_deps\n}"
- description: 'Define `favicon_source` on regular Android too.


    Upstream only builds FaviconSource where it was previously compiled into

    //chrome/browser/ui:ui, which excludes regular Android. Brave''s WebUIs

    (wallet, AI chat, rewards, etc.) need FaviconSource on Android; the

    chromium_src override of favicon_source.cc maps the default favicon

    resources so the source compiles there.

    '
  regex:
    re_pattern: if \(([^)]+)\) \{\n  source_set\("favicon_source"\)
    replace: "if (\\1 || is_android) {\n  source_set(\"favicon_source\")"
- description: Exclude Android Discover implementation from the production native or resource graph
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/ui/webui/feed_internals",\

      '
    replace: ''
- description: "Preserve reviewed Android source projection for chrome/browser/ui/webui/BUILD.gn (operation 4)."
  regex:
    re_pattern: '\ \ \ \ "//third_party/abseil\-cpp:absl",\

      \ \ \ \ "//ui/webui:buildflags",\

      \ \ \]\

      \

      \ \ if\ \(is_win\ \|\|\ is_chromeos\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/ui/webui/signin:inline_login"\ \]\

      '
    replace: "    \"//third_party/abseil-cpp:absl\",\n    \"//ui/webui:buildflags\",\n  ]\n\n  if (is_android) {\n    deps -= [ \"//chrome/browser/ui/webui/metrics_internals\" ]\n  }\n\n  if (is_win || is_chromeos) {\n    deps += [ \"//chrome/browser/ui/webui/signin:inline_login\" ]\n"

- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//third_party/abseil\-cpp:absl",\

      \ \ \ \ "//ui/webui:buildflags",\

      \ \ \]\

      \

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ deps\ \-=\ \[\ "//chrome/browser/ui/webui/metrics_internals"\ \]\

      '
    replace: "    \"//third_party/abseil-cpp:absl\",\n    \"//ui/webui:buildflags\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/actor/ui:actor_overlay\",\n      \"//chrome/browser/contextual_tasks:ui\",\n      \"//chrome/browser/glic\",\n      \"//chrome/browser/glic:impl\",\n      \"//chrome/browser/ui/webui/actor_internals\",\n      \"//chrome/browser/ui/webui/context_hub\",\n    ]\n  }\n\n  if (is_android) {\n    deps -= [ \"//chrome/browser/ui/webui/metrics_internals\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/ui/webui/webui_toolbar",\

      \ \ \ \ \ \ "//chrome/browser/ui/webui_browser",\

      \ \ \ \ \]\

      \

      \ \ \ \ if\ \(!is_chromeos\)\ \{\

      \ \ \ \ \ \ deps\ \+=\ \[\

      '
    replace: "      \"//chrome/browser/ui/webui/webui_toolbar\",\n      \"//chrome/browser/ui/webui_browser\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/actor/ui:actor_overlay_web_view\" ]\n    }\n\n    if (!is_chromeos) {\n      deps += [\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/ui/webui/signin",\

      \ \ \ \ \ \ "//chrome/browser/ui/webui/skills",\

      \ \ \ \ \]\

      \

