- description: "Android Finds compile-out: Remove Android Finds dependency or source"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \"//chrome/browser/ui/webui/chrome_finds_internals\",\\\n"
    replace: ""
  count: 1
- description: Remove Notebook WebUI configuration and provider from Android
  regex:
    re_pattern: '\ \ \ \ deps\ \-=\ \[\ "//chrome/browser/ui/webui/private_ai_internals"\
      \]\

      '
    replace: "    deps -= [\n      \"//chrome/browser/ui/webui/private_ai_internals\"\
      ,\n      \"//chrome/browser/ui/webui/notebooks_internals:notebooks_internals_ui_config\"\
      ,\n      \"//components/notebooks/internals/webui\",\n    ]\n"
  count: 1
- description: Exclude the Android shopping backend from configs while preserving shared providers and desktop
  regex:
    pattern: "\n  if (enable_webui_ntp) {\n    deps += [ \"//chrome/browser/ui/webui/ntp_microsoft_auth\" ]\n  }\n  import(\"\
      //brave/browser/ui/webui/sources.gni\")\n  deps += brave_browser_ui_webui_configs_deps\n}"
    replace: "\n  if (enable_webui_ntp) {\n    deps += [ \"//chrome/browser/ui/webui/ntp_microsoft_auth\" ]\n  }\n  import(\"\
      //brave/browser/ui/webui/sources.gni\")\n  deps += brave_browser_ui_webui_configs_deps\n  if (is_android) {\n    deps\
      \ -= [\n      \"//chrome/browser/ui/webui/commerce:commerce_internals_ui_config\",\n    ]\n  }\n\n}"
  count: 1
- description: Remove only the dedicated Browser Actuator configs Android admission.
  regex:
    pattern: "    \"//components/webui/user_actions\",\n    \"//skia\",\n    \"//third_party/abseil-cpp:absl\",\n    \"//ui/webui:buildflags\"\
      ,\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/ui/webui/private_ai_internals\",\n      \"//chrome/browser/ui/webui/notebooks_internals:notebooks_internals_ui_config\"\
      ,\n"
    replace: "    \"//components/webui/user_actions\",\n    \"//skia\",\n    \"//third_party/abseil-cpp:absl\",\n    \"//ui/webui:buildflags\"\
      ,\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/browser_actuator/internals\",\n    ]\n  }\n  if\
      \ (is_android) {\n    deps -= [\n      \"//chrome/browser/ui/webui/private_ai_internals\",\n      \"//chrome/browser/ui/webui/notebooks_internals:notebooks_internals_ui_config\"\
      ,\n"
  count: 1

