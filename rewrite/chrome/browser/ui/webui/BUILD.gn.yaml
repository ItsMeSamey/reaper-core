    replace: "    \"//ui/gfx\",\n    \"//ui/gfx/codec\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/contextual_tasks:ui\" ]\n  }\n\n  if (is_android) {\n    deps += [\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ "//components/signin/public/base:signin_switches",\

      \ \ \ \ \ \ \ \ "//components/variations",\

      \ \ \ \ \ \ \]\

      \

      \ \ \ \ \ \ if\ \(is_chromeos\)\ \{\

      \ \ \ \ \ \ \ \ deps\ \+=\ \[\

      '
    replace: "        \"//components/signin/public/base:signin_switches\",\n        \"//components/variations\",\n      ]\n      if (is_android) {\n        deps -= [ \"//chrome/browser/contextual_cueing\" ]\n      }\n\n      if (is_chromeos) {\n        deps += [\n"

- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/webui:buildflags",\

      \ \ \]\

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ deps\ \-=\ \[\

      \ \ \ \ \ \ "//chrome/browser/actor/ui:actor_overlay",\

      \ \ \ \ \ \ "//chrome/browser/contextual_tasks:ui",\

