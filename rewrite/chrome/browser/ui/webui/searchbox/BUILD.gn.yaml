rome/browser/ui/webui/omnibox_popup/mojom\" ]\n  }\n}\n\n# TODO(b/502297163): Enable tests.\nif (!is_android) {\n  source_set(\"browser_tests\") {\n    testonly = true\n    defines = [ \"HAS_OUT_OF_PROC_TEST_RUNNER\" ]\n    sources = [\n      \"contextual_searchbox_handler_browsertest.cc\",\n      \"realbox_handler_browsertest.cc\",\n    ]\n    deps = [\n      \":searchbox\",\n      \":searchbox_test_utils\",\n      \"//chrome/browser/contextual_search\",\n      \"//chrome/browser/preloading\",\n      \"//chrome/browser/preloading/prefetch:browser_tests\",\n      \"//chrome/browser/preloading/prefetch/search_prefetch\",\n      \"//chrome/browser/preloading/prefetch/search_prefetch:field_trial_settings\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/search_engines\",\n      \"//chrome/browser/ui\",\n      \"//chrome/browser/ui/contextual_search\",\n      \"//chrome/browser/ui/omnibox\",\n      \"//chrome/browser/ui/webui/cr_components/searchbox\",\n      \"//chrome/test:test_support\",\n      \"//chrome/test:test_support_ui\",\n      \"//components/contextual_search:public\",\n      \"//components/lens\",\n      \"//components/omnibox/browser\",\n      \"//components/omnibox/browser:test_support\",\n      \"//components/omnibox/common\",\n      \"//components/omnibox/composebox:mojo_bindings\",\n      \"//components/search_engines\",\n      \"//content/test:test_support\",\n      \"//mojo/public/cpp/bindings\",\n      \"//testing/gmock\",\n      \"//third_party/metrics_proto\",\n      \"//ui/base\",\n      \"//ui/display\",\n      \"//ui/gfx\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/contextual_search\",\n        \"//components/omnibox/composebox:mojo_bindings\",\n      ]\n    }\n    if (enable_dice_support) {\n      deps += [ \"//chrome/browser/ui/views/search_ai_mode\" ]\n    }\n  }\n}\n\nsource_set(\"unit_tests\") {\n  testonly = true\n  sources = []\n\n  # Common to contextual_searchbox_handler_unittest.cc (!is_android) and\n  # searchbox_handler_unittest.cc (enable_webui_ntp) below.\n  deps = [\n    \":searchbox_test_utils\",\n    \"//chrome/browser/autocomplete\",\n    \"//chrome/browser/autocomplete:aim_eligibility_service\",\n    \"//chrome/browser/contextual_search\",\n    \"//chrome/browser/tab_list\",\n    \"//chrome/browser/tab_list:test_support\",\n    \"//chrome/browser/ui:test_support\",\n    \"//chrome/browser/ui/contextual_search\",\n    \"//chrome/browser/ui/tabs/alert:tab_alert\",\n    \"//chrome/browser/ui/webui:webui_util\",\n    \"//chrome/browser/ui/webui/new_tab_page/composebox/variations\",\n    \"//components/contextual_search:test_support\",\n    \"//components/omnibox/browser\",\n    \"//components/omnibox/browser:test_support\",\n    \"//components/omnibox/common\",\n    \"//components/search\",\n    \"//components/tabs:test_support\",\n    \"//content/test:test_support\",\n    \"//testing/gtest\",\n    \"//ui/base\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/autocomplete:aim_eligibility_service\",\n      \"//chrome/browser/contextual_search\",\n      \"//chrome/browser/ui/webui/new_tab_page/composebox/variations\",\n    ]\n  }\n\n  if (!is_android) {\n    sources += [\n      \"contextual_searchbox_handler_unittest.cc\",\n      \"contextual_searchbox_screenshare_controller_unittest.cc\",\n    ]\n    deps += [\n      \"//chrome/browser/contextual_tasks\",\n      \"//chrome/browser/feature_engagement\",\n      \"//chrome/browser/media/webrtc\",\n      \"//chrome/browser/search_engines\",\n      \"//chrome/browser/signin\",\n      \"//chrome/browser/ui:tab_ui_helper\",\n      \"//chrome/browser/ui/tabs:tab_strip\",\n      \"//chrome/browser/ui/views/drive_picker_host\",\n      \"//chrome/browser/ui/webui/cr_components/composebox\",\n      \"//chrome/browser/ui/webui/drive_picker_host\",\n      \"//chrome/common\",\n      \"//components/contextual_search/internal:test_support\",\n      \"//components/contextual_tasks/