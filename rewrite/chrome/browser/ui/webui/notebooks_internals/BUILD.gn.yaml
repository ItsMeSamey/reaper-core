substitutions:
- description: Exclude complete Notebook-owned target definitions from Android
  regex:
    re_pattern: 'source_set\("notebooks_internals_ui_config"\)\ \{\

      \ \ sources\ =\ \[\ "notebooks_internals_ui_config\.cc"\ \]\

      \ \ public\ =\ \[\ "notebooks_internals_ui_config\.h"\ \]\

      \ \ public_deps\ =\ \[\ "//content/public/browser"\ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ "//chrome/browser/notebooks:factory",\

      \ \ \ \ "//chrome/browser/profiles:profile",\

      \ \ \ \ "//components/notebooks/internals/webui",\

      \ \ \ \ "//components/notebooks/public",\

      \ \ \]\

      \}\

      '
    replace: "if (!is_android) {\n  source_set(\"notebooks_internals_ui_config\")\
      \ {\n    sources = [ \"notebooks_internals_ui_config.cc\" ]\n    public = [\
      \ \"notebooks_internals_ui_config.h\" ]\n    public_deps = [ \"//content/public/browser\"\
      \ ]\n    deps = [\n      \"//chrome/browser/notebooks:factory\",\n      \"//chrome/browser/profiles:profile\"\
      ,\n      \"//components/notebooks/internals/webui\",\n      \"//components/notebooks/public\"\
      ,\n    ]\n  }\n}\n"
  count: 1
