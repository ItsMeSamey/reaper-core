substitutions:
- description: Remove Android policy-page upload control after compiling out its backend
  regex:
    pattern: '  source->AddBoolean("hideUploadReportButton", profile->IsOffTheRecord());

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  source->AddBoolean(\"hideUploadReportButton\", true);\n#else\n  source->AddBoolean(\"\
      hideUploadReportButton\", profile->IsOffTheRecord());\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
