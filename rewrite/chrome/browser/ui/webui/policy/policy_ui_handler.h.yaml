substitutions:
- description: Omit Android report-only handler declarations
  regex:
    pattern: "#if !BUILDFLAG(IS_CHROMEOS)\n  void HandleUploadReport(const base::ListValue& args);\n"
    replace: "#if !BUILDFLAG(IS_CHROMEOS) && !BUILDFLAG(IS_ANDROID)\n  void HandleUploadReport(const base::ListValue& args);\n"
  count: 1
- description: Omit Android report-only handler declarations
  regex:
    pattern: "#if !BUILDFLAG(IS_CHROMEOS)\n  // Called when report has been uploaded, successfully or not.\n"
    replace: "#if !BUILDFLAG(IS_CHROMEOS) && !BUILDFLAG(IS_ANDROID)\n  // Called when report has been uploaded, successfully\
      \ or not.\n"
  count: 1
