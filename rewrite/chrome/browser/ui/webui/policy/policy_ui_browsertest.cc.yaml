substitutions:
- description: Omit Android removed-report service browser-test header cloud_profile_reporting_service.h
  regex:
    pattern: '#include "chrome/browser/enterprise/reporting/cloud_profile_reporting_service.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/enterprise/reporting/cloud_profile_reporting_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android removed-report service browser-test header cloud_profile_reporting_service_factory.h
  regex:
    pattern: '#include "chrome/browser/enterprise/reporting/cloud_profile_reporting_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/enterprise/reporting/cloud_profile_reporting_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep policy-toggle browser tests and expect Android retired report control to remain hidden
  regex:
    pattern: '  VerifyReportButton(/*visible=*/true);

      '
    replace: '  VerifyReportButton(/*visible=*/!BUILDFLAG(IS_ANDROID));

      '
  count: 2
