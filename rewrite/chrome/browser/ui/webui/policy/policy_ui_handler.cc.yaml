substitutions:
- description: Omit Android policy-page reporting service dependency
  regex:
    pattern: '#include "chrome/browser/enterprise/reporting/cloud_profile_reporting_service.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/enterprise/reporting/cloud_profile_reporting_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android policy-page reporting service dependency
  regex:
    pattern: '#include "chrome/browser/enterprise/reporting/cloud_profile_reporting_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/enterprise/reporting/cloud_profile_reporting_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android dedicated policy-page report UI/backend block
  regex:
    pattern: "#if !BUILDFLAG(IS_CHROMEOS)\n      {\"reportUploading\", IDS_REPORT_UPLOADING},"
    replace: "#if !BUILDFLAG(IS_CHROMEOS) && !BUILDFLAG(IS_ANDROID)\n      {\"reportUploading\", IDS_REPORT_UPLOADING},"
  count: 1
- description: Omit Android dedicated policy-page report UI/backend block
  regex:
    pattern: "#if !BUILDFLAG(IS_CHROMEOS)\n  web_ui()->RegisterMessageCallback(\n      \"uploadReport\","
    replace: "#if !BUILDFLAG(IS_CHROMEOS) && !BUILDFLAG(IS_ANDROID)\n  web_ui()->RegisterMessageCallback(\n      \"uploadReport\"\
      ,"
  count: 1
- description: Omit Android dedicated policy-page report UI/backend block
  regex:
    pattern: '#if !BUILDFLAG(IS_CHROMEOS)

      void PolicyUIHandler::HandleUploadReport('
    replace: '#if !BUILDFLAG(IS_CHROMEOS) && !BUILDFLAG(IS_ANDROID)

      void PolicyUIHandler::HandleUploadReport('
  count: 1
- description: Omit Android dedicated policy-page report UI/backend block
  regex:
    pattern: '#if !BUILDFLAG(IS_CHROMEOS)

      void PolicyUIHandler::OnReportUploaded('
    replace: '#if !BUILDFLAG(IS_CHROMEOS) && !BUILDFLAG(IS_ANDROID)

      void PolicyUIHandler::OnReportUploaded('
  count: 1
- description: Omit Android reporting timestamp update callback
  regex:
    pattern: "  auto update_callback(base::BindRepeating(&PolicyUIHandler::SendStatus,\n                                 \
      \          base::Unretained(this)));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  auto update_callback(base::BindRepeating(&PolicyUIHandler::SendStatus,\n     \
      \                                      base::Unretained(this)));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit Android reporting timestamp observer
  regex:
    pattern: "  pref_change_registrar_->Add(\n      enterprise_reporting::kLastUploadSucceededTimestamp, update_callback);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  pref_change_registrar_->Add(\n      enterprise_reporting::kLastUploadSucceededTimestamp,\
      \ update_callback);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
