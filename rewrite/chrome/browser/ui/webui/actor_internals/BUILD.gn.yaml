# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webui/actor_internals/BUILD.gn'
  regex:
    re_pattern: '\#\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      \#\ found\ in\ the\ LICENSE\ file\.\

      \

      source_set\("actor_internals"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "actor_internals_ui\.cc",\

      \ \ \ \ "actor_internals_ui\.h",\

      \ \ \ \ "actor_internals_ui_handler\.cc",\

      \ \ \ \ "actor_internals_ui_handler\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//components/actor/public/mojom:mojo_bindings",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//ui/webui",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//chrome/browser:browser_process",\

      \ \ \ \ "//chrome/browser:global_features",\

      \ \ \ \ "//chrome/browser/actor",\

      \ \ \ \ "//chrome/browser/profiles",\

      \ \ \ \ "//chrome/common",\

      \ \ \ \ "//components/actor/core:journal",\

      \ \ \ \ "//components/actor/core/internals/browser",\

      \ \ \ \ "//components/actor/core/internals/resources",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//ui/shell_dialogs",\

      \ \ \]\

      \}\

      '
    replace: "# Use of this source code is governed by a BSD-style license that can be\n# found in the LICENSE file.\n\nif (!is_android) {\n  source_set(\"actor_internals\") {\n    sources = [\n      \"actor_internals_ui.cc\",\n      \"actor_internals_ui.h\",\n      \"actor_internals_ui_handler.cc\",\n      \"actor_internals_ui_handler.h\",\n    ]\n    if (is_android) {\n      sources -= [\n        \"actor_internals_ui.cc\",\n        \"actor_internals_ui.h\",\n        \"actor_internals_ui_handler.cc\",\n        \"actor_internals_ui_handler.h\",\n      ]\n    }\n\n    public_deps = [\n      \"//base\",\n      \"//components/actor/public/mojom:mojo_bindings\",\n      \"//content/public/browser\",\n      \"//ui/webui\",\n    ]\n    if (is_android) {\n      public_deps -= [ \"//components/actor/public/mojom:mojo_bindings\" ]\n    }\n\n    deps = [\n      \"//chrome/browser:browser_process\",\n      \"//chrome/browser:global_features\",\n      \"//chrome/browser/actor\",\n      \"//chrome/browser/profiles\",\n      \"//chrome/common\",\n      \"//components/actor/core:journal\",\n      \"//components/actor/core/internals/browser\",\n      \"//components/actor/core/internals/resources\",\n      \"//content/public/browser\",\n      \"//ui/shell_dialogs\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor\",\n        \"//components/actor/core:journal\",\n        \"//components/actor/core/internals/browser\",\n        \"//components/actor/core/internals/resources\",\n      ]\n    }\n  }\n}\n"
