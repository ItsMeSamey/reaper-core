substitutions:
  - description: Make `enable_extensions_core` available.
    add_import:
      import: //extensions/buildflags/buildflags.gni
  - description: |-
      Depend on theme_source wherever it exists.

      theme_source exists on Android with extensions core, which Brave enables
      on mobile Android without enable_webui_ntp.
    regex:
      re_pattern:
        'if \(!is_android \|\| enable_webui_ntp\)(\s*\{\s*deps \+= \[
        "//chrome/browser/ui/webui:theme_source" \])'
      replace:
        'if (!is_android || enable_webui_ntp || enable_extensions_core)\1'

  - description: "Android AI closure 410: chrome/browser/ui/webui/omnibox/BUILD.gn"
    regex:
      pattern: "# Copyright 2014 The Chromium Authors\n# Use of this source code is governed by a BSD-style license that can be\n# found in the LICENSE file.\n\nimport(\"//extensions/buildflags/buildflags.gni\")\nimport(\"//mojo/public/tools/bindings/mojom.gni\")\n\nmojom(\"mojo_bindings\") {\n  sources = [ \"omnibox_internals.mojom\" ]\n  webui_module_path = \"/chrome/browser/ui/webui/omnibox\"\n\n  deps = [ \"//url/mojom:url_mojom_gurl\" ]\n\n  cpp_typemaps = [\n    {\n      types = [\n        {\n          mojom = \"mojom.ACMatchClassification\"\n          cpp = \"::AutocompleteMatch::ACMatchClassification\"\n        },\n        {\n          mojom = \"mojom.AutocompleteMatch\"\n          cpp = \"::AutocompleteMatchWrapper\"\n        },\n        {\n          mojom = \"mojom.Signals\"\n          cpp = \"::AutocompleteMatch::ScoringSignals\"\n        },\n      ]\n      traits_headers = [ \"omnibox_mojom_traits.h\" ]\n\n      traits_public_deps = [ \":mojom_traits\" ]\n    },\n  ]\n}\n\nsource_set(\"mojom_traits\") {\n  sources = [\n    \"omnibox_mojom_traits.cc\",\n    \"omnibox_mojom_traits.h\",\n  ]\n\n  deps = [ \"//ui/base\" ]\n\n  public_deps = [\n    \":mojo_bindings_shared_cpp_sources\",\n    \"//base\",\n    \"//components/bookmarks/browser\",\n    \"//components/omnibox/browser\",\n  ]\n}\n\nsource_set(\"omnibox\") {\n  sources = [\n    \"omnibox_page_handler.cc\",\n    \"omnibox_page_handler.h\",\n    \"omnibox_ui.cc\",\n    \"omnibox_ui.h\",\n  ]\n  public_deps = [\n    \":mojo_bindings\",\n    \"//content/public/browser\",\n    \"//mojo/public/cpp/bindings\",\n    \"//ui/webui\",\n  ]\n  deps = [\n    \":mojom_traits\",\n    \"aim_eligibility\",\n    \"aim_eligibility:mojo_bindings\",\n    \"logging\",\n    \"logging:mojo_bindings\",\n    \"//base\",\n    \"//chrome/browser/autocomplete\",\n    \"//chrome/browser/bitmap_fetcher\",\n    \"//chrome/browser/bookmarks\",\n    \"//chrome/browser/history\",\n    \"//chrome/browser/omnibox\",\n    \"//chrome/browser/profiles:profile\",\n    \"//chrome/browser/resources/omnibox:resources\",\n    \"//chrome/browser/search\",\n    \"//chrome/browser/search_engines\",\n    \"//chrome/browser/ui/webui/version\",\n    \"//chrome/common\",\n    \"//components/omnibox/browser\",\n    \"//components/omnibox/common:features\",\n    \"//components/search_engines\",\n    \"//content/public/common\",\n    \"//services/network/public/mojom\",\n    \"//third_party/metrics_proto\",\n    \"//third_party/omnibox_proto\",\n    \"//ui/base\",\n    \"//ui/gfx\",\n  ]\n\n  # omnibox_ui.cc includes theme_source.h (under #if !BUILDFLAG(IS_ANDROID));\n  # the theme_source target exists wherever !is_android || enable_webui_ntp.\n  if (!is_android || enable_webui_ntp || enable_extensions_core) {\n    deps += [ \"//chrome/browser/ui/webui:theme_source\" ]\n  }\n}\n"
