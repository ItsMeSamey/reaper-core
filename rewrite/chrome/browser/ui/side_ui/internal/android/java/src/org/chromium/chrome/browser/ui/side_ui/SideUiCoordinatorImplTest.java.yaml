# Android SideUi closing-animation owner lifetime.
substitutions:
  - description: "Append ordinary closing-owner regressions without changing stock tests or annotations."
    regex:
      re_pattern: "ecsForTabWithoutSideUi\\.getWidth\\(AnchorSide\\.RIGHT\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertEquals\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ HeightType\\.NOT_APPLICABLE,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ specsForTabWithoutSideUi\\.getHeightType\\(AnchorSide\\.RIGHT\\)\\);\\\n\\ \\ \\ \\ \\}\\\n\\}\\\n"
      replace: "ecsForTabWithoutSideUi.getWidth(AnchorSide.RIGHT));\n        assertEquals(\n                HeightType.NOT_APPLICABLE,\n                specsForTabWithoutSideUi.getHeightType(AnchorSide.RIGHT));\n    }\n\n    @Test\n    @Config(sdk = {33, 34})\n    public void testClosingAnimation_UnregisteredOwnerDoesNotReceiveCompletion() {\n        TestSideUiContainer container = startClosingSidePanel();\n        int width = mSideUiContainerView.getLayoutParams().width;\n        mCoordinator.unregisterSideUiContainer(container);\n\n        mCoordinator.endAnimations();\n\n        assertNull(mCoordinator.getSideUiContainerById(SideUiId.SIDE_PANEL));\n        assertEquals(1, container.mNumOnUiUpdateCompletedReceived);\n        assertEquals(width, mSideUiContainerView.getLayoutParams().width);\n        assertNull(mSideUiContainerView.getParent());\n        assertEquals(0, mRightAnchorContainer.getChildCount());\n        assertEquals(View.GONE, mRightAnchorContainer.getVisibility());\n        verify(mSideUiObserver).onTransitionEnded(new SideUiSpecs(0, 0));\n    }\n\n    @Test\n    @Config(sdk = {33, 34})\n    public void testClosingAnimation_DestroyedCoordinatorDoesNotNotify() {\n        TestSideUiContainer container = startClosingSidePanel();\n        int width = mSideUiContainerView.getLayoutParams().width;\n        mCoordinator.destroy();\n\n        mCoordinator.endAnimations();\n\n        assertNull(mCoordinator.getSideUiContainerById(SideUiId.SIDE_PANEL));\n        assertEquals(1, container.mNumOnUiUpdateCompletedReceived);\n        assertEquals(width, mSideUiContainerView.getLayoutParams().width);\n        verify(mSideUiObserver, never()).onTransitionEnded(any());\n        assertEquals(1, mBrowserControlsVisibilityDelegate.mReleaseCount);\n    }\n\n    @Test\n    @Config(sdk = {33, 34})\n    public void testClosingAnimation_SameAnchorReplacementDoesNotReceiveOldCompletion() {\n        TestSideUiContainer oldContainer = startClosingSidePanel();\n        mCoordinator.unregisterSideUiContainer(oldContainer);\n        assertNull(mSideUiContainerView.getParent());\n        assertEquals(0, mRightAnchorContainer.getChildCount());\n        assertEquals(View.GONE, mRightAnchorContainer.getVisibility());\n        View replacementView = new View(mTestActivity);\n        TestSideUiContainer replacement =\n                new TestSideUiContainer(\n                        mCoordinator, replacementView, SideUiId.SIDE_PANEL, AnchorSide.RIGHT);\n        replacement.mHeightType = HeightType.WEB_CONTENTS;\n        doReturn(120).when(mTopControlsStacker).getVisibleTopControlsTotalHeight();\n        mCoordinator.registerSideUiContainer(replacement);\n\n        // A normal UI request first completes the older recorded transition, then opens this owner.\n        mCoordinator.updateUi(\n                new UiUpdateRequest(SideUiId.SIDE_PANEL, /* suppressAnimations= */ true));\n        mCoordinator.endAnimations();\n\n        assertEquals(1, oldContainer.mNumOnUiUpdateCompletedReceived);\n        assertEquals(1, replacement.mNumOnUiUpdateCompletedReceived);\n        assertEquals(\n                Integer.valueOf(replacement.mMaxWidthDp), replacement.mLastNewWidthOnUpdateCompleted);\n        assertEquals(HeightType.WEB_CONTENTS, replacement.mLastNewHeightTypeOnUpdateCompleted);\n        assertEquals(mRightAnchorContainer, replacementView.getParent());\n        assertEquals(replacement.mMaxWidthDp, replacementView.getWidth());\n        assertEquals(\n                HeightType.WEB_CONTENTS,\n                mCoordinator.getCurrentSideUiSpecs().getHeightType(AnchorSide.RIGHT));\n        verify(mSideUiObserver).onTransitionEnded(new SideUiSpecs(0, 0));\n        assertEquals(1, mRightAnchorContainer.getChildCount());\n\n        // The successor must also close normally without an abandoned predecessor child.\n        clearInvocations(mSideUiObserver);\n        replacement.mHasContentForTabMap.put(mTab, false);\n        mCoordinator.updateUi(\n                new UiUpdateRequest(SideUiId.SIDE_PANEL, /* suppressAnimations= */ false));\n        verify(mSideUiObserver).onTransitionBegun(any());\n        mCoordinator.endAnimations();\n        assertEquals(2, replacement.mNumOnUiUpdateCompletedReceived);\n        assertNull(replacementView.getParent());\n        assertEquals(0, mRightAnchorContainer.getChildCount());\n        assertEquals(View.GONE, mRightAnchorContainer.getVisibility());\n        assertEquals(0, replacementView.getLayoutParams().width);\n        verify(mSideUiObserver).onTransitionEnded(new SideUiSpecs(0, 0));\n    }\n\n    @Test\n    @Config(sdk = {33, 34})\n    public void testClosingAnimation_RetiredOwnerPreservesHealthyCompletion() {\n        View leftView = new View(mTestActivity);\n        TestSideUiContainer left =\n                new TestSideUiContainer(\n                        mCoordinator, leftView, SideUiId.VERTICAL_TABS, AnchorSide.LEFT);\n        TestSideUiContainer right =\n                new TestSideUiContainer(\n                        mCoordinator, mSideUiContainerView, SideUiId.SIDE_PANEL, AnchorSide.RIGHT);\n        mCoordinator.registerSideUiContainer(left);\n        mCoordinator.registerSideUiContainer(right);\n        mCoordinator.updateUi(\n                new UiUpdateRequest(/* sideUiId= */ null, /* suppressAnimations= */ true));\n        assertEquals(1, left.mNumOnUiUpdateCompletedReceived);\n        assertEquals(1, right.mNumOnUiUpdateCompletedReceived);\n        left.mHasContentForTabMap.put(mTab, false);\n        right.mHasContentForTabMap.put(mTab, false);\n        mCoordinator.addObserver(mSideUiObserver);\n        clearInvocations(mSideUiObserver);\n        mCoordinator.updateUi(\n                new UiUpdateRequest(/* sideUiId= */ null, /* suppressAnimations= */ false));\n        verify(mSideUiObserver).onTransitionBegun(any());\n        mCoordinator.unregisterSideUiContainer(right);\n\n        mCoordinator.endAnimations();\n\n        assertEquals(2, left.mNumOnUiUpdateCompletedReceived);\n        assertEquals(Integer.valueOf(0), left.mLastNewWidthOnUpdateCompleted);\n        assertEquals(0, leftView.getLayoutParams().width);\n        assertNull(leftView.getParent());\n        assertEquals(1, right.mNumOnUiUpdateCompletedReceived);\n        assertEquals(View.GONE, mLeftAnchorContainer.getVisibility());\n        verify(mSideUiObserver).onTransitionEnded(new SideUiSpecs(0, 0));\n    }\n\n    private TestSideUiContainer startClosingSidePanel() {\n        TestSideUiContainer container =\n                new TestSideUiContainer(\n                        mCoordinator, mSideUiContainerView, SideUiId.SIDE_PANEL, AnchorSide.RIGHT);\n        mCoordinator.registerSideUiContainer(container);\n        mCoordinator.updateUi(\n                new UiUpdateRequest(SideUiId.SIDE_PANEL, /* suppressAnimations= */ true));\n        assertEquals(1, container.mNumOnUiUpdateCompletedReceived);\n        assertTrue(mSideUiContainerView.getWidth() > 0);\n        container.mHasContentForTabMap.put(mTab, false);\n        mCoordinator.addObserver(mSideUiObserver);\n        clearInvocations(mSideUiObserver);\n        mCoordinator.updateUi(\n                new UiUpdateRequest(SideUiId.SIDE_PANEL, /* suppressAnimations= */ false));\n        verify(mSideUiObserver).onTransitionBegun(any());\n        return container;\n    }\n}\n"
