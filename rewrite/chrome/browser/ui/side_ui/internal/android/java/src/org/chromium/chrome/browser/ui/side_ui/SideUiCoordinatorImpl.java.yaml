# Android SideUi closing-animation owner lifetime.
substitutions:
  - description: "Track terminal coordinator retirement for delayed animation completion."
    regex:
      re_pattern: "\\ \\ \\ \\ private\\ boolean\\ mIsUpdatingUi;"
      replace: "    private boolean mIsUpdatingUi;\n\n    private boolean mDestroyed;"
  - description: "Publish terminal retirement before external teardown."
    regex:
      re_pattern: "\\ \\ \\ \\ public\\ void\\ destroy\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ ThreadUtils\\.assertOnUiThread\\(\\);"
      replace: "    public void destroy() {\n        ThreadUtils.assertOnUiThread();\n        mDestroyed = true;"
  - description: "Detach only a genuinely unregistered owner and retire its anchor height without owner callbacks."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ mSideUiContainers\\.remove\\(sideUiContainer\\);"
      replace: "        if (mSideUiContainers.remove(sideUiContainer)) {\n            detachSideUiContainerView(sideUiContainer);\n            mCurrentHeightTypes.put(sideUiContainer.getAnchorSide(), HeightType.NOT_APPLICABLE);\n        }"
  - description: "Capture registered animation owners before deferred work."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ SideUiSpecs\\ currentSideUiSpecs\\ =\\ uiUpdateSpecs\\.mCurrentSpecs;\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ for\\ \\(Map\\.Entry<@AnchorSide\\ Integer,\\ SideUiSize>\\ entry\\ :\\ sideUiSpecsDiff\\.entrySet\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ @AnchorSide\\ int\\ anchorSide\\ =\\ entry\\.getKey\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ int\\ newWidth\\ =\\ entry\\.getValue\\(\\)\\.mWidth;\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ int\\ oldWidth\\ =\\ currentSideUiSpecs\\.getWidth\\(anchorSide\\);"
      replace: "        SideUiSpecs currentSideUiSpecs = uiUpdateSpecs.mCurrentSpecs;\n        List<SideUiContainer> transitionContainerOrder = new ArrayList<>(mSideUiContainers);\n        Map<@AnchorSide Integer, SideUiContainer> transitionContainers = new ArrayMap<>();\n        for (SideUiContainer container : transitionContainerOrder) {\n            transitionContainers.put(container.getAnchorSide(), container);\n        }\n\n        for (Map.Entry<@AnchorSide Integer, SideUiSize> entry : sideUiSpecsDiff.entrySet()) {\n            @AnchorSide int anchorSide = entry.getKey();\n            int newWidth = entry.getValue().mWidth;\n            int oldWidth = currentSideUiSpecs.getWidth(anchorSide);"
  - description: "Retire old width/height/completion effects by current owner identity, preserving healthy owners."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ public\\ void\\ onResult\\(SideUiUpdateSpecs\\ uiUpdateSpecs\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ //\\ Detach\\ and\\ close\\ the\\ container\\ after\\ the\\ transition\\ is\\ complete\\.\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ for\\ \\(Map\\.Entry<@AnchorSide\\ Integer,\\ SideUiSize>\\ entry\\ :\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ uiUpdateSpecs\\.mSpecsDiff\\.entrySet\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ @AnchorSide\\ int\\ anchorSide\\ =\\ entry\\.getKey\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ @Px\\ int\\ newSideUiWidth\\ =\\ entry\\.getValue\\(\\)\\.mWidth;\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ SideUiContainer\\ sideUiContainer\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ assumeNonNull\\(getSideUiContainerBySide\\(anchorSide\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(newSideUiWidth\\ ==\\ 0\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ detachSideUiContainerView\\(sideUiContainer\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ sideUiContainer\\.setWidth\\(0\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ for\\ \\(Map\\.Entry<@AnchorSide\\ Integer,\\ SideUiSize>\\ entry\\ :\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ uiUpdateSpecs\\.mNewSpecs\\.entrySet\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mCurrentHeightTypes\\.put\\(entry\\.getKey\\(\\),\\ entry\\.getValue\\(\\)\\.mHeightType\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ notifyContainersOnUiUpdateCompleted\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ uiUpdateSpecs\\.mCurrentSpecs,\\ uiUpdateSpecs\\.mNewSpecs\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mSideUiObserverNotifier\\.notifyTransitionEnded\\(uiUpdateSpecs\\.mNewSpecs\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\}"
      replace: "                    public void onResult(SideUiUpdateSpecs uiUpdateSpecs) {\n                        if (mDestroyed) return;\n\n                        // A container can be unregistered or replaced while the animation runs.\n                        // Complete only the owners for which this transition was recorded.\n                        for (Map.Entry<@AnchorSide Integer, SideUiSize> entry :\n                                uiUpdateSpecs.mSpecsDiff.entrySet()) {\n                            @AnchorSide int anchorSide = entry.getKey();\n                            @Px int newSideUiWidth = entry.getValue().mWidth;\n                            SideUiContainer sideUiContainer = transitionContainers.get(anchorSide);\n                            if (sideUiContainer == null\n                                    || getSideUiContainerBySide(anchorSide) != sideUiContainer) {\n                                continue;\n                            }\n                            if (newSideUiWidth == 0) {\n                                detachSideUiContainerView(sideUiContainer);\n                                sideUiContainer.setWidth(0);\n                            }\n                        }\n\n                        for (Map.Entry<@AnchorSide Integer, SideUiSize> entry :\n                                uiUpdateSpecs.mNewSpecs.entrySet()) {\n                            @AnchorSide int anchorSide = entry.getKey();\n                            if (getSideUiContainerBySide(anchorSide)\n                                    == transitionContainers.get(anchorSide)) {\n                                mCurrentHeightTypes.put(anchorSide, entry.getValue().mHeightType);\n                            }\n                        }\n\n                        for (SideUiContainer container : transitionContainerOrder) {\n                            if (mDestroyed) return;\n                            @AnchorSide int anchorSide = container.getAnchorSide();\n                            if (getSideUiContainerBySide(anchorSide) != container) continue;\n                            @Px int oldWidth = uiUpdateSpecs.mCurrentSpecs.getWidth(anchorSide);\n                            @Px int newWidth = uiUpdateSpecs.mNewSpecs.getWidth(anchorSide);\n                            @HeightType int oldHeightType =\n                                    uiUpdateSpecs.mCurrentSpecs.getHeightType(anchorSide);\n                            @HeightType int newHeightType =\n                                    uiUpdateSpecs.mNewSpecs.getHeightType(anchorSide);\n                            if (newWidth != oldWidth || oldHeightType != newHeightType) {\n                                container.onUiUpdateCompleted(\n                                        oldWidth, newWidth, oldHeightType, newHeightType);\n                            }\n                        }\n\n                        if (mDestroyed) return;\n                        boolean sameOwners =\n                                mSideUiContainers.size() == transitionContainers.size();\n                        for (SideUiContainer container : mSideUiContainers) {\n                            if (transitionContainers.get(container.getAnchorSide()) != container) {\n                                sameOwners = false;\n                                break;\n                            }\n                        }\n                        SideUiSpecs completedSpecs = uiUpdateSpecs.mNewSpecs;\n                        if (!sameOwners) {\n                            // Balance the observer animation lifecycle using the current owners,\n                            // not the retired transition's targets or an unregistered child View.\n                            Map<@AnchorSide Integer, SideUiSize> effectiveSpecs = new ArrayMap<>();\n                            for (Map.Entry<@AnchorSide Integer, SideUiSize> entry :\n                                    getCurrentSideUiSpecsInternal().entrySet()) {\n                                effectiveSpecs.put(\n                                        entry.getKey(),\n                                        getSideUiContainerBySide(entry.getKey()) == null\n                                                ? new SideUiSize(0, HeightType.NOT_APPLICABLE)\n                                                : entry.getValue());\n                            }\n                            completedSpecs = new SideUiSpecs(effectiveSpecs);\n                        }\n                        mSideUiObserverNotifier.notifyTransitionEnded(completedSpecs);\n                    }"
