substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "chrome/browser/ui/extensions/settings_overridden_params_providers.h"


      '
    replace: '#include "chrome/browser/ui/extensions/settings_overridden_params_providers.h"


      #include "build/build_config.h"


      '
  count: 1
- description: Exclude Android survey-only include chrome/browser/ui/hats/survey_config.h
  regex:
    pattern: '#include "chrome/browser/ui/hats/survey_config.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/hats/survey_config.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android extension setting survey data assignment
  regex:
    pattern: "    if (base::FeatureList::IsEnabled(\n            features::kHappinessTrackingSurveysForDesktopSEHijacking))\
      \ {\n      params->hats_survey_trigger = kHatsSurveyTriggerSEHijacking;\n    }"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    if (base::FeatureList::IsEnabled(\n            features::kHappinessTrackingSurveysForDesktopSEHijacking))\
      \ {\n      params->hats_survey_trigger = kHatsSurveyTriggerSEHijacking;\n    }\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude Android extension setting survey data assignment
  regex:
    pattern: "  if (base::FeatureList::IsEnabled(\n          features::kHappinessTrackingSurveysForDesktopSEHijacking)) {\n\
      \    params->hats_survey_trigger = kHatsSurveyTriggerSEHijacking;\n  }"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(\n          features::kHappinessTrackingSurveysForDesktopSEHijacking))\
      \ {\n    params->hats_survey_trigger = kHatsSurveyTriggerSEHijacking;\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
