substitutions:
- description: Include the current site in localized Android extension site-permissions titles
  regex:
    re_pattern: '\#include\ "base/i18n/case_conversion\.h"\

      \#include\ "base/metrics/user_metrics\.h"\

      \#include\ "base/metrics/user_metrics_action\.h"\

      \#include\ "chrome/browser/extensions/extension_action_dispatcher\.h"\

      \#include\ "chrome/browser/extensions/extension_action_runner\.h"\

      \#include\ "chrome/browser/extensions/extension_tab_util\.h"\

      '
    replace: '#include "base/i18n/case_conversion.h"

      #include "base/metrics/user_metrics.h"

      #include "base/metrics/user_metrics_action.h"

      #include "build/build_config.h"

      #include "chrome/browser/extensions/extension_action_dispatcher.h"

      #include "chrome/browser/extensions/extension_action_runner.h"

      #include "chrome/browser/extensions/extension_tab_util.h"

      '
- description: Include the current site in localized Android extension site-permissions titles
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \*extension,\ url,\ PermissionsManager::UserSiteAccess::kOnSite\)\

      \ \ \ \ \ \ \ \ \ \ \?\ ControlState::Status::kEnabled\

      \ \ \ \ \ \ \ \ \ \ :\ ControlState::Status::kDisabled;\

      \ \ on_site_option\.text\ =\

      \ \ \ \ \ \ GetSiteAccessOptionText\(PermissionsManager::UserSiteAccess::kOnSite\);\

      \ \ on_site_option\.is_on\ =\

      \ \ \ \ \ \ site_access\ ==\ PermissionsManager::UserSiteAccess::kOnSite;\

      \

      '
    replace: "          *extension, url, PermissionsManager::UserSiteAccess::kOnSite)\n          ? ControlState::Status::kEnabled\n          : ControlState::Status::kDisabled;\n#if BUILDFLAG(IS_ANDROID)\n  on_site_option.text = GetSiteAccessOptionText(\n      PermissionsManager::UserSiteAccess::kOnSite,\n      extensions::ui_util::GetFormattedHostForDisplay(*web_contents));\n#else\n  on_site_option.text =\n      GetSiteAccessOptionText(PermissionsManager::UserSiteAccess::kOnSite);\n#endif\n  on_site_option.is_on =\n      site_access == PermissionsManager::UserSiteAccess::kOnSite;\n\n"
