# Android download-open confirmation completion.
substitutions:
- description: Scope unavailable-dialog completion to Android
  regex:
    re_pattern: \#include\ "base/strings/utf_string_conversions\.h"
    replace: '#include "base/strings/utf_string_conversions.h"

      #include "build/build_config.h"'
- description: Complete a discarded Android confirmation exactly once with denial
  regex:
    re_pattern: \ \ \~DownloadOpenConfirmationDialogDelegate\(\)\ override\ =\ default;
    replace: "  ~DownloadOpenConfirmationDialogDelegate() override {\n#if BUILDFLAG(IS_ANDROID)\n    // Android can discard the model before creating a host if its window or\n    // dialog manager is unavailable. Such destruction is a denial, not consent.\n    OnDialogDestroyed();\n#endif\n  }"
