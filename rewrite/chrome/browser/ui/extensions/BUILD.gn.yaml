# Android download-open confirmation completion.
substitutions:
- description: Exercise the actual Android dialog path for unavailable UI and explicit consent
  regex:
    re_pattern: 'source_set\("unit_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \ \ sources\ =\ \[\]\

      \ \ deps\ =\ \[\]'
    replace: "source_set(\"unit_tests\") {\n  testonly = true\n  sources = []\n  deps = []\n  if (is_android) {\n    sources += [ \"//brave/browser/extensions/download_open_dialog_android_unittest.cc\" ]\n    deps += [\n      \":impl\",\n      \"//base\",\n      \"//base/test:test_support\",\n      \"//chrome/test:test_support\",\n      \"//content/public/browser\",\n      \"//content/test:test_support\",\n      \"//testing/gtest\",\n      \"//ui/android\",\n      \"//ui/android:test_support\",\n    ]\n  }"

- description: Supply the existing localized Android extension install error heading
  regex:
    re_pattern: "\\ \\ \\ \\ deps\\ \\+=\\ \\[\\\n\\ \\ \\ \\ \\ \\ \"//chrome/browser/ui/android/extensions\",\\\n\\ \\ \\ \\ \\ \\ \"//chrome/browser/ui/android/tab_model\",\\\n\\ \\ \\ \\ \\ \\ \"//extensions/common\",\\\n\\ \\ \\ \\ \\ \\ \"//ui/android\",\\\n\\ \\ \\ \\ \\]"
    replace: "    deps += [\n      \"//chrome/browser/ui/android/extensions\",\n      \"//chrome/browser/ui/android/tab_model\",\n      \"//extensions/common\",\n      \"//extensions/strings\",\n      \"//ui/android\",\n    ]"
