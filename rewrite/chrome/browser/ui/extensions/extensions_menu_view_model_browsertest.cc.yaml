substitutions:
- description: Include the current site in localized Android extension site-permissions titles
  regex:
    re_pattern: '\#include\ "base/test/metrics/user_action_tester\.h"\

      \#include\ "base/threading/thread_restrictions\.h"\

      \#include\ "base/values\.h"\

      \#include\ "chrome/browser/extensions/extension_action_runner\.h"\

      \#include\ "chrome/browser/extensions/extension_browsertest\.h"\

      \#include\ "chrome/browser/extensions/extension_tab_util\.h"\

      \#include\ "chrome/browser/extensions/extension_view_host\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      \#include\ "chrome/browser/ui/browser_window/public/browser_window_interface\.h"\

      '
    replace: '#include "base/test/metrics/user_action_tester.h"

      #include "base/threading/thread_restrictions.h"

      #include "base/values.h"

      #include "build/build_config.h"

      #include "chrome/browser/extensions/extension_action_runner.h"

      #include "chrome/browser/extensions/extension_browsertest.h"

      #include "chrome/browser/extensions/extension_tab_util.h"

      #include "chrome/browser/extensions/extension_ui_util.h"

      #include "chrome/browser/extensions/extension_view_host.h"

      #include "chrome/browser/profiles/profile.h"

      #include "chrome/browser/ui/browser_window/public/browser_window_interface.h"

      '
- description: Include the current site in localized Android extension site-permissions titles
  regex:
    re_pattern: '\ \ NavigateTo\("example\.com"\);\

      \ \ auto\ site_permissions\ =\ menu_model\(\)\->GetExtensionSitePermissionsState\(\

      \ \ \ \ \ \ extension_with_all_hosts\->id\(\),\ gfx::Size\(\)\);\

      \ \ EXPECT_EQ\(site_permissions\.on_click_option\.status,\

      \ \ \ \ \ \ \ \ \ \ \ \ ExtensionsMenuViewModel::ControlState::Status::kEnabled\);\

      \ \ EXPECT_EQ\(site_permissions\.on_site_option\.status,\

      '
    replace: "  NavigateTo(\"example.com\");\n  auto site_permissions = menu_model()->GetExtensionSitePermissionsState(\n      extension_with_all_hosts->id(), gfx::Size());\n#if BUILDFLAG(IS_ANDROID)\n  // Android binds the native title directly; its localized site placeholder\n  // must describe the page whose permission the user is changing.\n  const std::u16string first_site =\n      extensions::ui_util::GetFormattedHostForDisplay(*GetActiveWebContents());\n  ASSERT_FALSE(first_site.empty());\n  EXPECT_NE(first_site.find(u\"example.com\"), std::u16string::npos);\n  EXPECT_EQ(site_permissions.on_site_option.text,\n            l10n_util::GetStringFUTF16(\n                IDS_EXTENSIONS_MENU_SITE_PERMISSIONS_PAGE_SITE_ACCESS_ON_SITE_TEXT,\n                first_site));\n#endif\n  EXPECT_EQ(site_permissions.on_click_option.status,\n            ExtensionsMenuViewModel::ControlState::Status::kEnabled);\n  EXPECT_EQ(site_permissions.on_site_option.status,\n"
- description: Include the current site in localized Android extension site-permissions titles
  regex:
    re_pattern: '\ \ NavigateTo\("a\.com"\);\

      \ \ site_permissions\ =\ menu_model\(\)\->GetExtensionSitePermissionsState\(\

      \ \ \ \ \ \ extension_A\->id\(\),\ gfx::Size\(\)\);\

      \ \ EXPECT_EQ\(site_permissions\.on_click_option\.status,\

      \ \ \ \ \ \ \ \ \ \ \ \ ExtensionsMenuViewModel::ControlState::Status::kEnabled\);\

      \ \ EXPECT_EQ\(site_permissions\.on_site_option\.status,\

      '
    replace: "  NavigateTo(\"a.com\");\n  site_permissions = menu_model()->GetExtensionSitePermissionsState(\n      extension_A->id(), gfx::Size());\n#if BUILDFLAG(IS_ANDROID)\n  const std::u16string current_site =\n      extensions::ui_util::GetFormattedHostForDisplay(*GetActiveWebContents());\n  ASSERT_FALSE(current_site.empty());\n  EXPECT_NE(current_site.find(u\"a.com\"), std::u16string::npos);\n  EXPECT_NE(first_site, current_site);\n  EXPECT_EQ(site_permissions.on_site_option.text,\n            l10n_util::GetStringFUTF16(\n                IDS_EXTENSIONS_MENU_SITE_PERMISSIONS_PAGE_SITE_ACCESS_ON_SITE_TEXT,\n                current_site));\n#endif\n  EXPECT_EQ(site_permissions.on_click_option.status,\n            ExtensionsMenuViewModel::ControlState::Status::kEnabled);\n  EXPECT_EQ(site_permissions.on_site_option.status,\n"
