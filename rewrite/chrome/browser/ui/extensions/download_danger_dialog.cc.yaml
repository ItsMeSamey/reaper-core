substitutions:
- description: "Android download-danger unavailable-host completion 1"
  regex:
    pattern: "#include \"base/task/single_thread_task_runner.h\"\n"
    replace: "#include \"base/task/single_thread_task_runner.h\"\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Android download-danger unavailable-host completion 2"
  regex:
    pattern: "DownloadDangerDialogDelegate::~DownloadDangerDialogDelegate() {\n  DetachFromDownload();\n}\n"
    replace: "DownloadDangerDialogDelegate::~DownloadDangerDialogDelegate() {\n  DetachFromDownload();\n#if BUILDFLAG(IS_ANDROID)\n  // Android may discard the model before creating a modal host.\n  OnDialogClosed();\n#endif\n}\n"
  count: 1
