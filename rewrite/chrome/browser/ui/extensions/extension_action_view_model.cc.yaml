substitutions:
- description: "Provide the explicit Android build flag before platform guards."
  regex:
    re_pattern: "\\#include\\ \"base/check_op\\.h\"\\\n"
    replace: "#include \"build/build_config.h\"\n\n#include \"base/check_op.h\"\n"
- description: "Exclude the dedicated action-measurement include base/json/values_util.h on Android."
  regex:
    re_pattern: "\\#include\\ \"base/json/values_util\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/json/values_util.h\"\n#endif\n"
- description: "Exclude the dedicated action-measurement include base/metrics/histogram_functions.h on Android."
  regex:
    re_pattern: "\\#include\\ \"base/metrics/histogram_functions\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/metrics/histogram_functions.h\"\n#endif\n"
- description: "Exclude the dedicated action-measurement include extensions/browser/extension_prefs.h on Android."
  regex:
    re_pattern: "\\#include\\ \"extensions/browser/extension_prefs\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"extensions/browser/extension_prefs.h\"\n#endif\n"
- description: "Exclude the dedicated action-measurement include extensions/browser/pref_names.h on Android."
  regex:
    re_pattern: "\\#include\\ \"extensions/browser/pref_names\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"extensions/browser/pref_names.h\"\n#endif\n"
- description: "Compile out the dedicated toolbar invocation measurement helper on Android."
  regex:
    re_pattern: "void\\ RecordInvocationSource\\(ToolbarActionViewModel::InvocationSource\\ source\\)\\ \\{\\\n\\ \\ base::UmaHistogramEnumeration\\(\"Extensions\\.Toolbar\\.InvocationSource\",\\ source\\);\\\n\\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid RecordInvocationSource(ToolbarActionViewModel::InvocationSource source) {\n  base::UmaHistogramEnumeration(\"Extensions.Toolbar.InvocationSource\", source);\n}\n#endif\n"
- description: "Compile out invocation and time-to-first-action measurement plus dedicated preference computation on Android."
  regex:
    re_pattern: "\\ \\ RecordInvocationSource\\(source\\);\\\n\\\n\\ \\ extensions::ExtensionPrefs\\*\\ prefs\\ =\\\n\\ \\ \\ \\ \\ \\ extensions::ExtensionPrefs::Get\\(browser_\\->GetProfile\\(\\)\\);\\\n\\ \\ if\\ \\(prefs\\)\\ \\{\\\n\\ \\ \\ \\ std::string\\ time_str;\\\n\\ \\ \\ \\ if\\ \\(prefs\\->ReadPrefAsString\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ extension_\\->id\\(\\),\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ extensions::pref_names::kPrefInstallTimeForActionMetric,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\&time_str\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ base::Time\\ install_time\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ base::ValueToTime\\(base::Value\\(time_str\\)\\)\\.value_or\\(base::Time\\(\\)\\);\\\n\\ \\ \\ \\ \\ \\ if\\ \\(!install_time\\.is_null\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ base::TimeDelta\\ elapsed_time\\ =\\ base::Time::Now\\(\\)\\ \\-\\ install_time;\\\n\\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(!elapsed_time\\.is_negative\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ base::UmaHistogramLongTimes\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \"Extensions\\.Toolbar\\.TimeToFirstActionClick\",\\ elapsed_time\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ \\ \\ prefs\\->UpdateExtensionPref\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ extension_\\->id\\(\\),\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ extensions::pref_names::kPrefInstallTimeForActionMetric,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ std::nullopt\\);\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\}\\\n\\ \\ \\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  RecordInvocationSource(source);\n\n  extensions::ExtensionPrefs* prefs =\n      extensions::ExtensionPrefs::Get(browser_->GetProfile());\n  if (prefs) {\n    std::string time_str;\n    if (prefs->ReadPrefAsString(\n            extension_->id(),\n            extensions::pref_names::kPrefInstallTimeForActionMetric,\n            &time_str)) {\n      base::Time install_time =\n          base::ValueToTime(base::Value(time_str)).value_or(base::Time());\n      if (!install_time.is_null()) {\n        base::TimeDelta elapsed_time = base::Time::Now() - install_time;\n        if (!elapsed_time.is_negative()) {\n          base::UmaHistogramLongTimes(\n              \"Extensions.Toolbar.TimeToFirstActionClick\", elapsed_time);\n        }\n        prefs->UpdateExtensionPref(\n            extension_->id(),\n            extensions::pref_names::kPrefInstallTimeForActionMetric,\n            std::nullopt);\n      }\n    }\n  }\n#endif\n"
- description: "Compile out the API popup invocation measurement on Android."
  regex:
    re_pattern: "\\ \\ RecordInvocationSource\\(InvocationSource::kApi\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  RecordInvocationSource(InvocationSource::kApi);\n#endif\n"
