substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "base/memory/raw_ptr_exclusion.h"

      #include "base/memory/raw_ref.h"

      '
    replace: '#include "base/memory/raw_ptr_exclusion.h"


      #include "build/build_config.h"

      #include "base/memory/raw_ref.h"

      '
  count: 1
- description: Omit survey-only dialog parameters on Android
  regex:
    pattern: "    // The HaTS survey trigger to use, if any. If specified, will attempt to\n    // show a survey for the specified\
      \ trigger.\n    std::optional<std::string> hats_survey_trigger;"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    // The HaTS survey trigger to use, if any. If specified, will attempt to\n \
      \   // show a survey for the specified trigger.\n    std::optional<std::string> hats_survey_trigger;\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude Android survey declaration and data keys
  regex:
    pattern: "  // Potentially triggers a HaTS survey, for the trigger value supplied in\n  // dialog parameters.\n  static\
      \ void MaybeShowHatsSurvey(Profile* profile,\n                                  const std::string& survey_trigger,\n\
      \                                  DialogResult result,\n                                  base::TimeDelta duration,\n\
      \                                  const std::string& extension_name,\n                                  const std::string&\
      \ extension_id);\n\n  // Constants for HaTS survey PSD keys and values.\n  static constexpr char kHatsPsdChannel[] =\
      \ \"Channel\";\n  static constexpr char kHatsPsdUserChoice[] = \"User choice\";\n  static constexpr char kHatsPsdTimeDialogVisible[]\
      \ =\n      \"Duration dialog was visible\";\n  static constexpr char kHatsPsdNewExtensionName[] = \"New extension name\"\
      ;\n  static constexpr char kHatsPsdNewExtensionId[] = \"New extension ID\";\n\n  static constexpr char kHatsUserChoiceNewProvider[]\
      \ = \"New provider\";\n  static constexpr char kHatsUserChoicePreviousProvider[] = \"Previous provider\";\n  static\
      \ constexpr char kHatsUserChoiceDismissed[] = \"Dismissed\";\n  static constexpr char kHatsUserChoiceClosedWithoutUserAction[]\
      \ =\n      \"Closed without user action\";\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Potentially triggers a HaTS survey, for the trigger value supplied in\n  //\
      \ dialog parameters.\n  static void MaybeShowHatsSurvey(Profile* profile,\n                                  const std::string&\
      \ survey_trigger,\n                                  DialogResult result,\n                                  base::TimeDelta\
      \ duration,\n                                  const std::string& extension_name,\n                                \
      \  const std::string& extension_id);\n\n  // Constants for HaTS survey PSD keys and values.\n  static constexpr char\
      \ kHatsPsdChannel[] = \"Channel\";\n  static constexpr char kHatsPsdUserChoice[] = \"User choice\";\n  static constexpr\
      \ char kHatsPsdTimeDialogVisible[] =\n      \"Duration dialog was visible\";\n  static constexpr char kHatsPsdNewExtensionName[]\
      \ = \"New extension name\";\n  static constexpr char kHatsPsdNewExtensionId[] = \"New extension ID\";\n\n  static constexpr\
      \ char kHatsUserChoiceNewProvider[] = \"New provider\";\n  static constexpr char kHatsUserChoicePreviousProvider[] =\
      \ \"Previous provider\";\n  static constexpr char kHatsUserChoiceDismissed[] = \"Dismissed\";\n  static constexpr char\
      \ kHatsUserChoiceClosedWithoutUserAction[] =\n      \"Closed without user action\";\n\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Omit survey-only dialog timing state on Android
  regex:
    pattern: "  // Time the dialog was shown.\n  base::TimeTicks show_time_;"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Time the dialog was shown.\n  base::TimeTicks show_time_;\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
