substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "chrome/browser/ui/extensions/extension_settings_overridden_dialog.h"


      '
    replace: '#include "chrome/browser/ui/extensions/extension_settings_overridden_dialog.h"


      #include "build/build_config.h"


      '
  count: 1
- description: Exclude Android survey-only include chrome/browser/ui/hats/hats_service.h
  regex:
    pattern: '#include "chrome/browser/ui/hats/hats_service.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/hats/hats_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android survey-only include chrome/browser/ui/hats/hats_service_factory.h
  regex:
    pattern: '#include "chrome/browser/ui/hats/hats_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/hats/hats_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android survey-only include chrome/browser/ui/hats/survey_config.h
  regex:
    pattern: '#include "chrome/browser/ui/hats/survey_config.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/hats/survey_config.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude post-dialog survey launch on Android
  regex:
    pattern: "  if (params_.hats_survey_trigger) {\n    base::TimeDelta duration = show_time_.is_null()\n                \
      \                   ? base::TimeDelta()\n                                   : base::TimeTicks::Now() - show_time_;\n\
      \    MaybeShowHatsSurvey(\n        base::to_address(profile_), *params_.hats_survey_trigger, result,\n        duration,\
      \ params_.extension_name, params_.controlling_extension_id);\n  }"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (params_.hats_survey_trigger) {\n    base::TimeDelta duration = show_time_.is_null()\n\
      \                                   ? base::TimeDelta()\n                                   : base::TimeTicks::Now()\
      \ - show_time_;\n    MaybeShowHatsSurvey(\n        base::to_address(profile_), *params_.hats_survey_trigger, result,\n\
      \        duration, params_.extension_name, params_.controlling_extension_id);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: 'Compile survey-only function only outside Android: void ExtensionSettingsOverriddenDialog::MaybeShowHatsSurvey('
  regex:
    pattern: "void ExtensionSettingsOverriddenDialog::MaybeShowHatsSurvey(\n    Profile* profile,\n    const std::string&\
      \ survey_trigger,\n    DialogResult result,\n    base::TimeDelta duration,\n    const std::string& extension_name,\n\
      \    const std::string& extension_id) {\n  HatsService* hats_service =\n      HatsServiceFactory::GetForProfile(profile,\
      \ /*create_if_necessary=*/true);\n  if (!hats_service) {\n    return;\n  }\n\n  SurveyStringData data_map;\n  data_map[kHatsPsdChannel]\
      \ =\n      std::string(version_info::GetChannelString(chrome::GetChannel()));\n\n  std::string user_choice;\n  switch\
      \ (result) {\n    case DialogResult::kChangeSettingsBack:\n      user_choice = kHatsUserChoicePreviousProvider;\n  \
      \    break;\n    case DialogResult::kKeepNewSettings:\n      user_choice = kHatsUserChoiceNewProvider;\n      break;\n\
      \    case DialogResult::kDialogDismissed:\n      user_choice = kHatsUserChoiceDismissed;\n      break;\n    case DialogResult::kDialogClosedWithoutUserAction:\n\
      \      user_choice = kHatsUserChoiceClosedWithoutUserAction;\n      break;\n    default:\n      NOTREACHED();\n  }\n\
      \  data_map[kHatsPsdUserChoice] = user_choice;\n\n  data_map[kHatsPsdTimeDialogVisible] = base::NumberToString(\n  \
      \    ukm::GetExponentialBucketMinForUserTiming(duration.InSeconds()));\n  data_map[kHatsPsdNewExtensionName] = extension_name;\n\
      \  data_map[kHatsPsdNewExtensionId] = extension_id;\n\n  hats_service->LaunchDelayedSurvey(survey_trigger, /*timeout_ms=*/5000,\
      \ {},\n                                    data_map);\n}"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid ExtensionSettingsOverriddenDialog::MaybeShowHatsSurvey(\n    Profile* profile,\n\
      \    const std::string& survey_trigger,\n    DialogResult result,\n    base::TimeDelta duration,\n    const std::string&\
      \ extension_name,\n    const std::string& extension_id) {\n  HatsService* hats_service =\n      HatsServiceFactory::GetForProfile(profile,\
      \ /*create_if_necessary=*/true);\n  if (!hats_service) {\n    return;\n  }\n\n  SurveyStringData data_map;\n  data_map[kHatsPsdChannel]\
      \ =\n      std::string(version_info::GetChannelString(chrome::GetChannel()));\n\n  std::string user_choice;\n  switch\
      \ (result) {\n    case DialogResult::kChangeSettingsBack:\n      user_choice = kHatsUserChoicePreviousProvider;\n  \
      \    break;\n    case DialogResult::kKeepNewSettings:\n      user_choice = kHatsUserChoiceNewProvider;\n      break;\n\
      \    case DialogResult::kDialogDismissed:\n      user_choice = kHatsUserChoiceDismissed;\n      break;\n    case DialogResult::kDialogClosedWithoutUserAction:\n\
      \      user_choice = kHatsUserChoiceClosedWithoutUserAction;\n      break;\n    default:\n      NOTREACHED();\n  }\n\
      \  data_map[kHatsPsdUserChoice] = user_choice;\n\n  data_map[kHatsPsdTimeDialogVisible] = base::NumberToString(\n  \
      \    ukm::GetExponentialBucketMinForUserTiming(duration.InSeconds()));\n  data_map[kHatsPsdNewExtensionName] = extension_name;\n\
      \  data_map[kHatsPsdNewExtensionId] = extension_id;\n\n  hats_service->LaunchDelayedSurvey(survey_trigger, /*timeout_ms=*/5000,\
      \ {},\n                                    data_map);\n}\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Do not track Android dialog timestamps solely for surveys
  regex:
    pattern: '  show_time_ = base::TimeTicks::Now();'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  show_time_ = base::TimeTicks::Now();\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
