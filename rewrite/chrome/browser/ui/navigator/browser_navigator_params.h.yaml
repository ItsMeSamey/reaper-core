{
  "substitutions": [
    {
      "description": "Add `storage_partition_config` to NavigateParams for Brave's container support.\n",
      "regex": {
        "re_pattern": "(struct NavigateParams\\ {\\n)",
        "replace": "\\1#if BUILDFLAG(ENABLE_CONTAINERS)\n  std::optional<content::StoragePartitionConfig> storage_partition_config;\n#endif\\n"
      }
    },
    {
      "description": "Add an Android-only typed container specifier to NavigateParams.",
      "regex": {
        "re_pattern": "\\#if\\ BUILDFLAG\\(ENABLE_CONTAINERS\\)\\\n\\ \\ std::optional<content::StoragePartitionConfig>\\ storage_partition_config;\\\n\\#endif\\\n",
        "replace": "#if BUILDFLAG(ENABLE_CONTAINERS)\n  std::optional<content::StoragePartitionConfig> storage_partition_config;\n#endif\n#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_CONTAINERS)\n  containers::ContainerSpecifier container_specifier{};\n#endif\n"
      },
      "count": 1
    }
  ]
}
