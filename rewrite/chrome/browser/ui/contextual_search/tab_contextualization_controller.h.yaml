\\\n\\#endif\\ \\ //\\ BUILDFLAG\\(ENABLE_PDF\\)\\\n\\\n\\ \\ //\\ Downscales\\ the\\ screenshot\\ if\\ it\\ exceeds\\ the\\ max\\ dimension\\ and\\ calls\\ the\\\n\\ \\ //\\ callback\\ with\\ the\\ downscaled\\ screenshot\\.\\\n\\ \\ void\\ DownscaleScreenshotAndContinue\\(\\\n\\ \\ \\ \\ \\ \\ base::ScopedClosureRunner\\ decrement_capturer_count_runner,\\\n\\ \\ \\ \\ \\ \\ std::optional<lens::ImageEncodingOptions>\\ image_options,\\\n\\ \\ \\ \\ \\ \\ CaptureScreenshotCallback\\ callback,\\\n\\ \\ \\ \\ \\ \\ const\\ content::CopyFromSurfaceResult\\&\\ result\\);\\\n\\\n\\ \\ //\\ Called\\ when\\ screenshot\\ is\\ captured\\.\\ Calls\\ the\\ callback\\ with\\ the\\ supplied\\\n\\ \\ //\\ contextual\\ input\\ data\\ including\\ the\\ screenshot\\.\\\n\\ \\ void\\ AddScreenshotToContextDataAndContinue\\(\\\n\\ \\ \\ \\ \\ \\ GetPageContextCallback\\ callback,\\\n\\ \\ \\ \\ \\ \\ std::unique_ptr<lens::ContextualInputData>\\ data,\\\n\\ \\ \\ \\ \\ \\ const\\ SkBitmap\\&\\ screenshot\\);\\\n\\\n\\ \\ //\\ The\\ page\\ context\\ eligibility\\ API\\ if\\ it\\ has\\ been\\ fetched\\.\\ Can\\ be\\ nullptr\\.\\\n\\ \\ raw_ptr<optimization_guide::PageContextEligibility>\\\n\\ \\ \\ \\ \\ \\ page_context_eligibility_\\ =\\ nullptr;\\\n"
