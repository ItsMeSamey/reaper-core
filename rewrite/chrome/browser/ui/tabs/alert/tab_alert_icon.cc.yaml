# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/tab_alert_icon.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/ui/tabs/alert/tab_alert_icon\.h"\

      \

      \#include\ "chrome/app/vector_icons/vector_icons\.h"\

      \#include\ "chrome/browser/actor/resources/grit/actor_browser_resources\.h"\

      \#include\ "chrome/browser/glic/browser_ui/glic_vector_icon_manager\.h"\

      \#include\ "chrome/browser/ui/color/chrome_color_id\.h"\

      \#include\ "chrome/browser/ui/layout_constants\.h"\

      \#include\ "chrome/common/chrome_features\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/ui/tabs/alert/tab_alert_icon.h"

      #include "build/build_config.h"


      #include "chrome/app/vector_icons/vector_icons.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/resources/grit/actor_browser_resources.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/browser_ui/glic_vector_icon_manager.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/color/chrome_color_id.h"

      #include "chrome/browser/ui/layout_constants.h"

      #include "chrome/common/chrome_features.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/tab_alert_icon.cc'
  regex:
    re_pattern: '\#include\ "components/vector_icons/vector_icons\.h"\

      \#include\ "ui/base/models/image_model\.h"\

      \#include\ "ui/base/ui_base_features\.h"\

      \

      namespace\ tabs\ \{\

      \

      '
    replace: '#include "components/vector_icons/vector_icons.h"

      #include "ui/base/models/image_model.h"

      #include "ui/base/ui_base_features.h"

      #include "ui/gfx/vector_icon_types.h"


      namespace tabs {


      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/tab_alert_icon.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ vector_icons::kCardboardOldIcon;\

      \ \ \ \ case\ TabAlert::kActorWaitingOnUser:\

      \ \ \ \ case\ TabAlert::kActorAccessing:\

      \ \ \ \ \ \ if\ \(base::FeatureList::IsEnabled\(features::kGlicActorUiNewIcon\)\)\ \{\

      \ \ \ \ \ \ \ \ return\ kCursorSparkIcon;\

      \ \ \ \ \ \ \}\

      \ \ \ \ \ \ return\ glic::GlicVectorIconManager::GetVectorIcon\(\

      \ \ \ \ \ \ \ \ \ \ IDR_ACTOR_AUTO_BROWSE_ICON\);\

      \ \ \ \ case\ TabAlert::kGlicAccessing:\

      \ \ \ \ case\ TabAlert::kGlicSharing:\

      \ \ \ \ \ \ return\ glic::GlicVectorIconManager::GetVectorIcon\(\

      \ \ \ \ \ \ \ \ \ \ IDR_GLIC_ACCESSING_ICON\);\

      \ \ \ \ case\ TabAlert::kNone:\

      \ \ \ \ \ \ NOTREACHED\(\);\

      \ \ \}\

      '
    replace: "                 : vector_icons::kCardboardOldIcon;\n    case TabAlert::kActorWaitingOnUser:\n    case TabAlert::kActorAccessing:\n#if !BUILDFLAG(IS_ANDROID)\n      if (base::FeatureList::IsEnabled(features::kGlicActorUiNewIcon)) {\n        return kCursorSparkIcon;\n      }\n      return glic::GlicVectorIconManager::GetVectorIcon(\n          IDR_ACTOR_AUTO_BROWSE_ICON);\n#else\n      return gfx::VectorIcon::EmptyIcon();\n#endif  // !BUILDFLAG(IS_ANDROID)\n    case TabAlert::kGlicAccessing:\n    case TabAlert::kGlicSharing:\n#if !BUILDFLAG(IS_ANDROID)\n      return glic::GlicVectorIconManager::GetVectorIcon(\n          IDR_GLIC_ACCESSING_ICON);\n#else\n      return gfx::VectorIcon::EmptyIcon();\n#endif  // !BUILDFLAG(IS_ANDROID)\n    case TabAlert::kNone:\n      NOTREACHED();\n  }\n"
