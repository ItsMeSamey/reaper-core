# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/tab_alert_controller.h'
  regex:
    re_pattern: '\#define\ CHROME_BROWSER_UI_TABS_ALERT_TAB_ALERT_CONTROLLER_H_\

      \

      \#include\ <optional>\

      \#include\ <vector>\

      \

      \#include\ "base/callback_list\.h"\

      '
    replace: '#define CHROME_BROWSER_UI_TABS_ALERT_TAB_ALERT_CONTROLLER_H_


      #include <optional>

      #include "build/build_config.h"

      #include <vector>


      #include "base/callback_list.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/tab_alert_controller.h'
  regex:
    re_pattern: 'class\ WebContents;\

      \}\ \ //\ namespace\ content\

      \

      namespace\ actor::ui\ \{\

      enum\ class\ TabIndicatorStatus;\

      \}\ \ //\ namespace\ actor::ui\

      \

      namespace\ tabs\ \{\

      class\ TabInterface;\

      '
    replace: 'class WebContents;

      }  // namespace content


      #if !BUILDFLAG(IS_ANDROID)

      namespace actor::ui {

      enum class TabIndicatorStatus;

      }  // namespace actor::ui

      #endif  // !BUILDFLAG(IS_ANDROID)


      namespace tabs {

      class TabInterface;

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/tab_alert_controller.h'
  regex:
    re_pattern: '\ private:\

      \ \ class\ ScopedAlertNotifier;\

      \

      \ \ void\ OnGlicSharingStateChange\(bool\ is_sharing\);\

      \ \ void\ OnGlicAccessingStateChange\(bool\ is_accessing\);\

      \

      \ \ void\ OnActorTabIndicatorStateChanged\(\

      \ \ \ \ \ \ actor::ui::TabIndicatorStatus\ tab_indicator_state\);\

      \ \ void\ OnRecentlyAudibleStateChanged\(bool\ was_audible\);\

      \

      \ \ //\ Adds\ `alert`\ to\ the\ set\ of\ already\ active\ alerts\ for\ this\ tab\ if\ it\ isn''t\

      '
    replace: " private:\n  class ScopedAlertNotifier;\n\n#if !BUILDFLAG(IS_ANDROID)\n  void OnGlicSharingStateChange(bool is_sharing);\n  void OnGlicAccessingStateChange(bool is_accessing);\n\n  void OnActorTabIndicatorStateChanged(\n      actor::ui::TabIndicatorStatus tab_indicator_state);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  void OnRecentlyAudibleStateChanged(bool was_audible);\n\n  // Adds `alert` to the set of already active alerts for this tab if it isn't\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/tab_alert_controller.h'
  regex:
    re_pattern: '\

      \ \ //\ Subscriptions\ to\ be\ notified\ when\ an\ alert\ status\ has\ changed\.\

      \ \ base::CallbackListSubscription\ recently_audible_subscription_;\

      \ \ std::vector<base::CallbackListSubscription>\ callback_subscriptions_;\

      \ \ base::ScopedClosureRunner\ actor_tab_indicator_callback_runner_;\

      \

      \ \ ui::ScopedUnownedUserData<TabAlertController>\ scoped_unowned_user_data_;\

      \};\

      '
    replace: "\n  // Subscriptions to be notified when an alert status has changed.\n  base::CallbackListSubscription recently_audible_subscription_;\n#if !BUILDFLAG(IS_ANDROID)\n  std::vector<base::CallbackListSubscription> callback_subscriptions_;\n  base::ScopedClosureRunner actor_tab_indicator_callback_runner_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  ui::ScopedUnownedUserData<TabAlertController> scoped_unowned_user_data_;\n};\n"
