# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//chrome/browser/media/webrtc",\

      \ \ \ \ "//chrome/browser/ui/color:color_headers",\

      \ \ \]\

      \}\

      \

      source_set\("impl"\)\ \{\

      '
    replace: "    \"//chrome/browser/media/webrtc\",\n    \"//chrome/browser/ui/color:color_headers\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/actor/ui\" ]\n  }\n}\n\nsource_set(\"impl\") {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//components/tabs:public",\

      \ \ \ \ "//components/vector_icons",\

      \ \ \]\

      \}\

      \

      \#\ TODO\(crbug\.com/542691146\):\ Enable\ unit_tests\ on\ Android\

      '
    replace: "    \"//components/tabs:public\",\n    \"//components/vector_icons\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/actor/resources:grit\",\n      \"//chrome/browser/actor/ui\",\n      \"//chrome/browser/glic\",\n      \"//chrome/browser/glic/browser_ui\",\n    ]\n  }\n}\n\n# TODO(crbug.com/542691146): Enable unit_tests on Android\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//testing/gmock",\

      \ \ \ \ \ \ "//testing/gtest",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ source_set\("interactive_ui_tests"\)\ \{\

      '
    replace: "      \"//testing/gmock\",\n      \"//testing/gtest\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/glic\",\n        \"//chrome/browser/glic:mojo_bindings_shared_cpp_sources\",\n        \"//chrome/browser/glic/test_support\",\n      ]\n    }\n  }\n\n  source_set(\"interactive_ui_tests\") {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/tabs/alert/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//testing/gmock",\

      \ \ \ \ \ \ "//testing/gtest",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      '
    replace: "      \"//testing/gmock\",\n      \"//testing/gtest\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/glic\",\n        \"//chrome/browser/glic:mojo_bindings_shared_cpp_sources\",\n        \"//chrome/browser/glic/browser_ui\",\n        \"//chrome/browser/glic/test_support\",\n      ]\n    }\n  }\n}\n"
