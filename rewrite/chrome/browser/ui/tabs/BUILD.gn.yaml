- description: Exclude the dedicated page_context_eligibility_helper implementation and dependencies on Android; preserve
    its desktop target
  regex:
    pattern: "source_set(\"page_context_eligibility_helper\") {\n  sources = [\n    \"page_context_eligibility_helper.cc\"\
      ,\n    \"page_context_eligibility_helper.h\",\n  ]\n  public_deps = [\n    \":tabs_public\",\n    \"//ui/base/unowned_user_data\"\
      ,\n  ]\n  deps = [\n    \"//base\",\n    \"//chrome/browser/profiles:profile\",\n    \"//chrome/browser/signin\",\n\
      \    \"//components/optimization_guide/content/browser:page_context_eligibility\",\n    \"//components/signin/public/identity_manager\"\
      ,\n  ]\n}"
    replace: "if (is_android) {\n  group(\"page_context_eligibility_helper\") {}\n} else {\n  source_set(\"page_context_eligibility_helper\"\
      ) {\n    sources = [\n      \"page_context_eligibility_helper.cc\",\n      \"page_context_eligibility_helper.h\",\n\
      \    ]\n    public_deps = [\n      \":tabs_public\",\n      \"//ui/base/unowned_user_data\",\n    ]\n    deps = [\n\
      \      \"//base\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/signin\",\n      \"//components/optimization_guide/content/browser:page_context_eligibility\"\
      ,\n      \"//components/signin/public/identity_manager\",\n    ]\n  }\n}"
