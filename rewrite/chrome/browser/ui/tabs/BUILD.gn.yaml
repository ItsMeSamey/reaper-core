      \ \ \ \ \ \ "tab_menu_model_delegate\.h",\

      \ \ \ \ \]\

      \

      \ \ \ \ public_deps\ =\ \[\

      \ \ \ \ \ \ "//base",\

      '
    replace: "      \"tab_menu_model_delegate.cc\",\n      \"tab_menu_model_delegate.h\",\n    ]\n    if (is_android) {\n      sources -= [ \"glic_tab_sub_menu_model.h\" ]\n    }\n\n    public_deps = [\n      \"//base\",\n"
