substitutions:
- description: Keep desktop-only pass detection feature include out of Android
  regex:
    pattern: '#include "components/wallet/core/common/wallet_features.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/wallet/core/common/wallet_features.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
