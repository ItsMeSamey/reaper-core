# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/toolbar/chrome_location_bar_model_delegate.h'
  regex:
    re_pattern: '\#define\ CHROME_BROWSER_UI_TOOLBAR_CHROME_LOCATION_BAR_MODEL_DELEGATE_H_\

      \

      \#include\ "components/omnibox/browser/location_bar_model_delegate\.h"\

      \

      class\ Profile;\

      \

      '
    replace: '#define CHROME_BROWSER_UI_TOOLBAR_CHROME_LOCATION_BAR_MODEL_DELEGATE_H_


      #include "components/omnibox/browser/location_bar_model_delegate.h"

      #include "build/build_config.h"


      class Profile;


      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/toolbar/chrome_location_bar_model_delegate.h'
  regex:
    re_pattern: '\ \ bool\ IsNewTabPage\(\)\ const\ override;\

      \ \ bool\ IsNewTabPageURL\(const\ GURL\&\ url\)\ const\ override;\

      \ \ bool\ IsHomePage\(const\ GURL\&\ url\)\ const\ override;\

      \ \ bool\ IsContextualTasksPage\(\)\ const\ override;\

      \ \ GURL\ GetContextualTasksInnerFrameURL\(\)\ const\ override;\

      \ \ AutocompleteClassifier\*\ GetAutocompleteClassifier\(\)\ override;\

      \ \ TemplateURLService\*\ GetTemplateURLService\(\)\ override;\

      \

      '
    replace: "  bool IsNewTabPage() const override;\n  bool IsNewTabPageURL(const GURL& url) const override;\n  bool IsHomePage(const GURL& url) const override;\n#if !BUILDFLAG(IS_ANDROID)\n  bool IsContextualTasksPage() const override;\n  GURL GetContextualTasksInnerFrameURL() const override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n  AutocompleteClassifier* GetAutocompleteClassifier() override;\n  TemplateURLService* GetTemplateURLService() override;\n\n"
