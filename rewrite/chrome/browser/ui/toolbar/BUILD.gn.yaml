# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/toolbar/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//content/public/browser",\

      \ \ \ \ "//content/public/common",\

      \ \ \]\

      \

      \ \ if\ \(enable_offline_pages\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//chrome:offline_pages_enum_javagen"\ \]\

      '
    replace: "    \"//content/public/browser\",\n    \"//content/public/common\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/contextual_tasks\",\n      \"//components/contextual_tasks/public:feature_list\",\n    ]\n  }\n\n  if (enable_offline_pages) {\n    deps += [ \"//chrome:offline_pages_enum_javagen\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/toolbar/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/base/mojom:ui_base_types",\

      \ \ \ \ \ \ "//ui/menus",\

      \ \ \ \ \]\

      \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ "//chrome/browser/ui:ui_features",\

      \ \ \ \ \ \ "//chrome/browser/ui/actions:actions_headers",\

      '
    replace: "      \"//ui/base/mojom:ui_base_types\",\n      \"//ui/menus\",\n    ]\n    if (is_android) {\n      public_deps -= [ \"//components/contextual_tasks/public:feature_list\" ]\n    }\n    deps += [\n      \"//chrome/browser/ui:ui_features\",\n      \"//chrome/browser/ui/actions:actions_headers\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/toolbar/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/menus",\

      \ \ \ \ \ \ "//ui/strings:ui_strings_grit",\

      \ \ \ \ \]\

      \ \ \ \ if\ \(is_chromeos\)\ \{\

      \ \ \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/policy:system_features_disable_list"\ \]\

      \ \ \ \ \}\ else\ \{\

      '
    replace: "      \"//ui/menus\",\n      \"//ui/strings:ui_strings_grit\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/glic\",\n        \"//chrome/browser/glic/browser_ui\",\n        \"//chrome/browser/glic/resources:grit\",\n        \"//chrome/browser/glic/resources:grit_grit\",\n        \"//components/contextual_tasks/public:feature_list\",\n      ]\n    }\n    if (is_chromeos) {\n      deps += [ \"//chrome/browser/policy:system_features_disable_list\" ]\n    } else {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/toolbar/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/base:features",\

      \ \ \ \ \ \ "//ui/gfx",\

      \ \ \ \ \]\

      \ \ \ \ if\ \(is_chromeos\)\ \{\

      \ \ \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ \ \ "//chrome/browser/policy:system_features_disable_list",\

      '
    replace: "      \"//ui/base:features\",\n      \"//ui/gfx\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/glic\" ]\n    }\n    if (is_chromeos) {\n      deps += [\n        \"//chrome/browser/policy:system_features_disable_list\",\n"
