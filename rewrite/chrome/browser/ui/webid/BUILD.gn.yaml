# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webid/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//skia",\

      \ \ \ \ "//ui/base",\

      \ \ \]\

      \}\

      \

      if\ \(!is_android\)\ \{\

      '
    replace: "    \"//skia\",\n    \"//ui/base\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/actor\" ]\n  }\n}\n\nif (!is_android) {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/webid/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//testing/gtest",\

      \ \ \ \ \ \ "//url",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ source_set\("unit_tests"\)\ \{\

      '
    replace: "      \"//testing/gtest\",\n      \"//url\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor\",\n        \"//chrome/browser/actor:test_support\",\n      ]\n    }\n  }\n\n  source_set(\"unit_tests\") {\n"
