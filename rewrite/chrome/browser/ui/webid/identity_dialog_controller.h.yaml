substitutions:
- description: make-retained-header-dependencies-explicit
  regex:
    pattern: '#include "base/memory/raw_ptr.h"

      '
    replace: '#include "base/memory/raw_ptr.h"

      #include "base/memory/weak_ptr.h"

      #include "build/build_config.h"

      '
  count: 1
- description: guard-actor-header-dependencies
  regex:
    pattern: '#include "chrome/browser/actor/actor_keyed_service.h"

      #include "chrome/browser/actor/actor_task.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/actor_keyed_service.h"

      #include "chrome/browser/actor/actor_task.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: guard-desktop-tab-interface-header
  regex:
    pattern: '#include "components/tabs/public/tab_interface.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/tabs/public/tab_interface.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: guard-actor-testing-declaration
  regex:
    pattern: "  // Set acting_task_id for testing purposes.\n  void SetActingTaskIdForTesting(actor::TaskId task_id);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Set acting_task_id for testing purposes.\n  void SetActingTaskIdForTesting(actor::TaskId\
      \ task_id);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: guard-actor-private-methods
  regex:
    pattern: "  void OnActorTaskStateChanged(actor::ActorTask& task);\n\n  void UpdateTaskId(actor::TaskId task_id);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void OnActorTaskStateChanged(actor::ActorTask& task);\n\n  void UpdateTaskId(actor::TaskId\
      \ task_id);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: remove-android-actor-state-members
  regex:
    pattern: "  // The ID of the actor task currently acting on the tab, if any.\n  actor::TaskId acting_task_id_;\n  base::CallbackListSubscription\
      \ actor_task_state_subscription_;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // The ID of the actor task currently acting on the tab, if any.\n  actor::TaskId\
      \ acting_task_id_;\n  base::CallbackListSubscription actor_task_state_subscription_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: exclude-actor-only-ui-invocation-state
  regex:
    pattern: "  // Wheter we invoked any show methods. UI may be shown be not invoked in cases\n  // such as an active actor\
      \ task.\n  bool did_invoke_show_ui_ = false;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Wheter we invoked any show methods. UI may be shown be not invoked in cases\n\
      \  // such as an active actor task.\n  bool did_invoke_show_ui_ = false;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
