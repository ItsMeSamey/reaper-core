substitutions:
- description: guard-actor-service-includes
  regex:
    pattern: '#include "chrome/browser/actor/actor_keyed_service.h"

      #include "chrome/browser/actor/actor_task.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/actor_keyed_service.h"

      #include "chrome/browser/actor/actor_task.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: remove-android-actor-subscription
  regex:
    pattern: "  actor::ActorKeyedService* actor_service =\n      actor::ActorKeyedService::Get(profile);\n  if (actor_service)\
      \ {\n    actor_task_state_subscription_ = actor_service->AddTaskStateChangedCallback(\n        base::BindRepeating(&IdentityDialogController::OnActorTaskStateChanged,\n\
      \                            weak_ptr_factory_.GetWeakPtr()));\n    const actor::ActorTask* acting_task =\n        actor_service->GetActingActorTaskForWebContents(rp_web_contents_);\n\
      \    if (acting_task) {\n      acting_task_id_ = acting_task->id();\n    }\n  }\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  actor::ActorKeyedService* actor_service =\n      actor::ActorKeyedService::Get(profile);\n\
      \  if (actor_service) {\n    actor_task_state_subscription_ = actor_service->AddTaskStateChangedCallback(\n        base::BindRepeating(&IdentityDialogController::OnActorTaskStateChanged,\n\
      \                            weak_ptr_factory_.GetWeakPtr()));\n    const actor::ActorTask* acting_task =\n        actor_service->GetActingActorTaskForWebContents(rp_web_contents_);\n\
      \    if (acting_task) {\n      acting_task_id_ = acting_task->id();\n    }\n  }\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: remove-android-actor-state-methods
  regex:
    pattern: "void IdentityDialogController::OnActorTaskStateChanged(actor::ActorTask& task) {\n  const actor::TaskId task_id\
      \ = task.id();\n  const actor::ActorTask::State state = task.GetState();\n\n  actor::ActorKeyedService* actor_service\
      \ =\n      actor::ActorKeyedService::Get(rp_web_contents_->GetBrowserContext());\n  CHECK(actor_service);\n  // TODO(b:472336281):\
      \ this can be simplified once the bug is fixed, but for\n  // not a completed task does not know which tabs it was acting\
      \ on.\n  if (acting_task_id_ == task_id && actor::ActorTask::IsCompletedState(state)) {\n    UpdateTaskId(actor::TaskId());\n\
      \    return;\n  }\n\n  tabs::TabInterface* tab =\n      tabs::TabInterface::MaybeGetFromContents(rp_web_contents_);\n\
      \  if (!tab || !task.IsActingOnTab(tab->GetHandle())) {\n    if (acting_task_id_ == task_id) {\n      // The task we\
      \ thought was acting on this tab is no longer active, so we\n      // clear the task ID.\n      UpdateTaskId(actor::TaskId());\n\
      \    }\n    return;\n  }\n  UpdateTaskId(task.IsUnderActorControl() ? task_id : actor::TaskId());\n}\n\nvoid IdentityDialogController::UpdateTaskId(actor::TaskId\
      \ task_id) {\n  acting_task_id_ = task_id;\n  if (account_view_) {\n    account_view_->SetCanShowUi(acting_task_id_.is_null());\n\
      \    if (acting_task_id_.is_null() && did_invoke_show_ui_) {\n      did_show_ui_ = true;\n    }\n  }\n  // If there\
      \ is no longer an active task (e.g. user takes over the task) and we\n  // previously invoked active mode UI, dismiss\
      \ the current API call.\n  if (acting_task_id_.is_null() && rp_mode_ == blink::mojom::RpMode::kActive &&\n      on_dismiss_)\
      \ {\n    std::move(on_dismiss_).Run(DismissReason::kOther);\n  }\n}\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid IdentityDialogController::OnActorTaskStateChanged(actor::ActorTask& task) {\n\
      \  const actor::TaskId task_id = task.id();\n  const actor::ActorTask::State state = task.GetState();\n\n  actor::ActorKeyedService*\
      \ actor_service =\n      actor::ActorKeyedService::Get(rp_web_contents_->GetBrowserContext());\n  CHECK(actor_service);\n\
      \  // TODO(b:472336281): this can be simplified once the bug is fixed, but for\n  // not a completed task does not know\
      \ which tabs it was acting on.\n  if (acting_task_id_ == task_id && actor::ActorTask::IsCompletedState(state)) {\n \
      \   UpdateTaskId(actor::TaskId());\n    return;\n  }\n\n  tabs::TabInterface* tab =\n      tabs::TabInterface::MaybeGetFromContents(rp_web_contents_);\n\
      \  if (!tab || !task.IsActingOnTab(tab->GetHandle())) {\n    if (acting_task_id_ == task_id) {\n      // The task we\
      \ thought was acting on this tab is no longer active, so we\n      // clear the task ID.\n      UpdateTaskId(actor::TaskId());\n\
      \    }\n    return;\n  }\n  UpdateTaskId(task.IsUnderActorControl() ? task_id : actor::TaskId());\n}\n\nvoid IdentityDialogController::UpdateTaskId(actor::TaskId\
      \ task_id) {\n  acting_task_id_ = task_id;\n  if (account_view_) {\n    account_view_->SetCanShowUi(acting_task_id_.is_null());\n\
      \    if (acting_task_id_.is_null() && did_invoke_show_ui_) {\n      did_show_ui_ = true;\n    }\n  }\n  // If there\
      \ is no longer an active task (e.g. user takes over the task) and we\n  // previously invoked active mode UI, dismiss\
      \ the current API call.\n  if (acting_task_id_.is_null() && rp_mode_ == blink::mojom::RpMode::kActive &&\n      on_dismiss_)\
      \ {\n    std::move(on_dismiss_).Run(DismissReason::kOther);\n  }\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: keep-actor-testing-helper-desktop-only
  regex:
    pattern: "void IdentityDialogController::SetActingTaskIdForTesting(\n    actor::TaskId task_id) {\n  UpdateTaskId(task_id);\n\
      }\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid IdentityDialogController::SetActingTaskIdForTesting(\n    actor::TaskId task_id)\
      \ {\n  UpdateTaskId(task_id);\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: retain-ordinary-android-fedcm-ui
  regex:
    pattern: "bool IdentityDialogController::ShouldShowFedCmUi() {\n  return acting_task_id_.is_null();\n}"
    replace: "bool IdentityDialogController::ShouldShowFedCmUi() {\n#if BUILDFLAG(IS_ANDROID)\n  return true;\n#else\n  return\
      \ acting_task_id_.is_null();\n#endif\n}"
  count: 1
- description: exclude-actor-only-ui-invocation-state
  regex:
    pattern: '  did_invoke_show_ui_ = true;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  did_invoke_show_ui_ = true;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 2
