substitutions:
- description: Remove the excluded survey implementation import.
  regex:
    pattern: 'import org.chromium.chrome.browser.ui.signin.SigninSurveyController;

      '
    replace: ''
  count: 1
- description: Remove only the successful sign-in survey trigger; retain completion and continuation navigation.
  regex:
    pattern: "                    SigninSurveyController.registerTrigger(\n                            mProfile, SigninSurveyController.SigninSurveyType.WEB);\n"
    replace: ''
  count: 1
