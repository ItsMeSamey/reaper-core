substitutions:
- description: Remove survey-only bottom-sheet config metadata.
  regex:
    pattern: '    public final @Nullable @SigninSurveyController.SigninSurveyType Integer signinSurveyType;

      '
    replace: ''
  count: 1
- description: Remove survey-only bottom-sheet config metadata.
  regex:
    pattern: '        private @Nullable @SigninSurveyController.SigninSurveyType Integer mSigninSurveyType;

      '
    replace: ''
  count: 1
- description: Remove survey-only bottom-sheet config metadata.
  regex:
    pattern: '        this.signinSurveyType = signinSurveyType;

      '
    replace: ''
  count: 1
- description: Remove the dedicated survey config builder API.
  regex:
    pattern: "        /**\n         * @param type A {@link SigninSurveyController.SigninSurveyType} to show after sign-in.\n\
      \         */\n        public Builder signinSurveyType(@SigninSurveyController.SigninSurveyType int type) {\n       \
      \     mSigninSurveyType = type;\n            return this;\n        }\n\n"
    replace: ''
  count: 1
- description: Close ordinary config construction after removing survey argument.
  regex:
    pattern: "                    mShouldShowSigninSnackbar,\n                    mSigninSurveyType);\n"
    replace: '                    mShouldShowSigninSnackbar);

      '
  count: 1
- description: Remove survey argument from the private config constructor.
  regex:
    pattern: "            boolean shouldShowSigninSnackbar,\n            @Nullable @SigninSurveyController.SigninSurveyType\
      \ Integer signinSurveyType) {\n"
    replace: '            boolean shouldShowSigninSnackbar) {

      '
  count: 1
- description: Retain equality of every ordinary field.
  regex:
    pattern: "                && shouldShowSigninSnackbar == other.shouldShowSigninSnackbar\n                && Objects.equals(signinSurveyType,\
      \ other.signinSurveyType);\n"
    replace: '                && shouldShowSigninSnackbar == other.shouldShowSigninSnackbar;

      '
  count: 1
- description: Retain hash participation of every ordinary field.
  regex:
    pattern: "                shouldShowSigninSnackbar,\n                signinSurveyType);\n"
    replace: '                shouldShowSigninSnackbar);

      '
  count: 1
