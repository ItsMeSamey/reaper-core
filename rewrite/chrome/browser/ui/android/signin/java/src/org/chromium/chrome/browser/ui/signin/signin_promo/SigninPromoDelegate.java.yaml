substitutions:
- description: Remove the excluded survey implementation import.
  regex:
    pattern: 'import org.chromium.chrome.browser.ui.signin.SigninSurveyController;

      '
    replace: ''
  count: 1
- description: Remove the survey-only promo API.
  regex:
    pattern: "    /** Returns a survey trigger if a signin survey should be shown after the promo. */\n    @Nullable\n   \
      \ @SigninSurveyController.SigninSurveyType\n    Integer getSurveyTriggerType() {\n        return null;\n    }\n\n"
    replace: ''
  count: 1
- description: Return the ordinary sign-in config without survey metadata.
  regex:
    pattern: "        @Nullable Integer surveyType = getSurveyTriggerType();\n        BottomSheetSigninAndHistorySyncConfig.Builder\
      \ config =\n                new BottomSheetSigninAndHistorySyncConfig.Builder(\n                        getBottomSheetStrings(),\n\
      \                        NoAccountSigninMode.BOTTOM_SHEET,\n                        mode,\n                        getHistoryOptInMode(),\n\
      \                        getHistorySyncOptInTitle(),\n                        getHistorySyncOptInSubtitle());\n    \
      \    if (surveyType != null) {\n            config.signinSurveyType(surveyType);\n        }\n        return config;\n"
    replace: "        return new BottomSheetSigninAndHistorySyncConfig.Builder(\n                getBottomSheetStrings(),\n\
      \                NoAccountSigninMode.BOTTOM_SHEET,\n                mode,\n                getHistoryOptInMode(),\n\
      \                getHistorySyncOptInTitle(),\n                getHistorySyncOptInSubtitle());\n"
  count: 1
