substitutions:
- description: Remove the excluded survey implementation import.
  regex:
    pattern: 'import org.chromium.chrome.browser.ui.signin.SigninSurveyController;

      '
    replace: ''
  count: 1
- description: Remove only the survey trigger; retain sign-in completion and advancing the flow.
  regex:
    pattern: "                if (mConfig.signinSurveyType != null) {\n                    SigninSurveyController.registerTrigger(\n\
      \                            assertNonNull(getProfile()), mConfig.signinSurveyType);\n                }\n"
    replace: ''
  count: 1
