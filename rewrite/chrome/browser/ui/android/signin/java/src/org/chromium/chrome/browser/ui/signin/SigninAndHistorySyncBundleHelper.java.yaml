substitutions:
- description: Remove survey-only serialized bundle key.
  regex:
    pattern: '    private static final String BOTTOM_SHEET_SURVEY_CONFIG = "Signin.BottomSheetSigninSurveyConfig";

      '
    replace: ''
  count: 1
- description: Retire survey-only bundle writes; ordinary account/history/snackbar state is unchanged.
  regex:
    pattern: "        if (config.signinSurveyType != null) {\n            bundle.putInt(BOTTOM_SHEET_SURVEY_CONFIG, config.signinSurveyType);\n\
      \        }\n"
    replace: ''
  count: 1
- description: Ignore historical survey-only bundle metadata while retaining ordinary sign-in state.
  regex:
    pattern: "        Integer surveyType = bundle.getInt(BOTTOM_SHEET_SURVEY_CONFIG, -1);\n        if (surveyType != -1) {\n\
      \            builder.signinSurveyType(surveyType);\n        }\n"
    replace: ''
  count: 1
