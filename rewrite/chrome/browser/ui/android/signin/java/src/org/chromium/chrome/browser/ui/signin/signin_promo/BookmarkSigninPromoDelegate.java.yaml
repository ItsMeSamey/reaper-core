substitutions:
- description: Remove the excluded survey implementation import.
  regex:
    pattern: 'import org.chromium.chrome.browser.ui.signin.SigninSurveyController;

      '
    replace: ''
  count: 1
- description: Remove the override of the retired survey-only promo API.
  regex:
    pattern: "    @Override\n    @Nullable\n    @SigninSurveyController.SigninSurveyType\n    Integer getSurveyTriggerType()\
      \ {\n        return SigninSurveyController.SigninSurveyType.BOOKMARK_PROMO;\n    }\n\n"
    replace: ''
  count: 1
