- description: Keep ordinary serialized URL restoration and reject a stale persisted AI availability bit
  regex:
    pattern: "    public void initializeFromCache_withSerializedUrl() {\n        final SharedPreferencesManager manager =\
      \ ChromeSharedPreferences.getInstance();\n\n        manager.writeString(SEARCH_WIDGET_SEARCH_ENGINE_SHORTNAME, \"Engine\"\
      );\n        manager.writeString(\n                SEARCH_WIDGET_SEARCH_ENGINE_URL, new GURL(\"https://engine.com\").serialize());\n\
      \n        // Force re-read persisted data.\n        SearchActivityPreferencesManager.resetForTesting();\n        SearchActivityPreferences\
      \ data = SearchActivityPreferencesManager.getCurrent();\n\n        Assert.assertEquals(\"Engine\", data.searchEngineName);\n\
      \        Assert.assertEquals(\"https://engine.com/\", data.searchEngineUrl.getSpec());\n    }\n"
    replace: "    public void initializeFromCache_withSerializedUrl() {\n        final SharedPreferencesManager manager =\
      \ ChromeSharedPreferences.getInstance();\n\n        manager.writeString(SEARCH_WIDGET_SEARCH_ENGINE_SHORTNAME, \"Engine\"\
      );\n        manager.writeString(\n                SEARCH_WIDGET_SEARCH_ENGINE_URL, new GURL(\"https://engine.com\").serialize());\n\
      \        manager.writeBoolean(SEARCH_WIDGET_IS_AI_MODE_AVAILABLE, true);\n\n        // Force re-read persisted data.\n\
      \        SearchActivityPreferencesManager.resetForTesting();\n        SearchActivityPreferences data = SearchActivityPreferencesManager.getCurrent();\n\
      \n        Assert.assertEquals(\"Engine\", data.searchEngineName);\n        Assert.assertEquals(\"https://engine.com/\"\
      , data.searchEngineUrl.getSpec());\n        Assert.assertFalse(data.aiModeAvailable);\n    }\n"
  count: 1

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: remove provider test import"
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensController;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove typed provider mock"
  regex:
    re_pattern: "\\ \\ \\ \\ @Mock\\ private\\ LensController\\ mLensController;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove obsolete singleton hook"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ LensController\\.setInstanceForTesting\\(mLensController\\);\\\n"
    replace: ""
  count: 1
- description: "Lens extra: no provider stub needed for disabled Lens"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ doReturn\\(true\\)\\.when\\(mLensController\\)\\.isLensEnabled\\(any\\(\\)\\);\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove disabled-provider stub"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ doReturn\\(false\\)\\.when\\(mLensController\\)\\.isLensEnabled\\(any\\(\\)\\);\\\n"
    replace: ""
  count: 1
- description: "Lens extra: refresh keeps Lens unavailable"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ Assert\\.assertTrue\\(data\\.googleLensAvailable\\);"
    replace: "        Assert.assertFalse(data.googleLensAvailable);"
  count: 1
- description: "Lens extra: state disabled contract"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ //\\ Disable\\ Lens\\."
    replace: "        // Repeated refresh keeps Lens disabled."
  count: 1
- description: "Lens extra: seed stale Lens availability in existing cache regression"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ manager\\.writeBoolean\\(SEARCH_WIDGET_IS_AI_MODE_AVAILABLE,\\ true\\);\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ //\\ Force\\ re\\-read\\ persisted\\ data\\."
    replace: "        manager.writeBoolean(SEARCH_WIDGET_IS_AI_MODE_AVAILABLE, true);\n        manager.writeBoolean(SEARCH_WIDGET_IS_GOOGLE_LENS_AVAILABLE, true);\n\n        // Force re-read persisted data."
  count: 1
- description: "Lens extra: assert stale cache cannot restore removed Lens"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ Assert\\.assertEquals\\(\"https://engine\\.com/\",\\ data\\.searchEngineUrl\\.getSpec\\(\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ Assert\\.assertFalse\\(data\\.aiModeAvailable\\);"
    replace: "        Assert.assertEquals(\"https://engine.com/\", data.searchEngineUrl.getSpec());\n        Assert.assertFalse(data.aiModeAvailable);\n        Assert.assertFalse(data.googleLensAvailable);"
  count: 1
