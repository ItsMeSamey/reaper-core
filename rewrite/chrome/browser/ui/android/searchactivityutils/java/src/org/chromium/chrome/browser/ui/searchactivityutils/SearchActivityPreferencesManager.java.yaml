substitutions:
- description: Remove the retired Composeplate implementation import
  regex:
    pattern: 'import org.chromium.chrome.browser.composeplate.ComposeplateUtils;

      '
    replace: ''
  count: 1
- description: Ignore stale cached AI availability while retaining ordinary cached preferences
  regex:
    pattern: "                        .setAiModeAvailable(\n                                manager.readBoolean(\n       \
      \                                 SEARCH_WIDGET_IS_AI_MODE_AVAILABLE,\n                                        SearchActivityPreferences.DEFAULT_AI_MODE_AVAILABILITY))\n"
    replace: '                        .setAiModeAvailable(false)

      '
  count: 1
- description: Keep AI compatibility availability false after ordinary native preference updates
  regex:
    pattern: "                        .setIncognitoAvailable(IncognitoUtils.isIncognitoModeEnabled(profile))\n           \
      \             .setAiModeAvailable(ComposeplateUtils.isComposeplateEnabled(profile))\n"
    replace: "                        .setIncognitoAvailable(IncognitoUtils.isIncognitoModeEnabled(profile))\n           \
      \             .setAiModeAvailable(false)\n"
  count: 1
- description: Keep AI compatibility availability false after ordinary native preference updates
  regex:
    pattern: "                        .setSearchEngineUrl(url.getOrigin())\n                        .setAiModeAvailable(ComposeplateUtils.isComposeplateEnabled(profile))\n"
    replace: "                        .setSearchEngineUrl(url.getOrigin())\n                        .setAiModeAvailable(false)\n"
  count: 1

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: remove typed Lens implementation imports"
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensController;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensEntryPoint;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensQueryParams;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove Lens-only form-factor helper import"
  regex:
    re_pattern: "import\\ org\\.chromium\\.ui\\.base\\.DeviceFormFactor;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: ignore stale stored Lens availability"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.setGoogleLensAvailable\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ manager\\.readBoolean\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ SEARCH_WIDGET_IS_GOOGLE_LENS_AVAILABLE,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ SearchActivityPreferences\\.DEFAULT_GOOGLE_LENS_AVAILABILITY\\)\\)"
    replace: "                        .setGoogleLensAvailable(false)"
  count: 1
- description: "Lens extra: normal refresh cannot enable removed Lens"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.setGoogleLensAvailable\\(isLensEnabled\\(context\\)\\)"
    replace: "                        .setGoogleLensAvailable(false)"
  count: 1
- description: "Lens extra: remove provider query helper"
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ static\\ boolean\\ isLensEnabled\\(Context\\ context\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ LensQueryParams\\ params\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ new\\ LensQueryParams\\.Builder\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ LensEntryPoint\\.QUICK_ACTION_SEARCH_WIDGET,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ /\\*\\ isIncognito=\\ \\*/\\ false,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ DeviceFormFactor\\.isNonMultiDisplayContextOnTablet\\(context\\)\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.build\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ return\\ LensController\\.getInstance\\(\\)\\.isLensEnabled\\(params\\);\\\n\\ \\ \\ \\ \\}\\\n\\\n"
    replace: ""
  count: 1
