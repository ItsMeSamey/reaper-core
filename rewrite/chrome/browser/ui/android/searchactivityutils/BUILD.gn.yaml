# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/searchactivityutils/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/android:ui_no_recycler_view_java",\

      \ \ \ \ "//url:gurl_java",\

      \ \ \]\

      \}\

      \

      robolectric_library\("junit"\)\ \{\

      '
    replace: "    \"//ui/android:ui_no_recycler_view_java\",\n    \"//url:gurl_java\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/composeplate/android:java\" ]\n  }\n}\n\nrobolectric_library(\"junit\") {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/searchactivityutils/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/android:ui_java",\

      \ \ \ \ "//url:url_java",\

      \ \ \]\

      \}\

      '
    replace: "    \"//ui/android:ui_java\",\n    \"//url:url_java\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/composeplate/android:java\" ]\n  }\n}\n"

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: remove production provider dependency"
  regex:
    re_pattern: "\\ \\ \\ \\ \"//base:base_java\",\\\n\\ \\ \\ \\ \"//chrome/browser/composeplate/android:java\",\\\n\\ \\ \\ \\ \"//chrome/browser/incognito:java\",\\\n\\ \\ \\ \\ \"//chrome/browser/lens:java\",\\\n"
    replace: "    \"//base:base_java\",\n    \"//chrome/browser/composeplate/android:java\",\n    \"//chrome/browser/incognito:java\",\n"
  count: 1
- description: "Lens extra: remove optional test provider dependency"
  regex:
    re_pattern: "\\ \\ \\ \\ \"//base:base_junit_test_support\",\\\n\\ \\ \\ \\ \"//chrome/browser/composeplate/android:java\",\\\n\\ \\ \\ \\ \"//chrome/browser/incognito:java\",\\\n\\ \\ \\ \\ \"//chrome/browser/lens:java\",\\\n"
    replace: "    \"//base:base_junit_test_support\",\n    \"//chrome/browser/composeplate/android:java\",\n    \"//chrome/browser/incognito:java\",\n"
  count: 1
