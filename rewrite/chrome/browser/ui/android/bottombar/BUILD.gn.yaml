substitutions:
  - description: |-
      Build Brave's bottom bar button manager into the upstream component.

      BottomBarCoordinator constructs BraveBottomBarButtonManager, so a target of
      its own would have to be depended on by the component it depends on.
    insert_into_list:
      target: java
      list_name: sources
      values: //brave/browser/ui/android/bottombar/java/src/org/chromium/chrome/browser/ui/bottombar/BraveBottomBarButtonManager.java
  - description: |-
      Depend on Brave's bottom bar user settings.

      isBottomBarEnabled() answers to the "Enable bottom bar" setting.
    insert_into_list:
      target: config_java
      list_name: deps
      values: //brave/browser/ui/android/bottombar:prefs_java

  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/bottombar/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//chrome/browser/glic/android:common_java",\

        \ \ \ \ "//third_party/androidx:androidx_annotation_annotation_java",\

        \ \ \]\

        \}\

        \

        android_library\("java"\)\ \{\

        '
      replace: "    \"//chrome/browser/glic/android:common_java\",\n    \"//third_party/androidx:androidx_annotation_annotation_java\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/glic/android:common_java\" ]\n  }\n}\n\nandroid_library(\"java\") {\n"
