# Android selected-tab device chooser lifetime.
substitutions:
- description: Expose the shared Android chooser guard to existing chooser implementations
  regex:
    re_pattern: source_set\("device_dialog"\)\ \{
    replace: "source_set(\"device_dialog\") {\n  public_deps = [ \"//brave/browser/ui/android/device_chooser\" ]"
- description: Exercise exact-document and selection lifetime through real tab callbacks
  regex:
    re_pattern: \ \ \ \ "hid_chooser_dialog_android_unittest\.cc",
    replace: "    \"//brave/browser/ui/android/device_chooser/active_device_chooser_request_unittest.cc\",\n    \"hid_chooser_dialog_android_unittest.cc\","
- description: Use existing tab mock with real WebContents and navigation observers
  regex:
    re_pattern: \ \ \ \ "//content/test:test_support",
    replace: "    \"//components/tabs:test_support\",\n    \"//chrome/browser/ui/android/tab_model:test_support\",\n    \"//content/test:test_support\","
