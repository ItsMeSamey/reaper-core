# Keep Android tab model observer dispatch alive through reentrant removal.
substitutions:
- description: Keep Android tab model observer dispatch alive through reentrant removal
  regex:
    re_pattern: '\#include\ <vector>\

      \

      \#include\ "base/android/jni_weak_ref\.h"\

      \#include\ "base/android/scoped_java_ref\.h"\

      \#include\ "chrome/browser/flags/android/chrome_session_state\.h"\

      \#include\ "chrome/browser/ui/android/tab_model/tab_model\.h"\

      \#include\ "components/split_tabs/split_tab_id\.h"\

      \#include\ "components/tab_groups/tab_group_id\.h"\

      '
    replace: '#include <vector>


      #include "base/android/jni_weak_ref.h"

      #include "base/android/scoped_java_ref.h"

      #include "base/memory/scoped_refptr.h"

      #include "chrome/browser/flags/android/chrome_session_state.h"

      #include "chrome/browser/ui/android/tab_model/tab_model.h"

      #include "components/split_tabs/split_tab_id.h"

      #include "components/tab_groups/tab_group_id.h"

      '
- description: Keep Android tab model observer dispatch alive through reentrant removal
  regex:
    re_pattern: '\ \ \ \ \ \ SessionID\ window_id\);\

      \

      \ \ JavaObjectWeakGlobalRef\ java_object_;\

      \

      \ \ //\ The\ observer\ bridge\.\ This\ exists\ as\ long\ as\ there\ are\ registered\ observers\.\

      \ \ //\ It\ corresponds\ to\ a\ Java\ observer\ that\ is\ registered\ with\ the\ corresponding\

      \ \ //\ Java\ TabModelJniBridge\.\

      \ \ std::unique_ptr<TabModelObserverJniBridge>\ observer_bridge_;\

      \

      \ \ bool\ is_archived_tab_model_;\

      \ \ //\ Cannot\ use\ a\ conventional\ member\ variable\ because\ this\ is\ initialized\ after\

      \ \ //\ the\ constructor\.\

      '
    replace: "      SessionID window_id);\n\n  JavaObjectWeakGlobalRef java_object_;\n\n  void ReleaseEmptyObserverBridge();\n\n  // Exists while there are registered observers or a notification is in flight.\n  // It corresponds to a Java observer that is registered with the corresponding\n  // Java TabModelJniBridge.\n  scoped_refptr<TabModelObserverJniBridge> observer_bridge_;\n\n  bool is_archived_tab_model_;\n  // Cannot use a conventional member variable because this is initialized after\n  // the constructor.\n"
- description: Declare direct persisted split restoration on the existing native model bridge.
  regex:
    re_pattern: '\ \ //\ TabModel::\

      '
    replace: "  // Restores a persisted split through the TabModelJniBridge JNI owner.\n  static bool RestoreSplit(\n      JNIEnv* env, const base::android::JavaRef<jobject>& model,\n      const base::Token& id, const std::vector<int>& tab_ids,\n      int layout, double ratio);\n\n  // TabModel::\n"
