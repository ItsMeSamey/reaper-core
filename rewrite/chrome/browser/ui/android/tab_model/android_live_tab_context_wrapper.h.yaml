# Android mixed native-tab and Java-window session restoration.
substitutions:
- description: Store value-owned split visual data while Java groups are restored
  count: 1
  regex:
    re_pattern: \#include\ "components/sessions/core/tab_restore_types\.h"
    replace: '#include "components/sessions/core/tab_restore_types.h"

      #include "components/split_tabs/split_tab_visual_data.h"'
- description: Retain both frozen members when session code holds two LiveTab pointers
  count: 1
  regex:
    re_pattern: '\ \ //\ temporary\ WebContents\ without\ a\ renderer\ will\ be\ created\.\ Note\ that\ only\

      \ \ //\ one\ sessions::LiveTab\*\ vended\ from\ this\ delegate\ should\ be\ alive\ at\ any\

      \ \ //\ time\ as\ the\ temporary\ WebContents\ may\ be\ deleted\ upon\ next\ call\ to\ this\

      \ \ //\ method\ as\ it''s\ lifetime\ is\ managed\ by\ this\ wrapper\ class\.'
    replace: "  // temporary WebContents without a renderer will be created. All temporary\n  // contents remain alive for this wrapper's lifetime, including both split members."
- description: Expose complete pre-close split snapshots independently of cleared native membership
  count: 1
  regex:
    re_pattern: '\ private:\

      \ \ TabAndroid\*\ GetTabAt\(int\ relative_index\)\ const;'
    replace: "  bool IsTabPinned(int relative_index) const override;\n  std::map<std::string, std::string> GetExtraDataForTab(int relative_index) const override;\n  std::optional<split_tabs::SplitTabId> GetSplitForTab(int relative_index) const override;\n  const split_tabs::SplitTabVisualData* GetVisualDataForSplit(\n      const split_tabs::SplitTabId& split_id) const override;\n\n private:\n  TabAndroid* GetTabAt(int relative_index) const;\n  base::flat_map<int, split_tabs::SplitTabId> tab_id_to_split_;\n  base::flat_map<split_tabs::SplitTabId, split_tabs::SplitTabVisualData> split_visual_data_;"
- description: Make temporary WebContents lifetime cover every vended LiveTab
  count: 1
  regex:
    re_pattern: '\ \ //\ The\ most\ recently\ unfrozen\ web\ contents\.\ Mutable\ as\ const\ signature\ methods\

      \ \ //\ modify\ this\ field\ \(constness\ inherited\ from\ LiveTabContext\)\.\

      \ \ mutable\ std::unique_ptr<historical_tab_saver::ScopedWebContents>\

      \ \ \ \ \ \ scoped_web_contents_;'
    replace: "  // Keep each frozen member alive while the session service builds history entries.\n  mutable std::vector<std::unique_ptr<historical_tab_saver::ScopedWebContents>>\n      scoped_web_contents_;"
- description: Defer native split reconstruction until restored Java grouping is complete
  count: 1
  regex:
    re_pattern: \ \ //\ Returns\ the\ TabGroup\ data\ aggregated\ via\ AddRestoredTab\.
    replace: "  void ReconstructSplit(sessions::LiveTab* leading_tab,\n                        sessions::LiveTab* trailing_tab,\n                        split_tabs::SplitTabId split_id,\n                        const split_tabs::SplitTabVisualData& visual_data) override;\n  // Call after the Java tab groups have been restored.\n  void RestoreSplits();\n\n  // Returns the TabGroup data aggregated via AddRestoredTab."
- description: Retain restored tab IDs and split values without raw LiveTab lifetimes
  count: 1
  regex:
    re_pattern: \ \ //\ Mapping\ of\ restored\ tab\ group\ ids\ to\ Android\ tab\ groups\.
    replace: "  struct PendingSplit {\n    std::vector<int> tab_ids;\n    split_tabs::SplitTabId id;\n    split_tabs::SplitTabVisualData visual_data;\n  };\n  std::vector<PendingSplit> pending_splits_;\n\n  // Mapping of restored tab group ids to Android tab groups."
- description: Format modified Android split persistence implementation
  count: 1
  regex:
    re_pattern: '\

      \ \ //\ Gets\ the\ sessions::LiveTab\ corresponding\ to\ the\ tab\ at\

      \ \ //\ `relative_index`\ into\ `closed_tabs`\.\ If\ the\ TabAndroid\ is\ frozen\ a\

      \ \ //\ temporary\ WebContents\ without\ a\ renderer\ will\ be\ created\.\ All\ temporary\

      \ \ //\ contents\ remain\ alive\ for\ this\ wrapper''s\ lifetime,\ including\ both\ split\ members\.\

      \ \ sessions::LiveTab\*\ GetLiveTabAt\(int\ relative_index\)\ const\ override;\

      \

      \ \ //\ Gets\ the\ TabGroupId\ for\ the\ Tab\ at\ `relative_index`\ into\ `closed_tabs`\ or\

      \ \ //\ returns\ nullopt\ otherwise\.\

      '
    replace: "\n  // Gets the sessions::LiveTab corresponding to the tab at\n  // `relative_index` into `closed_tabs`. If the TabAndroid is frozen a\n  // temporary WebContents without a renderer will be created. All temporary\n  // contents remain alive for this wrapper's lifetime, including both split\n  // members.\n  sessions::LiveTab* GetLiveTabAt(int relative_index) const override;\n\n  // Gets the TabGroupId for the Tab at `relative_index` into `closed_tabs` or\n  // returns nullopt otherwise.\n"
- description: Format modified Android split persistence implementation
  count: 1
  regex:
    re_pattern: '\ \ const\ std::optional<tab_groups::TabGroupId>\ GetGroupIdForSavedGroup\(\

      \ \ \ \ \ \ const\ base::Uuid\&\ saved\)\ const\ override;\

      \

      \ \ bool\ IsTabPinned\(int\ relative_index\)\ const\ override;\

      \ \ std::map<std::string,\ std::string>\ GetExtraDataForTab\(int\ relative_index\)\ const\ override;\

      \ \ std::optional<split_tabs::SplitTabId>\ GetSplitForTab\(int\ relative_index\)\ const\ override;\

      \ \ const\ split_tabs::SplitTabVisualData\*\ GetVisualDataForSplit\(\

      \ \ \ \ \ \ const\ split_tabs::SplitTabId\&\ split_id\)\ const\ override;\

      \

      \ private:\

      \ \ TabAndroid\*\ GetTabAt\(int\ relative_index\)\ const;\

      \ \ base::flat_map<int,\ split_tabs::SplitTabId>\ tab_id_to_split_;\

      \ \ base::flat_map<split_tabs::SplitTabId,\ split_tabs::SplitTabVisualData>\ split_visual_data_;\

      \

      \ \ //\ List\ of\ indices\ to\ close\ for\ using\ BrowserClosing\ to\ proxy\ bulk\

      \ \ //\ closure\.\

      \ \ std::vector<TabAndroid\*>\ closed_tabs_;\

      '
    replace: "  const std::optional<tab_groups::TabGroupId> GetGroupIdForSavedGroup(\n      const base::Uuid& saved) const override;\n\n  bool IsTabPinned(int relative_index) const override;\n  std::map<std::string, std::string> GetExtraDataForTab(\n      int relative_index) const override;\n  std::optional<split_tabs::SplitTabId> GetSplitForTab(\n      int relative_index) const override;\n  const split_tabs::SplitTabVisualData* GetVisualDataForSplit(\n      const split_tabs::SplitTabId& split_id) const override;\n\n private:\n  TabAndroid* GetTabAt(int relative_index) const;\n  base::flat_map<int, split_tabs::SplitTabId> tab_id_to_split_;\n  base::flat_map<split_tabs::SplitTabId, split_tabs::SplitTabVisualData>\n      split_visual_data_;\n\n  // List of indices to close for using BrowserClosing to proxy bulk\n  // closure.\n  std::vector<TabAndroid*> closed_tabs_;\n"
- description: Format modified Android split persistence implementation
  count: 1
  regex:
    re_pattern: '\

      \ \ //\ List\ of\ webContentStates\ to\ close\ linked\ by\ tab\ index\ for\ bulk\ closure\.\

      \ \ std::vector<WebContentsStateByteBuffer>\ web_contents_state_;\

      \

      \ \ //\ Keep\ each\ frozen\ member\ alive\ while\ the\ session\ service\ builds\ history\ entries\.\

      \ \ mutable\ std::vector<std::unique_ptr<historical_tab_saver::ScopedWebContents>>\

      \ \ \ \ \ \ scoped_web_contents_;\

      \};\

      \

      '
    replace: "\n  // List of webContentStates to close linked by tab index for bulk closure.\n  std::vector<WebContentsStateByteBuffer> web_contents_state_;\n\n  // Keep each frozen member alive while the session service builds history\n  // entries.\n  mutable std::vector<std::unique_ptr<historical_tab_saver::ScopedWebContents>>\n      scoped_web_contents_;\n};\n\n"
- description: Format modified Android split persistence implementation
  count: 1
  regex:
    re_pattern: '\ \ \ \ \ \ bool\ select,\

      \ \ \ \ \ \ bool\ is_restoring_group_or_window,\

      \ \ \ \ \ \ sessions::tab_restore::Type\ original_session_type\)\ override;\

      \

      \ \ void\ ReconstructSplit\(sessions::LiveTab\*\ leading_tab,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ sessions::LiveTab\*\ trailing_tab,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ split_tabs::SplitTabId\ split_id,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ split_tabs::SplitTabVisualData\&\ visual_data\)\ override;\

      \ \ //\ Call\ after\ the\ Java\ tab\ groups\ have\ been\ restored\.\

      \ \ void\ RestoreSplits\(\);\

      \

      \ \ //\ Returns\ the\ TabGroup\ data\ aggregated\ via\ AddRestoredTab\.\

      '
    replace: "      bool select,\n      bool is_restoring_group_or_window,\n      sessions::tab_restore::Type original_session_type) override;\n\n  void ReconstructSplit(\n      sessions::LiveTab* leading_tab,\n      sessions::LiveTab* trailing_tab,\n      split_tabs::SplitTabId split_id,\n      const split_tabs::SplitTabVisualData& visual_data) override;\n  // Call after the Java tab groups have been restored.\n  void RestoreSplits();\n\n  // Returns the TabGroup data aggregated via AddRestoredTab.\n"
- description: Expose shared Android group reconstruction beside split reconstruction
  regex:
    re_pattern: '\ \ //\ Call\ after\ the\ Java\ tab\ groups\ have\ been\ restored\.\

      \ \ void\ RestoreSplits\(\);'
    replace: "  // Reuse the same Java grouping path for Recent Tabs and extension sessions.\n  // Returns false if the destination model is destroyed during reconstruction.\n  bool RestoreTabGroups(TabModel* model);\n\n  // Call after the Java tab groups have been restored.\n  void RestoreSplits();"
