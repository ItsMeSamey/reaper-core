# Keep Android tab model observer dispatch alive through reentrant removal.
substitutions:
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\

      \#include\ "base/android/jni_weak_ref\.h"\

      \#include\ "base/android/scoped_java_ref\.h"\

      \#include\ "base/memory/raw_ref\.h"\

      \#include\ "base/observer_list\.h"\

      \#include\ "chrome/browser/tab_list/tab_list_interface_observer\.h"\

      \#include\ "chrome/browser/ui/android/tab_model/tab_model_observer\.h"\

      \

      class\ TabAndroid;\

      class\ TabModel;\

      class\ TabAndroid;\

      \

      namespace\ base\ \{\

      class\ Token;\

      \}\ \ //\ namespace\ base\

      '
    replace: '

      #include "base/android/jni_weak_ref.h"

      #include "base/android/scoped_java_ref.h"

      #include "base/memory/raw_ref.h"

      #include "base/memory/weak_ptr.h"

      #include "base/observer_list.h"

      #include "chrome/browser/tab_list/tab_list_interface_observer.h"

      #include "chrome/browser/ui/android/tab_model/tab_model_observer.h"


      class TabAndroid;

      class TabModel;


      namespace base {

      class Token;

      }  // namespace base

      '
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\

      \ \ //\ The\ following\ functions\ are\ called\ by\ JNI\.\

      \

      \ \ void\ DidSelectTab\(JNIEnv\*\ env,\ TabAndroid\*\ tab,\ int\ type,\ int\ last_id\);\

      \

      \ \ void\ WillCloseTabs\(JNIEnv\*\ env,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::vector<TabAndroid\*>\&\ tabs,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ bool\ is_all_tabs,\

      '
    replace: "\n  // The following functions are called by JNI.\n\n  void DidSelectTab(JNIEnv* env, TabAndroid* tab, int type, int last_id);\n  void DidChangeSplit(JNIEnv* env, const std::vector<int>& affected_tab_ids);\n\n  void WillCloseTabs(JNIEnv* env,\n                     const std::vector<TabAndroid*>& tabs,\n                     bool is_all_tabs,\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ base::raw_ref<TabModel>\ tab_model_;\

      \

      \ \ //\ TabListInterfaceObservers\ attached\ to\ this\ bridge\.\

      \ \ base::ObserverList<TabListInterfaceObserver>\ interface_observers_;\

      \};\

      \

      \#endif\ \ //\ CHROME_BROWSER_UI_ANDROID_TAB_MODEL_TAB_MODEL_OBSERVER_JNI_BRIDGE_H_\

      '
    replace: "  base::raw_ref<TabModel> tab_model_;\n\n  // TabListInterfaceObservers attached to this bridge.\n  base::ObserverList<TabListInterfaceObserver> interface_observers_;\n\n  base::WeakPtrFactory<TabModelObserverJniBridge> weak_factory_{this};\n};\n\n#endif  // CHROME_BROWSER_UI_ANDROID_TAB_MODEL_TAB_MODEL_OBSERVER_JNI_BRIDGE_H_\n"
- description: Keep Android tab model observer dispatch alive through reentrant removal
  regex:
    re_pattern: '\#include\ <vector>\

      \

      \#include\ "base/android/jni_weak_ref\.h"\

      \#include\ "base/android/scoped_java_ref\.h"\

      \#include\ "base/memory/raw_ref\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "base/observer_list\.h"\

      \#include\ "chrome/browser/tab_list/tab_list_interface_observer\.h"\

      \#include\ "chrome/browser/ui/android/tab_model/tab_model_observer\.h"\

      '
    replace: '#include <vector>


      #include "base/android/jni_weak_ref.h"

      #include "base/android/scoped_java_ref.h"

      #include "base/functional/callback.h"

      #include "base/memory/raw_ptr.h"

      #include "base/memory/ref_counted.h"

      #include "base/memory/weak_ptr.h"

      #include "base/observer_list.h"

      #include "chrome/browser/tab_list/tab_list_interface_observer.h"

      #include "chrome/browser/ui/android/tab_model/tab_model_observer.h"

      '
- description: Keep Android tab model observer dispatch alive through reentrant removal
  regex:
    re_pattern: '\

      //\ Bridges\ calls\ between\ the\ C\+\+\ and\ the\ Java\ TabModelObservers\.\ Functions\ in\

      //\ this\ class\ do\ little\ more\ than\ translating\ between\ Java\ TabModelObserver\

      //\ notifications\ to\ native\ TabModelObserver\ notifications\.\

      class\ TabModelObserverJniBridge\ \{\

      \ public:\

      \ \ TabModelObserverJniBridge\(\

      \ \ \ \ \ \ JNIEnv\*\ env,\

      \ \ \ \ \ \ const\ base::android::JavaRef<jobject>\&\ java_tab_model,\

      \ \ \ \ \ \ TabModel\&\ tab_model\);\

      \

      \ \ TabModelObserverJniBridge\(const\ TabModelObserverJniBridge\&\)\ =\ delete;\

      \ \ TabModelObserverJniBridge\&\ operator=\(const\ TabModelObserverJniBridge\&\)\ =\

      \ \ \ \ \ \ delete;\

      \

      \ \ \~TabModelObserverJniBridge\(\);\

      \

      \ \ void\ Destroy\(JNIEnv\*\ env\);\

      \

      \ \ //\ The\ following\ functions\ are\ called\ by\ JNI\.\

      \

      \ \ void\ DidSelectTab\(JNIEnv\*\ env,\ TabAndroid\*\ tab,\ int\ type,\ int\ last_id\);\

      '
    replace: "\n// Bridges calls between the C++ and the Java TabModelObservers. Functions in\n// this class do little more than translating between Java TabModelObserver\n// notifications to native TabModelObserver notifications.\nclass TabModelObserverJniBridge\n    : public base::RefCounted<TabModelObserverJniBridge> {\n public:\n  TabModelObserverJniBridge(\n      JNIEnv* env,\n      const base::android::JavaRef<jobject>& java_tab_model,\n      TabModel& tab_model,\n      base::RepeatingClosure on_empty);\n\n  TabModelObserverJniBridge(const TabModelObserverJniBridge&) = delete;\n  TabModelObserverJniBridge& operator=(const TabModelObserverJniBridge&) =\n      delete;\n\n  // The following functions are called by JNI.\n\n  void DidSelectTab(JNIEnv* env, TabAndroid* tab, int type, int last_id);\n"
- description: Keep Android tab model observer dispatch alive through reentrant removal
  regex:
    re_pattern: '\ \ \ \ return\ !model_observers_\.empty\(\)\ \|\|\ !interface_observers_\.empty\(\);\

      \ \ \}\

      \

      \ private:\

      \ \ //\ This\ object''s\ Java\ counterpart\.\ This\ objects\ controls\ its\ lifetime\.\

      \ \ base::android::ScopedJavaGlobalRef<jobject>\ java_object_;\

      \

      \ \ //\ TabModelObservers\ attached\ to\ this\ bridge\.\

      \ \ base::ObserverList<TabModelObserver>::Unchecked\ model_observers_;\

      \

      \ \ //\ The\ C\+\+\ TabModel\.\ Owns\ this\ object,\ so\ is\ guaranteed\ to\ outlive\ it\.\

      \ \ base::raw_ref<TabModel>\ tab_model_;\

      \

      \ \ //\ TabListInterfaceObservers\ attached\ to\ this\ bridge\.\

      \ \ base::ObserverList<TabListInterfaceObserver>\ interface_observers_;\

      \

      \ \ base::WeakPtrFactory<TabModelObserverJniBridge>\ weak_factory_\{this\};\

      \};\

      \

      '
    replace: "    return !model_observers_.empty() || !interface_observers_.empty();\n  }\n\n private:\n  friend class base::RefCounted<TabModelObserverJniBridge>;\n  friend class TabModelObserverJniBridgeTest;\n\n  // Native-only constructor for the real dispatcher regression fixture.\n  TabModelObserverJniBridge(TabModel& tab_model,\n                            base::RepeatingClosure on_empty);\n  ~TabModelObserverJniBridge();\n\n  // Each nested dispatch retains the bridge. The owner releases its reference\n  // only after the outermost scope and both observer lists become empty.\n  class ScopedDispatch {\n   public:\n    explicit ScopedDispatch(TabModelObserverJniBridge* bridge);\n    ScopedDispatch(const ScopedDispatch&) = delete;\n    ScopedDispatch& operator=(const ScopedDispatch&) = delete;\n    ~ScopedDispatch();\n\n   private:\n    scoped_refptr<TabModelObserverJniBridge> bridge_;\n  };\n  void ReleaseOwnerIfEmpty();\n  void DetachFromJava();\n\n  size_t dispatch_depth_ = 0;\n  bool shutting_down_ = false;\n  base::RepeatingClosure on_empty_;\n\n  // The Java observer is detached before model shutdown or final release.\n  base::android::ScopedJavaGlobalRef<jobject> java_object_;\n\n  // TabModelObservers attached to this bridge.\n  base::ObserverList<TabModelObserver,\n                     false,\n                     base::ObserverListReentrancyPolicy::kAllowReentrancy>::\n      Unchecked model_observers_;\n\n  // Cleared by NotifyShutdown while the model is still alive. An outer\n  // dispatch can retain this bridge after a callback destroys the model.\n  raw_ptr<TabModel> tab_model_;\n\n  // TabListInterfaceObservers attached to this bridge.\n  base::ObserverList<TabListInterfaceObserver,\n                     false,\n                     base::ObserverListReentrancyPolicy::kAllowReentrancy>\n      interface_observers_;\n\n  base::WeakPtrFactory<TabModelObserverJniBridge> weak_factory_{this};\n};\n\n"
