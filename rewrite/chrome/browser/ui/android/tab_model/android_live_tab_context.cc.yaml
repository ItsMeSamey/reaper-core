  count: 1
  regex:
    re_pattern: AndroidLiveTabContext::AndroidLiveTabContext\(TabModel\*\ tab_model\)
    replace: '// Must follow headers declaring JNI type conversions.

      #include "chrome/android/chrome_jni_headers/TabModelJniBridge_jni.h"


      AndroidLiveTabContext::AndroidLiveTabContext(TabModel* tab_model)'
- description: Expose actual attached native split membership to session saving
  count: 1
  regex:
    re_pattern: '\ \ //\ Split\ views\ are\ not\ currently\ supported\ on\ the\ Android\ platform\.\ This\

      \ \ //\ function\ would\ get\ the\ SplitTabId\ implementation\ of\ a\ given\ tab\.\

      \ \ return\ std::nullopt;'
    replace: "  if (index < 0 || index >= tab_model_->GetTabCount()) {\n    return std::nullopt;\n  }\n  const TabAndroid* tab = tab_model_->GetTabAt(index);\n  return tab ? tab->GetSplit() : std::nullopt;"
- description: Save split orientation and ratio from native ancestry rather than historical Java mirrors
  count: 1
  regex:
    re_pattern: '\ \ //\ Split\ views\ are\ not\ currently\ supported\ on\ the\ Android\ platform\.\ This\

      \ \ //\ function\ would\ return\ the\ visual\ data\ of\ the\ split\ \(orientation\ and\ ratio\)\.\

      \ \ return\ nullptr;'
    replace: "  for (int i = 0; i < tab_model_->GetTabCount(); ++i) {\n    const TabAndroid* tab = tab_model_->GetTabAt(i);\n    if (!tab || tab->GetSplit() != split_id) {\n      continue;\n    }\n    for (const tabs::TabCollection* collection = tab->GetParentCollection();\n         collection; collection = collection->GetParentCollection()) {\n      if (collection->type() == tabs::TabCollection::Type::SPLIT) {\n        return static_cast<const tabs::SplitTabCollection*>(collection)\n            ->data()->visual_data();\n      }\n    }\n  }\n  return nullptr;"
- description: Restore session split pairs through the same validated native model as live splits
  count: 1
  regex:
    re_pattern: '\ \ //\ Split\ views\ are\ currently\ not\ supported\ on\ the\ Android\ platform\.\

      \ \ //\ This\ function\ serves\ as\ a\ placeholder\ to\ store\ the\ logic\ that\ would\ combine\

      \ \ //\ two\ tabs\ into\ a\ singular\ SplitView\ object\.\

      \ \ NOTIMPLEMENTED\(\);'
    replace: "  if (!leading_tab || !trailing_tab) {\n    return;\n  }\n  auto* leading = TabAndroid::FromWebContents(\n      &static_cast<sessions::ContentLiveTab*>(leading_tab)->GetWebContents());\n  auto* trailing = TabAndroid::FromWebContents(\n      &static_cast<sessions::ContentLiveTab*>(trailing_tab)->GetWebContents());\n  if (leading && trailing) {\n    RestoreSplitByTabIds({leading->GetAndroidId(), trailing->GetAndroidId()},\n                        split_id, visual_data);\n  }"
- description: Use typed token and member IDs without storing raw restored-tab pointers
  count: 1
  regex:
    re_pattern: '//\ Currently\ does\ nothing\.\

      void\ AndroidLiveTabContext::CloseTab\(\)'
    replace: "bool AndroidLiveTabContext::RestoreSplitByTabIds(\n    const std::vector<int>& tab_ids,\n    split_tabs::SplitTabId split_id,\n    const split_tabs::SplitTabVisualData& visual_data) {\n  JNIEnv* env = base::android::AttachCurrentThread();\n  auto model = tab_model_->GetJavaObject();\n  if (!model) return false;\n  return Java_TabModelJniBridge_restoreSplit(\n      env, model, split_id.token(), tab_ids,\n      static_cast<int>(visual_data.split_layout()), visual_data.split_ratio());\n}\n\n// Currently does nothing.\nvoid AndroidLiveTabContext::CloseTab()"
