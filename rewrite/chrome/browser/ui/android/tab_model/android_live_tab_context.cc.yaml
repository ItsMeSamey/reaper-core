    replace: '#include "components/split_tabs/split_tab_id.h"

      #include "components/split_tabs/split_tab_visual_data.h"

      #include "components/tabs/public/android/jni_conversion.h"

      #include "components/tabs/public/split_tab_collection.h"

      #include "components/tabs/public/split_tab_data.h"'
- description: Declare existing bridge return-type conversions before generated JNI
  count: 1
  regex:
    re_pattern: \#include\ "content/public/browser/restore_type\.h"
    replace: '#include "content/public/browser/restore_type.h"

      #include "content/public/browser/web_contents.h"

      #include "url/android/gurl_android.h"'
