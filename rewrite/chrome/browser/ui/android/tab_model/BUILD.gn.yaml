# Keep Android tab model observer dispatch alive through reentrant removal.
substitutions:
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ "//chrome/browser/ui/browser_window/internal",\

      \ \ \ \ "//chrome/browser/ui/navigator",\

      \ \ \ \ "//chrome/browser/ui/tabs:tabs_public",\

      \ \ \ \ "//components/content_settings/core/browser",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//content/public/common",\

      \ \ \ \ "//ui/base:types",\

      \ \ \]\

      '
    replace: "    \"//chrome/browser/ui/browser_window/internal\",\n    \"//chrome/browser/ui/navigator\",\n    \"//chrome/browser/ui/tabs:tabs_public\",\n    \"//components/content_settings/core/browser\",\n    \"//components/dom_distiller/core\",\n    \"//components/split_tabs\",\n    \"//content/public/browser\",\n    \"//content/public/common\",\n    \"//ui/base:types\",\n  ]\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ "tab_model_jni_bridge_browsertest\.cc",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":test_support",\

      \ \ \ \ "//chrome/browser/content_settings:content_settings_factory",\

      \ \ \ \ "//chrome/browser/flags:flags_android",\

      \ \ \ \ "//chrome/browser/performance_manager",\

      \ \ \ \ "//chrome/test:test_support",\

      '
    replace: "    \"tab_model_jni_bridge_browsertest.cc\",\n  ]\n  deps = [\n    \":test_support\",\n    \"//chrome/android:chrome_jni_headers\",\n    \"//components/split_tabs\",\n    \"//chrome/browser/content_settings:content_settings_factory\",\n    \"//chrome/browser/flags:flags_android\",\n    \"//chrome/browser/performance_manager\",\n    \"//chrome/test:test_support\",\n"
- description: Keep Android tab model observer dispatch alive through reentrant removal
  regex:
    re_pattern: '\}\

      \

      source_set\("unit_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \ \ sources\ =\ \[\ "tab_model_list_unittest\.cc"\ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":test_support",\

      \ \ \ \ "//chrome/test:test_support",\

      \ \ \ \ "//content/public/browser",\

      \ \ \]\

      '
    replace: "}\n\nsource_set(\"unit_tests\") {\n  testonly = true\n  sources = [\n    \"tab_model_list_unittest.cc\",\n    \"//brave/browser/ui/android/tab_model/tab_model_observer_jni_bridge_unittest.cc\",\n  ]\n  deps = [\n    \":impl\",\n    \":test_support\",\n    \"//chrome/test:test_support\",\n    \"//content/public/browser\",\n  ]\n"

