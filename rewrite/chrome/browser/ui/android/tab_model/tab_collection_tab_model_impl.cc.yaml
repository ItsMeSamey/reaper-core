- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ \ \ tab_groups::TabGroupId::FromOptionalToken\(token\);\

      \ \ new_index\ =\ GetSafeIndex\(/\*is_tab_group=\*/false,\ current_index,\ new_index,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new_tab_group_id,\ new_is_pinned\);\

      \

      \ \ tab_strip_collection_\->MoveTabRecursive\(current_index,\ new_index,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new_tab_group_id,\ new_is_pinned\);\

      \ \ return\ base::checked_cast<int>\(new_index\);\

      \}\

      '
    replace: "      tab_groups::TabGroupId::FromOptionalToken(token);\n  new_index = GetSafeIndex(/*is_tab_group=*/false, current_index, new_index,\n                           new_tab_group_id, new_is_pinned);\n\n  TabAndroid* moving = TabAndroid::FromTabInterface(\n      tab_strip_collection_->GetTabAtIndexRecursive(current_index));\n  // A split is a unit only for an enclosing multi-tab transaction. Java\n  // restores a complete, still-contiguous pair after that transaction;\n  // individual moves and pin/group changes must not leave a one-child\n  // collection behind.\n  if (auto split = moving->GetSplit()) {\n    tab_strip_collection_->Unsplit(*split);\n  }\n  UnsplitForInsertion(new_index, {moving});\n  tab_strip_collection_->MoveTabRecursive(current_index, new_index,\n                                          new_tab_group_id, new_is_pinned);\n  return base::checked_cast<int>(new_index);\n}\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\

      \ \ index\ =\ GetSafeIndex\(/\*is_tab_group=\*/false,\ /\*current_index=\*/std::nullopt,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ index,\ tab_group_id,\ is_pinned\);\

      \

      \ \ //\ When\ the\ tab\ is\ attaching\ a\ detached\ group\ we\ first\ add\ the\ tab\ to\ the\

      \ \ //\ collection\ and\ then\ move\ the\ tab\ to\ the\ group\.\

      \ \ tab_strip_collection_\->AddTabRecursive\(\

      \ \ \ \ \ \ tabs::ScopedTab\(tab_android\),\ index,\

      '
    replace: "\n  index = GetSafeIndex(/*is_tab_group=*/false, /*current_index=*/std::nullopt,\n                       index, tab_group_id, is_pinned);\n\n  UnsplitForInsertion(index);\n  // When the tab is attaching a detached group we first add the tab to the\n  // collection and then move the tab to the group.\n  tab_strip_collection_->AddTabRecursive(\n      tabs::ScopedTab(tab_android), index,\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: 'void\ TabCollectionTabModelImpl::RemoveTabRecursive\(JNIEnv\*\ env,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabAndroid\*\ tab\)\ \{\

      \ \ int\ index\ =\ GetIndexOfTabRecursive\(tab\);\

      \ \ CHECK_NE\(index,\ kInvalidTabIndex\);\

      \ \ tab_strip_collection_\->RemoveTabAtIndexRecursive\(index\);\

      \}\

      \

      void\ TabCollectionTabModelImpl::CreateTabGroup\(\

      \ \ \ \ JNIEnv\*\ env,\

      '
    replace: "void TabCollectionTabModelImpl::RemoveTabRecursive(JNIEnv* env,\n                                                   TabAndroid* tab) {\n  int index = GetIndexOfTabRecursive(tab);\n  CHECK_NE(index, kInvalidTabIndex);\n  if (auto split = tab->GetSplit()) {\n    tab_strip_collection_->Unsplit(*split);\n  }\n  tab_strip_collection_->RemoveTabAtIndexRecursive(index);\n}\n\nbool TabCollectionTabModelImpl::CreateSplit(\n    JNIEnv* env,\n    const base::Token& token,\n    const std::vector<TabAndroid*>& tabs,\n    int layout,\n    double ratio) {\n  if (token.is_zero() || tabs.size() != 2 || !tabs[0] || !tabs[1] ||\n      tabs[0] == tabs[1] || layout < 0 || layout > 1 || !std::isfinite(ratio) ||\n      ratio <= 0 || ratio >= 1) {\n    return false;\n  }\n  auto split_id = split_tabs::SplitTabId::FromRawToken(token);\n  if (tab_strip_collection_->GetSplitTabCollection(split_id)) {\n    return false;\n  }\n  int first = GetIndexOfTabRecursive(tabs[0]);\n  int second = GetIndexOfTabRecursive(tabs[1]);\n  if (first < 0 || second != first + 1 || tabs[0]->GetSplit() ||\n      tabs[1]->GetSplit() || tabs[0]->profile() != profile_ ||\n      tabs[1]->profile() != profile_ ||\n      tabs[0]->GetParentCollection() != tabs[1]->GetParentCollection()) {\n    return false;\n  }\n  static_assert(static_cast<int>(split_tabs::SplitTabLayout::kSideBySide) == 0);\n  static_assert(static_cast<int>(split_tabs::SplitTabLayout::kStacked) == 1);\n  tab_strip_collection_->CreateSplit(\n      split_id, {tabs[0], tabs[1]},\n      split_tabs::SplitTabVisualData(\n          static_cast<split_tabs::SplitTabLayout>(layout), ratio));\n  return true;\n}\n\nvoid TabCollectionTabModelImpl::Unsplit(JNIEnv* env, const base::Token& token) {\n  if (!token.is_zero()) {\n    tab_strip_collection_->Unsplit(split_tabs::SplitTabId::FromRawToken(token));\n  }\n}\n\nvoid TabCollectionTabModelImpl::UnsplitForInsertion(\n    size_t index,\n    const std::vector<TabInterface*>& excluded_tabs) {\n  std::vector<TabInterface*> remaining;\n  for (TabInterface* tab : *tab_strip_collection_) {\n    if (std::ranges::find(excluded_tabs, tab) == excluded_tabs.end()) {\n      remaining.push_back(tab);\n    }\n  }\n  if (index == 0 || index >= remaining.size()) {\n    return;\n  }\n  auto split = remaining[index - 1]->GetSplit();\n  if (split && split == remaining[index]->GetSplit()) {\n    tab_strip_collection_->Unsplit(*split);\n  }\n}\n\nvoid TabCollectionTabModelImpl::CreateTabGroup(\n    JNIEnv* env,\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\}\

      \

      int\ TabCollectionTabModelImpl::GetIndividualTabAndGroupCount\(\

      \ \ \ \ JNIEnv\*\ env\)\ const\ \{\

      \ \ //\ The\ direct\ child\ count\ of\ the\ pinned\ and\ unpinned\ collections\ will\ include\

      \ \ //\ all\ individual\ tabs\ and\ tab\ groups\.\

      \ \ return\ tab_strip_collection_\->unpinned_collection\(\)\->ChildCount\(\)\ \+\

      \ \ \ \ \ \ \ \ \ tab_strip_collection_\->pinned_collection\(\)\->ChildCount\(\);\

      \}\

      \

      int\ TabCollectionTabModelImpl::GetTabGroupCount\(JNIEnv\*\ env\)\ const\ \{\

      \ \ return\ tab_strip_collection_\->GetAllTabGroupIds\(\)\.size\(\);\

      '
    replace: "}\n\nint TabCollectionTabModelImpl::GetIndividualTabAndGroupCount(\n    JNIEnv* env) const {\n  // A split contains two ordinary tabs. Only tab groups collapse to one\n  // representative in the Android tab switcher.\n  int count = 0;\n  std::optional<TabGroupId> previous_group;\n  for (TabInterface* tab : *tab_strip_collection_) {\n    auto group = tab->GetGroup();\n    if (!group || group != previous_group) {\n      ++count;\n    }\n    previous_group = group;\n  }\n  return count;\n}\n\nint TabCollectionTabModelImpl::GetTabGroupCount(JNIEnv* env) const {\n  return tab_strip_collection_->GetAllTabGroupIds().size();\n"
