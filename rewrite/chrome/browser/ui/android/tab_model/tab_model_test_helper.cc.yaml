      \ \ observer_list_\.Notify\(\&TabModelObserver::OnDidActiveStateChange,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::ref\(\*this\),\ is_active\);\

