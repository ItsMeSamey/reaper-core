# Android split pane request ownership and dialog placement.
substitutions:
- description: exercise actual before and after model activation contract in Android tests
  regex:
    re_pattern: 'void\ OwningTestTabModel::SetIsActiveModel\(bool\ is_active\)\ \{\

      \ \ DCHECK_CALLED_ON_VALID_SEQUENCE\(sequence_checker_\);\

      \ \ is_active_model_\ =\ is_active;\

      \}'
    replace: "void OwningTestTabModel::SetIsActiveModel(bool is_active) {\n  DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);\n  if (is_active_model_ == is_active) {\n    return;\n  }\n  observer_list_.Notify(&TabModelObserver::OnWillActiveStateChange,\n                       std::ref(*this), is_active);\n  is_active_model_ = is_active;\n  observer_list_.Notify(&TabModelObserver::OnDidActiveStateChange,\n                       std::ref(*this), is_active);\n}"
- description: Format modified Android split dialog code
