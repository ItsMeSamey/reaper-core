  count: 1
  regex:
    re_pattern: AndroidLiveTabContextCloseWrapper::AndroidLiveTabContextCloseWrapper\(
    replace: '// Must follow headers declaring JNI type conversions.

      #include "chrome/android/chrome_jni_headers/TabImpl_jni.h"


      AndroidLiveTabContextCloseWrapper::AndroidLiveTabContextCloseWrapper('
- description: Never persist an orphan split when session navigation filtering drops one member
  count: 1
  regex:
    re_pattern: AndroidLiveTabContextCloseWrapper::AndroidLiveTabContextCloseWrapper\(
    replace: "namespace {\n\n// Match PopulateTab's navigation filtering before advertising a complete pair.\nbool CanSaveSplitMember(sessions::LiveTab* tab) {\n  if (tab->IsInitialBlankNavigation()) return false;\n  for (int i = 0; i < tab->GetEntryCount(); ++i) {\n    const auto entry = tab->GetEntryAtIndex(i);\n    if (!entry.virtual_url().is_empty()\n        && !entry.virtual_url().SchemeIs(dom_distiller::kDomDistillerScheme)) return true;\n  }\n  return false;\n}\n\n}  // namespace\n\nAndroidLiveTabContextCloseWrapper::AndroidLiveTabContextCloseWrapper("
- description: Snapshot valid complete historical split pairs and preserve their leading member order
  count: 1
  regex:
    re_pattern: \ \ CHECK_EQ\(closed_tabs_\.size\(\),\ web_contents_state_\.size\(\)\);
    replace: "  CHECK_EQ(closed_tabs_.size(), web_contents_state_.size());\n  scoped_web_contents_.resize(closed_tabs_.size());\n  // Java retains these value snapshots before native normalization removes the split.\n  // Only complete pairs are exposed: TabRestoreService requires exactly two members.\n  struct Member {\n    size_t index;\n    int position;\n    split_tabs::SplitTabVisualData visual_data;\n  };\n  std::map<split_tabs::SplitTabId, std::vector<Member>> candidates;\n  JNIEnv* env = base::android::AttachCurrentThread();\n  for (size_t i = 0; i < closed_tabs_.size(); ++i) {\n    auto jtab = closed_tabs_[i]->GetJavaObject();\n    if (!jtab) continue;\n    auto token = Java_TabImpl_getHistoricalSplitTabId(env, jtab);\n    if (!token || token->is_zero()) continue;\n    int layout = Java_TabImpl_getHistoricalSplitLayout(env, jtab);\n    double ratio = Java_TabImpl_getHistoricalSplitRatio(env, jtab);\n    int position = Java_TabImpl_getHistoricalSplitPosition(env, jtab);\n    if (layout < 0 || layout > 1 || !std::isfinite(ratio) || ratio <= 0 || ratio >= 1\n        || position < 0 || position > 1) continue;\n    candidates[split_tabs::SplitTabId::FromRawToken(*token)].push_back(\n        {i, position, split_tabs::SplitTabVisualData(\n            static_cast<split_tabs::SplitTabLayout>(layout), ratio)});\n  }\n  for (const auto& [id, members] : candidates) {\n    if (members.size() != 2 || members[0].position == members[1].position\n        || members[0].visual_data != members[1].visual_data) continue;\n    size_t a = members[0].index;\n    size_t b = members[1].index;\n    // A historical group must never advertise half a split spanning another group.\n    if (GetTabGroupForTab(a) != GetTabGroupForTab(b)\n        || !CanSaveSplitMember(GetLiveTabAt(a))\n        || !CanSaveSplitMember(GetLiveTabAt(b))) continue;\n    tab_id_to_split_.emplace(closed_tabs_[a]->GetAndroidId(), id);\n    tab_id_to_split_.emplace(closed_tabs_[b]->GetAndroidId(), id);\n    split_visual_data_.emplace(id, members[0].visual_data);\n  }\n  // Closure lists need not be in model order. Keep complete pairs adjacent and\n  // leading-first so native reconstruction sees the same ordered collection.\n  std::vector<size_t> order;\n  std::set<int> emitted;\n  for (size_t i = 0; i < closed_tabs_.size(); ++i) {\n    const int tab_id = closed_tabs_[i]->GetAndroidId();\n    if (emitted.contains(tab_id)) continue;\n    auto split = tab_id_to_split_.find(tab_id);\n    if (split == tab_id_to_split_.end()) {\n      order.push_back(i);\n      emitted.insert(tab_id);\n      continue;\n    }\n    const auto& members = candidates.at(split->second);\n    const size_t first = members[0].position == 0 ? members[0].index : members[1].index;\n    const size_t second = members[0].position == 0 ? members[1].index : members[0].index;\n    order.push_back(first);\n    order.push_back(second);\n    emitted.insert(closed_tabs_[first]->GetAndroidId());\n    emitted.insert(closed_tabs_[second]->GetAndroidId());\n  }\n  auto tabs = std::move(closed_tabs_);\n  auto states = std::move(web_contents_state_);\n  auto contents = std::move(scoped_web_contents_);\n  closed_tabs_.clear();\n  web_contents_state_.clear();\n  scoped_web_contents_.clear();\n  for (size_t index : order) {\n    closed_tabs_.push_back(tabs[index]);\n    web_contents_state_.push_back(std::move(states[index]));\n    scoped_web_contents_.push_back(std::move(contents[index]));\n  }"
- description: Keep frozen live tabs alive across subsequent member lookups
  count: 1
  regex:
    re_pattern: '\ \ scoped_web_contents_\ =\ historical_tab_saver::ScopedWebContents::CreateForTab\(\

      \ \ \ \ \ \ GetTabAt\(relative_index\),\ \&web_contents_state_\[relative_index\]\);\

