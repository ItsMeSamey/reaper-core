- description: Serve historical membership and visual state even after active native unsplit
  count: 1
  regex:
    re_pattern: TabAndroid\*\ AndroidLiveTabContextCloseWrapper::GetTabAt\(
    replace: "bool AndroidLiveTabContextCloseWrapper::IsTabPinned(int relative_index) const {\n  return GetTabAt(relative_index)->IsPinned();\n}\n\nstd::map<std::string, std::string>\nAndroidLiveTabContextCloseWrapper::GetExtraDataForTab(int relative_index) const {\n  std::map<std::string, std::string> result;\n  glic::PopulateGlicExtraData(GetTabAt(relative_index), &result);\n  return result;\n}\n\nstd::optional<split_tabs::SplitTabId>\nAndroidLiveTabContextCloseWrapper::GetSplitForTab(int relative_index) const {\n  auto it = tab_id_to_split_.find(GetTabAt(relative_index)->GetAndroidId());\n  return it == tab_id_to_split_.end() ? std::nullopt : std::make_optional(it->second);\n}\n\nconst split_tabs::SplitTabVisualData*\nAndroidLiveTabContextCloseWrapper::GetVisualDataForSplit(\n    const split_tabs::SplitTabId& split_id) const {\n  auto it = split_visual_data_.find(split_id);\n  return it == split_visual_data_.end() ? nullptr : &it->second;\n}\n\nTabAndroid* AndroidLiveTabContextCloseWrapper::GetTabAt("
- description: Reconstruct queued native pairs only after all restored groups are attached
  count: 1
  regex:
    re_pattern: 'const\ std::map<tab_groups::TabGroupId,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AndroidLiveTabContextRestoreWrapper::TabGroup>\&'
    replace: "void AndroidLiveTabContextRestoreWrapper::ReconstructSplit(\n    sessions::LiveTab* leading_tab,\n    sessions::LiveTab* trailing_tab,\n    split_tabs::SplitTabId split_id,\n    const split_tabs::SplitTabVisualData& visual_data) {\n  if (!leading_tab || !trailing_tab) return;\n  auto* leading = TabAndroid::FromWebContents(\n      &static_cast<sessions::ContentLiveTab*>(leading_tab)->GetWebContents());\n  auto* trailing = TabAndroid::FromWebContents(\n      &static_cast<sessions::ContentLiveTab*>(trailing_tab)->GetWebContents());\n  if (leading && trailing) {\n    pending_splits_.push_back({{leading->GetAndroidId(), trailing->GetAndroidId()},\n                              split_id, visual_data});\n  }\n}\n\nvoid AndroidLiveTabContextRestoreWrapper::RestoreSplits() {\n  auto pending = std::move(pending_splits_);\n  pending_splits_.clear();\n  for (const auto& split : pending) {\n    RestoreSplitByTabIds(split.tab_ids, split.id, split.visual_data);\n  }\n}\n\nconst std::map<tab_groups::TabGroupId,\n               AndroidLiveTabContextRestoreWrapper::TabGroup>&"
