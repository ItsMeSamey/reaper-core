  count: 1
  regex:
    re_pattern: \#include\ <utility>
    replace: '#include <cmath>

      #include <set>

      #include <utility>


      #include "base/android/jni_android.h"

      #include "base/android/jni_string.h"

      #include "base/android/token_android.h"

      #include "url/android/gurl_android.h"'
- description: Use the closed tab for metadata and match the session service navigation eligibility
  count: 1
  regex:
    re_pattern: \#include\ "chrome/browser/android/tab_android\.h"
    replace: '#include "chrome/browser/android/tab_android.h"

      #include "chrome/browser/glic/glic_tab_restore_helper.h"

      #include "components/dom_distiller/core/url_constants.h"

