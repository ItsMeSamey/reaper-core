# Keep Android tab model observer dispatch alive through reentrant removal.
substitutions:
- description: Report refused Android discards through the existing extension API error path
  regex:
    re_pattern: '\ \ web_contents\->Discard\(base::DoNothing\(\)\);\

      \ \ return\ web_contents;'
    replace: "  auto weak_contents = web_contents->GetWeakPtr();\n  web_contents->Discard(base::DoNothing());\n  // A speculative pending commit can refuse the discard. Preserve that\n  // failure so callers do not report a successful tabs.discard operation.\n  return weak_contents && weak_contents->WasDiscarded() ? weak_contents.get()\n                                                        : nullptr;"
