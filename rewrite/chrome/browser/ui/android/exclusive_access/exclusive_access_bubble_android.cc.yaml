      \ \ \ \ \ \ !params\.force_update\ \&\&\ \(already_shown\ \|\|\ was_shown_\)\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \ \ was_shown_\ =\ true;\

      \

      '
    replace: "}\n\nvoid ExclusiveAccessBubbleAndroid::Update(\n    const ExclusiveAccessBubbleParams& params,\n    ExclusiveAccessBubbleHideCallback\
      \ first_hide_callback,\n    std::optional<std::u16string> extension_display_name) {\n  DCHECK(EXCLUSIVE_ACCESS_BUBBLE_TYPE_NONE\
      \ != params.type ||\n         params.has_download);\n  const bool identity_changed =\n      extension_display_name_\
      \ != extension_display_name;\n  extension_display_name_ = std::move(extension_display_name);\n  bool already_shown =\
      \ IsVisible();\n  if (!identity_changed && params_.type == params.type &&\n      params_.origin == params.origin &&\
