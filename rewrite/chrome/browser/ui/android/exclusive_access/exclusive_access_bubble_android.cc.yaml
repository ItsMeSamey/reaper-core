      \ \ if\ \(!keyboard_connected\)\ \{\

      \ \ \ \ return\ exclusive_access_bubble::GetInstructionTextForTypeTouchBased\(\

      \ \ \ \ \ \ \ \ bubble_type,\ GetOriginString\(params_\.origin\),\ params_\.has_download,\

      \ \ \ \ \ \ \ \ notify_overridden_\);\

      \ \ \}\

      \

      \ \ std::u16string\ accelerator;\

      '
    replace: "\nstd::u16string ExclusiveAccessBubbleAndroid::GetBubbleText(\n    ExclusiveAccessBubbleType bubble_type,\n\
      \    bool keyboard_connected) const {\n  auto origin_display_name = GetOriginString(params_.origin);\n  if (origin_display_name\
      \ && extension_display_name_ &&\n      bubble_type ==\n          EXCLUSIVE_ACCESS_BUBBLE_TYPE_EXTENSION_FULLSCREEN_EXIT_INSTRUCTION)\
      \ {\n    origin_display_name = extension_display_name_;\n  }\n  const bool attribute_extension =\n      bubble_type\
      \ ==\n          EXCLUSIVE_ACCESS_BUBBLE_TYPE_EXTENSION_FULLSCREEN_EXIT_INSTRUCTION &&\n      origin_display_name.has_value()\
      \ && !params_.has_download;\n\n  if (!keyboard_connected) {\n    // Reuse the existing origin-aware touch instruction\
      \ without changing the\n    // owned bubble type or the download notice override.\n    const auto instruction_type =\n\
      \        attribute_extension\n            ? EXCLUSIVE_ACCESS_BUBBLE_TYPE_FULLSCREEN_EXIT_INSTRUCTION\n            :\
      \ bubble_type;\n    return exclusive_access_bubble::GetInstructionTextForTypeTouchBased(\n        instruction_type,\
      \ origin_display_name, params_.has_download,\n        notify_overridden_);\n  }\n\n  std::u16string accelerator;\n"
