substitutions:

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: remove unused Lens shown metric import"
  regex:
    re_pattern: "import\\ static\\ org\\.chromium\\.chrome\\.browser\\.ui\\.google_bottom_bar\\.GoogleBottomBarLogger\\.GoogleBottomBarButtonEvent\\.SEARCHBOX_LENS;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove visible clickable Lens entry while preserving weighted ordinary searchbox"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ searchboxView\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.findViewById\\(R\\.id\\.google_bottom_bar_searchbox_lens_button\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.setOnClickListener\\(v\\ \\->\\ mActionsHandler\\.onSearchboxLensTap\\(v\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ GoogleBottomBarLogger\\.logButtonShown\\(SEARCHBOX_LENS\\);\\\n"
    replace: "        searchboxView\n                .findViewById(R.id.google_bottom_bar_searchbox_lens_button)\n                .setVisibility(View.GONE);\n"
  count: 1
