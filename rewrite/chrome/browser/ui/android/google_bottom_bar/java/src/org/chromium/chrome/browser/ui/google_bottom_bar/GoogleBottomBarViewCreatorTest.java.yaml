substitutions:

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: add standard absence assertion"
  regex:
    re_pattern: "import\\ static\\ org\\.junit\\.Assert\\.assertEquals;\\\n"
    replace: "import static org.junit.Assert.assertEquals;\nimport static org.junit.Assert.assertFalse;\n"
  count: 1
- description: "Lens extra: remove only Lens shown metric expectation in testCreateGoogleBottomBarView_doubleDeckerLayout_returnsLayoutWithBottomBarButtonsAndSearchboxContainers"
