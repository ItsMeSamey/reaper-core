substitutions:

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: remove unused Lens-only Captor annotation import"
  regex:
    re_pattern: "import\\ org\\.mockito\\.Captor;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove obsolete disabled Lens test annotation import"
  regex:
    re_pattern: "import\\ org\\.chromium\\.base\\.test\\.util\\.DisabledTest;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove typed implementation imports"
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensController;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensEntryPoint;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.lens\\.LensIntentParams;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove implementation mock"
  regex:
    re_pattern: "\\ \\ \\ \\ @Mock\\ private\\ LensController\\ mLensController;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove implementation intent captor"
  regex:
    re_pattern: "\\ \\ \\ \\ @Captor\\ private\\ ArgumentCaptor<LensIntentParams>\\ mLensIntentParamsArgumentCaptor;\\\n"
    replace: ""
  count: 1
- description: "Lens extra: remove implementation singleton test hook"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ LensController\\.setInstanceForTesting\\(mLensController\\);\\\n"
    replace: ""
  count: 1
- description: "Lens extra: replace disabled implementation case with active inert callback regression"
  regex:
    re_pattern: "\\ \\ \\ \\ @Test\\\n\\ \\ \\ \\ @DisabledTest\\(message\\ =\\ \"https://crbug\\.com/477372460\"\\)\\\n\\ \\ \\ \\ public\\ void\\ testOnSearchboxLensTap_lensNotEnabled_lensNotStarted\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ TextBubble\\.setSkipShowCheckForTesting\\(true\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ mHistogramWatcher\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ HistogramWatcher\\.newSingleRecordWatcher\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ BUTTON_CLICKED_HISTOGRAM,\\ GoogleBottomBarButtonEvent\\.SEARCHBOX_LENS\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ doReturn\\(false\\)\\.when\\(mLensController\\)\\.isLensEnabled\\(any\\(\\)\\);\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ Context\\ context\\ =\\ mActivity;\\\n\\ \\ \\ \\ \\ \\ \\ \\ mGoogleBottomBarActionsHandler\\.onSearchboxLensTap\\(new\\ View\\(context\\)\\);\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ verify\\(mLensController,\\ never\\(\\)\\)\\.startLens\\(any\\(WindowAndroid\\.class\\),\\ any\\(\\)\\);\\\n\\ \\ \\ \\ \\}"
    replace: "    @Test\n    public void testOnSearchboxLensTap_isInertWithTab() {\n        mHistogramWatcher =\n                HistogramWatcher.newBuilder().expectNoRecords(BUTTON_CLICKED_HISTOGRAM).build();\n\n        mGoogleBottomBarActionsHandler.onSearchboxLensTap(new View(mActivity));\n\n        verify(mTabSupplier, never()).get();\n        verify(mShareDelegateSupplier, never()).get();\n        assertNull(Shadows.shadowOf(mActivity).getNextStartedActivityForResult());\n    }"
  count: 1
- description: "Lens extra: assert no launch/tab read/metric when nullable tab provider has no tab"
  regex:
    re_pattern: "\\ \\ \\ \\ @Test\\\n\\ \\ \\ \\ public\\ void\\ testOnSearchboxLensTap_lensEnabled_lensStarted\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mHistogramWatcher\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ HistogramWatcher\\.newSingleRecordWatcher\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ BUTTON_CLICKED_HISTOGRAM,\\ GoogleBottomBarButtonEvent\\.SEARCHBOX_LENS\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ doReturn\\(true\\)\\.when\\(mLensController\\)\\.isLensEnabled\\(any\\(\\)\\);\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ Context\\ context\\ =\\ mActivity;\\\n\\ \\ \\ \\ \\ \\ \\ \\ mGoogleBottomBarActionsHandler\\.onSearchboxLensTap\\(new\\ View\\(context\\)\\);\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ verify\\(mLensController\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.startLens\\(any\\(WindowAndroid\\.class\\),\\ mLensIntentParamsArgumentCaptor\\.capture\\(\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ LensIntentParams\\ params\\ =\\ mLensIntentParamsArgumentCaptor\\.getValue\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertEquals\\(LensEntryPoint\\.GOOGLE_BOTTOM_BAR,\\ params\\.getLensEntryPoint\\(\\)\\);\\\n\\ \\ \\ \\ \\}"
    replace: "    @Test\n    public void testOnSearchboxLensTap_isInertWithoutTab() {\n        when(mTabSupplier.get()).thenReturn(null);\n        mHistogramWatcher =\n                HistogramWatcher.newBuilder().expectNoRecords(BUTTON_CLICKED_HISTOGRAM).build();\n\n        mGoogleBottomBarActionsHandler.onSearchboxLensTap(new View(mActivity));\n\n        verify(mTabSupplier, never()).get();\n        verify(mShareDelegateSupplier, never()).get();\n        assertNull(Shadows.shadowOf(mActivity).getNextStartedActivityForResult());\n    }"
  count: 1
