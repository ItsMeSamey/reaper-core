# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/actions/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "java/src/org/chromium/chrome/browser/ui/actions/tabswitcher/TabSwitcherActionButtonBinder\.java",\

      \ \ \ \ "java/src/org/chromium/chrome/browser/ui/actions/tabswitcher/TabSwitcherActionProperties\.java",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//base:base_java",\

      '
    replace: "    \"java/src/org/chromium/chrome/browser/ui/actions/tabswitcher/TabSwitcherActionButtonBinder.java\",\n    \"java/src/org/chromium/chrome/browser/ui/actions/tabswitcher/TabSwitcherActionProperties.java\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"java/src/org/chromium/chrome/browser/ui/actions/glic/GlicActionButtonBinder.java\",\n      \"java/src/org/chromium/chrome/browser/ui/actions/glic/GlicActionCoordinator.java\",\n      \"java/src/org/chromium/chrome/browser/ui/actions/glic/GlicActionProperties.java\",\n      \"java/src/org/chromium/chrome/browser/ui/actions/glic/GlicActionUtils.java\",\n    ]\n  }\n\n  deps = [\n    \"//base:base_java\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/actions/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/android:ui_no_recycler_view_java",\

      \ \ \ \ "//url:url_java",\

      \ \ \]\

      \}\

      \

      android_library\("tabswitcher_java"\)\ \{\

      '
    replace: "    \"//ui/android:ui_no_recycler_view_java\",\n    \"//url:url_java\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/actor/android:java\",\n      \"//chrome/browser/glic:public_java\",\n      \"//chrome/browser/glic/android:common_java\",\n      \"//chrome/browser/glic/android:java_resources\",\n      \"//chrome/browser/glic/android:menu_java\",\n    ]\n  }\n}\n\nandroid_library(\"tabswitcher_java\") {\n"
