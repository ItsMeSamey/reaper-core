 \\ \\ \\ \\ \\ \\ /\\*\\ iconResId=\\ \\*/\\ Resources\\.ID_NULL,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ R\\.string\\.tab_switcher_button_label,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ R\\.string\\.tab_switcher_button_label\\);\\\n\\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ /\\*\\*\\\n\\ \\ \\ \\ \\ \\*\\ Registers\\ an\\ action\\ in\\ the\\ registry\\.\\\n\\ \\ \\ \\ \\ \\*\\\n\\ \\ \\ \\ \\ \\*\\ @param\\ registry\\ The\\ \\{@link\\ ActionRegistry\\}\\ to\\ register\\ to\\.\\\n\\ \\ \\ \\ \\ \\*\\ @param\\ actionId\\ The\\ ID\\ of\\ the\\ action\\.\\\n\\ \\ \\ \\ \\ \\*\\ @param\\ keys\\ The\\ property\\ keys\\ to\\ use\\ for\\ the\\ model\\.\\\n\\ \\ \\ \\ \\ \\*\\ @param\\ iconResId\\ The\\ drawable\\ resource\\ ID\\ for\\ the\\ icon\\.\\\n\\ \\ \\ \\ \\ \\*\\ @param\\ contentDescriptionResId\\ The\\ string\\ resource\\ ID\\ for\\ the\\ content\\ description\\.\\\n\\ \\ \\ \\ \\ \\*\\ @param\\ tooltipResId\\ The\\ string\\ resource\\ ID\\ for\\ the\\ tooltip\\.\\\n\\ \\ \\ \\ \\ \\*/\\\n\\ \\ \\ \\ public\\ static\\ void\\ registerAction\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ ActionRegistry\\ registry,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ @ActionId\\ int\\ actionId,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ PropertyKey\\[\\]\\ keys,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ @DrawableRes\\ int\\ iconResId,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ @StringRes\\ int\\ contentDescriptionResId,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ @StringRes\\ int\\ tooltipResId\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ PropertyModel\\ model\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ createActionModel\\(keys,\\ iconResId,\\ contentDescriptionResId,\\ tooltipResId\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ registry\\.register\\(actionId,\\ model\\);\\\n\\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ /\\*\\*\\\n\\ \\ \\ \\ \\ \\*\\ Creates\\ a\\ property\\ model\\ for\\ an\\ action\\.\\\n\\ \\ \\ \\ \\ \\*\\\n\\ \\ \\ \\ \\ \\*\\ @param\\ keys\\ The\\ property\\ keys\\ to\\ use\\ for\\ the\\