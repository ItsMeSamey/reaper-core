      \

      /\*\*\ Utilities\ for\ the\ Omnibox\ view\ component\.\ \*/\

      @NullMarked\

      public\ class\ OmniboxViewUtil\ \{\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Returns\ whether\ \{@code\ currentText\}\ and\ \{@code\ newText\}\ contain\ equivalent\
      spans\ of\ \{@code\

      \ \ \ \ \ \*\ spanType\}\.\ Other\ span\ types\ are\ deliberately\ ignored\ because\ TextView\ and\
      the\ IME\ attach\

      \ \ \ \ \ \*\ transient\ spans\ that\ do\ not\ represent\ Omnibox\ display\ state\.\

      \ \ \ \ \ \*/\

      \ \ \ \ static\ <T>\ boolean\ haveEquivalentSpans\(\

      \ \ \ \ \ \ \ \ \ \ \ \ CharSequence\ currentText,\ CharSequence\ newText,\ Class<T>\ spanType\)\
      \{\

      \ \ \ \ \ \ \ \ if\ \(!\(currentText\ instanceof\ Spanned\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ !\(newText\ instanceof\ Spanned\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ \(\(Spanned\)\ newText\)\.getSpans\(0,\ newText\.length\(\),\
      spanType\)\.length\ ==\ 0;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ Spanned\ currentSpannedText\ =\ \(Spanned\)\ currentText;\

      \ \ \ \ \ \ \ \ T\[\]\ currentSpans\ =\ currentSpannedText\.getSpans\(0,\ currentText\.length\(\),\
      spanType\);\

      \ \ \ \ \ \ \ \ if\ \(!\(newText\ instanceof\ Spanned\)\)\ return\ currentSpans\.length\ ==\ 0;\

      \

      \ \ \ \ \ \ \ \ Spanned\ newSpannedText\ =\ \(Spanned\)\ newText;\

      \ \ \ \ \ \ \ \ T\[\]\ newSpans\ =\ newSpannedText\.getSpans\(0,\ newText\.length\(\),\ spanType\);\

      \ \ \ \ \ \ \ \ if\ \(currentSpans\.length\ !=\ newSpans\.length\)\ return\ false;\

      \

      \ \ \ \ \ \ \ \ for\ \(int\ i\ =\ 0;\ i\ <\ currentSpans\.length;\ i\+\+\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ T\ currentSpan\ =\ currentSpans\[i\];\

      \ \ \ \ \ \ \ \ \ \ \ \ T\ newSpan\ =\ newSpans\[i\];\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!currentSpan\.equals\(newSpan\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ currentSpannedText\.getSpanStart\(currentSpan\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ !=\ newSpannedText\.getSpanStart\(newSpan\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ currentSpannedText\.getSpanEnd\(currentSpan\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ !=\ newSpannedText\.getSpanEnd\(newSpan\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ currentSpannedText\.getSpanFlags\(currentSpan\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ !=\ newSpannedText\.getSpanFlags\(newSpan\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Sanitizing\ the\ given\ string\ to\ be\ safe\ to\ paste\ into\ the\ omnibox\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ clipboardString\ The\ string\ from\ the\ clipboard\.\

      \ \ \ \ \ \*\ @return\ The\ sanitized\ version\ of\ the\ string\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ static\ String\ sanitizeTextForPaste\(String\ clipboardString\)\ \{\

      \ \ \ \ \ \ \ \ return\ OmniboxViewUtilJni\.get\(\)\.sanitizeTextForPaste\(clipboardString\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Returns\ whether\ the\ given\ page\ classification\ represents\ a\ regular\ tab\ context\
      \(i\.e\.,\ not\ the\

      \ \ \ \ \ \*\ Hub,\ Custom\ Tabs,\ or\ Co\-Browsing\ Composebox\)\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ pageClassification\ The\ PageClassification\ value\ to\ check\.\

      \ \ \ \ \ \*\ @return\ True\ if\ it\ is\ a\ regular'
    replace: "e\n// found in the LICENSE file.\n\npackage org.chromium.chrome.browser.omnibox;\n\nimport\
      \ android.text.Spanned;\n\nimport org.chromium.build.annotations.NullMarked;\nimport org.chromium.components.metrics.OmniboxEventProtosIntDef.PageClassification;\n\
      import org.chromium.components.omnibox.PageClassificationUtils;\nimport org.jni_zero.NativeMethods;\n\
      \n/** Utilities for the Omnibox view component. */\n@NullMarked\npublic class OmniboxViewUtil {\n\
      \n    /**\n     * Returns whether {@code currentText} and {@code newText} contain equivalent spans\
      \ of {@code\n     * spanType}. Other span types are deliberately ignored because TextView and the\
      \ IME attach\n     * transient spans that do not represent Omnibox display state.\n     */\n   \
      \ static <T> boolean haveEquivalentSpans(\n            CharSequence currentText, CharSequence newText,\
      \ Class<T> spanType) {\n        if (!(currentText instanceof Spanned)) {\n            return !(newText\
      \ instanceof Spanned)\n                    || ((Spanned) newText).getSpans(0, newText.length(),\
      \ spanType).length == 0;\n        }\n\n        Spanned currentSpannedText = (Spanned) currentText;\n\
      \        T[] currentSpans = currentSpannedText.getSpans(0, currentText.length(), spanType);\n  \
      \      if (!(newText instanceof Spanned)) return currentSpans.length == 0;\n\n        Spanned newSpannedText\
      \ = (Spanned) newText;\n        T[] newSpans = newSpannedText.getSpans(0, newText.length(), spanType);\n\
      \        if (currentSpans.length != newSpans.length) return false;\n\n        for (int i = 0; i\
      \ < currentSpans.length; i++) {\n            T currentSpan = currentSpans[i];\n            T newSpan\
      \ = newSpans[i];\n            if (!currentSpan.equals(newSpan)\n                    || currentSpannedText.getSpanStart(currentSpan)\n\
      \                            != newSpannedText.getSpanStart(newSpan)\n                    || currentSpannedText.getSpanEnd(currentSpan)\n\
      \                            != newSpannedText.getSpanEnd(newSpan)\n                    || currentSpannedText.getSpanFlags(currentSpan)\n\
      \                            != newSpannedText.getSpanFlags(newSpan)) {\n                return\
      \ false;\n            }\n        }\n\n        return true;\n    }\n\n    /**\n     * Sanitizing\
      \ the given string to be safe to paste into the omnibox.\n     *\n     * @param clipboardString\
      \ The string from the clipboard.\n     * @return The sanitized version of the string.\n     */\n\
      \    public static String sanitizeTextForPaste(String clipboardString) {\n        return OmniboxViewUtilJni.get().sanitizeTextForPaste(clipboardString);\n\
      \    }\n\n    /**\n     * Returns whether the given page classification represents a regular tab\
      \ context (i.e., not the\n     * Hub, Custom Tabs, or standalone search widgets).\n     *\n    \
      \ * @param pageClassification The PageClassification value to check.\n     * @return True if it\
      \ is a regular"
