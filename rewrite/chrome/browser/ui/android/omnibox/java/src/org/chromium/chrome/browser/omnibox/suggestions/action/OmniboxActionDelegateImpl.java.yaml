substitutions:

# Lens Android production source closure; preserve ordinary image/toolbar/core APIs.
- description: "Lens production: remove Lens coordinator imports"
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.ui\\.lens\\.LensOverlayCoordinator;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.ui\\.lens\\.LensOverlayInvocationSource;\\\n"
    replace: ""
  count: 1
- description: "Lens production: retain interface override as inert implementation"
  regex:
    re_pattern: "\\ \\ \\ \\ @Override\\\n\\ \\ \\ \\ public\\ void\\ openLensOverlay\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ var\\ tab\\ =\\ mTabSupplier\\.get\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(tab\\ !=\\ null\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ LensOverlayCoordinator\\.getOrCreateForTab\\(tab\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.start\\(LensOverlayInvocationSource\\.OMNIBOX_PAGE_ACTION\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\}\\\n"
    replace: "    @Override\n    public void openLensOverlay() {}\n"
  count: 1
