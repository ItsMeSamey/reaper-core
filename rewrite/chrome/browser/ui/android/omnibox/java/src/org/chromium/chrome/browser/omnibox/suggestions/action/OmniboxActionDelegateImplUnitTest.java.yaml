substitutions:

# Lens test companions; preserve ordinary test classes and assertions.
- description: "Lens test companion: add assertion for absent activity launch"
  regex:
    re_pattern: "import\\ static\\ org\\.junit\\.Assert\\.assertFalse;\\\n"
    replace: "import static org.junit.Assert.assertFalse;\nimport static org.junit.Assert.assertNull;\n"
  count: 1
- description: "Lens test companion: remove Lens-only UserDataHost import"
  regex:
    re_pattern: "import\\ org\\.chromium\\.base\\.UserDataHost;\\\n"
    replace: ""
  count: 1
- description: "Lens test companion: remove removed implementation imports"
  regex:
    re_pattern: "import\\ org\\.chromium\\.chrome\\.browser\\.ui\\.lens\\.LensOverlayCoordinator;\\\nimport\\ org\\.chromium\\.chrome\\.browser\\.ui\\.lens\\.LensOverlayInvocationSource;\\\n"
    replace: ""
  count: 1
- description: "Lens test companion: remove Lens-only typed mock"
  regex:
    re_pattern: "\\ \\ \\ \\ @Mock\\ private\\ LensOverlayCoordinator\\ mLensOverlayCoordinator;\\\n"
    replace: ""
  count: 1
- description: "Lens test companion: assert inert public delegate with present and absent tab"
  regex:
    re_pattern: "\\ \\ \\ \\ @Test\\\n\\ \\ \\ \\ public\\ void\\ openLensOverlay\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ //\\ Provide\\ a\\ UserDataHost\\ to\\ prevent\\ LensOverlayCoordinator\\ from\\ crashing\\ on\\\n\\ \\ \\ \\ \\ \\ \\ \\ //\\ getOrCreateForTab\\.\\\n\\ \\ \\ \\ \\ \\ \\ \\ UserDataHost\\ userDataHost\\ =\\ new\\ UserDataHost\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ userDataHost\\.setUserData\\(LensOverlayCoordinator\\.class,\\ mLensOverlayCoordinator\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ doReturn\\(userDataHost\\)\\.when\\(mTab\\)\\.getUserDataHost\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ mDelegate\\.openLensOverlay\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ verify\\(mLensOverlayCoordinator\\)\\.start\\(LensOverlayInvocationSource\\.OMNIBOX_PAGE_ACTION\\);\\\n\\ \\ \\ \\ \\}\\\n"
    replace: "    @Test\n    public void openLensOverlay() {\n        mDelegate.openLensOverlay();\n        mTabReference.set(null);\n        mDelegate.openLensOverlay();\n\n        verifyNoMoreInteractions(\n                mTab,\n                mMockOpenUrl,\n                mMockOpenIncognitoPage,\n                mMockOpenPasswordSettings,\n                mMockOpenQuickDeleteDialog);\n        assertNull(\n                shadowOf((Application) ApplicationProvider.getApplicationContext())\n                        .getNextStartedActivity());\n    }\n"
  count: 1
