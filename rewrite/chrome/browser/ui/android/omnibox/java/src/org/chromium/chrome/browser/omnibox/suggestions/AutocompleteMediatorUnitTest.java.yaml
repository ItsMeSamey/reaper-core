        \ \ \ \ @Test\

        \ \ \ \ public\ void\ updateSuggestionsList_updateHeightWhenHardwareKeyboardIsConnected\(\)\ \{\

        \ \ \ \ \ \ \ \ //\ Simulates\ behavior\ of\ physical\ keyboard\ being\ attached\ to\ the\ device\.\

        \ \ \ \ \ \ \ \ //\ In\ this\ scenario,\ requesting\ keyboard\ to\ come\ up\ will\ not\ result\
        with\ an\ actual\

        \ \ \ \ \ \ \ \ //\ keyboard\ showing\ on\ the\ screen\.\ As\ a\ result,\ the\ updated\ height\
        should\ be\ used\

        \ \ \ \ \ \ \ \ //\ when\ estimating\ presence\ of\ fully\ concealed\ items\ on\ the\ suggestions\
        list\.\

        \ \ \ \ \ \ \ \ //\

        \ \ \ \ \ \ \ \ //\ Attaching\ and\ detaching\ physical\ keyboard\ will\ affect\ the\ space\ on\
        the\ screen,\ but\ since\

        \ \ \ \ \ \ \ \ //\ the\ list\ of\ suggestions\ does\ not\ change,\ we\ are\ keeping\ them\ in\
        exactly\ the\ same\ order\

        \ \ \ \ \ \ \ \ //\ \(and\ keep\ the\ grouping\ prior\ to\ the\ change\)\.\

        \ \ \ \ \ \ \ \ //\ The\ grouping\ is\ only\ affected,\ when\ the\ new\ list\ is\ provided\ \(as\
        a\ result\ of\ user''s\

        \ \ \ \ \ \ \ \ //\ input\)\.\

        \ \ \ \ \ \ \ \ final\ int\ heightOfOAllSuggestions\ =\ mSuggestionsList\.size\(\)\ \*\ SUGGESTION_MIN_HEIGHT;\

        \ \ \ \ \ \ \ \ final\ int\ heightWithOneConcealedItem\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(mSuggestionsList\.size\(\)\ \-\ 1\)\ \*\ SUGGESTION_MIN_HEIGHT;\

        \

        \ \ \ \ \ \ \ \ //\ This\ will\ request\ keyboard\ to\ show\ up\ upon\ receiving\ next\ suggestions\
        list\.\

        \ \ \ \ \ \ \ \ when\(mAutocompleteDelegate\.isKeyboardActive\(\)\)\.thenReturn\(true\);\

        \ \ \ \ \ \ \ \ //\ Report\ the\ height\ of\ the\ suggestions\ list,\ indicating\ that\ the\ keyboard\
        is\ not\ visible\.\

        \ \ \ \ \ \ \ \ //\ In\ both\ cases,\ the\ updated\ suggestions\ list\ height\ should\ be\ used\
        to\ estimate\ presence\ of\

        \ \ \ \ \ \ \ \ //\ fully\ concealed\ items\ on\ the\ suggestions\ list\.\

        \ \ \ \ \ \ \ \ mMediator\.onSuggestionDropdownHeightChanged\(heightOfOAllSuggestions\);\

        \ \ \ \ \ \ \ \ mMediator\.onSuggestionsReceived\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutocompleteResult\.fromCache\(mSuggestionsList,\ null\),\ /\*\
        isFinal=\ \*/\ true\);\

        \

        \ \ \ \ \ \ \ \ //\ Build\ separate\ list\ of\ suggestions\ so\ that\ these\ are\ accepted\ as\
        a\ new\ set\.\

        \ \ \ \ \ \ \ \ //\ We\ want\ to\ follow\ the\ same\ restrictions\ as\ the\ original\ list\ \(specifically:\
        have\ a\

        \ \ \ \ \ \ \ \ //\ resulting\ list\ of\ suggestions\ taller\ than\ the\ space\ in\ dropdown\ view\),\
        so\ make\ sure\

        \ \ \ \ \ \ \ \ //\ the\ list\ sizes\ are\ same\.\

        \ \ \ \ \ \ \ \ List<AutocompleteMatch>\ newList\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ buildSampleSuggestionsList\(mSuggestionsList\.size\(\),\ "SuggestionB"\);\

        \ \ \ \ \ \ \ \ mMediator\.onSuggestionDropdownHeightChanged\(heightWithOneConcealedItem\);\

        \ \ \ \ \ \ \ \ mMediator\.onSuggestionsReceived\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutocompleteResult\.fromCache\(newList,\ null\),\ /\*\ isFinal=\
        \*/\ true\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Test\

        \ \ \ \ public\ void\ updateSuggestionsList_rejectsHeightUpdatesWhenKeyboardIsHidden\(\)\ \{\

        \ \ \ \ \ \ \ \ //\ Simulates\ scenario\ where\ we\ receive\ dropdown\ height\ update\ after\ software\
        keyboard\ is\

        \ \ \ \ \ \ \ \ //\ explicitly\ hidden\.\ In\ this\ scenario\ the\ updates\ should\ be\ rejected\
        when\ estimating\

        \ \ \ \ \ \ \ \ //\ presence\ of\ fully\ concealed\ items\ on\ the\ suggestions\ list\.\

        \ \ \ \ \ \ \ \ final\ int\ heightOfOAllSuggestions\ =\ mSuggestionsList\.size\(\)\ \*\ SUGGESTION_MIN_HEIGHT;\

        \ \ \ \ \ \ \ \ final\ int\ heightWithOneConcealedItem\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(mSuggestionsList\.size\(\)\ \-\ 1\)\ \*\ SUGGESTION_MIN_HEIGHT;\

        \

        \ \ \ \ \ \ \ \ //\ Report\ height\ change\ with\ keyboard\ visible\

        \ \ \ \ \ \ \ \ mMediator\.onSuggestionDropdownHeightChanged\(heightWithOneConcealedItem\);\

        \ \ \ \ \ \ \ \ mMediator\.onSuggestionsReceived\(AutocompleteResult\.fromCache\(mSuggestionsList,\
        null\),\ true\);\

        \

        \ \ \ \ \ \ \ \ //\ "Hide\ keyboard",\ report\ larger\ area\ and\ re\-evaluate\ the\ results\.\
        We\ should\ see\ no\

        \ \ \ \ \ \ \ \ //\ difference,\ as\ the\ logic\ should\ only\ evaluate\ presence\ of\ items\ concealed\
        when\ keyboard\

        \ \ \ \ \ \ \ \ //\ is\ active\.\

        \ \ \ \ \ \ \ \ when\(mAutocompleteDelegate\.isKeyboardActive\(\)\)\.thenReturn\(false\);\

        \ \ \ \ \ \ \ \ mMediator\.onSuggestionDropdownHeightChanged\(heightOfOAllSuggestions\);\

        \ \ \ \ \ \ \ \ mMediator\.onSuggestionsReceived\(AutocompleteResult\.fromCache\(mSuggestionsList,\
        null\),\ true\);\

        \ \ \ \ \}\

