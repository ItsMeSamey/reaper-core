        \ \ \ \ \ \ \ \ assertTrue\(mMediator\.triggerSiteSearch\(SiteSearchActivationSource\.SPACE\)\);\

        \ \ \ \ \ \ \ \ assertNotNull\(session\.getAutocompleteInput\(\)\.getSiteSearchData\(\)\);\

        \ \ \ \ \}\

