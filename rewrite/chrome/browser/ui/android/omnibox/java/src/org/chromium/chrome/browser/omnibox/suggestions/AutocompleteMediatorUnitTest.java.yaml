        \ \ \ \ @Test\

        \ \ \ \ public\ void\ setSessionState_mobileMode_emptyOmnibox\(\)\ \{\

        \ \ \ \ \ \ \ \ //\ In\ Mobile\ mode,\ if\ LocationBar\ clears\ the\ Page\ URL\ on\ focus,\ Autocomplete\
        requests\

        \ \ \ \ \ \ \ \ //\ Zero\-Prefix\ suggestions\.\

        \ \ \ \ \ \ \ \ OmniboxCapabilities\.setHasDesktopExperienceForTesting\(/\*\ hasDesktopExperience=\
