substitutions:
- description: 'Reaper Android: remove optional AI hooks and preserve ordinary input behavior.'
  regex:
    re_pattern: 'org\.chromium\.chrome\.browser\.omnibox;\

      \

      import\ static\ org\.junit\.Assert\.assertEquals;\

      import\ static\ org\.junit\.Assert\.assertFalse;\

      import\ static\ org\.junit\.Assert\.assertNull;\

      import\ static\ org\.junit\.Assert\.assertTrue;\

      import\ static\ org\.mockito\.ArgumentMatchers\.any;\

      import\ static\ org\.mockito\.Mockito\.never;\

      import\ static\ org\.mockito\.Mockito\.verify;\

      \

      import\ org\.junit\.Before;\

      import\ org\.junit\.Rule;\

      import\ org\.junit\.Test;\

      import\ org\.junit\.runner\.RunWith;\

      import\ org\.mockito\.Mock;\

      import\ org\.mockito\.junit\.MockitoJUnit;\

      import\ org\.mockito\.junit\.MockitoRule;\

      import\ org\.mockito\.quality\.Strictness;\

      \

      import\ org\.chromium\.base\.Callback;\

      import\ org\.chromium\.base\.test\.BaseRobolectricTestRunner;\

      import\ org\.chromium\.chrome\.browser\.ui\.side_ui\.SideUiStateProvider;\

      \

      /\*\*\ Unit\ tests\ for\ \{@link\ LocationBarEmbedderUiOverrides\}\.\ \*/\

      @RunWith\(BaseRobolectricTestRunner\.class\)\

      public\ class\ LocationBarEmbedderUiOverridesUnitTest\ \{\

      \ \ \ \ @Rule\

      \ \ \ \ public\ final\ MockitoRule\ mMockitoRule\ =\ MockitoJUnit\.rule\(\)\.strictness\(Strictness\.STRICT_STUBS\);\

      \

      \ \ \ \ @Mock\ private\ Callback<SideUiStateProvider>\ mObserver1;\

      \ \ \ \ @Mock\ private\ Callback<SideUiStateProvider>\ mObserver2;\

      \ \ \ \ @Mock\ private\ SideUiStateProvider\ mSideUiStateProvider;\

      \ \ \ \ @Mock\ private\ SideUiStateProvider\ mSideUiStateProvider2;\

      \

      \ \ \ \ private\ LocationBarEmbedderUiOverrides\ mUiOverrides;\

      \

      \ \ \ \ @Before\

      \ \ \ \ public\ void\ setUp\(\)\ \{\

      \ \ \ \ \ \ \ \ mUiOverrides\ =\ new\ LocationBarEmbedderUiOverrides\(\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Test\

      \ \ \ \ public\ void\ testSideUiStateProviderSupplier_notifiedOnSet\(\)\ \{\

      \ \ \ \ \ \ \ \ assertNull\(mUiOverrides\.getSideUiStateProvider\(\)\);\

      \ \ \ \ \ \ \ \ mUiOverrides\.getSideUiStateProviderSupplier\(\)\.addSyncObserverAndCallIfNonNull\(mObserver1\);\

      \ \ \ \ \ \ \ \ verify\(mObserver1,\ never\(\)\)\.onResult\(any\(\)\);\

      \

      \ \ \ \ \ \ \ \ mUiOverrides\.setSideUiStateProvider\(mSideUiStateProvider\);\

      \ \ \ \ \ \ \ \ verify\(mObserver1\)\.onResult\(mSideUiStateProvider\);\

      \ \ \ \ \ \ \ \ assertEquals\(mSideUiStateProvider,\ mUiOverrides\.getSideUiStateProvider\(\)\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Test\

      \ \ \ \ public\ void\ testSideUiStateProviderSupplier_notifiedImmediatelyIfAlreadySet\(\)\ \{\

      \ \ \ \ \ \ \ \ mUiOverrides\.setSideUiStateProvider\(mSideUiStateProvider\);\

      \

      \ \ \ \ \ \ \ \ mUiOverrides\.getSideUiStateProviderSupplier\(\)\.addSyncObserverAndCallIfNonNull\(mObserver1\);\

      \ \ \ \ \ \ \ \ verify\(mObserver1\)\.onResult\(mSideUiStateProvider\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Test\

      \ \ \ \ public\ void\ testSideUiStateProviderSupplier_removeObserver\(\)\ \{\

      \ \ \ \ \ \ \ \ mUiOverrides\.getSideUiStateProviderSupplier\(\)\.addSyncObserverAndCallIfNonNull\(mObserver1\);\

      \ \ \ \ \ \ \ \ mUiOverrides\.getSideUiStateProviderSupplier\(\)\.removeObserver\(mObserver1\);\

      \

      \ \ \ \ \ \ \ \ mUiOverrides\.setSideUiStateProvider\(mSideUiStateProvider\);\

      \ \ \ \ \ \ \ \ verify\(mObserver1,\ never\(\)\)\.onResult\(any\(\)\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Test\

      \ \ \ \ public\ void\ testSideUiStateProviderSupplier_multipleObservers\(\)\ \{\

      \ \ \ \ \ \ \ \ mUiOverrides\.getSideUiStateProviderSupplier\(\)\.addSyncObserverAndCallIfNonNull\(mObserver1\);\

      \ \ \ \ \ \ \ \ mUiOverrides\.getSideUiStateProviderSupplier\(\)\.addSyncObserverAndCallIfNonNull\(mObserver2\);\

      \

      \ \ \ \ \ \ \ \ mUiOverrides\.setSideUiStateProvider\(mSideUiStateProvider\);\

      \ \ \ \ \ \ \ \ verify\(mObserver1\)\.onResult\(mSideUiStateProvider\);\

      \ \ \ \ \ \ \ \ verify\(mObserver2\)\.onResult\(mSideUiStateProvider\);\

      \

      \ \ \ \ \ \ \ \ mUiOverrides\.getSideUiStateProviderSupplier\(\)\.removeObserver\(mObserver1\);\

      \

      \ \ \ \ \ \ \ \ mUiOverrides\.setSideUiStateProvider\(mSideUiStateProvider2\);\

      \ \ \ \ \ \ \ \ verify\(mObserver1\)\.onResult\(any\(\)\);\

      \ \ \ \ \ \ \ \ verify\(mObserver2\)\.onResult\(mSideUiStateProvider2\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Test\

      \ \ \ \ public\ void\ testIsFullWidthExpansionAllowed\(\)\ \{\

      \ \ \ \ \ \ \ \ assertTrue\(mUiOverrides\.isFullWidthExpansionAllowed\(\)\);\

      \

      \ \ \ \ \ \ \ \ mUiOverrides\.setIsFullWidthExpansionAllowedSupplier\(\(\)\ \->\ false\);\

      \ \ \ \ \ \ \ \ assertFalse\(mUiOverrides\.isFullWidthExpansionAllowed\(\)\);\

      \

      \ \ \ \ \ \ \ \ mUiOverrides\.setIsFullWidthExpansionAllowedSupplier\(\(\)\ \->\ true\);\

      \ \ \ \ \ \ \ \ assertTrue\(mUiOverrides\.isFullWidthExpansionAllowed\(\)\);\

      \ \ \ \ \}\

      \}\

      '
    replace: "org.chromium.chrome.browser.omnibox;\n\nimport static org.junit.Assert.assertEquals;\nimport\
      \ static org.junit.Assert.assertNull;\nimport static org.mockito.ArgumentMatchers.any;\nimport static\
      \ org.mockito.Mockito.never;\nimport static org.mockito.Mockito.verify;\n\nimport org.chromium.base.Callback;\n\
      import org.chromium.base.test.BaseRobolectricTestRunner;\nimport org.chromium.chrome.browser.ui.side_ui.SideUiStateProvider;\n\
      import org.junit.Before;\nimport org.junit.Rule;\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\n\
      import org.mockito.Mock;\nimport org.mockito.junit.MockitoJUnit;\nimport org.mockito.junit.MockitoRule;\n\
      import org.mockito.quality.Strictness;\n\n/** Unit tests for {@link LocationBarEmbedderUiOverrides}.\
      \ */\n@RunWith(BaseRobolectricTestRunner.class)\npublic class LocationBarEmbedderUiOverridesUnitTest\
      \ {\n    @Rule\n    public final MockitoRule mMockitoRule = MockitoJUnit.rule().strictness(Strictness.STRICT_STUBS);\n\
      \n    @Mock private Callback<SideUiStateProvider> mObserver1;\n    @Mock private Callback<SideUiStateProvider>\
      \ mObserver2;\n    @Mock private SideUiStateProvider mSideUiStateProvider;\n    @Mock private SideUiStateProvider\
      \ mSideUiStateProvider2;\n\n    private LocationBarEmbedderUiOverrides mUiOverrides;\n\n    @Before\n\
      \    public void setUp() {\n        mUiOverrides = new LocationBarEmbedderUiOverrides();\n    }\n\
      \n    @Test\n    public void testSideUiStateProviderSupplier_notifiedOnSet() {\n        assertNull(mUiOverrides.getSideUiStateProvider());\n\
      \        mUiOverrides.getSideUiStateProviderSupplier().addSyncObserverAndCallIfNonNull(mObserver1);\n\
      \        verify(mObserver1, never()).onResult(any());\n\n        mUiOverrides.setSideUiStateProvider(mSideUiStateProvider);\n\
      \        verify(mObserver1).onResult(mSideUiStateProvider);\n        assertEquals(mSideUiStateProvider,\
      \ mUiOverrides.getSideUiStateProvider());\n    }\n\n    @Test\n    public void testSideUiStateProviderSupplier_notifiedImmediatelyIfAlreadySet()\
      \ {\n        mUiOverrides.setSideUiStateProvider(mSideUiStateProvider);\n\n        mUiOverrides.getSideUiStateProviderSupplier().addSyncObserverAndCallIfNonNull(mObserver1);\n\
      \        verify(mObserver1).onResult(mSideUiStateProvider);\n    }\n\n    @Test\n    public void\
      \ testSideUiStateProviderSupplier_removeObserver() {\n        mUiOverrides.getSideUiStateProviderSupplier().addSyncObserverAndCallIfNonNull(mObserver1);\n\
      \        mUiOverrides.getSideUiStateProviderSupplier().removeObserver(mObserver1);\n\n        mUiOverrides.setSideUiStateProvider(mSideUiStateProvider);\n\
      \        verify(mObserver1, never()).onResult(any());\n    }\n\n    @Test\n    public void testSideUiStateProviderSupplier_multipleObservers()\
      \ {\n        mUiOverrides.getSideUiStateProviderSupplier().addSyncObserverAndCallIfNonNull(mObserver1);\n\
      \        mUiOverrides.getSideUiStateProviderSupplier().addSyncObserverAndCallIfNonNull(mObserver2);\n\
      \n        mUiOverrides.setSideUiStateProvider(mSideUiStateProvider);\n        verify(mObserver1).onResult(mSideUiStateProvider);\n\
      \        verify(mObserver2).onResult(mSideUiStateProvider);\n\n        mUiOverrides.getSideUiStateProviderSupplier().removeObserver(mObserver1);\n\
      \n        mUiOverrides.setSideUiStateProvider(mSideUiStateProvider2);\n        verify(mObserver1).onResult(any());\n\
      \        verify(mObserver2).onResult(mSideUiStateProvider2);\n    }\n}\n"
