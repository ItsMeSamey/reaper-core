# Retain generic colored StatusView coverage without Android commerce resources.
substitutions:
- description: Render a retained colored icon without restoring removed storefront resources.
  regex:
    re_pattern: '\ \ \ \ public\ void\ testStatusViewWithStoreIcon\(\)\ throws\ IOException\ \{\

      \ \ \ \ \ \ \ \ runOnUiThreadBlocking\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Drawable\ storeIconDrawable\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ResourcesCompat\.getDrawable\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ sActivity\.getResources\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.drawable\.ic_storefront_blue,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ sActivity\.getTheme\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ StatusIconResource\ statusIcon\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ PermissionIconResource\(storeIconDrawable,\
      false\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ statusIcon\.setTransitionType\(StatusView\.IconTransitionType\.ROTATE\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mStatusModel\.set\(StatusProperties\.STATUS_VIEW_BACKGROUND,\
      mBackground\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mStatusModel\.set\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ StatusProperties\.STATUS_VIEW_TOOLTIP_TEXT,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.string\.accessibility_menu_info\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mStatusModel\.set\(StatusProperties\.STATUS_ICON_RESOURCE,\
      statusIcon\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \ \ \ \ \ \ \ \ mRenderTestRule\.render\(mStatusView,\ "status_view_with_store_icon"\);\

      \ \ \ \ \}'
    replace: "    public void testStatusViewWithColoredIcon() throws IOException {\n        runOnUiThreadBlocking(\n\
      \                () -> {\n                    // Keep colored-icon coverage independent of removed\
      \ commerce resources.\n                    Drawable coloredIconDrawable =\n                    \
      \        ResourcesCompat.getDrawable(\n                                    sActivity.getResources(),\n\
      \                                    R.drawable.ic_apps_blue_24dp,\n                           \
      \         sActivity.getTheme());\n                    StatusIconResource statusIcon =\n        \
      \                    new PermissionIconResource(coloredIconDrawable, false);\n                 \
      \   statusIcon.setTransitionType(StatusView.IconTransitionType.ROTATE);\n                    mStatusModel.set(StatusProperties.STATUS_VIEW_BACKGROUND,\
      \ mBackground);\n                    mStatusModel.set(\n                            StatusProperties.STATUS_VIEW_TOOLTIP_TEXT,\n\
      \                            R.string.accessibility_menu_info);\n                    mStatusModel.set(StatusProperties.STATUS_ICON_RESOURCE,\
      \ statusIcon);\n                });\n        mRenderTestRule.render(mStatusView, \"status_view_with_colored_icon\"\
      );\n    }"
  count: 1
