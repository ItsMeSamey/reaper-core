      \n    /** The width of the left side bar margin in px. */\n    WritableIntPropertyKey LEFT_SIDE_BAR_MARGIN_PX\
      \ = new WritableIntPropertyKey();\n\n    /** Whether the list encompasses the final set of suggestions\
