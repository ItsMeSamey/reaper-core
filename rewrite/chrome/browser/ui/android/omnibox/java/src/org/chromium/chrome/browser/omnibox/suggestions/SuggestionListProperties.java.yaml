      \ NAVIGATION_LISTENER =\n            new WritableObjectPropertyKey<>();\n\n    /** Whether the Omnibox\
      \ session is active and Suggestions may be shown. */\n    WritableBooleanPropertyKey OMNIBOX_SESSION_ACTIVE\
