substitutions:

# Lens Android production source closure; preserve ordinary image/toolbar/core APIs.
- description: "Lens production: retain nullable JNI factory with absent action"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ return\\ new\\ OmniboxLensOverlayAction\\(nativeInstance,\\ hint,\\ accessibilityHint\\);\\\n"
    replace: "        return null;\n"
  count: 1
