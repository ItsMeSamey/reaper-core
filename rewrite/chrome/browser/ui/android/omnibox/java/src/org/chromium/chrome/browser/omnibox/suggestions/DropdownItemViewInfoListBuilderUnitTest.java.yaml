      \ \ \ \ @Test\

      \ \ \ \ public\ void\ builder_propagatesOmniboxSessionStateChangeEvents\(\)\ \{\

      \ \ \ \ \ \ \ \ mBuilder\.onOmniboxSessionStateChange\(true\);\

      \ \ \ \ \ \ \ \ verify\(mMockSuggestionProcessor\)\.onOmniboxSessionStateChange\(eq\(true\)\);\

