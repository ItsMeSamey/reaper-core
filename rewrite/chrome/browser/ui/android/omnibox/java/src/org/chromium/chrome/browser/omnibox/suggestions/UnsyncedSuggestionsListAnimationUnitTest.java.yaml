      \        assertEquals(mListModel.get(SuggestionListProperties.ALPHA), 0.0f, MathUtils.EPSILON);\n\
      \        assertEquals(\n                mListModel.get(SuggestionListProperties.CHILD_TRANSLATION_Y),\n\
