substitutions:

# Lens test companions; preserve ordinary test classes and assertions.
- description: "Lens test companion: assert disabled nullable Lens factory without touching ordinary cases"
  regex:
    re_pattern: "\\ \\ \\ \\ \\}\\\n\\}\\\n"
    replace: "    }\n\n    @Test\n    public void omniboxLensOverlayActionDisabled() {\n        assertNull(\n                OmniboxActionFactory.buildOmniboxLensOverlayAction(\n                        0, \"hint\", \"accessibility\"));\n    }\n}\n"
  count: 1
