      \ \ \ \ public\ void\ setIncognitoColorsEnabled\(boolean\ incognitoColorsEnabled\)\ \{\

      \ \ \ \ \ \ \ \ mMediator\.setIncognitoColorsEnabled\(incognitoColorsEnabled\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ @see\ UrlBarMediator\#setAllowFocus\(boolean\)\

