      \ \ \ \ \ \*\ \ \ \ \ changed\ using\ \{@link\ \#setIncognitoColorsEnabled\(boolean\)\}\.\

      \ \ \ \ \ \*\ @param\ onLongClickListener\ The\ listener\ for\ long\ clicks\.\

