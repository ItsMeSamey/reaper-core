      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ @see\ UrlBarMediator\#setBrandedColorScheme\(int\)\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ void\ setBrandedColorScheme\(@BrandedColorScheme\ int\ brandedColorScheme\)\ \{\

