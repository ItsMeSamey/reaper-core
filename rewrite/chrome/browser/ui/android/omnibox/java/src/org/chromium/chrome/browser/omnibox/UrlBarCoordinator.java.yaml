      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Removes\ a\ listener\ for\ text\ wrapping\ changes\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ listener\ The\ listener\ to\ be\ removed\.\

      \ \ \ \ \ \*/\

