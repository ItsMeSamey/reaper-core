      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ String\ siteSearchLabel\)\ \{\

      \ \ \ \ \ \ \ \ mMediator\.setAutocompleteText\(userText,\ autocompleteText,\ additionalText,\ siteSearchLabel\);\

