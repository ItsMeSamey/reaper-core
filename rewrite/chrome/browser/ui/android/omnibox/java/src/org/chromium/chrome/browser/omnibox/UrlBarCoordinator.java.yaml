      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Constructs\ a\ coordinator\ for\ the\ given\ UrlBar\ view\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ context\ The\ current\ Android''s\ context\.\

      \ \ \ \ \ \*\ @param\ urlBar\ The\ \{@link\ UrlBar\}\ view\ this\ coordinator\ encapsulates\.\

      \ \ \ \ \ \*\ @param\ actionModeCallback\ Callback\ to\ handle\ changes\ in\ contextual\ action\
      Modes\.\

      \ \ \ \ \ \*\ @param\ focusChangeCallback\ The\ callback\ that\ will\ be\ notified\ when\ focus\
      changes\ on\ the\

      \ \ \ \ \ \*\ \ \ \ \ UrlBar\.\

      \ \ \ \ \ \*\ @param\ delegate\ The\ primary\ delegate\ for\ the\ UrlBar\ view\.\

      \ \ \ \ \ \*\ @param\ keyboardVisibilityDelegate\ Delegate\ that\ allows\ querying\ and\ changing\
