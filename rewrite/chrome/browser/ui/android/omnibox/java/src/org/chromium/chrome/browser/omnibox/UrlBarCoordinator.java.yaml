      \ \ \ \ \ \ \ \ mTextWrappedCallback\ =\ this::onTextWrappingChanged;\

      \

      \ \ \ \ \ \ \ \ mModel\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ PropertyModel\.Builder\(UrlBarProperties\.ALL_KEYS\)\

