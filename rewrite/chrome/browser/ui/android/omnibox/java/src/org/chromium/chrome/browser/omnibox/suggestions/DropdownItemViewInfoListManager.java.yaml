      \ \ \ \ \ \ \ \ \ \ \ \ model\.set\(SuggestionCommonProperties\.COLOR_SCHEME,\ brandedColorScheme\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

