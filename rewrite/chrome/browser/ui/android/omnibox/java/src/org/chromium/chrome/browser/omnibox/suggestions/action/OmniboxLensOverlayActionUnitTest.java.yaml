substitutions:

# Lens test companions; preserve ordinary test classes and assertions.
- description: "Lens test companion: remove implementation-only imports and mocks"
  regex:
    re_pattern: "import\\ static\\ org\\.junit\\.Assert\\.assertEquals;\\\nimport\\ static\\ org\\.junit\\.Assert\\.assertTrue;\\\nimport\\ static\\ org\\.mockito\\.Mockito\\.verify;\\\n\\\nimport\\ org\\.junit\\.Before;\\\nimport\\ org\\.junit\\.Rule;\\\nimport\\ org\\.junit\\.Test;\\\nimport\\ org\\.junit\\.runner\\.RunWith;\\\nimport\\ org\\.mockito\\.Mock;\\\nimport\\ org\\.mockito\\.junit\\.MockitoJUnit;\\\nimport\\ org\\.mockito\\.junit\\.MockitoRule;\\\nimport\\ org\\.mockito\\.quality\\.Strictness;\\\n\\\nimport\\ org\\.chromium\\.base\\.test\\.BaseRobolectricTestRunner;\\\nimport\\ org\\.chromium\\.components\\.omnibox\\.action\\.ActionPresentationMode;\\\nimport\\ org\\.chromium\\.components\\.omnibox\\.action\\.OmniboxActionDelegate;\\\nimport\\ org\\.chromium\\.components\\.omnibox\\.action\\.OmniboxActionId;\\\n\\\n"
    replace: "import static org.junit.Assert.assertNull;\n\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\n\nimport org.chromium.base.test.BaseRobolectricTestRunner;\n\n"
  count: 1
- description: "Lens test companion: document retained nullable API regression"
  regex:
    re_pattern: "/\\*\\*\\ Tests\\ for\\ \\{@link\\ OmniboxLensOverlayAction\\}\\.\\ \\*/"
    replace: "/** Tests that the disabled Lens action is absent from {@link OmniboxActionFactory}. */"
  count: 1
- description: "Lens test companion: replace removed-class construction and execution with nullable API contracts"
  regex:
    re_pattern: "\\ \\ \\ \\ @Rule\\\n\\ \\ \\ \\ public\\ final\\ MockitoRule\\ mMockitoRule\\ =\\ MockitoJUnit\\.rule\\(\\)\\.strictness\\(Strictness\\.STRICT_STUBS\\);\\\n\\\n\\ \\ \\ \\ @Mock\\ private\\ OmniboxActionDelegate\\ mGenericDelegate;\\\n\\\n\\ \\ \\ \\ private\\ OmniboxLensOverlayAction\\ mAction;\\\n\\\n\\ \\ \\ \\ @Before\\\n\\ \\ \\ \\ public\\ void\\ setUp\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mAction\\ =\\ new\\ OmniboxLensOverlayAction\\(12345L,\\ \"Ask\\ Google\",\\ \"Ask\\ Google\"\\);\\\n\\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ @Test\\\n\\ \\ \\ \\ public\\ void\\ testConstructor\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertEquals\\(OmniboxActionId\\.CONTEXTUAL_SEARCH_OPEN_LENS,\\ mAction\\.actionId\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertEquals\\(ActionPresentationMode\\.CHIP,\\ mAction\\.presentationMode\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertEquals\\(\"Ask\\ Google\",\\ mAction\\.hint\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertEquals\\(\"Ask\\ Google\",\\ mAction\\.accessibilityHint\\);\\\n\\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ @Test\\\n\\ \\ \\ \\ public\\ void\\ testExecute_success\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertTrue\\(mAction\\.execute\\(mGenericDelegate\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ verify\\(mGenericDelegate\\)\\.openLensOverlay\\(\\);\\\n\\ \\ \\ \\ \\}\\\n"
    replace: "    @Test\n    public void testFactoryRejectsNativeAction() {\n        assertNull(\n                OmniboxActionFactory.buildOmniboxLensOverlayAction(\n                        12345L, \"Ask Google\", \"Ask Google\"));\n    }\n\n    @Test\n    public void testFactoryHasNoActionBeforeNativeReady() {\n        assertNull(\n                OmniboxActionFactory.buildOmniboxLensOverlayAction(\n                        0, \"Ask Google\", \"Ask Google\"));\n    }\n"
  count: 1
