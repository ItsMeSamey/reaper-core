      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ if\ \(mTextChangeListener\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mTextChangeListener\.onResult\(text\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ if\ \(isInInputSession\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mSelection\ =\ mCurrentInput\.getSelection\(\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ updateShowHintText\(text\);\

      \ \ \ \ \}\

