      \ \ \ \ private\ void\ onTextChanged\(String\ text\)\ \{\

      \ \ \ \ \ \ \ \ //\ Keep\ mUrlBarData\ synchronized\ with\ user\-typed\ text\ during\ an\ active\
      input\ session\.\

      \ \ \ \ \ \ \ \ //\ This\ ensures\ mUrlBarData\ accurately\ reflects\ the\ current\ editor\ content\
      so\ that\

      \ \ \ \ \ \ \ \ //\ setUrlBarData\(\)\ can\ safely\ deduplicate\ redundant\ updates\ without\ incorrectly\
      dropping\

      \ \ \ \ \ \ \ \ //\ legitimate\ changes\ \(e\.g\.\ when\ tapping\ the\ Delete\ button\ to\ clear\
      typed\ text\)\.\

      \ \ \ \ \ \ \ \ if\ \(isInInputSession\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ UrlBarData\ typedData\ =\ UrlBarData\.forNonUrlText\(text\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!isNewTextEquivalentToExistingText\(mUrlBarData,\ typedData\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mUrlBarData\ =\ typedData;\

