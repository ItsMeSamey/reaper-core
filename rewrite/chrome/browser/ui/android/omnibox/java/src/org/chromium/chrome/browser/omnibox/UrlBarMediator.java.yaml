      the\ span\ types\

      \ \ \ \ \ \ \ \ //\ applied\ by\ our\ UI\.\

      \ \ \ \ \ \ \ \ return\ OmniboxViewUtil\.haveEquivalentSpans\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ existingCharSequence,\ newCharSequence,\ UrlEmphasisSpan\.class\);\

      \ \ \ \ \}\

