        \ \ \ \ public\ void\ testHandleKeyNavigationEventDelegateToFusebox\(\)\ \{\

        \ \ \ \ \ \ \ \ doReturn\(KeyEvent\.KEYCODE_TAB\)\.when\(mKeyEvent\)\.getKeyCode\(\);\

