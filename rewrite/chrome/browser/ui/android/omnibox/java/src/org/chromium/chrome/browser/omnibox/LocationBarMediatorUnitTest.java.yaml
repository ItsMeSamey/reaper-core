        \ \ \ \ \ \ \ \ assertTrue\(mMediator\.handleEscPress\(\)\);\

        \ \ \ \ \ \ \ \ mMediator\.onSuggestionsChanged\(null,\ /\*\ hasSuggestions=\ \*/\ false\);\

        \

        \ \ \ \ \ \ \ \ //\ 2nd\ ESC:\ defocus\.\

        \ \ \ \ \ \ \ \ assertTrue\(mMediator\.handleEscPress\(\)\);\

        \

        \ \ \ \ \ \ \ \ //\ Simulate\ scrim\ shown\ again\ \(user\ re\-interaction\)\.\

        \ \ \ \ \ \ \ \ mScrimVisibilitySupplier\.set\(true\);\

