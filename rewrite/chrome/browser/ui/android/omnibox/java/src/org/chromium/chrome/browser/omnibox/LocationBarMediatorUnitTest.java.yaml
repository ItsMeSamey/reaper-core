  - description: "Mark the existing keyword dispatch regression with explicit native provenance."
    regex:
      pattern: "new OmniboxLoadUrlParams.Builder(url, PageTransition.TYPED)\n                        .setOpenInNewTab(/* openInNewTab= */ true)"
      replace: "new OmniboxLoadUrlParams.Builder(url, PageTransition.KEYWORD)\n                        .setIsExtensionKeywordSuggestion(true)\n                        .setOpenInNewTab(/* openInNewTab= */ true)"

  - description: "Verify direct extension-page and stale-ID URLs use ordinary navigation."
    regex:
      pattern: "    @Test\n    public void testOnBackButtonClicked() {"
      replace: "    @Test\n    public void testLoadUrl_directExtensionPageUsesNormalNavigation() {\n        mMediator.onFinishNativeInitialization();\n        mProfileSupplier.set(mProfile);\n        ExtensionUi.setBackendForTesting(mExtensionUiBackend);\n        doReturn(mTab).when(mLocationBarDataProvider).getTab();\n        String url = \"chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/page.html\";\n        mMediator.loadUrl(new OmniboxLoadUrlParams.Builder(url, PageTransition.TYPED).build());\n        verify(mTab).loadUrl(mLoadUrlParamsCaptor.capture());\n        assertEquals(url, mLoadUrlParamsCaptor.getValue().getUrl());\n        verify(mExtensionUiBackend, never())\n                .onOmniboxExtensionInputEntered(any(), any(), anyBoolean(), anyBoolean());\n        ExtensionUi.setBackendForTesting(null);\n    }\n\n    @Test\n    public void testLoadUrl_directStaleCommandUrlUsesNormalNavigation() {\n        mMediator.onFinishNativeInitialization();\n        mProfileSupplier.set(mProfile);\n        ExtensionUi.setBackendForTesting(mExtensionUiBackend);\n        doReturn(mTab).when(mLocationBarDataProvider).getTab();\n        String url = \"chrome-extension://missing/?q=test\";\n        mMediator.loadUrl(new OmniboxLoadUrlParams.Builder(url, PageTransition.TYPED).build());\n        verify(mTab).loadUrl(mLoadUrlParamsCaptor.capture());\n        assertEquals(url, mLoadUrlParamsCaptor.getValue().getUrl());\n        verify(mExtensionUiBackend, never())\n                .onOmniboxExtensionInputEntered(any(), any(), anyBoolean(), anyBoolean());\n        ExtensionUi.setBackendForTesting(null);\n    }\n\n    @Test\n    public void testOnBackButtonClicked() {"

