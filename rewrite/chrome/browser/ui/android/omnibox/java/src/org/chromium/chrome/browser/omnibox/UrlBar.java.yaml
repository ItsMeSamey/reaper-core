      \ \ \ \ \ \*\ <p>This\ will\ null\ if:\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ <ul>\

      \ \ \ \ \ \*\ \ \ <li>The\ width\ constraints\ have\ changed\ since\ the\ hint\ was\ calculated\.\

      \ \ \ \ \ \*\ \ \ <li>The\ hint\ could\ not\ be\ correctly\ calculated\.\

      \ \ \ \ \ \*\ \ \ <li>The\ visible\ text\ is\ narrower\ than\ the\ viewport\.\

