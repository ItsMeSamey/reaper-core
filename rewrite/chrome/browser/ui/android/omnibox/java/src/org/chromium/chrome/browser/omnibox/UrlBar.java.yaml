      \ \ \ \ \ \ \ \ \ \ \ \ setTextDirection\(TEXT_DIRECTION_INHERIT\);\

      \ \ \ \ \ \ \ \ \ \ \ \ setTextAlignment\(TEXT_ALIGNMENT_VIEW_START\);\

      \ \ \ \ \ \ \ \ \}\ else\ if\ \(mFocused\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ Always\ input\-specific\ text\ direction\

      \ \ \ \ \ \ \ \ \ \ \ \ setTextDirection\(TEXT_DIRECTION_INHERIT\);\

      \ \ \ \ \ \ \ \ \ \ \ \ setTextAlignment\(TEXT_ALIGNMENT_TEXT_START\);\

