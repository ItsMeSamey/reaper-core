      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Return\ a\ hint\ of\ the\ currently\ visible\ text\ displayed\ on\ screen\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ <p>The\ hint\ represents\ the\ substring\ of\ the\ full\ text\ from\ the\ first\ character\
      to\ the\ last\

      \ \ \ \ \ \*\ visible\ character\ displayed\ on\ screen\.\ Depending\ on\ the\ length\ of\ this\
      prefix,\ not\ all\ of\ the\

      \ \ \ \ \ \*\ characters\ will\ e\ displayed\ on\ screen\.\

