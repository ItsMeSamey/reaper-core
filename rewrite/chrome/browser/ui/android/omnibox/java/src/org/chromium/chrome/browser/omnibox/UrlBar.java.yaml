      \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ The\ Omnibox\ was\ was\ activated\ programmatically\ \(e\.g\.\ on\ LFF\
      devices\ with\ hardware\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ keyboard\ attached\)\.\ Now,\ the\ user\ has\ explicitly\ clicked/touched\
      the\ UrlBar\.\

      \ \ \ \ \ \ \ \ \ \ \ \ mUrlBarDelegate\.onTouchAfterFocus\(\);\

      \ \ \ \ \ \ \ \ \}\

