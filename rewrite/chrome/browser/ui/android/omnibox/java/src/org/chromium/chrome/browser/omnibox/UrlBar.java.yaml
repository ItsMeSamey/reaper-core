      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ If\ the\ direction\ of\ the\ URL\ has\ changed,\ update\ mUrlDirection\ and\ notify\
      the\

      \ \ \ \ \ \*\ UrlDirectionListeners\.\

