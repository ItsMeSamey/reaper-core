      \ \ \ \ \ \ \ \ int\ urlDirection;\

      \ \ \ \ \ \ \ \ if\ \(length\(\)\ ==\ 0\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ urlDirection\ =\ LAYOUT_DIRECTION_LOCALE;\

