      \ \ \ \ \ \ \ \ \ \ \ \ int\ cutoffWidth\ =\ Math\.max\(0,\ measuredWidth\ \-\ ellipsisWidth\);\

      \ \ \ \ \ \ \ \ \ \ \ \ int\ finalVisibleCharIndex\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ textLayout\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.getPaint\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.getOffsetForAdvance\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ text,\ 0,\ textLength,\
      0,\ textLength,\ false,\ cutoffWidth\);\

