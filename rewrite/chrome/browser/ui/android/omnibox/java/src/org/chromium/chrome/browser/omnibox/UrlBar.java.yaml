      \ \ \ \ private\ void\ clearBoundsEllipsisSpans\(Editable\ text\)\ \{\

      \ \ \ \ \ \ \ \ int\ textLength\ =\ text\.length\(\);\

      \ \ \ \ \ \ \ \ BoundsEllipsisSpan\[\]\ spans\ =\ text\.getSpans\(0,\ textLength,\ BoundsEllipsisSpan\.class\);\

