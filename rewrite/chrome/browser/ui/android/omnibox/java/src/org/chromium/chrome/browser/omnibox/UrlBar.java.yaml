      \ \ \ \ private\ int\ getVisibleMeasuredViewportWidth\(\)\ \{\

      \ \ \ \ \ \ \ \ return\ getMeasuredWidth\(\)\ \-\ \(getPaddingLeft\(\)\ \+\ getPaddingRight\(\)\);\

      \ \ \ \ \}\

