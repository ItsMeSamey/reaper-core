      \ \ \ \ \ \ \ \ \ \ \ \ BoundsEllipsisSpan\[\]\ spans\ =\ text\.getSpans\(0,\ textLength,\ BoundsEllipsisSpan\.class\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(finalVisibleCharIndex\ <\ textLength\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(spans\ !=\ null\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ spans\.length\ ==\ 1\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ text\.getSpanStart\(spans\[0\]\)\ ==\ finalVisibleCharIndex\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ text\.getSpanEnd\(spans\[0\]\)\ ==\ textLength\)\
      \{\

