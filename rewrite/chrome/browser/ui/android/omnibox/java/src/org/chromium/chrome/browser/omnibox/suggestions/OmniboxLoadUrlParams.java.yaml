substitutions:

  - description: "Carry selected keyword provenance into the URL-loading boundary."
    regex:
      pattern: "    public final String url;"
      replace: "    public final String url;\n    public final boolean isExtensionKeywordSuggestion;"

  - description: "Accept command provenance in the immutable load parameters."
    regex:
      pattern: "            @Nullable AutocompleteLoadCallback callback) {"
      replace: "            @Nullable AutocompleteLoadCallback callback,\n            boolean isExtensionKeywordSuggestion) {"

  - description: "Store explicit provenance independently of the URL."
    regex:
      pattern: "        this.url = url;\n        this.transitionType = transitionType;\n        this.inputStartTimestamp"
      replace: "        this.url = url;\n        this.isExtensionKeywordSuggestion = isExtensionKeywordSuggestion;\n        this.transitionType = transitionType;\n        this.inputStartTimestamp"

  - description: "Default arbitrary URL loads to normal navigation."
    regex:
      pattern: "        public String url;"
      replace: "        public String url;\n        private boolean mIsExtensionKeywordSuggestion;"

  - description: "Allow the autocomplete selection path to set known command provenance."
    regex:
      pattern: "        /** Builds the OmniboxLoadUrlParams. */"
      replace: "        /** Marks a load produced by a selected native extension keyword suggestion. */\n        public Builder setIsExtensionKeywordSuggestion(boolean isExtensionKeywordSuggestion) {\n            mIsExtensionKeywordSuggestion = isExtensionKeywordSuggestion;\n            return this;\n        }\n\n        /** Builds the OmniboxLoadUrlParams. */"

  - description: "Preserve provenance when building load parameters."
    regex:
      pattern: "                    callback);"
      replace: "                    callback,\n                    mIsExtensionKeywordSuggestion);"
