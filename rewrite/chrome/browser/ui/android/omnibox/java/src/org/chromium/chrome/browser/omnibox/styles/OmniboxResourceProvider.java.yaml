      \ \ \ \ \ \ \ \ return\ brandedColorScheme\ ==\ BrandedColorScheme\.INCOGNITO\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ context\.getColor\(R\.color\.toolbar_text_box_background_incognito\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ context\.getColor\(R\.color\.toolbar_text_box_bg_color\);\

      \ \ \ \ \}\

