      \ \ \ \ \ \*\ @return\ Primary\ url\ bar\ text\ color\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ static\ @ColorInt\ int\ getUrlBarPrimaryTextColor\(\

      \ \ \ \ \ \ \ \ \ \ \ \ Context\ context,\ @BrandedColorScheme\ int\ brandedColorScheme\)\ \{\

