  - description: "Dispatch only selected extension keyword suggestions; direct extension pages navigate normally."
    regex:
      pattern: "        if (url != null && url.startsWith(UrlConstants.CHROME_EXTENSION_SCHEME + \"://\")) {"
      replace: "        if (omniboxLoadUrlParams.isExtensionKeywordSuggestion\n                && url != null\n                && url.startsWith(UrlConstants.CHROME_EXTENSION_SCHEME + \"://\")) {"

