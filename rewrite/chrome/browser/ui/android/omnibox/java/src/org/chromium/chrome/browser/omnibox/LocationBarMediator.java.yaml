        \ \ \ \ \ \ \ \ TextSelection\ selection\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ TextSelection\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mUrlCoordinator\.getSelectionStart\(\),\ mUrlCoordinator\.getSelectionEnd\(\)\);\

        \ \ \ \ \ \ \ \ mCurrentInput\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setUserText\(text,\ selection\)\

