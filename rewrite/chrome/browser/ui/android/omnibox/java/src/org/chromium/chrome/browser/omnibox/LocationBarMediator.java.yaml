        \ \ \ \ \ \ \ \ \ \ \ \ //\ The\ code\ of\ the\ rest\ of\ this\ class\ ensures\ that\ this\ can''t\
        be\ called\ until\ the\ native\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ side\ is\ initialized\

