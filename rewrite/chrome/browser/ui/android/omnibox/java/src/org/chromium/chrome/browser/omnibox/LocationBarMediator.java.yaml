        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ siteSearchLabel\ =\ mCurrentInput\.getSiteSearchData\(\)\.fullName;\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ if\ \(defaultMatch\ !=\ null\ \&\&\ defaultMatch\.getAssociatedKeyword\(\)\
        !=\ null\)\ \{\

