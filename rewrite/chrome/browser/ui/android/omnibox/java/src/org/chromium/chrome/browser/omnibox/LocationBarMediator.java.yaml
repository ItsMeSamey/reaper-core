        :\ null,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ defaultMatch\ !=\ null\ \?\ defaultMatch\.getAdditionalText\(\)\
        :\ null,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ siteSearchLabel\);\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ //\ Handle\ the\ case\ where\ suggestions\ \(in\ particular\ zero\ suggest\)\ are\
        received\ without\ the\

        \ \ \ \ \ \ \ \ //\ URL\ focusing\ happening\.\

