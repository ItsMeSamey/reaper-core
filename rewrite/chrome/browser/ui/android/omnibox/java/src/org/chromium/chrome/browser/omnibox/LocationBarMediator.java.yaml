        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(templateUrlService\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ siteSearchLabel\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ templateUrlService\.getFullNameFromTemplateUrl\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ defaultMatch\.getAssociatedKeyword\(\)\);\

