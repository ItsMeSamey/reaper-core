        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assertNonNull\(mProfileSupplier\.get\(\)\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mTemplateUrlServiceSupplier\.get\(\)\)\);\

        \ \ \ \ \ \ \ \ \}\

