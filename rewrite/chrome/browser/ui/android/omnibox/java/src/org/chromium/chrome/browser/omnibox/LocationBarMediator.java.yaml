        \ \ \ \ @Override\

        \ \ \ \ public\ void\ onAttachmentListChanged\(\)\ \{\

        \ \ \ \ \ \ \ \ //\ When\ attachments\ are\ added\ to\ the\ Fusebox\ \(e\.g\.\ attaching\ a\ tab\
        from\ the\ tab\ picker\),\

        \ \ \ \ \ \ \ \ //\ promote\ to\ SUGGESTIONS\ so\ the\ Fusebox\ expands\ to\ show\ the\ attachment\
        shelf\.\ In\ Incognito\

        \ \ \ \ \ \ \ \ //\ mode,\ AI\ mode\ autocomplete\ is\ disabled,\ so\ onSuggestionsChanged\(\)\
        is\ never\ called\ and\

        \ \ \ \ \ \ \ \ //\ the\ Omnibox\ would\ otherwise\ remain\ stuck\ in\ DRAFTING\.\

        \ \ \ \ \ \ \ \ //\

        \ \ \ \ \ \ \ \ //\ Note:\ This\ is\ fragile\.\ It\ relies\ on\ onAttachmentListChanged\(\)\ never\
        being\ triggered\

        \ \ \ \ \ \ \ \ //\ during\ beginInput\(\)\ \(e\.g\.\ via\ setAttachmentModelList\(\)\ when\ switching\
        tabs\ or\

        \ \ \ \ \ \ \ \ //\ initializing\ sessions\)\.\ If\ this\ signal\ were\ triggered\ on\ beginInput,\
        it\ would\

        \ \ \ \ \ \ \ \ //\ prematurely\ promote\ the\ display\ state\ to\ SUGGESTIONS\.\

        \ \ \ \ \ \ \ \ //\ TODO\(b/555311270\):\ Decouple\ attachment\ shelf\ expansion\ from\ onAttachmentListChanged\.\

        \ \ \ \ \ \ \ \ if\ \(mCurrentInput\ !=\ null\ \&\&\ fuseboxHasAttachments\(\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mCurrentInput\.setDisplayState\(DisplayState\.SUGGESTIONS\);\

