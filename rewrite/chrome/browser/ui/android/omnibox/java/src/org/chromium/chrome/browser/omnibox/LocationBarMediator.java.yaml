        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ loadUrlParams,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabLaunchType\.FROM_OMNIBOX,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ currentTab,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ currentTab\.isIncognito\(\)\);\

