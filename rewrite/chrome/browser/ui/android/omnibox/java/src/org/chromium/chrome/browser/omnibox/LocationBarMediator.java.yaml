        \ \ \ \ \ \*\ Handle\ and\ run\ any\ necessary\ animations\ that\ are\ triggered\ off\ focusing\
        the\ UrlBar\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ hasFocus\ Whether\ focus\ was\ gained\.\

        \ \ \ \ \ \*/\

        \ \ \ \ @VisibleForTesting\

        \ \ \ \ /\*\ package\ \*/\ void\ handleUrlFocusAnimation\(boolean\ hasFocus\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(hasFocus\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mUrlFocusedWithoutAnimations\ =\ false;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ //\ Propagate\ signals\ to\ AutocompleteCoordinator\ ahead\ of\ everyone\ else\.\

        \ \ \ \ \ \ \ \ //\ Autocomplete\ requires\ certain\ signals,\ such\ as\ AutocompleteRequestType\

        \ \ \ \ \ \ \ \ //\ and\ PageClassification\ to\ be\ correct\ throughout\ from\ the\ moment\ the\
        focus\

        \ \ \ \ \ \ \ \ //\ is\ gained\ to\ the\ moment\ the\ focus\ is\ lost\.\

        \ \ \ \ \ \ \ \ //\

        \ \ \ \ \ \ \ \ //\ This\ call\ is\ permitted\ to\ happen\ before\ anyone\ else\ is\ activated,\
        and\

        \ \ \ \ \ \ \ \ //\ must\ be\ called\ before\ everyone\ else\ cleans\ up\.\

        \ \ \ \ \ \ \ \ if\ \(hasFocus\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ Session\ may\ be\ pre\-focused\ from\ the\ NTP\.\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(mCurrentInput\ ==\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ beginOrResumeInput\(/\*\ activateNewSession=\ \*/\ true\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ TODO\(b/548102274\):\ See\ about\ removing\ this\ special\ casing\ for\
        the\ DisplayState\.\ I\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ think\ we\ should\ aim\ to\ remove\ all\ end/begin/suspend\ calls\ from\
        the\ focus\ sequence,\

