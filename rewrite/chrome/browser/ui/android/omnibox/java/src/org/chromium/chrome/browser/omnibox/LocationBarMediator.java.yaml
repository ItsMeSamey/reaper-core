        \ \ \ \ \ \ \ \ set\.connect\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.id\.fusebox_plus_button,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ConstraintSet\.TOP,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mDropdown\.getId\(\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ConstraintSet\.BOTTOM\);\

        \ \ \ \ \ \ \ \ set\.connect\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.id\.fusebox_request_type,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ConstraintSet\.TOP,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mDropdown\.getId\(\),\

