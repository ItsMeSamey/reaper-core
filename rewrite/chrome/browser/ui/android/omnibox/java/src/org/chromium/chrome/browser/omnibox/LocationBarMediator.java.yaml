        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Ensure\ the\ URL\ bar\ loses\ focus\ if\ the\ tab\ it\ was\
        interacting\ with\ is\ changed\ from\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ underneath\ it\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ endInput\(\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Place\ the\ cursor\ in\ the\ Omnibox\ if\ applicable\.\ \ We\
        always\ clear\ the\ focus\ above\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ to\ ensure\ the\ shield\ placed\ over\ the\ content\ is\ dismissed\
        when\ switching\ tabs\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ But\ if\ needed,\ we\ will\ refocus\ the\ omnibox\ and\ make\
        the\ cursor\ visible\ here\.\

