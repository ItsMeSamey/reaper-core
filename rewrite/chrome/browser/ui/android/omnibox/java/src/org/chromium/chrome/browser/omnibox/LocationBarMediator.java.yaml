        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Determines\ whether\ site\-search\ should\ be\ triggered\ based\ on\ the\ current\
        text\ change\.\

        \ \ \ \ \ \*\ Expression\ triggers\ if\ a\ single\ space\ character\ was\ introduced\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ <p>Note\ that\ this\ is\ an\ initial\ check\.\ The\ AutocompleteCoordinator\ will\
        perform\ a\ more\

        \ \ \ \ \ \*\ thorough\ check\ to\ determine\ if\ site\-search\ should\ be\ triggered\ based\ on\
        whether\ the\ keyword\

        \ \ \ \ \ \*\ is\ valid\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ info\ Information\ about\ the\ text\ change\.\

        \ \ \ \ \ \*\ @return\ True\ if\ site\-search\ should\ be\ triggered,\ false\ otherwise\.\

        \ \ \ \ \ \*/\

        \ \ \ \ @VisibleForTesting\

        \ \ \ \ /\*\ package\ \*/\ boolean\ shouldTriggerSiteSearch\(UrlBarTextChangeInfo\ info\)\ \{\

        \

        \ \ \ \ \ \ \ \ if\ \(info\.isDelete\(\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ Deletions\ should\ never\ trigger\ site\-search\.\ This\ helps\ avoid\
        accidentally\ activating\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ site\-search\ when\ the\ user\ is\ trying\ to\ delete\ text\.\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ String\ text\ =\ info\.getText\(\);\

        \

        \ \ \ \ \ \ \ \ if\ \(text\.startsWith\("\ "\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ Don''t\ trigger\ site\ search\ if\ leading\ by\ spaces\.\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ //\ Check\ if\ a\ single\ space\ character\ was\ added\ \(either\ by\ pure\ insertion\
        or\ by\ replacing\

        \ \ \ \ \ \ \ \ //\ selection\ with\ a\ single\ space\)\.\

        \ \ \ \ \ \ \ \ //\ This\ is\ the\ primary\ condition\ for\ site\-search\ activation\.\

        \ \ \ \ \ \ \ \ boolean\ singleSpaceAdded\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ info\.getAfter\(\)\ ==\ 1\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ info\.getStart\(\)\ <\ text\.length\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ text\.charAt\(info\.getStart\(\)\)\ ==\ ''\
        '';\

        \ \ \ \ \ \ \ \ if\ \(!singleSpaceAdded\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ String\ textBeforeSpace\ =\ text\.substring\(0,\ info\.getStart\(\)\);\

        \ \ \ \ \ \ \ \ if\ \(textBeforeSpace\.trim\(\)\.isEmpty\(\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ No\ valid\ text\ before\ space\ \(e\.g\.\ space\ as\ first\ character,\
        or\ consecutive\ spaces\)\.\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ if\ \(textBeforeSpace\.contains\("\ "\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ Multiple\ words\ before\ space\.\ We\ only\ trigger\ site\ search\ if\
        the\ user\ typed\ a\ space\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ after\ a\ single\ word\ \(e\.g\.\ keywords\ \+\ space\)\.\ If\ there\
        are\ multiple\ words,\ it\ is\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ likely\ a\ normal\ query\.\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ return\ true;\

        \ \ \ \ \}\

