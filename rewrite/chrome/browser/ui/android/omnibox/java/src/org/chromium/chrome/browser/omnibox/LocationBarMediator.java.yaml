        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ mCurrentInput\.getDisplayState\(\)\ ==\ DisplayState\.DRAFTING\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ mSelectionController\.getSelectedView\(\)\
        ==\ mUrlBarSelectableView\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ mWindowHasFocusSupplier\.get\(\);\

