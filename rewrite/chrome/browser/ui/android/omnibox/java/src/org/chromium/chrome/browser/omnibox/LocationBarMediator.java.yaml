        \ \ \ \ \ \ \ \ input\.getSiteSearchDataSupplier\(\)\.removeObserver\(mSiteSearchDataObserver\);\

        \ \ \ \ \ \ \ \ input\.getPreviewMatchUrlSupplier\(\)\.removeObserver\(mPreviewMatchUrlObserver\);\

        \ \ \ \ \}\

