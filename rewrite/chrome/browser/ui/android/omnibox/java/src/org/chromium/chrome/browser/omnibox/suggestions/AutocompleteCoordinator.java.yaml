      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ mMediator\.beginInput\(session\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Navigate\ using\ the\ current\ typed\ omnibox\ text\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ eventTime\ The\ timestamp\ when\ the\ navigation\ was\ triggered\ \(e\.g\.,\
      uptimeMillis\)\.\

      \ \ \ \ \ \*\ @param\ target\ The\ target\ destination\ for\ the\ navigation\ \(current\ tab,\ new\
      tab,\ new\ window\)\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ void\ loadTypedOmniboxText\(long\ eventTime,\ @NavigationTarget\ int\ target\)\
      \{\

