      \ \ \ \ @Override\

      \ \ \ \ public\ void\ showPermissionIcon\(PermissionIconResource\ icon\)\ \{\

      \ \ \ \ \ \ \ \ mModel\.set\(StatusProperties\.STATUS_ICON_RESOURCE,\ icon\);\

      \ \ \ \ \ \ \ \ mModel\.set\(StatusProperties\.STATUS_ICON_DESCRIPTION_RES,\ icon\.getContentDescriptionRes\(\)\);\

