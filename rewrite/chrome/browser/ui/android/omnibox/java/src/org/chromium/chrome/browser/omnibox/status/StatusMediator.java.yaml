      \ \ \ \ \ \ \ \ SiteSearchData\ siteSearchData\ =\ mSiteSearchDataSupplier\.get\(\);\

      \ \ \ \ \ \ \ \ TemplateUrlService\ turlService\ =\ mTemplateUrlServiceSupplier\.get\(\);\

      \ \ \ \ \ \ \ \ if\ \(siteSearchData\ ==\ null\ \|\|\ turlService\ ==\ null\)\ return\ null;\

