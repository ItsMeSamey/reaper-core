      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.isIncognitoNewTabPageCurrentlyVisible\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ \(mLocationBarDataProvider\.isIncognitoBranded\(\)\

