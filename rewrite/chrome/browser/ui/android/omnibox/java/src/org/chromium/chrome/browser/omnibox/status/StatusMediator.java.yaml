      \ \ \ \ private\ void\ updateStatusViewMinWidth\(\)\ \{\

      \ \ \ \ \ \ \ \ //\ Don''t\ use\ isNtpVisible\(\)\ here\ \-\-\ it\ reports\ NTP\ visibility\ when\
      navigation\ is\ already\

      \ \ \ \ \ \ \ \ //\ underway,\ making\ the\ onUrlChanged\ fail\ to\ detect\ the\ user\ is\ navigating\
      out\ of\ the\ NTP\.\

      \ \ \ \ \ \ \ \ var\ url\ =\ mLocationBarDataProvider\.getCurrentGurl\(\);\

      \ \ \ \ \ \ \ \ boolean\ isRegularNtpUrl\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ OmniboxUrlUtils\.isNtpUrl\(url\)\ \&\&\ !mLocationBarDataProvider\.isIncognitoBranded\(\);\

      \

      \ \ \ \ \ \ \ \ @PageClassification\

      \ \ \ \ \ \ \ \ int\ pageClassification\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mLocationBarDataProvider\.getPageClassification\(/\*\ prefetch=\
      \*/\ false\);\

      \ \ \ \ \ \ \ \ boolean\ useWideStatusIcon\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PageClassificationUtils\.isHubOrTabSearch\(pageClassification\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ mUrlHasFocus\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ isRegularNtpUrl;\

      \ \ \ \ \ \ \ \ mModel\.set\(StatusProperties\.USE_WIDE_STATUS_ICON,\ useWideStatusIcon\);\

      \ \ \ \ \}\

