        \ \ \ \ //\ Observer\ watching\ for\ changes\ to\ the\ visual\ state\ of\ the\ omnibox\ suggestions\.\

        \ \ \ \ private\ @Nullable\ OmniboxSuggestionsVisualStateObserver\ mOmniboxSuggestionsVisualStateObserver;\

