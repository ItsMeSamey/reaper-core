        \ \ \ \ public\ void\ showDeleteDialog\(\

        \ \ \ \ \ \ \ \ \ \ \ \ AutocompleteMatch\ suggestion,\ String\ titleText,\ Runnable\ deleteAction\)\
        \{\

        \ \ \ \ \ \ \ \ RecordUserAction\.record\("MobileOmniboxDeleteGesture"\);\

        \

        \ \ \ \ \ \ \ \ //\ Prevent\ updates\ to\ the\ shown\ omnibox\ suggestions\ list\ while\ the\ dialog\
        is\ open\.\

        \ \ \ \ \ \ \ \ //\ Each\ update\ invalidates\ previous\ result\ set,\ making\ it\ impossible\ to\
        perform\ the\ delete\

        \ \ \ \ \ \ \ \ //\ action\ \(there\ is\ no\ native\ match\ to\ delete\)\.\ Calling\ `stopAutocomplete\(\)`\
        here\ will\

        \ \ \ \ \ \ \ \ //\ ensure\ that\ suggestions\ don''t\ change\ the\ moment\ the\ User\ is\ presented\
        with\ the\ dialog,\

        \ \ \ \ \ \ \ \ //\ allowing\ us\ to\ complete\ the\ deletion\.\

        \ \ \ \ \ \ \ \ stopAutocomplete\(AutocompleteStopReason\.INTERACTION\);\

        \ \ \ \ \ \ \ \ if\ \(!suggestion\.isDeletable\(\)\)\ return;\

        \ \ \ \ \ \ \ \ //\ Do\ not\ attempt\ to\ delete\ matches\ that\ have\ been\ detached\ from\ their\
        native\ counterpart\.\

        \ \ \ \ \ \ \ \ //\ These\ matches\ likely\ come\ from\ cache,\ or\ the\ delete\ request\ came\
        for\ a\ previous\ set\ of\

        \ \ \ \ \ \ \ \ //\ matches\.\

        \ \ \ \ \ \ \ \ if\ \(suggestion\.getNativeObjectRef\(\)\ ==\ 0\)\ return;\

        \

        \ \ \ \ \ \ \ \ ModalDialogManager\ manager\ =\ mModalDialogManagerSupplier\.get\(\);\

        \ \ \ \ \ \ \ \ if\ \(manager\ ==\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ assert\ false\ :\ "No\ modal\ dialog\ manager\ registered\ for\ this\ activity\.";\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ ModalDialogProperties\.Controller\ dialogController\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ ModalDialogProperties\.Controller\(\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ onClick\(PropertyModel\ model,\ int\ buttonType\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(buttonType\ ==\ ModalDialogProperties\.ButtonType\.POSITIVE\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ RecordUserAction\.record\("MobileOmniboxDeleteRequested"\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ deleteAction\.run\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ manager\.dismissDialog\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ model,\ DialogDismissalCause\.POSITIVE_BUTTON_CLICKED\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ if\ \(buttonType\ ==\ ModalDialogProperties\.ButtonType\.NEGATIVE\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ manager\.dismissDialog\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ model,\ DialogDismissalCause\.NEGATIVE_BUTTON_CLICKED\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ @Override\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ void\ onDismiss\(PropertyModel\ model,\ int\ dismissalCause\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mDeleteDialogModel\ =\ null;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \};\

        \

        \ \ \ \ \ \ \ \ @StringRes\ int\ dialogMessageId\ =\ R\.string\.omnibox_confirm_delete;\

        \ \ \ \ \ \ \ \ if\ \(isSuggestionFromClipboard\(suggestion\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ dialogMessageId\ =\ R\.string\.omnibox_confirm_delete_from_clipboard;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ mDeleteDialogModel\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ PropertyModel\.Builder\(ModalDialogProperties\.ALL_KEYS\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(ModalDialogProperties\.CONTROLLER,\ dialogController\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(ModalDialogProperties\.TITLE,\ titleText\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(ModalDialogProperties\.TITLE_MAX_LINES,\
        1\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ModalDialogProperties\.MESSAGE_PARAGRAPH_1,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mResourceProvider\.getString\(dialogMessageId\)\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ModalDialogProperties\.POSITIVE_BUTTON_TEXT,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mResourceProvider\.getString\(R\.string\.ok\)\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ModalDialogProperties\.NEGATIVE_BUTTON_TEXT,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mResourceProvider\.getString\(R\.string\.cancel\)\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(ModalDialogProperties\.CANCEL_ON_TOUCH_OUTSIDE,\
        true\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.build\(\);\

        \

        \ \ \ \ \ \ \ \ manager\.showDialog\(mDeleteDialogModel,\ ModalDialogManager\.ModalDialogType\.APP\);\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

