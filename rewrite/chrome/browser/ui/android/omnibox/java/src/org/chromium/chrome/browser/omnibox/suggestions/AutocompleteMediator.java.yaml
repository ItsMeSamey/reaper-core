        \ \ \ \ private\ void\ finishLoadUrlForOmniboxMatch\(\

        \ \ \ \ \ \ \ \ \ \ \ \ AutocompleteMatch\ suggestion,\

        \ \ \ \ \ \ \ \ \ \ \ \ GURL\ url,\

        \ \ \ \ \ \ \ \ \ \ \ \ long\ inputStart,\

        \ \ \ \ \ \ \ \ \ \ \ \ boolean\ openInNewTab,\

        \ \ \ \ \ \ \ \ \ \ \ \ boolean\ openInNewWindow,\

        \ \ \ \ \ \ \ \ \ \ \ \ int\ transition\)\ \{\

        \ \ \ \ \ \ \ \ try\ \(TraceEvent\ e\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TraceEvent\.scoped\("AutocompleteMediator\.finishLoadUrlForOmniboxMatch"\)\)\
        \{\

