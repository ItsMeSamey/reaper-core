        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Loads\ the\ specified\ omnibox\ suggestion\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ matchIndex\ The\ position\ of\ the\ selected\ omnibox\ suggestion\.\

        \ \ \ \ \ \*\ @param\ suggestion\ The\ suggestion\ selected\.\

        \ \ \ \ \ \*\ @param\ url\ The\ URL\ to\ load\.\

        \ \ \ \ \ \*\ @param\ inputStart\ The\ timestamp\ the\ input\ was\ started\.\

        \ \ \ \ \ \*\ @param\ openInNewTab\ Whether\ the\ suggestion\ will\ be\ loaded\ in\ a\ new\ tab\.\
        If\ \{@code\ true\},\ the\

        \ \ \ \ \ \*\ \ \ \ \ suggestion\ will\ be\ loaded\ in\ a\ new\ tab\.\ If\ \{@code\ false\},\ the\
        suggestion\ will\ be\ loaded\

        \ \ \ \ \ \*\ \ \ \ \ in\ the\ current\ tab\.\

        \ \ \ \ \ \*\ @param\ openInNewWindow\ Whether\ the\ URL\ will\ be\ loaded\ in\ a\ new\ window\.\
        If\ \{@code\ true\},\ the\

        \ \ \ \ \ \*\ \ \ \ \ URL\ will\ be\ loaded\ in\ a\ new\ window\.\ If\ \{@code\ false\},\ The\ URL\
        will\ be\ loaded\ in\ the\

        \ \ \ \ \ \*\ \ \ \ \ current\ window\.\

        \ \ \ \ \ \*/\

        \ \ \ \ @VisibleForTesting\

        \ \ \ \ /\*\ package\ \*/\ void\ loadUrlForOmniboxMatch\(\

        \ \ \ \ \ \ \ \ \ \ \ \ int\ matchIndex,\

        \ \ \ \ \ \ \ \ \ \ \ \ AutocompleteMatch\ suggestion,\

        \ \ \ \ \ \ \ \ \ \ \ \ GURL\ url,\

        \ \ \ \ \ \ \ \ \ \ \ \ long\ inputStart,\

        \ \ \ \ \ \ \ \ \ \ \ \ boolean\ openInNewTab,\

        \ \ \ \ \ \ \ \ \ \ \ \ boolean\ openInNewWindow\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(!isInInputSession\(\)\)\ return;\

        \

        \ \ \ \ \ \ \ \ try\ \(TraceEvent\ e\ =\ TraceEvent\.scoped\("AutocompleteMediator\.loadUrlFromOmniboxMatch"\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ OmniboxMetrics\.recordFocusToOpenTime\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ System\.currentTimeMillis\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \-\ assumeNonNull\(mAutocompleteInput\)\.getUrlFocusTime\(\)\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ mOmniboxFocusResultedInNavigation\ =\ true;\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ url\ =\ updateSuggestionUrlIfNeeded\(suggestion,\ url\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ //\ loadUrl\ modifies\ AutocompleteController''s\ state\ clearing\ the\
        native\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ AutocompleteResults\ needed\ by\ onSuggestionsSelected\.\ Therefore,\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ loadUrl\ should\ should\ be\ invoked\ last\.\

        \ \ \ \ \ \ \ \ \ \ \ \ int\ transition\ =\ suggestion\.getTransition\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ int\ type\ =\ suggestion\.getType\(\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ recordMetrics\(suggestion,\ null,\ matchIndex,\ WindowOpenDisposition\.CURRENT_TAB\);\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(type\ ==\ OmniboxSuggestionType\.URL_WHAT_YOU_TYPED\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ mUrlBarEditingTextProvider\.wasLastEditPaste\(\)\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ It''s\ important\ to\ use\ the\ page\ transition\ from\ the\
        suggestion\ or\ we\ might\ end\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ up\ saving\ generated\ URLs\ as\ typed\ URLs,\ which\ would\
        then\ pollute\ the\ subsequent\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ omnibox\ results\.\ There\ is\ one\ special\ case\ where\ the\
        suggestion\ text\ was\ pasted,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ where\ we\ want\ the\ transition\ type\ to\ be\ LINK\.\

        \

