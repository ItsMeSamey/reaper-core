        suggestions\ and\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ remove\ inline\ autocompletion\ from\ the\ URL\ bar\.\

        \ \ \ \ \ \ \ \ \ \ \ \ showSuggestions\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mAutocompleteInput,\ AutocompleteResult\.EMPTY_RESULT,\
        /\*\ isFinal=\ \*/\ true\);\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ //\ Always\ re\-set\ the\ list''s\ final\ state\ when\ we''re\ about\ to\ request\
        new\ suggestions\.\

        \ \ \ \ \ \ \ \ //\ This\ avoids\ a\ problem,\ where\ the\ property\ does\ not\ get\ an\ explicit\
        update\ that\ the\ list\

        \ \ \ \ \ \ \ \ //\ is\ final,\ which,\ in\ turn,\ may\ suppress\ certain\ functionality\ from\
        getting\ invoked\ if\ the\

        \ \ \ \ \ \ \ \ //\ subsequent\ push\ is\ immediately\ `final`\.\

