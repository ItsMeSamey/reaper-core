        \ \ \ \ private\ String\ stripKeywordIfNecessary\(String\ text\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(mAutocompleteInput\ ==\ null\ \|\|\ mAutocompleteInput\.getSiteSearchData\(\)\
        ==\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ text;\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ String\ keywordPrefix\ =\ mAutocompleteInput\.getSiteSearchData\(\)\.keyword\ \+\
        "\ ";\

        \ \ \ \ \ \ \ \ return\ text\.startsWith\(keywordPrefix\)\ \?\ text\.substring\(keywordPrefix\.length\(\)\)\
        :\ text;\

        \ \ \ \ \}\

