        \ \ \ \ \ \ \ \ mOmniboxActionDelegate\ =\ omniboxActionDelegate;\

        \ \ \ \ \ \ \ \ mOmniboxActionDelegate\.setOnKeywordModeEnteredCb\(this::onKeywordModeEntered\);\

        \ \ \ \ \ \ \ \ mWindowAndroid\ =\ windowAndroid;\

        \ \ \ \ \ \ \ \ mEmbedder\ =\ embedder;\

        \ \ \ \ \ \ \ \ mDropdownViewInfoListBuilder\ =\

