        Omnibox\.\

        \ \ \ \ \ \ \ \ if\ \(mOmniboxInZeroPrefixState\ ==\ null\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ mOmniboxInZeroPrefixState\ !=\ isInZeroPrefixContext\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mOmniboxInZeroPrefixState\ =\ isInZeroPrefixContext;\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!isInZeroPrefixContext\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ User\ started\ typing\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mAutocomplete\.resetSession\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mNewOmniboxEditSessionTimestamp\ =\ SystemClock\.elapsedRealtime\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}\

