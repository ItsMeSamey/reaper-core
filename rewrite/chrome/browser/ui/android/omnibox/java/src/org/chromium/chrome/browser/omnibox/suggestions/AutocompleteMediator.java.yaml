        \ \ \ \ @Override\

        \ \ \ \ public\ void\ onSuggestionDropdownOverscrolledToTop\(\)\ \{\

        \ \ \ \ \ \ \ \ mDelegate\.setKeyboardVisibility\(true,\ false\);\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ @return\ elapsed\ time\ \(in\ milliseconds\)\ since\ last\ input\ or\ \-1\ if\ user\
        has\ chosen\ a\

        \ \ \ \ \ \*\ \ \ \ \ zero\-prefix\ suggestion\.\

        \ \ \ \ \ \*/\

        \ \ \ \ private\ long\ getElapsedTimeSinceInputChange\(\)\ \{\

        \ \ \ \ \ \ \ \ return\ mNewOmniboxEditSessionTimestamp\ >\ 0\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ \(SystemClock\.elapsedRealtime\(\)\ \-\ mNewOmniboxEditSessionTimestamp\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ \-1;\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Schedule\ Autocomplete\ action\ for\ execution\.\ Each\ Autocomplete\ action\ posted\
        here\ will\ cancel\

        \ \ \ \ \ \*\ any\ previously\ posted\ Autocomplete\ action,\ ensuring\ that\ the\ actions\ don''t\
        compete\ against\

        \ \ \ \ \ \*\ each\ other\.\ Any\ action\ scheduled\ for\ execution\ before\ Native\ libraries\
        are\ ready\ will\ be\

        \ \ \ \ \ \*\ deferred\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ <p>This\ call\ should\ only\ be\ used\ for\ regular\ suggest\ flows\.\ Do\ not\ post\
        arbitrary\ tasks\ here\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ action\ Autocomplete\ action\ to\ execute\.\

        \ \ \ \ \ \*\ @param\ delayMillis\ The\ number\ of\ milliseconds\ by\ which\ the\ action\ should\
        be\ delayed\.\ Use\

        \ \ \ \ \ \*\ \ \ \ \ SCHEDULE_FOR_IMMEDIATE_EXECUTION\ to\ post\ action\ at\ front\ of\ the\ message\
        queue\.\

        \ \ \ \ \ \*/\

        \ \ \ \ private\ void\ postAutocompleteRequest\(Runnable\ action,\ long\ delayMillis\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(!isInInputSession\(\)\)\ return;\

        \

        \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/475620206\)\ carefully\ reenable\ and\ chase\ down\ any\ cases\
        where\ the\

        \ \ \ \ \ \ \ \ //\ input\ session\ restarts\ may\ lead\ to\ unnecessary,\ redundant\ autocomplete\
        requests\.\

        \ \ \ \ \ \ \ \ //\ This\ assert\ shows\ good\ optimization\ opportunities,\ not\ real\ bugs,\ but\
        leads\ to\

        \ \ \ \ \ \ \ \ //\ unfortunate\ reverts\ of\ relevant\ changes\.\

        \ \ \ \ \ \ \ \ //\ Facilitate\ detection\ of\ Autocomplete\ actions\ being\ scheduled\ from\ an\
        Autocomplete\ action\.\

        \ \ \ \ \ \ \ \ //\ static\ boolean\ mIsExecutingAutocompleteAction;\

        \ \ \ \ \ \ \ \ //\ assert\ !mIsExecutingAutocompleteAction\ :\ "Don''t\ schedule\ recurring\ autocomplete\
        action";\

        \

        \ \ \ \ \ \ \ \ cancelAutocompleteRequests\(\);\

        \ \ \ \ \ \ \ \ mCurrentAutocompleteRequest\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/475620206\)\ carefully\ reenable\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ mIsExecutingAutocompleteAction\ =\ true;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ action\.run\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ mIsExecutingAutocompleteAction\ =\ false;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Release\ completed\ Runnable\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mCurrentAutocompleteRequest\ =\ null;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \};\

        \

        \ \ \ \ \ \ \ \ mHandler\.postDelayed\(mCurrentAutocompleteRequest,\ delayMillis\);\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\ Cancel\ any\ pending\ autocomplete\ actions\.\ \*/\

        \ \ \ \ private\ void\ cancelAutocompleteRequests\(\)\ \{\

        \ \ \ \ \ \ \ \ stopMeasuringSuggestionRequestToUiModelTime\(\);\

        \ \ \ \ \ \ \ \ if\ \(mCurrentAutocompleteRequest\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mHandler\.removeCallbacks\(mCurrentAutocompleteRequest\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ mCurrentAutocompleteRequest\ =\ null;\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Start\ measuring\ time\ between\ \-\ the\ request\ for\ suggestions\ and\ \-\ the\
        suggestions\ UI\ model\

        \ \ \ \ \ \*\ being\ built\.\ This\ should\ be\ invoked\ right\ before\ we\ issue\ a\ request\ for\
        suggestions\.\

        \ \ \ \ \ \*/\

        \ \ \ \ private\ void\ startMeasuringSuggestionRequestToUiModelTime\(\)\ \{\

        \ \ \ \ \ \ \ \ mLastSuggestionRequestTime\ =\ SystemClock\.uptimeMillis\(\);\

        \ \ \ \ \ \ \ \ mFirstSuggestionListModelCreatedTime\ =\ null;\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Measure\ the\ time\ it\ took\ to\ build\ Suggestions\ UI\ model\.\ The\ time\ is\
        measured\ since\ the\ moment\

        \ \ \ \ \ \*\ suggestions\ were\ requested\.\ Two\ histograms\ are\ recorded\ by\ this\ method:\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ <ul>\

        \ \ \ \ \ \*\ \ \ <li>Omnibox\.SuggestionList\.RequestToUiModel\.First\ for\ the\ first\ reply\
        associated\ with\ the\

        \ \ \ \ \ \*\ \ \ \ \ \ \ request\ and\

        \ \ \ \ \ \*\ \ \ <li>Omnibox\.SuggestionList\.RequestToUiModel\.Last\ for\ the\ final\ reply\ associated\
        with\ the\

        \ \ \ \ \ \*\ \ \ \ \ \ \ request\.\

        \ \ \ \ \ \*\ </ul>\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ Any\ other\ replies\ that\ happen\ meantime\ are\ ignored\ and\ are\ accounted\ for\
        by\ the\ last/final\

        \ \ \ \ \ \*\ measurement\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ isFinal\ whether\ the\ measurement\ is\ for\ the\ final\ suggestions\ repsponse\

        \ \ \ \ \ \*/\

        \ \ \ \ private\ void\ measureSuggestionRequestToUiModelTime\(boolean\ isFinal\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(mLastSuggestionRequestTime\ ==\ null\)\ return;\

        \

        \ \ \ \ \ \ \ \ if\ \(mFirstSuggestionListModelCreatedTime\ ==\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mFirstSuggestionListModelCreatedTime\ =\ SystemClock\.uptimeMillis\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ OmniboxMetrics\.recordSuggestionRequestToModelTime\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ isFirst=\ \*/\ true,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mFirstSuggestionListModelCreatedTime\ \-\ mLastSuggestionRequestTime\);\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ if\ \(isFinal\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ OmniboxMetrics\.recordSuggestionRequestToModelTime\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ isFirst=\ \*/\ false,\ SystemClock\.uptimeMillis\(\)\
        \-\ mLastSuggestionRequestTime\);\

        \ \ \ \ \ \ \ \ \ \ \ \ stopMeasuringSuggestionRequestToUiModelTime\(\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\ Cancel\ any\ measurements\ related\ to\ the\ time\ it\ takes\ to\ build\ Suggestions\
        UI\ model\.\ \*/\

        \ \ \ \ private\ void\ stopMeasuringSuggestionRequestToUiModelTime\(\)\ \{\

        \ \ \ \ \ \ \ \ mLastSuggestionRequestTime\ =\ null;\

        \ \ \ \ \ \ \ \ mFirstSuggestionListModelCreatedTime\ =\ null;\

        \ \ \ \ \}\

