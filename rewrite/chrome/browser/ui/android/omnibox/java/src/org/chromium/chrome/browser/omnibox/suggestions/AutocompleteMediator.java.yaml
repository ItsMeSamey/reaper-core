        \ \ \ \ \ \ \ \ mUiOverrides\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.getSideUiStateProviderSupplier\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.addSyncObserverAndCallIfNonNull\(mSideUiStateProviderObserver\);\

