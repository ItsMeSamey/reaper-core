        \ \ \ \ \ \ \ \ \ \ \ \ //\ Clear\ keyword\ mode\ only\ if\ it\ was\ a\ temporary\ preview\ triggered\
        by\ highlighting\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ a\ starter\ pack\.\

