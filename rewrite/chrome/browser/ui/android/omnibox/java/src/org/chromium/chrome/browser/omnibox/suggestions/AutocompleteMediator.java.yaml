        \ \ \ \ @Override\

        \ \ \ \ public\ void\ onTopResumedActivityChanged\(boolean\ isTopResumedActivity\)\ \{\

        \ \ \ \ \ \ \ \ mActivityWindowFocused\ =\ isTopResumedActivity;\

        \ \ \ \ \ \ \ \ boolean\ showSuggestionsContainer\ =\ isTopResumedActivity;\

        \

        \ \ \ \ \ \ \ \ if\ \(isInInputSession\(\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ boolean\ isHubOrTabSearch\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PageClassificationUtils\.isHubOrTabSearch\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mAutocompleteInput\.getPageClassification\(\)\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ //\ Always\ set\ the\ window\ activity\ focused\ property\ to\ true\ for\
        hub\ search\ so\ that\ the\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ dropdown\ container\ persists\ when\ search\ activity\ is\ dismissed\.\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/390011136\):\ Find\ a\ better\ way\ to\ create\ a\
        seamless\ animation\ when\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ exiting\ hub\ search\ that\ dismisses\ the\ URL\ bar\ and\ suggestions\
        list\ together\.\

        \ \ \ \ \ \ \ \ \ \ \ \ showSuggestionsContainer\ \|=\ isHubOrTabSearch;\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(isTopResumedActivity\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ installAutocompleteObservers\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ onInputChanged\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ if\ \(!isHubOrTabSearch\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Hub\ and\ Tab\ Search\ manage\ their\ own\ dismissal\ lifecycle\
        and\ retain\ observers\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ and\ requests\ when\ inactive\ in\ multi\-window\ mode\ or\
        across\ window\ transitions\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ dismissDeleteDialog\(DialogDismissalCause\.NAVIGATE_BACK_OR_TOUCH_OUTSIDE\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ stopAutocomplete\(AutocompleteStopReason\.CLOBBERED\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ removeAutocompleteObservers\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/390011136\):\ Find\ a\ better\ /\ more\ appropriate\ name\
        for\ this\ property\.\ It\ is\

        \ \ \ \ \ \ \ \ //\ a\ misnomer:\ this\ property\ doesn''t\ reflect\ activity\ window\ focus,\ but\
        the\ intent\ to\ show\

        \ \ \ \ \ \ \ \ //\ the\ suggestions\ list\ container\.\

        \ \ \ \ \ \ \ \ mListPropertyModel\.set\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SuggestionListProperties\.ACTIVITY_WINDOW_FOCUSED,\ showSuggestionsContainer\);\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ @return\ Whether\ there\ is\ currently\ an\ active\ omnibox\ session,\ regardless\
        of\ whether\ the\

        \ \ \ \ \ \*\ \ \ \ \ current\ activity\ window\ is\ active\.\

        \ \ \ \ \ \*/\

        \ \ \ \ @EnsuresNonNullIf\(\

        \ \ \ \ \ \ \ \ \ \ \ \ value\ =\ \{"mAutocompleteInput",\ "mSessionState",\ "mAutocomplete"\},\

        \ \ \ \ \ \ \ \ \ \ \ \ result\ =\ true\)\

        \ \ \ \ /\*\ package\ \*/\ boolean\ isInInputSession\(\)\ \{\

