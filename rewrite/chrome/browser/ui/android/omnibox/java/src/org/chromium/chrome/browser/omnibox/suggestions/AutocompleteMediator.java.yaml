        \ \ \ \ \ \ \ \ \}\ else\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ boolean\ preventAutocomplete\ =\ !mUrlBarEditingTextProvider\.shouldAutocomplete\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ int\ cursorPosition\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mUrlBarEditingTextProvider\.getSelectionStart\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ==\ mUrlBarEditingTextProvider\.getSelectionEnd\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ mUrlBarEditingTextProvider\.getSelectionStart\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ \-1;\

