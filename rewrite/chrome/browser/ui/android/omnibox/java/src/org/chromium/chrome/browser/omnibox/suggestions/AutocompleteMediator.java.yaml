        \ \ \ \ private\ void\ setOmniboxEditingText\(String\ text,\ @Nullable\ AutocompleteMatch\ suggestion\)\
        \{\

        \ \ \ \ \ \ \ \ if\ \(!isInInputSession\(\)\)\ return;\

