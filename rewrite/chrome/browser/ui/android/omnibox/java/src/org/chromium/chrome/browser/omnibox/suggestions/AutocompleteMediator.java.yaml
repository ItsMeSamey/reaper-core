        \ \ \ \ private\ void\ finishLoadUrlFromVoice\(GURL\ url\)\ \{\

        \ \ \ \ \ \ \ \ mDelegate\.loadUrl\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ OmniboxLoadUrlParams\.Builder\(url\.getSpec\(\),\ PageTransition\.TYPED\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setOpenInNewTab\(false\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.build\(\)\);\

