substitutions:

  - description: "Keep the selected native extension keyword marker across asynchronous URL preparation."
    regex:
      pattern: "                            .setPostData(suggestion.getPostData())"
      replace: "                            .setIsExtensionKeywordSuggestion(\n                                    suggestion.isExtensionKeywordSuggestion())\n                            .setPostData(suggestion.getPostData())"

