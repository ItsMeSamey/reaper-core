        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mUiOverrides\.isMainBrowserOmnibox\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ VerticalTabUtils\.isVerticalTabsEnabled\(mContext\);\

        \ \ \ \ \ \ \ \ mListPropertyModel\.set\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SuggestionListProperties\.APPLY_MARGIN_FOR_LEFT_SIDE_BAR,\ applyMargin\);\

        \ \ \ \ \ \ \ \ if\ \(mSideUiStateProvider\ !=\ null\)\ \{\

