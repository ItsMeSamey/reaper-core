        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Updates\ the\ URL\ we\ will\ navigate\ to\ from\ suggestion,\ if\ needed\.\ This\
        will\ update\ the\ search\

        \ \ \ \ \ \*\ URL\ to\ be\ of\ the\ corpus\ type\ if\ query\ in\ the\ omnibox\ is\ displayed\ and\
        update\ gs_lcrp=\

        \ \ \ \ \ \*\ parameter\ on\ regular\ web\ search\ URLs\.\

