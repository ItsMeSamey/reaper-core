        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Notifies\ the\ autocomplete\ system\ that\ the\ text\ has\ changed\ that\ drives\
        autocomplete\ and\ the\

        \ \ \ \ \ \*\ autocomplete\ suggestions\ should\ be\ updated\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ <p>The\ isOnFocusContext\ parameter\ signifies\ that\ the\ Zero\ Prefix\ Suggestions\
        should\ be\

        \ \ \ \ \ \*\ retrieved\ even\ if\ the\ Omnibox\ content\ is\ not\ empty\.\ This\ is\ relevant\
        to\ Desktop\ mode\ Chrome,\

        \ \ \ \ \ \*\ where,\ if\ both\ physical\ keyboard\ and\ pointer\ device\ is\ attached,\ the\ Page\
        URL\ should\ not\ be\

        \ \ \ \ \ \*\ cleared\.\

        \ \ \ \ \ \*/\

        \ \ \ \ public\ void\ onInputChanged\(\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(!isInInputSession\(\)\)\ return;\

        \ \ \ \ \ \ \ \ if\ \(mShouldPreventOmniboxAutocomplete\)\ return;\

        \

        \ \ \ \ \ \ \ \ if\ \(mAutocompleteInput\.getAutocompleteState\(\)\ !=\ AutocompleteState\.ENABLED\)\
        \{\

