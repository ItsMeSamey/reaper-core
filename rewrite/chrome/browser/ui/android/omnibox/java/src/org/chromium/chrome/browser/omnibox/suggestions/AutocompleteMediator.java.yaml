        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ matchIndex,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ suggestion,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ suggestion\.getUrl\(\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ eventTime,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ openInNewTab,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ openInNewWindow\);\

        \ \ \ \ \ \ \ \ return\ true;\

        \ \ \ \ \}\

