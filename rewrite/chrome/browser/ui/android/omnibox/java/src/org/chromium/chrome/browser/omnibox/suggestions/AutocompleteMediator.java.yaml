        \ \ \ \ \ \ \ \ //\ In\ most\ cases\ the\ AutocompleteInput\ needs\ to\ be\ the\ source\ of\ truth\.\

        \ \ \ \ \ \ \ \ //\ This\ method\ is\ used\ to\ communicate\ user\ selection\ back\ to\ the\ UrlBar\
        without\

        \ \ \ \ \ \ \ \ //\ committing\ UserText\ \-\-\ the\ most\ recently\ committed\ UserText\ is\ what\
        the\ user\ typed,\

        \ \ \ \ \ \ \ \ //\ and\ the\ DPAD\ selection\ triggered\ here\ represents\ text\ that\ is\ uncommitted\
        until\

