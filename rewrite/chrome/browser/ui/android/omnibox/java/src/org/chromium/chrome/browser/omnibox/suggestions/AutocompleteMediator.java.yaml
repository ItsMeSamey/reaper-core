        /\*\*\

        \ \*\ Mediator\ for\ the\ autocomplete\ component\.\

        \ \*\

        \ \*\ <p>The\ Mediator\ is\ responsible\ for\ observing\ the\ \{@link\ FuseboxSessionState\}\ and\
        providing\

        \ \*\ suggestions\ to\ the\ omnibox\.\ It\ receives\ the\ \{@link\ AutocompleteController\}\ from\
        the\ \{@link\

        \ \*\ FuseboxSessionState\}\ and\ handles\ all\ interactions\ with\ it\.\

        \ \*\

        \ \*\ <p>The\ lifecycle\ of\ this\ component\ is\ tied\ to\ an\ omnibox\ input\ session,\ which\
        begins\ with\ \{@link\

        \ \*\ \#beginInput\(FuseboxSessionState\)\}\ and\ ends\ with\ \{@link\ \#endInput\(\)\}\.\ When\
        an\ input\ session\ is\

        \ \*\ active,\ this\ Mediator\ will\ listen\ for\ text\ changes\ and\ forward\ them\ to\ the\ \{@link\

        \ \*\ AutocompleteController\}\ to\ retrieve\ suggestions\.\ The\ suggestions\ are\ then\ processed\
        and\ passed\ to\

        \ \*\ the\ \{@link\ AutocompleteCoordinator\}\ to\ be\ displayed\ to\ the\ user\.\

        \ \*\

        \ \*\ <p>This\ component''s\ design\ is\ simplified\ by\ the\ guarantees\ provided\ by\ \{@link\

        \ \*\ FuseboxSessionState\}\.\ It\ is\ guaranteed\ to\ have\ a\ valid\ \{@link\ Profile\}\ and\
        \{@link\

        \ \*\ AutocompleteController\}\ whenever\ an\ input\ session\ is\ active,\ removing\ the\ need\
        to\ handle\

        \ \*\ pre\-native\ or\ pre\-profile\ edge\ cases\.\

        \ \*/\

        @NullMarked\

        class\ AutocompleteMediator\

        \ \ \ \ \ \ \ \ implements\ OnSuggestionsReceivedListener,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ OmniboxSuggestionsDropdown\.GestureObserver,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ OmniboxSuggestionsDropdownScrollListener,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TopResumedActivityChangedObserver,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PauseResumeWithNativeObserver,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FuseboxAttachmentChangeListener,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SuggestionHost,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SideUiObserver\ \{\

        \

        \ \ \ \ //\ Delay\ triggering\ the\ omnibox\ results\ upon\ key\ press\ to\ allow\ the\ location\
        bar\ to\ repaint\

        \ \ \ \ //\ with\ the\ new\ characters\.\

        \ \ \ \ private\ static\ final\ long\ OMNIBOX_SUGGESTION_START_DELAY_MS\ =\ 30;\

        \

        \ \ \ \ @VisibleForTesting\

