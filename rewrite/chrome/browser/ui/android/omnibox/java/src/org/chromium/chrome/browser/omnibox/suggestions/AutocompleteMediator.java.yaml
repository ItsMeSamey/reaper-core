        action\ taken\ \(false\)\.\

        \ \ \ \ private\ boolean\ mOmniboxFocusResultedInNavigation;\

        \

        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ The\ text\ shown\ in\ the\ URL\ bar\ \(user\ text\ \+\ inline\ autocomplete\)\ after\
        the\ most\ recent\ set\ of\

        \ \ \ \ \ \*\ omnibox\ suggestions\ was\ received\.\ When\ the\ user\ presses\ enter\ in\ the\ omnibox,\
