        list\.\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ This\ normally\ happens\ when\ the\ target\ site\ loads\ and\ focus\
        is\ moved\ to\ the\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ webcontents\.\ On\ Android\ T\ we\ occasionally\ observe\ focus\ events\
        to\ be\ lost,\ resulting\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ with\ Suggestions\ list\ obscuring\ the\ view\.\

