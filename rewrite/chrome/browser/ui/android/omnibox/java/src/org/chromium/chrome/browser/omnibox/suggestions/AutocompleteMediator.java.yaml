        \ \ \ \ /\*\*\ Whether\ omnibox\ autocomplete\ should\ currently\ be\ prevented\ from\ generating\
        suggestions\.\ \*/\

        \ \ \ \ void\ setShouldPreventOmniboxAutocomplete\(boolean\ prevent\)\ \{\

        \ \ \ \ \ \ \ \ mShouldPreventOmniboxAutocomplete\ =\ prevent;\

