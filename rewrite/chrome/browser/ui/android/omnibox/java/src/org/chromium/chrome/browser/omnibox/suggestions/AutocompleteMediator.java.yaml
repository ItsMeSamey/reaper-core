        \ \ \ \ /\*\*\ Update\ whether\ the\ Omnibox\ session\ is\ active\.\ \*/\

        \ \ \ \ @VisibleForTesting\

        \ \ \ \ void\ propagateOmniboxSessionStateChange\(boolean\ isActive\)\ \{\

        \ \ \ \ \ \ \ \ boolean\ wasActive\ =\ mListPropertyModel\.get\(SuggestionListProperties\.OMNIBOX_SESSION_ACTIVE\);\

        \

        \ \ \ \ \ \ \ \ if\ \(isActive\ !=\ wasActive\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ Determine\ if\ a\ left\ margin\ should\ be\ applied\ to\ the\ suggestions\
        list\.\ It\ is\ the\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ responsibility\ of\ the\ AutocompleteMediator\ to\ evaluate\ whether\
        the\ current\ omnibox\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ instance\ is\ for\ the\ main\ browser\ and\ whether\ Vertical\ Tabs\
        is\ enabled\.\ If\ enabled,\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ it\ inflates\ a\ left\ side\ panel\ which\ shifts\ the\ main\ browser\
        page,\ including\ the\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ omnibox,\ by\ an\ offset\ amount\.\ An\ edge\ case\ exists\ for\ Tab\
        Search\ \(which\ embeds\ an\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ omnibox\)\ when\ its\ entry\ point\ in\ the\ Vertical\ Tabs\ panel\
        is\ clicked,\ causing\ it\ to\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ inflate\ a\ floating\ container\ and\ overlay\ on\ top\ of\ Vertical\
        Tabs\ when\ shown\.\ This\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ embedded\ omnibox\ is\ inflated\ via\ SearchActivity\ rather\ than\
        ToolbarManager\ \(main\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ browser\)\.\ Ensure\ that\ this\ use\ case\ does\ not\ have\ a\ left\
        margin\.\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(isActive\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ updateLeftSideUiMargin\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ mListPropertyModel\.set\(SuggestionListProperties\.OMNIBOX_SESSION_ACTIVE,\
        isActive\);\

        \ \ \ \ \ \ \ \ \ \ \ \ mIgnoreOmniboxItemSelection\ \|=\ isActive;\

        \ \ \ \ \ \ \ \ \ \ \ \ if\ \(mOmniboxSuggestionsVisualStateObserver\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mOmniboxSuggestionsVisualStateObserver\.onOmniboxSessionStateChange\(isActive\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

