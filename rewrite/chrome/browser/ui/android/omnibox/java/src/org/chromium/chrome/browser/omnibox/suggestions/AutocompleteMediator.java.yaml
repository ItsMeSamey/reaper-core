        \ \ \ \ @Override\

        \ \ \ \ public\ void\ onOmniboxActionClicked\(OmniboxAction\ action,\ int\ position\)\ \{\

        \ \ \ \ \ \ \ \ var\ match\ =\ getSuggestionAt\(position\);\

        \ \ \ \ \ \ \ \ if\ \(match\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ recordMetrics\(match,\ action,\ position,\ action\.disposition\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ if\ \(action\.execute\(mOmniboxActionDelegate\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ finishInteraction\(\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}\

