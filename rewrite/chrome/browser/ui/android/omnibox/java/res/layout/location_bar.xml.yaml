# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/omnibox/java/res/layout/location_bar.xml'
  regex:
    re_pattern: '\ \ \ \ xmlns:tools="http://schemas\.android\.com/tools">\

      \ \ \ \ <include\ layout="@layout/omnibox_back_button"/>\

      \ \ \ \ <include\ layout="@layout/location_status"/>\

      \ \ \ \ <include\ layout="@layout/fusebox_layout"/>\

      \ \ \ \ <include\

      \ \ \ \ \ \ \ \ layout="@layout/url_bar"\

      \ \ \ \ \ \ \ \ android:nextFocusForward="@\+id/tab_switcher_button"/>\

      '
    replace: "    xmlns:tools=\"http://schemas.android.com/tools\">\n    <include layout=\"@layout/omnibox_back_button\"/>\n    <include layout=\"@layout/location_status\"/>\n    <include\n        layout=\"@layout/url_bar\"\n        android:nextFocusForward=\"@+id/tab_switcher_button\"/>\n"
