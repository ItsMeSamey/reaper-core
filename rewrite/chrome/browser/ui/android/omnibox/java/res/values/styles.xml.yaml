# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/omnibox/java/res/values/styles.xml'
  regex:
    re_pattern: '\ \ \ \ </style>\

      \

      \ \ \ \ <!\-\-\ AI\ Mode\ styles\ \-\->\

      \ \ \ \ <style\ name="TextAppearance\.AiModeChipText"\ parent="TextAppearance\.ChipText">\

      \ \ \ \ \ \ \ \ <item\ name="android:textColor">@color/default_text_color_dark</item>\

      \ \ \ \ </style>\

      \

      \ \ \ \ <style\ name="AiModeChip"\ parent="Chip">\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_width">wrap_content</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_height">@dimen/min_touch_target_size</item>\

      \ \ \ \ \ \ \ \ <item\ name="icon">@drawable/search_spark_black_24dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="iconTint">@color/default_text_color_dark</item>\

      \ \ \ \ \ \ \ \ <item\ name="iconWidth">20dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="iconHeight">20dp</item>\

      \ \ \ \ \ \ \ \ <!\-\-\ 10dp\ visual\ start\ padding\ \+\ 5dp\ horizontalInset\.\ \-\->\

      \ \ \ \ \ \ \ \ <item\ name="chipStartPadding">15dp</item>\

      \ \ \ \ \ \ \ \ <!\-\-\ 12dp\ visual\ end\ padding\ \+\ 5dp\ horizontalInset\.\ \-\->\

      \ \ \ \ \ \ \ \ <item\ name="chipEndPadding">17dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="primaryTextStartPadding">4dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="allowMultipleLines">false</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:text">@string/ai_mode_entrypoint_label</item>\

      \ \ \ \ \ \ \ \ <item\ name="textAlignStart">true</item>\

      \ \ \ \ \ \ \ \ <item\ name="cornerRadius">@dimen/ai_chip_corner_radius</item>\

      \ \ \ \ \ \ \ \ <item\ name="chipColor">@color/gm3_baseline_surface_container_high_light</item>\

      \ \ \ \ \ \ \ \ <item\ name="primaryTextAppearance">@style/TextAppearance\.AiModeChipText</item>\

      \ \ \ \ \ \ \ \ <item\ name="chipStrokeColor">@android:color/transparent</item>\

      \ \ \ \ </style>\

      </resources>\

      '
    replace: "    </style>\n\n    <!-- AI Mode styles -->\n\n</resources>\n"
- description: Remove the excluded Fusebox bottom-sheet animation style
  regex:
    pattern: "    <!-- Bottom Sheet Animation for Fusebox -->\n    <style name=\"FuseboxBottomSheetAnimation\" parent=\"android:Animation\"\
      >\n        <item name=\"android:windowEnterAnimation\">@anim/fusebox_slide_in_up</item>\n        <item name=\"android:windowExitAnimation\"\
      >@anim/fusebox_slide_out_down</item>\n    </style>\n\n"
    replace: ''
  count: 1
- description: Remove exact 5 unused Fusebox style declarations; preserve all other values and retained anchor.
  regex:
    re_pattern: '\ \ \ \ <style\ name="Fusebox"/>\

      \ \ \ \ <style\ name="Fusebox\.PopupMenu"/>\

      \ \ \ \ <style\ name="Fusebox\.PopupMenu\.Item"\ parent="@style/TextButton">\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_width">match_parent</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_height">\?attr/listItemHeight</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:drawablePadding">8dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:singleLine">true</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:textAlignment">viewStart</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:textAppearance">\

      \ \ \ \ \ \ \ \ \ \ \ \ @style/TextAppearance\.TextMedium\.Primary\

      \ \ \ \ \ \ \ \ </item>\

      \ \ \ \ \ \ \ \ <item\ name="drawableTint">\

      \ \ \ \ \ \ \ \ \ \ \ \ @color/default_icon_color_secondary_tint_list\

      \ \ \ \ \ \ \ \ </item>\

      \ \ \ \ \ \ \ \ <item\ name="buttonTextColor">@null</item>\

      \ \ \ \ </style>\

      \

      \ \ \ \ <style\ name="Fusebox\.PopupMenu\.Divider">\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_width">match_parent</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_height">1dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_marginTop">4dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_marginBottom">4dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:background">\?android:attr/listDivider</item>\

      \ \ \ \ </style>\

      \

      \ \ \ \ <style\ name="Fusebox\.PopupMenu\.Header">\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_width">wrap_content</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_height">wrap_content</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:textAlignment">viewStart</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:textAppearance">\

      \ \ \ \ \ \ \ \ \ \ \ \ @style/TextAppearance\.TextSmall\.Secondary\

      \ \ \ \ \ \ \ \ </item>\

      \ \ \ \ \ \ \ \ <item\ name="android:paddingHorizontal">8dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_marginTop">4dp</item>\

      \ \ \ \ \ \ \ \ <item\ name="android:accessibilityHeading">true</item>\

      \ \ \ \ </style>\

      \

      \ \ \ \ <style\ name="OmniboxIcon"\ parent="LocationBarButton">\

      \ \ \ \ \ \ \ \ <item\ name="android:layout_width">\

      \ \ \ \ \ \ \ \ \ \ \ \ @dimen/location_bar_status_icon_width\

      \ \ \ \ \ \ \ \ </item>\

      '
    replace: "\n\n\n    <style name=\"OmniboxIcon\" parent=\"LocationBarButton\">\n        <item name=\"android:layout_width\">\n            @dimen/location_bar_status_icon_width\n        </item>\n"
