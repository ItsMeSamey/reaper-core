  regex:
    re_pattern: '\ \ \ \ \ \ \ \ />\

      \

      \ \ \ \ <include\ layout="@layout/url_action_container"/>\

      \ \ \ \ <include\ layout="@layout/fusebox_layout"/>\

      \ \ \ \ <View\

      \ \ \ \ \ \ \ \ android:id="@\+id/focus_thief"\

      \ \ \ \ \ \ \ \ android:layout_width="1px"\

      '
    replace: "        />\n\n    <include layout=\"@layout/url_action_container\"/>\n    <View\n        android:id=\"@+id/focus_thief\"\n        android:layout_width=\"1px\"\n"
