# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/omnibox/java/res/values/dimens.xml'
  regex:
    re_pattern: '\-\->\

      <resources\ xmlns:tools="http://schemas\.android\.com/tools">\

      \ \ \ \ <!\-\-\ go/keep\-sorted\ start\ group_start_regex=<dimen\ \-\->\

      \ \ \ \ <dimen\ name="ai_chip_corner_radius">36dp</dimen>\

      \ \ \ \ <dimen\ name="ai_chip_horizontal_inset">2dp</dimen>\

      \ \ \ \ <dimen\ name="ai_chip_vertical_inset">6dp</dimen>\

      \ \ \ \ <dimen\ name="ai_tier_ring_thickness_identity_disc">2dp</dimen>\

      \ \ \ \ <dimen\ name="close_button_height">48dp</dimen>\

      \ \ \ \ <dimen\ name="close_button_height_desktop">20dp</dimen>\

      '
    replace: "-->\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n    <!-- go/keep-sorted start group_start_regex=<dimen -->\n    <dimen name=\"ai_tier_ring_thickness_identity_disc\">2dp</dimen>\n    <dimen name=\"close_button_height\">48dp</dimen>\n    <dimen name=\"close_button_height_desktop\">20dp</dimen>\n"
