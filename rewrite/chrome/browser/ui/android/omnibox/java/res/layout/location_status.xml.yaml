# Inflate Brave's StatusView subclass so the search engine icon's outline
# provider is attached and the favicon clips to a circle.

substitutions:
  - description: 'Use BraveStatusView in place of upstream StatusView'
    regex:
      pattern: 'org.chromium.chrome.browser.omnibox.status.StatusView'
      replace: 'org.chromium.chrome.browser.omnibox.status.BraveStatusView'

    count: 2

  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/omnibox/java/res/layout/location_status.xml'
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ android:screenReaderFocusable="true"\

        \ \ \ \ \ \ \ \ app:layout_constraintStart_toEndOf="@id/back_button_barrier"\

        \ \ \ \ \ \ \ \ app:layout_constraintEnd_toStartOf="@id/url_bar"\

        \ \ \ \ \ \ \ \ app:layout_constraintTop_toBottomOf="@id/location_bar_attachments"\

        \ \ \ \ \ \ \ \ app:layout_constraintHorizontal_chainStyle="spread_inside"\

        \ \ \ \ \ \ \ \ app:layout_constraintHorizontal_weight="0">\

        \ \ \ \ \ \ \ \ <!\-\-\ End\ padding\ is\ adjusted\ programmatically\.\ \-\->\

        '
      replace: "        android:screenReaderFocusable=\"true\"\n        app:layout_constraintStart_toEndOf=\"@id/back_button_barrier\"\n        app:layout_constraintEnd_toStartOf=\"@id/url_bar\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        app:layout_constraintHorizontal_chainStyle=\"spread_inside\"\n        app:layout_constraintHorizontal_weight=\"0\">\n        <!-- End padding is adjusted programmatically. -->\n"
