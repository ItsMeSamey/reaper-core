      ,\n    \"//chrome/browser/profiles/android:java\",\n    \"//chrome/browser/tabmodel:java\",\n  ]\n\n  # This internal\
      \ file will be replaced by a generated file so the resulting\n  # android_library target does not actually depend on\
      \ this internal file.\n  sources = [ \"internal/java/src/org/chromium/chrome/browser/ui/hats/SurveyClientFactory.java\"\
      \ ]\n}"
    replace: "if (!is_android) {\n  android_library_factory(\"factory_java\") {\n    deps = [\n      \":java\",\n      \"\
