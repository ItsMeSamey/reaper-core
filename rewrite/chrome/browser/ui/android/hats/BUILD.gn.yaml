substitutions:
- description: Exclude dedicated Android survey target java
  regex:
    pattern: "android_library(\"java\") {\n  srcjar_deps = [\n    \":jni_headers\",\n    \"//chrome/browser/ui/hats:hats_enums\"\
      ,\n  ]\n  sources = [\n    \"java/src/org/chromium/chrome/browser/ui/hats/SurveyClient.java\",\n    \"java/src/org/chromium/chrome/browser/ui/hats/SurveyConfig.java\"\
      ,\n    \"java/src/org/chromium/chrome/browser/ui/hats/SurveyUiDelegate.java\",\n  ]\n  deps = [\n    \"//base:base_java\"\
      ,\n    \"//chrome/browser/android/lifecycle:java\",\n    \"//chrome/browser/profiles/android:java\",\n    \"//third_party/androidx:androidx_annotation_annotation_java\"\
      ,\n    \"//third_party/jni_zero:jni_zero_java\",\n  ]\n}"
    replace: "if (!is_android) {\n  android_library(\"java\") {\n    srcjar_deps = [\n      \":jni_headers\",\n      \"//chrome/browser/ui/hats:hats_enums\"\
      ,\n    ]\n    sources = [\n      \"java/src/org/chromium/chrome/browser/ui/hats/SurveyClient.java\",\n      \"java/src/org/chromium/chrome/browser/ui/hats/SurveyConfig.java\"\
      ,\n      \"java/src/org/chromium/chrome/browser/ui/hats/SurveyUiDelegate.java\",\n    ]\n    deps = [\n      \"//base:base_java\"\
      ,\n      \"//chrome/browser/android/lifecycle:java\",\n      \"//chrome/browser/profiles/android:java\",\n      \"//third_party/androidx:androidx_annotation_annotation_java\"\
      ,\n      \"//third_party/jni_zero:jni_zero_java\",\n    ]\n  }\n}"
  count: 1
