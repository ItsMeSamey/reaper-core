# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/autofill/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "wallet_reminder_notice_ui_delegate_android\.cc",\

      \ \ \ \ "wallet_reminder_notice_ui_delegate_android\.h",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//chrome/android:chrome_jni_headers",\

      '
    replace: "    \"wallet_reminder_notice_ui_delegate_android.cc\",\n    \"wallet_reminder_notice_ui_delegate_android.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"at_memory_bottom_sheet_bridge.cc\",\n      \"at_memory_bottom_sheet_bridge.h\",\n      \"autofill_ai_save_update_entity_flow_manager.cc\",\n      \"autofill_ai_save_update_entity_flow_manager.h\",\n      \"autofill_ai_save_update_entity_prompt_view_android.cc\",\n      \"autofill_ai_save_update_entity_prompt_view_android.h\",\n    ]\n  }\n  deps = [\n    \"//base\",\n    \"//chrome/android:chrome_jni_headers\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/autofill/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/gfx",\

      \ \ \ \ "//url",\

      \ \ \]\

      \

      \ \ \#\ TODO\(crbug\.com/353332589\):\ Remove\ this\ circular\ dependency\.\

      \ \ allow_circular_includes_from\ =\

      '
    replace: "    \"//ui/gfx\",\n    \"//url\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/ui/autofill:autofill_ai_ui_utils\" ]\n  }\n\n  # TODO(crbug.com/353332589): Remove this circular dependency.\n  allow_circular_includes_from =\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/autofill/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "save_update_address_profile_flow_manager_unittest\.cc",\

      \ \ \ \ "wallet_reminder_notice_ui_delegate_android_unittest\.cc",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":autofill",\

      \ \ \ \ "//base",\

      '
    replace: "    \"save_update_address_profile_flow_manager_unittest.cc\",\n    \"wallet_reminder_notice_ui_delegate_android_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"at_memory_bottom_sheet_bridge_unittest.cc\",\n      \"autofill_ai_save_update_entity_flow_manager_unittest.cc\",\n    ]\n  }\n  deps = [\n    \":autofill\",\n    \"//base\",\n"
