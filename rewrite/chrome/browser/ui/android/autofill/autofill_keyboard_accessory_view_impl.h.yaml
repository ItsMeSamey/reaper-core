# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ base::OnceCallback<void\(bool\)>\ autofill_ai_suppression_callback_;\

      '
    replace: ''
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ void\ OpenSettingsForEntityType\(JNIEnv\*\ env,\ int32_t\ entity_type\);\

      '
    replace: ''
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ void\ OnAutofillAiSuppressionDialogClosed\(JNIEnv\*\ env,\ bool\ confirmed\);\

      '
    replace: ''
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ void\ AutofillAiSuggestionDetailsRequested\(JNIEnv\*\ env,\ int32_t\ list_index\);\

      '
    replace: ''
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ void\ ShowAutofillAiSuggestionDetails\(\

      \ \ \ \ \ \ const\ std::u16string\&\ title,\

      \ \ \ \ \ \ const\ std::u16string\&\ body,\

      \ \ \ \ \ \ const\ std::u16string\&\ confirm_button_text,\

      \ \ \ \ \ \ const\ std::u16string\&\ primary_button_text,\

      \ \ \ \ \ \ base::OnceCallback<void\(bool\)>\ suppression_callback\)\ override;\

      '
    replace: ''
