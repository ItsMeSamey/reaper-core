      \ \ \ \ int32_t\ list_index\)\ \{\

      \ \ if\ \(controller_\ \&\&\ list_index\ >=\ 0\)\ \{\

      \ \ \ \ controller_\->ShowAutofillAiSuggestionDetails\(\

      \ \ \ \ \ \ \ \ base::checked_cast<size_t>\(list_index\)\);\

      \ \ \}\

      \}\

      \

      void\ AutofillKeyboardAccessoryViewImpl::OnAutofillAiSuppressionDialogClosed\(\

      \ \ \ \ JNIEnv\*\ env,\

