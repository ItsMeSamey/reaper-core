# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/autofill/dialog/autofill_dialog_view_android.h'
  regex:
    re_pattern: '\#ifndef\ CHROME_BROWSER_UI_ANDROID_AUTOFILL_DIALOG_AUTOFILL_DIALOG_VIEW_ANDROID_H_\

      \#define\ CHROME_BROWSER_UI_ANDROID_AUTOFILL_DIALOG_AUTOFILL_DIALOG_VIEW_ANDROID_H_\

      \

      \#include\ <jni\.h>\

      \#include\ <stddef\.h>\

      \

      '
    replace: '#ifndef CHROME_BROWSER_UI_ANDROID_AUTOFILL_DIALOG_AUTOFILL_DIALOG_VIEW_ANDROID_H_

      #define CHROME_BROWSER_UI_ANDROID_AUTOFILL_DIALOG_AUTOFILL_DIALOG_VIEW_ANDROID_H_


      #include "build/build_config.h"

      #include <jni.h>

      #include <stddef.h>


      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/autofill/dialog/autofill_dialog_view_android.h'
  regex:
    re_pattern: '\ \ \~AutofillDialogViewAndroid\(\)\ override;\

      \

      \ \ void\ Show\(\)\ override;\

      \ \ void\ ShowLoadingDialog\(\)\ override;\

      \ \ void\ Dismiss\(\)\ override;\

      \

      \ \ //\ \-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\

      '
    replace: "  ~AutofillDialogViewAndroid() override;\n\n  void Show() override;\n#if !BUILDFLAG(IS_ANDROID)\n  void ShowLoadingDialog() override;\n#endif\n  void Dismiss() override;\n\n  // --------------------------------------------------------------------------\n"
