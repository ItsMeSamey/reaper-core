substitutions:
- description: Handle removed Android extension actions safely and clean up their hovercards
  regex:
    re_pattern: '\ \ \ \ content::WebContents\*\ web_contents\)\ \{\

      \ \ ToolbarActionViewModel\*\ action\ =\

      \ \ \ \ \ \ toolbar_view_model_\->GetActionModelForId\(action_id\);\

      \

      \ \ auto\ hover_card_state\ =\ action\->GetHoverCardState\(web_contents\);\

      \ \ ExtensionActionViewModel::HoverCardUiState\ ui_state\ =\

      '
    replace: "    content::WebContents* web_contents) {\n  ToolbarActionViewModel* action =\n      toolbar_view_model_->GetActionModelForId(action_id);\n  if (!action) {\n    return nullptr;\n  }\n\n  auto hover_card_state = action->GetHoverCardState(web_contents);\n  ExtensionActionViewModel::HoverCardUiState ui_state =\n"
- description: Ignore Android toolbar action dispatch after the extension is removed
  regex:
    re_pattern: 'void\ ExtensionsToolbarAndroid::ExecuteUserAction\(\

      \ \ \ \ const\ ToolbarActionsModel::ActionId\&\ action_id,\

      \ \ \ \ ToolbarActionViewModel::InvocationSource\ source\)\ \{\

      \ \ toolbar_view_model_\->ExecuteUserAction\(action_id,\ source\);\

      \}\

      \

      '
    replace: "void ExtensionsToolbarAndroid::ExecuteUserAction(\n    const ToolbarActionsModel::ActionId& action_id,\n    ToolbarActionViewModel::InvocationSource source) {\n  // A removed action's Java button can still receive clicks during its animation.\n  if (!toolbar_view_model_->GetActionModelForId(action_id)) {\n    return;\n  }\n  toolbar_view_model_->ExecuteUserAction(action_id, source);\n}\n\n"
