      \ \ \ \ \ \ \ \ //\ ModalDialogManager\ ignores\ an\ already\-retired\ model\.\ Never\ dismiss\ an\

      \ \ \ \ \ \ \ \ //\ unrelated\ current\ dialog\ while\ cleaning\ up\ a\ failed\ assertion\.\

      \ \ \ \ \ \ \ \ handle\.manager\.dismissDialog\(handle\.model,\ DialogDismissalCause\.UNKNOWN\);\

      \ \ \ \ \}\

      \

      '
    replace: "        InstallDialogHandle handle = (InstallDialogHandle) capturedDialog;\n        // ModalDialogManager ignores an already-retired model. Never dismiss an\n        // unrelated current dialog while cleaning up a failed assertion.\n        handle.manager.dismissDialog(handle.model, DialogDismissalCause.UNKNOWN);\n    }\n\n    // Downloads uses an ordinary paragraph DialogModel, without an explicit tab owner.\n    // Keep this separate from the install helper's original-tab/custom-view checks.\n    private static final class DownloadOpenDialogHandle {\n        final ModalDialogManager manager;\n        final PropertyModel model;\n\n        DownloadOpenDialogHandle(ModalDialogManager manager, PropertyModel model) {\n            this.manager = manager;\n            this.model = model;\n        }\n    }\n\n    @CalledByNativeForTesting\n    private static @Nullable Object captureDownloadOpenDialogForTesting(\n            @JniType(\"content::WebContents*\") WebContents sender,\n            @JniType(\"std::u16string\") String expectedTitle,\n            boolean includePending) {\n        ThreadUtils.assertOnUiThread();\n        if (sender.isDestroyed()) return null;\n        WindowAndroid window = sender.getTopLevelNativeWindow();\n        if (window == null) return null;\n        ModalDialogManager manager = window.getModalDialogManager();\n        if (manager == null) return null;\n        DownloadOpenDialogHandle current =\n                matchDownloadOpenDialog(manager, manager.getCurrentDialogForTest(), expectedTitle);\n        if (current != null || !includePending) return current;\n        List<PropertyModel> pending =\n                manager.getPendingDialogsForTest(ModalDialogManager.ModalDialogType.TAB);\n        if (pending == null) return null;\n        for (PropertyModel model : pending) {\n            DownloadOpenDialogHandle match = matchDownloadOpenDialog(manager, model, expectedTitle);\n            if (match != null) return match;\n        }\n        return null;\n    }\n\n    private static @Nullable DownloadOpenDialogHandle matchDownloadOpenDialog(\n            ModalDialogManager manager, @Nullable PropertyModel model, String expectedTitle) {\n        if (model == null) return null;\n        CharSequence title = model.get(ModalDialogProperties.TITLE);\n        ArrayList<CharSequence> paragraphs = model.get(ModalDialogProperties.MESSAGE_PARAGRAPHS);\n        if (title == null\n                || !expectedTitle.contentEquals(title)\n                || model.get(ModalDialogProperties.CUSTOM_VIEW) != null\n                || paragraphs == null\n                || paragraphs.isEmpty()) {\n            return null;\n        }\n        return new DownloadOpenDialogHandle(manager, model);\n    }\n\n    @CalledByNativeForTesting\n    private static @JniType(\"std::vector<std::u16string>\") String[]\n            getDownloadOpenDialogParagraphsForTesting(Object capturedDialog) {\n        ThreadUtils.assertOnUiThread();\n        DownloadOpenDialogHandle handle = (DownloadOpenDialogHandle) capturedDialog;\n        ArrayList<String> messages = new ArrayList<>();\n        for (CharSequence paragraph : handle.model.get(ModalDialogProperties.MESSAGE_PARAGRAPHS)) {\n            messages.add(paragraph.toString());\n        }\n        return messages.toArray(new String[0]);\n    }\n\n    @CalledByNativeForTesting\n    private static boolean clickDownloadOpenDialogForTesting(Object capturedDialog, boolean accept) {\n        ThreadUtils.assertOnUiThread();\n        DownloadOpenDialogHandle handle = (DownloadOpenDialogHandle) capturedDialog;\n        if (handle.manager.getCurrentDialogForTest() != handle.model) return false;\n        handle.model\n                .get(ModalDialogProperties.CONTROLLER)\n                .onClick(\n                        handle.model,\n                        accept\n                                ? ModalDialogProperties.ButtonType.POSITIVE\n                                : ModalDialogProperties.ButtonType.NEGATIVE);\n        return true;\n    }\n\n    @CalledByNativeForTesting\n    private static void dismissDownloadOpenDialogForTesting(Object capturedDialog) {\n        ThreadUtils.assertOnUiThread();\n        DownloadOpenDialogHandle handle = (DownloadOpenDialogHandle) capturedDialog;\n        handle.manager.dismissDialog(handle.model, DialogDismissalCause.UNKNOWN);\n    }\n\n"
