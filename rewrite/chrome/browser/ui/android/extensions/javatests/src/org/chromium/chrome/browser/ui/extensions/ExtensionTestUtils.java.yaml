- description: Bind Android re-enable consent to the displayed extension and exercise its real modal
  regex:
    re_pattern: '@NullMarked\

      @JNINamespace\("extensions"\)\

      public\ class\ ExtensionTestUtils\ \{\

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Loads\ an\ unpacked\ extension\ from\ a\ given\ directory,\ and\ returns\ a\ load\ extension''s\ ID\.\

      \ \ \ \ \ \*\

      '
    replace: "@NullMarked\n@JNINamespace(\"extensions\")\npublic class ExtensionTestUtils {\n    // Holds the actual shown model and manager. Tests never replace the Activity's\n    // manager or synthesize the native permission-completion callback.\n    private static final class InstallDialogHandle {\n        final ModalDialogManager manager;\n        final PropertyModel model;\n        final LinearLayout permissions;\n\n        InstallDialogHandle(\n                ModalDialogManager manager, PropertyModel model, LinearLayout permissions) {\n            this.manager = manager;\n            this.model = model;\n            this.permissions = permissions;\n        }\n    }\n\n    @CalledByNativeForTesting\n    private static @Nullable Object captureInstallDialogForTesting(\n            @JniType(\"content::WebContents*\") WebContents sender) {\n        ThreadUtils.assertOnUiThread();\n        if (sender.isDestroyed()) return null;\n        WindowAndroid window = sender.getTopLevelNativeWindow();\n        if (window == null) return null;\n        ModalDialogManager manager = window.getModalDialogManager();\n        if (manager == null) return null;\n        PropertyModel model = manager.getCurrentDialogForTest();\n        if (model == null || model.get(ModalDialogProperties.TAB_MODAL_OWNER) != sender) {\n            return null;\n        }\n        View content = model.get(ModalDialogProperties.CUSTOM_VIEW);\n        if (content == null) return null;\n        LinearLayout permissions = content.findViewById(R.id.permissions_container);\n        if (permissions == null) return null;\n        return new InstallDialogHandle(manager, model, permissions);\n    }\n\n    @CalledByNativeForTesting\n    private static @JniType(\"std::vector<std::u16string>\") String[]\n            getInstallDialogPermissionsForTesting(Object capturedDialog) {\n        ThreadUtils.assertOnUiThread();\n        InstallDialogHandle handle = (InstallDialogHandle) capturedDialog;\n        ArrayList<String> messages = new ArrayList<>();\n        for (int i = 0; i < handle.permissions.getChildCount(); ++i) {\n            TextView text =\n                    handle.permissions.getChildAt(i).findViewById(R.id.permission_item_text);\n            if (text != null) messages.add(text.getText().toString());\n        }\n        return messages.toArray(new String[0]);\n    }\n\n    @CalledByNativeForTesting\n    private static boolean clickInstallDialogForTesting(Object capturedDialog, boolean accept) {\n        ThreadUtils.assertOnUiThread();\n        InstallDialogHandle handle = (InstallDialogHandle) capturedDialog;\n        if (handle.manager.getCurrentDialogForTest() != handle.model) return false;\n        handle.model\n                .get(ModalDialogProperties.CONTROLLER)\n                .onClick(\n                        handle.model,\n                        accept\n                                ? ModalDialogProperties.ButtonType.POSITIVE\n                                : ModalDialogProperties.ButtonType.NEGATIVE);\n        return true;\n    }\n\n    @CalledByNativeForTesting\n    private static void dismissInstallDialogForTesting(Object capturedDialog) {\n        ThreadUtils.assertOnUiThread();\n        InstallDialogHandle handle = (InstallDialogHandle) capturedDialog;\n        // ModalDialogManager ignores an already-retired model. Never dismiss an\n        // unrelated current dialog while cleaning up a failed assertion.\n        handle.manager.dismissDialog(handle.model, DialogDismissalCause.UNKNOWN);\n    }\n\n    /**\n     * Loads an unpacked extension from a given directory, and returns a load extension's ID.\n     *\n"
