substitutions:
- description: Use real factory inputs and callback reentrancy in regressions.
  regex:
    pattern: import static org.mockito.Mockito.reset;
    replace: 'import static org.mockito.Mockito.doAnswer;

      import static org.mockito.Mockito.mock;

      import static org.mockito.Mockito.reset;

      import static org.mockito.Mockito.verifyNoMoreInteractions;

      import static org.mockito.Mockito.when;'
- description: Supply weak Android Activity references as WindowAndroid does.
  regex:
    pattern: import org.chromium.ui.modaldialog.DialogDismissalCause;
    replace: 'import java.lang.ref.WeakReference;


      import org.chromium.ui.base.WindowAndroid;

      import org.chromium.ui.modaldialog.DialogDismissalCause;'
- description: Reject unavailable UI and ignore duplicate or reentrant completion callbacks.
  regex:
    pattern: '    /** Helper method to build and show the dialog with standard test data. */'
    replace: "    @Test\n    @SmallTest\n    public void testCreateWithoutActivity() {\n        WindowAndroid window = mock(WindowAndroid.class);\n        when(window.getActivity()).thenReturn(new WeakReference<>(null));\n        when(window.getModalDialogManager()).thenReturn(mModalDialogManager);\n        Assert.assertNull(ExtensionInstallDialogBridge.create(\n                NATIVE_INSTALL_EXTENSION_DIALOG_VIEW, window));\n        verifyNoMoreInteractions(mNativeMock);\n    }\n\n    @Test\n    @SmallTest\n    public void testCreateWithoutModalDialogManager() {\n        WindowAndroid window = mock(WindowAndroid.class);\n        when(window.getActivity()).thenReturn(new WeakReference<>(mActivity));\n        Assert.assertNull(ExtensionInstallDialogBridge.create(\n                NATIVE_INSTALL_EXTENSION_DIALOG_VIEW, window));\n        verifyNoMoreInteractions(mNativeMock);\n    }\n\n    @Test\n    @SmallTest\n    public void testCreateWithFinishingActivity() {\n        WindowAndroid window\
      \ = mock(WindowAndroid.class);\n        when(window.getActivity()).thenReturn(new WeakReference<>(mActivity));\n        when(window.getModalDialogManager()).thenReturn(mModalDialogManager);\n        mActivity.finish();\n        Assert.assertNull(ExtensionInstallDialogBridge.create(\n                NATIVE_INSTALL_EXTENSION_DIALOG_VIEW, window));\n        verifyNoMoreInteractions(mNativeMock);\n    }\n\n    @Test\n    @SmallTest\n    public void testCreateWithDestroyedActivity() {\n        Activity activity = Robolectric.buildActivity(MyTestActivity.class).setup().destroy().get();\n        WindowAndroid window = mock(WindowAndroid.class);\n        when(window.getActivity()).thenReturn(new WeakReference<>(activity));\n        when(window.getModalDialogManager()).thenReturn(mModalDialogManager);\n        Assert.assertNull(ExtensionInstallDialogBridge.create(\n                NATIVE_INSTALL_EXTENSION_DIALOG_VIEW, window));\n        verifyNoMoreInteractions(mNativeMock);\n    }\n\n    @Test\n\
      \    @SmallTest\n    public void testCreateWithAvailableUi() {\n        WindowAndroid window = mock(WindowAndroid.class);\n        when(window.getActivity()).thenReturn(new WeakReference<>(mActivity));\n        when(window.getModalDialogManager()).thenReturn(mModalDialogManager);\n        ExtensionInstallDialogBridge bridge = ExtensionInstallDialogBridge.create(\n                NATIVE_INSTALL_EXTENSION_DIALOG_VIEW, window);\n        Assert.assertNotNull(bridge);\n        bridge.clearNativePtr();\n        verifyNoMoreInteractions(mNativeMock);\n    }\n\n    @Test\n    @SmallTest\n    public void testReentrantAndStaleDismissalCompletesOnce() {\n        buildAndShowDialog();\n        PropertyModel model = mModalDialogManager.getShownDialogModel();\n        doAnswer(invocation -> {\n            mExtensionInstallDialogBridge.onDismiss(model, DialogDismissalCause.UNKNOWN);\n            return null;\n        }).when(mNativeMock).onDialogAccepted(NATIVE_INSTALL_EXTENSION_DIALOG_VIEW, \"\"\
      );\n\n        mModalDialogManager.clickPositiveButton();\n        mExtensionInstallDialogBridge.onDismiss(model, DialogDismissalCause.POSITIVE_BUTTON_CLICKED);\n        mExtensionInstallDialogBridge.onDismiss(model, DialogDismissalCause.NEGATIVE_BUTTON_CLICKED);\n\n        verify(mNativeMock).onDialogAccepted(NATIVE_INSTALL_EXTENSION_DIALOG_VIEW, \"\");\n        verify(mNativeMock).destroy(NATIVE_INSTALL_EXTENSION_DIALOG_VIEW);\n        verifyNoMoreInteractions(mNativeMock);\n    }\n\n    /** Helper method to build and show the dialog with standard test data. */"
