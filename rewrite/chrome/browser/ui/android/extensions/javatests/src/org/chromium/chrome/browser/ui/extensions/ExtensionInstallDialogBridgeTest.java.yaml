  regex:
    pattern: "    /**\n     * Tests that clicking on the store link calls native method when active, and does not call it\n"
    replace: "    @Test\n    @SmallTest\n    public void testWebstoreRatingsVisibleWithRealLayout() {\n        View contentView =\n                LayoutInflater.from(mActivity).inflate(R.layout.extension_install_dialog, null);\n        mExtensionInstallDialogBridge.setContentViewForTesting(contentView);\n        mActivity.setContentView(contentView);\n\n        RatingBar ratingBar = contentView.findViewById(R.id.webstore_rating_bar);\n        TextView ratingCount = contentView.findViewById(R.id.webstore_user_count);\n        Assert.assertFalse(\"Ratings should stay hidden without store data\", ratingBar.isShown());\n        Assert.assertFalse(\"Rating count should stay hidden without store data\", ratingCount.isShown());\n\n        mExtensionInstallDialogBridge.withWebstoreData(\n                \"View in store\", \"42 ratings\", \"1,000 users\", 4.5, \"https://example.com/store\");\n        buildAndShowDialog();\n\n        Assert.assertSame(\n                contentView,\n                mModalDialogManager.getShownDialogModel().get(ModalDialogProperties.CUSTOM_VIEW));\n        Assert.assertTrue(\"Supplied store rating should be visible\", ratingBar.isShown());\n        Assert.assertEquals(4.5f, ratingBar.getRating(), 0.0f);\n        Assert.assertTrue(\"Supplied rating count should be visible\", ratingCount.isShown());\n        Assert.assertEquals(\"42 ratings\", ratingCount.getText().toString());\n    }\n\n    /**\n     * Tests that clicking on the store link calls native method when active, and does not call it\n"
