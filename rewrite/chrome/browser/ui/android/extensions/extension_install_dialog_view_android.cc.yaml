substitutions:
- description: A missing Java dialog has no pointer to clear during native cleanup.
  regex:
    pattern: '  Java_ExtensionInstallDialogBridge_clearNativePtr(env, java_object_);'
    replace: "  if (!java_object_.is_null()) {\n    Java_ExtensionInstallDialogBridge_clearNativePtr(env, java_object_);\n  }"
- description: Abort once when the window cannot supply an Activity or dialog manager.
  regex:
    pattern: "      env, reinterpret_cast<intptr_t>(this), window_android->GetJavaObject()));\n\n  BuildPropertyModel();"
    replace: "      env, reinterpret_cast<intptr_t>(this), window_android->GetJavaObject()));\n  if (java_object_.is_null()) {\n    // No Java object exists to dismiss or destroy this self-owned view. Move\n    // the callback out before deleting it so the destructor cannot report a\n    // second result. A missing UI must never become an installation approval.\n    prompt_->OnDialogCanceled();\n    auto done_callback = std::move(done_callback_);\n    delete this;\n    if (done_callback) {\n      std::move(done_callback)\n          .Run(ExtensionInstallPrompt::DoneCallbackPayload(\n              ExtensionInstallPrompt::Result::ABORTED));\n    }\n    return;\n  }\n\n  BuildPropertyModel();"
