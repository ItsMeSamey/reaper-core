substitutions:
- description: Use the existing Android minimum touch-target dimension for extension menu controls.
  regex:
    re_pattern: '\ \ \ \ <dimen\ name="extensions_menu_footer_min_height">40dp</dimen>\

      '
    replace: '    <dimen name="extensions_menu_footer_min_height">@dimen/min_touch_target_size</dimen>

      '
