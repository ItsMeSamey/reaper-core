substitutions:
- description: Use the existing Android minimum touch-target dimension for extension menu controls.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ android:id="@\+id/extensions_menu_item_site_permissions_layout"\

      \ \ \ \ \ \ \ \ android:layout_width="wrap_content"\

      \ \ \ \ \ \ \ \ android:layout_height="wrap_content"\

      '
    replace: "        android:id=\"@+id/extensions_menu_item_site_permissions_layout\"\n        android:layout_width=\"\
      wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:minWidth=\"@dimen/min_touch_target_size\"\
      \n        android:minHeight=\"@dimen/min_touch_target_size\"\n"
- description: Let Android extension names grow vertically while preserving the 48dp primary-action
    touch minimum
  regex:
    re_pattern: '\ \ \ \ <androidx\.constraintlayout\.widget\.ConstraintLayout\

      \ \ \ \ \ \ \ \ android:layout_width="match_parent"\

      \ \ \ \ \ \ \ \ android:layout_height="48dp"\ >\

      \

      \ \ \ \ \ \ \ \ <androidx\.constraintlayout\.widget\.ConstraintLayout\

      \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/extensions_menu_item_primary_action"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:layout_width="0dp"\

      \ \ \ \ \ \ \ \ \ \ \ \ android:layout_height="match_parent"\

      '
    replace: "    <androidx.constraintlayout.widget.ConstraintLayout\n        android:layout_width=\"\
      match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:minHeight=\"\
      48dp\" >\n\n        <androidx.constraintlayout.widget.ConstraintLayout\n            android:id=\"\
      @+id/extensions_menu_item_primary_action\"\n            android:layout_width=\"0dp\"\n\
      \            android:layout_height=\"wrap_content\"\n            android:minHeight=\"\
      48dp\"\n"
  count: 1
