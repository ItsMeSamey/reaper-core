substitutions:
- description: Use existing localized Android extension site-permissions labels
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/extensions_menu_site_permissions_title"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:layout_width="match_parent"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:layout_height="wrap_content"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:text="Site\ Permissions"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:textAppearance="@style/TextAppearance\.TextMedium\.Primary"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:paddingHorizontal="@dimen/extensions_menu_horizontal_padding"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:paddingVertical="@dimen/extensions_menu_toggle_vertical_padding"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tools:ignore="HardcodedText"\ />\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ <org\.chromium\.components\.browser_ui\.widget\.RadioButtonWithDescriptionLayout\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/extensions_menu_site_permissions_radio_group"\

      '
    replace: "                android:id=\"@+id/extensions_menu_site_permissions_title\"\n                android:layout_width=\"match_parent\"\n                android:layout_height=\"wrap_content\"\n                android:text=\"@string/extensions_menu_site_permissions_page_site_access_label\"\n                android:textAppearance=\"@style/TextAppearance.TextMedium.Primary\"\n                android:paddingHorizontal=\"@dimen/extensions_menu_horizontal_padding\"\n                android:paddingVertical=\"@dimen/extensions_menu_toggle_vertical_padding\" />\n\n            <org.chromium.components.browser_ui.widget.RadioButtonWithDescriptionLayout\n                android:id=\"@+id/extensions_menu_site_permissions_radio_group\"\n"
- description: Use existing localized Android extension site-permissions labels
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:layout_width="match_parent"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:layout_height="wrap_content"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:background="@drawable/extensions_menu_background_selector"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:primaryText="Ask\ on\ every\ visit"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:descriptionText="Runs\ only\ after\ you\ click\ the\ extension"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:primaryTextAppearance="@style/TextAppearance\.TextMedium\.Primary\.Baseline"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:descriptionTextAppearance="@style/TextAppearance\.TextSmall\.Secondary\.Baseline"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tools:ignore="HardcodedText"\ />\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ <org\.chromium\.components\.browser_ui\.widget\.RadioButtonWithDescription\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/extensions_menu_site_permissions_on_site"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:layout_width="match_parent"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:layout_height="wrap_content"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:background="@drawable/extensions_menu_background_selector"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:primaryText="Always\ on"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:descriptionText="Runs\ automatically\ every\ time\ you\ visit\ this\ site"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:primaryTextAppearance="@style/TextAppearance\.TextMedium\.Primary\.Baseline"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:descriptionTextAppearance="@style/TextAppearance\.TextSmall\.Secondary\.Baseline"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tools:ignore="HardcodedText"\ />\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ <org\.chromium\.components\.browser_ui\.widget\.RadioButtonWithDescription\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/extensions_menu_site_permissions_on_all_sites"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:layout_width="match_parent"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:layout_height="wrap_content"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:background="@drawable/extensions_menu_background_selector"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:primaryText="Always\ on\ all\ sites"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:descriptionText="Runs\ automatically\ on\ all\ sites\ you\ visit"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:primaryTextAppearance="@style/TextAppearance\.TextMedium\.Primary\.Baseline"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ app:descriptionTextAppearance="@style/TextAppearance\.TextSmall\.Secondary\.Baseline"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tools:ignore="HardcodedText"\ />\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ </org\.chromium\.components\.browser_ui\.widget\.RadioButtonWithDescriptionLayout>\

      \

      '
    replace: "                    android:layout_width=\"match_parent\"\n                    android:layout_height=\"wrap_content\"\n                    android:background=\"@drawable/extensions_menu_background_selector\"\n                    app:descriptionText=\"@string/extensions_menu_site_permissions_page_site_access_on_click_description\"\n                    app:primaryTextAppearance=\"@style/TextAppearance.TextMedium.Primary.Baseline\"\n                    app:descriptionTextAppearance=\"@style/TextAppearance.TextSmall.Secondary.Baseline\" />\n\n                <org.chromium.components.browser_ui.widget.RadioButtonWithDescription\n                    android:id=\"@+id/extensions_menu_site_permissions_on_site\"\n                    android:layout_width=\"match_parent\"\n                    android:layout_height=\"wrap_content\"\n                    android:background=\"@drawable/extensions_menu_background_selector\"\n                    app:descriptionText=\"@string/extensions_menu_site_permissions_page_site_access_on_site_description\"\n                    app:primaryTextAppearance=\"@style/TextAppearance.TextMedium.Primary.Baseline\"\n                    app:descriptionTextAppearance=\"@style/TextAppearance.TextSmall.Secondary.Baseline\" />\n\n                <org.chromium.components.browser_ui.widget.RadioButtonWithDescription\n                    android:id=\"@+id/extensions_menu_site_permissions_on_all_sites\"\n                    android:layout_width=\"match_parent\"\n                    android:layout_height=\"wrap_content\"\n                    android:background=\"@drawable/extensions_menu_background_selector\"\n                    app:descriptionText=\"@string/extensions_menu_site_permissions_page_site_access_on_all_sites_description\"\n                    app:primaryTextAppearance=\"@style/TextAppearance.TextMedium.Primary.Baseline\"\n                    app:descriptionTextAppearance=\"@style/TextAppearance.TextSmall.Secondary.Baseline\" />\n\n            </org.chromium.components.browser_ui.widget.RadioButtonWithDescriptionLayout>\n\n"
- description: Use existing localized Android extension site-permissions labels
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ <TextView\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/extensions_menu_show_requests_toggle_text"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ style="@style/ExtensionsMenuControlText"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:text="Allowed\ to\ show\ requests\ in\ the\ toolbar"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:layout_marginStart="8dp"\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tools:ignore="HardcodedText"\ />\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ <!\-\-\ TODO\(crbug\.com/471016912\):\ Use\ string\ from\ view\ model\ \-\->\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ <com\.google\.android\.material\.materialswitch\.MaterialSwitch\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ android:id="@\+id/extensions_menu_show_requests_toggle"\

      '
    replace: "                <TextView\n                    android:id=\"@+id/extensions_menu_show_requests_toggle_text\"\n                    style=\"@style/ExtensionsMenuControlText\"\n                    android:text=\"@string/extensions_menu_site_permissions_page_show_requests_label\"\n                    android:layout_marginStart=\"8dp\" />\n\n                <com.google.android.material.materialswitch.MaterialSwitch\n                    android:id=\"@+id/extensions_menu_show_requests_toggle\"\n"
