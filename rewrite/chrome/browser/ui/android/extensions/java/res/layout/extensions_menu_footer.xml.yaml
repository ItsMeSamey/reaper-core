substitutions:
- description: Give the independently clickable Android pinning switch its existing localized purpose name
  regex:
    pattern: '            android:id="@+id/extensions_menu_button_pinning_toggle"

      '
    replace: "            android:id=\"@+id/extensions_menu_button_pinning_toggle\"\n            android:contentDescription=\"\
      @string/extensions_pin_to_toolbar_setting\"\n"
  count: 1
- description: Keep one labeled keyboard stop for Android extension menu pinning while preserving row clicks.
  regex:
    pattern: "        style=\"@style/ExtensionsMenuControlRow\"\n        android:paddingHorizontal=\"@dimen/extensions_menu_horizontal_padding\" >"
    replace: "        style=\"@style/ExtensionsMenuControlRow\"\n        android:focusable=\"false\"\n        android:paddingHorizontal=\"@dimen/extensions_menu_horizontal_padding\" >"
  count: 1
