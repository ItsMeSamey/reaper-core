substitutions:

  - description: "Revalidate stale or invalid Android keyword suggestions before checked event routing."
    regex:
      pattern: "  GURL url(url_str);\n  std::string extension_id(url.host());"
      replace: "  GURL url(url_str);\n  if (!web_contents || web_contents->IsBeingDestroyed() ||\n      !extensions::ExtensionOmniboxEventRouter::IsValidAndroidInput(\n          Profile::FromBrowserContext(web_contents->GetBrowserContext()), url)) {\n    return;\n  }\n  std::string extension_id(url.host());"
