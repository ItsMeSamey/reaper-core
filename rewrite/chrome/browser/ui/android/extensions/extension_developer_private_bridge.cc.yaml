substitutions:
  - description: Durable Android unpacked import lifecycle integration and recovery regression
    regex:
      pattern: "// Copyright 2025 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\n#include \"chrome/browser/ui/android/extensions/extension_developer_private_bridge.h\"\n\n#include \"base/android/jni_android.h\"\n#include \"base/android/jni_string.h\"\n#include \"chrome/browser/ui/android/extensions/jni_headers/ExtensionDeveloperPrivateBridge_jni.h\"\n\nnamespace extensions {\n\n// static\nvoid ExtensionDeveloperPrivateBridge::ShowSiteSettings(\n    const std::string& extension_id) {\n  JNIEnv* env = base::android::AttachCurrentThread();\n  Java_ExtensionDeveloperPrivateBridge_showSiteSettings(env, extension_id);\n}\n\n}  // namespace extensions\n\nDEFINE_JNI(ExtensionDeveloperPrivateBridge)\n"
      replace: "// Copyright 2025 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\n#include \"chrome/browser/ui/android/extensions/extension_developer_private_bridge.h\"\n\n#include <map>\n#include <utility>\n\n#include \"base/android/content_uri_utils.h\"\n#include \"base/android/jni_android.h\"\n#include \"base/android/jni_string.h\"\n#include \"base/feature_list.h\"\n#include \"base/files/file_util.h\"\n#include \"base/functional/bind.h\"\n#include \"base/functional/callback_helpers.h\"\n#include \"base/memory/weak_ptr.h\"\n#include \"base/no_destructor.h\"\n#include \"base/strings/utf_string_conversions.h\"\n#include \"base/task/bind_post_task.h\"\n#include \"base/uuid.h\"\n#include \"chrome/browser/android/tab_android.h\"\n#include \"chrome/browser/extensions/extension_management.h\"\n#include \"chrome/browser/profiles/profile.h\"\n#include \"chrome/browser/supervised_user/supervised_user_browser_utils.h\"\n#include \"chrome/browser/ui/android/extensions/jni_headers/ExtensionDeveloperPrivateBridge_jni.h\"\n#include \"chrome/browser/ui/android/extensions/jni_headers/ReaperExtensionImportCoordinator_jni.h\"\n#include \"chrome/browser/ui/select_file_policy/chrome_select_file_policy.h\"\n#include \"chrome/common/pref_names.h\"\n#include \"chrome/common/url_constants.h\"\n#include \"components/prefs/pref_service.h\"\n#include \"content/public/browser/browser_thread.h\"\n#include \"content/public/browser/render_frame_host.h\"\n#include \"content/public/browser/web_contents.h\"\n#include \"content/public/common/url_constants.h\"\n#include \"extensions/browser/unpacked_installer.h\"\n#include \"ui/android/ui_android_features.h\"\n#include \"ui/android/window_android.h\"\n\nnamespace extensions {\nnamespace {\n\n// Only live-process callbacks reside here. Neither a pointer nor this map is\n// serialized.\nstruct PendingUnpackedImport {\n  base::WeakPtr<content::WebContents> source;\n  ExtensionDeveloperPrivateBridge::UnpackedSelectionCallback callback;\n};\n\nstd::map<std::string, PendingUnpackedImport>& PendingImports() {\n  static base::NoDestructor<std::map<std::string, PendingUnpackedImport>>\n      pending;\n  return *pending;\n}\n\nvoid CompleteJavaImport(const std::string& id, std::string error) {\n  Java_ReaperExtensionImportCoordinator_onNativeComplete(\n      base::android::AttachCurrentThread(), id, error);\n}\n\nbool IsExtensionsManager(content::WebContents* source) {\n  if (!source || source->IsBeingDestroyed())\n    return false;\n  auto* frame = source->GetPrimaryMainFrame();\n  if (!frame || !frame->IsActive() || !frame->IsRenderFrameLive())\n    return false;\n  const GURL& url = source->GetLastCommittedURL();\n  return url.SchemeIs(content::kChromeUIScheme) &&\n         url.host() == chrome::kChromeUIExtensionsHost;\n}\n\nvoid FinishImportError(const std::string& id, const std::string& error) {\n  auto node = PendingImports().extract(id);\n  if (!node.empty()) {\n    const bool original_can_report =\n        IsExtensionsManager(node.mapped().source.get());\n    if (!original_can_report)\n      CompleteJavaImport(id, error);\n    const std::string display_error =\n        Java_ReaperExtensionImportCoordinator_localizeError(\n            base::android::AttachCurrentThread(), error);\n    std::move(node.mapped().callback).Run(base::FilePath(), display_error);\n    // A live original WebUI reports the error; a destroyed page cannot do so.\n    if (original_can_report)\n      CompleteJavaImport(id, std::string());\n  } else {\n    CompleteJavaImport(id, error);\n  }\n}\n\n}  // namespace\n\nExtensionDeveloperPrivateBridge::UnpackedInstallCompletion\nExtensionDeveloperPrivateBridge::MakeUnpackedImportCompletion(\n    base::OnceCallback<void(std::string)> terminal) {\n  auto callbacks = base::SplitOnceCallback(std::move(terminal));\n  base::ScopedClosureRunner abandoned(base::BindPostTaskToCurrentDefault(\n      base::BindOnce(std::move(callbacks.second),\n                     std::string(\"reaper.import.interrupted\"))));\n  return base::BindOnce(\n      [](base::OnceCallback<void(std::string)> completed,\n         base::ScopedClosureRunner abandoned, const Extension* extension,\n         const base::FilePath& path, const std::u16string& error) {\n        static_cast<void>(abandoned.Release());\n        std::move(completed).Run(extension ? std::string()\n                                           : base::UTF16ToUTF8(error));\n      },\n      std::move(callbacks.first), std::move(abandoned));\n}\n\n// Shared with the ordinary developerPrivate entry so restoration cannot omit\n// its checks.\nstd::string ExtensionDeveloperPrivateBridge::UnpackedImportPolicyError(\n    Profile* profile) {\n  if (!profile)\n    return \"Could not find the original profile.\";\n  if (supervised_user::AreExtensionsPermissionsEnabled(profile)) {\n    return \"Child account users cannot load unpacked extensions.\";\n  }\n  if (!profile->GetPrefs()->GetBoolean(prefs::kExtensionsUIDeveloperMode)) {\n    return \"Must be in developer mode to load unpacked extensions.\";\n  }\n  if (ExtensionManagementFactory::GetForBrowserContext(profile)\n          ->BlocklistedByDefault()) {\n    return \"Extension installation is blocked by policy.\";\n  }\n  return {};\n}\n\nbool ExtensionDeveloperPrivateBridge::StartUnpackedImport(\n    content::WebContents* source,\n    UnpackedSelectionCallback callback,\n    std::string* request_id) {\n  DCHECK_CURRENTLY_ON(content::BrowserThread::UI);\n  auto* tab = source ? TabAndroid::FromWebContents(source) : nullptr;\n  auto* window = source ? source->GetTopLevelNativeWindow() : nullptr;\n  auto* profile = source\n                      ? Profile::FromBrowserContext(source->GetBrowserContext())\n                      : nullptr;\n  if (!tab || !window || !IsExtensionsManager(source) || !profile ||\n      profile->IsOffTheRecord() ||\n      !UnpackedImportPolicyError(profile).empty()) {\n    return false;\n  }\n  ChromeSelectFilePolicy picker_policy(source);\n  if (!picker_policy.CanOpenSelectFileDialog()) {\n    picker_policy.SelectFileDenied();\n    return false;\n  }\n  const std::string id = base::Uuid::GenerateRandomV4().AsLowercaseString();\n  PendingImports().emplace(\n      id, PendingUnpackedImport{source->GetWeakPtr(), std::move(callback)});\n  const bool started = Java_ReaperExtensionImportCoordinator_start(\n      base::android::AttachCurrentThread(), window->GetJavaObject(),\n      source->GetJavaWebContents(), id, profile->GetBaseName().AsUTF8Unsafe(),\n      profile->GetCreationTime().ToDeltaSinceWindowsEpoch().InMicroseconds(),\n      tab->GetAndroidId(),\n      base::FeatureList::IsEnabled(ui::kCheckIntentCallerPermission));\n  if (!started) {\n    PendingImports().erase(id);\n    return false;\n  }\n  *request_id = id;\n  return true;\n}\n\nvoid ExtensionDeveloperPrivateBridge::ForgetUnpackedImport(\n    const std::string& id) {\n  PendingImports().erase(id);\n}\n\nvoid ExtensionDeveloperPrivateBridge::CompleteUnpackedImport(\n    const std::string& id,\n    const std::string& error) {\n  PendingImports().erase(id);\n  if (!id.empty())\n    CompleteJavaImport(id, error);\n}\n\n// Java calls only for its own recorded request and a matching RESULT_OK\n// receipt, never because a persisted URI grant happens to exist. DISPATCHING\n// after process loss is an interrupted operation, not permission to repeat an\n// install of uncertain outcome.\nstatic int32_t JNI_ReaperExtensionImportCoordinator_Resume(\n    JNIEnv* env,\n    content::WebContents* source,\n    int32_t tab_id,\n    const std::string& id,\n    const std::string& profile_name,\n    int64_t profile_creation,\n    int32_t state,\n    const std::string& uri) {\n  constexpr int kDeferred = 0;\n  constexpr int kStarted = 1;\n  constexpr int kFinished = 2;\n  constexpr int kApproved = 2;\n  constexpr int kCancelled = 3;\n  constexpr int kFailed = 4;\n  constexpr int kInterrupted = 5;\n  DCHECK_CURRENTLY_ON(content::BrowserThread::UI);\n  auto* tab = source ? TabAndroid::FromWebContents(source) : nullptr;\n  auto* profile = source\n                      ? Profile::FromBrowserContext(source->GetBrowserContext())\n                      : nullptr;\n  if (!source || source->IsBeingDestroyed() || !tab || !profile ||\n      tab->GetAndroidId() != tab_id ||\n      profile->GetBaseName().AsUTF8Unsafe() != profile_name ||\n      profile->GetCreationTime().ToDeltaSinceWindowsEpoch().InMicroseconds() !=\n          profile_creation) {\n    return kDeferred;\n  }\n  // A restored tab may not have created/committed its WebUI yet. The activity\n  // tab observer retries on content/page readiness; do not mislabel startup as\n  // a changed source.\n  auto* frame = source->GetPrimaryMainFrame();\n  if (!frame || !frame->IsRenderFrameLive() ||\n      source->GetLastCommittedURL().is_empty()) {\n    return kDeferred;\n  }\n  if (!base::Uuid::ParseLowercase(id).is_valid() || profile->IsOffTheRecord() ||\n      !IsExtensionsManager(source)) {\n    FinishImportError(id, \"reaper.import.source_changed\");\n    return kFinished;\n  }\n  if (state != kApproved) {\n    if (state == kCancelled) {\n      auto cancelled = PendingImports().extract(id);\n      if (!cancelled.empty()) {\n        std::move(cancelled.mapped().callback)\n            .Run(base::FilePath(), \"File selection was canceled.\");\n      }\n      CompleteJavaImport(id, std::string());\n      return kFinished;\n    }\n    if (state == kFailed || state == kInterrupted) {\n      FinishImportError(id, \"reaper.import.interrupted\");\n      return kFinished;\n    }\n    return kDeferred;\n  }\n  const std::string policy_error =\n      ExtensionDeveloperPrivateBridge::UnpackedImportPolicyError(profile);\n  if (!policy_error.empty()) {\n    FinishImportError(id, policy_error);\n    return kFinished;\n  }\n  if (!ChromeSelectFilePolicy::FileSelectDialogsAllowed()) {\n    FinishImportError(id, \"reaper.import.file_policy_blocked\");\n    return kFinished;\n  }\n  const base::FilePath selected(uri);\n  if (!selected.IsContentUri()) {\n    FinishImportError(id, \"reaper.import.folder_unavailable\");\n    return kFinished;\n  }\n  auto live = PendingImports().extract(id);\n  if (!live.empty() && live.mapped().source.get() == source) {\n    std::move(live.mapped().callback).Run(selected, std::string());\n    return kStarted;\n  }\n  if (!live.empty()) {\n    // Notify the resumed manager before retiring the old callback: its Finish()\n    // also clears the receipt and the old page may no longer render any error.\n    CompleteJavaImport(id, \"reaper.import.source_changed\");\n    std::move(live.mapped().callback)\n        .Run(base::FilePath(), \"The original extension page was recreated.\");\n    return kFinished;\n  }\n  auto virtual_path = base::ResolveToVirtualDocumentPath(selected);\n  if (!virtual_path) {\n    FinishImportError(id, \"reaper.import.folder_unavailable\");\n    return kFinished;\n  }\n  auto installer = UnpackedInstaller::Create(profile);\n  installer->set_be_noisy_on_failure(false);\n  // Shutdown may drop rather than invoke UnpackedInstaller's callback.\n  installer->set_completion_callback(\n      ExtensionDeveloperPrivateBridge::MakeUnpackedImportCompletion(\n          base::BindOnce(&CompleteJavaImport, id)));\n  installer->Load(*virtual_path);\n  return kStarted;\n}\n\n// Retire-only operation, invoked only after Java's explicit cancellation\n// confirmation. A closed/replaced original tab must not permanently block all\n// future imports. This path never resolves a URI, creates an installer or\n// activates the old profile.\nstatic bool JNI_ReaperExtensionImportCoordinator_Discard(\n    JNIEnv* env,\n    content::WebContents* source,\n    int32_t current_tab_id,\n    const std::string& id) {\n  DCHECK_CURRENTLY_ON(content::BrowserThread::UI);\n  auto* tab = source ? TabAndroid::FromWebContents(source) : nullptr;\n  if (!tab || tab->GetAndroidId() != current_tab_id ||\n      !IsExtensionsManager(source) ||\n      !base::Uuid::ParseLowercase(id).is_valid()) {\n    return false;\n  }\n  auto node = PendingImports().extract(id);\n  if (!node.empty()) {\n    std::move(node.mapped().callback)\n        .Run(base::FilePath(), \"File selection was canceled.\");\n  }\n  CompleteJavaImport(id, std::string());\n  return true;\n}\n\n// static\nvoid ExtensionDeveloperPrivateBridge::ShowSiteSettings(\n    const std::string& extension_id) {\n  JNIEnv* env = base::android::AttachCurrentThread();\n  Java_ExtensionDeveloperPrivateBridge_showSiteSettings(env, extension_id);\n}\n\n}  // namespace extensions\n\nDEFINE_JNI(ExtensionDeveloperPrivateBridge)\nDEFINE_JNI(ReaperExtensionImportCoordinator)\n"
    count: 1
