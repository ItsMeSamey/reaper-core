substitutions:
- description: Repair reviewed AN Android native compiler integration errors without changing intended behavior
  regex:
    re_pattern: '//\ Copyright\ 2026\ The\ Chromium\ Authors\

      //\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      //\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ <string>\

      \

      '
    replace: '// Copyright 2026 The Chromium Authors

      // Use of this source code is governed by a BSD-style license that can be

      // found in the LICENSE file.


      #include "brave/browser/extensions/android/extension_test_utils.h"


      #include <string>


      '
- description: Repair reviewed AN Android native compiler integration errors without changing intended behavior
  regex:
    re_pattern: 'using\ base::FilePath;\

      \

      namespace\ extensions\ \{\

      \

      static\ void\ JNI_ExtensionTestUtils_LoadUnpackedExtensionAsync\(\

      \ \ \ \ JNIEnv\*\ env,\

      '
    replace: "using base::FilePath;\n\nnamespace extensions {\n\nnamespace android_test {\n\nbase::android::ScopedJavaLocalRef<jobject> CaptureInstallDialogForTesting(\n    JNIEnv* env,\n    content::WebContents* sender) {\n  return Java_ExtensionTestUtils_captureInstallDialogForTesting(env, sender);\n}\n\nstd::vector<std::u16string> GetInstallDialogPermissionsForTesting(\n    JNIEnv* env,\n    const base::android::JavaRef<jobject>& dialog) {\n  return Java_ExtensionTestUtils_getInstallDialogPermissionsForTesting(\n      env, dialog);\n}\n\nbool ClickInstallDialogForTesting(\n    JNIEnv* env,\n    const base::android::JavaRef<jobject>& dialog,\n    bool accept) {\n  return Java_ExtensionTestUtils_clickInstallDialogForTesting(\n      env, dialog, accept);\n}\n\nvoid DismissInstallDialogForTesting(\n    JNIEnv* env,\n    const base::android::JavaRef<jobject>& dialog) {\n  Java_ExtensionTestUtils_dismissInstallDialogForTesting(env, dialog);\n}\n\nbase::android::ScopedJavaLocalRef<jobject> CaptureDownloadOpenDialogForTesting(\n    JNIEnv* env,\n    content::WebContents* sender,\n    const std::u16string& expected_title,\n    bool include_pending) {\n  return Java_ExtensionTestUtils_captureDownloadOpenDialogForTesting(\n      env, sender, expected_title, include_pending);\n}\n\nstd::vector<std::u16string> GetDownloadOpenDialogParagraphsForTesting(\n    JNIEnv* env,\n    const base::android::JavaRef<jobject>& dialog) {\n  return Java_ExtensionTestUtils_getDownloadOpenDialogParagraphsForTesting(\n      env, dialog);\n}\n\nbool ClickDownloadOpenDialogForTesting(\n    JNIEnv* env,\n    const base::android::JavaRef<jobject>& dialog,\n    bool accept) {\n  return Java_ExtensionTestUtils_clickDownloadOpenDialogForTesting(\n      env, dialog, accept);\n}\n\nvoid DismissDownloadOpenDialogForTesting(\n    JNIEnv* env,\n    const base::android::JavaRef<jobject>& dialog) {\n  Java_ExtensionTestUtils_dismissDownloadOpenDialogForTesting(env, dialog);\n}\n\n}  // namespace android_test\n\nstatic void JNI_ExtensionTestUtils_LoadUnpackedExtensionAsync(\n    JNIEnv* env,\n"
