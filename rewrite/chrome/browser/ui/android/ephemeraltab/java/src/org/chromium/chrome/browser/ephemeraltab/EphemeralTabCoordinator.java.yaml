substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove the Actor UI implementation dependency while retaining ordinary
    browser reading/preview behavior
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController;\

      '
    replace: ''
- description: Open the ordinary ephemeral preview directly with all original navigation
    and initiator parameters
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ Runnable\ openSheetRunnable\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ requestOpenSheetInternal\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ url,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ fullPageUrl,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ title,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ profile,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ canPromoteToNewTab,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ shouldHaveContextMenu,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ initiatorOrigin,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ additionalNavigationParams\);\

      \

      \ \ \ \ \ \ \ \ Tab\ activeTab\ =\ mTabProvider\.get\(\);\

      \ \ \ \ \ \ \ \ if\ \(activeTab\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ ActorUiTabController\ controller\ =\ ActorUiTabController\.from\(activeTab\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(controller\ !=\ null\ \&\&\ controller\.isActorActive\(\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Intercept,\ show\ abort\ confirmation\ dialog,\
      and\ stop\ task\ if\ confirmed\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ controller\.showTaskAbortConfirmationDialog\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(confirmed\)\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!confirmed\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ requestDeniedCallback\.run\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ openSheetRunnable\.run\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ openSheetRunnable\.run\(\);\

      '
    replace: "        requestOpenSheetInternal(\n                url,\n          \
      \      fullPageUrl,\n                title,\n                profile,\n    \
      \            canPromoteToNewTab,\n                shouldHaveContextMenu,\n \
      \               initiatorOrigin,\n                additionalNavigationParams);\n"
