# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/ephemeraltab/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/android:ui_utils_java",\

      \ \ \ \ "//url:gurl_java",\

      \ \ \]\

      \ \ resources_package\ =\ "org\.chromium\.chrome\.browser\.ephemeraltab"\

      \}\

      \

      '
    replace: "    \"//ui/android:ui_utils_java\",\n    \"//url:gurl_java\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/actor/android:java\" ]\n  }\n  resources_package = \"org.chromium.chrome.browser.ephemeraltab\"\n}\n\n"
