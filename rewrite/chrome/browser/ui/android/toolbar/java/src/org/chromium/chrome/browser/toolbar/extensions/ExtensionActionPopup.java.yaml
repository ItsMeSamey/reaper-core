substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ private\ class\ ContentsDelegate\ implements\ ExtensionActionPopupContents\.Delegate\ \{\

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ void\ resizeDueToAutoResize\(int\ width,\ int\ height\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(Build\.VERSION\.SDK_INT\ >=\ 34\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Disable\ transition\ animations\ for\ the\ popup\ window\.\ On\ Android,\ \{@link\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ onLoaded\(\)\}\ is\ called\ first,\ and\ then\ \{@link\ resizeDueToAutoResize\(\)\}\ is\ called\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ A\ transition\ would\ result\ in\ a\ sliding\ animation\ from\ the\ original\ bounds\ to\ the\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ updated\ bounds\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/478100096\):\ Figure\ out\ what\ to\ do\ for\ lower\ API\ levels\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\(WindowManager\.LayoutParams\)\ mContentView\.getRootView\(\)\.getLayoutParams\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.setCanPlayMoveAnimation\(false\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ int\ targetWidthPx\ =\ ViewUtils\.dpToPx\(mActivity,\ width\);\

      '
    replace: "    private class ContentsDelegate implements ExtensionActionPopupContents.Delegate {\n        @Override\n        public void resizeDueToAutoResize(int width, int height) {\n            if (Build.VERSION.SDK_INT >= 34\n                    && mContentView.getRootView().getLayoutParams()\n                            instanceof WindowManager.LayoutParams popupLayoutParams) {\n                // The content can resize before the popup owns a window. Disable move\n                // animations only for an actual window, while retaining early desired sizing.\n                // TODO(crbug.com/478100096): Figure out what to do for lower API levels.\n                popupLayoutParams.setCanPlayMoveAnimation(false);\n            }\n\n            int targetWidthPx = ViewUtils.dpToPx(mActivity, width);\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "import\\ org\\.chromium\\.base\\.Callback;\\\n"
    replace: "import org.chromium.base.Callback;\nimport org.chromium.base.ObserverList;\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ final\\ Callback<@Nullable\\ Tab>\\ mCurrentTabObserver;\\\n"
    replace: "    private final Callback<@Nullable Tab> mCurrentTabObserver;\n    private final ObserverList<OnDismissListener> mDismissListeners = new ObserverList<>();\n    private boolean mDestroyed;\n    private boolean mDismissNotified;\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ mPopupWindow\\.setHorizontalOverlapAnchor\\(true\\);\\\n"
    replace: "        mPopupWindow.addOnDismissListener(this::notifyDismissed);\n        mPopupWindow.setHorizontalOverlapAnchor(true);\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "\\ \\ \\ \\ public\\ void\\ destroy\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mTabModelSelector\\.getCurrentTabSupplier\\(\\)\\.removeObserver\\(mCurrentTabObserver\\);\\\n"
    replace: "    public void destroy() {\n        if (mDestroyed) return;\n        mDestroyed = true;\n        mContents.setDelegate(null);\n        mTabModelSelector.getCurrentTabSupplier().removeObserver(mCurrentTabObserver);\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "\\ \\ \\ \\ public\\ void\\ loadInitialPage\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mContents\\.loadInitialPage\\(\\);\\\n"
    replace: "    public void loadInitialPage() {\n        if (mDestroyed) return;\n        mContents.loadInitialPage();\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "\\ \\ \\ \\ public\\ void\\ addOnDismissListener\\(OnDismissListener\\ listener\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mPopupWindow\\.addOnDismissListener\\(listener\\);\\\n\\ \\ \\ \\ \\}\\\n"
    replace: "    public void addOnDismissListener(OnDismissListener listener) {\n        mDismissListeners.addObserver(listener);\n    }\n\n    private void notifyDismissed() {\n        if (mDismissNotified) return;\n        mDismissNotified = true;\n        for (OnDismissListener listener : mDismissListeners) listener.onDismiss();\n        mDismissListeners.clear();\n    }\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ public\\ void\\ resizeDueToAutoResize\\(int\\ width,\\ int\\ height\\)\\ \\{\\\n"
    replace: "        public void resizeDueToAutoResize(int width, int height) {\n            if (mDestroyed) return;\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ public\\ boolean\\ handleKeyboardEvent\\(@Nullable\\ KeyEvent\\ event\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ return\\ ExtensionActionPopup\\.handleKeyboardEvent\\(mActivity,\\ event\\);\\\n"
    replace: "        public boolean handleKeyboardEvent(@Nullable KeyEvent event) {\n            if (mDestroyed) return false;\n            return ExtensionActionPopup.handleKeyboardEvent(mActivity, event);\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ public\\ void\\ onLoaded\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mPopupWindow\\.show\\(\\);\\\n"
    replace: "        public void onLoaded() {\n            if (mDestroyed) return;\n            mPopupWindow.show();\n"
- description: Retire Android action popup contents on close before visibility
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ public\\ void\\ onClose\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mPopupWindow\\.dismiss\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n"
    replace: "        public void onClose() {\n            if (mDestroyed) return;\n            boolean wasShowing = mPopupWindow.isShowing();\n            destroy();\n            // A hidden PopupWindow emits no dismissal callback. Retire its owner explicitly.\n            if (!wasShowing) notifyDismissed();\n        }\n"
