substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Fail closed for stable removed ID before assertion/default logic or
      delayed results
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ AdaptiveToolbarButtonVariant\.OPEN_IN_BROWSER:\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ AdaptiveToolbarButtonVariant\.GLIC:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ true;\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ AdaptiveToolbarButtonVariant\.UNKNOWN:'
      replace: "            case AdaptiveToolbarButtonVariant.OPEN_IN_BROWSER:\n   \
        \             return true;\n            case AdaptiveToolbarButtonVariant.GLIC:\n\
        \            case AdaptiveToolbarButtonVariant.UNKNOWN:"
  - description: Remove real service predicate consumer; reject removed historical variant
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ AdaptiveToolbarButtonVariant\.GLIC:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ AdaptiveToolbarFeatures\.isGlicEnabledForAdaptiveToolbar\(mContext,\
        mProfile\);'
      replace: "            case AdaptiveToolbarButtonVariant.GLIC:\n              \
        \  return false;"
