substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Migrate historical removed override to the stock core default while
      preserving toggle and numeric ABI
    regex:
      re_pattern: '\{\

        \ \ \ \ \ \ \ \ return\ ChromeSharedPreferences\.getInstance\(\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.readInt\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ADAPTIVE_TOOLBAR_CUSTOMIZATION_SETTINGS,\
        AdaptiveToolbarButtonVariant\.AUTO\);\

        \ \ \ \ \}'
      replace: "{\n        int variant =\n                ChromeSharedPreferences.getInstance()\n\
        \                        .readInt(\n                                ADAPTIVE_TOOLBAR_CUSTOMIZATION_SETTINGS,\n\
        \                                AdaptiveToolbarButtonVariant.AUTO);\n     \
        \   if (variant == AdaptiveToolbarButtonVariant.GLIC) {\n            saveToolbarButtonManualOverride(AdaptiveToolbarButtonVariant.AUTO);\n\
        \            return AdaptiveToolbarButtonVariant.AUTO;\n        }\n        return\
        \ variant;\n    }"
