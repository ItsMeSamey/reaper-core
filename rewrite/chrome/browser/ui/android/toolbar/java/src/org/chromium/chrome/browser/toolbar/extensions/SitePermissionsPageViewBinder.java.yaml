substitutions:
- description: Use existing localized Android extension site-permissions labels
  regex:
    re_pattern: '\ \ \ \ \}\

      \

      \ \ \ \ private\ static\ void\ updateRadioButton\(RadioButtonWithDescription\ button,\ ControlState\ state\)\ \{\

      \ \ \ \ \ \ \ \ button\.setChecked\(state\.isOn\);\

      \ \ \ \ \ \ \ \ button\.setEnabled\(state\.status\ ==\ ExtensionsMenuTypes\.ControlState\.Status\.ENABLED\);\

      \ \ \ \ \}\

      '
    replace: "    }\n\n    private static void updateRadioButton(RadioButtonWithDescription button, ControlState state) {\n        button.setPrimaryText(state.text);\n        button.setChecked(state.isOn);\n        button.setEnabled(state.status == ExtensionsMenuTypes.ControlState.Status.ENABLED);\n    }\n"
