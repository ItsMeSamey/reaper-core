substitutions:
  - description: Cancel an Android extension menu awaiting native data when a modal opens
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mExtensionsMenuButton\\.dismiss\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\};"
      replace: "                    closeExtensionsMenuIfOpen();\n                }\n            };"
    count: 1
  - description: Cancel an Android extension menu awaiting native data when a modal opens
    regex:
      re_pattern: "\\ \\ \\ \\ public\\ void\\ closeExtensionsMenuIfOpen\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mExtensionsMenuButton\\.dismiss\\(\\);\\\n\\ \\ \\ \\ \\}"
      replace: "    public void closeExtensionsMenuIfOpen() {\n        mExtensionsMenuButton.dismiss();\n        // A menu waiting for native data has no popup to emit the dismissal callback.\n        if (mMediator != null) {\n            destroyMediator();\n            mExtensionModels.clear();\n            mMenuButtonPinningDelegate.requestLayoutWithViewUtils();\n        }\n    }"
    count: 1
  - description: Keep all Extensions menu controls reachable in short popups 1
    regex:
      pattern: "        // Ensure we start on the main page.\n        mMainPageModel.set(\n                ExtensionsMenuProperties.CURRENT_PAGE, ExtensionsMenuProperties.Page.MAIN);\n\n        // Instantiate the mediator, which will initialize the JNI bridge to the native code.\n        mMediator =\n"
      replace: "        // Ensure we start on the main page.\n        mMainPageModel.set(\n                ExtensionsMenuProperties.CURRENT_PAGE, ExtensionsMenuProperties.Page.MAIN);\n\n        // The content view is reused; each new opening starts above the installed entries.\n        mContentView.findViewById(R.id.extensions_menu_body_scroll).scrollTo(0, 0);\n\n        // Instantiate the mediator, which will initialize the JNI bridge to the native code.\n        mMediator =\n"
    count: 1
