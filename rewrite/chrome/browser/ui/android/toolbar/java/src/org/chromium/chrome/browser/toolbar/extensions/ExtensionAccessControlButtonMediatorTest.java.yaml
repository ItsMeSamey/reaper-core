substitutions:
- description: Refresh Android access requests after action removal and exercise current message replacement
  regex:
    re_pattern: 'import\ static\ org\.junit\.Assert\.assertTrue;\

      import\ static\ org\.mockito\.ArgumentMatchers\.any;\

      import\ static\ org\.mockito\.ArgumentMatchers\.anyInt;\

      import\ static\ org\.mockito\.Mockito\.mock;\

      import\ static\ org\.mockito\.Mockito\.times;\

      import\ static\ org\.mockito\.Mockito\.verify;\

      import\ static\ org\.mockito\.Mockito\.when;\

      '
    replace: 'import static org.junit.Assert.assertTrue;

      import static org.mockito.ArgumentMatchers.any;

      import static org.mockito.ArgumentMatchers.anyInt;

      import static org.mockito.Mockito.doAnswer;

      import static org.mockito.Mockito.inOrder;

      import static org.mockito.Mockito.mock;

      import static org.mockito.Mockito.never;

      import static org.mockito.Mockito.same;

      import static org.mockito.Mockito.times;

      import static org.mockito.Mockito.verify;

      import static org.mockito.Mockito.when;

      '
- description: Refresh Android access requests after action removal and exercise current message replacement
  regex:
    re_pattern: 'import\ org\.junit\.runner\.RunWith;\

      import\ org\.mockito\.ArgumentCaptor;\

      import\ org\.mockito\.Captor;\

      import\ org\.mockito\.Mock;\

      import\ org\.mockito\.junit\.MockitoJUnit;\

      import\ org\.mockito\.junit\.MockitoRule;\

      '
    replace: 'import org.junit.runner.RunWith;

      import org.mockito.ArgumentCaptor;

      import org.mockito.Captor;

      import org.mockito.InOrder;

      import org.mockito.Mock;

      import org.mockito.junit.MockitoJUnit;

      import org.mockito.junit.MockitoRule;

      '
- description: Refresh Android access requests after action removal and exercise current message replacement
  regex:
    re_pattern: '\

      \ \ \ \ @After\

      \ \ \ \ public\ void\ tearDown\(\)\ \{\

      \ \ \ \ \ \ \ \ MessagesFactory\.detachMessageDispatcher\(mMessageDispatcher\);\

      \ \ \ \ \}\

      \

      '
    replace: "\n    @After\n    public void tearDown() {\n        mMediator.destroy();\n        MessagesFactory.detachMessageDispatcher(mMessageDispatcher);\n    }\n\n"
- description: Refresh Android access requests after action removal and exercise current message replacement
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ scaleFactor\ =\ 2\.0f\

      \ \ \ \ \ \ \ \ verify\(mExtensionsToolbarBridge\)\.getIcon\("a",\ mWebContents,\ 5,\ 5,\ 2\.0f\);\

      \ \ \ \ \}\

      \}\

      '
    replace: "        // scaleFactor = 2.0f\n        verify(mExtensionsToolbarBridge).getIcon(\"a\", mWebContents, 5, 5, 2.0f);\n    }\n\n    @Test\n    public void testCompactRequestMessageDismissedWhenActionRemoved() {\n        ExtensionsToolbarBridge.Observer observer = mToolbarObserverCaptor.getValue();\n        prepareCompactMessageDismissal();\n        stubRequestAction(\"a\", \"Extension A\");\n        when(mExtensionsToolbarBridge.getRequestAccessButtonParams(mWebContents))\n                .thenReturn(new RequestAccessButtonParams(new String[] {\"a\"}, \"Request A\"));\n        observer.onRequestAccessButtonParamsChanged();\n\n        ArgumentCaptor<PropertyModel> messages = ArgumentCaptor.forClass(PropertyModel.class);\n        verify(mMessageDispatcher)\n                .enqueueWindowScopedMessage(messages.capture(), any(Boolean.class));\n        PropertyModel original = messages.getValue();\n\n        // Native action IDs are already updated before this removal callback.\n        when(mExtensionsToolbarBridge.getRequestAccessButtonParams(mWebContents))\n                .thenReturn(new RequestAccessButtonParams(new String[0], \"\"));\n        observer.onActionRemoved(\"a\");\n\n        verify(mMessageDispatcher).dismissMessage(same(original), anyInt());\n        observer.onRequestAccessButtonParamsChanged();\n        verify(mMessageDispatcher)\n                .enqueueWindowScopedMessage(any(), any(Boolean.class));\n        assertFalse(mModel.get(ExtensionsToolbarProperties.IS_REQUEST_ACCESS_BUTTON_VISIBLE));\n        verify(mExtensionsToolbarBridge, never()).onRequestAccessButtonClicked(any());\n    }\n\n    @Test\n    public void testCompactRequestMessageRemovalPreservesRemainingRequest() {\n        ExtensionsToolbarBridge.Observer observer = mToolbarObserverCaptor.getValue();\n        prepareCompactMessageDismissal();\n        stubRequestAction(\"b\", \"Extension B\");\n        when(mContext.getString(R.string.extensions_request_access_button))\n                .thenReturn(\"Allow $1 extensions?\");\n        when(mExtensionsToolbarBridge.getRequestAccessButtonParams(mWebContents))\n                .thenReturn(new RequestAccessButtonParams(new String[] {\"a\", \"b\"}, \"A and B\"));\n        observer.onRequestAccessButtonParamsChanged();\n\n        ArgumentCaptor<PropertyModel> messages = ArgumentCaptor.forClass(PropertyModel.class);\n        verify(mMessageDispatcher)\n                .enqueueWindowScopedMessage(messages.capture(), any(Boolean.class));\n        PropertyModel original = messages.getValue();\n        assertEquals(\"Allow 2 extensions?\", original.get(MessageBannerProperties.TITLE));\n\n        when(mExtensionsToolbarBridge.getRequestAccessButtonParams(mWebContents))\n                .thenReturn(new RequestAccessButtonParams(new String[] {\"b\"}, \"Request B\"));\n        observer.onActionRemoved(\"a\");\n\n        verify(mMessageDispatcher, times(2))\n                .enqueueWindowScopedMessage(messages.capture(), any(Boolean.class));\n        PropertyModel remaining = messages.getValue();\n        assertEquals(\"Allow Extension B?\", remaining.get(MessageBannerProperties.TITLE));\n        assertEquals(\n                \"Request from Extension B\", remaining.get(MessageBannerProperties.DESCRIPTION));\n        InOrder order = inOrder(mMessageDispatcher);\n        order.verify(mMessageDispatcher)\n                .enqueueWindowScopedMessage(same(original), any(Boolean.class));\n        order.verify(mMessageDispatcher).dismissMessage(same(original), anyInt());\n        order.verify(mMessageDispatcher)\n                .enqueueWindowScopedMessage(same(remaining), any(Boolean.class));\n\n        // Removing an unrelated action and an unchanged params update must not\n        // dismiss or enqueue the still-current B request again.\n        observer.onActionRemoved(\"c\");\n        observer.onRequestAccessButtonParamsChanged();\n        verify(mMessageDispatcher, times(2))\n                .enqueueWindowScopedMessage(any(), any(Boolean.class));\n        verify(mMessageDispatcher, never()).dismissMessage(same(remaining), anyInt());\n        verify(mExtensionsToolbarBridge, never()).onRequestAccessButtonClicked(any());\n    }\n\n    @Test\n    public void testWideRequestButtonRefreshesWhenActionRemoved() {\n        ExtensionsToolbarBridge.Observer observer = mToolbarObserverCaptor.getValue();\n        when(mExtensionsToolbarBridge.getRequestAccessButtonParams(mWebContents))\n                .thenReturn(new RequestAccessButtonParams(new String[] {\"a\"}, \"Request A\"));\n        observer.onRequestAccessButtonParamsChanged();\n        assertTrue(mModel.get(ExtensionsToolbarProperties.IS_REQUEST_ACCESS_BUTTON_VISIBLE));\n\n        observer.onActionRemoved(\"c\");\n        assertTrue(mModel.get(ExtensionsToolbarProperties.IS_REQUEST_ACCESS_BUTTON_VISIBLE));\n        assertEquals(\n                1, mModel.get(ExtensionsToolbarProperties.REQUEST_ACCESS_BUTTON_EXTENSION_COUNT));\n\n        when(mExtensionsToolbarBridge.getRequestAccessButtonParams(mWebContents))\n                .thenReturn(new RequestAccessButtonParams(new String[0], \"\"));\n        observer.onActionRemoved(\"a\");\n        assertFalse(mModel.get(ExtensionsToolbarProperties.IS_REQUEST_ACCESS_BUTTON_VISIBLE));\n        verify(mMessageDispatcher, never())\n                .enqueueWindowScopedMessage(any(), any(Boolean.class));\n        verify(mExtensionsToolbarBridge, never()).onRequestAccessButtonClicked(any());\n    }\n\n    private void prepareCompactMessageDismissal() {\n        when(mIsWindowCompactSupplier.get()).thenReturn(true);\n        // The real dispatcher invokes this callback synchronously when removing\n        // either a displayed message or one waiting in its window queue.\n        doAnswer(\n                        invocation -> {\n                            PropertyModel message = invocation.getArgument(0);\n                            int reason = invocation.getArgument(1);\n                            message.get(MessageBannerProperties.ON_DISMISSED).onResult(reason);\n                            return null;\n                        })\n                .when(mMessageDispatcher)\n                .dismissMessage(any(), anyInt());\n    }\n\n    private void stubRequestAction(String id, String name) {\n        ExtensionAction action = mock(ExtensionAction.class);\n        when(action.getName()).thenReturn(name);\n        when(mExtensionsToolbarBridge.getAction(id, mWebContents)).thenReturn(action);\n        when(mContext.getString(\n                        R.string.extensions_request_access_message_title_single_extension, name))\n                .thenReturn(\"Allow \" + name + \"?\");\n        when(mContext.getString(\n                        R.string.extensions_request_access_message_description_single_extension,\n                        \"example.com\",\n                        name))\n                .thenReturn(\"Request from \" + name);\n    }\n}\n"
