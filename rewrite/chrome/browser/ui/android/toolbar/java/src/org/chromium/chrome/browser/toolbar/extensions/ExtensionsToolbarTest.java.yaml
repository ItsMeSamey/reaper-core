    replace: "                                        + \"' not found\");\n                    }\n                    target.performClick();\n                });\n    }\n\n    private void touchActionWithCallbackBeforeRelease(\n            String contentDescription, Runnable beforeRelease) {\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    ViewGroup container =\n                            mActivityTestRule.getActivity().findViewById(R.id.extension_action_list);\n                    assertNotNull(container);\n                    View target = findViewWithContentDescription(container, contentDescription);\n                    assertNotNull(target);\n                    assertSame(container, target.getParent());\n                    float x = target.getX() + target.getWidth() / 2f;\n                    float y = target.getY() + target.getHeight() / 2f;\n                    long downTime = SystemClock.uptimeMillis();\n                    MotionEvent down =\n                            MotionEvent.obtain(downTime, downTime, MotionEvent.ACTION_DOWN, x, y, 0);\n                    MotionEvent up =\n                            MotionEvent.obtain(downTime, downTime + 1, MotionEvent.ACTION_UP, x, y, 0);\n                    down.setSource(InputDevice.SOURCE_TOUCHSCREEN);\n                    up.setSource(InputDevice.SOURCE_TOUCHSCREEN);\n                    try {\n                        assertTrue(container.dispatchTouchEvent(down));\n                        assertTrue(target.isPressed());\n                        // Removal updates the adapter synchronously, before the next layout.\n                        beforeRelease.run();\n                        assertSame(container, target.getParent());\n                        assertTrue(target.isAttachedToWindow());\n                        assertTrue(target.hasOnClickListeners());\n                        // Dispatch through RecyclerView and the installed ExtensionActionDragHelper.\n                        assertTrue(container.dispatchTouchEvent(up));\n                    } finally {\n                        down.recycle();\n                        up.recycle();\n                    }\n                });\n    }\n\n"
