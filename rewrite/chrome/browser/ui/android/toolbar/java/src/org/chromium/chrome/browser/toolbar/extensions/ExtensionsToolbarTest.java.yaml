    replace: "                .check(\n                        withEventualExpectedViewState(\n                                withContentDescription(\"Test Action 2\"), VIEW_GONE | VIEW_NULL));\n    }\n\n    @Test\n    @LargeTest\n    public void testReleaseRemovedActionDoesNotBlockRemainingActions() throws IOException {\n        String removedId =\n                loadPopupExtension(\n                        \"removed\", \"Removed Extension\", \"Removed Action\", \"removed popup opened\");\n        String remainingId =\n                loadPopupExtension(\n                        \"remaining\",\n                        \"Remaining Extension\",\n                        \"Remaining Action\",\n                        \"remaining popup opened\");\n        ExtensionTestUtils.setExtensionActionVisible(mProfile, removedId, true);\n        ExtensionTestUtils.setExtensionActionVisible(mProfile, remainingId, true);\n        ViewUtils.onViewWaiting(withContentDescription(\"Removed Action\"))\n                .check(matches(isDisplayed()));\n        ViewUtils.onViewWaiting(withContentDescription(\"Remaining Action\"))\n                .check(matches(isDisplayed()));\n\n        touchActionWithCallbackBeforeRelease(\n                \"Removed Action\",\n                () -> {\n                    ExtensionTestUtils.disableExtension(mProfile, removedId);\n                    assertFalse(ExtensionTestUtils.isExtensionEnabled(mProfile, removedId));\n                });\n        assertEquals(0, ExtensionTestUtils.getRenderFrameHostCount(mProfile, removedId));\n        onView(isRoot())\n                .check(\n                        withEventualExpectedViewState(\n                                withContentDescription(\"Removed Action\"), VIEW_GONE | VIEW_NULL));\n\n        // The live action must still cross the same Java listener and native bridge.\n        try (ExtensionTestMessageListener listener =\n                new ExtensionTestMessageListener(\"remaining popup opened\")