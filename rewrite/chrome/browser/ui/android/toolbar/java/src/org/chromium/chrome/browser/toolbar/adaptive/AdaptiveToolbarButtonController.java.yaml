substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove actual optional-service observer interface; ordinary recomputeUiState
      retained
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ConfigurationChangedObserver,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ GlicKeyedService\.AllowedChangedObserver\ \{'
      replace: '                ConfigurationChangedObserver {'
  - description: Remove state solely owned by removed adaptive AI controller
    regex:
      re_pattern: '\ \ \ \ private\ @Nullable\ GlicKeyedService\ mGlicKeyedService;\

        '
      replace: ''
  - description: Remove optional-service observer teardown
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(mGlicKeyedService\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mGlicKeyedService\.removeAllowedChangedObserver\(this\);\

        \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove optional-service observer registration
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(mGlicKeyedService\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mGlicKeyedService\.addAllowedChangedObserver\(this\);\

        \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove actual excluded service factory lookup; normal profile/controller
      init stays
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ mGlicKeyedService\ =\ GlicKeyedServiceFactory\.getForProfile\(originalProfile\);\

        '
      replace: ''
  - description: Remove imports with no retained source reference
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.glic\.GlicKeyedServiceFactory;\

        '
      replace: ''
  - description: Remove imports with no retained source reference
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.glic\.GlicKeyedService;\

        '
      replace: ''
  - description: Normalize exact removed-section gaps
    count: 2
    regex:
      re_pattern: '\

        \

        \

        '
      replace: '


        '
  - description: Normalize exact removed-section gaps
    count: 2
    regex:
      re_pattern: '\

        \

        \

        '
      replace: '


        '
  - description: Remove orphaned callback of the already excluded Glic AllowedChangedObserver; preserve ordinary recomputeUiState
      and toolbar lifecycle
    regex:
      pattern: "    @Override\n    public void onAllowedStateChanged() {\n        if (mAdaptiveToolbarStatePredictor != null)\
        \ {\n            mAdaptiveToolbarStatePredictor.recomputeUiState(mUiStateCallback);\n        }\n    }\n\n"
      replace: ''
    count: 1
