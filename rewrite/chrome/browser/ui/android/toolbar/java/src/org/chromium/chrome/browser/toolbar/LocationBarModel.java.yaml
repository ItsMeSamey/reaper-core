substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove contextual-task service dependency while retaining normal security
    URL display
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.contextual_tasks\.ContextualTasksUtils;\

      '
    replace: ''
- description: Remove contextual-task origin-swapping display path while retaining
    distiller, offline, frozen and native-page URL handling
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ if\ \(ContextualTasksUtils\.isContextualTasksUrl\(gurl\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ String\ urlForDisplay\ =\ getUrlForDisplay\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ String\ formattedUrl\ =\ getFormattedFullUrl\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(isUrlRewritten\(gurl,\ urlForDisplay,\
      formattedUrl\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ buildUrlBarData\(gurl,\ false,\
      urlForDisplay\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ UrlBarData\.EMPTY;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \

      '
    replace: ''
- description: Retain the generic rewritten URL comparison without contextual-task
    host exceptions
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ isUrlRewritten\(GURL\ basePageUrl,\ String\
      displayUrl,\ String\ formattedUrl\)\ \{\

      \ \ \ \ \ \ \ \ boolean\ rewritten\ =\ false;\

      \ \ \ \ \ \ \ \ if\ \(ContextualTasksUtils\.isContextualTasksUrl\(basePageUrl\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ rewritten\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ !TextUtils\.isEmpty\(displayUrl\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !displayUrl\.contains\(ContextualTasksUtils\.CONTEXTUAL_TASKS_HOST\);\

      \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ rewritten\ =\ !TextUtils\.isEmpty\(displayUrl\)\ \&\&\
      !displayUrl\.equals\(formattedUrl\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ return\ rewritten;\

      \ \ \ \ \}'
    replace: "    private boolean isUrlRewritten(String displayUrl, String formattedUrl)\
      \ {\n        return !TextUtils.isEmpty(displayUrl) && !displayUrl.equals(formattedUrl);\n\
      \    }"
- description: Remove the obsolete contextual-task base-URL argument
  regex:
    re_pattern: isUrlRewritten\(gurl,\ urlForDisplay,\ formattedUrl\)
    replace: isUrlRewritten(urlForDisplay, formattedUrl)
- description: Describe retained generic rewritten URL behavior
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ If\ the\ URL\ has\ been\ rewritten\
      \(e\.g\.\ AI\ Mode\ origin\-swapping\),\ show\ it\ even\ if\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ the\ underlying\ URL\ would\ normally\ be\
      suppressed\.\

      '
    replace: "                // If the URL has been rewritten, show it even if the\
      \ underlying URL would\n                // normally be suppressed.\n"
- description: Describe the actual retained display/editing URL behavior without removed
    AI examples
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Use\ urlForDisplay\ for\
      both\ display\ and\ editing\ to\ avoid\ exposing\ the\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ underlying\ URL\ \(e\.g\.\ chrome://contextual\-tasks\)\.\

      '
    replace: '                    // Preserve the formatted editing URL alongside
      the rewritten display URL.

      '
- description: Document the remaining generic URL comparison inputs
  regex:
    re_pattern: '\ \ \ \ \ \*\ Determines\ whether\ the\ URL\ has\ been\ rewritten\
      \(e\.g\.\ AI\ Mode\ origin\-swapping\)\ by\ comparing\ the\

      \ \ \ \ \ \*\ base\ page\ URL,\ display\ URL,\ and\ formatted\ URL\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ basePageUrl\ The\ underlying,\ un\-rewritten\ GURL\ of\
      the\ page\.\

      '
    replace: "     * Determines whether the displayed URL differs from its formatted\
      \ editing representation.\n     *\n"

# Reaper Android AI physical-purge core caller adapters.
- description: Remove product state import after Root removes the provider API.
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.omnibox\.FuseboxSessionState;\

      '
    replace: ''
- description: Physically remove per-tab Fusebox state factory/getter. No null fallback
    or duplicate state registry; normal URL/provider lifecycle remains untouched.
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ @Nullable\ FuseboxSessionState\ getFuseboxSessionState\(\)\
      \{\

      \ \ \ \ \ \ \ \ Tab\ tab\ =\ getTab\(\);\

      \ \ \ \ \ \ \ \ if\ \(tab\ ==\ null\)\ return\ null;\

      \ \ \ \ \ \ \ \ var\ userDataHost\ =\ tab\.getUserDataHost\(\);\

      \ \ \ \ \ \ \ \ FuseboxSessionState\ state\ =\ userDataHost\.getUserData\(FuseboxSessionState\.class\);\

      \ \ \ \ \ \ \ \ if\ \(state\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ state\ =\ new\ FuseboxSessionState\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ userDataHost\.setUserData\(FuseboxSessionState\.class,\
      state\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ return\ state;\

      \ \ \ \ \}'
    replace: ''
