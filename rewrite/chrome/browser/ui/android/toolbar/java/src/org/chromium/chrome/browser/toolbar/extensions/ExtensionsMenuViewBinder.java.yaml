    replace: "        }\n    }\n\n    private static void updateHostAccessRequestViews(\n            View view, PropertyModel model, List<ExtensionsMenuTypes.HostAccessRequest> requests) {\n        LinearLayout list = view.findViewById(R.id.extensions_request_access_list);\n        Map<String, ExtensionsMenuTypes.HostAccessRequest> requestsById = new HashMap<>();\n        if (requests != null) {\n            for (ExtensionsMenuTypes.HostAccessRequest request : requests) {\n                requestsById.put(request.extensionId, request);\n            }\n        }\n        Map<String, View> rowsById = new HashMap<>();\n        for (int i = list.getChildCount() - 1; i >= 0; --i) {\n            View row = list.getChildAt(i);\n            Object tag = row.getTag(R.id.extensions_request_access_list);\n            if (tag instanceof String id && requestsById.containsKey(id)) {\n                rowsById.put(id, row);\n            } else {\n                // Do not repurpose a removed control for\
      \ another extension, including a click\n                // already queued on the old View. Let normal focus removal take its course.\n                row.findViewById(R.id.allow_button).setOnClickListener(null);\n                row.findViewById(R.id.dismiss_button).setOnClickListener(null);\n                list.removeViewAt(i);\n            }\n        }\n        if (requests == null) return;\n\n        LayoutInflater inflater = LayoutInflater.from(list.getContext());\n        for (int i = 0; i < requests.size(); ++i) {\n            ExtensionsMenuTypes.HostAccessRequest request = requests.get(i);\n            View row = rowsById.get(request.extensionId);\n            if (row == null) {\n                row = inflater.inflate(R.layout.extensions_request_access_item, list, false);\n                row.setTag(R.id.extensions_request_access_list, request.extensionId);\n            }\n            // Native updates retain the relative order of surviving IDs; additions are inserted\n   \
      \         // in action order. Remove missing IDs first, then insert new rows without detaching\n            // surviving keyboard/accessibility-focused controls. Only a real reorder moves a row.\n            int oldIndex = list.indexOfChild(row);\n            if (oldIndex != i) {\n                if (oldIndex != -1) list.removeViewAt(oldIndex);\n                list.addView(row, i);\n            }\n            populateRequestView(row, model, request);\n        }\n    }\n\n    private static void populateRequestView(\n            View itemView, PropertyModel model, ExtensionsMenuTypes.HostAccessRequest request) {\n        Context context = itemView.getContext();\n"
