# Chromium Android extension menu removal while permissions page is open.
substitutions:
  - description: Avoid querying erased extension menu indices and cover removal on permissions page
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ //\ Do\ nothing\ when\ the\ site\ permissions\ page\ is\ opened\ for\ a\ different\

        \ \ \ \ \ \ \ \ //\ extension\.\

        \ \ \ \ \ \ \ \ ExtensionsMenuTypes\.MenuEntryState\ entry\ =\ mMenuBridge\.getMenuEntry\(actionIndex\);\

        \ \ \ \ \ \ \ \ if\ \(!isSitePermissionsPageOpenedFor\(entry\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ //\ Return\ to\ the\ main\ page\ when\ extension\ is\ removed\ and\ had\ the\ site\ permissions\ page\

        \ \ \ \ \ \ \ \ //\ opened\.\

        \ \ \ \ \ \ \ \ mMainPageModel\.set\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ExtensionsMenuProperties\.CURRENT_PAGE,\ ExtensionsMenuProperties\.Page\.MAIN\);'
      replace: "        // Native has already erased the action, so actionIndex no longer identifies the\n        // removed entry and may be out of bounds. Check whether the selected extension remains.\n        for (ExtensionsMenuTypes.MenuEntryState entry : mMenuBridge.getMenuEntries()) {\n            if (isSitePermissionsPageOpenedFor(entry)) {\n                return;\n            }\n        }\n\n        // Refresh the main page as well: its models were not updated while permissions were open.\n        onBackButtonClicked();"
  - description: Refresh Android extension menu toggle callbacks with the current row origin
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ExtensionsMenuItemProperties\.PRIMARY_ACTION_ON_CLICK,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(view\)\ \->\ mMenuBridge\.executeAction\(entry\.id\)\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ExtensionsMenuItemProperties\.SITE_ACCESS_TOGGLE_ON_CLICK,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(buttonView,\ isOn\)\ \->\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mMenuBridge\.onExtensionToggleSelected\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ entry\.id,\ entry\.origin,\ isOn\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!isOn\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mOnDismissMenu\.run\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ExtensionsMenuItemProperties\.SITE_PERMISSIONS_BUTTON_ON_CLICK,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(view\)\ \->\ onSitePermissionsButtonClicked\(entry\.id\)\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.build\(\);\

        '
      replace: "                                ExtensionsMenuItemProperties.PRIMARY_ACTION_ON_CLICK,\n                                (view) -> mMenuBridge.executeAction(entry.id))\n                        .with(\n                                ExtensionsMenuItemProperties.SITE_PERMISSIONS_BUTTON_ON_CLICK,\n                                (view) -> onSitePermissionsButtonClicked(entry.id))\n                        .build();\n"
  - description: Refresh Android extension menu toggle callbacks with the current row origin
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ itemModel\.set\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ExtensionsMenuItemProperties\.CONTEXT_MENU_BUTTON_ACCESSIBLE_NAME,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ itemState\.contextMenuButton\.accessibleName\);\

        \ \ \ \ \ \ \ \ itemModel\.set\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ExtensionsMenuItemProperties\.SITE_ACCESS_TOGGLE_CHECKED,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ itemState\.siteAccessToggle\.isOn\);\

        '
      replace: "        itemModel.set(\n                ExtensionsMenuItemProperties.CONTEXT_MENU_BUTTON_ACCESSIBLE_NAME,\n                itemState.contextMenuButton.accessibleName);\n        // Rows survive navigation, so the action must use the same origin as the refreshed state.\n        itemModel.set(\n                ExtensionsMenuItemProperties.SITE_ACCESS_TOGGLE_ON_CLICK,\n                (buttonView, isOn) -> {\n                    mMenuBridge.onExtensionToggleSelected(itemState.id, itemState.origin, isOn);\n                    if (!isOn) {\n                        mOnDismissMenu.run();\n                    }\n                });\n        itemModel.set(\n                ExtensionsMenuItemProperties.SITE_ACCESS_TOGGLE_CHECKED,\n                itemState.siteAccessToggle.isOn);\n"
  - description: Pass3 reviewed Android ui fallback repair
    regex:
      re_pattern: '\ \ \ \ private\ void\ onSitePermissionsButtonClicked\(String\ extensionId\)\ \{\

        \ \ \ \ \ \ \ \ mSitePermissionsPageModel\.set\(SitePermissionsPageProperties\.EXTENSION_ID,\ extensionId\);\

        \

        \ \ \ \ \ \ \ \ updateSitePermissionsPage\(extensionId\);\

        \

        \ \ \ \ \ \ \ \ //\ Set\ current\ page\ to\ site\ permissions\ page\.\

        \ \ \ \ \ \ \ \ mMainPageModel\.set\(\

        '
      replace: "    private void onSitePermissionsButtonClicked(String extensionId) {\n        mSitePermissionsPageModel.set(SitePermissionsPageProperties.EXTENSION_ID, extensionId);\n\n        if (!updateSitePermissionsPage(extensionId)) {\n            return;\n        }\n\n        // Set current page to site permissions page.\n        mMainPageModel.set(\n"
  - description: Pass3 reviewed Android ui fallback repair
    regex:
      re_pattern: '\ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ extensionId\ The\ ID\ of\ the\ extension\ to\ show\ permissions\ for\.\

        \ \ \ \ \ \*/\

        \ \ \ \ private\ void\ updateSitePermissionsPage\(String\ extensionId\)\ \{\

        \ \ \ \ \ \ \ \ ExtensionsMenuTypes\.ExtensionSitePermissionsState\ sitePermissionsState\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mMenuBridge\.getExtensionSitePermissionsState\(extensionId\);\

        \ \ \ \ \ \ \ \ if\ \(sitePermissionsState\ ==\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mMainPageModel\.set\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ExtensionsMenuProperties\.CURRENT_PAGE,\ ExtensionsMenuProperties\.Page\.MAIN\);\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ mSitePermissionsPageModel\.set\(\

        '
      replace: "     *\n     * @param extensionId The ID of the extension to show permissions for.\n     */\n    private boolean updateSitePermissionsPage(String extensionId) {\n        ExtensionsMenuTypes.ExtensionSitePermissionsState sitePermissionsState =\n                mMenuBridge.getExtensionSitePermissionsState(extensionId);\n        if (sitePermissionsState == null) {\n            // Native eligibility can change during navigation or an extension update. Refresh\n            // changes deferred while this page was open before returning to the main page.\n            onBackButtonClicked();\n            return false;\n        }\n\n        mSitePermissionsPageModel.set(\n"
  - description: Pass3 reviewed Android ui fallback repair
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ SitePermissionsPageProperties\.SHOW_REQUESTS_TOGGLE_CLICK_LISTENER,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(buttonView,\ isChecked\)\ \->\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mMenuBridge\.onShowRequestsTogglePressed\(extensionId,\ isChecked\)\);\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\ Updates\ the\ zero\ state\ visibility\.\ \*/\

        '
      replace: "                SitePermissionsPageProperties.SHOW_REQUESTS_TOGGLE_CLICK_LISTENER,\n                (buttonView, isChecked) ->\n                        mMenuBridge.onShowRequestsTogglePressed(extensionId, isChecked));\n        return true;\n    }\n\n    /** Updates the zero state visibility. */\n"
  - description: Keep a valid same-regular-profile parent after dismissal.
    regex:
      pattern: "    private void openUrlFromMenu(String url) {\n        mOnDismissMenu.run();\n\n        LoadUrlParams params\
        \ = new LoadUrlParams(url, PageTransition.AUTO_TOPLEVEL);\n        mTabCreator.createNewTab(params, TabLaunchType.FROM_CHROME_UI,\
        \ null);\n    }\n"
      replace: "    private void openUrlFromMenu(String url) {\n        mOnDismissMenu.run();\n\n        // Dismissal may change\
        \ or close the current tab. Only a live tab from this regular\n        // profile can be the parent of the new tab,\
        \ so Back can return to it.\n        Tab parent = mCurrentTabSupplier.get();\n        if (parent != null\n         \
        \       && (parent.isDestroyed()\n                        || parent.isClosing()\n                        || parent.getId()\
        \ == Tab.INVALID_TAB_ID\n                        || parent.isOffTheRecord()\n                        || parent.getProfile()\
        \ != mProfile)) {\n            parent = null;\n        }\n\n        LoadUrlParams params = new LoadUrlParams(url, PageTransition.AUTO_TOPLEVEL);\n\
        \        mTabCreator.createNewTab(params, TabLaunchType.FROM_CHROME_UI, parent);\n    }\n"
    count: 1
  - description: Cancel an Android extension menu awaiting native data when a modal opens
    regex:
      re_pattern: "\\ \\ \\ \\ private\\ final\\ TabCreator\\ mTabCreator;\\\n"
      replace: "    private final TabCreator mTabCreator;\n    private boolean mDestroyed;\n"
    count: 1
  - description: Cancel an Android extension menu awaiting native data when a modal opens
    regex:
      re_pattern: "\\ \\ \\ \\ public\\ void\\ destroy\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ mMenuBridge\\.destroy\\(\\);\\\n\\ \\ \\ \\ \\}"
      replace: "    public void destroy() {\n        if (mDestroyed) return;\n        mDestroyed = true;\n        mMenuBridge.destroy();\n    }"
    count: 1
  - description: Cancel an Android extension menu awaiting native data when a modal opens
    regex:
      re_pattern: "\\ \\ \\ \\ public\\ void\\ onReady\\(\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ onModelChanged\\(\\);"
      replace: "    public void onReady() {\n        if (mDestroyed) return;\n        onModelChanged();"
    count: 1
