substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove state solely owned by removed adaptive AI controller
    regex:
      re_pattern: '\ \ \ \ private\ @Nullable\ RadioButtonWithDescription\ mGlicButton;\

        '
      replace: ''
  - description: Remove state solely owned by removed adaptive AI controller
    regex:
      re_pattern: '\ \ \ \ private\ boolean\ mCanUseGlic;\

        '
      replace: ''
  - description: Remove actual removed preference enablement API
    regex:
      re_pattern: '\ \ \ \ void\ setCanUseGlic\(boolean\ canUseGlic\)\ \{\

        \ \ \ \ \ \ \ \ mCanUseGlic\ =\ canUseGlic;\

        \ \ \ \ \ \ \ \ updateGlicButtonVisibility\(\);\

        \ \ \ \ \}'
      replace: ''
  - description: Remove actual removed preference rendering API
    regex:
      re_pattern: '\ \ \ \ private\ void\ updateGlicButtonVisibility\(\)\ \{\

        \ \ \ \ \ \ \ \ updateButtonVisibility\(mGlicButton,\ mCanUseGlic\);\

        \ \ \ \ \}'
      replace: ''
  - description: Remove actual excluded radio view lookup
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ mGlicButton\ =\ \(RadioButtonWithDescription\)\ holder\.findViewById\(R\.id\.adaptive_option_glic\);\

        '
      replace: ''
  - description: Remove non-null metadata for the deleted field while preserving original
      other bindings
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ "mPageSummaryButton",\

        \ \ \ \ \ \ \ \ "mGlicButton"'
      replace: '        "mPageSummaryButton"'
  - description: Remove actual optional view update from ordinary initialization
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ updateGlicButtonVisibility\(\);\

        '
      replace: ''
  - description: Remove actual removed radio-selection branch
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \}\ else\ if\ \(mGlicButton\.isChecked\(\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mSelected\ =\ AdaptiveToolbarButtonVariant\.GLIC;\

        '
      replace: ''
  - description: Remove actual product view return from core option lookup
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ AdaptiveToolbarButtonVariant\.GLIC:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ mGlicButton;\

        '
      replace: ''
  - description: Remove exact product text resource consumer
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ AdaptiveToolbarButtonVariant\.GLIC:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ stringRes\ =\ R\.string\.glic_button_entrypoint_ask_gemini_label;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ break;\

        '
      replace: ''
  - description: Normalize actual cached/bundle UI state using present ordinary Auto/Share
      options
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ mAutoButtonCaption\ =\ uiState\.autoButtonCaption;\

        \ \ \ \ \ \ \ \ mSelected\ =\ uiState\.preferenceSelection;'
      replace: "        // Long-press arguments and delayed cached states may still\
        \ contain a removed numeric ID.\n        mAutoButtonCaption =\n            \
        \    uiState.autoButtonCaption == AdaptiveToolbarButtonVariant.GLIC\n      \
        \                  ? AdaptiveToolbarButtonVariant.SHARE\n                  \
        \      : uiState.autoButtonCaption;\n        mSelected =\n                uiState.preferenceSelection\
        \ == AdaptiveToolbarButtonVariant.GLIC\n                        ? AdaptiveToolbarButtonVariant.AUTO\n\
        \                        : uiState.preferenceSelection;"
  - description: Use normalized real caption so deleted text resource/default assertion
      is never used by stale GLIC state
    regex:
      re_pattern: getContext\(\)\.getString\(resId,\ getButtonString\(uiState\.autoButtonCaption\)\)
      replace: getContext().getString(resId, getButtonString(mAutoButtonCaption))
  - description: Normalize exact removed-section gaps
    count: 2
    regex:
      re_pattern: '\

        \

        \

        '
      replace: '


        '
