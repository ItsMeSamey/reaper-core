substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ "//components/browser_ui/styles/android:java",\

      \ \ \ \ "//components/browser_ui/util/android:test_support_java",\

      \ \ \ \ "//components/browser_ui/widget/android:java",\

      \ \ \ \ "//components/embedder_support/android:context_menu_java",\

      \ \ \ \ "//components/embedder_support/android:util_java",\

      \ \ \ \ "//components/feature_engagement/public:public_java",\

      '
    replace: "    \"//components/browser_ui/styles/android:java\",\n    \"//components/browser_ui/util/android:test_support_java\",\n    \"//components/browser_ui/widget/android:java\",\n    \"//components/embedder_support/android:content_view_java\",\n    \"//components/embedder_support/android:context_menu_java\",\n    \"//components/embedder_support/android:util_java\",\n    \"//components/feature_engagement/public:public_java\",\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ "//components/messages/android:java",\

      \ \ \ \ "//components/messages/android:manager_java",\

      \ \ \ \ "//components/prefs/android:java",\

      \ \ \ \ "//components/url_formatter/android:url_formatter_java",\

      \ \ \ \ "//components/user_prefs/android:java",\

      \ \ \ \ "//content/public/android:content_full_java",\

      '
    replace: "    \"//components/messages/android:java\",\n    \"//components/messages/android:manager_java\",\n    \"//components/prefs/android:java\",\n    \"//components/thin_webview:factory_java\",\n    \"//components/thin_webview:java\",\n    \"//components/url_formatter/android:url_formatter_java\",\n    \"//components/user_prefs/android:java\",\n    \"//content/public/android:content_full_java\",\n"
- description: "Declare GURL as a direct dependency of the extension toolbar instrumentation owner."
  regex:
    re_pattern: "(android_library\\(\"javatests\"\\) \\{[\\s\\S]*?\\n  deps = \\[[\\s\\S]*?)(\\n  \\])"
    replace: "\\1\n    \"//url:url_java\",\\2"
