- description: "Exercise the zero-state Store action through short and tall measured menu viewports."
  count: 1
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ ExtensionsMenuTypes\\.SiteSettingsState\\ createSiteSettingsState\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ String\\ label,\\ boolean\\ isOn\\)\\ \\{\\\n"
    replace: "    @Test\n    public void testZeroState_ShortViewportScrollsToStoreAndKeepsFooterVisible() {\n        ViewGroup menu = createZeroStateMenuForLayout();\n        layoutMenu(menu, View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED));\n        View zeroState = menu.findViewById(R.id.extensions_menu_zero_state);\n        View storeButton = menu.findViewById(R.id.btn_open_store);\n        assertTrue(zeroState.getHeight() > 2 * storeButton.getHeight());\n\n        // Keep the natural header/footer, but make only half the empty-state body available.\n        int shortHeight = menu.getHeight() - zeroState.getHeight() / 2;\n        layoutMenu(menu, View.MeasureSpec.makeMeasureSpec(shortHeight, View.MeasureSpec.AT_MOST));\n        assertTrue(menu.getHeight() <= shortHeight);\n        Rect viewport = boundsInMenu(menu, zeroState);\n        assertTrue(viewport.height() >= storeButton.getHeight());\n        assertTrue(boundsInMenu(menu, storeButton).bottom > viewport.bottom);\n        Rect headerBefore = boundsInMenu(menu, menu.findViewById(R.id.extensions_menu_header));\n        Rect footerBefore = assertFooterVisible(menu);\n        assertTrue(headerBefore.bottom <= viewport.top);\n        assertTrue(viewport.bottom <= footerBefore.top);\n\n        // Ask the actual descendant to reveal itself; this cannot scroll the old plain body.\n        assertTrue(zeroState.canScrollVertically(1));\n        assertTrue(\n                storeButton.requestRectangleOnScreen(\n                        new Rect(0, 0, storeButton.getWidth(), storeButton.getHeight()),\n                        /* immediate= */ true));\n        assertTrue(zeroState.getScrollY() > 0);\n        assertEquals(viewport, boundsInMenu(menu, zeroState));\n        assertTrue(viewport.contains(boundsInMenu(menu, storeButton)));\n        assertEquals(\n                headerBefore, boundsInMenu(menu, menu.findViewById(R.id.extensions_menu_header)));\n        assertEquals(footerBefore, assertFooterVisible(menu));\n\n        assertTrue(storeButton.performClick());\n        verify(mTabCreator)\n                .createNewTab(\n                        mLoadUrlParamsCaptor.capture(), eq(TabLaunchType.FROM_CHROME_UI), same(mTab));\n        assertEquals(UrlConstants.CHROME_WEBSTORE_URL, mLoadUrlParamsCaptor.getValue().getUrl());\n    }\n\n    @Test\n    public void testZeroState_TallViewportKeepsNaturalHeightWithoutScrolling() {\n        ViewGroup menu = createZeroStateMenuForLayout();\n        layoutMenu(menu, View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED));\n        int naturalHeight = menu.getHeight();\n        View zeroState = menu.findViewById(R.id.extensions_menu_zero_state);\n        int tallHeight = naturalHeight + zeroState.getHeight();\n\n        layoutMenu(menu, View.MeasureSpec.makeMeasureSpec(tallHeight, View.MeasureSpec.AT_MOST));\n        assertEquals(naturalHeight, menu.getHeight());\n        assertTrue(menu.getHeight() < tallHeight);\n        assertEquals(0, zeroState.getScrollY());\n        assertFalse(zeroState.canScrollVertically(-1));\n        assertFalse(zeroState.canScrollVertically(1));\n        assertTrue(\n                boundsInMenu(menu, zeroState)\n                        .contains(boundsInMenu(menu, menu.findViewById(R.id.btn_open_store))));\n        assertFooterVisible(menu);\n    }\n\n    private ViewGroup createZeroStateMenuForLayout() {\n        when(mExtensionsMenuBridgeJniMock.getMenuEntries(anyLong())).thenReturn(new ArrayList<>());\n        mExtensionsMenuButton.performClick();\n        assertNotNull(mExtensionsMenuCoordinator.mMediator);\n        // Populate the real mediator/binder without opening a PopupWindow: the test supplies the\n        // available popup height directly, independent of Robolectric's default screen size.\n        mExtensionsMenuCoordinator.mMediator.onModelChanged();\n        ViewGroup menu = (ViewGroup) mExtensionsMenuCoordinator.getContentView();\n        assertNull(menu.getParent());\n        assertEquals(\n                View.VISIBLE, menu.findViewById(R.id.extensions_menu_zero_state).getVisibility());\n        assertEquals(\n                View.GONE, menu.findViewById(R.id.extensions_menu_active_state).getVisibility());\n        return menu;\n    }\n\n    private void layoutMenu(View menu, int heightMeasureSpec) {\n        int width = mContext.getResources().getDimensionPixelSize(R.dimen.extension_menu_max_width);\n        menu.measure(\n                View.MeasureSpec.makeMeasureSpec(width, View.MeasureSpec.EXACTLY), heightMeasureSpec);\n        menu.layout(0, 0, menu.getMeasuredWidth(), menu.getMeasuredHeight());\n    }\n\n    private static Rect boundsInMenu(ViewGroup menu, View descendant) {\n        assertTrue(descendant.getWidth() > 0);\n        assertTrue(descendant.getHeight() > 0);\n        Rect bounds = new Rect();\n        descendant.getDrawingRect(bounds);\n        menu.offsetDescendantRectToMyCoords(descendant, bounds);\n        return bounds;\n    }\n\n    private static Rect assertFooterVisible(ViewGroup menu) {\n        Rect menuBounds = new Rect(0, 0, menu.getWidth(), menu.getHeight());\n        Rect footer = boundsInMenu(menu, menu.findViewById(R.id.extensions_menu_footer));\n        assertTrue(menuBounds.contains(footer));\n        for (int id :\n                new int[] {\n                    R.id.extensions_menu_pin_menu_icon_button,\n                    R.id.extensions_menu_manage_extensions_button\n                }) {\n            View row = menu.findViewById(id);\n            assertEquals(View.VISIBLE, row.getVisibility());\n            assertTrue(footer.contains(boundsInMenu(menu, row)));\n        }\n        return footer;\n    }\n\n    private ExtensionsMenuTypes.SiteSettingsState createSiteSettingsState(\n            String label, boolean isOn) {\n"
- description: Cancel an Android extension menu awaiting native data when a modal opens
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ mExtensionsMenuButton\\.performClick\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ triggerOnMediatorReady\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertTrue\\(mExtensionsMenuCoordinator\\.isExtensionsMenuOpen\\(\\)\\);\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ observerCaptor\\.getValue\\(\\)\\.onDialogAdded\\(new\\ PropertyModel\\(\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ assertFalse\\(mExtensionsMenuCoordinator\\.isExtensionsMenuOpen\\(\\)\\);\\\n\\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ @Test\\\n\\ \\ \\ \\ public\\ void\\ testPageChangeUpdatesPopupSize\\(\\)"
    replace: "        // A dialog must also cancel a menu that is still waiting for native data.\n        mExtensionsMenuButton.performClick();\n        ExtensionsMenuBridge cancelledBridge = mCapturedMenuBridge;\n        assertNotNull(mExtensionsMenuCoordinator.mMediator);\n        assertFalse(mExtensionsMenuCoordinator.isExtensionsMenuOpen());\n        observerCaptor.getValue().onDialogAdded(new PropertyModel());\n        assertNull(mExtensionsMenuCoordinator.mMediator);\n        verify(mExtensionsMenuBridgeJniMock).destroy(EXTENSIONS_MENU_BRIDGE_POINTER);\n        verify(mMenuButtonPinningDelegate).requestLayoutWithViewUtils();\n\n        // A delayed ready callback cannot open the cancelled menu or read its retired model.\n        clearInvocations(mExtensionsMenuBridgeJniMock);\n        cancelledBridge.onReady();\n        verify(mExtensionsMenuBridgeJniMock, never()).getMenuEntries(anyLong());\n        verify(popupListener, never()).onPopupMenuShown();\n        assertFalse(mExtensionsMenuCoordinator.isExtensionsMenuOpen());\n\n        // A later user request still opens normally; the old callback cannot reopen it.\n        mExtensionsMenuButton.performClick();\n        triggerOnMediatorReady();\n        assertTrue(mExtensionsMenuCoordinator.isExtensionsMenuOpen());\n        cancelledBridge.onReady();\n        verify(popupListener, times(1)).onPopupMenuShown();\n\n        // Preserve coverage of a dialog dismissing a menu that is already visible.\n        observerCaptor.getValue().onDialogAdded(new PropertyModel());\n        assertFalse(mExtensionsMenuCoordinator.isExtensionsMenuOpen());\n        assertNull(mExtensionsMenuCoordinator.mMediator);\n        verify(mExtensionsMenuBridgeJniMock).destroy(EXTENSIONS_MENU_BRIDGE_POINTER);\n    }\n\n    @Test\n    public void testPageChangeUpdatesPopupSize()"
