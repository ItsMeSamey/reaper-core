    replace: "    @Test\n    public void testPinMenuIconButton_OneKeyboardStopPreservesLabelStateAndRowClick() {\n        ViewGroup menu = createZeroStateMenuForLayout();\n        layoutMenu(menu, View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED));\n        ViewGroup footer = menu.findViewById(R.id.extensions_menu_footer);\n        View pinRow = menu.findViewById(R.id.extensions_menu_pin_menu_icon_button);\n        CompoundButton toggle = menu.findViewById(R.id.extensions_menu_button_pinning_toggle);\n        View manage = menu.findViewById(R.id.extensions_menu_manage_extensions_button);\n        FocusFinder focusFinder = FocusFinder.getInstance();\n\n        // Traverse the inflated footer, rather than just checking the XML focusable attribute.\n        assertEquals(toggle, focusFinder.findNextFocus(footer, null, View.FOCUS_FORWARD));\n        assertEquals(manage, focusFinder.findNextFocus(footer, toggle, View.FOCUS_FORWARD));\n        assertEquals(toggle, focusFinder.findNextFocus(footer, manage, View.FOCUS_BACKWARD));\n\n        AccessibilityNodeInfo node = AccessibilityNodeInfo.obtain();\n        mExtensionsMenuCoordinator.setMenuButtonPinned(true);\n        toggle.onInitializeAccessibilityNodeInfo(node);\n        assertEquals(\n                mContext.getString(R.string.extensions_pin_to_toolbar_setting),\n                node.getContentDescription());\n        assertTrue(node.isCheckable());\n        assertTrue(node.isChecked());\n        mExtensionsMenuCoordinator.setMenuButtonPinned(false);\n        toggle.onInitializeAccessibilityNodeInfo(node);\n        assertFalse(node.isChecked());\n        node.recycle();\n\n        // Removing the redundant keyboard stop must retain both existing click targets.\n        assertTrue(pinRow.performClick());\n        assertTrue(toggle.performClick());\n        verify(mMenuButtonPinningDelegate, times(2)).setMenuButtonPinned(true);\n    }\n\n    @Test\n    public void testZeroState_ShortViewportScrollsToStoreAndKeepsFooterVisible() {"
