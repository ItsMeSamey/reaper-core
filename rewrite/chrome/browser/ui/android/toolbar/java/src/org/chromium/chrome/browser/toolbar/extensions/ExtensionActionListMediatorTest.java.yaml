    replace: "    @Test\n    public void testPendingPopup_TabSwitchCancelsBeforeLayout() {\n        mBridgeDelegateCaptor\n                .getValue()\n                .triggerPopup(ACTION3_ID, mPopupContentsMock, /* inspectWithDevTools= */ false);\n        ArgumentCaptor<Runnable> layoutCallback = ArgumentCaptor.forClass(Runnable.class);\n        verify(mRecyclerViewDelegate).addOnAnimationsFinishedRunnable(layoutCallback.capture());\n        assertTrue(mMediator.hasPoppedOutAction());\n\n        MockTab nextTab = new MockTab(TAB_ID + 1, mProfile);\n        nextTab.setWebContentsOverrideForTesting(mWebContents);\n        mCurrentTabSupplier.set(nextTab);\n\n        verify(mPopupContentsMock, times(1)).destroy();\n        assertFalse(mMediator.hasPoppedOutAction());\n        // The old layout callback can still arrive after switching tabs.\n        layoutCallback.getValue().run();\n        verify(mRecyclerViewDelegate, never()).getButtonViewForId(ACTION3_ID);\n        verify(mPopupContentsMock, times(1)).destroy();\n    }\n\n    @Test\n    public void testPendingPopup_LastTabClosureCancelsContents() {\n        mBridgeDelegateCaptor\n                .getValue()\n                .triggerPopup(ACTION1_ID, mPopupContentsMock, /* inspectWithDevTools= */ false);\n\n        mCurrentTabSupplier.set(null);\n\n        verify(mPopupContentsMock, times(1)).destroy();\n        assertFalse(mBridgeDelegateCaptor.getValue().hasActivePopup());\n    }\n\n    @Test\n    public void testPendingPopup_SameTabNotificationDoesNotCancel() {\n        mBridgeDelegateCaptor\n                .getValue()\n                .triggerPopup(ACTION1_ID, mPopupContentsMock, /* inspectWithDevTools= */ false);\n\n        mCurrentTabSupplier.set(mTab);\n\n        verify(mPopupContentsMock, never()).destroy();\n    }\n\n    @Test\n    public void testTriggerPopup_InspectWithDevTools() {"
