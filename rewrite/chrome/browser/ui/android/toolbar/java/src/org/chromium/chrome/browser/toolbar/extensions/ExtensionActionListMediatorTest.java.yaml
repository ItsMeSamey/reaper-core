ntentsOverrideForTesting(nextWebContents);\n        } else {\n            MockTab nextTab = new MockTab(TAB_ID + 1, mProfile);\n            nextTab.setWebContentsOverrideForTesting(nextWebContents);\n            mCurrentTabSupplier.set(nextTab);\n        }\n        getToolbarObserver().onActiveWebContentsChanged(nextWebContents);\n        mMediator.reconcileActionItems();\n        assertSame(item.model, mModels.get(0).model);\n        assertSame(\n                listener,\n                item.model.get(ExtensionActionButtonProperties.ON_HOVER_LISTENER));\n        clearInvocations(mExtensionsToolbarBridge, oldAction, nextAction);\n\n        // A retained row and its original listener must query the newly active page.\n        enterHover(listener, anchor);\n        shadowOf(Looper.getMainLooper())\n                .idleFor(ViewConfiguration.getLongPressTimeout(), TimeUnit.MILLISECONDS);\n\n        verify(mExtensionsToolbarBridge).getAction(ACTION1_ID, nextWebContents);\n        verify(mExtensionsToolbarBridge, never()).getAction(ACTION1_ID, mWebContents);\n        verify(nextAction).getHoverCardState();\n        verify(oldAction, never()).getHoverCardState();\n    }\n\n    @Test\n    public void testHoverCard_RetainedRowUsesNewTab() {\n        assertHoverCardUsesCurrentWebContents(/* replaceWebContents= */ false);\n    }\n\n    @Test\n    public void testHoverCard_RetainedRowUsesReplacedWebContents() {\n        assertHoverCardUsesCurrentWebContents(/* replaceWebContents= */ true);\n    }\n\n    @Test\n    public void testHoverCard_TabSwitchCancelsPendingCard() {\n        View anchor = createHoverCardAnchor();\n        ExtensionAction action = setHoverCardAction(mWebContents);\n        enterHover(\n                mModels.get(0).model.get(ExtensionActionButtonProperties.ON_HOVER_LISTENER),\n                anchor);\n\n        MockTab nextTab = new MockTab(TAB_ID + 1, mProfile);\n        nextTab.setWebContentsOverrideForTesting(mock(WebContents.class));\n        mCurrentTabSupplier.set(nextTab);\n        clearInvocations(mExtensionsToolbarBridge, action);\n        shadowOf(Looper.getMainLooper())\n                .idleFor(ViewConfiguration.getLongPressTimeout(), TimeUnit.MILLISECONDS);\n\n        verify(mExtensionsToolbarBridge, never()).getAction(anyString(), any());\n        verify(action, never()).getHoverCardState();\n    }\n\n    @Test\n    public void testHoverCard_NavigationCancelsPendingCard() {\n        View anchor = createHoverCardAnchor();\n        ExtensionAction action = setHoverCardAction(mWebContents);\n        enterHover(\n                mModels.get(0).model.get(ExtensionActionButtonProperties.ON_HOVER_LISTENER),\n                anchor);\n\n        // Navigation preserves Tab and WebContents identity but changes the hovercard's site.\n        getToolbarObserver().onActiveWebContentsChanged(mWebContents);\n        clearInvocations(mExtensionsToolbarBridge, action);\n        shadowOf(Looper.getMainLooper())\n                .idleFor(ViewConfiguration.getLongPressTimeout(), TimeUnit.MILLISECONDS);\n\n        verify(mExtensionsToolbarBridge, never()).getAction(anyString(), any());\n        verify(action, never()).getHoverCardState();\n    }\n\n    @Test\n    public void testHoverCard_LastTabClosureDoesNotQueryStaleWebContents() {\n        View anchor = createHoverCardAnchor();\n        ExtensionAction action = setHoverCardAction(mWebContents);\n        View.OnHoverListener listener =\n                mModels.get(0).model.get(ExtensionActionButtonProperties.ON_HOVER_LISTENER);\n        enterHover(listener, anchor);\n\n        mCurrentTabSupplier.set(null);\n        clearInvocations(mExtensionsToolbarBridge, action);\n        shadowOf(Looper.getMainLooper())\n                .idleFor(ViewConfiguration.getLongPressTimeout(), TimeUnit.MILLISECONDS);\n        verify(mExtensionsToolbarBridge, never()).getAction(anyString(), any());\n        verify(action, never()).getHoverCardState();\n\n        // Even a late event from