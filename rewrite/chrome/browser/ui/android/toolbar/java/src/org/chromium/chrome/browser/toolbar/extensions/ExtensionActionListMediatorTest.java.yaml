    replace: "        verify(action, never()).getHoverCardState();\n    }\n\n    @Test\n    public void testStaleContextMenuCallback_PreservesNewUnpinnedPopup() {\n        ListMenuButton oldAnchor = mock(ListMenuButton.class);\n        doReturn(oldAnchor).when(mRecyclerViewDelegate).getButtonViewForId(ACTION1_ID);\n        mMediator.requestShowContextMenu(ACTION1_ID);\n        ArgumentCaptor<Runnable> callback = ArgumentCaptor.forClass(Runnable.class);\n        verify(mRecyclerViewDelegate).addOnAnimationsFinishedRunnable(callback.capture());\n\n        mBridgeDelegateCaptor\n                .getValue()\n                .triggerPopup(ACTION3_ID, mPopupContentsMock, /* inspectWithDevTools= */ false);\n        mMediator.reconcileActionItems();\n        assertTrue(mMediator.hasPoppedOutAction());\n        assertItemAt(2, ACTION3_ID, \"title of action 3\", ICON_GREEN);\n\n        callback.getValue().run();\n        mMediator.reconcileActionItems();\n\n        assertTrue(mMediator.hasPoppedOutAction());\n        assertEquals(3, mModels.size());\n        assertItemAt(2, ACTION3_ID, \"title of action 3\", ICON_GREEN);\n        verify(mRecyclerViewDelegate, never()).getButtonViewForId(ACTION1_ID);\n        verify(mPopupContentsMock, never()).destroy();\n    }\n\n    @Test\n    public void testStaleContextMenuCallback_SameActionReplacementKeepsCurrentRequest() {\n        mMediator.requestShowContextMenu(ACTION3_ID);\n        mMediator.requestShowContextMenu(ACTION3_ID);\n        ArgumentCaptor<Runnable> callbacks = ArgumentCaptor.forClass(Runnable.class);\n        verify(mRecyclerViewDelegate, times(2))\n                .addOnAnimationsFinishedRunnable(callbacks.capture());\n        mMediator.reconcileActionItems();\n        assertTrue(mMediator.hasPoppedOutAction());\n\n        callbacks.getAllValues().get(0).run();\n        mMediator.reconcileActionItems();\n\n        assertTrue(mMediator.hasPoppedOutAction());\n        assertItemAt(2, ACTION3_ID, \"title of action 3\", ICON_GREEN);\n        verify(mRecyclerViewDelegate, never()).getButtonViewForId(ACTION3_ID);\n\n        // The current request still runs and cleans up its own popout if its anchor is gone.\n        doReturn(null).when(mRecyclerViewDelegate).getButtonViewForId(ACTION3_ID);\n        callbacks.getAllValues().get(1).run();\n        assertFalse(mMediator.hasPoppedOutAction());\n        mMediator.reconcileActionItems();\n        assertEquals(2, mModels.size());\n        verify(mRecyclerViewDelegate, times(1)).getButtonViewForId(ACTION3_ID);\n    }\n\n    @Test\n    public void testCurrentContextMenuCallback_MissingAnchorCleansOwnPopout() {\n        mMediator.requestShowContextMenu(ACTION3_ID);\n        ArgumentCaptor<Runnable> callback = ArgumentCaptor.forClass(Runnable.class);\n        verify(mRecyclerViewDelegate).addOnAnimationsFinishedRunnable(callback.capture());\n        mMediator.reconcileActionItems();\n        assertTrue(mMediator.hasPoppedOutAction());\n        doReturn(null).when(mRecyclerViewDelegate).getButtonViewForId(ACTION3_ID);\n\n        callback.getValue().run();\n\n        assertFalse(mMediator.hasPoppedOutAction());\n        mMediator.reconcileActionItems();\n        assertEquals(2, mModels.size());\n        verify(mRecyclerViewDelegate, times(1)).getButtonViewForId(ACTION3_ID);\n    }\n\n    @Test\n    public void testPendingContextMenuCallback_AfterDestroyIsIgnored() {\n        mMediator.requestShowContextMenu(ACTION3_ID);\n        ArgumentCaptor<Runnable> callback = ArgumentCaptor.forClass(Runnable.class);\n        verify(mRecyclerViewDelegate).addOnAnimationsFinishedRunnable(callback.capture());\n\n        mMediator.destroy();\n        // The RecyclerView may already have copied its callback list before it was cleared.\n        callback.getValue().run();\n\n        verify(mRecyclerViewDelegate, never()).getButtonViewForId(ACTION3_ID);\n    }\n\n    // Tests that requesting a context menu gracefully aborts without throwing an\n    // AssertionError if mActionState transitions away from Idle before the async\n    // layout animation runnable executes.\n"
