# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Physically remove actual product feature/service predicate; no false-return
      stub
    regex:
      re_pattern: '\ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Returns\ whether\ Glic\ is\ enabled\ for\ the\ given\ profile\
        in\ the\ context\ of\ the\ adaptive\ toolbar\.\

        \ \ \ \ \ \*/\

        \ \ \ \ public\ static\ boolean\ isGlicEnabledForAdaptiveToolbar\(Context\ context,\
        Profile\ profile\)\ \{\

        \ \ \ \ \ \ \ \ boolean\ isTablet\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ DeviceFormFactor\.isNonMultiDisplayContextOnTablet\(context\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !DeviceInfo\.isFoldable\(\);\

        \ \ \ \ \ \ \ \ return\ GlicEnabling\.isEnabledForProfile\(profile\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !isTablet\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !BottomBarConfigUtils\.isBottomBarEnabled\(context\);\

        \ \ \ \ \}'
      replace: ''
  - description: Remove actual product action-chip enablement
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(buttonVariant\ ==\ AdaptiveToolbarButtonVariant\.GLIC\)\
        return\ true;\

        '
      replace: ''
  - description: Remove Glic action-chip rendering selection; stable false metadata
      cases stay
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ switch\ \(buttonVariant\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ AdaptiveToolbarButtonVariant\.GLIC:\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ AdaptiveToolbarButtonVariant\.PRICE_TRACKING:'
      replace: "        switch (buttonVariant) {\n            case AdaptiveToolbarButtonVariant.PRICE_TRACKING:"
