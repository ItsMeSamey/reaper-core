substitutions:
  - description: Initialize the bottom tab switcher with a tab-specific accessibility label
    regex:
      pattern: "        setImageDrawable(mTabSwitcherButtonDrawable);\n"
      replace: "        setImageDrawable(mTabSwitcherButtonDrawable);\n        updateTabCountVisuals(0);\n"
    count: 1
  - description: Keep the bottom tab switcher accessibility label synchronized with its count
    regex:
      pattern: "        mTabSwitcherButtonDrawable.updateForTabCount(numberOfTabs, false);\n"
      replace: "        mTabSwitcherButtonDrawable.updateForTabCount(numberOfTabs, false);\n        setContentDescription(\n                getResources()\n                        .getQuantityString(\n                                R.plurals.accessibility_toolbar_btn_tabswitcher_toggle_default,\n                                numberOfTabs,\n                                numberOfTabs));\n"
    count: 1
