substitutions:
- description: "Android stable Recycler completion ownership 1"
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ @Nullable\\ Transition\\ mLastTransition;\\\n"
    replace: "    private @Nullable Transition mLastTransition;\n\n    private boolean mWaitingForItemAnimations;\n"
- description: "Android stable Recycler completion ownership 2"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(mItemAnimator\\.isRunning\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ return;\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ updateRecyclerViewWidth\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ runAllOnAnimationsFinishedRunnables\\(\\);"
    replace: "                                runOnAnimationsFinishedRunnablesIfStable();"
- description: "Android stable Recycler completion ownership 3"
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ void\\ runAllOnAnimationsFinishedRunnables\\(\\)\\ \\{\\\n"
    replace: "    /** Completes queued work only after the width, requested layout, and item owners settle. */\n    private void runOnAnimationsFinishedRunnablesIfStable() {\n        if (mLastTransition != null || isLayoutRequested()) {\n            return;\n        }\n        if (mItemAnimator.isRunning()) {\n            if (!mWaitingForItemAnimations) {\n                mWaitingForItemAnimations = true;\n                mItemAnimator.isRunning(\n                        () -> post(\n                                () -> {\n                                    mWaitingForItemAnimations = false;\n                                    runOnAnimationsFinishedRunnablesIfStable();\n                                }));\n            }\n            return;\n        }\n\n        updateRecyclerViewWidth();\n        // Updating the adapter-derived width can itself require another real layout.\n        if (mLastTransition == null && !isLayoutRequested() && !mItemAnimator.isRunning()) {\n            runAllOnAnimationsFinishedRunnables();\n        }\n    }\n\n    private void runAllOnAnimationsFinishedRunnables() {\n"
- description: "Android stable Recycler completion ownership 4"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ TransitionManager\\.endTransitions\\(mTransitionRoot\\);"
    replace: "                // Retire the old width owner before its synchronous completion callback.\n                mLastTransition = null;\n                TransitionManager.endTransitions(mTransitionRoot);"
- description: "Android stable Recycler completion ownership 5"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ runAllOnAnimationsFinishedRunnables\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mLastTransition\\ =\\ null;"
    replace: "                                    // External completion callbacks can start a new width owner.\n                                    mLastTransition = null;\n                                    runOnAnimationsFinishedRunnablesIfStable();"
