        \ \ \ \ \ \ \ \ \ \ \ \ return\ mAiOverlayMicrophoneButton\ !=\ null\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ mAiOverlayMicrophoneButton\.getVisibility\(\)\
        ==\ View\.VISIBLE;\

