substitutions:

# Reaper Android physical AI caller closure; genuine core behavior retained.
  - description: Remove actual AI pinned-chip visibility/observer/dispatch implementation
    regex:
      re_pattern: '\ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Observe\ Glic\ pinned\ state\ and\ vertical\ tab\ visibility\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ isVerticalTabsActiveSupplier\ Supplier\ of\ whether\ vertical\
        tab\ is\ active\.\

        \ \ \ \ \ \*\ @param\ isGlicPinnedSupplier\ Supplier\ of\ whether\ glic\ is\
        pinned\.\

        \ \ \ \ \ \*\ @param\ incognitoStateProvider\ Provider\ for\ observing\ incognito\
        state\ changes\.\

        \ \ \ \ \ \*\ @param\ glicLongClickListener\ Listener\ invoked\ when\ the\ Glic\
        action\ chip\ is\ long\-pressed\ or\

        \ \ \ \ \ \*\ \ \ \ \ right\-clicked\.\

        \ \ \ \ \ \*/\

        \ \ \ \ public\ void\ observeGlicVerticalTabs\(\

        \ \ \ \ \ \ \ \ \ \ \ \ NonNullObservableSupplier<Boolean>\ isVerticalTabsActiveSupplier,\

        \ \ \ \ \ \ \ \ \ \ \ \ NonNullObservableSupplier<Boolean>\ isGlicPinnedSupplier,\

        \ \ \ \ \ \ \ \ \ \ \ \ IncognitoStateProvider\ incognitoStateProvider,\

        \ \ \ \ \ \ \ \ \ \ \ \ View\.OnLongClickListener\ glicLongClickListener\)\
        \{\

        \ \ \ \ \ \ \ \ if\ \(!\(mToolbarLayout\ instanceof\ ToolbarTablet\ tabletLayout\)\)\
        return;\

        \

        \ \ \ \ \ \ \ \ mIsVerticalTabsActiveSupplier\ =\ isVerticalTabsActiveSupplier;\

        \ \ \ \ \ \ \ \ mIsGlicPinnedSupplier\ =\ isGlicPinnedSupplier;\

        \ \ \ \ \ \ \ \ mIncognitoStateProvider\ =\ incognitoStateProvider;\

        \ \ \ \ \ \ \ \ mGlicLongClickListener\ =\ glicLongClickListener;\

        \

        \ \ \ \ \ \ \ \ mGlicVerticalTabsObserver\ =\ this::onGlicVisibilityNeedsUpdate;\

        \ \ \ \ \ \ \ \ mIncognitoStateObserver\ =\ this::onGlicVisibilityNeedsUpdate;\

        \

        \ \ \ \ \ \ \ \ mIsVerticalTabsActiveSupplier\.addSyncObserver\(mGlicVerticalTabsObserver\);\

        \ \ \ \ \ \ \ \ mIsGlicPinnedSupplier\.addSyncObserver\(mGlicVerticalTabsObserver\);\

        \ \ \ \ \ \ \ \ mIncognitoStateProvider\.addIncognitoStateObserverAndTrigger\(mIncognitoStateObserver\);\

        \

        \ \ \ \ \ \ \ \ tabletLayout\.ensureGlicToolbarWidthConsumer\(\);\

        \ \ \ \ \}'
      replace: ''
  - description: Remove actual AI pinned-chip visibility/observer/dispatch implementation
    regex:
      re_pattern: '\ \ \ \ /\*\*\ Returns\ whether\ the\ Glic\ button\ should\ be\ shown\
        on\ the\ toolbar\.\ \*/\

        \ \ \ \ public\ boolean\ shouldShowGlicToolbarButton\(\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(!\(mToolbarLayout\ instanceof\ ToolbarTablet\)\)\ return\
        false;\

        \ \ \ \ \ \ \ \ if\ \(mIsVerticalTabsActiveSupplier\ ==\ null\ \|\|\ mIsGlicPinnedSupplier\
        ==\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ return\ Boolean\.TRUE\.equals\(mIsVerticalTabsActiveSupplier\.get\(\)\)\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ Boolean\.TRUE\.equals\(mIsGlicPinnedSupplier\.get\(\)\);\

        \ \ \ \ \}'
      replace: ''
  - description: Remove actual AI pinned-chip visibility/observer/dispatch implementation
    regex:
      re_pattern: '\ \ \ \ /\*\*\

        \ \ \ \ \ \*\ @return\ The\ \{@link\ View\}\ representing\ the\ Glic\ action\
        chip\ on\ the\ toolbar\.\

        \ \ \ \ \ \*/\

        \ \ \ \ public\ @Nullable\ View\ getGlicActionChipView\(\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(mToolbarLayout\ instanceof\ ToolbarTablet\ tabletLayout\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ return\ tabletLayout\.getGlicActionChipView\(\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ return\ null;\

        \ \ \ \ \}'
      replace: ''
  - description: Remove actual AI pinned-chip visibility/observer/dispatch implementation
    regex:
      re_pattern: '\ \ \ \ /\*\*\ Notifies\ the\ top\ toolbar\ whether\ the\ Glic\ UI\
        panel\ is\ currently\ open\.\ \*/\

        \ \ \ \ public\ void\ setGlicPanelIsOpen\(boolean\ isOpen\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(mToolbarLayout\ instanceof\ ToolbarTablet\ tabletLayout\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ tabletLayout\.setGlicPanelIsOpen\(isOpen\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}'
      replace: ''
  - description: Remove actual AI pinned-chip visibility/observer/dispatch implementation
    regex:
      re_pattern: '\ \ \ \ private\ void\ onGlicVisibilityNeedsUpdate\(boolean\ state\)\
        \{\

        \ \ \ \ \ \ \ \ if\ \(mToolbarLayout\ instanceof\ ToolbarTablet\ tabletLayout\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ tabletLayout\.setGlicActionChipVisibility\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ shouldShowGlicToolbarButton\(\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ v\ \->\ assumeNonNull\(mToggleGlicCallback\)\.run\(\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assumeNonNull\(mGlicLongClickListener\)\);\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \}'
      replace: ''
  - description: Remove teardown solely belonging to removed AI observer registration
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(mGlicVerticalTabsObserver\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mIsVerticalTabsActiveSupplier\.removeObserver\(mGlicVerticalTabsObserver\);\

        \ \ \ \ \ \ \ \ \ \ \ \ mIsGlicPinnedSupplier\.removeObserver\(mGlicVerticalTabsObserver\);\

        \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove teardown solely belonging to removed AI observer registration
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ if\ \(mIncognitoStateObserver\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mIncognitoStateProvider\.removeObserver\(mIncognitoStateObserver\);\

        \ \ \ \ \ \ \ \ \}'
      replace: ''
  - description: Remove exclusive AI component state
    regex:
      re_pattern: '\ \ \ \ private\ View\.@Nullable\ OnLongClickListener\ mGlicLongClickListener;\

        '
      replace: ''
  - description: Remove exclusive AI component state
    regex:
      re_pattern: '\ \ \ \ private\ @Nullable\ NonNullObservableSupplier<Boolean>\ mIsVerticalTabsActiveSupplier;\

        '
      replace: ''
  - description: Remove exclusive AI component state
    regex:
      re_pattern: '\ \ \ \ private\ @Nullable\ NonNullObservableSupplier<Boolean>\ mIsGlicPinnedSupplier;\

        '
      replace: ''
  - description: Remove exclusive AI component state
    regex:
      re_pattern: '\ \ \ \ private\ @Nullable\ Runnable\ mToggleGlicCallback;\

        '
      replace: ''
  - description: Remove exclusive AI component state
    regex:
      re_pattern: '\ \ \ \ private\ @Nullable\ Callback<Boolean>\ mGlicVerticalTabsObserver;\

        '
      replace: ''
  - description: Remove exclusive AI component state
    regex:
      re_pattern: '\ \ \ \ private\ IncognitoStateProvider\.@Nullable\ IncognitoStateObserver\
        mIncognitoStateObserver;\

        '
      replace: ''
  - description: Remove exclusive AI component state
    regex:
      re_pattern: '\ \ \ \ private\ @Nullable\ IncognitoStateProvider\ mIncognitoStateProvider;\

        '
      replace: ''
  - description: Remove AI-only parameter documentation
    regex:
      re_pattern: '\ \ \ \ \ \*\ @param\ toggleGlicCallback\ Callback\ to\ invoke\ when\
        Glic\ button\ is\ toggled\.\

        '
      replace: ''
  - description: Narrow real initialization signature; preserve every ordinary toolbar/compositor
      input
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ TabStripTransitionHandler\ tabStripTransitionHandler,\

        \ \ \ \ \ \ \ \ \ \ \ \ Runnable\ toggleGlicCallback\)\ \{'
      replace: '            TabStripTransitionHandler tabStripTransitionHandler) {'
  - description: Remove actual callback ownership
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ mToggleGlicCallback\ =\ toggleGlicCallback;\

        '
      replace: ''
  - description: Remove imports with no retained source reference
    regex:
      re_pattern: 'import\ static\ org\.chromium\.build\.NullUtil\.assumeNonNull;\

        '
      replace: ''
