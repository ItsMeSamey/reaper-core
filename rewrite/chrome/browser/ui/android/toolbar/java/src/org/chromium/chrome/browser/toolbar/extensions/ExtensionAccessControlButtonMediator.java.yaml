substitutions:
- description: Refresh Android access requests after action removal and exercise current message replacement
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ public\ void\ onRequestAccessButtonParamsChanged\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ refreshRequestAccessButton\(\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \}\

      '
    replace: "        public void onRequestAccessButtonParamsChanged() {\n            refreshRequestAccessButton();\n        }\n\n        @Override\n        public void onActionRemoved(String actionId) {\n            refreshRequestAccessButton();\n        }\n    }\n}\n"
