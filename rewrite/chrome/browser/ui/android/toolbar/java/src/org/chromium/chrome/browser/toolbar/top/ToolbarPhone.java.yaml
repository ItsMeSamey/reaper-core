substitutions:
  - description: |
      Refresh the Brave toolbar button tint before Chromium's cached-color early return.

      A private-to-standard tab switch can replace Brave button backgrounds. Refreshing the color
      at the start of the method ensures the toolbar displays correctly, and this refresh call
      is not ignored by upstream's early-exit due to the cached color being unchanged.
    regex:
      re_pattern: '(private void updateModernLocationBarColor\([^)]*\)\s*\{)'
      replace: |-
        \1
                BraveToolbarLayout.class.cast(this).updateModernLocationBarColorImpl(color);
  - description: |
      Skip location bar layout when the Brave location bar is unavailable.

      Check the Brave location bar at the start of the expansion-layout update.
    regex:
      re_pattern: '(private\s+void\s+updateLocationBarLayoutForExpansionAnimation\(\)\s*\{)'
      replace: |-
        \1
                if (!BraveToolbarLayout.class.cast(this).isLocationBarValid(mLocationBar)) return;
  - description: |
      Require omnibox focus for the DSE icon focus-animation offset.

      Upstream moves focus to a 1px thief view inside the location bar when an
      omnibox session ends, so the View#hasFocus() this is called with stays
      true once unfocused and the offset that makes room for the DSE icon is
      never undone. Brave keeps the real omnibox visible on the NTP, where that
      leaves the status icon shifted out of the location bar background.
    regex:
      re_pattern: '(int\s+getLocationBarOffsetForFocusAnimation\([^)]*\)\s*\{)'
      replace: |-
        \1
                if (!urlHasFocus()) return 0;
  - description: |
      Draw Brave's toolbar animation overlay with the Chromium toolbar buttons.

      Place the overlay before the tab-switcher button in the toolbar's custom draw pass.
    regex:
      re_pattern:
        '(void\s+drawWithoutBackground\(Canvas\s+canvas\)\s*\{.*?\n[ \t]*\n)([
        \t]*// Draw the tab stack button and associated text if necessary\.)'
      re_flags: [DOTALL]
      replace: |-
        \1        BraveToolbarLayout.class.cast(this).drawAnimationOverlay(mToolbarButtonsContainer, canvas);
        \2
  - description: |
      Keep the home button disabled in the Brave phone toolbar.

      Override Chromium's home-button state before updating button visibility.
    regex:
      re_pattern: '(public\s+void\s+onHomeButtonIsEnabledUpdate\(boolean\s+(\w+)\)\s*\{\s*)mIsHomeButtonEnabled\s*=\s*\2;'
      replace: '\1mIsHomeButtonEnabled = false;'
  - description: |
      Skip legacy focus animations when the Brave location bar is unavailable.

      Check the Brave location bar at the start of the legacy focus-animation setup.
    regex:
      re_pattern: '(private\s+void\s+createAndRunFocusAnimatorLegacy\([^)]*\)\s*\{)'
      replace: |-
        \1
                if (!BraveToolbarLayout.class.cast(this).isLocationBarValid(mLocationBar)) return;
  - description: |
      Let Brave update the NTP toolbar background color.

      The coordinator is in the same Java package, so package-private mutable access is sufficient.
    regex:
      re_pattern: '\bprivate\s+final\s+(@ColorInt\s+int\s+mToolbarBackgroundColorForNtp\b)'
      replace: '\1'
  - description: |
      Let Brave update the NTP location bar background color.

      The coordinator is in the same Java package, so package-private mutable access is sufficient.
    regex:
      re_pattern: '\bprivate\s+final\s+(@ColorInt\s+int\s+mLocationBarBackgroundColorForNtp\b)'
      replace: '\1'
  - description: Reserve phone toolbar width for extension actions without consuming navigation controls
    regex:
      re_pattern: 'import\ org\.chromium\.chrome\.browser\.toolbar\.ToolbarTabController;\

        import\ org\.chromium\.chrome\.browser\.toolbar\.ToolbarVariationUtils;\

        import\ org\.chromium\.chrome\.browser\.toolbar\.back_button\.BackButtonCoordinator;\

        import\ org\.chromium\.chrome\.browser\.toolbar\.forward_button\.ForwardButtonCoordinator;\

        import\ org\.chromium\.chrome\.browser\.toolbar\.home_button\.HomeButtonCoordinator;\

        import\ org\.chromium\.chrome\.browser\.toolbar\.menu_button\.MenuButtonCoordinator;\

        '
      replace: 'import org.chromium.chrome.browser.toolbar.ToolbarTabController;

        import org.chromium.chrome.browser.toolbar.ToolbarVariationUtils;

        import org.chromium.chrome.browser.toolbar.back_button.BackButtonCoordinator;

        import org.chromium.chrome.browser.toolbar.extensions.ExtensionsToolbarCoordinator;

        import org.chromium.chrome.browser.toolbar.forward_button.ForwardButtonCoordinator;

        import org.chromium.chrome.browser.toolbar.home_button.HomeButtonCoordinator;

        import org.chromium.chrome.browser.toolbar.menu_button.MenuButtonCoordinator;

        '
  - description: Reserve phone toolbar width for extension actions without consuming navigation controls
    regex:
      re_pattern: '\ \ \ \ private\ MonotonicObservableSupplier<Tracker>\ mTrackerSupplier;\

        \

        \ \ \ \ private\ ViewGroup\ mToolbarButtonsContainer;\

        \ \ \ \ private\ @MonotonicNonNull\ OptionalButtonCoordinator\ mOptionalButtonCoordinator;\

        \ \ \ \ //\ Non\-null\ after\ inflation\ occurs\.\

        \ \ \ \ private\ ImageView\ mHomeButton;\

        '
      replace: "    private MonotonicObservableSupplier<Tracker> mTrackerSupplier;\n\n    private ViewGroup mToolbarButtonsContainer;\n    private @Nullable ExtensionsToolbarCoordinator mExtensionsToolbarCoordinator;\n    private @MonotonicNonNull OptionalButtonCoordinator mOptionalButtonCoordinator;\n    // Non-null after inflation occurs.\n    private ImageView mHomeButton;\n"
  - description: Reserve phone toolbar width for extension actions without consuming navigation controls
    regex:
      re_pattern: '\ \ \ \ \}\

        \

        \ \ \ \ @Override\

        \ \ \ \ protected\ void\ onMeasure\(int\ widthMeasureSpec,\ int\ heightMeasureSpec\)\ \{\

        \ \ \ \ \ \ \ \ //\ In\ case\ the\ call\ came\ from\ the\ handler\ after\ we\ destroyed\ the\ dependencies,\ skip\ the\ work\

        \ \ \ \ \ \ \ \ //\ that\ could\ touch\ the\ already\ destroyed\ objects\.\

        \ \ \ \ \ \ \ \ if\ \(mDestroyChecker\.isDestroyed\(\)\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ super\.onMeasure\(widthMeasureSpec,\ heightMeasureSpec\);\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ if\ \(!mDisableLocationBarRelayout\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ super\.onMeasure\(widthMeasureSpec,\ heightMeasureSpec\);\

        '
      replace: "    }\n\n    @Override\n    public void setExtensionsToolbarCoordinator(\n            @Nullable ExtensionsToolbarCoordinator extensionsToolbarCoordinator) {\n        mExtensionsToolbarCoordinator = extensionsToolbarCoordinator;\n        requestLayout();\n    }\n\n    private void updateExtensionsToolbarWidth(int toolbarWidth) {\n        if (mExtensionsToolbarCoordinator == null) return;\n        View extensionsContainer = findViewById(R.id.extensions_toolbar_container);\n        if (extensionsContainer == null) return;\n\n        // The phone toolbar does not use ToolbarTablet's ranking pass. Reserve existing controls\n        // before allocating extension buttons, including their margins in RTL.\n        int occupiedWidth =\n                getBoundsAfterAccountingForLeftButton()\n                        + getPaddingLeft()\n                        + getPaddingRight()\n                        + mToolbarButtonsContainer.getPaddingLeft()\n                        + mToolbarButtonsContainer.getPaddingRight();\n        int controlsWidth = toolbarWidth - getPaddingLeft() - getPaddingRight();\n        if (mToolbarButtonsContainer.getLayoutParams() instanceof MarginLayoutParams margins) {\n            occupiedWidth += margins.leftMargin + margins.rightMargin;\n            controlsWidth -= margins.leftMargin + margins.rightMargin;\n        }\n        if (extensionsContainer.getLayoutParams() instanceof MarginLayoutParams margins) {\n            occupiedWidth += margins.leftMargin + margins.rightMargin;\n        }\n        int controlsWidthSpec =\n                MeasureSpec.makeMeasureSpec(Math.max(0, controlsWidth), MeasureSpec.AT_MOST);\n        int controlsHeightSpec =\n                MeasureSpec.makeMeasureSpec(\n                        mToolbarButtonsContainer.getMeasuredHeight(), MeasureSpec.EXACTLY);\n        for (int i = 0; i < mToolbarButtonsContainer.getChildCount(); i++) {\n            View child = mToolbarButtonsContainer.getChildAt(i);\n            if (child == extensionsContainer || child.getVisibility() == GONE) continue;\n            ViewGroup.LayoutParams params = child.getLayoutParams();\n            int horizontalMargins = 0;\n            int verticalMargins = 0;\n            if (params instanceof MarginLayoutParams margins) {\n                horizontalMargins = margins.leftMargin + margins.rightMargin;\n                verticalMargins = margins.topMargin + margins.bottomMargin;\n            }\n            // The initial bounded pass may clip controls following an oversized extension list.\n            // Measure their own demand without that list's widthUsed. AT_MOST preserves intrinsic\n            // sizing for the Brave toolbar include, whose layout width is MATCH_PARENT.\n            child.measure(\n                    getChildMeasureSpec(\n                            controlsWidthSpec,\n                            mToolbarButtonsContainer.getPaddingLeft()\n                                    + mToolbarButtonsContainer.getPaddingRight()\n                                    + horizontalMargins,\n                            params.width),\n                    getChildMeasureSpec(\n                            controlsHeightSpec,\n                            mToolbarButtonsContainer.getPaddingTop()\n                                    + mToolbarButtonsContainer.getPaddingBottom()\n                                    + verticalMargins,\n                            params.height));\n            occupiedWidth += child.getMeasuredWidth() + horizontalMargins;\n        }\n\n        int availableWidth = Math.max(0, toolbarWidth - occupiedWidth);\n        availableWidth =\n                Math.max(\n                        0,\n                        availableWidth\n                                - mExtensionsToolbarCoordinator\n                                        .getPoppedOutActionWidthConsumer()\n                                        .updateVisibility(availableWidth));\n        availableWidth =\n                Math.max(\n                        0,\n                        availableWidth\n                                - mExtensionsToolbarCoordinator\n                                        .getMenuButtonWidthConsumer()\n                                        .updateVisibility(availableWidth));\n        // A popup's temporary anchor and the menu outrank optional URL-bar affordances. Keep\n        // all remaining space for the URL bar on compact phones; only spare width admits pins.\n        availableWidth =\n                Math.max(\n                        0,\n                        availableWidth\n                                - getResources()\n                                        .getDimensionPixelSize(\n                                                R.dimen.location_bar_minimalistic_ui_threshold));\n        availableWidth =\n                Math.max(\n                        0,\n                        availableWidth\n                                - mExtensionsToolbarCoordinator\n                                        .getRequestAccessButtonWidthConsumer()\n                                        .updateVisibility(availableWidth));\n        // This also reconciles the temporary action that must anchor an unpinned action's popup.\n        mExtensionsToolbarCoordinator\n                .getActionListWidthConsumer()\n                .updateVisibility(availableWidth);\n    }\n\n    @Override\n    protected void onMeasure(int widthMeasureSpec, int heightMeasureSpec) {\n        // In case the call came from the handler after we destroyed the dependencies, skip the work\n        // that could touch the already destroyed objects.\n        if (mDestroyChecker.isDestroyed()) {\n            super.onMeasure(widthMeasureSpec, heightMeasureSpec);\n            return;\n        }\n        if (mExtensionsToolbarCoordinator != null) {\n            // Measure existing controls first, then let the normal pass measure the allocated list.\n            super.onMeasure(widthMeasureSpec, heightMeasureSpec);\n            updateExtensionsToolbarWidth(MeasureSpec.getSize(widthMeasureSpec));\n        }\n        if (!mDisableLocationBarRelayout) {\n            super.onMeasure(widthMeasureSpec, heightMeasureSpec);\n"
  - description: Reserve phone toolbar width for extension actions without consuming navigation controls
    regex:
      re_pattern: '\

        \ \ \ \ \ \ \ \ mUnfocusedLocationBarLayoutLeft\ =\ leftViewBounds;\

        \ \ \ \ \ \ \ \ mUnfocusedLocationBarLayoutRight\ =\ rightViewBounds;\

        \ \ \ \ \ \ \ \ int\ unfocusedLocationBarLayoutWidth\ =\ rightViewBounds\ \-\ leftViewBounds;\

        \ \ \ \ \ \ \ \ if\ \(mUnfocusedLocationBarLayoutWidth\ !=\ unfocusedLocationBarLayoutWidth\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ mUnfocusedLocationBarLayoutWidth\ =\ unfocusedLocationBarLayoutWidth;\

        \ \ \ \ \ \ \ \ \ \ \ \ mLocationBar\.setUnfocusedWidth\(mUnfocusedLocationBarLayoutWidth\);\

        '
      replace: "\n        mUnfocusedLocationBarLayoutLeft = leftViewBounds;\n        mUnfocusedLocationBarLayoutRight = rightViewBounds;\n        // A retiring extension row can retain its old width until its removal animation ends.\n        // Never pass a negative width through to LayoutParams as MATCH_PARENT or WRAP_CONTENT.\n        int unfocusedLocationBarLayoutWidth = Math.max(0, rightViewBounds - leftViewBounds);\n        if (mUnfocusedLocationBarLayoutWidth != unfocusedLocationBarLayoutWidth) {\n            mUnfocusedLocationBarLayoutWidth = unfocusedLocationBarLayoutWidth;\n            mLocationBar.setUnfocusedWidth(mUnfocusedLocationBarLayoutWidth);\n"
  - description: Remove listener for excluded specialized Fusebox mode
    regex:
      pattern: "        mLocationBar.setOnSpecializedFuseboxModeActivatedListener(\n                isSpecializedMode -> updateBackgroundHairline(urlHasFocus(),\
        \ isSpecializedMode));\n"
      replace: ''
    count: 1
  - description: Remove sole specialized Fusebox rainbow-outline callback
    regex:
      pattern: "    private void updateBackgroundHairline(boolean urlHasFocus, boolean shouldShowRainbowOutline) {\n       \
        \ if (!urlHasFocus) {\n            mLocationBarBackground.setHairlineBehavior(HairlineBehavior.NONE);\n            return;\n\
        \        }\n\n        mLocationBarBackground.setHairlineBehavior(\n                shouldShowRainbowOutline ? HairlineBehavior.RAINBOW\
        \ : HairlineBehavior.NONE);\n    }\n\n"
      replace: ''
    count: 1
  - description: Use retained ordinary standby-border drawable constructor
    regex:
      pattern: "                        /* strokePx= */ resources.getDimensionPixelSize(\n                                R.dimen.fusebox_glif_stroke_width),\n\
        \                        /* blurStrokePx= */ resources.getDimensionPixelSize(\n                                R.dimen.fusebox_glif_blur_stroke_width));"
      replace: "                        /* standbyStrokePx= */ resources.getDimensionPixelSize(\n                          \
        \      R.dimen.location_bar_standby_border_width));"
    count: 1
