# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/android/toolbar/java/res/layout/radio_button_group_adaptive_toolbar_preference.xml'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ app:iconSrc="@drawable/ic_share_white_24dp"\

      \ \ \ \ \ \ \ \ \ \ app:primaryText="@string/adaptive_toolbar_button_preference_share"\ />\

      \

      \ \ \ \ \ \ <org\.chromium\.components\.browser_ui\.widget\.RadioButtonWithDescription\

      \ \ \ \ \ \ \ \ \ \ android:id="@\+id/adaptive_option_glic"\

      \ \ \ \ \ \ \ \ \ \ android:layout_width="match_parent"\

      \ \ \ \ \ \ \ \ \ \ android:layout_height="wrap_content"\

      \ \ \ \ \ \ \ \ \ \ android:minHeight="@dimen/min_touch_target_size"\

      \ \ \ \ \ \ \ \ \ \ android:paddingTop="10dp"\

      \ \ \ \ \ \ \ \ \ \ app:iconSrc="@drawable/ic_spark_24dp"\

      \ \ \ \ \ \ \ \ \ \ app:primaryText="@string/glic_button_entrypoint_ask_gemini_label"\ />\

      \

      \ \ \ \ \ \ <org\.chromium\.components\.browser_ui\.widget\.RadioButtonWithDescription\

      \ \ \ \ \ \ \ \ \ \ android:id="@\+id/adaptive_option_voice_search"\

      '
    replace: "          app:iconSrc=\"@drawable/ic_share_white_24dp\"\n          app:primaryText=\"@string/adaptive_toolbar_button_preference_share\" />\n\n\n      <org.chromium.components.browser_ui.widget.RadioButtonWithDescription\n          android:id=\"@+id/adaptive_option_voice_search\"\n"

- description: Preserve the inherited ordinary Brave adaptive toolbar buttons include in the canonical recipe
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ app:iconSrc="@drawable/new_tab_icon"\

      \ \ \ \ \ \ \ \ \ \ app:primaryText="@string/adaptive_toolbar_button_preference_new_tab"/>\

      \

      \ \ \ \ \ \ <org\.chromium\.components\.browser_ui\.widget\.RadioButtonWithDescription\

      \ \ \ \ \ \ \ \ \ \ android:id="@\+id/adaptive_option_share"\

      \ \ \ \ \ \ \ \ \ \ android:layout_width="match_parent"\

      '
    replace: "          app:iconSrc=\"@drawable/new_tab_icon\"\n          app:primaryText=\"@string/adaptive_toolbar_button_preference_new_tab\"/>\n\n      <include layout=\"@layout/brave_adaptive_preference_buttons\" />\n      <org.chromium.components.browser_ui.widget.RadioButtonWithDescription\n          android:id=\"@+id/adaptive_option_share\"\n          android:layout_width=\"match_parent\"\n"
