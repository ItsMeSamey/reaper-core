# Android phone extension toolbar uses Chromium's existing native coordinator.
# The first two substitutions preserve Brave's original phone toolbar patch.
substitutions:
  - description: Keep Brave's end margin on phone toolbar buttons.
    regex:
      pattern: '        android:layout_gravity="top|end"'
      replace: |2-
                android:layout_marginEnd="8dp"
                android:layout_gravity="top|end"
  - description: Keep Brave's toolbar controls in the phone button container.
    regex:
      re_pattern: '(android:id="@\+id/toolbar_buttons".*?android:focusableInTouchMode="false">)'
      re_flags: [DOTALL]
      replace: |2-
        \1
            <include layout="@layout/brave_toolbar" android:layout_height="@dimen/brave_toolbar_button_height" android:layout_width="match_parent" android:layout_marginTop="@dimen/location_bar_vertical_margin" />
  - description: Inflate the native extension toolbar on phones as well as tablets.
    regex:
      pattern: '        <include layout="@layout/menu_button"/>'
      replace: |2-
                <ViewStub
                    android:id="@+id/extensions_toolbar_container_stub"
                    android:inflatedId="@+id/extensions_toolbar_container"
                    android:layout_width="wrap_content"
                    android:layout_height="?attr/toolbarButtonHeight"
                    android:layout_marginVertical="?attr/toolbarButtonMarginVertical"/>

                <include layout="@layout/menu_button"/>
