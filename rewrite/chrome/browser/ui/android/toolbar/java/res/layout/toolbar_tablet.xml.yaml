substitutions:
  - description: |-
      Nest the Brave toolbar buttons inside the tablet location bar.

      The location bar paints the text box and the focus ring around it, so the
      shields and rewards buttons have to be its children to sit inside that
      outline. BraveToolbarLayoutImpl constrains the row once inflated.
    regex:
      re_pattern: |-
        ( *)<(org\.chromium\.chrome\.browser\.omnibox\.LocationBarTablet)([^>]*?)/>
      replace: |-
        \1<\2\3>
        \1  <include layout="@layout/brave_toolbar" android:layout_height="@dimen/modern_toolbar_background_size" android:layout_width="wrap_content" />
        \1</\2>
  - description: Remove the unused dedicated Glic divider with excluded dimensions
    regex:
      pattern: "        <View\n            android:id=\"@+id/glic_divider\"\n            android:layout_width=\"@dimen/glic_divider_width\"\
        \n            android:layout_height=\"@dimen/glic_divider_height\"\n            android:layout_marginVertical=\"@dimen/glic_divider_margin\"\
        \n            android:background=\"@drawable/divider_line_bg\"\n            android:importantForAccessibility=\"no\"\
        \n            android:visibility=\"gone\" />\n\n"
      replace: ''
    count: 1
  - description: Remove the unused dedicated Glic action chip stub
    regex:
      pattern: "        <ViewStub\n            android:id=\"@+id/glic_action_chip_stub\"\n            android:inflatedId=\"\
        @+id/glic_action_chip\"\n            android:layout=\"@layout/optional_toolbar_button\"\n            style=\"@style/ToolbarHoverableButton.AdaptiveDensity\"\
        \n            android:layout_width=\"@dimen/min_touch_target_size\"\n            android:layout_height=\"?attr/toolbarButtonHeight\"\
        \n            android:visibility=\"gone\" />\n\n"
      replace: ''
    count: 1
  - description: Remove the dedicated unused AI-overlay microphone node from the tablet toolbar
    regex:
      pattern: "        <org.chromium.chrome.browser.toolbar.top.AiOverlayMicrophoneButtonView\n            android:id=\"@+id/ai_overlay_microphone_button\"\
        \n            style=\"@style/ToolbarHoverableButton.AdaptiveDensity\"\n            android:clickable=\"true\"\n    \
        \        android:focusable=\"true\"\n            android:src=\"@drawable/ic_mic_white_24dp\"\n            android:visibility=\"\
        gone\"\n            android:contentDescription=\"@string/accessibility_toolbar_btn_ai_overlay_mic\"\n            android:tooltipText=\"\
        @string/accessibility_toolbar_btn_ai_overlay_mic\" />\n\n"
      replace: ''
    count: 1
