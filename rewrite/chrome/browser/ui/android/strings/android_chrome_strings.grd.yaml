substitutions:
  - description: "Exclude the removed Gemini BottomBar IPH message on Android."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_IPH_ANDROID_BOTTOM_BAR_GLIC\"\\ desc=\"The\\ in\\-product\\-help\\ message\\ for\\ the\\ GLIC\\ button\\ in\\ the\\ bottom\\ bar\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Ask\\ Gemini\\ to\\ help\\ with\\ your\\ tabs\\ and\\ tasks\\\n\\ \\ \\ \\ \\ \\ </message>\\\n"
      replace: "      <if expr=\"not is_android\">\n      <message name=\"IDS_IPH_ANDROID_BOTTOM_BAR_GLIC\" desc=\"The in-product-help message for the GLIC button in the bottom bar.\">\n        Ask Gemini to help with your tabs and tasks\n      </message>\n      </if>\n"
  - description: "Exclude the removed optional AIM and promo dialog messages on Android."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_IPH_ANDROID_BOTTOM_BAR_AIM\"\\ desc=\"The\\ in\\-product\\-help\\ message\\ for\\ the\\ AI\\ Mode\\ button\\ in\\ the\\ bottom\\ bar\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Search\\ with\\ AI\\ Mode\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_IPH_ANDROID_BOTTOM_BAR_DIALOG_TITLE\"\\ desc=\"Title\\ for\\ the\\ in\\-product\\ help\\ dialog\\ introducing\\ Gemini\\ in\\ the\\ bottom\\ bar\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Introducing\\ Gemini\\ in\\ Chrome\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_IPH_ANDROID_BOTTOM_BAR_AIM_DIALOG_TITLE\"\\ desc=\"Title\\ for\\ the\\ in\\-product\\ help\\ dialog\\ introducing\\ AI\\ Mode\\ in\\ the\\ bottom\\ bar\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Introducing\\ AI\\ Mode\\ in\\ Chrome\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_IPH_ANDROID_BOTTOM_BAR_DIALOG_DESCRIPTION\"\\ desc=\"Description\\ for\\ the\\ bottom\\ bar\\ Gemini\\ introduction\\ dialog\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Some\\ tools\\ have\\ moved\\ to\\ give\\ you\\ easy\\ access\\ to\\ Gemini\\ while\\ you\\ browse\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_IPH_ANDROID_BOTTOM_BAR_AIM_DIALOG_DESCRIPTION\"\\ desc=\"Description\\ for\\ the\\ bottom\\ bar\\ AI\\ Mode\\ introduction\\ dialog\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Some\\ tools\\ have\\ moved\\ to\\ help\\ you\\ search\\ with\\ AI\\ Mode\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_IPH_ANDROID_BOTTOM_BAR_TRIGGER_IPH\"\\ desc=\"Text\\ on\\ the\\ button\\ that\\ triggers\\ the\\ in\\-product\\-help\\ sequence\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Show\\ me\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_IPH_ANDROID_BOTTOM_BAR_DIALOG_ACK\"\\ desc=\"Button\\ text\\ to\\ acknowledge\\ bottom\\ bar\\ changes\\ and\\ dismiss\\ the\\ dialog\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Got\\ it\\\n\\ \\ \\ \\ \\ \\ </message>\\\n"
      replace: "      <if expr=\"not is_android\">\n      <message name=\"IDS_IPH_ANDROID_BOTTOM_BAR_AIM\" desc=\"The in-product-help message for the AI Mode button in the bottom bar.\">\n        Search with AI Mode\n      </message>\n      <message name=\"IDS_IPH_ANDROID_BOTTOM_BAR_DIALOG_TITLE\" desc=\"Title for the in-product help dialog introducing Gemini in the bottom bar.\">\n        Introducing Gemini in Chrome\n      </message>\n      <message name=\"IDS_IPH_ANDROID_BOTTOM_BAR_AIM_DIALOG_TITLE\" desc=\"Title for the in-product help dialog introducing AI Mode in the bottom bar.\">\n        Introducing AI Mode in Chrome\n      </message>\n      <message name=\"IDS_IPH_ANDROID_BOTTOM_BAR_DIALOG_DESCRIPTION\" desc=\"Description for the bottom bar Gemini introduction dialog.\">\n        Some tools have moved to give you easy access to Gemini while you browse\n      </message>\n      <message name=\"IDS_IPH_ANDROID_BOTTOM_BAR_AIM_DIALOG_DESCRIPTION\" desc=\"Description for the bottom bar AI Mode introduction dialog.\">\n        Some tools have moved to help you search with AI Mode\n      </message>\n      <message name=\"IDS_IPH_ANDROID_BOTTOM_BAR_TRIGGER_IPH\" desc=\"Text on the button that triggers the in-product-help sequence.\">\n        Show me\n      </message>\n      <message name=\"IDS_IPH_ANDROID_BOTTOM_BAR_DIALOG_ACK\" desc=\"Button text to acknowledge bottom bar changes and dismiss the dialog.\">\n        Got it\n      </message>\n      </if>\n"
  - description: "Exclude the removed AI-mode BottomBar accessibility label on Android."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_ACCESSIBILITY_BOTTOM_BAR_AI_MODE_BUTTON\"\\ desc=\"Content\\ description\\ for\\ the\\ AI\\ search\\ button\\ in\\ the\\ bottom\\ bar\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Ask\\ AI\\ Mode\\\n\\ \\ \\ \\ \\ \\ </message>\\\n"
      replace: "      <if expr=\"not is_android\">\n      <message name=\"IDS_ACCESSIBILITY_BOTTOM_BAR_AI_MODE_BUTTON\" desc=\"Content description for the AI search button in the bottom bar.\">\n        Ask AI Mode\n      </message>\n      </if>\n"
  - description: "Exclude the optional Gemini BottomBar settings labels on Android."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_SETTINGS_SHOW_GEMINI_IN_BOTTOM_BAR_TITLE\"\\ desc=\"Title\\ for\\ the\\ settings\\ toggle\\ to\\ show\\ or\\ hide\\ Gemini\\ in\\ the\\ bottom\\ bar\\.\\ \\[CHAR_LIMIT=32\\]\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Show\\ Gemini\\ in\\ the\\ bottom\\ toolbar\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_SETTINGS_SHOW_GEMINI_IN_BOTTOM_BAR_SUMMARY\"\\ desc=\"Summary\\ description\\ for\\ the\\ settings\\ toggle\\ to\\ show\\ Gemini\\ in\\ the\\ bottom\\ bar\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Quickly\\ open\\ Gemini\\ when\\ you\\ need\\ it\\\n\\ \\ \\ \\ \\ \\ </message>\\\n"
      replace: "      <if expr=\"not is_android\">\n      <message name=\"IDS_SETTINGS_SHOW_GEMINI_IN_BOTTOM_BAR_TITLE\" desc=\"Title for the settings toggle to show or hide Gemini in the bottom bar. [CHAR_LIMIT=32]\">\n        Show Gemini in the bottom toolbar\n      </message>\n      <message name=\"IDS_SETTINGS_SHOW_GEMINI_IN_BOTTOM_BAR_SUMMARY\" desc=\"Summary description for the settings toggle to show Gemini in the bottom bar.\">\n        Quickly open Gemini when you need it\n      </message>\n      </if>\n"

  - description: "Android Finds compile-out: Exclude Finds-only strings from Android GRIT resources"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ <!\\-\\-\\ Chrome\\ Finds\\ \\-\\->\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_TITLE\"\\ desc=\"Title\\ of\\ the\\ Chrome\\ Finds\\ opt\\-in\\ bottom\\ sheet\\ promo\\.\\ \\[CHAR_LIMIT=32\\]\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Let\\ Chrome\\ keep\\ looking\\?\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_DESCRIPTION\"\\ desc=\"Description\\ of\\ the\\ Chrome\\ Finds\\ opt\\-in\\ bottom\\ sheet\\ promo\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Get\\ notified\\ when\\ Chrome\\ finds\\ the\\ best\\ results\\ for\\ your\\ searches\\ while\\ you\\\\u2019re\\ away\\.\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_POSITIVE_BUTTON_TEXT\"\\ desc=\"Button\\ text\\ for\\ the\\ Chrome\\ Finds\\ opt\\-in\\ bottom\\ sheet\\ to\\ accept\\ notifications\\.\\ \\[CHAR_LIMIT=32\\]\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Notify\\ me\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_NEGATIVE_BUTTON_TEXT\"\\ desc=\"Button\\ text\\ for\\ the\\ Chrome\\ Finds\\ opt\\-in\\ bottom\\ sheet\\ to\\ reject\\ notifications\\.\\ \\[CHAR_LIMIT=32\\]\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ No,\\ thanks\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_CONTENT_DESCRIPTION\"\\ desc=\"Content\\ description\\ of\\ the\\ Chrome\\ Finds\\ opt\\-in\\ bottom\\ sheet\\ informing\\ the\\ user\\ on\\ what\\ Chrome\\ Finds\\ is\\ and\\ asking\\ whether\\ to\\ opt\\-in\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Chrome\\ finds\\ opt\\-in\\ bottom\\ sheet\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_CLOSED_CONTENT_DESCRIPTION\"\\ desc=\"Content\\ description\\ of\\ the\\ Chrome\\ Finds\\ opt\\-in\\ bottom\\ sheet\\ when\\ closed\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Chrome\\ finds\\ opt\\-in\\ closed\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_HALF_HEIGHT_CONTENT_DESCRIPTION\"\\ desc=\"Content\\ description\\ of\\ the\\ Chrome\\ Finds\\ opt\\-in\\ bottom\\ sheet\\ when\\ opened\\ at\\ half\\ height\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Chrome\\ finds\\ opt\\-in\\ opened\\ at\\ half\\ height\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_FULL_HEIGHT_CONTENT_DESCRIPTION\"\\ desc=\"Content\\ description\\ of\\ the\\ Chrome\\ Finds\\ opt\\-in\\ bottom\\ sheet\\ when\\ opened\\ at\\ full\\ height\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Chrome\\ finds\\ opt\\-in\\ opened\\ at\\ full\\ height\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_SNACKBAR_MESSAGE\"\\ desc=\"Snackbar\\ message\\ shown\\ when\\ the\\ user\\ opts\\ in\\ to\\ receive\\ personalized\\ notifications\\.\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Chrome\\ finds\\ notifications\\ turned\\ on\\\n\\ \\ \\ \\ \\ \\ </message>\\\n\\ \\ \\ \\ \\ \\ <message\\ name=\"IDS_CHROME_FINDS_OPT_IN_SNACKBAR_ACTION_TEXT\"\\ desc=\"Action\\ button\\ of\\ the\\ Chrome\\ Finds\\ snackbar\\ on\\ user\\ opt\\-in\\.\\ \\[CHAR_LIMIT=10\\]\">\\\n\\ \\ \\ \\ \\ \\ \\ \\ Manage\\\n\\ \\ \\ \\ \\ \\ </message>\\\n"
      replace: "      <if expr=\"not is_android\">\n        <!-- Chrome Finds -->\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_TITLE\" desc=\"Title of the Chrome Finds opt-in bottom sheet promo. [CHAR_LIMIT=32]\">\n          Let Chrome keep looking?\n        </message>\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_DESCRIPTION\" desc=\"Description of the Chrome Finds opt-in bottom sheet promo.\">\n          Get notified when Chrome finds the best results for your searches while you\\\\u2019re away.\n        </message>\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_POSITIVE_BUTTON_TEXT\" desc=\"Button text for the Chrome Finds opt-in bottom sheet to accept notifications. [CHAR_LIMIT=32]\">\n          Notify me\n        </message>\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_NEGATIVE_BUTTON_TEXT\" desc=\"Button text for the Chrome Finds opt-in bottom sheet to reject notifications. [CHAR_LIMIT=32]\">\n          No, thanks\n        </message>\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_CONTENT_DESCRIPTION\" desc=\"Content description of the Chrome Finds opt-in bottom sheet informing the user on what Chrome Finds is and asking whether to opt-in.\">\n          Chrome finds opt-in bottom sheet\n        </message>\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_CLOSED_CONTENT_DESCRIPTION\" desc=\"Content description of the Chrome Finds opt-in bottom sheet when closed.\">\n          Chrome finds opt-in closed\n        </message>\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_HALF_HEIGHT_CONTENT_DESCRIPTION\" desc=\"Content description of the Chrome Finds opt-in bottom sheet when opened at half height.\">\n          Chrome finds opt-in opened at half height\n        </message>\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_BOTTOM_SHEET_FULL_HEIGHT_CONTENT_DESCRIPTION\" desc=\"Content description of the Chrome Finds opt-in bottom sheet when opened at full height.\">\n          Chrome finds opt-in opened at full height\n        </message>\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_SNACKBAR_MESSAGE\" desc=\"Snackbar message shown when the user opts in to receive personalized notifications.\">\n          Chrome finds notifications turned on\n        </message>\n        <message name=\"IDS_CHROME_FINDS_OPT_IN_SNACKBAR_ACTION_TEXT\" desc=\"Action button of the Chrome Finds snackbar on user opt-in. [CHAR_LIMIT=10]\">\n          Manage\n        </message>\n      </if>\n"
    count: 1

