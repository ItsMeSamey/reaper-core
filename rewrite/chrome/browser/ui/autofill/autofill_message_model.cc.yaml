# Android retains ordinary Autofill messages and payment snackbars while omitting optional AI leaves.
substitutions:
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_message_model.cc'
  regex:
    re_pattern: '\#include\ "base/functional/callback_helpers\.h"\

      \#include\ "base/memory/ptr_util\.h"\

      \#include\ "base/strings/utf_string_conversions\.h"\

      \#include\ "chrome/browser/android/android_theme_resources\.h"\

      \#include\ "chrome/browser/android/resource_mapper\.h"\

      \#include\ "chrome/grit/generated_resources\.h"\

      '
    replace: '#include "base/functional/callback_helpers.h"

      #include "base/memory/ptr_util.h"

      #include "base/strings/utf_string_conversions.h"

      #include "build/build_config.h"

      #include "chrome/browser/android/android_theme_resources.h"

      #include "chrome/browser/android/resource_mapper.h"

      #include "chrome/grit/generated_resources.h"

      '
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_message_model.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ std::move\(message\),\ Type::kVirtualCardEnrollFailure\)\);\

      \}\

      \

      std::unique_ptr<AutofillMessageModel>\

      AutofillMessageModel::CreateForPersonalContextFetchingFailure\(\)\ \{\

      \ \ std::unique_ptr<messages::MessageWrapper>\ message\ =\

      '
    replace: "      std::move(message), Type::kVirtualCardEnrollFailure));\n}\n\n#if !BUILDFLAG(IS_ANDROID)\nstd::unique_ptr<AutofillMessageModel>\nAutofillMessageModel::CreateForPersonalContextFetchingFailure() {\n  std::unique_ptr<messages::MessageWrapper> message =\n"
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_message_model.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ std::move\(message\),\ Type::kPrivateInferenceNotice,\

      \ \ \ \ \ \ std::move\(action_callback\),\ std::move\(dismiss_callback\)\)\);\

      \}\

      \

      std::unique_ptr<AutofillMessageModel>\

      AutofillMessageModel::CreateForEmailVerified\(\

      '
    replace: "      std::move(message), Type::kPrivateInferenceNotice,\n      std::move(action_callback), std::move(dismiss_callback)));\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\nstd::unique_ptr<AutofillMessageModel>\nAutofillMessageModel::CreateForEmailVerified(\n"
