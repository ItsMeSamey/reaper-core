# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ bool\ confirmed\);\

      '
    replace: '                                           bool confirmed);

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ //\ `suggestion`\ if\ the\ dialog\ `confirmed`\ suppression\.\

      '
    replace: '  // `suggestion` if the dialog `confirmed` suppression.

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ void\ OpenSettingsForEntityType\(int32_t\ entity_type\)\ override;\

      '
    replace: '  void OpenSettingsForEntityType(int32_t entity_type) override;

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ bool\ ShowAutofillAiSuggestionDetails\(size_t\ index\)\ override;\

      '
    replace: '  bool ShowAutofillAiSuggestionDetails(size_t index) override;

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ RemovalConfirmationText\*\ removal_text\)\ override;\

      '
    replace: '      RemovalConfirmationText* removal_text) override;

      #if !BUILDFLAG(IS_ANDROID)

      '
