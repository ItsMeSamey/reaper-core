substitutions:
  - description: |-
      Let GetAutofillOptimizationGuideDecider be overridden.
    regex:
      re_pattern: 'GetAutofillOptimizationGuideDecider\(\)\s*const final;'
      replace: 'GetAutofillOptimizationGuideDecider() const override;'

  - description: |-
      Let BraveChromeAutofillClient override IsAutofillEnabled.
    regex:
      pattern: 'bool IsAutofillEnabled() const final;'
      replace: 'bool IsAutofillEnabled() const override;'

  - description: |-
      Let BraveChromeAutofillClient override IsAutocompleteEnabled.
    regex:
      pattern: 'bool IsAutocompleteEnabled() const final;'
      replace: 'bool IsAutocompleteEnabled() const override;'

  - description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
    regex:
      re_pattern: '\ \ AtMemoryCopyPasteObserver\ at_memory_copy_paste_observer_\{this\};\

