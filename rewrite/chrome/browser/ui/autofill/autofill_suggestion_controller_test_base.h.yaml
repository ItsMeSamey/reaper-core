# Android omits AtMemory while retaining ordinary manual filling providers.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_suggestion_controller_test_base.h'
  regex:
    re_pattern: '\#include\ "chrome/browser/autofill/mock_manual_filling_view\.h"\

      \#include\ "chrome/browser/keyboard_accessory/android/manual_filling_controller_impl\.h"\

      \#include\ "chrome/browser/keyboard_accessory/test_utils/android/mock_address_accessory_controller\.h"\

      \#include\ "chrome/browser/keyboard_accessory/test_utils/android/mock_at_memory_accessory_controller\.h"\

      \#include\ "chrome/browser/keyboard_accessory/test_utils/android/mock_password_accessory_controller\.h"\

      \#include\ "chrome/browser/keyboard_accessory/test_utils/android/mock_payment_method_accessory_controller\.h"\

      \#include\ "chrome/browser/ui/autofill/autofill_keyboard_accessory_controller_impl\.h"\

      '
    replace: '#include "chrome/browser/autofill/mock_manual_filling_view.h"

      #include "chrome/browser/keyboard_accessory/android/manual_filling_controller_impl.h"

      #include "chrome/browser/keyboard_accessory/test_utils/android/mock_address_accessory_controller.h"

      #include "chrome/browser/keyboard_accessory/test_utils/android/mock_password_accessory_controller.h"

      #include "chrome/browser/keyboard_accessory/test_utils/android/mock_payment_method_accessory_controller.h"

      #include "chrome/browser/ui/autofill/autofill_keyboard_accessory_controller_impl.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_suggestion_controller_test_base.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ web_contents\(\),\ mock_pwd_controller_\.AsWeakPtr\(\),\

      \ \ \ \ \ \ \ \ mock_address_controller_\.AsWeakPtr\(\),\

      \ \ \ \ \ \ \ \ mock_payment_method_controller_\.AsWeakPtr\(\),\

      \ \ \ \ \ \ \ \ mock_at_memory_controller_\.AsWeakPtr\(\),\

      \ \ \ \ \ \ \ \ std::make_unique<::testing::NiceMock<MockManualFillingView>>\(\)\);\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \}\

      '
    replace: "        web_contents(), mock_pwd_controller_.AsWeakPtr(),\n        mock_address_controller_.AsWeakPtr(),\n        mock_payment_method_controller_.AsWeakPtr(),\n        std::make_unique<::testing::NiceMock<MockManualFillingView>>());\n#endif  // BUILDFLAG(IS_ANDROID)\n  }\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_suggestion_controller_test_base.h'
  regex:
    re_pattern: '\ \ ::testing::NiceMock<MockAddressAccessoryController>\ mock_address_controller_;\

      \ \ ::testing::NiceMock<MockPaymentMethodAccessoryController>\

      \ \ \ \ \ \ mock_payment_method_controller_;\

      \ \ ::testing::NiceMock<MockAtMemoryAccessoryController>\

      \ \ \ \ \ \ mock_at_memory_controller_;\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      \};\

      \

      '
    replace: "  ::testing::NiceMock<MockAddressAccessoryController> mock_address_controller_;\n  ::testing::NiceMock<MockPaymentMethodAccessoryController>\n      mock_payment_method_controller_;\n#endif  // BUILDFLAG(IS_ANDROID)\n};\n\n"
