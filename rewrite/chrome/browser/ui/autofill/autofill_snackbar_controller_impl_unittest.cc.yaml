n  base::MockCallback<base::OnceClosure> ordinary_action;\n  AutofillSnackbarControllerImpl actual_controller(web_contents());\n  CreditCard original_card;\n  original_card.set_is_bnpl_card(true);\n  original_card.SetNickname(u\"Affirm\");\n  actual_controller.ShowPaymentsSnackbar(AutofillSnackbarType::kBnpl,\n                                         original_card, ordinary_action.Get());\n\n  CreditCard rejected_card;\n  rejected_card.set_is_bnpl_card(true);\n  rejected_card.SetNickname(u\"Replaced\");\n  EXPECT_CALL(retired_action, Run).Times(0);\n  for (AutofillSnackbarType type :\n       {AutofillSnackbarType::kAutofillAiSaveToWalletFailure,\n        AutofillSnackbarType::kAutofillAiFetchEntityFailure}) {\n    actual_controller.ShowPaymentsSnackbar(type, rejected_card,\n                                           retired_action.Get());\n  }\n  EXPECT_EQ(\n      actual_controller.GetMessageText(),\n      l10n_util::GetStringFUTF16(\n          IDS_AUTOFILL_BNPL_FILLED_CARD_SNACKBAR_MESSAGE_TEXT, u\"Affirm\"));\n  EXPECT_EQ(actual_controller.GetActionButtonText(),\n            l10n_util::GetStringUTF16(\n                IDS_AUTOFILL_VIRTUAL_CARD_NUMBER_SNACKBAR_ACTION_TEXT));\n  EXPECT_CALL(ordinary_action, Run).Times(1);\n  actual_controller.OnActionClicked();\n  actual_controller.OnDismissed();\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace autofill\n"
