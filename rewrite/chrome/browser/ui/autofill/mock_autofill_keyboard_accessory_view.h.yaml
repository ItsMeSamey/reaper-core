# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ ShowAutofillAiSuggestionDetails,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(const\ std::u16string\&,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::OnceCallback<void\(bool\)>\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(override\)\);\

      '
    replace: "              ShowAutofillAiSuggestionDetails,\n              (const std::u16string&,\n               const std::u16string&,\n               const std::u16string&,\n               const std::u16string&,\n               base::OnceCallback<void(bool)>),\n              (override));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ ConfirmDeletion,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(const\ std::u16string\&,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::OnceCallback<void\(bool\)>\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(override\)\);\

      '
    replace: "              ConfirmDeletion,\n              (const std::u16string&,\n               const std::u16string&,\n               const std::u16string&,\n               const std::u16string&,\n               base::OnceCallback<void(bool)>),\n              (override));\n#if !BUILDFLAG(IS_ANDROID)\n"
