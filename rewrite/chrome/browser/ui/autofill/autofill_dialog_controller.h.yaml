# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_dialog_controller.h'
  regex:
    re_pattern: '\#define\ CHROME_BROWSER_UI_AUTOFILL_AUTOFILL_DIALOG_CONTROLLER_H_\

      \#include\ <string>\

      \

      \#include\ "base/time/time\.h"\

      \#include\ "content/public/browser/web_contents\.h"\

      \

      namespace\ autofill\ \{\

      '
    replace: '#define CHROME_BROWSER_UI_AUTOFILL_AUTOFILL_DIALOG_CONTROLLER_H_

      #include <string>


      #include "base/functional/callback_forward.h"

      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "base/time/time.h"

      #endif

      #include "content/public/browser/web_contents.h"


      namespace autofill {

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_dialog_controller.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&\ button_text,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::OnceClosure\ on_positive_button_clicked_callback\)\ =\ 0;\

      \

      \ \ virtual\ void\ ShowLoadingDialog\(const\ std::u16string\&\ title,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::TimeDelta\ min_time\)\ =\ 0;\

      \

      \ \ //\ Dismisses\ the\ dialog\ if\ it\ is\ showing\.\

      \ \ virtual\ void\ Dismiss\(\)\ =\ 0;\

      '
    replace: "                    const std::u16string& button_text,\n                    base::OnceClosure on_positive_button_clicked_callback) = 0;\n\n#if !BUILDFLAG(IS_ANDROID)\n  virtual void ShowLoadingDialog(const std::u16string& title,\n                                 base::TimeDelta min_time) = 0;\n#endif\n\n  // Dismisses the dialog if it is showing.\n  virtual void Dismiss() = 0;\n"
