# Android retains ordinary Autofill messages and payment snackbars while omitting optional AI leaves.
substitutions:
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_snackbar_controller_impl.cc'
  regex:
    re_pattern: '\

      namespace\ autofill\ \{\

      \

      AutofillSnackbarControllerImpl::AutofillSnackbarControllerImpl\(\

      \ \ \ \ content::WebContents\*\ web_contents\)\

      \ \ \ \ :\ web_contents_\(web_contents\)\ \{\}\

      '
    replace: "\nnamespace autofill {\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace {\n\n// Keep persisted numeric type slots while rejecting removed UI requests.\nbool IsSupportedAndroidSnackbarType(AutofillSnackbarType type) {\n  return type != AutofillSnackbarType::kAutofillAiSaveToWalletFailure &&\n         type != AutofillSnackbarType::kAutofillAiFetchEntityFailure;\n}\n\n}  // namespace\n#endif  // BUILDFLAG(IS_ANDROID)\n\nAutofillSnackbarControllerImpl::AutofillSnackbarControllerImpl(\n    content::WebContents* web_contents)\n    : web_contents_(web_contents) {}\n"
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_snackbar_controller_impl.cc'
  regex:
    re_pattern: '\ \ \ \ base::OnceClosure\ on_action_clicked_callback,\

      \ \ \ \ std::optional<base::OnceClosure>\ on_dismiss_callback\)\ \{\

      \ \ CHECK_NE\(autofill_snackbar_type,\ AutofillSnackbarType::kUnspecified\);\

      \ \ if\ \(autofill_snackbar_view_\)\ \{\

      \ \ \ \ //\ A\ snackbar\ is\ already\ showing\.\ Ignore\ the\ new\ request\.\

      \ \ \ \ return;\

      '
    replace: "    base::OnceClosure on_action_clicked_callback,\n    std::optional<base::OnceClosure> on_dismiss_callback) {\n  CHECK_NE(autofill_snackbar_type, AutofillSnackbarType::kUnspecified);\n#if BUILDFLAG(IS_ANDROID)\n  if (!IsSupportedAndroidSnackbarType(autofill_snackbar_type)) {\n    return;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n  if (autofill_snackbar_view_) {\n    // A snackbar is already showing. Ignore the new request.\n    return;\n"
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_snackbar_controller_impl.cc'
  regex:
    re_pattern: '\ \ \ \ AutofillSnackbarType\ autofill_snackbar_type,\

      \ \ \ \ const\ CreditCard\&\ filled_card,\

      \ \ \ \ base::OnceClosure\ on_action_clicked_callback\)\ \{\

      \ \ filled_card_\ =\ filled_card;\

      \

      \ \ Show\(autofill_snackbar_type,\ std::move\(on_action_clicked_callback\)\);\

      '
    replace: "    AutofillSnackbarType autofill_snackbar_type,\n    const CreditCard& filled_card,\n    base::OnceClosure on_action_clicked_callback) {\n#if BUILDFLAG(IS_ANDROID)\n  if (!IsSupportedAndroidSnackbarType(autofill_snackbar_type)) {\n    return;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n  filled_card_ = filled_card;\n\n  Show(autofill_snackbar_type, std::move(on_action_clicked_callback));\n"
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_snackbar_controller_impl.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ return\ l10n_util::GetStringFUTF16\(\

      \ \ \ \ \ \ \ \ \ \ IDS_AUTOFILL_BNPL_FILLED_CARD_SNACKBAR_MESSAGE_TEXT,\

      \ \ \ \ \ \ \ \ \ \ filled_card_\->CardNameForAutofillDisplay\(\)\);\

      \ \ \ \ case\ AutofillSnackbarType::kAutofillAiSaveToWalletFailure:\

      \ \ \ \ \ \ return\ l10n_util::GetStringUTF16\(\

      \ \ \ \ \ \ \ \ \ \ IDS_AUTOFILL_AI_WALLET_UPDATE_OR_MIGRATE_FAILURE_NOTIFICATION\);\

      \ \ \ \ case\ AutofillSnackbarType::kAutofillAiFetchEntityFailure:\

      \ \ \ \ \ \ return\ l10n_util::GetStringUTF16\(\

      \ \ \ \ \ \ \ \ \ \ IDS_AUTOFILL_AI_FETCH_ENTITY_FAILURE_NOTIFICATION\);\

      \ \ \ \ case\ AutofillSnackbarType::kUnspecified:\

      \ \ \ \ \ \ NOTREACHED\(\);\

      \ \ \}\

      '
    replace: "      return l10n_util::GetStringFUTF16(\n          IDS_AUTOFILL_BNPL_FILLED_CARD_SNACKBAR_MESSAGE_TEXT,\n          filled_card_->CardNameForAutofillDisplay());\n#if !BUILDFLAG(IS_ANDROID)\n    case AutofillSnackbarType::kAutofillAiSaveToWalletFailure:\n      return l10n_util::GetStringUTF16(\n          IDS_AUTOFILL_AI_WALLET_UPDATE_OR_MIGRATE_FAILURE_NOTIFICATION);\n    case AutofillSnackbarType::kAutofillAiFetchEntityFailure:\n      return l10n_util::GetStringUTF16(\n          IDS_AUTOFILL_AI_FETCH_ENTITY_FAILURE_NOTIFICATION);\n#else\n    case AutofillSnackbarType::kAutofillAiSaveToWalletFailure:\n    case AutofillSnackbarType::kAutofillAiFetchEntityFailure:\n#endif  // !BUILDFLAG(IS_ANDROID)\n    case AutofillSnackbarType::kUnspecified:\n      NOTREACHED();\n  }\n"
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_snackbar_controller_impl.cc'
  regex:
    re_pattern: '\ \ \ \ case\ AutofillSnackbarType::kSaveServerIbanSuccess:\

      \ \ \ \ \ \ return\ l10n_util::GetStringUTF16\(\

      \ \ \ \ \ \ \ \ \ \ IDS_AUTOFILL_SAVE_SERVER_IBAN_SUCCESS_SNACKBAR_BUTTON_TEXT\);\

      \ \ \ \ case\ AutofillSnackbarType::kAutofillAiSaveToWalletFailure:\

      \ \ \ \ \ \ return\ l10n_util::GetStringUTF16\(\

      \ \ \ \ \ \ \ \ \ \ IDS_AUTOFILL_AI_SNACK_BAR_CONFIRMATION_BUTTON_LABEL\);\

      \ \ \ \ case\ AutofillSnackbarType::kAutofillAiFetchEntityFailure:\

      \ \ \ \ \ \ return\ l10n_util::GetStringUTF16\(\

      \ \ \ \ \ \ \ \ \ \ IDS_AUTOFILL_AI_SNACK_BAR_CONFIRMATION_BUTTON_LABEL\);\

      \ \ \ \ case\ AutofillSnackbarType::kUnspecified:\

      \ \ \ \ \ \ NOTREACHED\(\);\

      \ \ \}\

      '
    replace: "    case AutofillSnackbarType::kSaveServerIbanSuccess:\n      return l10n_util::GetStringUTF16(\n          IDS_AUTOFILL_SAVE_SERVER_IBAN_SUCCESS_SNACKBAR_BUTTON_TEXT);\n#if !BUILDFLAG(IS_ANDROID)\n    case AutofillSnackbarType::kAutofillAiSaveToWalletFailure:\n      return l10n_util::GetStringUTF16(\n          IDS_AUTOFILL_AI_SNACK_BAR_CONFIRMATION_BUTTON_LABEL);\n    case AutofillSnackbarType::kAutofillAiFetchEntityFailure:\n      return l10n_util::GetStringUTF16(\n          IDS_AUTOFILL_AI_SNACK_BAR_CONFIRMATION_BUTTON_LABEL);\n#else\n    case AutofillSnackbarType::kAutofillAiSaveToWalletFailure:\n    case AutofillSnackbarType::kAutofillAiFetchEntityFailure:\n#endif  // !BUILDFLAG(IS_ANDROID)\n    case AutofillSnackbarType::kUnspecified:\n      NOTREACHED();\n  }\n"
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_snackbar_controller_impl.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ return\ "CardInfoRetrievalEnrolled";\

      \ \ \ \ case\ AutofillSnackbarType::kBnpl:\

      \ \ \ \ \ \ return\ "BnplVirtualCard";\

      \ \ \ \ case\ AutofillSnackbarType::kAutofillAiSaveToWalletFailure:\

      \ \ \ \ \ \ return\ "AutofillAiSaveToWalletFailure";\

      \ \ \ \ case\ AutofillSnackbarType::kAutofillAiFetchEntityFailure:\

      \ \ \ \ \ \ return\ "AutofillAiFetchFromWalletFailure";\

      \ \ \ \ case\ AutofillSnackbarType::kUnspecified:\

      \ \ \ \ \ \ return\ "Unspecified";\

      \ \ \}\

      '
    replace: "      return \"CardInfoRetrievalEnrolled\";\n    case AutofillSnackbarType::kBnpl:\n      return \"BnplVirtualCard\";\n#if !BUILDFLAG(IS_ANDROID)\n    case AutofillSnackbarType::kAutofillAiSaveToWalletFailure:\n      return \"AutofillAiSaveToWalletFailure\";\n    case AutofillSnackbarType::kAutofillAiFetchEntityFailure:\n      return \"AutofillAiFetchFromWalletFailure\";\n#else\n    case AutofillSnackbarType::kAutofillAiSaveToWalletFailure:\n    case AutofillSnackbarType::kAutofillAiFetchEntityFailure:\n#endif  // !BUILDFLAG(IS_ANDROID)\n    case AutofillSnackbarType::kUnspecified:\n      return \"Unspecified\";\n  }\n"
