# Additive Android dismissal ownership guard; static source review only.
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_message_controller_impl.cc'
  regex:
    re_pattern: '\ \ \ \ messages::DismissReason\ reason\)\ \{\

      \ \ auto\ message_model_it\ =\ message_models_\.find\(message_model_ptr\);\

      \ \ CHECK\(message_model_it\ !=\ message_models_\.end\(\)\);\

      \ \ \(\*message_model_it\)\->OnDismissed\(reason\);\

      \

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: "    messages::DismissReason reason) {\n  auto message_model_it = message_models_.find(message_model_ptr);\n  CHECK(message_model_it != message_models_.end());\n#if BUILDFLAG(IS_ANDROID)\n  // Detach ownership before invoking a callback that may reenter the\n  // controller.\n  auto dismissed_message = message_models_.extract(message_model_it);\n  dismissed_message.value()->OnDismissed(reason);\n#else\n  (*message_model_it)->OnDismissed(reason);\n\n#if !BUILDFLAG(IS_ANDROID)\n"
