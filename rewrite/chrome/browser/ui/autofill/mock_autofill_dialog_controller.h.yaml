# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/mock_autofill_dialog_controller.h'
  regex:
    re_pattern: '\#ifndef\ CHROME_BROWSER_UI_AUTOFILL_MOCK_AUTOFILL_DIALOG_CONTROLLER_H_\

      \#define\ CHROME_BROWSER_UI_AUTOFILL_MOCK_AUTOFILL_DIALOG_CONTROLLER_H_\

      \

      \#include\ "chrome/browser/ui/autofill/autofill_dialog_controller\.h"\

      \#include\ "testing/gmock/include/gmock/gmock\.h"\

      \

      '
    replace: '#ifndef CHROME_BROWSER_UI_AUTOFILL_MOCK_AUTOFILL_DIALOG_CONTROLLER_H_

      #define CHROME_BROWSER_UI_AUTOFILL_MOCK_AUTOFILL_DIALOG_CONTROLLER_H_


      #include "build/build_config.h"

      #include "chrome/browser/ui/autofill/autofill_dialog_controller.h"

      #include "testing/gmock/include/gmock/gmock.h"


      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/mock_autofill_dialog_controller.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::OnceClosure\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(override\)\);\

      \ \ MOCK_METHOD\(void,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ ShowLoadingDialog,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(const\ std::u16string\&,\ base::TimeDelta\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(override\)\);\

      \ \ MOCK_METHOD\(void,\ Dismiss,\ \(\),\ \(override\)\);\

      \ \ MOCK_METHOD\(void,\ OnPositiveButtonClicked,\ \(\),\ \(override\)\);\

      \ \ MOCK_METHOD\(void,\ OnDismissed,\ \(\),\ \(override\)\);\

      '
    replace: "               const std::u16string&,\n               base::OnceClosure),\n              (override));\n#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(void,\n              ShowLoadingDialog,\n              (const std::u16string&, base::TimeDelta),\n              (override));\n#endif\n  MOCK_METHOD(void, Dismiss, (), (override));\n  MOCK_METHOD(void, OnPositiveButtonClicked, (), (override));\n  MOCK_METHOD(void, OnDismissed, (), (override));\n"
