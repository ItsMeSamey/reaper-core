# Android retains ordinary Autofill messages and payment snackbars while omitting optional AI leaves.
substitutions:
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_message_model.h'
  regex:
    re_pattern: '\

      \#include\ "base/functional/callback\.h"\

      \#include\ "base/types/pass_key\.h"\

      \#include\ "components/messages/android/message_wrapper\.h"\

      \

      class\ GURL;\

      '
    replace: '

      #include "base/functional/callback.h"

      #include "base/types/pass_key.h"

      #include "build/build_config.h"

      #include "components/messages/android/message_wrapper.h"


      class GURL;

      '
- description: 'Android optional Autofill message/snackbar leaf removal: chrome/browser/ui/autofill/autofill_message_model.h'
  regex:
    re_pattern: '\ \ static\ std::unique_ptr<AutofillMessageModel>\ CreateForSaveCardFailure\(\);\

      \ \ static\ std::unique_ptr<AutofillMessageModel>\

      \ \ CreateForVirtualCardEnrollFailure\(std::u16string\ card_label\);\

      \ \ static\ std::unique_ptr<AutofillMessageModel>\

      \ \ CreateForPersonalContextFetchingFailure\(\);\

      \ \ static\ std::unique_ptr<AutofillMessageModel>\ CreateForPrivateInferenceNotice\(\

      \ \ \ \ \ \ base::OnceClosure\ action_callback,\

      \ \ \ \ \ \ messages::MessageWrapper::DismissCallback\ dismiss_callback,\

      \ \ \ \ \ \ base::RepeatingClosure\ secondary_action_callback\);\

      \ \ static\ std::unique_ptr<AutofillMessageModel>\ CreateForEmailVerified\(\

      \ \ \ \ \ \ const\ GURL\&\ issuer,\

      \ \ \ \ \ \ base::OnceClosure\ action_callback\);\

      '
    replace: "  static std::unique_ptr<AutofillMessageModel> CreateForSaveCardFailure();\n  static std::unique_ptr<AutofillMessageModel>\n  CreateForVirtualCardEnrollFailure(std::u16string card_label);\n#if !BUILDFLAG(IS_ANDROID)\n  static std::unique_ptr<AutofillMessageModel>\n  CreateForPersonalContextFetchingFailure();\n  static std::unique_ptr<AutofillMessageModel> CreateForPrivateInferenceNotice(\n      base::OnceClosure action_callback,\n      messages::MessageWrapper::DismissCallback dismiss_callback,\n      base::RepeatingClosure secondary_action_callback);\n#endif  // !BUILDFLAG(IS_ANDROID)\n  static std::unique_ptr<AutofillMessageModel> CreateForEmailVerified(\n      const GURL& issuer,\n      base::OnceClosure action_callback);\n"
