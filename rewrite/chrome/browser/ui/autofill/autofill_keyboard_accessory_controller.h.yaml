# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ virtual\ void\ OpenSettingsForEntityType\(int32_t\ entity_type\)\ =\ 0;\

      '
    replace: '  virtual void OpenSettingsForEntityType(int32_t entity_type) = 0;

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ //\ Opens\ settings\ for\ the\ given\ entity\ type\.\

      '
    replace: '  // Opens settings for the given entity type.

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ virtual\ bool\ ShowAutofillAiSuggestionDetails\(size_t\ index\)\ =\ 0;\

      '
    replace: '  virtual bool ShowAutofillAiSuggestionDetails(size_t index) = 0;

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ //\ Returns\ `true`\ if\ details\ could\ be\ shown,\ `false`\ otherwise\.\

      '
    replace: '  // Returns `true` if details could be shown, `false` otherwise.

      #if !BUILDFLAG(IS_ANDROID)

      '
