substitutions:
- description: Omit the dedicated Android AtMemory controller header.
  regex:
    pattern: '#include "chrome/browser/ui/autofill/at_memory_suggestion_controller.h"

      '
    replace: ''
  count: 1
- description: Omit the helper include used only by the removed AtMemory constructor fork.
  regex:
    pattern: '#include "components/autofill/core/common/autofill_util.h"

      '
    replace: ''
  count: 1
- description: Remove the constructor branch for the already Android-excluded AtMemory implementation, retaining ordinary
    keyboard and all desktop branches.
  regex:
    pattern: "  if (IsAtMemoryTriggerSource(trigger_source)) {\n    auto* controller = new AtMemorySuggestionController(\n\
      \        delegate, web_contents, std::move(controller_common));\n    return controller->GetWeakPtr();\n  }\n"
    replace: ''
  count: 1
