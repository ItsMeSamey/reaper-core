# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ base::OnceClosure\ cancel_callback,\

      \ \ \ \ bool\ has_seen_ai_terms\)\ \{\

      \ \ //\ `has_seen_ai_terms`\ is\ a\ no\-op\ on\ Android\.\ Instead\ this\ preference\ is\ read\

      \ \ //\ directly\ on\ the\ Java\ layer\ in\ the\ TouchToFillPaymentMethodMediator\.\

      '
    replace: '    base::OnceClosure cancel_callback) {

      '
