substitutions:
  - description: |-
      Construct BraveChromeAutofillClient instead of ChromeAutofillClient.

      BraveChromeAutofillClient is defined earlier in the chromium_src
      override, ahead of this file's #include of the upstream .cc.
    preempt_function_impl:
      function_name: ChromeAutofillClient::CreateForWebContents
      code: |-
        if (!FromWebContents(web_contents)) {
          web_contents->SetUserData(
              UserDataKey(),
              base::WrapUnique(new BraveChromeAutofillClient(web_contents)));
        }
        return;

