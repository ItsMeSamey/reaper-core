# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_dialog_controller_impl.h'
  regex:
    re_pattern: '\#include\ <memory>\

      \#include\ <string>\

      \

      \#include\ "base/memory/raw_ref\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "base/timer/elapsed_timer\.h"\

      \#include\ "base/timer/timer\.h"\

      \#include\ "chrome/browser/ui/autofill/autofill_dialog_controller\.h"\

      \#include\ "chrome/browser/ui/autofill/autofill_dialog_view\.h"\

      \#include\ "content/public/browser/web_contents\.h"\

      '
    replace: '#include <memory>

      #include <string>


      #include "build/build_config.h"

      #include "base/functional/callback.h"

      #include "base/memory/raw_ref.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "base/time/time.h"

      #endif

      #if !BUILDFLAG(IS_ANDROID)

      #include "base/timer/elapsed_timer.h"

      #endif

      #if !BUILDFLAG(IS_ANDROID)

      #include "base/timer/timer.h"

      #endif

      #include "chrome/browser/ui/autofill/autofill_dialog_controller.h"

      #include "chrome/browser/ui/autofill/autofill_dialog_view.h"

      #include "content/public/browser/web_contents.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_dialog_controller_impl.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&\ description,\

      \ \ \ \ \ \ \ \ \ \ \ \ const\ std::u16string\&\ button_text,\

      \ \ \ \ \ \ \ \ \ \ \ \ base::OnceClosure\ on_positive_button_clicked_callback\)\ override;\

      \ \ void\ ShowLoadingDialog\(const\ std::u16string\&\ title,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::TimeDelta\ min_time\)\ override;\

      \ \ void\ Dismiss\(\)\ override;\

      \

      \ \ void\ OnPositiveButtonClicked\(\)\ override;\

      '
    replace: "            const std::u16string& description,\n            const std::u16string& button_text,\n            base::OnceClosure on_positive_button_clicked_callback) override;\n#if !BUILDFLAG(IS_ANDROID)\n  void ShowLoadingDialog(const std::u16string& title,\n                         base::TimeDelta min_time) override;\n#endif\n  void Dismiss() override;\n\n  void OnPositiveButtonClicked() override;\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_dialog_controller_impl.h'
  regex:
    re_pattern: '\ \ std::u16string\ description_;\

      \ \ std::u16string\ button_text_;\

      \

      \ \ base::OneShotTimer\ dismiss_timer_;\

      \ \ base::ElapsedTimer\ dialog_show_time_;\

      \ \ base::TimeDelta\ min_show_time_;\

      \

      \ \ //\ Callback\ to\ run\ after\ the\ dialog\ positive\ button\ is\ clicked\.\

      \ \ base::OnceClosure\ on_positive_button_clicked_callback_;\

      '
    replace: "  std::u16string description_;\n  std::u16string button_text_;\n\n#if !BUILDFLAG(IS_ANDROID)\n  base::OneShotTimer dismiss_timer_;\n  base::ElapsedTimer dialog_show_time_;\n  base::TimeDelta min_show_time_;\n#endif\n\n  // Callback to run after the dialog positive button is clicked.\n  base::OnceClosure on_positive_button_clicked_callback_;\n"
