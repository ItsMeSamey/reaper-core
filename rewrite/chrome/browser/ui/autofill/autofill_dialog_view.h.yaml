# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_dialog_view.h'
  regex:
    re_pattern: '\#define\ CHROME_BROWSER_UI_AUTOFILL_AUTOFILL_DIALOG_VIEW_H_\

      \

      \#include\ <memory>\

      \

      namespace\ autofill\ \{\

      \

      '
    replace: '#define CHROME_BROWSER_UI_AUTOFILL_AUTOFILL_DIALOG_VIEW_H_


      #include <memory>


      #include "build/build_config.h"


      namespace autofill {


      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/autofill_dialog_view.h'
  regex:
    re_pattern: '\ \ virtual\ void\ Show\(\)\ =\ 0;\

      \

      \ \ //\ Show\ a\ loading\ dialog\.\

      \ \ virtual\ void\ ShowLoadingDialog\(\)\ =\ 0;\

      \

      \ \ //\ Dismiss\ the\ dialog\.\

      \ \ virtual\ void\ Dismiss\(\)\ =\ 0;\

      '
    replace: "  virtual void Show() = 0;\n\n  // Show a loading dialog.\n#if !BUILDFLAG(IS_ANDROID)\n  virtual void ShowLoadingDialog() = 0;\n#endif\n\n  // Dismiss the dialog.\n  virtual void Dismiss() = 0;\n"
