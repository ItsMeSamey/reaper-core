# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ suggestion\.payload\);\

      '
    replace: "          suggestion.payload);\n#else\n      return false;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ //\ Do\ not\ gray\ those\ out\.\

      '
    replace: '      // Do not gray those out.

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "base/notreached\.h"\

      '
    replace: '#include "base/notreached.h"

      #include "build/build_config.h"

      '
