# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/mock_autofill_dialog_view.h'
  regex:
    re_pattern: '\#ifndef\ CHROME_BROWSER_UI_AUTOFILL_MOCK_AUTOFILL_DIALOG_VIEW_H_\

      \#define\ CHROME_BROWSER_UI_AUTOFILL_MOCK_AUTOFILL_DIALOG_VIEW_H_\

      \

      \#include\ "chrome/browser/ui/autofill/autofill_dialog_view\.h"\

      \#include\ "testing/gmock/include/gmock/gmock\.h"\

      \

      '
    replace: '#ifndef CHROME_BROWSER_UI_AUTOFILL_MOCK_AUTOFILL_DIALOG_VIEW_H_

      #define CHROME_BROWSER_UI_AUTOFILL_MOCK_AUTOFILL_DIALOG_VIEW_H_


      #include "build/build_config.h"

      #include "chrome/browser/ui/autofill/autofill_dialog_view.h"

      #include "testing/gmock/include/gmock/gmock.h"


      '
- description: 'Android concrete AI source/provider removal: chrome/browser/ui/autofill/mock_autofill_dialog_view.h'
  regex:
    re_pattern: '\ \ \~MockAutofillDialogView\(\)\ override;\

      \

      \ \ MOCK_METHOD\(void,\ Show,\ \(\),\ \(override\)\);\

      \ \ MOCK_METHOD\(void,\ ShowLoadingDialog,\ \(\),\ \(override\)\);\

      \ \ MOCK_METHOD\(void,\ Dismiss,\ \(\),\ \(override\)\);\

      \};\

      \

      '
    replace: "  ~MockAutofillDialogView() override;\n\n  MOCK_METHOD(void, Show, (), (override));\n#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(void, ShowLoadingDialog, (), (override));\n#endif\n  MOCK_METHOD(void, Dismiss, (), (override));\n};\n\n"
