substitutions:
  - description: Depend on the Brave UI.
    insert_into_list:
      target: ui
      list_name: public_deps
      values:
        - //brave/browser/ui

  - description: Add the Brave UI deps.
    add_literal_to_list:
      target: ui
      list_name: deps
      literal: brave_chrome_browser_ui_deps
      import: //brave/browser/sources.gni

  - description:
      Depend on the targets the Brave UI allows circular includes from.
    add_literal_to_list:
      target: ui
      list_name: deps
      literal: brave_chrome_browser_ui_allow_circular_includes_from
      import: //brave/browser/sources.gni

  - description: Allow circular includes from the Brave UI targets.
    add_literal_to_list:
      target: ui
      list_name: allow_circular_includes_from
      literal: brave_chrome_browser_ui_allow_circular_includes_from
      import: //brave/browser/sources.gni

  - description: Add the Brave UI public dependencies.
    insert_into_list:
      target: ui_public_dependencies
      list_name: public_deps
      values:
        - //brave/browser/ui:ui_public_dependencies
        - //components/saved_tab_groups/public

  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//components/spellcheck/browser",\

        \ \ \ \ \ \ "//components/undo",\

        \ \ \ \ \]\

        \ \ \ \ if\ \(is_mac\)\ \{\

        \ \ \ \ \ \ deps\ \+=\ \[\

        \ \ \ \ \ \ \ \ ":browser_commands_mac",\

        '
      replace: "      \"//components/spellcheck/browser\",\n      \"//components/undo\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/contextual_cueing\",\n        \"//chrome/browser/contextual_tasks:ui\",\n        \"//chrome/browser/glic\",\n        \"//chrome/browser/glic:mojo_bindings\",\n        \"//chrome/browser/glic/browser_ui\",\n        \"//chrome/browser/ui/ai_overlay_dialog\",\n      ]\n    }\n    if (is_mac) {\n      deps += [\n        \":browser_commands_mac\",\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//ui/gfx/geometry",\

        \ \ \ \ \ \ "//ui/gfx/range",\

        \ \ \ \ \]\

        \ \ \}\

        \}\

        \

        '
      replace: "      \"//ui/gfx/geometry\",\n      \"//ui/gfx/range\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/glic\" ]\n    }\n  }\n}\n\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//ui/strings",\

        \ \ \ \ "//ui/webui",\

        \ \ \]\

        \ \ deps\ \+=\ brave_chrome_browser_ui_allow_circular_includes_from\

        \ \ deps\ \+=\ brave_chrome_browser_ui_deps\

        \

        '
      replace: "    \"//ui/strings\",\n    \"//ui/webui\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/ai\",\n      \"//chrome/browser/contextual_tasks:ui\",\n      \"//chrome/browser/glic\",\n      \"//chrome/browser/glic:impl\",\n    ]\n  }\n  deps += brave_chrome_browser_ui_allow_circular_includes_from\n  deps += brave_chrome_browser_ui_deps\n\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\

        \ \ if\ \(enable_compose\)\ \{\

        \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/compose"\ \]\

        \ \ \}\

        \

        \ \ if\ \(enable_rlz\)\ \{\

        '
      replace: "\n  if (enable_compose) {\n    deps += [ \"//chrome/browser/compose\" ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/compose\" ]\n    }\n  }\n\n  if (enable_rlz) {\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \#\ split\ out\ yet\.\

        \ \ \ \ "//chrome/browser/webauthn:impl",\

        \ \ \]\

        \

        \ \ if\ \(!is_android\)\ \{\

        \ \ \ \ deps\ \+=\ \[\

        '
      replace: "    # split out yet.\n    \"//chrome/browser/webauthn:impl\",\n  ]\n  if (is_android) {\n    allow_circular_includes_from -= [ \"//chrome/browser/glic:impl\" ]\n  }\n\n  if (!is_android) {\n    deps += [\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//ui/color/dynamic_color",\

        \ \ \ \ \ \ "//ui/events",\

        \ \ \ \ \]\

        \

        \ \ \ \ if\ \(is_win\ \|\|\ is_chromeos\)\ \{\

        \ \ \ \ \ \ deps\ \+=\ \[\

        '
      replace: "      \"//ui/color/dynamic_color\",\n      \"//ui/events\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor/ui:actor_overlay\",\n        \"//chrome/browser/actor/ui:actor_overlay_web_view\",\n        \"//chrome/browser/actor/ui/task_list_bubble:controller\",\n        \"//chrome/browser/background/glic\",\n        \"//chrome/browser/context_hub\",\n        \"//chrome/browser/glic/browser_ui:glow\",\n        \"//chrome/browser/glic/browser_ui:glow_controller\",\n        \"//chrome/browser/glic/browser_ui:glow_controller_impl\",\n        \"//chrome/browser/glic/browser_ui:glow_impl\",\n        \"//chrome/browser/password_manager/actor_login:factories\",\n        \"//chrome/browser/ui/views/contextual_tasks\",\n        \"//chrome/browser/ui/views/contextual_tasks:impl\",\n        \"//chrome/browser/ui/views/glic\",\n        \"//chrome/browser/ui/views/tabs/glic\",\n        \"//chrome/browser/ui/views/tabs/glic:impl\",\n      ]\n    }\n\n    if (is_win || is_chromeos) {\n      deps += [\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//chrome/browser/ui/webui/util",\

        \ \ \ \ \ \ "//chrome/browser/ui/webui/webnn_internals",\

        \ \ \ \ \]\

        \

        \ \ \ \ if\ \(use_aura\)\ \{\

        \ \ \ \ \ \ public_deps\ \+=\ \[\ "//chrome/browser/ui:overscroll_pref_manager"\ \]\

        '
      replace: "      \"//chrome/browser/ui/webui/util\",\n      \"//chrome/browser/ui/webui/webnn_internals\",\n    ]\n    if (is_android) {\n      public_deps -= [ \"//chrome/browser/contextual_cueing/internals\" ]\n    }\n\n    if (use_aura) {\n      public_deps += [ \"//chrome/browser/ui:overscroll_pref_manager\" ]\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ \#\ plural_string_handler\.h\ from\ //chrome/browser/ui\.\

        \ \ \ \ \ \ "//chrome/browser/ui/webui/tab_search",\

        \ \ \ \ \]\

        \

        \ \ \ \ if\ \(is_win\ \|\|\ is_chromeos\)\ \{\

        \ \ \ \ \ \ allow_circular_includes_from\ \+=\

        '
      replace: "      # plural_string_handler.h from //chrome/browser/ui.\n      \"//chrome/browser/ui/webui/tab_search\",\n    ]\n    if (is_android) {\n      allow_circular_includes_from -= [\n        \"//chrome/browser/ui/views/contextual_tasks:impl\",\n        \"//chrome/browser/glic/browser_ui:glow_impl\",\n        \"//chrome/browser/glic/browser_ui:glow_controller_impl\",\n        \"//chrome/browser/ui/views/glic\",\n        \"//chrome/browser/ui/views/tabs/glic\",\n        \"//chrome/browser/ui/views/tabs/glic:impl\",\n      ]\n    }\n\n    if (is_win || is_chromeos) {\n      allow_circular_includes_from +=\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\

        \ \ if\ \(!is_android\ \|\|\ is_desktop_android\)\ \{\

        \ \ \ \ public_deps\ \+=\ \[\ "//chrome/browser/ui/webui/ai_overlay_dialog"\ \]\

        \ \ \}\

        \

        \ \ if\ \(!is_android\)\ \{\

        '
      replace: "\n  if (!is_android || is_desktop_android) {\n    public_deps += [ \"//chrome/browser/ui/webui/ai_overlay_dialog\" ]\n    if (is_android) {\n      public_deps -= [ \"//chrome/browser/ui/webui/ai_overlay_dialog\" ]\n    }\n  }\n\n  if (!is_android) {\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//services/device/public/cpp:device_features",\

        \ \ \ \ \ \ "//ui/base:ozone_buildflags",\

        \ \ \ \ \]\

        \

        \ \ \ \ \#\ Any\ circular\ includes\ must\ depend\ on\ the\ target\

        \ \ \ \ \#\ "//chrome/browser:browser_public_dependencies"\.\

        '
      replace: "      \"//services/device/public/cpp:device_features\",\n      \"//ui/base:ozone_buildflags\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor/ui/task_list_bubble:controller\",\n        \"//chrome/browser/actor/ui/task_list_bubble:ui\",\n        \"//chrome/browser/ui/views/autofill:at_memory_promo_bubble_view\",\n        \"//chrome/browser/ui/views/autofill:at_memory_promo_bubble_view_impl\",\n        \"//chrome/browser/ui/views/context_hub:save_to_memory_bank_bubble_controller\",\n        \"//chrome/browser/ui/views/context_hub:save_to_memory_bank_bubble_controller_impl\",\n        \"//chrome/browser/ui/views/context_hub:save_to_memory_bank_bubble_view\",\n      ]\n    }\n\n    # Any circular includes must depend on the target\n    # \"//chrome/browser:browser_public_dependencies\".\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ \#\ views/profiles/profile_menu_coordinator\.h\ gets\ modularized\.\

        \ \ \ \ \ \ "//chrome/browser/ui/views/profiles:avatar_toolbar_button_impl",\

        \ \ \ \ \]\

        \

        \ \ \ \ if\ \(is_linux\)\ \{\

        \ \ \ \ \ \ sources\ \+=\ \[\

        '
      replace: "      # views/profiles/profile_menu_coordinator.h gets modularized.\n      \"//chrome/browser/ui/views/profiles:avatar_toolbar_button_impl\",\n    ]\n    if (is_android) {\n      allow_circular_includes_from -= [\n        \"//chrome/browser/ui/views/autofill:at_memory_promo_bubble_view_impl\",\n        \"//chrome/browser/ui/views/context_hub:save_to_memory_bank_bubble_controller_impl\",\n      ]\n    }\n\n    if (is_linux) {\n      sources += [\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ "//chrome/browser/ui/views/compose",\

        \ \ \ \ \ \ \ \ "//chrome/browser/ui/views/compose:impl",\

        \ \ \ \ \ \ \]\

        \ \ \ \ \ \ allow_circular_includes_from\ \+=\

        \ \ \ \ \ \ \ \ \ \ \[\ "//chrome/browser/ui/views/compose:impl"\ \]\

        \ \ \ \ \}\

        \

        \ \ \ \ if\ \(enable_dice_support\)\ \{\

        '
      replace: "        \"//chrome/browser/ui/views/compose\",\n        \"//chrome/browser/ui/views/compose:impl\",\n      ]\n      if (is_android) {\n        deps -= [\n          \"//chrome/browser/ui/views/compose\",\n          \"//chrome/browser/ui/views/compose:impl\",\n        ]\n      }\n      allow_circular_includes_from +=\n          [ \"//chrome/browser/ui/views/compose:impl\" ]\n      if (is_android) {\n        allow_circular_includes_from -=\n            [ \"//chrome/browser/ui/views/compose:impl\" ]\n      }\n    }\n\n    if (enable_dice_support) {\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//third_party/fuzztest",\

        \ \ \ \ \ \ "//ui/native_window_tracker",\

        \ \ \ \ \]\

        \

        \ \ \ \ if\ \(use_aura\)\ \{\

        \ \ \ \ \ \ sources\ \+=\ \[\ "overscroll_pref_manager_browsertest\.cc"\ \]\

        '
      replace: "      \"//third_party/fuzztest\",\n      \"//ui/native_window_tracker\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/glic/test_support\" ]\n    }\n\n    if (use_aura) {\n      sources += [ \"overscroll_pref_manager_browsertest.cc\" ]\n"

  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//ui/webui",\

        \ \ \]\

        \ \ if\ \(is_android\)\ \{\

        \ \ \ \ deps\ \-=\ \[\

        \ \ \ \ \ \ "//chrome/browser/ai",\

        \ \ \ \ \ \ "//chrome/browser/contextual_tasks:ui",\

        '
      replace: "    \"//ui/webui\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/private_ai\" ]\n  }\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/ai\",\n      \"//chrome/browser/contextual_tasks:ui\",\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//ui/color/dynamic_color",\

        \ \ \ \ \ \ "//ui/events",\

        \ \ \ \ \]\

        \ \ \ \ if\ \(is_android\)\ \{\

        \ \ \ \ \ \ deps\ \-=\ \[\

        \ \ \ \ \ \ \ \ "//chrome/browser/actor/ui:actor_overlay",\

        '
      replace: "      \"//ui/color/dynamic_color\",\n      \"//ui/events\",\n    ]\n    if (is_android) {\n      deps -= [ \"//components/private_ai\" ]\n    }\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor/ui:actor_overlay\",\n"

  - description: 'Android optional popup/private implementation and dependency exclusion: chrome/browser/ui/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \]\

        \ \ \ \ allow_circular_includes_from\ \+=\

        \ \ \ \ \ \ \ \ \[\ "//chrome/browser/ui/views/autofill/autofill_ai:impl"\ \]\

        \ \ \}\

        \

        \ \ \#\ TODO\(https://crbug\.com/330808104\):\ Delete\ this\ code\.\

        '
      replace: "    ]\n    allow_circular_includes_from +=\n        [ \"//chrome/browser/ui/views/autofill/autofill_ai:impl\" ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/ui/views/autofill/popup:popup_at_memory_ai_disclosure_view\" ]\n    }\n  }\n\n  # TODO(https://crbug.com/330808104): Delete this code.\n"
  - description: Remove the GEIC native target from Android browser UI dependencies
    regex:
      re_pattern: '\ \ \ \ deps\ \-=\ \[\

        \ \ \ \ \ \ "//chrome/browser/ai",\

        \ \ \ \ \ \ "//chrome/browser/contextual_tasks:ui",\

        \ \ \ \ \ \ "//chrome/browser/glic",\

        '
      replace: "    deps -= [\n      \"//chrome/browser/ai\",\n      \"//chrome/browser/contextual_tasks:ui\"\
        ,\n      \"//chrome/browser/geic\",\n      \"//chrome/browser/glic\",\n"
    count: 1

  - description: "Android Finds compile-out: Remove Android Finds dependency or source"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \"//chrome/browser/finds\",\\\n"
      replace: ""
    count: 1

  - description: "Android Finds compile-out: Remove Android Finds dependency or source"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \"//chrome/browser/finds/core\",\\\n"
      replace: ""
    count: 1
  - description: 'Android history AI430: chrome/browser/ui/BUILD.gn step 1'
    regex:
      pattern: "    \"//ui/webui\",\n  ]"
      replace: "    \"//ui/webui\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/history_embeddings\",\n    ]\n  }"
    count: 1
  - description: Exclude the Android shopping backend from ui while preserving shared providers and desktop
    regex:
      pattern: "    ]\n    if (enable_extensions) {\n      allow_circular_includes_from +=\n          [ \"//chrome/browser/ui/views/extensions:extensions_toolbar_desktop\"\
        \ ]\n    }\n  }\n}"
      replace: "    ]\n    if (enable_extensions) {\n      allow_circular_includes_from +=\n          [ \"//chrome/browser/ui/views/extensions:extensions_toolbar_desktop\"\
        \ ]\n    }\n  }\n  if (is_android) {\n    deps -= [\n      \"//components/commerce/content/browser\",\n    ]\n  }\n\n\
        }"
    count: 1
  - description: Remove dedicated Android native survey implementation dependency
    regex:
      pattern: '      "//chrome/browser/ui/android/hats:impl",

        '
      replace: ''
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "      \"//chrome/browser/ui/android/tab_model\",\n      \"//chrome/browser/ui/android/tab_model:impl\",\n      \"//chrome/browser/ui/exclusive_access\",\n      \"//chrome/browser/ui/webui/notifications_internals\",\n      \"//chrome/browser/ui/webui/notifications_internals:impl\",\n      \"//components/android_autofill/browser:android\",\n      \"//components/autofill/android:payments_jni_headers\",\n      \"//components/browser_ui/accessibility/android\",\n"
      replace: "      \"//chrome/browser/ui/android/tab_model\",\n      \"//chrome/browser/ui/android/tab_model:impl\",\n      \"//chrome/browser/ui/exclusive_access\",\n      \"//components/android_autofill/browser:android\",\n      \"//components/autofill/android:payments_jni_headers\",\n      \"//components/browser_ui/accessibility/android\",\n"
    count: 1
