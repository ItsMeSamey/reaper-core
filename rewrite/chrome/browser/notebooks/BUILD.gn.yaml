substitutions:
- description: Exclude complete Notebook-owned target definitions from Android
  regex:
    re_pattern: 'group\("notebooks"\)\ \{\

      \ \ public_deps\ =\ \[\ ":factory"\ \]\

      \}\

      \

      source_set\("factory"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "notebooks_eligibility_service_factory\.cc",\

      \ \ \ \ "notebooks_eligibility_service_factory\.h",\

      \ \ \ \ "notebooks_service_factory\.cc",\

      \ \ \ \ "notebooks_service_factory\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\ "//chrome/browser/profiles:profile"\ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//chrome/browser/signin",\

      \ \ \ \ "//chrome/browser/sync:factories",\

      \ \ \ \ "//chrome/common:channel_info",\

      \ \ \ \ "//components/keyed_service/content",\

      \ \ \ \ "//components/notebooks/internal",\

      \ \ \ \ "//components/notebooks/public",\

      \ \ \ \ "//components/sync/base",\

      \ \ \ \ "//components/sync/model",\

      \ \ \ \ "//content/public/browser",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \

      \ \ sources\ =\ \[\

      \ \ \ \ "notebooks_eligibility_service_factory_unittest\.cc",\

      \ \ \ \ "notebooks_service_factory_unittest\.cc",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":notebooks",\

      \ \ \ \ "//base",\

      \ \ \ \ "//base/test:test_support",\

      \ \ \ \ "//chrome/test:test_support",\

      \ \ \ \ "//components/notebooks/public",\

      \ \ \ \ "//content/test:test_support",\

      \ \ \ \ "//testing/gtest",\

      \ \ \]\

      \}\

      '
    replace: "if (!is_android) {\n  group(\"notebooks\") {\n    public_deps = [ \"\
      :factory\" ]\n  }\n\n  source_set(\"factory\") {\n    sources = [\n      \"\
      notebooks_eligibility_service_factory.cc\",\n      \"notebooks_eligibility_service_factory.h\"\
      ,\n      \"notebooks_service_factory.cc\",\n      \"notebooks_service_factory.h\"\
      ,\n    ]\n\n    public_deps = [ \"//chrome/browser/profiles:profile\" ]\n\n\
      \    deps = [\n      \"//base\",\n      \"//chrome/browser/signin\",\n     \
      \ \"//chrome/browser/sync:factories\",\n      \"//chrome/common:channel_info\"\
      ,\n      \"//components/keyed_service/content\",\n      \"//components/notebooks/internal\"\
      ,\n      \"//components/notebooks/public\",\n      \"//components/sync/base\"\
      ,\n      \"//components/sync/model\",\n      \"//content/public/browser\",\n\
      \    ]\n  }\n\n  source_set(\"unit_tests\") {\n    testonly = true\n\n    sources\
      \ = [\n      \"notebooks_eligibility_service_factory_unittest.cc\",\n      \"\
      notebooks_service_factory_unittest.cc\",\n    ]\n\n    deps = [\n      \":notebooks\"\
      ,\n      \"//base\",\n      \"//base/test:test_support\",\n      \"//chrome/test:test_support\"\
      ,\n      \"//components/notebooks/public\",\n      \"//content/test:test_support\"\
      ,\n      \"//testing/gtest\",\n    ]\n  }\n}\n"
  count: 1
