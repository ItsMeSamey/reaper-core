# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/private_ai/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//content/public/browser",\

      \ \ \ \ "//google_apis",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      '
    replace: "    \"//content/public/browser\",\n    \"//google_apis\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/glic/suggestions\" ]\n  }\n}\n\nsource_set(\"unit_tests\") {\n"

- description: 'Android concrete AI source/provider removal: chrome/browser/private_ai/BUILD.gn'
