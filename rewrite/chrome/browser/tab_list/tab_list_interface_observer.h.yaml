# Connect Android split collections to model and transfer APIs.
substitutions:
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tabs::TabInterface\*\ tab,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int\ from_index,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int\ to_index\)\ \{\}\

      \

      \ \ //\ Called\ when\ the\ set\ of\ highlighted\ tabs\ changes\ in\ the\ tab\ list\.\

      \ \ virtual\ void\ OnHighlightedTabsChanged\(\

      \ \ \ \ \ \ TabListInterface\&\ tab_list,\

      \ \ \ \ \ \ const\ std::set<tabs::TabInterface\*>\&\ highlighted_tabs\)\ \{\}\

      '
    replace: "                          tabs::TabInterface* tab,\n                          int from_index,\n                          int to_index) {}\n\n  // Called after a completed Android collection mutation changes a tab's split.\n  // All tab properties already describe the final state. No raw collection\n  // pointer is retained beyond the model's lifetime.\n  virtual void OnSplitChanged(TabListInterface& tab_list,\n                              tabs::TabInterface* tab) {}\n\n  // Called when the set of highlighted tabs changes in the tab list.\n  virtual void OnHighlightedTabsChanged(\n      TabListInterface& tab_list,\n      const std::set<tabs::TabInterface*>& highlighted_tabs) {}\n"
