# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/manta/BUILD.gn'
  regex:
    re_pattern: '\#\ Copyright\ 2026\ The\ Chromium\ Authors\

      \#\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      \#\ found\ in\ the\ LICENSE\ file\.\

      \

      assert\(is_win\ \|\|\ is_mac\ \|\|\ is_linux\ \|\|\ is_chromeos\ \|\|\ is_android\)\

      \

      source_set\("manta"\)\ \{\

      \ \ public\ =\ \[\ "manta_service_factory\.h"\ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//chrome/browser/profiles:profile",\

      \ \ \ \ "//components/keyed_service/core",\

      \ \ \]\

      \}\

      \

      source_set\("impl"\)\ \{\

      \ \ sources\ =\ \[\ "manta_service_factory\.cc"\ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":manta",\

      \ \ \ \ "//base",\

      \ \ \ \ "//base/version_info",\

      \ \ \ \ "//chrome/browser:browser_process",\

      \ \ \ \ "//chrome/browser/signin",\

      \ \ \ \ "//chrome/common:constants",\

      \ \ \ \ "//components/keyed_service/content",\

      \ \ \ \ "//components/language/core/browser",\

      \ \ \ \ "//components/manta",\

      \ \ \ \ "//components/prefs",\

      \ \ \ \ "//components/signin/public/identity_manager",\

      \ \ \ \ "//content/public/browser",\

      \ \ \]\

      \

      \ \ if\ \(is_chromeos\)\ \{\

      \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ "//chromeos/ash/components/channel",\

      \ \ \ \ \ \ "//chromeos/ash/components/demo_mode",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      '
    replace: "if (!is_android) {\n  # Copyright 2026 The Chromium Authors\n  # Use of this source code is governed by a BSD-style license that can be\n  # found in the LICENSE file.\n\n  assert(is_win || is_mac || is_linux || is_chromeos || is_android)\n\n  source_set(\"manta\") {\n    public = [ \"manta_service_factory.h\" ]\n\n    public_deps = [\n      \"//base\",\n      \"//chrome/browser/profiles:profile\",\n      \"//components/keyed_service/core\",\n    ]\n  }\n\n  source_set(\"impl\") {\n    sources = [ \"manta_service_factory.cc\" ]\n\n    deps = [\n      \":manta\",\n      \"//base\",\n      \"//base/version_info\",\n      \"//chrome/browser:browser_process\",\n      \"//chrome/browser/signin\",\n      \"//chrome/common:constants\",\n      \"//components/keyed_service/content\",\n      \"//components/language/core/browser\",\n      \"//components/manta\",\n      \"//components/prefs\",\n      \"//components/signin/public/identity_manager\",\n      \"//content/public/browser\",\n    ]\n\n    if (is_chromeos) {\n      deps += [\n        \"//chromeos/ash/components/channel\",\n        \"//chromeos/ash/components/demo_mode\",\n      ]\n    }\n  }\n}\n"
