# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/webid/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//third_party/blink/public/common:headers",\

      \ \ \ \ "//url",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      '
    replace: "    \"//third_party/blink/public/common:headers\",\n    \"//url\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/actor\" ]\n  }\n}\n\nsource_set(\"unit_tests\") {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/webid/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/test:test_support_ui",\

      \ \ \ \ \ \ "//content/test:test_support",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      \

      '
    replace: "      \"//chrome/test:test_support_ui\",\n      \"//content/test:test_support\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor\",\n        \"//chrome/browser/actor:test_support\",\n        \"//chrome/browser/actor/ui:test_support\",\n      ]\n    }\n  }\n}\n\n"
