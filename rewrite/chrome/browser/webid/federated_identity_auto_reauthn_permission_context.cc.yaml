substitutions:
- description: include-direct-platform-build-config
  regex:
    pattern: '#include "base/time/time.h"

      '
    replace: '#include "base/time/time.h"

      #include "build/build_config.h"

      '
  count: 1
- description: guard-actor-auto-reauthn-include
  regex:
    pattern: '#include "chrome/browser/actor/actor_keyed_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/actor_keyed_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: omit-actor-only-auto-reauthn-veto-on-android
  regex:
    pattern: "bool FederatedIdentityAutoReauthnPermissionContext::\n    IsAutoReauthnDisabledByEmbedder(content::WebContents*\
      \ web_contents) {\n  if (!web_contents) {\n    return false;\n  }\n  Profile* profile =\n      Profile::FromBrowserContext(web_contents->GetBrowserContext());\n\
      \  const auto* tab_interface =\n      tabs::TabInterface::MaybeGetFromContents(web_contents);\n  auto* actor_service\
      \ = actor::ActorKeyedService::Get(profile);\n  return tab_interface && actor_service &&\n         actor_service->IsActiveOnTab(*tab_interface);\n\
      }\n"
    replace: "bool FederatedIdentityAutoReauthnPermissionContext::\n    IsAutoReauthnDisabledByEmbedder(content::WebContents*\
      \ web_contents) {\n#if BUILDFLAG(IS_ANDROID)\n  return false;\n#else\n  if (!web_contents) {\n    return false;\n  }\n\
      \  Profile* profile =\n      Profile::FromBrowserContext(web_contents->GetBrowserContext());\n  const auto* tab_interface\
      \ =\n      tabs::TabInterface::MaybeGetFromContents(web_contents);\n  auto* actor_service = actor::ActorKeyedService::Get(profile);\n\
      \  return tab_interface && actor_service &&\n         actor_service->IsActiveOnTab(*tab_interface);\n#endif  // BUILDFLAG(IS_ANDROID)\n\
      }\n"
  count: 1
