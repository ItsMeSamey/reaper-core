- description: Remove the Feed row subtitle
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(type\ ==\ FEED\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ context\.getString\(getFeedSectionSubtitleId\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

