- description: Exclude the Feed settings option from customization content
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ assumeNonNull\(mProfile\);\

      \ \ \ \ \ \ \ \ if\ \(FeedFeatures\.isFeedEnabled\(mProfile\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ content\.add\(FEED\);\

      \ \ \ \ \ \ \ \ \}\

      \

