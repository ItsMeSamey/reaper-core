- description: Stop reading the removed Feed preference on customization back navigation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ //\ Updates\ the\ visibility\ status\ \(on\ or\ off\)\ of\ the\ feeds\ section\ in\ the\ main\ bottom\

