# Android Chromium Discover implementation exclusion.
substitutions:
- description: Remove the excluded Feed dependency org.chromium.chrome.browser.ntp_customization.NtpCustomizationCoordinator.BottomSheetType.FEED
  regex:
    re_pattern: 'import\ static\ org\.chromium\.chrome\.browser\.ntp_customization\.NtpCustomizationCoordinator\.BottomSheetType\.FEED;\

      '
    replace: ''
- description: Remove the Feed sheet accessibility announcement title
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ FEED:\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ R\.string\.ntp_customization_feed_bottom_sheet;\

      '
    replace: ''
- description: Remove the Feed sheet accessibility announcement _opened_full
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ FEED:\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ R\.string\.ntp_customization_feed_bottom_sheet_opened_full;\

      '
    replace: ''
- description: Remove the Feed sheet accessibility announcement _opened_half
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ FEED:\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ R\.string\.ntp_customization_feed_bottom_sheet_opened_half;\

      '
    replace: ''
- description: Drop removed Composeplate dependency from retained NTP customization
  regex:
    pattern: 'import org.chromium.chrome.browser.composeplate.ComposeplateUtils;

      '
    replace: ''
  count: 1
- description: Import ordinary platform gradient drawable used by preserved white background helper
  regex:
    pattern: 'import android.graphics.drawable.Drawable;

      '
    replace: 'import android.graphics.drawable.Drawable;

      import android.graphics.drawable.GradientDrawable;

      '
  count: 1
- description: Retain ordinary search-box background logic locally without Composeplate backend
  regex:
    pattern: "    /**\n     * Applies or cleans up the white background, elevation shadow, and lateral buffer padding for\n"
    replace: "    /**\n     * Applies the appropriate background drawable for the Search Box.\n     *\n     * @param context\
      \ Used to get resources.\n     * @param view The search box view instance to update.\n     * @param applyWhiteBackground\
      \ Whether to apply a white background.\n     */\n    private static void applySearchBoxBackground(\n            Context\
      \ context, View view, boolean applyWhiteBackground) {\n        if (applyWhiteBackground) {\n            if (NewTabPageUtils.isNtpAuroraEnabled())\
      \ {\n                // When Aurora is enabled on customized image theme, use white mixed with 2% primary\n        \
      \        // tint.\n                view.setBackground(\n                        context.getDrawable(\n             \
      \                   R.drawable.fake_search_box_white_with_primary_color_alpha_2));\n                return;\n      \
      \      }\n            // When Aurora is disabled on customized image theme, use pure white.\n            applyWhiteBackground(context,\
      \ view, /* apply= */ true);\n            return;\n        }\n\n        // Default theme without customized image theme:\n\
      \        if (NewTabPageUtils.isNtpAuroraEnabled()) {\n            view.setBackground(context.getDrawable(R.drawable.fake_search_box_background));\n\
      \            return;\n        }\n\n        // Default theme with Aurora disabled:\n        applyWhiteBackground(context,\
      \ view, /* apply= */ false);\n    }\n\n    /**\n     * Applies a white color to the default background drawable and\
      \ set it as the new background of\n     * the view if apply equals to true; otherwise resets to the default background.\n\
      \     *\n     * @param context Used to get resources.\n     * @param view The view instance to update.\n     * @param\
      \ apply Whether to apply or reset to the default background.\n     */\n    private static void applyWhiteBackground(Context\
      \ context, View view, boolean apply) {\n        Drawable background = context.getDrawable(R.drawable.home_surface_search_box_background);\n\
      \        if (apply) {\n            if (background == null) return;\n\n            // Changes the background of the search_box_container\
      \ to be white.\n            GradientDrawable newBackground = (GradientDrawable) background.mutate();\n            newBackground.setColor(Color.WHITE);\n\
      \            view.setBackground(newBackground);\n            return;\n        }\n\n        // Resets to the default\
      \ background drawable.\n        view.setBackground(background);\n    }\n\n    /**\n     * Applies or cleans up the white\
      \ background, elevation shadow, and lateral buffer padding for\n"
  count: 1
- description: Route retained theme background through local ordinary helper
  regex:
    pattern: '        ComposeplateUtils.applySearchBoxBackground(context, searchBox, applyWhiteBackground);'
    replace: '        applySearchBoxBackground(context, searchBox, applyWhiteBackground);'
  count: 1
