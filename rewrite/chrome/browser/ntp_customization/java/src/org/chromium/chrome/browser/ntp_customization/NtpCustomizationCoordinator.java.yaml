# Android Chromium Discover implementation exclusion.
substitutions:
- description: Remove the excluded Feed dependency org.chromium.chrome.browser.ntp_customization.NtpCustomizationCoordinator.BottomSheetType.FEED
  regex:
    re_pattern: 'import\ static\ org\.chromium\.chrome\.browser\.ntp_customization\.NtpCustomizationCoordinator\.BottomSheetType\.FEED;\

      '
    replace: ''
- description: Remove the excluded Feed dependency org.chromium.chrome.browser.ntp_customization.feed.FeedSettingsCoordinator
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.ntp_customization\.feed\.FeedSettingsCoordinator;\

      '
    replace: ''
- description: Remove ownership of the excluded Feed settings coordinator
  regex:
    re_pattern: '\ \ \ \ private\ @Nullable\ FeedSettingsCoordinator\ mFeedSettingsCoordinator;\

      '
    replace: ''
- description: Remove Feed from accepted customization sheet types
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ BottomSheetType\.FEED,\

      '
    replace: ''
- description: Retire the Feed sheet without renumbering persisted histogram values
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ int\ FEED\ =\ 2;\

      '
    replace: '        // Value 2 belonged to the removed Feed sheet; do not reuse it.

      '
- description: Describe the retained customization profile dependency
  regex:
    re_pattern: '\ \ \ \ \ \*\ @param\ profileSupplier\ A\ supplier\ for\ the\ profile,\ used\ to\ fetch\ the\ state\ of\ the\ feeds\

      \ \ \ \ \ \*\ \ \ \ \ section\.\

      '
    replace: '     * @param profileSupplier A supplier for the profile used by customization settings.

      '
- description: Stop supplying a profile to Feed-only mediator observers
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ containerPropertyModel,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mProfileSupplier,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ windowAndroid,\

      '
    replace: "                        containerPropertyModel,\n                        windowAndroid,\n"
- description: Remove Feed navigation from the main customization sheet
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ mMediator\.registerClickListener\(FEED,\ getOptionClickListener\(FEED\)\);\

      '
    replace: ''
- description: Remove standalone Feed sheet dispatch
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ FEED\ \->\ showFeedBottomSheet\(\);\

      '
    replace: ''
- description: Remove the Feed sheet click handler
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ case\ FEED\ \->\ v\ \->\ showFeedBottomSheet\(\);\

      '
    replace: ''
- description: Remove construction and display of the Feed settings sheet
  regex:
    re_pattern: '\ \ \ \ private\ void\ showFeedBottomSheet\(\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(mFeedSettingsCoordinator\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ Profile\ profile\ =\ assumeNonNull\(mProfileSupplier\.get\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ mFeedSettingsCoordinator\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ FeedSettingsCoordinator\(mContext,\ mDelegate,\ profile\.getOriginalProfile\(\)\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ mMediator\.showBottomSheet\(FEED\);\

      \ \ \ \ \}\

      \

      '
    replace: ''
- description: Remove lifecycle handling for the excluded Feed coordinator
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(mFeedSettingsCoordinator\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mFeedSettingsCoordinator\.destroy\(\);\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: ''
