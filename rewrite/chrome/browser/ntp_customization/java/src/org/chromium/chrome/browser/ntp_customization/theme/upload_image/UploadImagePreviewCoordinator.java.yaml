# Android Chromium Discover implementation exclusion.
substitutions:
- description: Remove the excluded Feed dependency org.chromium.chrome.browser.feed.FeedStreamViewResizerUtils
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.feed\.FeedStreamViewResizerUtils;\

      '
    replace: ''
- description: Size the theme preview without a Feed container or Feed resource dependency
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ 1\.\ Computes\ the\ padding\ added\ to\ the\ feed\ section\.\

      \ \ \ \ \ \ \ \ Resources\ resources\ =\ mActivity\.getResources\(\);\

      \ \ \ \ \ \ \ \ int\ totalFeedPaddingPerSide\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FeedStreamViewResizerUtils\.computePadding\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mActivity,\ mUiConfig,\ mCropImageView,\ mToolBarHeight\);\

      \ \ \ \ \ \ \ \ int\ compensation\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FeedStreamViewResizerUtils\.getFeedNtpCompensationMargin\(resources,\ mUiConfig\);\

      \ \ \ \ \ \ \ \ int\ effectiveFeedPaddingTotal\ =\ \(totalFeedPaddingPerSide\ \+\ compensation\)\ \*\ 2;\

      \

      \ \ \ \ \ \ \ \ //\ 2\.\ Computes\ the\ margin\ added\ to\ the\ ntp\.\

      '
    replace: "        Resources resources = mActivity.getResources();\n        // Match the static NTP container's ordinary search-box margins.\n"
- description: Use the preview width and retained NTP margins for search-box sizing
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ int\ finalWidth\ =\ mCropImageView\.getWidth\(\)\ \-\ effectiveFeedPaddingTotal\ \-\ ntpMarginsTotal;\

      '
    replace: '        int finalWidth = mCropImageView.getWidth() - ntpMarginsTotal;

      '
- description: Drop excluded Composeplate import from image preview
  regex:
    pattern: 'import org.chromium.chrome.browser.composeplate.ComposeplateUtils;

      '
    replace: ''
  count: 1
- description: Use ordinary preview height while retaining Aurora height selection
  regex:
    pattern: '        boolean showSearchBoxTall = ComposeplateUtils.canShowComposeplateButtonOnNtp(profile);

      '
    replace: ''
  count: 1
- description: Pass the no-composeplate input to existing search-box height helper
  regex:
    pattern: '                NtpCustomizationUtils.getSearchBoxHeight(resources, showSearchBoxTall));'
    replace: "                NtpCustomizationUtils.getSearchBoxHeight(\n                        resources, /* showSearchBoxTall=\
      \ */ false));"
  count: 1
- description: Remove the now-unused profile argument at the sole private preview searchbox call
  regex:
    pattern: '            setUpSearchBox(mPreviewPropertyModel, profile);

      '
    replace: '            setUpSearchBox(mPreviewPropertyModel);

      '
  count: 1
- description: Remove the unused Profile parameter from the private ordinary searchbox layout helper
  regex:
    pattern: '    private void setUpSearchBox(PropertyModel propertyModel, Profile profile) {

      '
    replace: '    private void setUpSearchBox(PropertyModel propertyModel) {

      '
  count: 1
