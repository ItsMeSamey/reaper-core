# Android Chromium Discover implementation exclusion.
substitutions:
- description: Remove the excluded Feed dependency org.chromium.chrome.browser.ntp_customization.NtpCustomizationViewProperties.MAIN_BOTTOM_SHEET_FEED_SECTION_SUBTITLE
  regex:
    re_pattern: 'import\ static\ org\.chromium\.chrome\.browser\.ntp_customization\.NtpCustomizationViewProperties\.MAIN_BOTTOM_SHEET_FEED_SECTION_SUBTITLE;\

      '
    replace: ''
- description: Remove the Feed subtitle view binding
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \}\ else\ if\ \(propertyKey\ ==\ MAIN_BOTTOM_SHEET_FEED_SECTION_SUBTITLE\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ BottomSheetListItemView\ feedListItem\ =\ view\.findViewById\(R\.id\.feed_settings\);\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ The\ feedListItem\ could\ be\ null\ if\ Feeds\ is\ disabled\.\ See\ https://crbug\.com/426191805\.\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(feedListItem\ ==\ null\)\ return;\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ String\ subtitleText\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ view\.getContext\(\)\.getString\(model\.get\(MAIN_BOTTOM_SHEET_FEED_SECTION_SUBTITLE\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ feedListItem\.setSubtitle\(subtitleText\);\

      '
    replace: ''
