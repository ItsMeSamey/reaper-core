# Android Chromium Discover implementation exclusion.
substitutions:
- description: Remove excluded Feed test dependency
  regex:
    re_pattern: 'import\ org\.chromium\.base\.test\.util\.Features;\

      '
    replace: ''
- description: Do not enable an excluded Feed layout feature in generic theme preview tests
  regex:
    re_pattern: '@Features\.EnableFeatures\(ChromeFeatureList\.FEED_CONTAINMENT\)\

      '
    replace: ''
