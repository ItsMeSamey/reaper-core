# Android Chromium Discover implementation exclusion.
substitutions:
- description: Remove excluded Feed test dependency
  regex:
    re_pattern: 'import\ static\ org\.chromium\.chrome\.browser\.ntp_customization\.NtpCustomizationViewProperties\.MAIN_BOTTOM_SHEET_FEED_SECTION_SUBTITLE;\

      '
    replace: ''
- description: Keep shared string setup and MVT/card bindings while dropping the Feed subtitle case
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ Verifies\ the\ feed\ section\ subtitle\ of\ the\ main\ bottom\ sheet\ will\ get\ updated\ timely\.\

      \ \ \ \ \ \ \ \ when\(mMainBottomSheetListContainerView\.findViewById\(R\.id\.feed_settings\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.thenReturn\(mMainBottomSheetListItem\);\

      \ \ \ \ \ \ \ \ when\(mMainBottomSheetListContainerView\.getContext\(\)\)\.thenReturn\(mContext\);\

      \ \ \ \ \ \ \ \ when\(mContext\.getString\(R\.string\.text_on\)\)\.thenReturn\("On"\);\

      \ \ \ \ \ \ \ \ when\(mContext\.getString\(R\.string\.text_off\)\)\.thenReturn\("Off"\);\

      \ \ \ \ \ \ \ \ mPropertyModel\.set\(MAIN_BOTTOM_SHEET_FEED_SECTION_SUBTITLE,\ R\.string\.text_on\);\

      \ \ \ \ \ \ \ \ verify\(mMainBottomSheetListItem\)\.setSubtitle\(eq\("On"\)\);\

      \ \ \ \ \ \ \ \ mPropertyModel\.set\(MAIN_BOTTOM_SHEET_FEED_SECTION_SUBTITLE,\ R\.string\.text_off\);\

      \ \ \ \ \ \ \ \ verify\(mMainBottomSheetListItem\)\.setSubtitle\(eq\("Off"\)\);\

      \

      '
    replace: "        when(mMainBottomSheetListContainerView.getContext()).thenReturn(mContext);\n        when(mContext.getString(R.string.text_on)).thenReturn(\"On\");\n        when(mContext.getString(R.string.text_off)).thenReturn(\"Off\");\n\n"
