# Android Chromium Discover implementation exclusion.
substitutions:
- description: Remove excluded Feed test dependency
  regex:
    re_pattern: 'import\ static\ org\.chromium\.chrome\.browser\.ntp_customization\.NtpCustomizationCoordinator\.BottomSheetType\.FEED;\

      '
    replace: ''
- description: Remove only the deleted Feed accessibility announcement case
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ Verifies\ the\ expected\ content\ description\ and\ accessibility\ string\ when\ the\ feed\ bottom\

      \ \ \ \ \ \ \ \ //\ sheet\ is\ fully\ expanded\.\

      \ \ \ \ \ \ \ \ mBottomSheetContent\.setCurrentBottomSheetTypeSupplierForTesting\(\(\)\ \->\ FEED\);\

      \ \ \ \ \ \ \ \ assertEquals\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Discover\ feed\ bottom\ sheet",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mBottomSheetContent\.getSheetContentDescription\(mContext\)\);\

      \ \ \ \ \ \ \ \ assertEquals\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.string\.ntp_customization_feed_bottom_sheet_opened_full,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mBottomSheetContent\.getSheetFullHeightAccessibilityStringId\(\)\);\

      \

      '
    replace: ''
