- description: Replace the retired sheet type with retained theme coverage
  regex:
    re_pattern: 'import\ static\ org\.chromium\.chrome\.browser\.ntp_customization\.NtpCustomizationCoordinator\.BottomSheetType\.FEED;\

      '
    replace: 'import static org.chromium.chrome.browser.ntp_customization.NtpCustomizationCoordinator.BottomSheetType.THEME;

      '
- description: Exercise standalone theme-sheet behavior instead of the removed Feed sheet
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FEED,\

      '
    replace: '                        THEME,

      '
  count: 2
- description: Describe the retained standalone sheet case
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ Verifies\ that\ if\ being\ requested\ to\ show\ the\ Feed\ settings\ bottom\ sheet\ alone,\

      '
    replace: '        // Verifies that if being requested to show the theme bottom sheet alone,

      '
