# Android Chromium Discover implementation exclusion.
substitutions:
- description: Use retained customization types in generic list rendering fixtures
  regex:
    re_pattern: 'import\ static\ org\.chromium\.chrome\.browser\.ntp_customization\.NtpCustomizationCoordinator\.BottomSheetType\.FEED;\

      '
    replace: 'import static org.chromium.chrome.browser.ntp_customization.NtpCustomizationCoordinator.BottomSheetType.MVT;

      '
- description: Preserve multi-item list rendering and event coverage without Feed
  regex:
    re_pattern: List\.of\(NTP_CARDS,\ FEED\)
    replace: List.of(NTP_CARDS, MVT)
  count: 2
