# Android Chromium Discover implementation exclusion.
substitutions:
- description: Keep generic back-button binding coverage on a retained settings sheet
  regex:
    re_pattern: testBindOnFeedSettingsBottomSheet
    replace: testBindOnMvtSettingsBottomSheet
- description: Describe retained sheet binding coverage
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ Adds\ the\ feed\ settings\ bottom\ sheet\ to\ the\ view\ of\ the\ activity\.\

      '
    replace: '        // Adds the MVT settings bottom sheet to the view of the activity.

      '
- description: Rename the retained MVT fixture
  regex:
    re_pattern: feedBottomSheet
    replace: mvtBottomSheet
  count: 3
- description: Inflate retained MVT resources for the shared back-button binder
  regex:
    re_pattern: R\.layout\.ntp_customization_feed_bottom_sheet
    replace: R.layout.ntp_customization_mvt_bottom_sheet
