- description: Keep retained customization behavior in testBackPressOnNtpCardsBottomSheet
  regex:
    re_pattern: '\

      \ \ \ \ \ \ \ \ mViewFlipperMap\.put\(BottomSheetType\.MAIN,\ 10\);\

      \ \ \ \ \ \ \ \ mMediator\.setCurrentBottomSheetForTesting\(BottomSheetType\.NTP_CARDS\);\

      \

      \ \ \ \ \ \ \ \ when\(mPrefService\.getBoolean\(Pref\.ARTICLES_LIST_VISIBLE\)\)\.thenReturn\(true\);\

      \ \ \ \ \ \ \ \ mMediator\.backPressOnCurrentBottomSheet\(\);\

      \

      \ \ \ \ \ \ \ \ //\ Verifies\ that\ hideContent\(\)\ is\ not\ called\ and\ showBottomSheet\(\)\ is\ called\ to\ change\ the\

      \ \ \ \ \ \ \ \ //\ value\ of\ mCurrentBottomSheet\ and\ to\ set\ the\ value\ of\ mPropertyModel\.\

      \ \ \ \ \ \ \ \ verify\(mBottomSheetController,\ never\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.hideContent\(any\(BottomSheetContent\.class\),\ anyBoolean\(\)\);\

      \ \ \ \ \ \ \ \ assertEquals\(BottomSheetType\.MAIN,\ \(int\)\ mMediator\.getCurrentBottomSheetType\(\)\);\

      \ \ \ \ \ \ \ \ verify\(mViewFlipperPropertyModel\)\.set\(eq\(LAYOUT_TO_DISPLAY\),\ eq\(10\)\);\

      \

      \ \ \ \ \ \ \ \ //\ Verifies\ that\ the\ subtitle\ of\ the\ feed\ item\ in\ the\ main\ bottom\ sheet\ is\ updated\ properly\.\

      \ \ \ \ \ \ \ \ verify\(mContainerPropertyModel\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.set\(eq\(MAIN_BOTTOM_SHEET_FEED_SECTION_SUBTITLE\),\ eq\(R\.string\.text_on\)\);\

      \

      \ \ \ \ \ \ \ \ mMediator\.setCurrentBottomSheetForTesting\(BottomSheetType\.NTP_CARDS\);\

      \ \ \ \ \ \ \ \ when\(mPrefService\.getBoolean\(Pref\.ARTICLES_LIST_VISIBLE\)\)\.thenReturn\(false\);\

      \ \ \ \ \ \ \ \ mMediator\.backPressOnCurrentBottomSheet\(\);\

      \ \ \ \ \ \ \ \ verify\(mContainerPropertyModel\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.set\(eq\(MAIN_BOTTOM_SHEET_FEED_SECTION_SUBTITLE\),\ eq\(R\.string\.text_off\)\);'
    replace: "\n        mViewFlipperMap.put(MAIN, 10);\n        mMediator.setCurrentBottomSheetForTesting(NTP_CARDS);\n        when(mConfigManager.getPrefIsMvtToggleOn()).thenReturn(true);\n\n        mMediator.backPressOnCurrentBottomSheet();\n\n        verify(mBottomSheetController, never())\n                .hideContent(any(BottomSheetContent.class), anyBoolean());\n        assertEquals(MAIN, (int) mMediator.getCurrentBottomSheetType());\n        verify(mViewFlipperPropertyModel).set(eq(LAYOUT_TO_DISPLAY), eq(10));\n        verify(mContainerPropertyModel)\n                .set(eq(MAIN_BOTTOM_SHEET_MVT_SECTION_SUBTITLE), eq(R.string.text_on));\n\n        mMediator.setCurrentBottomSheetForTesting(NTP_CARDS);\n        when(mConfigManager.getPrefIsMvtToggleOn()).thenReturn(false);\n        mMediator.backPressOnCurrentBottomSheet();\n        verify(mContainerPropertyModel)\n                .set(eq(MAIN_BOTTOM_SHEET_MVT_SECTION_SUBTITLE), eq(R.string.text_off));"
- description: Keep retained customization behavior in testListContainerViewDelegate
  regex:
    re_pattern: '\

      \ \ \ \ \ \ \ \ //\ Verifies\ the\ subtitle\ of\ the\ "feeds"\ list\ item\ is\ "On"\ and\ is\ null\ for\ other\ list\ item\.\

      \ \ \ \ \ \ \ \ when\(mPrefService\.getBoolean\(Pref\.ARTICLES_LIST_VISIBLE\)\)\.thenReturn\(true\);\

      \ \ \ \ \ \ \ \ assertEquals\("On",\ mListDelegate\.getListItemSubtitle\(FEED,\ mContext\)\);\

      \ \ \ \ \ \ \ \ when\(mPrefService\.getBoolean\(Pref\.ARTICLES_LIST_VISIBLE\)\)\.thenReturn\(false\);\

      \ \ \ \ \ \ \ \ assertEquals\("Off",\ mListDelegate\.getListItemSubtitle\(FEED,\ mContext\)\);\

      \ \ \ \ \ \ \ \ assertNull\(mListDelegate\.getListItemSubtitle\(MAIN,\ mContext\)\);\

      \

      \ \ \ \ \ \ \ \ //\ Verifies\ the\ listener\ returned\ from\ the\ delegate\ is\ in\ mTypeToListeners\ map\.\

      \ \ \ \ \ \ \ \ Map<Integer,\ View\.OnClickListener>\ typeToListenerMap\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mMediator\.getTypeToListenersForTesting\(\);\

      \ \ \ \ \ \ \ \ View\.OnClickListener\ ntpListener\ =\ mock\(View\.OnClickListener\.class\);\

      \ \ \ \ \ \ \ \ View\.OnClickListener\ feedsListener\ =\ mock\(View\.OnClickListener\.class\);\

      \ \ \ \ \ \ \ \ typeToListenerMap\.put\(NTP_CARDS,\ ntpListener\);\

      \ \ \ \ \ \ \ \ typeToListenerMap\.put\(FEED,\ feedsListener\);\

      \ \ \ \ \ \ \ \ assertEquals\(ntpListener,\ mListDelegate\.getListener\(NTP_CARDS\)\);\

      \ \ \ \ \ \ \ \ assertEquals\(feedsListener,\ mListDelegate\.getListener\(FEED\)\);'
    replace: "\n        when(mConfigManager.getPrefIsMvtToggleOn()).thenReturn(true);\n        assertEquals(\"On\", mListDelegate.getListItemSubtitle(MVT, mContext));\n        when(mConfigManager.getPrefIsMvtToggleOn()).thenReturn(false);\n        assertEquals(\"Off\", mListDelegate.getListItemSubtitle(MVT, mContext));\n        assertNull(mListDelegate.getListItemSubtitle(MAIN, mContext));\n\n        Map<Integer, View.OnClickListener> typeToListenerMap =\n                mMediator.getTypeToListenersForTesting();\n        View.OnClickListener ntpListener = mock(View.OnClickListener.class);\n        View.OnClickListener mvtListener = mock(View.OnClickListener.class);\n        typeToListenerMap.put(NTP_CARDS, ntpListener);\n        typeToListenerMap.put(MVT, mvtListener);\n        assertEquals(ntpListener, mListDelegate.getListener(NTP_CARDS));\n        assertEquals(mvtListener, mListDelegate.getListener(MVT));"
