# Android Chromium Discover implementation exclusion.
substitutions:
- description: Remove excluded Feed test dependency
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.feed\.FeedServiceBridge;\

      '
    replace: ''
- description: Remove excluded Feed test dependency
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.feed\.FeedServiceBridgeJni;\

      '
    replace: ''
- description: Remove Feed setup from retained factory lifecycle coverage
  regex:
    re_pattern: '\ \ \ \ @Mock\ private\ FeedServiceBridge\.Natives\ mMockFeedServiceBridgeJni;\

      '
    replace: ''
- description: Remove Feed setup from retained factory lifecycle coverage
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ FeedServiceBridgeJni\.setInstanceForTesting\(mMockFeedServiceBridgeJni\);\

      '
    replace: ''
- description: Remove Feed setup from retained factory lifecycle coverage
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ when\(mMockFeedServiceBridgeJni\.isEnabled\(\)\)\.thenReturn\(true\);\

      '
    replace: ''
