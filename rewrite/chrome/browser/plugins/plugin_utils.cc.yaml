# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Use the generic registry on Android
  count: 6
  regex:
    re_pattern: BUILDFLAG\(ENABLE_EXTENSIONS\)
    replace: BUILDFLAG(ENABLE_EXTENSIONS_CORE)
- description: Honor the desktop PDF preference only when registered
  regex:
    re_pattern: \ \ \ \ \ \ profile\->GetPrefs\(\)\->GetBoolean\(prefs::kPluginsAlwaysOpenPdfExternally\)\)\ \{
    replace: "      profile->GetPrefs()->FindPreference(prefs::kPluginsAlwaysOpenPdfExternally) &&\n      profile->GetPrefs()->GetBoolean(prefs::kPluginsAlwaysOpenPdfExternally)) {"
- description: Exclude legacy plugin handlers from both Android registry lookups
  regex:
    re_pattern: \ \ if\ \(profile\->IsOffTheRecord\(\)\ \&\&
    replace: "#if BUILDFLAG(IS_ANDROID)\n  const auto* extension = extensions::ExtensionRegistry::Get(profile)\n                              ->enabled_extensions().GetByID(extension_id);\n  const auto* handler = extension ? MimeTypesHandler::Get(*extension) : nullptr;\n  if (!handler || handler->IsPluginExtension()) {\n    return false;\n  }\n#endif\n  if (profile->IsOffTheRecord() &&"
- description: Identify Android without enabling the plugin build
  regex:
    re_pattern: \#include\ "base/values\.h"
    replace: '#include "base/values.h"

      #include "build/build_config.h"'
- description: Format the modified MIME implementation with Chromium style
  regex:
    re_pattern: '\ \ //\ Chrome\.\ Any\ extension\ can\ register\ a\ handler\ for\ a\ PDF\ MIME\ type,\ so\

      \ \ //\ suppression\ has\ to\ key\ off\ the\ MIME\ type\ rather\ than\ a\ specific\

      \ \ //\ extension\ id\.\

      \ \ if\ \(IsPdfMimeType\(mime_type\)\ \&\&\

      \ \ \ \ \ \ profile\->GetPrefs\(\)\->FindPreference\(prefs::kPluginsAlwaysOpenPdfExternally\)\ \&\&\

      \ \ \ \ \ \ profile\->GetPrefs\(\)\->GetBoolean\(prefs::kPluginsAlwaysOpenPdfExternally\)\)\ \{\

      \ \ \ \ return\ false;\

      \ \ \}\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ const\ auto\*\ extension\ =\ extensions::ExtensionRegistry::Get\(profile\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \->enabled_extensions\(\)\.GetByID\(extension_id\);\

      \ \ const\ auto\*\ handler\ =\ extension\ \?\ MimeTypesHandler::Get\(\*extension\)\ :\ nullptr;\

      \ \ if\ \(!handler\ \|\|\ handler\->IsPluginExtension\(\)\)\ \{\

      \ \ \ \ return\ false;\

      \ \ \}\

      '
    replace: "  // Chrome. Any extension can register a handler for a PDF MIME type, so\n  // suppression has to key off the MIME type rather than a specific\n  // extension id.\n  if (IsPdfMimeType(mime_type) &&\n      profile->GetPrefs()->FindPreference(\n          prefs::kPluginsAlwaysOpenPdfExternally) &&\n      profile->GetPrefs()->GetBoolean(prefs::kPluginsAlwaysOpenPdfExternally)) {\n    return false;\n  }\n#if BUILDFLAG(IS_ANDROID)\n  const auto* extension =\n      extensions::ExtensionRegistry::Get(profile)->enabled_extensions().GetByID(\n          extension_id);\n  const auto* handler = extension ? MimeTypesHandler::Get(*extension) : nullptr;\n  if (!handler || handler->IsPluginExtension()) {\n    return false;\n  }\n"
