substitutions:
- description: Use platform and plugin guards around legacy paths
  regex:
    re_pattern: \#include\ "base/uuid\.h"
    replace: '#include "base/uuid.h"

      #include "build/build_config.h"

      #include "content/public/common/buildflags.h"'
- description: Exclude the legacy plugin attach helper
  regex:
    re_pattern: \#include\ "extensions/browser/guest_view/mime_handler_view/mime_handler_view_attach_helper\.h"
    replace: '#if BUILDFLAG(ENABLE_PLUGINS)

      #include "extensions/browser/guest_view/mime_handler_view/mime_handler_view_attach_helper.h"

      #endif'
- description: Route native Android fallback through the original response pipeline
  regex:
    re_pattern: \ \ if\ \(response_head\->mime_type\ ==\ pdf::kPDFMimeType\)\ \{
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // A native fallback reload must reach Android's existing PDF/download path,\n  // including after redirects. Never let the same extension reclaim it.\n  if (auto* manager = MimeHandlerStreamManager::FromWebContents(web_contents);\n      manager && manager->IsPendingNativeFallback(frame_tree_node_id_, response_url)) {\n    return;\n  }\n#endif\n#if BUILDFLAG(ENABLE_PDF)\n  if (response_head->mime_type == pdf::kPDFMimeType) {"
- description: Keep desktop PDF replay code out of Android
  regex:
    re_pattern: '\ \ if\ \(extension_id\.empty\(\)\)\ \{\

      \ \ \ \ extension_id\ =\ PluginUtils::GetExtensionIdForMimeType\('
    replace: "#endif  // BUILDFLAG(ENABLE_PDF)\n\n  if (extension_id.empty()) {\n    extension_id = PluginUtils::GetExtensionIdForMimeType("
- description: Keep frame-based plugin setup desktop-only
  regex:
    re_pattern: '\ \ \}\ else\ \{\

      \ \ \ \ //\ The\ resource\ is\ handled\ by\ frame\-based\ MimeHandlerView,'
    replace: "  } else {\n#if BUILDFLAG(ENABLE_PLUGINS)\n    // The resource is handled by frame-based MimeHandlerView,"
- description: Never synthesize a plugin response without a renderer
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ weak_factory_\.GetWeakPtr\(\)\)\);\

      \ \ \}\

      \ \ \*defer\ =\ true;'
    replace: "                weak_factory_.GetWeakPtr()));\n#else\n    // PluginUtils excludes legacy handlers on Android before reaching here.\n    return;\n#endif\n  }\n  *defer = true;"
- description: Avoid allocating a desktop PDF replay cache on Android
  regex:
    re_pattern: '\ \ \ \ if\ \(is_for_generic_mime_handler\ \&\&\

      \ \ \ \ \ \ \ \ original_mime_type\ ==\ pdf::kPDFMimeType\ \&\&'
    replace: "#if BUILDFLAG(ENABLE_PDF)\n    if (is_for_generic_mime_handler &&\n        original_mime_type == pdf::kPDFMimeType &&"
- description: Transfer the original response pipe directly to generic handlers
  regex:
    re_pattern: '\ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ transferrable_loader\->body\ =\ std::move\(consumer_handle\);\

      \ \ \ \ \}'
    replace: "    } else\n#endif\n    {\n      transferrable_loader->body = std::move(consumer_handle);\n    }"
- description: Format the modified MIME implementation with Chromium style
  regex:
    re_pattern: '\#include\ "base/numerics/safe_conversions\.h"\

      \#include\ "base/unguessable_token\.h"\

      \#include\ "base/uuid\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "content/public/common/buildflags\.h"\

      \#include\ "chrome/browser/extensions/api/mime_handlers/dispatch_mime_handler_event\.h"\

      \#include\ "chrome/browser/plugins/plugin_utils\.h"\

      \#include\ "content/public/browser/browser_task_traits\.h"\

      \#include\ "content/public/browser/browser_thread\.h"\

      \#include\ "content/public/browser/download_utils\.h"\

      \#include\ "content/public/browser/web_contents\.h"\

      \#include\ "extensions/browser/extension_registry\.h"\

      \#if\ BUILDFLAG\(ENABLE_PLUGINS\)\

      \#include\ "extensions/browser/guest_view/mime_handler_view/mime_handler_view_attach_helper\.h"\

      \#endif\

      '
    replace: '#include "base/numerics/safe_conversions.h"

      #include "base/unguessable_token.h"

      #include "base/uuid.h"

      #include "build/build_config.h"

      #include "chrome/browser/extensions/api/mime_handlers/dispatch_mime_handler_event.h"

      #include "chrome/browser/plugins/plugin_utils.h"

      #include "content/public/browser/browser_task_traits.h"

      #include "content/public/browser/browser_thread.h"

      #include "content/public/browser/download_utils.h"

      #include "content/public/browser/web_contents.h"

      #include "content/public/common/buildflags.h"

      #include "extensions/browser/extension_registry.h"

      #if BUILDFLAG(ENABLE_PLUGINS)

      #include "extensions/browser/guest_view/mime_handler_view/mime_handler_view_attach_helper.h"

      #endif

      '
- description: Format the modified MIME implementation with Chromium style
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ //\ A\ native\ fallback\ reload\ must\ reach\ Android''s\ existing\ PDF/download\ path,\

      \ \ //\ including\ after\ redirects\.\ Never\ let\ the\ same\ extension\ reclaim\ it\.\

      \ \ if\ \(auto\*\ manager\ =\ MimeHandlerStreamManager::FromWebContents\(web_contents\);\

      \ \ \ \ \ \ manager\ \&\&\ manager\->IsPendingNativeFallback\(frame_tree_node_id_,\ response_url\)\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \#endif\

      \#if\ BUILDFLAG\(ENABLE_PDF\)\

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // A native fallback reload must reach Android's existing PDF/download path,\n  // including after redirects. Never let the same extension reclaim it.\n  if (auto* manager = MimeHandlerStreamManager::FromWebContents(web_contents);\n      manager &&\n      manager->IsPendingNativeFallback(frame_tree_node_id_, response_url)) {\n    return;\n  }\n#endif\n#if BUILDFLAG(ENABLE_PDF)\n"
- description: Keep redirects inside the Android native fallback bypass
  regex:
    re_pattern: manager\->IsPendingNativeFallback\(frame_tree_node_id_,\ response_url\)
    replace: manager->ShouldBypassForNativeFallback(frame_tree_node_id_)
