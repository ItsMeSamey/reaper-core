# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Use the extensions engine build condition
  regex:
    re_pattern: import\("//content/public/common/features\.gni"\)
    replace: 'import("//content/public/common/features.gni")

      import("//extensions/buildflags/buildflags.gni")'
- description: Expose only generic interceptor headers on Android
  regex:
    re_pattern: '\ \ if\ \(enable_plugins\ \|\|\ is_android\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "plugin_observer_common\.h"\ \]\

      \ \ \}'
    replace: "  if (is_android && enable_extensions_core) {\n    sources += [\n      \"plugin_response_interceptor_url_loader_throttle.h\",\n      \"plugin_utils.h\",\n    ]\n    public_deps += [\n      \"//components/content_settings/core/common\",\n      \"//services/network/public/mojom\",\n      \"//third_party/blink/public/common\",\n    ]\n  }\n\n  if (enable_plugins || is_android) {\n    sources += [ \"plugin_observer_common.h\" ]\n  }"
- description: Compile generic response interception without plugin services
  regex:
    re_pattern: '\ \ if\ \(enable_plugins\ \|\|\ is_android\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "plugin_observer_common\.cc"\ \]\

      \ \ \}'
    replace: "  if (is_android && enable_extensions_core) {\n    sources += [\n      \"plugin_response_interceptor_url_loader_throttle.cc\",\n      \"plugin_utils.cc\",\n    ]\n    deps += [\n      \"//chrome/browser/extensions\",\n      \"//components/content_settings/core/browser\",\n      \"//components/prefs\",\n      \"//extensions/browser\",\n      \"//extensions/browser/mime_handler\",\n      \"//extensions/browser/mime_handler:mime_handler_page\",\n      \"//extensions/browser/mime_handler:mime_handler_registry\",\n      \"//extensions/browser/mime_handler:stream_container\",\n      \"//extensions/buildflags\",\n      \"//extensions/common\",\n      \"//mojo/public/cpp/bindings\",\n      \"//pdf:buildflags\",\n      \"//services/network/public/cpp\",\n      \"//ui/base\",\n      \"//url\",\n    ]\n  }\n\n  if (enable_plugins || is_android) {\n    sources += [ \"plugin_observer_common.cc\" ]\n  }"
