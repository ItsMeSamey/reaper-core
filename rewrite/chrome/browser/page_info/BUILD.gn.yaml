substitutions:
- description: Exclude dedicated merchant factory/delegate header admission on Android while retaining ordinary PageInfo
  regex:
    pattern: "    \"page_info_features.h\",\n  ]\n  public_deps = ["
    replace: "    \"page_info_features.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"merchant_trust_service_delegate.h\"\
      ,\n      \"merchant_trust_service_factory.h\",\n    ]\n  }\n  public_deps = ["
  count: 1
- description: Exclude Android merchant factory/delegate implementation sources; preserve other mixed-target dependencies
  regex:
    pattern: "    \"page_info_features.cc\",\n  ]\n\n  deps = ["
    replace: "    \"page_info_features.cc\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"merchant_trust_service_delegate.cc\"\
      ,\n      \"merchant_trust_service_factory.cc\",\n    ]\n  }\n\n  deps = ["
  count: 1
