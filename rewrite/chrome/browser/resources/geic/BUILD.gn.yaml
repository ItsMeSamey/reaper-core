substitutions:
- description: Exclude all GEIC targets from Android while preserving desktop definitions
  regex:
    re_pattern: 'build_webui\("build"\)\ \{\

      \ \ grd_prefix\ =\ "geic"\

      \

      \ \ ts_files\ =\ \[\ "geic_mojo_bindings_wrapper\.ts"\ \]\

      \

      \ \ mojo_files_deps\ =\ \[\ "//chrome/browser/geic:mojo_bindings_ts__generator"\
      \]\

      \ \ mojo_files\ =\ \[\ "\$root_gen_dir/chrome/browser/geic/geic\.mojom\-webui\.ts"\
      \]\

      \

      \ \ webui_context_type\ =\ "trusted"\

      \ \ ts_deps\ =\ \[\

      \ \ \ \ "//ui/webui/resources/js:build_ts",\

      \ \ \ \ "//ui/webui/resources/mojo:build_ts",\

      \ \ \]\

      \

      \ \ extra_grdp_deps\ =\ \[\ ":build_grdp"\ \]\

      \ \ extra_grdp_files\ =\ \[\ "\$target_gen_dir/resources\.grdp"\ \]\

      \

      \ \ ts_composite\ =\ true\

      \}\

      \

      bundle_js\("geic_mojo_bindings_rollup"\)\ \{\

      \ \ \#\ GEiC\ UI\ runs\ in\ a\ PrivilegedWebContents\ from\ a\ remote\ HTTPS\
      origin\ rather\

      \ \ \#\ than\ a\ chrome://\ WebUI\ page\.\ A\ placeholder\ host\ satisfies\
      the\ bundle_js\

      \ \ \#\ template''s\ required\ host\ parameter\ without\ binding\ it\ to\ a\
      WebUI\ URL\.\

      \ \ host\ =\ "about:blank"\

      \ \ input\ =\ rebase_path\("\$target_gen_dir/tsc",\ root_build_dir\)\

      \ \ js_module_in_files\ =\ \[\ "geic_mojo_bindings_wrapper\.js"\ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":build_ts",\

      \

      \ \ \ \ \#\ Unlike\ standard\ WebUI,\ the\ panel\ is\ a\ remote\ HTTPS\ origin\
      and\ can''t\ load\

      \ \ \ \ \#\ from\ chrome://resources/,\ so\ bindings\.js\ is\ inlined\ into\
      the\ bundle\ rather\

      \ \ \ \ \#\ than\ excluded\.\ That\ makes\ it\ a\ build\ input,\ so\ declare\
      where\ it\ comes\

      \ \ \ \ \#\ from\.\

      \

      \ \ \ \ "//mojo/public/js:bindings_module",\

      \ \ \]\

      \

      \ \ external_paths\ =\ \[\

      \ \ \ \ "//resources/mojo/mojo/public/js/\|"\ \+\

      \ \ \ \ \ \ \ \ rebase_path\("\$root_gen_dir/mojo/public/js",\ root_build_dir\),\

      \ \ \ \ "//resources/mojo/\|"\ \+\

      \ \ \ \ \ \ \ \ rebase_path\("\$root_gen_dir/ui/webui/resources/tsc/mojo",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ root_build_dir\),\

      \ \ \]\

      \}\

      \

      generate_grd\("build_grdp"\)\ \{\

      \ \ grd_prefix\ =\ "geic"\

      \ \ out_grd\ =\ "\$target_gen_dir/resources\.grdp"\

      \ \ input_files_base_dir\ =\ rebase_path\(target_gen_dir,\ root_build_dir\)\

      \ \ input_files\ =\ \[\ "geic_mojo_bindings_wrapper\.rollup\.js"\ \]\

      \ \ deps\ =\ \[\ ":geic_mojo_bindings_rollup"\ \]\

      \}\

      '
    replace: "if (!is_android) {\n  build_webui(\"build\") {\n    grd_prefix = \"\
      geic\"\n\n    ts_files = [ \"geic_mojo_bindings_wrapper.ts\" ]\n\n    mojo_files_deps\
      \ = [ \"//chrome/browser/geic:mojo_bindings_ts__generator\" ]\n    mojo_files\
      \ = [ \"$root_gen_dir/chrome/browser/geic/geic.mojom-webui.ts\" ]\n\n    webui_context_type\
      \ = \"trusted\"\n    ts_deps = [\n      \"//ui/webui/resources/js:build_ts\"\
      ,\n      \"//ui/webui/resources/mojo:build_ts\",\n    ]\n\n    extra_grdp_deps\
      \ = [ \":build_grdp\" ]\n    extra_grdp_files = [ \"$target_gen_dir/resources.grdp\"\
      \ ]\n\n    ts_composite = true\n  }\n\n  bundle_js(\"geic_mojo_bindings_rollup\"\
      ) {\n    # GEiC UI runs in a PrivilegedWebContents from a remote HTTPS origin\
      \ rather\n    # than a chrome:// WebUI page. A placeholder host satisfies the\
      \ bundle_js\n    # template's required host parameter without binding it to\
      \ a WebUI URL.\n    host = \"about:blank\"\n    input = rebase_path(\"$target_gen_dir/tsc\"\
      , root_build_dir)\n    js_module_in_files = [ \"geic_mojo_bindings_wrapper.js\"\
      \ ]\n\n    deps = [\n      \":build_ts\",\n\n      # Unlike standard WebUI,\
      \ the panel is a remote HTTPS origin and can't load\n      # from chrome://resources/,\
      \ so bindings.js is inlined into the bundle rather\n      # than excluded. That\
      \ makes it a build input, so declare where it comes\n      # from.\n\n     \
      \ \"//mojo/public/js:bindings_module\",\n    ]\n\n    external_paths = [\n \
      \     \"//resources/mojo/mojo/public/js/|\" +\n          rebase_path(\"$root_gen_dir/mojo/public/js\"\
      , root_build_dir),\n      \"//resources/mojo/|\" +\n          rebase_path(\"\
      $root_gen_dir/ui/webui/resources/tsc/mojo\",\n                      root_build_dir),\n\
      \    ]\n  }\n\n  generate_grd(\"build_grdp\") {\n    grd_prefix = \"geic\"\n\
      \    out_grd = \"$target_gen_dir/resources.grdp\"\n    input_files_base_dir\
      \ = rebase_path(target_gen_dir, root_build_dir)\n    input_files = [ \"geic_mojo_bindings_wrapper.rollup.js\"\
      \ ]\n    deps = [ \":geic_mojo_bindings_rollup\" ]\n  }\n}\n"
  count: 1
