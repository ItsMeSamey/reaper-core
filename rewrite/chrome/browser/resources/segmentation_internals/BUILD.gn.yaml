substitutions:
- description: Exclude dedicated survey HTML and TypeScript from Android WebUI resource generation, preserving ordinary internals
    assets and shared Mojo dependencies
  regex:
    pattern: "  static_files = [\n    \"segmentation_internals.html\",\n    \"segmentation_survey.html\",\n  ]\n  ts_files\
      \ = [\n    \"segmentation_internals.ts\",\n    \"segmentation_survey.ts\",\n  ]\n"
    replace: "  static_files = [ \"segmentation_internals.html\" ]\n  ts_files = [ \"segmentation_internals.ts\" ]\n  if (!is_android)\
      \ {\n    static_files += [ \"segmentation_survey.html\" ]\n    ts_files += [ \"segmentation_survey.ts\" ]\n  }\n"
  count: 1
