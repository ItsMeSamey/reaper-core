# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/resources/actor_overlay/BUILD.gn'
  regex:
    re_pattern: '\ \ grd_prefix\ =\ "actor_overlay"\

      \

      \ \ static_files\ =\ \[\ "actor_overlay\.html"\ \]\

      \

      \ \ ts_files\ =\ \[\

      \ \ \ \ "app\.html\.ts",\

      '
    replace: "  grd_prefix = \"actor_overlay\"\n\n  static_files = [ \"actor_overlay.html\" ]\n  if (is_android) {\n    static_files -= [ \"actor_overlay.html\" ]\n  }\n\n  ts_files = [\n    \"app.html.ts\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/resources/actor_overlay/BUILD.gn'
  regex:
    re_pattern: '\ \ webui_context_type\ =\ "trusted"\

      \

      \ \ mojo_files_deps\ =\ \[\ "//chrome/browser/actor/ui:mojo_bindings_ts__generator"\ \]\

      \ \ mojo_files\ =\

      \ \ \ \ \ \ \[\ "\$root_gen_dir/chrome/browser/actor/ui/actor_overlay\.mojom\-webui\.ts"\ \]\

      \}\

      '
    replace: "  webui_context_type = \"trusted\"\n\n  mojo_files_deps = [ \"//chrome/browser/actor/ui:mojo_bindings_ts__generator\" ]\n  if (is_android) {\n    mojo_files_deps -=\n        [ \"//chrome/browser/actor/ui:mojo_bindings_ts__generator\" ]\n  }\n  mojo_files =\n      [ \"$root_gen_dir/chrome/browser/actor/ui/actor_overlay.mojom-webui.ts\" ]\n  if (is_android) {\n    mojo_files -=\n        [ \"$root_gen_dir/chrome/browser/actor/ui/actor_overlay.mojom-webui.ts\" ]\n  }\n}\n"
- description: Do not instantiate the retired Actor overlay implementation on Android
  regex:
    re_pattern: 'build_webui\("build"\)\ \{\

      \ \ grd_prefix\ =\ "actor_overlay"\

      \

      \ \ static_files\ =\ \[\ "actor_overlay\.html"\ \]\

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ static_files\ \-=\ \[\ "actor_overlay\.html"\ \]\

      \ \ \}\

      \

      \ \ ts_files\ =\ \[\

      \ \ \ \ "app\.html\.ts",\

      \ \ \ \ "app\.ts",\

      \ \ \]\

      \

      \ \ css_files\ =\ \[\ "app\.css"\ \]\

      \

      \ \ ts_composite\ =\ true\

      \ \ ts_deps\ =\ \[\

      \ \ \ \ "//third_party/lit/v3_0:build_ts",\

      \ \ \ \ "//ui/webui/resources/cr_elements:build_ts",\

      \ \ \ \ "//ui/webui/resources/js:build_ts",\

      \ \ \ \ "//ui/webui/resources/mojo:build_ts",\

      \ \ \]\

      \

      \ \ webui_context_type\ =\ "trusted"\

      \

      \ \ mojo_files_deps\ =\ \[\ "//chrome/browser/actor/ui:mojo_bindings_ts__generator"\ \]\

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ mojo_files_deps\ \-=\

      \ \ \ \ \ \ \ \ \[\ "//chrome/browser/actor/ui:mojo_bindings_ts__generator"\ \]\

      \ \ \}\

      \ \ mojo_files\ =\

      \ \ \ \ \ \ \[\ "\$root_gen_dir/chrome/browser/actor/ui/actor_overlay\.mojom\-webui\.ts"\ \]\

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ mojo_files\ \-=\

      \ \ \ \ \ \ \ \ \[\ "\$root_gen_dir/chrome/browser/actor/ui/actor_overlay\.mojom\-webui\.ts"\ \]\

      \ \ \}\

      \}\

      '
    replace: "if (!is_android) {\n  build_webui(\"build\") {\n    grd_prefix = \"actor_overlay\"\n\n \
      \   static_files = [ \"actor_overlay.html\" ]\n    if (is_android) {\n      static_files -= [ \"\
      actor_overlay.html\" ]\n    }\n\n    ts_files = [\n      \"app.html.ts\",\n      \"app.ts\",\n \
      \   ]\n\n    css_files = [ \"app.css\" ]\n\n    ts_composite = true\n    ts_deps = [\n      \"//third_party/lit/v3_0:build_ts\"\
      ,\n      \"//ui/webui/resources/cr_elements:build_ts\",\n      \"//ui/webui/resources/js:build_ts\"\
      ,\n      \"//ui/webui/resources/mojo:build_ts\",\n    ]\n\n    webui_context_type = \"trusted\"\n\
      \n    mojo_files_deps = [ \"//chrome/browser/actor/ui:mojo_bindings_ts__generator\" ]\n    if (is_android)\
      \ {\n      mojo_files_deps -=\n          [ \"//chrome/browser/actor/ui:mojo_bindings_ts__generator\"\
      \ ]\n    }\n    mojo_files =\n        [ \"$root_gen_dir/chrome/browser/actor/ui/actor_overlay.mojom-webui.ts\"\
      \ ]\n    if (is_android) {\n      mojo_files -=\n          [ \"$root_gen_dir/chrome/browser/actor/ui/actor_overlay.mojom-webui.ts\"\
      \ ]\n    }\n  }\n}\n"
  count: 1
