# Android-only responsive controls; merge declarations to avoid duplicate selectors.
substitutions:
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: 'cr\-dialog::part\(dialog\)\ \{\

        \ \ /\*\ CSS\ variables\ are\ set\ by\ the\ JS\.\ \*/\

        \ \ height:\ var\(\-\-dialog\-height\);\

        \ \ opacity:\ var\(\-\-dialog\-opacity,\ 0\);\

        \ \ /\*\ When\ loading,\ it''s\ possible\ for\ an\ size\ update\ to\ follow\ after\ the\

        \ \ \ \ \ initial\ size\ update\.\ The\ debounce\ time\ on\ size\ updates\ is\ 50ms\.\

        '
      replace: "cr-dialog::part(dialog) {\n  /* CSS variables are set by the JS. */\n  height: var(--dialog-height);\n<if expr=\"is_android\">\n  max-width: calc(100vw - 32px);\n</if>\n  opacity: var(--dialog-opacity, 0);\n  /* When loading, it's possible for an size update to follow after the\n     initial size update. The debounce time on size updates is 50ms.\n"
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\ \ height:\ 100%;\

        \ \ min\-height:\ initial;\

        \}\

        '
      replace: "  height: 100%;\n  min-height: initial;\n}\n\n<if expr=\"is_android\">\n#icon-and-name-wrapper span {\n  min-width: 0;\n  overflow-wrap: anywhere;\n}\n</if>\n"
  - description: "Keep the Android options dialog within the viewport before JS resize delivery"
    regex:
      re_pattern: "\\ \\ max\\-width:\\ calc\\(100vw\\ \\-\\ 32px\\);\\\n"
      replace: "  max-height: calc(100vh - 32px);\n  max-width: calc(100vw - 32px);\n"
