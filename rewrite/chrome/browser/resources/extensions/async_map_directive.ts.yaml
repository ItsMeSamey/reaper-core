substitutions:
  - description: "Preserve Android extension card identity and existing focus during unrelated removal (1)"
    count: 1
    regex:
      re_pattern: "import\\ type\\ \\{PartInfo,\\ TemplateResult\\}\\ from\\ 'chrome://resources/lit/v3_0/lit\\.rollup\\.js';\\\n"
      replace: "import type {PartInfo, TemplateResult} from 'chrome://resources/lit/v3_0/lit.rollup.js';\n// <if expr=\"is_android\">\nimport {repeat} from 'chrome://resources/lit/v3_0/lit.rollup.js';\n// </if>\n"
  - description: "Preserve Android extension card identity and existing focus during unrelated removal (2)"
    count: 1
    regex:
      re_pattern: "\\ \\ private\\ timeout_:\\ number\\|null\\ =\\ null;\\\n"
      replace: "  private timeout_: number|null = null;\n  // <if expr=\"is_android\">\n  private keyFn_: ((item: T) => unknown)|undefined;\n  // </if>\n"
  - description: "Preserve Android extension card identity and existing focus during unrelated removal (3)"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ initialCount:\\ number\\)\\ \\{\\\n"
      replace: "      initialCount: number,\n      // <if expr=\"is_android\">\n      keyFn?: (item: T) => unknown,\n      // </if>\n  ) {\n"
  - description: "Preserve Android extension card identity and existing focus during unrelated removal (4)"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ this\\.template\\ =\\ template;\\\n\\ \\ \\ \\ this\\.items\\ =\\ items;\\\n"
      replace: "    this.template = template;\n    // <if expr=\"is_android\">\n    this.keyFn_ = keyFn;\n    // </if>\n    this.items = items;\n"
  - description: "Preserve Android extension card identity and existing focus during unrelated removal (5)"
    count: 1
    regex:
      re_pattern: "\\ \\ private\\ renderItems_\\(\\):\\ TemplateResult\\[\\]\\ \\{\\\n\\ \\ \\ \\ return\\ this\\.renderedItems_\\.map\\(item\\ =>\\ this\\.template\\(item\\)\\);\\\n\\ \\ \\}\\\n"
      replace: "  private renderItems_(): unknown {\n    // <if expr=\"is_android\">\n    if (this.keyFn_) {\n      return repeat(this.renderedItems_, this.keyFn_, this.template);\n    }\n    // </if>\n    return this.renderedItems_.map(item => this.template(item));\n  }\n"
  - description: "Preserve Android extension card identity and existing focus during unrelated removal (6)"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ initialCount:\\ number,\\\n\\ \\ \\ \\ \\ \\ \\):\\ unknown;\\\n"
      replace: "      initialCount: number,\n      // <if expr=\"is_android\">\n      keyFn?: (item: T) => unknown,\n      // </if>\n      ): unknown;\n"
