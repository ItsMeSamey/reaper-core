substitutions:
  - description: "Keep measurement constants out of Android callers"
    regex:
      pattern: "import {UserAction} from './metrics_util.js';\n"
      replace: "// <if expr=\"not is_android\">\nimport {UserAction} from './metrics_util.js';\n// </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "      this.delegate.recordUserAction(UserAction.ALL_TOGGLED_ON);\n"
      replace: "      // <if expr=\"not is_android\">\n      this.delegate.recordUserAction(UserAction.ALL_TOGGLED_ON);\n      // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "      this.delegate.recordUserAction(UserAction.ALL_TOGGLED_OFF);\n"
      replace: "      // <if expr=\"not is_android\">\n      this.delegate.recordUserAction(UserAction.ALL_TOGGLED_OFF);\n      // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "      this.delegate.recordUserAction(UserAction.SPECIFIC_TOGGLED_OFF);\n"
      replace: "      // <if expr=\"not is_android\">\n      this.delegate.recordUserAction(UserAction.SPECIFIC_TOGGLED_OFF);\n      // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    this.delegate.recordUserAction(UserAction.SPECIFIC_TOGGLED_ON);\n"
      replace: "    // <if expr=\"not is_android\">\n    this.delegate.recordUserAction(UserAction.SPECIFIC_TOGGLED_ON);\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    this.delegate.recordUserAction(UserAction.LEARN_MORE);\n"
      replace: "    // <if expr=\"not is_android\">\n    this.delegate.recordUserAction(UserAction.LEARN_MORE);\n    // </if>\n"
    count: 1
