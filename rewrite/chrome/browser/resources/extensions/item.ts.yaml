substitutions:
  - description: "Keep measurement constants out of Android callers"
    regex:
      pattern: "import {UPLOAD_EXTENSION_TO_ACCOUNT_ITEMS_LIST_PAGE_HISTOGRAM_NAME} from './metrics_util.js';\n"
      replace: "// <if expr=\"not is_android\">\nimport {UPLOAD_EXTENSION_TO_ACCOUNT_ITEMS_LIST_PAGE_HISTOGRAM_NAME} from './metrics_util.js';\n// </if>\n"
    count: 1
  - description: "Preserve awaited upload while excluding its optional Android measurement"
    regex:
      pattern: "    const uploaded = await this.delegate.uploadItemToAccount(this.data.id);\n    chrome.metricsPrivate.recordBoolean(\n        UPLOAD_EXTENSION_TO_ACCOUNT_ITEMS_LIST_PAGE_HISTOGRAM_NAME, uploaded);\n"
      replace: "    // <if expr=\"is_android\">\n    await this.delegate.uploadItemToAccount(this.data.id);\n    // </if>\n    // <if expr=\"not is_android\">\n    const uploaded = await this.delegate.uploadItemToAccount(this.data.id);\n    chrome.metricsPrivate.recordBoolean(\n        UPLOAD_EXTENSION_TO_ACCOUNT_ITEMS_LIST_PAGE_HISTOGRAM_NAME, uploaded);\n    // </if>\n"
    count: 1
  - description: "Exclude optional item removal measurement while retaining deletion"
    regex:
      pattern: "    if (this.safetyCheckShowing) {\n      const actionToRecord = this.data.safetyCheckText ?\n          'SafetyCheck.ReviewPanelRemoveClicked' :\n          'SafetyCheck.NonTriggeringExtensionRemoved';\n      chrome.metricsPrivate.recordUserAction(actionToRecord);\n    }\n"
      replace: "    // <if expr=\"not is_android\">\n    if (this.safetyCheckShowing) {\n      const actionToRecord = this.data.safetyCheckText ?\n          'SafetyCheck.ReviewPanelRemoveClicked' :\n          'SafetyCheck.NonTriggeringExtensionRemoved';\n      chrome.metricsPrivate.recordUserAction(actionToRecord);\n    }\n    // </if>\n"
    count: 1
