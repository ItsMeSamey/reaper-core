substitutions:
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Settings.Hosts.AddHostDialogSubmitted');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Settings.Hosts.AddHostDialogSubmitted');\n    // </if>\n"
    count: 1
  - description: "Keep Android restricted-site wildcard matching within a DNS label boundary"
    regex:
      re_pattern: "\\ \\ \\ \\ if\\ \\(matchAllSubdomains\\ \\&\\&\\ !siteRes\\[3\\]!\\.endsWith\\(newHostRes\\[4\\]!\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ return\\ false;\\\n\\ \\ \\ \\ \\}\\\n"
      replace: "    // <if expr=\"is_android\">\n    if (matchAllSubdomains && siteRes[3] !== newHostRes[4] &&\n        !siteRes[3]!.endsWith(`.${newHostRes[4]!}`)) {\n    // </if>\n    // <if expr=\"not is_android\">\n    if (matchAllSubdomains && !siteRes[3]!.endsWith(newHostRes[4]!)) {\n    // </if>\n      return false;\n    }\n"
    count: 1
