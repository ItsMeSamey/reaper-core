substitutions:
- description: Recover Android extension manager initialization with explicit retry and retained successful data
  regex:
    re_pattern: '</if>\

      \ \ </cr\-drawer>\

      `\ :\ ''''\}\

      <div\ id="container"\ class="cr\-scrollable">\

      \ \ <div\ id="scrollableShadow"\ class="cr\-scrollable\-top\-shadow"></div>\

      \ \ <div\ id="left"\ \?hidden="\$\{this\.narrow_\}">\

      '
    replace: "</if>\n  </cr-drawer>\n` : ''}\n<if expr=\"is_android\">\n<div id=\"initializationStatus\" ?hidden=\"${!this.isInitializing_ && !this.initializationError_}\"\n    aria-busy=\"${this.isInitializing_ ? 'true' : 'false'}\">\n  <div role=\"status\" ?hidden=\"${!this.isInitializing_}\">$i18n{managerLoading}</div>\n  <div role=\"alert\" ?hidden=\"${!this.initializationError_}\">$i18n{managerLoadError}</div>\n  <cr-button id=\"initializationRetry\" ?hidden=\"${!this.initializationError_}\"\n      ?disabled=\"${this.isInitializing_}\" @click=\"${this.onInitializationRetryClick_}\">\n    $i18n{loadErrorRetry}\n  </cr-button>\n</div>\n</if>\n<div id=\"container\" class=\"cr-scrollable\">\n  <div id=\"scrollableShadow\" class=\"cr-scrollable-top-shadow\"></div>\n  <div id=\"left\" ?hidden=\"${this.narrow_}\">\n"
