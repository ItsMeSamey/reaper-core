substitutions:
  - description: "Preserve Android shortcut capture ownership 1"
    regex:
      pattern: "// found in the LICENSE file.\n\nimport {html} from '//resources/lit/v3_0/lit.rollup.js';\n\nimport type {KeyboardShortcutsElement} from './keyboard_shortcuts.js';\n\nexport function getHtml(this: KeyboardShortcutsElement) {\n  // clang-format off\n  return html`<!--_html_template_start_--><div id=\"container\">\n  ${this.calculateShownItems_().map(item => html`\n    <div class=\"shortcut-card\">\n      <div class=\"card-title cr-title-text\">\n        <img class=\"icon\" src=\"${item.iconUrl}\" alt=\"\">\n        <span role=\"heading\" aria-level=\"2\">${item.name}</span>\n      </div>\n      <div class=\"card-controls\">\n        ${item.commands.map(command => html`\n          <div class=\"command-entry\">\n            <span class=\"command-name\">${command.description}</span>\n            <div class=\"shortcut-input-container\">\n"
      replace: "// found in the LICENSE file.\n\nimport {html} from '//resources/lit/v3_0/lit.rollup.js';\n// <if expr=\"is_android\">\nimport {repeat} from '//resources/lit/v3_0/lit.rollup.js';\n// </if>\n\nimport type {KeyboardShortcutsElement} from './keyboard_shortcuts.js';\n\nexport function getHtml(this: KeyboardShortcutsElement) {\n  // clang-format off\n  return html`<!--_html_template_start_--><div id=\"container\">\n<if expr=\"is_android\">\n  ${repeat(this.calculateShownItems_(), item => item.id, item => html`\n</if>\n<if expr=\"not is_android\">\n  ${this.calculateShownItems_().map(item => html`\n</if>\n    <div class=\"shortcut-card\">\n      <div class=\"card-title cr-title-text\">\n        <img class=\"icon\" src=\"${item.iconUrl}\" alt=\"\">\n        <span role=\"heading\" aria-level=\"2\">${item.name}</span>\n      </div>\n      <div class=\"card-controls\">\n<if expr=\"is_android\">\n        ${repeat(item.commands, command => command.name, command => html`\n</if>\n<if expr=\"not is_android\">\n        ${item.commands.map(command => html`\n</if>\n          <div class=\"command-entry\">\n            <span class=\"command-name\">${command.description}</span>\n            <div class=\"shortcut-input-container\">\n"
    count: 1
