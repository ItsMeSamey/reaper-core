substitutions:
  - description: "Exclude developer AI promotion text accessor on Android."
    regex:
      pattern: "  protected computeModernWebGuidancePromoText_(): TrustedHTML {\n    return this.i18nAdvanced('sidebarDocsPromo', {\n      tags: ['a'],\n      attrs: ['target'],\n      substitutions: [loadTimeData.getString('modernWebGuidanceURL')],\n    });\n  }\n"
      replace: "// <if expr=\"not is_android\">\n  protected computeModernWebGuidancePromoText_(): TrustedHTML {\n    return this.i18nAdvanced('sidebarDocsPromo', {\n      tags: ['a'],\n      attrs: ['target'],\n      substitutions: [loadTimeData.getString('modernWebGuidanceURL')],\n    });\n  }\n// </if>\n"
    count: 1
  - description: "Retain the Store link callback without Android action recording"
    regex:
      pattern: "  protected onMoreExtensionsClick_(e: Event) {\n    if ((e.target as HTMLElement).tagName === 'A') {\n      chrome.metricsPrivate.recordUserAction('Options_GetMoreExtensions');\n    }\n  }\n"
      replace: "  // <if expr=\"is_android\">\n  protected onMoreExtensionsClick_(_e: Event) {}\n  // </if>\n  // <if expr=\"not is_android\">\n  protected onMoreExtensionsClick_(e: Event) {\n    if ((e.target as HTMLElement).tagName === 'A') {\n      chrome.metricsPrivate.recordUserAction('Options_GetMoreExtensions');\n    }\n  }\n  // </if>\n"
    count: 1
