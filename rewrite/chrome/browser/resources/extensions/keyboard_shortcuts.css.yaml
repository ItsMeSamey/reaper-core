substitutions:
- description: Fit Android extension shortcut controls within narrow cards
  regex:
    re_pattern: '\ \ margin\-inline\-end:\ 20px;\

      \ \ margin\-inline\-start:\ 60px;\

      \}\

      '
    replace: "  margin-inline-end: 20px;\n  margin-inline-start: 60px;\n}\n\n<if expr=\"is_android\">\n.shortcut-card {\n  container-type: inline-size;\n}\n\n@container (max-width: 600px) {\n  .card-controls {\n    margin-inline: 16px;\n  }\n\n  .card-title span,\n  .command-name,\n  .shortcut-input-label,\n  .shortcut-scope-label {\n    min-width: 0;\n    overflow-wrap: anywhere;\n  }\n\n  .icon {\n    flex-shrink: 0;\n  }\n\n  .command-entry {\n    align-items: stretch;\n    flex-direction: column;\n    gap: 12px;\n  }\n\n  .command-name,\n  .shortcut-input-container {\n    margin-inline-end: 0;\n  }\n\n  .shortcut-input-container,\n  .shortcut-scope-container {\n    min-width: 0;\n  }\n\n  .shortcut-scope-container {\n    --md-select-width: 100%;\n  }\n}\n</if>\n"
- description: Keep Android shortcut container declaration in its existing selector
  regex:
    re_pattern: '\ \ border\-radius:\ var\(\-\-cr\-card\-border\-radius\);\

      \ \ box\-shadow:\ var\(\-\-cr\-card\-shadow\);\

      \ \ color:\ var\(\-\-cr\-primary\-text\-color\);\

      \ \ margin:\ 0\ auto\ 16px\ auto;\

      \ \ padding\-bottom:\ 8px;\

      \ \ width:\ var\(\-\-cr\-toolbar\-field\-width\);\

      '
    replace: "  border-radius: var(--cr-card-border-radius);\n  box-shadow: var(--cr-card-shadow);\n  color: var(--cr-primary-text-color);\n<if expr=\"is_android\">\n  container-type: inline-size;\n</if>\n  margin: 0 auto 16px auto;\n  padding-bottom: 8px;\n  width: var(--cr-toolbar-field-width);\n"
- description: Keep Android shortcut container declaration in its existing selector
  regex:
    re_pattern: '\}\

      \

      <if\ expr="is_android">\

      \.shortcut\-card\ \{\

      \ \ container\-type:\ inline\-size;\

      \}\

      \

      @container\ \(max\-width:\ 600px\)\ \{\

      \ \ \.card\-controls\ \{\

      \ \ \ \ margin\-inline:\ 16px;\

      '
    replace: "}\n\n<if expr=\"is_android\">\n@container (max-width: 600px) {\n  .card-controls {\n    margin-inline: 16px;\n"
- description: Keep Android extension shortcut controls responsive within their card
  regex:
    re_pattern: '\}\

      \

      <if\ expr="is_android">\

      @container\ \(max\-width:\ 600px\)\ \{\

      \ \ \.card\-controls\ \{\

      \ \ \ \ margin\-inline:\ 16px;\

      \ \ \}\

      \

      \ \ \.card\-title\ span,\

      \ \ \.command\-name,\

      \ \ \.shortcut\-input\-label,\

      \ \ \.shortcut\-scope\-label\ \{\

      \ \ \ \ min\-width:\ 0;\

      \ \ \ \ overflow\-wrap:\ anywhere;\

      \ \ \}\

      \

      \ \ \.icon\ \{\

      '
    replace: "}\n\n<if expr=\"is_android\">\n.card-title span,\n.command-name,\n.shortcut-input-label,\n.shortcut-scope-label {\n  min-width: 0;\n  overflow-wrap: anywhere;\n}\n\n@container (width > 600px) {\n  .shortcut-input-container,\n  .shortcut-scope-container {\n    /* Long labels must not consume the command's share of the row. */\n    flex-basis: min-content;\n  }\n}\n\n@container (max-width: 600px) {\n  .card-controls {\n    margin-inline: 16px;\n  }\n\n  .icon {\n"
