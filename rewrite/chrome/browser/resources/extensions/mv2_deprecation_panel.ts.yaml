substitutions:
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.Dismissed');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.Dismissed');\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.RemoveExtension');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.RemoveExtension');\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.FindAlternativeForExtension');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.FindAlternativeForExtension');\n    // </if>\n"
    count: 1
