substitutions:
  - description: "Preserve Android extension card identity and existing focus during unrelated removal (1)"
    count: 2
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ `,\\ 6\\)\\}\\\n"
      replace: "        `, 6,\n<if expr=\"is_android\">\n        item => item.id,\n</if>\n        )}\n"
