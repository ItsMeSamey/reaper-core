substitutions:

  - description: "Android724 retry dialog: reject duplicate dispatch; preserve pending-state regression 1"
    regex:
      re_pattern: "\\ \\ \\ \\ this\\.retrying_\\ =\\ true;\\\n"
      replace: "    // <if expr=\"is_android\">\n    // Lit updates the disabled button asynchronously; reject another click now.\n    if (this.retrying_) {\n      return;\n    }\n    // </if>\n    this.retrying_ = true;\n"
    count: 1
  - description: Android import completion preserves keyboard focus ownership
    regex:
      pattern: "import {assert} from 'chrome://resources/js/assert.js';"
      replace: "import {assert} from 'chrome://resources/js/assert.js';\n// <if expr=\"is_android\">\nimport {getDeepActiveElement} from 'chrome://resources/js/util.js';\n// </if>"
    count: 1
  - description: Android import completion preserves keyboard focus ownership
    regex:
      pattern: "    this.retrying_ = true;\n"
      replace: "    // <if expr=\"is_android\">\n    const retryButton =\n        this.shadowRoot.querySelector<CrLitElement>('.action-button')!;\n    const hadFocus = retryButton.matches(':focus-within');\n    // </if>\n    this.retrying_ = true;\n"
    count: 1
  - description: Android import completion preserves keyboard focus ownership
    regex:
      pattern: "            loadError => {\n              this.loadError = loadError;\n              this.retrying_ = false;\n            });"
      replace: "            // <if expr=\"is_android\">\n            async loadError => {\n            // </if>\n            // <if expr=\"not is_android\">\n            loadError => {\n            // </if>\n              this.loadError = loadError;\n              this.retrying_ = false;\n              // <if expr=\"is_android\">\n              await this.updateComplete;\n              await retryButton.updateComplete;\n              const active = getDeepActiveElement();\n              if (hadFocus && this.isConnected &&\n                  this.$.dialog.getNative().open &&\n                  (!active || active === document.body ||\n                   retryButton.matches(':focus-within'))) {\n                retryButton.focus();\n              }\n              // </if>\n            });"
    count: 1
  - description: Android load-error Retry delivers only to its current presentation
    regex:
      pattern: "  protected accessor error_: string|null = null;\n  protected accessor isCodeSectionActive_: boolean|undefined;\n  protected accessor retrying_: boolean = false;\n\n  override willUpdate(changedProperties: PropertyValues<this>) {\n    super.willUpdate(changedProperties);\n"
      replace: "  protected accessor error_: string|null = null;\n  protected accessor isCodeSectionActive_: boolean|undefined;\n  protected accessor retrying_: boolean = false;\n  // <if expr=\"is_android\">\n  private retryGeneration_: number = 0;\n  // </if>\n\n  override willUpdate(changedProperties: PropertyValues<this>) {\n    super.willUpdate(changedProperties);\n"
    count: 1
  - description: Android load-error Retry delivers only to its current presentation
    regex:
      pattern: "  }\n\n  show() {\n    this.$.dialog.showModal();\n  }\n\n"
      replace: "  }\n\n  show() {\n    // <if expr=\"is_android\">\n    // A new error presentation supersedes delivery from an older Retry.\n    // Keep its busy state until that operation actually settles.\n    ++this.retryGeneration_;\n    // </if>\n    this.$.dialog.showModal();\n  }\n\n"
    count: 1
  - description: Android load-error Retry delivers only to its current presentation
    regex:
      pattern: "  }\n\n  close() {\n    this.$.dialog.close();\n  }\n\n"
      replace: "  }\n\n  close() {\n    // <if expr=\"is_android\">\n    ++this.retryGeneration_;\n    // </if>\n    this.$.dialog.close();\n  }\n\n"
    count: 1
  - description: Android load-error Retry delivers only to its current presentation
    regex:
      pattern: "    const retryButton =\n        this.shadowRoot.querySelector<CrLitElement>('.action-button')!;\n    const hadFocus = retryButton.matches(':focus-within');\n    // </if>\n    this.retrying_ = true;\n    assert(this.delegate);\n"
      replace: "    const retryButton =\n        this.shadowRoot.querySelector<CrLitElement>('.action-button')!;\n    const hadFocus = retryButton.matches(':focus-within');\n    const retryGeneration = ++this.retryGeneration_;\n    // </if>\n    this.retrying_ = true;\n    assert(this.delegate);\n"
    count: 1
  - description: Android load-error Retry delivers only to its current presentation
    regex:
      pattern: "                                              this.loadError.retryGuid)\n        .then(\n            () => {\n              this.close();\n            },\n            // <if expr=\"is_android\">\n"
      replace: "                                              this.loadError.retryGuid)\n        .then(\n            () => {\n              // <if expr=\"is_android\">\n              this.retrying_ = false;\n              if (retryGeneration !== this.retryGeneration_) {\n                return;\n              }\n              // </if>\n              this.close();\n            },\n            // <if expr=\"is_android\">\n"
    count: 1
  - description: Android load-error Retry delivers only to its current presentation
    regex:
