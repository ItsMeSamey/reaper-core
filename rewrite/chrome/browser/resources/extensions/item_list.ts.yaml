substitutions:
  - description: "Retain the Store link callback without Android action recording"
    regex:
      pattern: "  protected onNoExtensionsClick_(e: Event) {\n    if ((e.target as HTMLElement).tagName === 'A') {\n      chrome.metricsPrivate.recordUserAction('Options_GetMoreExtensions');\n    }\n  }\n"
      replace: "  // <if expr=\"is_android\">\n  protected onNoExtensionsClick_(_e: Event) {}\n  // </if>\n  // <if expr=\"not is_android\">\n  protected onNoExtensionsClick_(e: Event) {\n    if ((e.target as HTMLElement).tagName === 'A') {\n      chrome.metricsPrivate.recordUserAction('Options_GetMoreExtensions');\n    }\n  }\n  // </if>\n"
    count: 1
