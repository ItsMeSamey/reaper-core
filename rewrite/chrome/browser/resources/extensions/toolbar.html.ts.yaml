# Android-only extensions viewport and responsive controls.
substitutions:
  - description: Adapt the extensions WebUI and existing layout coverage for Android phone widths
    regex:
      re_pattern: '\ \ \ \ \?show\-menu="\$\{this\.narrow\}">\

        \ \ <div\ class="more\-actions">'
      replace: "    ?show-menu=\"${this.narrow}\">\n<if expr=\"is_android\">\n  <picture slot=\"product-logo\">\n    <source media=\"(prefers-color-scheme: dark)\"\n        srcset=\"//resources/images/chrome_logo_dark.svg\">\n    <img srcset=\"images/product_logo.png\" role=\"presentation\">\n  </picture>\n</cr-toolbar>\n</if>\n  <div class=\"more-actions\">"
  - description: Adapt the extensions WebUI and existing layout coverage for Android phone widths
    regex:
      re_pattern: '<if\ expr="is_android">\

        \ \ <picture\ slot="product\-logo">\

        \ \ \ \ <source\ media="\(prefers\-color\-scheme:\ dark\)"\

        \ \ \ \ \ \ \ \ srcset="//resources/images/chrome_logo_dark\.svg">\

        \ \ \ \ <img\ srcset="images/product_logo\.png"\ role="presentation">\

        \ \ </picture>\

        </if>\

        </cr\-toolbar>'
      replace: '<if expr="not is_android">

        </cr-toolbar>

        </if>'
  - description: "Android initial unpacked-import pending state and outcome coverage"
    regex:
      pattern: "    <cr-button ?hidden=\"${!this.canLoadUnpacked_()}\" id=\"loadUnpacked\"\n        @click=\"${this.onLoadUnpackedClick_}\">"
      replace: "    <cr-button ?hidden=\"${!this.canLoadUnpacked_()}\" id=\"loadUnpacked\"\n<if expr=\"is_android\">\n        ?disabled=\"${this.isLoadingUnpacked_}\"\n        aria-busy=\"${this.isLoadingUnpacked_ ? 'true' : 'false'}\"\n</if>\n        @click=\"${this.onLoadUnpackedClick_}\">"
    count: 1
  - description: "Android initial unpacked-import pending state and outcome coverage"
    regex:
      pattern: "    <cr-button id=\"packExtensions\" @click=\"${this.onPackClick_}\">"
      replace: "<if expr=\"is_android\">\n    <div id=\"loadUnpackedProgress\" class=\"spinner\" role=\"progressbar\"\n        aria-label=\"$i18n{toolbarLoadUnpacked}\"\n        ?hidden=\"${!this.isLoadingUnpacked_}\">\n    </div>\n</if>\n    <cr-button id=\"packExtensions\" @click=\"${this.onPackClick_}\">"
    count: 1
  - description: "Name the actual Android Developer mode switch"
    regex:
      pattern: "        aria-labelledby=\"devModeLabel\">\n    </cr-toggle>"
      replace: "        aria-labelledby=\"devModeLabel\">\n<if expr=\"is_android\">\n      <span id=\"devModeA11yLabel\">$i18n{toolbarDevMode}</span>\n</if>\n    </cr-toggle>"
    count: 1
  - description: Use the named native Android Developer mode control (1)
    regex:
      pattern: "    <span id=\"devModeLabel\">$i18n{toolbarDevMode}</span>\n"
      replace: "<if expr=\"is_android\">\n    <label id=\"devModeLabel\" for=\"devMode\">$i18n{toolbarDevMode}</label>\n</if>\n<if expr=\"not is_android\">\n    <span id=\"devModeLabel\">$i18n{toolbarDevMode}</span>\n</if>\n"
    count: 1
  - description: Use the named native Android Developer mode control (2)
    regex:
      pattern: "    <cr-toggle id=\"devMode\" @change=\"${this.onDevModeToggleChange_}\"\n        ?disabled=\"${this.shouldDisableDevMode_()}\" ?checked=\"${this.inDevMode}\"\n        aria-labelledby=\"devModeLabel\">\n<if expr=\"is_android\">\n      <span id=\"devModeA11yLabel\">$i18n{toolbarDevMode}</span>\n</if>\n    </cr-toggle>\n"
      replace: "<if expr=\"is_android\">\n    <input id=\"devMode\" type=\"checkbox\" role=\"switch\"\n        @change=\"${this.onDevModeToggleChange_}\"\n        ?disabled=\"${this.shouldDisableDevMode_()}\" .checked=\"${this.inDevMode}\"\n        aria-labelledby=\"devModeLabel\">\n</if>\n<if expr=\"not is_android\">\n    <cr-toggle id=\"devMode\" @change=\"${this.onDevModeToggleChange_}\"\n        ?disabled=\"${this.shouldDisableDevMode_()}\" ?checked=\"${this.inDevMode}\"\n        aria-labelledby=\"devModeLabel\">\n    </cr-toggle>\n</if>\n"
    count: 1
  - description: Android explicit local CRX picker and ordinary result handling
    regex:
      pattern: "  <div id=\"buttonStrip\">\n    <cr-button ?hidden=\"${!this.canLoadUnpacked_()}\" id=\"loadUnpacked\"\n<if expr=\"is_android\">\n        ?disabled=\"${this.isLoadingUnpacked_}\"\n        aria-busy=\"${this.isLoadingUnpacked_ ? 'true' : 'false'}\"\n</if>\n        @click=\"${this.onLoadUnpackedClick_}\">\n"
      replace: "  <div id=\"buttonStrip\">\n    <cr-button ?hidden=\"${!this.canLoadUnpacked_()}\" id=\"loadUnpacked\"\n<if expr=\"is_android\">\n        ?disabled=\"${this.isLoadingUnpacked_ || this.isInstallingCrx_}\"\n        aria-busy=\"${this.isLoadingUnpacked_ ? 'true' : 'false'}\"\n</if>\n        @click=\"${this.onLoadUnpackedClick_}\">\n"
    count: 1
  - description: Android explicit local CRX picker and ordinary result handling
    regex:
      pattern: "        aria-label=\"$i18n{toolbarLoadUnpacked}\"\n        ?hidden=\"${!this.isLoadingUnpacked_}\">\n    </div>\n</if>\n    <cr-button id=\"packExtensions\" @click=\"${this.onPackClick_}\">\n      $i18n{toolbarPack}\n"
      replace: "        aria-label=\"$i18n{toolbarLoadUnpacked}\"\n        ?hidden=\"${!this.isLoadingUnpacked_}\">\n    </div>\n</if>\n<if expr=\"is_android\">\n    <cr-button ?hidden=\"${this.isChildAccount}\" id=\"installCrx\"\n        ?disabled=\"${this.isInstallingCrx_ || this.isLoadingUnpacked_}\"\n        aria-busy=\"${this.isInstallingCrx_ ? 'true' : 'false'}\"\n        @click=\"${this.onInstallCrxClick_}\">\n      $i18n{toolbarInstallCrx}\n    </cr-button>\n    <div class=\"spinner\" role=\"progressbar\" id=\"installCrxProgress\"\n        aria-label=\"$i18n{toolbarInstallCrx}\"\n        ?hidden=\"${!this.isInstallingCrx_}\"></div>\n    <div role=\"alert\" id=\"installCrxError\"\n        ?hidden=\"${!this.installCrxError_}\">${this.installCrxError_}</div>\n</if>\n    <cr-button id=\"packExtensions\" @click=\"${this.onPackClick_}\">\n      $i18n{toolbarPack}\n"
    count: 1
  - description: Android developer toolbar48px native label targets and touch layout regression
    regex:
      pattern: "  <div class=\"more-actions\">\n<if expr=\"is_android\">\n    <label id=\"devModeLabel\" for=\"devMode\">$i18n{toolbarDevMode}</label>\n</if>\n<if expr=\"not is_android\">\n    <span id=\"devModeLabel\">$i18n{toolbarDevMode}</span>\n</if>\n    <cr-tooltip-icon ?hidden=\"${!this.shouldDisableDevMode_()}\"\n        tooltip-text=\"${this.getTooltipText_()}\" icon-class=\"${this.getIcon_()}\"\n        icon-aria-label=\"${this.getTooltipText_()}\">\n    </cr-tooltip-icon>\n<if expr=\"is_android\">\n    <input id=\"devMode\" type=\"checkbox\" role=\"switch\"\n        @change=\"${this.onDevModeToggleChange_}\"\n        ?disabled=\"${this.shouldDisableDevMode_()}\" .checked=\"${this.inDevMode}\"\n        aria-labelledby=\"devModeLabel\">\n</if>\n<if expr=\"not is_android\">\n    <cr-toggle id=\"devMode\" @change=\"${this.onDevModeToggleChange_}\"\n        ?disabled=\"${this.shouldDisableDevMode_()}\" ?checked=\"${this.inDevMode}\"\n        aria-labelledby=\"devModeLabel\">\n    </cr-toggle>\n</if>\n  </div>\n<if expr=\"not is_android\">\n</cr-toolbar>\n</if>\n${this.showPackDialog_ ? html`\n"
      replace: "  <div class=\"more-actions\">\n<if expr=\"is_android\">\n    <label id=\"devModeLabel\" for=\"devMode\">$i18n{toolbarDevMode}</label>\n</if>\n<if expr=\"not is_android\">\n    <span id=\"devModeLabel\">$i18n{toolbarDevMode}</span>\n</if>\n    <cr-tooltip-icon ?hidden=\"${!this.shouldDisableDevMode_()}\"\n        tooltip-text=\"${this.getTooltipText_()}\" icon-class=\"${this.getIcon_()}\"\n        icon-aria-label=\"${this.getTooltipText_()}\">\n    </cr-tooltip-icon>\n<if expr=\"is_android\">\n    <label id=\"devModeHitTarget\" for=\"devMode\">\n      <input id=\"devMode\" type=\"checkbox\" role=\"switch\"\n          @change=\"${this.onDevModeToggleChange_}\"\n          ?disabled=\"${this.shouldDisableDevMode_()}\" .checked=\"${this.inDevMode}\"\n          aria-labelledby=\"devModeLabel\">\n    </label>\n</if>\n<if expr=\"not is_android\">\n    <cr-toggle id=\"devMode\" @change=\"${this.onDevModeToggleChange_}\"\n        ?disabled=\"${this.shouldDisableDevMode_()}\" ?checked=\"${this.inDevMode}\"\n        aria-labelledby=\"devModeLabel\">\n    </cr-toggle>\n</if>\n  </div>\n<if expr=\"not is_android\">\n</cr-toolbar>\n</if>\n${this.showPackDialog_ ? html`\n"
    count: 1

  - description: Report interrupted Android local import without resuming an invalid sender
    regex:
      re_pattern: '\ \ \ \ \ \ @close="\$\{this\.onPackDialogClose_\}">\

        \ \ </extensions\-pack\-dialog>\

        `\ :\ ''''\}\

        <div\ id="devDrawer"\ \?expanded="\$\{this\.expanded_\}">\

        \ \ <div\ id="buttonStrip">\

        \ \ \ \ <cr\-button\ \?hidden="\$\{!this\.canLoadUnpacked_\(\)\}"\ id="loadUnpacked"\

        '
      replace: "      @close=\"${this.onPackDialogClose_}\">\n  </extensions-pack-dialog>\n` : ''}\n<if expr=\"is_android\">\n<div id=\"importInterrupted\" role=\"alert\"\n    ?hidden=\"${!this.interruptedLocalImport_}\">\n  $i18n{toolbarImportInterrupted}\n</div>\n</if>\n<div id=\"devDrawer\" ?expanded=\"${this.expanded_}\">\n  <div id=\"buttonStrip\">\n    <cr-button ?hidden=\"${!this.canLoadUnpacked_()}\" id=\"loadUnpacked\"\n"
    count: 1
  - description: Android local import recovery keeps alerts visible and clears stale messages on retry
    regex:
      pattern: "    ?hidden=\"${!this.interruptedLocalImport_}\">\n  $i18n{toolbarImportInterrupted}\n</div>\n</if>\n<div id=\"devDrawer\" ?expanded=\"${this.expanded_}\">\n  <div id=\"buttonStrip\">\n"
      replace: "    ?hidden=\"${!this.interruptedLocalImport_}\">\n  $i18n{toolbarImportInterrupted}\n</div>\n<div role=\"alert\" id=\"installCrxError\"\n    ?hidden=\"${!this.installCrxError_}\">${this.installCrxError_}</div>\n</if>\n<div id=\"devDrawer\" ?expanded=\"${this.expanded_}\">\n  <div id=\"buttonStrip\">\n"
    count: 1
  - description: Android local import recovery keeps alerts visible and clears stale messages on retry
    regex:
      pattern: "    <div class=\"spinner\" role=\"progressbar\" id=\"installCrxProgress\"\n        aria-label=\"$i18n{toolbarInstallCrx}\"\n        ?hidden=\"${!this.isInstallingCrx_}\"></div>\n    <div role=\"alert\" id=\"installCrxError\"\n        ?hidden=\"${!this.installCrxError_}\">${this.installCrxError_}</div>\n</if>\n    <cr-button id=\"packExtensions\" @click=\"${this.onPackClick_}\">\n      $i18n{toolbarPack}\n"
      replace: "    <div class=\"spinner\" role=\"progressbar\" id=\"installCrxProgress\"\n        aria-label=\"$i18n{toolbarInstallCrx}\"\n        ?hidden=\"${!this.isInstallingCrx_}\"></div>\n</if>\n    <cr-button id=\"packExtensions\" @click=\"${this.onPackClick_}\">\n      $i18n{toolbarPack}\n"
    count: 1
