substitutions:
  - description: "Retain the delegate interface without Android action recording"
    regex:
      pattern: "  recordUserAction(metricName: string): void {\n    chrome.metricsPrivate.recordUserAction(metricName);\n  }\n"
      replace: "  // <if expr=\"is_android\">\n  recordUserAction(_metricName: string): void {}\n  // </if>\n  // <if expr=\"not is_android\">\n  recordUserAction(metricName: string): void {\n    chrome.metricsPrivate.recordUserAction(metricName);\n  }\n  // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction('Extensions.RemoveExtensionClick');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction('Extensions.RemoveExtensionClick');\n    // </if>\n"
    count: 2
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        isEnabled ? 'Extensions.ExtensionEnabled' :\n                    'Extensions.ExtensionDisabled');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        isEnabled ? 'Extensions.ExtensionEnabled' :\n                    'Extensions.ExtensionDisabled');\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "          chrome.metricsPrivate.recordUserAction('Options_UpdateExtensions');\n"
      replace: "          // <if expr=\"not is_android\">\n          chrome.metricsPrivate.recordUserAction('Options_UpdateExtensions');\n          // </if>\n"
    count: 1
  - description: Android explicit local CRX picker and ordinary result handling
    regex:
      pattern: "    return this.loadUnpackedHelper_({useDraggedPath: true});\n  }\n\n  installDroppedFile() {\n    chrome.developerPrivate.installDroppedFile();\n  }\n"
      replace: "    return this.loadUnpackedHelper_({useDraggedPath: true});\n  }\n\n  // <if expr=\"is_android\">\n  installFromFile(): Promise<boolean> {\n    return chrome.developerPrivate.installFromFile();\n  }\n  // </if>\n\n  installDroppedFile() {\n    chrome.developerPrivate.installDroppedFile();\n  }\n"
    count: 1
