substitutions:
  - description: "Exclude developer promotion sidebar markup on Android."
    regex:
      pattern: "<div class=\"separator\" ?hidden=\"${!this.inDevMode}\"></div>\n${this.inDevMode ? html`\n  <div class=\"cr-nav-menu-item\" id=\"moreExtensions\">\n    <span id=\"promo-message-text\" class=\"cr-secondary-text\"\n        .innerHTML=\"${this.computeModernWebGuidancePromoText_()}\">\n    </span>\n  </div>\n` : ''}\n"
      replace: "<if expr=\"not is_android\">\n<div class=\"separator\" ?hidden=\"${!this.inDevMode}\"></div>\n${this.inDevMode ? html`\n  <div class=\"cr-nav-menu-item\" id=\"moreExtensions\">\n    <span id=\"promo-message-text\" class=\"cr-secondary-text\"\n        .innerHTML=\"${this.computeModernWebGuidancePromoText_()}\">\n    </span>\n  </div>\n` : ''}\n</if>\n"
    count: 1
