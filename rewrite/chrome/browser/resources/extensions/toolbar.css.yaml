# Android-only responsive controls; merge declarations to avoid duplicate selectors.
substitutions:
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\ \ \ \ \ \ var\(\-\-cr\-button\-height\)\);\

        \ \ \-\-drawer\-transition:\ 0\.3s\ cubic\-bezier\(\.25,\ \.1,\ \.25,\ 1\);\

        \ \ \-\-padding\-top\-bottom:\ 10px;\

        \}\

        \

        cr\-tooltip\-icon\ \{\

        '
      replace: "      var(--cr-button-height));\n  --drawer-transition: 0.3s cubic-bezier(.25, .1, .25, 1);\n  --padding-top-bottom: 10px;\n<if expr=\"is_android\">\n  display: block;\n</if>\n}\n\ncr-tooltip-icon {\n"
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\#devDrawer\ \{\

        \ \ background:\ \#fff;\

        \ \ border\-bottom:\ 1px\ solid\ var\(\-\-google\-grey\-300\);\

        \ \ height:\ 0;\

        \ \ overflow\-x:\ hidden;\

        \ \ overflow\-y:\ auto;\

        \ \ position:\ relative;\

        \ \ transition:\ height\ var\(\-\-drawer\-transition\);\

        \}\

        \

        @media\ \(prefers\-color\-scheme:\ dark\)\ \{\

        '
      replace: "#devDrawer {\n  background: #fff;\n  border-bottom: 1px solid var(--google-grey-300);\n<if expr=\"not is_android\">\n  height: 0;\n</if>\n<if expr=\"is_android\">\n  height: auto;\n</if>\n  overflow-x: hidden;\n  overflow-y: auto;\n  position: relative;\n<if expr=\"not is_android\">\n  transition: height var(--drawer-transition);\n</if>\n<if expr=\"is_android\">\n  transition: none;\n</if>\n}\n\n@media (prefers-color-scheme: dark) {\n"
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\}\

        \

        \#devDrawer\[expanded\]\ \{\

        \ \ height:\ calc\(var\(\-\-button\-row\-height\)\ \+\ var\(\-\-border\-bottom\-height\)\);\

        \}\

        \

        \#buttonStrip\ \{\

        \ \ margin\-inline\-end:\ auto;\

        \ \ margin\-inline\-start:\ 24px;\

        \ \ padding:\ var\(\-\-padding\-top\-bottom\)\ 0;\

        \ \ position:\ absolute;\

        \ \ top:\ calc\(var\(\-\-button\-row\-height\)\ \*\ \-1\);\

        \ \ transition:\ top\ var\(\-\-drawer\-transition\);\

        \ \ /\*\ Prevent\ selection\ of\ the\ blank\ space\ between\ buttons\.\ \*/\

        \ \ user\-select:\ none;\

        \ \ width:\ 100%;\

        \}\

        \

        \#buttonStrip\ cr\-button\ \{\

        \ \ margin\-inline\-end:\ 16px;\

        \}\

        \

        \.more\-actions\ \{\

        \ \ align\-items:\ center;\

        \ \ display:\ flex;\

        \ \ justify\-content:\ flex\-end;\

        \ \ white\-space:\ nowrap;\

        \}\

        \

        \.more\-actions\ span\ \{\

        \ \ margin\-inline\-end:\ 16px;\

        \}\

        \

        cr\-toolbar\ \{\

        \ \ \-\-cr\-toolbar\-center\-basis:\ 680px;\

        \ \ \-\-cr\-toolbar\-field\-max\-width:\ var\(\-\-cr\-toolbar\-center\-basis\);\

        \ \ \-\-cr\-toolbar\-field\-width:\ 100%;\

        \ \ \-\-cr\-toolbar\-header\-white\-space:\ nowrap;\

        \}\

        \

        cr\-toolbar\[narrow\]\ picture\[slot=''product\-logo''\]\ \{\

        '
      replace: "}\n\n#devDrawer[expanded] {\n<if expr=\"not is_android\">\n  height: calc(var(--button-row-height) + var(--border-bottom-height));\n</if>\n<if expr=\"is_android\">\n  height: auto;\n</if>\n}\n\n#buttonStrip {\n<if expr=\"is_android\">\n  box-sizing: border-box;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n</if>\n<if expr=\"not is_android\">\n  margin-inline-end: auto;\n  margin-inline-start: 24px;\n  padding: var(--padding-top-bottom) 0;\n  position: absolute;\n</if>\n<if expr=\"is_android\">\n  margin-inline: 0;\n  padding: var(--padding-top-bottom) 16px;\n  position: static;\n</if>\n  top: calc(var(--button-row-height) * -1);\n<if expr=\"not is_android\">\n  transition: top var(--drawer-transition);\n</if>\n<if expr=\"is_android\">\n  transition: none;\n</if>\n  /* Prevent selection of the blank space between buttons. */\n  user-select: none;\n<if expr=\"not is_android\">\n  width: 100%;\n</if>\n<if expr=\"is_android\">\n  width: auto;\n</if>\n}\n\n#buttonStrip cr-button {\n<if expr=\"not is_android\">\n  margin-inline-end: 16px;\n</if>\n<if expr=\"is_android\">\n  height: auto;\n  line-height: 1.4;\n  margin-inline-end: 0;\n  max-width: 100%;\n  min-height: var(--cr-button-height);\n  overflow-wrap: anywhere;\n  white-space: normal;\n</if>\n}\n\n.more-actions {\n  align-items: center;\n  display: flex;\n  justify-content: flex-end;\n<if expr=\"not is_android\">\n  white-space: nowrap;\n</if>\n<if expr=\"is_android\">\n  padding: 8px 20px;\n  white-space: normal;\n</if>\n}\n\n.more-actions span {\n  margin-inline-end: 16px;\n<if expr=\"is_android\">\n  overflow-wrap: anywhere;\n</if>\n}\n\ncr-toolbar {\n  --cr-toolbar-center-basis: 680px;\n  --cr-toolbar-field-max-width: var(--cr-toolbar-center-basis);\n  --cr-toolbar-field-width: 100%;\n<if expr=\"not is_android\">\n  --cr-toolbar-header-white-space: nowrap;\n</if>\n<if expr=\"is_android\">\n  --cr-toolbar-header-white-space: normal;\n</if>\n}\n\ncr-toolbar[narrow] picture[slot='product-logo'] {\n"
  - description: "Android initial unpacked-import pending state and outcome coverage"
    regex:
      pattern: " * #include=cr-hidden-style-lit"
      replace: "<if expr=\"is_android\">\n * #import=chrome://resources/cr_elements/cr_spinner_style_lit.css.js\n * #include=cr-hidden-style-lit cr-spinner-style-lit\n</if>\n<if expr=\"not is_android\">\n * #include=cr-hidden-style-lit\n</if>"
    count: 1
  - description: "Android initial unpacked-import pending state and outcome coverage"
    regex:
      pattern: "\n.more-actions {\n"
      replace: "\n<if expr=\"is_android\">\n#loadUnpackedProgress {\n  align-self: center;\n  flex: none;\n}\n</if>\n\n.more-actions {\n"
    count: 1
  - description: "Name the actual Android Developer mode switch"
    regex:
      pattern: "#loadUnpackedProgress {\n  align-self: center;\n  flex: none;\n}\n</if>"
      replace: "#loadUnpackedProgress {\n  align-self: center;\n  flex: none;\n}\n\n/* Leo names its inner switch from the default slot inside its label. */\n#devModeA11yLabel {\n  clip-path: inset(50%);\n  height: 1px;\n  margin: 0;\n  overflow: hidden;\n  position: absolute;\n  white-space: nowrap;\n  width: 1px;\n}\n</if>"
    count: 1
  - description: Use the named native Android Developer mode control (1)
    regex:
      pattern: "/* Leo names its inner switch from the default slot inside its label. */\n#devModeA11yLabel {\n  clip-path: inset(50%);\n  height: 1px;\n  margin: 0;\n  overflow: hidden;\n  position: absolute;\n  white-space: nowrap;\n  width: 1px;\n}\n"
      replace: "#devModeLabel {\n  margin-inline-end: 16px;\n  overflow-wrap: anywhere;\n}\n\n/* Keep the native input and its localized label in the same shadow tree. */\n#devMode {\n  appearance: none;\n  background: var(--leo-color-schemes-outline-variant);\n  border: 0;\n  border-radius: 12px;\n  cursor: pointer;\n  flex: none;\n  height: 24px;\n  margin: 0;\n  position: relative;\n  width: 40px;\n}\n\n#devMode::before {\n  background: var(--leo-color-white);\n  border-radius: 50%;\n  content: '';\n  height: 16px;\n  inset-block-start: 4px;\n  inset-inline-start: 4px;\n  position: absolute;\n  width: 16px;\n}\n\n#devMode:checked {\n  background: var(--leo-color-schemes-primary);\n}\n\n#devMode:checked::before {\n  background: var(--leo-color-schemes-on-primary);\n  inset-inline-start: 20px;\n}\n\n#devMode:disabled {\n  cursor: default;\n  opacity: 0.5;\n}\n\n#devMode:focus-visible {\n  outline: 2px solid var(--leo-color-schemes-primary);\n  outline-offset: 2px;\n}\n\n@media (forced-colors: active) {\n  #devMode {\n    appearance: auto;\n  }\n\n  #devMode::before {\n    content: none;\n  }\n}\n"
    count: 1
  - description: Android explicit local CRX picker and ordinary result handling
    regex:
      pattern: "}\n\n<if expr=\"is_android\">\n#loadUnpackedProgress {\n  align-self: center;\n  flex: none;\n}\n\n#devModeLabel {\n"
      replace: "}\n\n<if expr=\"is_android\">\n#loadUnpackedProgress,\n#installCrxProgress {\n  align-self: center;\n  flex: none;\n}\n\n#installCrxError {\n  flex-basis: 100%;\n  overflow-wrap: anywhere;\n  user-select: text;\n}\n\n#devModeLabel {\n"
    count: 1
  - description: Android developer toolbar48px native label targets and touch layout regression
    regex:
      pattern: "</if>\n}\n\n#buttonStrip cr-button {\n<if expr=\"not is_android\">\n  margin-inline-end: 16px;\n</if>\n<if expr=\"is_android\">\n  height: auto;\n  line-height: 1.4;\n  margin-inline-end: 0;\n  max-width: 100%;\n  min-height: var(--cr-button-height);\n  overflow-wrap: anywhere;\n  white-space: normal;\n</if>\n}\n\n<if expr=\"is_android\">\n#loadUnpackedProgress,\n#installCrxProgress {\n  align-self: center;\n  flex: none;\n}\n\n#installCrxError {\n  flex-basis: 100%;\n  overflow-wrap: anywhere;\n  user-select: text;\n}\n\n#devModeLabel {\n  margin-inline-end: 16px;\n  overflow-wrap: anywhere;\n}\n\n/* Keep the native input and its localized label in the same shadow tree. */\n#devMode {\n  appearance: none;\n  background: var(--leo-color-schemes-outline-variant);\n  border: 0;\n  border-radius: 12px;\n  cursor: pointer;\n  flex: none;\n  height: 24px;\n  margin: 0;\n"
      replace: "</if>\n}\n\n#buttonStrip cr-button {\n<if expr=\"not is_android\">\n  margin-inline-end: 16px;\n</if>\n<if expr=\"is_android\">\n  height: auto;\n  line-height: 1.4;\n  margin-inline-end: 0;\n  max-width: 100%;\n  min-height: 48px;\n  min-width: 48px;\n  overflow-wrap: anywhere;\n  white-space: normal;\n</if>\n}\n\n<if expr=\"is_android\">\n#loadUnpackedProgress,\n#installCrxProgress {\n  align-self: center;\n  flex: none;\n}\n\n#installCrxError {\n  flex-basis: 100%;\n  overflow-wrap: anywhere;\n  user-select: text;\n}\n\n#devModeLabel {\n  align-items: center;\n  display: flex;\n  margin-inline-end: 16px;\n  min-height: 48px;\n  min-width: 0;\n  overflow-wrap: anywhere;\n}\n\n/* Enlarge the associated label, keeping the native switch visual unchanged. */\n#devModeHitTarget {\n  align-items: center;\n  display: flex;\n  flex: none;\n  justify-content: center;\n  min-height: 48px;\n  min-width: 48px;\n}\n\n/* Keep the native input and its localized label in the same shadow tree. */\n#devMode {\n  appearance: none;\n  background: var(--leo-color-schemes-outline-variant);\n  border: 0;\n  border-radius: 12px;\n  cursor: pointer;\n  flex: none;\n  height: 24px;\n  margin: 0;\n"
    count: 1

  - description: Report interrupted Android local import without resuming an invalid sender
    regex:
      re_pattern: '\#installCrxProgress\ \{\

        \ \ align\-self:\ center;\

        \ \ flex:\ none;\

        \}\

        \

        \#installCrxError\ \{\

        '
      replace: "#installCrxProgress {\n  align-self: center;\n  flex: none;\n}\n\n#importInterrupted {\n  padding: 0 16px 12px;\n  overflow-wrap: anywhere;\n  user-select: text;\n}\n\n#installCrxError {\n"
    count: 1
  - description: Android local import recovery keeps alerts visible and clears stale messages on retry
    regex:
      pattern: "  flex: none;\n}\n\n#importInterrupted {\n  padding: 0 16px 12px;\n  overflow-wrap: anywhere;\n  user-select: text;\n}\n\n#installCrxError {\n  flex-basis: 100%;\n  overflow-wrap: anywhere;\n  user-select: text;\n}\n"
      replace: "  flex: none;\n}\n\n#importInterrupted,\n#installCrxError {\n  padding: 0 16px 12px;\n  overflow-wrap: anywhere;\n  user-select: text;\n}\n"
    count: 1
