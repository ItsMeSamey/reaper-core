# Android-only extensions viewport and responsive controls.
substitutions:
  - description: Adapt the extensions WebUI and existing layout coverage for Android phone widths
    regex:
      re_pattern: '\#a11yAssociation\ \{\

        \ \ height:\ 0;\

        \ \ overflow:\ hidden;\

        \}\

        '
      replace: "#a11yAssociation {\n  height: 0;\n  overflow: hidden;\n}\n\n<if expr=\"is_android\">\n#card,\n#card.review-prompting-enabled,\n#card.dev-mode,\n#card.dev-mode.review-prompting-enabled {\n  height: auto;\n}\n\n#card {\n  min-height: var(--extensions-card-height);\n}\n\n#card.review-prompting-enabled {\n  min-height: 180px;\n}\n\n#card.dev-mode {\n  min-height: 208px;\n}\n\n#card.dev-mode.review-prompting-enabled {\n  min-height: 228px;\n}\n\n#button-strip,\n#button-strip > .flex {\n  flex-wrap: wrap;\n  gap: 8px;\n}\n\n#button-strip {\n  height: auto;\n  min-height: var(--cr-section-min-height);\n  padding-inline: 12px;\n}\n\n#button-strip > .flex {\n  min-width: 0;\n}\n\n#button-strip cr-button {\n  height: auto;\n  line-height: 1.4;\n  margin-inline-start: 0;\n  max-width: 100%;\n  min-height: var(--cr-button-height);\n  min-width: min(5.14em, 100%);\n  overflow-wrap: anywhere;\n  white-space: normal;\n}\n\n#button-strip cr-icon-button {\n  --cr-icon-button-size: 48px;\n}\n</if>\n"
