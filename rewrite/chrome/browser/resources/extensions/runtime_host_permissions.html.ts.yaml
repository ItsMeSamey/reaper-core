substitutions:
- description: Give the Android Edit action its existing localized accessible name
  regex:
    pattern: <cr-icon-button class="icon-edit edit-host"
    replace: <cr-icon-button class="icon-edit edit-host"<if expr="is_android"> aria-label="$i18n{hostPermissionsEdit}"</if>
  count: 1
- description: Give the Android Remove action its existing localized accessible name
  regex:
    pattern: <cr-icon-button class="icon-delete-gray remove-host"
    replace: <cr-icon-button class="icon-delete-gray remove-host"<if expr="is_android"> aria-label="$i18n{remove}"</if>
  count: 1
