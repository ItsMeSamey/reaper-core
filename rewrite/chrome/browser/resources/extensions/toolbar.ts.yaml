  - description: Android Update Now retires only its own toast and restores finite duration
    regex:
      pattern: "  protected onUpdateNowClick_() {\n    // If already updating, do not initiate another update.\n    if (this.isUpdating_) {\n      return;\n    }\n\n    this.isUpdating_ = true;\n\n    const toastManager = getToastManager();\n    // Keep the toast open indefinitely.\n    toastManager.duration = 0;\n    toastManager.show(this.i18n('toolbarUpdatingToast'));\n    this.delegate.updateAllExtensions(this.extensions)\n        .then(\n            () => {\n              toastManager.hide();\n              toastManager.duration = TOAST_DURATION_MS;\n              toastManager.show(this.i18n('toolbarUpdateDone'));\n              this.isUpdating_ = false;\n            },\n            loadError => {\n              this.fire('load-error', loadError);\n              toastManager.hide();\n              this.isUpdating_ = false;\n            });\n  }\n"
      replace: "  // <if expr=\"is_android\">\n  override disconnectedCallback() {\n    super.disconnectedCallback();\n    this.finishAndroidUpdateToast_?.();\n  }\n\n  private async updateAllAndroid_() {\n    if (this.isUpdating_) {\n      return;\n    }\n    this.isUpdating_ = true;\n    const toastManager = getToastManager();\n    toastManager.duration = 0;\n    toastManager.show(this.i18n('toolbarUpdatingToast'));\n    // A comment has no layout or accessible text. Its presence prevents the\n    // single-text-child shortcut in textContent when a newer label is equal.\n    const content = toastManager.$.content;\n    const marker = document.createComment('extension-update');\n    content.appendChild(marker);\n    const finishToast = () => {\n      if (this.finishAndroidUpdateToast_ !== finishToast) {\n        return false;\n      }\n      this.finishAndroidUpdateToast_ = null;\n      if (marker.parentNode !== content) {\n        return false;\n      }\n      marker.remove();\n      toastManager.hide();\n      toastManager.duration = TOAST_DURATION_MS;\n      return true;\n    };\n    this.finishAndroidUpdateToast_ = finishToast;\n    try {\n      await this.delegate.updateAllExtensions(this.extensions);\n      if (this.isConnected && finishToast()) {\n        toastManager.show(this.i18n('toolbarUpdateDone'));\n      }\n    } catch (loadError) {\n      const current = this.finishAndroidUpdateToast_ === finishToast;\n      finishToast();\n      if (current && this.isConnected) {\n        this.fire('load-error', loadError);\n      }\n    } finally {\n      finishToast();\n      this.isUpdating_ = false;\n    }\n  }\n  // </if>\n\n  protected onUpdateNowClick_() {\n    // <if expr=\"is_android\">\n    void this.updateAllAndroid_();\n    // </if>\n    // <if expr=\"not is_android\">\n    // If already updating, do not initiate another update.\n    if (this.isUpdating_) {\n      return;\n    }\n\n    this.isUpdating_ = true;\n\n    const toastManager = getToastManager();\n    // Keep the toast open indefinitely.\n    toastManager.duration = 0;\n    toastManager.show(this.i18n('toolbarUpdatingToast'));\n    this.delegate.updateAllExtensions(this.extensions)\n        .then(\n            () => {\n              toastManager.hide();\n              toastManager.duration = TOAST_DURATION_MS;\n              toastManager.show(this.i18n('toolbarUpdateDone'));\n              this.isUpdating_ = false;\n            },\n            loadError => {\n              this.fire('load-error', loadError);\n              toastManager.hide();\n              this.isUpdating_ = false;\n            });\n    // </if>\n  }\n"
