      replace: "  private onInDevModeChanged_(_current: boolean, previous: boolean) {\n    // <if expr=\"is_android\">\n    // Wrapped controls have an intrinsic height; there is no fixed-height\n    // transition to wait for before removing hidden buttons from focus order.\n    if (previous !== this.inDevMode) {\n      this.$.devDrawer.hidden = !this.inDevMode;\n      this.expanded_ = this.inDevMode;\n    }\n    // </if>\n    // <if expr=\"not is_android\">\n    const drawer = this.$.devDrawer;"
