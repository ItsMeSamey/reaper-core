substitutions:
  - description: "Keep measurement constants out of Android callers"
    regex:
      pattern: "import {SAFETY_HUB_EXTENSION_KEPT_HISTOGRAM_NAME, SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME, SAFETY_HUB_WARNING_REASON_MAX_SIZE, UPLOAD_EXTENSION_TO_ACCOUNT_DETAILS_VIEW_PAGE_HISTOGRAM_NAME} from './metrics_util.js';\n"
      replace: "// <if expr=\"not is_android\">\nimport {SAFETY_HUB_EXTENSION_KEPT_HISTOGRAM_NAME, SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME, SAFETY_HUB_WARNING_REASON_MAX_SIZE, UPLOAD_EXTENSION_TO_ACCOUNT_DETAILS_VIEW_PAGE_HISTOGRAM_NAME} from './metrics_util.js';\n// </if>\n"
    count: 1
  - description: "Keep measurement-only reason conversion imports desktop-only"
    regex:
      pattern: "import {canShowOpenReviewPageLink, computeInspectableViewLabel, convertSafetyCheckReason, createDummyExtensionInfo, EnableControl, getEnableControl, getEnableToggleAriaLabel, getItemSource, getItemSourceString, isEnabled, sortViews, userCanChangeEnablement} from './item_util.js';\n"
      replace: "import {canShowOpenReviewPageLink, computeInspectableViewLabel, createDummyExtensionInfo, EnableControl, getEnableControl, getEnableToggleAriaLabel, getItemSource, getItemSourceString, isEnabled, sortViews, userCanChangeEnablement} from './item_util.js';\n// <if expr=\"not is_android\">\nimport {convertSafetyCheckReason} from './item_util.js';\n// </if>\n"
    count: 1
  - description: "Exclude the optional detail-warning visibility measurement"
    regex:
      pattern: "    const changedPrivateProperties =\n        changedProperties as Map<PropertyKey, unknown>;\n    if (changedPrivateProperties.has('showSafetyCheck_') &&\n        this.showSafetyCheck_) {\n      chrome.metricsPrivate.recordUserAction('SafetyCheck.DetailWarningShown');\n    }\n"
      replace: "    // <if expr=\"not is_android\">\n    const changedPrivateProperties =\n        changedProperties as Map<PropertyKey, unknown>;\n    if (changedPrivateProperties.has('showSafetyCheck_') &&\n        this.showSafetyCheck_) {\n      chrome.metricsPrivate.recordUserAction('SafetyCheck.DetailWarningShown');\n    }\n    // </if>\n"
    count: 1
  - description: "Preserve awaited upload while excluding its optional Android measurement"
    regex:
      pattern: "    const uploaded = await this.delegate.uploadItemToAccount(this.data.id);\n    chrome.metricsPrivate.recordBoolean(\n        UPLOAD_EXTENSION_TO_ACCOUNT_DETAILS_VIEW_PAGE_HISTOGRAM_NAME, uploaded);\n"
      replace: "    // <if expr=\"is_android\">\n    await this.delegate.uploadItemToAccount(this.data.id);\n    // </if>\n    // <if expr=\"not is_android\">\n    const uploaded = await this.delegate.uploadItemToAccount(this.data.id);\n    chrome.metricsPrivate.recordBoolean(\n        UPLOAD_EXTENSION_TO_ACCOUNT_DETAILS_VIEW_PAGE_HISTOGRAM_NAME, uploaded);\n    // </if>\n"
    count: 1
  - description: "Exclude optional detail remove measurements while retaining its delegate"
    regex:
      pattern: "    if (this.showSafetyCheck_) {\n      chrome.metricsPrivate.recordUserAction('SafetyCheck.DetailRemoveClicked');\n      chrome.metricsPrivate.recordEnumerationValue(\n          SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME,\n          convertSafetyCheckReason(this.data.safetyCheckWarningReason),\n          SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n    }\n"
      replace: "    // <if expr=\"not is_android\">\n    if (this.showSafetyCheck_) {\n      chrome.metricsPrivate.recordUserAction('SafetyCheck.DetailRemoveClicked');\n      chrome.metricsPrivate.recordEnumerationValue(\n          SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME,\n          convertSafetyCheckReason(this.data.safetyCheckWarningReason),\n          SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n    }\n    // </if>\n"
    count: 1
  - description: "Exclude optional detail keep measurements while retaining its delegate"
    regex:
      pattern: "    if (this.showSafetyCheck_) {\n      chrome.metricsPrivate.recordUserAction('SafetyCheck.DetailKeepClicked');\n      chrome.metricsPrivate.recordEnumerationValue(\n          SAFETY_HUB_EXTENSION_KEPT_HISTOGRAM_NAME,\n          convertSafetyCheckReason(this.data.safetyCheckWarningReason),\n          SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n    }\n"
      replace: "    // <if expr=\"not is_android\">\n    if (this.showSafetyCheck_) {\n      chrome.metricsPrivate.recordUserAction('SafetyCheck.DetailKeepClicked');\n      chrome.metricsPrivate.recordEnumerationValue(\n          SAFETY_HUB_EXTENSION_KEPT_HISTOGRAM_NAME,\n          convertSafetyCheckReason(this.data.safetyCheckWarningReason),\n          SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n    }\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.RemoveExtension.DetailPage');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.RemoveExtension.DetailPage');\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.FindAlternativeForExtension.DetailPage');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        'Extensions.Mv2Deprecation.Unsupported.FindAlternativeForExtension.DetailPage');\n    // </if>\n"
    count: 1
  - description: Track the current Android detail-size request without changing desktop output.
    regex:
      pattern: '  protected accessor size_: string = '''';

        '
      replace: "  // <if expr=\"is_android\">\n  private sizeRequestId_: number = 0;\n  // </if>\n  protected accessor size_:\
        \ string = '';\n"
    count: 1
  - description: Ignore superseded Android size replies while retaining the loading reset and current reply.
    regex:
      pattern: "  private onItemIdChanged_() {\n    // Clear the size, since this view is reused, such that no obsolete size\n\
        \    // is displayed.:\n    this.size_ = '';\n    this.delegate.getExtensionSize(this.data.id).then(size => {\n    \
        \  this.size_ = size;\n    });\n  }\n"
      replace: "  private onItemIdChanged_() {\n    // <if expr=\"is_android\">\n    const requestId = ++this.sizeRequestId_;\n\
        \    // </if>\n    // Clear the size, since this view is reused, such that no obsolete size\n    // is displayed.:\n\
        \    this.size_ = '';\n    this.delegate.getExtensionSize(this.data.id).then(size => {\n      // <if expr=\"is_android\"\
        >\n      if (requestId !== this.sizeRequestId_) {\n        return;\n      }\n      // </if>\n      this.size_ = size;\n\
        \    });\n  }\n"
    count: 1
