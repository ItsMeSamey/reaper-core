# Android-only responsive controls; merge declarations to avoid duplicate selectors.
substitutions:
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\ \ \-\-extensions\-card\-height:\ 160px;\

        \ \ \-\-separator\-gap:\ 9px;\

        \ \ \-\-sidebar\-width:\ 256px;\

        \ \ \-\-cr\-toolbar\-field\-width:\ 680px;\

        \ \ \-\-paper\-grey\-300:\ \#e0e0e0;\

        \ \ \-\-panel\-icon\-color:\ var\(\-\-google\-grey\-700\);\

        \}\

        '
      replace: "  --extensions-card-height: 160px;\n  --separator-gap: 9px;\n  --sidebar-width: 256px;\n<if expr=\"not is_android\">\n  --cr-toolbar-field-width: 680px;\n</if>\n<if expr=\"is_android\">\n  --cr-toolbar-field-width: min(680px, 100%);\n  --cr-dialog-width: min(512px, calc(100vw - 32px));\n  --cr-button-height: 48px;\n</if>\n  --paper-grey-300: #e0e0e0;\n  --panel-icon-color: var(--google-grey-700);\n}\n"
