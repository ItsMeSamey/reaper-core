substitutions:
  - description: "Scope Android user-site settings listener and initial snapshot to current connected delegate"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ override\\ firstUpdated\\(changedProperties:\\ PropertyValues<this>\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ super\\.firstUpdated\\(changedProperties\\);\\\n\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(this\\.enableEnhancedSiteControls\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ this\\.delegate\\.getUserSiteSettings\\(\\)\\.then\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ this\\.onUserSiteSettingsChanged_\\.bind\\(this\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ this\\.delegate\\.getUserSiteSettingsChangedTarget\\(\\)\\.addListener\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ this\\.onUserSiteSettingsChanged_\\.bind\\(this\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n"
      replace: "        // <if expr=\"is_android\">\n        private settingsOwner_: {\n          delegate: ItemDelegate&SiteSettingsDelegate,\n          event: ChromeEvent<\n              (settings: chrome.developerPrivate.UserSiteSettings) => void>,\n          listener: (settings: chrome.developerPrivate.UserSiteSettings) => void,\n        }|null = null;\n        private settingsGeneration_: number = 0;\n\n        override connectedCallback() {\n          super.connectedCallback();\n          // CrLitElement completes its initial render in the superclass.\n          this.updateSettingsOwner_();\n        }\n\n        override updated(changedProperties: PropertyValues<this>) {\n          super.updated(changedProperties);\n          if (changedProperties.has('delegate') ||\n              changedProperties.has('enableEnhancedSiteControls')) {\n            this.updateSettingsOwner_();\n          }\n        }\n\n        override disconnectedCallback() {\n          this.retireSettingsOwner_();\n          super.disconnectedCallback();\n        }\n\n        private retireSettingsOwner_() {\n          ++this.settingsGeneration_;\n          const owner = this.settingsOwner_;\n          this.settingsOwner_ = null;\n          owner?.event.removeListener(owner.listener);\n        }\n\n        private updateSettingsOwner_() {\n          if (this.isConnected && this.enableEnhancedSiteControls &&\n              this.settingsOwner_?.delegate === this.delegate) {\n            return;\n          }\n          this.retireSettingsOwner_();\n          if (!this.isConnected || !this.enableEnhancedSiteControls) {\n            return;\n          }\n\n          const delegate = this.delegate;\n          const generation = this.settingsGeneration_;\n          const event = delegate.getUserSiteSettingsChangedTarget();\n          const isCurrent = () => this.isConnected &&\n              this.enableEnhancedSiteControls &&\n              generation === this.settingsGeneration_ &&\n              delegate === this.delegate;\n          let receivedChange = false;\n          const listener =\n              (settings: chrome.developerPrivate.UserSiteSettings) => {\n                if (isCurrent()) {\n                  receivedChange = true;\n                  this.onUserSiteSettingsChanged_(settings);\n                }\n              };\n          this.settingsOwner_ = {delegate, event, listener};\n          event.addListener(listener);\n          delegate.getUserSiteSettings().then(settings => {\n            // A change event is a complete settings snapshot. Keep it if it\n            // arrived while the initial request was still pending.\n            if (!receivedChange && isCurrent()) {\n              this.onUserSiteSettingsChanged_(settings);\n            }\n          });\n        }\n        // </if>\n        // <if expr=\"not is_android\">\n        override firstUpdated(changedProperties: PropertyValues<this>) {\n          super.firstUpdated(changedProperties);\n\n          if (this.enableEnhancedSiteControls) {\n            this.delegate.getUserSiteSettings().then(\n                this.onUserSiteSettingsChanged_.bind(this));\n            this.delegate.getUserSiteSettingsChangedTarget().addListener(\n                this.onUserSiteSettingsChanged_.bind(this));\n          }\n        }\n        // </if>\n"
    count: 1
