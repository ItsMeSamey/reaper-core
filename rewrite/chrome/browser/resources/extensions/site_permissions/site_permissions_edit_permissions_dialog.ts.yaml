substitutions:
- description: Wait for Android site-permission extension metadata before displaying a matching ID
  regex:
    re_pattern: '\

      \ \ \ \ const\ extensionSiteAccessData:\ ExtensionSiteAccessInfo\[\]\ =\ \[\];\

      \ \ \ \ matchingExtensionsInfo\.forEach\(\(\{id,\ siteAccess,\ canRequestAllSites\}\)\ =>\ \{\

      \ \ \ \ \ \ assert\(this\.extensionsIdToInfo_\.has\(id\)\);\

      \ \ \ \ \ \ const\ \{name,\ iconUrl\}\ =\ this\.extensionsIdToInfo_\.get\(id\)!;\

      \ \ \ \ \ \ const\ addedByPolicy\ =\ getItemSource\(this\.extensionsIdToInfo_\.get\(id\)!\)\ ===\

      '
    replace: "\n    const extensionSiteAccessData: ExtensionSiteAccessInfo[] = [];\n    matchingExtensionsInfo.forEach(({id, siteAccess, canRequestAllSites}) => {\n      // <if expr=\"is_android\">\n      // Matching IDs can arrive before installation metadata finishes loading\n      // its icon. The extensions update will refresh this list when it arrives.\n      if (!this.extensionsIdToInfo_.has(id)) {\n        return;\n      }\n      // </if>\n      assert(this.extensionsIdToInfo_.has(id));\n      const {name, iconUrl} = this.extensionsIdToInfo_.get(id)!;\n      const addedByPolicy = getItemSource(this.extensionsIdToInfo_.get(id)!) ===\n"
