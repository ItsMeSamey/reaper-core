{
  "substitutions": [
    {
      "count": 1,
      "description": "Identify each Android extension site-access selector by its visible extension name",
      "regex": {
        "pattern": "            <select class=\"extension-host-access md-select\"",
        "replace": "            <select class=\"extension-host-access md-select\"<if expr=\"is_android\"> aria-label=\"${item.name}\"</if>"
      }
    }
  ]
}
