substitutions:
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction('Options_ExtensionCommands');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction('Options_ExtensionCommands');\n    // </if>\n"
    count: 1
  - description: "Preserve Android shortcut capture ownership 1"
    regex:
      pattern: "// found in the LICENSE file.\n\nimport 'chrome://resources/cr_components/cr_shortcut_input/cr_shortcut_input.js';\n\nimport {I18nMixinLit} from 'chrome://resources/cr_elements/i18n_mixin_lit.js';\nimport {loadTimeData} from 'chrome://resources/js/load_time_data.js';\n"
      replace: "// found in the LICENSE file.\n\nimport 'chrome://resources/cr_components/cr_shortcut_input/cr_shortcut_input.js';\n// <if expr=\"is_android\">\nimport type {CrShortcutInputElement} from 'chrome://resources/cr_components/cr_shortcut_input/cr_shortcut_input.js';\nimport type {PropertyValues} from 'chrome://resources/lit/v3_0/lit.rollup.js';\n// </if>\n\nimport {I18nMixinLit} from 'chrome://resources/cr_elements/i18n_mixin_lit.js';\nimport {loadTimeData} from 'chrome://resources/js/load_time_data.js';\n"
    count: 1
  - description: "Preserve Android shortcut capture ownership 2"
    regex:
      pattern: "  protected accessor showGlobalScopeOption_: boolean =\n      loadTimeData.getBoolean('enableGlobalScopedShortcuts');\n\n  override firstUpdated() {\n    this.addEventListener('view-enter-start', this.onViewEnter_);\n  }\n\n  protected onInputCaptureChange_(event: CustomEvent<boolean>) {\n    this.delegate.setShortcutHandlingSuspended(event.detail);\n  }\n\n  protected onShortcutUpdated_(\n"
      replace: "  protected accessor showGlobalScopeOption_: boolean =\n      loadTimeData.getBoolean('enableGlobalScopedShortcuts');\n\n  // <if expr=\"is_android\">\n  private captureOwner_: {\n    input: CrShortcutInputElement,\n    delegate: KeyboardShortcutDelegate,\n  }|null = null;\n  private captureAllowed_: boolean = true;\n\n  // </if>\n  override firstUpdated() {\n    this.addEventListener('view-enter-start', this.onViewEnter_);\n    // <if expr=\"is_android\">\n    this.addEventListener('view-exit-start', () => {\n      this.captureAllowed_ = false;\n      this.cancelShortcutCaptures_();\n    });\n    // </if>\n  }\n  // <if expr=\"is_android\">\n\n  override disconnectedCallback() {\n    this.cancelShortcutCaptures_();\n    super.disconnectedCallback();\n  }\n\n  override updated(changedProperties: PropertyValues<this>) {\n    super.updated(changedProperties);\n    if (changedProperties.has('delegate')) {\n      this.cancelShortcutCaptures_();\n      return;\n    }\n    const owner = this.captureOwner_;\n    if (owner && (!owner.input.isConnected ||\n                  !this.shadowRoot.contains(owner.input) ||\n                  owner.input.inputDisabled)) {\n      this.releaseCapture_();\n    }\n  }\n\n  private releaseCapture_(nextDelegate?: KeyboardShortcutDelegate) {\n    const owner = this.captureOwner_;\n    this.captureOwner_ = null;\n    if (owner) {\n      owner.input.cancelCapture();\n      // Moving directly to another editor must keep its delegate suspended.\n      if (owner.delegate !== nextDelegate) {\n        owner.delegate.setShortcutHandlingSuspended(false);\n      }\n    }\n  }\n\n  private cancelShortcutCaptures_() {\n    this.releaseCapture_();\n    // A start event can still be awaiting the child's updateComplete.\n    this.shadowRoot.querySelectorAll('cr-shortcut-input').forEach(input => {\n      input.cancelCapture();\n    });\n  }\n  // </if>\n\n  protected onInputCaptureChange_(event: CustomEvent<boolean>) {\n    // <if expr=\"is_android\">\n    const input = event.currentTarget as CrShortcutInputElement;\n    if (event.detail) {\n      if (!this.captureAllowed_ || !this.isConnected || !input.isConnected ||\n          !this.shadowRoot.contains(input) || input.inputDisabled ||\n          !input.isCapturing()) {\n        input.cancelCapture();\n        return;\n      }\n      if (this.captureOwner_?.input === input &&\n          this.captureOwner_.delegate === this.delegate) {\n        return;\n      }\n      const nextDelegate =\n          this.captureOwner_?.input !== input ? this.delegate : undefined;\n      this.releaseCapture_(nextDelegate);\n      if (input.isCapturing()) {\n        this.captureOwner_ = {input, delegate: this.delegate};\n        this.delegate.setShortcutHandlingSuspended(true);\n      }\n    } else if (this.captureOwner_?.input === input && !input.isCapturing()) {\n      this.releaseCapture_();\n    }\n    // </if>\n    // <if expr=\"not is_android\">\n    this.delegate.setShortcutHandlingSuspended(event.detail);\n    // </if>\n  }\n\n  protected onShortcutUpdated_(\n"
    count: 1
  - description: "Preserve Android shortcut capture ownership 3"
    regex:
      pattern: "  }\n\n  private onViewEnter_() {\n    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction('Options_ExtensionCommands');\n    // </if>\n"
      replace: "  }\n\n  private onViewEnter_() {\n    // <if expr=\"is_android\">\n    this.captureAllowed_ = true;\n    // </if>\n    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction('Options_ExtensionCommands');\n    // </if>\n"
    count: 1
  - description: "Order the Android shortcut disconnection lifecycle before firstUpdated"
    count: 1
    regex:
      pattern: "  private captureAllowed_: boolean = true;\n\n  // </if>\n  override firstUpdated() {\n    this.addEventListener('view-enter-start', this.onViewEnter_);\n    // <if expr=\"is_android\">\n    this.addEventListener('view-exit-start', () => {\n      this.captureAllowed_ = false;\n      this.cancelShortcutCaptures_();\n    });\n    // </if>\n  }\n  // <if expr=\"is_android\">\n\n  override disconnectedCallback() {\n    this.cancelShortcutCaptures_();\n    super.disconnectedCallback();\n  }\n\n"
      replace: "  private captureAllowed_: boolean = true;\n\n  override disconnectedCallback() {\n    this.cancelShortcutCaptures_();\n    super.disconnectedCallback();\n  }\n\n  // </if>\n  override firstUpdated() {\n    this.addEventListener('view-enter-start', this.onViewEnter_);\n    // <if expr=\"is_android\">\n    this.addEventListener('view-exit-start', () => {\n      this.captureAllowed_ = false;\n      this.cancelShortcutCaptures_();\n    });\n    // </if>\n  }\n  // <if expr=\"is_android\">\n\n"
