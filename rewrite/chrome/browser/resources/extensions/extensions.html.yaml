# Android-only extensions viewport and responsive controls.
substitutions:
  - description: Preserve the existing Brave extensions loading stylesheet
    regex:
      re_pattern: \ \ <script\ type="module"\ src="extensions\.js"></script>
      replace: "<if expr=\"not is_android\">\n  <link rel=\"stylesheet\" href=\"chrome://resources/brave/page_specific/extensions/extensions_loading_shim.css\">\n</if>\n  <script type=\"module\" src=\"extensions.js\"></script>"
  - description: Adapt the extensions WebUI and existing layout coverage for Android phone widths
    regex:
      re_pattern: \ \ <meta\ charset="utf8">
      replace: "  <meta charset=\"utf8\">\n<if expr=\"is_android\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n</if>"
  - description: Fit Android extension dialogs above the on-screen keyboard
    count: 1
    regex:
      pattern: |-
        <if expr="is_android">
          <meta name="viewport" content="width=device-width, initial-scale=1">
        </if>
      replace: |-
        <if expr="is_android">
          <meta name="viewport"
              content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
        </if>
