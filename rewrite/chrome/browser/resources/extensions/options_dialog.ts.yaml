    replace: "  }\n\n  show(data: chrome.developerPrivate.ExtensionInfo) {\n    // <if expr=\"is_android\">\n    this.cancelPendingShow();\n    const request = this.showRequest_;\n    this.showActive_ = true;\n    const nativeDialog = this.shadowRoot\n        ?.querySelector<CrDialogElement>('#dialog')\n        ?.shadowRoot?.querySelector<HTMLDialogElement>('dialog');\n    this.hasOpened_ = nativeDialog?.open ?? false;\n    // </if>\n    this.data_ = data;\n    whenDocumentReady().then(() => {\n      // <if expr=\"is_android\">\n      if (request !== this.showRequest_ || !this.isConnected) {\n        return;\n      }\n      // </if>\n      if (!this.extensionOptions_) {\n        this.extensionOptions_ = document.createElement('ExtensionOptions') as\n            ExtensionOptionsElement;\n      }\n      this.extensionOptions_.extension = this.data_!.id;\n      // <if expr=\"is_android\">\n      this.extensionOptions_.onclose = () => {\n        if (request === this.showRequest_ && this.isConnected) {\n          this.retireGuestCallbacks_();\n          if (this.$.dialog.getNative().open) {\n            this.$.dialog.close();\n          } else {\n            // Closing an unopened native dialog queues no close event. Use the\n            // same boundary so the active route and manager finish once.\n            this.$.dialog.dispatchEvent(new CustomEvent('close', {\n              bubbles: true,\n              composed: true,\n            }));\n          }\n        }\n      };\n      // </if>\n      // <if expr=\"not is_android\">\n      this.extensionOptions_.onclose = () => this.$.dialog.close();\n      // </if>\n\n      this.extensionOptions_.onpreferredsizechanged =\n          (e: {height: number, width: number}) => {\n            // <if expr=\"is_android\">\n            if (request !== this.showRequest_ || !this.isConnected) {\n              return;\n            }\n            // </if>\n            // <if expr=\"is_android\">\n            if (!this.$.dialog.getNative