    replace: "  private preferredSize_: {height: number, width: number}|null = null;\n  private eventTracker_: EventTracker = new EventTracker();\n  private updateDialogSizeTimeout_: number|null = null;\n  // <if expr=\"is_android\">\n  private showRequest_: number = 0;\n  private showActive_: boolean = false;\n  private hasOpened_: boolean = false;\n  // </if>\n\n  get open() {\n    // <if expr=\"is_android\">\n    return this.$.dialog.getNative().open;\n    // </if>\n    // <if expr=\"not is_android\">\n    return this.$.dialog.open;\n    // </if>\n  }\n\n  // <if expr=\"is_android\">\n  /** Retire document-ready and guest callbacks when their route goes away. */\n  cancelPendingShow() {\n    this.retireGuestCallbacks_();\n    this.showActive_ = false;\n  }\n\n  /** Stop guest sizing while retaining ownership of the queued native close. */\n  private retireGuestCallbacks_() {\n    ++this.showRequest_;\n    this.eventTracker_.removeAll();\n    if (this.updateDialogSizeTimeout_ !== null) {\n      clearTimeout(this.updateDialogSizeTimeout_);\n      this.updateDialogSizeTimeout_ = null;\n    }\n    this.preferredSize_ = null;\n    if (this.extensionOptions_) {\n      this.extensionOptions_.onpreferredsizechanged = null;\n    }\n  }\n\n  override disconnectedCallback() {\n    this.cancelPendingShow();\n    super.disconnectedCallback();\n  }\n  // </if>\n\n  /**\n   * Resizes the dialog to the width/height stored in |preferredSize_|, taking\n   * into account the window width/height.\n   */\n  private updateDialogSize_() {\n    // <if expr=\"is_android\">\n    // The viewport can resize before the guest has reported its first size.\n    if (!this.preferredSize_ || !this.$.dialog.getNative().open) {\n      return;\n    }\n    // </if>\n    let headerHeight = this.$.body.offsetTop;\n    if (this.$.body.assignedSlot && this.$.body.assignedSlot.parentElement) {\n      headerHeight = this.$.body.assignedSlot.parentElement.offsetTop;\n"
