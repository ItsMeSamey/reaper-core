# Android-only responsive controls; merge declarations to avoid duplicate selectors.
substitutions:
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\#viewManager\ \{\

        \ \ flex:\ 1\ 1\ var\(\-\-cr\-toolbar\-field\-width\);\

        \ \ height:\ 100%;\

        \ \ position:\ relative;\

        \}\

        \

        '
      replace: "#viewManager {\n  flex: 1 1 var(--cr-toolbar-field-width);\n  height: 100%;\n<if expr=\"is_android\">\n  min-width: 0;\n</if>\n  position: relative;\n}\n\n"
  - description: Recover Android extension manager initialization with explicit retry and retained successful data
    regex:
      re_pattern: '\ \ width:\ 100%;\

        \}\

        \

        '
      replace: "  width: 100%;\n}\n\n\n<if expr=\"is_android\">\n#initializationStatus {\n  align-items: center;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 12px;\n  padding: 16px;\n}\n\n#initializationStatus > div {\n  min-width: 0;\n  overflow-wrap: anywhere;\n}\n</if>\n"
