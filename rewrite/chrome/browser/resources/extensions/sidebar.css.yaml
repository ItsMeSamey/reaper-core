substitutions:
  - description: "Exclude developer promotion sidebar styles on Android."
    regex:
      pattern: "#discover-more-text a,\n#promo-message-text a {\n  color: var(--cr-link-color);\n}\n\n:host-context([webui-refresh-2026]) {\n  #discover-more-text a:focus,\n  #promo-message-text a:focus {\n    border-radius: 2px;\n    outline: solid 2px var(--cr-focus-outline-color);\n  }\n}\n\n#promo-message-text {\n  overflow-wrap: anywhere;\n  hyphens: auto;\n}\n\n"
      replace: "<if expr=\"is_android\">\n#discover-more-text a {\n  color: var(--cr-link-color);\n}\n\n:host-context([webui-refresh-2026]) {\n  #discover-more-text a:focus {\n    border-radius: 2px;\n    outline: solid 2px var(--cr-focus-outline-color);\n  }\n}\n</if>\n<if expr=\"not is_android\">\n#discover-more-text a,\n#promo-message-text a {\n  color: var(--cr-link-color);\n}\n\n:host-context([webui-refresh-2026]) {\n  #discover-more-text a:focus,\n  #promo-message-text a:focus {\n    border-radius: 2px;\n    outline: solid 2px var(--cr-focus-outline-color);\n  }\n}\n\n#promo-message-text {\n  overflow-wrap: anywhere;\n  hyphens: auto;\n}\n\n</if>\n"
    count: 1
