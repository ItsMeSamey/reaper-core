      pattern: "          chrome.metricsPrivate.recordUserAction(\n              'Extensions.Settings.Hosts.OnClickSelected');\n"
      replace: "          // <if expr=\"not is_android\">\n          chrome.metricsPrivate.recordUserAction(\n              'Extensions.Settings.Hosts.OnClickSelected');\n          // </if>\n"
    count: 1
