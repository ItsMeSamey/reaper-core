# Android-only extension reload toast ownership.
substitutions:
  - description: Preserve newer Android reload toast ownership 1
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ toastManager\\.duration\\ =\\ 0;\\\n\\ \\ \\ \\ \\ \\ toastManager\\.show\\(loadTimeData\\.getString\\('itemReloading'\\)\\);\\\n\\\n\\ \\ \\ \\ \\ \\ assert\\(this\\.delegate\\);\\\n\\ \\ \\ \\ \\ \\ assert\\(this\\.data\\);\\\n\\ \\ \\ \\ \\ \\ try\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ await\\ this\\.delegate\\.reloadItem\\(this\\.data\\.id\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ toastManager\\.hide\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ toastManager\\.duration\\ =\\ TOAST_DURATION_MS;\\\n\\ \\ \\ \\ \\ \\ \\ \\ toastManager\\.show\\(loadTimeData\\.getString\\('itemReloaded'\\)\\);\\\n\\ \\ \\ \\ \\ \\ \\}\\ catch\\ \\(loadError\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ toastManager\\.hide\\(\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ throw\\ loadError;\\\n\\ \\ \\ \\ \\ \\ \\}\\ finally\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ this\\.isReloading_\\ =\\ false;\\\n\\ \\ \\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ \\}\\\n"
      replace: "      toastManager.duration = 0;\n      toastManager.show(loadTimeData.getString('itemReloading'));\n\n      // <if expr=\"is_android\">\n      // Match the toolbar's ownership check. A comment also distinguishes a\n      // newer toast with the same label without adding layout or AX text.\n      const content = toastManager.$.content;\n      const marker = document.createComment('extension-reload');\n      content.appendChild(marker);\n      const finishToast = () => {\n        if (marker.parentNode !== content) {\n          return false;\n        }\n        marker.remove();\n        toastManager.hide();\n        toastManager.duration = TOAST_DURATION_MS;\n        return true;\n      };\n      // </if>\n\n      assert(this.delegate);\n      assert(this.data);\n      try {\n        await this.delegate.reloadItem(this.data.id);\n        // <if expr=\"is_android\">\n        if (finishToast()) {\n          toastManager.show(loadTimeData.getString('itemReloaded'));\n        }\n        // </if>\n        // <if expr=\"not is_android\">\n        toastManager.hide();\n        toastManager.duration = TOAST_DURATION_MS;\n        toastManager.show(loadTimeData.getString('itemReloaded'));\n        // </if>\n      } catch (loadError) {\n        // <if expr=\"is_android\">\n        finishToast();\n        // </if>\n        // <if expr=\"not is_android\">\n        toastManager.hide();\n        // </if>\n        throw loadError;\n      } finally {\n        // <if expr=\"is_android\">\n        marker.remove();\n        // </if>\n        this.isReloading_ = false;\n      }\n    }\n"
    count: 1
