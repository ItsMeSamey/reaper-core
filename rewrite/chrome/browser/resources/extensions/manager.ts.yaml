    pattern: "const button = this.shadowRoot.querySelector<HTMLElement>('#initializationRetry')!;\n    const hadFocus = getDeepActiveElement() === button;"
    replace: "const button = this.shadowRoot.querySelector<CrLitElement>('#initializationRetry')!;\n    const hadFocus = button.matches(':focus-within');"
  count: 1
- description: Android initialization retry preserves delegated focus ownership
  regex:
    pattern: "    await this.initializeAndroid_?.();\n    await this.updateComplete;\n    const active = getDeepActiveElement();"
    replace: "    await this.initializeAndroid_?.();\n    await this.updateComplete;\n    // Wait for the wrapped button to forward its enabled state before focus.\n    await button.updateComplete;\n    const active = getDeepActiveElement();"
  count: 1
- description: Android initialization retry preserves delegated focus ownership
  regex:
    pattern: "    if (hadFocus && this.isConnected &&\n        (!active || active === document.body || active === button)) {"
    replace: "    if (hadFocus && this.isConnected &&\n        (!active || active === document.body ||\n         button.matches(':focus-within'))) {"
  count: 1
- description: Preserve newer Android focus during queued options close
  regex:
    pattern: "  protected onOptionsDialogClose_() {\n    this.showOptionsDialog_ = false;\n    this.shadowRoot.querySelector(\n                       'extensions-detail-view')!.focusOptionsButton();\n  }\n"
    replace: "  // <if expr=\"is_android\">\n  protected onOptionsDialogClose_(event: Event) {\n    this.showOptionsDialog_ = false;\n    const details = this.shadowRoot.querySelector('extensions-detail-view')!;\n    const active = getDeepActiveElement();\n    const closingDialog = event.currentTarget;\n    // Native close restores focus before its queued close event. Keep a newer\n    // connected control's focus while retaining the normal Options fallback.\n    if (active && active.isConnected && active !== document.body &&\n        active !== document.documentElement &&\n        !(closingDialog instanceof HTMLElement &&\n          closingDialog.matches(':focus-within')) &&\n        !details.$.extensionsOptions.matches(':focus-within')) {\n      return;\n    }\n    details.focusOptionsButton();\n  }\n  // </if>\n  // <if expr=\"not is_android\">\n  protected onOptionsDialogClose_() {\n    this.showOptionsDialog_ = false;\n    this.shadowRoot.querySelector(\n                       'extensions-detail-view')!.focusOptionsButton();\n  }\n  // </if>\n"
  count: 1
- description: Retire queued Android load-error presentation ownership
  regex:
    pattern: "import {TOAST_DURATION_MS} from './item_util.js';"
    replace: "import {TOAST_DURATION_MS} from './item_util.js';\n// <if expr=\"is_android\">\nimport type {LoadErrorElement} from './load_error.js';\n// </if>"
  count: 1
- description: Retire queued Android load-error presentation ownership
  regex:
    pattern: "  private optionsDialogRequest_: number = 0;"
    replace: "  private optionsDialogRequest_: number = 0;\n  private loadErrorPresentation_: {dialog: LoadErrorElement|null}|null = null;"
  count: 1
- description: Retire queued Android load-error presentation ownership
  regex:
    pattern: "    ++this.optionsDialogRequest_;\n    ++this.narrowFocusRequest_;"
    replace: "    ++this.optionsDialogRequest_;\n    this.loadErrorPresentation_ = null;\n    ++this.narrowFocusRequest_;"
  count: 1
- description: Retire queued Android load-error presentation ownership
  regex:
    pattern: "    this.showLoadErrorDialog_ = true;\n    setTimeout(() => {\n      const dialog = this.shadowRoot.querySelector('extensions-load-error')!;\n      dialog.loadError = e.detail;\n      dialog.show();\n    }, 0);"
    replace: "    // <if expr=\"is_android\">\n    // Detached child reloads can still bubble their asynchronous failure here.\n    if (!this.isConnected) {\n      return;\n    }\n    // </if>\n    this.showLoadErrorDialog_ = true;\n    // <if expr=\"is_android\">\n    // Keep queued presentation ownership separate from an already shown dialog:\n    // its older native close event must not cancel a newer pending error.\n    const request: {dialog: LoadErrorElement|null} = {dialog: null};\n    this.loadErrorPresentation_ = request;\n    setTimeout(async () => {\n      if (!this.isConnected || this.loadErrorPresentation_ !== request) {\n        return;\n      }\n      await this.updateComplete;\n      if (!this.isConnected || this.loadErrorPresentation_ !== request ||\n          !this.showLoadErrorDialog_) {\n        return;\n      }\n      const dialog = this.shadowRoot.querySelector('extensions-load-error');\n      if (!dialog?.isConnected) {\n        return;\n      }\n      await dialog.updateComplete;\n      if (!this.isConnected || this.loadErrorPresentation_ !== request ||\n          !this.showLoadErrorDialog_ || !dialog.isConnected ||\n          dialog !== this.shadowRoot.querySelector('extensions-load-error')) {\n        return;\n      }\n      // Retire the old Retry generation atomically with new error delivery.\n      dialog.loadError = e.detail;\n      request.dialog = dialog;\n      dialog.show();\n    }, 0);\n    // </if>\n    // <if expr=\"not is_android\">\n    setTimeout(() => {\n      const dialog = this.shadowRoot.querySelector('extensions-load-error')!;\n      dialog.loadError = e.detail;\n      dialog.show();\n    }, 0);\n    // </if>"
  count: 1
- description: Retire queued Android load-error presentation ownership
  regex:
    pattern: "  protected onLoadErrorDialogClose_() {\n    this.showLoadErrorDialog_ = false;\n  }"
    replace: "  protected onLoadErrorDialogClose_(\n      // <if expr=\"is_android\">\n      e: Event,\n      // </if>\n      ) {\n    // <if expr=\"is_android\">\n    const dialog = this.loadErrorPresentation_?.dialog;\n    if (!dialog || e.currentTarget !== dialog ||\n        dialog !== this.shadowRoot.querySelector('extensions-load-error') ||\n        dialog.$.dialog.getNative().open) {\n      return;\n    }\n    this.loadErrorPresentation_ = null;\n    // </if>\n    this.showLoadErrorDialog_ = false;\n  }"
  count: 1

- description: Report interrupted Android local import without resuming an invalid sender
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ queries\.push\(Promise\.resolve\(\)\.then\(\(\)\ =>\ service\.getProfileConfiguration\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \.then\(info\ =>\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ onProfileStateChanged\(info\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ profileLoaded\ =\ true;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\)\);\

      \ \ \ \ \ \ \}\

      '
    replace: "        queries.push(Promise.resolve().then(() => service.getProfileConfiguration())\n            .then(info => {\n              onProfileStateChanged(info);\n              if (info.interruptedLocalImport) {\n                this.$.toolbar.showInterruptedLocalImport();\n              }\n              profileLoaded = true;\n            }));\n      }\n"
  count: 1
