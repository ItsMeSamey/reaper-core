substitutions:
- description: Give the Android extension retry spinner an accessible progress role
  regex:
    pattern: "    <div class=\"spinner\" ?hidden=\"${!this.retrying_}\"></div>\n"
    replace: "    <div class=\"spinner\"\n<if expr=\"is_android\">\n        role=\"progressbar\" aria-label=\"$i18n{loadErrorRetry}\"\n</if>\n        ?hidden=\"${!this.retrying_}\"></div>\n"
  count: 1
