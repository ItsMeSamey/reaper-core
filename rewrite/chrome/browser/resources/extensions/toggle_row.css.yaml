substitutions:
- description: Allow Android extension warning rows to pan while retaining switch behavior
  regex:
    pattern: "/* Copyright 2024 The Chromium Authors\n * Use of this source code is governed by a BSD-style license that can be\n * found in the LICENSE file. */\n\n/* #css_wrapper_metadata_start\n * #type=style-lit\n * #import=chrome://resources/cr_elements/cr_shared_style_lit.css.js\n * #include=cr-shared-style-lit\n * #css_wrapper_metadata_end */\n\n:host {\n  align-items: center;\n  display: flex;\n  touch-action: none;\n}\n\ninput {\n  display: none;\n}\n\nlabel {\n  box-sizing: border-box;\n  cursor: pointer;\n  flex: 1;\n}\n\ncr-toggle {\n  display: inline-block;\n}\n\n:host ::slotted(*) {\n  flex: 1;\n  margin-inline-end: 20px;\n}\n"
    replace: "/* Copyright 2024 The Chromium Authors\n * Use of this source code is governed by a BSD-style license that can be\n * found in the LICENSE file. */\n\n/* #css_wrapper_metadata_start\n * #type=style-lit\n * #import=chrome://resources/cr_elements/cr_shared_style_lit.css.js\n * #include=cr-shared-style-lit\n * #css_wrapper_metadata_end */\n\n:host {\n  align-items: center;\n  display: flex;\n<if expr=\"not is_android\">\n  touch-action: none;\n</if>\n<if expr=\"is_android\">\n  /* Warning text and row margins must not trap vertical page scrolling. */\n  touch-action: pan-y;\n</if>\n}\n\ninput {\n  display: none;\n}\n\nlabel {\n  box-sizing: border-box;\n  cursor: pointer;\n  flex: 1;\n}\n\ncr-toggle {\n  display: inline-block;\n<if expr=\"is_android\">\n  /* Keep the switch's existing captured horizontal drag behavior. */\n  touch-action: none;\n</if>\n}\n\n:host ::slotted(*) {\n  flex: 1;\n  margin-inline-end: 20px;\n}\n"
  count: 1
