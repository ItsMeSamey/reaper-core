substitutions:
  - description: "Keep measurement constants out of Android callers"
    regex:
      pattern: "import {SAFETY_HUB_EXTENSION_KEPT_HISTOGRAM_NAME, SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME, SAFETY_HUB_EXTENSION_SHOWN_HISTOGRAM_NAME, SAFETY_HUB_WARNING_REASON_MAX_SIZE} from './metrics_util.js';\n"
      replace: "// <if expr=\"not is_android\">\nimport {SAFETY_HUB_EXTENSION_KEPT_HISTOGRAM_NAME, SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME, SAFETY_HUB_EXTENSION_SHOWN_HISTOGRAM_NAME, SAFETY_HUB_WARNING_REASON_MAX_SIZE} from './metrics_util.js';\n// </if>\n"
    count: 1
  - description: "Keep measurement-only reason conversion imports desktop-only"
    regex:
      pattern: "import {convertSafetyCheckReason} from './item_util.js';\n"
      replace: "// <if expr=\"not is_android\">\nimport {convertSafetyCheckReason} from './item_util.js';\n// </if>\n"
    count: 1
  - description: "Exclude the desktop-only details metric name"
    regex:
      pattern: "const SAFETY_HUB_EXTENSION_THREE_DOT_DETAILS =\n    'SafeBrowsing.ExtensionSafetyHub.ThreeDotDetails';\n"
      replace: "// <if expr=\"not is_android\">\nconst SAFETY_HUB_EXTENSION_THREE_DOT_DETAILS =\n    'SafeBrowsing.ExtensionSafetyHub.ThreeDotDetails';\n// </if>\n"
    count: 1
  - description: "Exclude the optional measurement-only completion flag"
    regex:
      pattern: "  private completionMetricLogged_: boolean = false;\n"
      replace: "  // <if expr=\"not is_android\">\n  private completionMetricLogged_: boolean = false;\n  // </if>\n"
    count: 1
  - description: "Keep completion UI without its optional measurement"
    regex:
      pattern: "      if (!this.completionMetricLogged_) {\n        this.completionMetricLogged_ = true;\n        chrome.metricsPrivate.recordUserAction('SafetyCheck.ReviewCompletion');\n      }\n"
      replace: "      // <if expr=\"not is_android\">\n      if (!this.completionMetricLogged_) {\n        this.completionMetricLogged_ = true;\n        chrome.metricsPrivate.recordUserAction('SafetyCheck.ReviewCompletion');\n      }\n      // </if>\n"
    count: 1
  - description: "Keep unsafe-extension review state without optional visibility recording"
    regex:
      pattern: "      if (!this.shouldShowUnsafeExtensions_) {\n        chrome.metricsPrivate.recordUserAction('SafetyCheck.ReviewPanelShown');\n        for (const extension of this.extensions) {\n          chrome.metricsPrivate.recordEnumerationValue(\n              SAFETY_HUB_EXTENSION_SHOWN_HISTOGRAM_NAME,\n              convertSafetyCheckReason(extension.safetyCheckWarningReason),\n              SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n        }\n      }\n      this.completionMetricLogged_ = false;\n"
      replace: "      // <if expr=\"not is_android\">\n      if (!this.shouldShowUnsafeExtensions_) {\n        chrome.metricsPrivate.recordUserAction('SafetyCheck.ReviewPanelShown');\n        for (const extension of this.extensions) {\n          chrome.metricsPrivate.recordEnumerationValue(\n              SAFETY_HUB_EXTENSION_SHOWN_HISTOGRAM_NAME,\n              convertSafetyCheckReason(extension.safetyCheckWarningReason),\n              SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n        }\n      }\n      this.completionMetricLogged_ = false;\n      // </if>\n"
    count: 1
  - description: "Preserve bulk deletion without its optional measurement loop"
    regex:
      pattern: "      this.extensions.forEach(extension => {\n        chrome.metricsPrivate.recordEnumerationValue(\n            SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME,\n            convertSafetyCheckReason(extension.safetyCheckWarningReason),\n            SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n      });\n"
      replace: "      // <if expr=\"not is_android\">\n      this.extensions.forEach(extension => {\n        chrome.metricsPrivate.recordEnumerationValue(\n            SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME,\n            convertSafetyCheckReason(extension.safetyCheckWarningReason),\n            SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n      });\n      // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordCount(\n        SAFETY_HUB_EXTENSION_THREE_DOT_DETAILS, 1);\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordCount(\n        SAFETY_HUB_EXTENSION_THREE_DOT_DETAILS, 1);\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        'SafetyCheck.ReviewPanelKeepClicked');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        'SafetyCheck.ReviewPanelKeepClicked');\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordEnumerationValue(\n        SAFETY_HUB_EXTENSION_KEPT_HISTOGRAM_NAME,\n        convertSafetyCheckReason(this.lastClickedExtensionTriggerReason_),\n        SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordEnumerationValue(\n        SAFETY_HUB_EXTENSION_KEPT_HISTOGRAM_NAME,\n        convertSafetyCheckReason(this.lastClickedExtensionTriggerReason_),\n        SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        'SafetyCheck.ReviewPanelRemoveClicked');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        'SafetyCheck.ReviewPanelRemoveClicked');\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordEnumerationValue(\n        SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME,\n        convertSafetyCheckReason(item.safetyCheckWarningReason),\n        SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordEnumerationValue(\n        SAFETY_HUB_EXTENSION_REMOVED_HISTOGRAM_NAME,\n        convertSafetyCheckReason(item.safetyCheckWarningReason),\n        SAFETY_HUB_WARNING_REASON_MAX_SIZE);\n    // </if>\n"
    count: 1
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction(\n        'SafetyCheck.ReviewPanelRemoveAllClicked');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction(\n        'SafetyCheck.ReviewPanelRemoveAllClicked');\n    // </if>\n"
    count: 1
