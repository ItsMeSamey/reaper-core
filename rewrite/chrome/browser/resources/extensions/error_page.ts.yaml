substitutions:
  - description: "Exclude optional extension UI recording on Android"
    regex:
      pattern: "    chrome.metricsPrivate.recordUserAction('Options_ViewExtensionErrors');\n"
      replace: "    // <if expr=\"not is_android\">\n    chrome.metricsPrivate.recordUserAction('Options_ViewExtensionErrors');\n    // </if>\n"
    count: 1
  - description: "Android extension error-page UI582 exact reviewed literal 1: Android-only generation field."
    regex:
      pattern: "  private accessor selectedStackFrame_: chrome.developerPrivate.StackFrame|\n      null = null;\n"
      replace: "  private accessor selectedStackFrame_: chrome.developerPrivate.StackFrame|\n      null = null;\n  // <if expr=\"is_android\">\n  private sourceRequestId_: number = 0;\n  // </if>\n"
    count: 1
  - description: "Android extension error-page UI582 exact reviewed literal 2: Android dataunset clears entries/selection and invalidates before original truthy-data branch."
    regex:
      pattern: "    if (changedProperties.has('data') && this.data) {\n"
      replace: "    // <if expr=\"is_android\">\n    if (changedProperties.has('data') && !this.data) {\n      this.entries_ = [];\n      this.selectedEntry_ = -1;\n      this.onSelectedErrorChanged_();\n    }\n    // </if>\n    if (changedProperties.has('data') && this.data) {\n"
    count: 1
  - description: "Android extension error-page UI582 exact reviewed literal 3: Invalidate before all early returns, including collapse/empty/invalidURL."
    regex:
      pattern: "  private onSelectedErrorChanged_() {\n    this.code_ = null;\n"
      replace: "  private onSelectedErrorChanged_() {\n    // <if expr=\"is_android\">\n    const requestId = ++this.sourceRequestId_;\n    this.selectedStackFrame_ = null;\n    // </if>\n    this.code_ = null;\n"
    count: 1
  - description: "Android extension error-page UI582 exact reviewed literal 4: Initial first visible frame supplies both selected frame and requested path/line; no-visible fallback retained."
    regex:
      pattern: "        args.lineNumber =\n            runtimeError.stackTrace && runtimeError.stackTrace[0] ?\n            runtimeError.stackTrace[0].lineNumber :\n            0;\n        this.selectedStackFrame_ =\n            runtimeError.stackTrace && runtimeError.stackTrace[0] ?\n            runtimeError.stackTrace[0] :\n            null;\n"
      replace: "        // <if expr=\"is_android\">\n        this.selectedStackFrame_ = runtimeError.stackTrace?.find(\n            frame => this.shouldDisplayFrame_(frame.url)) || null;\n        args.lineNumber = this.selectedStackFrame_?.lineNumber || 0;\n        if (this.selectedStackFrame_) {\n          args.pathSuffix =\n              getRelativeUrl(this.selectedStackFrame_.url, runtimeError);\n        }\n        // </if>\n        // <if expr=\"not is_android\">\n        args.lineNumber =\n            runtimeError.stackTrace && runtimeError.stackTrace[0] ?\n            runtimeError.stackTrace[0].lineNumber :\n            0;\n        this.selectedStackFrame_ =\n            runtimeError.stackTrace && runtimeError.stackTrace[0] ?\n            runtimeError.stackTrace[0] :\n            null;\n        // </if>\n"
    count: 1
  - description: "Android extension error-page UI582 exact reviewed literal 5: Guard selected-error source response."
    regex:
      pattern: "    this.delegate.requestFileSource(args).then(code => this.code_ = code);\n"
      replace: "    // <if expr=\"is_android\">\n    this.delegate.requestFileSource(args).then(code => {\n      if (requestId === this.sourceRequestId_) {\n        this.code_ = code;\n      }\n    });\n    // </if>\n    // <if expr=\"not is_android\">\n    this.delegate.requestFileSource(args).then(code => this.code_ = code);\n    // </if>\n"
    count: 1
  - description: "Android extension error-page UI582 exact reviewed literal 6: Frame selection invalidates earlier requests and clears obsolete code during request."
    regex:
      pattern: "  private updateSelected_(frame: chrome.developerPrivate.StackFrame) {\n    this.selectedStackFrame_ = frame;\n"
      replace: "  private updateSelected_(frame: chrome.developerPrivate.StackFrame) {\n    // <if expr=\"is_android\">\n    const requestId = ++this.sourceRequestId_;\n    this.code_ = null;\n    // </if>\n    this.selectedStackFrame_ = frame;\n"
    count: 1
  - description: "Android extension error-page UI582 exact reviewed literal 7: Guard stack-frame source response."
    regex:
      pattern: "        .then(code => this.code_ = code);\n"
      replace: "        // <if expr=\"is_android\">\n        .then(code => {\n          if (requestId === this.sourceRequestId_) {\n            this.code_ = code;\n          }\n        });\n        // </if>\n        // <if expr=\"not is_android\">\n        .then(code => this.code_ = code);\n        // </if>\n"
    count: 1
  - description: "Android extension error-page UI582 exact reviewed literal 8: Skip hidden frames by existing display policy; preserve focus/no request at visible bounds."
    regex:
      pattern: "        const frame = item.stackTrace[i + direction];\n        if (frame) {\n          this.updateSelected_(frame);\n          list[i + direction]!.focus();  // Preserve focus.\n        }\n"
      replace: "        // <if expr=\"is_android\">\n        let nextIndex = i + direction;\n        while (nextIndex >= 0 && nextIndex < item.stackTrace.length &&\n               !this.shouldDisplayFrame_(item.stackTrace[nextIndex]!.url)) {\n          nextIndex += direction;\n        }\n        const frame = item.stackTrace[nextIndex];\n        if (frame) {\n          this.updateSelected_(frame);\n          list[nextIndex]!.focus();  // Preserve focus.\n        }\n        // </if>\n        // <if expr=\"not is_android\">\n        const frame = item.stackTrace[i + direction];\n        if (frame) {\n          this.updateSelected_(frame);\n          list[i + direction]!.focus();  // Preserve focus.\n        }\n        // </if>\n"
    count: 1
