# Android-only responsive controls; merge declarations to avoid duplicate selectors.
substitutions:
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\}\

        \

        \#content\-wrapper\ \{\

        \ \ min\-width:\ var\(\-\-extensions\-card\-width\);\

        \ \ padding:\ 24px\ 60px\ 64px;\

        \}\

        \

        \#content\-wrapper:has\(extensions\-review\-panel\),\

        '
      replace: "}\n\n#content-wrapper {\n<if expr=\"not is_android\">\n  min-width: var(--extensions-card-width);\n</if>\n<if expr=\"is_android\">\n  min-width: 0;\n</if>\n  padding: 24px 60px 64px;\n<if expr=\"is_android\">\n  padding-inline: 16px;\n</if>\n}\n\n#content-wrapper:has(extensions-review-panel),\n"
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\ \ display:\ grid;\

        \ \ grid\-column\-gap:\ var\(\-\-grid\-gutter\);\

        \ \ grid\-row\-gap:\ var\(\-\-grid\-gutter\);\

        \ \ grid\-template\-columns:\ repeat\(auto\-fill,\ var\(\-\-extensions\-card\-width\)\);\

        \ \ justify\-content:\ center;\

        \ \ margin:\ auto;\

        \ \ max\-width:\ calc\(var\(\-\-extensions\-card\-width\)\ \*\ var\(\-\-max\-columns\)\ \+\

        '
      replace: "  display: grid;\n  grid-column-gap: var(--grid-gutter);\n  grid-row-gap: var(--grid-gutter);\n<if expr=\"not is_android\">\n  grid-template-columns: repeat(auto-fill, var(--extensions-card-width));\n</if>\n<if expr=\"is_android\">\n  grid-template-columns: repeat(auto-fill,\n      minmax(0, min(100%, var(--extensions-card-width))));\n</if>\n  justify-content: center;\n  margin: auto;\n  max-width: calc(var(--extensions-card-width) * var(--max-columns) +\n"
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\.section\-header\-contents\ \{\

        \ \ align\-items:\ center;\

        \ \ display:\ flex;\

        \ \ grid\-column:\ 1\ /\ \-1;\

        \ \ justify\-content:\ space\-between;\

        \ \ width:\ 100%;\

        '
      replace: ".section-header-contents {\n  align-items: center;\n  display: flex;\n<if expr=\"is_android\">\n  flex-wrap: wrap;\n  gap: 8px;\n</if>\n  grid-column: 1 / -1;\n  justify-content: space-between;\n  width: 100%;\n"
  - description: Keep Android responsive declarations in existing selector blocks
    regex:
      re_pattern: '\ \ \ \*\ is\ clickable\.\ \*/\

        \ \ z\-index:\ 1;\

        \}\

        '
      replace: "   * is clickable. */\n  z-index: 1;\n}\n\n<if expr=\"is_android\">\n:host {\n  display: block;\n}\n</if>\n"
