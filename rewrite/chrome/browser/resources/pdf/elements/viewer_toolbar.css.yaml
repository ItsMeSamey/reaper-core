eight: 36px; /* Matching default --cr-icon-button-size */\n  margin-inline-end: 20px;\n}\n\nviewer-page-selector::part(input),\ninput {\n  max-height: var(--viewer-pdf-toolbar-height);\n}\n\ninput {\n  background: rgba(0, 0, 0, 0.5);\n  border: none;\n  caret-color: currentColor;\n  color: inherit;\n  font-family: inherit;\n  line-height: inherit;\n  margin: 0 4px;\n  outline: none;\n  padding: 0 4px;\n  text-align: center;\n  width: 5ch;\n}\n\n#fit {\n  margin-inline-start: 12px;\n}\n\ncr-progress {\n  --cr-progress-active-color: var(--google-blue-300);\n  --cr-progress-container-color: transparent;\n  --cr-progress-height: 3px;\n  bottom: 0;\n  position: absolute;\n  width: 100%;\n}\n\ncr-progress,\n#center,\n#end {\n  transition: opacity 100ms cubic-bezier(0, 0, 0.2, 1);\n}\n\ncr-progress,\n:host([loading_]) #menuButton,\n:host([loading_]) #center,\n:host([loading_]) #end {\n  opacity: 0;\n  /* Ensure UI is not interactable while hidden */\n  visibility: hidden;\n}\n\n:host([loading_]) cr-progress,\n#menuButton,\n#center,\n#end {\n  opacity: 1;\n  visibility: visible;\n}\n\n#glic-controls {\n  align-items: center;\n  display: flex;\n}\n\n#glic-controls .vertical-separator {\n  margin-inline: 6px;\n}\n\n#glic-controls cr-icon {\n  margin-bottom: 1px;\n}\n\n#glic-summarize-button {\n  --cr-button-text-color: #e3e3e3;\n  --cr-focus-outline-color:var(--viewer-icon-focus-outline-color);\n  --cr-hover-background-color: rgba(253, 252, 251, 0.10);\n  border: none;\n  font-weight: 400;\n  gap: 4px;\n  height: 32px;\n  margin-left: 2px;\n  padding-inline-end: 12px;\n  padding-inline-start: 8px;\n}\n\n<if expr=\"enable_pdf_ink2\">\n.annotate-button.active {\n  background-color: var(--active-button-bg);\n  border-radius: 50%;\n}\n\n#annotate-controls {\n  align-items: center;\n  display: flex;\n  margin-inline-start: 6px;\n}\n\n#annotate-controls .annotate-button.active {\n  --cr-icon-button-fill-color: var(--viewer-icon-ink-selected-fill-color);\n}\n\n#annotate-controls .vertical-separator {\n  margin-inline: 6px;\n}\n</if>\n\n<if expr=\"enable_pdf_save_to_drive\">\nviewer-download-controls::part(button),\n</if>\n#print,\n#more {\n  margin-inline-start: 4px;\n}\n\n.dropdown-item {\n  padding-inline-end: 16px;\n  padding-inline-start: 12px;\n}\n\n.check-container {\n  margin-inline-end: 12px;\n  width: 16px;\n}\n\ncr-action-menu hr {\n  border: none;\n  border-top: var(--cr-separator-line);\n}\n"
