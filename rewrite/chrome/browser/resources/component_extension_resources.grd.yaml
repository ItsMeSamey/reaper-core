substitutions:
- description: Exclude disabled GLIC component extension resource includes on Android while preserving all other component
    extensions
  regex:
    pattern: "      <include name=\"IDR_GLIC_EXTENSION_MANIFEST\" file=\"glic/extension/manifest.json\" resource_path=\"glic_extension/manifest.json\"\
      \ type=\"BINDATA\" />\n      <include name=\"IDR_GLIC_EXTENSION_BACKGROUND_JS\" file=\"${root_gen_dir}/chrome/browser/resources/glic/extension/tsc/background.js\"\
      \ use_base_dir=\"false\" resource_path=\"glic_extension/background.js\" type=\"BINDATA\" />\n"
    replace: "      <if expr=\"not is_android\">\n        <include name=\"IDR_GLIC_EXTENSION_MANIFEST\" file=\"glic/extension/manifest.json\"\
      \ resource_path=\"glic_extension/manifest.json\" type=\"BINDATA\" />\n        <include name=\"IDR_GLIC_EXTENSION_BACKGROUND_JS\"\
      \ file=\"${root_gen_dir}/chrome/browser/resources/glic/extension/tsc/background.js\" use_base_dir=\"false\" resource_path=\"\
      glic_extension/background.js\" type=\"BINDATA\" />\n      </if>\n"
  count: 1
