substitutions:
- description: "Preserve reviewed Android source projection for chrome/browser/tracing/BUILD.gn (operation 1)."
  regex:
    re_pattern: '\ \ \ \ "chrome_tracing_delegate\.cc",\

      \ \ \ \ "tracing_features\.cc",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":tracing",\

      \ \ \ \ "//chrome/browser:browser_process",\

      '
    replace: "    \"chrome_tracing_delegate.cc\",\n    \"tracing_features.cc\",\n  ]\n\n  if (is_android) {\n    # Keep local histograms and field trials; omit remote reporter sources.\n    sources -= [ \"chrome_background_tracing_metrics_provider.cc\" ]\n  }\n  deps = [\n    \":tracing\",\n    \"//chrome/browser:browser_process\",\n"
- description: "Android native integration581, exact reviewed source literal 1: Do not compile the background-tracing upload-provider unit source on Android, where its production provider implementation is already excluded."
  regex:
    pattern: "  sources = [ \"chrome_background_tracing_metrics_provider_unittest.cc\" ]\n"
    replace: "  sources = [ \"chrome_background_tracing_metrics_provider_unittest.cc\" ]\n  if (is_android) {\n    sources -= [ \"chrome_background_tracing_metrics_provider_unittest.cc\" ]\n  }\n"
  count: 1
