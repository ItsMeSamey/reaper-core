substitutions:
- description: Exclude dedicated browser image-label service headers on Android
  regex:
    pattern: '#include "chrome/browser/accessibility/accessibility_labels_service.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/accessibility/accessibility_labels_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude image-label service incognito initialization on Android
  regex:
    pattern: "  // AccessibilityLabelsService has a default prefs behavior in incognito.\n  AccessibilityLabelsService::InitOffTheRecordPrefs(this);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // AccessibilityLabelsService has a default prefs behavior in incognito.\n  AccessibilityLabelsService::InitOffTheRecordPrefs(this);\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
