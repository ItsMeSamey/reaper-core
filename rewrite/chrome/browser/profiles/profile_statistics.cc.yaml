substitutions:
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\

      \#include\ <utility>\

      \

      \#include\ "chrome/browser/profiles/profile_statistics_aggregator\.h"\

      \

      ProfileStatistics::ProfileStatistics\(\

      \ \ \ \ scoped_refptr<autofill::AutofillWebDataService>\ autofill_web_data_service,\

      \ \ \ \ autofill::PersonalDataManager\*\ personal_data_manager,\

      \ \ \ \ const\ autofill::EntityDataManager\*\ entity_data_manager,\

      \ \ \ \ bookmarks::BookmarkModel\*\ bookmark_model,\

      \ \ \ \ history::HistoryService\*\ history_service,\

      \ \ \ \ scoped_refptr<password_manager::PasswordStoreInterface>\

      '
    replace: "\n#include <utility>\n\n#include \"build/build_config.h\"\n#include \"chrome/browser/profiles/profile_statistics_aggregator.h\"\n\nProfileStatistics::ProfileStatistics(\n    scoped_refptr<autofill::AutofillWebDataService> autofill_web_data_service,\n    autofill::PersonalDataManager* personal_data_manager,\n#if !BUILDFLAG(IS_ANDROID)\n    const autofill::EntityDataManager* entity_data_manager,\n#endif\n    bookmarks::BookmarkModel* bookmark_model,\n    history::HistoryService* history_service,\n    scoped_refptr<password_manager::PasswordStoreInterface>\n"
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ platform_credential_store\)\

      \ \ \ \ :\ autofill_web_data_service_\(std::move\(autofill_web_data_service\)\),\

      \ \ \ \ \ \ personal_data_manager_\(personal_data_manager\),\

      \ \ \ \ \ \ entity_data_manager_\(entity_data_manager\),\

      \ \ \ \ \ \ bookmark_model_\(bookmark_model\),\

      \ \ \ \ \ \ history_service_\(history_service\),\

      \ \ \ \ \ \ profile_password_store_\(profile_password_store\),\

      \ \ \ \ \ \ pref_service_\(pref_service\),\

      \ \ \ \ \ \ platform_credential_store_\(std::move\(platform_credential_store\)\),\

      \ \ \ \ \ \ aggregator_\(nullptr\)\ \{\}\

      \

      ProfileStatistics::\~ProfileStatistics\(\)\ =\ default;\

      \

      '
    replace: "        platform_credential_store)\n    : autofill_web_data_service_(std::move(autofill_web_data_service)),\n      personal_data_manager_(personal_data_manager),\n#if !BUILDFLAG(IS_ANDROID)\n      entity_data_manager_(entity_data_manager),\n#endif\n      bookmark_model_(bookmark_model),\n      history_service_(history_service),\n      profile_password_store_(profile_password_store),\n      pref_service_(pref_service),\n      platform_credential_store_(std::move(platform_credential_store)),\n      aggregator_(nullptr) {\n}\n\nProfileStatistics::~ProfileStatistics() = default;\n\n"
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ if\ \(!aggregator_\)\ \{\

      \ \ \ \ aggregator_\ =\ std::make_unique<ProfileStatisticsAggregator>\(\

      \ \ \ \ \ \ \ \ autofill_web_data_service_,\ personal_data_manager_,\

      \ \ \ \ \ \ \ \ entity_data_manager_,\ bookmark_model_,\ history_service_,\

      \ \ \ \ \ \ \ \ profile_password_store_,\ pref_service_,\

      \ \ \ \ \ \ \ \ std::move\(platform_credential_store_\),\

      \ \ \ \ \ \ \ \ base::BindOnce\(\&ProfileStatistics::DeregisterAggregator,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ weak_ptr_factory_\.GetWeakPtr\(\)\)\);\

      \ \ \}\

      '
    replace: "  if (!aggregator_) {\n    aggregator_ = std::make_unique<ProfileStatisticsAggregator>(\n        autofill_web_data_service_, personal_data_manager_,\n#if !BUILDFLAG(IS_ANDROID)\n        entity_data_manager_,\n#endif\n        bookmark_model_, history_service_, profile_password_store_,\n        pref_service_, std::move(platform_credential_store_),\n        base::BindOnce(&ProfileStatistics::DeregisterAggregator,\n                       weak_ptr_factory_.GetWeakPtr()));\n  }\n"
