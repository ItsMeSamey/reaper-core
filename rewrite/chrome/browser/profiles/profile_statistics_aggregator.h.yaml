substitutions:
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\

      \#include\ "base/functional/callback_forward\.h"\

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "chrome/browser/profiles/profile_statistics_common\.h"\

      \#include\ "components/autofill/core/browser/webdata/autofill_webdata_service\.h"\

      \#include\ "components/browsing_data/core/counters/browsing_data_counter\.h"\

      '
    replace: '

      #include "base/functional/callback_forward.h"

      #include "base/memory/raw_ptr.h"

      #include "build/build_config.h"

      #include "chrome/browser/profiles/profile_statistics_common.h"

      #include "components/autofill/core/browser/webdata/autofill_webdata_service.h"

      #include "components/browsing_data/core/counters/browsing_data_counter.h"

      '
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: 'class\ PrefService;\

      \

      namespace\ autofill\ \{\

      class\ EntityDataManager;\

      class\ PersonalDataManager;\

      \}\ \ //\ namespace\ autofill\

      \

      '
    replace: 'class PrefService;


      namespace autofill {

      #if !BUILDFLAG(IS_ANDROID)

      class EntityDataManager;

      #endif

      class PersonalDataManager;

      }  // namespace autofill


      '
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ ProfileStatisticsAggregator\(\

      \ \ \ \ \ \ scoped_refptr<autofill::AutofillWebDataService>\ autofill_web_data_service,\

      \ \ \ \ \ \ autofill::PersonalDataManager\*\ personal_data_manager,\

      \ \ \ \ \ \ const\ autofill::EntityDataManager\*\ entity_data_manager,\

      \ \ \ \ \ \ bookmarks::BookmarkModel\*\ bookmark_model,\

      \ \ \ \ \ \ history::HistoryService\*\ history_service,\

      \ \ \ \ \ \ scoped_refptr<password_manager::PasswordStoreInterface>\

      '
    replace: "  ProfileStatisticsAggregator(\n      scoped_refptr<autofill::AutofillWebDataService> autofill_web_data_service,\n      autofill::PersonalDataManager* personal_data_manager,\n#if !BUILDFLAG(IS_ANDROID)\n      const autofill::EntityDataManager* entity_data_manager,\n#endif\n      bookmarks::BookmarkModel* bookmark_model,\n      history::HistoryService* history_service,\n      scoped_refptr<password_manager::PasswordStoreInterface>\n"
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ const\ scoped_refptr<autofill::AutofillWebDataService>\

      \ \ \ \ \ \ autofill_web_data_service_;\

      \ \ const\ raw_ptr<autofill::PersonalDataManager>\ personal_data_manager_;\

      \ \ const\ raw_ptr<const\ autofill::EntityDataManager>\ entity_data_manager_;\

      \ \ const\ raw_ptr<bookmarks::BookmarkModel>\ bookmark_model_;\

      \ \ const\ raw_ptr<history::HistoryService>\ history_service_;\

      \ \ const\ scoped_refptr<password_manager::PasswordStoreInterface>\

      '
    replace: "  const scoped_refptr<autofill::AutofillWebDataService>\n      autofill_web_data_service_;\n  const raw_ptr<autofill::PersonalDataManager> personal_data_manager_;\n#if !BUILDFLAG(IS_ANDROID)\n  const raw_ptr<const autofill::EntityDataManager> entity_data_manager_;\n#endif\n  const raw_ptr<bookmarks::BookmarkModel> bookmark_model_;\n  const raw_ptr<history::HistoryService> history_service_;\n  const scoped_refptr<password_manager::PasswordStoreInterface>\n"
