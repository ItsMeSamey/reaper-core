substitutions:
- description: Exclude dedicated browser image-label service headers on Android
  regex:
    pattern: '#include "chrome/browser/accessibility/accessibility_labels_service.h"

      #include "chrome/browser/accessibility/accessibility_labels_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/accessibility/accessibility_labels_service.h"

      #include "chrome/browser/accessibility/accessibility_labels_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude image-label service profile initialization on Android
  regex:
    pattern: "  // TODO(accessibility): Dynamically create AccessibilityLabelsService when\n  // needed and destroy it when\
      \ no longer needed.\n  auto* accessibility_service =\n      AccessibilityLabelsServiceFactory::GetForProfile(profile);\n\
      \  if (accessibility_service)\n    accessibility_service->Init();\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // TODO(accessibility): Dynamically create AccessibilityLabelsService when\n \
      \ // needed and destroy it when no longer needed.\n  auto* accessibility_service =\n      AccessibilityLabelsServiceFactory::GetForProfile(profile);\n\
      \  if (accessibility_service)\n    accessibility_service->Init();\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
