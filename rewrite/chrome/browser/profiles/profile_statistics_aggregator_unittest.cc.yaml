substitutions:
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\#include\ "base/files/file_path\.h"\

      \#include\ "base/functional/bind\.h"\

      \#include\ "base/test/test_file_util\.h"\

      \#include\ "components/autofill/core/browser/data_manager/test_personal_data_manager\.h"\

      \#include\ "components/autofill/core/browser/webdata/autocomplete/autocomplete_table\.h"\

      \#include\ "components/autofill/core/browser/webdata/autofill_webdata_service\.h"\

      '
    replace: '#include "base/files/file_path.h"

      #include "base/functional/bind.h"

      #include "base/test/test_file_util.h"

      #include "build/build_config.h"

      #include "components/autofill/core/browser/data_manager/test_personal_data_manager.h"

      #include "components/autofill/core/browser/webdata/autocomplete/autocomplete_table.h"

      #include "components/autofill/core/browser/webdata/autofill_webdata_service.h"

      '
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ \ \ \ \ base::OnceClosure\ done_callback\)\ \{\

      \ \ \ \ return\ std::make_unique<ProfileStatisticsAggregator>\(\

      \ \ \ \ \ \ \ \ autofill_web_data_service_,\ \&personal_data_manager_,\

      \ \ \ \ \ \ \ \ /\*entity_data_manager=\*/nullptr,\ \&bookmark_model_,\ \&history_service_,\

      \ \ \ \ \ \ \ \ profile_password_store_,\ \&pref_service_,\

      \ \ \ \ \ \ \ \ /\*platform_credential_store=\*/nullptr,\ std::move\(done_callback\)\);\

      \ \ \}\

      \

      '
    replace: "      base::OnceClosure done_callback) {\n    return std::make_unique<ProfileStatisticsAggregator>(\n        autofill_web_data_service_, &personal_data_manager_,\n#if !BUILDFLAG(IS_ANDROID)\n        /*entity_data_manager=*/nullptr,\n#endif\n        &bookmark_model_, &history_service_, profile_password_store_,\n        &pref_service_,\n        /*platform_credential_store=*/nullptr, std::move(done_callback));\n  }\n\n"
