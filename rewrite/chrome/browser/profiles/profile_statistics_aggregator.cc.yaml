- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ \ \ base::OnceClosure\ done_callback\)\

      \ \ \ \ :\ autofill_web_data_service_\(std::move\(autofill_web_data_service\)\),\

      \ \ \ \ \ \ personal_data_manager_\(personal_data_manager\),\

      \ \ \ \ \ \ entity_data_manager_\(entity_data_manager\),\

      \ \ \ \ \ \ bookmark_model_\(bookmark_model\),\

      \ \ \ \ \ \ history_service_\(history_service\),\

      \ \ \ \ \ \ profile_password_store_\(profile_password_store\),\

      \ \ \ \ \ \ pref_service_\(pref_service\),\

      \ \ \ \ \ \ platform_credential_store_\(std::move\(platform_credential_store\)\),\

      \ \ \ \ \ \ done_callback_\(std::move\(done_callback\)\)\ \{\}\

      \

      ProfileStatisticsAggregator::\~ProfileStatisticsAggregator\(\)\ =\ default;\

      \

      '
    replace: "    base::OnceClosure done_callback)\n    : autofill_web_data_service_(std::move(autofill_web_data_service)),\n      personal_data_manager_(personal_data_manager),\n#if !BUILDFLAG(IS_ANDROID)\n      entity_data_manager_(entity_data_manager),\n#endif\n      bookmark_model_(bookmark_model),\n      history_service_(history_service),\n      profile_password_store_(profile_password_store),\n      pref_service_(pref_service),\n      platform_credential_store_(std::move(platform_credential_store)),\n      done_callback_(std::move(done_callback)) {\n}\n\nProfileStatisticsAggregator::~ProfileStatisticsAggregator() = default;\n\n"
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\

      \ \ //\ Initiate\ autofill\ counting\.\

      \ \ AddCounter\(std::make_unique<browsing_data::AutofillCounter>\(\

      \ \ \ \ \ \ personal_data_manager_,\ autofill_web_data_service_,\ entity_data_manager_,\

      \ \ \ \ \ \ /\*sync_service=\*/nullptr\)\);\

      \}\

      \

      '
    replace: "\n  // Initiate autofill counting.\n  AddCounter(std::make_unique<browsing_data::AutofillCounter>(\n      personal_data_manager_, autofill_web_data_service_,\n#if !BUILDFLAG(IS_ANDROID)\n      entity_data_manager_,\n#endif\n      /*sync_service=*/nullptr));\n}\n\n"
