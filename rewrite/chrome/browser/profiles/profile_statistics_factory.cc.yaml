substitutions:
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\#include\ "chrome/browser/profiles/profile_statistics_factory\.h"\

      \

      \#include\ "base/no_destructor\.h"\

      \#include\ "chrome/browser/autofill/autofill_entity_data_manager_factory\.h"\

      \#include\ "chrome/browser/autofill/personal_data_manager_factory\.h"\

      \#include\ "chrome/browser/bookmarks/bookmark_model_factory\.h"\

      \#include\ "chrome/browser/history/history_service_factory\.h"\

      '
    replace: '#include "chrome/browser/profiles/profile_statistics_factory.h"


      #include "base/no_destructor.h"

      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/autofill/autofill_entity_data_manager_factory.h"

      #endif

      #include "chrome/browser/autofill/personal_data_manager_factory.h"

      #include "chrome/browser/bookmarks/bookmark_model_factory.h"

      #include "chrome/browser/history/history_service_factory.h"

      '
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \.Build\(\)\)\ \{\

      \ \ DependsOn\(WebDataServiceFactory::GetInstance\(\)\);\

      \ \ DependsOn\(autofill::PersonalDataManagerFactory::GetInstance\(\)\);\

      \ \ DependsOn\(autofill::AutofillEntityDataManagerFactory::GetInstance\(\)\);\

      \ \ DependsOn\(BookmarkModelFactory::GetInstance\(\)\);\

      \ \ DependsOn\(HistoryServiceFactory::GetInstance\(\)\);\

      \ \ DependsOn\(ProfilePasswordStoreFactory::GetInstance\(\)\);\

      '
    replace: "              .Build()) {\n  DependsOn(WebDataServiceFactory::GetInstance());\n  DependsOn(autofill::PersonalDataManagerFactory::GetInstance());\n#if !BUILDFLAG(IS_ANDROID)\n  DependsOn(autofill::AutofillEntityDataManagerFactory::GetInstance());\n#endif\n  DependsOn(BookmarkModelFactory::GetInstance());\n  DependsOn(HistoryServiceFactory::GetInstance());\n  DependsOn(ProfilePasswordStoreFactory::GetInstance());\n"
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ \ \ \ \ WebDataServiceFactory::GetAutofillWebDataForProfile\(\

      \ \ \ \ \ \ \ \ \ \ profile,\ ServiceAccessType::EXPLICIT_ACCESS\),\

      \ \ \ \ \ \ autofill::PersonalDataManagerFactory::GetForBrowserContext\(profile\),\

      \ \ \ \ \ \ autofill::AutofillEntityDataManagerFactory::GetForProfile\(profile\),\

      \ \ \ \ \ \ BookmarkModelFactory::GetForBrowserContext\(profile\),\

      \ \ \ \ \ \ HistoryServiceFactory::GetForProfile\(profile,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ServiceAccessType::EXPLICIT_ACCESS\),\

      '
    replace: "      WebDataServiceFactory::GetAutofillWebDataForProfile(\n          profile, ServiceAccessType::EXPLICIT_ACCESS),\n      autofill::PersonalDataManagerFactory::GetForBrowserContext(profile),\n#if !BUILDFLAG(IS_ANDROID)\n      autofill::AutofillEntityDataManagerFactory::GetForProfile(profile),\n#endif\n      BookmarkModelFactory::GetForBrowserContext(profile),\n      HistoryServiceFactory::GetForProfile(profile,\n                                           ServiceAccessType::EXPLICIT_ACCESS),\n"
