# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/global_features.h'
  regex:
    re_pattern: '\#define\ CHROME_BROWSER_GLOBAL_FEATURES_H_\

      \

      \#include\ <memory>\

      \

      \#include\ "base/functional/callback\.h"\

      \#include\ "build/branding_buildflags\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/common/buildflags\.h"\

      \#include\ "chrome/common/request_header_integrity/buildflags\.h"\

      \#include\ "net/net_buildflags\.h"\

      '
    replace: '#define CHROME_BROWSER_GLOBAL_FEATURES_H_


      #include <memory>

      #include "build/build_config.h"


      #include "base/functional/callback.h"

      #include "build/branding_buildflags.h"

      #include "chrome/common/buildflags.h"

      #include "chrome/common/request_header_integrity/buildflags.h"

      #include "net/net_buildflags.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/global_features.h'
  regex:
    re_pattern: '\}\ \ //\ namespace\ default_browser\

      \#endif\

      \

      namespace\ glic\ \{\

      class\ GlicBackgroundModeManager;\

      class\ GlicGlobalEnabling;\

      class\ GlicProfileManager;\

      class\ GlicSyntheticTrialManager;\

      \}\ \ //\ namespace\ glic\

      \

      namespace\ omnibox_everywhere\ \{\

      class\ OmniboxEverywhereController;\

      '
    replace: '}  // namespace default_browser

      #endif


      #if !BUILDFLAG(IS_ANDROID)

      namespace glic {

      class GlicBackgroundModeManager;

      class GlicGlobalEnabling;

      class GlicProfileManager;

      class GlicSyntheticTrialManager;

      }  // namespace glic


      #endif  // !BUILDFLAG(IS_ANDROID)


      namespace omnibox_everywhere {

      class OmniboxEverywhereController;

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/global_features.h'
  regex:
    re_pattern: '\ \ \}\

      \#endif\

      \

      \ \ glic::GlicProfileManager\*\ glic_profile_manager\(\)\ \{\

      \ \ \ \ return\ glic_profile_manager_\.get\(\);\

      \ \ \}\

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      \ \ glic::GlicBackgroundModeManager\*\ glic_background_mode_manager\(\)\ \{\

      \ \ \ \ return\ glic_background_mode_manager_\.get\(\);\

      '
    replace: "  }\n#endif\n\n#if !BUILDFLAG(IS_ANDROID)\n  glic::GlicProfileManager* glic_profile_manager() {\n    return glic_profile_manager_.get();\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if !BUILDFLAG(IS_ANDROID)\n  glic::GlicBackgroundModeManager* glic_background_mode_manager() {\n    return glic_background_mode_manager_.get();\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/global_features.h'
  regex:
    re_pattern: '\ \ \}\

      \#endif\

      \

      \ \ glic::GlicSyntheticTrialManager\*\ glic_synthetic_trial_manager\(\)\ \{\

      \ \ \ \ return\ synthetic_trial_manager_\.get\(\);\

      \ \ \}\

      '
    replace: "  }\n#endif\n\n#if !BUILDFLAG(IS_ANDROID)\n  glic::GlicSyntheticTrialManager* glic_synthetic_trial_manager() {\n    return synthetic_trial_manager_.get();\n  }\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/global_features.h'
  regex:
    re_pattern: '\ \ glic::GlicGlobalEnabling\&\ glic_global_enabling\(\)\ \{\

      \ \ \ \ return\ \*glic_global_enabling_\.get\(\);\

      \ \ \}\

      \

      \ \ ApplicationLocaleStorage\*\ application_locale_storage\(\)\ \{\

      \ \ \ \ return\ application_locale_storage_\.get\(\);\

      '
    replace: "  glic::GlicGlobalEnabling& glic_global_enabling() {\n    return *glic_global_enabling_.get();\n  }\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  ApplicationLocaleStorage* application_locale_storage() {\n    return application_locale_storage_.get();\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/global_features.h'
  regex:
    re_pattern: '\ \ \ \ \ \ default_browser_manager_;\

      \#endif\

      \

      \ \ std::unique_ptr<glic::GlicGlobalEnabling>\ glic_global_enabling_;\

      \ \ std::unique_ptr<glic::GlicProfileManager>\ glic_profile_manager_;\

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      \ \ std::unique_ptr<glic::GlicBackgroundModeManager>\

      \ \ \ \ \ \ glic_background_mode_manager_;\

      \ \ std::unique_ptr<omnibox_everywhere::OmniboxEverywhereController>\

      \ \ \ \ \ \ omnibox_everywhere_controller_;\

      \#endif\

      \ \ std::unique_ptr<glic::GlicSyntheticTrialManager>\ synthetic_trial_manager_;\

      \

      \ \ std::unique_ptr<ApplicationLocaleStorage>\ application_locale_storage_;\

      \

      '
    replace: "      default_browser_manager_;\n#endif\n\n#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<glic::GlicGlobalEnabling> glic_global_enabling_;\n  std::unique_ptr<glic::GlicProfileManager> glic_profile_manager_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<glic::GlicBackgroundModeManager>\n      glic_background_mode_manager_;\n  std::unique_ptr<omnibox_everywhere::OmniboxEverywhereController>\n      omnibox_everywhere_controller_;\n#endif\n#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<glic::GlicSyntheticTrialManager> synthetic_trial_manager_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  std::unique_ptr<ApplicationLocaleStorage> application_locale_storage_;\n\n"
