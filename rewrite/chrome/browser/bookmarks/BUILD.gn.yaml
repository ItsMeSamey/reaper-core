substitutions:
- description: Exclude the Android shopping backend from impl while preserving shared providers and desktop
  regex:
    pattern: "    \"//ui/gfx\",\n  ]\n\n  if (enable_offline_pages) {\n    deps += [ \"//chrome/browser/offline_pages\" ]\n\
      \  }\n}"
    replace: "    \"//ui/gfx\",\n  ]\n\n  if (enable_offline_pages) {\n    deps += [ \"//chrome/browser/offline_pages\" ]\n\
      \  }\n  if (is_android) {\n    deps -= [\n      \"//components/commerce/core:shopping_service\",\n    ]\n  }\n\n}"
  count: 1
