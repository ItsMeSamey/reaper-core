substitutions:
- description: Make the private optional field guard explicit
  regex:
    pattern: '#include "base/task/deferred_sequenced_task_runner.h"

      '
    replace: '#include "base/task/deferred_sequenced_task_runner.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude only the shopping-owned bookmark provider field on Android
  regex:
    pattern: "  std::unique_ptr<power_bookmarks::SuggestedSaveLocationProvider>\n      shopping_save_location_provider_;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<power_bookmarks::SuggestedSaveLocationProvider>\n      shopping_save_location_provider_;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
