substitutions:
- description: Remove import used only by the retired price UI.
  regex:
    pattern: 'import android.widget.CompoundButton;

      '
    replace: ''
  count: 1
- description: Remove dedicated price-tracking UI implementation.
  regex:
    pattern: 'import com.google.android.material.materialswitch.MaterialSwitch;


      '
    replace: ''
  count: 1
- description: Remove dedicated price-tracking UI implementation.
  regex:
    pattern: "\n    private View mPriceTrackingContainer;\n    private MaterialSwitch mPriceTrackingSwitch;\n"
    replace: ''
