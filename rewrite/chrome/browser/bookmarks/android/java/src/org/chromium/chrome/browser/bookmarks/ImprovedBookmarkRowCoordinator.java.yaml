substitutions:
- description: Remove exclusive Shopping declaration
  regex:
    pattern: 'import org.chromium.components.power_bookmarks.PowerBookmarkMeta;

      '
    replace: ''
  count: 1
- description: Remove exclusive Shopping declaration
  regex:
    pattern: '    private final ShoppingService mShoppingService;

      '
    replace: ''
  count: 1
- description: Remove exclusive Shopping declaration
  regex:
    pattern: '        mShoppingService = shoppingService;

      '
    replace: ''
  count: 1
- description: Remove exclusive Shopping declaration
  regex:
    pattern: '        PowerBookmarkMeta meta = mBookmarkModel.getPowerBookmarkMeta(bookmarkId);

      '
    replace: ''
  count: 1
- description: Preserve existing constructor API
  regex:
    pattern: '     * @param shoppingService The bookmark model used to query bookmark properties.'
    replace: '     * @param shoppingService Retained for caller compatibility.'
  count: 1
- description: Keep ordinary row without Shopping accessory
  regex:
    pattern: "        // Shopping coordinator setup.\n        if (PowerBookmarkUtils.isShoppingListItem(mShoppingService,\
      \ meta)) {\n            ShoppingAccessoryCoordinator shoppingAccessoryCoordinator =\n                    new ShoppingAccessoryCoordinator(\n\
      \                            mContext, meta.getShoppingSpecifics(), mShoppingService);\n            propertyModel.set(\n\
      \                    ImprovedBookmarkRowProperties.SHOPPING_ACCESSORY_COORDINATOR,\n                    shoppingAccessoryCoordinator);\n\
      \            propertyModel.set(\n                    ImprovedBookmarkRowProperties.ACCESSORY_VIEW,\n               \
      \     shoppingAccessoryCoordinator.getView());\n        } else {\n            propertyModel.set(ImprovedBookmarkRowProperties.ACCESSORY_VIEW,\
      \ null);\n        }\n"
    replace: '        propertyModel.set(ImprovedBookmarkRowProperties.ACCESSORY_VIEW, null);

      '
  count: 1
