substitutions:
- description: Remove import used only by the retired price UI.
  regex:
    pattern: 'import android.widget.CompoundButton;

      '
    replace: ''
  count: 1
- description: Remove dedicated price-tracking UI implementation.
  regex:
    pattern: "    public static final WritableBooleanPropertyKey PRICE_TRACKING_VISIBLE =\n            new WritableBooleanPropertyKey();\n\
      \    public static final WritableBooleanPropertyKey PRICE_TRACKING_ENABLED =\n            new WritableBooleanPropertyKey();\n\
      \    public static final WritableBooleanPropertyKey PRICE_TRACKING_SWITCH_CHECKED =\n            new WritableBooleanPropertyKey();\n\
      \    public static final WritableObjectPropertyKey<CompoundButton.OnCheckedChangeListener>\n            PRICE_TRACKING_SWITCH_LISTENER\
      \ = new WritableObjectPropertyKey<>();\n\n"
    replace: ''
  count: 1
- description: Remove dedicated price-tracking UI implementation.
  regex:
    pattern: "        ADJUST_SUBTITLE_LAYOUT_DIRECTION,\n        PRICE_TRACKING_VISIBLE,\n        PRICE_TRACKING_ENABLED,\n\
      \        PRICE_TRACKING_SWITCH_CHECKED,\n        PRICE_TRACKING_SWITCH_LISTENER"
    replace: '        ADJUST_SUBTITLE_LAYOUT_DIRECTION'
  count: 1
