      \ */ false);\n    }\n\n    /**\n     * Shows the bookmark save flow sheet.\n     *\n     * @param bookmarkId The {@link\
      \ BookmarkId} which was saved.\n     * @param fromExplicitTrackUi Whether the bookmark was added via a dedicated tracking\
      \ entry\n     *     point. This will change the UI of the bookmark save flow, either adding type-specific\n     *  \
      \   text (e.g. price tracking text) or adding UI bits to allow users to upgrade a regular\n     *     bookmark. This\
      \ will be false when adding a normal bookmark.\n     * @param wasBookmarkMoved Whether the save flow is shown as a result\
      \ of a moved bookmark.\n     * @param isNewBookmark Whether the bookmark is newly created.\n     */\n    public void\
      \ show(\n            BookmarkId bookmarkId,\n            boolean fromExplicitTrackUi,\n            boolean wasBookmarkMoved,\n\
      \            boolean isNewBookmark) {\n        mBookmarkModel.finishLoadingBookmarkModel(\n                () ->\n \
      \                       show(\n                                bookmarkId,\n                                fromExplicitTrackUi,\n\
      \                                wasBookmarkMoved,\n                                isNewBookmark,\n               \
      \                 mBookmarkModel.getPowerBookmarkMeta(bookmarkId)));\n    }\n\n    void show(\n            BookmarkId\
      \ bookmarkId,\n            boolean fromExplicitTrackUi,\n            boolean wasBookmarkMoved,\n            boolean\
      \ isNewBookmark,\n            @Nullable PowerBookmarkMeta meta) {\n"
    replace: "    public void show(BookmarkId bookmarkId) {\n        show(bookmarkId, /* wasBookmarkMoved= */ false);\n  \
      \  }\n\n    /**\n     * Shows the bookmark save flow sheet.\n     *\n     * @param bookmarkId The {@link BookmarkId}\
      \ which was saved.\n     * @param wasBookmarkMoved Whether the save flow is shown as a result of a moved bookmark.\n\
      \     */\n    public void show(BookmarkId bookmarkId, boolean wasBookmarkMoved) {\n        mBookmarkModel.finishLoadingBookmarkModel(\n\
      \                () -> showLoaded(bookmarkId, wasBookmarkMoved));\n    }\n\n    void showLoaded(BookmarkId bookmarkId,\
      \ boolean wasBookmarkMoved) {\n"
  count: 1
