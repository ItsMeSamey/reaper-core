substitutions:
- description: Remove import used only by retired explicit-price entrypoint
  regex:
    pattern: 'import static org.chromium.build.NullUtil.assumeNonNull;


      '
    replace: ''
  count: 1
- description: Remove dedicated explicit price-tracking entrypoint
  regex:
    pattern: "    /**\n     * Starts price tracking for the current tab. If the page is already being price tracked, the\n\
      \     * edit price tracking flow will start.\n     *\n     * @param currentTab The tab being currently shown.\n    \
      \ */\n    public void startOrModifyPriceTracking(@Nullable Tab currentTab) {\n        BookmarkId bookmarkId =\n    \
      \            assumeNonNull(mBookmarkModelSupplier.get()).getUserBookmarkIdForTab(currentTab);\n        if (bookmarkId\
      \ == null) {\n            addOrEditBookmark(\n                    Collections.singletonList(currentTab),\n         \
      \           BookmarkType.NORMAL,\n                    /* fromExplicitTrackUi= */ true);\n        } else {\n        \
      \    // In the case where the bookmark exists, re-show the save flow with price-tracking\n            // enabled.\n\
      \            assert currentTab != null : \"currentTab cannot be null\";\n            BookmarkUtils.showSaveFlow(\n \
      \                   mActivity,\n                    mBottomSheetControllerSupplier.get(),\n                    currentTab.getProfile(),\n\
      \                    bookmarkId,\n                    /* fromExplicitTrackUi= */ true,\n                    /* wasBookmarkMoved=\
      \ */ false,\n                    /* isNewBookmark= */ false,\n                    mBookmarkManagerOpener,\n        \
      \            mPriceDropNotificationManagerSupplier.get());\n        }\n    }\n\n"
    replace: ''
  count: 1
- description: Describe retained ordinary bookmarking behavior
  regex:
    pattern: ' * bookmark UI. Includes price tracking specific UI if the page is relevant for price tracking.

      '
    replace: ' * bookmark UI.

      '
  count: 1
- description: Remove dedicated notification supplier field
  regex:
    pattern: '    private final Supplier<PriceDropNotificationManager> mPriceDropNotificationManagerSupplier;

      '
    replace: ''
  count: 1
- description: Remove obsolete supplier documentation
  regex:
    pattern: "     * @param priceDropNotificationManagerSupplier Supplies the {@link PriceDropNotificationManager}\n     *\
      \     which manages price drop notifications.\n"
    replace: ''
  count: 1
- description: Remove unused supplier constructor parameter
  regex:
    pattern: '            Supplier<PriceDropNotificationManager> priceDropNotificationManagerSupplier,

      '
    replace: ''
  count: 1
- description: Remove supplier initialization
  regex:
    pattern: '        mPriceDropNotificationManagerSupplier = priceDropNotificationManagerSupplier;

      '
    replace: ''
  count: 1
- description: Stop instantiating price notifications when saving bookmarks
  regex:
    pattern: '                mPriceDropNotificationManagerSupplier.get(),

      '
    replace: ''
  count: 1
- description: Preserve normal bookmark route without price mode
  regex:
    pattern: addOrEditBookmark(tabsToBookmark, BookmarkType.NORMAL, /* fromExplicitTrackUi= */ false);
    replace: addOrEditBookmark(tabsToBookmark, BookmarkType.NORMAL);
  count: 1
- description: Preserve Reading List route without price mode
  regex:
    pattern: "        addOrEditBookmark(\n                tabsToBookmark, BookmarkType.READING_LIST, /* fromExplicitTrackUi=\
      \ */ false);"
    replace: '        addOrEditBookmark(tabsToBookmark, BookmarkType.READING_LIST);'
  count: 1
- description: Remove private price mode parameter
  regex:
    pattern: "            @BookmarkType int bookmarkType,\n            boolean fromExplicitTrackUi) {"
    replace: '            @BookmarkType int bookmarkType) {'
  count: 2
- description: Preserve loaded-model callback without price mode
  regex:
    pattern: "                            bookmarkType,\n                            fromExplicitTrackUi);"
    replace: '                            bookmarkType);'
  count: 1
- description: Remove obsolete price mode from ordinary utility call
  regex:
    pattern: '                fromExplicitTrackUi,

      '
    replace: ''
  count: 1
- description: Remove obsolete price-notification import
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceDropNotificationManager;

      '
    replace: ''
  count: 1
