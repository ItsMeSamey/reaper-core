substitutions:
- description: Keep all ordinary search results and stored metadata
  regex:
    pattern: "        List<BookmarkListEntry> allEntries = bookmarkIdListToBookmarkListEntryList(searchIdList);\n        if\
      \ (powerFilter == null || powerFilter.isEmpty()) {\n            return allEntries;\n        }\n        List<BookmarkListEntry>\
      \ ret = new ArrayList<>();\n        for (BookmarkListEntry entry : allEntries) {\n            if (powerFilter.contains(getTypeFromMeta(entry.getPowerBookmarkMeta())))\
      \ {\n                ret.add(entry);\n            }\n        }\n        return ret;\n"
    replace: '        return bookmarkIdListToBookmarkListEntryList(searchIdList);

      '
  count: 1
- description: Remove retired metadata-to-Shopping filter classifier
  regex:
    pattern: "\n    private PowerBookmarkType getTypeFromMeta(@Nullable PowerBookmarkMeta powerBookmarkMeta) {\n        if\
      \ (powerBookmarkMeta != null && powerBookmarkMeta.hasShoppingSpecifics()) {\n            return PowerBookmarkType.SHOPPING;\n\
      \        } else {\n            return PowerBookmarkType.UNKNOWN;\n        }\n    }\n"
    replace: ''
  count: 1
