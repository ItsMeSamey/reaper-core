substitutions:
- description: Remove obsolete notification parameter documentation
  regex:
    pattern: '     * @param priceDropNotificationManager Manager to handle price drop notifications.

      '
    replace: ''
  count: 1
- description: Remove obsolete notification constructor or utility parameter
  regex:
    pattern: "            @Nullable ShoppingService shoppingService,\n            PriceDropNotificationManager priceDropNotificationManager)\
      \ {\n"
    replace: '            @Nullable ShoppingService shoppingService) {

      '
  count: 1
- description: Remove obsolete notification forwarding argument
  regex:
    pattern: '                        priceDropNotificationManager,

      '
    replace: ''
  count: 1
- description: Remove obsolete price-notification import
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceDropNotificationManager;

      '
    replace: ''
  count: 1
- description: Remove documentation for unused shopping dependency
  regex:
    pattern: '     * @param shoppingService Shopping service to fetch price tracking info if available.

      '
    replace: ''
  count: 1
- description: Remove unused shopping service constructor parameter
  regex:
    pattern: "            BookmarkManagerOpener bookmarkManagerOpener,\n            @Nullable ShoppingService shoppingService)\
      \ {\n"
    replace: '            BookmarkManagerOpener bookmarkManagerOpener) {

      '
  count: 1
- description: Remove unused shopping service forwarding argument
  regex:
    pattern: '                        shoppingService,

      '
    replace: ''
  count: 1
- description: Remove unused shopping service import
  regex:
    pattern: 'import org.chromium.components.commerce.core.ShoppingService;

      '
    replace: ''
  count: 1
- description: Remove nullable import used only by retired shopping parameter
  regex:
    pattern: 'import org.chromium.build.annotations.Nullable;

      '
    replace: ''
  count: 1
