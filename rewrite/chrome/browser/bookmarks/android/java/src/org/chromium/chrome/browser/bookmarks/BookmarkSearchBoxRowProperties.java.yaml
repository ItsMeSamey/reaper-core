substitutions:
- description: Describe ordinary retained properties
  regex:
    pattern: /** Responsible for hosting properties for the shopping chips in the BookmarkSearchBoxRow. */
    replace: /** Properties for the bookmark search box row. */
  count: 1
- description: Remove dedicated chip properties
  regex:
    pattern: "    /** Shopping chip properties. */\n    public static final ReadableObjectPropertyKey<Callback<Boolean>> SHOPPING_CHIP_TOGGLE_CALLBACK\
      \ =\n            new ReadableObjectPropertyKey<>();\n    public static final WritableBooleanPropertyKey SHOPPING_CHIP_SELECTED\
      \ =\n            new WritableBooleanPropertyKey();\n    public static final WritableBooleanPropertyKey SHOPPING_CHIP_VISIBILITY\
      \ =\n            new WritableBooleanPropertyKey();\n    public static final ReadableObjectPropertyKey<Integer> SHOPPING_CHIP_START_ICON_RES\
      \ =\n            new ReadableObjectPropertyKey<>();\n    public static final ReadableObjectPropertyKey<Integer> SHOPPING_CHIP_TEXT_RES\
      \ =\n            new ReadableObjectPropertyKey<>();\n\n"
    replace: ''
  count: 1
- description: Remove dedicated chip keys
  regex:
    pattern: "        SHOPPING_CHIP_TOGGLE_CALLBACK,\n        SHOPPING_CHIP_SELECTED,\n        SHOPPING_CHIP_VISIBILITY,\n\
      \        SHOPPING_CHIP_START_ICON_RES,\n        SHOPPING_CHIP_TEXT_RES\n"
    replace: ''
  count: 1
