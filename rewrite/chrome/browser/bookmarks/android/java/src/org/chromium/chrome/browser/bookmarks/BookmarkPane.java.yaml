substitutions:
- description: Remove notification factory field
  regex:
    pattern: "    private final Function<Profile, PriceDropNotificationManager>\n            mPriceDropNotificationManagerFactory;\n"
    replace: ''
  count: 1
- description: Remove obsolete factory documentation
  regex:
    pattern: '     * @param priceDropNotificationManagerFactory Factory to create PriceDropNotificationManager.

      '
    replace: ''
  count: 1
- description: Remove obsolete factory constructor argument
  regex:
    pattern: '            Function<Profile, PriceDropNotificationManager> priceDropNotificationManagerFactory,

      '
    replace: ''
  count: 1
- description: Remove factory initialization
  regex:
    pattern: '        mPriceDropNotificationManagerFactory = priceDropNotificationManagerFactory;

      '
    replace: ''
  count: 1
- description: Avoid creating price notifications for bookmark pane
  regex:
    pattern: '                            mPriceDropNotificationManagerFactory.apply(originalProfile),

      '
    replace: ''
  count: 1
- description: Remove obsolete price-notification import
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceDropNotificationManager;

      '
    replace: ''
  count: 1
