substitutions:
- description: Remove obsolete notification parameter documentation
  regex:
    pattern: '     * @param priceDropNotificationManager Manages price drop notifications.

      '
    replace: ''
  count: 1
- description: Remove obsolete notification constructor or utility parameter
  regex:
    pattern: '            PriceDropNotificationManager priceDropNotificationManager,

      '
    replace: ''
  count: 1
- description: Remove obsolete notification forwarding argument
  regex:
    pattern: '                        priceDropNotificationManager,

      '
    replace: ''
  count: 1
- description: Remove obsolete price-notification import
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceDropNotificationManager;

      '
    replace: ''
  count: 1
- description: Remove dedicated saved-product update scheduling
  regex:
    pattern: "        ShoppingService service = ShoppingServiceFactory.getForProfile(profile);\n        if (CommerceFeatureUtils.isShoppingListEligible(service))\
      \ {\n            service.scheduleSavedProductUpdate();\n        }\n"
    replace: ''
  count: 1
- description: Remove dedicated shopping eligibility import
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtils;

      '
    replace: ''
  count: 1
- description: Remove type import used only by removed scheduling
  regex:
    pattern: 'import org.chromium.components.commerce.core.ShoppingService;

      '
    replace: ''
  count: 1
