substitutions:
- description: Remove import used only by the retired price UI.
  regex:
    pattern: 'import android.widget.CompoundButton;

      '
    replace: ''
  count: 1
- description: Remove dedicated price-tracking UI implementation.
  regex:
    pattern: "    /** Visibility of the price tracking section. */\n    public static final WritableBooleanPropertyKey PRICE_TRACKING_VISIBLE\
      \ =\n            new WritableBooleanPropertyKey();\n\n    /** Enabled state of the price tracking section (notably the\
      \ switch). */\n    public static final WritableBooleanPropertyKey PRICE_TRACKING_ENABLED =\n            new WritableBooleanPropertyKey();\n\
      \n    /** Checked state of the price tracking switch. */\n    public static final WritableBooleanPropertyKey PRICE_TRACKING_SWITCH_CHECKED\
      \ =\n            new WritableBooleanPropertyKey();\n\n    /** Listener for price tracking switch toggles. */\n    public\
      \ static final WritableObjectPropertyKey<CompoundButton.OnCheckedChangeListener>\n            PRICE_TRACKING_SWITCH_LISTENER\
      \ = new WritableObjectPropertyKey<>();\n\n"
    replace: ''
  count: 1
- description: Remove dedicated price-tracking UI implementation.
  regex:
    pattern: "        PRICE_TRACKING_ENABLED,\n        PRICE_TRACKING_SWITCH_CHECKED,\n        PRICE_TRACKING_SWITCH_LISTENER,\n\
      \        PRICE_TRACKING_VISIBLE,\n"
    replace: ''
  count: 1
