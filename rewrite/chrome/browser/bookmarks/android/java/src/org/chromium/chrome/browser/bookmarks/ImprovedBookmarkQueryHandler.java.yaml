substitutions:
- description: Remove exclusive Shopping declaration
  regex:
    pattern: 'import org.chromium.components.power_bookmarks.PowerBookmarkMeta;

      '
    replace: ''
  count: 1
- description: Remove exclusive Shopping declaration
  regex:
    pattern: 'import java.util.ArrayList;

      '
    replace: ''
  count: 1
- description: Remove exclusive Shopping declaration
  regex:
    pattern: '    private final @Nullable ShoppingService mShoppingService;

      '
    replace: ''
  count: 1
- description: Remove exclusive Shopping declaration
  regex:
    pattern: '        mShoppingService = shoppingService;

      '
    replace: ''
  count: 1
- description: Document retained constructor signature
  regex:
    pattern: '     * @param shoppingService Supports queries about shopping data.'
    replace: '     * @param shoppingService Retained for caller compatibility.'
  count: 1
- description: Keep direct folder children and ordinary ReadingList route
  regex:
    pattern: "        final List<BookmarkListEntry> bookmarkListEntries;\n        if (!isReadingList && powerFilter != null\
      \ && !powerFilter.isEmpty()) {\n            bookmarkListEntries = collectLeafNodes(parentId);\n        } else {\n  \
      \          bookmarkListEntries =\n                    mBasicBookmarkQueryHandler.buildBookmarkListForParent(parentId,\
      \ powerFilter);\n        }\n"
    replace: "        final List<BookmarkListEntry> bookmarkListEntries =\n                mBasicBookmarkQueryHandler.buildBookmarkListForParent(parentId,\
      \ powerFilter);\n"
  count: 1
- description: Remove retired folder filter application
  regex:
    pattern: '            applyPowerFilters(bookmarkListEntries, powerFilter);

      '
    replace: ''
  count: 1
- description: Remove retired search filter application
  regex:
    pattern: '        applyPowerFilters(bookmarkListEntries, powerFilter);

      '
    replace: ''
  count: 1
- description: Remove dedicated Shopping subscription filtering and recursive collection
  regex:
    pattern: "    private void applyPowerFilters(\n            List<BookmarkListEntry> bookmarkListEntries,\n            @Nullable\
      \ Set<PowerBookmarkType> powerFilter) {\n        if (powerFilter == null || powerFilter.isEmpty()) return;\n\n     \
      \   // Remove entries from the list if the any filter from powerFilter doesn't match.\n        bookmarkListEntries.removeIf(\n\
      \                bookmarkListEntry -> {\n                    // Remove bookmarks which aren't price-tracked if the shopping\
      \ filter is active.\n                    if (powerFilter.contains(PowerBookmarkType.SHOPPING)) {\n                 \
      \       if (!isPriceTracked(bookmarkListEntry)) return true;\n                    }\n\n                    return false;\n\
      \                });\n    }\n\n    private boolean isPriceTracked(BookmarkListEntry bookmarkListEntry) {\n        PowerBookmarkMeta\
      \ meta = bookmarkListEntry.getPowerBookmarkMeta();\n        if (mShoppingService == null\n                || !PowerBookmarkUtils.isShoppingListItem(mShoppingService,\
      \ meta)) return false;\n        return mShoppingService.isSubscribedFromCache(\n                PowerBookmarkUtils.createCommerceSubscriptionForShoppingSpecifics(\n\
      \                        meta.getShoppingSpecifics()));\n    }\n\n    private List<BookmarkListEntry> collectLeafNodes(BookmarkId\
      \ parentId) {\n        List<BookmarkListEntry> bookmarkListEntries = new ArrayList<>();\n        collectLeafNodesImpl(parentId,\
      \ bookmarkListEntries);\n        return bookmarkListEntries;\n    }\n\n    private void collectLeafNodesImpl(\n    \
      \        BookmarkId parentId, List<BookmarkListEntry> bookmarkListEntries) {\n        if (parentId == null) return;\n\
      \        for (BookmarkId childId : mBookmarkModel.getChildIds(parentId)) {\n            BookmarkItem bookmarkItem =\
      \ mBookmarkModel.getBookmarkById(childId);\n            if (bookmarkItem == null) continue;\n            if (bookmarkItem.isFolder())\
      \ {\n                collectLeafNodesImpl(childId, bookmarkListEntries);\n            } else {\n                bookmarkListEntries.add(\n\
      \                        BookmarkListEntry.createBookmarkEntry(\n                                bookmarkItem,\n   \
      \                             mBookmarkModel.getPowerBookmarkMeta(childId),\n                                mBookmarkUiPrefs.getBookmarkRowDisplayPref()));\n\
      \            }\n        }\n    }\n\n"
    replace: ''
  count: 1
