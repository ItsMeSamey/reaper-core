substitutions:
- description: Remove exclusive Shopping declaration
  regex:
    pattern: 'import android.view.View;

      '
    replace: ''
  count: 1
- description: Remove exclusive Shopping declaration
  regex:
    pattern: 'import android.view.View.OnClickListener;

      '
    replace: ''
  count: 1
- description: Remove exclusive Shopping declaration
  regex:
    pattern: 'import org.chromium.components.browser_ui.widget.chips.ChipView;

      '
    replace: ''
  count: 1
- description: Describe retained search control
  regex:
    pattern: "/**\n * A layout that embeds the generic desktop search box and any bookmarks-specific UI elements, like\n *\
      \ shopping filter chips.\n */\n"
    replace: '/** A layout that embeds the shared bookmark search box. */

      '
  count: 1
- description: Remove dedicated chip fields
  regex:
    pattern: "    private ChipView mShoppingChip;\n    private View mShoppingChipContainer;\n"
    replace: ''
  count: 1
- description: Remove dedicated chip lookups
  regex:
    pattern: "\n        mShoppingChip = findViewById(R.id.shopping_filter_chip);\n        mShoppingChipContainer = findViewById(R.id.shopping_filter_chip_container);\n"
    replace: ''
  count: 1
- description: Remove dedicated chip view methods
  regex:
    pattern: "\n    /** Toggles visibility for the shopping chip container. */\n    public void setChipContainerVisibility(boolean\
      \ isVisible) {\n        mShoppingChipContainer.setVisibility(isVisible ? View.VISIBLE : View.GONE);\n    }\n\n    /**\
      \ Sets the icon on the shopping chip. */\n    public void setShoppingChipIcon(int resId) {\n        mShoppingChip.setIconWithTint(resId,\
      \ /* tintWithTextColor= */ true);\n    }\n\n    /** Sets the text string on the shopping chip. */\n    public void setShoppingChipText(int\
      \ resId) {\n        mShoppingChip.getPrimaryTextView().setText(resId);\n    }\n\n    /** Binds click listener toggles.\
      \ */\n    public void setShoppingChipToggleListener(@Nullable OnClickListener listener) {\n        mShoppingChip.setOnClickListener(listener);\n\
      \    }\n\n    /** Sets whether the shopping chip is selected. */\n    public void setShoppingChipSelected(boolean selected)\
      \ {\n        mShoppingChip.setSelected(selected);\n    }\n"
    replace: ''
  count: 1
