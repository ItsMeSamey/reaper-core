substitutions:
- description: Remove the dedicated price-tracking layout subtree.
  regex:
    pattern: "    <!-- Price Tracking Row -->\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
      @+id/price_tracking_container\"\n        android:visibility=\"gone\"\n        android:layout_width=\"0dp\"\n       \
      \ android:layout_height=\"wrap_content\"\n        android:paddingVertical=\"8dp\"\n        android:layout_marginTop=\"\
      8dp\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n\
      \        app:layout_constraintTop_toBottomOf=\"@id/normal_content_bottom_barrier\">\n\n        <ImageView\n        \
      \    android:id=\"@+id/price_tracking_image\"\n            android:layout_width=\"24dp\"\n            android:layout_height=\"\
      24dp\"\n            android:src=\"@drawable/price_tracking_disabled\"\n            app:tint=\"@macro/default_icon_color\"\
      \n            android:importantForAccessibility=\"no\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n\
      \            app:layout_constraintTop_toTopOf=\"parent\"\n            app:layout_constraintBottom_toBottomOf=\"parent\"\
      \ />\n\n        <LinearLayout\n            android:layout_width=\"0dp\"\n            android:layout_height=\"wrap_content\"\
      \n            android:layout_marginStart=\"12dp\"\n            android:layout_marginEnd=\"12dp\"\n            android:orientation=\"\
      vertical\"\n            app:layout_constraintStart_toEndOf=\"@id/price_tracking_image\"\n            app:layout_constraintEnd_toStartOf=\"\
      @id/price_tracking_switch\"\n            app:layout_constraintTop_toTopOf=\"parent\"\n            app:layout_constraintBottom_toBottomOf=\"\
      parent\">\n            <TextView\n                android:layout_width=\"wrap_content\"\n                android:layout_height=\"\
      wrap_content\"\n                android:text=\"@string/enable_price_tracking_menu_item\"\n                android:textAppearance=\"\
      @style/TextAppearance.BookmarkPopup.TextMedium\" />\n            <TextView\n                android:layout_width=\"\
      wrap_content\"\n                android:layout_height=\"wrap_content\"\n                android:text=\"@string/price_tracking_save_flow_notification_switch_subtitle\"\
      \n                android:textAppearance=\"@style/TextAppearance.BookmarkPopup.TextSmall\" />\n        </LinearLayout>\n\
      \n        <com.google.android.material.materialswitch.MaterialSwitch\n            android:id=\"@+id/price_tracking_switch\"\
      \n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"wrap_content\"\n          \
      \  app:layout_constraintTop_toTopOf=\"parent\"\n            app:layout_constraintBottom_toBottomOf=\"parent\"\n    \
      \        app:layout_constraintEnd_toEndOf=\"parent\" />\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
      \n\n"
    replace: ''
  count: 1
- description: Preserve the ordinary gap previously applied when the price row was gone.
  regex:
    pattern: "        android:layout_marginTop=\"8dp\"\n        app:layout_goneMarginTop=\"@dimen/bookmark_popup_buttons_margin_top\""
    replace: '        android:layout_marginTop="@dimen/bookmark_popup_buttons_margin_top"'
  count: 1
- description: Anchor ordinary buttons below retained image/folder content.
  regex:
    pattern: '        app:layout_constraintTop_toBottomOf="@id/price_tracking_container"'
    replace: '        app:layout_constraintTop_toBottomOf="@id/normal_content_bottom_barrier"'
  count: 1
