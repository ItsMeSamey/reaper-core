substitutions:
- description: Remove dedicated price-tracking UI implementation.
  regex:
    pattern: "                                    .with(\n                                            ImprovedBookmarkSaveFlowProperties\n\
      \                                                    .PRICE_TRACKING_VISIBLE,\n                                    \
      \        false)\n"
    replace: ''
  count: 1
- description: Retire only the dedicated testPriceTracking price UI case.
  regex:
    pattern: "    @Test\n    @MediumTest\n    @Feature({\"RenderTest\"})\n    public void testPriceTracking() throws IOException\
      \ {\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mModel.set(ImprovedBookmarkSaveFlowProperties.PRICE_TRACKING_VISIBLE,\
      \ true);\n                    mModel.set(\n                            ImprovedBookmarkSaveFlowProperties.PRICE_TRACKING_SWITCH_CHECKED,\
      \ true);\n                });\n        InstrumentationRegistry.getInstrumentation().waitForIdleSync();\n        mRenderTestRule.render(mContentView,\
      \ \"price_tracking\");\n    }\n\n"
    replace: ''
  count: 1
- description: Retire only the dedicated testPriceTracking_switchUnchecked price UI case.
  regex:
    pattern: "    @Test\n    @MediumTest\n    @Feature({\"RenderTest\"})\n    public void testPriceTracking_switchUnchecked()\
      \ throws IOException {\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mModel.set(ImprovedBookmarkSaveFlowProperties.PRICE_TRACKING_VISIBLE,\
      \ true);\n                    mModel.set(\n                            ImprovedBookmarkSaveFlowProperties.PRICE_TRACKING_SWITCH_CHECKED,\n\
      \                            false);\n                });\n        InstrumentationRegistry.getInstrumentation().waitForIdleSync();\n\
      \        mRenderTestRule.render(mContentView, \"price_tracking_switch_unchecked\");\n    }\n\n"
    replace: ''
  count: 1
- description: Retire only the dedicated testPriceTracking_visibleNotEnabled price UI case.
  regex:
    pattern: "    @Test\n    @MediumTest\n    @Feature({\"RenderTest\"})\n    public void testPriceTracking_visibleNotEnabled()\
      \ throws IOException {\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mModel.set(ImprovedBookmarkSaveFlowProperties.PRICE_TRACKING_VISIBLE,\
      \ true);\n                    mModel.set(\n                            ImprovedBookmarkSaveFlowProperties.PRICE_TRACKING_SWITCH_CHECKED,\
      \ true);\n                    mModel.set(ImprovedBookmarkSaveFlowProperties.PRICE_TRACKING_ENABLED, false);\n      \
      \          });\n        InstrumentationRegistry.getInstrumentation().waitForIdleSync();\n        mRenderTestRule.render(mContentView,\
      \ \"price_tracking_visible_not_enabled\");\n    }\n\n"
    replace: ''
  count: 1
