substitutions:
  - description: Add the Brave bookmarks deps.
    add_literal_to_list:
      target: impl
      list_name: deps
      literal: brave_browser_bookmarks_android_impl_deps

  - description: Add the Brave bookmarks java sources.
    add_literal_to_list:
      target: java
      list_name: sources
      literal: brave_browser_bookmarks_android_sources
  - description: Retire dedicated accessory production source admission
    regex:
      pattern: '    "java/src/org/chromium/chrome/browser/bookmarks/ShoppingAccessoryCoordinator.java",

        '
      replace: ''
    count: 1
  - description: Retire dedicated accessory production source admission
    regex:
      pattern: '    "java/src/org/chromium/chrome/browser/bookmarks/ShoppingAccessoryView.java",

        '
      replace: ''
    count: 1
  - description: Retire dedicated accessory production source admission
    regex:
      pattern: '    "java/src/org/chromium/chrome/browser/bookmarks/ShoppingAccessoryViewBinder.java",

        '
      replace: ''
    count: 1
  - description: Retire dedicated accessory production source admission
    regex:
      pattern: '    "java/src/org/chromium/chrome/browser/bookmarks/ShoppingAccessoryViewProperties.java",

        '
      replace: ''
    count: 1
  - description: Retire dedicated accessory JVM fixture admission
    regex:
      pattern: '    "junit/src/org/chromium/chrome/browser/bookmarks/ShoppingAccessoryCoordinatorTest.java",

        '
      replace: ''
    count: 1
  - description: Retire dedicated accessory render fixture admission
    regex:
      pattern: '    "javatests/src/org/chromium/chrome/browser/bookmarks/ShoppingAccessoryViewRenderTest.java",

        '
      replace: ''
    count: 1
  - description: Remove formatter dependency used only by excluded accessory classes
    regex:
      pattern: '    "//components/payments/content/android/ui:java",

        '
      replace: ''
    count: 1
  - description: Remove the dedicated interface dependency from the retained Android deps list
    regex:
      pattern: "    \"//components/browser_ui/widget/android:java\",\n    \"//third_party/androidx:androidx_recyclerview_recyclerview_java\"\
        ,\n  ]"
      replace: "    \"//components/browser_ui/widget/android:java\",\n    \"//third_party/androidx:androidx_recyclerview_recyclerview_java\"\
        ,\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/commerce/price_tracking/android:java\" ]\n  }"
    count: 1
  - description: Remove the dedicated interface dependency from the retained Android deps list
    regex:
      pattern: "    \"//ui/edge_to_edge:java\",\n    \"//url:url_java\",\n  ]"
      replace: "    \"//ui/edge_to_edge:java\",\n    \"//url:url_java\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/commerce/price_tracking/android:java\"\
        \ ]\n  }"
    count: 1
  - description: Exclude the dedicated price-only helper or its conversion fixture from Android
    regex:
      pattern: "    \"java/src/org/chromium/chrome/browser/bookmarks/bar/BookmarkBarViewBinder.java\",\n    \"java/src/org/chromium/chrome/browser/bookmarks/bar/BookmarkBarVisibilityProvider.java\"\
        ,\n  ]"
      replace: "    \"java/src/org/chromium/chrome/browser/bookmarks/bar/BookmarkBarViewBinder.java\",\n    \"java/src/org/chromium/chrome/browser/bookmarks/bar/BookmarkBarVisibilityProvider.java\"\
        ,\n  ]\n  if (is_android) {\n    sources -= [ \"java/src/org/chromium/chrome/browser/bookmarks/PowerBookmarkUtils.java\"\
        \ ]\n  }"
    count: 1
  - description: Exclude the dedicated price-only helper or its conversion fixture from Android
    regex:
      pattern: "    \"junit/src/org/chromium/chrome/browser/bookmarks/bar/BookmarkBarUtilsTest.java\",\n    \"junit/src/org/chromium/chrome/browser/bookmarks/bar/BookmarkBarVisibilityProviderTest.java\"\
        ,\n  ]"
      replace: "    \"junit/src/org/chromium/chrome/browser/bookmarks/bar/BookmarkBarUtilsTest.java\",\n    \"junit/src/org/chromium/chrome/browser/bookmarks/bar/BookmarkBarVisibilityProviderTest.java\"\
        ,\n  ]\n  if (is_android) {\n    sources -= [ \"junit/src/org/chromium/chrome/browser/bookmarks/PowerBookmarkUtilsTest.java\"\
        \ ]\n  }"
    count: 1
  - description: Apply stock GN formatting to the bounded successor
    regex:
      pattern: '    sources -= [ "java/src/org/chromium/chrome/browser/bookmarks/PowerBookmarkUtils.java" ]

        '
      replace: "    sources -= [\n      \"java/src/org/chromium/chrome/browser/bookmarks/PowerBookmarkUtils.java\",\n    ]\n"
    count: 1
