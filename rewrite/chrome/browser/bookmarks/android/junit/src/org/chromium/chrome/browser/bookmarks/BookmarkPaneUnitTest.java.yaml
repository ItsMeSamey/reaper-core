substitutions:
- description: Remove only the unavailable factory JNI import
  regex:
    pattern: 'import org.chromium.chrome.browser.commerce.ShoppingServiceFactoryJni;

      '
    replace: ''
  count: 1
- description: Remove the replaced factory Natives mock field
  regex:
    pattern: '    @Mock private ShoppingServiceFactory.Natives mShoppingServiceFactoryNatives;

      '
    replace: ''
  count: 1
- description: Remove only the old factory JNI mock registration
  regex:
    pattern: '        ShoppingServiceFactoryJni.setInstanceForTesting(mShoppingServiceFactoryNatives);

      '
    replace: ''
  count: 1
- description: Let ordinary setup use the real nonnull unavailable facade without an unused factory import
  regex:
    pattern: 'import org.chromium.chrome.browser.commerce.ShoppingServiceFactory;

      '
    replace: ''
  count: 1
- description: Remove retired price wiring while preserving ordinary bookmark fixture behavior
  regex:
    pattern: "markOpener,\n                        mBookmarkManagerOpener,\n                        (profile) -> mPriceDropNotificationManager,\n\
      \                        mSigninAndHistorySyncActivityLaunche"
    replace: "markOpener,\n                        mBookmarkManagerOpener,\n                        mSigninAndHistorySyncActivityLaunche"
  count: 1
- description: Remove retired price wiring while preserving ordinary bookmark fixture behavior
  regex:
    pattern: "@Mock private BookmarkManagerOpener mBookmarkManagerOpener;\n    @Mock private PriceDropNotificationManager\
      \ mPriceDropNotificationManager;\n    @Mock private SigninAndHistorySyncActivityLauncher mSign"
    replace: "@Mock private BookmarkManagerOpener mBookmarkManagerOpener;\n    @Mock private SigninAndHistorySyncActivityLauncher\
      \ mSign"
  count: 1
- description: Remove retired price wiring while preserving ordinary bookmark fixture behavior
  regex:
    pattern: 'um.chrome.browser.page_image_service.ImageServiceBridgeJni;

      import org.chromium.chrome.browser.price_tracking.PriceDropNotificationManager;

      import org.chromium.chrome.browser.profiles.Profile;

      import '
    replace: 'um.chrome.browser.page_image_service.ImageServiceBridgeJni;

      import org.chromium.chrome.browser.profiles.Profile;

      import '
  count: 1
