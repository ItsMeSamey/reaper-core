substitutions:
- description: Use the real unavailable utility instead of its removed JNI mock
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtilsJni;

      '
    replace: ''
  count: 1
- description: Remove only the obsolete default-false utility mock
  regex:
    pattern: '    @Mock private CommerceFeatureUtils.Natives mCommerceFeatureUtilsJniMock;

      '
    replace: ''
  count: 1
- description: Use the production unavailable eligibility result in ordinary setup
  regex:
    pattern: '        CommerceFeatureUtilsJni.setInstanceForTesting(mCommerceFeatureUtilsJniMock);

      '
    replace: ''
  count: 1
- description: Remove the now-unused utility interface import
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtils;

      '
    replace: ''
  count: 1
