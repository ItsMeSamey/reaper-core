- description: Check ordinary title/URL and generic accessory absence
  regex:
    pattern: "        PropertyModel model = mCoordinator.createBasePropertyModel(URL_BOOKMARK_ID_A);\n        assertNull(model.get(ImprovedBookmarkRowProperties.SHOPPING_ACCESSORY_COORDINATOR));\n\
      \        assertNull(model.get(ImprovedBookmarkRowProperties.ACCESSORY_VIEW));\n"
    replace: "        PropertyModel model = mCoordinator.createBasePropertyModel(URL_BOOKMARK_ID_A);\n        BookmarkItem\
      \ bookmark = mBookmarkModel.getBookmarkById(URL_BOOKMARK_ID_A);\n        assertEquals(bookmark.getTitle(), model.get(ImprovedBookmarkRowProperties.TITLE));\n\
      \        assertEquals(\n                bookmark.getUrlForDisplay(), model.get(ImprovedBookmarkRowProperties.DESCRIPTION));\n\
      \        assertNull(model.get(ImprovedBookmarkRowProperties.ACCESSORY_VIEW));\n"
  count: 1
