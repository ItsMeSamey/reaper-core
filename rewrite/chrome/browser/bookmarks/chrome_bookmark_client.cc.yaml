substitutions:
- description: Make Android buildflag available before conditional imports
  regex:
    pattern: '#include "chrome/browser/bookmarks/chrome_bookmark_client.h"


      '
    replace: '#include "chrome/browser/bookmarks/chrome_bookmark_client.h"

      #include "build/build_config.h"


      '
  count: 1
- description: Move the existing build config import before conditional imports
  regex:
    pattern: '#include "base/time/time.h"

      #include "build/build_config.h"

      '
    replace: '#include "base/time/time.h"

      '
  count: 1
- description: Exclude shopping suggestion implementation header on Android
  regex:
    pattern: '#include "base/metrics/user_metrics.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "base/metrics/user_metrics.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude shopping suggestion implementation header on Android
  regex:
    pattern: '#include "chrome/browser/commerce/shopping_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/commerce/shopping_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude shopping suggestion implementation header on Android
  regex:
    pattern: '#include "components/commerce/core/commerce_feature_list.h"

      #include "components/commerce/core/price_tracking_utils.h"

      #include "components/commerce/core/shopping_service.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/commerce/core/commerce_feature_list.h"

      #include "components/commerce/core/price_tracking_utils.h"

      #include "components/commerce/core/shopping_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude shopping suggestion implementation header on Android
  regex:
    pattern: '#include "components/power_bookmarks/core/suggested_save_location_provider.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/power_bookmarks/core/suggested_save_location_provider.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude the optional shopping collection suggestion provider on Android
  regex:
    pattern: "namespace {\n\nclass ShoppingCollectionProvider\n    : public power_bookmarks::SuggestedSaveLocationProvider\
      \ {\n public:\n  ShoppingCollectionProvider(bookmarks::BookmarkModel* model, Profile* profile)\n      : model_(model),\
      \ profile_(profile) {}\n  ShoppingCollectionProvider(const ShoppingCollectionProvider&) = delete;\n  ShoppingCollectionProvider&\
      \ operator=(const ShoppingCollectionProvider&) =\n      delete;\n  ~ShoppingCollectionProvider() override = default;\n\
      \n  const bookmarks::BookmarkNode* GetSuggestion(const GURL& url) override {\n    commerce::ShoppingService* service\
      \ =\n        commerce::ShoppingServiceFactory::GetForBrowserContext(profile_);\n    if (!service || !service->GetAvailableProductInfoForUrl(url).has_value())\
      \ {\n      return nullptr;\n    }\n    return commerce::GetShoppingCollectionBookmarkFolder(model_.get(), true);\n \
      \ }\n\n  base::TimeDelta GetBackoffTime() override {\n    // TODO(b:291326480): Make this configurable.\n    return\
      \ base::Hours(2);\n  }\n\n  std::string GetFeatureNameForMetrics() override {\n    return \"ShoppingCollection\";\n\
      \  }\n\n  void OnSuggestionRejected() override {\n    base::RecordAction(base::UserMetricsAction(\n        \"Commerce.PriceTracking.ShoppingCollection.RejectedSuggestion\"\
      ));\n  }\n\n private:\n  raw_ptr<bookmarks::BookmarkModel> model_;\n  raw_ptr<Profile> profile_;\n};\n\n}  // namespace\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nnamespace {\n\nclass ShoppingCollectionProvider\n    : public power_bookmarks::SuggestedSaveLocationProvider\
      \ {\n public:\n  ShoppingCollectionProvider(bookmarks::BookmarkModel* model, Profile* profile)\n      : model_(model),\
      \ profile_(profile) {}\n  ShoppingCollectionProvider(const ShoppingCollectionProvider&) = delete;\n  ShoppingCollectionProvider&\
      \ operator=(const ShoppingCollectionProvider&) =\n      delete;\n  ~ShoppingCollectionProvider() override = default;\n\
      \n  const bookmarks::BookmarkNode* GetSuggestion(const GURL& url) override {\n    commerce::ShoppingService* service\
      \ =\n        commerce::ShoppingServiceFactory::GetForBrowserContext(profile_);\n    if (!service || !service->GetAvailableProductInfoForUrl(url).has_value())\
      \ {\n      return nullptr;\n    }\n    return commerce::GetShoppingCollectionBookmarkFolder(model_.get(), true);\n \
      \ }\n\n  base::TimeDelta GetBackoffTime() override {\n    // TODO(b:291326480): Make this configurable.\n    return\
      \ base::Hours(2);\n  }\n\n  std::string GetFeatureNameForMetrics() override {\n    return \"ShoppingCollection\";\n\
      \  }\n\n  void OnSuggestionRejected() override {\n    base::RecordAction(base::UserMetricsAction(\n        \"Commerce.PriceTracking.ShoppingCollection.RejectedSuggestion\"\
      ));\n  }\n\n private:\n  raw_ptr<bookmarks::BookmarkModel> model_;\n  raw_ptr<Profile> profile_;\n};\n\n}  // namespace\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Retire the optional shopping provider only where it exists
  regex:
    pattern: "  if (shopping_save_location_provider_) {\n    RemoveSuggestedSaveLocationProvider(shopping_save_location_provider_.get());\n\
      \  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (shopping_save_location_provider_) {\n    RemoveSuggestedSaveLocationProvider(shopping_save_location_provider_.get());\n\
      \  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep ordinary bookmark initialization without Android shopping suggestion registration
  regex:
    pattern: "  shopping_save_location_provider_ =\n      std::make_unique<ShoppingCollectionProvider>(model, profile_);\n\
      \n  AddSuggestedSaveLocationProvider(shopping_save_location_provider_.get());\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  shopping_save_location_provider_ =\n      std::make_unique<ShoppingCollectionProvider>(model,\
      \ profile_);\n\n  AddSuggestedSaveLocationProvider(shopping_save_location_provider_.get());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Directly include the PrefService definition required by ordinary bookmark preference access, independent of
    excluded commerce includes
  regex:
    pattern: '#include "components/signin/public/base/persistent_repeating_timer.h"

      '
    replace: '#include "components/prefs/pref_service.h"

      #include "components/signin/public/base/persistent_repeating_timer.h"

      '
  count: 1
