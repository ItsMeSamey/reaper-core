substitutions:
- description: Do not broaden the original request through an unscoped source switch.
  regex:
    pattern: "void TabSharingUIAndroid::ChangeSource(content::WebContents* new_source) {\n  CHECK_CURRENTLY_ON(content::BrowserThread::UI);\n  if (!new_source) {\n    return;\n  }\n  content::RenderFrameHost* main_frame = new_source->GetPrimaryMainFrame();\n  if (!main_frame || !main_frame->GetProcess()) {\n    return;\n  }\n  auto new_media_id =\n      content::DesktopMediaID(content::DesktopMediaID::TYPE_WEB_CONTENTS,\n                              content::DesktopMediaID::kNullId,\n                              content::WebContentsMediaCaptureId(\n                                  main_frame->GetProcess()->GetDeprecatedID(),\n                                  main_frame->GetRoutingID()));\n  // Force the renderer to produce a compositor frame so the video capturer\n  // can grab it immediately. Otherwise, if the tab is static, no frames\n  // will be emitted and the video stream will freeze.\n  content::RenderWidgetHostView* rwhv = new_source->GetRenderWidgetHostView();\n  if (rwhv &&\
      \ rwhv->GetRenderWidgetHost()) {\n    rwhv->GetRenderWidgetHost()->InsertVisualStateCallback(base::DoNothing());\n  }\n  if (source_callback_) {\n    source_callback_.Run(new_media_id, false);\n  }\n}\n"
    replace: "void TabSharingUIAndroid::ChangeSource(content::WebContents* new_source) {\n  // SourceCallback carries no original surface/profile/request restrictions.\n  // Keep capture and Stop working, but require a fresh picker for a new source.\n}\n"
- description: Keep Stop and the indicator but omit the unsafe source-switch control.
  regex:
    pattern: web_contents, !source_callback_.is_null(),
    replace: web_contents, /* can_switch_source= */ false,
