substitutions:
- description: Balance picker visibility bookkeeping if cancellation destroys a pending dialog.
  regex:
    pattern: DesktopMediaPickerAndroid::~DesktopMediaPickerAndroid() = default;
    replace: "DesktopMediaPickerAndroid::~DesktopMediaPickerAndroid() {\n  if (!callback_.is_null()) DesktopMediaPickerManager::Get()->OnHideDialog();\n}"
