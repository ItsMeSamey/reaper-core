substitutions:
- description: Bind the chooser to the initiating document and its destruction.
  regex:
    pattern: '#include "content/public/browser/desktop_media_id.h"'
    replace: '#include "content/public/browser/desktop_media_id.h"

      #include "content/public/browser/weak_document_ptr.h"

      #include "content/public/browser/web_contents_observer.h"'
- description: Mark the observing bridge destructor virtual.
  regex:
    pattern: ~MediaCapturePickerManagerBridge();
    replace: ~MediaCapturePickerManagerBridge() override;
- description: Observe the requesting WebContents until a result is delivered.
  regex:
    pattern: class MediaCapturePickerManagerBridge {
    replace: 'class MediaCapturePickerManagerBridge : public content::WebContentsObserver {'
- description: Revalidate native type/profile/policy and close Java UI on cancellation.
  regex:
    pattern: "  DesktopMediaPicker::DoneCallback callback_;\n  DesktopMediaList::WebContentsFilter web_contents_filter_;"
    replace: "  bool IsAllowed(DesktopMediaList::Type type) const;\n  void Finish(DesktopMediaPicker::DoneCallbackArgumentType result);\n  void DidFinishNavigation(content::NavigationHandle* navigation) override;\n  void WebContentsDestroyed() override;\n  void RenderFrameDeleted(content::RenderFrameHost* frame) override;\n  void RenderFrameHostStateChanged(\n      content::RenderFrameHost* frame,\n      content::RenderFrameHost::LifecycleState old_state,\n      content::RenderFrameHost::LifecycleState new_state) override;\n\n  DesktopMediaPicker::DoneCallback callback_;\n  DesktopMediaPicker::Params params_;\n  content::WeakDocumentPtr request_document_;\n  int capture_id_ = 0;"
