substitutions:
  - description: Preserve Android disabled WebRTC upload completion and local diagnostics
    regex:
      pattern: "#include \"base/files/file.h\"\n"
      replace: "#include \"base/files/file.h\"\n#include \"base/files/file_enumerator.h\"\n"
    count: 1
  - description: Preserve Android disabled WebRTC upload completion and local diagnostics
    regex:
      pattern: "#include \"base/time/time.h\"\n"
      replace: "#include \"base/time/time.h\"\n#include \"build/build_config.h\"\n"
    count: 1
  - description: Preserve Android disabled WebRTC upload completion and local diagnostics
    regex:
      pattern: "#include \"testing/gtest/include/gtest/gtest.h\"\n"
      replace: "#include \"testing/gtest/include/gtest/gtest.h\"\n#if BUILDFLAG(IS_ANDROID)\n#include \"third_party/zlib/google/compression_utils.h\"\n#endif\n"
    count: 1
  - description: Preserve Android disabled WebRTC upload completion and local diagnostics
    regex:
      pattern: "TEST_F(WebRtcLogUploaderTest, GuidIncludedWithoutFeature) {\n  base::test::ScopedFeatureList feature_list;\n  feature_list.InitAndDisableFeature(kWebRtcLogUploaderExcludesGuid);\n\n  std::string post_data;\n  UploadPostData(WebRtcLogUploadSite::kSameSite, post_data);\n\n  EXPECT_EQ(\"0\", GetValueFromMultipart(post_data, \"guid\"));\n}\n"
      replace: "TEST_F(WebRtcLogUploaderTest, GuidIncludedWithoutFeature) {\n  base::test::ScopedFeatureList feature_list;\n  feature_list.InitAndDisableFeature(kWebRtcLogUploaderExcludesGuid);\n\n  std::string post_data;\n  UploadPostData(WebRtcLogUploadSite::kSameSite, post_data);\n\n  EXPECT_EQ(\"0\", GetValueFromMultipart(post_data, \"guid\"));\n}\n\n#if BUILDFLAG(IS_ANDROID)\nTEST_F(WebRtcLogUploaderTest,\n       AndroidDisabledUploadCompletesAndReleasesSlot) {\n  for (bool upload_allowed : {false, true}) {\n    for (bool with_callback : {false, true}) {\n      SCOPED_TRACE(testing::Message() << \"upload_allowed=\" << upload_allowed\n                                     << \" with_callback=\" << with_callback);\n      base::ScopedTempDir temp_dir;\n      ASSERT_TRUE(temp_dir.CreateUniqueTempDir());\n      auto uploader = std::make_unique<WebRtcLogUploader>();\n      // Fill all slots so exactly one successful later reservation demonstrates\n      // that this operation releases one slot, including without a callback.\n      constexpr int kCapacity = 20;\n      for (int i = 0; i < kCapacity; ++i) {\n        EXPECT_TRUE(uploader->ApplyForStartLogging());\n      }\n      EXPECT_FALSE(uploader->ApplyForStartLogging());\n\n      int callbacks = 0;\n      auto main_runner = base::SequencedTaskRunner::GetCurrentDefault();\n      WebRtcLogUploader::UploadDoneData done;\n      done.paths.directory = temp_dir.GetPath();\n      done.web_app_id = 0;\n      if (with_callback) {\n        done.callback = base::BindOnce(\n            [&](bool success, const std::string& report_id,\n                const std::string& error) {\n              ++callbacks;\n              EXPECT_TRUE(main_runner->RunsTasksInCurrentSequence());\n              EXPECT_FALSE(success);\n              EXPECT_TRUE(report_id.empty());\n              EXPECT_EQ(WebRtcLogUploader::kLogUploadDisabledMsg, error);\n            });\n      }\n      auto log = std::make_unique<WebRtcLogBuffer>();\n      log->Log(\"retained local diagnostic\");\n      log->SetComplete();\n      // Do not use OverrideUploadWithBufferForTesting: that bypasses the\n      // production disabled-upload completion path exercised here.\n      uploader->background_task_runner()->PostTask(\n          FROM_HERE,\n          base::BindOnce(&WebRtcLogUploader::OnLoggingStopped,\n                         base::Unretained(uploader.get()),\n                         WebRtcLogUploadSite::kSameSite, std::move(log),\n                         std::make_unique<WebRtcLogMetaDataMap>(),\n                         std::move(done), upload_allowed));\n      task_environment_.RunUntilIdle();\n      EXPECT_EQ(with_callback ? 1 : 0, callbacks);\n      EXPECT_TRUE(uploader->ApplyForStartLogging());\n      EXPECT_FALSE(uploader->ApplyForStartLogging());\n\n      base::FileEnumerator files(temp_dir.GetPath(), false,\n                                 base::FileEnumerator::FILES,\n                                 FILE_PATH_LITERAL(\"*.gz\"));\n      const base::FilePath stored_log = files.Next();\n      EXPECT_FALSE(stored_log.empty());\n      std::string compressed;\n      EXPECT_TRUE(base::ReadFileToString(stored_log, &compressed));\n      std::string decompressed;\n      EXPECT_TRUE(compression::GzipUncompress(compressed, &decompressed));\n      EXPECT_EQ(\"retained local diagnostic\\\\n\", decompressed);\n      EXPECT_TRUE(files.Next().empty());\n\n      uploader->Shutdown();\n      task_environment_.RunUntilIdle();\n      EXPECT_EQ(with_callback ? 1 : 0, callbacks);\n    }\n  }\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Use supported capturing test callback for Android disabled upload
    regex:
      pattern: "#include \"third_party/zlib/google/compression_utils.h\""
      replace: "#include \"base/test/bind.h\"\n#include \"third_party/zlib/google/compression_utils.h\""
    count: 1
  - description: Use supported capturing test callback for Android disabled upload
    regex:
      pattern: "        done.callback = base::BindOnce(\n"
      replace: "        done.callback = base::BindLambdaForTesting(\n"
    count: 1
