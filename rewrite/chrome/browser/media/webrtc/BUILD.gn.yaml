        \"//chrome/browser/ui/tabs:tabs_public\",\n        \"//components/enterprise/buildflags\",\n        \"//components/enterprise/data_controls/core/browser:test_support\",\n        \"//components/tabs:public\",\n      ]\n    }\n  }\n}\n\nsource_set(\"unit_tests\") {\n  testonly = true\n\n  # Some of these tests declare file-scope objects with non-trivial\n  # destructors (e.g. media_stream_capture_indicator_unittest.cc).\n  configs += [ \"//build/config/compiler:no_exit_time_destructors\" ]\n\n  # These tests build on all platforms (matching the original monolithic\n  # //chrome/test:unit_tests target).\n  sources = [\n    \"capture_policy_utils_unittest.cc\",\n    \"media_device_salt_service_factory_unittest.cc\",\n    \"media_stream_device_permission_context_unittest.cc\",\n  ]\n  deps = [\n    \":webrtc\",\n    \"//base\",\n    \"//base/test:test_support\",\n    \"//chrome/browser/content_settings:content_settings_factory\",\n    \"//chrome/browser/media/prefs\",\n    \"//chrome/browser/prefs\",\n    \"//chrome/common\",\n    \"//chrome/test:test_support\",\n    \"//components/infobars/content\",\n    \"//components/media_device_salt\",\n    \"//components/prefs:test_support\",\n    \"//components/sync_preferences:test_support\",\n    \"//components/user_manager\",\n    \"//content/test:test_support\",\n    \"//net:test_support\",\n    \"//services/network:test_support\",\n    \"//services/network/public/cpp\",\n    \"//testing/gmock\",\n    \"//testing/gtest\",\n    \"//third_party/zlib/google:compression_utils\",\n  ]\n\n  if (is_chromeos) {\n    sources += [\n      \"chrome_screen_enumerator_ash_unittest.cc\",\n      \"desktop_media_list_ash_unittest.cc\",\n    ]\n    deps += [\n      \"//chrome/browser/ash/login/users\",\n      \"//chrome/browser/ash/login/users:test_support\",\n      \"//chrome/browser/chromeos/policy/dlp\",\n      \"//chrome/browser/chromeos/policy/dlp/test:test_support\",\n      \"//chrome/test:test_support_unit\",\n      \"//chromeos/ash/components/system\",\n      \"//components/account_id\",\n    ]\n  }\n\n  # These media/webrtc unit tests are desktop-only (!is_android);\n  # test_stats_dictionary additionally lives in the desktop-only browser-test\n  # base.\n  if (!is_android) {\n    sources += [\n      \"current_tab_desktop_media_list_unittest.cc\",\n      \"desktop_capture_access_handler_unittest.cc\",\n      \"desktop_media_list_base_unittest.cc\",\n      \"desktop_media_picker_controller_unittest.cc\",\n      \"display_media_access_handler_unittest.cc\",\n      \"media_capture_devices_dispatcher_unittest.cc\",\n      \"media_stream_capture_indicator_unittest.cc\",\n      \"rtc_diagnostic_logging_unittest.cc\",\n      \"tab_capture_access_handler_unittest.cc\",\n      \"test_stats_dictionary_unittest.cc\",\n      \"webrtc_event_log_manager_common_unittest.cc\",\n      \"webrtc_event_log_manager_unittest.cc\",\n      \"webrtc_event_log_manager_unittest_helpers.cc\",\n      \"webrtc_event_log_manager_unittest_helpers.h\",\n      \"webrtc_event_log_uploader_impl_unittest.cc\",\n      \"webrtc_log_uploader_unittest.cc\",\n      \"webrtc_logging_controller_unittest.cc\",\n      \"webrtc_rtp_dump_handler_unittest.cc\",\n      \"webrtc_rtp_dump_writer_unittest.cc\",\n      \"webrtc_text_log_handler_unittest.cc\",\n    ]\n    deps += [\n      \":test_support\",\n      \":webrtc_browser_tests_base\",\n      \"//chrome/browser/web_applications:web_app_test\",\n      \"//chrome/browser/web_applications:web_applications_test_support\",\n    ]\n  }\n\n  # native_desktop_media_list is not built on ChromeOS (it uses the desktop\n  # DesktopMediaList backend), so it is desktop-only excluding ChromeOS.\n  if (!is_android && !is_chromeos) {\n    sources += [ \"native_desktop_media_list_unittest.cc\" ]\n    deps += [\n      \"//chrome/test/views\",\n      \"//content/public/browser\",\n      \"//ui/views\",\n    ]\n    if (use_aura) {\n      deps += [ \"//ui/aura\" ]\n    }\n    if (is_mac) {\n      deps += [ \"//components/remote_cocoa/browser\" ]\n    }\n  }\n\n  if (is_mac) {\n    sources += [ \"thumbnail_capturer_mac_unittest.mm\" ]\n    deps += [\n      \"//chrome/browser/permissions/system\",\n      \"//media/capture:test_support\",\n    ]\n    weak_frameworks = [ \"ScreenCaptureKit.framework\" ]\n  }\n}\n\n# Interactive UI tests cannot run on ChromeOS devices; see\n# //docs/testing/chromeos_integration for background.\nif (!is_android && !is_chromeos_device) {\n  source_set(\"interactive_ui_tests\") {\n    testonly = true\n    defines = [ \"HAS_OUT_OF_PROC_TEST_RUNNER\" ]\n\n    sources = [\n      \"conditional_focus_interactive_uitest.cc\",\n      \"display_media_access_handler_interactive_uitest.cc\",\n      \"media_stream_permission_interactive_uitest.cc\",\n      \"webrtc_interactive_uitest.cc\",\n      \"webrtc_mediadevices_interactive_uitest.cc\",\n    ]\n    deps = [\n      \":webrtc\",\n      \":webrtc_browser_tests_base\",\n      \"//base\",\n      \"//chrome/browser/content_settings:content_settings_factory\",\n      \"//chrome/browser/picture_in_picture\",\n      \"//chrome/browser/preloading:test_support\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/ui\",\n      \"//chrome/browser/ui/tabs:tab_strip\",\n      \"//chrome/common\",\n      \"//chrome/test:test_support\",\n      \"//chrome/test:test_support_ui\",\n      \"//chrome/test/base:test_switches\",\n      \"//components/content_settings/core/browser\",\n      \"//components/content_settings/core/common\",\n      \"//components/media_device_salt\",\n      \"//components/permissions:test_support\",\n      \"//components/prefs\",\n      \"//content/public/browser\",\n      \"//content/public/common\",\n      \"//content/test:test_support\",\n      \"//media\",\n      \"//services/network/public/cpp\",\n      \"//services/network/public/mojom\",\n      \"//testing/gtest\",\n      \"//ui/gl\",\n    ]\n\n    if (use_ozone) {\n      deps += [ \"//ui/ozone\" ]\n    }\n  }\n}\n\nif (is_android) {\n  import(\"//build/config/android/rules.gni\")\n\n  java_cpp_enum(\"java_enums\") {\n    sources = [ \"capture_policy_utils.h\" ]\n  }\n}\n"
