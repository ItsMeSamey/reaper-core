substitutions:
- description: Preserve requested surface types in direct Android picker requests.
  regex:
    pattern: "#if BUILDFLAG(IS_ANDROID)\n  picker_params.capture_this_tab"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  picker_params.android_allowed_sources = media_types;\n  picker_params.android_request_document = rfh->GetWeakDocumentPtr();\n  picker_params.capture_this_tab"
