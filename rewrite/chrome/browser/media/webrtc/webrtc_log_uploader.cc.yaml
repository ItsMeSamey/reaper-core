substitutions:
  - description: Preserve Android disabled WebRTC upload completion and local diagnostics
    regex:
      pattern: "    std::unique_ptr<std::string> post_data) {\n"
      replace: "    std::unique_ptr<std::string> post_data) {\n#if BUILDFLAG(IS_ANDROID)\n  // Complete the disabled operation on the owning sequence and release its slot.\n  NotifyUploadDisabled(std::move(upload_done_data));\n#endif\n  return; // feature disabled in Brave\n"
    count: 1
