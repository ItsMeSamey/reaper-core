substitutions:
- description: Carry the original requested Android surface types through the picker.
  regex:
    pattern: '#include <utility>'
    replace: '#include <optional>

      #include <utility>

      #include <vector>'
- description: Carry exact document identity for subframe and main-frame requesters.
  regex:
    pattern: '#include "content/public/browser/web_contents_observer.h"'
    replace: '#include "content/public/browser/web_contents_observer.h"

      #include "content/public/browser/weak_document_ptr.h"'
- description: Keep Android source restrictions explicit even without DesktopMediaList.
  regex:
    pattern: "#if BUILDFLAG(IS_ANDROID)\n    // On Android, this indicates"
    replace: "#if BUILDFLAG(IS_ANDROID)\n    std::vector<DesktopMediaList::Type> android_allowed_sources;\n    std::optional<content::WeakDocumentPtr> android_request_document;\n    // On Android, this indicates"
