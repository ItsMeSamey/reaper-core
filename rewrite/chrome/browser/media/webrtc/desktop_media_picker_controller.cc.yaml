substitutions:
- description: Retain and validate the requested surfaces on Android.
  regex:
    pattern: "  // Android does not use DesktopMediaList. See\n  // DesktopMediaPickerFactoryImpl::CreateMediaList.\n  ShowPickerDialog();"
    replace: "  params_.android_allowed_sources = sources;\n  capture_policy::FilterMediaList(params_.android_allowed_sources,\n                                  params_.allowed_capture_level);\n  if (!std::ranges::any_of(params_.android_allowed_sources, [](auto type) {\n        return type == DesktopMediaList::Type::kWebContents ||\n               type == DesktopMediaList::Type::kCurrentTab ||\n               type == DesktopMediaList::Type::kScreen;\n      })) {\n    OnPickerDialogResults(\n        \"Only tab and whole-screen capture are supported on Android.\", {});\n    return;\n  }\n  ShowPickerDialog();"
