substitutions:
- description: Guard the dedicated desktop password-change service include
  regex:
    pattern: '#include "chrome/browser/password_manager/chrome_password_change_service.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/password_manager/chrome_password_change_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Guard the dedicated password-change mock and factory includes
  regex:
    pattern: '#include "chrome/browser/password_manager/password_change_delegate_mock.h"

      #include "chrome/browser/password_manager/password_change_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/password_manager/password_change_delegate_mock.h"

      #include "chrome/browser/password_manager/password_change_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep the dedicated service mock desktop-only
  regex:
    pattern: "class MockPasswordChangeService : public ChromePasswordChangeService {\n public:\n  MockPasswordChangeService()\n\
      \      : ChromePasswordChangeService(/*pref_service*/ nullptr,\n                                    /*affiliation_service=*/nullptr,\n\
      \                                    /*optimization_keyed_service=*/nullptr,\n                                    /*settings_service=*/nullptr,\n\
      \                                    /*feature_manager=*/nullptr,\n                                    /*log_router*/\
      \ nullptr) {}\n\n  MOCK_METHOD(void,\n              OfferPasswordChangeUi,\n              (password_manager::PasswordForm,\
      \ content::WebContents*),\n              (override));\n  MOCK_METHOD(PasswordChangeDelegate*,\n              GetPasswordChangeDelegate,\n\
      \              (content::WebContents*),\n              (override));\n};\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nclass MockPasswordChangeService : public ChromePasswordChangeService {\n public:\n\
      \  MockPasswordChangeService()\n      : ChromePasswordChangeService(/*pref_service*/ nullptr,\n                    \
      \                /*affiliation_service=*/nullptr,\n                                    /*optimization_keyed_service=*/nullptr,\n\
      \                                    /*settings_service=*/nullptr,\n                                    /*feature_manager=*/nullptr,\n\
      \                                    /*log_router*/ nullptr) {}\n\n  MOCK_METHOD(void,\n              OfferPasswordChangeUi,\n\
      \              (password_manager::PasswordForm, content::WebContents*),\n              (override));\n  MOCK_METHOD(PasswordChangeDelegate*,\n\
      \              GetPasswordChangeDelegate,\n              (content::WebContents*),\n              (override));\n};\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep the dedicated mock factory desktop-only
  regex:
    pattern: "std::unique_ptr<KeyedService> CreateMockPasswordChangeService(\n    content::BrowserContext* context) {\n  return\
      \ std::make_unique<MockPasswordChangeService>();\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::unique_ptr<KeyedService> CreateMockPasswordChangeService(\n    content::BrowserContext*\
      \ context) {\n  return std::make_unique<MockPasswordChangeService>();\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Guard only obsolete Android test-service setup
  regex:
    pattern: "  void SetupMockPasswordChangeService() {\n    PasswordChangeServiceFactory::GetInstance()->SetTestingFactoryAndUse(\n\
      \        profile(), base::BindRepeating(&CreateMockPasswordChangeService));\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void SetupMockPasswordChangeService() {\n    PasswordChangeServiceFactory::GetInstance()->SetTestingFactoryAndUse(\n\
      \        profile(), base::BindRepeating(&CreateMockPasswordChangeService));\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep the dedicated desktop mock accessor with its service
  regex:
    pattern: "  MockPasswordChangeService* password_change_service() {\n    return static_cast<MockPasswordChangeService*>(\n\
      \        PasswordChangeServiceFactory::GetInstance()->GetForProfile(profile()));\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  MockPasswordChangeService* password_change_service() {\n    return static_cast<MockPasswordChangeService*>(\n\
      \        PasswordChangeServiceFactory::GetInstance()->GetForProfile(profile()));\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Preserve ordinary fixture initialization while omitting unavailable Android service construction
  regex:
    pattern: '  SetupMockPasswordChangeService();

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  SetupMockPasswordChangeService();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "Reviewed resource8 after538 source 28/1: Accepted native-test source API maintenance literal"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ mock_at_memory_controller_\\.AsWeakPtr\\(\\),\\\n"
    replace: ""
  count: 1
- description: "Android native integration581, exact reviewed source literal 1: extend-existing-nonAndroid-include-guard-to-unused-AtMemory-header"
  regex:
    pattern: "#include \"chrome/browser/keyboard_accessory/test_utils/android/mock_at_memory_accessory_controller.h\"\n#if !BUILDFLAG(IS_ANDROID)\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/keyboard_accessory/test_utils/android/mock_at_memory_accessory_controller.h\"\n"
  count: 1
- description: "Android native integration581, exact reviewed source literal 2: remove-unused-AtMemory-member-inside-Android-only-fixture"
  regex:
    pattern: "  NiceMock<MockAtMemoryAccessoryController> mock_at_memory_controller_;\n"
    replace: ""
  count: 1
