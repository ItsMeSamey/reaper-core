substitutions:
- description: guard-exclusive-critical-action-types
  regex:
    pattern: '#include "components/critical_actions/core/browser/critical_action_types.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/critical_actions/core/browser/critical_action_types.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: guard-logger-forward-declaration
  regex:
    pattern: 'class PasswordManagerCriticalActionLogger;

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      class PasswordManagerCriticalActionLogger;

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: inherit-existing-base-notification-on-android
  regex:
    pattern: "  void OnPasswordFilled(password_manager::PasswordManagerDriver* driver,\n                        const GURL&\
      \ url) override;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void OnPasswordFilled(password_manager::PasswordManagerDriver* driver,\n     \
      \                   const GURL& url) override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: remove-android-logger-ownership
  regex:
    pattern: "  std::unique_ptr<password_manager::PasswordManagerCriticalActionLogger>\n      critical_action_logger_;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<password_manager::PasswordManagerCriticalActionLogger>\n     \
      \ critical_action_logger_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
