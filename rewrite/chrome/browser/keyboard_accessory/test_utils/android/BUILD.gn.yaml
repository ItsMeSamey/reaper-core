# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AtMemory provider/source omission: chrome/browser/keyboard_accessory/test_utils/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "mock_payment_method_accessory_controller\.cc",\

      \ \ \ \ "mock_payment_method_accessory_controller\.h",\

      \ \ \]\

      \ \ public_deps\ =\ \[\ "\.\./\.\./android"\ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ "//base",\

      '
    replace: "    \"mock_payment_method_accessory_controller.cc\",\n    \"mock_payment_method_accessory_controller.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"mock_at_memory_accessory_controller.cc\",\n      \"mock_at_memory_accessory_controller.h\",\n    ]\n  }\n\n  public_deps = [ \"../../android\" ]\n  deps = [\n    \"//base\",\n"
