# Reaper Android AI physical-purge core caller adapters.
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Show\ an\ Autofill\ AI\ suggestion\ details\ dialog\ with\ suppression\
      action\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ title\ A\ title\ of\ the\ suggestion\ details\ dialog\.\

      \ \ \ \ \ \*\ @param\ body\ The\ body\ of\ the\ suggestion\ details\ dialog\.\

      \ \ \ \ \ \*\ @param\ confirmButtonText\ The\ text\ on\ the\ negative/secondary\
      suppression\ button\ \(e\.g\.\ "Remove\

      \ \ \ \ \ \*\ \ \ \ \ from\ Chrome"\)\.\

      \ \ \ \ \ \*\ @param\ primaryButtonText\ The\ text\ on\ the\ positive/primary\
      acknowledgment\ button\ \(e\.g\.\ "Got\

      \ \ \ \ \ \*\ \ \ \ \ it"\)\.\

      \ \ \ \ \ \*\ @param\ confirmedCallback\ A\ \{@link\ Runnable\}\ to\ trigger\
      upon\ confirming\ suppression\.\

      \ \ \ \ \ \*\ @param\ declinedCallback\ A\ \{@link\ Runnable\}\ to\ trigger\
      upon\ dismissing/acknowledging\.\

      \ \ \ \ \ \*/\

      \ \ \ \ void\ showAutofillAiSuggestionDetails\(\

      \ \ \ \ \ \ \ \ \ \ \ \ String\ title,\

      \ \ \ \ \ \ \ \ \ \ \ \ String\ body,\

      \ \ \ \ \ \ \ \ \ \ \ \ String\ confirmButtonText,\

      \ \ \ \ \ \ \ \ \ \ \ \ String\ primaryButtonText,\

      \ \ \ \ \ \ \ \ \ \ \ \ Runnable\ confirmedCallback,\

      \ \ \ \ \ \ \ \ \ \ \ \ Runnable\ declinedCallback\);'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Informs\ the\ component\ whether\ an\ asynchronous\ action\ is\
      pending\.\ If\ true,\ the\ component\ might\

      \ \ \ \ \ \*\ defer\ closing\ the\ soft\ keyboard\.\ If\ false,\ it\ clears\
      this\ state\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ waiting\ Whether\ an\ asynchronous\ action\ is\ pending\.\

      \ \ \ \ \ \*/\

      \ \ \ \ void\ setWaitingForFetch\(boolean\ waiting\);'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Dismisses\ the\ component\ only\ if\ it\ is\ currently\ waiting\
      for\ an\ asynchronous\ fetch\ to\

      \ \ \ \ \ \*\ complete\.\ This\ allows\ consecutive\ calls\ to\ the\ component\
      to\ interrupt\ and\ cancel\ this\ delayed\

      \ \ \ \ \ \*\ dismiss\.\

      \ \ \ \ \ \*/\

      \ \ \ \ void\ dismissIfWaitingForFetch\(\);'
    replace: ''
