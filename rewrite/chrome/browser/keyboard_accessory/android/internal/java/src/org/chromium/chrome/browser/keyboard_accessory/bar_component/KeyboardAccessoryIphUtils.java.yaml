substitutions:

# Reaper Source330 optional AtMemory accessory implementation closure.
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: '\ \ \ \ static\ void\ emitFillingEvent\(Tracker\ tracker,\ String\
        feature\)\ \{\

        \ \ \ \ \ \ \ \ if\ \(!tracker\.isInitialized\(\)\)\ return;\

        \ \ \ \ \ \ \ \ switch\ \(feature\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ FeatureConstants\.KEYBOARD_ACCESSORY_AT_MEMORY_FEATURE:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tracker\.notifyEvent\(EventConstants\.KEYBOARD_ACCESSORY_AT_MEMORY_USED\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ FeatureConstants\.KEYBOARD_ACCESSORY_AUTOFILL_AI_VALUABLES_FEATURE:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tracker\.notifyEvent\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ EventConstants\.KEYBOARD_ACCESSORY_AUTOFILL_AI_VALUABLES_AUTOFILLED\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ FeatureConstants\.KEYBOARD_ACCESSORY_ACCOUNT_NAME_EMAIL_SUGGESTION_FEATURE:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tracker\.notifyEvent\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ EventConstants\.KEYBOARD_ACCESSORY_ACCOUNT_NAME_EMAIL_AUTOFILLED\);\

        '
      replace: "    static void emitFillingEvent(Tracker tracker, String feature) {\n\
        \        if (!tracker.isInitialized()) return;\n        switch (feature) {\n\
        \            case FeatureConstants.KEYBOARD_ACCESSORY_ACCOUNT_NAME_EMAIL_SUGGESTION_FEATURE:\n\
        \                tracker.notifyEvent(\n                        EventConstants.KEYBOARD_ACCESSORY_ACCOUNT_NAME_EMAIL_AUTOFILLED);\n"
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ R\.string\.iph_keyboard_accessory_enable_loyalty_cards;\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ FeatureConstants\.KEYBOARD_ACCESSORY_ACCOUNT_NAME_EMAIL_SUGGESTION_FEATURE:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ R\.string\.iph_keyboard_accessory_account_name_email_suggestion;\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ FeatureConstants\.KEYBOARD_ACCESSORY_AUTOFILL_AI_VALUABLES_FEATURE:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ R\.string\.iph_keyboard_accessory_autofill_ai_valuables_iph;\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ FeatureConstants\.KEYBOARD_ACCESSORY_AT_MEMORY_FEATURE:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ R\.string\.iph_keyboard_accessory_at_memory;\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ assert\ false\ :\ "Unknown\ help\ text\ for\ feature:\ "\ \+\
        feature;\

        \ \ \ \ \ \ \ \ return\ 0;\

        '
      replace: "                return R.string.iph_keyboard_accessory_enable_loyalty_cards;\n\
        \            case FeatureConstants.KEYBOARD_ACCESSORY_ACCOUNT_NAME_EMAIL_SUGGESTION_FEATURE:\n\
        \                return R.string.iph_keyboard_accessory_account_name_email_suggestion;\n\
        \        }\n        assert false : \"Unknown help text for feature: \" + feature;\n\
        \        return 0;\n"
