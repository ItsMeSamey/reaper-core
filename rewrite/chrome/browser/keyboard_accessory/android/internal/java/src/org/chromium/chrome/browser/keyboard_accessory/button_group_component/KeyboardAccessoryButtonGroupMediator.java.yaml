substitutions:

# Reaper Source330 optional AtMemory accessory implementation closure.
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: 'package\ org\.chromium\.chrome\.browser\.keyboard_accessory\.button_group_component;\

        \

        import\ static\ org\.chromium\.chrome\.browser\.keyboard_accessory\.button_group_component\.KeyboardAccessoryButtonGroupProperties\.ACTIVE_TAB;\

        import\ static\ org\.chromium\.chrome\.browser\.keyboard_accessory\.button_group_component\.KeyboardAccessoryButtonGroupProperties\.AT_MEMORY_CALLBACK;\

        import\ static\ org\.chromium\.chrome\.browser\.keyboard_accessory\.button_group_component\.KeyboardAccessoryButtonGroupProperties\.AT_MEMORY_ENABLED;\

        import\ static\ org\.chromium\.chrome\.browser\.keyboard_accessory\.button_group_component\.KeyboardAccessoryButtonGroupProperties\.BUTTON_SELECTION_CALLBACKS;\

        import\ static\ org\.chromium\.chrome\.browser\.keyboard_accessory\.button_group_component\.KeyboardAccessoryButtonGroupProperties\.TABS;\

        \

        '
      replace: 'package org.chromium.chrome.browser.keyboard_accessory.button_group_component;


        import static org.chromium.chrome.browser.keyboard_accessory.button_group_component.KeyboardAccessoryButtonGroupProperties.ACTIVE_TAB;

        import static org.chromium.chrome.browser.keyboard_accessory.button_group_component.KeyboardAccessoryButtonGroupProperties.BUTTON_SELECTION_CALLBACKS;

        import static org.chromium.chrome.browser.keyboard_accessory.button_group_component.KeyboardAccessoryButtonGroupProperties.TABS;


        '
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: 'class\ KeyboardAccessoryButtonGroupMediator\

        \ \ \ \ \ \ \ \ implements\ KeyboardAccessoryButtonGroupView\.KeyboardAccessoryButtonGroupListener,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PropertyObservable\.PropertyObserver<PropertyKey>,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ KeyboardAccessoryCoordinator\.TabSwitchingDelegate,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ KeyboardAccessoryCoordinator\.AtMemoryDelegate\
        \{\

        \ \ \ \ private\ final\ PropertyModel\ mModel;\

        \ \ \ \ private\ @Nullable\ AccessoryTabObserver\ mAccessoryTabObserver;\

        \

        '
      replace: "class KeyboardAccessoryButtonGroupMediator\n        implements KeyboardAccessoryButtonGroupView.KeyboardAccessoryButtonGroupListener,\n\
        \                PropertyObservable.PropertyObserver<PropertyKey>,\n       \
        \         KeyboardAccessoryCoordinator.TabSwitchingDelegate {\n    private final\
        \ PropertyModel mModel;\n    private @Nullable AccessoryTabObserver mAccessoryTabObserver;\n\
        \n"
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ closeActiveTab\(\);\ //\ Make\ sure\ the\
        active\ tab\ is\ reset\ for\ a\ modified\ tab\ list\.\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ if\ \(propertyKey\ ==\ BUTTON_SELECTION_CALLBACKS\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ propertyKey\ ==\ AT_MEMORY_CALLBACK\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ propertyKey\ ==\ AT_MEMORY_ENABLED\)\
        \{\

        \ \ \ \ \ \ \ \ \ \ \ \ return;\

        \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ assert\ false\ :\ "Every\ property\ update\ needs\ to\ be\ handled\
        explicitly!";\

        '
      replace: "            closeActiveTab(); // Make sure the active tab is reset for\
        \ a modified tab list.\n            return;\n        }\n        if (propertyKey\
        \ == BUTTON_SELECTION_CALLBACKS) {\n            return;\n        }\n       \
        \ assert false : \"Every property update needs to be handled explicitly!\";\n"
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ mModel\.set\(ACTIVE_TAB,\ position\ >=\ mModel\.get\(TABS\)\.size\(\)\
        \?\ null\ :\ position\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Override\

        \ \ \ \ public\ void\ setAtMemoryEnabled\(boolean\ enabled\)\ \{\

        \ \ \ \ \ \ \ \ mModel\.set\(AT_MEMORY_ENABLED,\ enabled\);\

        \ \ \ \ \}\

        \

        \ \ \ \ @Override\

        \ \ \ \ public\ void\ setAtMemoryCallback\(Runnable\ callback\)\ \{\

        \ \ \ \ \ \ \ \ mModel\.set\(AT_MEMORY_CALLBACK,\ callback\);\

        \ \ \ \ \}\

        \

        \ \ \ \ void\ setTabObserver\(AccessoryTabObserver\ accessoryTabObserver\)\
        \{\

        \ \ \ \ \ \ \ \ mAccessoryTabObserver\ =\ accessoryTabObserver;\

        \ \ \ \ \}\

        '
      replace: "        mModel.set(ACTIVE_TAB, position >= mModel.get(TABS).size() ?\
        \ null : position);\n    }\n\n    void setTabObserver(AccessoryTabObserver accessoryTabObserver)\
        \ {\n        mAccessoryTabObserver = accessoryTabObserver;\n    }\n"
