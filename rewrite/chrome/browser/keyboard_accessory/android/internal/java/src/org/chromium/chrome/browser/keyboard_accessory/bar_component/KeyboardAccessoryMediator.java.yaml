      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ChromeFeatureList\.AUTOFILL_AI_LIMIT_SUGGESTION_WIDTH\);\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: ''
