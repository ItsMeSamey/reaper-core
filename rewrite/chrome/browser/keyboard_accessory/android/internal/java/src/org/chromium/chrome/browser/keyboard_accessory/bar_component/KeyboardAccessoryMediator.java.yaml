substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove actual AI-only histogram name and reporting branch
  regex:
    re_pattern: '\ \ \ \ private\ static\ final\ String\ UMA_AUTOFILL_AI_SETTINGS_LINKOUT_DIALOG\
      =\

      \ \ \ \ \ \ \ \ \ \ \ \ "Autofill\.Ai\.SettingsLinkoutDialog";\

      \

      '
    replace: ''
- description: Remove AI-only dialog ownership
  regex:
    re_pattern: '\ \ \ \ private\ final\ @Nullable\ ActionConfirmationDialog\ mDialog;\

      '
    replace: ''
- description: Narrow actual mediator constructor; sole ordinary Coordinator call
    is adapted separately
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ ModalDialogManager\ modalDialogManager,\

      '
    replace: ''
- description: Remove concrete AI dialog construction
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mDialog\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ modalDialogManager\ !=\ null\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ new\ ActionConfirmationDialog\(context,\
      modalDialogManager\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ null;\

      \

      '
    replace: ''
- description: Keep ordinary acceptance callback and real selected-action metrics
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(suggestion\.showLoadingOnAcceptance\(\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ showLoadingUIOnSuggestion\(suggestion\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ delegate\.suggestionAccepted\(pos,\
      suggestion\.showLoadingOnAcceptance\(\)\);'
    replace: '                    delegate.suggestionAccepted(pos);'
- description: Long press continues normal deletion without the AI settings linkout
    dialog
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(maybeShowDialogOnLongPress\(delegate,\
      suggestion\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      '
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ maybeShowDialogOnLongPress\(\

      \ \ \ \ \ \ \ \ \ \ \ \ AutofillDelegate\ delegate,\ AutofillSuggestion\ suggestion\)\
      \{\

      \ \ \ \ \ \ \ \ AutofillAiPayload\ payload\ =\ suggestion\.getAutofillAiPayload\(\);\

      \ \ \ \ \ \ \ \ if\ \(payload\ ==\ null\ \|\|\ mDialog\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ EntityDataManager\ entityDataManager\ =\ EntityDataManagerFactory\.getForProfile\(mProfile\);\

      \ \ \ \ \ \ \ \ if\ \(entityDataManager\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ EntityInstance\ entityInstance\ =\ entityDataManager\.getEntityInstance\(payload\.getGuid\(\)\);\

      \ \ \ \ \ \ \ \ if\ \(entityInstance\ ==\ null\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ entityInstance\.getRecordType\(\)\ !=\
      RecordType\.PERSONAL_CONTEXT\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ !shouldOpenSettingsForEntityType\(entityInstance\.getEntityType\(\)\.getTypeName\(\)\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ String\ sublabel\ =\ suggestion\.getSublabel\(\);\

      \ \ \ \ \ \ \ \ if\ \(sublabel\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ mDialog\.show\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ ConfirmationDialogParams\.Builder\(mContext\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withTitle\(sublabel\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withDescription\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mContext\.getString\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ R\.string\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ \ \ \ \ \ \ \ \ \.autofill_ai_suggestion_long_press_dialog_description\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withPositiveButton\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mContext\.getString\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ R\.string\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ \ \ \ \ \ \ \ \ \.autofill_ai_suggestion_long_press_dialog_positive_button\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.withNegativeButton\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mContext\.getString\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ R\.string\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ \ \ \ \ \ \ \ \ \.autofill_ai_suggestion_long_press_dialog_negative_button\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.build\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(dismissHandler,\ buttonClickResult,\ stopShowing\)\
      \->\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ handleDialogAction\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ delegate,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ entityInstance\.getEntityType\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ dismissHandler,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ buttonClickResult,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ stopShowing\)\);\

      \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ shouldOpenSettingsForEntityType\(@EntityTypeName\
      int\ entityType\)\ \{\

      \ \ \ \ \ \ \ \ switch\ \(entityType\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ EntityTypeName\.PASSPORT:\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ EntityTypeName\.DRIVERS_LICENSE:\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ EntityTypeName\.NATIONAL_ID_CARD:\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ EntityTypeName\.KNOWN_TRAVELER_NUMBER:\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ EntityTypeName\.REDRESS_NUMBER:\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ EntityTypeName\.VEHICLE:\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ EntityTypeName\.ORDER:\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ EntityTypeName\.FLIGHT_RESERVATION:\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ EntityTypeName\.SHIPMENT:\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \ \ \ \ \ \ \ \ default:\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ private\ @DialogDismissType\ int\ handleDialogAction\(\

      \ \ \ \ \ \ \ \ \ \ \ \ AutofillDelegate\ delegate,\

      \ \ \ \ \ \ \ \ \ \ \ \ EntityType\ entityType,\

      \ \ \ \ \ \ \ \ \ \ \ \ DismissHandler\ unusedDismissHandler,\

      \ \ \ \ \ \ \ \ \ \ \ \ @ButtonClickResult\ int\ buttonClickResult,\

      \ \ \ \ \ \ \ \ \ \ \ \ boolean\ unusedStopShowing\)\ \{\

      \ \ \ \ \ \ \ \ boolean\ isPositive\ =\ buttonClickResult\ ==\ ButtonClickResult\.POSITIVE;\

      \ \ \ \ \ \ \ \ RecordHistogram\.recordBooleanHistogram\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ UMA_AUTOFILL_AI_SETTINGS_LINKOUT_DIALOG\ \+\
      "\."\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \+\ entityType\.getTypeNameAsMetricsString\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isPositive\);\

      \ \ \ \ \ \ \ \ if\ \(isPositive\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ Need\ to\ go\ through\ C\+\+\ because\ `SettingsNavigationHelper`\
      is\ in\ `chrome_java`\.\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ Keyboard\ accessory\ Java\ code\ should\ not\ depend\
      on\ `chrome_java`\.\

      \ \ \ \ \ \ \ \ \ \ \ \ delegate\.openSettingsForEntityType\(entityType\.getTypeName\(\)\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ return\ DialogDismissType\.DISMISS_IMMEDIATELY;\

      \ \ \ \ \}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ private\ void\ updateActionBarItemsState\(\

      \ \ \ \ \ \ \ \ \ \ \ \ ListModel<BarItem>\ barItems,\ AutofillSuggestion\ acceptedSuggestion\)\
      \{\

      \ \ \ \ \ \ \ \ //\ Ungroup\ the\ elements,\ make\ all\ elements\ disabled\
      and\ show\ loading\ UI\ for\ the\ accepted\

      \ \ \ \ \ \ \ \ //\ item\.\

      \ \ \ \ \ \ \ \ List<ActionBarItem>\ listOfBarItems\ =\ ungroupBarItems\(barItems\);\

      \ \ \ \ \ \ \ \ for\ \(ActionBarItem\ actionBarItem\ :\ listOfBarItems\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ actionBarItem\.setEnabled\(false\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(actionBarItem\ instanceof\ AutofillBarItem\ autofillBarItem\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ autofillBarItem\.setLoading\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ autofillBarItem\.getSuggestion\(\)\.equals\(acceptedSuggestion\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ //\ Update\ the\ UI\ once\ the\ data\ model\ is\ updated\.\

      \ \ \ \ \ \ \ \ for\ \(int\ i\ =\ 0;\ i\ <\ barItems\.size\(\);\ i\+\+\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ barItems\.update\(i,\ barItems\.get\(i\)\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ private\ void\ showLoadingUIOnSuggestion\(AutofillSuggestion\
      acceptedSuggestion\)\ \{\

      \ \ \ \ \ \ \ \ updateActionBarItemsState\(mModel\.get\(BAR_ITEMS\),\ acceptedSuggestion\);\

      \ \ \ \ \ \ \ \ updateActionBarItemsState\(mModel\.get\(BAR_ITEMS_FIXED\),\
      acceptedSuggestion\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove AI provider width policy, preserve ordinary ADDRESS width calculation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(fillingProduct\ ==\ FillingProduct\.AUTOFILL_AI\)\
      \{\

