substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Match real nine-argument ordinary mediator constructor after AI-only
    dialog input removal
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ modalDialogManager,\

      '
    replace: ''

# Reaper Source330 optional AtMemory accessory implementation closure.
- description: Reaper Android physical AtMemory accessory and optional Autofill-AI
    promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
    behavior.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \*\ @return\ True\ if\ there\ is\ at\ least\ one\
      tab,\ false\ otherwise\.\

      \ \ \ \ \ \ \ \ \ \*/\

      \ \ \ \ \ \ \ \ boolean\ hasTabs\(\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\ Interface\ for\ callbacks\ related\ to\ the\ At\ Memory\ feature\.\
      \*/\

      \ \ \ \ public\ interface\ AtMemoryDelegate\ \{\

      \ \ \ \ \ \ \ \ /\*\*\

      \ \ \ \ \ \ \ \ \ \*\ Set\ the\ At\ Memory\ enablement\.\

      \ \ \ \ \ \ \ \ \ \*\

      \ \ \ \ \ \ \ \ \ \*\ @param\ enabled\ True\ if\ At\ Memory\ should\ be\ enabled,\
      false\ otherwise\.\

      \ \ \ \ \ \ \ \ \ \*/\

      \ \ \ \ \ \ \ \ void\ setAtMemoryEnabled\(boolean\ enabled\);\

      \

      \ \ \ \ \ \ \ \ /\*\*\

      \ \ \ \ \ \ \ \ \ \*\ Set\ the\ At\ Memory\ callback\.\

      \ \ \ \ \ \ \ \ \ \*\

      \ \ \ \ \ \ \ \ \ \*\ @param\ callback\ The\ callback\ to\ be\ invoked\ when\
      the\ At\ Memory\ button\ is\ clicked\.\

      \ \ \ \ \ \ \ \ \ \*/\

      \ \ \ \ \ \ \ \ void\ setAtMemoryCallback\(Runnable\ callback\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      '
    replace: "         * @return True if there is at least one tab, false otherwise.\n\
      \         */\n        boolean hasTabs();\n    }\n\n    /**\n"
- description: Reaper Android physical AtMemory accessory and optional Autofill-AI
    promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
    behavior.
  regex:
    re_pattern: '\

      \ \ \ \ public\ void\ setTabs\(KeyboardAccessoryData\.Tab\[\]\ tabs\)\ \{\

      \ \ \ \ \ \ \ \ mButtonGroup\.getTabSwitchingDelegate\(\)\.setTabs\(tabs\);\

      \ \ \ \ \}\

      \

      \ \ \ \ public\ void\ setAtMemoryCallback\(Runnable\ callback\)\ \{\

      \ \ \ \ \ \ \ \ mButtonGroup\.getAtMemoryDelegate\(\)\.setAtMemoryCallback\(callback\);\

      \ \ \ \ \}\

      \

      \ \ \ \ public\ void\ setAtMemoryEnabled\(boolean\ enabled\)\ \{\

      \ \ \ \ \ \ \ \ mButtonGroup\.getAtMemoryDelegate\(\)\.setAtMemoryEnabled\(enabled\);\

      \ \ \ \ \}\

      \

      \ \ \ \ public\ void\ setActiveTab\(@AccessoryTabType\ int\ tabType\)\ \{\

      '
    replace: "\n    public void setTabs(KeyboardAccessoryData.Tab[] tabs) {\n    \
      \    mButtonGroup.getTabSwitchingDelegate().setTabs(tabs);\n    }\n\n    public\
      \ void setActiveTab(@AccessoryTabType int tabType) {\n"
