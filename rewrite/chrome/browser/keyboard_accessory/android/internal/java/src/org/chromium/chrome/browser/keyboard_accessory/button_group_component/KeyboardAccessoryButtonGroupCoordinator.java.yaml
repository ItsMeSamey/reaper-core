        \ \ \ \ \ \ \ \ return\ mMediator;\

        \ \ \ \ \}\

        \

        \ \ \ \ /\*\*\

        \ \ \ \ \ \*\ Adds\ a\ \{@link\ AccessoryTabObserver\}\ that\ is\ notified\
        about\ events\ emitted\ when\ a\ tab\ changes\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @param\ accessoryTabObserver\ The\ component\ to\ be\ notified\
