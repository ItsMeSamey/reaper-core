        actions\.\

        \ \ \ \ \ \*\

        \ \ \ \ \ \*\ @return\ A\ \{@link\ KeyboardAccessoryCoordinator\.AtMemoryDelegate\}\.\

        \ \ \ \ \ \*/\

        \ \ \ \ public\ KeyboardAccessoryCoordinator\.AtMemoryDelegate\ getAtMemoryDelegate\(\)\
