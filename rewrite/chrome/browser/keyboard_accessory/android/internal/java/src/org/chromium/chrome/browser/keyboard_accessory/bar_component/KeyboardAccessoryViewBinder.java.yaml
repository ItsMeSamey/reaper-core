# Reaper Source330 optional AtMemory accessory implementation closure.
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: 'import\ org\.chromium\.components\.autofill\.SuggestionType;\

        import\ org\.chromium\.components\.browser_ui\.widget\.chips\.ChipView;\

        import\ org\.chromium\.components\.feature_engagement\.FeatureConstants;\

        import\ org\.chromium\.components\.feature_engagement\.Tracker;\

        import\ org\.chromium\.ui\.modelutil\.PropertyKey;\

        import\ org\.chromium\.ui\.modelutil\.PropertyModel;\

        import\ org\.chromium\.ui\.widget\.ButtonCompat;\

        '
      replace: 'import org.chromium.components.autofill.SuggestionType;

        import org.chromium.components.browser_ui.widget.chips.ChipView;

        import org.chromium.components.feature_engagement.FeatureConstants;

        import org.chromium.ui.modelutil.PropertyKey;

        import org.chromium.ui.modelutil.PropertyModel;

        import org.chromium.ui.widget.ButtonCompat;

        '
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ uiConfiguration\.suggestionDrawableFunction,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ viewType\);\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ BarItem\.Type\.TAB_LAYOUT:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ new\ SheetOpenerViewHolder\(parent,\
        keyboardAccessory\);\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ BarItem\.Type\.ACTION_BUTTON:\

        \ \ \ \ \ \ \ \ \ \ \ \ case\ BarItem\.Type\.DISMISS_CHIP:\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ new\ BarItemTextViewHolder\(parent,\
        viewType\);\

        '
      replace: "                        uiConfiguration.suggestionDrawableFunction,\n\
        \                        viewType);\n            case BarItem.Type.TAB_LAYOUT:\n\
        \                return new SheetOpenerViewHolder(parent);\n            case\
        \ BarItem.Type.ACTION_BUTTON:\n            case BarItem.Type.DISMISS_CHIP:\n\
        \                return new BarItemTextViewHolder(parent, viewType);\n"
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: '\ \ \ \ static\ class\ SheetOpenerViewHolder\

        \ \ \ \ \ \ \ \ \ \ \ \ extends\ BarItemViewHolder<SheetOpenerBarItem,\ KeyboardAccessoryButtonGroupView>\
        \{\

        \ \ \ \ \ \ \ \ private\ @MonotonicNonNull\ SheetOpenerBarItem\ mSheetOpenerItem;\

        \ \ \ \ \ \ \ \ private\ final\ KeyboardAccessoryView\ mKeyboardAccessory;\

        \

        \ \ \ \ \ \ \ \ SheetOpenerViewHolder\(ViewGroup\ parent,\ KeyboardAccessoryView\
        keyboardAccessory\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ super\(parent,\ R\.layout\.keyboard_accessory_buttons\);\

        \ \ \ \ \ \ \ \ \ \ \ \ mKeyboardAccessory\ =\ keyboardAccessory;\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ KeyboardAccessoryButtonGroupView\ view\ =\ \(KeyboardAccessoryButtonGroupView\)\
        itemView;\

        \ \ \ \ \ \ \ \ \ \ \ \ view\.setAtMemoryIphCallback\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Tracker\ tracker\ =\ mKeyboardAccessory\.getFeatureEngagementTracker\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(tracker\ !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ KeyboardAccessoryIphUtils\.emitFillingEvent\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tracker,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ FeatureConstants\.KEYBOARD_ACCESSORY_AT_MEMORY_FEATURE\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ @Override\

        '
      replace: "    static class SheetOpenerViewHolder\n            extends BarItemViewHolder<SheetOpenerBarItem,\
        \ KeyboardAccessoryButtonGroupView> {\n        private @MonotonicNonNull SheetOpenerBarItem\
        \ mSheetOpenerItem;\n\n        SheetOpenerViewHolder(ViewGroup parent) {\n \
        \           super(parent, R.layout.keyboard_accessory_buttons);\n        }\n\
        \n        @Override\n"
  - description: Reaper Android physical AtMemory accessory and optional Autofill-AI
      promo caller closure; preserve ordinary filling, tab/view lifecycle and supported-field
      behavior.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ GRAYED_OUT_OPACITY_ALPHA\);\

        \ \ \ \ \ \ \ \ \ \ \ \ sheetOpenerItem\.notifyAboutViewCreation\(itemView\);\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ //\ The\ `ViewRectProvider`\ used\ by\ `getAtMemoryIphRectProvider\(\)`\
        requires\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ the\ view\ to\ be\ attached\ to\ the\ window\.\
        `post\(\)`\ ensures\ that\ the\ view\

        \ \ \ \ \ \ \ \ \ \ \ \ //\ is\ attached\ and\ laid\ out\ before\ attempting\
        to\ show\ the\ IPH\.\

        \ \ \ \ \ \ \ \ \ \ \ \ view\.post\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ The\ ViewHolder\ might\
        be\ recycled\ before\ the\ posted\ runnable\ executes\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(mSheetOpenerItem\ !=\
        sheetOpenerItem\)\ return;\

        \

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ RectProvider\ atMemoryIphRectProvider\
        =\ view\.getAtMemoryIphRectProvider\(\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(atMemoryIphRectProvider\
        !=\ null\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ boolean\ isIphShown\
        =\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ showHelpBubble\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ mKeyboardAccessory\.getFeatureEngagementTracker\(\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ FeatureConstants\.KEYBOARD_ACCESSORY_AT_MEMORY_FEATURE,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ atMemoryIphRectProvider,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ view\.getContext\(\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ view\.getRootView\(\),\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \(\)\ \->\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \ \ \ \ \ \ \ \ mKeyboardAccessory\.setAllowClicksWhileObscured\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ false\)\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Only\ set\ to\ true\
        so\ we\ don''t\ overwrite\ a\ true\ value\ that\ was\ set\ by\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ another\ IPH\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ The\ value\ is\
        reset\ to\ false\ when\ the\ user\ clicks\ anywhere\ on\ the\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ screen\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(isIphShown\)\
        mKeyboardAccessory\.setAllowClicksWhileObscured\(true\);\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

        \ \ \ \ \ \ \ \ \}\

        \

        \ \ \ \ \ \ \ \ @Override\

        '
      replace: "                            : GRAYED_OUT_OPACITY_ALPHA);\n         \
        \   sheetOpenerItem.notifyAboutViewCreation(itemView);\n\n        }\n\n    \
        \    @Override\n"
