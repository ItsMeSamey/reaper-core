  regex:
    re_pattern: '\ \ \ \ \ \ <message\ name="IDS_IPH_KEYBOARD_ACCESSORY_FILL_WITH_CHROME"\ desc="Text\ in\ In\-Product\-Help\ bubble\ suggesting\ to\ use\ an\ autofill\ suggestion\ provided\ by\ Chrome\.">\

