      \ \ \ \ \ \ \ \ Enhanced\ autofill\ can\ now\ find\ and\ fill\ your\ info\ from\ apps\ like\ Gmail\ and\ Photos\

      \ \ \ \ \ \ </message>\

      \ \ \ \ \ \ <message\ name="IDS_IPH_KEYBOARD_ACCESSORY_AUTOFILL_AI_VALUABLES_IPH"\ desc="Text\ in\ In\-Product\-Help\ with\ an\ item\ from\ Google\ Wallet">\

      \ \ \ \ \ \ \ \ Now\ you\ can\ autofill\ more\ info\ from\ Google\ Wallet\.\ Manage\ your\ information\ or\ turn\ these\ suggestions\ off\ in\ Settings\.\

      \ \ \ \ \ \ </message>\

      \ \ \ \ \ \ <message\ name="IDS_IPH_KEYBOARD_ACCESSORY_HOME_WORK_PROFILE_SUGGESTION"\ desc="Text\ in\ the\ In\-Product\-Help\ bubble\ for\ a\ home\ or\ work\ Autofill\ profile\ suggestion\.">\

      \ \ \ \ \ \ \ \ Autofill\ your\ home\ and\ work\ addresses\ from\ your\ Google\ Account\

      \ \ \ \ \ \ </message>\

      '
    replace: "      <message name=\"IDS_IPH_KEYBOARD_ACCESSORY_FILL_WITH_CHROME\" desc=\"Text in In-Product-Help bubble suggesting to use an autofill suggestion provided by Chrome.\">\n        Use Chrome autofill suggestion\n      </message>\n      <message name=\"IDS_IPH_KEYBOARD_ACCESSORY_HOME_WORK_PROFILE_SUGGESTION\" desc=\"Text in the In-Product-Help bubble for a home or work Autofill profile suggestion.\">\n        Autofill your home and work addresses from your Google Account\n      </message>\n"
- description: 'Android optional search-spark and accessory message resource removal: chrome/browser/keyboard_accessory/android/internal/java/strings/android_keyboard_accessory_strings.grd'
  regex:
    re_pattern: '\ \ \ \ \ \ </message>\

