# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AtMemory provider/source omission: chrome/browser/keyboard_accessory/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "password_accessory_controller\.h",\

      \ \ \ \ "payment_method_accessory_controller\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ "//base",\

      '
    replace: "    \"password_accessory_controller.h\",\n    \"payment_method_accessory_controller.h\",\n  ]\n\n  if (is_android) {\n    public -= [ \"at_memory_accessory_controller.h\" ]\n  }\n\n  public_deps = [\n    \"//base\",\n"
- description: 'Android concrete AtMemory provider/source omission: chrome/browser/keyboard_accessory/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "payment_method_accessory_controller_impl\.cc",\

      \ \ \ \ "payment_method_accessory_controller_impl\.h",\

      \ \ \]\

      \ \ public_deps\ =\ \[\

      \ \ \ \ ":android",\

      \ \ \ \ "//chrome/browser:browser_public_dependencies",\

      '
    replace: "    \"payment_method_accessory_controller_impl.cc\",\n    \"payment_method_accessory_controller_impl.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"at_memory_accessory_controller_impl.cc\",\n      \"at_memory_accessory_controller_impl.h\",\n    ]\n  }\n  public_deps = [\n    \":android\",\n    \"//chrome/browser:browser_public_dependencies\",\n"
