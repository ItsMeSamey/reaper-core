# Android omits AtMemory while retaining ordinary manual filling providers.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/keyboard_accessory/android/manual_filling_controller_impl.h'
  regex:
    re_pattern: '\#include\ "base/containers/flat_set\.h"\

      \#include\ "base/functional/callback_forward\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "chrome/browser/autofill/manual_filling_view_interface\.h"\

      \#include\ "chrome/browser/keyboard_accessory/android/accessory_controller\.h"\

      \#include\ "chrome/browser/keyboard_accessory/android/accessory_sheet_enums\.h"\

      '
    replace: '#include "base/containers/flat_set.h"

      #include "base/functional/callback_forward.h"

      #include "base/memory/weak_ptr.h"

      #include "build/build_config.h"

      #include "chrome/browser/autofill/manual_filling_view_interface.h"

      #include "chrome/browser/keyboard_accessory/android/accessory_controller.h"

      #include "chrome/browser/keyboard_accessory/android/accessory_sheet_enums.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/keyboard_accessory/android/manual_filling_controller_impl.h'
  regex:
    re_pattern: 'class\ PaymentMethodAccessoryController;\

      \}\ \ //\ namespace\ autofill\

      \

      class\ AtMemoryAccessoryController;\

      class\ PasswordAccessoryController;\

      \

      //\ Use\ ManualFillingController::GetOrCreate\ to\ obtain\ instances\ of\ this\ class\.\

      '
    replace: 'class PaymentMethodAccessoryController;

      }  // namespace autofill


      #if !BUILDFLAG(IS_ANDROID)

      class AtMemoryAccessoryController;

      #endif  // !BUILDFLAG(IS_ANDROID)

      class PasswordAccessoryController;


      // Use ManualFillingController::GetOrCreate to obtain instances of this class.

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/keyboard_accessory/android/manual_filling_controller_impl.h'
  regex:
    re_pattern: '\ \ \ \ \ \ base::WeakPtr<autofill::AddressAccessoryController>\ address_controller,\

      \ \ \ \ \ \ base::WeakPtr<autofill::PaymentMethodAccessoryController>\

      \ \ \ \ \ \ \ \ \ \ payment_method_controller,\

      \ \ \ \ \ \ base::WeakPtr<AtMemoryAccessoryController>\ at_memory_controller,\

      \ \ \ \ \ \ std::unique_ptr<ManualFillingViewInterface>\ test_view\);\

      \

      \#if\ defined\(UNIT_TEST\)\

      '
    replace: "      base::WeakPtr<autofill::AddressAccessoryController> address_controller,\n      base::WeakPtr<autofill::PaymentMethodAccessoryController>\n          payment_method_controller,\n#if !BUILDFLAG(IS_ANDROID)\n      base::WeakPtr<AtMemoryAccessoryController> at_memory_controller,\n#endif  // !BUILDFLAG(IS_ANDROID)\n      std::unique_ptr<ManualFillingViewInterface> test_view);\n\n#if defined(UNIT_TEST)\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/keyboard_accessory/android/manual_filling_controller_impl.h'
  regex:
    re_pattern: '\ \ \ \ \ \ base::WeakPtr<autofill::AddressAccessoryController>\ address_controller,\

      \ \ \ \ \ \ base::WeakPtr<autofill::PaymentMethodAccessoryController>\

      \ \ \ \ \ \ \ \ \ \ payment_method_controller,\

      \ \ \ \ \ \ base::WeakPtr<AtMemoryAccessoryController>\ at_memory_controller,\

      \ \ \ \ \ \ std::unique_ptr<ManualFillingViewInterface>\ view\);\

      \

      \ \ //\ Returns\ true\ if\ the\ keyboard\ accessory\ needs\ to\ be\ shown\ for\ last\ focused\

      '
    replace: "      base::WeakPtr<autofill::AddressAccessoryController> address_controller,\n      base::WeakPtr<autofill::PaymentMethodAccessoryController>\n          payment_method_controller,\n#if !BUILDFLAG(IS_ANDROID)\n      base::WeakPtr<AtMemoryAccessoryController> at_memory_controller,\n#endif  // !BUILDFLAG(IS_ANDROID)\n      std::unique_ptr<ManualFillingViewInterface> view);\n\n  // Returns true if the keyboard accessory needs to be shown for last focused\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/keyboard_accessory/android/manual_filling_controller_impl.h'
  regex:
    re_pattern: '\ \ base::WeakPtr<autofill::AddressAccessoryController>\ address_controller_;\

      \ \ base::WeakPtr<autofill::PaymentMethodAccessoryController>\

      \ \ \ \ \ \ payment_method_controller_;\

      \ \ base::WeakPtr<AtMemoryAccessoryController>\ at_memory_controller_;\

      \

      \ \ //\ Hold\ the\ native\ instance\ of\ the\ view\.\ Must\ be\ last\ declared\ and\ initialized\

      \ \ //\ member\ so\ the\ view\ can\ be\ created\ in\ the\ constructor\ with\ a\ fully\ set\ up\

      '
    replace: "  base::WeakPtr<autofill::AddressAccessoryController> address_controller_;\n  base::WeakPtr<autofill::PaymentMethodAccessoryController>\n      payment_method_controller_;\n#if !BUILDFLAG(IS_ANDROID)\n  base::WeakPtr<AtMemoryAccessoryController> at_memory_controller_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  // Hold the native instance of the view. Must be last declared and initialized\n  // member so the view can be created in the constructor with a fully set up\n"
