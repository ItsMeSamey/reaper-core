# Android Chromium Discover implementation exclusion.
substitutions:
- description: Add the deps the Brave prefs overrides need.
  add_literal_to_list:
    target: impl
    list_name: deps
    literal: brave_chrome_browser_prefs_impl_deps
    import: //brave/browser/sources.gni
- description: Exclude Android Discover implementation from the production native or resource graph
  regex:
    re_pattern: '\ \ \ \ \ \ "//components/feed/core/common:feed_core_common",\

      '
    replace: ''
- description: Exclude Android Discover implementation from the production native or resource graph
  regex:
    re_pattern: '\ \ \ \ \ \ "//components/feed/core/v2:ios_shared",\

      '
    replace: ''

- description: 'Android concrete AI source/provider removal: chrome/browser/prefs/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//services/preferences/tracked:features",\

      \ \ \ \ "//ui/webui:buildflags",\

      \ \ \]\

      \ \ deps\ \+=\ brave_chrome_browser_prefs_impl_deps\

      \

      \ \ if\ \(enable_print_preview\)\ \{\

      '
    replace: "    \"//services/preferences/tracked:features\",\n    \"//ui/webui:buildflags\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/autocomplete:aim_eligibility_service\",\n      \"//chrome/browser/background/glic\",\n      \"//chrome/browser/context_hub\",\n      \"//chrome/browser/glic\",\n      \"//chrome/browser/glic/suggestions\",\n      \"//components/contextual_tasks/public\",\n      \"//components/skills/public\",\n    ]\n  }\n  deps += brave_chrome_browser_prefs_impl_deps\n\n  if (enable_print_preview) {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/prefs/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//components/live_caption",\

      \ \ \ \ \ \ "//components/live_caption:live_translate",\

      \ \ \ \ \]\

      \ \ \ \ sources\ \+=\ \[\

      \ \ \ \ \ \ "persistent_renderer_prefs_manager\.cc",\

      \ \ \ \ \ \ "persistent_renderer_prefs_manager_factory\.cc",\

      '
    replace: "      \"//components/live_caption\",\n      \"//components/live_caption:live_translate\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/actor/ui\" ]\n    }\n    sources += [\n      \"persistent_renderer_prefs_manager.cc\",\n      \"persistent_renderer_prefs_manager_factory.cc\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/prefs/BUILD.gn'
  regex:
    re_pattern: '\

      \ \ if\ \(!is_android\ \|\|\ is_desktop_android\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/ui/ai_overlay_dialog"\ \]\

      \ \ \}\

      \

      \ \ if\ \(enable_extensions\)\ \{\

      '
    replace: "\n  if (!is_android || is_desktop_android) {\n    deps += [ \"//chrome/browser/ui/ai_overlay_dialog\" ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/ui/ai_overlay_dialog\" ]\n    }\n  }\n\n  if (enable_extensions) {\n"
