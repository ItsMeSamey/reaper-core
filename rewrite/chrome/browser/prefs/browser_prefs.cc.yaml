# Android Chromium Discover implementation exclusion.
substitutions:
- description: 'Register Brave local state prefs.


    RegisterLocalStatePrefsForMigration is intentionally the last thing

    RegisterLocalState calls, so preempting it runs Brave''s registration

    right before that.

    '
  preempt_function_impl:
    function_name: RegisterLocalStatePrefsForMigration
    code: brave::RegisterLocalStatePrefs(registry);
- description: Register Brave profile prefs at the end of RegisterProfilePrefs.
  after_function_impl:
    function_name: RegisterProfilePrefs
    code: brave::RegisterProfilePrefs(registry);
- description: 'Don''t delete the Login Data files on Android.


    Upstream removes the login database during this pref migration, but Brave

    needs to keep it, otherwise passwords are wiped and recreated on every

    app start.

    '
  regex:
    re_pattern: (profile_prefs->ClearPref\(kObsoleteUpmAutoExportCsvNeedsDeletion\);\n)(.*?Login Data For Account-journal"\)\)\);\n)
    re_flags:
    - DOTALL
    replace: '\1#if 0

      \2#endif

      '
- description: 'Run Brave''s profile pref migrations that must precede Chromium''s own.


    Some of these move a Chromium pref into a Brave one, so they need to

    run before Chromium''s own migration reads or clears it.

    '
  preempt_function_impl:
    function_name: MigrateObsoleteProfilePrefs
    code: MigrateObsoleteBraveProfilePrefsBeforeChromium(profile_prefs);
- description: Run the rest of Brave's obsolete profile pref migrations.
  after_function_impl:
    function_name: MigrateObsoleteProfilePrefs
    code: "MigrateObsoleteBraveProfilePrefsAfterChromium(profile_prefs,\n                                               profile_path);"
- description: Run Brave's obsolete local state pref migrations.
  after_function_impl:
    function_name: MigrateObsoleteLocalStatePrefs
    code: MigrateObsoleteBraveLocalStatePrefsAfterChromium(local_state);
- description: Move image animation preference registration into the extension core.
  regex:
    pattern: '#include "chrome/browser/accessibility/animation_policy_prefs.h"

      '
    replace: ''
- description: Include image animation preferences alongside shared extension prefs.
  regex:
    pattern: '#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)

      #include "chrome/browser/extensions/activity_log/activity_log.h"'
    replace: '#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)

      #include "chrome/browser/accessibility/animation_policy_prefs.h"

      #include "chrome/browser/extensions/activity_log/activity_log.h"'
- description: Remove desktop-only image animation registration.
  regex:
    pattern: '  RegisterAnimationPolicyPrefs(registry);

      '
    replace: ''
- description: Register image animation policy for Android extension profiles.
  regex:
    pattern: '  extensions::util::RegisterProfilePrefs(registry);'
    replace: "  RegisterAnimationPolicyPrefs(registry);\n  extensions::util::RegisterProfilePrefs(registry);"
