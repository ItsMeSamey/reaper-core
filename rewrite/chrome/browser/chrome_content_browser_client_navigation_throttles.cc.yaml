- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_content_browser_client_navigation_throttles.cc'
  regex:
    re_pattern: '\ \ //\ AimEligibilityRefreshNavigationThrottle\ must\ be\ registered\ before\

      \ \ //\ ContextualTasksNavigationThrottle\ so\ it\ can\ detect\ AIM\ URL\ navigations\

      \ \ //\ before\ ContextualTasksNavigationThrottle\ intercepts\ them\.\

      \ \ AimEligibilityRefreshNavigationThrottle::MaybeCreateAndAdd\(registry\);\

      \

      \ \ if\ \(contextual_tasks::IsContextualTasksUIEnabled\(\)\ \|\|\

      \ \ \ \ \ \ base::FeatureList::IsEnabled\(\

      \ \ \ \ \ \ \ \ \ \ contextual_tasks::kContextualTasksUrlRedirectToAimUrl\)\)\ \{\

      \ \ \ \ contextual_tasks::ContextualTasksNavigationThrottle::MaybeCreateAndAdd\(\

      \ \ \ \ \ \ \ \ registry\);\

      \ \ \}\

      \

      \#if\ BUILDFLAG\(ENABLE_DEVTOOLS_FRONTEND\)\

      \ \ DevToolsWindow::MaybeCreateAndAddNavigationThrottle\(registry\);\

      '
    replace: "  // AimEligibilityRefreshNavigationThrottle must be registered before\n  // ContextualTasksNavigationThrottle so it can detect AIM URL navigations\n  // before ContextualTasksNavigationThrottle intercepts them.\n#if !BUILDFLAG(IS_ANDROID)\n  AimEligibilityRefreshNavigationThrottle::MaybeCreateAndAdd(registry);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if !BUILDFLAG(IS_ANDROID)\n  if (contextual_tasks::IsContextualTasksUIEnabled() ||\n      base::FeatureList::IsEnabled(\n          contextual_tasks::kContextualTasksUrlRedirectToAimUrl)) {\n    contextual_tasks::ContextualTasksNavigationThrottle::MaybeCreateAndAdd(\n        registry);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n\n#if BUILDFLAG(ENABLE_DEVTOOLS_FRONTEND)\n  DevToolsWindow::MaybeCreateAndAddNavigationThrottle(registry);\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_content_browser_client_navigation_throttles.cc'
  regex:
    re_pattern: '\ \ DevToolsNavigationThrottle::MaybeCreateAndAdd\(registry\);\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      \

      \ \ actor::ActorNavigationThrottle::MaybeCreateAndAdd\(registry\);\

      \

      \ \ dom_distiller::DistillerPageWebContents::MaybeCreateAndAddNavigationThrottle\(\

      \ \ \ \ \ \ registry\);\

      '
    replace: "  DevToolsNavigationThrottle::MaybeCreateAndAdd(registry);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if !BUILDFLAG(IS_ANDROID)\n  actor::ActorNavigationThrottle::MaybeCreateAndAdd(registry);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  dom_distiller::DistillerPageWebContents::MaybeCreateAndAddNavigationThrottle(\n      registry);\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_content_browser_client_navigation_throttles.cc'
  regex:
    re_pattern: '\

      \ \ webapps::WebAppUrlLoader::MaybeCreateAndAddNavigationThrottle\(registry\);\

      \

      \ \ glic::GlicNavigationThrottle::MaybeCreateAndAdd\(registry\);\

      \ \ glic::GlicGuestNavigationThrottle::MaybeCreateAndAdd\(registry\);\

      \

      \ \ pwc::PwcNavigationThrottle::MaybeCreateAndAdd\(registry\);\

      \}\

      '
    replace: "\n  webapps::WebAppUrlLoader::MaybeCreateAndAddNavigationThrottle(registry);\n\n#if !BUILDFLAG(IS_ANDROID)\n  glic::GlicNavigationThrottle::MaybeCreateAndAdd(registry);\n  glic::GlicGuestNavigationThrottle::MaybeCreateAndAdd(registry);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  pwc::PwcNavigationThrottle::MaybeCreateAndAdd(registry);\n}\n"
