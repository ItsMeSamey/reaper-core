# Android real split persistence and recently-closed restoration.
substitutions:
- description: Carry split identity, orientation, ratio and leading/trailing order across restart
  count: 1
  regex:
    re_pattern: \ \ \ \ public\ @Nullable\ Token\ tabGroupId;
    replace: "    public @Nullable Token tabGroupId;\n\n    /** Optional native split identity and visual state. Old files restore unsplit. */\n    public @Nullable Token splitTabId;\n    public int splitLayout;\n    public double splitRatio = 0.5;\n    public int splitPosition = -1;"
- description: Format modified Android split persistence Java sources
  count: 1
  regex:
    re_pattern: '\ \ \ \ public\ @Nullable\ Token\ tabGroupId;\

      \

      \ \ \ \ /\*\*\ Optional\ native\ split\ identity\ and\ visual\ state\.\ Old\ files\ restore\ unsplit\.\ \*/\

      \ \ \ \ public\ @Nullable\ Token\ splitTabId;\

      \ \ \ \ public\ int\ splitLayout;\

      \ \ \ \ public\ double\ splitRatio\ =\ 0\.5;\

      \ \ \ \ public\ int\ splitPosition\ =\ \-1;\

      \

      '
    replace: "    public @Nullable Token tabGroupId;\n\n    /** Optional native split identity and visual state. Old files restore unsplit. */\n    public @Nullable Token splitTabId;\n\n    public int splitLayout;\n    public double splitRatio = 0.5;\n    public int splitPosition = -1;\n\n"

# Reaper Android containers lifecycle successor; retain the complete inherited recipe.
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ public\ @Nullable\ WebContentsState\ contentsState;\

      \

      \ \ \ \ public\ int\ parentId\ =\ Tab\.INVALID_TAB_ID;\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ The\ legacy\ tab\ group\ ID\.\ This\ field\ is\ replaced\ by\ \{@link\ tabGroupId\}\.\

      '
    replace: "    public @Nullable WebContentsState contentsState;\n\n    public int parentId = Tab.INVALID_TAB_ID;\n\n    /** Stable storage-container UUID. Absent older state restores the default partition. */\n    public String containerId = \"\";\n\n    /**\n     * The legacy tab group ID. This field is replaced by {@link tabGroupId}.\n"
