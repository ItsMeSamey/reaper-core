# Android real split persistence and recently-closed restoration.
substitutions:
- description: Serialize the active native split mirror, never a historical close snapshot
  count: 1
  regex:
    re_pattern: \ \ \ \ \ \ \ \ tabState\.isPinned\ =\ tab\.getIsPinned\(\);
    replace: "        tabState.isPinned = tab.getIsPinned();\n        tabState.splitTabId = tab.getSplitTabId();\n        tabState.splitLayout = tab.getSplitLayout();\n        tabState.splitRatio = tab.getSplitRatio();\n        tabState.splitPosition = tab.getSplitPosition();"

# Reaper Android containers lifecycle successor; retain the complete inherited recipe.
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ tabState\.contentsState\ =\ getWebContentsState\(tab\);\

      \ \ \ \ \ \ \ \ tabState\.openerAppId\ =\ TabAssociatedApp\.getAppId\(tab\);\

      \ \ \ \ \ \ \ \ tabState\.parentId\ =\ tab\.getParentId\(\);\

      \ \ \ \ \ \ \ \ tabState\.timestampMillis\ =\ tab\.getTimestampMillis\(\);\

      \ \ \ \ \ \ \ \ tabState\.tabLaunchTypeAtCreation\ =\ tab\.getTabLaunchTypeAtCreation\(\);\

      \ \ \ \ \ \ \ \ //\ Don''t\ save\ the\ actual\ default\ theme\ color\ because\ it\ could\ change\ on\ night\ mode\ state\

      '
    replace: "        tabState.contentsState = getWebContentsState(tab);\n        tabState.openerAppId = TabAssociatedApp.getAppId(tab);\n        tabState.parentId = tab.getParentId();\n        String containerId = tab.getContainerId();\n        tabState.containerId = containerId == null ? \"\" : containerId;\n        tabState.timestampMillis = tab.getTimestampMillis();\n        tabState.tabLaunchTypeAtCreation = tab.getTabLaunchTypeAtCreation();\n        // Don't save the actual default theme color because it could change on night mode state\n"
