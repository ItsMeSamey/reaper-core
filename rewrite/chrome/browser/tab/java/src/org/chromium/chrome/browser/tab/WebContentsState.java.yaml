# Preserve Android serialized pending and committed tab metadata.
substitutions:
- description: "Preserve serialized pending and committed metadata (literal 1)"
  regex:
    re_pattern: "\\ \\ \\ \\ private\\ boolean\\ mMetadataLoaded;\\\n"
    replace: "    private boolean mMetadataLoaded;\n    private @Nullable WebContentsStateMetadata mLastCommittedMetadata;\n    private boolean mLastCommittedMetadataLoaded;\n"
- description: "Preserve serialized pending and committed metadata (literal 2)"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ if\\ \\(other\\.mMetadataLoaded\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mMetadata\\ =\\ other\\.mMetadata;\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mMetadataLoaded\\ =\\ true;\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\}\\\n"
    replace: "        if (other.mMetadataLoaded) {\n            mMetadata = other.mMetadata;\n            mMetadataLoaded = true;\n        }\n        if (other.mLastCommittedMetadataLoaded) {\n            mLastCommittedMetadata = other.mLastCommittedMetadata;\n            mLastCommittedMetadataLoaded = true;\n        }\n"
- description: "Preserve serialized pending and committed metadata (literal 3)"
  regex:
    re_pattern: "\\ \\ \\ \\ /\\*\\*\\ Returns\\ the\\ title\\ currently\\ being\\ displayed\\ in\\ the\\ saved\\ state's\\ current\\ entry\\.\\ \\*/\\\n"
    replace: "    /** Returns whether the current serialized entry is a deferred navigation. */\n    public boolean hasPendingNavigation() {\n        return mPackedData.lastEntryWasPending();\n    }\n\n    /** Returns committed metadata without inflating a deferred serialized navigation. */\n    public @Nullable WebContentsStateMetadata getLastCommittedMetadata() {\n        if (!hasPendingNavigation()) return getMetadata();\n        if (!mLastCommittedMetadataLoaded && version() != INVALID_BUFFER_VERSION) {\n            mLastCommittedMetadata = WebContentsStateJni.get().getLastCommittedMetadata(\n                    buffer(), version());\n            mLastCommittedMetadataLoaded = true;\n        }\n        return mLastCommittedMetadata;\n    }\n\n    /** Returns the title currently being displayed in the saved state's current entry. */\n"
- description: "Preserve serialized pending and committed metadata (literal 4)"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ mMetadata\\ =\\ null;\\\n\\ \\ \\ \\ \\ \\ \\ \\ mMetadataLoaded\\ =\\ false;\\\n"
    replace: "        mMetadata = null;\n        mMetadataLoaded = false;\n        mLastCommittedMetadata = null;\n        mLastCommittedMetadataLoaded = false;\n"
- description: "Preserve serialized pending and committed metadata (literal 5)"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ @Nullable\\ WebContentsStateMetadata\\ getMetadata\\(ByteBuffer\\ buffer,\\ int\\ version\\);"
    replace: "        @Nullable WebContentsStateMetadata getMetadata(ByteBuffer buffer, int version);\n\n        @Nullable WebContentsStateMetadata getLastCommittedMetadata(ByteBuffer buffer, int version);"

# Reaper Android containers lifecycle successor; retain the complete inherited recipe.
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.restoreContentsFromByteBuffer\(profile,\ buffer\(\),\ version\(\),\ isHidden,\ noRenderer\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Deletes\ navigation\ entries\ from\ this\ \{@link\ WebContentsState\}\ matching\ the\ predicate\.\

      \ \ \ \ \ \*\

      '
    replace: "                .restoreContentsFromByteBuffer(profile, buffer(), version(), isHidden, noRenderer);\n    }\n\n    /** Parse persisted partition keys without creating or retagging WebContents. */\n    public @Nullable String[] getSerializedContainerIds() {\n        return WebContentsStateJni.get().getSerializedContainerIds(buffer(), version());\n    }\n\n    /** Distinguishes a readable conflicting jar from ordinary corrupt navigation data. */\n    public boolean hasContainerIdentityConflict(Profile profile, String containerId) {\n        return WebContentsStateJni.get().hasContainerIdentityConflict(\n                profile, buffer(), version(), containerId);\n    }\n\n    /** Restores contents only in the tab's pre-admitted immutable partition. */\n    public @Nullable WebContents restoreWebContents(\n            Profile profile, boolean isHidden, boolean noRenderer, String containerId) {\n        return WebContentsStateJni.get()\n                .restoreContentsFromByteBufferForContainer(\n                        profile, buffer(), version(), isHidden, noRenderer, containerId);\n    }\n\n    /**\n     * Deletes navigation entries from this {@link WebContentsState} matching the predicate.\n     *\n"
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ @NativeMethods\

      \ \ \ \ @VisibleForTesting\(otherwise\ =\ VisibleForTesting\.PACKAGE_PRIVATE\)\

      \ \ \ \ public\ interface\ Natives\ \{\

      \ \ \ \ \ \ \ \ @Nullable\

      \ \ \ \ \ \ \ \ @JniType\("content::WebContents\*"\)\

      \ \ \ \ \ \ \ \ WebContents\ restoreContentsFromByteBuffer\(\

      '
    replace: "    @NativeMethods\n    @VisibleForTesting(otherwise = VisibleForTesting.PACKAGE_PRIVATE)\n    public interface Natives {\n        @Nullable String[] getSerializedContainerIds(ByteBuffer buffer, int savedStateVersion);\n\n        boolean hasContainerIdentityConflict(\n                @JniType(\"Profile*\") Profile profile, ByteBuffer buffer,\n                int savedStateVersion, @JniType(\"std::string\") String containerId);\n\n        @Nullable\n        @JniType(\"content::WebContents*\")\n        WebContents restoreContentsFromByteBufferForContainer(\n                @JniType(\"Profile*\") Profile profile,\n                ByteBuffer buffer,\n                int savedStateVersion,\n                boolean isHidden,\n                boolean noRenderer,\n                @JniType(\"std::string\") String containerId);\n\n        @Nullable\n        @JniType(\"content::WebContents*\")\n        WebContents restoreContentsFromByteBuffer(\n"
- description: Describe native serialized-ID extraction as a nullable array of non-null strings in the public provider
  regex:
    pattern: '    public @Nullable String[] getSerializedContainerIds() {

      '
    replace: '    public String @Nullable [] getSerializedContainerIds() {

      '
  count: 1
