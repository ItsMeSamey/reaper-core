substitutions:
- description: Remove the shopping-specific close branch and preserve native generic cleanup
  regex:
    pattern: "        // TODO(crbug.com/40187854) ensure we cleanup ShoppingPersistedTabData on startup\n        ShoppingPersistedTabData\
      \ shoppingPersistedTabData =\n                tab.getUserDataHost().getUserData(ShoppingPersistedTabData.class);\n \
      \       if (shoppingPersistedTabData != null) {\n            shoppingPersistedTabData.disableSaving();\n        }\n"
    replace: ''
  count: 1
- description: Make the existing maintenance test accessor available to the cross-package integration fixture
  regex:
    pattern: "    protected static Set<Class<? extends PersistedTabData>>\n            getSupportedMaintenanceClassesForTesting()\
      \ {\n"
    replace: "    @VisibleForTesting\n    public static Set<Class<? extends PersistedTabData>>\n            getSupportedMaintenanceClassesForTesting()\
      \ {\n"
  count: 1
