# Android real split persistence and recently-closed restoration.
substitutions:
- description: Expose mirrored real split metadata and value-owned pre-close snapshots without a tabmodel dependency
  count: 1
  regex:
    re_pattern: '\ \ \ \ long\ INVALID_TIMESTAMP\ =\ \-1;\

      '
    replace: "    long INVALID_TIMESTAMP = -1;\n\n    /** A value snapshot used only while a real split is closing. */\n    final class SplitData {\n        private final Token mToken;\n        private final int mLayout;\n        private final double mRatio;\n        private final int mPosition;\n\n        public SplitData(Token token, int layout, double ratio, int position) {\n            mToken = token;\n            mLayout = layout;\n            mRatio = ratio;\n            mPosition = position;\n        }\n\n        public Token getToken() { return mToken; }\n        public int getLayout() { return mLayout; }\n        public double getRatio() { return mRatio; }\n        public int getPosition() { return mPosition; }\n\n        public static boolean isValid(@Nullable Token token, int layout, double ratio, int position) {\n            return token != null && !token.isZero() && (layout == 0 || layout == 1)\n                    && Double.isFinite(ratio) && ratio > 0 && ratio < 1\n                    && (position == 0 || position == 1);\n        }\n    }\n\n    /** Mirrored native split membership; persisted state is restored into the native model. */\n    default @Nullable Token getSplitTabId() { return null; }\n    default int getSplitLayout() { return 0; }\n    default double getSplitRatio() { return 0.5; }\n    default int getSplitPosition() { return -1; }\n    default void setSplitData(@Nullable Token token, int layout, double ratio, int position) {}\n    default void captureSplitDataForClosure() {}\n    default @Nullable SplitData getSplitDataForClosure() { return null; }\n    default void clearSplitDataForClosure() {}\n\n"
- description: Format modified Android split persistence Java sources
  count: 1
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ mRatio\ =\ ratio;\

      \ \ \ \ \ \ \ \ \ \ \ \ mPosition\ =\ position;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ public\ Token\ getToken\(\)\ \{\ return\ mToken;\ \}\

      \ \ \ \ \ \ \ \ public\ int\ getLayout\(\)\ \{\ return\ mLayout;\ \}\

      \ \ \ \ \ \ \ \ public\ double\ getRatio\(\)\ \{\ return\ mRatio;\ \}\

      \ \ \ \ \ \ \ \ public\ int\ getPosition\(\)\ \{\ return\ mPosition;\ \}\

      \

      \ \ \ \ \ \ \ \ public\ static\ boolean\ isValid\(@Nullable\ Token\ token,\ int\ layout,\ double\ ratio,\ int\ position\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ token\ !=\ null\ \&\&\ !token\.isZero\(\)\ \&\&\ \(layout\ ==\ 0\ \|\|\ layout\ ==\ 1\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ Double\.isFinite\(ratio\)\ \&\&\ ratio\ >\ 0\ \&\&\ ratio\ <\ 1\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ \(position\ ==\ 0\ \|\|\ position\ ==\ 1\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\ Mirrored\ native\ split\ membership;\ persisted\ state\ is\ restored\ into\ the\ native\ model\.\ \*/\

      \ \ \ \ default\ @Nullable\ Token\ getSplitTabId\(\)\ \{\ return\ null;\ \}\

      \ \ \ \ default\ int\ getSplitLayout\(\)\ \{\ return\ 0;\ \}\

      \ \ \ \ default\ double\ getSplitRatio\(\)\ \{\ return\ 0\.5;\ \}\

      \ \ \ \ default\ int\ getSplitPosition\(\)\ \{\ return\ \-1;\ \}\

      \ \ \ \ default\ void\ setSplitData\(@Nullable\ Token\ token,\ int\ layout,\ double\ ratio,\ int\ position\)\ \{\}\

      \ \ \ \ default\ void\ captureSplitDataForClosure\(\)\ \{\}\

      \ \ \ \ default\ @Nullable\ SplitData\ getSplitDataForClosure\(\)\ \{\ return\ null;\ \}\

      \ \ \ \ default\ void\ clearSplitDataForClosure\(\)\ \{\}\

      \

      \

      \ \ \ \ @IntDef\(\{TabLoadStatus\.PAGE_LOAD_FAILED,\ TabLoadStatus\.DEFAULT_PAGE_LOAD\}\)\

      \ \ \ \ @Retention\(RetentionPolicy\.SOURCE\)\

      \ \ \ \ @interface\ TabLoadStatus\ \{\

      '
    replace: "            mRatio = ratio;\n            mPosition = position;\n        }\n\n        public Token getToken() {\n            return mToken;\n        }\n\n        public int getLayout() {\n            return mLayout;\n        }\n\n        public double getRatio() {\n            return mRatio;\n        }\n\n        public int getPosition() {\n            return mPosition;\n        }\n\n        public static boolean isValid(\n                @Nullable Token token, int layout, double ratio, int position) {\n            return token != null\n                    && !token.isZero()\n                    && (layout == 0 || layout == 1)\n                    && Double.isFinite(ratio)\n                    && ratio > 0\n                    && ratio < 1\n                    && (position == 0 || position == 1);\n        }\n    }\n\n    /** Mirrored native split membership; persisted state is restored into the native model. */\n    default @Nullable Token getSplitTabId() {\n        return null;\n    }\n\n    default int getSplitLayout() {\n        return 0;\n    }\n\n    default double getSplitRatio() {\n        return 0.5;\n    }\n\n    default int getSplitPosition() {\n        return -1;\n    }\n\n    default void setSplitData(@Nullable Token token, int layout, double ratio, int position) {}\n\n    default void captureSplitDataForClosure() {}\n\n    default @Nullable SplitData getSplitDataForClosure() {\n        return null;\n    }\n\n    default void clearSplitDataForClosure() {}\n\n    @IntDef({TabLoadStatus.PAGE_LOAD_FAILED, TabLoadStatus.DEFAULT_PAGE_LOAD})\n    @Retention(RetentionPolicy.SOURCE)\n    @interface TabLoadStatus {\n"

# Reaper Android containers lifecycle successor; retain the complete inherited recipe.
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ /\*\*\ Returns\ the\ Profile\ this\ tab\ is\ associated\ with\.\ \*/\

      \ \ \ \ Profile\ getProfile\(\);\

      \

      \ \ \ \ /\*\*\ Returns\ the\ web\ contents\ associated\ with\ this\ tab\.\ \*/\

      \ \ \ \ @Nullable\ WebContents\ getWebContents\(\);\

      \

      '
    replace: "    /** Returns the Profile this tab is associated with. */\n    Profile getProfile();\n\n    /** Pure persistence syntax check; no native service or UI target dependency. */\n    static boolean isContainerIdWellFormed(@Nullable String id) {\n        if (id == null) return false;\n        if (id.isEmpty()) return true;\n        String uuid = id.startsWith(\"t-\") ? id.substring(2) : id;\n        try {\n            return java.util.UUID.fromString(uuid).toString().equals(uuid);\n        } catch (IllegalArgumentException ex) {\n            return false;\n        }\n    }\n\n    /** Immutable storage-container UUID; the empty string is the default partition. */\n    default String getContainerId() {\n        return \"\";\n    }\n\n    /** Returns the web contents associated with this tab. */\n    @Nullable WebContents getWebContents();\n\n"
