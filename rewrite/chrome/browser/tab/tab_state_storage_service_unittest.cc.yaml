- description: 'Reaper Android container inventory: settle an abandoned deferred reply on its originating sequence.'
  regex:
    re_pattern: 'namespace\ \{\

      \

      constexpr\ char\ kInventoryNamedId\[\]'
    replace: "TEST_F(TabStateStorageServiceTest,\n       ContainerInventoryDeferredReplyCompletesOnceOnOriginSequence) {\n\
      \  FlushOperations();\n  int replies = 0;\n  auto origin = base::SequencedTaskRunner::GetCurrentDefault();\n  {\n  \
      \  auto batch = service()->CreateScopedBatch();\n    service()->GetPersistedContainerIds(base::BindOnce(\n        [](scoped_refptr<base::SequencedTaskRunner>\
      \ origin, int* replies,\n           std::optional<std::vector<std::string>> ids) {\n          EXPECT_TRUE(origin->RunsTasksInCurrentSequence());\n\
      \          ASSERT_TRUE(ids);\n          EXPECT_TRUE(ids->empty());\n          ++*replies;\n        },\n        origin,\
      \ &replies));\n    EXPECT_EQ(replies, 0);\n  }\n  FlushOperations();\n  task_environment_.RunUntilIdle();\n  EXPECT_EQ(replies,\
      \ 1);\n}\n\nTEST_F(TabStateStorageServiceTest,\n       ContainerInventoryCancelledDeferredReplyIsUnavailableOnOriginSequence)\
      \ {\n  FlushOperations();\n  int replies = 0;\n  auto origin = base::SequencedTaskRunner::GetCurrentDefault();\n  {\n\
      \    auto batch = service()->CreateScopedBatch();\n    service()->GetPersistedContainerIds(base::BindOnce(\n       \
      \ [](scoped_refptr<base::SequencedTaskRunner> origin, int* replies,\n           std::optional<std::vector<std::string>>\
      \ ids) {\n          EXPECT_TRUE(origin->RunsTasksInCurrentSequence());\n          EXPECT_FALSE(ids);\n          ++*replies;\n\
      \        },\n        origin, &replies));\n    EXPECT_EQ(replies, 0);\n  }\n  // Retire the service before the deferred\
      \ reply can run on this sequence.\n  // The batch has already closed, so no ScopedBatch holds a retired builder.\n \
      \ service_.reset();\n  task_environment_.RunUntilIdle();\n  EXPECT_EQ(replies, 1);\n}\n\nnamespace {\n\nconstexpr char\
      \ kInventoryNamedId[]"
