# Reaper Android containers lifecycle; complete raw-pin ancestry.
substitutions:
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\

      \#include\ <cstdint>\

      \#include\ <memory>\

      \#include\ <optional>\

      \#include\ <string>\

      \#include\ <string_view>\

      \#include\ <vector>\

      \

      \#include\ "base/containers/span\.h"\

      \#include\ "base/files/file_path\.h"\

      \#include\ "base/functional/callback\.h"\

      \#include\ "base/types/pass_key\.h"\

      '
    replace: '

      #include <cstdint>

      #include <memory>

      #include <string>

      #include <optional>

      #include <string>

      #include <string_view>

      #include <vector>


      #include "base/containers/span.h"

      #include "build/build_config.h"

      #include "base/files/file_path.h"

      #include "base/functional/callback.h"

      #include "base/types/pass_key.h"

      '
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ std::string_view\ window_tag,\

      \ \ \ \ \ \ bool\ is_off_the_record,\

      \ \ \ \ \ \ std::unique_ptr<StorageLoadedData::Builder>\ builder\);\

      \

      \ \ //\ Clears\ all\ nodes\ from\ the\ database\.\

      \ \ void\ ClearAllNodes\(\);\

      '
    replace: "      std::string_view window_tag,\n      bool is_off_the_record,\n      std::unique_ptr<StorageLoadedData::Builder> builder);\n\n#if BUILDFLAG(IS_ANDROID)\n  // All normal-window/archive tab payloads; nullopt on any read/parse failure.\n  std::optional<std::vector<std::string>> GetPersistedContainerIds();\n#endif\n\n  // Clears all nodes from the database.\n  void ClearAllNodes();\n"
