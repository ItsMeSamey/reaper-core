# Preserve Android serialized pending and committed tab metadata.
substitutions:
- description: "Preserve serialized pending and committed metadata (literal 1)"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ std::string\\*\\ virtual_url\\);"
    replace: "                              std::string* virtual_url,\n                              bool skip_pending_entry = false);"

# Reaper Android containers lifecycle successor; retain the complete inherited recipe.
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ base::span<const\ uint8_t>\ buffer,\

      \ \ \ \ \ \ int\ saved_state_version,\

      \ \ \ \ \ \ bool\ initially_hidden,\

      \ \ \ \ \ \ bool\ no_renderer\);\

      \

      \ \ //\ Restores\ a\ WebContents\ from\ the\ passed\ in\ WebContentsStateByteBuffer\.\

      \ \ static\ std::unique_ptr<content::WebContents>\ RestoreContentsFromByteBuffer\(\

      \ \ \ \ \ \ content::BrowserContext\*\ browser_context,\

      \ \ \ \ \ \ const\ WebContentsStateByteBuffer\*\ byte_buffer,\

      \ \ \ \ \ \ bool\ initially_hidden,\

      \ \ \ \ \ \ bool\ no_renderer\);\

      \

      \ \ //\ Extracts\ state\ and\ navigation\ entries\ from\ the\ given\ Pickle\ data\ and\

      \ \ //\ returns\ whether\ un\-pickling\ the\ data\ succeeded\.\

      '
    replace: "      base::span<const uint8_t> buffer,\n      int saved_state_version,\n      bool initially_hidden,\n      bool no_renderer,\n      std::optional<std::string_view> container_id = std::nullopt);\n\n  // Restores a WebContents from the passed in WebContentsStateByteBuffer.\n  static std::unique_ptr<content::WebContents> RestoreContentsFromByteBuffer(\n      content::BrowserContext* browser_context,\n      const WebContentsStateByteBuffer* byte_buffer,\n      bool initially_hidden,\n      bool no_renderer,\n      std::optional<std::string_view> container_id = std::nullopt);\n\n  // Extracts state and navigation entries from the given Pickle data and\n  // returns whether un-pickling the data succeeded.\n"
