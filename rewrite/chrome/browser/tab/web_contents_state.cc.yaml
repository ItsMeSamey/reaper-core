- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\

      //\ Static\ JNI\ methods\.\

      \

      static\ content::WebContents\*\ JNI_WebContentsState_RestoreContentsFromByteBuffer\(\

      \ \ \ \ JNIEnv\*\ env,\

      \ \ \ \ Profile\*\ profile,\

      '
    replace: "\n// Static JNI methods.\n\nstatic ScopedJavaLocalRef<jobjectArray>\nJNI_WebContentsState_GetSerializedContainerIds(\n    JNIEnv* env, const JavaRef<jobject>& state, int saved_state_version) {\n  bool is_off_the_record = false;\n  int selected = 0;\n  std::vector<sessions::SerializedNavigationEntry> navigations;\n  auto bytes = base::android::JavaByteBufferToSpan(env, state);\n  if (!WebContentsState::ExtractNavigationEntries(\n          bytes, saved_state_version, &is_off_the_record, &selected,\n          &navigations) || is_off_the_record) {\n    return ScopedJavaLocalRef<jobjectArray>();\n  }\n  std::vector<std::string> ids;\n  for (const auto& navigation : navigations) {\n    const auto& key = navigation.storage_partition_key();\n    if (!key) continue;\n    if (key->first != \"containers\" || key->second.empty() ||\n        !containers::android::IsContainerIdWellFormed(key->second)) {\n      return ScopedJavaLocalRef<jobjectArray>();\n    }\n    if (!ids.empty() && ids.front() != key->second) {\n      return ScopedJavaLocalRef<jobjectArray>();\n    }\n    ids.push_back(key->second);\n  }\n  return base::android::ToJavaArrayOfStrings(env, ids);\n}\n\nstatic bool JNI_WebContentsState_HasContainerIdentityConflict(\n    JNIEnv* env, Profile* profile, const JavaRef<jobject>& state,\n    int saved_state_version, const std::string& container_id) {\n  bool is_off_the_record = profile->IsOffTheRecord();\n  int selected = 0;\n  std::vector<sessions::SerializedNavigationEntry> navigations;\n  auto bytes = base::android::JavaByteBufferToSpan(env, state);\n  if (!WebContentsState::ExtractNavigationEntries(\n          bytes, saved_state_version, &is_off_the_record, &selected, &navigations)) {\n    return false; // Ordinary corrupt data may use the separately persisted jar.\n  }\n  if (is_off_the_record != profile->IsOffTheRecord()) return true;\n  for (const auto& navigation : navigations) {\n    const auto& key = navigation.storage_partition_key();\n    if (key && (key->first != \"containers\" || key->second != container_id)) return true;\n  }\n  return false;\n}\n\n\nstatic content::WebContents*\nJNI_WebContentsState_RestoreContentsFromByteBufferForContainer(\n    JNIEnv* env,\n    Profile* profile,\n    const JavaRef<jobject>& state,\n    int saved_state_version,\n    bool initially_hidden,\n    bool no_renderer,\n    const std::string& container_id) {\n  auto bytes = base::android::JavaByteBufferToSpan(env, state);\n  return WebContentsState::RestoreContentsFromByteBuffer(\n             profile, bytes, saved_state_version, initially_hidden, no_renderer,\n             std::string_view(container_id))\n      .release();\n}\n\nstatic content::WebContents* JNI_WebContentsState_RestoreContentsFromByteBuffer(\n    JNIEnv* env,\n    Profile* profile,\n"
