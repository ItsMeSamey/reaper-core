# Preserve Android serialized pending and committed tab metadata.
substitutions:
- description: "Preserve serialized pending and committed metadata (literal 1)"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ std::string\\*\\ virtual_url\\)\\ \\{"
    replace: "                                       std::string* virtual_url,\n                                       bool skip_pending_entry) {"
- description: "Preserve serialized pending and committed metadata (literal 2)"
  regex:
    re_pattern: "\\ \\ //\\ Skip\\ entries\\ before\\ the\\ active\\ one\\.\\\n\\ \\ for\\ \\(int\\ i\\ =\\ 0;\\ i\\ <\\ header\\.current_entry_index;\\ \\+\\+i\\)\\ \\{"
    replace: "  // A tracked pending append occupies the current entry. Repeated pending\n  // updates clobber that entry, so its predecessor remains the committed one.\n  const int selected_entry_index =\n      header.current_entry_index - (skip_pending_entry ? 1 : 0);\n  if (selected_entry_index < 0) {\n    return false;\n  }\n  // Skip entries before the selected one.\n  for (int i = 0; i < selected_entry_index; ++i) {"
- description: "Preserve serialized pending and committed metadata (literal 3)"
  regex:
    re_pattern: "static\\ ScopedJavaLocalRef<jobject>\\ JNI_WebContentsState_GetMetadata\\(\\\n\\ \\ \\ \\ JNIEnv\\*\\ env,\\\n\\ \\ \\ \\ const\\ JavaRef<jobject>\\&\\ state,\\\n\\ \\ \\ \\ jint\\ saved_state_version\\)\\ \\{\\\n\\ \\ base::span<const\\ uint8_t>\\ span\\ =\\\n\\ \\ \\ \\ \\ \\ base::android::JavaByteBufferToSpan\\(env,\\ state\\);\\\n\\\n\\ \\ bool\\ is_off_the_record\\ =\\ false;\\\n\\ \\ std::u16string\\ title;\\\n\\ \\ std::string\\ virtual_url;\\\n\\\n\\ \\ if\\ \\(!WebContentsState::ExtractMetadata\\(span,\\ saved_state_version,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\&is_off_the_record,\\ \\&title,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\&virtual_url\\)\\)\\ \\{\\\n\\ \\ \\ \\ return\\ nullptr;\\\n\\ \\ \\}\\\n\\\n\\ \\ return\\ Java_WebContentsState_createMetadata\\(env,\\ title,\\ virtual_url,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ is_off_the_record\\);\\\n\\}\\\n\\\n"
    replace: "static ScopedJavaLocalRef<jobject> GetMetadataFromByteBuffer(\n    JNIEnv* env,\n    const JavaRef<jobject>& state,\n    jint saved_state_version,\n    bool skip_pending_entry) {\n  base::span<const uint8_t> span =\n      base::android::JavaByteBufferToSpan(env, state);\n\n  bool is_off_the_record = false;\n  std::u16string title;\n  std::string virtual_url;\n\n  if (!WebContentsState::ExtractMetadata(span, saved_state_version,\n                                         &is_off_the_record, &title,\n                                         &virtual_url, skip_pending_entry)) {\n    return nullptr;\n  }\n\n  return Java_WebContentsState_createMetadata(env, title, virtual_url,\n                                              is_off_the_record);\n}\n\nstatic ScopedJavaLocalRef<jobject> JNI_WebContentsState_GetMetadata(\n    JNIEnv* env,\n    const JavaRef<jobject>& state,\n    jint saved_state_version) {\n  return GetMetadataFromByteBuffer(env, state, saved_state_version,\n                                   /*skip_pending_entry=*/false);\n}\n\nstatic ScopedJavaLocalRef<jobject> JNI_WebContentsState_GetLastCommittedMetadata(\n    JNIEnv* env,\n    const JavaRef<jobject>& state,\n    jint saved_state_version) {\n  return GetMetadataFromByteBuffer(env, state, saved_state_version,\n                                   /*skip_pending_entry=*/true);\n}\n\n"

