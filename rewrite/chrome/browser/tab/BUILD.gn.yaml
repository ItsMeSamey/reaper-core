substitutions:
- description: Remove the dedicated interface dependency from the retained Android deps list
  regex:
    pattern: "    \"//ui/base/ime/mojom:mojom_java\",\n    \"//url:gurl_java\",\n  ]"
    replace: "    \"//ui/base/ime/mojom:mojom_java\",\n    \"//url:gurl_java\",\n  ]\n  if (is_android) {\n    deps -= [ \"\
      //chrome/browser/commerce/price_tracking/android:java\" ]\n  }"
  count: 1
- description: Exclude dedicated price persistence Java implementations on Android
  regex:
    pattern: "  ]\n\n  srcjar_deps = [\n"
    replace: "  ]\n  if (is_android) {\n    sources -= [\n      \"java/src/org/chromium/chrome/browser/tab/state/PriceDropMetricsLogger.java\"\
      ,\n      \"java/src/org/chromium/chrome/browser/tab/state/ShoppingPersistedTabData.java\",\n      \"java/src/org/chromium/chrome/browser/tab/state/ShoppingPersistedTabDataService.java\"\
      ,\n    ]\n  }\n\n  srcjar_deps = [\n"
  count: 1
- description: Exclude only the shopping proto from the shared Android proto target
  regex:
    pattern: "proto_java_library(\"critical_persisted_tab_data_proto_java\") {\n  proto_path = \"java/src/org/chromium/chrome/browser/tab/state/proto\"\
      \n  sources = [\n    \"$proto_path/archive_persisted_tab_data.proto\",\n    \"$proto_path/send_tab_to_self_persisted_tab_data.proto\"\
      ,\n    \"$proto_path/shopping_persisted_tab_data.proto\",\n  ]\n}\n"
    replace: "proto_java_library(\"critical_persisted_tab_data_proto_java\") {\n  proto_path = \"java/src/org/chromium/chrome/browser/tab/state/proto\"\
      \n  sources = [\n    \"$proto_path/archive_persisted_tab_data.proto\",\n    \"$proto_path/send_tab_to_self_persisted_tab_data.proto\"\
      ,\n    \"$proto_path/shopping_persisted_tab_data.proto\",\n  ]\n  if (is_android) {\n    sources -= [ \"$proto_path/shopping_persisted_tab_data.proto\"\
      \ ]\n  }\n}\n"
  count: 1
- description: Exclude the dedicated price metrics fixture while retaining ordinary tab tests
  regex:
    pattern: "    \"java/src/org/chromium/chrome/browser/tab/utilities/TabLoadingServiceTest.java\",\n  ]\n\n  deps = [\n"
    replace: "    \"java/src/org/chromium/chrome/browser/tab/utilities/TabLoadingServiceTest.java\",\n  ]\n  if (is_android)\
      \ {\n    sources -= [ \"java/src/org/chromium/chrome/browser/tab/state/PriceDropMetricsLoggerTest.java\" ]\n  }\n\n\
      \  deps = [\n"
  count: 1
