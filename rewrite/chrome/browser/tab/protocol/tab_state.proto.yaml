# Reaper Android containers lifecycle; complete raw-pin ancestry.
substitutions:
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\

      import\ "chrome/browser/tab/protocol/token\.proto";\

      \

      //\ Next\ ID:\ 17\

      message\ TabState\ \{\

      \ \ optional\ int32\ tab_id\ =\ 15;\

      \

      '
    replace: "\nimport \"chrome/browser/tab/protocol/token.proto\";\n\n// Next ID: 18\nmessage TabState {\n  optional int32 tab_id = 15;\n\n"
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ optional\ bool\ is_pinned\ =\ 13;\

      \

      \ \ optional\ string\ url\ =\ 16;\

      \}\

      '
    replace: "  optional bool is_pinned = 13;\n\n  optional string url = 16;\n\n  optional string container_id = 17;\n}\n"
