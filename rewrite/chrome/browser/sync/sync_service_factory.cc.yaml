# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/sync/sync_service_factory.cc'
  regex:
    re_pattern: '\#include\ "base/no_destructor\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/account_settings/account_setting_service_factory\.h"\

      \#include\ "chrome/browser/autocomplete/aim_eligibility_service_factory\.h"\

      \#include\ "chrome/browser/autofill/personal_data_manager_factory\.h"\

      \#include\ "chrome/browser/bookmarks/bookmark_model_factory\.h"\

      \#include\ "chrome/browser/browser_process\.h"\

      '
    replace: '#include "base/no_destructor.h"

      #include "build/build_config.h"

      #include "chrome/browser/account_settings/account_setting_service_factory.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/autocomplete/aim_eligibility_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/autofill/personal_data_manager_factory.h"

      #include "chrome/browser/bookmarks/bookmark_model_factory.h"

      #include "chrome/browser/browser_process.h"

      '
