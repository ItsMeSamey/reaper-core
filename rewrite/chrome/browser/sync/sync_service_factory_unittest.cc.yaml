substitutions:
  - description: |-
      Account for Brave's extra data type in the GetNumDataTypes static_assert.
      Add one to the upstream count rather than matching its value, so the
      assert is undisturbed when upstream adds or removes data types.
    regex:
      re_pattern: 'static_assert\((\d+) == syncer::GetNumDataTypes\(\),'
      replace: 'static_assert(\1 + 1 == syncer::GetNumDataTypes(),'
  - description: "Android native integration581, exact reviewed source literal 1: Exclude removed Android Skills feature header from factory-test scaffolding only"
    regex:
      pattern: "#include \"components/skills/features.h\"\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/skills/features.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Android native integration581, exact reviewed source literal 2: Exclude only unsupported Android Skills expected datatype"
    regex:
      pattern: "    if (base::FeatureList::IsEnabled(features::kSkillsEnabled)) {\n      datatypes.Put(syncer::SKILL);\n    }\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n    if (base::FeatureList::IsEnabled(features::kSkillsEnabled)) {\n      datatypes.Put(syncer::SKILL);\n    }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
