    replace: "_touch_to_fill_resource_spec = {\n  sources = [\n    \"java/res/drawable/touch_to_fill_tab_item_bg.xml\",\n    \"java/res/drawable/touch_to_fill_tab_layout_bg.xml\",\n    \"java/res/layout/touch_to_fill_all_loyalty_cards_item.xml\",\n    \"java/res/layout/touch_to_fill_autofill_personal_context_notice_screen.xml\",\n    \"java/res/layout/touch_to_fill_bnpl_issuer_selection_screen.xml\",\n    \"java/res/layout/touch_to_fill_bnpl_issuer_selection_sheet_item.xml\",\n    \"java/res/layout/touch_to_fill_bnpl_issuer_tos_screen.xml\",\n    \"java/res/layout/touch_to_fill_bnpl_selection_and_progress_screen_header_item.xml\",\n    \"java/res/layout/touch_to_fill_bnpl_selection_and_progress_screen_terms_item.xml\",\n    \"java/res/layout/touch_to_fill_bnpl_sheet_item.xml\",\n    \"java/res/layout/touch_to_fill_bnpl_tos_header_item.xml\",\n    \"java/res/layout/touch_to_fill_bnpl_tos_sheet_item.xml\",\n    \"java/res/layout/touch_to_fill_credit_card_sheet_item.xml\",\n    \"java/res/layout/touch_to_fill_credit_card_sheet_item_v2.xml\",\n    \"java/res/layout/touch_to_fill_error_description_sheet_item.xml\",\n    \"java/res/layout/touch_to_fill_error_screen.xml\",\n    \"java/res/layout/touch_to_fill_iban_sheet_item.xml\",\n    \"java/res/layout/touch_to_fill_legal_message_item.xml\",\n    \"java/res/layout/touch_to_fill_loyalty_card_sheet_item.xml\",\n    \"java/res/layout/touch_to_fill_payment_method_all_loyalty_cards_screen.xml\",\n    \"java/res/layout/touch_to_fill_payment_method_footer_item.xml\",\n    \"java/res/layout/touch_to_fill_payment_method_home_screen.xml\",\n    \"java/res/layout/touch_to_fill_payment_method_sheet.xml\",\n    \"java/res/layout/touch_to_fill_payment_method_tabbed_home_screen.xml\",\n    \"java/res/layout/touch_to_fill_progress_icon_sheet_item.xml\",\n    \"java/res/layout/touch_to_fill_progress_screen.xml\",\n    \"java/res/layout/touch_to_fill_terms_label_sheet_item.xml\",\n    \"java/res/layout/touch_to_fill_wallet_settings_button.xml\",\n    \"java/res/values/dimens.xml\",\n  ]\n  if (is_android) {\n    sources -= [ \"java/res/layout/touch_to_fill_autofill_personal_context_notice_screen.xml\" ]\n  }}\n\nif (is_android) {\n  _touch_to_fill_resource_directories = []\n  _touch_to_fill_resource_sources = []\n  _touch_to_fill_resource_copy_deps = []\n  foreach(_source, _touch_to_fill_resource_spec.sources) {\n    _directory = get_path_info(_source, \"dir\")\n    if (filter_include(_touch_to_fill_resource_directories, [ _directory ]) == []) {\n      _touch_to_fill_resource_directories += [ _directory ]\n    }\n    _root = \"$target_gen_dir/touch_to_fill_resources_selected/\" +\n            string_replace(_directory, \"/\", \"_\")\n    _qualifier = get_path_info(_directory, \"file\")\n    _file = get_path_info(_source, \"file\")\n    _touch_to_fill_resource_sources += [ \"$_root/$_qualifier/$_file\" ]\n  }\n  foreach(_directory, _touch_to_fill_resource_directories) {\n    _qualifier = get_path_info(_directory, \"file\")\n    _copy_target = \"copy_selected_touch_to_fill_\" +\n                   string_replace(_directory, \"/\", \"-\")\n    copy_ex(_copy_target) {\n      sources = filter_include(_touch_to_fill_resource_spec.sources, [ \"$_directory/*\" ])\n      _root = \"$target_gen_dir/touch_to_fill_resources_selected/\" +\n              string_replace(_directory, \"/\", \"_\")\n      dest = \"$_root/$_qualifier\"\n      outputs = process_file_template(sources, [ \"$dest/{{source_file_part}}\" ])\n      args = [ \"--clear\" ]\n    }\n    _touch_to_fill_resource_copy_deps += [ \":$_copy_target\" ]\n  }\n}\n\nandroid_resources(\"java_resources\") {\n  deps = [ \"//chrome/browser/touch_to_fill/common/android:java_resources\" ]\n  sources = _touch_to_fill_resource_spec.sources\n  if (is_android) {\n    sources = []\n    sources += _touch_to_fill_resource_sources\n  }\n\n  if (is_android) {\n    deps += _touch_to_fill_resource_copy_deps\n  }\n}"
