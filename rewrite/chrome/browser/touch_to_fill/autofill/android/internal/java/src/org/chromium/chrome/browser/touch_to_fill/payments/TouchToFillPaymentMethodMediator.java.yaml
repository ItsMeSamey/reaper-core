substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove AI-only presentation state
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ mDidShowBoldedAiTerms;\

      '
    replace: ''
- description: Remove now-unreferenced AI-only histogram suffix strings; ordinary
    telemetry string ABI remains unchanged
  regex:
    re_pattern: '\ \ \ \ @VisibleForTesting\

      \ \ \ \ static\ final\ String\

      \ \ \ \ \ \ \ \ \ \ \ \ ISSUER_SELECTION_SCREEN_AI_BASED_AMOUNT_EXTRACTION_TERMS_SHOWN_IN_BOLD_FONT\
      =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "\.IssuerSelectionScreen\.AiBasedAmountExtractionTermsShown\.InBoldFont";\

      '
    replace: ''
- description: Remove now-unreferenced AI-only histogram suffix strings; ordinary
    telemetry string ABI remains unchanged
  regex:
    re_pattern: '\ \ \ \ @VisibleForTesting\

      \ \ \ \ static\ final\ String\

      \ \ \ \ \ \ \ \ \ \ \ \ ISSUER_SELECTION_SCREEN_AI_BASED_AMOUNT_EXTRACTION_TERMS_SHOWN_IN_NORMAL_FONT\
      =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "\.IssuerSelectionScreen\.AiBasedAmountExtractionTermsShown\.InNormalFont";\

      '
    replace: ''
- description: Remove AI-only constructor state initialization
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mDidShowBoldedAiTerms\ =\ true;\

      '
    replace: ''
- description: Remove concrete optional AI preference read while issuer selection
    flow stays
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ mDidShowBoldedAiTerms\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mPersonalDataManager\.isAutofillAmountExtractionAiTermsSeenPrefEnabled\(\);\

      '
    replace: ''
- description: Remove concrete optional AI preference read while issuer selection
    flow stays
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mDidShowBoldedAiTerms\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mPersonalDataManager\.isAutofillAmountExtractionAiTermsSeenPrefEnabled\(\);\

      '
    replace: ''
- description: Narrow actual ordinary terms helper calls; progress/selection/link
    arguments remain
  count: 2
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ didShowBoldedAiTerms=\
      \*/\ mDidShowBoldedAiTerms,\

      '
    replace: ''
- description: Narrow actual ordinary terms helper calls; progress/selection/link
    arguments remain
  count: 2
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ didShowBoldedAiTerms=\
      \*/\ mDidShowBoldedAiTerms,\

      '
    replace: ''
- description: Remove AI-state-only terms helper input without changing mandatory
    issuer ToS APIs
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ boolean\ didShowBoldedAiTerms,\

      '
    replace: ''
- description: Retain exact ordinary issuer terms text/link; physically remove AI
    disclosure/bold/feature/metrics branch
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ String\ termsString;\

      \ \ \ \ \ \ \ \ if\ \(ChromeFeatureList\.isEnabled\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillFeatures\.AUTOFILL_ENABLE_AI_BASED_AMOUNT_EXTRACTION\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ termsString\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ context\.getString\(R\.string\.autofill_bnpl_issuer_bottom_sheet_ai_terms_label\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(didShowBoldedAiTerms\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ termsString\ =\ termsString\.replace\("<bold>",\
      ""\)\.replace\("</bold>",\ ""\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ recordTouchToFillBnplUserAction\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ISSUER_SELECTION_SCREEN_AI_BASED_AMOUNT_EXTRACTION_TERMS_SHOWN_IN_NORMAL_FONT\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ spanInfos\.add\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ SpanApplier\.SpanInfo\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "<bold>",\ "</bold>",\
      new\ StyleSpan\(Typeface\.BOLD\)\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ recordTouchToFillBnplUserAction\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ISSUER_SELECTION_SCREEN_AI_BASED_AMOUNT_EXTRACTION_TERMS_SHOWN_IN_BOLD_FONT\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ termsString\ =\ context\.getString\(R\.string\.autofill_bnpl_issuer_bottom_sheet_terms_label\);\

      \ \ \ \ \ \ \ \ \}'
    replace: "        String termsString =\n                context.getString(R.string.autofill_bnpl_issuer_bottom_sheet_terms_label);"
