# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/touch_to_fill/autofill/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "touch_to_fill_payment_method_view\.h",\

      \ \ \ \ "touch_to_fill_payment_method_view_controller\.h",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\ "//base"\ \]\

      \}\

      '
    replace: "    \"touch_to_fill_payment_method_view.h\",\n    \"touch_to_fill_payment_method_view_controller.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"touch_to_fill_autofill_controller.h\",\n      \"touch_to_fill_autofill_view.h\",\n    ]\n  }\n\n  deps = [ \"//base\" ]\n}\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/touch_to_fill/autofill/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "touch_to_fill_payment_method_view_impl\.cc",\

      \ \ \ \ "touch_to_fill_payment_method_view_impl\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\ "//base"\ \]\

      \

      '
    replace: "    \"touch_to_fill_payment_method_view_impl.cc\",\n    \"touch_to_fill_payment_method_view_impl.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"touch_to_fill_autofill_view_impl.cc\",\n      \"touch_to_fill_autofill_view_impl.h\",\n    ]\n  }\n\n  public_deps = [ \"//base\" ]\n\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/touch_to_fill/autofill/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "touch_to_fill_payment_method_delegate_android_impl\.cc",\

      \ \ \ \ "touch_to_fill_payment_method_delegate_android_impl\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ ":public",\

      '
    replace: "    \"touch_to_fill_payment_method_delegate_android_impl.cc\",\n    \"touch_to_fill_payment_method_delegate_android_impl.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"touch_to_fill_autofill_controller_impl.cc\",\n      \"touch_to_fill_autofill_controller_impl.h\",\n      \"touch_to_fill_autofill_delegate_android_impl.cc\",\n      \"touch_to_fill_autofill_delegate_android_impl.h\",\n    ]\n  }\n\n  public_deps = [\n    \":public\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/touch_to_fill/autofill/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//content/public/browser",\

      \ \ \ \ "//ui/android",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      '
    replace: "    \"//content/public/browser\",\n    \"//ui/android\",\n  ]\n  if (is_android) {\n    deps -= [ \"//components/personal_context/first_run\" ]\n  }\n}\n\nsource_set(\"unit_tests\") {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/touch_to_fill/autofill/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "touch_to_fill_payment_method_delegate_android_impl_unittest\.cc",\

      \ \ \ \ "touch_to_fill_payment_method_quality_metrics_unittest\.cc",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":impl",\

      '
    replace: "    \"touch_to_fill_payment_method_delegate_android_impl_unittest.cc\",\n    \"touch_to_fill_payment_method_quality_metrics_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"touch_to_fill_autofill_controller_impl_unittest.cc\",\n      \"touch_to_fill_autofill_delegate_android_impl_unittest.cc\",\n    ]\n  }\n\n  deps = [\n    \":impl\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/touch_to_fill/autofill/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "java/src/org/chromium/chrome/browser/touch_to_fill/autofill/TouchToFillAutofillComponent\.java",\

      \ \ \ \ "java/src/org/chromium/chrome/browser/touch_to_fill/payments/TouchToFillPaymentMethodComponent\.java",\

      \ \ \]\

      \}\

      '
    replace: "    \"java/src/org/chromium/chrome/browser/touch_to_fill/autofill/TouchToFillAutofillComponent.java\",\n    \"java/src/org/chromium/chrome/browser/touch_to_fill/payments/TouchToFillPaymentMethodComponent.java\",\n  ]\n  if (is_android) {\n    sources -= [ \"java/src/org/chromium/chrome/browser/touch_to_fill/autofill/TouchToFillAutofillComponent.java\" ]\n  }\n}\n"
