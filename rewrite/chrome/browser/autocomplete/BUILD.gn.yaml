# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/autocomplete/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//components/variations/service",\

      \ \ \ \ "//content/public/browser",\

      \ \ \]\

      \

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "\.\./android/autocomplete/tab_matcher_android\.cc"\ \]\

      '
    replace: "    \"//components/variations/service\",\n    \"//content/public/browser\",\n  ]\n  if (is_android) {\n    deps -= [\n      \":aim_eligibility_service\",\n      \"//chrome/browser/contextual_search\",\n      \"//chrome/browser/contextual_tasks:ui\",\n    ]\n  }\n\n  if (is_android) {\n    sources += [ \"../android/autocomplete/tab_matcher_android.cc\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/autocomplete/BUILD.gn'
  regex:
    re_pattern: '\ \ public_deps\ =\ \[\ "//chrome/browser:browser_public_dependencies"\ \]\

      \}\

      \

      source_set\("aim_eligibility_service"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "aim_eligibility_refresh_navigation_throttle\.cc",\

      \ \ \ \ "aim_eligibility_refresh_navigation_throttle\.h",\

      \ \ \ \ "aim_eligibility_service_factory\.cc",\

      \ \ \ \ "aim_eligibility_service_factory\.h",\

      \ \ \ \ "chrome_aim_eligibility_service\.cc",\

      \ \ \ \ "chrome_aim_eligibility_service\.h",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//chrome/browser:browser_process",\

      \ \ \ \ "//chrome/browser:global_features",\

      \ \ \ \ "//chrome/browser/profiles:profile",\

      \ \ \ \ "//chrome/browser/search_engines",\

      \ \ \ \ "//chrome/browser/signin",\

      \ \ \ \ "//components/application_locale_storage",\

      \ \ \ \ "//components/contextual_tasks/public:feature_list",\

      \ \ \ \ "//components/embedder_support:user_agent",\

      \ \ \ \ "//components/keyed_service/core",\

      \ \ \ \ "//components/omnibox/browser",\

      \ \ \ \ "//components/prefs",\

      \ \ \ \ "//components/search_engines",\

      \ \ \ \ "//components/variations/service",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//extensions/buildflags",\

      \ \ \ \ "//services/network/public/cpp",\

      \ \ \ \ "//third_party/blink/public/common:headers",\

      \ \ \]\

      \

      \ \ if\ \(enable_extensions_core\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//extensions/common"\ \]\

      \ \ \}\

      \

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "aim_eligibility_service_factory_android\.cc"\ \]\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/search_engines/android:jni_headers"\ \]\

      \ \ \}\

      \}\

      \

      '
    replace: "  public_deps = [ \"//chrome/browser:browser_public_dependencies\" ]\n}\n\nif (!is_android) {\n  source_set(\"aim_eligibility_service\") {\n    sources = [\n      \"aim_eligibility_refresh_navigation_throttle.cc\",\n      \"aim_eligibility_refresh_navigation_throttle.h\",\n      \"aim_eligibility_service_factory.cc\",\n      \"aim_eligibility_service_factory.h\",\n      \"chrome_aim_eligibility_service.cc\",\n      \"chrome_aim_eligibility_service.h\",\n    ]\n    if (is_android) {\n      sources -= [\n        \"aim_eligibility_refresh_navigation_throttle.cc\",\n        \"aim_eligibility_refresh_navigation_throttle.h\",\n        \"aim_eligibility_service_factory.cc\",\n        \"aim_eligibility_service_factory.h\",\n      ]\n    }\n    deps = [\n      \"//base\",\n      \"//chrome/browser:browser_process\",\n      \"//chrome/browser:global_features\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/search_engines\",\n      \"//chrome/browser/signin\",\n      \"//components/application_locale_storage\",\n      \"//components/contextual_tasks/public:feature_list\",\n      \"//components/embedder_support:user_agent\",\n      \"//components/keyed_service/core\",\n      \"//components/omnibox/browser\",\n      \"//components/prefs\",\n      \"//components/search_engines\",\n      \"//components/variations/service\",\n      \"//content/public/browser\",\n      \"//extensions/buildflags\",\n      \"//services/network/public/cpp\",\n      \"//third_party/blink/public/common:headers\",\n    ]\n    if (is_android) {\n      deps -= [ \"//components/contextual_tasks/public:feature_list\" ]\n    }\n\n    if (enable_extensions_core) {\n      deps += [ \"//extensions/common\" ]\n    }\n\n    if (is_android) {\n      sources += [ \"aim_eligibility_service_factory_android.cc\" ]\n      if (is_android) {\n        sources -= [ \"aim_eligibility_service_factory_android.cc\" ]\n      }\n      deps += [ \"//chrome/browser/search_engines/android:jni_headers\" ]\n    }\n  }\n}\n\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/autocomplete/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/base/unowned_user_data",\

      \ \ \ \ \ \ "//url",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      \

      '
    replace: "      \"//ui/base/unowned_user_data\",\n      \"//url\",\n    ]\n    if (is_android) {\n      deps -= [\n        \":aim_eligibility_service\",\n        \"//chrome/browser/contextual_tasks\",\n        \"//chrome/browser/contextual_tasks:ui\",\n      ]\n    }\n  }\n}\n\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/autocomplete/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "search_provider_unittest\.cc",\

      \ \ \ \ "shortcuts_provider_extension_unittest\.cc",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":aim_eligibility_service",\

      \ \ \ \ ":autocomplete",\

      '
    replace: "    \"search_provider_unittest.cc\",\n    \"shortcuts_provider_extension_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [ \"aim_eligibility_refresh_navigation_throttle_unittest.cc\" ]\n  }\n  deps = [\n    \":aim_eligibility_service\",\n    \":autocomplete\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/autocomplete/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/base",\

      \ \ \ \ "//url",\

      \ \ \]\

      \

      \ \ if\ \(enable_extensions_core\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "keyword_extensions_delegate_impl_unittest\.cc"\ \]\

      '
    replace: "    \"//ui/base\",\n    \"//url\",\n  ]\n  if (is_android) {\n    deps -= [ \":aim_eligibility_service\" ]\n  }\n\n  if (enable_extensions_core) {\n    sources += [ \"keyword_extensions_delegate_impl_unittest.cc\" ]\n"
- description: 'Android history AI430: chrome/browser/autocomplete/BUILD.gn step 1'
  regex:
    pattern: "    \"//content/public/browser\",\n  ]"
    replace: "    \"//content/public/browser\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/history_embeddings\",\n      \"//components/history_embeddings/content\",\n      \"//components/history_embeddings/core\",\n    ]\n  }"
  count: 1

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: Android Lens JNI/overlay implementation edge 0"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \"//chrome/browser/lens:jni_headers\",\\\n"
    replace: ""
  count: 1
