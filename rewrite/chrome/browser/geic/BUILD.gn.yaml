      \ variant-consistent with the pwc :features target it imports for\n    # the\
      \ [RuntimeFeature] reference. The TypeScript bindings generated here are\n \
      \   # consumed by a remote GE web app via the rollup bundle in\n    # //chrome/browser/resources/geic,\
      \ not by Blink.\n    sources = [ \"geic.mojom\" ]\n\n    public_deps = [\n \
      \     \"//chrome/browser/pwc:features\",\n      \"//mojo/public/mojom/base\"\
