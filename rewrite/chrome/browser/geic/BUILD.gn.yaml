      \ \ \ \ \ \ "//chrome/browser/ui/side_panel",\

      \ \ \ \ \ \ "//chrome/browser/ui/side_panel:side_panel_views_dependent",\

      \ \ \ \ \ \ "//chrome/browser/ui/tabs:tab_strip",\

      \ \ \ \ \ \ "//chrome/browser/ui/views",\

      \ \ \ \ \ \ "//chrome/browser/ui/views/glic",\

      \ \ \ \ \ \ "//chrome/browser/ui/views/tabs:tab_strip_button",\

      \ \ \ \ \ \ "//components/zoom",\

      \ \ \ \ \ \ "//content/public/common",\

      \ \ \ \ \ \ "//third_party/blink/public/common",\

      \ \ \ \ \ \ "//ui/base",\

      \ \ \ \ \ \ "//ui/base/metadata",\

      \ \ \ \ \ \ "//ui/base/unowned_user_data",\

      \ \ \ \ \ \ "//ui/gfx",\

      \ \ \ \ \ \ "//ui/views",\

      \ \ \ \ \ \ "//ui/views/controls/webview",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      \

      source_set\("browser_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \

      \ \ defines\ =\ \[\ "HAS_OUT_OF_PROC_TEST_RUNNER"\ \]\

      \

      \ \ sources\ =\ \[\]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":geic",\

      \ \ \ \ ":mojo_bindings",\

      \ \ \ \ "//base/test:test_support",\

      \ \ \ \ "//chrome/browser/pwc",\

      \ \ \ \ "//chrome/browser/pwc:features",\

      \ \ \ \ "//chrome/test:test_support",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//content/test:test_support",\

      \ \ \ \ "//mojo/public/cpp/bindings",\

      \ \ \ \ "//net:test_support",\

      \ \ \ \ "//testing/gtest",\

      \ \ \ \ "//url",\

      \ \ \]\

      \

      \ \ \#\ The\ test\ uses\ desktop\-only\ UI\ \(Browser,\ InProcessBrowserTest\)\.\

      \ \ if\ \(!is_android\)\ \{\

      \ \ \ \ sources\ \+=\ \[\

      \ \ \ \ \ \ "geic_button_browsertest\.cc",\

      \ \ \ \ \ \ "geic_host_browsertest\.cc",\

      \ \ \ \ \ \ "geic_zoom_browsertest\.cc",\

      \ \ \ \ \]\

      \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ ":ui",\

      \ \ \ \ \ \ "//chrome/app:branded_strings",\

      \ \ \ \ \ \ "//chrome/browser/ui",\

      \ \ \ \ \ \ "//chrome/browser/ui:browser_element_identifiers",\

      \ \ \ \ \ \ "//chrome/browser/ui/side_panel",\

      \ \ \ \ \ \ "//chrome/browser/ui/views/frame:contents_web_view",\

      \ \ \ \ \ \ "//chrome/browser/ui/views/interaction",\

      \ \ \ \ \ \ "//chrome/browser/ui/views/tabs:tab_strip",\

      \ \ \ \ \ \ "//chrome/common:channel_info",\

      \ \ \ \ \ \ "//chrome/common:non_code_constants",\

      \ \ \ \ \ \ "//components/version_info",\

      \ \ \ \ \ \ "//components/zoom",\

      \ \ \ \ \ \ "//content/public/common",\

      \ \ \ \ \ \ "//third_party/blink/public/common",\

