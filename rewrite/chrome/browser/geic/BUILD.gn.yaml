      \ = false\n  }\n\n  source_set(\"geic\") {\n    public = [\n      \"geic_enabling.h\"\
      ,\n      \"geic_host.h\",\n    ]\n\n    sources = [\n      \"geic_enabling.cc\"\
      ,\n      \"geic_host.cc\",\n    ]\n\n    public_deps = [\n      \":mojo_bindings\"\
