      \ \ \ \ \]\

      \ \ \}\

      \}\

      \

      if\ \(!is_android\)\ \{\

      \ \ source_set\("ui"\)\ \{\

      \ \ \ \ sources\ =\ \[\

      \ \ \ \ \ \ "geic_button\.cc",\

      \ \ \ \ \ \ "geic_button\.h",\

      \ \ \ \ \ \ "geic_side_panel_coordinator\.cc",\

      \ \ \ \ \ \ "geic_side_panel_coordinator\.h",\

