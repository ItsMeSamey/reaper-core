substitutions:
- description: Use real unavailable annotation eligibility during setup
  regex:
    pattern: '        doReturn(true).when(mCommerceFeatureUtilsJniMock).isPriceAnnotationsEnabled(anyLong());

      '
    replace: ''
  count: 1
- description: Keep negative module assertions with real false eligibility
  regex:
    pattern: "    @Test\n    @SmallTest\n    public void testBuildModule_NotEligible() {\n        doReturn(false).when(mCommerceFeatureUtilsJniMock).isPriceAnnotationsEnabled(anyLong());\n\
      \        assertFalse(PriceTrackingUtilities.isTrackPricesOnTabsEnabled(mProfile));\n\n        assertFalse(mModuleBuilder.build(mModuleDelegate,\
      \ mBuildCallback));\n        verify(mBuildCallback, never()).onResult(any(ModuleProvider.class));\n    }\n\n"
    replace: "    @Test\n    @SmallTest\n    public void testBuildModule_NotEligible() {\n        assertFalse(PriceTrackingUtilities.isTrackPricesOnTabsEnabled(mProfile));\n\
      \n        assertFalse(mModuleBuilder.build(mModuleDelegate, mBuildCallback));\n        verify(mBuildCallback, never()).onResult(any(ModuleProvider.class));\n\
      \    }\n\n"
  count: 1
- description: Remove unavailable CommerceFeatureUtils native mock
  regex:
    pattern: '    @Mock private CommerceFeatureUtils.Natives mCommerceFeatureUtilsJniMock;

      '
    replace: ''
  count: 1
- description: Use real unavailable CommerceFeatureUtils values
  regex:
    pattern: '        CommerceFeatureUtilsJni.setInstanceForTesting(mCommerceFeatureUtilsJniMock);

      '
    replace: ''
  count: 1
- description: Remove newly unused CommerceFeatureUtils import
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtils;

      '
    replace: ''
  count: 1
- description: Remove newly unused CommerceFeatureUtilsJni import
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtilsJni;

      '
    replace: ''
  count: 1
- description: Remove newly unused anyLong import
  regex:
    pattern: 'import static org.mockito.ArgumentMatchers.anyLong;

      '
    replace: ''
  count: 1
- description: Remove newly unused doReturn import
  regex:
    pattern: 'import static org.mockito.Mockito.doReturn;

      '
    replace: ''
  count: 1
