- description: Complete the real retained unsubscribe callback with unavailable false while preserving subscription-field
    assertions
  regex:
    pattern: "    public void testOnNotificationActionClicked_TurnOffAlert() {\n        String offerId = \"offer_id\";\n\n\
      \        mPriceDropNotificationManager.onNotificationActionClicked(\n                ACTION_ID_TURN_OFF_ALERT, TEST_URL,\
      \ offerId, null, false);\n        verify(mMockShoppingService, times(1))\n                .unsubscribe(mSubscriptionCaptor.capture(),\
      \ MockitoHelper.anyCallback());\n        assertEquals(IdentifierType.OFFER_ID, mSubscriptionCaptor.getValue().idType);\n\
      \        assertEquals(offerId, mSubscriptionCaptor.getValue().id);\n        assertEquals(ManagementType.CHROME_MANAGED,\
      \ mSubscriptionCaptor.getValue().managementType);\n        assertEquals(null, mSubscriptionCaptor.getValue().userSeenOffer);\n\
      \    }"
    replace: "    public void testOnNotificationActionClicked_TurnOffAlert() {\n        String offerId = \"offer_id\";\n \
      \       ArgumentCaptor<Callback<Boolean>> callbackCaptor = MockitoHelper.callbackCaptor();\n\n        mPriceDropNotificationManager.onNotificationActionClicked(\n\
      \                ACTION_ID_TURN_OFF_ALERT, TEST_URL, offerId, null, false);\n        verify(mMockShoppingService, times(1))\n\
      \                .unsubscribe(mSubscriptionCaptor.capture(), callbackCaptor.capture());\n        assertEquals(IdentifierType.OFFER_ID,\
      \ mSubscriptionCaptor.getValue().idType);\n        assertEquals(offerId, mSubscriptionCaptor.getValue().id);\n     \
      \   assertEquals(ManagementType.CHROME_MANAGED, mSubscriptionCaptor.getValue().managementType);\n        assertEquals(null,\
      \ mSubscriptionCaptor.getValue().userSeenOffer);\n\n        callbackCaptor.getValue().onResult(false);\n    }"
  count: 1
