substitutions:
- description: Remove only obsolete price-tracking native utility fixture setup
  regex:
    pattern: 'import org.chromium.chrome.browser.commerce.PriceTrackingUtils;

      '
    replace: ''
  count: 1
- description: Remove only obsolete price-tracking native utility fixture setup
  regex:
    pattern: 'import org.chromium.chrome.browser.commerce.PriceTrackingUtilsJni;

      '
    replace: ''
  count: 1
- description: Remove only obsolete price-tracking native utility fixture setup
  regex:
    pattern: '    @Mock PriceTrackingUtils.Natives mMockPriceTrackingUtilsJni;

      '
    replace: ''
  count: 1
- description: Remove only obsolete price-tracking native utility fixture setup
  regex:
    pattern: '        PriceTrackingUtilsJni.setInstanceForTesting(mMockPriceTrackingUtilsJni);

      '
    replace: ''
  count: 1
- description: Remove imports used only by the retired native success assertion
  regex:
    pattern: 'import static org.mockito.ArgumentMatchers.eq;

      '
    replace: ''
  count: 1
- description: Remove imports used only by the retired native success assertion
  regex:
    pattern: 'import org.chromium.base.Callback;

      '
    replace: ''
  count: 1
- description: Remove imports used only by the retired native success assertion
  regex:
    pattern: 'import org.chromium.ui.test.util.MockitoHelper;

      '
    replace: ''
  count: 1
- description: Exercise the existing unavailable callback from the retained button click
  regex:
    pattern: '    public void testPriceTrackingButtonClick_shouldRemoveTrackingWhenAlreadyTracking() {'
    replace: '    public void testPriceTrackingButtonClick_reportsUnavailableWhenAlreadyTracking() {'
  count: 1
- description: Remove the retired native callback captor
  regex:
    pattern: "        ArgumentCaptor<Callback<Boolean>> jniCallbackArgumentCaptor =\n                MockitoHelper.callbackCaptor();\n"
    replace: ''
  count: 1
- description: Assert the existing false-result error and retry resources without synthesizing native success
  regex:
    pattern: "        verify(mMockPriceTrackingUtilsJni)\n                .setPriceTrackingStateForBookmark(\n           \
      \             eq(mMockProfile),\n                        eq(bookmarkId.getId()),\n                        eq(false),\n\
      \                        jniCallbackArgumentCaptor.capture(),\n                        eq(false));\n\n        jniCallbackArgumentCaptor.getValue().onResult(true);\n"
    replace: "        verify(mockResources).getString(R.string.price_tracking_error_snackbar);\n        verify(mockResources).getString(R.string.price_tracking_error_snackbar_action);\n"
  count: 1
