      \                            callback.onResult(success);\n                            return null;\n               \
      \         })\n                .when(mMockPriceInsightsDelegate)\n                .setPriceTrackingStateForTab(any(Tab.class),\
      \ anyBoolean(), any());\n    }\n\n"
    replace: ''
  count: 1
