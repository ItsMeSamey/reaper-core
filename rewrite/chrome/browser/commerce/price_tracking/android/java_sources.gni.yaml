- description: Apply the reviewed Android-only notification admission change with pinned GN normalization.
  regex:
    pattern: "if (is_android) {\n  price_tracking_java_sources -= [\n    \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/CurrentTabPriceTrackingStateSupplier.java\"\
