substitutions:
- description: Omit only the retired price-notification bridge from the Android Java source list
  regex:
    pattern: '  "//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceTrackingNotificationBridge.java",

      '
    replace: ''
  count: 1
- description: Omit only the dedicated image-fetch and price-notification producer from the Android Java source list
  regex:
    pattern: '  "//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceDropNotifier.java",

      '
    replace: ''
  count: 1
- description: Exclude dedicated price-tracking toolbar state/button sources; keep notification factory/manager/config.
  regex:
    pattern: "# Copyright 2021 The Chromium Authors\n# Use of this source code is governed by a BSD-style license that can\
      \ be\n# found in the LICENSE file.\n\nprice_tracking_java_sources = [\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/CurrentTabPriceTrackingStateSupplier.java\"\
      ,\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceDropNotificationManagerFactory.java\"\
      ,\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceDropNotificationManagerImpl.java\"\
      ,\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceTrackingButtonController.java\"\
      ,\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceTrackingNotificationConfig.java\"\
      ,\n]\n\nprice_tracking_java_deps =\n    [ \"//chrome/browser/commerce/price_tracking/android:java\" ]\n"
    replace: "# Copyright 2021 The Chromium Authors\n# Use of this source code is governed by a BSD-style license that can\
      \ be\n# found in the LICENSE file.\n\nprice_tracking_java_sources = [\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/CurrentTabPriceTrackingStateSupplier.java\"\
      ,\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceDropNotificationManagerFactory.java\"\
      ,\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceDropNotificationManagerImpl.java\"\
      ,\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceTrackingButtonController.java\"\
      ,\n  \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceTrackingNotificationConfig.java\"\
      ,\n]\n\nprice_tracking_java_deps =\n    [ \"//chrome/browser/commerce/price_tracking/android:java\" ]\n\nif (is_android)\
      \ {\n  price_tracking_java_sources -= [\n    \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/CurrentTabPriceTrackingStateSupplier.java\"\
      ,\n    \"//chrome/browser/commerce/price_tracking/android/java/src/org/chromium/chrome/browser/price_tracking/PriceTrackingButtonController.java\"\
      ,\n  ]\n}\n"
