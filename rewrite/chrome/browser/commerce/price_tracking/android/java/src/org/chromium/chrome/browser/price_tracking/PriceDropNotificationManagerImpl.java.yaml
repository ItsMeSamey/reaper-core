substitutions:
- description: Handle an unavailable unsubscribe result as a normal failure without asserting success
  regex:
    pattern: "                    (status) -> {\n                        assert status : \"Failed to remove subscriptions.\"\
      ;\n                        Log.e(TAG, \"Failed to remove subscriptions.\");\n                    };\n"
    replace: "                    (status) -> {\n                        if (!status) {\n                            Log.e(TAG,\
      \ \"Failed to remove subscriptions.\");\n                        }\n                    };\n"
  count: 1
- description: Retain the exact existing notification tag locally for old notification cancellation without admitting the
    removed producer
  regex:
    pattern: '    private static final String TAG = "PriceDropNotif";

      '
    replace: "    private static final String TAG = \"PriceDropNotif\";\n    private static final String NOTIFICATION_TAG\
      \ = \"price_drop\";\n"
  count: 1
- description: Use the retained local price_drop tag in the unchanged notification cancellation path
  regex:
    pattern: .cancel(PriceDropNotifier.NOTIFICATION_TAG, notificationId);
    replace: .cancel(NOTIFICATION_TAG, notificationId);
  count: 1
