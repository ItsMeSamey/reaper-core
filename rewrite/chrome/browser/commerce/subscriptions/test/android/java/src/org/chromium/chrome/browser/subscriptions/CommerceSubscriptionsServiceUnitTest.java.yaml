- description: Verify expired work advances its timestamp even though the unavailable backend records no metrics
  regex:
    pattern: "    public void testOnResume_UnavailableShopping() {\n        setupTestOnResume();\n        assertThat(\n  \
      \              RecordHistogram.getHistogramTotalCountForTesting(\n                        PriceDropNotificationManagerImpl.NOTIFICATION_ENABLED_HISTOGRAM),\n\
      \                equalTo(0));\n        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n\
      \                        PriceDropNotificationManagerImpl\n                                .NOTIFICATION_CHROME_MANAGED_COUNT_HISTOGRAM),\n\
      \                equalTo(0));\n        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n\
      \                        PriceDropNotificationManagerImpl.NOTIFICATION_USER_MANAGED_COUNT_HISTOGRAM),\n            \
      \    equalTo(0));\n    }"
    replace: "    public void testOnResume_UnavailableShopping() {\n        long expiredTimestamp =\n                mSharedPreferencesManager.readLong(\n\
      \                        CommerceSubscriptionsService.CHROME_MANAGED_SUBSCRIPTIONS_TIMESTAMP, -1);\n        setupTestOnResume();\n\
      \        assertTrue(\n                mSharedPreferencesManager.readLong(\n                                CommerceSubscriptionsService.CHROME_MANAGED_SUBSCRIPTIONS_TIMESTAMP,\n\
      \                                -1)\n                        > expiredTimestamp);\n        assertThat(\n          \
      \      RecordHistogram.getHistogramTotalCountForTesting(\n                        PriceDropNotificationManagerImpl.NOTIFICATION_ENABLED_HISTOGRAM),\n\
      \                equalTo(0));\n        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n\
      \                        PriceDropNotificationManagerImpl\n                                .NOTIFICATION_CHROME_MANAGED_COUNT_HISTOGRAM),\n\
      \                equalTo(0));\n        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n\
      \                        PriceDropNotificationManagerImpl.NOTIFICATION_USER_MANAGED_COUNT_HISTOGRAM),\n            \
      \    equalTo(0));\n    }"
  count: 1
- description: Keep the one-second-old timestamp unchanged inside the selected one-day rate limit
  regex:
    pattern: "    public void testOnResume_TooFrequent() {\n        mSharedPreferencesManager.writeLong(\n               \
      \ CommerceSubscriptionsService.CHROME_MANAGED_SUBSCRIPTIONS_TIMESTAMP,\n                System.currentTimeMillis());\n\
      \n        setupTestOnResume();\n        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n\
      \                        PriceDropNotificationManagerImpl.NOTIFICATION_ENABLED_HISTOGRAM),\n                equalTo(0));\n\
      \    }"
    replace: "    public void testOnResume_TooFrequent() {\n        long recentTimestamp = System.currentTimeMillis() - TimeUnit.SECONDS.toMillis(1);\n\
      \        mSharedPreferencesManager.writeLong(\n                CommerceSubscriptionsService.CHROME_MANAGED_SUBSCRIPTIONS_TIMESTAMP,\n\
      \                recentTimestamp);\n\n        setupTestOnResume();\n        assertThat(\n                mSharedPreferencesManager.readLong(\n\
      \                        CommerceSubscriptionsService.CHROME_MANAGED_SUBSCRIPTIONS_TIMESTAMP, -1),\n               \
      \ equalTo(recentTimestamp));\n        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n\
      \                        PriceDropNotificationManagerImpl.NOTIFICATION_ENABLED_HISTOGRAM),\n                equalTo(0));\n\
      \    }"
  count: 1
