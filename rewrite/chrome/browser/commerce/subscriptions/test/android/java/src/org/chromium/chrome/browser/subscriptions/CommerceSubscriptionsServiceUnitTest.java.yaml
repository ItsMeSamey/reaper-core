- description: Observe zero optional notification metrics through the existing unavailable service path
  regex:
    pattern: "    public void testOnResume() {\n        setupTestOnResume();\n        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n\
      \                        PriceDropNotificationManagerImpl.NOTIFICATION_ENABLED_HISTOGRAM),\n                equalTo(1));\n\
      \        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n                        PriceDropNotificationManagerImpl\n\
      \                                .NOTIFICATION_CHROME_MANAGED_COUNT_HISTOGRAM),\n                equalTo(1));\n    \
      \    assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n                        PriceDropNotificationManagerImpl.NOTIFICATION_USER_MANAGED_COUNT_HISTOGRAM),\n\
      \                equalTo(1));\n    }"
    replace: "    public void testOnResume_UnavailableShopping() {\n        setupTestOnResume();\n        assertThat(\n  \
      \              RecordHistogram.getHistogramTotalCountForTesting(\n                        PriceDropNotificationManagerImpl.NOTIFICATION_ENABLED_HISTOGRAM),\n\
      \                equalTo(0));\n        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n\
      \                        PriceDropNotificationManagerImpl\n                                .NOTIFICATION_CHROME_MANAGED_COUNT_HISTOGRAM),\n\
      \                equalTo(0));\n        assertThat(\n                RecordHistogram.getHistogramTotalCountForTesting(\n\
      \                        PriceDropNotificationManagerImpl.NOTIFICATION_USER_MANAGED_COUNT_HISTOGRAM),\n            \
      \    equalTo(0));\n    }"
  count: 1
