substitutions:
- description: Retain only generic factory headers on Android
  regex:
    pattern: '#include "chrome/browser/bookmarks/bookmark_model_factory.h"

      #include "chrome/browser/browser_process.h"

      #include "chrome/browser/history/history_service_factory.h"

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service.h"

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service_factory.h"

      #include "chrome/browser/persisted_state_db/session_proto_db_factory.h"

      #include "chrome/browser/power_bookmarks/power_bookmark_service_factory.h"

      #include "chrome/browser/profiles/profile.h"

      #include "chrome/browser/sessions/tab_restore_service_factory.h"

      #include "chrome/browser/signin/identity_manager_factory.h"

      #include "chrome/browser/sync/sync_service_factory.h"

      #include "chrome/common/chrome_features.h"

      #include "components/commerce/content/browser/commerce_tab_helper.h"

      #include "components/commerce/content/browser/web_extractor_impl.h"

      #include "components/commerce/core/commerce_feature_list.h"

      #include "components/commerce/core/proto/commerce_subscription_db_content.pb.h"

      #include "components/commerce/core/proto/discount_infos_db_content.pb.h"  // nogncheck

      #include "components/commerce/core/proto/parcel_tracking_db_content.pb.h"

      #include "components/commerce/core/shopping_service.h"

      #include "components/prefs/pref_service.h"

      #include "components/variations/service/variations_service_utils.h"

      #include "content/public/browser/storage_partition.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "components/commerce/core/proto/cart_db_content.pb.h"  // nogncheck

      #include "components/commerce/core/proto/discounts_db_content.pb.h"  // nogncheck

      #endif

      '
    replace: '#include "build/build_config.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/bookmarks/bookmark_model_factory.h"

      #include "chrome/browser/browser_process.h"

      #include "chrome/browser/history/history_service_factory.h"

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service.h"

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service_factory.h"

      #include "chrome/browser/persisted_state_db/session_proto_db_factory.h"

      #include "chrome/browser/power_bookmarks/power_bookmark_service_factory.h"

      #include "chrome/browser/profiles/profile.h"

      #include "chrome/browser/sessions/tab_restore_service_factory.h"

      #include "chrome/browser/signin/identity_manager_factory.h"

      #include "chrome/browser/sync/sync_service_factory.h"

      #include "chrome/common/chrome_features.h"

      #include "components/commerce/content/browser/commerce_tab_helper.h"

      #include "components/commerce/content/browser/web_extractor_impl.h"

      #include "components/commerce/core/commerce_feature_list.h"

      #include "components/commerce/core/proto/commerce_subscription_db_content.pb.h"

      #include "components/commerce/core/proto/discount_infos_db_content.pb.h"  // nogncheck

      #include "components/commerce/core/proto/parcel_tracking_db_content.pb.h"

      #include "components/commerce/core/shopping_service.h"

      #include "components/prefs/pref_service.h"

      #include "components/variations/service/variations_service_utils.h"

      #include "content/public/browser/storage_partition.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "components/commerce/core/proto/cart_db_content.pb.h"  // nogncheck

      #include "components/commerce/core/proto/discounts_db_content.pb.h"  // nogncheck

      #endif

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Preserve the absent Android shopping service contract
  regex:
    pattern: "\n  return static_cast<ShoppingService*>(\n      GetInstance()->GetServiceForBrowserContext(context, true));\n"
    replace: "\n#if BUILDFLAG(IS_ANDROID)\n  return nullptr;\n#else\n  return static_cast<ShoppingService*>(\n      GetInstance()->GetServiceForBrowserContext(context,\
      \ true));\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Return the same absent Android service for noncreating lookup
  regex:
    pattern: "\n  return static_cast<ShoppingService*>(\n      GetInstance()->GetServiceForBrowserContext(context, false));\n"
    replace: "\n#if BUILDFLAG(IS_ANDROID)\n  return nullptr;\n#else\n  return static_cast<ShoppingService*>(\n      GetInstance()->GetServiceForBrowserContext(context,\
      \ false));\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude shopping-only factory dependencies on Android
  regex:
    pattern: "\n  DependsOn(BookmarkModelFactory::GetInstance());\n  DependsOn(IdentityManagerFactory::GetInstance());\n \
      \ DependsOn(OptimizationGuideKeyedServiceFactory::GetInstance());\n  DependsOn(PowerBookmarkServiceFactory::GetInstance());\n\
      \  DependsOn(SessionProtoDBFactory<\n            commerce_subscription_db::CommerceSubscriptionContentProto>::\n   \
      \             GetInstance());\n  DependsOn(SessionProtoDBFactory<\n            parcel_tracking_db::ParcelTrackingContent>::GetInstance());\n\
      \  DependsOn(HistoryServiceFactory::GetInstance());\n#if !BUILDFLAG(IS_ANDROID)\n  DependsOn(SessionProtoDBFactory<\n\
      \            discounts_db::DiscountsContentProto>::GetInstance());\n#endif\n  DependsOn(SessionProtoDBFactory<\n   \
      \         discount_infos_db::DiscountInfosContentProto>::GetInstance());\n  DependsOn(SyncServiceFactory::GetInstance());\n\
      \  DependsOn(TabRestoreServiceFactory::GetInstance());\n"
    replace: "\n#if !BUILDFLAG(IS_ANDROID)\n  DependsOn(BookmarkModelFactory::GetInstance());\n  DependsOn(IdentityManagerFactory::GetInstance());\n\
      \  DependsOn(OptimizationGuideKeyedServiceFactory::GetInstance());\n  DependsOn(PowerBookmarkServiceFactory::GetInstance());\n\
      \  DependsOn(SessionProtoDBFactory<\n            commerce_subscription_db::CommerceSubscriptionContentProto>::\n   \
      \             GetInstance());\n  DependsOn(SessionProtoDBFactory<\n            parcel_tracking_db::ParcelTrackingContent>::GetInstance());\n\
      \  DependsOn(HistoryServiceFactory::GetInstance());\n#if !BUILDFLAG(IS_ANDROID)\n  DependsOn(SessionProtoDBFactory<\n\
      \            discounts_db::DiscountsContentProto>::GetInstance());\n#endif\n  DependsOn(SessionProtoDBFactory<\n   \
      \         discount_infos_db::DiscountInfosContentProto>::GetInstance());\n  DependsOn(SyncServiceFactory::GetInstance());\n\
      \  DependsOn(TabRestoreServiceFactory::GetInstance());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude real shopping service construction on Android
  regex:
    pattern: "\n  Profile* profile = Profile::FromBrowserContext(context);\n  return std::make_unique<ShoppingService>(\n\
      \      GetCurrentCountryCode(g_browser_process->variations_service()),\n      g_browser_process->GetApplicationLocale(),\n\
      \      BookmarkModelFactory::GetInstance()->GetForBrowserContext(context),\n      OptimizationGuideKeyedServiceFactory::GetForProfile(profile),\n\
      \      profile->GetPrefs(), IdentityManagerFactory::GetForProfile(profile),\n      SyncServiceFactory::GetForProfile(profile),\n\
      \      profile->GetDefaultStoragePartition()\n          ->GetURLLoaderFactoryForBrowserProcess(),\n      SessionProtoDBFactory<commerce_subscription_db::\n\
      \                                CommerceSubscriptionContentProto>::GetInstance()\n          ->GetForProfile(context),\n\
      \      PowerBookmarkServiceFactory::GetForBrowserContext(context),\n#if !BUILDFLAG(IS_ANDROID)\n      SessionProtoDBFactory<discounts_db::DiscountsContentProto>::GetInstance()\n\
      \          ->GetForProfile(context),\n      SessionProtoDBFactory<cart_db::ChromeCartContentProto>::GetInstance()\n\
      \          ->GetForProfile(context),\n#else\n      nullptr, nullptr,\n#endif\n      SessionProtoDBFactory<\n       \
      \   discount_infos_db::DiscountInfosContentProto>::GetInstance()\n          ->GetForProfile(context),\n      SessionProtoDBFactory<\n\
      \          parcel_tracking_db::ParcelTrackingContent>::GetInstance()\n          ->GetForProfile(context),\n      HistoryServiceFactory::GetForProfile(profile,\n\
      \                                           ServiceAccessType::EXPLICIT_ACCESS),\n      std::make_unique<commerce::WebExtractorImpl>(),\n\
      \      TabRestoreServiceFactory::GetForProfile(profile));\n"
    replace: "\n#if BUILDFLAG(IS_ANDROID)\n  return nullptr;\n#else\n  Profile* profile = Profile::FromBrowserContext(context);\n\
      \  return std::make_unique<ShoppingService>(\n      GetCurrentCountryCode(g_browser_process->variations_service()),\n\
      \      g_browser_process->GetApplicationLocale(),\n      BookmarkModelFactory::GetInstance()->GetForBrowserContext(context),\n\
      \      OptimizationGuideKeyedServiceFactory::GetForProfile(profile),\n      profile->GetPrefs(), IdentityManagerFactory::GetForProfile(profile),\n\
      \      SyncServiceFactory::GetForProfile(profile),\n      profile->GetDefaultStoragePartition()\n          ->GetURLLoaderFactoryForBrowserProcess(),\n\
      \      SessionProtoDBFactory<commerce_subscription_db::\n                                CommerceSubscriptionContentProto>::GetInstance()\n\
      \          ->GetForProfile(context),\n      PowerBookmarkServiceFactory::GetForBrowserContext(context),\n#if !BUILDFLAG(IS_ANDROID)\n\
      \      SessionProtoDBFactory<discounts_db::DiscountsContentProto>::GetInstance()\n          ->GetForProfile(context),\n\
      \      SessionProtoDBFactory<cart_db::ChromeCartContentProto>::GetInstance()\n          ->GetForProfile(context),\n\
      #else\n      nullptr, nullptr,\n#endif\n      SessionProtoDBFactory<\n          discount_infos_db::DiscountInfosContentProto>::GetInstance()\n\
      \          ->GetForProfile(context),\n      SessionProtoDBFactory<\n          parcel_tracking_db::ParcelTrackingContent>::GetInstance()\n\
      \          ->GetForProfile(context),\n      HistoryServiceFactory::GetForProfile(profile,\n                        \
      \                   ServiceAccessType::EXPLICIT_ACCESS),\n      std::make_unique<commerce::WebExtractorImpl>(),\n  \
      \    TabRestoreServiceFactory::GetForProfile(profile));\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Avoid eager registration of the absent Android backend
  regex:
    pattern: "\n  if (base::FeatureList::IsEnabled(\n          ::features::kLazyKeyedServiceInstantiation) &&\n      ::features::kLazyKeyedServiceInstantiationCommerceAndUI.Get())\
      \ {\n    return false;\n  }\n  return true;\n"
    replace: "\n#if BUILDFLAG(IS_ANDROID)\n  return false;\n#else\n  if (base::FeatureList::IsEnabled(\n          ::features::kLazyKeyedServiceInstantiation)\
      \ &&\n      ::features::kLazyKeyedServiceInstantiationCommerceAndUI.Get()) {\n    return false;\n  }\n  return true;\n\
      #endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
