substitutions:
- description: Remove dedicated discount-only button branch expectation
  regex:
    pattern: "    @Test\n    public void testPriceInsightsButtonControllerOnClick_withCommerceBottomSheet() {\n        doReturn(true).when(mCommerceFeatureUtilsJniMock).isDiscountInfoApiEnabled(anyLong());\n\
      \        PriceInsightsButtonController buttonController = createButtonController();\n        buttonController.onClick(null);\n\
      \        verify(mMockCommerceBottomSheetContentController, times(1)).requestShowContent();\n    }\n"
    replace: ''
  count: 1
- description: Remove unavailable CommerceFeatureUtils native mock
  regex:
    pattern: '    @Mock private CommerceFeatureUtils.Natives mCommerceFeatureUtilsJniMock;

      '
    replace: ''
  count: 1
- description: Use real unavailable CommerceFeatureUtils values
  regex:
    pattern: '        CommerceFeatureUtilsJni.setInstanceForTesting(mCommerceFeatureUtilsJniMock);

      '
    replace: ''
  count: 1
- description: Remove newly unused CommerceFeatureUtils import
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtils;

      '
    replace: ''
  count: 1
- description: Remove newly unused CommerceFeatureUtilsJni import
  regex:
    pattern: 'import org.chromium.components.commerce.core.CommerceFeatureUtilsJni;

      '
    replace: ''
  count: 1
- description: Remove newly unused anyLong import
  regex:
    pattern: 'import static org.mockito.ArgumentMatchers.anyLong;

      '
    replace: ''
  count: 1
