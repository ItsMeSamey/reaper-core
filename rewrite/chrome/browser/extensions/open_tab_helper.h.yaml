substitutions:

- description: "Preserve explicit Android opener container before tab creation: Android-only pre-creation opener parameter"
  count: 1
  regex:
    re_pattern: "\\ \\ \\ \\ std::optional<int>\\ split_with_tab_id;\\\n"
    replace: "    std::optional<int> split_with_tab_id;\n#if BUILDFLAG(IS_ANDROID)\n    // Resolve an explicitly requested opener before choosing the tab partition.\n    std::optional<int> opener_tab_id;\n#endif\n"
