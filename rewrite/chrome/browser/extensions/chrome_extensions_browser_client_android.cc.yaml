substitutions:
- description: Use the Android-supported password-reuse backend when Safe Browsing is available.
  regex:
    pattern: '#include "content/public/browser/browser_context.h"'
    replace: '#include "components/safe_browsing/buildflags.h"

      #include "content/public/browser/browser_context.h"'
- description: Keep unavailable Safe Browsing builds free of password-protection dependencies.
  regex:
    pattern: using content::BrowserContext;
    replace: '#if BUILDFLAG(SAFE_BROWSING_AVAILABLE)

      #include "chrome/browser/safe_browsing/chrome_password_reuse_detection_manager_client.h"

      #endif  // BUILDFLAG(SAFE_BROWSING_AVAILABLE)


      using content::BrowserContext;'
- description: Attach the shared password observer without enabling desktop extension telemetry.
  regex:
    pattern: 'namespace extensions {


      void ChromeExtensionsBrowserClient::Init()'
    replace: "namespace extensions {\n\nnamespace {\n#if BUILDFLAG(SAFE_BROWSING_AVAILABLE)\nclass AndroidSafeBrowsingDelegate final : public SafeBrowsingDelegate {\n public:\n  void CreatePasswordReuseDetectionManager(\n      content::WebContents* web_contents) const override {\n    ChromePasswordReuseDetectionManagerClient::CreateForWebContents(web_contents);\n  }\n};\n#endif  // BUILDFLAG(SAFE_BROWSING_AVAILABLE)\n}  // namespace\n\nvoid ChromeExtensionsBrowserClient::Init()"
- description: Select the shared Android password-reuse implementation, retaining the no-Safe-Browsing fallback.
  regex:
    pattern: "  // Full safe browsing is not supported so use a stub delegate.\n  safe_browsing_delegate_ = std::make_unique<SafeBrowsingDelegate>();"
    replace: "#if BUILDFLAG(SAFE_BROWSING_AVAILABLE)\n  safe_browsing_delegate_ = std::make_unique<AndroidSafeBrowsingDelegate>();\n#else\n  safe_browsing_delegate_ = std::make_unique<SafeBrowsingDelegate>();\n#endif  // BUILDFLAG(SAFE_BROWSING_AVAILABLE)"
