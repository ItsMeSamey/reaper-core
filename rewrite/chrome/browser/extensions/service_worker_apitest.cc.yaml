substitutions:
- description: "Require no Android optional Extensions.ServiceWorkerBackground.StartWorkerStatus count."
  regex:
    re_pattern: "\\ \\ histograms\\.ExpectUniqueSample\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.StartWorkerStatus\",\\ /\\*sample=\\*/true,\\\n\\ \\ \\ \\ \\ \\ /\\*expected_bucket_count=\\*/1\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histograms.ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.StartWorkerStatus\", /*expected_count=*/0);\n#else\n  histograms.ExpectUniqueSample(\n      \"Extensions.ServiceWorkerBackground.StartWorkerStatus\", /*sample=*/true,\n      /*expected_bucket_count=*/1);\n#endif\n"
  count: 1
- description: "Require no Android optional Extensions.ServiceWorkerBackground.StartWorkerTime count."
  regex:
    re_pattern: "\\ \\ histograms\\.ExpectTotalCount\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.StartWorkerTime\",\\\n\\ \\ \\ \\ \\ \\ /\\*expected_count=\\*/1\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histograms.ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.StartWorkerTime\", /*expected_count=*/0);\n#else\n  histograms.ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.StartWorkerTime\",\n      /*expected_count=*/1);\n#endif\n"
  count: 1
- description: "Require no Android optional Extensions.ServiceWorkerBackground.StartWorkerStatus count."
  regex:
    re_pattern: "\\ \\ histograms\\.ExpectUniqueSample\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.StartWorkerStatus\",\\ /\\*sample=\\*/false,\\\n\\ \\ \\ \\ \\ \\ /\\*expected_bucket_count=\\*/1\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histograms.ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.StartWorkerStatus\", /*expected_count=*/0);\n#else\n  histograms.ExpectUniqueSample(\n      \"Extensions.ServiceWorkerBackground.StartWorkerStatus\", /*sample=*/false,\n      /*expected_bucket_count=*/1);\n#endif\n"
  count: 1
- description: "Require no Android optional Extensions.ServiceWorkerBackground.StartWorker_FailStatus count."
  regex:
    re_pattern: "\\ \\ histograms\\.ExpectUniqueSample\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.StartWorker_FailStatus\",\\\n\\ \\ \\ \\ \\ \\ //\\ TODO\\(crbug\\.com/40909770\\):\\ Shouldn't\\ this\\ be\\ kErrorInstallWorkerFailed\\\n\\ \\ \\ \\ \\ \\ //\\ since\\ failure\\ is\\ due\\ to\\ throwing\\ error\\ in\\ oninstall\\?\\\n\\ \\ \\ \\ \\ \\ /\\*sample=\\*/blink::ServiceWorkerStatusCode::kErrorNotFound,\\\n\\ \\ \\ \\ \\ \\ /\\*expected_bucket_count=\\*/1\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histograms.ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.StartWorker_FailStatus\", /*expected_count=*/0);\n#else\n  histograms.ExpectUniqueSample(\n      \"Extensions.ServiceWorkerBackground.StartWorker_FailStatus\",\n      // TODO(crbug.com/40909770): Shouldn't this be kErrorInstallWorkerFailed\n      // since failure is due to throwing error in oninstall?\n      /*sample=*/blink::ServiceWorkerStatusCode::kErrorNotFound,\n      /*expected_bucket_count=*/1);\n#endif\n"
  count: 1
- description: "Require no Android optional Extensions.ServiceWorkerBackground.StartWorkerTime_Fail count."
  regex:
    re_pattern: "\\ \\ histograms\\.ExpectTotalCount\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.StartWorkerTime_Fail\",\\\n\\ \\ \\ \\ \\ \\ /\\*expected_count=\\*/1\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histograms.ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.StartWorkerTime_Fail\", /*expected_count=*/0);\n#else\n  histograms.ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.StartWorkerTime_Fail\",\n      /*expected_count=*/1);\n#endif\n"
  count: 1
- description: "Require absent Android mismatch counters while retaining the ordinary mitigation wait."
  regex:
    re_pattern: "\\ \\ EXPECT_EQ\\(1,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ histogram_tester\\(\\)\\.GetBucketCount\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.RegistrationWhenExpected\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ false\\)\\);\\\n\\ \\ EXPECT_EQ\\(\\\n\\ \\ \\ \\ \\ \\ 1,\\ histogram_tester\\(\\)\\.GetBucketCount\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.RegistrationMismatchLocation\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ mojom::ManifestLocation::kUnpacked\\)\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histogram_tester().ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.RegistrationWhenExpected\", 0);\n  histogram_tester().ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.RegistrationMismatchLocation\", 0);\n#else\n  EXPECT_EQ(1,\n            histogram_tester().GetBucketCount(\n                \"Extensions.ServiceWorkerBackground.RegistrationWhenExpected\",\n                false));\n  EXPECT_EQ(\n      1, histogram_tester().GetBucketCount(\n             \"Extensions.ServiceWorkerBackground.RegistrationMismatchLocation\",\n             mojom::ManifestLocation::kUnpacked));\n#endif\n"
  count: 1
- description: "Require no optional Android count after retained mitigation completion."
  regex:
    re_pattern: "\\ \\ EXPECT_EQ\\(\\\n\\ \\ \\ \\ \\ \\ 1,\\\n\\ \\ \\ \\ \\ \\ histogram_tester\\(\\)\\.GetBucketCount\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.RegistrationMismatchMitigated2\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ true\\)\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histogram_tester().ExpectTotalCount(\n      \"Extensions.ServiceWorkerBackground.RegistrationMismatchMitigated2\", 0);\n#else\n  EXPECT_EQ(\n      1,\n      histogram_tester().GetBucketCount(\n          \"Extensions.ServiceWorkerBackground.RegistrationMismatchMitigated2\",\n          true));\n#endif\n"
  count: 1
