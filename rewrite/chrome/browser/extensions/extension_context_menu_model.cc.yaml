substitutions:
- description: "Android extension-origin native settings route 1"
  regex:
    pattern: "#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/ui/browser_element_identifiers.h\"\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/ui/android/extensions/extension_developer_private_bridge.h\"\n#else\n#include \"chrome/browser/ui/browser_element_identifiers.h\"\n"
  count: 1
- description: "Android extension-origin native settings route 2"
  regex:
    pattern: "    case VIEW_WEB_PERMISSIONS:\n#if BUILDFLAG(ENABLE_EXTENSIONS)\n      chrome::ShowSiteSettings(browser_, extension->url());\n#else\n      // TODO(crbug.com/441744719): Show site settings page on Desktop Android.\n      NOTIMPLEMENTED();\n#endif\n      break;\n"
    replace: "    case VIEW_WEB_PERMISSIONS:\n#if BUILDFLAG(ENABLE_EXTENSIONS)\n      chrome::ShowSiteSettings(browser_, extension->url());\n#elif BUILDFLAG(IS_ANDROID)\n      ExtensionDeveloperPrivateBridge::ShowSiteSettings(extension->id());\n#else\n      NOTIMPLEMENTED();\n#endif\n      break;\n"
  count: 1
