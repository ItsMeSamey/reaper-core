substitutions:
  - description: |
      Use sequential updates for extensions when the feature is enabled.

      go-updater backend currently struggles with parallel update, this feature
      allows us to serialize extension updates to avoid issues with the backend.
    preempt_function_impl:
      function_name: ChromeExtensionsBrowserClient::CreateUpdateClient
      code: |-
        if (base::FeatureList::IsEnabled(
          extensions_features::kBraveSequentialExtensionsUpdate)) {
          return update_client::SequentialUpdateClientFactory(configurator);
        }

  - description: |
      Use a BraveExtensionsAPIClient instead of a ChromeExtensionsAPIClient.
    regex:
      pattern: 'ChromeExtensionsAPIClient'
      replace: 'BraveExtensionsAPIClient'

  - description: |
      Use a BraveUpdateClientConfig instead of a ChromeUpdateClientConfig.
    regex:
      pattern: 'ChromeUpdateClientConfig'
      replace: 'BraveUpdateClientConfig'

  - description: Use the dedicated Android extension database, never the remote URL-only backend.
    regex:
      pattern: 'ChromeExtensionsBrowserClient::GetSafeBrowsingDatabaseManager() const {

        #if BUILDFLAG(SAFE_BROWSING_DB_LOCAL)'
      replace: "ChromeExtensionsBrowserClient::GetSafeBrowsingDatabaseManager() const {\n#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(SAFE_BROWSING_AVAILABLE)\n  return g_browser_process && g_browser_process->safe_browsing_service()\n             ? g_browser_process->safe_browsing_service()\n                   ->extension_database_manager()\n             : nullptr;\n#elif BUILDFLAG(SAFE_BROWSING_DB_LOCAL)"

  - description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
    regex:
      re_pattern: '\ \ \ \ content::BrowserContext\*\ context\)\ \{\

        \ \ return\ static_cast<Profile\*>\(context\)\->GetPrimaryOTRProfile\(\

        \ \ \ \ \ \ /\*create_if_needed=\*/true\);\

        \}\

        \

        content::BrowserContext\*\ ChromeExtensionsBrowserClient::GetOriginalContext\(\

        \ \ \ \ content::BrowserContext\*\ context\)\ \{\

        \ \ DCHECK\(context\);\

        '
      replace: "    content::BrowserContext* context) {\n  return static_cast<Profile*>(context)->GetPrimaryOTRProfile(\n  \
        \    /*create_if_needed=*/true);\n}\n\n#if BUILDFLAG(IS_ANDROID)\nstd::vector<content::BrowserContext*>\nChromeExtensionsBrowserClient::GetRelatedContextsForFactoryReset(\n\
        \    content::BrowserContext* context) const {\n  Profile* original =\n      Profile::FromBrowserContext(context)->GetOriginalProfile();\n\
        \  std::vector<content::BrowserContext*> contexts{original};\n  for (Profile* otr : original->GetAllOffTheRecordProfiles())\
        \ {\n    contexts.push_back(otr);\n  }\n  return contexts;\n}\n#endif\n\ncontent::BrowserContext* ChromeExtensionsBrowserClient::GetOriginalContext(\n\
        \    content::BrowserContext* context) {\n  DCHECK(context);\n"
