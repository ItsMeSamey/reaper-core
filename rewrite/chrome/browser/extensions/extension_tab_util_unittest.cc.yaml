# Android pending Android tab lifecycle shutdown ownership.
substitutions:
- description: Reject lifecycle mutation without a live policy graph instead of silently succeeding
  regex:
    re_pattern: 'namespace\ extensions\ \{\

      '
    replace: "namespace extensions {\n\n#if BUILDFLAG(IS_ANDROID)\nusing ExtensionTabLifecycleUnavailableTest = ChromeRenderViewHostTestHarness;\n\nTEST_F(ExtensionTabLifecycleUnavailableTest, RejectMutationWithoutGraph) {\n  EXPECT_TRUE(ExtensionTabUtil::IsTabAutoDiscardable(web_contents()));\n  EXPECT_FALSE(ExtensionTabUtil::IsTabFrozen(web_contents()));\n  EXPECT_FALSE(ExtensionTabUtil::SetTabAutoDiscardable(web_contents(), false));\n  EXPECT_TRUE(ExtensionTabUtil::IsTabAutoDiscardable(web_contents()));\n}\n#endif\n"
