substitutions:
- description: Route Android spanning extension Options to the original profile and exercise real native destinations
  regex:
    re_pattern: '\#include\ "testing/gtest/include/gtest/gtest\.h"\

      \#include\ "ui/base/l10n/l10n_util\.h"\

      \#include\ "url/origin\.h"\

      \

      namespace\ extensions\ \{\

      \

      '
    replace: '#include "testing/gtest/include/gtest/gtest.h"

      #include "ui/base/l10n/l10n_util.h"

      #include "url/origin.h"


      #if BUILDFLAG(IS_ANDROID)

      #include <set>

      #include <vector>


      #include "base/android/jni_android.h"

      #include "base/android/jni_array.h"

      #include "base/check.h"

      #include "base/memory/weak_ptr.h"

      #include "base/run_loop.h"

      #include "base/test/run_until.h"

      #include "chrome/browser/profiles/profile.h"

      #include "chrome/browser/tab_list/tab_list_interface.h"

      #include "chrome/browser/ui/browser_window/public/browser_window_interface_iterator.h"

      #include "chrome/browser/ui/browser_window/public/profile_browser_collection.h"

      #include "components/tabs/public/tab_interface.h"

      #include "extensions/test/test_extension_dir.h"

      #include "ui/base/base_window.h"


      // JNI headers follow their type conversions.

      #include "chrome/test/test_support_jni_headers/BrowserWindowCreatorBridge_jni.h"

      #endif


      namespace extensions {


      '
- description: Route Android spanning extension Options to the original profile and exercise real native destinations
  regex:
    re_pattern: '\ \ \ \ \ \ CommandState::kAbsent\);\

      \}\

      \

      \}\ \ //\ namespace\ extensions\

      '
    replace: "      CommandState::kAbsent);\n}\n\n#if BUILDFLAG(IS_ANDROID)\n// Exercise the same native Options command used by the Android extension row\n// menu, including the actual extension navigation and its destination profile.\nclass ExtensionOptionsIncognitoAndroidTest : public ExtensionBrowserTest {\n public:\n  void SetUpOnMainThread() override {\n    ExtensionBrowserTest::SetUpOnMainThread();\n    original_profile_ = profile()->GetWeakPtr();\n    regular_browser_ = browser_window_interface()->GetWeakPtr();\n    for (auto* browser : GetAllBrowserWindowInterfaces()) {\n      initial_window_ids_.insert(browser->GetSessionID().id());\n    }\n    ASSERT_TRUE(HeldPendingTaskIds().empty());\n  }\n\n  void TearDownOnMainThread() override {\n    Java_BrowserWindowCreatorBridge_clearActivityCreationPauseForTesting(\n        base::android::AttachCurrentThread());\n    if (resumed_creation_outstanding_) {\n      // A resumed Activity is no longer in the held-task map. Do not allow it\n      // to complete after this test. If its callback cannot be observed through\n      // the options navigation, stop this harness process instead of leaking\n      // an unretired creation into a later test.\n      CHECK(base::test::RunUntil([this] {\n        return FindCompletedOptionsWindow();\n      })) << \"Test-owned Options window creation did not retire\";\n      resumed_creation_outstanding_ = false;\n    }\n    base::RunLoop().RunUntilIdle();\n    std::vector<base::WeakPtr<BrowserWindowInterface>> created_windows;\n    for (auto* browser : GetAllBrowserWindowInterfaces()) {\n      if (!initial_window_ids_.contains(browser->GetSessionID().id())) {\n        created_windows.push_back(browser->GetWeakPtr());\n      }\n    }\n    for (const auto& browser : created_windows) {\n      if (browser) {\n        browser->GetWindow()->Close();\n        CHECK(base::test::RunUntil([&browser] { return !browser; }))\n            << \"Test-owned Options window did not close\";\n      }\n    }\n    ExtensionBrowserTest::TearDownOnMainThread();\n  }\n\n  void PrepareOptions(bool split) {\n    auto manifest = base::DictValue()\n                        .Set(\"manifest_version\", 3)\n                        .Set(\"name\", \"Incognito options destination\")\n                        .Set(\"version\", \"1\")\n                        .Set(\"action\", base::DictValue())\n                        .Set(\"options_ui\", base::DictValue()\n                                               .Set(\"page\", \"options.html\")\n                                               .Set(\"open_in_tab\", true));\n    if (split) {\n      manifest.Set(\"incognito\", \"split\");\n    }\n    extension_dir_.WriteManifest(std::move(manifest));\n    extension_dir_.WriteFile(FILE_PATH_LITERAL(\"options.html\"),\n                             \"<html><body><div id='options-marker'>Options \"\n                             \"loaded</div></body></html>\");\n    extension_ = LoadExtension(extension_dir_.UnpackedPath(),\n                               {.allow_in_incognito = true});\n    ASSERT_TRUE(extension_);\n    auto* incognito = CreateIncognitoBrowserWindow();\n    ASSERT_TRUE(incognito);\n    incognito_browser_ = incognito->GetWeakPtr();\n    ASSERT_TRUE(incognito->GetProfile()->IsOffTheRecord());\n    auto* tabs = TabListInterface::From(incognito);\n    ASSERT_TRUE(tabs);\n    ASSERT_TRUE(tabs->GetActiveTab());\n    ASSERT_TRUE(content::NavigateToURL(tabs->GetActiveTab()->GetContents(),\n                                       GURL(\"about:blank\")));\n  }\n\n  void ExecuteOptions() {\n    ASSERT_TRUE(incognito_browser_);\n    ExtensionContextMenuModel menu(extension_.get(), incognito_browser_.get(),\n                                   /*is_pinned=*/false, nullptr,\n                                   /*can_show_icon_in_toolbar=*/true,\n                                   ContextMenuSource::kMenuItem);\n    ASSERT_TRUE(menu.GetIndexOfCommandId(ExtensionContextMenuModel::OPTIONS)\n                    .has_value());\n    ASSERT_TRUE(menu.IsCommandIdEnabled(ExtensionContextMenuModel::OPTIONS));\n    menu.ExecuteCommand(ExtensionContextMenuModel::OPTIONS, 0);\n  }\n\n  void ExpectLoadedOptions(BrowserWindowInterface* browser, Profile* expected) {\n    ASSERT_TRUE(browser);\n    auto* tabs = TabListInterface::From(browser);\n    ASSERT_TRUE(tabs);\n    ASSERT_TRUE(tabs->GetActiveTab());\n    auto* contents = tabs->GetActiveTab()->GetContents();\n    ASSERT_TRUE(contents);\n    EXPECT_EQ(expected, contents->GetBrowserContext());\n    ASSERT_TRUE(content::WaitForLoadStop(contents));\n    EXPECT_EQ(extension_->GetResourceURL(\"options.html\"),\n              contents->GetLastCommittedURL());\n    EXPECT_EQ(\n        \"Options loaded\",\n        content::EvalJs(\n            contents, \"document.getElementById('options-marker').textContent\"));\n  }\n\n  void CheckExistingWindowDestination(bool split) {\n    ASSERT_NO_FATAL_FAILURE(PrepareOptions(split));\n    auto* regular_tabs = TabListInterface::From(regular_browser_.get());\n    auto* incognito_tabs = TabListInterface::From(incognito_browser_.get());\n    const int regular_count = regular_tabs->GetTabCount();\n    const int incognito_count = incognito_tabs->GetTabCount();\n    ASSERT_NO_FATAL_FAILURE(ExecuteOptions());\n    // Watch both destinations. The old spanning-mode implementation adds an\n    // Incognito tab, so fail a destination assertion instead of just timing\n    // out.\n    ASSERT_TRUE(base::test::RunUntil([&] {\n      return !regular_browser_ || !incognito_browser_ ||\n             regular_tabs->GetTabCount() != regular_count ||\n             incognito_tabs->GetTabCount() != incognito_count;\n    }));\n    ASSERT_TRUE(regular_browser_);\n    ASSERT_TRUE(incognito_browser_);\n    ASSERT_EQ(regular_count + (split ? 0 : 1), regular_tabs->GetTabCount());\n    ASSERT_EQ(incognito_count + (split ? 1 : 0), incognito_tabs->GetTabCount());\n    ASSERT_NO_FATAL_FAILURE(ExpectLoadedOptions(\n        split ? incognito_browser_.get() : regular_browser_.get(),\n        split ? incognito_browser_->GetProfile() : original_profile_.get()));\n  }\n\n  std::vector<int> HeldPendingTaskIds() {\n    JNIEnv* env = base::android::AttachCurrentThread();\n    std::vector<int> ids;\n    base::android::JavaIntArrayToIntVector(\n        env,\n        Java_BrowserWindowCreatorBridge_getHeldPendingTaskIdsForTesting(env),\n        &ids);\n    return ids;\n  }\n\n  void StartOptionsWithoutRegularWindow() {\n    ASSERT_NO_FATAL_FAILURE(PrepareOptions(/*split=*/false));\n    regular_browser_->GetWindow()->Close();\n    CHECK(base::test::RunUntil([this] { return !regular_browser_; }))\n        << \"Initial regular browser did not close\";\n    ASSERT_TRUE(original_profile_);\n    ASSERT_FALSE(\n        ProfileBrowserCollection::GetForProfile(original_profile_.get())\n            ->FindTabbedBrowser());\n    Java_BrowserWindowCreatorBridge_pauseActivityCreationForTesting(\n        base::android::AttachCurrentThread());\n    ASSERT_NO_FATAL_FAILURE(ExecuteOptions());\n    // CreateBrowserWindow synchronously registers this held task before it\n    // returns; only the subsequent Activity creation is delayed by the seam.\n    ASSERT_EQ(1u, HeldPendingTaskIds().size());\n  }\n\n  void ResumeOptionsWindow() {\n    auto ids = HeldPendingTaskIds();\n    ASSERT_EQ(1u, ids.size());\n    resumed_creation_outstanding_ = true;\n    Java_BrowserWindowCreatorBridge_resumePendingTaskActivityCreationForTesting(\n        base::android::AttachCurrentThread(), ids.front());\n    ASSERT_TRUE(\n        base::test::RunUntil([this] { return FindCompletedOptionsWindow(); }));\n    resumed_creation_outstanding_ = false;\n    base::RunLoop().RunUntilIdle();\n    ASSERT_TRUE(HeldPendingTaskIds().empty());\n  }\n\n protected:\n  base::WeakPtr<Profile> original_profile_;\n  base::WeakPtr<BrowserWindowInterface> regular_browser_;\n  base::WeakPtr<BrowserWindowInterface> incognito_browser_;\n  scoped_refptr<const Extension> extension_;\n\n private:\n  bool FindCompletedOptionsWindow() {\n    if (!original_profile_ || original_profile_->ShutdownStarted()) {\n      return false;\n    }\n    auto* collection =\n        ProfileBrowserCollection::GetForProfile(original_profile_.get());\n    auto* browser = collection ? collection->FindTabbedBrowser() : nullptr;\n    if (!browser) {\n      return false;\n    }\n    auto* tabs = TabListInterface::From(browser);\n    if (!tabs || !tabs->GetActiveTab()) {\n      return false;\n    }\n    auto* contents = tabs->GetActiveTab()->GetContents();\n    if (!contents || contents->GetLastCommittedURL() !=\n                         extension_->GetResourceURL(\"options.html\")) {\n      return false;\n    }\n    regular_browser_ = browser->GetWeakPtr();\n    return true;\n  }\n\n  TestExtensionDir extension_dir_;\n  std::set<int> initial_window_ids_;\n  bool resumed_creation_outstanding_ = false;\n};\n\nIN_PROC_BROWSER_TEST_F(ExtensionOptionsIncognitoAndroidTest,\n                       SpanningOptionsUseOriginalProfile) {\n  CheckExistingWindowDestination(/*split=*/false);\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionOptionsIncognitoAndroidTest,\n                       SplitOptionsStayIncognito) {\n  CheckExistingWindowDestination(/*split=*/true);\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionOptionsIncognitoAndroidTest,\n                       SpanningOptionsCreateRegularWindow) {\n  ASSERT_NO_FATAL_FAILURE(StartOptionsWithoutRegularWindow());\n  const int incognito_count =\n      TabListInterface::From(incognito_browser_.get())->GetTabCount();\n  ASSERT_NO_FATAL_FAILURE(ResumeOptionsWindow());\n  ASSERT_NO_FATAL_FAILURE(\n      ExpectLoadedOptions(regular_browser_.get(), original_profile_.get()));\n  EXPECT_EQ(incognito_count,\n            TabListInterface::From(incognito_browser_.get())->GetTabCount());\n}\n\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace extensions\n"
