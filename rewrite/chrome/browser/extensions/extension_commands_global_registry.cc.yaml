# Opt-in Android global extension hardware shortcuts.
substitutions:
- description: Snapshot enabled extensions during Android backend refresh
  regex:
    re_pattern: \#include\ "base/functional/bind\.h"
    replace: '#include <vector>


      #include "base/functional/bind.h"'
- description: Keep Android backend wiring within the existing global registry
  regex:
    re_pattern: '\#if\ defined\(USE_AURA\)\ \&\&\ !BUILDFLAG\(IS_ANDROID\)\

      \#include'
    replace: '#if BUILDFLAG(IS_ANDROID)

      #include "extensions/browser/extension_registry.h"

      #include "ui/base/accelerators/global_accelerator_listener/global_accelerator_listener_android.h"

      #endif


      #if defined(USE_AURA) && !BUILDFLAG(IS_ANDROID)

      #include'
- description: Retry failed pre-start registrations when the user-enabled service connects
  regex:
    re_pattern: '\ \ \ \ \ \ registry_for_active_window_\(nullptr\)\ \{\

      \ \ Init\(\);'
    replace: "      registry_for_active_window_(nullptr) {\n#if BUILDFLAG(IS_ANDROID)\n  android_backend_subscription_ =\n      static_cast<ui::GlobalAcceleratorListenerAndroid*>(\n          ui::GlobalAcceleratorListener::GetInstance())->AddBackendObserver(\n              base::BindRepeating(&ExtensionCommandsGlobalRegistry::RefreshAndroidRegistrations,\n                                  weak_ptr_factory_.GetWeakPtr()));\n#endif\n  Init();"
- description: Stop platform availability callbacks before unregistering a dying registry
  regex:
    re_pattern: ExtensionCommandsGlobalRegistry::\~ExtensionCommandsGlobalRegistry\(\)\ \{
    replace: "ExtensionCommandsGlobalRegistry::~ExtensionCommandsGlobalRegistry() {\n#if BUILDFLAG(IS_ANDROID)\n  android_backend_subscription_ = {};\n#endif"
- description: Rebuild registrations if service availability changed during shortcut editing
  regex:
    re_pattern: '\ \ if\ \(registry_for_active_window\(\)\)\ \{\

      \ \ \ \ registry_for_active_window\(\)\->SetShortcutHandlingSuspended\(suspended\);\

      \ \ \}\

      \}'
    replace: "  if (registry_for_active_window()) {\n    registry_for_active_window()->SetShortcutHandlingSuspended(suspended);\n  }\n#if BUILDFLAG(IS_ANDROID)\n  if (!suspended) {\n    static_cast<ui::GlobalAcceleratorListenerAndroid*>(\n        ui::GlobalAcceleratorListener::GetInstance())->RefreshBackendRegistrations();\n  }\n#endif\n}"
- description: Rebuild only global commands and preserve shared extension/profile authorization
  regex:
    re_pattern: void\ ExtensionCommandsGlobalRegistry::OnKeyPressed\(
    replace: "#if BUILDFLAG(IS_ANDROID)\nvoid ExtensionCommandsGlobalRegistry::RefreshAndroidRegistrations() {\n  // Base Shutdown clears this context before profile services are destroyed.\n  auto* context = ExtensionKeybindingRegistry::browser_context();\n  if (!context)\n    return;\n  auto* registry = ExtensionRegistry::Get(context);\n  if (!registry)\n    return;\n  std::vector<scoped_refptr<const Extension>> enabled(\n      registry->enabled_extensions().begin(), registry->enabled_extensions().end());\n  // Remove before adding: repeated connection notifications must not duplicate\n  // targets or preserve a formerly accepted registration after OS revocation.\n  for (const auto& extension : enabled)\n    RemoveExtensionKeybinding(extension.get(), std::string());\n  auto* listener = static_cast<ui::GlobalAcceleratorListenerAndroid*>(\n      ui::GlobalAcceleratorListener::GetInstance());\n  if (listener->HasBackend() && !listener->IsShortcutHandlingSuspended())\n    Init();\n}\n#endif\n\nvoid ExtensionCommandsGlobalRegistry::OnKeyPressed("
- description: Format Android global shortcuts changes
  regex:
    re_pattern: '\ \ \ \ \ \ registry_for_active_window_\(nullptr\)\ \{\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ android_backend_subscription_\ =\

      \ \ \ \ \ \ static_cast<ui::GlobalAcceleratorListenerAndroid\*>\(\

      \ \ \ \ \ \ \ \ \ \ ui::GlobalAcceleratorListener::GetInstance\(\)\)\->AddBackendObserver\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::BindRepeating\(\&ExtensionCommandsGlobalRegistry::RefreshAndroidRegistrations,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ weak_ptr_factory_\.GetWeakPtr\(\)\)\);\

      \#endif\

      \ \ Init\(\);\

      \}\

      \

      '
    replace: "      registry_for_active_window_(nullptr) {\n#if BUILDFLAG(IS_ANDROID)\n  android_backend_subscription_ =\n      static_cast<ui::GlobalAcceleratorListenerAndroid*>(\n          ui::GlobalAcceleratorListener::GetInstance())\n          ->AddBackendObserver(base::BindRepeating(\n              &ExtensionCommandsGlobalRegistry::RefreshAndroidRegistrations,\n              weak_ptr_factory_.GetWeakPtr()));\n#endif\n  Init();\n}\n\n"
- description: Format Android global shortcuts changes
  regex:
    re_pattern: '\ \ \}\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ if\ \(!suspended\)\ \{\

      \ \ \ \ static_cast<ui::GlobalAcceleratorListenerAndroid\*>\(\

      \ \ \ \ \ \ \ \ ui::GlobalAcceleratorListener::GetInstance\(\)\)\->RefreshBackendRegistrations\(\);\

      \ \ \}\

      \#endif\

      \}\

      \

      '
    replace: "  }\n#if BUILDFLAG(IS_ANDROID)\n  if (!suspended) {\n    static_cast<ui::GlobalAcceleratorListenerAndroid*>(\n        ui::GlobalAcceleratorListener::GetInstance())\n        ->RefreshBackendRegistrations();\n  }\n#endif\n}\n\n"
- description: Format Android global shortcuts changes
  regex:
    re_pattern: '\ \ auto\*\ registry\ =\ ExtensionRegistry::Get\(context\);\

      \ \ if\ \(!registry\)\

      \ \ \ \ return;\

      \ \ std::vector<scoped_refptr<const\ Extension>>\ enabled\(\

      \ \ \ \ \ \ registry\->enabled_extensions\(\)\.begin\(\),\ registry\->enabled_extensions\(\)\.end\(\)\);\

      \ \ //\ Remove\ before\ adding:\ repeated\ connection\ notifications\ must\ not\ duplicate\

      \ \ //\ targets\ or\ preserve\ a\ formerly\ accepted\ registration\ after\ OS\ revocation\.\

      \ \ for\ \(const\ auto\&\ extension\ :\ enabled\)\

      \ \ \ \ RemoveExtensionKeybinding\(extension\.get\(\),\ std::string\(\)\);\

      '
    replace: "  auto* registry = ExtensionRegistry::Get(context);\n  if (!registry)\n    return;\n  std::vector<scoped_refptr<const Extension>> enabled(\n      registry->enabled_extensions().begin(),\n      registry->enabled_extensions().end());\n  // Remove before adding: repeated connection notifications must not duplicate\n  // targets or preserve a formerly accepted registration after OS revocation.\n  for (const auto& extension : enabled)\n    RemoveExtensionKeybinding(extension.get(), std::string());\n"
