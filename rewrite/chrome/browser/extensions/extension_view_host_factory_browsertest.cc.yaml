# Android split pane request ownership and dialog placement.
substitutions:
- description: verify exact extension surface browser ownership in existing browser fixture
  regex:
    re_pattern: \#include\ "chrome/browser/extensions/extension_view_host\.h"
    replace: '#include "chrome/browser/extensions/extension_view_host.h"

      #include "chrome/browser/extensions/window_controller.h"

      #include "chrome/browser/tab_list/tab_list_interface.h"

      #include "chrome/browser/ui/browser_window/public/browser_window_interface.h"'
- description: cover popup and both Android side-panel scopes exact factory owner
  regex:
    re_pattern: '\ \ EXPECT_EQ\(mojom::ViewType::kExtensionPopup,\ host\->extension_host_type\(\)\);\

      \}'
    replace: "  EXPECT_EQ(mojom::ViewType::kExtensionPopup, host->extension_host_type());\n  ASSERT_TRUE(host->GetExtensionWindowController());\n  EXPECT_EQ(GetBrowserWindowInterface(),\n            host->GetExtensionWindowController()->GetBrowserWindowInterface());\n#if BUILDFLAG(IS_ANDROID)\n  // Host ownership must not depend on whether a side-panel view has been\n  // attached yet, nor fall back to whichever browser was last focused.\n  auto window_panel = ExtensionViewHostFactory::CreateSidePanelHost(\n      *extension, extension->url(), GetBrowserWindowInterface(), nullptr);\n  ASSERT_TRUE(window_panel->GetExtensionWindowController());\n  EXPECT_EQ(GetBrowserWindowInterface(),\n            window_panel->GetExtensionWindowController()\n                ->GetBrowserWindowInterface());\n  auto* tab_list = TabListInterface::From(GetBrowserWindowInterface());\n  ASSERT_TRUE(tab_list);\n  auto* active_tab = tab_list->GetActiveTab();\n  ASSERT_TRUE(active_tab);\n  auto tab_panel = ExtensionViewHostFactory::CreateSidePanelHost(\n      *extension, extension->url(), nullptr, active_tab);\n  ASSERT_TRUE(tab_panel->GetExtensionWindowController());\n  EXPECT_EQ(GetBrowserWindowInterface(),\n            tab_panel->GetExtensionWindowController()->GetBrowserWindowInterface());\n#endif\n}"
- description: Format modified Android split dialog code
  regex:
    re_pattern: '\#include\ "base/memory/scoped_refptr\.h"\

      \#include\ "chrome/browser/extensions/extension_browsertest\.h"\

      \#include\ "chrome/browser/extensions/extension_view_host\.h"\

      \#include\ "chrome/browser/extensions/window_controller\.h"\

      \#include\ "chrome/browser/tab_list/tab_list_interface\.h"\

      \#include\ "chrome/browser/ui/browser_window/public/browser_window_interface\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      \#include\ "chrome/browser/tab_list/tab_list_interface\.h"\

      \#include\ "content/public/test/browser_test\.h"\

      \#include\ "extensions/buildflags/buildflags\.h"\

      \#include\ "extensions/common/extension\.h"\

      \#include\ "extensions/common/mojom/view_type\.mojom\.h"\

      '
    replace: '#include "base/memory/scoped_refptr.h"

      #include "chrome/browser/extensions/extension_browsertest.h"

      #include "chrome/browser/extensions/extension_view_host.h"

      #include "chrome/browser/extensions/window_controller.h"

      #include "chrome/browser/profiles/profile.h"

      #include "chrome/browser/tab_list/tab_list_interface.h"

      #include "chrome/browser/ui/browser_window/public/browser_window_interface.h"

      #include "content/public/test/browser_test.h"

      #include "extensions/buildflags/buildflags.h"

      #include "extensions/common/extension.h"

      #include "extensions/common/mojom/view_type.mojom.h"

      '
- description: Format modified Android split dialog code
  regex:
    re_pattern: '\ \ ASSERT_TRUE\(active_tab\);\

      \ \ auto\ tab_panel\ =\ ExtensionViewHostFactory::CreateSidePanelHost\(\

      \ \ \ \ \ \ \*extension,\ extension\->url\(\),\ nullptr,\ active_tab\);\

      \ \ ASSERT_TRUE\(tab_panel\->GetExtensionWindowController\(\)\);\

      \ \ EXPECT_EQ\(GetBrowserWindowInterface\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ tab_panel\->GetExtensionWindowController\(\)\->GetBrowserWindowInterface\(\)\);\

      \#endif\

      \}\

      \

      //\ TODO\(crbug\.com/458688998\):\ Desktop\ Android\ doesn''t\ support\ side\ panel\ yet\.\

      '
    replace: "  ASSERT_TRUE(active_tab);\n  auto tab_panel = ExtensionViewHostFactory::CreateSidePanelHost(\n      *extension, extension->url(), nullptr, active_tab);\n  ASSERT_TRUE(tab_panel->GetExtensionWindowController());\n  EXPECT_EQ(\n      GetBrowserWindowInterface(),\n      tab_panel->GetExtensionWindowController()->GetBrowserWindowInterface());\n#endif\n}\n\n// TODO(crbug.com/458688998): Desktop Android doesn't support side panel yet.\n"
