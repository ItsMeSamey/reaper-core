    replace: "  if (!new_contents) {\n    return base::unexpected(ExtensionTabUtil::kLockedFullscreenModeNewTabError);\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  // Android inserts an ordinary tab first. Group and move through the existing\n  // model before splitting. Each operation notifies synchronous Java observers,\n  // so revalidate weak handles after every operation (including split\n  // creation).\n  if (split_handle) {\n    if (!browser_weak) {\n      return base::unexpected(tabs_constants::kSplitViewCreationFailedError);\n    }\n    auto* created_tab = tabs::TabInterface::GetFromContents(new_contents);\n    if (!created_tab) {\n      return base::unexpected(tabs_constants::kSplitViewCreationFailedError);\n    }\n    const tabs::TabHandle created_handle = created_tab->GetHandle();\n    auto contents_weak = new_contents->GetWeakPtr();\n    auto current_list = [&]() -> TabListInterface* {\n      return browser_weak ? TabListInterface::From(browser_weak.get())\n                          : nullptr;\n    };\n    auto valid_pair = [&]() {\n      auto* list = current_list();\n      auto* target = split_handle->Get();\n      auto* created = created_handle.Get();\n      return list && target && created && contents_weak &&\n             created->GetContents() == contents_weak.get() &&\n             list->GetIndexOfTab(*split_handle) >= 0 &&\n             list->GetIndexOfTab(created_handle) >= 0 && !target->IsSplit() &&\n             !created->IsSplit();\n    };\n    auto fail_split =\n        [&]() -> base::expected<content::WebContents*, std::string> {\n      auto* list = current_list();\n      if (list && created_handle.Get() &&\n          list->GetIndexOfTab(created_handle) >= 0) {\n        list->CloseTab(created_handle);\n      }\n      return base::unexpected(tabs_constants::kSplitViewCreationFailedError);\n    };\n    if (!valid_pair())\n      return fail_split();\n    const auto target_group = split_handle->Get()->GetGroup();\n    if (target_group && created_handle.Get()->GetGroup() != target_group) {\n      if (!current_list()->AddTabsToGroup(target_group, {created_handle}) ||\n          !valid_pair()) {\n        return fail_split();\n      }\n    }\n    int target_index = current_list()->GetIndexOfTab(*split_handle);\n    int new_index = current_list()->GetIndexOfTab(created_handle);\n    if (new_index < target_index)\n      --target_index;\n    current_list()->MoveTab(created_handle,\n                            target_index + (insert_before_split ? 0 : 1));\n    if (!valid_pair() ||\n        !current_list()->CreateSplit({*split_handle, created_handle})) {\n      return fail_split();\n    }\n    if (!contents_weak || !current_list() || !created_handle.Get() ||\n        !split_handle->Get() ||\n        current_list()->GetIndexOfTab(*split_handle) < 0 ||\n        current_list()->GetIndexOfTab(created_handle) < 0 ||\n        !created_handle.Get()->GetSplit() ||\n        created_handle.Get()->GetSplit() != split_handle->Get()->GetSplit()) {\n      return fail_split();\n    }\n    new_contents = contents_weak.get();\n  }\n#else\n  // Split the tab if the splitWithTabId is specified and the tab is valid.\n  // Returns an error and cleans up the newly created tab if the split view\n  // cannot be created.\n  if (split_tab) {\n"
