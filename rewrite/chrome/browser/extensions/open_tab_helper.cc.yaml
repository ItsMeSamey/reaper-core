- description: "Preserve explicit Android opener container before tab creation: Android-only existing API error formatting dependency"
  count: 1
  regex:
    re_pattern: "\\#if\\ !BUILDFLAG\\(IS_ANDROID\\)\\\n\\#include\\ \"chrome/browser/ui/tabs/split_tab_metrics\\.h\""
    replace: "#if BUILDFLAG(IS_ANDROID)\n#include \"extensions/common/error_utils.h\"\n#endif\n\n#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/ui/tabs/split_tab_metrics.h\""

- description: "Preserve explicit Android opener container before tab creation: fresh authorized same-window/profile opener before Navigate"
  count: 1
  regex:
    re_pattern: "\\ \\ MaybeSetPdfNavigateParams\\(function,\\ navigate_params\\);\\\n\\\n\\ \\ base::WeakPtr<content::NavigationHandle>\\ handle\\ =\\ Navigate\\(\\&navigate_params\\);"
    replace: "  MaybeSetPdfNavigateParams(function, navigate_params);\n\n#if BUILDFLAG(IS_ANDROID)\n  if (params.opener_tab_id) {\n    tabs::TabInterface* opener = nullptr;\n    if (!ExtensionTabUtil::GetTabById(\n            *params.opener_tab_id, function.browser_context(),\n            function.include_incognito_information(), nullptr, nullptr, nullptr,\n            &opener) ||\n        !opener || !opener->GetContents()) {\n      return base::unexpected(ErrorUtils::FormatErrorMessage(\n          ExtensionTabUtil::kTabNotFoundError,\n          base::NumberToString(*params.opener_tab_id)));\n    }\n    if (browser_window_util::GetBrowserForTabContents(*opener) != &browser ||\n        opener->GetContents()->GetBrowserContext() != browser.GetProfile()) {\n      return base::unexpected(\n          \"Tab opener must be in the same window as the updated tab.\");\n    }\n    navigate_params.source_contents = opener->GetContents();\n    navigate_params.tabstrip_add_types |= AddTabTypes::ADD_INHERIT_OPENER;\n  }\n#endif\n\n  base::WeakPtr<content::NavigationHandle> handle = Navigate(&navigate_params);"
- description: Use the validated TabInterface window accessor instead of passing a TabInterface to a WebContents-only helper
  regex:
    pattern: browser_window_util::GetBrowserForTabContents(*opener) != &browser
    replace: opener->GetBrowserWindowInterface() != &browser
  count: 1
