substitutions:
- description: Cancel Android uninstall dialogs when the target disappears before icon load
  regex:
    re_pattern: '\#include\ "base/metrics/user_metrics\.h"\

      \#include\ "base/metrics/user_metrics_action\.h"\

      \#include\ "base/strings/utf_string_conversions\.h"\

      \#include\ "chrome/browser/extensions/chrome_app_icon_service\.h"\

      \#include\ "chrome/browser/extensions/extension_management\.h"\

      \#include\ "chrome/browser/extensions/extension_util\.h"\

      '
    replace: '#include "base/metrics/user_metrics.h"

      #include "base/metrics/user_metrics_action.h"

      #include "base/strings/utf_string_conversions.h"

      #include "build/build_config.h"

      #include "chrome/browser/extensions/chrome_app_icon_service.h"

      #include "chrome/browser/extensions/extension_management.h"

      #include "chrome/browser/extensions/extension_util.h"

      '
- description: Cancel Android uninstall dialogs when the target disappears before icon load
  regex:
    re_pattern: '\ \ \ \ return;\

      \

      \ \ extension_uninstalled_early_\ =\ true;\

      \ \ Close\(\);\

      \}\

      \

      '
    replace: "    return;\n\n  extension_uninstalled_early_ = true;\n#if BUILDFLAG(IS_ANDROID)\n  if (!dialog_shown_) {\n    // There is no dialog view until the icon loads. Retire its callback before\n    // notifying the delegate, which may destroy this dialog synchronously.\n    icon_.reset();\n    OnDialogClosed(CLOSE_ACTION_CANCELED);\n    return;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n  Close();\n}\n\n"
