ersion\", \"1\");\n      approval = InstallApproval::CreateWithNoInstallPrompt(\n          profile(), id, std::move(manifest), /*strict_manifest_check=*/true);\n    }\n    auto installer = base::MakeRefCounted<DestructionObservedWebstoreInstaller>(\n        profile(),\n        base::BindLambdaForTesting([this](const std::string&) {\n          ++success_count_;\n        }),\n        base::BindLambdaForTesting(\n            [this](const std::string&, const std::string& error,\n                   WebstoreInstaller::FailureReason reason) {\n              ++failure_count_;\n              last_error_ = error;\n              last_reason_ = reason;\n              if (on_failure_) {\n                on_failure_.Run();\n              }\n            }),\n        web_contents_.get(), id, std::move(approval),\n        WebstoreInstaller::INSTALL_SOURCE_OTHER);\n    installer->ObserveDestruction(std::move(on_destroyed));\n    return installer;\n  }\n\n  bool IsRetired(const WebstoreInstaller& installer) {\n    return installer.completed_ && !installer.browser_context_ &&\n           !installer.extension_registry_observation_.IsObserving() &&\n           !installer.download_item_ && !installer.start_ref_held_ &&\n           !installer.download_progress_timer_.IsRunning();\n  }\n\n  ScopedInstallVerifierBypassForTest verifier_bypass_;\n  std::unique_ptr<content::WebContents> web_contents_;\n  base::FilePath download_directory_;\n  base::RepeatingClosure on_failure_;\n  int success_count_ = 0;\n  int failure_count_ = 0;\n  std::string last_error_;\n  WebstoreInstaller::FailureReason last_reason_ =\n      WebstoreInstaller::FAILURE_REASON_OTHER;\n};\n\nTEST_F(WebstoreInstallerAndroidLifecycleTest,\n       ProfileShutdownRetiresPendingDownload) {\n  auto installer = CreateInstaller(\"abcdefghijklmnopabcdefghijklmnop\");\n  on_failure_ = base::BindLambdaForTesting([&] { installer->Start(); });\n  installer->Start();\n  EXPECT_EQ(0, failure_count_);\n  EXPECT_FALSE(installer->HasOneRef()