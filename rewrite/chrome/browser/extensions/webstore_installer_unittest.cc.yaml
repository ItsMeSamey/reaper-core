CT_TRUE(IsRetired(*retry));\n  EXPECT_TRUE(retry->HasOneRef());\n}\n\nTEST_F(WebstoreInstallerAndroidLifecycleTest,\n       DownloadRemovalRetiresOperationWithoutLosingCallbackOwner) {\n  const std::string id = \"abcdefghijklmnopabcdefghijklmnop\";\n  testing::StrictMock<download::MockDownloadItem> item;\n  auto manager =\n      std::make_unique<testing::NiceMock<content::MockDownloadManager>>();\n  EXPECT_CALL(*manager, DownloadUrlMock(testing::_))\n      .WillOnce([&](download::DownloadUrlParameters* params) {\n        ASSERT_TRUE(params->callback());\n        std::move(params->callback())\n            .Run(&item, download::DOWNLOAD_INTERRUPT_REASON_NONE);\n      });\n  profile()->SetDownloadManagerForTesting(std::move(manager));\n\n  auto destroyed = std::make_shared<bool>(false);\n  auto installer = CreateInstaller(\n      id, base::BindLambdaForTesting([destroyed] { *destroyed = true; }));\n  WebstoreInstaller* raw_installer = installer.get();\n  on_failure_ = base::BindLambdaForTesting(\n      [&] { EXPECT_TRUE(IsRetired(*raw_installer)); });\n  installer->Start();\n  // Consume genuine path preparation and the ordinary DownloadUrl started\n  // callback. No file reply or caller reference remains during removal.\n  task_environment()->RunUntilIdle();\n  ASSERT_EQ(0, failure_count_);\n  ASSERT_FALSE(IsRetired(*installer));\n  installer.reset();\n  ASSERT_FALSE(*destroyed);\n\n  RegistryShutdownOnRemoval removal_observer(\n      base::BindLambdaForTesting([this] { registry()->Shutdown(); }));\n  item.AddObserver(&removal_observer);\n  EXPECT_CALL(item, Remove()).WillOnce([&] {\n    item.NotifyObserversDownloadRemoved();\n    // The repaired callback owns itself until Remove() has returned.\n    EXPECT_FALSE(*destroyed);\n  });\n  EXPECT_CALL(item, Cancel(testing::_)).Times(0);\n  auto extension = ExtensionBuilder(\"Lifecycle extension\")\n                       .SetManifestVersion(3)\n                       .SetID(id)\n                       .Build();\n  ASSERT_