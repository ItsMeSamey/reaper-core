- description: Resolve the original document at activation; preserve matching for a valid live frame.
  regex:
    pattern: "  // Ensure rfh_ptr_ is valid before use.\n  if (rfh_ptr_ && rfh_ptr_->IsRenderFrameLive()) {\n    matcher_.ExecuteCommand(command_id,\
      \ web_contents_, rfh_ptr_, params_);\n  }\n"
    replace: "  content::RenderFrameHost* frame = source_document_.AsRenderFrameHostIfValid();\n  if (frame && frame->IsRenderFrameLive())\
      \ {\n    matcher_.ExecuteCommand(command_id, web_contents_, frame, params_);\n  }\n"
  count: 1
