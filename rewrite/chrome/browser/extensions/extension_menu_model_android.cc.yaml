substitutions:
- description: Retire Android selection commands with their represented extension instances and exercise actual owner dispatch
  regex:
    re_pattern: 'using\ blink::mojom::ContextMenuDataMediaType;\

      \

      namespace\ extensions\ \{\

      \

      ExtensionMenuModel::ExtensionMenuModel\(\

      \ \ \ \ content::RenderFrameHost\&\ render_frame_host,\

      '
    replace: "using blink::mojom::ContextMenuDataMediaType;\n\nnamespace extensions {\nnamespace {\n\nvoid CollectVisibleExtensionIds(\n    ui::MenuModel& model,\n    const std::map<int, MenuItem::Id>& extension_items,\n    ExtensionIdSet& ids) {\n  for (size_t i = 0; i < model.GetItemCount(); ++i) {\n    if (!model.IsVisibleAt(i)) {\n      continue;\n    }\n    // Match the row types copied by MenuModelBridge::AddExtensionItems.\n    switch (model.GetTypeAt(i)) {\n      case ui::MenuModel::TYPE_COMMAND:\n      case ui::MenuModel::TYPE_HIGHLIGHTED:\n      case ui::MenuModel::TYPE_CHECK:\n      case ui::MenuModel::TYPE_RADIO:\n      case ui::MenuModel::TYPE_SUBMENU:\n        break;\n      default:\n        continue;\n    }\n    auto item = extension_items.find(model.GetCommandIdAt(i));\n    if (item != extension_items.end() &&\n        !item->second.extension_key.extension_id.empty()) {\n      ids.insert(item->second.extension_key.extension_id);\n    }\n    if (auto* submenu = model.GetSubmenuModelAt(i)) {\n      CollectVisibleExtensionIds(*submenu, extension_items, ids);\n    }\n  }\n}\n\n}  // namespace\n\nExtensionMenuModel::ExtensionMenuModel(\n    content::RenderFrameHost& render_frame_host,\n"
- description: Retire Android selection commands with their represented extension instances and exercise actual owner dispatch
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ matcher_\);\

      \}\

      \

      bool\ ExtensionMenuModel::IsCommandIdChecked\(int\ command_id\)\ const\ \{\

      \ \ return\ matcher_\.IsCommandIdChecked\(command_id\);\

      \}\

      '
    replace: "                                               matcher_);\n}\n\nExtensionIdSet ExtensionMenuModel::GetVisibleExtensionIds() {\n  ExtensionIdSet ids;\n  CollectVisibleExtensionIds(*this, matcher_.extension_item_map(), ids);\n  return ids;\n}\n\nbool ExtensionMenuModel::IsCommandIdChecked(int command_id) const {\n  return matcher_.IsCommandIdChecked(command_id);\n}\n"
