substitutions:
- description: "Android disabled-extension notice integration (1)"
  count: 1
  regex:
    pattern: "// Copyright 2025 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\n#include \"chrome/browser/extensions/extension_disabled_ui.h\"\n\n#include \"base/logging.h\"\n#include \"base/notimplemented.h\"\n\nnamespace extensions {\n\nvoid AddExtensionDisabledError(Profile* profile,\n                               const Extension* extension,\n                               bool is_remote_install) {\n  // TODO(crbug.com/399680111): Android will need a special error UI because it\n  // cannot use the views implementation of the error bubble.\n  NOTIMPLEMENTED() << \"Extension disabled error\";\n}\n\n}  // namespace extensions\n"
    replace: "// Copyright 2025 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\n#include \"chrome/browser/extensions/extension_disabled_ui.h\"\n\n#include <map>\n#include <memory>\n#include <string>\n#include <utility>\n\n#include \"base/android/jni_android.h\"\n#include \"base/android/scoped_java_ref.h\"\n#include \"base/callback_list.h\"\n#include \"base/functional/bind.h\"\n#include \"base/location.h\"\n#include \"base/memory/raw_ptr.h\"\n#include \"base/memory/weak_ptr.h\"\n#include \"base/scoped_observation.h\"\n#include \"base/supports_user_data.h\"\n#include \"base/task/single_thread_task_runner.h\"\n#include \"chrome/browser/android/android_theme_resources.h\"\n#include \"chrome/browser/android/resource_mapper.h\"\n#include \"chrome/browser/profiles/profile.h\"\n#include \"chrome/browser/ui/browser_window/public/browser_collection_observer.h\"\n#include \"chrome/browser/ui/browser_window/public/browser_window_interface.h\"\n#include \"chrome/browser/ui/browser_window/public/global_browser_collection.h\"\n#include \"chrome/browser/ui/browser_window/public/profile_browser_collection.h\"\n#include \"chrome/common/webui_url_constants.h\"\n#include \"chrome/grit/generated_resources.h\"\n#include \"components/messages/android/message_dispatcher_bridge.h\"\n#include \"components/messages/android/message_wrapper.h\"\n#include \"content/public/browser/page_navigator.h\"\n#include \"extensions/browser/extension_prefs.h\"\n#include \"extensions/browser/extension_registry.h\"\n#include \"extensions/browser/extension_registry_observer.h\"\n#include \"extensions/browser/ui_util.h\"\n#include \"extensions/common/disable_reason.h\"\n#include \"extensions/common/extension.h\"\n#include \"ui/android/window_android.h\"\n#include \"ui/base/base_window.h\"\n#include \"ui/base/l10n/l10n_util.h\"\n#include \"ui/base/page_transition_types.h\"\n#include \"ui/base/window_open_disposition.h\"\n#include \"url/gurl.h\"\n\nnamespace extensions {\nnamespace {\n\nconst char kDisabledMessageOwnerKey[] = \"extensions.disabled_message_android\";\n\n// Keep notices while no matching foreground window/provider exists. The existing\n// disabled-extension state remains the source of truth; this owner never grants\n// permissions or enables an extension.\nclass DisabledMessageOwner final : public base::SupportsUserData::Data,\n                                   public BrowserCollectionObserver,\n                                   public ExtensionRegistryObserver {\n public:\n  explicit DisabledMessageOwner(Profile* profile) : profile_(profile) {\n    registry_observation_.Observe(ExtensionRegistry::Get(profile));\n    if (auto* browsers = ProfileBrowserCollection::GetForProfile(profile)) {\n      browser_observation_.Observe(browsers);\n    }\n    dispatcher_subscription_ =\n        messages::MessageDispatcherBridge::Get()->AddDispatcherChangedCallback(\n            base::BindRepeating(&DisabledMessageOwner::Schedule,\n                                weak_factory_.GetWeakPtr()));\n  }\n\n  ~DisabledMessageOwner() override { Stop(); }\n\n  void Add(const Extension& extension, bool remote_install) {\n    pending_[extension.id()] = remote_install;\n    if (displayed_id_ == extension.id()) {\n      Dismiss();\n    }\n    Schedule();\n  }\n\n private:\n  BrowserWindowInterface* FindHost() {\n    if (!profile_ || profile_->ShutdownStarted()) {\n      return nullptr;\n    }\n    auto* browsers = GlobalBrowserCollection::GetInstance();\n    auto* browser = browsers ? browsers->GetLastActiveBrowser() : nullptr;\n    if (!browser || browser->IsDeleteScheduled() ||\n        browser->GetProfile() != profile_ ||\n        browser->GetType() != BrowserWindowInterface::TYPE_NORMAL ||\n        !browser->GetWindow() || !browser->GetWindow()->IsActive() ||\n        !browser->GetWindow()->GetNativeWindow()) {\n      return nullptr;\n    }\n    return browser;\n  }\n\n  const Extension* GetDisabled(const std::string& id) {\n    if (!profile_ || profile_->ShutdownStarted()) {\n      return nullptr;\n    }\n    const Extension* extension =\n        ExtensionRegistry::Get(profile_)->disabled_extensions().GetByID(id);\n    if (!extension) {\n      return nullptr;\n    }\n    const auto reasons = ExtensionPrefs::Get(profile_)->GetDisableReasons(id);\n    return reasons.contains(disable_reason::DISABLE_PERMISSIONS_INCREASE) ||\n                   reasons.contains(disable_reason::DISABLE_REMOTE_INSTALL)\n               ? extension\n               : nullptr;\n  }\n\n  void Schedule() {\n    if (!profile_ || update_pending_) {\n      return;\n    }\n    update_pending_ = true;\n    base::SingleThreadTaskRunner::GetCurrentDefault()->PostTask(\n        FROM_HERE, base::BindOnce(&DisabledMessageOwner::Update,\n                                  weak_factory_.GetWeakPtr()));\n  }\n\n  void Update() {\n    update_pending_ = false;\n    auto* browser = FindHost();\n    auto* dispatcher = messages::MessageDispatcherBridge::Get();\n    auto java_dispatcher = browser\n        ? dispatcher->GetMessageDispatcher(\n              browser->GetWindow()->GetNativeWindow()->GetJavaObject())\n        : base::android::ScopedJavaLocalRef<jobject>();\n    if (message_ && browser == message_browser_ &&\n        GetDisabled(displayed_id_) == displayed_extension_.get() &&\n        !java_dispatcher.is_null() &&\n        base::android::AttachCurrentThread()->IsSameObject(\n            message_dispatcher_.obj(), java_dispatcher.obj())) {\n      return;\n    }\n    Dismiss();\n    if (!browser || java_dispatcher.is_null()) {\n      return;\n    }\n    while (!pending_.empty()) {\n      const auto& [id, remote_install] = *pending_.begin();\n      const Extension* extension = GetDisabled(id);\n      if (!extension) {\n        pending_.erase(pending_.begin());\n        continue;\n      }\n      displayed_id_ = id;\n      displayed_extension_ = extension;\n      message_browser_ = browser;\n      message_dispatcher_.Reset(java_dispatcher);\n      message_ = std::make_unique<messages::MessageWrapper>(\n          messages::MessageIdentifier::EXTENSION_DISABLED,\n          base::BindOnce(&DisabledMessageOwner::Review,\n                         weak_factory_.GetWeakPtr()),\n          base::BindOnce(&DisabledMessageOwner::OnDismissed,\n                         weak_factory_.GetWeakPtr(), id));\n      message_->SetTitle(l10n_util::GetStringFUTF16(\n          remote_install ? IDS_EXTENSION_DISABLED_REMOTE_INSTALL_ERROR_TITLE\n                         : IDS_EXTENSION_DISABLED_ERROR_TITLE,\n          ui_util::GetFixupExtensionNameForUIDisplay(extension->name())));\n      message_->SetPrimaryButtonText(\n          l10n_util::GetStringUTF16(IDS_EXTENSIONS_ITEM_DETAILS));\n      message_->SetIconResourceId(\n          ResourceMapper::MapToJavaDrawableId(IDR_ANDROID_PERMISSION_WARNING));\n      if (!dispatcher->EnqueueWindowScopedMessage(\n              message_.get(), browser->GetWindow()->GetNativeWindow(),\n              messages::MessagePriority::kNormal)) {\n        Dismiss();\n      }\n      // A genuine browser/provider transition retries a failed enqueue. No\n      // timer, new activity, or permission action is used to manufacture UI.\n      return;\n    }\n  }\n\n  void Review() {\n    auto* browser = FindHost();\n    if (!browser || browser != message_browser_ ||\n        GetDisabled(displayed_id_) != displayed_extension_.get()) {\n      return;\n    }\n    auto java_dispatcher =\n        messages::MessageDispatcherBridge::Get()->GetMessageDispatcher(\n            browser->GetWindow()->GetNativeWindow()->GetJavaObject());\n    if (java_dispatcher.is_null() ||\n        !base::android::AttachCurrentThread()->IsSameObject(\n            message_dispatcher_.obj(), java_dispatcher.obj())) {\n      return;\n    }\n    // A primary click is consumed only when this notice issues a validated\n    // request. OpenURL may return null for ordinary asynchronous navigation;\n    // this flag does not claim that navigation completed.\n    review_requested_ = true;\n    // Open an ordinary new details tab. The existing manager enable action\n    // supplies requesting WebContents and the normal permission-review dialog.\n    browser->OpenURL(\n        content::OpenURLParams(\n            GURL(std::string(chrome::kChromeUIExtensionsURL) + \"?id=\" +\n                 displayed_id_),\n            content::Referrer(), WindowOpenDisposition::NEW_FOREGROUND_TAB,\n            ui::PAGE_TRANSITION_LINK, false),\n        {});\n  }\n\n  void OnDismissed(const std::string& id, messages::DismissReason reason) {\n    if (reason == messages::DismissReason::DISMISSED_BY_FEATURE) {\n      return;\n    }\n    const bool review_requested = std::exchange(review_requested_, false);\n    message_.reset();\n    message_browser_ = nullptr;\n    message_dispatcher_.Reset();\n    displayed_id_.clear();\n    displayed_extension_.reset();\n    if ((reason == messages::DismissReason::PRIMARY_ACTION && review_requested) ||\n        reason == messages::DismissReason::GESTURE ||\n        reason == messages::DismissReason::CLOSE_BUTTON ||\n        reason == messages::DismissReason::TIMER) {\n      pending_.erase(id);\n    }\n    Schedule();\n  }\n\n  void Dismiss() {\n    auto message = std::move(message_);\n    review_requested_ = false;\n    message_browser_ = nullptr;\n    message_dispatcher_.Reset();\n    displayed_id_.clear();\n    displayed_extension_.reset();\n    if (message && message->is_in_queue()) {\n      messages::MessageDispatcherBridge::Get()->DismissMessage(\n          message.get(), messages::DismissReason::DISMISSED_BY_FEATURE);\n    }\n  }\n\n  void Remove(const Extension& extension) {\n    pending_.erase(extension.id());\n    if (displayed_id_ == extension.id()) {\n      Dismiss();\n    }\n    Schedule();\n  }\n\n  void Stop() {\n    weak_factory_.InvalidateWeakPtrs();\n    browser_observation_.Reset();\n    registry_observation_.Reset();\n    dispatcher_subscription_ = {};\n    profile_ = nullptr;\n    pending_.clear();\n    Dismiss();\n  }\n\n  void OnBrowserCreated(BrowserWindowInterface*) override { Schedule(); }\n  void OnBrowserActivated(BrowserWindowInterface*) override { Schedule(); }\n  void OnBrowserClosed(BrowserWindowInterface* browser) override {\n    if (browser == message_browser_) {\n      Dismiss();\n    }\n    Schedule();\n  }\n  void OnBrowserDeactivated(BrowserWindowInterface* browser) override {\n    if (browser == message_browser_) {\n      Dismiss();\n    }\n    Schedule();\n  }\n  void OnExtensionLoaded(content::BrowserContext*,\n                         const Extension* extension) override {\n    Remove(*extension);\n  }\n  void OnExtensionUninstalled(content::BrowserContext*,\n                              const Extension* extension,\n                              UninstallReason) override {\n    Remove(*extension);\n  }\n  void OnShutdown(ExtensionRegistry*) override { Stop(); }\n\n  raw_ptr<Profile> profile_;\n  std::map<std::string, bool> pending_;\n  bool update_pending_ = false;\n  bool review_requested_ = false;\n  std::unique_ptr<messages::MessageWrapper> message_;\n  raw_ptr<BrowserWindowInterface> message_browser_ = nullptr;\n  std::string displayed_id_;\n  scoped_refptr<const Extension> displayed_extension_;\n  base::android::ScopedJavaGlobalRef<jobject> message_dispatcher_;\n  base::CallbackListSubscription dispatcher_subscription_;\n  base::ScopedObservation<ProfileBrowserCollection, BrowserCollectionObserver>\n      browser_observation_{this};\n  base::ScopedObservation<ExtensionRegistry, ExtensionRegistryObserver>\n      registry_observation_{this};\n  base::WeakPtrFactory<DisabledMessageOwner> weak_factory_{this};\n};\n\n}  // namespace\n\nvoid AddExtensionDisabledError(Profile* profile,\n                               const Extension* extension,\n                               bool is_remote_install) {\n  if (!profile || !extension || profile->IsOffTheRecord() ||\n      profile->ShutdownStarted()) {\n    return;\n  }\n  auto* owner = static_cast<DisabledMessageOwner*>(\n      profile->GetUserData(kDisabledMessageOwnerKey));\n  if (!owner) {\n    auto new_owner = std::make_unique<DisabledMessageOwner>(profile);\n    owner = new_owner.get();\n    profile->SetUserData(kDisabledMessageOwnerKey, std::move(new_owner));\n  }\n  owner->Add(*extension, is_remote_install);\n}\n\n}  // namespace extensions\n"

