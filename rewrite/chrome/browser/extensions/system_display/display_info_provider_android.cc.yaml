    re_pattern: '\#include\ "chrome/browser/extensions/system_display/display_info_provider_android\.h"\

      \

      \#include\ <memory>\

      \

      \#include\ "base/strings/string_number_conversions\.h"\

      \#include\ "chrome/browser/extensions/system_display/display_info_provider\.h"\

      \#include\ "extensions/buildflags/buildflags\.h"\

      \#include\ "ui/display/display\.h"\

      \

      static_assert\(BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\);\

      '
    replace: '#include "chrome/browser/extensions/system_display/display_info_provider_android.h"


      #include <memory>

      #include <utility>


      #include "base/strings/string_number_conversions.h"

      #include "chrome/browser/extensions/system_display/display_info_provider.h"

      #include "extensions/buildflags/buildflags.h"

      #include "ui/android/display_android_manager.h"

      #include "ui/display/display.h"


      static_assert(BUILDFLAG(ENABLE_EXTENSIONS_CORE));

      '
- description: Android complete display opt-in registration and real manager regression coverage (2).
  regex:
    re_pattern: 'DisplayInfoProviderAndroid::DisplayInfoProviderAndroid\(\)\ =\ default;\

      \

      DisplayInfoProviderAndroid::\~DisplayInfoProviderAndroid\(\)\ =\ default;\

      \

      void\ DisplayInfoProviderAndroid::UpdateDisplayUnitInfoForPlatform\(\

      \ \ \ \ const\ std::vector<display::Display>\&\ displays,\

      '
    replace: "DisplayInfoProviderAndroid::DisplayInfoProviderAndroid() = default;\n\nDisplayInfoProviderAndroid::~DisplayInfoProviderAndroid() = default;\n\nvoid DisplayInfoProviderAndroid::GetAllDisplaysInfo(\n    bool single_unified,\n    base::OnceCallback<void(DisplayUnitInfoList)> callback) {\n  ui::DisplayAndroidManager::EnsureAllDisplaysRegistered();\n  DisplayInfoProviderBase::GetAllDisplaysInfo(single_unified, std::move(callback));\n}\n\nvoid DisplayInfoProviderAndroid::StartObserving() {\n  // Populate the initial list before observing subsequent attachment changes.\n  ui::DisplayAndroidManager::EnsureAllDisplaysRegistered();\n  DisplayInfoProviderBase::StartObserving();\n}\n\nvoid DisplayInfoProviderAndroid::UpdateDisplayUnitInfoForPlatform(\n    const std::vector<display::Display>& displays,\n"
