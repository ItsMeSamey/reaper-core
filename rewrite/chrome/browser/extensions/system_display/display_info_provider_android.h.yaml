substitutions:
- description: Android complete display opt-in registration and real manager regression coverage (1).
  regex:
    re_pattern: '\ \ \ \ \ \ delete;\

      \ \ \~DisplayInfoProviderAndroid\(\)\ override;\

      \

      \ private:\

      \ \ void\ UpdateDisplayUnitInfoForPlatform\(\

      \ \ \ \ \ \ const\ std::vector<display::Display>\&\ displays,\

      '
    replace: "      delete;\n  ~DisplayInfoProviderAndroid() override;\n\n  void GetAllDisplaysInfo(\n      bool single_unified,\n      base::OnceCallback<void(DisplayUnitInfoList)> callback) override;\n  void StartObserving() override;\n\n private:\n  void UpdateDisplayUnitInfoForPlatform(\n      const std::vector<display::Display>& displays,\n"
