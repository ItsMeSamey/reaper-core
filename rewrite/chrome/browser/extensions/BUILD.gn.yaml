toolkit_views\\)\\ \\{\\\n\\ \\ \\ \\ deps\\ \\+=\\ \\[\\ \"//chrome/browser/ui/views/web_apps:launch_dialogs\"\\ \\]\\\n\\ \\ \\}\\\n\\}\\\n\\\n\\#\\ By\\ default\\ these\\ tests\\ run\\ on\\ Win,\\ Mac,\\ Linux,\\ Chrome\\ OS\\ and\\ desktop\\ Android\\.\\\nsource_set\\(\"browser_tests\"\\)\\ \\{\\\n\\ \\ testonly\\ =\\ true\\\n"
