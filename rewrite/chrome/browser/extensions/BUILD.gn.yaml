    re_pattern: \ \ \ \ \ \ "extension_browsertest_platform_delegate_android\.cc",
    replace: "      \"extension_api_unittest.cc\",\n      \"extension_api_unittest.h\",\n      \"extension_browsertest_platform_delegate_android.cc\","
