# Android OAuth response hardening.
substitutions:
- description: 'Append the Brave additions to `source_set("extensions")`.


    The deps are a variable list, imported from the `.gni` defining it.

    '
  add_literal_to_list:
    target: extensions
    list_name: deps
    literal: brave_extensions_resources
    import: //brave/browser/extensions/resources.gni
- description: Build extension_menu_model_android with the core.
  regex:
    re_pattern: if \(enable_desktop_android_extensions\)(\s*\{\s*sources \+= \[\s*# These files are temporary)
    replace: if (enable_extensions_core)\1
- description: Add portable Brave auth and update support to Android extensions.
  regex:
    pattern: '  deps += brave_extensions_resources'
    replace: "  deps += brave_extensions_resources\n  sources += brave_extensions_android_sources"
- description: Give the Android extension-host password observer regression its direct include dependency.
  regex:
    pattern: "  if (safe_browsing_mode != 0) {\n    deps += [ \"//components/safe_browsing/content/common:file_type_policies_test_support\" ]\n  }"
    replace: "  if (safe_browsing_mode != 0) {\n    deps += [ \"//components/safe_browsing/content/common:file_type_policies_test_support\" ]\n  }\n\n  if (is_android && safe_browsing_mode != 0) {\n    deps += [ \"//chrome/browser/safe_browsing\" ]\n  }"
- description: Remove the desktop-only dispatch source entry
  regex:
    re_pattern: '\ \ \ \ \ \ "api/mime_handlers/dispatch_mime_handler_event\.cc",\

      '
    replace: ''
- description: Remove the desktop-only dispatch source entry
  regex:
    re_pattern: '\ \ \ \ \ \ "api/mime_handlers/dispatch_mime_handler_event\.h",\

      '
    replace: ''
- description: Compile generic stream dispatch for Android extensions
  regex:
    re_pattern: \ \ \ \ "api/management/chrome_management_api_delegate\.h",
    replace: "    \"api/management/chrome_management_api_delegate.h\",\n    \"api/mime_handlers/dispatch_mime_handler_event.cc\",\n    \"api/mime_handlers/dispatch_mime_handler_event.h\","
- description: Remove duplicated desktop MIME dependencies
  regex:
    re_pattern: '\ \ \ \ \ \ "//extensions/browser/mime_handler",\

      \ \ \ \ \ \ "//extensions/browser/mime_handler:stream_container",\

      '
    replace: ''
- description: Add generic stream dependencies to the extensions source target
  regex:
    re_pattern: '\ \ configs\ \+=\ \[\

      \ \ \ \ "//build/config:precompiled_headers",'
    replace: "  deps = [\n    \"//extensions/browser/mime_handler\",\n    \"//extensions/browser/mime_handler:stream_container\",\n  ]\n  configs += [\n    \"//build/config:precompiled_headers\","
- description: Move MIME dependencies into the existing dependency list
  regex:
    re_pattern: '\ \ deps\ =\ \[\

      \ \ \ \ "//extensions/browser/mime_handler",\

      \ \ \ \ "//extensions/browser/mime_handler:stream_container",\

      \ \ \]\

      '
    replace: ''
- description: Wire generic stream dependencies without replacing existing deps
  regex:
    re_pattern: 'browser/media/webrtc",\

      \ \ \ \ "//chrome/browser/ui/extensions",\

      \ \ \ \ "//chrome/browser/ui/toolbar",\

      \ \ \]\

      \ \ deps\ =\ \['
    replace: "browser/media/webrtc\",\n    \"//chrome/browser/ui/extensions\",\n    \"//chrome/browser/ui/toolbar\",\n  ]\n  deps = [\n    \"//extensions/browser/mime_handler\",\n    \"//extensions/browser/mime_handler:stream_container\","
- description: Run the existing shared WebAuthn proxy browser tests on Android extensions.
  regex:
    pattern: '  if (is_android && safe_browsing_mode != 0) {'
    replace: "  if (is_android) {\n    sources +=\n        [ \"api/web_authentication_proxy/web_authentication_proxy_apitest.cc\" ]\n    deps += [ \"//chrome/browser/extensions/api/web_authentication_proxy\" ]\n  }\n\n  if (is_android && safe_browsing_mode != 0) {"
- description: Include the real Android worker TTS regression in browser_tests
  regex:
    re_pattern: 'rtest\.cc",\

      \ \ \ \ "webstore_installer_browsertest\.cc",\

      \ \ \ \ "webstore_reinstaller_browsertest\.cc",\

      \ \ \]\

      \

      '
    replace: "rtest.cc\",\n    \"webstore_installer_browsertest.cc\",\n    \"webstore_reinstaller_browsertest.cc\",\n  ]\n\n  if (is_android) {\n    sources += [ \"//brave/browser/extensions/android/tts/tts_engine_android_browsertest.cc\" ]\n  }\n\n"
- description: Run Reading List lifecycle regressions in the existing Android extension unit-test target
  regex:
    re_pattern: \ \ \ \ sources\ \+=\ \[\ "system_display/display_info_provider_android_unittest\.cc"\ \]
    replace: "    sources += [\n      \"//brave/browser/extensions/android/reading_list_api_unittest.cc\",\n      \"system_display/display_info_provider_android_unittest.cc\",\n    ]\n    deps += [\n      \"//chrome/browser/extensions/api/reading_list\",\n      \"//chrome/browser/reading_list\",\n      \"//components/reading_list/core:test_support\",\n    ]"
- description: Compile the real Android missing-dialog native regression.
  regex:
    pattern: '      "//brave/browser/extensions/android/reading_list_api_unittest.cc",'
    replace: "      \"//brave/browser/extensions/android/extension_install_dialog_unittest.cc\",\n      \"//brave/browser/extensions/android/reading_list_api_unittest.cc\","
- description: Give the native dialog regression its direct implementation and window dependencies.
