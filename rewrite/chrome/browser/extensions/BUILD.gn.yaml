    pattern: "      \"//chrome/test:test_support_jni_headers\",\n      \"//components/feed:feature_list\","
    replace: "      \"//chrome/browser/android:tabs_public\",\n      \"//chrome/browser/tab_list:test_support\",\n      \"//ui/base/unowned_user_data\",\n      \"//chrome/test:test_support_jni_headers\",\n      \"//components/feed:feature_list\","
