    pattern: "      \"//chrome/browser/ui/android/extensions:public\",\n      \"//chrome/browser/ui/android/tab_model:test_support\","
    replace: "      \"//chrome/browser/ui/android/extensions:extensions\",\n      \"//chrome/browser/ui/android/extensions:public\",\n      \"//chrome/browser/ui/android/tab_model:test_support\",\n      \"//ui/android\","
