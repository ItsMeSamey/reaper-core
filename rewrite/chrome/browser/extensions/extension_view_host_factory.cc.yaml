# Android split pane request ownership and dialog placement.
substitutions:
- description: retain exact factory-supplied Android extension surface owner
  regex:
    re_pattern: \ \ ExtensionViewHostDelegateAndroid\(\)\ =\ default;
    replace: "  ExtensionViewHostDelegateAndroid(BrowserWindowInterface* browser,\n                                   tabs::TabInterface* tab = nullptr)\n      : browser_(browser ? browser->GetWeakPtr() : nullptr),\n        tab_(tab ? tab->GetWeakPtr() : nullptr),\n        tab_scoped_(tab != nullptr) {}"
- description: resolve Android extension window from exact live browser or scoped tab
  regex:
    re_pattern: '\ \ WindowController\*\ GetExtensionWindowController\(\)\ override\ \{\

      \ \ \ \ //\ TODO\(cbrug\.com/385987224\):\ Implement\ this\ method\ for\ Android\.\

      \ \ \ \ NOTIMPLEMENTED\(\);\

      \ \ \ \ return\ nullptr;\

      \ \ \}\

      \};'
    replace: "  WindowController* GetExtensionWindowController() override {\n    BrowserWindowInterface* browser = browser_.get();\n    if (tab_scoped_) {\n      browser = tab_ ? tab_->GetBrowserWindowInterface() : nullptr;\n    }\n    return browser ? BrowserExtensionWindowController::From(browser) : nullptr;\n  }\n\n private:\n  base::WeakPtr<BrowserWindowInterface> browser_;\n  base::WeakPtr<tabs::TabInterface> tab_;\n  const bool tab_scoped_;\n};"
- description: supply popup factory browser to Android extension delegate
  regex:
    re_pattern: \ \ auto\ delegate\ =\ std::make_unique<ExtensionViewHostDelegateAndroid>\(\);
    replace: '  auto delegate = std::make_unique<ExtensionViewHostDelegateAndroid>(browser);'
- description: supply side-panel factory browser or scoped tab to Android extension delegate
  regex:
    re_pattern: \ \ \ \ \ \ std::make_unique<ExtensionViewHostDelegateAndroid>\(\);
    replace: '      std::make_unique<ExtensionViewHostDelegateAndroid>(browser, tab_interface);'
- description: Format modified Android split dialog code
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ std::make_unique<ExtensionViewHostTabDelegate>\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tab_interface\->GetContents\(\)\);\

      \#else\

      \ \ std::unique_ptr<ExtensionViewHost::Delegate>\ delegate\ =\

      \ \ \ \ \ \ std::make_unique<ExtensionViewHostDelegateAndroid>\(browser,\ tab_interface\);\

      \#endif\

      \

      \ \ return\ CreateExtensionViewHost\(extension,\ url,\ profile,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mojom::ViewType::kExtensionSidePanel,\

      '
    replace: "              : std::make_unique<ExtensionViewHostTabDelegate>(\n                    tab_interface->GetContents());\n#else\n  std::unique_ptr<ExtensionViewHost::Delegate> delegate =\n      std::make_unique<ExtensionViewHostDelegateAndroid>(browser,\n                                                         tab_interface);\n#endif\n\n  return CreateExtensionViewHost(extension, url, profile,\n                                 mojom::ViewType::kExtensionSidePanel,\n"
