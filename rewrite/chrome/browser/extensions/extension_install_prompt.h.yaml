substitutions:
- description: Android manual import prompt follows originating document
  regex:
    pattern: "#include \"base/values.h\"\n"
    replace: "#include \"base/values.h\"\n#include \"build/build_config.h\"\n#if BUILDFLAG(IS_ANDROID)\n#include \"content/public/browser/web_contents_observer.h\"\n#endif\n"
  count: 1
- description: Android manual import prompt follows originating document
  regex:
    pattern: "class ExtensionInstallPrompt : public extensions::ExtensionInstallPromptClient {"
    replace: "class ExtensionInstallPrompt : public extensions::ExtensionInstallPromptClient\n#if BUILDFLAG(IS_ANDROID)\n                             , public content::WebContentsObserver\n#endif\n{"
  count: 1
- description: Android manual import prompt follows originating document
  regex:
    pattern: "  ExtensionInstallUI* install_ui() const { return install_ui_.get(); }\n"
    replace: "  ExtensionInstallUI* install_ui() const { return install_ui_.get(); }\n\n#if BUILDFLAG(IS_ANDROID)\n  // Opt in before asynchronous manual-import work. Retire a delayed prompt on\n  // navigation start, independently of the install API callback lifetime.\n  void CancelOnNavigation(content::WebContents* contents);\n#endif\n"
  count: 1
- description: Android manual import prompt follows originating document
  regex:
    pattern: " private:\n  // Sets the icon"
    replace: " private:\n#if BUILDFLAG(IS_ANDROID)\n  void DidStartNavigation(content::NavigationHandle* navigation) override;\n  void WebContentsDestroyed() override;\n  bool canceled_by_navigation_ = false;\n#endif\n\n  // Sets the icon"
  count: 1
- description: Android opted-in local import cancels delayed prompt after renderer loss
  regex:
    pattern: "\n#if BUILDFLAG(IS_ANDROID)\n  // Opt in before asynchronous manual-import work. Retire a delayed prompt on\n  // navigation start, independently of the install API callback lifetime.\n  void CancelOnNavigation(content::WebContents* contents);\n#endif\n\n"
    replace: "\n#if BUILDFLAG(IS_ANDROID)\n  // Opt in before asynchronous manual-import work. Retire a delayed prompt on\n  // navigation start or renderer loss, independently of the install API\n  // callback lifetime.\n  void CancelOnNavigation(content::WebContents* contents);\n#endif\n\n"
  count: 1
- description: Android opted-in local import cancels delayed prompt after renderer loss
  regex:
    pattern: "#if BUILDFLAG(IS_ANDROID)\n  void DidStartNavigation(content::NavigationHandle* navigation) override;\n  void WebContentsDestroyed() override;\n  bool canceled_by_navigation_ = false;\n#endif\n\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  void DidStartNavigation(content::NavigationHandle* navigation) override;\n  void WebContentsDestroyed() override;\n  void PrimaryMainFrameRenderProcessGone(\n      base::TerminationStatus status) override;\n  bool canceled_by_navigation_ = false;\n#endif\n\n"
  count: 1
