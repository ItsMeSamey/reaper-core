substitutions:
  - description: |
      Allow Brave's own component extension by id.
      Ensure some upstream component extensions are not loaded via denying by
      id.

      preempt_function_impl can't target one overload out of several sharing
      a name (it applies the same code to every match), so this uses regex
      instead to reach just the std::string overload.

      TODO(https://brave.dev/b/57607): Fix preempt_function_impl to support
      overload sets, then migrate these substitutions off regex.
    regex:
      pattern: |-
        bool IsComponentExtensionAllowlisted(const std::string& extension_id) {
      replace: |-
        bool IsComponentExtensionAllowlisted(const std::string& extension_id) {
          if (IsComponentExtensionAllowlistedBraveImpl(extension_id)) {
            return true;
          }
          if (IsComponentExtensionDenylistedBraveImpl(extension_id)) {
            return false;
          }

  - description: |
      Allow Brave's own component extension by manifest resource id.

      TODO(https://brave.dev/b/57607): Fix preempt_function_impl to support
      overload sets, then migrate these substitutions off regex.
    regex:
      pattern: |-
        bool IsComponentExtensionAllowlisted(int manifest_resource_id) {
      replace: |-
        bool IsComponentExtensionAllowlisted(int manifest_resource_id) {
          if (IsComponentExtensionAllowlistedBraveImpl(manifest_resource_id)) {
            return true;
          }

  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_extensions_allowlist/allowlist.cc'
    regex:
      re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

        \

        \#include\ "chrome/browser/extensions/component_extensions_allowlist/allowlist\.h"\

        \

        \#include\ <stddef\.h>\

        \

        '
      replace: '// found in the LICENSE file.


        #include "chrome/browser/extensions/component_extensions_allowlist/allowlist.h"

        #include "build/build_config.h"


        #include <stddef.h>


        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_extensions_allowlist/allowlist.cc'
    regex:
      re_pattern: '\#include\ "base/logging\.h"\

        \#include\ "base/notreached\.h"\

        \#include\ "build/branding_buildflags\.h"\

        \#include\ "build/build_config\.h"\

        \#include\ "build/chromeos_buildflags\.h"\

        \#include\ "chrome/common/buildflags\.h"\

        \#include\ "chrome/common/extensions/extension_constants\.h"\

        \#include\ "chrome/grit/aim_eligibility_extension_resources\.h"\

        \#include\ "chrome/grit/browser_resources\.h"\

        \#include\ "chrome/grit/component_extension_resources\.h"\

        \#include\ "chrome/grit/contextual_tasks_extension_resources\.h"\

        \#include\ "extensions/buildflags/buildflags\.h"\

        \#include\ "extensions/common/constants\.h"\

        \#include\ "printing/buildflags/buildflags\.h"\

        '
      replace: '#include "base/logging.h"

        #include "base/notreached.h"

        #include "build/branding_buildflags.h"

        #include "build/chromeos_buildflags.h"

        #include "chrome/common/buildflags.h"

        #include "chrome/common/extensions/extension_constants.h"

        #if !BUILDFLAG(IS_ANDROID)

        #include "chrome/grit/aim_eligibility_extension_resources.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        #include "chrome/grit/browser_resources.h"

        #include "chrome/grit/component_extension_resources.h"

        #if !BUILDFLAG(IS_ANDROID)

        #include "chrome/grit/contextual_tasks_extension_resources.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        #include "extensions/buildflags/buildflags.h"

        #include "extensions/common/constants.h"

        #include "printing/buildflags/buildflags.h"

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_extensions_allowlist/allowlist.cc'
    regex:
      re_pattern: '\ \ \ \ return\ false;\

        \ \ \}\

        \ \ constexpr\ auto\ kAllowed\ =\ base::MakeFixedFlatSet<std::string_view>\(\{\

        \ \ \ \ \ \ extension_misc::kAimEligibilityExtensionId,\

        \ \ \ \ \ \ extension_misc::kContextualTasksExtensionId,\

        \ \ \ \ \ \ extension_misc::kGlicExtensionId,\

        \ \ \ \ \ \ extension_misc::kInAppPaymentsSupportAppId,\

        \ \ \ \ \ \ extension_misc::kPdfExtensionId,\

        \#if\ BUILDFLAG\(IS_CHROMEOS\)\

        '
      replace: "    return false;\n  }\n  constexpr auto kAllowed = base::MakeFixedFlatSet<std::string_view>({\n#if !BUILDFLAG(IS_ANDROID)\n      extension_misc::kAimEligibilityExtensionId,\n      extension_misc::kContextualTasksExtensionId,\n      extension_misc::kGlicExtensionId,\n#endif  // !BUILDFLAG(IS_ANDROID)\n      extension_misc::kInAppPaymentsSupportAppId,\n      extension_misc::kPdfExtensionId,\n#if BUILDFLAG(IS_CHROMEOS)\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_extensions_allowlist/allowlist.cc'
    regex:
      re_pattern: '\ \ \ \ case\ IDR_HANGOUT_SERVICES_MANIFEST_V2:\

        \ \ \ \ case\ IDR_HANGOUT_SERVICES_MANIFEST_V3:\

        \#endif\

        \ \ \ \ case\ IDR_AIM_ELIGIBILITY_EXTENSION_MANIFEST_JSON:\

        \ \ \ \ case\ IDR_CONTEXTUAL_TASKS_EXTENSION_MANIFEST_JSON:\

        \ \ \ \ case\ IDR_GLIC_EXTENSION_MANIFEST:\

        \ \ \ \ case\ IDR_NETWORK_SPEECH_SYNTHESIS_MANIFEST:\

        \ \ \ \ case\ IDR_NETWORK_SPEECH_SYNTHESIS_MANIFEST_MV3:\

        \ \ \ \ case\ IDR_READING_MODE_GDOCS_HELPER_MANIFEST:\

        '
      replace: "    case IDR_HANGOUT_SERVICES_MANIFEST_V2:\n    case IDR_HANGOUT_SERVICES_MANIFEST_V3:\n#endif\n#if !BUILDFLAG(IS_ANDROID)\n    case IDR_AIM_ELIGIBILITY_EXTENSION_MANIFEST_JSON:\n    case IDR_CONTEXTUAL_TASKS_EXTENSION_MANIFEST_JSON:\n    case IDR_GLIC_EXTENSION_MANIFEST:\n#endif  // !BUILDFLAG(IS_ANDROID)\n    case IDR_NETWORK_SPEECH_SYNTHESIS_MANIFEST:\n    case IDR_NETWORK_SPEECH_SYNTHESIS_MANIFEST_MV3:\n    case IDR_READING_MODE_GDOCS_HELPER_MANIFEST:\n"
