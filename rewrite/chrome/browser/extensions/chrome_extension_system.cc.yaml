substitutions:
- description: No Android uninstall telemetry implementation dependency
  regex:
    pattern: '#include "extensions/browser/updater/uninstall_ping_sender.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "extensions/browser/updater/uninstall_ping_sender.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: No Android uninstall event filter
  regex:
    pattern: "UninstallPingSender::FilterResult ShouldSendUninstallPing(\n    Profile* profile,\n    const Extension* extension,\n\
      \    UninstallReason reason) {\n  ExtensionManagement* extension_management =\n      ExtensionManagementFactory::GetForBrowserContext(profile);\n\
      \  if (extension && (extension->from_webstore() ||\n                    extension_management->UpdatesFromWebstore(*extension)))\
      \ {\n    return UninstallPingSender::SEND_PING;\n  }\n  return UninstallPingSender::DO_NOT_SEND_PING;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nUninstallPingSender::FilterResult ShouldSendUninstallPing(\n    Profile* profile,\n\
      \    const Extension* extension,\n    UninstallReason reason) {\n  ExtensionManagement* extension_management =\n   \
      \   ExtensionManagementFactory::GetForBrowserContext(profile);\n  if (extension && (extension->from_webstore() ||\n\
      \                    extension_management->UpdatesFromWebstore(*extension))) {\n    return UninstallPingSender::SEND_PING;\n\
      \  }\n  return UninstallPingSender::DO_NOT_SEND_PING;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Do not register the Android uninstall reporter
  regex:
    pattern: "  uninstall_ping_sender_ = std::make_unique<UninstallPingSender>(\n      ExtensionRegistry::Get(profile_),\n\
      \      base::BindRepeating(&ShouldSendUninstallPing, profile_));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  uninstall_ping_sender_ = std::make_unique<UninstallPingSender>(\n      ExtensionRegistry::Get(profile_),\n\
      \      base::BindRepeating(&ShouldSendUninstallPing, profile_));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
