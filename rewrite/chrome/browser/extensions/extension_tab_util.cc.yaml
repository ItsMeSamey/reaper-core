    replace: "  return sessions::SessionTabHelper::IdForTab(web_contents).id();\n}\n\nint ExtensionTabUtil::GetTabId(const tabs::TabInterface& tab) {\n  if (tab.GetContents()) {\n    return GetTabId(tab.GetContents());\n  }\n  return tabs::SessionMappedTabHandleFactory::GetInstance()\n      .GetSessionIdForHandle(tab.GetHandle().raw_value())\n      .value_or(api::tabs::TAB_ID_NONE);\n}\n\nint ExtensionTabUtil::GetWindowIdOfTab(const tabs::TabInterface& tab) {\n  if (tab.GetContents()) {\n    return GetWindowIdOfTab(tab.GetContents());\n  }\n#if BUILDFLAG(IS_ANDROID)\n  return TabAndroid::FromTabInterface(&tab)->GetWindowId().id();\n#else\n  return api::tabs::TAB_ID_NONE;\n#endif\n}\n\nint ExtensionTabUtil::GetWindowIdOfTab(const WebContents* web_contents) {\n  return sessions::SessionTabHelper::IdForWindowContainingTab(web_contents)\n      .id();\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 4)"
  regex:
    re_pattern: "\\ \\ \\ \\ tabs::TabInterface\\*\\ opener\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ tab_list\\->GetOpenerForTab\\(tab_interface\\->GetHandle\\(\\)\\);\\\n\\ \\ \\ \\ if\\ \\(opener\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ content::WebContents\\*\\ opener_contents\\ =\\ opener\\->GetContents\\(\\);\\\n\\ \\ \\ \\ \\ \\ CHECK\\(opener_contents\\);\\\n\\ \\ \\ \\ \\ \\ tab_object\\.opener_tab_id\\ =\\ GetTabIdForExtensions\\(\\*opener_contents\\);\\\n\\ \\ \\ \\ \\}\\\n\\ \\ \\}\\\n\\\n\\ \\ ScrubTabForExtension\\(extension,\\ contents,\\ \\&tab_object,\\ scrub_tab_behavior\\);\\\n\\ \\ return\\ tab_object;\\\n\\}\\\n\\\n//\\ static\\\n"
    replace: "    tabs::TabInterface* opener =\n        tab_list->GetOpenerForTab(tab_interface->GetHandle());\n    if (opener) {\n#if BUILDFLAG(IS_ANDROID)\n      if (auto* opener_contents = opener->GetContents()) {\n        tab_object.opener_tab_id = GetTabIdForExtensions(*opener_contents);\n      } else {\n        tab_object.opener_tab_id = GetTabId(*opener);\n      }\n#else\n      CHECK(opener->GetContents());\n      tab_object.opener_tab_id = GetTabIdForExtensions(*opener->GetContents());\n#endif\n    }\n  }\n\n  ScrubTabForExtension(extension, contents, &tab_object, scrub_tab_behavior);\n  return tab_object;\n}\n\n// static\napi::tabs::Tab ExtensionTabUtil::CreateTabObject(\n    tabs::TabInterface& tab,\n    ScrubTabBehavior scrub_tab_behavior,\n    const Extension* extension,\n    TabListInterface* tab_list,\n    int tab_index) {\n  if (tab.GetContents()) {\n    return CreateTabObject(tab.GetContents(), scrub_tab_behavior, extension,\n                           tab_list, tab_index);\n  }\n  auto* browser = tab.GetBrowserWindowInterface();\n  if (!tab_list && browser) {\n    tab_list = TabListInterface::From(browser);\n    if (tab_list) {\n      tab_index = tab_list->GetIndexOfTab(tab.GetHandle());\n    }\n  }\n  api::tabs::Tab object;\n  object.id = browser && !BrowserSupportsTabs(browser)\n                  ? api::tabs::TAB_ID_NONE : GetTabId(tab);\n  object.index = tab_index;\n  object.window_id = GetWindowIdOfTab(tab);\n  object.status = api::tabs::TabStatus::kUnloaded;\n  object.last_accessed = tab.GetLastActiveTime().InMillisecondsFSinceUnixEpoch();\n  object.active = tab.IsActivated();\n  object.selected = object.active;\n  object.highlighted = tab.IsSelected();\n  object.pinned = tab.IsPinned();\n  object.group_id = tab.GetGroup() ? GetGroupId(*tab.GetGroup()) : -1;\n  object.split_view_id = tab.GetSplit() ? GetSplitId(*tab.GetSplit()) : -1;\n  object.incognito = tab.GetProfile()->IsOffTheRecord();\n  // Absent contents have no live renderer, audible/capture or page-node state.\n  // Deferred session restores are unloaded, not necessarily discarded/frozen.\n  object.audible = false;\n  object.discarded = false;\n  object.frozen = false;\n  object.auto_discardable = true;\n  api::tabs::MutedInfo muted;\n  muted.muted = false;\n  object.muted_info = std::move(muted);\n  object.url = tab.GetURL().spec();\n#if BUILDFLAG(IS_ANDROID)\n  const GURL pending_url = TabAndroid::FromTabInterface(&tab)->GetPendingURL();\n  if (!pending_url.is_empty()) {\n    object.url = std::string();\n    object.pending_url = pending_url.spec();\n  }\n#endif\n  object.title = base::UTF16ToUTF8(tab.GetTitle());\n  if (tab_list) {\n    if (auto* opener = tab_list->GetOpenerForTab(tab.GetHandle())) {\n      object.opener_tab_id = GetTabId(*opener);\n    }\n  }\n  ScrubTabForExtension(extension, nullptr, &object, scrub_tab_behavior);\n  return object;\n}\n\n// static\nExtensionTabUtil::ScrubTabBehavior ExtensionTabUtil::GetScrubTabBehavior(\n    const Extension* extension,\n    mojom::ContextType context,\n    const tabs::TabInterface& tab) {\n  if (tab.GetContents()) {\n    return GetScrubTabBehavior(extension, context, tab.GetContents());\n  }\n  GURL committed_url = tab.GetURL();\n  GURL pending_url;\n#if BUILDFLAG(IS_ANDROID)\n  pending_url = TabAndroid::FromTabInterface(&tab)->GetPendingURL();\n  if (!pending_url.is_empty()) {\n    committed_url = GURL();\n  }\n#endif\n  const int id = GetTabId(tab);\n  return {GetScrubTabBehaviorImpl(extension, context, committed_url, id),\n          GetScrubTabBehaviorImpl(extension, context, pending_url, id)};\n}\n\n// static\n"
