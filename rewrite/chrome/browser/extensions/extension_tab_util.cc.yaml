    replace: "#if BUILDFLAG(IS_ANDROID)\n// static\nbool ExtensionTabUtil::IsTabAutoDiscardable(content::WebContents* contents) {\n  if (!performance_manager::PerformanceManager::IsAvailable() ||\n      !performance_manager::PerformanceManager::\n          GetPrimaryPageNodeForWebContents(contents)) {\n    return true;\n  }\n  return performance_manager::PageLiveStateDecorator::IsAutoDiscardable(\n      contents);\n}\n\n// static\nbool ExtensionTabUtil::IsTabFrozen(content::WebContents* contents) {\n  if (!performance_manager::PerformanceManager::IsAvailable()) {\n    return false;\n  }\n  auto page =\n      performance_manager::PerformanceManager::GetPrimaryPageNodeForWebContents(\n          contents);\n  return page && page->GetLifecycleState() ==\n                     performance_manager::PageNode::LifecycleState::kFrozen;\n}\n\n// static\nbool ExtensionTabUtil::SetTabAutoDiscardable(content::WebContents* contents,\n                                             bool value) {\n  if (!performance_manager::PerformanceManager::IsAvailable() ||\n      !performance_manager::PerformanceManager::\n          GetPrimaryPageNodeForWebContents(contents)) {\n    return false;\n  }\n  performance_manager::PageLiveStateDecorator::SetIsAutoDiscardable(contents,\n                                                                    value);\n  return true;\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n"
