substitutions:
  - description: 'Make AddDefaultComponentExtensions virtual'
    make_virtual:
      class_name: ComponentLoader
      method_name: AddDefaultComponentExtensions

  - description: 'Friend BraveComponentLoader'
    add_friend:
      class_name: ComponentLoader
      friend_type: class BraveComponentLoader

  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_loader.h'
    regex:
      re_pattern: '\#define\ CHROME_BROWSER_EXTENSIONS_COMPONENT_LOADER_H_\

        \

        \#include\ <stddef\.h>\

        \

        \#include\ <optional>\

        \#include\ <string>\

        '
      replace: '#define CHROME_BROWSER_EXTENSIONS_COMPONENT_LOADER_H_


        #include <stddef.h>

        #include "build/build_config.h"


        #include <optional>

        #include <string>

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_loader.h'
    regex:
      re_pattern: '\#include\ "base/values\.h"\

        \#include\ "base/version\.h"\

        \#include\ "build/branding_buildflags\.h"\

        \#include\ "build/build_config\.h"\

        \#include\ "build/chromeos_buildflags\.h"\

        \#include\ "chrome/common/buildflags\.h"\

        \#include\ "components/keyed_service/core/keyed_service\.h"\

        '
      replace: '#include "base/values.h"

        #include "base/version.h"

        #include "build/branding_buildflags.h"

        #include "build/chromeos_buildflags.h"

        #include "chrome/common/buildflags.h"

        #include "components/keyed_service/core/keyed_service.h"

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_loader.h'
    regex:
      re_pattern: '\

        \ \ void\ AddNetworkSpeechSynthesisExtension\(\);\

        \

        \ \ void\ AddAimEligibilityExtension\(\);\

        \

        \ \ void\ AddGlicExtension\(\);\

        \

        \ \ void\ AddContextualTasksExtension\(\);\

        \

        \ \ void\ AddWithNameAndDescription\(int\ manifest_resource_id,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ base::FilePath\&\ root_directory,\

        '
      replace: "\n  void AddNetworkSpeechSynthesisExtension();\n\n#if !BUILDFLAG(IS_ANDROID)\n  void AddAimEligibilityExtension();\n\n  void AddGlicExtension();\n\n  void AddContextualTasksExtension();\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  void AddWithNameAndDescription(int manifest_resource_id,\n                                 const base::FilePath& root_directory,\n"
