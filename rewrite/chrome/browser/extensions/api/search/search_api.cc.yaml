substitutions:
- description: Keep off-the-record callers confined to their exact profile, matching ChromeExtensionFunctionDetails.
  regex:
    pattern: "            (include_incognito && bwi->GetProfile()->GetOriginalProfile() ==\n                                      profile->GetOriginalProfile())) {"
    replace: "            (include_incognito &&\n             bwi->GetProfile()->GetOriginalProfile() == profile)) {"
- description: Retain the already authorized Android browser for navigation from an empty tab model.
  regex:
    pattern: TabModel* GetLastActiveTabModel(Profile* profile, bool include_incognito) {
    replace: "TabModel* GetLastActiveTabModel(Profile* profile,\n                               bool include_incognito,\n                               BrowserWindowInterface** fallback_browser) {"
- description: Return the matched browser alongside its tab model.
  regex:
    pattern: "  if (browser) {\n    return static_cast<TabModel*>(TabListInterface::From(browser));"
    replace: "  *fallback_browser = browser;\n  if (browser) {\n    return static_cast<TabModel*>(TabListInterface::From(browser));"
- description: Keep the destination browser if Android has no active tab.
  regex:
    pattern: '  content::WebContents* web_contents = nullptr;'
    replace: "  content::WebContents* web_contents = nullptr;\n  BrowserWindowInterface* fallback_browser = nullptr;"
- description: Use the same profile/incognito-filtered window for empty-window creation.
  regex:
    pattern: '          GetLastActiveTabModel(profile, include_incognito_information());'
    replace: "          GetLastActiveTabModel(profile, include_incognito_information(),\n                                &fallback_browser);"
- description: Only current-tab searches require an existing active WebContents.
  regex:
    pattern: "    case Disposition::kNone:\n      DCHECK(url.is_valid());"
    replace: "    case Disposition::kNone:\n#if BUILDFLAG(IS_ANDROID)\n      // A regular Android window can remain alive in the tab switcher after\n      // its final tab closes. Current-tab searches then have no destination.\n      if (!web_contents) {\n        return RespondNow(Error(\"No active browser.\"));\n      }\n#endif\n      DCHECK(url.is_valid());"
- description: Retain the selected browser for explicit new-tab navigation.
  regex:
    pattern: "      ExtensionTabUtil::NavigateToURL(\n          WindowOpenDisposition::NEW_FOREGROUND_TAB,\n          /*source_contents=*/web_contents, url,\n          // Binding `this` is safe because it is ref-counted.\n          base::BindOnce(&SearchQueryFunction::OnNavigate, this));"
    replace: "      ExtensionTabUtil::NavigateToURL(\n          WindowOpenDisposition::NEW_FOREGROUND_TAB,\n          /*source_contents=*/web_contents, url,\n          // Binding `this` is safe because it is ref-counted.\n          base::BindOnce(&SearchQueryFunction::OnNavigate, this), fallback_browser);"
- description: Retain the selected profile/window for explicit new-window navigation.
  regex:
    pattern: "      ExtensionTabUtil::NavigateToURL(\n          WindowOpenDisposition::NEW_WINDOW,\n          /*source_contents=*/web_contents, url,\n          // Binding `this` is safe because it is ref-counted.\n          base::BindOnce(&SearchQueryFunction::OnNavigate, this));"
    replace: "      ExtensionTabUtil::NavigateToURL(\n          WindowOpenDisposition::NEW_WINDOW,\n          /*source_contents=*/web_contents, url,\n          // Binding `this` is safe because it is ref-counted.\n          base::BindOnce(&SearchQueryFunction::OnNavigate, this), fallback_browser);"
