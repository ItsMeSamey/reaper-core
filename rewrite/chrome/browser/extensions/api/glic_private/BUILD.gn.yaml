# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/extensions/api/glic_private/BUILD.gn'
  regex:
    re_pattern: 'assert\(enable_extensions_core,\

      \ \ \ \ \ \ \ "Cannot\ depend\ on\ extensions\ because\ enable_extensions_core=false\."\)\

      \

      source_set\("glic_private"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "glic_private_api\.cc",\

      \ \ \ \ "glic_private_api\.h",\

      \ \ \]\

      \

      \ \ configs\ \+=\ \[\ "//build/config/compiler:wexit_time_destructors"\ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//chrome/browser/contextual_tasks",\

      \ \ \ \ "//chrome/browser/extensions",\

      \ \ \ \ "//chrome/browser/glic",\

      \ \ \ \ "//chrome/browser/glic/actor",\

      \ \ \ \ "//chrome/browser/metrics",\

      \ \ \ \ "//chrome/browser/profiles:profile",\

      \ \ \ \ "//chrome/browser/signin",\

      \ \ \ \ "//chrome/browser/tab_list",\

      \ \ \ \ "//chrome/browser/ui",\

      \ \ \ \ "//chrome/browser/ui/navigator",\

      \ \ \ \ "//chrome/common/extensions/api",\

      \ \ \ \ "//components/contextual_tasks/public",\

      \ \ \ \ "//components/endpoint_fetcher",\

      \ \ \ \ "//components/google/core/common",\

      \ \ \ \ "//components/signin/public/identity_manager",\

      \ \ \ \ "//components/variations",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//extensions/browser",\

      \ \ \ \ "//extensions/common",\

      \ \ \ \ "//url",\

      \ \ \]\

      \}\

      '
    replace: "assert(enable_extensions_core,\n       \"Cannot depend on extensions because enable_extensions_core=false.\")\n\nif (!is_android) {\n  source_set(\"glic_private\") {\n    sources = [\n      \"glic_private_api.cc\",\n      \"glic_private_api.h\",\n    ]\n    if (is_android) {\n      sources -= [\n        \"glic_private_api.cc\",\n        \"glic_private_api.h\",\n      ]\n    }\n\n    configs += [ \"//build/config/compiler:wexit_time_destructors\" ]\n\n    deps = [\n      \"//base\",\n      \"//chrome/browser/contextual_tasks\",\n      \"//chrome/browser/extensions\",\n      \"//chrome/browser/glic\",\n      \"//chrome/browser/glic/actor\",\n      \"//chrome/browser/metrics\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/signin\",\n      \"//chrome/browser/tab_list\",\n      \"//chrome/browser/ui\",\n      \"//chrome/browser/ui/navigator\",\n      \"//chrome/common/extensions/api\",\n      \"//components/contextual_tasks/public\",\n      \"//components/endpoint_fetcher\",\n      \"//components/google/core/common\",\n      \"//components/signin/public/identity_manager\",\n      \"//components/variations\",\n      \"//content/public/browser\",\n      \"//extensions/browser\",\n      \"//extensions/common\",\n      \"//url\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/contextual_tasks\",\n        \"//chrome/browser/glic\",\n        \"//chrome/browser/glic/actor\",\n        \"//components/contextual_tasks/public\",\n      ]\n    }\n  }\n}\n"
