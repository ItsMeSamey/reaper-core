    replace: "  EXPECT_EQ(restored_id, api_test_utils::GetInteger(window, \"id\"));\n}\n\n#if BUILDFLAG(IS_ANDROID)\nclass ExtensionSessionsAndroidForeignWindowTest : public ExtensionSessionsTest {\n public:\n  void SetUpCommandLine(base::CommandLine* command_line) override {\n    ExtensionSessionsTest::SetUpCommandLine(command_line);\n    // The restored window launches a normal ChromeTabbedActivity.\n    command_line->AppendSwitch(\"disable-fre\");\n  }\n\n  void SetUpOnMainThread() override {\n    ExtensionSessionsTest::SetUpOnMainThread();\n    ForEachCurrentBrowserWindowInterfaceOrderedByActivation(\n        [&](BrowserWindowInterface* browser) {\n          initial_window_ids_.insert(ExtensionTabUtil::GetWindowId(browser));\n          return true;\n        });\n    base::FilePath test_data;\n    ASSERT_TRUE(base::PathService::Get(chrome::DIR_TEST_DATA, &test_data));\n    embedded_test_server()->ServeFilesFromDirectory(test_data);\n    ASSERT_TRUE(StartEmbeddedTestServer());\n  }\n\n  void TearDownOnMainThread() override {\n    // Close only windows created by this fixture, including a window left by a\n    // failing assertion. Closing tabs alone does not explicitly finish each\n    // additional ChromeTabbedActivity.\n    std::vector<base::WeakPtr<BrowserWindowInterface>> restored_windows;\n    ForEachCurrentBrowserWindowInterfaceOrderedByActivation(\n        [&](BrowserWindowInterface* browser) {\n          if (!initial_window_ids_.contains(\n                  ExtensionTabUtil::GetWindowId(browser))) {\n            restored_windows.push_back(browser->GetWeakPtr());\n          }\n          return true;\n        });\n    for (const auto& browser : restored_windows) {\n      if (browser) {\n        browser->GetWindow()->Close();\n      }\n    }\n    EXPECT_TRUE(base::test::RunUntil([&] {\n      for (const auto& browser : restored_windows) {\n        if (browser) {\n          return false;\n        }\n      }\n      return true;\n    }));\n    ExtensionSessionsTest::TearDownOnMainThread();\n  }\n\n protected:\n  GURL SavedUrl(int tab, int navigation) {\n    return embedded_test_server()->GetURL(base::StringPrintf(\n        \"/title1.html?tab=%d&navigation=%d\", tab, navigation));\n  }\n\n  void CreateForeignWindowModel(\n      bool popup = false,\n      std::unique_ptr<syncer::MockDataTypeWorker>* retained_worker = nullptr) {\n    syncer::DataTypeActivationRequest request;\n    request.error_handler = base::DoNothing();\n    request.cache_guid = kTestCacheGuid;\n    request.authenticated_gaia_id = GaiaId(\"SomeGaiaId\");\n    auto* service = SessionSyncServiceFactory::GetForProfile(GetProfile());\n    base::test::TestFuture<std::unique_ptr<syncer::DataTypeActivationResponse>>\n        sync_start;\n    service->GetControllerDelegate()->OnSyncStarting(request,\n                                                     sync_start.GetCallback());\n    auto worker = syncer::MockDataTypeWorker::CreateWorkerAndConnectSync(\n        sync_start.Take());\n\n    sync_pb::EntitySpecifics header;\n    BuildSessionSpecifics(\"foreign-window\", header.mutable_session());\n    BuildWindowSpecifics(20, {100, 101, 102}, header.mutable_session());\n    auto* window =\n        header.mutable_session()->mutable_header()->mutable_window(0);\n    window->set_selected_tab_index(2);\n    window->set_browser_type(popup\n                                 ? sync_pb::SyncEnums_BrowserType_TYPE_POPUP\n                                 : sync_pb::SyncEnums_BrowserType_TYPE_TABBED);\n    syncer::EntityData data;\n    data.client_tag_hash = TagHashFromSpecifics(header.session());\n    data.id = \"FakeId:\" + data.client_tag_hash.value();\n    data.specifics = header;\n    data.creation_time = base::Time::Now();\n    data.modification_time = data.creation_time;\n    syncer::UpdateResponseData update;\n    update.entity = std::move(data);\n    update.response_version = 1;\n    syncer::UpdateResponseDataList updates;\n    updates.push_back(std::move(update));\n    worker->UpdateFromServer(std::move(updates));\n    for (int tab_index = 0; tab_index < 3; ++tab_index) {\n      sync_pb::EntitySpecifics entity;\n      BuildTabSpecifics(\"foreign-window\", 100 + tab_index, tab_index,\n                        entity.mutable_session());\n      auto* tab = entity.mutable_session()->mutable_tab();\n      tab->set_window_id(20);\n      tab->set_tab_visual_index(tab_index);\n      tab->set_current_navigation_index(1);\n      tab->set_pinned(tab_index == 0);\n      tab->clear_navigation();\n      for (int i = 0; i < 3; ++i) {\n        auto* navigation = tab->add_navigation();\n        navigation->set_index(i);\n        navigation->set_virtual_url(SavedUrl(tab_index, i).spec());\n        navigation->set_title(\"Saved page\");\n        navigation->set_page_transition(\n            sync_pb::SyncEnums_PageTransition_TYPED);\n      }\n      worker->UpdateFromServer(TagHashFromSpecifics(entity.session()), entity);\n    }\n    // Exercise the real SessionSyncService model, not a restore delegate fake.\n    base::RunLoop().RunUntilIdle();\n    if (retained_worker) {\n      *retained_worker = std::move(worker);\n    } else {\n      worker.reset();\n    }\n    base::RunLoop().RunUntilIdle();\n    auto* delegate = service->GetOpenTabsUIDelegate();\n    ASSERT_TRUE(delegate);\n    auto windows = delegate->GetForeignSession(\"foreign-window\");\n    ASSERT_EQ(1u, windows.size());\n    ASSERT_EQ(3u, windows[0]->tabs.size());\n  }\n\n  std::unique_ptr<sessions::SessionWindow> MakeWindow(int selected_index,\n                                                      int last_index = 3) {\n    auto window = std::make_unique<sessions::SessionWindow>();\n    window->window_id = SessionID::NewUnique();\n    window->type = sessions::SessionWindow::TYPE_NORMAL;\n    window->selected_tab_index = selected_index;\n    for (int tab_index = 0; tab_index <= last_index; ++tab_index) {\n      auto tab = std::make_unique<sessions::SessionTab>();\n      tab->window_id = windo