# Android mixed native-tab and Java-window session restoration.
substitutions:
- description: Include real group metadata and navigation history for Android restoration regressions
  regex:
    re_pattern: \#include\ "chrome/browser/flags/android/chrome_feature_list\.h"
    replace: '#include "chrome/browser/flags/android/chrome_feature_list.h"

      #include "components/tab_groups/tab_group_visual_data.h"

      #include "content/public/browser/navigation_controller.h"'
- description: Cover real mixed Android window/native tab restoration, namespace collisions, ordering, and malformed IDs
  regex:
    re_pattern: IN_PROC_BROWSER_TEST_F\(ExtensionSessionsTest,\ RestoreForeignSessionWindow\)\ \{
    replace: "#if BUILDFLAG(IS_ANDROID)\n// Exercise the real native tab history together with the real Java closed-window\n// manager. Only native entry timestamps/IDs are adjusted to make ordering and\n// numeric namespace collisions deterministic, without sleeps or a fake backend.\nclass ExtensionSessionsMixedHistoryTest : public ExtensionSessionsTest {\n protected:\n  void CreateMixedHistory(bool grouped_split = false, bool extra_tab = false) {\n    auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n    ASSERT_TRUE(service);\n    ASSERT_TRUE(service->entries().empty());\n    NavigateToURLInNewTab(GURL(\"chrome://version/\"));\n    CloseTabForWebContents(GetWebContentsAt(1));\n    ASSERT_EQ(1u, service->entries().size());\n    ASSERT_EQ(sessions::tab_restore::Type::TAB,\n              service->entries().front()->type);\n\n    BrowserWindowInterface* second =\n        CreateBrowserWindowWithType(BrowserWindowInterface::TYPE_NORMAL);\n    ASSERT_TRUE(second);\n    auto* tabs = TabListInterface::From(second);\n    ASSERT_TRUE(tabs);\n    ASSERT_EQ(1, tabs->GetTabCount());\n    auto* contents = tabs->GetTab(0)->GetContents();\n    ASSERT_TRUE(NavigateToURL(contents, GURL(\"chrome://version/\")));\n    ASSERT_TRUE(NavigateToURL(contents, GURL(\"chrome://credits/\")));\n    window_navigation_count_ = contents->GetController().GetEntryCount();\n    ASSERT_GE(window_navigation_count_, 2);\n    if (grouped_split || extra_tab) {\n      tabs->OpenTab(GURL(\"chrome://version/\"), -1);\n      ASSERT_EQ(2, tabs->GetTabCount());\n      ASSERT_TRUE(content::WaitForLoadStop(tabs->GetTab(1)->GetContents()));\n    }\n    if (grouped_split) {\n      std::vector<tabs::TabHandle> members = {\n          tabs->GetTab(0)->GetHandle(), tabs->GetTab(1)->GetHandle()};\n      group_id_ = tabs->CreateTabGroup(members);\n      ASSERT_TRUE(group_id_);\n      tabs->SetTabGroupVisualData(*group_id_,\n          tab_groups::TabGroupVisualData(u\"Restored group\",\n                                         tab_groups::TabGroupColorId::kBlue));\n      tabs->ActivateTab(members[0]);\n      split_id_ = tabs->CreateSplit(members);\n      ASSERT_TRUE(split_id_);\n    }\n    CloseWindowAndWait(second);\n\n    auto result = utils::RunFunctionAndReturnSingleResult(\n        CreateFunction<SessionsGetRecentlyClosedFunction>(true).get(), \"[]\",\n        GetProfile());\n    ASSERT_TRUE(result);\n    ASSERT_TRUE(result->is_list());\n    ASSERT_EQ(2u, result->GetList().size());\n    for (const auto& entry : result->GetList()) {\n      if (const auto* window = entry.GetDict().FindDict(\"window\")) {\n        window_session_id_ = utils::GetString(*window, \"sessionId\");\n        const auto* closed_tabs = window->FindList(\"tabs\");\n        ASSERT_TRUE(closed_tabs);\n        for (const auto& closed_tab : *closed_tabs) {\n          child_session_ids_.push_back(utils::GetString(closed_tab.GetDict(), \"sessionId\"));\n        }\n      }\n    }\n    constexpr char prefix[] = \"android-window:\";\n    ASSERT_TRUE(window_session_id_.starts_with(prefix));\n    const auto separator = window_session_id_.find(':', sizeof(prefix) - 1);\n    ASSERT_NE(std::string::npos, separator);\n    ASSERT_TRUE(base::StringToInt(window_session_id_.substr(sizeof(prefix) - 1,\n        separator - (sizeof(prefix) - 1)), &window_instance_id_));\n    ASSERT_TRUE(base::StringToInt64(window_session_id_.substr(separator + 1),\n                                   &window_closure_time_));\n    ASSERT_EQ(1u, service->entries().size());\n  }\n\n  std::optional<base::Value> Restore(const std::string& arguments) {\n    return utils::RunFunctionAndReturnSingleResult(\n        CreateFunction<SessionsRestoreFunction>(true).get(), arguments,\n        GetProfile());\n  }\n\n  std::string window_session_id_;\n  int window_instance_id_ = -1;\n  int window_navigation_count_ = 0;\n  int64_t window_closure_time_ = 0;\n  std::vector<std::string> child_session_ids_;\n  std::optional<tab_groups::TabGroupId> group_id_;\n  std::optional<split_tabs::SplitTabId> split_id_;\n};\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMixedHistoryTest,\n                       WindowIdDoesNotRestoreCollidingNativeTab) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory());\n  auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n  ASSERT_GT(window_instance_id_, 0);\n  service->entries().front()->id =\n      SessionID::FromSerializedValue(window_instance_id_);\n  BrowserCreatedWaiter waiter;\n  auto result = Restore(\"[\\\\\"\" + window_session_id_ + \"\\\\\"]\");\n  ASSERT_TRUE(result);\n  ASSERT_TRUE(result->GetDict().FindDict(\"window\"));\n  BrowserWindowInterface* restored = waiter.Wait();\n  ASSERT_TRUE(restored);\n  auto* contents = TabListInterface::From(restored)->GetTab(0)->GetContents();\n  ASSERT_TRUE(content::WaitForLoadStop(contents));\n  EXPECT_EQ(GURL(\"chrome://credits/\"), contents->GetURL());\n  EXPECT_EQ(window_navigation_count_, contents->GetController().GetEntryCount());\n  ASSERT_EQ(1u, service->entries().size());\n  EXPECT_EQ(window_instance_id_, service->entries().front()->id.id());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMixedHistoryTest,\n                       LegacyWindowIdFallsBackAfterNativeMiss) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory());\n  auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n  service->entries().front()->id =\n      SessionID::FromSerializedValue(window_instance_id_ + 1000);\n  service->entries().front()->original_id =\n      service->entries().front()->id;\n  BrowserCreatedWaiter waiter;\n  auto result = Restore(\"[\\\\\"\" + base::NumberToString(window_instance_id_) + \"\\\\\"]\");\n  ASSERT_TRUE(result);\n  ASSERT_TRUE(result->GetDict().FindDict(\"window\"));\n  ASSERT_TRUE(waiter.Wait());\n  ASSERT_EQ(1u, service->entries().size());\n  EXPECT_EQ(window_instance_id_ + 1000, service->entries().front()->id.id());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMixedHistoryTest,\n                       MostRecentWindowWinsOverOlderNativeTab) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory());\n  auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n  service->entries().front()->timestamp = base::Time::UnixEpoch();\n  const SessionID native_id = service->entries().front()->id;\n  BrowserCreatedWaiter waiter;\n  auto result = Restore(\"[]\");\n  ASSERT_TRUE(result);\n  ASSERT_TRUE(result->GetDict().FindDict(\"window\"));\n  ASSERT_TRUE(waiter.Wait());\n  ASSERT_EQ(1u, service->entries().size());\n  EXPECT_EQ(native_id, service->entries().front()->id);\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMixedHistoryTest,\n                       MostRecentNativeTabWinsOverOlderWindow) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory());\n  auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n  service->entries().front()->timestamp = base::Time::Now() + base::Days(1);\n  auto result = Restore(\"[]\");\n  ASSERT_TRUE(result);\n  const auto* tab = result->GetDict().FindDict(\"tab\");\n  ASSERT_TRUE(tab);\n  EXPECT_EQ(\"chrome://version/\", utils::GetString(*tab, \"url\"));\n  EXPECT_TRUE(service->entries().empty());\n  auto remaining = utils::RunFunctionAndReturnSingleResult(\n      CreateFunction<SessionsGetRecentlyClosedFunction>(true).get(), \"[]\",\n      GetProfile());\n  ASSERT_TRUE(remaining);\n  ASSERT_EQ(1u, remaining->GetList().size());\n  const auto* window = remaining->GetList()[0].GetDict().FindDict(\"window\");\n  ASSERT_TRUE(window);\n  EXPECT_EQ(window_session_id_, utils::GetString(*window, \"sessionId\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMixedHistoryTest,\n                       RestoredWindowRetainsGroupSplitAndConsumesHistory) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory(/*grouped_split=*/true));\n  BrowserCreatedWaiter waiter;\n  auto result = Restore(\"[\\\\\"\" + window_session_id_ + \"\\\\\"]\");\n  ASSERT_TRUE(result);\n  ASSERT_TRUE(result->GetDict().FindDict(\"window\"));\n  auto* restored = waiter.Wait();\n  ASSERT_TRUE(restored);\n  auto* tabs = TabListInterface::From(restored);\n  ASSERT_TRUE(tabs);\n  ASSERT_EQ(2, tabs->GetTabCount());\n  EXPECT_EQ(group_id_, tabs->GetTab(0)->GetGroup());\n  EXPECT_EQ(group_id_, tabs->GetTab(1)->GetGroup());\n  EXPECT_EQ(split_id_, tabs->GetTab(0)->GetSplit());\n  EXPECT_EQ(split_id_, tabs->GetTab(1)->GetSplit());\n  auto visual_data = tabs->GetTabGroupVisualData(*group_id_);\n  ASSERT_TRUE(visual_data);\n  EXPECT_EQ(u\"Restored group\", visual_data->title());\n  EXPECT_EQ(tab_groups::TabGroupColorId::kBlue, visual_data->color());\n  auto* contents = tabs->GetTab(0)->GetContents();\n  ASSERT_TRUE(content::WaitForLoadStop(contents));\n  EXPECT_EQ(window_navigation_count_, contents->GetController().GetEntryCount());\n  auto remaining = utils::RunFunctionAndReturnSingleResult(\n      CreateFunction<SessionsGetRecentlyClosedFunction>(true).get(), \"[]\",\n      GetProfile());\n  ASSERT_TRUE(remaining);\n  ASSERT_EQ(1u, remaining->GetList().size());\n  EXPECT_TRUE(remaining->GetList()[0].GetDict().FindDict(\"tab\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMixedHistoryTest,\n                       SavedChildTabRetainsHistoryAndLeavesItsPeerClosed) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory(false, /*extra_tab=*/true));\n  ASSERT_EQ(2u, child_session_ids_.size());\n  EXPECT_NE(child_session_ids_[0], child_session_ids_[1]);\n  auto result = Restore(\"[\\\\\"\" + child_session_ids_[0] + \"\\\\\"]\");\n  ASSERT_TRUE(result);\n  const auto* tab = result->GetDict().FindDict(\"tab\");\n  ASSERT_TRUE(tab);\n  EXPECT_EQ(\"chrome://credits/\", utils::GetString(*tab, \"url\"));\n  ASSERT_EQ(2, GetTabCount());\n  auto* contents = GetActiveWebContents();\n  ASSERT_TRUE(contents);\n  ASSERT_TRUE(content::WaitForLoadStop(contents));\n  EXPECT_EQ(window_navigation_count_, contents->GetController().GetEntryCount());\n  auto remaining = utils::RunFunctionAndReturnSingleResult(\n      CreateFunction<SessionsGetRecentlyClosedFunction>(true).get(), \"[]\", GetProfile());\n  ASSERT_TRUE(remaining);\n  ASSERT_EQ(2u, remaining->GetList().size());\n  const base::DictValue* closed_window = nullptr;\n  for (const auto& entry : remaining->GetList()) {\n    if (const auto* window = entry.GetDict().FindDict(\"window\")) closed_window = window;\n  }\n  ASSERT_TRUE(closed_window);\n  const auto* children = closed_window->FindList(\"tabs\");\n  ASSERT_TRUE(children);\n  ASSERT_EQ(1u, children->size());\n  EXPECT_EQ(child_session_ids_[1], utils::GetString((*children)[0].GetDict(), \"sessionId\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMixedHistoryTest,\n                       StaleClosureIdentityDoesNotConsumeCurrentHistory) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory());\n  const std::string stale_id = \"android-window:\" + base::NumberToString(window_instance_id_) +\n      \":\" + base::NumberToString(window_closure_time_ + 1);\n  std::string error = utils::RunFunctionAndReturnError(\n      CreateFunction<SessionsRestoreFunction>(true).get(),\n      \"[\\\\\"\" + stale_id + \"\\\\\"]\", GetProfile());\n  EXPECT_FALSE(error.empty());\n  auto remaining = utils::RunFunctionAndReturnSingleResult(\n      CreateFunction<SessionsGetRecentlyClosedFunction>(true).get(), \"[]\", GetProfile());\n  ASSERT_TRUE(remaining);\n  ASSERT_EQ(2u, remaining->GetList().size());\n}\n\nclass ExtensionSessionsLazyHistoryTest : public ExtensionSessionsMixedHistoryTest {\n public:\n  ExtensionSessionsLazyHistoryTest() {\n    feature_list_.Reset();\n    feature_list_.InitWithFeatures({}, {chrome::android::kLoadAllTabsAtStartup});\n  }\n};\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsLazyHistoryTest,\n                       RestoredWindowResultIncludesLazyTabs) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory(false, /*extra_tab=*/true));\n  BrowserCreatedWaiter waiter;\n  auto result = Restore(\"[\\\\\"\" + window_session_id_ + \"\\\\\"]\");\n  ASSERT_TRUE(result);\n  const auto* window = result->GetDict().FindDict(\"window\");\n  ASSERT_TRUE(window);\n  const auto* tabs = window->FindList(\"tabs\");\n  ASSERT_TRUE(tabs);\n  EXPECT_EQ(2u, tabs->size());\n  auto* restored = waiter.Wait();\n  ASSERT_TRUE(restored);\n  EXPECT_EQ(2, TabListInterface::From(restored)->GetTabCount());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsLazyHistoryTest,\n                       SessionsOnlyPermissionDoesNotExposeLazyTabMetadata) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory(false, /*extra_tab=*/true));\n  extension_ = ExtensionBuilder(\"Sessions only\")\n                   .AddAPIPermissions({\"sessions\"})\n                   .SetLocation(mojom::ManifestLocation::kInternal)\n                   .Build();\n  BrowserCreatedWaiter waiter;\n  auto result = Restore(\"[\\\\\"\" + window_session_id_ + \"\\\\\"]\");\n  ASSERT_TRUE(result);\n  const auto* window = result->GetDict().FindDict(\"window\");\n  ASSERT_TRUE(window);\n  const auto* tabs = window->FindList(\"tabs\");\n  ASSERT_TRUE(tabs);\n  ASSERT_EQ(2u, tabs->size());\n  for (const auto& entry : *tabs) {\n    const auto& tab = entry.GetDict();\n    EXPECT_FALSE(tab.contains(\"url\"));\n    EXPECT_FALSE(tab.contains(\"title\"));\n    EXPECT_FALSE(tab.contains(\"favIconUrl\"));\n    EXPECT_FALSE(tab.contains(\"pendingUrl\"));\n    EXPECT_FALSE(tab.contains(\"sessionId\"));\n  }\n  ASSERT_TRUE(waiter.Wait());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMixedHistoryTest,\n                       MalformedWindowIdsDoNotConsumeHistory) {\n  ASSERT_NO_FATAL_FAILURE(CreateMixedHistory());\n  auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n  const SessionID native_id = service->entries().front()->id;\n  for (const char* id : {\"android-window:\", \"android-window:-1\",\n                         \"android-window:2147483648:1\", \"android-window:nope:1\",\n                         \"android-window:1:-1\", \"android-window:1:0\", \"android-tab:1:0:2\", \"android-window:1:9223372036854775808\",\n                         \"android-tab:1:1:-1\", \"android-tab:1:1:2:3\"}) {\n    std::string error = utils::RunFunctionAndReturnError(\n        CreateFunction<SessionsRestoreFunction>(true).get(),\n        \"[\\\\\"\" + std::string(id) + \"\\\\\"]\", GetProfile());\n    EXPECT_FALSE(error.empty());\n    ASSERT_EQ(1u, service->entries().size());\n    EXPECT_EQ(native_id, service->entries().front()->id);\n  }\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsTest, RestoreForeignSessionWindow) {"
- description: Exercise multiple real closed Android windows with bounded precise native history merging
  regex:
    re_pattern: '\#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      \

      IN_PROC_BROWSER_TEST_F\(ExtensionSessionsTest,\ RestoreForeignSessionWindow\)\ \{'
    replace: "// Keep both closed instances distinct: create both live windows before closing\n// either, so allocation cannot reuse a formerly closed instance slot.\nclass ExtensionSessionsMultipleWindowsTest : public ExtensionSessionsTest {\n protected:\n  void CreateHistories() {\n    NavigateToURLInNewTab(GURL(\"chrome://version/\"));\n    CloseTabForWebContents(GetWebContentsAt(1));\n    auto* first = CreateBrowserWindowWithType(BrowserWindowInterface::TYPE_NORMAL);\n    auto* second = CreateBrowserWindowWithType(BrowserWindowInterface::TYPE_NORMAL);\n    ASSERT_TRUE(first);\n    ASSERT_TRUE(second);\n    ASSERT_NE(first, second);\n    ASSERT_TRUE(NavigateToURL(TabListInterface::From(first)->GetTab(0)->GetContents(),\n                              GURL(\"chrome://version/\")));\n    ASSERT_TRUE(NavigateToURL(TabListInterface::From(second)->GetTab(0)->GetContents(),\n                              GURL(\"chrome://credits/\")));\n    CloseWindowAndWait(first);\n    CloseWindowAndWait(second);\n  }\n\n  std::optional<base::Value> List(const std::string& arguments = \"[]\") {\n    return utils::RunFunctionAndReturnSingleResult(\n        CreateFunction<SessionsGetRecentlyClosedFunction>(true).get(), arguments,\n        GetProfile());\n  }\n};\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMultipleWindowsTest,\n                       ListsBothWindowsAndNativeTabWithDistinctChildren) {\n  ASSERT_NO_FATAL_FAILURE(CreateHistories());\n  auto result = List();\n  ASSERT_TRUE(result);\n  ASSERT_EQ(3u, result->GetList().size());\n  std::vector<std::string> window_ids;\n  std::vector<std::string> child_ids;\n  size_t native_count = 0;\n  for (const auto& session : result->GetList()) {\n    const auto* window = session.GetDict().FindDict(\"window\");\n    if (!window) {\n      ASSERT_TRUE(session.GetDict().FindDict(\"tab\"));\n      ++native_count;\n      continue;\n    }\n    window_ids.push_back(utils::GetString(*window, \"sessionId\"));\n    const auto* tabs = window->FindList(\"tabs\");\n    ASSERT_TRUE(tabs);\n    ASSERT_EQ(1u, tabs->size());\n    child_ids.push_back(utils::GetString((*tabs)[0].GetDict(), \"sessionId\"));\n  }\n  EXPECT_EQ(1u, native_count);\n  ASSERT_EQ(2u, window_ids.size());\n  EXPECT_NE(window_ids[0], window_ids[1]);\n  EXPECT_NE(child_ids[0], child_ids[1]);\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMultipleWindowsTest,\n                       MaxResultsBoundsTheMergedHistoryAndAllowsZero) {\n  ASSERT_NO_FATAL_FAILURE(CreateHistories());\n  auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n  ASSERT_EQ(1u, service->entries().size());\n  service->entries().front()->timestamp = base::Time::Now() + base::Days(1);\n  auto empty = List(\"[{\\\\\"maxResults\\\\\":0}]\");\n  ASSERT_TRUE(empty);\n  EXPECT_TRUE(empty->GetList().empty());\n  auto one = List(\"[{\\\\\"maxResults\\\\\":1}]\");\n  ASSERT_TRUE(one);\n  ASSERT_EQ(1u, one->GetList().size());\n  EXPECT_TRUE(one->GetList()[0].GetDict().FindDict(\"tab\"));\n  auto two = List(\"[{\\\\\"maxResults\\\\\":2}]\");\n  ASSERT_TRUE(two);\n  ASSERT_EQ(2u, two->GetList().size());\n  EXPECT_TRUE(two->GetList()[0].GetDict().FindDict(\"tab\"));\n  EXPECT_TRUE(two->GetList()[1].GetDict().FindDict(\"window\"));\n  auto all = List();\n  ASSERT_TRUE(all);\n  EXPECT_EQ(3u, all->GetList().size());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsMultipleWindowsTest,\n                       NativeWindowMergeUsesMillisecondsWithinTheSameSecond) {\n  ASSERT_NO_FATAL_FAILURE(CreateHistories());\n  auto all = List();\n  ASSERT_TRUE(all);\n  int64_t latest_window = 0;\n  std::string latest_id;\n  for (const auto& session : all->GetList()) {\n    if (const auto* window = session.GetDict().FindDict(\"window\")) {\n      const auto id = utils::GetString(*window, \"sessionId\");\n      int64_t timestamp;\n      ASSERT_TRUE(base::StringToInt64(id.substr(id.rfind(':') + 1), &timestamp));\n      if (timestamp > latest_window) {\n        latest_window = timestamp;\n        latest_id = id;\n      }\n    }\n  }\n  ASSERT_GT(latest_window, 0);\n  auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n  ASSERT_EQ(1u, service->entries().size());\n  // When the real close happened exactly on a whole second, use the next\n  // millisecond and require native first; otherwise require window first.\n  const bool native_newer = latest_window % 1000 == 0;\n  service->entries().front()->timestamp =\n      base::Time::FromMillisecondsSinceUnixEpoch(\n          latest_window + (native_newer ? 1 : -1));\n  auto result = List(\"[{\\\\\"maxResults\\\\\":1}]\");\n  ASSERT_TRUE(result);\n  ASSERT_EQ(1u, result->GetList().size());\n  if (native_newer) {\n    EXPECT_TRUE(result->GetList()[0].GetDict().FindDict(\"tab\"));\n  } else {\n    const auto* window = result->GetList()[0].GetDict().FindDict(\"window\");\n    ASSERT_TRUE(window);\n    EXPECT_EQ(latest_id, utils::GetString(*window, \"sessionId\"));\n  }\n}\n\n#endif  // BUILDFLAG(IS_ANDROID)\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsTest, RestoreForeignSessionWindow) {"
- description: Compare both real closed split child identities without relying on ordering
  regex:
    re_pattern: \#include\ <memory>
    replace: '#include <memory>

      #include <set>'
- description: Exercise real Android native group and split history through extension Sessions
  regex:
    re_pattern: IN_PROC_BROWSER_TEST_F\(ExtensionSessionsTest,\ RestoreForeignSessionWindow\)\ \{
    replace: "#if BUILDFLAG(IS_ANDROID)\nclass ExtensionSessionsNativeCollectionsTest : public ExtensionSessionsTest {\n protected:\n  TabModel* model() {\n    return static_cast<TabModel*>(TabListInterface::From(browser_window_interface()));\n  }\n\n  void CloseGroupedTab() {\n    NavigateToURLInNewTab(GURL(\"chrome://version/\"));\n    auto* contents = GetWebContentsAt(1);\n    ASSERT_TRUE(NavigateToURL(contents, GURL(\"chrome://credits/\")));\n    navigation_count_ = contents->GetController().GetEntryCount();\n    NavigateToURLInNewTab(GURL(\"chrome://version/\"));\n    auto group = model()->CreateTabGroup(\n        {model()->GetTab(1)->GetHandle(), model()->GetTab(2)->GetHandle()});\n    ASSERT_TRUE(group);\n    model()->SetTabGroupVisualData(*group,\n        tab_groups::TabGroupVisualData(u\"Native saved group\",\n                                       tab_groups::TabGroupColorId::kBlue));\n    CloseTabForWebContents(contents);\n    auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n    ASSERT_EQ(1u, service->entries().size());\n    ASSERT_EQ(sessions::tab_restore::Type::TAB, service->entries().front()->type);\n    const auto& saved = static_cast<const sessions::tab_restore::Tab&>(\n        *service->entries().front());\n    ASSERT_TRUE(saved.group);\n    closed_id_ = saved.id;\n  }\n\n  void CloseSplit() {\n    NavigateToURLInNewTab(GURL(\"chrome://version/\"));\n    NavigateToURLInNewTab(GURL(\"chrome://credits/\"));\n    auto* first = model()->GetTab(1)->GetContents();\n    auto* second = model()->GetTab(2)->GetContents();\n    model()->ActivateTab(model()->GetTab(1)->GetHandle());\n    auto split = model()->CreateSplit(\n        {model()->GetTab(1)->GetHandle(), model()->GetTab(2)->GetHandle()});\n    ASSERT_TRUE(split);\n    auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n    // Use the real service's closing-split transaction. The subsequent real tab\n    // closes are suppressed by its cached session IDs, exactly as bulk closure.\n    service->CreateHistoricalSplit(model()->GetLiveTabContext(), *split);\n    ASSERT_EQ(1u, service->entries().size());\n    ASSERT_EQ(sessions::tab_restore::Type::SPLIT, service->entries().front()->type);\n    const auto& saved = static_cast<const sessions::tab_restore::Split&>(\n        *service->entries().front());\n    ASSERT_EQ(2u, saved.tabs.size());\n    closed_id_ = saved.id;\n    first_child_id_ = saved.tabs[0]->id;\n    second_child_id_ = saved.tabs[1]->id;\n    CloseTabForWebContents(first);\n    CloseTabForWebContents(second);\n    service->SplitClosed(*split);\n    ASSERT_EQ(1, model()->GetTabCount());\n    ASSERT_EQ(1u, service->entries().size());\n  }\n\n  std::optional<base::Value> Restore(const std::string& arguments) {\n    return utils::RunFunctionAndReturnSingleResult(\n        CreateFunction<SessionsRestoreFunction>(true).get(), arguments, GetProfile());\n  }\n\n  void ExpectRestoredGroup(const base::Value& result) {\n    ASSERT_TRUE(result.GetDict().FindDict(\"tab\"));\n    auto* active = model()->GetActiveTab();\n    ASSERT_TRUE(active);\n    ASSERT_TRUE(active->GetGroup());\n    auto visual = model()->GetTabGroupVisualData(*active->GetGroup());\n    ASSERT_TRUE(visual);\n    EXPECT_EQ(u\"Native saved group\", visual->title());\n    EXPECT_EQ(tab_groups::TabGroupColorId::kBlue, visual->color());\n    auto* contents = active->GetContents();\n    ASSERT_TRUE(contents);\n    ASSERT_TRUE(content::WaitForLoadStop(contents));\n    EXPECT_EQ(GURL(\"chrome://credits/\"), contents->GetURL());\n    EXPECT_EQ(navigation_count_, contents->GetController().GetEntryCount());\n  }\n\n  SessionID closed_id_ = SessionID::InvalidValue();\n  SessionID first_child_id_ = SessionID::InvalidValue();\n  SessionID second_child_id_ = SessionID::InvalidValue();\n  int navigation_count_ = 0;\n};\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsNativeCollectionsTest,\n                       ExplicitGroupedTabRetainsVisualsAndForegroundHistory) {\n  ASSERT_NO_FATAL_FAILURE(CloseGroupedTab());\n  auto result = Restore(\"[\\\\\"\" + base::NumberToString(closed_id_.id()) + \"\\\\\"]\");\n  ASSERT_TRUE(result);\n  ExpectRestoredGroup(*result);\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsNativeCollectionsTest,\n                       MostRecentGroupedTabRetainsVisualsAndForegroundHistory) {\n  ASSERT_NO_FATAL_FAILURE(CloseGroupedTab());\n  auto result = Restore(\"[]\");\n  ASSERT_TRUE(result);\n  ExpectRestoredGroup(*result);\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsNativeCollectionsTest,\n                       MostRecentNativeSplitReconstructsBothRealTabs) {\n  ASSERT_NO_FATAL_FAILURE(CloseSplit());\n  auto result = Restore(\"[]\");\n  ASSERT_TRUE(result);\n  ASSERT_TRUE(result->GetDict().FindDict(\"tab\"));\n  ASSERT_EQ(3, model()->GetTabCount());\n  ASSERT_EQ(1u, model()->ListSplits().size());\n  auto* active = model()->GetActiveTab();\n  ASSERT_TRUE(active);\n  ASSERT_TRUE(active->GetSplit());\n  EXPECT_EQ(model()->GetTab(1)->GetSplit(), model()->GetTab(2)->GetSplit());\n  EXPECT_EQ(GURL(\"chrome://version/\"), active->GetContents()->GetVisibleURL());\n  EXPECT_TRUE(TabRestoreServiceFactory::GetForProfile(GetProfile())->entries().empty());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsNativeCollectionsTest,\n                       ListedSplitChildRestoresOnlyRequestedTab) {\n  ASSERT_NO_FATAL_FAILURE(CloseSplit());\n  auto listed = utils::RunFunctionAndReturnSingleResult(\n      CreateFunction<SessionsGetRecentlyClosedFunction>(true).get(), \"[]\", GetProfile());\n  ASSERT_TRUE(listed);\n  ASSERT_EQ(2u, listed->GetList().size());\n  std::set<std::string> ids;\n  for (const auto& item : listed->GetList()) {\n    const auto* tab = item.GetDict().FindDict(\"tab\");\n    ASSERT_TRUE(tab);\n    ids.insert(utils::GetString(*tab, \"sessionId\"));\n  }\n  EXPECT_TRUE(ids.contains(base::NumberToString(first_child_id_.id())));\n  EXPECT_TRUE(ids.contains(base::NumberToString(second_child_id_.id())));\n  auto result = Restore(\"[\\\\\"\" + base::NumberToString(first_child_id_.id()) + \"\\\\\"]\");\n  ASSERT_TRUE(result);\n  ASSERT_EQ(2, model()->GetTabCount());\n  EXPECT_TRUE(model()->ListSplits().empty());\n  EXPECT_FALSE(model()->GetActiveTab()->GetSplit());\n  EXPECT_EQ(GURL(\"chrome://version/\"),\n            model()->GetActiveTab()->GetContents()->GetVisibleURL());\n  auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n  ASSERT_EQ(1u, service->entries().size());\n  EXPECT_EQ(second_child_id_, service->entries().front()->id);\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nIN_PROC_BROWSER_TEST_F(ExtensionSessionsTest, RestoreForeignSessionWindow) {"
