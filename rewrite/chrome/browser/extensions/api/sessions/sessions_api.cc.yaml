- description: Restore native Android history with real group/split reconstruction and foreground activation
  regex:
    re_pattern: constexpr\ char\ kAndroidWindowSessionPrefix\[\]\ =\ "android\-window:";
    replace: "bool AndroidNativeHistoryContainsId(const sessions::tab_restore::Entry& entry,\n                                    SessionID id) {\n  if (entry.id == id || entry.original_id == id) {\n    return true;\n  }\n  const auto any_child = [id](const auto& children) {\n    return std::ranges::any_of(children, [id](const auto& child) {\n      return AndroidNativeHistoryContainsId(*child, id);\n    });\n  };\n  const auto any_mapped = [id](const auto& children) {\n    return std::ranges::any_of(children, [id](const auto& child) {\n      return AndroidNativeHistoryContainsId(*child.second, id);\n    });\n  };\n  switch (entry.type) {\n    case sessions::tab_restore::Type::TAB:\n      return false;\n    case sessions::tab_restore::Type::WINDOW: {\n      const auto& window = static_cast<const sessions::tab_restore::Window&>(entry);\n      return any_child(window.tabs) || any_mapped(window.tab_groups) ||\n             any_mapped(window.split_tabs);\n    }\n    case sessions::tab_restore::Type::GROUP: {\n      const auto& group = static_cast<const sessions::tab_restore::Group&>(entry);\n      return any_child(group.tabs) || any_mapped(group.split_tabs);\n    }\n    case sessions::tab_restore::Type::SPLIT:\n      return any_child(static_cast<const sessions::tab_restore::Split&>(entry).tabs);\n  }\n  return false;\n}\n\nstruct AndroidNativeRestoreResult {\n  bool found = false;\n  base::WeakPtr<content::WebContents> contents;\n};\n\nAndroidNativeRestoreResult RestoreAndroidNativeSession(\n    sessions::TabRestoreService* service,\n    TabModel* model,\n    SessionID entry_id) {\n  AndroidNativeRestoreResult result;\n  // A known native ID must never fall back into the Android instance namespace\n  // merely because reconstruction fails or a synchronous observer closes it.\n  result.found = std::ranges::any_of(service->entries(), [entry_id](const auto& entry) {\n    return AndroidNativeHistoryContainsId(*entry, entry_id);\n  });\n  if (!result.found) {\n    return result;\n  }\n  AndroidLiveTabContextRestoreWrapper restore_context(model);\n  // UNKNOWN replaces the wrapper with the base Android context and loses its\n  // group metadata. Use the same entry point as Recent Tabs, then activate the\n  // first restored tab to preserve sessions.restore's foreground behavior.\n  auto restored = service->RestoreEntryById(\n      &restore_context, entry_id, WindowOpenDisposition::NEW_BACKGROUND_TAB);\n  if (restored.empty() || !restored.front()) {\n    return result;\n  }\n  auto first = static_cast<sessions::ContentLiveTab*>(restored.front())\n                   ->GetWebContents().GetWeakPtr();\n  if (!restore_context.RestoreTabGroups(model)) {\n    return result;\n  }\n  restore_context.RestoreSplits();\n  if (!first || TabModelList::GetTabModelForWebContents(first.get()) != model) {\n    return result;\n  }\n  TabAndroid* tab = TabAndroid::FromWebContents(first.get());\n  if (!tab) {\n    return result;\n  }\n  model->ActivateTab(tab->GetHandle());\n  if (first && TabModelList::GetTabModelForWebContents(first.get()) == model) {\n    result.contents = first;\n  }\n  return result;\n}\n\nconstexpr char kAndroidWindowSessionPrefix[] = \"android-window:\";"
- description: Use the Android wrapper for most-recent native tab/group/split entries
  regex:
    re_pattern: 'SessionsRestoreFunction::RestoreMostRecentNativeEntry\(\)\ \{\

      \ \ Profile\*\ profile\ =\ Profile::FromBrowserContext\(browser_context\(\)\);\

      \ \ BrowserWindowInterface\*\ browser\ =\ FindBrowserWindowInterfaceWithProfile\(profile\);\

      \ \ if\ \(!browser\)\ \{\

      \ \ \ \ return\ Error\(kNoBrowserToRestoreSession\);\

      \ \ \}\

      \ \ auto\*\ service\ =\ TabRestoreServiceFactory::GetForProfile\(profile\);\

      \ \ if\ \(!service\ \|\|\ service\->entries\(\)\.empty\(\)\)\ \{\

      \ \ \ \ return\ Error\(kNoRecentlyClosedSessionsError\);\

      \ \ \}\

      \ \ sessions::LiveTabContext\*\ context\ =\ GetLiveTabContextForBrowser\(browser\);\

      \ \ if\ \(!context\)\ \{\

      \ \ \ \ return\ Error\(kNoLiveTabContextError\);\

      \ \ \}\

      \ \ const\ bool\ is_window\ =\ is_window_entry\(\*service\->entries\(\)\.front\(\)\);\

      \ \ std::vector<sessions::LiveTab\*>\ restored_tabs\ =\

      \ \ \ \ \ \ service\->RestoreMostRecentEntry\(context\);\

      \ \ if\ \(restored_tabs\.empty\(\)\ \|\|\ !restored_tabs\.front\(\)\)\ \{\

      \ \ \ \ return\ Error\(kNoRecentlyClosedSessionsError\);\

      \ \ \}\

      \ \ auto\*\ first_tab\ =\ static_cast<sessions::ContentLiveTab\*>\(restored_tabs\.front\(\)\);\

      \ \ if\ \(is_window\)\ \{\

      \ \ \ \ return\ GetRestoredWindowResult\(\

      \ \ \ \ \ \ \ \ ExtensionTabUtil::GetWindowIdOfTab\(\&first_tab\->GetWebContents\(\)\)\);\

      \ \ \}\

      \ \ return\ GetRestoredTabResult\(\&first_tab\->GetWebContents\(\)\);\

      \}\

      '
    replace: "SessionsRestoreFunction::RestoreMostRecentNativeEntry() {\n  Profile* profile = Profile::FromBrowserContext(browser_context());\n  BrowserWindowInterface* browser = FindBrowserWindowInterfaceWithProfile(profile);\n  if (!browser) {\n    return Error(kNoBrowserToRestoreSession);\n  }\n  auto* service = TabRestoreServiceFactory::GetForProfile(profile);\n  if (!service || service->entries().empty()) {\n    return Error(kNoRecentlyClosedSessionsError);\n  }\n  auto* target = static_cast<TabModel*>(TabListInterface::From(browser));\n  if (!target) {\n    return Error(kNoLiveTabContextError);\n  }\n  const bool is_window = is_window_entry(*service->entries().front());\n  auto restored = RestoreAndroidNativeSession(\n      service, target, service->entries().front()->id);\n  if (!restored.contents || !browser_context()) {\n    return Error(kNoRecentlyClosedSessionsError);\n  }\n  if (is_window) {\n    return GetRestoredWindowResult(\n        ExtensionTabUtil::GetWindowIdOfTab(restored.contents.get()));\n  }\n  return GetRestoredTabResult(restored.contents.get());\n}\n"
- description: Avoid a second response if native reconstruction synchronously shuts down the profile
