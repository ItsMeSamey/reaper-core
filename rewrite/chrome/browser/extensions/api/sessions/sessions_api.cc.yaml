# Android mixed native-tab and Java-window session restoration.
substitutions:
- description: Reject a failed Android restore-window creation before dereferencing it.
  regex:
    pattern: "void SessionsRestoreFunction::OnBrowserWindowCreated(\n    BrowserWindowInterface* browser) {\n  TabListInterface* new_tab_list = TabListInterface::From(browser);"
    replace: "void SessionsRestoreFunction::OnBrowserWindowCreated(\n    BrowserWindowInterface* browser) {\n  if (!browser) {\n    Respond(Error(ExtensionTabUtil::kBrowserWindowNotAllowed));\n    return;\n  }\n  TabListInterface* new_tab_list = TabListInterface::From(browser);"
- description: Give Android windows a distinct opaque local-session ID namespace
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      //\ Updates\ tab\ properties'
    replace: '#if BUILDFLAG(IS_ANDROID)

      // Activity instance IDs and native SessionIDs have independent integer spaces.

      // Keep local Android windows distinguishable without changing foreign IDs.

      constexpr char kAndroidWindowSessionPrefix[] = "android-window:";

      constexpr char kAndroidTabSessionPrefix[] = "android-tab:";


      // Updates tab properties'
- description: Separate Java window identities from native closed-tab identities
  regex:
    re_pattern: \ \ std::string\ session_id\ =\ base::NumberToString\(instance_id\);
    replace: "  std::string session_id =\n      kAndroidWindowSessionPrefix + base::NumberToString(instance_id) + \":\" +\n      base::NumberToString(timestamp);"
- description: Document the Android window session identity contract
  regex:
    re_pattern: '\ \ //\ instance\ ids\ instead\ of\ session\ ids\ because\ that''s\ what\ the\

      \ \ //\ RecentlyClosedEntriesManager\ tracks\.\ They\ are\ stable\ across\ the\ browsing\

      \ \ //\ session\ and\ work\ fine\ as\ a\ session\ ID\ replacement\.'
    replace: "  // instance IDs because that is what RecentlyClosedEntriesManager tracks.\n  // Prefix them to avoid collisions with native tab/session IDs."
- description: Keep asynchronous closed-window listing scoped to the requesting regular profile
  regex:
    re_pattern: '\ \ if\ \(!model\)\ \{\

      \ \ \ \ Respond\(ArgumentList\(GetRecentlyClosed::Results::Create\(result_\)\)\);'
    replace: "  if (!browser_context() || !model || model->GetProfile() !=\n                    Profile::FromBrowserContext(browser_context()) ||\n      model->GetProfile()->IsOffTheRecord()) {\n    Respond(ArgumentList(GetRecentlyClosed::Results::Create(result_)));"
- description: Compare Android tab and window histories before restoring the newest entry
  regex:
    re_pattern: 'ExtensionFunction::ResponseAction\

      SessionsRestoreFunction::RestoreMostRecentlyClosed\(\

      \ \ \ \ BrowserWindowInterface\*\ browser\)\ \{\

      \ \ sessions::TabRestoreService\*\ tab_restore_service\ =\

      \ \ \ \ \ \ TabRestoreServiceFactory::GetForProfile\(\

      \ \ \ \ \ \ \ \ \ \ Profile::FromBrowserContext\(browser_context\(\)\)\);\

      \ \ const\ sessions::TabRestoreService::Entries\&\ entries\ =\

      \ \ \ \ \ \ tab_restore_service\->entries\(\);\

      \

      \ \ if\ \(entries\.empty\(\)\)\ \{\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ //\ Android\ only\ stores\ tab\ restore\ information\ in\ TabRestoreService,\ so\ we\

      \ \ \ \ //\ must\ also\ query\ the\ Java\ side\ to\ check\ for\ window\ restore\ information\.\

      \ \ \ \ //\ Use\ instance\ id\ of\ kInvalidWindowId\ so\ we\ don''t\ filter\ and\ just\ get\ the\

      \ \ \ \ //\ most\ recent\.\

      \ \ \ \ return\ QueryRecentlyClosedEntitiesManager\(/\*instance_id=\*/kInvalidWindowId\);\

      \#else\

      \ \ \ \ //\ Other\ platforms\ store\ everything\ in\ TabRestoreService,\ so\ if\ there\ are\ no\

      \ \ \ \ //\ entries\ there\ is\ nothing\ to\ restore\.\

      \ \ \ \ return\ RespondNow\(Error\(kNoRecentlyClosedSessionsError\)\);\

      \#endif\

      \ \ \}\

      \

      \ \ bool\ is_window\ =\ is_window_entry\(\*entries\.front\(\)\);\

      \ \ sessions::LiveTabContext\*\ context\ =\ GetLiveTabContextForBrowser\(browser\);\

      \ \ if\ \(!context\)\ \{\

      \ \ \ \ return\ RespondNow\(Error\(kNoLiveTabContextError\)\);\

      \ \ \}\

      \ \ std::vector<sessions::LiveTab\*>\ restored_tabs\ =\

      \ \ \ \ \ \ tab_restore_service\->RestoreMostRecentEntry\(context\);\

      \ \ DCHECK\(restored_tabs\.size\(\)\);\

      \

      \ \ sessions::ContentLiveTab\*\ first_tab\ =\

      \ \ \ \ \ \ static_cast<sessions::ContentLiveTab\*>\(restored_tabs\[0\]\);\

      \ \ if\ \(is_window\)\ \{\

      \ \ \ \ return\ RespondNow\(GetRestoredWindowResult\(\

      \ \ \ \ \ \ \ \ ExtensionTabUtil::GetWindowIdOfTab\(\&first_tab\->GetWebContents\(\)\)\)\);\

      \ \ \}\

      \

      \ \ return\ RespondNow\(GetRestoredTabResult\(\&first_tab\->GetWebContents\(\)\)\);\

      \}\

      '
    replace: "ExtensionFunction::ResponseAction\nSessionsRestoreFunction::RestoreMostRecentlyClosed(\n    BrowserWindowInterface* browser) {\n#if BUILDFLAG(IS_ANDROID)\n  // Both histories must be consulted even when native entries exist.\n  return QueryRecentlyClosedEntitiesManager(\n      kInvalidWindowId, /*restore_most_recent=*/true);\n#else\n  sessions::TabRestoreService* tab_restore_service =\n      TabRestoreServiceFactory::GetForProfile(\n          Profile::FromBrowserContext(browser_context()));\n  const sessions::TabRestoreService::Entries& entries =\n      tab_restore_service->entries();\n\n  if (entries.empty()) {\n    // Other platforms store everything in TabRestoreService, so if there are no\n    // entries there is nothing to restore.\n    return RespondNow(Error(kNoRecentlyClosedSessionsError));\n  }\n\n  bool is_window = is_window_entry(*entries.front());\n  sessions::LiveTabContext* context = GetLiveTabContextForBrowser(browser);\n  if (!context) {\n    return RespondNow(Error(kNoLiveTabContextError));\n  }\n  std::vector<sessions::LiveTab*> restored_tabs =\n      tab_restore_service->RestoreMostRecentEntry(context);\n  DCHECK(restored_tabs.size());\n\n  sessions::ContentLiveTab* first_tab =\n      static_cast<sessions::ContentLiveTab*>(restored_tabs[0]);\n  if (is_window) {\n    return RespondNow(GetRestoredWindowResult(\n        ExtensionTabUtil::GetWindowIdOfTab(&first_tab->GetWebContents())));\n  }\n\n  return RespondNow(GetRestoredTabResult(&first_tab->GetWebContents()));\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n"
- description: Carry an explicit newest-entry query mode through the asynchronous window lookup
  regex:
    re_pattern: SessionsRestoreFunction::QueryRecentlyClosedEntitiesManager\(int\ instance_id\)\ \{
    replace: "SessionsRestoreFunction::QueryRecentlyClosedEntitiesManager(\n    int instance_id, bool restore_most_recent,\n    std::optional<int64_t> expected_timestamp,\n    std::optional<int> child_tab_id) {"
- description: Retain the extension function and comparison mode until Java window metadata arrives
  regex:
    re_pattern: base::BindOnce\(\&SessionsRestoreFunction::OnGetRecentlyClosedWindow,\ this\);
    replace: "base::BindOnce(&SessionsRestoreFunction::OnGetRecentlyClosedWindow, this,\n                     restore_most_recent, expected_timestamp, child_tab_id);"
- description: Revalidate profile and compare native timestamps only after the asynchronous window lookup
  regex:
    re_pattern: 'void\ SessionsRestoreFunction::OnGetRecentlyClosedWindow\(\

      \ \ \ \ const\ base::android::JavaRef<jobject>\&\ j_tab_model_and_timestamp\)\ \{\

      \ \ if\ \(j_tab_model_and_timestamp\.is_null\(\)\)\ \{\

      \ \ \ \ //\ Error\ on\ the\ Java\ side,\ so\ no\ valid\ window\ to\ restore\.\

      \ \ \ \ Respond\(Error\(kNoRecentlyClosedSessionsError\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ //\ Unpack\ the\ Java\ object\.\

      \ \ base::android::ScopedJavaLocalRef<jobject>\ j_tab_model;\

      \ \ int64_t\ timestamp\ =\ 0;\

      \ \ int\ instance_id\ =\ kInvalidWindowId;\

      \ \ UnpackRecentlyClosedWindowMetadata\(j_tab_model_and_timestamp,\ \&j_tab_model,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&timestamp,\ \&instance_id\);\

      \

      \ \ if\ \(j_tab_model\.is_null\(\)\)\ \{\

      \ \ \ \ //\ No\ tab\ model,\ so\ no\ window\ to\ restore\.\

      \ \ \ \ Respond\(Error\(kNoRecentlyClosedSessionsError\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ //\ Look\ up\ the\ C\+\+\ side\ TabModel\.\

      \ \ TabModel\*\ saved_tab_model\ =\ jni_zero::FromJniType<TabModel\*>\(\

      \ \ \ \ \ \ base::android::AttachCurrentThread\(\),\ j_tab_model\);\

      \ \ if\ \(!saved_tab_model\)\ \{\

      \ \ \ \ //\ No\ tab\ model,\ so\ no\ window\ to\ restore\.\

      \ \ \ \ Respond\(Error\(kNoRecentlyClosedSessionsError\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ //\ Ensure\ there\ are\ tabs\ in\ the\ window\ to\ restore\.\

      \ \ if\ \(saved_tab_model\->GetTabCount\(\)\ ==\ 0\)\ \{\

      \ \ \ \ Respond\(Error\(kNoRecentlyClosedSessionsError\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \

      '
    replace: "ExtensionFunction::ResponseValue\nSessionsRestoreFunction::RestoreMostRecentNativeEntry() {\n  Profile* profile = Profile::FromBrowserContext(browser_context());\n  BrowserWindowInterface* browser = FindBrowserWindowInterfaceWithProfile(profile);\n  if (!browser) {\n    return Error(kNoBrowserToRestoreSession);\n  }\n  auto* service = TabRestoreServiceFactory::GetForProfile(profile);\n  if (!service || service->entries().empty()) {\n    return Error(kNoRecentlyClosedSessionsError);\n  }\n  sessions::LiveTabContext* context = GetLiveTabContextForBrowser(browser);\n  if (!context) {\n    return Error(kNoLiveTabContextError);\n  }\n  const bool is_window = is_window_entry(*service->entries().front());\n  std::vector<sessions::LiveTab*> restored_tabs =\n      service->RestoreMostRecentEntry(context);\n  if (restored_tabs.empty() || !restored_tabs.front()) {\n    return Error(kNoRecentlyClosedSessionsError);\n  }\n  auto* first_tab = static_cast<sessions::ContentLiveTab*>(restored_tabs.front());\n  if (is_window) {\n    return GetRestoredWindowResult(\n        ExtensionTabUtil::GetWindowIdOfTab(&first_tab->GetWebContents()));\n  }\n  return GetRestoredTabResult(&first_tab->GetWebContents());\n}\n\nvoid SessionsRestoreFunction::OnGetRecentlyClosedWindow(\n    bool restore_most_recent,\n    std::optional<int64_t> expected_timestamp,\n    std::optional<int> child_tab_id,\n    const base::android::JavaRef<jobject>& j_tab_model_and_timestamp) {\n  if (android_shutting_down_ || did_respond() || !browser_context()) {\n    return;\n  }\n  Profile* profile = Profile::FromBrowserContext(browser_context());\n  if (!ExtensionTabUtil::IsTabStripEditable(*profile)) {\n    Respond(Error(ExtensionTabUtil::kTabStripNotEditableError));\n    return;\n  }\n  base::android::ScopedJavaLocalRef<jobject> j_tab_model;\n  int64_t timestamp = 0;\n  int instance_id = kInvalidWindowId;\n  if (!j_tab_model_and_timestamp.is_null()) {\n    UnpackRecentlyClosedWindowMetadata(j_tab_model_and_timestamp, &j_tab_model,\n                                      &timestamp, &instance_id);\n  }\n  TabModel* saved_tab_model = j_tab_model.is_null()\n      ? nullptr\n      : jni_zero::FromJniType<TabModel*>(\n            base::android::AttachCurrentThread(), j_tab_model);\n  const bool valid_window = saved_tab_model &&\n      saved_tab_model->GetProfile() == profile && !profile->IsOffTheRecord() &&\n      saved_tab_model->GetTabCount() > 0 && instance_id != kInvalidWindowId &&\n      (!expected_timestamp || timestamp == *expected_timestamp);\n\n  if (restore_most_recent) {\n    // Inspect the current native history after the asynchronous Java query.\n    // Native entries may have changed while window state was being loaded.\n    auto* service = TabRestoreServiceFactory::GetForProfile(profile);\n    if (service && !service->entries().empty() &&\n        (!valid_window || service->entries().front()->timestamp >\n                              base::Time::FromMillisecondsSinceUnixEpoch(\n                                  timestamp))) {\n      Respond(RestoreMostRecentNativeEntry());\n      return;\n    }\n  }\n  if (!valid_window) {\n    Respond(Error(kNoRecentlyClosedSessionsError));\n    return;\n  }\n\n"
- description: Revalidate the saved model and newly created browser profile after window creation
  regex:
    re_pattern: '\ \ if\ \(!saved_tab_model\)\ \{\

      \ \ \ \ Respond\(Error\(kNoRecentlyClosedSessionsError\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ //\ This\ should\ not\ happen'
    replace: "  if (!saved_tab_model ||\n      saved_tab_model->GetProfile() !=\n          Profile::FromBrowserContext(browser_context()) ||\n      browser->GetProfile() != saved_tab_model->GetProfile() ||\n      saved_tab_model->GetProfile()->IsOffTheRecord()) {\n    Respond(Error(kNoRecentlyClosedSessionsError));\n    return;\n  }\n\n  // This should not happen"
- description: Retain native-first legacy numeric IDs and fall back to Android window history on a miss
  regex:
    re_pattern: '\ \ if\ \(restored_tabs\.empty\(\)\)\ \{\

      \ \ \ \ return\ RespondNow\(Error\(kInvalidSessionIdError,\ session_id\.ToString\(\)\)\);\

      \ \ \}'
    replace: "  if (restored_tabs.empty()) {\n#if BUILDFLAG(IS_ANDROID)\n    // Older callers may retain an unprefixed Android window instance ID. Keep\n    // native-first resolution for these ambiguous legacy IDs, then try Java.\n    return QueryRecentlyClosedEntitiesManager(session_id.id());\n#else\n    return RespondNow(Error(kInvalidSessionIdError, session_id.ToString()));\n#endif\n  }"
- description: Route typed Android windows before the unchanged native and foreign SessionId parser
  regex:
    re_pattern: \ \ std::unique_ptr<SessionId>\ session_id\(SessionId::Parse\(\*params\->session_id\)\);
    replace: "#if BUILDFLAG(IS_ANDROID)\n  const bool android_window =\n      params->session_id->starts_with(kAndroidWindowSessionPrefix);\n  const bool android_tab =\n      params->session_id->starts_with(kAndroidTabSessionPrefix);\n  if (android_window || android_tab) {\n    auto fields = base::SplitStringPiece(*params->session_id, \":\",\n        base::KEEP_WHITESPACE, base::SPLIT_WANT_ALL);\n    int instance_id;\n    int64_t timestamp;\n    int tab_id = -1;\n    if (fields.size() != (android_window ? 3u : 4u) ||\n        !base::StringToInt(fields[1], &instance_id) || instance_id < 0 ||\n        !base::StringToInt64(fields[2], &timestamp) || timestamp <= 0 ||\n        (android_tab && (!base::StringToInt(fields[3], &tab_id) || tab_id < 0))) {\n      return RespondNow(Error(kInvalidSessionIdError, *params->session_id));\n    }\n    if (android_tab) {\n      return RestoreAndroidTab(instance_id, timestamp, tab_id, browser);\n    }\n    return QueryRecentlyClosedEntitiesManager(\n        instance_id, /*restore_most_recent=*/false, timestamp);\n  }\n#endif\n\n  std::unique_ptr<SessionId> session_id(SessionId::Parse(*params->session_id));"
- description: Scope both Java window metadata lookups to the exact regular profile
  regex:
    re_pattern: env,\ instance_id,\ std::move\(callback\)
    replace: env, Profile::FromBrowserContext(browser_context()), instance_id, std::move(callback)
  count: 2
- description: Remove URL-copy metadata updates when reopening the actual persisted instance
  regex:
    re_pattern: '//\ Updates\ tab\ properties\ for\ `new_tab`\ in\ `new_tab_list`\ using\ data\ from\

      //\ `saved_tab`\.\ There\ aren''t\ many\ properties\ to\ update\ because\ properties\ like\

      //\ URL,\ title,\ favicon,\ etc\.\ come\ from\ loading\ the\ page\ in\ the\ tab\.\

      void\ UpdateTabState\(TabAndroid\*\ saved_tab,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabListInterface\*\ new_tab_list,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tabs::TabHandle\ new_tab\)\ \{\

      \ \ if\ \(saved_tab\->IsPinned\(\)\)\ \{\

      \ \ \ \ new_tab_list\->PinTab\(new_tab\);\

      \ \ \}\

      \ \ if\ \(saved_tab\->IsActivated\(\)\)\ \{\

      \ \ \ \ new_tab_list\->ActivateTab\(new_tab\);\

      \ \ \}\

      \}\

      \

      '
    replace: ''
- description: Use the real persisted Android window and validate its live profile-owned native handle
  regex:
    re_pattern: '\ \ //\ Save\ the\ tab\ model\ object,\ which\ we''ll\ need\ after\ window\ creation\.\ This\ is\

      \ \ //\ a\ Java\ global\ reference,\ so\ the\ object\ will\ stay\ alive\ across\ the\ callback\.\

      \ \ global_ref_tab_model_\ =\ j_tab_model;\

      \

      \ \ //\ Open\ a\ window,\ which\ is\ asynchronous\.\

      \ \ //\ TODO\(crbug\.com/405219627\):\ Restore\ window\ bounds\.\

      \ \ BrowserWindowCreateParams\ params\(\

      \ \ \ \ \ \ BrowserWindowInterface::TYPE_NORMAL,\

      \ \ \ \ \ \ \*Profile::FromBrowserContext\(browser_context\(\)\),\

      \ \ \ \ \ \ /\*from_user_gesture=\*/false\);\

      \ \ //\ `this`\ is\ safe\ because\ the\ object\ is\ ref\-counted\.\

      \ \ auto\ callback\ =\

      \ \ \ \ \ \ base::BindOnce\(\&SessionsRestoreFunction::OnBrowserWindowCreated,\ this\);\

      \ \ CreateBrowserWindow\(std::move\(params\),\ std::move\(callback\)\);\

      \}\

      \

      void\ SessionsRestoreFunction::OnBrowserWindowCreated\(\

      \ \ \ \ BrowserWindowInterface\*\ browser\)\ \{\

      \ \ if\ \(!browser\)\ \{\

      \ \ \ \ Respond\(Error\(ExtensionTabUtil::kBrowserWindowNotAllowed\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \ \ TabListInterface\*\ new_tab_list\ =\ TabListInterface::From\(browser\);\

      \ \ CHECK\(new_tab_list\);\

      \

      \ \ //\ Look\ up\ the\ C\+\+\ side\ TabModel\ again\.\

      \ \ TabModel\*\ saved_tab_model\ =\ jni_zero::FromJniType<TabModel\*>\(\

      \ \ \ \ \ \ base::android::AttachCurrentThread\(\),\ global_ref_tab_model_\);\

      \ \ if\ \(!saved_tab_model\ \|\|\

      \ \ \ \ \ \ saved_tab_model\->GetProfile\(\)\ !=\

      \ \ \ \ \ \ \ \ \ \ Profile::FromBrowserContext\(browser_context\(\)\)\ \|\|\

      \ \ \ \ \ \ browser\->GetProfile\(\)\ !=\ saved_tab_model\->GetProfile\(\)\ \|\|\

      \ \ \ \ \ \ saved_tab_model\->GetProfile\(\)\->IsOffTheRecord\(\)\)\ \{\

      \ \ \ \ Respond\(Error\(kNoRecentlyClosedSessionsError\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ //\ This\ should\ not\ happen,\ but\ just\ in\ case\.\

      \ \ if\ \(saved_tab_model\->GetTabCount\(\)\ ==\ 0\)\ \{\

      \ \ \ \ Respond\(Error\(kNoRecentlyClosedSessionsError\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ //\ New\ Android\ browser\ windows\ start\ with\ one\ tab\ open\ already\.\ Load\ the\ first\

      \ \ //\ URL\ into\ that\ tab''s\ WebContents\.\

      \ \ CHECK_EQ\(new_tab_list\->GetTabCount\(\),\ 1\);\

      \ \ content::WebContents\*\ first_contents\ =\ new_tab_list\->GetTab\(0\)\->GetContents\(\);\

      \ \ CHECK\(first_contents\);\

      \ \ GURL\ first_url\ =\ saved_tab_model\->GetTabAt\(0\)\->GetURL\(\);\

      \ \ base::WeakPtr<content::NavigationHandle>\ handle\ =\

      \ \ \ \ \ \ first_contents\->GetController\(\)\.LoadURL\(first_url,\ content::Referrer\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ui::PAGE_TRANSITION_FROM_API,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*extra_headers=\*/std::string\(\)\);\

      \

      \ \ //\ This\ should\ not\ happen,\ but\ just\ in\ case\.\

      \ \ if\ \(!handle\.get\(\)\)\ \{\

      \ \ \ \ Respond\(Error\(kNoRecentlyClosedSessionsError\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ //\ Create\ new\ tabs\ for\ the\ rest\ of\ the\ saved\ tabs\.\

      \ \ for\ \(int\ i\ =\ 1;\ i\ <\ saved_tab_model\->GetTabCount\(\);\ \+\+i\)\ \{\

      \ \ \ \ TabAndroid\*\ saved_tab\ =\ saved_tab_model\->GetTabAt\(i\);\

      \ \ \ \ CHECK\(saved_tab\);\

      \ \ \ \ new_tab_list\->OpenTab\(saved_tab\->GetURL\(\),\ i\);\

      \ \ \}\

      \

      \ \ //\ Update\ tab\ state\ like\ pinned\ and\ active\ in\ a\ separate\ loop\ because\ loading\

      \ \ //\ new\ tabs\ may\ change\ activation\ state\.\

      \ \ for\ \(int\ i\ =\ 0;\ i\ <\ saved_tab_model\->GetTabCount\(\);\ \+\+i\)\ \{\

      \ \ \ \ TabAndroid\*\ saved_tab\ =\ saved_tab_model\->GetTabAt\(i\);\

      \ \ \ \ tabs::TabHandle\ new_tab_handle\ =\ new_tab_list\->GetTab\(i\)\->GetHandle\(\);\

      \ \ \ \ UpdateTabState\(saved_tab,\ new_tab_list,\ new_tab_handle\);\

      \ \ \}\

      \

      \ \ //\ Respond\ to\ the\ API\.\ Note\ that\ the\ tabs\ have\ not\ yet\ finished\ loading,\ so\

      \ \ //\ their\ "committed\ URL"\ will\ be\ empty\.\ They\ will\ eventually\ finish\ and\ we\

      \ \ //\ don''t\ want\ to\ block\ the\ API\ on\ multiple\ tab\ loads\.\

      \ \ Respond\(GetRestoredWindowResult\(ExtensionTabUtil::GetWindowId\(browser\)\)\);\

      \}\

      '
    replace: "  if (child_tab_id) {\n    bool found = false;\n    for (int i = 0; i < saved_tab_model->GetTabCount(); ++i) {\n      if (saved_tab_model->GetTabAt(i)->GetAndroidId() == *child_tab_id) {\n        found = true;\n        break;\n      }\n    }\n    if (!found) {\n      Respond(Error(kNoRecentlyClosedSessionsError));\n      return;\n    }\n    StartAndroidTabRestore(instance_id, timestamp, *child_tab_id);\n    return;\n  }\n\n  // Reuse Android's persisted-instance reopen path. It restores navigation,\n  // grouping and split state and consumes the closed-window record.\n  base::OnceCallback<void(int64_t)> callback = base::BindOnce(\n      &SessionsRestoreFunction::OnAndroidWindowRestored, this);\n  auto operation = Java_RecentlyClosedEntriesManager_restoreWindow(\n      base::android::AttachCurrentThread(), profile, instance_id, timestamp,\n      std::move(callback));\n  // Java may complete synchronously, including during teardown reentrancy.\n  if (android_shutting_down_ || did_respond()) {\n    if (operation) {\n      Java_RecentlyClosedEntriesManager_cancelRestoreOperation(\n          base::android::AttachCurrentThread(), operation);\n    }\n  } else {\n    android_restore_operation_.Reset(operation);\n  }\n}\n\nvoid SessionsRestoreFunction::OnBrowserContextShutdown() {\n  android_shutting_down_ = true;\n  auto operation = std::move(android_restore_operation_);\n  if (operation) {\n    Java_RecentlyClosedEntriesManager_cancelRestoreOperation(\n        base::android::AttachCurrentThread(), operation);\n  }\n  if (!did_respond()) {\n    Respond(Error(kNoRecentlyClosedSessionsError));\n  }\n}\n\nvoid SessionsRestoreFunction::OnAndroidWindowRestored(int64_t native_browser) {\n  android_restore_operation_.Reset();\n  if (android_shutting_down_ || did_respond() || !browser_context()) {\n    return;\n  }\n  auto* restored = reinterpret_cast<BrowserWindowInterface*>(native_browser);\n  Profile* profile = Profile::FromBrowserContext(browser_context());\n  // Do not dereference a stale native handle returned across an async boundary.\n  for (BrowserWindowInterface* browser : GetAllBrowserWindowInterfaces()) {\n    if (browser == restored && browser->GetProfile() == profile &&\n        !profile->IsOffTheRecord()) {\n      Respond(GetRestoredWindowResult(ExtensionTabUtil::GetWindowId(browser)));\n      return;\n    }\n  }\n  Respond(Error(kNoRecentlyClosedSessionsError));\n}\n"
