    replace: "      auto result = RestoreMostRecentNativeEntry();\n      if (!did_respond()) {\n        Respond(std::move(result));\n      }\n      return;"
- description: Preserve native-first local IDs while reconstructing Android groups and splits
  regex:
    re_pattern: 'ExtensionFunction::ResponseAction\ SessionsRestoreFunction::RestoreLocalSession\(\

      \ \ \ \ const\ SessionId\&\ session_id,\

      \ \ \ \ BrowserWindowInterface\*\ browser\)\ \{\

      \ \ sessions::TabRestoreService\*\ tab_restore_service\ =\

      \ \ \ \ \ \ TabRestoreServiceFactory::GetForProfile\(\

      \ \ \ \ \ \ \ \ \ \ Profile::FromBrowserContext\(browser_context\(\)\)\);\

      \ \ const\ sessions::TabRestoreService::Entries\&\ entries\ =\

      \ \ \ \ \ \ tab_restore_service\->entries\(\);\

      \

      \ \ if\ \(entries\.empty\(\)\)\ \{\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ //\ Android\ only\ stores\ tab\ restore\ information\ in\ TabRestoreService,\ so\ we\

      \ \ \ \ //\ must\ also\ query\ the\ Java\ side\ to\ check\ for\ window\ restore\ information\.\

      \ \ \ \ return\ QueryRecentlyClosedEntitiesManager\(session_id\.id\(\)\);\

      \#else\

      \ \ \ \ //\ Other\ platforms\ store\ everything\ in\ TabRestoreService,\ so\ if\ there\ are\ no\

      \ \ \ \ //\ entries\ there\ is\ nothing\ matching\ that\ session\ id\.\

      \ \ \ \ return\ RespondNow\(Error\(kInvalidSessionIdError,\ session_id\.ToString\(\)\)\);\

      \#endif\

      \ \ \}\

      \

      \ \ //\ Check\ if\ the\ recently\ closed\ list\ contains\ an\ entry\ with\ the\ provided\ id\.\

      \ \ bool\ is_window\ =\ false;\

      \ \ for\ \(const\ auto\&\ entry\ :\ entries\)\ \{\

      \ \ \ \ if\ \(entry\->id\.id\(\)\ ==\ session_id\.id\(\)\)\ \{\

      \ \ \ \ \ \ //\ A\ full\ window\ is\ being\ restored\ only\ if\ the\ entry\ ID\

      \ \ \ \ \ \ //\ matches\ the\ provided\ ID\ and\ the\ entry\ type\ is\ Window\.\

      \ \ \ \ \ \ is_window\ =\ is_window_entry\(\*entry\);\

      \ \ \ \ \ \ break;\

      \ \ \ \ \}\

      \ \ \}\

      \

      \ \ sessions::LiveTabContext\*\ context\ =\ GetLiveTabContextForBrowser\(browser\);\

      \ \ if\ \(!context\)\ \{\

      \ \ \ \ return\ RespondNow\(Error\(kNoLiveTabContextError\)\);\

      \ \ \}\

      \ \ std::vector<sessions::LiveTab\*>\ restored_tabs\ =\

      \ \ \ \ \ \ tab_restore_service\->RestoreEntryById\(\

      \ \ \ \ \ \ \ \ \ \ context,\ SessionID::FromSerializedValue\(session_id\.id\(\)\),\

      \ \ \ \ \ \ \ \ \ \ WindowOpenDisposition::UNKNOWN\);\

      \ \ //\ If\ the\ ID\ is\ invalid,\ restored_tabs\ will\ be\ empty\.\

      \ \ if\ \(restored_tabs\.empty\(\)\)\ \{\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ //\ Older\ callers\ may\ retain\ an\ unprefixed\ Android\ window\ instance\ ID\.\ Keep\

      \ \ \ \ //\ native\-first\ resolution\ for\ these\ ambiguous\ legacy\ IDs,\ then\ try\ Java\.\

      \ \ \ \ return\ QueryRecentlyClosedEntitiesManager\(session_id\.id\(\)\);\

      \#else\

      \ \ \ \ return\ RespondNow\(Error\(kInvalidSessionIdError,\ session_id\.ToString\(\)\)\);\

      \#endif\

      \ \ \}\

      \

      \ \ sessions::ContentLiveTab\*\ first_tab\ =\

      \ \ \ \ \ \ static_cast<sessions::ContentLiveTab\*>\(restored_tabs\[0\]\);\

      \

      \ \ //\ Retrieve\ the\ window\ through\ any\ of\ the\ tabs\ in\ restored_tabs\.\

      \ \ if\ \(is_window\)\ \{\

      \ \ \ \ return\ RespondNow\(GetRestoredWindowResult\(\

      \ \ \ \ \ \ \ \ ExtensionTabUtil::GetWindowIdOfTab\(\&first_tab\->GetWebContents\(\)\)\)\);\

      \ \ \}\

      \

      \ \ return\ RespondNow\(GetRestoredTabResult\(\&first_tab\->GetWebContents\(\)\)\);\

      \}\

      \

      '
    replace: "ExtensionFunction::ResponseAction SessionsRestoreFunction::RestoreLocalSession(\n    const SessionId& session_id,\n    BrowserWindowInterface* browser) {\n  sessions::TabRestoreService* tab_restore_service =\n      TabRestoreServiceFactory::GetForProfile(\n          Profile::FromBrowserContext(browser_context()));\n  const sessions::TabRestoreService::Entries& entries =\n      tab_restore_service->entries();\n\n  if (entries.empty()) {\n#if BUILDFLAG(IS_ANDROID)\n    // Android only stores tab restore information in TabRestoreService, so we\n    // must also query the Java side to check for window restore information.\n    return QueryRecentlyClosedEntitiesManager(session_id.id());\n#else\n    // Other platforms store everything in TabRestoreService, so if there are no\n    // entries there is nothing matching that session id.\n    return RespondNow(Error(kInvalidSessionIdError, session_id.ToString()));\n#endif\n  }\n\n  // Check if the recently closed list contains an entry with the provided id.\n  bool is_window = false;\n  for (const auto& entry : entries) {\n    if (entry->id.id() == session_id.id()) {\n      // A full window is being restored only if the entry ID\n      // matches the provided ID and the entry type is Window.\n      is_window = is_window_entry(*entry);\n      break;\n    }\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  auto* target = static_cast<TabModel*>(TabListInterface::From(browser));\n  if (!target) {\n    return RespondNow(Error(kNoLiveTabContextError));\n  }\n  auto restored = RestoreAndroidNativeSession(\n      tab_restore_service, target, SessionID::FromSerializedValue(session_id.id()));\n  if (did_respond()) {\n    return AlreadyResponded();\n  }\n  if (restored.found) {\n    if (!restored.contents || !browser_context()) {\n      return RespondNow(Error(kNoRecentlyClosedSessionsError));\n    }\n    if (is_window) {\n      return RespondNow(GetRestoredWindowResult(\n          ExtensionTabUtil::GetWindowIdOfTab(restored.contents.get())));\n    }\n    return RespondNow(GetRestoredTabResult(restored.contents.get()));\n  }\n  // Ambiguous legacy integers remain native-first. A missing native entry may\n  // still identify a persisted Android instance; a restored-then-closed tab may not.\n  return QueryRecentlyClosedEntitiesManager(session_id.id());\n#else\n  sessions::LiveTabContext* context = GetLiveTabContextForBrowser(browser);\n  if (!context) {\n    return RespondNow(Error(kNoLiveTabContextError));\n  }\n  std::vector<sessions::LiveTab*> restored_tabs =\n      tab_restore_service->RestoreEntryById(\n          context, SessionID::FromSerializedValue(session_id.id()),\n          WindowOpenDisposition::UNKNOWN);\n  // If the ID is invalid, restored_tabs will be empty.\n  if (restored_tabs.empty()) {\n#if BUILDFLAG(IS_ANDROID)\n    // Older callers may retain an unprefixed Android window instance ID. Keep\n    // native-first resolution for these ambiguous legacy IDs, then try Java.\n    return QueryRecentlyClosedEntitiesManager(session_id.id());\n#else\n    return RespondNow(Error(kInvalidSessionIdError, session_id.ToString()));\n#endif\n  }\n\n  sessions::ContentLiveTab* first_tab =\n      static_cast<sessions::ContentLiveTab*>(restored_tabs[0]);\n\n  // Retrieve the window through any of the tabs in restored_tabs.\n  if (is_window) {\n    return RespondNow(GetRestoredWindowResult(\n        ExtensionTabUtil::GetWindowIdOfTab(&first_tab->GetWebContents())));\n  }\n\n  return RespondNow(GetRestoredTabResult(&first_tab->GetWebContents()));\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n\n"
- description: Own each sequential metadata load without clobbering a reentrant next request
  regex:
    re_pattern: '\ \ \ \ Java_RecentlyClosedEntriesManager_getRecentlyClosedWindow\(\

      \ \ \ \ \ \ \ \ base::android::AttachCurrentThread\(\),\

      \ \ \ \ \ \ \ \ Profile::FromBrowserContext\(browser_context\(\)\),\

      \ \ \ \ \ \ \ \ static_cast<int>\(instance\),\ timestamp,\ std::move\(callback\)\);\

      \ \ \ \ return;'
    replace: "    const size_t request_position = android_window_position_;\n    auto operation = Java_RecentlyClosedEntriesManager_getRecentlyClosedWindow(\n        base::android::AttachCurrentThread(),\n        Profile::FromBrowserContext(browser_context()),\n        static_cast<int>(instance), timestamp, std::move(callback));\n    // A synchronous failure may already have advanced to the next window or\n    // completed the response. Never replace that next request's cancel handle.\n    if (android_shutting_down_ || did_respond() ||\n        android_window_position_ != request_position) {\n      if (operation) {\n        Java_RecentlyClosedEntriesManager_cancelRestoreOperation(\n            base::android::AttachCurrentThread(), operation);\n      }\n    } else {\n      android_metadata_operation_.Reset(operation);\n    }\n    return;"
