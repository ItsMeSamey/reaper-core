# Android mixed native-tab and Java-window session restoration.
substitutions:
- description: Declare explicit integer and optional dependencies for Android session state
  regex:
    re_pattern: \#include\ <string>
    replace: '#include <cstdint>

      #include <optional>

      #include <string>'
- description: Declare Android-only mixed-history selection and callback state
  regex:
    re_pattern: '\ \ //\ windows\.\ If\ instance_id\ is\ kInvalidWindowId\ it\ returns\ the\ most\ closed\.\

      \ \ //\ Otherwise\ it\ only\ returns\ a\ window\ with\ a\ matching\ instance\ id\.\

      \ \ ResponseAction\ QueryRecentlyClosedEntitiesManager\(int\ instance_id\);\

      \

      \ \ //\ Callback\ for\ `QueryRecentlyClosedEntitiesManager\(\)`\.\

      \ \ void\ OnGetRecentlyClosedWindow\(\

      \ \ \ \ \ \ const\ base::android::JavaRef<jobject>\&\ j_tab_model\);'
    replace: "  // windows. kInvalidWindowId selects the most recently closed window.\n  // restore_most_recent compares that window against current native entries.\n  ResponseAction QueryRecentlyClosedEntitiesManager(\n      int instance_id, bool restore_most_recent = false,\n      std::optional<int64_t> expected_timestamp = std::nullopt,\n      std::optional<int> child_tab_id = std::nullopt);\n  ResponseValue RestoreMostRecentNativeEntry();\n\n  // Callback for `QueryRecentlyClosedEntitiesManager()`.\n  void OnGetRecentlyClosedWindow(\n      bool restore_most_recent,\n      std::optional<int64_t> expected_timestamp,\n      std::optional<int> child_tab_id,\n      const base::android::JavaRef<jobject>& j_tab_model);"
- description: Return the real restored Android window without retaining a headless model
  regex:
    re_pattern: '\ \ //\ Callback\ for\ browser\ window\ creation\.\

      \ \ void\ OnBrowserWindowCreated\(BrowserWindowInterface\*\ browser\);\

      \

      \ \ //\ A\ global\ reference\ to\ `TabModel`\ so\ it\ stays\ alive\ across\ callbacks\.\

      \ \ base::android::ScopedJavaGlobalRef<jobject>\ global_ref_tab_model_;'
    replace: "  // Callback after Android has reopened the exact persisted instance.\n  void OnAndroidWindowRestored(int64_t native_browser);\n  void OnBrowserContextShutdown() override;\n  bool android_shutting_down_ = false;\n  base::android::ScopedJavaGlobalRef<jobject> android_restore_operation_;"
- description: Track the exact target model for saved Android child-tab restoration
  regex:
    re_pattern: \ \ //\ Callback\ after\ Android\ has\ reopened\ the\ exact\ persisted\ instance\.
    replace: "  ResponseAction RestoreAndroidTab(int instance_id, int64_t timestamp,\n                                   int tab_id, BrowserWindowInterface* browser);\n  void StartAndroidTabRestore(int instance_id, int64_t timestamp, int tab_id);\n  void OnAndroidTabRestored(const base::android::JavaRef<jobject>& j_tab);\n  base::android::ScopedJavaGlobalRef<jobject> android_target_model_;\n\n  // Callback after Android has reopened the exact persisted instance."
- description: Own bounded sequential Android listing and shutdown state
  regex:
    re_pattern: '\ \ void\ OnGetRecentlyClosedWindow\(\

      \ \ \ \ \ \ const\ base::android::JavaRef<jobject>\&\ j_tab_model\);'
    replace: "  void LoadNextAndroidWindow();\n  void FinishAndroidResults();\n  void OnBrowserContextShutdown() override;\n  void OnGetRecentlyClosedWindow(\n      int expected_instance, int64_t expected_timestamp,\n      const base::android::JavaRef<jobject>& j_tab_model);\n  std::vector<int64_t> android_window_snapshot_;\n  std::vector<int64_t> android_result_timestamps_;\n  size_t android_window_position_ = 0;\n  bool android_shutting_down_ = false;"
- description: Retain the current listing metadata cancellation handle
  regex:
    re_pattern: '\ \ size_t\ android_window_position_\ =\ 0;\

      \ \ bool\ android_shutting_down_\ =\ false;'
    replace: "  size_t android_window_position_ = 0;\n  bool android_shutting_down_ = false;\n  base::android::ScopedJavaGlobalRef<jobject> android_metadata_operation_;"
- description: Keep preparatory metadata and actual restoration cancellation handles distinct
  regex:
    re_pattern: '\ \ bool\ android_shutting_down_\ =\ false;\

      \ \ base::android::ScopedJavaGlobalRef<jobject>\ android_restore_operation_;'
    replace: "  bool android_shutting_down_ = false;\n  bool android_metadata_pending_ = false;\n  base::android::ScopedJavaGlobalRef<jobject> android_metadata_operation_;\n  base::android::ScopedJavaGlobalRef<jobject> android_restore_operation_;"
- description: Format modified Android mixed-session restoration
  regex:
    re_pattern: '\ \ void\ LoadNextAndroidWindow\(\);\

      \ \ void\ FinishAndroidResults\(\);\

      \ \ void\ OnBrowserContextShutdown\(\)\ override;\

      \ \ void\ OnGetRecentlyClosedWindow\(\

      \ \ \ \ \ \ int\ expected_instance,\ int64_t\ expected_timestamp,\

      \ \ \ \ \ \ const\ base::android::JavaRef<jobject>\&\ j_tab_model\);\

      \ \ std::vector<int64_t>\ android_window_snapshot_;\

      \ \ std::vector<int64_t>\ android_result_timestamps_;\

      \ \ size_t\ android_window_position_\ =\ 0;\

      '
    replace: "  void LoadNextAndroidWindow();\n  void FinishAndroidResults();\n  void OnBrowserContextShutdown() override;\n  void OnGetRecentlyClosedWindow(\n      int expected_instance,\n      int64_t expected_timestamp,\n      const base::android::JavaRef<jobject>& j_tab_model);\n  std::vector<int64_t> android_window_snapshot_;\n  std::vector<int64_t> android_result_timestamps_;\n  size_t android_window_position_ = 0;\n"
- description: Format modified Android mixed-session restoration
  regex:
    re_pattern: '\ \ //\ Uses\ JNI\ to\ query\ Java\ `RecentlyClosedEntitiesManager`\ for\ recently\ closed\

      \ \ //\ windows\.\ kInvalidWindowId\ selects\ the\ most\ recently\ closed\ window\.\

      \ \ //\ restore_most_recent\ compares\ that\ window\ against\ current\ native\ entries\.\

      \ \ ResponseAction\ QueryRecentlyClosedEntitiesManager\(\

      \ \ \ \ \ \ int\ instance_id,\ bool\ restore_most_recent\ =\ false,\

      \ \ \ \ \ \ std::optional<int64_t>\ expected_timestamp\ =\ std::nullopt,\

      \ \ \ \ \ \ std::optional<int>\ child_tab_id\ =\ std::nullopt\);\

      \ \ ResponseValue\ RestoreMostRecentNativeEntry\(\);\

      \

      '
    replace: "  // Uses JNI to query Java `RecentlyClosedEntitiesManager` for recently closed\n  // windows. kInvalidWindowId selects the most recently closed window.\n  // restore_most_recent compares that window against current native entries.\n  ResponseAction QueryRecentlyClosedEntitiesManager(\n      int instance_id,\n      bool restore_most_recent = false,\n      std::optional<int64_t> expected_timestamp = std::nullopt,\n      std::optional<int> child_tab_id = std::nullopt);\n  ResponseValue RestoreMostRecentNativeEntry();\n\n"
- description: Format modified Android mixed-session restoration
  regex:
    re_pattern: '\ \ \ \ \ \ std::optional<int64_t>\ expected_timestamp,\

      \ \ \ \ \ \ std::optional<int>\ child_tab_id,\

      \ \ \ \ \ \ const\ base::android::JavaRef<jobject>\&\ j_tab_model\);\

      \

      \ \ ResponseAction\ RestoreAndroidTab\(int\ instance_id,\ int64_t\ timestamp,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int\ tab_id,\ BrowserWindowInterface\*\ browser\);\

      \ \ void\ StartAndroidTabRestore\(int\ instance_id,\ int64_t\ timestamp,\ int\ tab_id\);\

      \ \ void\ OnAndroidTabRestored\(const\ base::android::JavaRef<jobject>\&\ j_tab\);\

      \ \ base::android::ScopedJavaGlobalRef<jobject>\ android_target_model_;\

      \

      '
    replace: "      std::optional<int64_t> expected_timestamp,\n      std::optional<int> child_tab_id,\n      const base::android::JavaRef<jobject>& j_tab_model);\n\n  ResponseAction RestoreAndroidTab(int instance_id,\n                                   int64_t timestamp,\n                                   int tab_id,\n                                   BrowserWindowInterface* browser);\n  void StartAndroidTabRestore(int instance_id, int64_t timestamp, int tab_id);\n  void OnAndroidTabRestored(const base::android::JavaRef<jobject>& j_tab);\n  base::android::ScopedJavaGlobalRef<jobject> android_target_model_;\n\n"
