# Android pending Reading List shutdown ownership.
substitutions:
- description: Scope Reading List shutdown hooks to Android
  regex:
    re_pattern: \#include\ "base/scoped_observation\.h"
    replace: '#include "base/scoped_observation.h"

      #include "build/build_config.h"'
- description: Detach pending Android Reading List calls before their context is destroyed
  count: 4
  regex:
    re_pattern: \ \ ResponseAction\ Run\(\)\ override;
    replace: "  ResponseAction Run() override;\n\n#if BUILDFLAG(IS_ANDROID)\n  void OnBrowserContextShutdown() override;\n#endif"
