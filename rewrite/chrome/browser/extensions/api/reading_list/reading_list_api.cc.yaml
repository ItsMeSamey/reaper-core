# Android pending Reading List shutdown ownership.
substitutions:
- description: Provide an explicit cancellation result for pending Android Reading List calls
  regex:
    re_pattern: namespace\ extensions\ \{
    replace: "namespace extensions {\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace {\nconstexpr char kReadingListShutdownError[] =\n    \"The browser context shut down before the reading list loaded.\";\n}  // namespace\n#endif"
- description: Cancel pending Android AddEntry when its browser context shuts down
  regex:
    re_pattern: ReadingListAddEntryFunction::\~ReadingListAddEntryFunction\(\)\ =\ default;
    replace: "ReadingListAddEntryFunction::~ReadingListAddEntryFunction() = default;\n\n#if BUILDFLAG(IS_ANDROID)\nvoid ReadingListAddEntryFunction::OnBrowserContextShutdown() {\n  reading_list_model_ = nullptr;\n  if (!reading_list_observation_.IsObserving()) {\n    return;\n  }\n  // All keyed services still exist during the shutdown notification. The dual\n  // model does not forward its inner models' shutdown/deletion notifications.\n  reading_list_observation_.Reset();\n  Respond(Error(kReadingListShutdownError));\n  Release();  // Balances the pending-load AddRef() in Run(), exactly once.\n}\n#endif"
- description: Cancel pending Android RemoveEntry when its browser context shuts down
  regex:
    re_pattern: ReadingListRemoveEntryFunction::\~ReadingListRemoveEntryFunction\(\)\ =\ default;
    replace: "ReadingListRemoveEntryFunction::~ReadingListRemoveEntryFunction() = default;\n\n#if BUILDFLAG(IS_ANDROID)\nvoid ReadingListRemoveEntryFunction::OnBrowserContextShutdown() {\n  reading_list_model_ = nullptr;\n  if (!reading_list_observation_.IsObserving()) {\n    return;\n  }\n  // All keyed services still exist during the shutdown notification. The dual\n  // model does not forward its inner models' shutdown/deletion notifications.\n  reading_list_observation_.Reset();\n  Respond(Error(kReadingListShutdownError));\n  Release();  // Balances the pending-load AddRef() in Run(), exactly once.\n}\n#endif"
