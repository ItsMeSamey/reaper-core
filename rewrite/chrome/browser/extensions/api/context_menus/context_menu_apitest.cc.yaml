- description: Coordinate Android context menu restoration and current API mutations
  regex:
    re_pattern: '\ \ VerifyMenuItem\("child2",\ submodel,\ 1,\ ui::MenuModel::TYPE_COMMAND,\ false\);\

      \}\

      \

      \}\ \ //\ namespace\ extensions\

      '
    replace: "  VerifyMenuItem(\"child2\", submodel, 1, ui::MenuModel::TYPE_COMMAND, false);\n}\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace {\n\nstruct MenuRestoreApiResult {\n  int responses = 0;\n  int successes = 0;\n  bool destroyed = false;\n  std::string error;\n};\n\n// Observe lifetime without replacing any actual API behavior.\ntemplate <class Function>\nclass ObservedMenuRestoreFunction : public Function {\n public:\n  explicit ObservedMenuRestoreFunction(\n      std::shared_ptr<MenuRestoreApiResult> result)\n      : result_(std::move(result)) {}\n\n protected:\n  ~ObservedMenuRestoreFunction() override { result_->destroyed = true; }\n\n private:\n  std::shared_ptr<MenuRestoreApiResult> result_;\n};\n\n}  // namespace\n\n// An installed ordinary MV3 extension, its actual StateStore/registry, and\n// real API functions. Hold only UI delivery of real storage replies; never\n// call ReadFromStorage or a synthetic readiness predicate directly.\nclass ExtensionContextMenuRestoreAndroidTest\n    : public ExtensionContextMenuApiTest,\n      public MenuManager::TestObserver {\n public:\n  void SetUpOnMainThread() override {\n    ExtensionContextMenuApiTest::SetUpOnMainThread();\n    extension_dir_.WriteManifest(R\"({\n      \"name\": \"Menu restore ordering\", \"version\": \"1\", \"manifest_version\": 3,\n      \"permissions\": [\"contextMenus\"], \"incognito\": \"split\",\n      \"background\": {\"service_worker\": \"worker.js\"}\n    })\");\n    extension_dir_.WriteFile(\n        FILE_PATH_LITERAL(\"worker.js\"),\n        \"chrome.runtime.onInstalled.addListener(() => {});\");\n    extension_ = LoadExtension(extension_dir_.UnpackedPath(),\n                               {.allow_in_incognito = true});\n    ASSERT_TRUE(extension_);\n    manager_ = MenuManager::Get(profile());\n    store_ = ExtensionSystem::Get(profile())->state_store();\n    ASSERT_TRUE(manager_);\n    ASSERT_TRUE(store_);\n    FlushStorage();\n    ASSERT_TRUE(store_->IsInitialized());\n    manager_->AddObserver(this);\n    observing_ = true;\n    dispatcher_ = std::make_unique<ExtensionFunctionDispatcher>(profile());\n  }\n\n  void TearDownOnMainThread() override {\n    if (extension_) {\n      DisableCurrent();\n    }\n    if (store_) {\n      FlushStorage();\n    }\n    if (observing_) {\n      manager_->RemoveObserver(this);\n    }\n    dispatcher_.reset();\n    extension_.reset();\n    manager_ = nullptr;\n    store_ = nullptr;\n    ExtensionContextMenuApiTest::TearDownOnMainThread();\n  }\n\n protected:\n  void DidReadFromStorage(const std::string& extension_id) override {\n    if (extension_ && extension_id == extension_->id()) {\n      ++read_count_;\n    }\n  }\n\n  void DisableCurrent() {\n    ExtensionRegistrar::Get(profile())->DisableExtension(\n        extension_->id(), {disable_reason::DISABLE_USER_ACTION});\n  }\n\n  // A bounded marker completes earlier backend work without pumping UI.\n  void FinishBackendWithoutUi() {\n    auto marker = std::make_shared<base::WaitableEvent>();\n    CHECK(GetExtensionFileTaskRunner()->PostTask(\n        FROM_HERE, base::BindOnce(\n                       [](std::shared_ptr<base::WaitableEvent> marker) {\n                         marker->Signal();\n                       },\n                       marker)));\n    base::ScopedAllowBaseSyncPrimitivesForTesting allow_wait;\n    CHECK(marker->TimedWait(TestTimeouts::action_timeout()));\n  }\n\n  void FlushStorage() {\n    base::test::TestFuture<void> flushed;\n    store_->FlushForTesting(flushed.GetCallback());\n    CHECK(flushed.Wait());\n  }\n\n  MenuItem::Id Id(const std::string& id, bool incognito = false) {\n    MenuItem::Id result(incognito, MenuItem::ExtensionKey(extension_->id()));\n    result.string_uid = id;\n    return result;\n  }\n\n  MenuItem* Find(const std::string& id, bool incognito = false) {\n    return manager_->GetItemById(Id(id, incognito));\n  }\n\n  base::DictValue SavedItem(const std::string& id,\n                            const std::string& title,\n                            const std::string& parent = {}) {\n    MenuItem item(Id(id), title, false, true, true, MenuItem::NORMAL,\n                  MenuItem::ContextList(MenuItem::ALL));\n    auto value = item.ToValue();\n    if (!parent.empty()) {\n      value.Set(\"parent_uid\", parent);\n    }\n    return value;\n  }\n\n  void SeedMenus() {\n    base::ListValue items;\n    items.Append(SavedItem(\"P\", \"stored parent\"));\n    items.Append(SavedItem(\"C\", \"stored child\", \"P\"));\n    items.Append(SavedItem(\"U\", \"untouched\"));\n    SeedValue(base::Value(std::move(items)));\n  }\n\n  void SeedValue(base::Value value) {\n    DisableCurrent();\n    store_->SetExtensionValue(extension_->id(), \"context_menus\",\n                              std::move(value));\n    FinishBackendWithoutUi();\n    read_count_ = 0;\n  }\n\n  void BeginRestore() {\n    ExtensionRegistrar::Get(profile())->EnableExtension(extension_->id());\n    CHECK_EQ(extension_.get(),\n             ExtensionRegistry::Get(profile())->enabled_extensions().GetByID(\n                 extension_->id()));\n    FinishBackendWithoutUi();\n  }\n\n  static base::ListValue CreateArgs(const std::string& id,\n                                    const std::string& title,\n                                    const std::string& parent = {}) {\n    auto properties = base::DictValue().Set(\"id\", id).Set(\"title\", title);\n    if (!parent.empty()) {\n      properties.Set(\"parentId\", parent);\n    }\n    return base::ListValue().Append(std::move(properties));\n  }\n\n  template <class Function>\n  std::shared_ptr<MenuRestoreApiResult> StartApi(\n      base::ListValue args,\n      base::OnceClosure on_response = {},\n      ExtensionFunctionDispatcher* dispatcher = nullptr) {\n    auto result = std::make_shared<MenuRestoreApiResult>();\n    auto function =\n        base::MakeRefCounted<ObservedMenuRestoreFunction<Function>>(result);\n    function->set_extension(extension_.get());\n    function->SetDispatcher(\n        (dispatcher ? dispatcher : dispatcher_.get())->AsWeakPtr());\n    function->SetArgs(std::move(args));\n    function->set_has_callback(true);\n    function->set_response_callback(base::BindOnce(\n        [](std::shared_ptr<MenuRestoreApiResult> result,\n           base::OnceClosure on_response,\n           ExtensionFunction::ResponseType response, base::ListValue values,\n           const std::string& error, mojom::ExtraResponseDataPtr extra) {\n          ++result->responses;\n          result->successes +=\n              response == ExtensionFunction::ResponseType::kSucceeded;\n          result->error = error;\n          if (on_response) {\n            std::move(on_response).Run();\n          }\n        },\n        result, std::move(on_response)));\n    function->RunWithValidation().Execute();\n    return result;\n  }\n\n  void ExpectCompleted(const std::shared_ptr<MenuRestoreApiResult>& result,\n                       bool success) {\n    EXPECT_EQ(1, result->responses);\n    EXPECT_EQ(success ? 1 : 0, result->successes);\n    EXPECT_TRUE(result->destroyed);\n  }\n\n  TestExtensionDir extension_dir_;\n  scoped_refptr<const Extension> extension_;\n  raw_ptr<MenuManager> manager_ = nullptr;\n  raw_ptr<StateStore> store_ = nullptr;\n  std::unique_ptr<ExtensionFunctionDispatcher> dispatcher_;\n  int read_count_ = 0;\n  bool observing_ = false;\n};\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       RemoveAllThenCreateDoesNotResurrectSavedChildren) {\n  SeedMenus();\n  BeginRestore();\n  std::vector<int> responses;\n  auto removed = StartApi<ContextMenusRemoveAllFunction>(\n      {}, base::BindOnce([](std::vector<int>* order) { order->push_back(1); },\n                         &responses));\n  auto created = StartApi<ContextMenusCreateFunction>(\n      CreateArgs(\"P\", \"current parent\"),\n      base::BindOnce([](std::vector<int>* order) { order->push_back(2); },\n                     &responses));\n  EXPECT_EQ(0, removed->responses);\n  EXPECT_EQ(0, created->responses);\n  EXPECT_FALSE(Find(\"P\"));\n  FlushStorage();\n  ExpectCompleted(removed, true);\n  ExpectCompleted(created, true);\n  EXPECT_EQ((std::vector<int>{1, 2}), responses);\n  ASSERT_TRUE(Find(\"P\"));\n  EXPECT_EQ(\"current parent\", Find(\"P\")->title());\n  EXPECT_TRUE(Find(\"P\")->children().empty());\n  EXPECT_FALSE(Find(\"C\"));\n  EXPECT_FALSE(Find(\"U\"));\n  EXPECT_EQ(1, read_count_);\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       AdditiveCreateKeepsUntouchedTreeAndParentOrder) {\n  SeedMenus();\n  BeginRestore();\n  auto parent = StartApi<ContextMenusCreateFunction>(CreateArgs(\"N\", \"new\"));\n  auto child =\n      StartApi<ContextMenusCreateFunction>(CreateArgs(\"NC\", \"new child\", \"N\"));\n  EXPECT_EQ(0, parent->responses);\n  EXPECT_EQ(0, child->responses);\n  FlushStorage();\n  ExpectCompleted(parent, true);\n  ExpectCompleted(child, true);\n  ASSERT_TRUE(Find(\"P\"));\n  EXPECT_EQ(\"stored parent\", Find(\"P\")->title());\n  ASSERT_TRUE(Find(\"C\"));\n  ASSERT_TRUE(Find(\"C\")->parent_id());\n  EXPECT_EQ(Id(\"P\"), *Find(\"C\")->parent_id());\n  EXPECT_TRUE(Find(\"U\"));\n  ASSERT_TRUE(Find(\"NC\"));\n  ASSERT_TRUE(Find(\"NC\")->parent_id());\n  EXPECT_EQ(Id(\"N\"), *Find(\"NC\")->parent_id());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       UpdateAndRemoveWaitForStoredItems) {\n  SeedMenus();\n  BeginRestore();\n  auto updated =\n      StartApi<ContextMenusUpdateFunction>(base::ListValue().Append(\"P\").Append(\n          base::DictValue().Set(\"title\", \"updated\")));\n  auto removed =\n      StartApi<ContextMenusRemoveFunction>(base::ListValue().Append(\"C\"));\n  EXPECT_EQ(0, updated->responses);\n  EXPECT_EQ(0, removed->responses);\n  FlushStorage();\n  ExpectCompleted(updated, true);\n  ExpectCompleted(removed, true);\n  ASSERT_TRUE(Find(\"P\"));\n  EXPECT_EQ(\"updated\", Find(\"P\")->title());\n  EXPECT_FALSE(Find(\"C\"));\n  EXPECT_TRUE(Find(\"U\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       DuplicateCreateKeepsStoredParentAndChild) {\n  SeedMenus();\n  BeginRestore();\n  auto duplicate =\n      StartApi<ContextMenusCreateFunction>(CreateArgs(\"P\", \"replacement\"));\n  EXPECT_EQ(0, duplicate->responses);\n  FlushStorage();\n  ExpectCompleted(duplicate, false);\n  EXPECT_FALSE(duplicate->error.empty());\n  ASSERT_TRUE(Find(\"P\"));\n  EXPECT_EQ(\"stored parent\", Find(\"P\")->title());\n  EXPECT_TRUE(Find(\"C\"));\n  EXPECT_TRUE(Find(\"U\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       SameObjectReenableRetiresOldReadAndWaitingMutation) {\n  SeedMenus();\n  BeginRestore();\n  auto old = StartApi<ContextMenusRemoveAllFunction>({});\n  EXPECT_EQ(0, old->responses);\n  DisableCurrent();\n  ExpectCompleted(old, false);\n  BeginRestore();\n  auto current =\n      StartApi<ContextMenusCreateFunction>(CreateArgs(\"N\", \"current\"));\n  EXPECT_EQ(0, current->responses);\n  FlushStorage();\n  ExpectCompleted(current, true);\n  EXPECT_EQ(1, old->responses);\n  EXPECT_EQ(1, read_count_);\n  EXPECT_TRUE(Find(\"P\"));\n  EXPECT_TRUE(Find(\"C\"));\n  EXPECT_TRUE(Find(\"U\"));\n  EXPECT_TRUE(Find(\"N\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       ReentrantUnloadFailsRemainingMutationExactlyOnce) {\n  SeedMenus();\n  BeginRestore();\n  auto first = StartApi<ContextMenusRemoveAllFunction>(\n      {},\n      base::BindOnce(&ExtensionContextMenuRestoreAndroidTest::DisableCurrent,\n                     base::Unretained(this)));\n  auto second = StartApi<ContextMenusCreateFunction>(CreateArgs(\"N\", \"late\"));\n  EXPECT_EQ(0, first->responses);\n  EXPECT_EQ(0, second->responses);\n  FlushStorage();\n  ExpectCompleted(first, true);\n  ExpectCompleted(second, false);\n  EXPECT_FALSE(Find(\"N\"));\n  EXPECT_FALSE(Find(\"P\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       OtrShutdownCancelsOnlyOriginatingRequest) {\n  ASSERT_FALSE(profile()->HasPrimaryOTRProfile());\n  Profile* otr = profile()->GetPrimaryOTRProfile(/*create_if_needed=*/true);\n  ASSERT_TRUE(otr);\n  auto otr_dispatcher = std::make_unique<ExtensionFunctionDispatcher>(otr);\n  SeedMenus();\n  BeginRestore();\n  auto regular =\n      StartApi<ContextMenusCreateFunction>(CreateArgs(\"R\", \"regular\"));\n  auto incognito = StartApi<ContextMenusCreateFunction>(\n      CreateArgs(\"I\", \"incognito\"), {}, otr_dispatcher.get());\n  EXPECT_EQ(0, regular->responses);\n  EXPECT_EQ(0, incognito->responses);\n  // Destroying only the dispatcher does not notify ExtensionFunction shutdown.\n  otr_dispatcher.reset();\n  EXPECT_EQ(0, incognito->responses);\n  // Exercise the actual originating profile's keyed-service shutdown notifier.\n  ProfileDestroyer::DestroyOTRProfileImmediately(otr);\n  EXPECT_FALSE(profile()->HasPrimaryOTRProfile());\n  ExpectCompleted(incognito, false);\n  EXPECT_EQ(0, regular->responses);\n  FlushStorage();\n  ExpectCompleted(regular, true);\n  EXPECT_EQ(1, incognito->responses);\n  EXPECT_TRUE(Find(\"R\"));\n  EXPECT_FALSE(Find(\"I\", /*incognito=*/true));\n  EXPECT_TRUE(Find(\"U\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       ManagerShutdownReleasesPendingCallsAndRetiresRead) {\n  SeedMenus();\n  BeginRestore();\n  auto created = StartApi<ContextMenusCreateFunction>(CreateArgs(\"N\", \"late\"));\n  auto removed = StartApi<ContextMenusRemoveAllFunction>({});\n  EXPECT_EQ(0, created->responses);\n  EXPECT_EQ(0, removed->responses);\n  manager_->Shutdown();\n  ExpectCompleted(created, false);\n  ExpectCompleted(removed, false);\n  manager_->Shutdown();\n  FlushStorage();\n  EXPECT_EQ(1, created->responses);\n  EXPECT_EQ(1, removed->responses);\n  EXPECT_EQ(0, read_count_);\n  EXPECT_FALSE(Find(\"P\"));\n  EXPECT_FALSE(Find(\"N\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       InvalidStoredValueStillCompletesQueuedCreate) {\n  SeedValue(base::Value(\"not a menu list\"));\n  BeginRestore();\n  auto created = StartApi<ContextMenusCreateFunction>(CreateArgs(\"N\", \"new\"));\n  EXPECT_EQ(0, created->responses);\n  FlushStorage();\n  ExpectCompleted(created, true);\n  EXPECT_TRUE(Find(\"N\"));\n  EXPECT_EQ(1, read_count_);\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuRestoreAndroidTest,\n                       WorkerWakeKeepsMenusAndCreateReturnsImmediateId) {\n  SeedMenus();\n  BeginRestore();\n  FlushStorage();\n  ASSERT_TRUE(Find(\"P\"));\n  ASSERT_TRUE(Find(\"C\"));\n  const int completed_reads = read_count_;\n  ASSERT_EQ(\n      base::Value(true),\n      BackgroundScriptExecutor::ExecuteScript(\n          profile(), extension_->id(), \"chrome.test.sendScriptResult(true);\",\n          BackgroundScriptExecutor::ResultCapture::kSendScriptResult));\n  browsertest_util::StopServiceWorkerForExtensionGlobalScope(profile(),\n                                                             extension_->id());\n  EXPECT_EQ(base::Value(true),\n            BackgroundScriptExecutor::ExecuteScript(\n                profile(), extension_->id(), R\"(\n        let returnedId;\n        let callbackRan = false;\n        returnedId = chrome.contextMenus.create({id: 'wake', title: 'wake'}, () => {\n          callbackRan = true;\n          chrome.test.sendScriptResult(\n              returnedId === 'wake' && !chrome.runtime.lastError);\n        });\n        if (returnedId !== 'wake' || callbackRan) {\n          chrome.test.sendScriptResult(false);\n        }\n      )\",\n                BackgroundScriptExecutor::ResultCapture::kSendScriptResult));\n  EXPECT_EQ(completed_reads, read_count_);\n  EXPECT_TRUE(Find(\"P\"));\n  EXPECT_TRUE(Find(\"C\"));\n  EXPECT_TRUE(Find(\"U\"));\n  EXPECT_TRUE(Find(\"wake\"));\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace extensions\n"
