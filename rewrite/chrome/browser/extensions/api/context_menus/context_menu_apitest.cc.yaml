- description: Preserve Android pending menu writes across retained-state unloads
  regex:
    re_pattern: '\ \ EXPECT_TRUE\(Find\("U"\)\);\

      \ \ EXPECT_TRUE\(Find\("wake"\)\);\

      \}\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      \

      \}\ \ //\ namespace\ extensions\

      '
    replace: "  EXPECT_TRUE(Find(\"U\"));\n  EXPECT_TRUE(Find(\"wake\"));\n}\n\n// Exercise acknowledged API mutations against the real one-second storage\n// timer. No UI task is pumped between a mutation and its immediate unload.\nclass ExtensionContextMenuPendingWriteAndroidTest\n    : public ExtensionContextMenuRestoreAndroidTest {\n public:\n  void TearDownOnMainThread() override {\n    // A failed assertion must not leave a callback referring to test locals.\n    on_write_.Reset();\n    ExtensionContextMenuRestoreAndroidTest::TearDownOnMainThread();\n  }\n\n protected:\n  void WillWriteToStorage(const std::string& extension_id) override {\n    if (!extension_ || extension_id != extension_->id()) {\n      return;\n    }\n    ++write_count_;\n    if (on_write_) {\n      std::move(on_write_).Run();\n    }\n  }\n\n  void RestoreSeededMenus() {\n    SeedMenus();\n    BeginRestore();\n    FlushStorage();\n    CHECK(Find(\"P\"));\n    CHECK(Find(\"C\"));\n    CHECK(Find(\"U\"));\n    CHECK_EQ(write_count_, 0);\n  }\n\n  void UpdateParent() {\n    auto result = StartApi<ContextMenusUpdateFunction>(\n        base::ListValue().Append(\"P\").Append(\n            base::DictValue().Set(\"title\", \"updated parent\")));\n    ASSERT_EQ(1, result->responses);\n    ASSERT_EQ(1, result->successes);\n    // Function destruction may be deferred; do not pump UI and fire the timer\n    // before the caller can exercise the immediate lifecycle transition.\n  }\n\n  std::optional<base::Value> ReadStoredMenus() {\n    base::test::TestFuture<std::optional<base::Value>> read;\n    store_->GetExtensionValue(extension_->id(), \"context_menus\",\n                              read.GetCallback());\n    CHECK(read.Wait());\n    return read.Take();\n  }\n\n  void ExpectStoredTree(const std::string& parent_title) {\n    auto value = ReadStoredMenus();\n    ASSERT_TRUE(value);\n    base::ListValue expected;\n    expected.Append(SavedItem(\"P\", parent_title));\n    expected.Append(SavedItem(\"C\", \"stored child\", \"P\"));\n    expected.Append(SavedItem(\"U\", \"untouched\"));\n    // Compare the real serialized parent/child order, IDs, flags and titles,\n    // including the untouched subtree; an empty replacement cannot pass.\n    EXPECT_EQ(base::Value(std::move(expected)), *value);\n  }\n\n  void PumpPastWriteDelay() {\n    // The production coalescing delay is one second. A later UI task plus a\n    // real StateStore roundtrip catches a surviving obsolete timer, not just\n    // the synchronous state immediately after the lifecycle notification.\n    base::test::TestFuture<void> elapsed;\n    CHECK(base::SingleThreadTaskRunner::GetCurrentDefault()->PostDelayedTask(\n        FROM_HERE, elapsed.GetCallback(), base::Seconds(2)));\n    CHECK(elapsed.Wait());\n    FlushStorage();\n  }\n\n  void UninstallCurrent() {\n    std::u16string error;\n    ASSERT_TRUE(ExtensionRegistrar::Get(profile())->UninstallExtension(\n        extension_->id(), UNINSTALL_REASON_FOR_TESTING, &error,\n        base::OnceClosure()));\n    EXPECT_TRUE(error.empty());\n  }\n\n  int write_count_ = 0;\n  base::OnceClosure on_write_;\n};\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuPendingWriteAndroidTest,\n                       DisableFlushPreservesChangedAndUntouchedItems) {\n  RestoreSeededMenus();\n  ASSERT_NO_FATAL_FAILURE(UpdateParent());\n  DisableCurrent();\n  EXPECT_EQ(1, write_count_);\n  EXPECT_FALSE(Find(\"P\"));\n  ExpectStoredTree(\"updated parent\");\n  PumpPastWriteDelay();\n  EXPECT_EQ(1, write_count_);\n  ExpectStoredTree(\"updated parent\");\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuPendingWriteAndroidTest,\n                       RemoveAllThenDisablePersistsEmpty) {\n  RestoreSeededMenus();\n  auto result = StartApi<ContextMenusRemoveAllFunction>({});\n  ASSERT_EQ(1, result->responses);\n  ASSERT_EQ(1, result->successes);\n  DisableCurrent();\n  EXPECT_EQ(1, write_count_);\n  auto value = ReadStoredMenus();\n  ASSERT_TRUE(value);\n  EXPECT_EQ(base::Value(base::ListValue()), *value);\n  BeginRestore();\n  FlushStorage();\n  EXPECT_FALSE(Find(\"P\"));\n  EXPECT_FALSE(Find(\"C\"));\n  EXPECT_FALSE(Find(\"U\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuPendingWriteAndroidTest,\n                       SameObjectReenableReadsFlushedMutation) {\n  RestoreSeededMenus();\n  ASSERT_NO_FATAL_FAILURE(UpdateParent());\n  DisableCurrent();\n  // BeginRestore asserts the registrar reuses this exact Extension object.\n  // The storage Get must follow the disable flush, even before its UI reply.\n  BeginRestore();\n  FlushStorage();\n  ASSERT_TRUE(Find(\"P\"));\n  EXPECT_EQ(\"updated parent\", Find(\"P\")->title());\n  ASSERT_TRUE(Find(\"C\"));\n  ASSERT_TRUE(Find(\"C\")->parent_id());\n  EXPECT_EQ(Id(\"P\"), *Find(\"C\")->parent_id());\n  EXPECT_TRUE(Find(\"U\"));\n  EXPECT_EQ(1, write_count_);\n  ExpectStoredTree(\"updated parent\");\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuPendingWriteAndroidTest,\n                       TerminateFlushesOnlyPendingMutation) {\n  RestoreSeededMenus();\n  ASSERT_NO_FATAL_FAILURE(UpdateParent());\n  ExtensionRegistrar::Get(profile())->TerminateExtension(extension_->id());\n  EXPECT_EQ(1, write_count_);\n  EXPECT_FALSE(Find(\"P\"));\n  ExpectStoredTree(\"updated parent\");\n  PumpPastWriteDelay();\n  EXPECT_EQ(1, write_count_);\n  ExpectStoredTree(\"updated parent\");\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuPendingWriteAndroidTest,\n                       UpdateKeyRemovalCancelsPendingOldTree) {\n  RestoreSeededMenus();\n  ASSERT_NO_FATAL_FAILURE(UpdateParent());\n  // Exercise the real registry/StateStore and registrar lifecycle boundary in\n  // installer order. This test does not synthesize a new version or claim to\n  // cover the unrelated unpacking/installation pipeline.\n  ExtensionRegistry::Get(profile())->TriggerOnWillBeInstalled(\n      extension_.get(), /*is_update=*/true, extension_->name());\n  ExtensionRegistrar::Get(profile())->RemoveExtension(\n      extension_->id(), UnloadedExtensionReason::UPDATE);\n  PumpPastWriteDelay();\n  EXPECT_EQ(0, write_count_);\n  EXPECT_FALSE(ReadStoredMenus());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuPendingWriteAndroidTest,\n                       UninstallDoesNotRepopulateRemovedKey) {\n  RestoreSeededMenus();\n  ASSERT_NO_FATAL_FAILURE(UpdateParent());\n  ASSERT_NO_FATAL_FAILURE(UninstallCurrent());\n  PumpPastWriteDelay();\n  EXPECT_EQ(0, write_count_);\n  EXPECT_FALSE(ReadStoredMenus());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuPendingWriteAndroidTest,\n                       WriteObserverDisableReenableKeepsOwnedSnapshot) {\n  RestoreSeededMenus();\n  ASSERT_NO_FATAL_FAILURE(UpdateParent());\n  base::test::TestFuture<void> observed;\n  on_write_ = base::BindOnce([this, done = observed.GetCallback()]() mutable {\n    DisableCurrent();\n    BeginRestore();\n    std::move(done).Run();\n  });\n  ASSERT_TRUE(observed.Wait());\n  FlushStorage();\n  // The reentrant unload must neither recursively notify this observer nor\n  // let the obsolete outer write serialize freed MenuItem pointers.\n  EXPECT_EQ(1, write_count_);\n  ASSERT_TRUE(Find(\"P\"));\n  EXPECT_EQ(\"updated parent\", Find(\"P\")->title());\n  EXPECT_TRUE(Find(\"C\"));\n  EXPECT_TRUE(Find(\"U\"));\n  ExpectStoredTree(\"updated parent\");\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuPendingWriteAndroidTest,\n                       DisableFlushObserverUninstallRetiresInFlightWrite) {\n  RestoreSeededMenus();\n  ASSERT_NO_FATAL_FAILURE(UpdateParent());\n  on_write_ = base::BindOnce([this] {\n    // The outer disable already moved this extension out of the enabled\n    // set. Uninstall therefore need not emit a second unload callback.\n    EXPECT_TRUE(\n        ExtensionRegistry::Get(profile())->disabled_extensions().Contains(\n            extension_->id()));\n    UninstallCurrent();\n  });\n  DisableCurrent();\n  EXPECT_EQ(1, write_count_);\n  EXPECT_FALSE(ReadStoredMenus());\n  PumpPastWriteDelay();\n  EXPECT_EQ(1, write_count_);\n  EXPECT_FALSE(ReadStoredMenus());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionContextMenuPendingWriteAndroidTest,\n                       DisableFlushObserverShutdownDoesNotSubmit) {\n  RestoreSeededMenus();\n  ASSERT_NO_FATAL_FAILURE(UpdateParent());\n  on_write_ = base::BindOnce([this] {\n    // This is the real keyed-service shutdown boundary, not object\n    // deletion or destruction of the browser test's original Profile.\n    manager_->Shutdown();\n  });\n  DisableCurrent();\n  EXPECT_EQ(1, write_count_);\n  ExpectStoredTree(\"stored parent\");\n  PumpPastWriteDelay();\n  EXPECT_EQ(1, write_count_);\n  ExpectStoredTree(\"stored parent\");\n}\n\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace extensions\n"
