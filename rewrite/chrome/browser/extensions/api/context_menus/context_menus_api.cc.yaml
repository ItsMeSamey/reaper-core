- description: Coordinate Android context menu restoration and current API mutations
  regex:
    re_pattern: '\

      namespace\ extensions\ \{\

      \

      ExtensionFunction::ResponseAction\ ContextMenusCreateFunction::Run\(\)\ \{\

      \ \ MenuItem::Id\ id\(browser_context\(\)\->IsOffTheRecord\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MenuItem::ExtensionKey\(extension_id\(\)\)\);\

      \ \ std::optional<api::context_menus::Create::Params>\ params\ =\

      '
    replace: "\nnamespace extensions {\n\nExtensionFunction::ResponseAction ContextMenusFunction::Run() {\n#if BUILDFLAG(IS_ANDROID)\n  waiting_for_restore_ = true;\n  pending_restore_request_ =\n      MenuManager::Get(browser_context())\n          ->RunAfterInitialRestore(\n              *extension(),\n              base::BindOnce(&ContextMenusFunction::OnInitialRestoreReady,\n                             this));\n  return did_respond() ? AlreadyResponded() : RespondLater();\n#else\n  return RunOnReady();\n#endif\n}\n\n#if BUILDFLAG(IS_ANDROID)\nvoid ContextMenusFunction::OnInitialRestoreReady(bool ready) {\n  if (did_respond()) {\n    return;\n  }\n  waiting_for_restore_ = false;\n  pending_restore_request_.RunAndReset();\n  if (!ready || !browser_context() ||\n      Profile::FromBrowserContext(browser_context())->ShutdownStarted() ||\n      ExtensionRegistry::Get(browser_context())\n              ->enabled_extensions()\n              .GetByID(extension_id()) != extension()) {\n    Respond(Error(\n        \"Context menu operation cancelled before restoration completed.\"));\n    return;\n  }\n  RunOnReady().Execute();\n}\n\nvoid ContextMenusFunction::OnBrowserContextShutdown() {\n  if (!waiting_for_restore_ || did_respond()) {\n    return;\n  }\n  waiting_for_restore_ = false;\n  // ExtensionFunction::Shutdown protects a live last reference while this\n  // cancellation drops the manager's callback. Do not resurrect a zero-ref\n  // function already awaiting DeleteSoon.\n  pending_restore_request_.RunAndReset();\n  Respond(\n      Error(\"Context menu operation cancelled before restoration completed.\"));\n}\n#endif\n\nExtensionFunction::ResponseAction ContextMenusCreateFunction::RunOnReady() {\n  MenuItem::Id id(browser_context()->IsOffTheRecord(),\n                  MenuItem::ExtensionKey(extension_id()));\n  std::optional<api::context_menus::Create::Params> params =\n"
