      \ \ DECLARE_EXTENSION_FUNCTION\("contextMenus\.removeAll",\ CONTEXTMENUS_REMOVEALL\)\

      \

      '
    replace: "  ~ContextMenusRemoveFunction() override = default;\n\n  // ExtensionFunction:\n  ResponseAction RunOnReady() override;\n};\n\nclass ContextMenusRemoveAllFunction : public ContextMenusFunction {\n public:\n  DECLARE_EXTENSION_FUNCTION(\"contextMenus.removeAll\", CONTEXTMENUS_REMOVEALL)\n\n"
- description: Coordinate Android context menu restoration and current API mutations
  regex:
    re_pattern: '\ \ \~ContextMenusRemoveAllFunction\(\)\ override\ =\ default;\

      \

      \ \ //\ ExtensionFunction:\

      \ \ ResponseAction\ Run\(\)\ override;\

      \};\

      \

      \}\ \ //\ namespace\ extensions\

      '
