substitutions:
- description: Coordinate Android context menu restoration and current API mutations
  regex:
    re_pattern: '\#ifndef\ CHROME_BROWSER_EXTENSIONS_API_CONTEXT_MENUS_CONTEXT_MENUS_API_H_\

      \#define\ CHROME_BROWSER_EXTENSIONS_API_CONTEXT_MENUS_CONTEXT_MENUS_API_H_\

      \

      \#include\ "extensions/browser/extension_function\.h"\

      \#include\ "extensions/buildflags/buildflags\.h"\

      \

      '
    replace: '#ifndef CHROME_BROWSER_EXTENSIONS_API_CONTEXT_MENUS_CONTEXT_MENUS_API_H_

      #define CHROME_BROWSER_EXTENSIONS_API_CONTEXT_MENUS_CONTEXT_MENUS_API_H_


      #include "base/functional/callback_helpers.h"

      #include "build/build_config.h"

      #include "extensions/browser/extension_function.h"

      #include "extensions/buildflags/buildflags.h"


      '
- description: Coordinate Android context menu restoration and current API mutations
  regex:
    re_pattern: '\

      namespace\ extensions\ \{\

      \

      class\ ContextMenusCreateFunction\ :\ public\ ExtensionFunction\ \{\

      \ public:\

      \ \ DECLARE_EXTENSION_FUNCTION\("contextMenus\.create",\ CONTEXTMENUS_CREATE\)\

      \

      '
    replace: "\nnamespace extensions {\n\n// The four public mutations share initial-restore ordering on Android.\nclass ContextMenusFunction : public ExtensionFunction {\n protected:\n  ~ContextMenusFunction() override = default;\n  ResponseAction Run() final;\n  virtual ResponseAction RunOnReady() = 0;\n\n#if BUILDFLAG(IS_ANDROID)\n private:\n  void OnInitialRestoreReady(bool ready);\n  void OnBrowserContextShutdown() override;\n\n  bool waiting_for_restore_ = false;\n  base::ScopedClosureRunner pending_restore_request_;\n#endif\n};\n\nclass ContextMenusCreateFunction : public ContextMenusFunction {\n public:\n  DECLARE_EXTENSION_FUNCTION(\"contextMenus.create\", CONTEXTMENUS_CREATE)\n\n"
- description: Coordinate Android context menu restoration and current API mutations
  regex:
    re_pattern: '\ \ \~ContextMenusCreateFunction\(\)\ override\ =\ default;\

      \

      \ \ //\ ExtensionFunction:\

      \ \ ResponseAction\ Run\(\)\ override;\

      \};\

      \

      class\ ContextMenusUpdateFunction\ :\ public\ ExtensionFunction\ \{\

      \ public:\

      \ \ DECLARE_EXTENSION_FUNCTION\("contextMenus\.update",\ CONTEXTMENUS_UPDATE\)\

      \

      '
    replace: "  ~ContextMenusCreateFunction() override = default;\n\n  // ExtensionFunction:\n  ResponseAction RunOnReady() override;\n};\n\nclass ContextMenusUpdateFunction : public ContextMenusFunction {\n public:\n  DECLARE_EXTENSION_FUNCTION(\"contextMenus.update\", CONTEXTMENUS_UPDATE)\n\n"
- description: Coordinate Android context menu restoration and current API mutations
  regex:
    re_pattern: '\ \ \~ContextMenusUpdateFunction\(\)\ override\ =\ default;\

      \

      \ \ //\ ExtensionFunction:\

      \ \ ResponseAction\ Run\(\)\ override;\

      \};\

      \

      class\ ContextMenusRemoveFunction\ :\ public\ ExtensionFunction\ \{\

      \ public:\

      \ \ DECLARE_EXTENSION_FUNCTION\("contextMenus\.remove",\ CONTEXTMENUS_REMOVE\)\

      \

      '
    replace: "  ~ContextMenusUpdateFunction() override = default;\n\n  // ExtensionFunction:\n  ResponseAction RunOnReady() override;\n};\n\nclass ContextMenusRemoveFunction : public ContextMenusFunction {\n public:\n  DECLARE_EXTENSION_FUNCTION(\"contextMenus.remove\", CONTEXTMENUS_REMOVE)\n\n"
- description: Coordinate Android context menu restoration and current API mutations
  regex:
    re_pattern: '\ \ \~ContextMenusRemoveFunction\(\)\ override\ =\ default;\

      \

      \ \ //\ ExtensionFunction:\

      \ \ ResponseAction\ Run\(\)\ override;\

      \};\

      \

      class\ ContextMenusRemoveAllFunction\ :\ public\ ExtensionFunction\ \{\

