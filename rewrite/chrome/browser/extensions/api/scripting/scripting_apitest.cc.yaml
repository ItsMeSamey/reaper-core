  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ <optional>\

      \

      \#include\ "base/strings/stringprintf\.h"\

      \#include\ "base/test/bind\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/extensions/extension_apitest\.h"\

      \#include\ "chrome/browser/extensions/extension_tab_util\.h"\

      '
    replace: '// found in the LICENSE file.


      #include <optional>

      #include <set>


      #include "base/strings/stringprintf.h"

      #include "base/test/bind.h"

      #include "base/test/test_future.h"

      #include "build/build_config.h"

      #include "chrome/browser/extensions/extension_apitest.h"

      #include "chrome/browser/extensions/extension_tab_util.h"

      '
- description: Round2 reviewed Android scripting repair
  regex:
    re_pattern: '\#include\ "extensions/browser/extension_system\.h"\

      \#include\ "extensions/browser/extension_user_script_loader\.h"\

      \#include\ "extensions/browser/script_executor\.h"\

      \#include\ "extensions/browser/test_extension_registry_observer\.h"\

      \#include\ "extensions/browser/user_script_manager\.h"\

      \#include\ "extensions/buildflags/buildflags\.h"\

      \#include\ "extensions/common/features/feature_channel\.h"\

      \#include\ "extensions/common/utils/content_script_utils\.h"\

      \#include\ "extensions/test/extension_test_message_listener\.h"\

      \#include\ "extensions/test/result_catcher\.h"\

      '
    replace: '#include "extensions/browser/extension_system.h"

      #include "extensions/browser/extension_user_script_loader.h"

      #include "extensions/browser/script_executor.h"

      #include "extensions/browser/scripting_constants.h"

      #include "extensions/browser/state_store.h"

      #include "extensions/browser/test_extension_registry_observer.h"

      #include "extensions/browser/user_script_manager.h"

      #include "extensions/buildflags/buildflags.h"

      #include "extensions/common/features/feature_channel.h"

      #include "extensions/common/user_script.h"

      #include "extensions/common/utils/content_script_utils.h"

      #include "extensions/test/extension_test_message_listener.h"

      #include "extensions/test/result_catcher.h"

      '
- description: Round2 reviewed Android scripting repair
  regex:
    re_pattern: 'IN_PROC_BROWSER_TEST_F\(ScriptingAPITest,\ UpdateContentScripts\)\ \{\

      \ \ ASSERT_TRUE\(RunExtensionTest\("scripting/update_scripts"\)\)\ <<\ message_;\

      \}\

      \

      IN_PROC_BROWSER_TEST_F\(ScriptingAPITest,\ DynamicContentScriptParameters\)\ \{\

      \ \ //\ Dynamic\ content\ script\ parameters\ are\ currently\ limited\ to\ trunk\.\

      '
    replace: "IN_PROC_BROWSER_TEST_F(ScriptingAPITest, UpdateContentScripts) {\n  ASSERT_TRUE(RunExtensionTest(\"scripting/update_scripts\")) << message_;\n}\n\n#if BUILDFLAG(IS_ANDROID)\nIN_PROC_BROWSER_TEST_F(ScriptingAPITest,\n                       UpdatedScriptsKeepOmittedPersistence) {\n  TestExtensionDir test_dir;\n  test_dir.WriteManifest(R\"({\n    \"name\": \"Persistence update\", \"manifest_version\": 3, \"version\": \"1\",\n    \"permissions\": [\"scripting\"],\n    \"host_permissions\": [\"http://example.com/*\"]\n  })\");\n  test_dir.WriteFile(FILE_PATH_LITERAL(\"script.js\"), \"void 0;\");\n  scoped_refptr<const Extension> extension =\n      LoadExtension(test_dir.UnpackedPath());\n  ASSERT_TRUE(extension);\n  auto run = [&](scoped_refptr<ExtensionFunction> function,\n                 const std::string& args) {\n    function->set_extension(extension.get());\n    return api_test_utils::RunFunction(function, args, profile());\n  };\n  auto get_scripts = [&]() {\n    auto function =\n        base::MakeRefCounted<ScriptingGetRegisteredContentScriptsFunction>();\n    function->set_extension(extension.get());\n    return api_test_utils::RunFunctionAndReturnSingleResult(function, \"[]\",\n                                                          profile());\n  };\n  ASSERT_TRUE(run(\n      base::MakeRefCounted<ScriptingRegisterContentScriptsFunction>(),\n      R\"([[{\"id\":\"keep\", \"matches\":[\"http://example.com/*\"],\n            \"js\":[\"script.js\"]},\n           {\"id\":\"session\", \"matches\":[\"http://example.com/*\"],\n            \"js\":[\"script.js\"], \"persistAcrossSessions\":false},\n           {\"id\":\"to_session\", \"matches\":[\"http://example.com/*\"],\n            \"js\":[\"script.js\"]},\n           {\"id\":\"to_persist\", \"matches\":[\"http://example.com/*\"],\n            \"js\":[\"script.js\"], \"persistAcrossSessions\":false}]])\"));\n  ASSERT_TRUE(run(\n      base::MakeRefCounted<ScriptingUpdateContentScriptsFunction>(),\n      R\"([[{\"id\":\"keep\", \"runAt\":\"document_end\"},\n           {\"id\":\"session\", \"runAt\":\"document_end\"},\n           {\"id\":\"to_session\", \"persistAcrossSessions\":false},\n           {\"id\":\"to_persist\", \"persistAcrossSessions\":true}]])\"));\n  auto scripts = get_scripts();\n  ASSERT_TRUE(scripts && scripts->is_list());\n  ASSERT_EQ(4u, scripts->GetList().size());\n  for (const auto& script : scripts->GetList()) {\n    const auto& dict = script.GetDict();\n    const std::string* id = dict.FindString(\"id\");\n    ASSERT_TRUE(id);\n    const bool expected = *id == \"keep\" || *id == \"to_persist\";\n    EXPECT_EQ(std::optional<bool>(expected),\n              dict.FindBool(\"persistAcrossSessions\"));\n  }\n\n  // Read the real StateStore after the update's queued writes. Metadata alone\n  // would not prove which registrations will be available to the next loader.\n  base::test::TestFuture<std::optional<base::Value>> stored;\n  ExtensionSystem::Get(profile())\n      ->dynamic_user_scripts_store()\n      ->GetExtensionValue(extension->id(), scripting::kRegisteredScriptsStorageKey,\n                          stored.GetCallback());\n  const auto& value = stored.Get();\n  ASSERT_TRUE(value && value->is_list());\n  std::set<std::string> stored_ids;\n  for (const auto& script : value->GetList()) {\n    const std::string* id = script.GetDict().FindString(\"id\");\n    ASSERT_TRUE(id);\n    stored_ids.insert(UserScript::TrimPrefixFromScriptID(*id));\n  }\n  ASSERT_EQ((std::set<std::string>{\"keep\", \"to_persist\"}), stored_ids);\n\n  // Reconstruct the loader from its stored registrations, without rerunning a\n  // worker that could register them again. This is not a process-restart test.\n  DisableExtension(extension->id());\n  extension_registrar()->EnableExtension(extension->id());\n  ContentScriptLoadWaiter waiter(\n      ExtensionSystem::Get(profile())\n          ->user_script_manager()\n          ->GetUserScriptLoaderForExtension(extension->id()));\n  waiter.Wait();\n  scripts = get_scripts();\n  ASSERT_TRUE(scripts && scripts->is_list());\n  std::set<std::string> restored_ids;\n  for (const auto& script : scripts->GetList()) {\n    const auto& dict = script.GetDict();\n    const std::string* id = dict.FindString(\"id\");\n    ASSERT_TRUE(id);\n    restored_ids.insert(*id);\n    EXPECT_EQ(std::optional<bool>(true), dict.FindBool(\"persistAcrossSessions\"));\n  }\n  EXPECT_EQ(stored_ids, restored_ids);\n}\n\nIN_PROC_BROWSER_TEST_F(ScriptingAPITest, UpdatedScriptChangesExecutionWorld) {\n  TestExtensionDir test_dir;\n  test_dir.WriteManifest(R\"({\n    \"name\": \"World update\", \"manifest_version\": 3, \"version\": \"1\",\n    \"permissions\": [\"scripting\"],\n    \"host_permissions\": [\"http://example.com/*\"]\n  })\");\n  test_dir.WriteFile(FILE_PATH_LITERAL(\"script.js\"), R\"(\n    window.reaperUpdatedScriptWorld = 'injected';\n    const markExecution = () => {\n      document.documentElement.setAttribute('data-reaper-script-executed', 'yes');\n    };\n    if (document.readyState === 'loading') {\n      document.addEventListener('DOMContentLoaded', markExecution, {once: true});\n    } else {\n      markExecution();\n    }\n  )\");\n  const Extension* extension = LoadExtension(test_dir.UnpackedPath());\n  ASSERT_TRUE(extension);\n  auto run = [&](scoped_refptr<ExtensionFunction> function,\n                 const std::string& args) {\n    function->set_extension(extension);\n    return api_test_utils::RunFunction(function, args, profile());\n  };\n  auto expect_world = [&](const char* world, int navigation) {\n    auto function =\n        base::MakeRefCounted<ScriptingGetRegisteredContentScriptsFunction>();\n    function->set_extension(extension);\n    auto scripts = api_test_utils::RunFunctionAndReturnSingleResult(\n        function, \"[]\", profile());\n    ASSERT_TRUE(scripts && scripts->is_list());\n    ASSERT_EQ(1u, scripts->GetList().size());\n    const auto& dict = scripts->GetList()[0].GetDict();\n    const std::string* actual_world = dict.FindString(\"world\");\n    ASSERT_TRUE(actual_world);\n    EXPECT_EQ(world, *actual_world);\n    OpenURLInCurrentTab(embedded_test_server()->GetURL(\n        \"example.com\", base::StringPrintf(\"/simple.html?world=%d\", navigation)));\n    // A shared DOM marker proves the script ran in either world; absence of a\n    // page global alone could also mean no injection happened.\n    EXPECT_EQ(\"yes\", content::EvalJs(\n                         GetActiveWebContents(),\n                         \"document.documentElement.getAttribute(\"\n                         \"'data-reaper-script-executed')\"));\n    // EvalJs runs in the page's main world, so isolated-world writes must not\n    // appear here. Navigation gives each assertion a fresh document.\n    EXPECT_EQ(std::string(world) == \"MAIN\" ? \"string\" : \"undefined\",\n              content::EvalJs(GetActiveWebContents(),\n                              \"typeof window.reaperUpdatedScriptWorld\"));\n  };\n  ASSERT_TRUE(run(\n      base::MakeRefCounted<ScriptingRegisterContentScriptsFunction>(),\n      R\"([[{\"id\":\"world\", \"matches\":[\"http://example.com/*\"],\n            \"js\":[\"script.js\"], \"runAt\":\"document_end\"}]])\"));\n  expect_world(\"ISOLATED\", 1);\n  ASSERT_TRUE(run(base::MakeRefCounted<ScriptingUpdateContentScriptsFunction>(),\n                  R\"([[{\"id\":\"world\", \"world\":\"MAIN\"}]])\"));\n  expect_world(\"MAIN\", 2);\n  ASSERT_TRUE(run(base::MakeRefCounted<ScriptingUpdateContentScriptsFunction>(),\n                  R\"([[{\"id\":\"world\", \"runAt\":\"document_start\"}]])\"));\n  expect_world(\"MAIN\", 3);\n  ASSERT_TRUE(run(base::MakeRefCounted<ScriptingUpdateContentScriptsFunction>(),\n                  R\"([[{\"id\":\"world\", \"world\":\"ISOLATED\"}]])\"));\n  expect_world(\"ISOLATED\", 4);\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nIN_PROC_BROWSER_TEST_F(ScriptingAPITest, DynamicContentScriptParameters) {\n  // Dynamic content script parameters are currently limited to trunk.\n"
