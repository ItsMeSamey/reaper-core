- description: Use the real management policy service to verify effective test policy.
  regex:
    pattern: '#include "chrome/browser/extensions/extension_management_test_util.h"

      '
    replace: '#include "chrome/browser/extensions/extension_management.h"

      #include "chrome/browser/extensions/extension_management_test_util.h"

      '
  count: 1
- description: Exercise delayed consent across managed-policy changes through the real MV3 dispatcher.
  regex:
    pattern: '#endif  // BUILDFLAG(IS_ANDROID)


      }  // namespace extensions

      '
    replace: "\n// Use the existing dispatcher/held-consent fixture with the real managed-policy\n// provider. Ordinary lifetime\
      \ tests above retain their original setup.\nclass PermissionsRequestPolicyLifetimeAndroidTest\n    : public PermissionsRequestLifetimeAndroidTest\
      \ {\n public:\n  void SetUp() override {\n    policy_provider_.SetDefaultReturns(\n        /*is_initialization_complete_return=*/true,\n\
      \        /*is_first_policy_load_complete_return=*/true);\n    policy_provider_.SetAutoRefresh();\n    policy::BrowserPolicyConnector::SetPolicyProviderForTesting(\n\
      \        &policy_provider_);\n    PermissionsRequestLifetimeAndroidTest::SetUp();\n  }\n\n protected:\n  bool SetBookmarksBlocked(const\
      \ Extension& extension, bool blocked) {\n    {\n      ExtensionManagementPolicyUpdater policy(&policy_provider_);\n\
      \      if (blocked) {\n        policy.AddBlockedPermission(\"*\", \"bookmarks\");\n      } else {\n        policy.ClearBlockedPermissions(\"\
      *\");\n      }\n    }\n    return base::test::RunUntil([this, &extension, blocked] {\n      return BookmarksAllowed(extension)\
      \ != blocked;\n    });\n  }\n\n  bool BookmarksAllowed(const Extension& extension) {\n    APIPermissionSet apis;\n \
      \   apis.insert(mojom::APIPermissionID::kBookmark);\n    const PermissionSet permissions(std::move(apis), ManifestPermissionSet(),\n\
      \                                    URLPatternSet(), URLPatternSet());\n    return ExtensionManagementFactory::GetForBrowserContext(profile())\n\
      \        ->IsPermissionSetAllowed(&extension, permissions);\n  }\n\n private:\n  testing::NiceMock<policy::MockConfigurationPolicyProvider>\
      \ policy_provider_;\n};\n\nIN_PROC_BROWSER_TEST_F(PermissionsRequestPolicyLifetimeAndroidTest,\n                   \
      \    RejectAcceptanceAfterPolicyBlocksPermission) {\n  scoped_refptr<const Extension> extension = LoadOptionalBookmarksExtension();\n\
      \  ASSERT_TRUE(extension);\n  const ExtensionId id = extension->id();\n  ExpectStoredBookmarkPermission(id, false);\n\
      \  ExpectContainsBookmarkPermission(id, false);\n\n  BackgroundScriptExecutor executor(profile());\n  ASSERT_TRUE(RequestAndWaitForDialog(*extension,\
      \ executor,\n                                      ResultCapture::kSendScriptResult));\n  ASSERT_TRUE(SetBookmarksBlocked(*extension,\
      \ true));\n  ASSERT_FALSE(BookmarksAllowed(*extension));\n  // Policy only revokes active permissions. This optional\
      \ permission was not\n  // active, so the original requesting instance is still enabled.\n  ASSERT_EQ(extension.get(),\n\
      \            extension_registry()->enabled_extensions().GetByID(id));\n  ResolveDialog(true);\n  base::Value result\
      \ = executor.WaitForResult();\n  ASSERT_TRUE(result.is_string());\n  EXPECT_EQ(\"Permissions are blocked by enterprise\
      \ policy.\", result.GetString());\n  ExpectStoredBookmarkPermission(id, false);\n  ExpectContainsBookmarkPermission(id,\
      \ false);\n  ASSERT_NO_FATAL_FAILURE(ReloadExtension(id));\n  ExpectStoredBookmarkPermission(id, false);\n  ExpectContainsBookmarkPermission(id,\
      \ false);\n}\n\nIN_PROC_BROWSER_TEST_F(PermissionsRequestPolicyLifetimeAndroidTest,\n                       AcceptAfterPolicyRestrictionIsRemoved)\
      \ {\n  scoped_refptr<const Extension> extension = LoadOptionalBookmarksExtension();\n  ASSERT_TRUE(extension);\n  const\
      \ ExtensionId id = extension->id();\n  BackgroundScriptExecutor executor(profile());\n  ASSERT_TRUE(RequestAndWaitForDialog(*extension,\
      \ executor,\n                                      ResultCapture::kSendScriptResult));\n  ASSERT_TRUE(SetBookmarksBlocked(*extension,\
      \ true));\n  ASSERT_FALSE(BookmarksAllowed(*extension));\n  ASSERT_TRUE(SetBookmarksBlocked(*extension, false));\n \
      \ ASSERT_TRUE(BookmarksAllowed(*extension));\n  ASSERT_EQ(extension.get(),\n            extension_registry()->enabled_extensions().GetByID(id));\n\
      \  ResolveDialog(true);\n  base::Value result = executor.WaitForResult();\n  ASSERT_TRUE(result.is_bool());\n  EXPECT_TRUE(result.GetBool());\n\
      \  ExpectStoredBookmarkPermission(id, true);\n  ExpectContainsBookmarkPermission(id, true);\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\
      \n}  // namespace extensions\n"
  count: 1
