# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Do not pull legacy plugin guests into Android generic dispatch
  regex:
    re_pattern: '\#include\ "extensions/browser/guest_view/mime_handler_view/mime_handler_stream_manager\.h"\

      \#include\ "extensions/browser/guest_view/mime_handler_view/mime_handler_view_guest\.h"'
    replace: '#include "extensions/buildflags/buildflags.h"

      #if BUILDFLAG(ENABLE_EXTENSIONS)

      #include "extensions/browser/guest_view/mime_handler_view/mime_handler_stream_manager.h"

      #include "extensions/browser/guest_view/mime_handler_view/mime_handler_view_guest.h"

      #endif'
- description: Keep legacy plugin streams on supported desktop builds
  regex:
    re_pattern: '\ \ //\ Legacy\ GuestView\ path\ for\ allowlisted\ extensions\.\

      \ \ MimeHandlerStreamManager::Get\(browser_context\)\

      \ \ \ \ \ \ \->AddStream\(stream_id,\ std::move\(stream_container\),\ frame_tree_node_id\);'
    replace: "#if BUILDFLAG(ENABLE_EXTENSIONS)\n  // Legacy GuestView path for allowlisted extensions.\n  MimeHandlerStreamManager::Get(browser_context)\n      ->AddStream(stream_id, std::move(stream_container), frame_tree_node_id);\n#endif"
