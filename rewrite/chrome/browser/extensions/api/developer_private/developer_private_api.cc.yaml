substitutions:
- description: "SAF557: preserve picker location separately from registered paths (1)."
  count: 1
  regex:
    pattern: "#include \"base/lazy_instance.h\"\n"
    replace: "#include \"base/lazy_instance.h\"\n#include \"build/build_config.h\"\n"
- description: "SAF557: preserve picker location separately from registered paths (2)."
  count: 1
  regex:
    pattern: "    const base::FilePath& path) {\n  DCHECK(web_contents);\n  last_unpacked_directory_ = path;\n"
    replace: "    const base::FilePath& path,\n    const base::FilePath& picker_directory) {\n  DCHECK(web_contents);\n  if (!picker_directory.empty()) {\n    last_unpacked_directory_ = picker_directory;\n  } else {\n#if BUILDFLAG(IS_ANDROID)\n    // Virtual retry/reload paths are not SAF picker locations.\n    if (!path.IsVirtualDocumentPath()) {\n      last_unpacked_directory_ = path;\n    }\n#else\n    last_unpacked_directory_ = path;\n#endif\n  }\n"
