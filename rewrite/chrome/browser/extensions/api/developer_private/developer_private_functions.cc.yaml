      \  if (!vp) {\n    OnLoadComplete(nullptr, file_path, u\"Failed to resolve (removed?)\");\n    return;\n  }\n  file_path\
      \ = *vp;\n#endif  // BUILDFLAG(IS_ANDROID)\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Resolve SAF tree URIs; local selections and already-virtual retry paths\n  //\
      \ can go directly through the installer's existing file validation.\n  if (file_path.IsContentUri()) {\n    std::optional<base::FilePath>\
      \ vp =\n        base::ResolveToVirtualDocumentPath(file_path);\n    if (!vp) {\n      // A populated load error must\
      \ identify the original selection for retry.\n      retry_guid_ = DeveloperPrivateAPI::Get(browser_context())\n    \
      \                    ->AddUnpackedPath(GetSenderWebContents(), file_path);\n      OnLoadComplete(nullptr, file_path,\
      \ u\"Failed to resolve (removed?)\");\n      return;\n    }\n    file_path = *vp;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n"
