      \ args;\n    args.Append(base::DictValue()\n                    .Set(\"extensionId\", id)\n                    .Set(\"userScriptsAccess\", enabled));\n    auto function = base::MakeRefCounted<\n        api::DeveloperPrivateUpdateExtensionConfigurationFunction>();\n    function->set_source_context_type(mojom::ContextType::kWebUi);\n    return RunFunction(function, args);\n  };\n\n  // No listener means the optional developer-private event router is absent.\n  ASSERT_FALSE(DeveloperPrivateAPI::Get(profile())\n                   ->developer_private_event_router());\n  ASSERT_TRUE(update_access(false));\n  EXPECT_FALSE(user_script_manager->AreUserScriptsAllowed(*extension));\n\n  EventRouter* event_router = EventRouter::Get(profile());\n  event_router->AddEventListener(\n      api::developer_private::OnItemStateChanged::kEventName,\n      render_process_host(), crx_file::id_util::GenerateId(\"listener\"));\n  base::RunLoop().RunUntilIdle();\n  ItemStatePrefsChangedObserver observer(event_router,\
      \ id);\n\n  // Repeated explicit settings updates also reconcile stale open pages; they\n  // must report current state, not the preference's pre-update allowed map.\n  for (bool enabled : {true, true, false, false}) {\n    SCOPED_TRACE(enabled);\n    observer.Reset();\n    ASSERT_EQ(0, observer.matching_event_count());\n    ASSERT_TRUE(update_access(enabled));\n    base::RunLoop().RunUntilIdle();\n    // The observer keeps the last payload: count every matching event so a\n    // stale-then-fresh pair or duplicate cannot hide behind that last value.\n    ASSERT_EQ(1, observer.matching_event_count());\n    auto info = observer.event_info();\n    EXPECT_EQ(id, info.id);\n    EXPECT_TRUE(info.user_scripts_access.is_enabled);\n    EXPECT_EQ(enabled, info.user_scripts_access.is_active);\n    EXPECT_EQ(enabled, user_script_manager->AreUserScriptsAllowed(*extension));\n  }\n}\n#endif\n\n// Test developerPrivate.updateExtensionConfiguration.\nTEST_F(DeveloperPrivateApiUnitTest,\n"

