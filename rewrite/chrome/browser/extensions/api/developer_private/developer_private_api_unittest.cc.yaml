  const base::FilePath crx = test_dir.Pack();\n  auto disable_ui = ExtensionInstallUI::disable_ui_for_tests(true);\n  ScopedTestDialogAutoConfirm confirm(ScopedTestDialogAutoConfirm::CANCEL);\n  auto pending =\n      base::MakeRefCounted<api::DeveloperPrivateInstallFromFileFunction>();\n  pending->SetRenderFrameHost(contents->GetPrimaryMainFrame());\n  pending->set_accept_dialog_for_testing(true);\n  pending->set_selected_file_for_testing(ui::SelectedFileInfo(crx));\n  // Exercise the production observer callback before the native async reply.\n  // Actual Android renderer replacement remains a separate device regression.\n  base::SingleThreadTaskRunner::GetCurrentDefault()->PostTask(\n      FROM_HERE, base::BindLambdaForTesting([&] {\n        static_cast<content::WebContentsObserver*>(pending.get())\n            ->PrimaryMainFrameRenderProcessGone(\n                base::TERMINATION_STATUS_PROCESS_WAS_KILLED);\n      }));\n  ASSERT_TRUE(api_test_utils::RunFunction(pending.get(), \"[]\", profile()));\n  ASSERT_EQ(1u, pending->GetResultListForTest()->size());\n  EXPECT_FALSE((*pending->GetResultListForTest())[0].GetBool());\n  pending->FileSelected(ui::SelectedFileInfo(crx), 0);\n  task_environment()->RunUntilIdle();\n  EXPECT_FALSE(read_notice(contents.get(), false));\n  EXPECT_FALSE(read_notice(other_contents.get()));\n  EXPECT_TRUE(read_notice(contents.get()));\n  EXPECT_FALSE(read_notice(contents.get()));\n  static_cast<content::WebContentsObserver*>(pending.get())\n      ->PrimaryMainFrameRenderProcessGone(\n          base::TERMINATION_STATUS_PROCESS_WAS_KILLED);\n  EXPECT_FALSE(read_notice(contents.get()));\n  for (const auto& extension : registry()->GenerateInstalledExtensionsSet()) {\n    EXPECT_NE(\"Interrupted local import\", extension->name());\n  }\n  EXPECT_TRUE(base::PathExists(crx));\n}\n\nTEST_F(DeveloperPrivateApiUnitTest, InstallFromFilePromptCancellation) {\n  ExtensionFunction::ScopedUserGestureForTests gesture;\n  profile()->GetPrefs()->SetBoolean(prefs::kExtensionsUIDeveloperMode, true);\n"
