substitutions:
- description: "SAF557: preserve picker location separately from registered paths (1)."
  count: 1
  regex:
    pattern: "  // return the same identifier.\n  UnpackedRetryId AddUnpackedPath(content::WebContents* web_contents,\n                                  const base::FilePath& path);"
    replace: "  // return the same identifier. `picker_directory` only remembers the original\n  // picker location; it does not change the path registered for retries.\n  UnpackedRetryId AddUnpackedPath(\n      content::WebContents* web_contents,\n      const base::FilePath& path,\n      const base::FilePath& picker_directory = base::FilePath());"
