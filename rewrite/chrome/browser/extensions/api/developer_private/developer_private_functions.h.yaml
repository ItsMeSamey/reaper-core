  regex:
    pattern: '#include <optional>


      #include "base/memory/scoped_refptr.h"

      #include "chrome/browser/extensions/api/developer_private/developer_private_api.h"

      #include "chrome/browser/extensions/api/developer_private/extension_info_generator.h"

      #include "chrome/browser/extensions/pack_extension_job.h"

      #include "chrome/common/extensions/api/developer_private.h"

      #include "extensions/browser/extension_creator.h"

      #include "extensions/browser/extension_function.h"

      #include "extensions/browser/extension_registry_observer.h"

      #include "extensions/browser/load_error_reporter.h"

      #include "extensions/browser/webstore_install_result.h"

      #include "extensions/buildflags/buildflags.h"

      '
    replace: '#include <optional>


      #include "base/memory/scoped_refptr.h"

      #include "base/memory/weak_ptr.h"

      #include "chrome/browser/extensions/api/developer_private/developer_private_api.h"

      #include "chrome/browser/extensions/api/developer_private/extension_info_generator.h"

      #include "chrome/browser/extensions/pack_extension_job.h"

      #include "chrome/common/extensions/api/developer_private.h"

      #include "content/public/browser/web_contents_observer.h"

      #include "extensions/browser/extension_creator.h"

      #include "extensions/browser/extension_function.h"

      #include "extensions/browser/extension_registry_observer.h"

      #include "extensions/browser/install/crx_install_error.h"

      #include "extensions/browser/load_error_reporter.h"

      #include "extensions/browser/webstore_install_result.h"

      #include "extensions/buildflags/buildflags.h"

      '
  count: 1
- description: Android explicit local CRX picker and ordinary result handling
  regex:
    pattern: "  std::optional<bool> accept_dialog_for_testing_;\n  // File to load when accepting the select file dialog without showing it.\n  std::optional<ui::SelectedFileInfo> selected_file_for_testing_;\n};\n\nclass DeveloperPrivateInstallDroppedFileFunction\n"
    replace: "  std::optional<bool> accept_dialog_for_testing_;\n  // File to load when accepting the select file dialog without showing it.\n  std::optional<ui::SelectedFileInfo> selected_file_for_testing_;\n};\n\nclass DeveloperPrivateInstallFromFileFunction\n    : public DeveloperPrivateAPIFunction,\n      public ui::SelectFileDialog::Listener,\n      public content::WebContentsObserver {\n public:\n  DECLARE_EXTENSION_FUNCTION(\"developerPrivate.installFromFile\",\n                             DEVELOPERPRIVATE_INSTALLFROMFILE)\n  DeveloperPrivateInstallFromFileFunction();\n  void FileSelected(const ui::SelectedFileInfo& file, int index) override;\n  void FileSelectionCanceled() override;\n  void set_accept_dialog_for_testing(bool accept) {\n    accept_dialog_for_testing_ = accept;\n  }\n  void set_selected_file_for_testing(const ui::SelectedFileInfo& file) {\n    selected_file_for_testing_ = file;\n  }\n\n private:\n  ~DeveloperPrivateInstallFromFileFunction() override;\n  ResponseAction Run() override;\n  void OnBrowserContextShutdown() override;\n  void WebContentsDestroyed() override;\n  void DidFinishNavigation(content::NavigationHandle* navigation) override;\n  std::string EligibilityError();\n  void OnInstalled(const std::optional<CrxInstallError>& error);\n  void Finish(ResponseValue result);\n\n  scoped_refptr<ui::SelectFileDialog> select_file_dialog_;\n  bool pending_ = false;\n  std::optional<bool> accept_dialog_for_testing_;\n  std::optional<ui::SelectedFileInfo> selected_file_for_testing_;\n  base::WeakPtrFactory<DeveloperPrivateInstallFromFileFunction> weak_factory_{\n      this};\n};\n\nclass DeveloperPrivateInstallDroppedFileFunction\n"
  count: 1
- description: Durable Android unpacked import lifecycle integration and recovery regression
  regex:
    pattern: "  ~DeveloperPrivateLoadUnpackedFunction() override;\n\n  // DeveloperPrivateAPIFunction:\n  ResponseAction Run() override;\n\n private:\n  // Shows the file picker dialog.\n  void ShowSelectFileDialog();\n\n  // Starts loading the given `file_path`.\n  void StartFileLoad(const base::FilePath file_path);\n\n"
    replace: "  ~DeveloperPrivateLoadUnpackedFunction() override;\n\n  // DeveloperPrivateAPIFunction:\n  ResponseAction Run() override;\n\n private:\n#if BUILDFLAG(IS_ANDROID)\n  void OnAndroidImportSelection(base::FilePath path, std::string error);\n  void OnBrowserContextShutdown() override;\n  std::string android_import_request_id_;\n#endif\n\n  // Shows the file picker dialog.\n  void ShowSelectFileDialog();\n\n  // Starts loading the given `file_path`.\n  void StartFileLoad(const base::FilePath file_path);\n\n"
  count: 1
- description: Android manual import prompt follows originating document
  regex:
    pattern: "  void DidFinishNavigation(content::NavigationHandle* navigation) override;"
    replace: "  void DidStartNavigation(content::NavigationHandle* navigation) override;"
  count: 1

- description: Report interrupted Android local import without resuming an invalid sender
  regex:
    re_pattern: '\ \ ResponseAction\ Run\(\)\ override;\

      \ \ void\ OnBrowserContextShutdown\(\)\ override;\

      \ \ void\ WebContentsDestroyed\(\)\ override;\

      \ \ void\ DidStartNavigation\(content::NavigationHandle\*\ navigation\)\ override;\

      \ \ std::string\ EligibilityError\(\);\

      \ \ void\ OnInstalled\(const\ std::optional<CrxInstallError>\&\ error\);\

      '
    replace: "  ResponseAction Run() override;\n  void OnBrowserContextShutdown() override;\n  void WebContentsDestroyed() override;\n#if BUILDFLAG(IS_ANDROID)\n  void PrimaryMainFrameRenderProcessGone(base::TerminationStatus status) override;\n#endif\n  void DidStartNavigation(content::NavigationHandle* navigation) override;\n  std::string EligibilityError();\n  void OnInstalled(const std::optional<CrxInstallError>& error);\n"
  count: 1
