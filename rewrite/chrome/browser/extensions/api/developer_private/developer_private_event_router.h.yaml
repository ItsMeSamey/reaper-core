substitutions:
- description: Publish current Android userScripts preference after state update; exercise one fresh event per explicit request.
  count: 1
  regex:
    pattern: "  // Called when the configuration (such as user preferences) for an extension\n  // has changed in a way that may affect the chrome://extensions UI.\n  void OnExtensionConfigurationChanged(const ExtensionId& extension_id);\n\n private:\n  raw_ptr<Profile> profile_;\n"
    replace: "  // Called when the configuration (such as user preferences) for an extension\n  // has changed in a way that may affect the chrome://extensions UI.\n  void OnExtensionConfigurationChanged(const ExtensionId& extension_id);\n\n#if BUILDFLAG(IS_ANDROID)\n  // Called after the explicit user-scripts setting has finished updating.\n  void OnUserScriptsAccessChanged(const ExtensionId& extension_id);\n#endif\n\n private:\n  raw_ptr<Profile> profile_;\n"
