substitutions:
- description: "Declare the Android build flag for the final processor ownership check."
  regex:
    re_pattern: "\\#include\\ \"base/strings/stringprintf\\.h\"\\\n"
    replace: "#include \"base/strings/stringprintf.h\"\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Notify only a retained settings sync processor on Android while preserving storage observer delivery and error handling."
  regex:
    re_pattern: "\\ \\ sync_processor_\\->NotifyChanges\\(changes\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  if (sync_processor_) {\n    sync_processor_->NotifyChanges(changes);\n  }\n#else\n  sync_processor_->NotifyChanges(changes);\n#endif\n"
  count: 1
