substitutions:

  - description: "Compile the existing proxy backend for Android extensions without desktop-only APIs."
    regex:
      pattern: "  if (enable_service_discovery) {"
      replace: "  if (is_android) {\n    public_deps +=\n        [ \"//chrome/browser/extensions/api/web_authentication_proxy\" ]\n  }\n\n  if (enable_service_discovery) {"

  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/api/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//chrome/browser/extensions/api/web_view",\

        \ \ \ \ "//chrome/browser/extensions/api/webrtc_logging_private",\

        \ \ \]\

        \

        \ \ if\ \(is_android\)\ \{\

        \ \ \ \ public_deps\ \+=\

        '
      replace: "    \"//chrome/browser/extensions/api/web_view\",\n    \"//chrome/browser/extensions/api/webrtc_logging_private\",\n  ]\n  if (is_android) {\n    public_deps -= [ \"//chrome/browser/extensions/api/glic_private\" ]\n  }\n\n  if (is_android) {\n    public_deps +=\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/api/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//chrome/browser/extensions/api/settings_overrides",\

        \ \ \ \ \ \ "//chrome/browser/extensions/api/webrtc_desktop_capture_private",\

        \ \ \ \ \]\

        \

        \ \ \ \ if\ \(enable_pdf\)\ \{\

        \ \ \ \ \ \ public_deps\ \+=\ \[\ "//chrome/browser/extensions/api/pdf_viewer_private"\ \]\

        '
      replace: "      \"//chrome/browser/extensions/api/settings_overrides\",\n      \"//chrome/browser/extensions/api/webrtc_desktop_capture_private\",\n    ]\n    if (is_android) {\n      public_deps -= [ \"//chrome/browser/extensions/api/experimental_actor\" ]\n    }\n\n    if (enable_pdf) {\n      public_deps += [ \"//chrome/browser/extensions/api/pdf_viewer_private\" ]\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/api/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//chrome/browser/extensions/api/contextual_tasks_private",\

        \ \ \ \ \ \ "//chrome/browser/extensions/api/indigo_private",\

        \ \ \ \ \]\

        \ \ \}\

        \}\

        \

        '
      replace: "      \"//chrome/browser/extensions/api/contextual_tasks_private\",\n      \"//chrome/browser/extensions/api/indigo_private\",\n    ]\n    if (is_android) {\n      public_deps -=\n          [ \"//chrome/browser/extensions/api/contextual_tasks_private\" ]\n    }\n  }\n}\n\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/api/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "page_action",\

        \ \ \ \ "windows",\

        \ \ \]\

        \

        \ \ inputs\ =\ \[\

        \ \ \ \ "//chrome/browser/accessibility/accessibility_extension_api_ash\.h",\

        '
      replace: "    \"page_action\",\n    \"windows\",\n  ]\n  if (is_android) {\n    custom_impl_schemas -= [\n      \"experimental_actor\",\n      \"glic_private\",\n    ]\n  }\n\n  inputs = [\n    \"//chrome/browser/accessibility/accessibility_extension_api_ash.h\",\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/api/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "terminal/terminal_private_api\.h",\

        \ \ \ \ "web_view/chrome_web_view_internal_api\.h",\

        \ \ \]\

        \

        \ \ deps\ =\ \[\

