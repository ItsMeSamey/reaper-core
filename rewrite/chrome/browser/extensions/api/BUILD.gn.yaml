    regex:
      re_pattern: '\ \ \ \ "//third_party/metrics_proto",\

        \ \ \ \ "//ui/accessibility:ax_enums_mojo",\

        \ \ \]\

        \

        \ \ if\ \(is_chromeos\)\ \{\

        \ \ \ \ deps\ \+=\ \[\

        '
      replace: "    \"//third_party/metrics_proto\",\n    \"//ui/accessibility:ax_enums_mojo\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/ai\" ]\n  }\n\n  if (is_chromeos) {\n    deps += [\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/api/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//pdf:buildflags",\

        \ \ \ \ "//printing/buildflags",\

        \ \ \]\

        \

        \ \ if\ \(is_chromeos\)\ \{\

        \ \ \ \ deps\ \+=\ \[\

        '
      replace: "    \"//pdf:buildflags\",\n    \"//printing/buildflags\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/contextual_tasks\" ]\n  }\n\n  if (is_chromeos) {\n    deps += [\n"
