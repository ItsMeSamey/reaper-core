        '
      replace: "    \"terminal/terminal_private_api.h\",\n    \"web_view/chrome_web_view_internal_api.h\",\n  ]\n  if (is_android) {\n    inputs -= [\n      \"experimental_actor/experimental_actor_api.h\",\n      \"glic_private/glic_private_api.h\",\n    ]\n  }\n\n  deps = [\n    # This is not directly included by the target, but specified here\n"
