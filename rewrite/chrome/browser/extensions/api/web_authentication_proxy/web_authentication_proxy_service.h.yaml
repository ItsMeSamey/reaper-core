substitutions:
- description: Keep the new teardown override confined to Android.
  regex:
    pattern: '#include <variant>'
    replace: '#include <variant>


      #include "build/build_config.h"'
- description: Complete pending native requests before keyed-service dependencies are torn down.
  regex:
    pattern: '  ~WebAuthenticationProxyService() override;'
    replace: "  ~WebAuthenticationProxyService() override;\n#if BUILDFLAG(IS_ANDROID)\n  void Shutdown() override;\n#endif"
