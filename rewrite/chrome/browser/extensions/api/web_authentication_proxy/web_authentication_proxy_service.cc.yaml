substitutions:
- description: Invalidate attachment handles after the existing abort callbacks on detach.
  regex:
    pattern: "  CancelPendingCallbacks();\n  active_proxy_.reset();"
    replace: "  CancelPendingCallbacks();\n  active_proxy_.reset();\n  InvalidateProxyHandles();"
- description: Stop pending callbacks at profile shutdown before service dependencies vanish.
  regex:
    pattern: void WebAuthenticationProxyService::CancelPendingCallbacks() {
    replace: "#if BUILDFLAG(IS_ANDROID)\nvoid WebAuthenticationProxyService::Shutdown() {\n  CancelPendingCallbacks();\n  active_proxy_.reset();\n  InvalidateProxyHandles();\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nvoid WebAuthenticationProxyService::CancelPendingCallbacks() {"
