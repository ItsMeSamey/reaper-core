substitutions:
- description: Exercise the same authenticator binding after real BFCache restoration.
  regex:
    pattern: '#include "content/public/test/browser_test.h"'
    replace: '#include "content/public/test/browser_test.h"

      #include "content/public/test/back_forward_cache_util.h"

      #include "content/public/browser/render_frame_host.h"

      #include "content/public/browser/weak_document_ptr.h"'
- description: Use an actual MV3 proxy fixture for document and security regressions.
  regex:
    pattern: '#include "extensions/test/result_catcher.h"'
    replace: '#include "extensions/test/result_catcher.h"

      #include "extensions/test/test_extension_dir.h"'
- description: Exercise RP/AppID validation and navigation cancellation through the real renderer API.
  regex:
    pattern: IN_PROC_BROWSER_TEST_F(WebAuthenticationProxyApiTest, AttachDetach)
    replace: "IN_PROC_BROWSER_TEST_F(WebAuthenticationProxyApiTest,\n                       ProxyCannotBypassRelyingPartyAndAppIdChecks) {\n  TestExtensionDir test_dir;\n  test_dir.WriteManifest(R\"({\"name\":\"Proxy validation\",\"version\":\"1\",\n    \"manifest_version\":3,\"permissions\":[\"webAuthenticationProxy\"],\n    \"background\":{\"service_worker\":\"worker.js\"}})\");\n  test_dir.WriteFile(FILE_PATH_LITERAL(\"worker.js\"), R\"(\n    chrome.webAuthenticationProxy.onCreateRequest.addListener(({requestId}) => {\n      chrome.webAuthenticationProxy.completeCreateRequest({requestId,\n        error:{name:'InvalidStateError',message:'Request reached the proxy'}});\n    });\n    chrome.webAuthenticationProxy.onGetRequest.addListener(({requestId}) => {\n      chrome.webAuthenticationProxy.completeGetRequest({requestId,\n        error:{name:'InvalidStateError',message:'Request reached the proxy'}});\n    });\n    chrome.webAuthenticationProxy.attach().then(() => chrome.test.sendMessage('ready'));\n\
      \  )\");\n  ExtensionTestMessageListener ready(\"ready\");\n  ASSERT_TRUE(LoadExtension(test_dir.UnpackedPath()));\n  ASSERT_TRUE(ready.WaitUntilSatisfied());\n  auto* contents = GetActiveWebContents();\n  ASSERT_TRUE(NavigateToURL(contents, https_test_server_.GetURL(\"a.test\", \"/page.html\")));\n  // The extension would respond InvalidStateError if either request were forwarded.\n  EXPECT_EQ(\"SecurityError\", content::EvalJs(contents, R\"(\n    navigator.credentials.create({publicKey:{\n      rp:{id:'unrelated.test',name:'test'}, challenge:new Uint8Array([1]),\n      user:{id:new Uint8Array([1]),name:'test',displayName:'test'},\n      pubKeyCredParams:[{type:'public-key',alg:-7}]\n    }}).then(()=>'unexpected-success', error=>error.name);\n  )\"));\n  EXPECT_EQ(\"SecurityError\", content::EvalJs(contents, R\"(\n    navigator.credentials.get({publicKey:{rpId:'a.test', challenge:new Uint8Array([1]),\n      extensions:{appid:'https://unrelated.test/appid'}\n    }}).then(()=>'unexpected-success',\
      \ error=>error.name);\n  )\"));\n}\n\nIN_PROC_BROWSER_TEST_F(WebAuthenticationProxyApiTest,\n                       NavigationCancelsProxyAndRejectsStaleCompletion) {\n  TestExtensionDir test_dir;\n  test_dir.WriteManifest(R\"({\"name\":\"Proxy navigation\",\"version\":\"1\",\n    \"manifest_version\":3,\"permissions\":[\"webAuthenticationProxy\"],\n    \"background\":{\"service_worker\":\"worker.js\"}})\");\n  test_dir.WriteFile(FILE_PATH_LITERAL(\"worker.js\"), R\"(\n    chrome.webAuthenticationProxy.onGetRequest.addListener(({requestId}) => {\n      chrome.test.sendMessage('request-started');\n    });\n    chrome.webAuthenticationProxy.onRequestCanceled.addListener(async requestId => {\n      try {\n        await chrome.webAuthenticationProxy.completeGetRequest({requestId,\n          error:{name:'NotAllowedError',message:'stale'}});\n        chrome.test.sendMessage('unexpected-stale-success');\n      } catch (error) {\n        chrome.test.assertEq('Invalid requestId', error.message);\n\
      \        chrome.test.sendMessage('request-cancelled-and-stale-rejected');\n      }\n    });\n    chrome.webAuthenticationProxy.attach().then(() => chrome.test.sendMessage('ready'));\n  )\");\n  ExtensionTestMessageListener ready(\"ready\");\n  ASSERT_TRUE(LoadExtension(test_dir.UnpackedPath()));\n  ASSERT_TRUE(ready.WaitUntilSatisfied());\n  auto* contents = GetActiveWebContents();\n  ASSERT_TRUE(NavigateToURL(contents, https_test_server_.GetURL(\"a.test\", \"/page.html\")));\n  ExtensionTestMessageListener started(\"request-started\");\n  ExtensionTestMessageListener cancelled(\"request-cancelled-and-stale-rejected\");\n  ASSERT_TRUE(content::ExecJs(contents, R\"(\n    void (window.pendingCredential = navigator.credentials.get({publicKey:{\n      rpId:'a.test',challenge:new Uint8Array([1])\n    }}).catch(error=>error.name));\n  )\"));\n  ASSERT_TRUE(started.WaitUntilSatisfied());\n  ASSERT_TRUE(NavigateToURL(contents,\n      https_test_server_.GetURL(\"a.test\", \"/page.html?replacement-document\"\
      )));\n  EXPECT_TRUE(cancelled.WaitUntilSatisfied());\n}\n\nclass WebAuthenticationProxyBackForwardCacheTest\n    : public WebAuthenticationProxyApiTest {\n public:\n  WebAuthenticationProxyBackForwardCacheTest() {\n    feature_list_.InitWithFeaturesAndParameters(\n        content::GetDefaultEnabledBackForwardCacheFeaturesForTesting(),\n        content::GetDefaultDisabledBackForwardCacheFeaturesForTesting());\n  }\n\n private:\n  base::test::ScopedFeatureList feature_list_;\n};\n\nIN_PROC_BROWSER_TEST_F(WebAuthenticationProxyBackForwardCacheTest,\n                       RestoredDocumentKeepsProxyBinding) {\n  TestExtensionDir test_dir;\n  test_dir.WriteManifest(R\"({\"name\":\"Proxy BFCache\",\"version\":\"1\",\n    \"manifest_version\":3,\"permissions\":[\"webAuthenticationProxy\"],\n    \"background\":{\"service_worker\":\"worker.js\"}})\");\n  test_dir.WriteFile(FILE_PATH_LITERAL(\"worker.js\"), R\"(\n    chrome.webAuthenticationProxy.onIsUvpaaRequest.addListener(({requestId}) =>\
      \ {\n      chrome.webAuthenticationProxy.completeIsUvpaaRequest({requestId,isUvpaa:true});\n      chrome.test.sendMessage('proxied-uvpaa');\n    });\n    chrome.webAuthenticationProxy.attach().then(() => chrome.test.sendMessage('ready'));\n  )\");\n  ExtensionTestMessageListener ready(\"ready\");\n  ASSERT_TRUE(LoadExtension(test_dir.UnpackedPath()));\n  ASSERT_TRUE(ready.WaitUntilSatisfied());\n  auto* contents = GetActiveWebContents();\n  ASSERT_TRUE(NavigateToURL(contents, https_test_server_.GetURL(\"a.test\", \"/page.html\")));\n  {\n    ExtensionTestMessageListener proxied(\"proxied-uvpaa\");\n    EXPECT_EQ(true, content::EvalJs(contents,\n        \"PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()\"));\n    ASSERT_TRUE(proxied.WaitUntilSatisfied());\n  }\n  auto original_document = contents->GetPrimaryMainFrame()->GetWeakDocumentPtr();\n  ASSERT_TRUE(NavigateToURL(contents, https_test_server_.GetURL(\"b.test\", \"/page.html\")));\n  ASSERT_TRUE(original_document.AsRenderFrameHostIfValid());\n\
      \  ASSERT_TRUE(original_document.AsRenderFrameHostIfValid()->IsInLifecycleState(\n      content::RenderFrameHost::LifecycleState::kInBackForwardCache));\n  ASSERT_TRUE(content::HistoryGoBack(contents));\n  ASSERT_EQ(original_document.AsRenderFrameHostIfValid(), contents->GetPrimaryMainFrame());\n  ExtensionTestMessageListener proxied_after_restore(\"proxied-uvpaa\");\n  EXPECT_EQ(true, content::EvalJs(contents,\n      \"PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()\"));\n  EXPECT_TRUE(proxied_after_restore.WaitUntilSatisfied());\n}\n\nIN_PROC_BROWSER_TEST_F(WebAuthenticationProxyApiTest, AttachDetach)"
- description: Retain a handle to the first attachment before the real extension detaches.
  regex:
    pattern: '  // Tell the first extension to detach. Then tell the second extension to'
    replace: "  auto first_attachment =\n      WebAuthenticationProxyService::GetIfProxyAttached(profile())->GetWeakPtr();\n  ASSERT_TRUE(first_attachment);\n\n  // Tell the first extension to detach. Then tell the second extension to"
- description: A detached attachment must never alias a subsequently attached extension.
  regex:
    pattern: "  ASSERT_TRUE(detach_listener.WaitUntilSatisfied());\n  attach_fail_listener.Reply(\"\");"
    replace: "  ASSERT_TRUE(detach_listener.WaitUntilSatisfied());\n  EXPECT_FALSE(first_attachment);\n  attach_fail_listener.Reply(\"\");"
