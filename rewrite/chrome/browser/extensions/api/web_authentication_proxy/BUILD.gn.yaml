substitutions:

  - description: "Reuse the platform-neutral API and file watcher in Android extension builds."
    regex:
      pattern: "# This API is limited to Win/Mac/Linux.\nassert(is_win || is_mac || is_linux)"
      replace: "# The shared API also serves the Android renderer request adapter.\nassert(is_win || is_mac || is_linux || is_android)"
