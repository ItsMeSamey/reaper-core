substitutions:

  - description: "Declare Chrome Android power backend creation."
    regex:
      pattern: "  // ExtensionsApiClient implementation."
      replace: "#if BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<AndroidPowerDelegate> CreateAndroidPowerDelegate(\n      content::BrowserContext* context) const override;\n#endif\n\n  // ExtensionsApiClient implementation."
