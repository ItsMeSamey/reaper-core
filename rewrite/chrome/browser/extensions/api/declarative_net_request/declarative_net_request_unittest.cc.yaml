        "replace": "                         {kDefaultRulesetID, dnr_api::DYNAMIC_RULESET_ID});\n}\n\n#if BUILDFLAG(IS_ANDROID)\n// These are lifecycle tests of the app-owned root. The source remains a local\n// fixture; a genuinely read-only DocumentsProvider is separate device coverage.\nTEST_P(MultipleRulesetsTest_Unpacked, SafStaticCacheRemovedOnOrdinaryUninstall) {\n  AddRuleset(CreateRuleset(kId1, 1, 0, true));\n  RulesetManagerObserver waiter(manager());\n  LoadAndExpectSuccess(1);\n  waiter.WaitForExtensionsWithRulesetsCount(1);\n  const ExtensionId id = extension()->id();\n  const base::FilePath source = extension()->path();\n  const base::FilePath own =\n      FileBackedRulesetSource::GetSafStaticRulesCacheDirectory(\n          browser_context()->GetPath(), id);\n  const base::FilePath other_extension =\n      FileBackedRulesetSource::GetSafStaticRulesCacheDirectory(\n          browser_context()->GetPath(), std::string(32, 'b'));\n  const base::FilePath other_profile =\n      FileBackedRulesetSource::GetSafStaticRulesCacheDirectory(\n          temp_dir().GetPath().AppendASCII(\"other-profile\"), id);\n  ASSERT_NE(own, other_extension);\n  for (const auto& root : {own, other_extension, other_profile}) {\n    ASSERT_TRUE(base::CreateDirectory(root.AppendASCII(\"source/rule\")));\n    ASSERT_TRUE(base::WriteFile(root.AppendASCII(\"source/rule/123\"), \"index\"));\n  }\n  std::string manifest_before;\n  std::string rules_before;\n  ASSERT_TRUE(base::ReadFileToString(source.AppendASCII(\"manifest.json\"),\n                                   &manifest_before));\n  ASSERT_TRUE(base::ReadFileToString(source.AppendASCII(kId1), &rules_before));\n  int dynamic_checksum = 0;\n  ASSERT_FALSE(PrefsHelper(*ExtensionPrefs::Get(browser_context()))\n                   .GetDynamicRulesetChecksum(id, dynamic_checksum));\n  ASSERT_TRUE(registrar()->UninstallExtension(\n      id, UNINSTALL_REASON_FOR_TESTING, nullptr));\n  content::RunAllTasksUntilIdle();\n  EXPECT_FALSE(base::PathExists(own));\n  std::string preserved;\n  EXPECT_TRUE(base::ReadFileToString(\n      other_extension.AppendASCII(\"source/rule/123\"), &preserved));\n  EXPECT_EQ(\"index\", preserved);\n  preserved.clear();\n  EXPECT_TRUE(base::ReadFileToString(\n      other_profile.AppendASCII(\"source/rule/123\"), &preserved));\n  EXPECT_EQ(\"index\", preserved);\n  preserved.clear();\n  EXPECT_TRUE(base::ReadFileToString(source.AppendASCII(\"manifest.json\"),\n                                   &preserved));\n  EXPECT_EQ(manifest_before, preserved);\n  preserved.clear();\n  EXPECT_TRUE(base::ReadFileToString(source.AppendASCII(kId1), &preserved));\n  EXPECT_EQ(rules_before, preserved);\n}\n\nTEST_P(MultipleRulesetsTest_Unpacked, SafStaticCacheRemovedOnOrphanPrefsDeletion) {\n  AddRuleset(CreateRuleset(kId1, 1, 0, true));\n  RulesetManagerObserver waiter(manager());\n  LoadAndExpectSuccess(1);\n  waiter.WaitForExtensionsWithRulesetsCount(1);\n  const ExtensionId id = extension()->id();\n  const base::FilePath own =\n      FileBackedRulesetSource::GetSafStaticRulesCacheDirectory(\n          browser_context()->GetPath(), id);\n  ASSERT_TRUE(base::CreateDirectory(own));\n  ASSERT_TRUE(base::WriteFile(own.AppendASCII(\"index\"), \"index\"));\n  ASSERT_TRUE(base::DeletePathRecursively(extension()->path()));\n  ASSERT_TRUE(registry()->RemoveEnabled(id));\n  ExtensionGarbageCollector::Get(browser_context())\n      ->GarbageCollectExtensionsForTest();\n  content::RunAllTasksUntilIdle();\n  EXPECT_FALSE(base::PathExists(own));\n}\n\nTEST_P(MultipleRulesetsTest_Unpacked, SafStaticCachePreservedForReinstall) {\n  AddRuleset(CreateRuleset(kId1, 1, 0, true));\n  RulesetManagerObserver waiter(manager());\n  LoadAndExpectSuccess(1);\n  waiter.WaitForExtensionsWithRulesetsCount(1);\n  const ExtensionId id = extension()->id();\n  const base::FilePath own =\n      FileBackedRulesetSource::GetSafStaticRulesCacheDirectory(\n          browser_context()->GetPath(), id);\n  ASSERT_TRUE(base::CreateDirectory(own));\n  ASSERT_TRUE(base::WriteFile(own.AppendASCII(\"index\"), \"installed generation\"));\n  ASSERT_TRUE(registrar()->UninstallExtension(\n      id, UNINSTALL_REASON_REINSTALL, nullptr));\n  content::RunAllTasksUntilIdle();\n  std::string bytes;\n  ASSERT_TRUE(base::ReadFileToString(own.AppendASCII(\"index\"), &bytes));\n  EXPECT_EQ(\"installed generation\", bytes);\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nINSTANTIATE_TEST_SUITE_P(All,\n                         SingleRulesetTest,\n                         ::testing::Values(ExtensionLoadType::PACKED,\n"
      },
