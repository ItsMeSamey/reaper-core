substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ \ \ <<\ message_;\

      \}\

      \

      \}\ \ //\ namespace\

      '
    replace: "      << message_;\n}\n\n#if BUILDFLAG(IS_ANDROID)\nIN_PROC_BROWSER_TEST_F(DeclarativeNetRequestLazyApiResponseHeadersTest,\n                       AndroidValidResponseHeaderValues) {\n  ASSERT_TRUE(RunExtensionTest(\n      \"test_match_outcome_response_headers\",\n      {.custom_arg = \"android-valid-header-values\"}))\n      << message_;\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace\n"
