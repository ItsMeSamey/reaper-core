      \ \ \ \ \ \ \ \ Assert\.assertNotNull\(session\);\

      \

      \ \ \ \ \ \ \ \ //\ t\ =\ 0:\ Close\ port1\.\

      \ \ \ \ \ \ \ \ session\.onPortDestroying\(port1\);\

      \

      \ \ \ \ \ \ \ \ //\ t\ =\ 20s:\ Add\ port2\.\

      \ \ \ \ \ \ \ \ ShadowLooper\.idleMainLooper\(20,\ TimeUnit\.SECONDS\);\

      \ \ \ \ \ \ \ \ NativeMessageAndroidPort\ port2\ =\ new\ NativeMessageAndroidPort\(\);\

      \ \ \ \ \ \ \ \ Assert\.assertNull\(connection\.addPort\(EXT_1,\ true,\ port2\)\);\

      \

      \ \ \ \ \ \ \ \ //\ t\ =\ 25s:\ Close\ port2\.\

      \ \ \ \ \ \ \ \ ShadowLooper\.idleMainLooper\(5,\ TimeUnit\.SECONDS\);\

      \ \ \ \ \ \ \ \ session\.onPortDestroying\(port2\);\

      \

      \ \ \ \ \ \ \ \ //\ t\ =\ 60s\ \(original\ timeout\):\ only\ 35s\ since\ port2\ closed\.\ Must\ NOT\ disconnect!\

      '
    replace: "    public void testIdleDisconnectResetWhenPortAddedAndRemovedAgain() throws RemoteException {\n        NativeMessagingConnection connection =\n                new NativeMessagingConnection(TARGET_PACKAGE, mObserver);\n        mTestContext.triggerServiceConnected(mFakeBrowserService.asBinder());\n\n        NativeMessageAndroidPort port1 = new NativeMessageAndroidPort();\n        Assert.assertNull(connection.addPort(EXT_1, true, /* requireAuthorizedCompanion= */ false, port1));\n        RobolectricUtil.runAllBackgroundAndUi();\n\n        var session = connection.getSessionForTesting(EXT_1);\n        Assert.assertNotNull(session);\n\n        // t = 0: Close port1.\n        session.onPortDestroying(port1);\n\n        // t = 20s: Add port2.\n        ShadowLooper.idleMainLooper(20, TimeUnit.SECONDS);\n        NativeMessageAndroidPort port2 = new NativeMessageAndroidPort();\n        Assert.assertNull(connection.addPort(EXT_1, true, /* requireAuthorizedCompanion= */ false, port2));\n\n        // t = 25s: Close port2.\n        ShadowLooper.idleMainLooper(5, TimeUnit.SECONDS);\n        session.onPortDestroying(port2);\n\n        // t = 60s (original timeout): only 35s since port2 closed. Must NOT disconnect!\n"
