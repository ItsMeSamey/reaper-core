.assertNotNull(mManager.getConnectionForTesting(TARGET_PACKAGE));\n    }\n\n    @Test\n    public void testAuthorizedManagersKeepOriginalAndOtrProfilesSeparate() {\n        Profile otr = Mockito.mock(Profile.class);\n        Mockito.when(otr.getOriginalProfile()).thenReturn(mProfile);\n        NativeMessagingManager regular = NativeMessagingManager.getForProfile(mProfile, true);\n        NativeMessagingManager incognito = NativeMessagingManager.getForProfile(otr, true);\n        try {\n            Assert.assertNotSame(regular, incognito);\n            Assert.assertSame(regular, NativeMessagingManager.getForProfile(mProfile, true));\n            Assert.assertSame(incognito, NativeMessagingManager.getForProfile(otr, true));\n            Assert.assertNotSame(mManager, regular);\n        } finally {\n            regular.destroy();\n            incognito.destroy();\n        }\n    }\n\n}\n"
