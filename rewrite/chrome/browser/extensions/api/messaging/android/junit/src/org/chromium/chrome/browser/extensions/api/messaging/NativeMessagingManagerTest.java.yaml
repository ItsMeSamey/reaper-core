    replace: "        if (mManager != null) {\n            mManager.destroy();\n        }\n    }\n\n    @Test\n    public void testDeniedBindReturnsUniformErrorAndAllowsRecoveryInBothRoutes() {\n        Mockito.when(mMockPackageManager.hasSigningCertificate(\n                TARGET_PACKAGE, SIGNED_CERT_BYTES, PackageManager.CERT_INPUT_SHA256)).thenReturn(true);\n\n        for (boolean requireAuthorizedCompanion : new boolean[] {false, true}) {\n            NativeMessagingManager manager =\n                    NativeMessagingManager.getForProfile(mProfile, requireAuthorizedCompanion);\n            DeniedBindingContext deniedContext = new DeniedBindingContext(mTestContext);\n            ContextUtils.initApplicationContextForTests(deniedContext);\n            byte[][] certificates = requireAuthorizedCompanion\n                    ? new byte[][] {SIGNED_CERT_BYTES} : NO_CERTIFICATES;\n            NativeMessageAndroidPort port = Mockito.mock(NativeMessageAndroidPort.class);\n            try {\n                Assert.assertEquals(\"Unable to connect to \" + TARGET_PACKAGE + \".\",\n                        manager.addPort(TARGET_PACKAGE, EXTENSION_ID, true,\n                                requireAuthorizedCompanion, certificates, port));\n                Assert.assertEquals(1, deniedContext.mBindAttempts);\n                Assert.assertEquals(TARGET_PACKAGE, deniedContext.mIntent.getPackage());\n                Assert.assertEquals(NativeMessagingConnection.ACTION_NATIVE_MESSAGING,\n                        deniedContext.mIntent.getAction());\n                Assert.assertEquals(Context.BIND_AUTO_CREATE, deniedContext.mFlags);\n                Assert.assertNull(manager.getConnectionForTesting(TARGET_PACKAGE));\n\n                NativeMessagingConnection connection = deniedContext.mConnection;\n                Assert.assertNotNull(connection);\n                Assert.assertFalse(connection.isBound());\n                Assert.assertNull(connection.getServiceForTesting());\n                Assert.assertNull(connection.getSessionForTesting(EXTENSION_ID));\n                Assert.assertEquals(\"Unable to connect to \" + TARGET_PACKAGE + \".\",\n                        connection.addPort(EXTENSION_ID, true, requireAuthorizedCompanion, port));\n\n                // A late callback on this rejected binding must not consult or authenticate a service.\n                IBinder lateBinder = Mockito.mock(IBinder.class);\n                connection.onServiceConnected(\n                        new ComponentName(TARGET_PACKAGE, \"NativeMessageService\"), lateBinder);\n                connection.unbind();\n                connection.unbind();\n                Assert.assertFalse(connection.isBound());\n                Assert.assertNull(connection.getServiceForTesting());\n                Assert.assertNull(connection.getSessionForTesting(EXTENSION_ID));\n                Assert.assertEquals(0, deniedContext.mUnbindAttempts);\n                Mockito.verifyNoInteractions(port, lateBinder);\n\n                // The failed constructor must not poison the manager's later normal bind.\n                ContextUtils.initApplicationContextForTests(mTestContext);\n                Assert.assertNull(manager.addPort(TARGET_PACKAGE, EXTENSION_ID, true,\n                        requireAuthorizedCompanion, certificates, new NativeMessageAndroidPort()));\n                NativeMessagingConnection recovered = manager.getConnectionForTesting(TARGET_PACKAGE);\n                Assert.assertNotNull(recovered);\n                Assert.assertNotSame(connection, recovered);\n                Assert.assertTrue(recovered.isBound());\n                Assert.assertNotNull(recovered.getSessionForTesting(EXTENSION_ID));\n            } finally {\n                ContextUtils.initApplicationContextForTests(mTestContext);\n                manager.destroy();\n            }\n        }\n        Mockito.verify(mMockPackageManager, Mockito.times(2)).hasSigningCertificate(\n                TARGET_PACKAGE, SIGNED_CERT_BYTES, PackageManager.CERT_INPUT_SHA256);\n    }\n\n    @Test\n    public void testConnectAndDisconnectService() {\n        String error =\n                mManager.addPort(\n                        TARGET_PACKAGE,\n                        EXTENSION_ID,\n                        /* isVerifiedExtension= */ true, /* requireAuthorizedCompanion= */ false,\n                        NO_CERTIFICATES,\n                        new NativeMessageAndroidPort());\n        Assert.assertNull(error);\n\n        NativeMessagingConnection connection = mManager.getConnectionForTesting(TARGET_PACKAGE);\n        Assert.assertNotNull(connection);\n        Assert.assertTrue(connection.isBound());\n        Assert.assertNull(connection.getServiceForTesting());\n\n        IBrowserNativeMessageService fakeService =\n                new IBrowserNativeMessageService.Stub() {\n                    @Override\n                    public void connectAuthorizedExtension(\n                            String id, android.os.Bundle info, IConnectExtensionCallback callback)\n                            throws RemoteException {\n                        callback.onError(\"Authenticated entry point unsupported by legacy fixture\");\n                    }\n\n                    @Override\n                    public void connectExtension(\n                            String extensionId,\n                            android.os.Bundle info,\n                            IConnectExtensionCallback callback)\n                            throws RemoteException {\n"
