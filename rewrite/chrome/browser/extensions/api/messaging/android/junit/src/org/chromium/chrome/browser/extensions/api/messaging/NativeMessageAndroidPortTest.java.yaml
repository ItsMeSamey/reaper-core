te() {\n        // UTF-16 character count is below 1MiB while encoded bytes exceed it.\n        String oversized = \"\\\\\"\" + \"\\\\u00e9\".repeat(524_288) + \"\\\\\"\";\n        Assert.assertThrows(IOException.class,\n                () -> NativeMessagePayloadCodec.encodeToBrowser(oversized));\n        Assert.assertThrows(IOException.class,\n                () -> NativeMessagePayloadCodec.encodeToBrowser(\"\\\\ud800\"));\n    }\n\n    @Test\n    public void testClosedAndMissingSharedMemoryVariantsAreRejected() throws Exception {\n        SharedMemory closed = SharedMemory.create(\"closed-native-message\", 8);\n        closed.close();\n        MessagePayload closedPayload = new MessagePayload();\n        closedPayload.setSharedMemory(closed);\n        Assert.assertThrows(IOException.class,\n                () -> NativeMessagePayloadCodec.decodeFromHost(closedPayload));\n        MessagePayload nullMemory = new MessagePayload();\n        nullMemory.setSharedMemory(null);\n        Assert.assertThrows(IOException.class,\n                () -> NativeMessagePayloadCodec.decodeFromHost(nullMemory));\n        Assert.assertThrows(IOException.class,\n                () -> NativeMessagePayloadCodec.decodeFromHost(null));\n    }\n\n    @Test\n    public void testSharedMemoryReplyAfterDestroyIsNotDeliveredAndDescriptorCloses()\n            throws Exception {\n        NativeMessageAndroidPort port = new NativeMessageAndroidPort();\n        TestPortObserver observer = new TestPortObserver();\n        port.setTestObserver(observer);\n        NativeMessageAndroidPort.Callback callback = new NativeMessageAndroidPort.Callback(port);\n        port.destroy();\n        SharedMemory memory = memoryWithUtf8(\"{\\\\\"late\\\\\":true}\");\n        MessagePayload payload = new MessagePayload();\n        payload.setSharedMemory(memory);\n        callback.onMessage(payload, new Bundle());\n        RobolectricUtil.runAllBackgroundAndUi();\n        Assert.assertTrue(observer.receivedMessages.isEmpty());\n        Assert.assertThrows(IllegalStateException.class, memory::mapReadOnly);\n    }\n    @Test\n    public void testBrowserEncoderExactlyMaximumSharedMemoryBodyAndOversizedControl()\n            throws Exception {\n        String body = \"\\\\\"\" + \"x\".repeat(NativeMessagePayloadCodec.MAX_TO_HOST_BYTES - 2) + \"\\\\\"\";\n        try (NativeMessagePayloadCodec.Encoded encoded =\n                NativeMessagePayloadCodec.encodeToHost(body)) {\n            Assert.assertEquals(MessagePayload.sharedMemory, encoded.payload.getTag());\n            Assert.assertEquals(NativeMessagePayloadCodec.MAX_TO_HOST_BYTES, encoded.byteLength);\n            SharedMemory memory = encoded.payload.getSharedMemory();\n            Assert.assertEquals(NativeMessagePayloadCodec.MAX_TO_HOST_BYTES, memory.getSize());\n            // The actual protected region, not only the length calculation, was produced.\n            Assert.assertThrows(ErrnoException.class, memory::mapReadWrite);\n        }\n        Assert.assertThrows(IOException.class,\n                () -> NativeMessagePayloadCodec.encodeToHost(body + \" \"));\n    }\n\n    private static void disposeOwnedPayload(@Nullable MessagePayload payload) {\n        if (payload != null && payload.getTag() == MessagePayload.sharedMemory\n                && payload.getSharedMemory() != null) payload.getSharedMemory().close();\n    }\n\n    @Test\n    public void testLocalDelegateCanDecodeLargeFrameAfterBrowserSendReturns() throws Exception {\n        String body = \"\\\\\"\" + \"x\".repeat(70_000) + \"\\\\\"\";\n        MessagePayload[] received = new MessagePayload[1];\n        IExtensionNativeMessagePort local = new IExtensionNativeMessagePort.Stub() {\n            @Override\n            public void postMessage(MessagePayload payload, Bundle extras) {\n                received[0] = payload;\n            }\n            @Override\n            public void disconnect() {}\n        };\n        NativeMessageAndroidPort port = new NativeMessageAndroidPort();\n        port.onConnected(local);\n        try {\n            port.forwardMessageToApp(body);\n            Assert.assertNotNull(received[0]);\n            Assert.assertEquals(MessagePayload.sharedMemory, received[0].getTag());\n            // The browser's Encoded sender has already closed before delayed decoding.\n            Assert.assertEquals(body, NativeMessagePayloadCodec.decodeFromBrowser(received[0]));\n            Assert.assertThrows(\n                    IllegalStateException.class, received[0].getSharedMemory()::mapReadOnly);\n        } finally {\n            disposeOwnedPayload(received[0]);\n        }\n    }\n\n    @Test\n    public void testLocalDelegateOwnsRetainedFrameAfterPostMessageThrows() throws Exception {\n        String body = \"\\\\\"\" + \"x\".repeat(70_000) + \"\\\\\"\";\n        MessagePayload[] received = new MessagePayload[1];\n        IExtensionNativeMessagePort local = new IExtensionNativeMessagePort.Stub() {\n            @Override\n            public void postMessage(MessagePayload payload, Bundle extras) throws RemoteException {\n                received[0] = payload;\n                throw new RemoteException(\"Admitted before failure\");\n            }\n            @Override\n            public void disconnect() {}\n        };\n        NativeMessageAndroidPort port = new NativeMessageAndroidPort();\n        TestPortObserver observer = new TestPortObserver();\n        port.setTestObserver(observer);\n        port.onConnected(local);\n        try {\n            port.forwardMessageToApp(body);\n            Assert.assertNotNull(observer.closedError);\n            Assert.assertNotNull(received[0]);\n            Assert.assertEquals(body, NativeMessagePayloadCodec.decodeFromBrowser(received[0]));\n        } finally {\n            disposeOwnedPayload(received[0]);\n        }\n    }\n\n    @Test\n    public void testRejectedLocalFrameIsConsumedAndClosesChannel() throws Exception {\n        String body = \"\\\\\"\" + \"x\".repeat(70_000) + \"\\\\\"\";\n        MessagePayload[] rejected = new MessagePayload[1];\n        IExtensionNativeMessagePort local = new IExtensionNativeMessagePort.Stub() {\n            @Override\n            public void postMessage(MessagePayload payload, Bundle extras) {\n                rejected[0] = payload;\n                try {\n                    throw new SecurityException(\"Local SDK authorization/session rejected\");\n                } finally {\n                    // This models the SDK's fresh-owned-frame rejection contract.\n                    disposeOwnedPayload(payload);\n                }\n            }\n            @Override\n            public void disconnect() {\n                throw new SecurityException(\"The same local SDK grant is still rejected\");\n            }\n        };\n        NativeMessageAndroidPort port = new NativeMessageAndroidPort();\n        TestPortObserver observer = new TestPortObserver() {\n            @Override\n            public void onChannelClosed(String errorMessage) {\n                super.onChannelClosed(errorMessage);\n                // Model the native channel teardown, which invokes Java destroy().\n                port.destroy();\n            }\n        };\n        port.setObserver(observer);\n        port.setTestObserver(observer);\n        port.onConnected(local);\n        try {\n            port.forwardMessageToApp(body);\n            Assert.assertNotNull(observer.closedError);\n            Assert.assertTrue(observer.isPortDestroyed);\n            Assert.assertNotNull(rejected[0]);\n            Assert.assertThrows(\n                    IllegalStateException.class, rejected[0].getSharedMemory()::mapReadOnly);\n        } finally {\n            disposeOwnedPayload(rejected[0]);\n        }\n    }\n\n    @Test\n    public void testGeneratedProxyRetainsMarshalledFrameAfterBrowserSenderClose() throws Exception {\n        String body = \"\\\\\"\" + \"x\".repeat(70_000) + \"\\\\\"\";\n        MessagePayload[] received = new MessagePayload[1];\n        IExtensionNativeMessagePort recipient = new IExtensionNativeMessagePort.Stub() {\n            @Override\n            public void postMessage(MessagePayload payload, Bundle extras) {\n                received[0] = payload;\n            }\n            @Override\n            public void disconnect() {}\n        };\n        // Force the generated Proxy/Stub Parcel route; this is not real cross-process IPC.\n        IBinder remoteFacade = new Binder() {\n            @Override\n            public IInterface queryLocalInterface(String descriptor) { return null; }\n            @Override\n            protected boolean onTransact(int code, Parcel data, Parcel reply, int flags)\n                    throws RemoteException {\n                return recipient.asBinder().transact(code, data, reply, flags);\n            }\n        };\n        NativeMessageAndroidPort port = new NativeMessageAndroidPort();\n        port.onConnected(IExtensionNativeMessagePort.Stub.asInterface(remoteFacade));\n        try {\n            port.forwardMessageToApp(body);\n            Assert.assertNotNull(received[0]);\n            Assert.assertEquals(body, NativeMessagePayloadCodec.decodeFromBrowser(received[0]));\n            Assert.assertThrows(\n                    IllegalStateException.class, received[0].getSharedMemory()::mapReadOnly);\n        } finally {\n            disposeOwnedPayload(received[0]);\n        }\n    }\n\n}\n"
