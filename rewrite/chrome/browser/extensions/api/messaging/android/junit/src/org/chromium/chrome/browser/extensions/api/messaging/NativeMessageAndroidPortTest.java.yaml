  regex:
    pattern: "    private static class TestContext extends ContextWrapper {"
    replace: "    /**\n     * Records real close/protection requests missing from the host SharedMemory shadow.\n     * Backing-file bytes and Parcel ownership still use Robolectric; this is not kernel proof.\n     */\n    @Implements(SharedMemory.class)\n    public static class RecordingSharedMemory extends ShadowSharedMemory {\n        private static final int ALL_PROTECTIONS =\n                OsConstants.PROT_READ | OsConstants.PROT_WRITE | OsConstants.PROT_EXEC;\n\n        @RealObject private SharedMemory mSharedMemory;\n        private boolean mClosed;\n        private int mProtection = ALL_PROTECTIONS;\n\n        @Implementation\n        protected boolean setProtect(int prot) {\n            if (mClosed) throw new IllegalStateException(\"SharedMemory is closed\");\n            if ((prot & ~ALL_PROTECTIONS) != 0) {\n                throw new IllegalArgumentException(\"Invalid protection flags\");\n            }\n            if ((prot & ~mProtection) != 0) return false;\n            boolean accepted =\n                    Shadow.directlyOn(\n                            mSharedMemory,\n                            SharedMemory.class,\n                            \"setProtect\",\n                            ClassParameter.from(int.class, prot));\n            if (accepted) mProtection = prot;\n            return accepted;\n        }\n\n        @Implementation\n        protected void close() {\n            if (mClosed) return;\n            Shadow.directlyOn(mSharedMemory, SharedMemory.class, \"close\");\n            mClosed = true;\n        }\n\n        @Override\n        @Implementation\n        protected ByteBuffer map(int prot, int offset, int length) throws ErrnoException {\n            if (mClosed) throw new IllegalStateException(\"SharedMemory is closed\");\n            if ((prot & ~mProtection) != 0) {\n                throw new ErrnoException(\"mmap\", OsConstants.EACCES);\n            }\n            return super.map(prot, offset, length);\n        }\n    }\n\n    private static class TestContext extends ContextWrapper {"
  count: 1
