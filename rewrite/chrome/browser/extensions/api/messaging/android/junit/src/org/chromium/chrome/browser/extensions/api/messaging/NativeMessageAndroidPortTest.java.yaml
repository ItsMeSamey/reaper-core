ublic void disconnect() {}\n        };\n        port.onConnected(remote);\n        port.forwardMessageToApp(body);\n        Assert.assertEquals(List.of(body), received);\n    }\n\n    @Test\n    public void testSharedMemoryHostReplyPreservesUtf8AndClosesDescriptor() throws Exception {\n        NativeMessageAndroidPort port = new NativeMessageAndroidPort();\n        TestPortObserver observer = new TestPortObserver();\n        port.setTestObserver(observer);\n        NativeMessageAndroidPort.Callback callback = new NativeMessageAndroidPort.Callback(port);\n        String body = \"\\\\\"\" + \"x\".repeat(70_000) + \"\\\\ud83d\\\\ude00\" + \"\\\\\"\";\n        SharedMemory memory = memoryWithUtf8(body);\n        MessagePayload payload = new MessagePayload();\n        payload.setSharedMemory(memory);\n        callback.onMessage(payload, new Bundle());\n        RobolectricUtil.runAllBackgroundAndUi();\n        Assert.assertEquals(List.of(body), observer.receivedMessages);\n        Assert.assertNull(observer.closedError);\n        Assert.assertThrows(IllegalStateException.class, memory::mapReadOnly);\n    }\n\n    @Test\n    public void testOversizedSharedMemoryReplyClosesAndRejectsLateMessage() throws Exception {\n        NativeMessageAndroidPort port = new NativeMessageAndroidPort();\n        TestPortObserver observer = new TestPortObserver();\n        port.setTestObserver(observer);\n        NativeMessageAndroidPort.Callback callback = new NativeMessageAndroidPort.Callback(port);\n        SharedMemory memory = SharedMemory.create(\n                \"oversized-native-message\", NativeMessagePayloadCodec.MAX_FROM_HOST_BYTES + 1);\n        MessagePayload payload = new MessagePayload();\n        payload.setSharedMemory(memory);\n        callback.onMessage(payload, new Bundle());\n        callback.onMessage(createPayload(\"{\\\\\"late\\\\\":true}\"), new Bundle());\n        RobolectricUtil.runAllBackgroundAndUi();\n        Assert.assertTrue(observer.receivedMessages.isEmpty(