- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\

      \ \ \ \ private\ void\ send\(String\ message\)\ \{\

      \ \ \ \ \ \ \ \ assert\ mRemotePort\ !=\ null;\

      \ \ \ \ \ \ \ \ byte\[\]\ bytes\ =\ message\.getBytes\(StandardCharsets\.UTF_8\);\

      \ \ \ \ \ \ \ \ try\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/515159909\):\ Handle\ messages\ that\ exceed\ Binder\ transaction\ size\ limits\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ by\ putting\ them\ into\ SharedMemory\ instead\ of\ byte\[\]\.\

      \ \ \ \ \ \ \ \ \ \ \ \ MessagePayload\ payload\ =\ new\ MessagePayload\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ payload\.setInlineBytes\(bytes\);\

      \ \ \ \ \ \ \ \ \ \ \ \ Bundle\ extras\ =\ new\ Bundle\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ mRemotePort\.postMessage\(payload,\ extras\);\

      \ \ \ \ \ \ \ \ \ \ \ \ RecordHistogram\.recordCustomCountHistogram\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Extensions\.NativeMessaging\.Android\.SentMessageSize\.Success",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ bytes\.length,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 1,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MAX_SUCCESS_MESSAGE_SIZE_BYTES,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 50\);\

      \ \ \ \ \ \ \ \ \}\ catch\ \(TransactionTooLargeException\ e\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ RecordHistogram\.recordCustomCountHistogram\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Extensions\.NativeMessaging\.Android\.SentMessageSize\.TooLarge",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ bytes\.length,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 1,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ MAX_TOO_LARGE_MESSAGE_SIZE_BYTES,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 50\);\

      \ \ \ \ \ \ \ \ \ \ \ \ Log\.w\(TAG,\ "Failed\ to\ post\ message\ to\ external\ app:\ message\ too\ large",\ e\);\

      \ \ \ \ \ \ \ \ \ \ \ \ closeChannel\("Error\ when\ communicating\ with\ the\ native\ messaging\ host\."\);\

      \ \ \ \ \ \ \ \ \}\ catch\ \(RemoteException\ e\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ Log\.w\(TAG,\ "Failed\ to\ post\ message\ to\ external\ app",\ e\);\

      \ \ \ \ \ \ \ \ \ \ \ \ closeChannel\("Error\ when\ communicating\ with\ the\ native\ messaging\ host\."\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      '
    replace: "\n    private void send(String message) {\n        assert mRemotePort != null;\n        int byteLength = 0;\n        try (NativeMessagePayloadCodec.Encoded encoded =\n                NativeMessagePayloadCodec.encodeToHost(message)) {\n            byteLength = encoded.byteLength;\n            IExtensionNativeMessagePort target = mRemotePort;\n            // A direct local call does not marshal a recipient-owned descriptor.\n            // Transfer a fresh clone so an admitted local delegate may retain it.\n            boolean localTarget = target.asBinder().queryLocalInterface(\n                    IExtensionNativeMessagePort.DESCRIPTOR) == target;\n            MessagePayload outgoing = localTarget\n                    ? duplicateForLocalRecipient(encoded.payload) : encoded.payload;\n            // The local target consumes its clone even on rejection or exception.\n            // A generated remote Proxy marshals its own copy before returning.\n            target.postMessage(outgoing, new Bundle());\n            RecordHistogram.recordCustomCountHistogram(\n                    \"Extensions.NativeMessaging.Android.SentMessageSize.Success\",\n                    byteLength,\n                    1,\n                    MAX_SUCCESS_MESSAGE_SIZE_BYTES,\n                    50);\n        } catch (TransactionTooLargeException e) {\n            RecordHistogram.recordCustomCountHistogram(\n                    \"Extensions.NativeMessaging.Android.SentMessageSize.TooLarge\",\n                    byteLength,\n                    1,\n                    MAX_TOO_LARGE_MESSAGE_SIZE_BYTES,\n                    50);\n            Log.w(TAG, \"Failed to post native message: Binder transaction too large\", e);\n            closeChannel(\"Error when communicating with the native messaging host.\");\n        } catch (IOException | RemoteException | SecurityException e) {\n            Log.w(TAG, \"Failed to encode or post native message\", e);\n            closeChannel(\"Error when communicating with the native messaging host.\");\n        }\n    }\n\n    // The recipient owns the returned frame at invocation, including on error.\n    // Keep the Parcel live until SharedMemory.CREATOR has duplicated its descriptor.\n    private static MessagePayload duplicateForLocalRecipient(MessagePayload payload) {\n        Parcel parcel = Parcel.obtain();\n        try {\n            payload.writeToParcel(parcel, 0);\n            parcel.setDataPosition(0);\n            return MessagePayload.CREATOR.createFromParcel(parcel);\n        } finally {\n            parcel.recycle();\n        }\n    }\n\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ //\ binder\ thread\ so\ post\ a\ task\ to\ the\ UI\ thread\ where\ `mPort`\ lives\.\

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ void\ onMessage\(MessagePayload\ payload,\ Bundle\ extras\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(payload\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/515159909\):\ Support\ extracting\ messages\ from\ SharedMemory\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ byte\[\]\ messageBytes\ =\ payload\.getInlineBytes\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(messageBytes\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ String\ message\ =\ new\ String\(messageBytes,\ StandardCharsets\.UTF_8\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ThreadUtils\.postOnUiThread\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(mPort\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mPort\.postMessageFromApp\(message\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \

      '
    replace: "        // binder thread so post a task to the UI thread where `mPort` lives.\n        @Override\n        public void onMessage(MessagePayload payload, Bundle extras) {\n            try {\n                String message = NativeMessagePayloadCodec.decodeFromHost(payload);\n                ThreadUtils.postOnUiThread(\n                        () -> {\n                            if (mPort != null) {\n                                mPort.postMessageFromApp(message);\n                            }\n                        });\n            } catch (IOException e) {\n                Log.w(TAG, \"Invalid native message payload\", e);\n                ThreadUtils.postOnUiThread(\n                        () -> {\n                            NativeMessageAndroidPort port = mPort;\n                            mPort = null;\n                            if (port != null) {\n                                port.closeChannel(\n                                        \"Error when communicating with the native messaging host.\");\n                            }\n                        });\n            }\n        }\n\n"
