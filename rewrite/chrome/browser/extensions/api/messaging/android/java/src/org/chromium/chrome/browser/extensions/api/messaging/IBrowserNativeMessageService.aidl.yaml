substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ void\ connectExtension\(\

      \ \ \ \ \ \ String\ extensionId,\ in\ Bundle\ extensionInfo,\

      \ \ \ \ \ \ IConnectExtensionCallback\ callback\);\

      \}\

      '
    replace: "  void connectExtension(\n      String extensionId, in Bundle extensionInfo,\n      IConnectExtensionCallback callback);\n\n  // Appended for companions implementing the authenticated Android contract.\n  // The service MUST authenticate Binder.getCallingUid() against an explicitly\n  // trusted browser package and signing certificate, then authorize this exact\n  // extensionId and its isVerified metadata. Session and port RPCs must retain\n  // those checks. The browser never retries this request on connectExtension.\n  void connectAuthorizedExtension(\n      String extensionId, in Bundle extensionInfo,\n      IConnectExtensionCallback callback);\n}\n"
