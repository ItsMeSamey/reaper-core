      '
    replace: "        public ExtensionSession(\n                String extensionId,\n                boolean isVerifiedExtension,\n                boolean requireAuthorizedCompanion,\n                NativeMessagingConnection connection) {\n            mExtensionId = extensionId;\n            mIsVerifiedExtension = isVerifiedExtension;\n            mRequireAuthorizedCompanion = requireAuthorizedCompanion;\n            mConnection = connection;\n        }\n\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ info\.putBoolean\("isVerified",\ mIsVerifiedExtension\);\

      \ \ \ \ \ \ \ \ \ \ \ \ ConnectExtensionCallback\ callback\ =\ new\ ConnectExtensionCallback\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ try\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ browserService\.connectExtension\(mExtensionId,\ info,\ callback\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Report\ an\ error\ and\ abort\ the\ extension\ connecting\ if\ too\ much\ time\ passes\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ between\ the\ connectExtension\ call\ and\ the\ external\ app\ responding\ \(success\ or\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ error\)\ via\ `callback`\.\

      '
    replace: "            info.putBoolean(\"isVerified\", mIsVerifiedExtension);\n            ConnectExtensionCallback callback = new ConnectExtensionCallback();\n            try {\n                if (mRequireAuthorizedCompanion) {\n                    // Never fall back to the legacy entry point. Older or rejecting companions\n                    // must fail or time out without an unauthenticated connection.\n                    browserService.connectAuthorizedExtension(mExtensionId, info, callback);\n                } else {\n                    browserService.connectExtension(mExtensionId, info, callback);\n                }\n                // Report an error and abort the extension connecting if too much time passes\n                // between the connectExtension call and the external app responding (success or\n                // error) via `callback`.\n"
