- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ \}\

      \

      \ \ \ \ public\ @Nullable\ String\ addPort\(\

      \ \ \ \ \ \ \ \ \ \ \ \ String\ extensionId,\ boolean\ isVerifiedExtension,\ NativeMessageAndroidPort\ port\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(!mIsBound\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ getUnableToConnectError\(mPackageName\);\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ ExtensionSession\ session\ =\ mSessions\.get\(extensionId\);\

      \ \ \ \ \ \ \ \ if\ \(session\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ session\ =\ new\ ExtensionSession\(extensionId,\ isVerifiedExtension,\ this\);\

      \ \ \ \ \ \ \ \ \ \ \ \ mSessions\.put\(extensionId,\ session\);\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(mService\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ session\.authenticateExtensionAndConnectPorts\(mService\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ session\.addPort\(port\);\

      \ \ \ \ \ \ \ \ return\ null;\

      \ \ \ \ \}\

      \

      '
    replace: "    }\n\n    public @Nullable String addPort(\n            String extensionId,\n            boolean isVerifiedExtension,\n            boolean requireAuthorizedCompanion,\n            NativeMessageAndroidPort port) {\n        if (!mIsBound) {\n            return getUnableToConnectError(mPackageName);\n        }\n\n        ExtensionSession session = mSessions.get(extensionId);\n        if (session == null) {\n            session =\n                    new ExtensionSession(\n                            extensionId, isVerifiedExtension, requireAuthorizedCompanion, this);\n            mSessions.put(extensionId, session);\n\n        }\n\n        // Attach the port before authentication: a bound service may throw synchronously,\n        // and failure must close this port before removing its session from the connection.\n        session.addPort(port);\n        if (mService != null) {\n            session.authenticateExtensionAndConnectPorts(mService);\n        }\n        // C++ is still constructing this port; its channel is not registered yet. An inline\n        // closeChannel cannot tear down that channel, so propagate a synchronous error instead.\n        if (mSessions.get(extensionId) != session\n                || (!session.mPendingPorts.contains(port) && !session.mActivePorts.contains(port))) {\n            return getUnableToConnectError(mPackageName);\n        }\n        return null;\n    }\n\n"
