    replace: "@NullMarked\npublic class NativeMessagingManager implements Destroyable, NativeMessagingConnection.Observer {\n    private static @Nullable ProfileKeyedMap<NativeMessagingManager> sProfileMap;\n    private static @Nullable ProfileKeyedMap<NativeMessagingManager> sAuthorizedProfileMap;\n\n    private long mNativePtr;\n    private final Map<String, NativeMessagingConnection> mConnections = new HashMap<>();\n\n    /** Return the {@link NativeMessagingManager} associated with the passed in {@link Profile}. */\n    public static NativeMessagingManager getForProfile(Profile profile) {\n        return getForProfile(profile, /* requireAuthorizedCompanion= */ false);\n    }\n\n    public static NativeMessagingManager getForProfile(\n            Profile profile, boolean requireAuthorizedCompanion) {\n        ThreadUtils.assertOnUiThread();\n        if (requireAuthorizedCompanion) {\n            if (sAuthorizedProfileMap == null) {\n                sAuthorizedProfileMap =\n                        ProfileKeyedMap.createMapOfDestroyables(\n                                ProfileKeyedMap.ProfileSelection.OWN_INSTANCE);\n            }\n            return sAuthorizedProfileMap.getForProfile(profile, NativeMessagingManager::new);\n        }\n        if (sProfileMap == null) {\n            sProfileMap =\n                    ProfileKeyedMap.createMapOfDestroyables(\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
