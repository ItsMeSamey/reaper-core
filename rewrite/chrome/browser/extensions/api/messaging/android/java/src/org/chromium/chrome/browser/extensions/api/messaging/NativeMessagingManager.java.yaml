      \ \ \ \ \ \ \ \ \ \ \ \ String\ extensionId,\

      \ \ \ \ \ \ \ \ \ \ \ \ boolean\ isVerifiedExtension,\

      \ \ \ \ \ \ \ \ \ \ \ \ byte\[\]\[\]\ certificates,\

      \ \ \ \ \ \ \ \ \ \ \ \ NativeMessageAndroidPort\ port\)\ \{\

      \ \ \ \ \ \ \ \ ThreadUtils\.assertOnUiThread\(\);\

      \

      \ \ \ \ \ \ \ \ //\ If\ `certificates`\ is\ empty,\ then\ signing\ certificate\ checks\ for\ the\ external\ app\ will\ be\

      \ \ \ \ \ \ \ \ //\ skipped\.\ If\ this\ method\ is\ called\ with\ an\ empty\ `certificates`\ array,\ assume\ callers\ of\

      \ \ \ \ \ \ \ \ //\ this\ method\ have\ authorized\ it\.\

      \ \ \ \ \ \ \ \ if\ \(certificates\.length\ >\ 0\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !hasAnyMatchingSigningCertificate\(packageName,\ certificates\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ NativeMessagingConnection\.getUnableToConnectError\(packageName\);\

      '
    replace: "            String packageName,\n            String extensionId,\n            boolean isVerifiedExtension,\n            boolean requireAuthorizedCompanion,\n            byte[][] certificates,\n            NativeMessageAndroidPort port) {\n        ThreadUtils.assertOnUiThread();\n\n        // If `certificates` is empty, then signing certificate checks for the external app will be\n        // skipped only on the preserved legacy route. Generic companions always require an\n        // explicit target certificate.\n        if (requireAuthorizedCompanion && certificates.length == 0) {\n            return NativeMessagingConnection.getUnableToConnectError(packageName);\n        }\n        if (certificates.length > 0\n                && !hasAnyMatchingSigningCertificate(packageName, certificates)) {\n            return NativeMessagingConnection.getUnableToConnectError(packageName);\n"
