substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\#include\ "base/containers/span\.h"\

      \#include\ "chrome/browser/extensions/chrome_content_verifier_delegate\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      \#include\ "extensions/browser/content_verifier/content_verifier_delegate\.h"\

      \#include\ "extensions/browser/extension_registry\.h"\

      \#include\ "extensions/common/api/messaging/message\.h"\

      \#include\ "extensions/common/extension\.h"\

      \#include\ "third_party/jni_zero/default_conversions\.h"\

      \

      //\ Must\ come\ after\ all\ headers\ that\ specialize\ FromJniType\(\)\ /\ ToJniType\(\)\.\

      '
    replace: '#include "base/containers/span.h"

      #include "chrome/browser/extensions/chrome_content_verifier_delegate.h"

      #include "chrome/browser/profiles/profile.h"

      #include "extensions/browser/api/messaging/message_service.h"

      #include "extensions/browser/content_verifier/content_verifier_delegate.h"

      #include "extensions/browser/extension_registry.h"

      #include "extensions/common/api/messaging/message.h"

      #include "extensions/common/extension.h"

      #include "extensions/common/mojom/message_port.mojom.h"

      #include "third_party/jni_zero/default_conversions.h"


      // Must come after all headers that specialize FromJniType() / ToJniType().

      '
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: 'namespace\ extensions\ \{\

      \

      namespace\ \{\

      \

      //\ A\ fork\ of\ ToJavaArrayOfByteArray\ in\ base/android/jni_array\.h\ for\

      //\ `std::array<uint8_t,\ 32>`\.\

      '
    replace: "namespace extensions {\n\nnamespace {\n\n// Match NativeMessageProcessHost's maximum host-to-browser JSON body size.\nconstexpr size_t kMaximumNativeMessageSize = 1024 * 1024;\nconstexpr char kNativeMessageError[] =\n    \"Error when communicating with the native messaging host.\";\n\n// A fork of ToJavaArrayOfByteArray in base/android/jni_array.h for\n// `std::array<uint8_t, 32>`.\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\

      \ \ return\ Java_NativeMessageAndroidPort_connectToApp\(\

      \ \ \ \ \ \ env,\ java_peer_,\ profile,\ package_name,\ extension_id,\ is_verified,\

      \ \ \ \ \ \ certs_java_array\);\

      \}\

      \

      '
    replace: "\n  return Java_NativeMessageAndroidPort_connectToApp(\n      env, java_peer_, profile, package_name, extension_id, is_verified,\n      !MessageService::IsAndroidLegacyNativeMessagingExtensionId(extension_id),\n      certs_java_array);\n}\n\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\}\

      \

      void\ NativeMessageAndroidPort::DispatchOnMessage\(Message\ message\)\ \{\

      \ \ Java_NativeMessageAndroidPort_forwardMessageToApp\(\

      \ \ \ \ \ \ base::android::AttachCurrentThread\(\),\ java_peer_,\ message\.data\(\)\);\

      \}\

      \

      void\ NativeMessageAndroidPort::PostMessageFromApp\(const\ std::string\&\ message\)\ \{\

      \ \ if\ \(weak_channel_delegate_\)\ \{\

      \ \ \ \ weak_channel_delegate_\->PostMessage\(\

      \ \ \ \ \ \ \ \ port_id_,\ Message\(message,\ /\*user_gesture=\*/false\)\);\

      '
    replace: "}\n\nvoid NativeMessageAndroidPort::DispatchOnMessage(Message message) {\n  // Enforce the existing extension bound before converting to a Java String.\n  if (message.data().size() > mojom::kMaxMessageBytes) {\n    CloseChannel(kNativeMessageError);\n    return;\n  }\n  Java_NativeMessageAndroidPort_forwardMessageToApp(\n      base::android::AttachCurrentThread(), java_peer_, message.data());\n}\n\nvoid NativeMessageAndroidPort::PostMessageFromApp(const std::string& message) {\n  if (message.size() > kMaximumNativeMessageSize) {\n    CloseChannel(kNativeMessageError);\n    return;\n  }\n  if (weak_channel_delegate_) {\n    weak_channel_delegate_->PostMessage(\n        port_id_, Message(message, /*user_gesture=*/false));\n"
