substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \]\

      \ \ resources_package\ =\ "org\.chromium\.chrome\.browser\.extensions\.api\.messaging"\

      \ \ sources\ =\ \[\

      \ \ \ \ "java/src/org/chromium/chrome/browser/extensions/api/messaging/NativeMessageAndroidPort\.java",\

      \ \ \ \ "java/src/org/chromium/chrome/browser/extensions/api/messaging/NativeMessagingConnection\.java",\

      \ \ \ \ "java/src/org/chromium/chrome/browser/extensions/api/messaging/NativeMessagingManager\.java",\

      '
    replace: "  ]\n  resources_package = \"org.chromium.chrome.browser.extensions.api.messaging\"\n  sources = [\n    \"//brave/browser/extensions/api/messaging/android/java/src/org/chromium/chrome/browser/extensions/api/messaging/NativeMessagePayloadCodec.java\",\n    \"java/src/org/chromium/chrome/browser/extensions/api/messaging/NativeMessageAndroidPort.java\",\n    \"java/src/org/chromium/chrome/browser/extensions/api/messaging/NativeMessagingConnection.java\",\n    \"java/src/org/chromium/chrome/browser/extensions/api/messaging/NativeMessagingManager.java\",\n"
