# Android side-panel ownership validation.
substitutions:
- description: Validate Android side-panel tab window ownership
  regex:
    re_pattern: 'base::expected<bool,\ std::string>\ SidePanelService::CloseSidePanelForTab\(\

      \ \ \ \ const\ Extension\&\ extension,\

      \ \ \ \ content::BrowserContext\*\ context,\

      \ \ \ \ int\ tab_id,\

      \ \ \ \ std::optional<int>\ window_id,\

      \ \ \ \ bool\ include_incognito_information\)\ \{\

      \ \ WindowController\*\ window\ =\ nullptr;\

      \ \ content::WebContents\*\ web_contents\ =\ nullptr;\

      \ \ if\ \(!ExtensionTabUtil::GetTabById\(tab_id,\ context,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ include_incognito_information,\
      \&window,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&web_contents,\
      /\*tab_index=\*/nullptr\)\ \|\|\

      \ \ \ \ \ \ !web_contents\)\ \{\

      \ \ \ \ return\ base::unexpected\(ErrorUtils::FormatErrorMessage\(\

      \ \ \ \ \ \ \ \ ExtensionTabUtil::kTabNotFoundError,\ base::ToString\(tab_id\)\)\);\

      \ \ \}\

      \

      \ \ //\ Retrieve\ the\ corresponding\ browser\ window,\ since\ the\ active\
      side\ panel\ for\

      \ \ //\ the\ tab\ might\ be\ a\ global\ one\.\

      \ \ BrowserWindowInterface\*\ browser_window\ =\ window\->GetBrowserWindowInterface\(\);\

      \ \ if\ \(!browser_window\)\ \{\

      \ \ \ \ return\ base::unexpected\(\

      \ \ \ \ \ \ \ \ base::StringPrintf\("No\ browser\ window\ for\ tabId:\ %d",\
      tab_id\)\);\

      \ \ \}\

      \

      \ \ //\ Check\ that\ the\ given\ `tab_id`\ belongs\ to\ the\ given\ `window_id`\.\

      \ \ if\ \(window_id\.has_value\(\)\ \&\&\ \*window_id\ !=\ window\->GetWindowId\(\)\)\
      \{\

      \ \ \ \ return\ base::unexpected\(\

      \ \ \ \ \ \ \ \ "The\ specified\ tab\ does\ not\ belong\ to\ the\ specified\
      window\."\);\

      \ \ \}\

      \

      \ \ //\ Verify\ that\ an\ active\ contextual\ side\ panel\ exists\ for\ the\
      tab\.\

      \ \ if\ \(!HasContextualPanelAvailableForTab\(extension,\ tab_id,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ \ /\*verify_options=\*/false\)\)\ \{\

      \ \ \ \ return\ base::unexpected\(base::StringPrintf\(\

      \ \ \ \ \ \ \ \ "No\ active\ tab\-specific\ side\ panel\ for\ tabId:\ %d",\
      tab_id\)\);\

      \ \ \}\

      \

      \ \ side_panel_util::CloseContextualExtensionSidePanel\(\

      \ \ \ \ \ \ browser_window,\ web_contents,\ extension\.id\(\)\);\

      \ \ return\ true;\

      \}'
    replace: "base::expected<bool, std::string> SidePanelService::CloseSidePanelForTab(\n\
      \    const Extension& extension,\n    content::BrowserContext* context,\n  \
      \  int tab_id,\n    std::optional<int> window_id,\n    bool include_incognito_information)\
      \ {\n  WindowController* window = nullptr;\n  content::WebContents* web_contents\
      \ = nullptr;\n  if (!ExtensionTabUtil::GetTabById(tab_id, context,\n       \
      \                             include_incognito_information, &window,\n    \
      \                                &web_contents, /*tab_index=*/nullptr) ||\n\
      \      !web_contents) {\n    return base::unexpected(ErrorUtils::FormatErrorMessage(\n\
      \        ExtensionTabUtil::kTabNotFoundError, base::ToString(tab_id)));\n  }\n\
      \n#if BUILDFLAG(IS_ANDROID)\n  // Prerendered contents may not have an owning\
      \ browser window.\n  if (!window) {\n    return base::unexpected(ErrorUtils::FormatErrorMessage(\n\
      \        ExtensionTabUtil::kTabNotFoundError, base::ToString(tab_id)));\n  }\n\
      #endif\n\n  // Retrieve the corresponding browser window, since the active side\
      \ panel for\n  // the tab might be a global one.\n  BrowserWindowInterface*\
      \ browser_window = window->GetBrowserWindowInterface();\n  if (!browser_window)\
      \ {\n    return base::unexpected(\n        base::StringPrintf(\"No browser window\
      \ for tabId: %d\", tab_id));\n  }\n\n  // Check that the given `tab_id` belongs\
      \ to the given `window_id`.\n  if (window_id.has_value() && *window_id != window->GetWindowId())\
      \ {\n    return base::unexpected(\n        \"The specified tab does not belong\
      \ to the specified window.\");\n  }\n\n  // Verify that an active contextual\
      \ side panel exists for the tab.\n  if (!HasContextualPanelAvailableForTab(extension,\
      \ tab_id,\n                                         /*verify_options=*/false))\
      \ {\n    return base::unexpected(base::StringPrintf(\n        \"No active tab-specific\
      \ side panel for tabId: %d\", tab_id));\n  }\n\n  side_panel_util::CloseContextualExtensionSidePanel(\n\
      \      browser_window, web_contents, extension.id());\n  return true;\n}"
