substitutions:

  - description: "Make shared WebAuthn proxy factories available on Android."
    regex:
      pattern: "#if BUILDFLAG(IS_WIN) || BUILDFLAG(IS_MAC) || BUILDFLAG(IS_LINUX)\n#include \"chrome/browser/extensions/api/web_authentication_proxy/web_authentication_proxy_api.h\""
      replace: "#if BUILDFLAG(IS_WIN) || BUILDFLAG(IS_MAC) || BUILDFLAG(IS_LINUX) || \\\n    BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/extensions/api/web_authentication_proxy/web_authentication_proxy_api.h\""

  - description: "Register the same profile-aware service factories for Android extensions."
    regex:
      pattern: "  // These APIs are intentionally not supported on desktop Android.\n#if BUILDFLAG(IS_WIN) || BUILDFLAG(IS_MAC) || BUILDFLAG(IS_LINUX)\n  extensions::WebAuthenticationProxyAPI::GetFactoryInstance();"
      replace: "#if BUILDFLAG(IS_WIN) || BUILDFLAG(IS_MAC) || BUILDFLAG(IS_LINUX) || \\\n    BUILDFLAG(IS_ANDROID)\n  extensions::WebAuthenticationProxyAPI::GetFactoryInstance();"
