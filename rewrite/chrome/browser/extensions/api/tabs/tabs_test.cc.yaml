- description: Exercise the real screenshot API for a missing tab or missing Android contents.
  regex:
    pattern: '#if BUILDFLAG(IS_CHROMEOS)

      // Ensure tabs.captureVisibleTab respects any Data Leak Prevention restrictions.'
    replace: "#if BUILDFLAG(IS_ANDROID)\nIN_PROC_BROWSER_TEST_F(ExtensionTabsTest, CaptureVisibleTabWithoutWebContents) {\n  auto extension = ExtensionBuilder(\"Screenshot\")\n                       .SetManifestVersion(3)\n                       .AddHostPermission(\"<all_urls>\")\n                       .Build();\n  // Do not detach or destroy the browser's live tab to simulate an unrealized\n  // tab: TabAndroid already has a native test constructor for that state.\n  auto tab = TabAndroid::CreateForTesting(profile(), 1234, nullptr);\n  ASSERT_EQ(nullptr, tab->GetContents());\n  testing::NiceMock<MockBrowserWindowInterface> window;\n  testing::NiceMock<MockTabListInterface> tab_list;\n  const SessionID window_id = SessionID::NewUnique();\n  ON_CALL(window, GetProfile()).WillByDefault(testing::Return(profile()));\n  ON_CALL(window, GetSessionID()).WillByDefault(testing::ReturnRef(window_id));\n  ON_CALL(window, GetType())\n      .WillByDefault(testing::Return(BrowserWindowInterface::TYPE_NORMAL));\n\
      \  ON_CALL(window, GetWindow())\n      .WillByDefault(testing::Return(browser_window_interface()->GetWindow()));\n  ui::ScopedUnownedUserData<TabListInterface> tab_list_registration(\n      window.GetUnownedUserDataHost(), tab_list);\n  BrowserExtensionWindowController controller(&window);\n  const std::string args = base::StringPrintf(\"[%d]\", window_id.id());\n\n  for (::tabs::TabInterface* active_tab :\n       {static_cast<::tabs::TabInterface*>(nullptr),\n        static_cast<::tabs::TabInterface*>(tab.get())}) {\n    ON_CALL(tab_list, GetActiveTab()).WillByDefault(testing::Return(active_tab));\n    auto function = base::MakeRefCounted<TabsCaptureVisibleTabFunction>();\n    function->set_extension(extension.get());\n    EXPECT_EQ(\"No active web contents to capture\",\n              utils::RunFunctionAndReturnError(function, args, profile()));\n  }\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionTabsTest,\n                       CaptureVisibleTabStillRequiresHostPermission) {\n  auto extension\
      \ = ExtensionBuilder(\"Screenshot without permission\")\n                       .SetManifestVersion(3)\n                       .Build();\n  ASSERT_TRUE(GetTabListInterface()->GetActiveTab());\n  ASSERT_TRUE(GetTabListInterface()->GetActiveTab()->GetContents());\n  auto function = base::MakeRefCounted<TabsCaptureVisibleTabFunction>();\n  function->set_extension(extension.get());\n  const std::string args = base::StringPrintf(\n      \"[%d]\", ExtensionTabUtil::GetWindowId(browser_window_interface()));\n  EXPECT_EQ(manifest_errors::kAllURLOrActiveTabNeeded,\n            utils::RunFunctionAndReturnError(function, args, profile()));\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n#if BUILDFLAG(IS_CHROMEOS)\n// Ensure tabs.captureVisibleTab respects any Data Leak Prevention restrictions."
