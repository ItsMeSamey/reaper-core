- description: Regress discarded true and false filters against an actual Android discard
  regex:
    re_pattern: '\#endif\ \ //\ BUILDFLAG\(ENABLE_EXTENSIONS\)\

      \

      //\ Tester\ class\ for\ the\ tabs\.zoom\*\ api\ functions\.'
    replace: "#endif  // BUILDFLAG(ENABLE_EXTENSIONS) || BUILDFLAG(IS_ANDROID)\n\n#if BUILDFLAG(IS_ANDROID)\nIN_PROC_BROWSER_TEST_F(ExtensionTabsTest, AndroidDiscardedQueryFilters) {\n  content::WebContents* contents =\n      GetTabListInterface()->OpenTab(GURL(url::kAboutBlankURL), -1,\n                                    /*foreground=*/false)->GetContents();\n  ASSERT_TRUE(content::WaitForLoadStop(contents));\n  const int tab_id = ExtensionTabUtil::GetTabId(contents);\n  auto extension = ExtensionBuilder(\"Android lifecycle filters\")\n                       .SetManifestVersion(3).Build();\n  EXPECT_TRUE(RunQueryFunction(extension.get(),\n                              R\"([{\"discarded\":true}])\").empty());\n  auto discard = base::MakeRefCounted<TabsDiscardFunction>();\n  discard->set_extension(extension.get());\n  auto result = utils::RunFunctionAndReturnSingleResult(\n      discard.get(), base::StringPrintf(\"[%d]\", tab_id), profile());\n  ASSERT_TRUE(result);\n  ASSERT_TRUE(contents->WasDiscarded());\n  auto discarded = RunQueryFunction(extension.get(),\n                                    R\"([{\"discarded\":true}])\");\n  ASSERT_EQ(1u, discarded.size());\n  EXPECT_EQ(tab_id, api_test_utils::GetInteger(discarded[0].GetDict(), \"id\"));\n  EXPECT_TRUE(api_test_utils::GetBoolean(discarded[0].GetDict(), \"discarded\"));\n  auto loaded = RunQueryFunction(extension.get(),\n                                R\"([{\"discarded\":false}])\");\n  ASSERT_EQ(1u, loaded.size());\n  EXPECT_NE(tab_id, api_test_utils::GetInteger(loaded[0].GetDict(), \"id\"));\n}\n#endif\n\n// Tester class for the tabs.zoom* api functions."
- description: Regress canceled restore and refused-discard event accuracy with real navigation state
  regex:
    re_pattern: //\ Tester\ class\ for\ the\ tabs\.zoom\*\ api\ functions\.
    replace: "#if BUILDFLAG(IS_ANDROID)\nstd::vector<bool> AndroidDiscardedChangesForTab(\n    const TestEventRouterObserver& observer,\n    Profile* profile,\n    const Extension* extension,\n    int tab_id) {\n  std::vector<bool> changes;\n  for (const auto& event : observer.all_events()) {\n    if (event->event_name != api::tabs::OnUpdated::kEventName) {\n      continue;\n    }\n    std::optional<base::ListValue> args;\n    mojom::EventFilteringInfoPtr filtering;\n    if (!event->will_dispatch_callback.Run(\n            profile, mojom::ContextType::kUnprivilegedExtension, extension,\n            nullptr, args, filtering, nullptr)) {\n      continue;\n    }\n    if (!args || args->size() != 3u) {\n      ADD_FAILURE() << \"Unexpected tabs.onUpdated arguments\";\n      continue;\n    }\n    if ((*args)[0].GetInt() != tab_id) {\n      continue;\n    }\n    const auto discarded = (*args)[1].GetDict().FindBool(\"discarded\");\n    if (discarded.has_value()) {\n      changes.push_back(*discarded);\n    }\n  }\n  return changes;\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionTabsTest,\n                       AndroidCanceledRestoreReportsDiscardedOnce) {\n  net::test_server::ControllableHttpResponse response(embedded_test_server(),\n                                                     \"/pending-restore\");\n  ASSERT_TRUE(embedded_test_server()->Start());\n  content::WebContents* contents =\n      GetTabListInterface()->OpenTab(GURL(url::kAboutBlankURL), -1,\n                                    /*foreground=*/false)->GetContents();\n  ASSERT_TRUE(content::WaitForLoadStop(contents));\n  const GURL committed_url = contents->GetLastCommittedURL();\n  const int tab_id = ExtensionTabUtil::GetTabId(contents);\n  auto extension = ExtensionBuilder(\"Canceled restore\")\n                       .SetManifestVersion(3).Build();\n  TabsWindowsAPI::Get(profile())->InitTabsEventRouter();\n  auto discard = base::MakeRefCounted<TabsDiscardFunction>();\n  discard->set_extension(extension.get());\n  ASSERT_TRUE(utils::RunFunctionAndReturnSingleResult(\n      discard.get(), base::StringPrintf(\"[%d]\", tab_id), profile()));\n  ASSERT_TRUE(contents->WasDiscarded());\n\n  TestEventRouterObserver observer(EventRouter::Get(profile()));\n  content::NavigationController::LoadURLParams params(\n      embedded_test_server()->GetURL(\"/pending-restore\"));\n  contents->GetController().LoadURLWithParams(params);\n  response.WaitForRequest();\n  ASSERT_FALSE(contents->WasDiscarded());\n  ASSERT_EQ(committed_url, contents->GetLastCommittedURL());\n  EXPECT_EQ(std::vector<bool>({false}), AndroidDiscardedChangesForTab(\n      observer, profile(), extension.get(), tab_id));\n\n  contents->Stop();\n  ASSERT_TRUE(content::WaitForLoadStop(contents));\n  EXPECT_EQ(committed_url, contents->GetLastCommittedURL());\n  EXPECT_FALSE(contents->WasDiscarded());\n  EXPECT_TRUE(RunQueryFunction(extension.get(),\n                              R\"([{\"discarded\":true}])\").empty());\n  EXPECT_EQ(std::vector<bool>({false}), AndroidDiscardedChangesForTab(\n      observer, profile(), extension.get(), tab_id));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionTabsTest,\n                       AndroidRefusedDiscardDoesNotReportStateChange) {\n  ASSERT_TRUE(embedded_test_server()->Start());\n  content::WebContents* contents =\n      GetTabListInterface()->OpenTab(\n          embedded_test_server()->GetURL(\"a.test\", \"/title1.html\"), -1,\n          /*foreground=*/false)->GetContents();\n  ASSERT_TRUE(content::WaitForLoadStop(contents));\n  const int tab_id = ExtensionTabUtil::GetTabId(contents);\n  auto extension = ExtensionBuilder(\"Refused discard\")\n                       .SetManifestVersion(3).Build();\n  TabsWindowsAPI::Get(profile())->InitTabsEventRouter();\n  TestEventRouterObserver observer(EventRouter::Get(profile()));\n  const GURL new_url = embedded_test_server()->GetURL(\"b.test\", \"/title2.html\");\n  bool attempted = false;\n  content::CommitMessageDelayer commit_delayer(\n      contents, new_url,\n      base::BindLambdaForTesting([&](content::RenderFrameHost*) {\n        // This callback runs before the speculative frame's commit IPC is\n        // processed. FrameTree refuses the discard while that commit is pending.\n        attempted = true;\n        observer.ClearEvents();\n        auto discard = base::MakeRefCounted<TabsDiscardFunction>();\n        discard->set_extension(extension.get());\n        EXPECT_EQ(base::StringPrintf(\"Cannot discard tab with id: %d.\", tab_id),\n                  utils::RunFunctionAndReturnError(\n                      discard.get(), base::StringPrintf(\"[%d]\", tab_id),\n                      profile()));\n        EXPECT_FALSE(contents->WasDiscarded());\n        EXPECT_TRUE(AndroidDiscardedChangesForTab(\n            observer, profile(), extension.get(), tab_id).empty());\n      }));\n  contents->GetController().LoadURLWithParams(\n      content::NavigationController::LoadURLParams(new_url));\n  commit_delayer.Wait();\n  ASSERT_TRUE(content::WaitForLoadStop(contents));\n  EXPECT_TRUE(attempted);\n  EXPECT_EQ(new_url, contents->GetLastCommittedURL());\n  EXPECT_FALSE(contents->WasDiscarded());\n  EXPECT_TRUE(AndroidDiscardedChangesForTab(\n      observer, profile(), extension.get(), tab_id).empty());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n// Tester class for the tabs.zoom* api functions."
