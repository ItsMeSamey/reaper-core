# Android pending Android tab lifecycle shutdown ownership.
substitutions:
- description: Use the existing pending-commit interceptor for Android discard refusal regression
  regex:
    re_pattern: \#include\ "content/public/test/browser_test_utils\.h"
    replace: '#include "content/public/test/browser_test_utils.h"

      #if BUILDFLAG(IS_ANDROID)

      #include "base/test/bind.h"

      #include "content/public/test/commit_message_delayer.h"

      #endif'
- description: Run actual frozen-state query and event regression on Android
  regex:
    re_pattern: '\#if\ BUILDFLAG\(ENABLE_EXTENSIONS\)\

      \

      IN_PROC_BROWSER_TEST_F\(ExtensionTabsTest,\ Freezing\)\ \{'
    replace: '#if BUILDFLAG(ENABLE_EXTENSIONS) || BUILDFLAG(IS_ANDROID)


      IN_PROC_BROWSER_TEST_F(ExtensionTabsTest, Freezing) {'
- description: Reuse Android TabListInterface for the existing freezing regression
  regex:
