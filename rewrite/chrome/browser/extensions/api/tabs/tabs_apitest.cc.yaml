# Connect Android split collections to model and transfer APIs.
substitutions:
- description: Run the existing MV3 worker discard/reload/auto-discardable event fixture on Android
  regex:
    re_pattern: '\#if\ BUILDFLAG\(ENABLE_EXTENSIONS\)\

      \

      //\ The\ discarded\ property\ is\ not\ yet\ supported\ on\ desktop\ Android\.\

      //\ https://crbug\.com/505306735\.\

      IN_PROC_BROWSER_TEST_F\(ExtensionApiTabTest,\ OnUpdatedDiscardedState\)\ \{\

      \ \ ASSERT_TRUE\(RunExtensionTest\("tabs/basics/discarded"\)\)\ <<\ message_;\

      \}\

      \

      \#endif\ \ //\ BUILDFLAG\(ENABLE_EXTENSIONS\)'
    replace: "IN_PROC_BROWSER_TEST_F(ExtensionApiTabTest, OnUpdatedDiscardedState) {\n  ASSERT_TRUE(RunExtensionTest(\"tabs/basics/discarded\")) << message_;\n}"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ base::test::ScopedFeatureList\ feature_list_\{\

      \ \ \ \ \ \ extensions_features::kApiTabsSplitView\};\

      \};\

      \

      //\ TODO\(https://crbug\.com/480192698\):\ Remove\ this\ restriction\ once\ split\ tabs\

      //\ are\ supported\ on\ Desktop\ Android\.\

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      IN_PROC_BROWSER_TEST_F\(ExtensionApiTabSplitViewTest,\ CreateSplitWithTabId\)\ \{\

      \ \ ASSERT_TRUE\(RunExtensionTest\("tabs/split_view_create_split_with_id"\)\)\

      \ \ \ \ \ \ <<\ message_;\

      \}\

      '
    replace: "  base::test::ScopedFeatureList feature_list_{\n      extensions_features::kApiTabsSplitView};\n};\n\nIN_PROC_BROWSER_TEST_F(ExtensionApiTabSplitViewTest, CreateSplitWithTabId) {\n  ASSERT_TRUE(RunExtensionTest(\"tabs/split_view_create_split_with_id\"))\n      << message_;\n}\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\

      IN_PROC_BROWSER_TEST_F\(ExtensionApiTabSplitViewTest,\ Unsplit\)\ \{\

      \ \ ASSERT_TRUE\(RunExtensionTest\("tabs/split_view_unsplit"\)\)\ <<\ message_;\

      \}\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: "\nIN_PROC_BROWSER_TEST_F(ExtensionApiTabSplitViewTest, Unsplit) {\n  ASSERT_TRUE(RunExtensionTest(\"tabs/split_view_unsplit\")) << message_;\n}\n"
