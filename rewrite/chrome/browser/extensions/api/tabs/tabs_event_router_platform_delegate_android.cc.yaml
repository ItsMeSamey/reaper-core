# Android pending Android tab lifecycle shutdown ownership.
substitutions:
- description: Use the existing Android graph rather than desktop tab lifecycle units
  regex:
    re_pattern: \#include\ "chrome/browser/ui/android/tab_model/tab_model_list\.h"
    replace: '#include "chrome/browser/ui/android/tab_model/tab_model_list.h"

      #include "components/performance_manager/public/graph/graph.h"

      #include "components/performance_manager/public/performance_manager.h"

      #include "content/public/browser/web_contents.h"'
- description: Register graph observation with the profile-owned tabs event router
  regex:
    re_pattern: \ \ TabModelList::AddObserver\(this\);
    replace: "  performance_manager::PerformanceManager::GetGraph()->AddPageNodeObserver(this);\n  TabModelList::AddObserver(this);"
- description: Detach lifecycle observation while tolerating prior graph teardown
  regex:
    re_pattern: \ \ TabModelList::RemoveObserver\(this\);
    replace: "  TabModelList::RemoveObserver(this);\n  if (performance_manager::PerformanceManager::IsAvailable()) {\n    performance_manager::PerformanceManager::GetGraph()->RemovePageNodeObserver(\n        this);\n  }"
- description: Ignore unrelated profiles, untracked contents and non-primary pages when delivering frozen updates
  regex:
    re_pattern: void\ TabsEventRouterPlatformDelegate::OnTabModelAdded\(TabModel\*\ tab_model\)\ \{
    replace: "void TabsEventRouterPlatformDelegate::OnPageLifecycleStateChanged(\n    const performance_manager::PageNode* page_node) {\n  content::WebContents* contents = page_node->GetWebContents().get();\n  if (!contents || !router_->GetTabEntry(*contents) ||\n      performance_manager::PerformanceManager::GetPrimaryPageNodeForWebContents(\n          contents).get() != page_node) {\n    return;\n  }\n  router_->DispatchTabUpdatedEvent(contents, {\"frozen\"});\n}\n\nvoid TabsEventRouterPlatformDelegate::OnTabModelAdded(TabModel* tab_model) {"
- description: Format modified Android tab lifecycle declarations and implementation
  regex:
    re_pattern: 'TabsEventRouterPlatformDelegate::TabsEventRouterPlatformDelegate\(\

      \ \ \ \ TabsEventRouter\&\ router,\

      \ \ \ \ Profile\&\ profile\)\

      \ \ \ \ :\ router_\(router\),\ profile_\(profile\)\ \{\

      \ \ performance_manager::PerformanceManager::GetGraph\(\)\->AddPageNodeObserver\(this\);\

      \ \ TabModelList::AddObserver\(this\);\

      \ \ for\ \(TabModel\*\ const\ model\ :\ TabModelList::models\(\)\)\ \{\

      \ \ \ \ OnTabModelAdded\(model\);\

      \ \ \}\

      '
    replace: "TabsEventRouterPlatformDelegate::TabsEventRouterPlatformDelegate(\n    TabsEventRouter& router,\n    Profile& profile)\n    : router_(router), profile_(profile) {\n  performance_manager::PerformanceManager::GetGraph()->AddPageNodeObserver(\n      this);\n  TabModelList::AddObserver(this);\n  for (TabModel* const model : TabModelList::models()) {\n    OnTabModelAdded(model);\n  }\n"
- description: Format modified Android tab lifecycle declarations and implementation
  regex:
    re_pattern: '\ \ \ \ const\ performance_manager::PageNode\*\ page_node\)\ \{\

      \ \ content::WebContents\*\ contents\ =\ page_node\->GetWebContents\(\)\.get\(\);\

      \ \ if\ \(!contents\ \|\|\ !router_\->GetTabEntry\(\*contents\)\ \|\|\

      \ \ \ \ \ \ performance_manager::PerformanceManager::GetPrimaryPageNodeForWebContents\(\

      \ \ \ \ \ \ \ \ \ \ contents\)\.get\(\)\ !=\ page_node\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \ \ router_\->DispatchTabUpdatedEvent\(contents,\ \{"frozen"\}\);\

      \}\

      '
    replace: "    const performance_manager::PageNode* page_node) {\n  content::WebContents* contents = page_node->GetWebContents().get();\n  if (!contents || !router_->GetTabEntry(*contents) ||\n      performance_manager::PerformanceManager::GetPrimaryPageNodeForWebContents(\n          contents)\n              .get() != page_node) {\n    return;\n  }\n  router_->DispatchTabUpdatedEvent(contents, {\"frozen\"});\n}\n"
