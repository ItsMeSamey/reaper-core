# Android pending Android tab lifecycle shutdown ownership.
substitutions:
- description: Observe real Android page lifecycle state
  regex:
    re_pattern: \#include\ "chrome/browser/ui/android/tab_model/tab_model_list_observer\.h"
    replace: '#include "chrome/browser/ui/android/tab_model/tab_model_list_observer.h"

      #include "components/performance_manager/public/graph/page_node.h"'
- description: Forward Android frozen-state transitions from the shared graph
  regex:
    re_pattern: class\ TabsEventRouterPlatformDelegate\ :\ public\ TabModelListObserver\ \{
    replace: "class TabsEventRouterPlatformDelegate\n    : public TabModelListObserver,\n      public performance_manager::PageNodeObserver {"
- description: Handle lifecycle updates only for tabs owned by this router
  regex:
    re_pattern: '\ private:\

      \ \ //\ The\ platform\-agnostic\ TabsEventRouter\.'
    replace: " private:\n  void OnPageLifecycleStateChanged(\n      const performance_manager::PageNode* page_node) override;\n\n  // The platform-agnostic TabsEventRouter."
