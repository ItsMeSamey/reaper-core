# Connect Android split collections to model and transfer APIs.
substitutions:
- description: Observe completion of real Android WebContents discards
  regex:
    re_pattern: \ \ \ \ void\ DidStopLoading\(\)\ override;
    replace: "    void DidStopLoading() override;\n#if BUILDFLAG(IS_ANDROID)\n    void WasDiscarded() override;\n    void DidStartLoading() override;\n#endif"
- description: Remember discarded state only for tracked Android tab contents
  regex:
    re_pattern: \ \ \ \ GURL\ url_;
    replace: "    GURL url_;\n#if BUILDFLAG(IS_ANDROID)\n    void MaybeDispatchDiscardedStateChange();\n    bool last_known_discarded_ = false;\n#endif"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ void\ DidStopLoading\(\)\ override;\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ void\ WasDiscarded\(\)\ override;\

      \ \ \ \ void\ DidStartLoading\(\)\ override;\

      \#endif\

      \ \ \ \ void\ TitleWasSet\(content::NavigationEntry\*\ entry\)\ override;\

      \ \ \ \ void\ DidUpdateAudioMutingState\(bool\ muted\)\ override;\

      \ \ \ \ void\ WebContentsDestroyed\(\)\ override;\

      '
    replace: "    void DidStopLoading() override;\n#if BUILDFLAG(IS_ANDROID)\n    void WasDiscarded() override;\n    void DidStartLoading() override;\n    bool SetSplit(std::optional<split_tabs::SplitTabId> split);\n#endif\n    void TitleWasSet(content::NavigationEntry* entry) override;\n    void DidUpdateAudioMutingState(bool muted) override;\n    void WebContentsDestroyed() override;\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\

      \ \ \ \ GURL\ url_;\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ void\ MaybeDispatchDiscardedStateChange\(\);\

      \ \ \ \ bool\ last_known_discarded_\ =\ false;\

      \#endif\

      \

      \ \ \ \ //\ Callback\ subscription\ to\ be\ notified\ as\ the\ "pinned"\ state\ changes\.\

      \ \ \ \ base::CallbackListSubscription\ pinned_state_subscription_;\

      '
    replace: "\n    GURL url_;\n#if BUILDFLAG(IS_ANDROID)\n    void MaybeDispatchDiscardedStateChange();\n    void QueueSplitPropertyUpdate(const char* property);\n    void DispatchSplitPropertyUpdates();\n    std::set<std::string> pending_split_properties_;\n    bool last_known_discarded_ = false;\n    std::optional<split_tabs::SplitTabId> last_known_split_;\n#endif\n\n    // Callback subscription to be notified as the \"pinned\" state changes.\n    base::CallbackListSubscription pinned_state_subscription_;\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ void\ OnTabMoved\(TabListInterface\&\ tab_list,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tabs::TabInterface\*\ tab,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int\ from_index,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int\ to_index\)\ override;\

      \ \ void\ OnHighlightedTabsChanged\(\

      \ \ \ \ \ \ TabListInterface\&\ tab_list,\

      \ \ \ \ \ \ const\ std::set<tabs::TabInterface\*>\&\ highlighted_tabs\)\ override;\

      \ \ void\ OnWebContentsReplaced\(TabListInterface\&\ tab_list,\

      '
    replace: "  void OnTabMoved(TabListInterface& tab_list,\n                  tabs::TabInterface* tab,\n                  int from_index,\n                  int to_index) override;\n#if BUILDFLAG(IS_ANDROID)\n  void OnSplitChanged(TabListInterface& tab_list,\n                      tabs::TabInterface* tab) override;\n#endif\n  void OnHighlightedTabsChanged(\n      TabListInterface& tab_list,\n      const std::set<tabs::TabInterface*>& highlighted_tabs) override;\n  void OnWebContentsReplaced(TabListInterface& tab_list,\n"
- description: "Retain lazy Android tab lifecycle state and observe materialization (literal 1)"
  regex:
    re_pattern: "\\#include\\ <optional>\\\n\\#include\\ <set>\\\n\\#include\\ <string>\\\n\\\n\\#include\\ \"base/memory/raw_ptr\\.h\"\\\n\\#include\\ \"base/memory/raw_ref\\.h\"\\\n"
    replace: "#include <optional>\n#include <set>\n#include <string>\n#include <vector>\n\n#include \"base/memory/raw_ptr.h\"\n#include \"base/memory/raw_ref.h\"\n"
- description: "Retain lazy Android tab lifecycle state and observe materialization (literal 2)"
  regex:
    re_pattern: "\\#include\\ \"url/gurl\\.h\"\\\n\\\n\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\#include\\ \"chrome/browser/extensions/api/tabs/tabs_event_router_platform_delegate_android\\.h\"\\\n\\#else\\\n\\#include\\ \"chrome/browser/extensions/api/tabs/tabs_event_router_platform_delegate_non_android\\.h\"\\\n"
    replace: "#include \"url/gurl.h\"\n\n#if BUILDFLAG(IS_ANDROID)\n#include \"base/scoped_observation.h\"\n#include \"chrome/browser/android/tab_android.h\"\n#include \"chrome/browser/extensions/api/tabs/tabs_event_router_platform_delegate_android.h\"\n#else\n#include \"chrome/browser/extensions/api/tabs/tabs_event_router_platform_delegate_non_android.h\"\n"
- description: "Retain lazy Android tab lifecycle state and observe materialization (literal 3)"
  regex:
    re_pattern: "\\\n\\ \\ \\ \\ base::WeakPtrFactory<TabEntry>\\ weak_factory_\\{this\\};\\\n\\ \\ \\};\\\n\\\n\\ \\ //\\ Returns\\ true\\ if\\ the\\ event\\ router\\ should\\ track\\ the\\ given\\ `browser`\\.\\\n\\ \\ bool\\ ShouldTrackBrowser\\(BrowserWindowInterface\\&\\ browser\\);\\\n"
    replace: "\n    base::WeakPtrFactory<TabEntry> weak_factory_{this};\n  };\n\n#if BUILDFLAG(IS_ANDROID)\n  // A lazy Android tab has a native handle and an index, but no extension\n  // session ID until its first WebContents is initialized.\n  friend class AndroidTabsLazyRestoreTest;\n\n  class PendingTab : public TabAndroid::Observer {\n   public:\n    PendingTab(TabsEventRouter& router, TabAndroid& tab,\n               TabListInterface& tab_list, int index, bool created);\n    ~PendingTab() override;\n\n    void OnInitWebContents(TabAndroid* tab) override;\n    void OnTabAndroidDestroyed(TabAndroid* tab) override;\n\n    struct Event {\n      events::HistogramValue histogram;\n      std::string name;\n      base::DictValue properties;\n    };\n\n    raw_ptr<TabListInterface> tab_list;\n    int index;\n    bool created;\n    std::vector<Event> deferred_events;\n    std::set<std::string> changed_properties;\n\n   private:\n    raw_ref<TabsEventRouter> router_;\n    base::ScopedObservation<TabAndroid, TabAndroid::Observer> observation_{this};\n    base::CallbackListSubscription pinned_subscription_;\n    base::CallbackListSubscription group_subscription_;\n  };\n\n  PendingTab* GetPendingTab(tabs::TabInterface& tab);\n  void MaterializeTab(TabAndroid& tab);\n  void DispatchPendingHighlights();\n\n  std::map<tabs::TabHandle, std::unique_ptr<PendingTab>> pending_tabs_;\n  std::map<TabListInterface*, std::set<tabs::TabHandle>> pending_highlights_;\n#endif\n\n  // Returns true if the event router should track the given `browser`.\n  bool ShouldTrackBrowser(BrowserWindowInterface& browser);\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 1)"
  regex:
    re_pattern: "\\ \\ //\\ \\ \\-\\ remember\\ last\\ muted\\ and\\ audible\\ states\\ to\\ know\\ if\\ there\\ was\\ a\\ change\\\n\\ \\ //\\ \\ \\-\\ listen\\ to\\ WebContentsObserver\\ notifications\\ and\\ forward\\ them\\ to\\ the\\\n\\ \\ //\\ \\ \\ \\ event\\ router\\.\\\n\\ \\ class\\ TabEntry\\ :\\ public\\ content::WebContentsObserver\\ \\{\\\n\\ \\ \\ public:\\\n\\ \\ \\ \\ //\\ Create\\ a\\ TabEntry\\ associated\\ with,\\ and\\ tracking\\ state\\ changes\\ to,\\\n\\ \\ \\ \\ //\\ `contents`\\.\\\n"
    replace: "  //  - remember last muted and audible states to know if there was a change\n  //  - listen to WebContentsObserver notifications and forward them to the\n  //    event router.\n  class TabEntry : public content::WebContentsObserver\n#if BUILDFLAG(IS_ANDROID)\n                 , public TabAndroid::Observer\n#endif\n  {\n   public:\n    // Create a TabEntry associated with, and tracking state changes to,\n    // `contents`.\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 2)"
  regex:
    re_pattern: "\\ \\ \\ \\ void\\ WasDiscarded\\(\\)\\ override;\\\n\\ \\ \\ \\ void\\ DidStartLoading\\(\\)\\ override;\\\n\\ \\ \\ \\ bool\\ SetSplit\\(std::optional<split_tabs::SplitTabId>\\ split\\);\\\n\\#endif\\\n\\ \\ \\ \\ void\\ TitleWasSet\\(content::NavigationEntry\\*\\ entry\\)\\ override;\\\n\\ \\ \\ \\ void\\ DidUpdateAudioMutingState\\(bool\\ muted\\)\\ override;\\\n"
    replace: "    void WasDiscarded() override;\n    void DidStartLoading() override;\n    bool SetSplit(std::optional<split_tabs::SplitTabId> split);\n    void OnInitWebContents(TabAndroid* tab) override {}\n    void OnWillDetachWebContents(TabAndroid* tab,\n                                 bool keep_session_id) override;\n    void OnTabAndroidDestroyed(TabAndroid* tab) override;\n#endif\n    void TitleWasSet(content::NavigationEntry* entry) override;\n    void DidUpdateAudioMutingState(bool muted) override;\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 3)"
  regex:
    re_pattern: "\\ \\ \\ \\ std::set<std::string>\\ pending_split_properties_;\\\n\\ \\ \\ \\ bool\\ last_known_discarded_\\ =\\ false;\\\n\\ \\ \\ \\ std::optional<split_tabs::SplitTabId>\\ last_known_split_;\\\n\\#endif\\\n\\\n\\ \\ \\ \\ //\\ Callback\\ subscription\\ to\\ be\\ notified\\ as\\ the\\ \"pinned\"\\ state\\ changes\\.\\\n"
    replace: "    std::set<std::string> pending_split_properties_;\n    bool last_known_discarded_ = false;\n    std::optional<split_tabs::SplitTabId> last_known_split_;\n    base::ScopedObservation<TabAndroid, TabAndroid::Observer>\n        native_observation_{this};\n#endif\n\n    // Callback subscription to be notified as the \"pinned\" state changes.\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 4)"
  regex:
    re_pattern: "\\ \\ \\};\\\n\\\n\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\ \\ //\\ A\\ lazy\\ Android\\ tab\\ has\\ a\\ native\\ handle\\ and\\ an\\ index,\\ but\\ no\\ extension\\\n\\ \\ //\\ session\\ ID\\ until\\ its\\ first\\ WebContents\\ is\\ initialized\\.\\\n\\ \\ friend\\ class\\ AndroidTabsLazyRestoreTest;\\\n\\\n\\ \\ class\\ PendingTab\\ :\\ public\\ TabAndroid::Observer\\ \\{\\\n\\ \\ \\ public:\\\n\\ \\ \\ \\ PendingTab\\(TabsEventRouter\\&\\ router,\\ TabAndroid\\&\\ tab,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ TabListInterface\\&\\ tab_list,\\ int\\ index,\\ bool\\ created\\);\\\n\\ \\ \\ \\ \\~PendingTab\\(\\)\\ override;\\\n\\\n\\ \\ \\ \\ void\\ OnInitWebContents\\(TabAndroid\\*\\ tab\\)\\ override;\\\n\\ \\ \\ \\ void\\ OnTabAndroidDestroyed\\(TabAndroid\\*\\ tab\\)\\ override;\\\n\\\n\\ \\ \\ \\ struct\\ Event\\ \\{\\\n\\ \\ \\ \\ \\ \\ events::HistogramValue\\ histogram;\\\n\\ \\ \\ \\ \\ \\ std::string\\ name;\\\n\\ \\ \\ \\ \\ \\ base::DictValue\\ properties;\\\n\\ \\ \\ \\ \\};\\\n\\\n\\ \\ \\ \\ raw_ptr<TabListInterface>\\ tab_list;\\\n\\ \\ \\ \\ int\\ index;\\\n\\ \\ \\ \\ bool\\ created;\\\n\\ \\ \\ \\ std::vector<Event>\\ deferred_events;\\\n\\ \\ \\ \\ std::set<std::string>\\ changed_properties;\\\n\\\n\\ \\ \\ private:\\\n\\ \\ \\ \\ raw_ref<TabsEventRouter>\\ router_;\\\n\\ \\ \\ \\ base::ScopedObservation<TabAndroid,\\ TabAndroid::Observer>\\ observation_\\{this\\};\\\n\\ \\ \\ \\ base::CallbackListSubscription\\ pinned_subscription_;\\\n\\ \\ \\ \\ base::CallbackListSubscription\\ group_subscription_;\\\n\\ \\ \\};\\\n\\\n\\ \\ PendingTab\\*\\ GetPendingTab\\(tabs::TabInterface\\&\\ tab\\);\\\n\\ \\ void\\ MaterializeTab\\(TabAndroid\\&\\ tab\\);\\\n\\ \\ void\\ DispatchPendingHighlights\\(\\);\\\n\\\n\\ \\ std::map<tabs::TabHandle,\\ std::unique_ptr<PendingTab>>\\ pending_tabs_;\\\n\\ \\ std::map<TabListInterface\\*,\\ std::set<tabs::TabHandle>>\\ pending_highlights_;\\\n\\#endif\\\n\\\n\\ \\ //\\ Returns\\ true\\ if\\ the\\ event\\ router\\ should\\ track\\ the\\ given\\ `browser`\\.\\\n"
    replace: "  };\n\n#if BUILDFLAG(IS_ANDROID)\n  // Lazy native tabs retain their stable session ID and structural state;\n  // contents-dependent subscriptions attach only after materialization.\n  friend class AndroidTabsLazyRestoreTest;\n\n  class PendingTab : public TabAndroid::Observer {\n   public:\n    PendingTab(TabsEventRouter& router, TabAndroid& tab,\n               TabListInterface* tab_list, int index);\n    ~PendingTab() override;\n\n    void OnInitWebContents(TabAndroid* tab) override;\n    void OnTabAndroidDestroyed(TabAndroid* tab) override;\n\n    raw_ptr<TabListInterface> tab_list;\n    int index;\n    std::set<std::string> changed_properties;\n    std::optional<split_tabs::SplitTabId> last_known_split;\n\n   private:\n    void PropertyChanged(tabs::TabInterface& tab, const char* property);\n    void DispatchProperties();\n    raw_ref<TabsEventRouter> router_;\n    base::ScopedObservation<TabAndroid, TabAndroid::Observer> observation_{this};\n    base::CallbackListSubscription pinned_subscription_;\n    base::CallbackListSubscription group_subscription_;\n    tabs::TabHandle handle_;\n    base::WeakPtrFactory<PendingTab> weak_factory_{this};\n  };\n\n  PendingTab* GetPendingTab(tabs::TabInterface& tab);\n  void MaterializeTab(TabAndroid& tab);\n\n  std::map<tabs::TabHandle, std::unique_ptr<PendingTab>> pending_tabs_;\n#endif\n\n  // Returns true if the event router should track the given `browser`.\n"
