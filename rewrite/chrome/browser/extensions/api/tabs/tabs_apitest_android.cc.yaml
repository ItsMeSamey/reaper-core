      replace: "    base::android::CheckException(env);\n    CHECK(!restored.is_null());\n    return TabAndroid::GetNativeTab(env, restored);\n  }\n\n  TabAndroid* CreatePendingBackgroundTab(const std::string& url) {\n    auto* model = static_cast<TabModel*>(GetTabListInterface());\n    JNIEnv* env = base::android::AttachCurrentThread();\n    auto java_model = model->GetJavaObject();\n    auto model_class = jni_zero::AdoptRef(env, env->GetObjectClass(java_model.obj()));\n    jmethodID get_creator = env->GetMethodID(model_class.obj(), \"getTabCreator\",\n        \"()Lorg/chromium/chrome/browser/tabmodel/TabCreator;\");\n    CHECK(get_creator);\n    auto creator = jni_zero::AdoptRef(\n        env, env->CallObjectMethod(java_model.obj(), get_creator));\n    base::android::CheckException(env);\n    auto params_class = base::android::GetClass(\n        env, \"org/chromium/content_public/browser/LoadUrlParams\");\n    jmethodID ctor = env->GetMethodID(params_class.obj(), \"<init>\", \"(Ljava/lang/String;)V\");\n    CHECK(ctor);\n    auto java_url = base::android::ConvertUTF8ToJavaString(env, url);\n    auto params = jni_zero::AdoptRef(\n        env, env->NewObject(params_class.obj(), ctor, java_url.obj()));\n    base::android::CheckException(env);\n    auto creator_class = jni_zero::AdoptRef(env, env->GetObjectClass(creator.obj()));\n    jmethodID create = env->GetMethodID(creator_class.obj(), \"createNewTab\",\n        \"(Lorg/chromium/content_public/browser/LoadUrlParams;I\"\n        \"Lorg/chromium/chrome/browser/tab/Tab;)Lorg/chromium/chrome/browser/tab/Tab;\");\n    CHECK(create);\n    // This genuine sync-background branch uses TabBuilder.createForLazyLoad\n    // regardless of device memory class, in the ordinary standard model.\n    auto tab = jni_zero::AdoptRef(env, env->CallObjectMethod(\n        creator.obj(), create, params.obj(),\n        static_cast<int>(TabModel::TabLaunchType::FROM_SYNC_BACKGROUND),\n        static_cast<jobject>(nullptr)));\n    base::android::CheckException(env);\n    CHECK(!tab.is_null());\n    return TabAndroid::GetNativeTab(env, tab);\n  }\n\n  void CloseCurrentUponExit(TabAndroid& survivor) {\n    auto* model = static_cast<TabModel*>(GetTabListInterface());\n    auto* current = model->GetTabAt(model->GetActiveIndex());\n    CHECK(current && current != &survivor);\n    JNIEnv* env = base::android::AttachCurrentThread();\n    auto java_model = model->GetJavaObject();\n    auto model_class = jni_zero::AdoptRef(env, env->GetObjectClass(java_model.obj()));\n    jmethodID get_remover = env->GetMethodID(\n        model_class.obj(), \"getTabRemover\",\n        \"()Lorg/chromium/chrome/browser/tabmodel/TabRemover;\");\n    CHECK(get_remover);\n    auto remover = jni_zero::AdoptRef(\n        env, env->CallObjectMethod(java_model.obj(), get_remover));\n    base::android::CheckException(env);\n    auto params_class = base::android::GetClass(\n        env, \"org/chromium/chrome/browser/tabmodel/TabClosureParams\");\n    jmethodID close_tab = env->GetStaticMethodID(\n        params_class.obj(), \"closeTab\", \"(Lorg/chromium/chrome/browser/tab/Tab;)\"\n        \"Lorg/chromium/chrome/browser/tabmodel/TabClosureParams$CloseTabBuilder;\");\n    CHECK(close_tab);\n    auto builder = jni_zero::AdoptRef(env, env->CallStaticObjectMethod(\n        params_class.obj(), close_tab, current->GetJavaObject().obj()));\n    base::android::CheckException(env);\n    auto builder_class = jni_zero::AdoptRef(env, env->GetObjectClass(builder.obj()));\n    jmethodID recommend = env->GetMethodID(\n        builder_class.obj(), \"recommendedNextTab\",\n        \"(Lorg/chromium/chrome/browser/tab/Tab;)\"\n        \"Lorg/chromium/chrome/browser/tabmodel/TabClosureParams$CloseTabBuilder;\");\n    jmethodID upon_exit = env->GetMethodID(builder_class.obj(), \"uponExit\",\n        \"(Z)Lorg/chromium/chrome/browser/tabmodel/TabClosureParams$CloseTabBuilder;\");\n    jmethodID allow_undo = env->GetMethodID(builder_class.obj(), \"allowUndo\",\n        \"(Z)Lorg/chromium/chrome/browser/tabmodel/TabClosureParams$CloseTabBuilder;\");\n    CHECK(recommend && upon_exit && allow_undo);\n    auto recommended = jni_zero::AdoptRef(env, env->CallObjectMethod(\n        builder.obj(), recommend, survivor.GetJavaObject().obj()));\n    auto exiting = jni_zero::AdoptRef(\n        env, env->CallObjectMethod(builder.obj(), upon_exit, true));\n    auto no_undo = jni_zero::AdoptRef(\n        env, env->CallObjectMethod(builder.obj(), allow_undo, false));\n    base::android::CheckException(env);\n    jmethodID build = env->GetMethodID(builder_class.obj(), \"build\",\n        \"()Lorg/chromium/chrome/browser/tabmodel/TabClosureParams;\");\n    CHECK(build);\n    auto params = jni_zero::AdoptRef(env, env->CallObjectMethod(builder.obj(), build));\n    base::android::CheckException(env);\n    auto remover_class = jni_zero::AdoptRef(env, env->GetObjectClass(remover.obj()));\n    jmethodID close = env->GetMethodID(remover_class.obj(), \"closeTabs\",\n        \"(Lorg/chromium/chrome/browser/tabmodel/TabClosureParams;Z\"\n        \"Lorg/chromium/chrome/browser/tabmodel/TabModelActionListener;)V\");\n    CHECK(close);\n    env->CallVoidMethod(remover.obj(), close, params.obj(), false, nullptr);\n    base::android::CheckException(env);\n  }\n\n  TabsEventRouter& StartRouter() {\n"
