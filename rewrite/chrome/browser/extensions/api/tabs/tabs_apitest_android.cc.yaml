      replace: "\nIN_PROC_BROWSER_TEST_F(AndroidTabsLazyRestoreTest,\n                       RealEagerWindowTransferKeepsIdentityAndSingleEventPair) {\n  if (!SupportsRealMultiInstanceWindows()) {\n    GTEST_SKIP() << \"Requires actual Android multi-instance SDK/manifest support; \"\n                    \"must also execute on a supported multi-instance device.\";\n  }\n  auto* source_list = GetTabListInterface();\n  auto* source_window = source_list->GetActiveTab()->GetBrowserWindowInterface();\n  ASSERT_TRUE(source_window);\n  Profile* source_profile = source_window->GetProfile();\n  auto* destination_window = CreateRealWindow(*source_profile);\n  ASSERT_TRUE(destination_window);\n  auto* destination_list = TabListInterface::From(destination_window);\n  ASSERT_TRUE(destination_list);\n  ASSERT_NE(source_list, destination_list);\n  ASSERT_NE(source_window->GetSessionID(), destination_window->GetSessionID());\n  ASSERT_EQ(source_profile, destination_window->GetProfile());\n  auto* eager = source_list->OpenTab(GURL(\"about:blank\"),\n                                    source_list->GetTabCount(), false);\n  ASSERT_TRUE(eager && eager->GetContents());\n  auto* android_tab = TabAndroid::FromTabInterface(eager);\n  ASSERT_TRUE(android_tab);\n  const auto handle = eager->GetHandle();\n  const int android_id = android_tab->GetAndroidId();\n  const int id = ExtensionTabUtil::GetTabId(*eager);\n  auto* contents = eager->GetContents();\n  const int old_window = ExtensionTabUtil::GetWindowIdOfTab(*eager);\n  const int old_index = source_list->GetIndexOfTab(handle);\n  const int source_count = source_list->GetTabCount();\n  const int destination_count = destination_list->GetTabCount();\n  auto& router = StartRouter();\n  ASSERT_TRUE(HasTrackedID(router, id));\n  TestEventRouterObserver events(EventRouter::Get(source_profile));\n  AndroidRealTabTransferObserver transfer(*source_list, *destination_list, handle);\n  source_list->MoveTabToWindow(handle, destination_window->GetSessionID(),\n                                destination_count);\n  ASSERT_TRUE(transfer.Wait());\n  ASSERT_EQ(eager, handle.Get());\n  EXPECT_EQ(1u, transfer.removed_count());\n  EXPECT_EQ(1u, transfer.added_count());\n  EXPECT_TRUE(transfer.added_with_contents());\n  EXPECT_EQ(destination_count, transfer.added_index());\n  EXPECT_EQ(source_count - 1, source_list->GetTabCount());\n  EXPECT_EQ(destination_count + 1, destination_list->GetTabCount());\n  EXPECT_FALSE(NativeListContains(*source_list, eager));\n  EXPECT_TRUE(NativeListContains(*destination_list, eager));\n  EXPECT_EQ(destination_count, destination_list->GetIndexOfTab(handle));\n  EXPECT_EQ(destination_window, eager->GetBrowserWindowInterface());\n  EXPECT_EQ(source_profile, eager->GetProfile());\n  EXPECT_EQ(contents, eager->GetContents());\n  EXPECT_EQ(android_id, android_tab->GetAndroidId());\n  EXPECT_EQ(id, ExtensionTabUtil::GetTabId(contents));\n  EXPECT_EQ(destination_count, TrackedIndex(router, *android_tab));\n  ExpectTransferEvents(events, id, old_window, old_index,\n                       destination_window->GetSessionID().id(), destination_count,\n                       *source_profile);\n}\n\nIN_PROC_BROWSER_TEST_F(AndroidTabsLazyRestoreTest,\n                       RealFrozenWindowTransferMaterializesWithStableIdentity) {\n  if (!SupportsRealMultiInstanceWindows()) {\n    GTEST_SKIP() << \"Requires actual Android multi-instance SDK/manifest support; \"\n                    \"must also execute on a supported multi-instance device.\";\n  }\n  ASSERT_TRUE(embedded_test_server()->Start());\n  const GURL committed = embedded_test_server()->GetURL(\"/title1.html\");\n  const GURL pending = embedded_test_server()->GetURL(\"localhost\", \"/title2.html\");\n  auto* source_model = static_cast<TabModel*>(GetTabListInterface());\n  ASSERT_TRUE(content::NavigateToURL(\n      source_model->GetActiveTab()->GetContents(), committed));\n  auto* source_window = source_model->GetActiveTab()->GetBrowserWindowInterface();\n  ASSERT_TRUE(source_window);\n  Profile* source_profile = source_window->GetProfile();\n  auto* destination_window = CreateRealWindow(*source_profile);\n  ASSERT_TRUE(destination_window);\n  auto* destination_list = TabListInterface::From(destination_window);\n  ASSERT_TRUE(destination_list);\n  ASSERT_NE(source_model, destination_list);\n  ASSERT_NE(source_window->GetSessionID(), destination_window->GetSessionID());\n  ASSERT_EQ(source_profile, destination_window->GetProfile());\n  // This real ungrouped intent rewrites the launch type to FROM_REPARENTING.\n  // Its tab selection materializes the frozen tab, even with bringToFront=false.\n  if (!destination_list->GetActiveTab()) {\n    ASSERT_TRUE(destination_list->OpenTab(GURL(\"about:blank\"), 0, true));\n  }\n  auto* frozen = RestoreBackgroundTabInModel(*source_model,\n                                             source_model->GetTabCount());\n  ASSERT_EQ(nullptr, frozen->GetContents());\n  ASSERT_FALSE(frozen->GetGroup());\n  AppendSerializedPendingNavigation(*frozen, pending, \"Transferred pending title\");\n  ASSERT_EQ(committed, frozen->GetCommittedURL());\n  ASSERT_EQ(pending, frozen->GetPendingURL());\n  const auto handle = frozen->GetHandle();\n  const int android_id = frozen->GetAndroidId();\n  const int id = ExtensionTabUtil::GetTabId(*frozen);\n  const int old_window = ExtensionTabUtil::GetWindowIdOfTab(*frozen);\n  const int old_index = source_model->GetIndexOfTab(handle);\n  const int source_count = source_model->GetTabCount();\n  const int destination_count = destination_list->GetTabCount();\n  auto& router = StartRouter();\n  ASSERT_TRUE(IsPending(router, *frozen));\n  TestEventRouterObserver events(EventRouter::Get(source_profile));\n  AndroidRealTabTransferObserver transfer(*source_model, *destination_list, handle);\n  source_model->MoveTabToWindow(handle, destination_window->GetSessionID(),\n                                 destination_count);\n  ASSERT_TRUE(transfer.Wait());\n  ASSERT_EQ(frozen, handle.Get());\n  EXPECT_EQ(1u, transfer.removed_count());\n  EXPECT_EQ(1u, transfer.added_count());\n  EXPECT_FALSE(transfer.added_with_contents());\n  EXPECT_EQ(source_count - 1, source_model->GetTabCount());\n  EXPECT_EQ(destination_count + 1, destination_list->GetTabCount());\n  EXPECT_FALSE(NativeListContains(*source_model, frozen));\n  EXPECT_TRUE(NativeListContains(*destination_list, frozen));\n  EXPECT_EQ(destination_count, transfer.added_index());\n  EXPECT_EQ(destination_count, destination_list->GetIndexOfTab(handle));\n  EXPECT_EQ(destination_window, frozen->GetBrowserWindowInterface());\n  EXPECT_EQ(source_profile, frozen->GetProfile());\n  EXPECT_EQ(frozen, destination_list->GetActiveTab());\n  ASSERT_TRUE(frozen->GetContents());\n  ASSERT_TRUE(content::WaitForLoadStop(frozen->GetContents()));\n  EXPECT_EQ(android_id, frozen->GetAndroidId());\n  EXPECT_EQ(id, ExtensionTabUtil::GetTabId(*frozen));\n  EXPECT_EQ(pending, frozen->GetCommittedURL());\n  EXPECT_TRUE(frozen->GetPendingURL().is_empty());\n  EXPECT_FALSE(IsPending(router, *frozen));\n  EXPECT_EQ(destination_count, TrackedIndex(router, *frozen));\n  ExpectTransferEvents(events, id, old_window, old_index,\n                       destination_window->GetSessionID().id(), destination_count,\n                       *source_profile);\n  // The destination's ordinary selection performed LoadIfNeeded; the test\n  // never bypasses Java ownership or invents a native resurrection transition.\n  EXPECT_EQ(source_profile, frozen->GetContents()->GetBrowserContext());\n  EXPECT_EQ(pending, frozen->GetContents()->GetLastCommittedURL());\n  EXPECT_EQ(destination_window, frozen->GetBrowserWindowInterface());\n  EXPECT_EQ(id, ExtensionTabUtil::GetTabId(frozen->GetContents()));\n  EXPECT_EQ(android_id, frozen->GetAndroidId());\n  EXPECT_FALSE(IsPending(router, *frozen));\n  EXPECT_EQ(destination_count, TrackedIndex(router, *frozen));\n  ExpectTransferEvents(events, id, old_window, old_index,\n                       destination_window->GetSessionID().id(), destination_count,\n                       *source_profile);\n}\n\nIN_PROC_BROWSER_TEST_F(AndroidTabsLazyRestoreTest,\n                       RealRegularAndOTRLazyLifecycleKeepsProfileIsolation) {\n  if (!SupportsRealMultiInstanceWindows()) {\n    GTEST_SKIP() << \"Requires actual Android multi-instance SDK/manifest support; \"\n                    \"must also execute on a supported multi-instance device.\";\n  }\n  auto* regular_model = static_cast<TabModel*>(GetTabListInterface());\n  Profile* regular_profile = regular_model->GetProfile();\n  Profile* otr_profile = regular_profile->GetPrimaryOTRProfile(true);\n  auto* otr_window = CreateRealWindow(*otr_profile);\n  ASSERT_TRUE(otr_window);\n  ASSERT_EQ(otr_profile, otr_window->GetProfile());\n  auto* otr_model = static_cast<TabModel*>(TabListInterface::From(otr_window));\n  ASSERT_TRUE(otr_model);\n  ASSERT_NE(regular_model, otr_model);\n  ASSERT_EQ(otr_profile, otr_model->GetProfile());\n  ASSERT_EQ(TabModel::TabModelType::kStandard, otr_model->GetTabModelType());\n  if (!otr_model->GetActiveTab()) {\n    ASSERT_TRUE(otr_model->OpenTab(GURL(\"about:blank\"), 0, true));\n  }\n  ASSERT_TRUE(otr_model->GetActiveTab()->GetContents());\n  auto* regular = RestoreBackgroundTabInModel(*regular_model,\n                                              regular_model->GetTabCount());\n  auto* otr = RestoreBackgroundTabInModel(*otr_model, otr_model->GetTabCount());\n  ASSERT_EQ(nullptr, regular->GetContents());\n  ASSERT_EQ(nullptr, otr->GetContents());\n  const auto regular_handle = regular->GetHandle();\n  const auto otr_handle = otr->GetHandle();\n  const int regular_id = ExtensionTabUtil::GetTabId(*regular);\n  const int otr_id = ExtensionTabUtil::GetTabId(*otr);\n  const int regular_window = ExtensionTabUtil::GetWindowIdOfTab(*regular);\n  const int otr_window_id = ExtensionTabUtil::GetWindowIdOfTab(*otr);\n  ASSERT_NE(regular_id, otr_id);\n  auto& router = StartRouter();\n  EXPECT_TRUE(IsPending(router, *regular));\n  EXPECT_TRUE(IsPending(router, *otr));\n  EXPECT_EQ(regular_profile, regular->GetProfile());\n  EXPECT_EQ(otr_profile, otr->GetProfile());\n  auto lookup = [](int id, Profile* context, bool include_incognito) {\n    return ExtensionTabUtil::GetTabById(id, context, include_incognito,\n                                       nullptr, nullptr, nullptr);\n  };\n  EXPECT_TRUE(lookup(regular_id, regular_profile, false));\n  EXPECT_TRUE(lookup(otr_id, otr_profile, false));\n  EXPECT_FALSE(lookup(otr_id, regular_profile, false));\n  EXPECT_FALSE(lookup(regular_id, otr_profile, false));\n  EXPECT_TRUE(lookup(otr_id, regular_profile, true));\n  // EventRouter is intentionally redirected to the parent context for OTR.\n  // Assert actual event context rather than inventing a second event service.\n  TestEventRouterObserver events(EventRouter::Get(regular_profile));\n  regular->LoadIfNeeded();\n  ASSERT_TRUE(regular->GetContents());\n  ASSERT_TRUE(content::WaitForLoadStop(regular->GetContents()));\n  EXPECT_EQ(regular_profile, regular->GetContents()->GetBrowserContext());\n  EXPECT_FALSE(IsPending(router, *regular));\n  EXPECT_TRUE(IsPending(router, *otr));\n  EXPECT_EQ(nullptr, otr->GetContents());\n  otr->LoadIfNeeded();\n  ASSERT_TRUE(otr->GetContents());\n  ASSERT_TRUE(content::WaitForLoadStop(otr->GetContents()));\n  EXPECT_EQ(otr_profile, otr->GetContents()->GetBrowserContext());\n  EXPECT_FALSE(IsPending(router, *otr));\n  EXPECT_EQ(regular_id, ExtensionTabUtil::GetTabId(regular->GetContents()));\n  EXPECT_EQ(otr_id, ExtensionTabUtil::GetTabId(otr->GetContents()));\n  EXPECT_EQ(regular, regular_handle.Get());\n  EXPECT_EQ(otr, otr_handle.Get());\n  EXPECT_EQ(0u, CountEvents(events, api::tabs::OnCreated::kEventName));\n  EXPECT_FALSE(lookup(otr_id, regular_profile, false));\n  EXPECT_FALSE(lookup(regular_id, otr_profile, false));\n  events.ClearEvents();\n  AndroidRealTabCloseObserver regular_close(*regular_model, *regular);\n  AndroidRealTabCloseObserver otr_close(*otr_model, *otr);\n  regular_model->CloseTab(regular_handle);\n  ASSERT_TRUE(regular_close.Wait());\n  EXPECT_EQ(nullptr, regular_handle.Get());\n  EXPECT_FALSE(HasPendingHandle(router, regular_handle));\n  EXPECT_FALSE(HasTrackedID(router, regular_id));\n  EXPECT_TRUE(HasTrackedID(router, otr_id));\n  EXPECT_EQ(otr, otr_handle.Get());\n  EXPECT_TRUE(lookup(otr_id, otr_profile, false));\n  EXPECT_FALSE(lookup(regular_id, regular_profile, false));\n  otr_model->CloseTab(otr_handle);\n  ASSERT_TRUE(otr_close.Wait());\n  EXPECT_EQ(nullptr, otr_handle.Get());\n  EXPECT_FALSE(HasPendingHandle(router, otr_handle));\n  EXPECT_FALSE(HasTrackedID(router, otr_id));\n  EXPECT_FALSE(lookup(otr_id, otr_profile, false));\n  EXPECT_EQ(2u, CountEvents(events, api::tabs::OnRemoved::kEventName));\n  ExpectRemovedInProfile(events, regular_id, *regular_profile, regular_window);\n  ExpectRemovedInProfile(events, otr_id, *otr_profile, otr_window_id);\n  EXPECT_EQ(0u, CountEvents(events, api::tabs::OnCreated::kEventName));\n  EXPECT_EQ(0u, CountEvents(events, api::tabs::OnDetached::kEventName));\n  EXPECT_EQ(0u, CountEvents(events, api::tabs::OnAttached::kEventName));\n}\n\nIN_PROC_BROWSER_TEST_F(AndroidTabsLazyRestoreTest,\n                       RealEagerCloseRemovesTrackingBeforeNativeDestruction) {\n  auto* list = GetTabListInterface();\n  auto* eager = TabAndroid::FromTabInterface(list->OpenTab(\n      GURL(\"about:blank\"), list->GetTabCount(), false));\n  ASSERT_TRUE(eager && eager->GetContents());\n  const auto handle = eager->GetHandle();\n  const int id = ExtensionTabUtil::GetTabId(*eager);\n  const int window_id = ExtensionTabUtil::GetWindowIdOfTab(*eager);\n  auto& router = StartRouter();\n  ASSERT_TRUE(HasTrackedID(router, id));\n  ASSERT_FALSE(IsPending(router, *eager));\n  TestEventRouterObserver events(EventRouter::Get(profile()));\n  AndroidRealTabCloseObserver close(*list, *eager);\n  list->CloseTab(handle);\n  ASSERT_TRUE(close.Wait());\n  EXPECT_EQ(1u, close.removed_count());\n  // This records genuine native teardown. Ordinary closure already removed\n  // the router's TabEntry, so it does not exercise live-tab pending creation.\n  EXPECT_EQ(1u, close.keep_session_id_detaches());\n  EXPECT_EQ(nullptr, handle.Get());\n  EXPECT_FALSE(HasPendingHandle(router, handle));\n  EXPECT_FALSE(HasTrackedID(router, id));\n  EXPECT_FALSE(ExtensionTabUtil::GetTabById(id, profile(), false,\n                                           nullptr, nullptr, nullptr));\n  EXPECT_EQ(1u, CountEvents(events, api::tabs::OnRemoved::kEventName));\n  ExpectRemovedInProfile(events, id, *profile(), window_id);\n  EXPECT_EQ(0u, CountEvents(events, api::tabs::OnCreated::kEventName));\n  EXPECT_EQ(0u, CountEvents(events, api::tabs::OnDetached::kEventName));\n  EXPECT_EQ(0u, CountEvents(events, api::tabs::OnAttached::kEventName));\n}\n\n}  // namespace extensions\n"
