ed.spec(), *value->GetDict().FindString(\"url\"));\n  EXPECT_EQ(pending.spec(), *value->GetDict().FindString(\"pendingUrl\"));\n  EXPECT_EQ(base::UTF16ToUTF8(committed_title),\n            *value->GetDict().FindString(\"title\"));\n  auto pending_value = get(pending_only.get());\n  ASSERT_TRUE(pending_value && pending_value->is_dict());\n  EXPECT_FALSE(pending_value->GetDict().contains(\"url\"));\n  EXPECT_FALSE(pending_value->GetDict().contains(\"title\"));\n  EXPECT_EQ(pending.spec(), *pending_value->GetDict().FindString(\"pendingUrl\"));\n  auto committed_value = get(committed_only.get());\n  ASSERT_TRUE(committed_value && committed_value->is_dict());\n  EXPECT_EQ(committed.spec(), *committed_value->GetDict().FindString(\"url\"));\n  EXPECT_EQ(base::UTF16ToUTF8(committed_title),\n            *committed_value->GetDict().FindString(\"title\"));\n  EXPECT_FALSE(committed_value->GetDict().contains(\"pendingUrl\"));\n  auto hidden = get(restricted.get());\n  ASSERT_TRUE(hidden && hidden->is_dict());\n  EXPECT_FALSE(hidden->GetDict().contains(\"url\"));\n  EXPECT_FALSE(hidden->GetDict().contains(\"title\"));\n  EXPECT_FALSE(hidden->GetDict().contains(\"pendingUrl\"));\n  auto query_contains = [&](const Extension* extension, const GURL& url) {\n    auto function = base::MakeRefCounted<TabsQueryFunction>();\n    function->set_extension(extension);\n    auto result = api_test_utils::RunFunctionAndReturnSingleResult(\n        function, base::StringPrintf(\"[{\\\\\"url\\\\\":\\\\\"%s\\\\\"}]\", url.spec().c_str()),\n        profile());\n    CHECK(result && result->is_list());\n    return std::ranges::any_of(result->GetList(), [id](const auto& tab) {\n      return tab.GetDict().FindInt(\"id\") == id;\n    });\n  };\n  EXPECT_TRUE(query_contains(full.get(), committed));\n  EXPECT_TRUE(query_contains(full.get(), pending));\n  EXPECT_TRUE(query_contains(pending_only.get(), pending));\n  EXPECT_FALSE(query_contains(pending_only.get(), committed));\n  EXPECT_FALSE(query_contains(restricted.get(), pending));\n  list->PinTab(lazy->GetHandle());\n  ASSERT_EQ(1u, CountEvents(observer, api::tabs::OnUpdated::kEventName));\n  const auto& event = *observer.events().at(api::tabs::OnUpdated::kEventName);\n  auto event_tab = [&](const Extension* extension) {\n    std::optional<base::ListValue> args;\n    mojom::EventFilteringInfoPtr filtering;\n    CHECK(event.will_dispatch_callback.Run(\n        profile(), mojom::ContextType::kUnprivilegedExtension, extension,\n        nullptr, args, filtering, nullptr));\n    CHECK(args && args->size() == 3);\n    EXPECT_EQ(id, (*args)[0].GetInt());\n    EXPECT_TRUE((*args)[1].GetDict().contains(\"pinned\"));\n    return (*args)[2].GetDict().Clone();\n  };\n  auto pending_event = event_tab(pending_only.get());\n  EXPECT_FALSE(pending_event.contains(\"url\"));\n  EXPECT_FALSE(pending_event.contains(\"title\"));\n  EXPECT_EQ(pending.spec(), *pending_event.FindString(\"pendingUrl\"));\n  auto committed_event = event_tab(committed_only.get());\n  EXPECT_EQ(committed.spec(), *committed_event.FindString(\"url\"));\n  EXPECT_EQ(base::UTF16ToUTF8(committed_title),\n            *committed_event.FindString(\"title\"));\n  EXPECT_FALSE(committed_event.contains(\"pendingUrl\"));\n  auto* browser = lazy->GetBrowserWindowInterface();\n  ASSERT_TRUE(browser);\n  auto all = BrowserExtensionWindowController::From(browser)->CreateTabList(\n      full.get(), mojom::ContextType::kUnprivilegedExtension);\n  auto it = std::ranges::find_if(all, [id](const auto& tab) {\n    return tab.GetDict().FindInt(\"id\") == id;\n  });\n  ASSERT_NE(it, all.end());\n  EXPECT_EQ(committed.spec(), *it->GetDict().FindString(\"url\"));\n  EXPECT_EQ(pending.spec(), *it->GetDict().FindString(\"pendingUrl\"));\n  // The same regular native ID is not available through an OTR-only lookup.\n  EXPECT_FALSE(ExtensionTabUtil::GetTabById(\n      id, profile()->GetPrimaryOTRProfile(/*create_if_needed=*/true), false,\n      nullptr, nullptr, nullptr));\n  EXPECT_EQ(nullptr, lazy->GetContents());\n  EXPECT_EQ(id, ExtensionTabUtil::GetTabId(*lazy));\n  // A second Sync update clobbers the pending entry, retaining its predecessor.\n  AppendSerializedPendingNavigation(*lazy, replacement, \"Replacement Sync title\");\n  auto replaced = get(full.get());\n  ASSERT_TRUE(replaced && replaced->is_dict());\n  EXPECT_EQ(committed.spec(), *replaced->GetDict().FindString(\"url\"));\n  EXPECT_EQ(base::UTF16ToUTF8(committed_title),\n            *replaced->GetDict().FindString(\"title\"));\n  EXPECT_EQ(replacement.spec(), *replaced->GetDict().FindString(\"pendingUrl\"));\n  EXPECT_EQ(nullptr, lazy->GetContents());\n  lazy->LoadIfNeeded();\n  ASSERT_TRUE(lazy->GetContents());\n  ASSERT_TRUE(content::WaitForLoadStop(lazy->GetContents()));\n  EXPECT_EQ(id, ExtensionTabUtil::GetTabId(lazy->GetContents()));\n  EXPECT_EQ(replacement, lazy->GetContents()->GetLastCommittedURL());\n  EXPECT_FALSE(IsPending(router, *lazy));\n  EXPECT_EQ(0u, CountEvents(observer, api::tabs::OnCreated::kEventName));\n  auto loaded = get(full.get());\n  ASSERT_TRUE(loaded && loaded->is_dict());\n  EXPECT_EQ(replacement.spec(), *loaded->GetDict().FindString(\"url\"));\n  EXPECT_FALSE(loaded->GetDict().contains(\"pendingUrl\"));\n  auto loaded_pending_host = get(pending_only.get());\n  ASSERT_TRUE(loaded_pending_host && loaded_pending_host->is_dict());\n  EXPECT_EQ(replacement.spec(),\n            *loaded_pending_host->GetDict().FindString(\"url\"));\n  EXPECT_TRUE(loaded_pending_host->GetDict().contains(\"title\"));\n  EXPECT_FALSE(loaded_pending_host->GetDict().contains(\"pendingUrl\"));\n  auto loaded_old_host = get(committed_only.get());\n  ASSERT_TRUE(loaded_old_host && loaded_old_host->is_dict());\n  EXPECT_FALSE(loaded_old_host->GetDict().contains(\"url\"));\n  EXPECT_FALSE(loaded_old_host->GetDict().contains(\"title\"));\n  EXPECT_FALSE(loaded_old_host->GetDict().contains(\"pendingUrl\"));\n}\n\nIN_PROC_BROWSER_TEST_F(AndroidTabsLazyRestoreTest,\n                       SerializedCommittedMetadataRejectsMissingAndTruncatedState) {\n  JNIEnv* env = base::android::AttachCurrentThread();\n  auto state = WebContentsState::CreateSingleNavigationStateAsByteBuffer(\n      env, profile(), std::u16string(u\"Pending title\"),\n      \"https://example.test/pending\", std::nullopt, 0, std::nullopt);\n  ASSERT_FALSE(state.is_null());\n  auto bytes = base::android::JavaByteBufferToSpan(env, state);\n  ASSERT_FALSE(bytes.empty());\n  bool is_off_the_record = false;\n  std::u16string title;\n  std::string url;\n  // Existing callers still select the current entry by default.\n  EXPECT_TRUE(WebContentsState::ExtractMetadata(\n      bytes, 2, &is_off_the_record, &title, &url));\n  EXPECT_EQ(\"https://example.test/pending\", url);\n  EXPECT_EQ(u\"Pending title\", title);\n  EXPECT_FALSE(WebContentsState::ExtractMetadata(\n      bytes, 2, &is_off_the_record, &title, &url, true));\n  auto appended = WebContentsState::AppendPendingNavigation(\n      env, profile(), bytes, 2, false, std::u16string(u\"New pending title\"),\n      \"https://example.test/replacement\", std::nullopt, 0, std::nullopt);\n  ASSERT_FALSE(appended.is_null());\n  auto with_previous = base::android::JavaByteBufferToSpan(env, appended);\n  EXPECT_TRUE(WebContentsState::ExtractMetadata(\n      with_previous, 2, &is_off_the_record, &title, &url, true));\n  EXPECT_EQ(\"https://example.test/pending\", url);\n  EXPECT_EQ(u\"Pending title\", title);\n  EXPECT_FALSE(WebContentsState::ExtractMetadata(\n      with_previous.first(bytes.size() / 2), 2,\n      &is_off_the_record, &title, &url, true));\n  EXPECT_FALSE(WebContentsState::ExtractMetadata(\n      with_previous.first(0), 2, &is_off_the_record, &title, &url, true));\n  EXPECT_FALSE(WebContentsState::ExtractMetadata(\n      with_previous, 1, &is_off_the_record, &title, &url, true));\n}\n\n}  // namespace extensions\n"
