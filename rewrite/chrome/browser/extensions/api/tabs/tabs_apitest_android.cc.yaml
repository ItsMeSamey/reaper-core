      replace: "// These observers wait for real list and Java-owned tab lifecycle callbacks.\nclass AndroidRealTabTransferObserver : public TabListInterfaceObserver {\n public:\n  AndroidRealTabTransferObserver(TabListInterface& source,\n                                 TabListInterface& destination,\n                                 tabs::TabHandle handle)\n      : handle_(handle) {\n    source_.Observe(&source);\n    destination_.Observe(&destination);\n  }\n\n  void OnTabRemoved(TabListInterface& list, tabs::TabInterface* tab,\n                    TabRemovedReason reason) override {\n    if (&list != source_.GetSource() || tab->GetHandle() != handle_) {\n      return;\n    }\n    EXPECT_EQ(TabRemovedReason::kInsertedIntoOtherTabStrip, reason);\n    if (++removed_count_ == 1) {\n      removed_.SetValue();\n    }\n  }\n\n  void OnTabAdded(TabListInterface& list, tabs::TabInterface* tab,\n                  int index) override {\n    if (&list != destination_.GetSource() || tab->GetHandle() != handle_) {\n      return;\n    }\n    added_index_ = index;\n    added_with_contents_ = tab->GetContents() != nullptr;\n    if (++added_count_ == 1) {\n      added_.SetValue();\n    }\n  }\n\n  bool Wait() { return removed_.Wait() && added_.Wait(); }\n  size_t removed_count() const { return removed_count_; }\n  size_t added_count() const { return added_count_; }\n  int added_index() const { return added_index_; }\n  bool added_with_contents() const { return added_with_contents_; }\n\n private:\n  const tabs::TabHandle handle_;\n  base::ScopedObservation<TabListInterface, TabListInterfaceObserver> source_{\n      this};\n  base::ScopedObservation<TabListInterface, TabListInterfaceObserver>\n      destination_{this};\n  base::test::TestFuture<void> removed_;\n  base::test::TestFuture<void> added_;\n  size_t removed_count_ = 0;\n  size_t added_count_ = 0;\n  int added_index_ = -1;\n  bool added_with_contents_ = false;\n};\n\nclass AndroidRealTabCloseObserver : public TabListInterfaceObserver,\n                                     public TabAndroid::Observer {\n public:\n  AndroidRealTabCloseObserver(TabListInterface& list, TabAndroid& tab)\n      : handle_(tab.GetHandle()) {\n    list_.Observe(&list);\n    tab_.Observe(&tab);\n  }\n\n  void OnTabRemoved(TabListInterface& list, tabs::TabInterface* tab,\n                    TabRemovedReason reason) override {\n    if (tab->GetHandle() != handle_) {\n      return;\n    }\n    EXPECT_TRUE(TabRemoveReasonUtils::WillDeleteTab(reason));\n    if (++removed_count_ == 1) {\n      removed_.SetValue();\n    }\n  }\n\n  void OnInitWebContents(TabAndroid* tab) override {}\n\n  void OnWillDetachWebContents(TabAndroid* tab, bool keep_session_id) override {\n    // The real Java remover emits list removal before native destruction.\n    EXPECT_EQ(1u, removed_count_);\n    if (keep_session_id) {\n      ++keep_session_id_detaches_;\n    }\n  }\n\n  void OnTabAndroidDestroyed(TabAndroid* tab) override {\n    tab_.Reset();\n    destroyed_.SetValue();\n  }\n\n  bool Wait() { return removed_.Wait() && destroyed_.Wait(); }\n  size_t removed_count() const { return removed_count_; }\n  size_t keep_session_id_detaches() const { return keep_session_id_detaches_; }\n\n private:\n  const tabs::TabHandle handle_;\n  base::ScopedObservation<TabListInterface, TabListInterfaceObserver> list_{this};\n  base::ScopedObservation<TabAndroid, TabAndroid::Observer> tab_{this};\n  base::test::TestFuture<void> removed_;\n  base::test::TestFuture<void> destroyed_;\n  size_t removed_count_ = 0;\n  size_t keep_session_id_detaches_ = 0;\n};\n\n// Uses the real Java ChromeTabCreator restore path and the standard model.\n"
