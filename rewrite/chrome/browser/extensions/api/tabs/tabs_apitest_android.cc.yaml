      replace: "  ASSERT_TRUE(RunExtensionTest(\"tabs/zoom\")) << message_;\n}\n\n// Uses the real Java ChromeTabCreator restore path and the standard model.\n// JNI reflection keeps this stock native browser test independent of a new\n// generated test-only Java target.\nclass AndroidTabsLazyRestoreTest : public ExtensionApiTest {\n public:\n  AndroidTabsLazyRestoreTest() {\n    features_.InitAndDisableFeature(chrome::android::kLoadAllTabsAtStartup);\n  }\n\n protected:\n  TabAndroid* RestoreBackgroundTab(int index) {\n    CHECK(!base::FeatureList::IsEnabled(\n        chrome::android::kLoadAllTabsAtStartup));\n    auto* model = static_cast<TabModel*>(GetTabListInterface());\n    CHECK_EQ(model->GetTabModelType(), TabModel::TabModelType::kStandard);\n    auto* source = model->GetTabAt(model->GetActiveIndex());\n    CHECK(source);\n    CHECK(source->GetContents());\n    JNIEnv* env = base::android::AttachCurrentThread();\n    auto extractor = base::android::GetClass(\n        env, \"org/chromium/chrome/browser/tab/TabStateExtractor\");\n    jmethodID extract = env->GetStaticMethodID(\n        extractor.obj(), \"from\",\n        \"(Lorg/chromium/chrome/browser/tab/Tab;)\"\n        \"Lorg/chromium/chrome/browser/tab/TabState;\");\n    CHECK(extract);\n    auto state = jni_zero::AdoptRef(\n        env, env->CallStaticObjectMethod(extractor.obj(), extract,\n                                        source->GetJavaObject().obj()));\n    base::android::CheckException(env);\n    CHECK(!state.is_null());\n\n    auto java_model = model->GetJavaObject();\n    auto model_class = jni_zero::AdoptRef(\n        env, env->GetObjectClass(java_model.obj()));\n    jmethodID get_creator = env->GetMethodID(\n        model_class.obj(), \"getTabCreator\",\n        \"()Lorg/chromium/chrome/browser/tabmodel/TabCreator;\");\n    CHECK(get_creator);\n    auto creator = jni_zero::AdoptRef(\n        env, env->CallObjectMethod(java_model.obj(), get_creator));\n    base::android::CheckException(env);\n    CHECK(!creator.is_null());\n    auto creator_class = jni_zero::AdoptRef(\n        env, env->GetObjectClass(creator.obj()));\n    jmethodID restore = env->GetMethodID(\n        creator_class.obj(), \"createFrozenTab\",\n        \"(Lorg/chromium/chrome/browser/tab/TabState;II)\"\n        \"Lorg/chromium/chrome/browser/tab/Tab;\");\n    CHECK(restore);\n    int android_id = source->GetAndroidId();\n    for (auto* tab : model->GetAllTabs()) {\n      android_id = std::max(\n          android_id, TabAndroid::FromTabInterface(tab)->GetAndroidId());\n    }\n    auto restored = jni_zero::AdoptRef(\n        env, env->CallObjectMethod(creator.obj(), restore, state.obj(),\n                                  android_id + 1, index));\n    base::android::CheckException(env);\n    CHECK(!restored.is_null());\n    return TabAndroid::GetNativeTab(env, restored);\n  }\n\n  TabsEventRouter& StartRouter() {\n    auto* api = TabsWindowsAPI::Get(profile());\n    CHECK(!api->tabs_event_router());\n    // InitTabsEventRouter is the same path called by listener registration.\n    api->InitTabsEventRouter();\n    return *api->tabs_event_router();\n  }\n\n  bool IsPending(TabsEventRouter& router, TabAndroid& tab) {\n    return router.GetPendingTab(tab);\n  }\n\n  int TrackedIndex(TabsEventRouter& router, TabAndroid& tab) {\n    if (auto* pending = router.GetPendingTab(tab)) {\n      return pending->index;\n    }\n    auto* entry = router.GetTabEntry(*tab.GetContents());\n    CHECK(entry);\n    return entry->last_known_index();\n  }\n\n  bool NativeListContains(TabListInterface& list, tabs::TabInterface* tab) {\n    const auto tabs = list.GetAllTabs();\n    return std::ranges::find(tabs, tab) != tabs.end();\n  }\n\n  bool HasPendingHandle(TabsEventRouter& router, tabs::TabHandle handle) {\n    return router.pending_tabs_.contains(handle);\n  }\n\n  size_t CountEvents(const TestEventRouterObserver& observer,\n                     const char* name) {\n    return std::ranges::count_if(observer.all_events(), [name](const auto& e) {\n      return e->event_name == name;\n    });\n  }\n\n  base::ListValue Arguments(const Event& event) {\n    if (!event.will_dispatch_callback) {\n      return event.event_args.Clone();\n    }\n    auto extension = ExtensionBuilder(\"lazy lifecycle\")\n                         .SetManifestVersion(3)\n                         .AddAPIPermission(\"tabs\")\n                         .Build();\n    std::optional<base::ListValue> args;\n    mojom::EventFilteringInfoPtr filtering;\n    CHECK(event.will_dispatch_callback.Run(\n        profile(), mojom::ContextType::kUnprivilegedExtension, extension.get(),\n        nullptr, args, filtering, nullptr));\n    CHECK(args.has_value());\n    return std::move(*args);\n  }\n\n private:\n  base::test::ScopedFeatureList features_;\n};\n\nIN_PROC_BROWSER_TEST_F(AndroidTabsLazyRestoreTest,\n                       BootstrapKeepsLazyIndicesAndObservesMaterialization) {\n  auto* list = GetTabListInterface();\n  TabAndroid* lazy = RestoreBackgroundTab(list->GetTabCount());\n  ASSERT_TRUE(lazy);\n  ASSERT_EQ(nullptr, lazy->GetContents());\n  TestEventRouterObserver observer(EventRouter::Get(profile()));\n  auto& router = StartRouter();\n  EXPECT_TRUE(IsPending(router, *lazy));\n  EXPECT_TRUE(NativeListContains(*list, lazy));\n  EXPECT_EQ(list->GetIndexOfTab(lazy->GetHandle()), TrackedIndex(router, *lazy));\n  EXPECT_EQ(0u, CountEvents(observer, api::tabs::OnCreated::kEventName));\n\n  auto* eager = list->OpenTab(GURL(\"about:blank\"), 0, false);\n  ASSERT_TRUE(eager->GetContents());\n  const int eager_id = ExtensionTabUtil::GetTabId(eager->GetContents());\n  EXPECT_EQ(list->GetIndexOfTab(lazy->GetHandle()), TrackedIndex(router, *lazy));\n  observer.ClearEvents();\n  lazy->LoadIfNeeded();\n  ASSERT_TRUE(lazy->GetContents());\n  ASSERT_TRUE(content::WaitForLoadStop(lazy->GetContents()));\n  EXPECT_FALSE(IsPending(router, *lazy));\n  EXPECT_EQ(list->GetIndexOfTab(lazy->GetHandle()), TrackedIndex(router, *lazy));\n  EXPECT_EQ(eager_id, ExtensionTabUtil::GetTabId(eager->GetContents()));\n  EXPECT_EQ(0u, CountEvents(observer, api::tabs::OnCreated::kEventName));\n\n  observer.ClearEvents();\n  lazy->GetContents()->SetAudioMuted(true);\n  ASSERT_EQ(1u, CountEvents(observer, api::tabs::OnUpdated::kEventName));\n  const auto& event = *observer.events().at(api::tabs::OnUpdated::kEventName);\n  auto args = Arguments(event);\n  EXPECT_EQ(ExtensionTabUtil::GetTabId(lazy->GetContents()), args[0].GetInt());\n  EXPECT_TRUE(args[1].GetDict().contains(\"mutedInfo\"));\n}\n\nIN_PROC_BROWSER_TEST_F(AndroidTabsLazyRestoreTest,\n                       LazyAdditionDefersCreationAndRetainsMove) {\n  auto* list = GetTabListInterface();\n  auto& router = StartRouter();\n  TestEventRouterObserver observer(EventRouter::Get(profile()));\n  TabAndroid* lazy = RestoreBackgroundTab(list->GetTabCount());\n  ASSERT_TRUE(lazy);\n  ASSERT_EQ(nullptr, lazy->GetContents());\n  EXPECT_TRUE(IsPending(router, *lazy));\n  EXPECT_TRUE(NativeListContains(*list, lazy));\n  EXPECT_EQ(0u, CountEvents(observer, api::tabs::OnCreated::kEventName));\n\n  const int from_index = list->GetIndexOfTab(lazy->GetHandle());\n  list->MoveTab(lazy->GetHandle(), 0);\n  ASSERT_EQ(0, list->GetIndexOfTab(lazy->GetHandle()));\n  EXPECT_EQ(0, TrackedIndex(router, *lazy));\n  EXPECT_EQ(nullptr, lazy->GetContents());\n  EXPECT_EQ(0u, CountEvents(observer, api::tabs::OnMoved::kEventName));\n\n  lazy->LoadIfNeeded();\n  ASSERT_TRUE(lazy->GetContents());\n  ASSERT_TRUE(content::WaitForLoadStop(lazy->GetContents()));\n  const int tab_id = ExtensionTabUtil::GetTabId(lazy->GetContents());\n  ASSERT_EQ(1u, CountEvents(observer, api::tabs::OnCreated::kEventName));\n  ASSERT_EQ(1u, CountEvents(observer, api::tabs::OnMoved::kEventName));\n  auto created = Arguments(\n      *observer.events().at(api::tabs::OnCreated::kEventName));\n  EXPECT_EQ(tab_id, created[0].GetDict().FindInt(\"id\"));\n  EXPECT_EQ(0, created[0].GetDict().FindInt(\"index\"));\n  const auto& moved =\n      observer.events().at(api::tabs::OnMoved::kEventName)->event_args;\n  EXPECT_EQ(tab_id, moved[0].GetInt());\n  EXPECT_EQ(from_index, moved[1].GetDict().FindInt(\"fromIndex\"));\n  EXPECT_EQ(0, moved[1].GetDict().FindInt(\"toIndex\"));\n  EXPECT_EQ(0, TrackedIndex(router, *lazy));\n\n  lazy->LoadIfNeeded();\n  EXPECT_EQ(tab_id, ExtensionTabUtil::GetTabId(lazy->GetContents()));\n  EXPECT_EQ(1u, CountEvents(observer, api::tabs::OnCreated::kEventName));\n}\n\nIN_PROC_BROWSER_TEST_F(AndroidTabsLazyRestoreTest,\n                       ClosingUnmaterializedTabCancelsTracking) {\n  auto* list = GetTabListInterface();\n  auto& router = StartRouter();\n  TabAndroid* lazy = RestoreBackgroundTab(list->GetTabCount());\n  ASSERT_EQ(nullptr, lazy->GetContents());\n  const auto handle = lazy->GetHandle();\n  TestEventRouterObserver observer(EventRouter::Get(profile()));\n  list->CloseTab(handle);\n  EXPECT_EQ(nullptr, handle.Get());\n  EXPECT_FALSE(HasPendingHandle(router, handle));\n  EXPECT_EQ(0u, CountEvents(observer, api::tabs::OnCreated::kEventName));\n  EXPECT_EQ(0u, CountEvents(observer, api::tabs::OnRemoved::kEventName));\n}\n\n}  // namespace extensions\n"
