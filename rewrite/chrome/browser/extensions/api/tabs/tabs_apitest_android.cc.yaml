      replace: "  // Read the actual SDK/manifest capability. Do not set a testing override.\n  bool SupportsRealMultiInstanceWindows() {\n    JNIEnv* env = base::android::AttachCurrentThread();\n    auto utils = base::android::GetClass(\n        env, \"org/chromium/chrome/browser/multiwindow/MultiWindowUtils\");\n    jmethodID supported = env->GetStaticMethodID(\n        utils.obj(), \"isMultiInstanceApi31Enabled\", \"()Z\");\n    CHECK(supported);\n    const bool result = env->CallStaticBooleanMethod(utils.obj(), supported);\n    base::android::CheckException(env);\n    return result;\n  }\n\n  BrowserWindowInterface* CreateRealWindow(Profile& explicit_profile) {\n    BrowserWindowCreateParams params(BrowserWindowInterface::TYPE_NORMAL,\n                                     explicit_profile, false);\n    base::test::TestFuture<BrowserWindowInterface*> future;\n    CreateBrowserWindow(std::move(params), future.GetCallback());\n    return future.Get();\n  }\n\n  bool HasTrackedID(TabsEventRouter& router, int id) {\n    return router.tab_entries_.contains(id);\n  }\n\n  void ExpectTransferEvents(const TestEventRouterObserver& observer, int id,\n                            int old_window, int old_index, int new_window,\n                            int new_index, Profile& explicit_profile) {\n    ASSERT_EQ(1u, CountEvents(observer, api::tabs::OnDetached::kEventName));\n    ASSERT_EQ(1u, CountEvents(observer, api::tabs::OnAttached::kEventName));\n    EXPECT_EQ(0u, CountEvents(observer, api::tabs::OnCreated::kEventName));\n    EXPECT_EQ(0u, CountEvents(observer, api::tabs::OnRemoved::kEventName));\n    const auto& detached =\n        *observer.events().at(api::tabs::OnDetached::kEventName);\n    const auto& attached =\n        *observer.events().at(api::tabs::OnAttached::kEventName);\n    EXPECT_EQ(&explicit_profile, detached.restrict_to_browser_context);\n    EXPECT_EQ(&explicit_profile, attached.restrict_to_browser_context);\n    ASSERT_EQ(2u, detached.event_args.size());\n    ASSERT_EQ(2u, attached.event_args.size());\n    EXPECT_EQ(id, detached.event_args[0].GetInt());\n    EXPECT_EQ(old_window,\n              detached.event_args[1].GetDict().FindInt(\"oldWindowId\"));\n    EXPECT_EQ(old_index,\n              detached.event_args[1].GetDict().FindInt(\"oldPosition\"));\n    EXPECT_EQ(id, attached.event_args[0].GetInt());\n    EXPECT_EQ(new_window,\n              attached.event_args[1].GetDict().FindInt(\"newWindowId\"));\n    EXPECT_EQ(new_index,\n              attached.event_args[1].GetDict().FindInt(\"newPosition\"));\n    auto detach_it = std::ranges::find_if(observer.all_events(), [](const auto& e) {\n      return e->event_name == api::tabs::OnDetached::kEventName;\n    });\n    auto attach_it = std::ranges::find_if(observer.all_events(), [](const auto& e) {\n      return e->event_name == api::tabs::OnAttached::kEventName;\n    });\n    EXPECT_LT(detach_it, attach_it);\n  }\n\n  void ExpectRemovedInProfile(const TestEventRouterObserver& observer, int id,\n                              Profile& explicit_profile, int window_id) {\n    size_t matching = 0;\n    for (const auto& event : observer.all_events()) {\n      if (event->event_name != api::tabs::OnRemoved::kEventName ||\n          event->event_args[0].GetInt() != id) {\n        continue;\n      }\n      ++matching;\n      EXPECT_EQ(&explicit_profile, event->restrict_to_browser_context);\n      EXPECT_EQ(window_id, event->event_args[1].GetDict().FindInt(\"windowId\"));\n    }\n    EXPECT_EQ(1u, matching);\n  }\n\n  bool IsPending(TabsEventRouter& router, TabAndroid& tab) {\n"
