substitutions:
- description: Include the explicit Android platform build flag provider
  regex:
    pattern: '#include "build/chromeos_buildflags.h"

      '
    replace: '#include "build/build_config.h"

      #include "build/chromeos_buildflags.h"

      '
  count: 1
- description: Exercise missing-context cancellation and unchanged permission state before the existing valid-context control
  regex:
    pattern: "  // 4) Accept re-enable prompt with user gesture, expect the extension to be\n  // enabled.\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Missing requesting contents cancels consent without changing permissions.\n\
      \  {\n    std::string error;\n    EXPECT_FALSE(RunSetEnabledFunction(\n        /*web_contents=*/nullptr, extension_id,\
      \ true /* use_user_gesture */,\n        true /* accept_dialog */, &error));\n    EXPECT_EQ(constants::kUserDidNotReEnableError,\
      \ error);\n    EXPECT_FALSE(registry()->enabled_extensions().Contains(extension_id));\n    EXPECT_TRUE(registry()->disabled_extensions().Contains(extension_id));\n\
      \    EXPECT_TRUE(prefs->DidExtensionEscalatePermissions(extension_id));\n    auto granted_permissions = prefs->GetGrantedPermissions(extension_id);\n\
      \    ASSERT_TRUE(granted_permissions);\n    EXPECT_TRUE(granted_permissions->IsEmpty());\n  }\n#endif\n\n  // 4) Accept\
      \ re-enable prompt with user gesture, expect the extension to be\n  // enabled.\n"
  count: 1
