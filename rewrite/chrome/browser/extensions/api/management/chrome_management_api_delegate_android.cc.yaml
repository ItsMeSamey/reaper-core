substitutions:
- description: Declare move explicitly.
  regex:
    pattern: '#include "base/notimplemented.h"'
    replace: '#include <utility>


      #include "base/notimplemented.h"'
- description: Use validated Android standalone PWA installation and launch.
  regex:
    pattern: '#include "base/notreached.h"'
    replace: '#include "base/notreached.h"

      #include "brave/browser/extensions/android/replacement_webapp/replacement_web_app.h"'
- description: Only the initial regular Android profile can install a hosted replacement PWA.
  regex:
    pattern: "  // chrome.management.installReplacementWebApp() is disabled on desktop Android\n  // via _api_features.json. http://crbug.com/371332103\n  NOTREACHED();\n}\n\nvoid ChromeManagementAPIDelegate::InstallOrLaunchReplacementWebApp("
    replace: '  return CanInstallAndroidReplacementWebApp(context);

      }


      void ChromeManagementAPIDelegate::InstallOrLaunchReplacementWebApp('
- description: Keep CWS and gesture enforcement in the shared API and delegate to the real Android flow.
  regex:
    pattern: "  // chrome.management.installReplacementWebApp() is disabled on desktop Android\n  // via _api_features.json. http://crbug.com/371332103\n  NOTREACHED();"
    replace: '  InstallAndroidReplacementWebApp(context, web_app_url, std::move(callback));'
