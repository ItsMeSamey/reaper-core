or (const auto& warning : c->permissions_data()->GetPermissionMessages()) {\n    if (std::ranges::find(b_messages, warning.message()) == b_messages.end()) {\n      c_only_messages.push_back(warning.message());\n    }\n  }\n  ASSERT_FALSE(c_only_messages.empty());\n  ASSERT_NO_FATAL_FAILURE(CompleteSettingsPrompt(true));\n  EXPECT_EQ(c.get(), extension_registry()->disabled_extensions().GetByID(id_));\n  EXPECT_FALSE(extension_registry()->enabled_extensions().Contains(id_));\n  ASSERT_NO_FATAL_FAILURE(ExpectOriginalGrants());\n\n  // A fresh prompt for C still works through the ordinary management UI.\n  ASSERT_NO_FATAL_FAILURE(BeginEnable());\n  const auto c_messages = PromptPermissions();\n  for (const auto& warning : c_only_messages) {\n    EXPECT_NE(c_messages.end(), std::ranges::find(c_messages, warning));\n  }\n  ASSERT_NO_FATAL_FAILURE(CompletePrompt(true));\n  EXPECT_TRUE(response_->GetResponse());\n  EXPECT_EQ(c.get(), extension_registry()->enabled_extensions().GetByID(id_));\n  auto grants = ExtensionPrefs::Get(profile())->GetGrantedPermissions(id_);\n  ASSERT_TRUE(grants);\n  EXPECT_TRUE(grants->HasAPIPermission(\"bookmarks\"));\n  EXPECT_TRUE(grants->HasAPIPermission(\"history\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSettingsUpdateReenableConsentTest,\n                       UnchangedSignedUpdateAcceptanceEnables) {\n  ASSERT_NO_FATAL_FAILURE(BeginSettingsUpdate());\n  ASSERT_NO_FATAL_FAILURE(CompleteSettingsPrompt(true));\n  EXPECT_EQ(b_.get(), extension_registry()->enabled_extensions().GetByID(id_));\n  auto grants = ExtensionPrefs::Get(profile())->GetGrantedPermissions(id_);\n  ASSERT_TRUE(grants);\n  EXPECT_TRUE(grants->HasAPIPermission(\"bookmarks\"));\n  EXPECT_FALSE(grants->HasAPIPermission(\"history\"));\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionSettingsUpdateReenableConsentTest,\n                       UnchangedSignedUpdateCancellationPreservesGrants) {\n  ASSERT_NO_FATAL_FAILURE(BeginSettingsUpdate());\n  ASSERT_NO_FATAL_FAILURE(CompleteSettingsPro