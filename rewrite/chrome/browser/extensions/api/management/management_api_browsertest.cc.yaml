    replace: "  EXPECT_FALSE(extension_registry()->enabled_extensions().Contains(id_));\n  ASSERT_NO_FATAL_FAILURE(ExpectOriginalGrants());\n}\n\n// Exercise the separate CrxInstaller re-enable path used by a signed CRX\n// dropped into chrome://extensions. ManagementSetEnabledFunction is not the\n// owner of this prompt, so its consent-instance guard cannot protect it.\nclass ExtensionSettingsUpdateReenableConsentTest\n    : public ExtensionManagementReenableConsentTest {\n protected:\n  void BeginSettingsUpdate() {\n    ResetCompletedRequest();\n    ASSERT_TRUE(GetActiveWebContents());\n    sender_ = GetActiveWebContents()->GetWeakPtr();\n    const base::FilePath b_path = PackVersion(\"2\", R\"(\"bookmarks\")\");\n    ASSERT_FALSE(b_path.empty());\n    auto prompt = std::make_unique<ExtensionInstallPrompt>(\n        sender_.get(), std::make_unique<InstallPromptData>(\n                           InstallPromptData::UNSET_PROMPT_TYPE));\n    installer_ = CrxInstaller::Create(profile(), std::move(prompt));\n    installer_->set_error_on_unsupported_requirements(true);\n    installer_->set_off_store_install_allow_reason(\n        CrxInstaller::OffStoreInstallAllowedFromSettingsPage);\n    installer_->set_install_immediately(true);\n    installer_->AddInstallerCallback(base::BindOnce(\n        [](ExtensionSettingsUpdateReenableConsentTest* self,\n           const std::optional<CrxInstallError>& error) {\n          self->install_finished_ = true;\n          self->install_failed_ = error.has_value();\n        },\n        base::Unretained(this)));\n    settings_prompt_pending_ = true;\n    installer_->InstallCrx(b_path);\n    ASSERT_TRUE(base::test::RunUntil([&] {\n      CaptureDialog();\n      return install_finished_ && (install_failed_ || !dialog_.is_null());\n    }));\n    ASSERT_FALSE(install_failed_);\n    ASSERT_FALSE(dialog_.is_null());\n    b_ = extension_registry()->disabled_extensions().GetByID(id_);\n    ASSERT_TRUE(b_);\n    ASSERT_EQ(installer_->extension(), b