substitutions:
- description: Bind Android chooser and grant lifetime to the actual target document.
  regex:
    pattern: "#if BUILDFLAG(IS_ANDROID)\n  picker_params.exclude_self_browser_surface"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  picker_params.android_request_document = render_frame_host->GetWeakDocumentPtr();\n  picker_params.exclude_self_browser_surface"
- description: Cancel a pending Android capture chooser on requesting extension unload (1).
  regex:
    re_pattern: '\ \ //\ we\ return\.\

      \ \ scoped_refptr<DesktopCaptureChooseDesktopMediaFunctionBase>\ self\(this\);\

      \

      \ \ //\ If\ this\ picker\ dialog\ is\ open,\ this\ will\ close\ it\.\

      \ \ picker_controller_\.reset\(\);\

      \

      \ \ Respond\(ArgumentList\(Create\(std::string\(\),\ Options\(\)\)\)\);\

      \}\

      \

      ExtensionFunction::ResponseAction\

      DesktopCaptureChooseDesktopMediaFunctionBase::Execute\(\

      '
    replace: "  // we return.\n  scoped_refptr<DesktopCaptureChooseDesktopMediaFunctionBase> self(this);\n\n#if BUILDFLAG(IS_ANDROID)\n  if (did_respond()) {\n    return;\n  }\n  registry_observation_.Reset();\n#endif\n\n  // If this picker dialog is open, this will close it.\n  picker_controller_.reset();\n\n  Respond(ArgumentList(Create(std::string(), Options())));\n}\n\n#if BUILDFLAG(IS_ANDROID)\nvoid DesktopCaptureChooseDesktopMediaFunctionBase::OnExtensionUnloaded(\n    content::BrowserContext* browser_context,\n    const Extension* unloaded_extension,\n    UnloadedExtensionReason reason) {\n  if (unloaded_extension == extension()) {\n    Cancel();\n  }\n}\n\nvoid DesktopCaptureChooseDesktopMediaFunctionBase::OnShutdown(\n    ExtensionRegistry* registry) {\n  Cancel();\n}\n\nvoid DesktopCaptureChooseDesktopMediaFunctionBase::OnBrowserContextShutdown() {\n  if (picker_controller_) {\n    Cancel();\n  } else {\n    registry_observation_.Reset();\n  }\n}\n#endif\n\nExtensionFunction::ResponseAction\nDesktopCaptureChooseDesktopMediaFunctionBase::Execute(\n"
- description: Cancel a pending Android capture chooser on requesting extension unload (2).
  regex:
    re_pattern: '\ \ \ \ \ \ std::make_unique<DesktopMediaPickerController>\(g_picker_factory\);\

      \ \ picker_params\.restricted_by_policy\ =\

      \ \ \ \ \ \ \(capture_level\ !=\ AllowedScreenCaptureLevel::kUnrestricted\);\

      \ \ picker_controller_\->Show\(picker_params,\ std::move\(media_types\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::move\(callback\)\);\

      \ \ return\ RespondLater\(\);\

      '
    replace: "      std::make_unique<DesktopMediaPickerController>(g_picker_factory);\n  picker_params.restricted_by_policy =\n      (capture_level != AllowedScreenCaptureLevel::kUnrestricted);\n#if BUILDFLAG(IS_ANDROID)\n  // A worker's target tab can outlive the extension that requested the picker.\n  registry_observation_.Observe(ExtensionRegistry::Get(browser_context()));\n#endif\n  picker_controller_->Show(picker_params, std::move(media_types),\n                           std::move(callback));\n  return RespondLater();\n"
