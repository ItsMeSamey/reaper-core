substitutions:
- description: Cancel a pending Android capture chooser on requesting extension unload (1).
  regex:
    re_pattern: '\#include\ "third_party/blink/public/mojom/mediastream/media_stream\.mojom\.h"\

      \#include\ "third_party/webrtc/modules/desktop_capture/desktop_capture_types\.h"\

      \#include\ "ui/base/ozone_buildflags\.h"\

      \

      \#if\ BUILDFLAG\(IS_OZONE\)\

      \#include\ "ui/ozone/public/ozone_platform\.h"\

      '
    replace: '#include "third_party/blink/public/mojom/mediastream/media_stream.mojom.h"

      #include "third_party/webrtc/modules/desktop_capture/desktop_capture_types.h"

      #include "ui/base/ozone_buildflags.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "base/functional/bind.h"

      #include "base/functional/callback_helpers.h"

      #include "base/test/run_until.h"

      #include "chrome/browser/profiles/profile.h"

      #include "extensions/browser/process_manager.h"

      #include "extensions/test/extension_test_message_listener.h"

      #endif


      #if BUILDFLAG(IS_OZONE)

      #include "ui/ozone/public/ozone_platform.h"

      '
- description: Cancel a pending Android capture chooser on requesting extension unload (2).
  regex:
    re_pattern: '\ \ ASSERT_TRUE\(RunExtensionTest\(test_dir\.UnpackedPath\(\),\ \{\},\ \{\}\)\)\ <<\ message_;\

      \}\

      \

      class\ DesktopCaptureApiMediaPickerOptionsBaseTest\

      \ \ \ \ :\ public\ DesktopCaptureApiTest\ \{\

      \ public:\

      '
    replace: "  ASSERT_TRUE(RunExtensionTest(test_dir.UnpackedPath(), {}, {})) << message_;\n}\n\n#if BUILDFLAG(IS_ANDROID)\nclass DesktopCaptureAndroidUnloadTest : public DesktopCaptureApiTest {\n protected:\n  void CheckPendingWorkerChooser(bool reload) {\n    embedded_test_server()->ServeFilesFromDirectory(\n        GetTestResourcesParentDir());\n    ASSERT_TRUE(StartEmbeddedTestServer());\n    content::WebContents* target = GetActiveWebContents();\n    ASSERT_TRUE(\n        NavigateToURL(target, GetURLForPath(\"localhost\", \"/test_file.html\")));\n\n    TestExtensionDir test_dir;\n    test_dir.WriteManifest(R\"({\n      \"name\": \"Pending desktop capture\",\n      \"manifest_version\": 3,\n      \"version\": \"1.0\",\n      \"background\": { \"service_worker\": \"worker.js\" },\n      \"permissions\": [\"desktopCapture\", \"tabs\"]\n    })\");\n    test_dir.WriteFile(FILE_PATH_LITERAL(\"worker.js\"), R\"(\n      chrome.tabs.query({}, tabs => {\n        chrome.test.assertEq(1, tabs.length);\n        const request = chrome.desktopCapture.chooseDesktopMedia(\n            [\"tab\"], tabs[0], () => {});\n        chrome.test.sendMessage(String(request));\n      });\n    )\");\n\n    picker_factory_.SetTestFlags(test_flags_);\n    ExtensionTestMessageListener requested;\n    const Extension* extension = LoadExtension(test_dir.UnpackedPath());\n    ASSERT_TRUE(extension);\n    const ExtensionId extension_id = extension->id();\n    requested.set_extension_id(extension_id);\n    ASSERT_TRUE(requested.WaitUntilSatisfied());\n    int request_id = 0;\n    ASSERT_TRUE(base::StringToInt(requested.message(), &request_id));\n    const auto workers = ProcessManager::Get(GetProfile())\n                             ->GetServiceWorkersForExtension(extension_id);\n    ASSERT_EQ(1u, workers.size());\n    // Also clean up the intentionally held picker on a failing pre-fix run.\n    // Use the actual request and worker process, not a fabricated dispatch.\n    base::ScopedClosureRunner cleanup(base::BindOnce(\n        [](int process_id, int request_id) {\n          DesktopCaptureRequestsRegistry::GetInstance()->CancelRequest(\n              process_id, request_id);\n        },\n        workers[0].render_process_id.GetUnsafeValue(), request_id));\n    ASSERT_TRUE(\n        base::test::RunUntil([&] { return test_flags_[0].picker_shown; }));\n    ASSERT_FALSE(test_flags_[0].picker_deleted);\n\n    if (reload) {\n      // The replacement worker must not issue a second chooser request.\n      test_dir.WriteFile(FILE_PATH_LITERAL(\"worker.js\"),\n                         \"// Reloaded without requesting capture.\\\\n\");\n      ReloadExtension(extension_id);\n      EXPECT_TRUE(\n          extension_registry()->enabled_extensions().Contains(extension_id));\n    } else {\n      DisableExtension(extension_id);\n      EXPECT_TRUE(\n          extension_registry()->disabled_extensions().Contains(extension_id));\n    }\n    EXPECT_TRUE(test_flags_[0].picker_deleted);\n    EXPECT_FALSE(picker_factory_.picker());\n    // Unload must cancel because the caller went away, not because its target\n    // tab was destroyed or navigated.\n    ASSERT_EQ(target, GetActiveWebContents());\n    EXPECT_EQ(GetURLForPath(\"localhost\", \"/test_file.html\"),\n              target->GetLastCommittedURL());\n  }\n\n private:\n  std::array<FakeDesktopMediaPickerFactory::TestFlags, 1> test_flags_ = {{\n      {.expect_tabs = true, .cancelled = true},\n  }};\n};\n\nIN_PROC_BROWSER_TEST_F(DesktopCaptureAndroidUnloadTest,\n                       DisableClosesPendingWorkerChooser) {\n  CheckPendingWorkerChooser(/*reload=*/false);\n}\n\nIN_PROC_BROWSER_TEST_F(DesktopCaptureAndroidUnloadTest,\n                       ReloadClosesPendingWorkerChooser) {\n  CheckPendingWorkerChooser(/*reload=*/true);\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nclass DesktopCaptureApiMediaPickerOptionsBaseTest\n    : public DesktopCaptureApiTest {\n public:\n"
