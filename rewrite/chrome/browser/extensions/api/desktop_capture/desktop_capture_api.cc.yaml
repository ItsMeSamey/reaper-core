substitutions:
- description: Respect the calling extension incognito authorization for target tabs on Android.
  regex:
    pattern: "            Profile::FromBrowserContext(browser_context()), true,\n            &web_contents))"
    replace: "            Profile::FromBrowserContext(browser_context()),\n#if BUILDFLAG(IS_ANDROID)\n            include_incognito_information(),\n#else\n            true,\n#endif\n            &web_contents))"
