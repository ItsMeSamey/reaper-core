substitutions:

  - description: "Use an explicit platform guard for Android command validation."
    regex:
      pattern: "#include \"base/scoped_observation.h\""
      replace: "#include \"base/scoped_observation.h\"\n#include \"build/build_config.h\""

  - description: "Expose validation at the Android native dispatch boundary."
    regex:
      pattern: "  // The user has accepted the omnibox input."
      replace: "#if BUILDFLAG(IS_ANDROID)\n  // Revalidate a native keyword suggestion after selection: extensions can be\n  // unloaded, disabled, or lose incognito access while suggestions are shown.\n  static bool IsValidAndroidInput(Profile* profile, const GURL& url);\n#endif\n\n  // The user has accepted the omnibox input."
