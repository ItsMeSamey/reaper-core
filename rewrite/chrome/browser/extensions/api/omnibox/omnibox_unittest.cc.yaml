substitutions:

  - description: "Add dependencies for Android native dispatch validation regressions."
    regex:
      pattern: "#include \"testing/platform_test.h\""
      replace: "#include \"testing/platform_test.h\"\n\n#if BUILDFLAG(IS_ANDROID)\n#include \"chrome/test/base/testing_profile.h\"\n#include \"content/public/test/browser_task_environment.h\"\n#include \"extensions/browser/extension_prefs.h\"\n#include \"extensions/browser/extension_registry.h\"\n#include \"extensions/common/extension_builder.h\"\n#endif"

  - description: "Regress stale IDs, direct pages, missing keywords and incognito revocation."
    regex:
      pattern: "}  // namespace extensions\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\nclass AndroidOmniboxInputTest : public testing::Test {\n protected:\n  scoped_refptr<const Extension> AddExtension(bool has_keyword) {\n    ExtensionBuilder builder(has_keyword ? \"keyword\" : \"ordinary\");\n    if (has_keyword) {\n      builder.SetManifestKey(\"omnibox\",\n                             base::DictValue().Set(\"keyword\", \"test\"));\n    }\n    auto extension = builder.Build();\n    ExtensionRegistry::Get(&profile_)->AddEnabled(extension);\n    return extension;\n  }\n\n  bool IsValid(Profile* profile, const GURL& url) {\n    return ExtensionOmniboxEventRouter::IsValidAndroidInput(profile, url);\n  }\n\n  content::BrowserTaskEnvironment task_environment_;\n  TestingProfile profile_;\n};\n\nTEST_F(AndroidOmniboxInputTest, RejectsInvalidStaleAndOrdinaryExtensionUrls) {\n  EXPECT_FALSE(IsValid(nullptr, GURL(\"chrome-extension://missing/?q=test\")));\n  EXPECT_FALSE(IsValid(&profile_, GURL()));\n  EXPECT_FALSE(IsValid(&profile_, GURL(\"https://example.test/?q=test\")));\n  EXPECT_FALSE(IsValid(&profile_, GURL(\"chrome-extension://missing/?q=test\")));\n\n  auto ordinary = AddExtension(false);\n  EXPECT_FALSE(IsValid(&profile_, ordinary->GetResourceURL(\"?q=test\")));\n  auto keyword = AddExtension(true);\n  const GURL command = keyword->GetResourceURL(\"?q=test\");\n  EXPECT_TRUE(IsValid(&profile_, command));\n  EXPECT_TRUE(IsValid(&profile_, keyword->GetResourceURL(\"?q=\")));\n  EXPECT_FALSE(IsValid(&profile_, keyword->GetResourceURL(\"page.html?q=test\")));\n  EXPECT_FALSE(IsValid(&profile_, keyword->GetResourceURL(\"\")));\n  EXPECT_FALSE(IsValid(&profile_, keyword->GetResourceURL(\"?q=test#fragment\")));\n  ExtensionRegistry::Get(&profile_)->RemoveEnabled(keyword->id());\n  EXPECT_FALSE(IsValid(&profile_, command));\n  ExtensionRegistry::Get(&profile_)->AddDisabled(keyword);\n  EXPECT_FALSE(IsValid(&profile_, command));\n}\n\nTEST_F(AndroidOmniboxInputTest, RechecksIncognitoPermission) {\n  auto keyword = AddExtension(true);\n  const GURL command = keyword->GetResourceURL(\"?q=test\");\n  Profile* incognito = profile_.GetPrimaryOTRProfile(/*create_if_needed=*/true);\n  EXPECT_TRUE(IsValid(&profile_, command));\n  EXPECT_FALSE(IsValid(incognito, command));\n  ExtensionPrefs::Get(&profile_)->SetIsIncognitoEnabled(keyword->id(), true);\n  EXPECT_TRUE(IsValid(incognito, command));\n  ExtensionPrefs::Get(&profile_)->SetIsIncognitoEnabled(keyword->id(), false);\n  EXPECT_FALSE(IsValid(incognito, command));\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n}  // namespace extensions\n"
