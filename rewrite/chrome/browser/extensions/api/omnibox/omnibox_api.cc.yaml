{
  "substitutions": [
    {
      "description": "Respect Android incognito extension eligibility at dispatch time.",
      "regex": {
        "pattern": "#include \"extensions/browser/extension_prefs_factory.h\"",
        "replace": "#include \"extensions/browser/extension_prefs_factory.h\"\n#include \"extensions/browser/extension_util.h\"\n#include \"extensions/common/constants.h\""
      }
    },
    {
      "description": "Parse only a real keyword-command URL at the Android native boundary.",
      "regex": {
        "pattern": "#include \"ui/base/window_open_disposition.h\"",
        "replace": "#if BUILDFLAG(IS_ANDROID)\n#include \"net/base/url_util.h\"\n#endif\n#include \"ui/base/window_open_disposition.h\""
      }
    },
    {
      "description": "Reject stale, disabled, non-keyword and incognito-ineligible Android commands.",
      "regex": {
        "pattern": "// static\nvoid ExtensionOmniboxEventRouter::OnInputEntered(",
        "replace": "#if BUILDFLAG(IS_ANDROID)\n// static\nbool ExtensionOmniboxEventRouter::IsValidAndroidInput(Profile* profile,\n                                                     const GURL& url) {\n  if (!profile || !url.is_valid() || !url.SchemeIs(kExtensionScheme) ||\n      url.path_piece() != \"/\" || url.has_ref() || url.has_username() ||\n      url.has_password() || url.has_port()) {\n    return false;\n  }\n  std::string input;\n  if (!net::GetValueForKeyInQuery(url, \"q\", &input)) {\n    return false;\n  }\n  const Extension* extension = ExtensionRegistry::Get(profile)\n                                   ->enabled_extensions().GetByID(url.host());\n  return extension && !OmniboxInfo::GetKeyword(extension).empty() &&\n         (!profile->IsOffTheRecord() ||\n          util::IsIncognitoEnabled(extension->id(), profile));\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n// static\nvoid ExtensionOmniboxEventRouter::OnInputEntered("
      }
    },
    {
      "description": "Use the selected GURL accessor and own the extension identifier at the Android omnibox boundary.",
      "regex": {
        "re_pattern": "url\\.path_piece\\(\\)",
        "replace": "url.path()"
      },
      "count": 1
    },
    {
      "description": "Use the selected GURL accessor and own the extension identifier at the Android omnibox boundary.",
      "regex": {
        "re_pattern": "GetByID\\(url\\.host\\(\\)\\)",
        "replace": "GetByID(std::string(url.host()))"
      },
      "count": 1
    }
  ]
}
