substitutions:

  - description: "Link the Android query parser without changing desktop dependencies."
    regex:
      pattern: "\n}\n\nif (enable_desktop_android_extensions)"
      replace: "\n  if (is_android) {\n    deps += [ \"//net\" ]\n  }\n}\n\nif (enable_desktop_android_extensions)"
