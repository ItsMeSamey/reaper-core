substitutions:
- description: Declare optional decoder result
  regex:
    pattern: '#include <memory>

      '
    replace: '#include <memory>

      #include <optional>

      '
  count: 1
- description: Direct Android guard provider
  regex:
    pattern: '#include "base/memory/raw_ptr.h"

      '
    replace: '#include "base/memory/raw_ptr.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Expose Android-only shared ID helpers
  regex:
    pattern: 'namespace extensions {

      '
    replace: "namespace extensions {\n\n#if BUILDFLAG(IS_ANDROID)\n// Android shares one notification ID space across profiles.\
      \ Keep caller IDs\n// separate from the profile-scoped keys sent to that platform bridge.\nstd::string CreateProfileScopedNotificationId(Profile*\
      \ profile,\n                                            const std::string& extension_id,\n                         \
      \                   const std::string& id);\n\n// New keys must belong to this profile and extension. Legacy keys remain\n\
      // readable for notifications persisted by older builds; they carry no profile\n// witness and therefore retain their\
      \ previous ownership ambiguity.\nstd::optional<std::string> GetUnscopedNotificationId(\n    Profile* profile,\n    const\
      \ std::string& extension_id,\n    const std::string& scoped_id);\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
