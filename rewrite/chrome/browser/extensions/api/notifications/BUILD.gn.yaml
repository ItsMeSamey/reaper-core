# Android extension notification policy and payload support.
substitutions:
- description: Compile notification policy JNI on Android only
  regex:
    re_pattern: \ \ configs\ \+=\ \[\ "//build/config/compiler:wexit_time_destructors"\ \]
    replace: "  configs += [ \"//build/config/compiler:wexit_time_destructors\" ]\n  if (is_android) {\n    deps = [ \"//chrome/browser/notifications:jni_headers\" ]\n  } else {\n    deps = []\n  }"
- description: Keep existing notification dependencies alongside the Android status bridge
  regex:
    re_pattern: '\ \ deps\ =\ \[\

      \ \ \ \ "//build:chromeos_buildflags",'
    replace: "  deps += [\n    \"//build:chromeos_buildflags\","
