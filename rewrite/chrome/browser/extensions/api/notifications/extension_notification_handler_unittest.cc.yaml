substitutions:
- description: Explicit recording-event container dependencies
  regex:
    pattern: '#include <string>

      '
    replace: '#include <string>

      #include <utility>

      #include <vector>

      '
  count: 1
- description: Owned temporary test profiles
  regex:
    pattern: '#include "base/functional/bind.h"

      '
    replace: '#include "base/files/scoped_temp_dir.h"

      #include "base/functional/bind.h"

      '
  count: 1
- description: Direct native helper, notification tester and Android guard dependencies
  regex:
    pattern: '#include "base/functional/callback_helpers.h"

      '
    replace: '#include "base/functional/callback_helpers.h"

      #include "base/memory/raw_ptr.h"

      #include "base/values.h"

      #include "build/build_config.h"

      #include "chrome/browser/extensions/api/notifications/extension_notification_display_helper.h"

      #include "chrome/browser/extensions/api/notifications/extension_notification_display_helper_factory.h"

      #include "chrome/browser/notifications/notification_display_service_tester.h"

      '
  count: 1
- description: Real owned notification construction types
  regex:
    pattern: '#include "testing/gtest/include/gtest/gtest.h"

      '
    replace: '#include "testing/gtest/include/gtest/gtest.h"

      #include "ui/base/models/image_model.h"

      #include "ui/message_center/public/cpp/notification.h"

      #include "ui/message_center/public/cpp/notifier_id.h"

      '
  count: 1
- description: 'Existing native fixture: owned profile keys, actual handler events/cleanup, legacy callbacks'
  regex:
    pattern: '

      }  // namespace

      }  // namespace extensions

      '
    replace: "\n#if BUILDFLAG(IS_ANDROID)\nclass RecordingExtensionNotificationHandler : public ExtensionNotificationHandler\
      \ {\n public:\n  struct RecordedEvent {\n    raw_ptr<Profile> profile;\n    ExtensionId extension_id;\n    std::string\
      \ name;\n    base::ListValue args;\n  };\n\n  const std::vector<RecordedEvent>& events() const { return events_; }\n\
      \n private:\n  void SendEvent(Profile* profile,\n                 const ExtensionId& extension_id,\n               \
      \  events::HistogramValue histogram_value,\n                 const std::string& event_name,\n                 EventRouter::UserGestureState\
      \ user_gesture,\n                 base::ListValue args) override {\n    events_.push_back({profile, extension_id, event_name,\
      \ std::move(args)});\n  }\n\n  std::vector<RecordedEvent> events_;\n};\n\nTEST_F(ExtensionNotificationHandlerTest, AndroidProfileScopedIdentityIsolation)\
      \ {\n  base::ScopedTempDir profiles_dir;\n  ASSERT_TRUE(profiles_dir.CreateUniqueTempDir());\n  TestingProfile::Builder\
      \ regular_builder;\n  regular_builder.SetPath(profiles_dir.GetPath().AppendASCII(\"Profile A\"));\n  auto regular =\
      \ regular_builder.Build();\n  TestingProfile::Builder other_builder;\n  other_builder.SetPath(profiles_dir.GetPath().AppendASCII(\"\
      Profile B\"));\n  auto other = other_builder.Build();\n  Profile* incognito = regular->GetPrimaryOTRProfile(/*create_if_needed=*/true);\n\
      \  ASSERT_TRUE(incognito);\n\n  const std::string public_id = \"report:reaper-extension:v1:ordinary-id\";\n  const std::string\
      \ regular_id =\n      CreateProfileScopedNotificationId(regular.get(), kChromeExtensionId, public_id);\n  const std::string\
      \ incognito_id =\n      CreateProfileScopedNotificationId(incognito, kChromeExtensionId, public_id);\n  const std::string\
      \ other_id =\n      CreateProfileScopedNotificationId(other.get(), kChromeExtensionId, public_id);\n  EXPECT_NE(regular_id,\
      \ incognito_id);\n  EXPECT_NE(regular_id, other_id);\n  EXPECT_NE(incognito_id, other_id);\n  EXPECT_EQ(regular_id,\n\
      \            CreateProfileScopedNotificationId(regular.get(), kChromeExtensionId,\n                                \
      \              public_id));\n  EXPECT_EQ(incognito_id,\n            CreateProfileScopedNotificationId(incognito, kChromeExtensionId,\
      \ public_id));\n  EXPECT_EQ(std::optional<std::string>(public_id),\n            GetUnscopedNotificationId(regular.get(),\
      \ kChromeExtensionId, regular_id));\n  EXPECT_EQ(std::optional<std::string>(public_id),\n            GetUnscopedNotificationId(incognito,\
      \ kChromeExtensionId, incognito_id));\n  EXPECT_FALSE(GetUnscopedNotificationId(regular.get(), kChromeExtensionId,\n\
      \                                         incognito_id));\n  EXPECT_FALSE(GetUnscopedNotificationId(incognito, kChromeExtensionId,\
      \ regular_id));\n  EXPECT_FALSE(GetUnscopedNotificationId(other.get(), kChromeExtensionId, regular_id));\n  EXPECT_FALSE(GetUnscopedNotificationId(regular.get(),\n\
      \                                         \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\", regular_id));\n  EXPECT_FALSE(GetUnscopedNotificationId(regular.get(),\
      \ kChromeExtensionId,\n                                         \"reaper-extension:v1:\"));\n  EXPECT_FALSE(GetUnscopedNotificationId(\n\
      \      regular.get(), kChromeExtensionId,\n      CreateProfileScopedNotificationId(regular.get(), kChromeExtensionId,\
      \ \"\")));\n}\n\nTEST_F(ExtensionNotificationHandlerTest,\n       AndroidProfileScopedEventsPreserveCallerAndProfile)\
      \ {\n  TestingProfile::Builder builder;\n  auto regular = builder.Build();\n  Profile* incognito = regular->GetPrimaryOTRProfile(/*create_if_needed=*/true);\n\
      \  ASSERT_TRUE(incognito);\n  NotificationDisplayServiceTester display_tester(regular.get());\n  auto* helper = ExtensionNotificationDisplayHelperFactory::GetForProfile(regular.get());\n\
      \  ASSERT_TRUE(helper);\n  const std::string public_id = \"same-notification-id\";\n  const std::string regular_id =\n\
      \      CreateProfileScopedNotificationId(regular.get(), kChromeExtensionId, public_id);\n  const std::string incognito_id\
      \ =\n      CreateProfileScopedNotificationId(incognito, kChromeExtensionId, public_id);\n  const GURL origin(kChromeExtensionOrigin);\n\
      \  message_center::Notification notification(\n      message_center::NOTIFICATION_TYPE_SIMPLE, regular_id, u\"Title\"\
      , u\"Body\",\n      ui::ImageModel(), u\"Source\", origin,\n      message_center::NotifierId(message_center::NotifierType::APPLICATION,\n\
      \                                 kChromeExtensionId),\n      message_center::RichNotificationData(), nullptr);\n  helper->Display(notification);\n\
      \  ASSERT_TRUE(helper->GetByNotificationId(regular_id));\n\n  RecordingExtensionNotificationHandler handler;\n  int\
      \ completions = 0;\n  auto completed = [&completions]() {\n    return base::BindOnce([](int* count) { ++*count; }, &completions);\n\
      \  };\n  handler.OnClick(regular.get(), origin, incognito_id, std::nullopt, std::nullopt,\n                   completed());\n\
      \  handler.OnClose(regular.get(), origin, incognito_id, true, completed());\n  EXPECT_EQ(2, completions);\n  EXPECT_TRUE(handler.events().empty());\n\
      \  EXPECT_TRUE(helper->GetByNotificationId(regular_id));\n\n  handler.OnClick(regular.get(), origin, regular_id, std::nullopt,\
      \ std::nullopt,\n                   completed());\n  handler.OnClick(incognito, origin, incognito_id, std::nullopt,\
      \ std::nullopt,\n                   completed());\n  handler.OnClick(incognito, origin, incognito_id, 1, std::nullopt,\
      \ completed());\n  handler.OnClose(regular.get(), origin, regular_id, false, completed());\n  handler.OnClose(incognito,\
      \ origin, incognito_id, true, completed());\n  EXPECT_EQ(7, completions);\n  ASSERT_EQ(5u, handler.events().size());\n\
      \  const std::vector<Profile*> expected_profiles = {\n      regular.get(), incognito, incognito, regular.get(), incognito};\n\
      \  const std::vector<std::string> expected_names = {\n      \"notifications.onClicked\", \"notifications.onClicked\"\
      ,\n      \"notifications.onButtonClicked\", \"notifications.onClosed\",\n      \"notifications.onClosed\"};\n  for (size_t\
      \ i = 0; i < handler.events().size(); ++i) {\n    SCOPED_TRACE(i);\n    const auto& event = handler.events()[i];\n \
      \   EXPECT_EQ(expected_profiles[i], event.profile.get());\n    EXPECT_EQ(kChromeExtensionId, event.extension_id);\n\
      \    EXPECT_EQ(expected_names[i], event.name);\n    ASSERT_EQ(i < 2 ? 1u : 2u, event.args.size());\n    EXPECT_EQ(public_id,\
      \ event.args[0].GetString());\n  }\n  EXPECT_EQ(1, handler.events()[2].args[1].GetInt());\n  EXPECT_FALSE(handler.events()[3].args[1].GetBool());\n\
      \  EXPECT_TRUE(handler.events()[4].args[1].GetBool());\n  EXPECT_FALSE(helper->GetByNotificationId(regular_id));\n}\n\
      \nTEST_F(ExtensionNotificationHandlerTest, AndroidLegacyNotificationEventsRemainReadable) {\n  TestingProfile::Builder\
      \ builder;\n  auto regular = builder.Build();\n  Profile* incognito = regular->GetPrimaryOTRProfile(/*create_if_needed=*/true);\n\
      \  ASSERT_TRUE(incognito);\n  // The old format has no profile witness. Preserve event compatibility rather\n  // than\
      \ claiming the new isolation guarantee for these persisted keys.\n  const std::string public_id = \"reaper-extension:v1:legacy-caller-id\"\
      ;\n  const std::string legacy_id = std::string(kChromeExtensionId) + \"-\" + public_id;\n  EXPECT_EQ(std::optional<std::string>(public_id),\n\
      \            GetUnscopedNotificationId(regular.get(), kChromeExtensionId, legacy_id));\n  EXPECT_EQ(std::optional<std::string>(public_id),\n\
      \            GetUnscopedNotificationId(incognito, kChromeExtensionId, legacy_id));\n  RecordingExtensionNotificationHandler\
      \ handler;\n  handler.OnClick(regular.get(), GURL(kChromeExtensionOrigin), legacy_id,\n                   std::nullopt,\
      \ std::nullopt, base::DoNothing());\n  handler.OnClose(incognito, GURL(kChromeExtensionOrigin), legacy_id, false,\n\
      \                   base::DoNothing());\n  ASSERT_EQ(2u, handler.events().size());\n  EXPECT_EQ(regular.get(), handler.events()[0].profile.get());\n\
      \  EXPECT_EQ(incognito, handler.events()[1].profile.get());\n  EXPECT_EQ(\"notifications.onClicked\", handler.events()[0].name);\n\
      \  EXPECT_EQ(\"notifications.onClosed\", handler.events()[1].name);\n  EXPECT_EQ(public_id, handler.events()[0].args[0].GetString());\n\
      \  EXPECT_EQ(public_id, handler.events()[1].args[0].GetString());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace\n\
      }  // namespace extensions\n"
  count: 1
- description: Avoid recorder getter hiding events namespace
  regex:
    pattern: ' events() const'
    replace: ' recorded_events() const'
  count: 1
- description: Use unambiguous recorder getter
  regex:
    pattern: handler.events()
    replace: handler.recorded_events()
  count: 14
- description: Wrap stability assertion
  regex:
    pattern: '            CreateProfileScopedNotificationId(incognito, kChromeExtensionId, public_id));'
    replace: "            CreateProfileScopedNotificationId(incognito, kChromeExtensionId,\n                             \
      \                 public_id));"
  count: 1
- description: Wrap foreign-extension assertion
  regex:
    pattern: '                                         "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", regular_id));'
    replace: "                                         \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\",\n                           \
      \              regular_id));"
  count: 1
- description: Wrap existing helper lookup
  regex:
    pattern: '  auto* helper = ExtensionNotificationDisplayHelperFactory::GetForProfile(regular.get());'
    replace: "  auto* helper =\n      ExtensionNotificationDisplayHelperFactory::GetForProfile(regular.get());"
  count: 1
- description: Wrap legacy test declaration
  regex:
    pattern: TEST_F(ExtensionNotificationHandlerTest, AndroidLegacyNotificationEventsRemainReadable) {
    replace: "TEST_F(ExtensionNotificationHandlerTest,\n       AndroidLegacyNotificationEventsRemainReadable) {"
  count: 1
