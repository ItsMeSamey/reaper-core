substitutions:
- description: Adapt one existing Android internal-ID lookup; public API/event assertion unchanged
  regex:
    pattern: '        GetNotificationIdFromDelegateId(extension->id() + "-FOO");'
    replace: "        GetNotificationIdFromDelegateId(\n#if BUILDFLAG(IS_ANDROID)\n            extensions::CreateProfileScopedNotificationId(profile(),\
      \ extension->id(), \"FOO\"));\n#else\n            extension->id() + \"-FOO\");\n#endif"
  count: 1
- description: Adapt second existing TestByUser Android internal-ID lookup; public API/events and desktop lookup unchanged
  regex:
    pattern: '        GetNotificationIdFromDelegateId(extension->id() + "-BAR");'
    replace: "        GetNotificationIdFromDelegateId(\n#if BUILDFLAG(IS_ANDROID)\n            extensions::CreateProfileScopedNotificationId(\n\
      \                profile(), extension->id(), \"BAR\"));\n#else\n            extension->id() + \"-BAR\");\n#endif"
  count: 1
