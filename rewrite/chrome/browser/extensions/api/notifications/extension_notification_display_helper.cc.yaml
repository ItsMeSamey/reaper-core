substitutions:
- description: Explicit Android profile/encoding dependencies
  regex:
    pattern: '#include "chrome/browser/extensions/api/notifications/extension_notification_display_helper.h"

      '
    replace: '#include "chrome/browser/extensions/api/notifications/extension_notification_display_helper.h"


      #include "build/build_config.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "base/check.h"

      #include "base/strings/string_number_conversions.h"

      #include "chrome/browser/notifications/notification_platform_bridge.h"

      #include "chrome/browser/profiles/profile.h"

      #endif  // BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Encode profile/OTR and reject foreign new keys; preserve legacy decode
  regex:
    pattern: 'namespace extensions {

      '
    replace: "namespace extensions {\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace {\n\n// This cannot be mistaken for an old key,\
      \ which starts with an extension ID.\nconstexpr char kProfileScopedNotificationPrefix[] = \"reaper-extension:v1:\";\n\
      \n}  // namespace\n\nstd::string CreateProfileScopedNotificationId(Profile* profile,\n                             \
      \               const std::string& extension_id,\n                                            const std::string& id)\
      \ {\n  CHECK(profile);\n  std::string scope =\n      base::HexEncode(NotificationPlatformBridge::GetProfileId(profile));\n\
      \  if (profile->IsOffTheRecord()) {\n    scope += \":otr:\" + base::HexEncode(profile->GetOTRProfileID().Serialize());\n\
      \  } else {\n    scope += \":regular\";\n  }\n  return std::string(kProfileScopedNotificationPrefix) + scope + \":\"\
      \ +\n         extension_id + \"-\" + id;\n}\n\nstd::optional<std::string> GetUnscopedNotificationId(\n    Profile* profile,\n\
      \    const std::string& extension_id,\n    const std::string& scoped_id) {\n  if (scoped_id.starts_with(kProfileScopedNotificationPrefix))\
      \ {\n    const std::string expected_prefix =\n        CreateProfileScopedNotificationId(profile, extension_id, \"\"\
      );\n    if (!scoped_id.starts_with(expected_prefix) ||\n        scoped_id.size() == expected_prefix.size()) {\n    \
      \  return std::nullopt;\n    }\n    return scoped_id.substr(expected_prefix.size());\n  }\n\n  // A persisted legacy\
      \ key has no profile witness. Preserve its original\n  // event ID without treating it as proof of profile ownership.\n\
      \  const std::string legacy_prefix = extension_id + \"-\";\n  if (!scoped_id.starts_with(legacy_prefix)) {\n    return\
      \ std::nullopt;\n  }\n  return scoped_id.substr(legacy_prefix.size());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
