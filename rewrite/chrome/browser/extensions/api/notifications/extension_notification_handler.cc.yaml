substitutions:
- description: Direct Android guard declaration
  regex:
    pattern: '#include "base/functional/callback.h"

      '
    replace: '#include "base/functional/callback.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Keep desktop event decoding exact
  regex:
    pattern: "base::ListValue CreateBaseEventArgs(const ExtensionId& extension_id,\n                                    const\
      \ std::string& scoped_notification_id) {\n  // Unscope the notification id before returning it.\n  size_t index_of_separator\
      \ = extension_id.length() + 1;\n  DCHECK_LT(index_of_separator, scoped_notification_id.length());\n  std::string unscoped_notification_id\
      \ =\n      scoped_notification_id.substr(index_of_separator);\n\n  base::ListValue args;\n  args.Append(unscoped_notification_id);\n\
      \  return args;\n}"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nbase::ListValue CreateBaseEventArgs(const ExtensionId& extension_id,\n         \
      \                           const std::string& scoped_notification_id) {\n  // Unscope the notification id before returning\
      \ it.\n  size_t index_of_separator = extension_id.length() + 1;\n  DCHECK_LT(index_of_separator, scoped_notification_id.length());\n\
      \  std::string unscoped_notification_id =\n      scoped_notification_id.substr(index_of_separator);\n\n  base::ListValue\
      \ args;\n  args.Append(unscoped_notification_id);\n  return args;\n}\n#endif"
  count: 1
- description: Validate profile before click/closed event dispatch or helper erase
  regex:
    pattern: '  base::ListValue args = CreateBaseEventArgs(extension_id, notification_id);'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  auto unscoped_id = GetUnscopedNotificationId(profile, extension_id, notification_id);\n\
      \  if (!unscoped_id) {\n    std::move(completed_closure).Run();\n    return;\n  }\n  base::ListValue args;\n  args.Append(*unscoped_id);\n\
      #else\n  base::ListValue args = CreateBaseEventArgs(extension_id, notification_id);\n#endif"
  count: 2
- description: Wrap shared handler decoder call
  regex:
    pattern: '  auto unscoped_id = GetUnscopedNotificationId(profile, extension_id, notification_id);'
    replace: "  auto unscoped_id =\n      GetUnscopedNotificationId(profile, extension_id, notification_id);"
  count: 2
