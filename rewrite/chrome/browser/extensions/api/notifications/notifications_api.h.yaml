# Android extension notification policy and payload support.
substitutions:
- description: Declare Android asynchronous notification-policy ownership
  regex:
    re_pattern: \#include\ "chrome/common/extensions/api/notifications\.h"
    replace: '#include "build/build_config.h"

      #if BUILDFLAG(IS_ANDROID)

      #include "base/memory/weak_ptr.h"

      #include "base/timer/timer.h"

      #endif

      #include "chrome/common/extensions/api/notifications.h"'
- description: Cancel an in-flight Android policy query during profile shutdown
  regex:
    re_pattern: \ \ \~NotificationsGetPermissionLevelFunction\(\)\ override;
    replace: "  ~NotificationsGetPermissionLevelFunction() override;\n#if BUILDFLAG(IS_ANDROID)\n  void OnBrowserContextShutdown() override;\n#endif"
- description: Bound platform policy callback lifetime and ignore late results
  regex:
    re_pattern: \ \ DECLARE_EXTENSION_FUNCTION\("notifications\.getPermissionLevel",
    replace: "#if BUILDFLAG(IS_ANDROID)\n  void OnAndroidNotificationStatus(int status);\n  void FinishAndroidQuery(ResponseValue response);\n  bool waiting_for_android_status_ = false;\n  base::OneShotTimer android_status_timeout_;\n  base::WeakPtrFactory<NotificationsGetPermissionLevelFunction>\n      weak_factory_{this};\n#endif\n  DECLARE_EXTENSION_FUNCTION(\"notifications.getPermissionLevel\","
- description: Format modified Android notification implementation
  regex:
    re_pattern: '\ \ void\ OnAndroidNotificationStatus\(int\ status\);\

      \ \ void\ FinishAndroidQuery\(ResponseValue\ response\);\

      \ \ bool\ waiting_for_android_status_\ =\ false;\

      \ \ base::OneShotTimer\ android_status_timeout_;\

      \ \ base::WeakPtrFactory<NotificationsGetPermissionLevelFunction>\

      \ \ \ \ \ \ weak_factory_\{this\};\

      \#endif\

      \ \ DECLARE_EXTENSION_FUNCTION\("notifications\.getPermissionLevel",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ NOTIFICATIONS_GETPERMISSIONLEVEL\)\

      \};\

      '
    replace: "  void OnAndroidNotificationStatus(int status);\n  void FinishAndroidQuery(ResponseValue response);\n  bool waiting_for_android_status_ = false;\n  base::OneShotTimer android_status_timeout_;\n  base::WeakPtrFactory<NotificationsGetPermissionLevelFunction> weak_factory_{\n      this};\n#endif\n  DECLARE_EXTENSION_FUNCTION(\"notifications.getPermissionLevel\",\n                             NOTIFICATIONS_GETPERMISSIONLEVEL)\n};\n"
