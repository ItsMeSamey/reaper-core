substitutions:
  - description: "Use existing histogram delta assertions for Android"
    regex:
      pattern: "#include \"base/test/metrics/user_action_tester.h\"\n"
      replace: "#include \"build/build_config.h\"\n#if BUILDFLAG(IS_ANDROID)\n#include \"base/test/metrics/histogram_tester.h\"\n#endif\n#include \"base/test/metrics/user_action_tester.h\"\n"
    count: 1
  - description: "Keep desktop UKM expected-value metadata scoped"
    regex:
      pattern: "constexpr int64_t kExtensionUsageUkms[] = {1, 2, 3, 4, 5, 6};\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nconstexpr int64_t kExtensionUsageUkms[] = {1, 2, 3, 4, 5, 6};\n#endif\n"
    count: 1
  - description: "Retain original desktop recording validators"
    regex:
      pattern: "// Represents a bucket in a sparse histogram.\nstruct Bucket {\n  int histogram_value;\n  int count;\n};\n\n// We expect the following sparse histograms.\nconstexpr struct SparseHistogram {\n  const char* name;\n  int bucket_count;\n  std::array<Bucket, 3> buckets;\n} g_sparse_histograms[] = {{\"test.sparse.1\", 1, {{{42, 1}}}},\n                           {\"test.sparse.2\", 1, {{{24, 2}}}},\n                           {\"test.sparse.3\", 3, {{{1, 1}, {2, 2}, {3, 3}}}}};\n\nvoid ValidateUserActions(const base::UserActionTester& user_action_tester,\n                         base::span<const RecordedUserAction> recorded) {\n  for (const auto& ua : recorded) {\n    EXPECT_EQ(ua.count, user_action_tester.GetActionCount(ua.name));\n  }\n}\n\nvoid ValidateExtensionUsageUkm(const ukm::TestAutoSetUkmRecorder& ukm_recorder,\n                               base::span<const int64_t> expected_ukms) {\n  auto ukm_entries = ukm_recorder.GetEntriesByName(\n      ukm::builders::Extensions_ExtensionUsage::kEntryName);\n  ASSERT_EQ(expected_ukms.size(), ukm_entries.size());\n\n  for (size_t i = 0; i < expected_ukms.size(); ++i) {\n    ukm_recorder.ExpectEntryMetric(\n        ukm_entries[i], ukm::builders::Extensions_ExtensionUsage::kActionName,\n        expected_ukms[i]);\n  }\n}\n\nvoid ValidateSparseHistogramSamples(\n    const std::string& name,\n    const base::HistogramSamples& samples) {\n  for (const auto& sparse_histogram : g_sparse_histograms) {\n    if (std::string(name) == sparse_histogram.name) {\n      for (int j = 0; j < sparse_histogram.bucket_count; ++j) {\n        const Bucket& bucket = sparse_histogram.buckets[j];\n        EXPECT_EQ(bucket.count, samples.GetCount(bucket.histogram_value));\n      }\n    }\n  }\n}\n\nvoid ValidateHistograms(base::span<const RecordedHistogram> recorded) {\n  const base::StatisticsRecorder::Histograms histograms =\n      base::StatisticsRecorder::GetHistograms();\n\n  // Code other than the tests tun here will record some histogram values, but\n  // we will ignore those. This function validates that all the histogram we\n  // expect to see are present in the list, and that their basic info is\n  // correct.\n  for (const auto& r : recorded) {\n    size_t j = 0;\n    for (j = 0; j < histograms.size(); ++j) {\n      base::HistogramBase* histogram(histograms[j]);\n      if (std::string(r.name) == histogram->histogram_name()) {\n        std::unique_ptr<base::HistogramSamples> snapshot =\n            histogram->SnapshotSamples();\n        base::HistogramBase::Count32 sample_count = snapshot->TotalCount();\n        EXPECT_EQ(r.count, sample_count);\n\n        EXPECT_EQ(r.type, histogram->GetHistogramType());\n        if (r.type == base::SPARSE_HISTOGRAM) {\n          ValidateSparseHistogramSamples(r.name, *snapshot);\n        } else {\n          EXPECT_TRUE(\n              histogram->HasConstructionArguments(r.min, r.max, r.buckets));\n        }\n        break;\n      }\n    }\n    EXPECT_LT(j, histograms.size());\n  }\n}\n\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n// Represents a bucket in a sparse histogram.\nstruct Bucket {\n  int histogram_value;\n  int count;\n};\n\n// We expect the following sparse histograms.\nconstexpr struct SparseHistogram {\n  const char* name;\n  int bucket_count;\n  std::array<Bucket, 3> buckets;\n} g_sparse_histograms[] = {{\"test.sparse.1\", 1, {{{42, 1}}}},\n                           {\"test.sparse.2\", 1, {{{24, 2}}}},\n                           {\"test.sparse.3\", 3, {{{1, 1}, {2, 2}, {3, 3}}}}};\n\nvoid ValidateUserActions(const base::UserActionTester& user_action_tester,\n                         base::span<const RecordedUserAction> recorded) {\n  for (const auto& ua : recorded) {\n    EXPECT_EQ(ua.count, user_action_tester.GetActionCount(ua.name));\n  }\n}\n\nvoid ValidateExtensionUsageUkm(const ukm::TestAutoSetUkmRecorder& ukm_recorder,\n                               base::span<const int64_t> expected_ukms) {\n  auto ukm_entries = ukm_recorder.GetEntriesByName(\n      ukm::builders::Extensions_ExtensionUsage::kEntryName);\n  ASSERT_EQ(expected_ukms.size(), ukm_entries.size());\n\n  for (size_t i = 0; i < expected_ukms.size(); ++i) {\n    ukm_recorder.ExpectEntryMetric(\n        ukm_entries[i], ukm::builders::Extensions_ExtensionUsage::kActionName,\n        expected_ukms[i]);\n  }\n}\n\nvoid ValidateSparseHistogramSamples(\n    const std::string& name,\n    const base::HistogramSamples& samples) {\n  for (const auto& sparse_histogram : g_sparse_histograms) {\n    if (std::string(name) == sparse_histogram.name) {\n      for (int j = 0; j < sparse_histogram.bucket_count; ++j) {\n        const Bucket& bucket = sparse_histogram.buckets[j];\n        EXPECT_EQ(bucket.count, samples.GetCount(bucket.histogram_value));\n      }\n    }\n  }\n}\n\nvoid ValidateHistograms(base::span<const RecordedHistogram> recorded) {\n  const base::StatisticsRecorder::Histograms histograms =\n      base::StatisticsRecorder::GetHistograms();\n\n  // Code other than the tests tun here will record some histogram values, but\n  // we will ignore those. This function validates that all the histogram we\n  // expect to see are present in the list, and that their basic info is\n  // correct.\n  for (const auto& r : recorded) {\n    size_t j = 0;\n    for (j = 0; j < histograms.size(); ++j) {\n      base::HistogramBase* histogram(histograms[j]);\n      if (std::string(r.name) == histogram->histogram_name()) {\n        std::unique_ptr<base::HistogramSamples> snapshot =\n            histogram->SnapshotSamples();\n        base::HistogramBase::Count32 sample_count = snapshot->TotalCount();\n        EXPECT_EQ(r.count, sample_count);\n\n        EXPECT_EQ(r.type, histogram->GetHistogramType());\n        if (r.type == base::SPARSE_HISTOGRAM) {\n          ValidateSparseHistogramSamples(r.name, *snapshot);\n        } else {\n          EXPECT_TRUE(\n              histogram->HasConstructionArguments(r.min, r.max, r.buckets));\n        }\n        break;\n      }\n    }\n    EXPECT_LT(j, histograms.size());\n  }\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n"
    count: 1
  - description: "Snapshot histogram sample counts before exercising the existing API fixture"
    regex:
      pattern: "  base::UserActionTester user_action_tester;\n"
      replace: "  base::UserActionTester user_action_tester;\n\n#if BUILDFLAG(IS_ANDROID)\n  base::HistogramTester histogram_tester;\n#endif\n"
    count: 1
  - description: "Keep query and successful recording API calls while asserting no Android recording"
    regex:
      pattern: "  ValidateUserActions(user_action_tester, kUserActions);\n  ValidateExtensionUsageUkm(ukm_recorder, kExtensionUsageUkms);\n  ValidateHistograms(kHistograms);\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  for (const auto& action : kUserActions) {\n    EXPECT_EQ(0, user_action_tester.GetActionCount(action.name));\n  }\n  EXPECT_TRUE(ukm_recorder.GetEntriesByName(\n      ukm::builders::Extensions_ExtensionUsage::kEntryName).empty());\n  for (const auto& histogram : kHistograms) {\n    histogram_tester.ExpectTotalCount(histogram.name, 0);\n  }\n#else\n  ValidateUserActions(user_action_tester, kUserActions);\n  ValidateExtensionUsageUkm(ukm_recorder, kExtensionUsageUkms);\n  ValidateHistograms(kHistograms);\n#endif  // BUILDFLAG(IS_ANDROID)\n"
    count: 1
