        "replace": "  EXPECT_TRUE(\n      event_observer.events().contains(api::tab_groups::OnMoved::kEventName));\n}\n#if BUILDFLAG(IS_ANDROID)\n\n// Create an ordinary destination group from the real incoming-tab hook, before\n// the reparented group is restored. No group-creation notification is simulated.\nclass CreateUnrelatedGroupOnIncomingTab : public TabModelObserver {\n public:\n  CreateUnrelatedGroupOnIncomingTab(TabModel* model,\n                                   TabListInterface* tab_list,\n                                   TabGroupsMoveFunction* function)\n      : model_(model), tab_list_(tab_list), function_(function) {\n    model_->AddObserver(this);\n  }\n\n  ~CreateUnrelatedGroupOnIncomingTab() override {\n    if (model_) {\n      model_->RemoveObserver(this);\n    }\n  }\n\n  void WillAddTab(TabAndroid*, TabModel::TabLaunchType) override {\n    if (handled_incoming_tab_) {\n      return;\n    }\n    handled_incoming_tab_ = true;\n    EXPECT_FALSE(function_->did_respond());\n    unrelated_group_ =\n        tab_list_->CreateTabGroup({tab_list_->GetTab(0)->GetHandle()});\n    EXPECT_TRUE(unrelated_group_.has_value());\n    EXPECT_FALSE(function_->did_respond());\n  }\n\n  void OnTabModelDestroyed(TabModel& model) override {\n    if (&model == model_) {\n      model_ = nullptr;\n    }\n  }\n\n  const std::optional<TabGroupId>& unrelated_group() const {\n    return unrelated_group_;\n  }\n\n private:\n  raw_ptr<TabModel> model_;\n  raw_ptr<TabListInterface> tab_list_;\n  raw_ptr<TabGroupsMoveFunction> function_;\n  bool handled_incoming_tab_ = false;\n  std::optional<TabGroupId> unrelated_group_;\n};\n\nIN_PROC_BROWSER_TEST_F(TabGroupsApiBrowserTest,\n                       AndroidCrossWindowMoveIgnoresUnrelatedGroupCreation) {\n  ASSERT_TRUE(SupportsTabGroups());\n  auto extension = ExtensionBuilder(\"MV3 tabGroups move\")\n                       .SetManifestVersion(3)\n                       .AddAPIPermission(\"tabGroups\")\n                       .Build();\n  TabGroupId group = CreateTabGroup({2, 3, 4});\n  const int group_id = ExtensionTabUtil::GetGroupId(group);\n  BrowserWindowInterface* target_browser =\n      CreateBrowserWindowWithType(BrowserWindowInterface::TYPE_NORMAL);\n  ASSERT_TRUE(ExtensionTabUtil::SupportsTabGroups(target_browser));\n  target_browser->GetWindow()->Activate();\n  TabListInterface* target_tabs = TabListInterface::From(target_browser);\n  ASSERT_TRUE(target_tabs);\n  ASSERT_EQ(1, target_tabs->GetTabCount());\n  TabModel* target_model = TabModelList::FindTabModelWithWindowSessionId(\n      target_browser->GetSessionID());\n  ASSERT_TRUE(target_model);\n\n  auto function = base::MakeRefCounted<TabGroupsMoveFunction>();\n  function->set_extension(extension);\n  {\n    CreateUnrelatedGroupOnIncomingTab create_unrelated(target_model, target_tabs,\n                                                      function.get());\n    constexpr char kFormatArgs[] =\n        R\"([%d, {\"windowId\": %d, \"index\": 1}])\";\n    const std::string args = base::StringPrintf(\n        kFormatArgs, group_id, ExtensionTabUtil::GetWindowId(target_browser));\n    ASSERT_TRUE(api_test_utils::RunFunction(function.get(), args, profile(),\n                                            api_test_utils::FunctionMode::kNone));\n    ASSERT_TRUE(create_unrelated.unrelated_group());\n    EXPECT_NE(group, *create_unrelated.unrelated_group());\n    const base::ListValue* results = function->GetResultListForTest();\n    ASSERT_TRUE(results);\n    ASSERT_EQ(1u, results->size());\n    ASSERT_TRUE((*results)[0].is_dict());\n    const auto& group_info = (*results)[0].GetDict();\n    ASSERT_TRUE(group_info.FindInt(\"id\"));\n    EXPECT_EQ(group_id, *group_info.FindInt(\"id\"));\n    ASSERT_TRUE(group_info.FindInt(\"windowId\"));\n    EXPECT_EQ(ExtensionTabUtil::GetWindowId(target_browser),\n              *group_info.FindInt(\"windowId\"));\n    EXPECT_TRUE(function->HasOneRef());\n  }\n\n  // The normal matching completion retires