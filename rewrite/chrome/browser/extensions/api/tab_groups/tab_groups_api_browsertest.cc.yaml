                     .Append(base::DictValue()\n                                    .Set(\"windowId\", ExtensionTabUtil::GetWindowId(\n                                                         target_browser))\n                                    .Set(\"index\", 1)));\n  api_test_utils::SendResponseHelper response(function.get());\n  function->RunWithValidation().Execute();\n  // This normal cross-window path defers delivery through the persistent store.\n  EXPECT_FALSE(function->did_respond());\n  EXPECT_FALSE(function->HasOneRef());\n  function.reset();\n  EXPECT_FALSE(*destroyed);\n\n  // Request normal window closure before pumping the queued reparenting work.\n  // No model-destruction or API-completion callback is fabricated.\n  target_browser->GetWindow()->Close();\n  response.WaitForResponse();\n  EXPECT_FALSE(response.GetResponse());\n  base::RunLoop().RunUntilIdle();\n  EXPECT_TRUE(*destroyed);\n}\n\nIN_PROC_BROWSER_TEST_F(TabGroupsApiBrowserTest,\n                       AndroidRejectedCrossWindowMoveBalancesArmedReference) {\n  ASSERT_TRUE(SupportsTabGroups());\n  auto extension = ExtensionBuilder(\"MV3 rejected tabGroups move\")\n                       .SetManifestVersion(3)\n                       .AddAPIPermission(\"tabGroups\")\n                       .Build();\n  const TabGroupId group = CreateTabGroup({2, 3, 4});\n  BrowserWindowInterface* target_browser =\n      CreateBrowserWindowWithType(BrowserWindowInterface::TYPE_NORMAL);\n  target_browser->GetWindow()->Activate();\n  ASSERT_TRUE(AddTabAtIndexToBrowser(target_browser, 1, GURL(\"about:blank\"),\n                                     ui::PAGE_TRANSITION_LINK));\n  ASSERT_TRUE(AddTabAtIndexToBrowser(target_browser, 2, GURL(\"about:blank\"),\n                                     ui::PAGE_TRANSITION_LINK));\n  TabListInterface* target_tabs = TabListInterface::From(target_browser);\n  ASSERT_TRUE(target_tabs);\n  ASSERT_TRUE(target_tabs->CreateTabGroup(\n      {target_tabs->GetTab(0)->GetHandle(), target_tabs->GetTab(1)->GetHandle()}));\n\n  auto function = base::MakeRefCounted<TabGroupsMoveFunction>();\n  function->set_extension(extension);\n  const std::string args = base::StringPrintf(\n      R\"([%d, {\"windowId\": %d, \"index\": 1}])\",\n      ExtensionTabUtil::GetGroupId(group),\n      ExtensionTabUtil::GetWindowId(target_browser));\n  EXPECT_EQ(\n      \"Cannot move the group to an index that is in the middle of another group.\",\n      api_test_utils::RunFunctionAndReturnError(function, args, profile()));\n  EXPECT_TRUE(function->HasOneRef());\n  // Immediate rejection has removed the observer, so a real subsequent group\n  // creation cannot deliver a second response or reacquire the move token.\n  EXPECT_TRUE(\n      target_tabs->CreateTabGroup({target_tabs->GetTab(2)->GetHandle()}));\n  EXPECT_TRUE(function->HasOneRef());\n  for (tabs::TabInterface* tab : target_tabs->GetAllTabs()) {\n    tab->Close();\n  }\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace\n#if BUILDFLAG(IS_ANDROID)\n\n// These private arm-helper cases isolate real context-shutdown ownership. The\n// observed browser model belongs to the normal test profile, so they bypass\n// MoveGroup's same-profile eligibility checks and do not prove a full launch.\nclass TabGroupsMoveAndroidLifecycleTest : public TabGroupsApiBrowserTest {\n protected:\n  void ArmPendingMove(TabGroupsMoveFunction* function,\n                      TabModel* model,\n                      TabGroupId group) {\n    function->BeginPendingMove(model, group);\n  }\n};\n\nIN_PROC_BROWSER_TEST_F(TabGroupsMoveAndroidLifecycleTest,\n                       OwningContextShutdownRetiresArmedMove) {\n  TabModel* model = TabModelList::FindTabModelWithWindowSessionId(\n      browser_window_interface()->GetSessionID());\n  ASSERT_TRUE(model);\n  const TabGroupId group = CreateTabGroup({2, 3, 4});\n  ExtensionFunction::EnsureShutdownNotifierFactoryBuilt();\n  auto private_profile = std::make_unique<TestingProfile>();\n  auto dispatcher =\n      std::make_unique<ExtensionFunctionDispatcher>(private_profile.get());\n  auto destroyed = std::make_shared<bool>(false);\n  auto function =\n      base::MakeRefCounted<DestructionObservedTabGroupsMoveFunction>(destroyed);\n  function->SetDispatcher(dispatcher->AsWeakPtr());\n  api_test_utils::SendResponseHelper response(function.get());\n  ArmPendingMove(function.get(), model, group);\n  EXPECT_FALSE(function->HasOneRef());\n\n  // SetDispatcher installed the genuine owning-context shutdown subscription.\n  // Destroy the dispatcher first so it retains no dangling profile pointer.\n  dispatcher.reset();\n  private_profile.reset();\n  EXPECT_EQ(nullptr, function->browser_context());\n  EXPECT_TRUE(function->HasOneRef());\n  EXPECT_FALSE(response.has_response());\n  CreateTabGroup({0});\n  EXPECT_TRUE(function->HasOneRef());\n  EXPECT_FALSE(response.has_response());\n  function.reset();\n  EXPECT_TRUE(*destroyed);\n}\n\nIN_PROC_BROWSER_TEST_F(TabGroupsMoveAndroidLifecycleTest,\n                       UnstartedContextShutdownReleasesNoMoveReference) {\n  ExtensionFunction::EnsureShutdownNotifierFactoryBuilt();\n  auto private_profile = std::make_unique<TestingProfile>();\n  auto dispatcher =\n      std::make_unique<ExtensionFunctionDispatcher>(private_profile.get());\n  auto destroyed = std::make_shared<bool>(false);\n  auto function =\n      base::MakeRefCounted<DestructionObservedTabGroupsMoveFunction>(destroyed);\n  function->SetDispatcher(dispatcher->AsWeakPtr());\n  api_test_utils::SendResponseHelper response(function.get());\n  EXPECT_TRUE(function->HasOneRef());\n  dispatcher.reset();\n  private_profile.reset();\n  EXPECT_EQ(nullptr, function->browser_context());\n  EXPECT_TRUE(function->HasOneRef());\n  EXPECT_FALSE(response.has_response());\n  function.reset();\n  EXPECT_TRUE(*destroyed);\n}\n\nIN_PROC_BROWSER_TEST_F(TabGroupsMoveAndroidLifecycleTest,\n                       TargetRetirementCallbackCanShutdownOwningContext) {\n  ExtensionFunction::EnsureShutdownNotifierFactoryBuilt();\n  struct CallbackState {\n    std::unique_ptr<TestingProfile> profile = std::make_unique<TestingProfile>();\n    std::shared_ptr<bool> destroyed = std::make_shared<bool>(false);\n    int callback_count = 0;\n  };\n  auto state = std::make_shared<CallbackState>();\n  auto dispatcher =\n      std::make_unique<ExtensionFunctionDispatcher>(state->profile.get());\n  BrowserWindowInterface* target_browser =\n      CreateBrowserWindowWithType(BrowserWindowInterface::TYPE_NORMAL);\n  target_browser->GetWindow()->Activate();\n  TabModel* model = TabModelList::FindTabModelWithWindowSessionId(\n      target_browser->GetSessionID());\n  ASSERT_TRUE(model);\n  auto function =\n      base::MakeRefCounted<DestructionObservedTabGroupsMoveFunction>(\n          state->destroyed);\n  function->SetDispatcher(dispatcher->AsWeakPtr());\n  function->set_has_callback(true);\n  function->set_response_callback(base::BindLambdaForTesting(\n      [state](ExtensionFunction::ResponseType response, base::ListValue,\n              const std::string& error, mojom::ExtraResponseDataPtr) {\n        ++state->callback_count;\n        EXPECT_EQ(ExtensionFunction::ResponseType::kFailed, response);\n        EXPECT_EQ(\"Failed to move group.\", error);\n        EXPECT_FALSE(*state->destroyed);\n        state->profile.reset();\n        // The terminal token and callback keeper still protect the function.\n        EXPECT_FALSE(*state->destroyed);\n      }));\n  ArmPendingMove(function.get(), model, CreateTabGroup({2, 3, 4}));\n  dispatcher.reset();\n  function.reset();\n  EXPECT_FALSE(*state->destroyed);\n  target_browser->GetWindow()->Close();\n  ASSERT_TRUE(base::test::RunUntil([&] { return *state->destroyed; }));\n  EXPECT_EQ(1, state->callback_count);\n  EXPECT_FALSE(state->profile);\n}\n\n#endif  // BUILDFLAG(IS_ANDROID)\n}  // namespace extensions\n"
