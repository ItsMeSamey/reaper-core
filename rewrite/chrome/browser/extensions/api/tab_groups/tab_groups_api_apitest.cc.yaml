substitutions:

  - description: "Give the source group a distinguishable snapshot before the cross-window move."
    regex:
      pattern: "  destination_tab_list->OpenTab(GURL(\"about:blank\"), /*index=*/-1);\n\n  TestEventRouterObserver event_observer(EventRouter::Get(profile()));"
      replace: "  destination_tab_list->OpenTab(GURL(\"about:blank\"), /*index=*/-1);\n  tab_list->SetTabGroupVisualData(\n      *group, tab_groups::TabGroupVisualData(\n                  u\"Moved group\", tab_groups::TabGroupColorId::kBlue,\n                  /*is_collapsed=*/false));\n\n  TestEventRouterObserver event_observer(EventRouter::Get(profile()));"

  - description: "Require the Android group-removal event and its original source-window snapshot."
    regex:
      pattern: "  // TODO(crbug.com/511186385): Android does not generate tab group removed\n  // notifications for tab moves across windows.\n#if !BUILDFLAG(IS_ANDROID)\n  event_observer.WaitForEventWithName(api::tab_groups::OnRemoved::kEventName);\n  EXPECT_TRUE(\n      event_observer.events().contains(api::tab_groups::OnRemoved::kEventName));\n#endif"
      replace: "  event_observer.WaitForEventWithName(api::tab_groups::OnRemoved::kEventName);\n  const Event& removed =\n      *event_observer.events().at(api::tab_groups::OnRemoved::kEventName);\n  ASSERT_EQ(1u, removed.event_args.size());\n  const auto& snapshot = removed.event_args[0].GetDict();\n  EXPECT_EQ(ExtensionTabUtil::GetGroupId(*group), snapshot.FindInt(\"id\"));\n  EXPECT_EQ(ExtensionTabUtil::GetWindowId(browser_window_interface()),\n            snapshot.FindInt(\"windowId\"));\n  ASSERT_TRUE(snapshot.FindString(\"title\"));\n  EXPECT_EQ(\"Moved group\", *snapshot.FindString(\"title\"));"

  - description: "Require exactly one removal event for the moved group."
    regex:
      pattern: "  EXPECT_TRUE(\n      event_observer.events().contains(api::tab_groups::OnUpdated::kEventName));\n}\n\nIN_PROC_BROWSER_TEST_F(TabGroupsApiTest, SetGroupTitleToEmoji)"
      replace: "  EXPECT_TRUE(\n      event_observer.events().contains(api::tab_groups::OnUpdated::kEventName));\n  size_t removed_count = 0;\n  for (const auto& event : event_observer.all_events()) {\n    if (event->event_name == api::tab_groups::OnRemoved::kEventName) {\n      ++removed_count;\n    }\n  }\n  EXPECT_EQ(1u, removed_count);\n}\n\nIN_PROC_BROWSER_TEST_F(TabGroupsApiTest, SetGroupTitleToEmoji)"

# Match retained compiler test helpers to current public APIs; preserve ordinary cases/assertions.
  - description: "Compiler API: Use current public read-only extensions::Event::args() accessor."
    regex:
      re_pattern: "\\ \\ ASSERT_EQ\\(1u,\\ removed\\.event_args\\.size\\(\\)\\);\\\n"
      replace: "  ASSERT_EQ(1u, removed.args().size());\n"
    count: 1
  - description: "Compiler API: Use current public read-only extensions::Event::args() accessor."
    regex:
      re_pattern: "\\ \\ const\\ auto\\&\\ snapshot\\ =\\ removed\\.event_args\\[0\\]\\.GetDict\\(\\);\\\n"
      replace: "  const auto& snapshot = removed.args()[0].GetDict();\n"
    count: 1
