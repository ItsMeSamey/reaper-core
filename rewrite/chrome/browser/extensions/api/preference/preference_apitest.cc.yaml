substitutions:

  - description: "Exercise MV3 animation settings and independent read/write permissions on Android."
    regex:
      re_pattern: "\\Z"
      replace: "\n#if BUILDFLAG(IS_ANDROID)\nIN_PROC_BROWSER_TEST_F(ExtensionPreferenceApiTest,\n                       AnimationPolicyMv3RoundTrip) {\n  PrefService* prefs = profile_->GetPrefs();\n  ASSERT_TRUE(prefs->FindPreference(prefs::kAnimationPolicy));\n  prefs->SetString(prefs::kAnimationPolicy, \"once\");\n  extensions::TestExtensionDir dir;\n  dir.WriteManifest(R\"({\n    \"name\": \"Android animation policy\", \"version\": \"1\", \"manifest_version\": 3,\n    \"permissions\": [\"accessibilityFeatures.read\", \"accessibilityFeatures.modify\"],\n    \"background\": {\"service_worker\": \"worker.js\"}\n  })\");\n  dir.WriteFile(FILE_PATH_LITERAL(\"worker.js\"), R\"(\n    chrome.test.runTests([function animationPolicy() {\n      async function run() {\n        const features = chrome.accessibilityFeatures;\n        for (const name of ['spokenFeedback', 'largeCursor', 'stickyKeys',\n             'highContrast', 'screenMagnifier', 'autoclick', 'virtualKeyboard',\n             'caretHighlight', 'cursorHighlight', 'cursorColor',\n             'dockedMagnifier', 'focusHighlight', 'selectToSpeak',\n             'switchAccess', 'dictation']) {\n          chrome.test.assertEq(undefined, features[name]);\n        }\n        const setting = features.animationPolicy;\n        const call = (method, details) => new Promise((resolve, reject) => {\n          setting[method](details, result => {\n            const error = chrome.runtime.lastError;\n            if (error) reject(new Error(error.message));\n            else resolve(result);\n          });\n        });\n        chrome.test.assertEq('once', (await call('get', {})).value);\n        const changed = new Promise(resolve => {\n          function listener(result) {\n            setting.onChange.removeListener(listener);\n            resolve(result);\n          }\n          setting.onChange.addListener(listener);\n        });\n        await call('set', {value: 'none'});\n        chrome.test.assertEq('none', (await changed).value);\n        const controlled = await call('get', {});\n        chrome.test.assertEq('none', controlled.value);\n        chrome.test.assertEq('controlled_by_this_extension',\n                             controlled.levelOfControl);\n        let rejected = false;\n        try { await call('set', {value: 'invalid'}); }\n        catch (error) { rejected = true; }\n        chrome.test.assertTrue(rejected);\n        chrome.test.assertEq('none', (await call('get', {})).value);\n        await call('set', {value: 'allowed'});\n        chrome.test.assertEq('allowed', (await call('get', {})).value);\n        await call('clear', {});\n        const cleared = await call('get', {});\n        chrome.test.assertEq('once', cleared.value);\n        chrome.test.assertEq('controllable_by_this_extension',\n                             cleared.levelOfControl);\n      }\n      run().then(() => chrome.test.succeed(),\n                 error => chrome.test.fail(String(error)));\n    }]);\n  )\");\n  ASSERT_TRUE(RunExtensionTest(dir.UnpackedPath(), {}, {})) << message_;\n  EXPECT_EQ(\"once\", prefs->GetString(prefs::kAnimationPolicy));\n  EXPECT_FALSE(\n      prefs->FindPreference(prefs::kAnimationPolicy)->IsExtensionControlled());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionPreferenceApiTest,\n                       AnimationPolicyMv3ReadDoesNotModify) {\n  PrefService* prefs = profile_->GetPrefs();\n  prefs->SetString(prefs::kAnimationPolicy, \"once\");\n  extensions::TestExtensionDir dir;\n  dir.WriteManifest(R\"({\n    \"name\": \"Read animation policy\", \"version\": \"1\", \"manifest_version\": 3,\n    \"permissions\": [\"accessibilityFeatures.read\"],\n    \"background\": {\"service_worker\": \"worker.js\"}\n  })\");\n  dir.WriteFile(FILE_PATH_LITERAL(\"worker.js\"), R\"(\n    const setting = chrome.accessibilityFeatures.animationPolicy;\n    const denied = \"You do not have permission to access the preference \" +\n        \"'animationPolicy'. Be sure to declare in your manifest what \" +\n        \"permissions you need.\";\n    chrome.test.runTests([\n      function read() {\n        setting.get({}, chrome.test.callbackPass(result => {\n          chrome.test.assertEq('once', result.value);\n        }));\n      },\n      function writeDenied() {\n        setting.set({value: 'none'}, chrome.test.callbackFail(denied));\n      },\n      function clearDenied() {\n        setting.clear({}, chrome.test.callbackFail(denied));\n      }\n    ]);\n  )\");\n  ASSERT_TRUE(RunExtensionTest(dir.UnpackedPath(), {}, {})) << message_;\n  EXPECT_EQ(\"once\", prefs->GetString(prefs::kAnimationPolicy));\n  EXPECT_FALSE(\n      prefs->FindPreference(prefs::kAnimationPolicy)->IsExtensionControlled());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionPreferenceApiTest,\n                       AnimationPolicyMv3ModifyDoesNotRead) {\n  PrefService* prefs = profile_->GetPrefs();\n  prefs->SetString(prefs::kAnimationPolicy, \"allowed\");\n  extensions::TestExtensionDir dir;\n  dir.WriteManifest(R\"({\n    \"name\": \"Modify animation policy\", \"version\": \"1\", \"manifest_version\": 3,\n    \"permissions\": [\"accessibilityFeatures.modify\"],\n    \"background\": {\"service_worker\": \"worker.js\"}\n  })\");\n  dir.WriteFile(FILE_PATH_LITERAL(\"worker.js\"), R\"(\n    const setting = chrome.accessibilityFeatures.animationPolicy;\n    const denied = \"You do not have permission to access the preference \" +\n        \"'animationPolicy'. Be sure to declare in your manifest what \" +\n        \"permissions you need.\";\n    chrome.test.runTests([\n      function readDenied() {\n        setting.get({}, chrome.test.callbackFail(denied));\n      },\n      function write() {\n        setting.set({value: 'none'}, chrome.test.callbackPass());\n      }\n    ]);\n  )\");\n  ASSERT_TRUE(RunExtensionTest(dir.UnpackedPath(), {}, {})) << message_;\n  EXPECT_EQ(\"none\", prefs->GetString(prefs::kAnimationPolicy));\n  EXPECT_TRUE(\n      prefs->FindPreference(prefs::kAnimationPolicy)->IsExtensionControlled());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n"
