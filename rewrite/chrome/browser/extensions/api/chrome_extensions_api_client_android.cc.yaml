substitutions:
  - description: Build the Android extensions code with the core.
    count: 1
    regex:
      pattern: 'BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)'
      replace: 'BUILDFLAG(ENABLE_EXTENSIONS_CORE)'

  - description: "Connect the Android extension API client to the platform power adapter."
    regex:
      pattern: "#include \"base/notimplemented.h\""
      replace: "#include \"base/notimplemented.h\"\n#include \"brave/browser/extensions/android/power/reaper_power_delegate_android.h\""

  - description: "Instantiate one platform power lease owner per existing PowerAPI service."
    regex:
      pattern: "namespace extensions {"
      replace: "namespace extensions {\n\nstd::unique_ptr<AndroidPowerDelegate>\nChromeExtensionsAPIClient::CreateAndroidPowerDelegate(\n    content::BrowserContext* context) const {\n  return CreateReaperAndroidPowerDelegate(context);\n}"
