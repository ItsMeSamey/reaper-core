substitutions:
  - description: Build the Android extensions code with the core.
    count: 2
    regex:
      pattern: 'BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)'
      replace: 'BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE)'
  - description: Prevent duplicate pending Android authentication popups (1).
    regex:
      re_pattern: '\ \ bool\ initial_url_loaded_\ =\ false;\

        \ \ base::ScopedObservation<Profile,\ ProfileObserver>\ profile_observation_\{this\};\

        \#if\ BUILDFLAG\(IS_ANDROID\)\ \&\&\ BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\

        \ \ base::OnceClosure\ popup_displayed_callback_for_testing_;\

        \ \ base::WeakPtrFactory<WebAuthFlow>\ weak_factory_\{this\};\

        \#endif\

        '
      replace: "  bool initial_url_loaded_ = false;\n  base::ScopedObservation<Profile, ProfileObserver> profile_observation_{this};\n#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  bool popup_creation_pending_ = false;\n  base::OnceClosure popup_displayed_callback_for_testing_;\n  base::WeakPtrFactory<WebAuthFlow> weak_factory_{this};\n#endif\n"
