- description: Cancel retired Android extension authentication requests (5).
  regex:
    re_pattern: '\

      void\ IdentityLaunchWebAuthFlowFunction::CompleteAsyncRun\(\

      \ \ \ \ ResponseValue\ response\)\ \{\

      \ \ Respond\(std::move\(response\)\);\

      \ \ if\ \(auth_flow_\)\ \{\

      \ \ \ \ auth_flow_\.release\(\)\->DetachDelegateAndDelete\(\);\

      \ \ \}\

      \ \ Release\(\);\ \ //\ Balanced\ in\ Run\.\

      \}\

      \

      WebAuthFlow\*\ IdentityLaunchWebAuthFlowFunction::GetWebAuthFlowForTesting\(\)\ \{\

      \ \ return\ auth_flow_\.get\(\);\

      '
    replace: "\nvoid IdentityLaunchWebAuthFlowFunction::CompleteAsyncRun(\n    ResponseValue response) {\n#if BUILDFLAG(IS_ANDROID)\n  if (completion_started_) {\n    return;\n  }\n  completion_started_ = true;\n  registry_observation_.Reset();\n  if (auth_flow_) {\n    auth_flow_.release()->DetachDelegateAndDelete();\n  }\n  // Retire the old flow before replying. A test may retain this function, or a\n  // reply may start a new flow for the same extension ID.\n  auth_flow_tracker_.RunAndReset();\n  Respond(std::move(response));\n#else\n  Respond(std::move(response));\n  if (auth_flow_) {\n    auth_flow_.release()->DetachDelegateAndDelete();\n  }\n#endif\n  Release();  // Balanced in Run.\n}\n\n#if BUILDFLAG(IS_ANDROID)\nvoid IdentityLaunchWebAuthFlowFunction::OnExtensionUnloaded(\n    content::BrowserContext* browser_context,\n    const Extension* extension,\n    UnloadedExtensionReason reason) {\n  if (browser_context != this->browser_context() ||\n      extension != this->extension() || completion_started_) {\n    return;\n  }\n  OnAuthFlowFailure(WebAuthFlow::WINDOW_CLOSED);\n}\n\nvoid IdentityLaunchWebAuthFlowFunction::OnShutdown(\n    ExtensionRegistry* registry) {\n  registry_observation_.Reset();\n  OnBrowserContextShutdown();\n}\n#endif\n\nWebAuthFlow* IdentityLaunchWebAuthFlowFunction::GetWebAuthFlowForTesting() {\n  return auth_flow_.get();\n"
