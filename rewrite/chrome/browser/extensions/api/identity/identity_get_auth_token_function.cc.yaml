  regex:
    re_pattern: "\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\ \\ //\\ The\\ fallback\\ accepts\\ an\\ explicit\\ account\\ only\\ when\\ existing\\ scopes\\ can\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  android_explicit_requested_gaia_id_ = gaia_id;\n\n  // The fallback accepts an explicit account only when existing scopes can\n"
- description: "Android explicit consent account guard (2)"
  count: 1
  regex:
    re_pattern: "\\ \\ DCHECK\\(!consent_result\\.empty\\(\\)\\);\\\n\\ \\ remote_consent_approved_\\ =\\ true;\\\n"
    replace: "  DCHECK(!consent_result.empty());\n\n#if BUILDFLAG(IS_ANDROID)\n  if (!android_explicit_requested_gaia_id_.empty() &&\n      android_explicit_requested_gaia_id_ != gaia_id) {\n    CompleteMintTokenFlow();\n    CompleteFunctionWithError(\n        IdentityGetAuthTokenError::FromMintTokenAuthError(\n            \"The consent account does not match the requested account.\"));\n    return;\n  }\n#endif\n\n  remote_consent_approved_ = true;\n"
