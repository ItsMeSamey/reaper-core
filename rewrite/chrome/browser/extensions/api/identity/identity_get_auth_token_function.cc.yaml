# Android OAuth response hardening.
substitutions:
- description: Build the Android extensions code with the core.
  count: 6
  regex:
    pattern: BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)
    replace: BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE)
- description: Use the web OAuth flow unless the Google Chrome API key is used.
  regex:
    pattern: "StartAsyncRun();\n\n  base::OnceCallback next_step ="
    replace: "StartAsyncRun();\n\n  if (!google_apis::IsGoogleChromeAPIKeyUsed()) {\n    StartMintTokenFlow(IdentityMintRequestQueue::MINT_TYPE_NONINTERACTIVE);\n    return RespondLater();\n  }\n  base::OnceCallback next_step ="
- description: The web OAuth flow runs without an account.
  regex:
    re_pattern: (#if !BUILDFLAG\(IS_CHROMEOS\)\n)(  // ChromeOS in kiosk mode may start the mint token flow without account\..*?<< "No Refresh token!";\n)(#endif)
    re_flags:
    - DOTALL
    replace: "\\1  if (google_apis::IsGoogleChromeAPIKeyUsed()) {\n\\2  } else {\n    DCHECK(token_key_.account_info.IsEmpty());\n  }\n\\3"
- description: Reject unsupported explicit Android fallback account selection before queuing
  regex:
    re_pattern: '\ \ token_key_\.scopes\ =\ scopes;\

      \ \ token_key_\.extension_id\ =\ extension\(\)\->id\(\);'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // The browser-based fallback does not receive a verified account subject.\n  // An empty Gaia ID retains the upstream default-account behavior.\n  if (!google_apis::IsGoogleChromeAPIKeyUsed() && !gaia_id.empty()) {\n    auto error = IdentityGetAuthTokenError::FromMintTokenAuthError(\n        \"Account selection is not supported by Android browser-based OAuth.\");\n    RecordFunctionResult(error, remote_consent_approved_);\n    return RespondNow(Error(error.ToString()));\n  }\n#endif\n\n  token_key_.scopes = scopes;\n  token_key_.extension_id = extension()->id();"
- description: Retire Android fallback callbacks before profile shutdown response
  regex:
    re_pattern: 'void\ IdentityGetAuthTokenFunction::OnIdentityAPIShutdown\(\)\ \{\

      '
    replace: "void IdentityGetAuthTokenFunction::OnIdentityAPIShutdown() {\n#if BUILDFLAG(IS_ANDROID)\n  CancelAndroidWebAuthFlow();\n  weak_ptr_factory_.InvalidateWeakPtrs();\n#endif\n"
- description: Keep interactive Android OAuth worker requests alive through consent (1).
  regex:
    re_pattern: 'IdentityGetAuthTokenFunction::\~IdentityGetAuthTokenFunction\(\)\ \{\

      \ \ TRACE_EVENT_END\("identity",\ IdentityMintRequestQueue::GetRequestTrack\(this\)\);\

      \}\

      \

      ExtensionFunction::ResponseAction\ IdentityGetAuthTokenFunction::Run\(\)\ \{\

      \ \ TRACE_EVENT_BEGIN\("identity",\ "IdentityGetAuthTokenFunction",\

      '
    replace: "IdentityGetAuthTokenFunction::~IdentityGetAuthTokenFunction() {\n  TRACE_EVENT_END(\"identity\", IdentityMintRequestQueue::GetRequestTrack(this));\n}\n\n#if BUILDFLAG(IS_ANDROID)\nbool IdentityGetAuthTokenFunction::ShouldKeepWorkerAliveIndefinitely() {\n  // Interactive consent can legitimately outlast the worker request timeout.\n  // Leave silent/default and malformed requests subject to the normal limit.\n  const auto params = api::identity::GetAuthToken::Params::Create(args());\n  return params && params->details &&\n         params->details->interactive.value_or(false);\n}\n#endif\n\nExtensionFunction::ResponseAction IdentityGetAuthTokenFunction::Run() {\n  TRACE_EVENT_BEGIN(\"identity\", \"IdentityGetAuthTokenFunction\",\n"

- description: Retire originating Android getAuthToken request (1).
  count: 1
  regex:
    re_pattern: "\\ \\ AddRef\\(\\);\\\n\\\n\\ \\ identity_api_shutdown_subscription_\\ ="
    replace: "  AddRef();\n#if BUILDFLAG(IS_ANDROID)\n  async_run_active_ = true;\n  registry_observation_.Observe(ExtensionRegistry::Get(browser_context()));\n#endif\n\n  identity_api_shutdown_subscription_ ="
- description: Retire originating Android getAuthToken request (2).
  count: 1
  regex:
    re_pattern: "void\\ IdentityGetAuthTokenFunction::CompleteAsyncRun\\(ResponseValue\\ response\\)\\ \\{\\\n\\ \\ identity_api_shutdown_subscription_\\ =\\ \\{\\};"
    replace: "void IdentityGetAuthTokenFunction::CompleteAsyncRun(ResponseValue response) {\n#if BUILDFLAG(IS_ANDROID)\n  if (!async_run_active_) {\n    return;\n  }\n  async_run_active_ = false;\n  registry_observation_.Reset();\n  weak_ptr_factory_.InvalidateWeakPtrs();\n#endif\n  identity_api_shutdown_subscription_ = {};"
- description: Retire originating Android getAuthToken request (3).
  count: 1
  regex:
    re_pattern: "void\\ IdentityGetAuthTokenFunction::OnIdentityAPIShutdown\\(\\)\\ \\{\\\n\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\ \\ CancelAndroidWebAuthFlow\\(\\);\\\n\\ \\ weak_ptr_factory_\\.InvalidateWeakPtrs\\(\\);\\\n\\#endif\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\nvoid IdentityGetAuthTokenFunction::CancelAndroidAsyncRun(\n    const IdentityGetAuthTokenError& error,\n    bool defer_response) {\n  if (!async_run_active_) {\n    return;\n  }\n  // Retire the original flow before canceling its queue entry or replying.\n  // Deferred WebAuthFlow deletion and late callbacks cannot publish a token.\n  CancelAndroidWebAuthFlow();\n  weak_ptr_factory_.InvalidateWeakPtrs();\n  registry_observation_.Reset();\n  mint_token_flow_.reset();\n  gaia_remote_consent_flow_.reset();\n  token_key_account_access_token_fetcher_.reset();\n  refresh_tokens_loaded_waiter_.reset();\n  scoped_identity_manager_observation_.Reset();\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  accounts_in_cookie_updated_waiter_.reset();\n#endif\n  IdentityAPI::GetFactoryInstance()\n      ->Get(GetProfile())\n      ->mint_queue()\n      ->RequestCancel(token_key_, this);\n\n  if (defer_response) {\n    // All requests for this unloaded Extension must leave the queue before a\n    // response can synchronously start a replacement request with the same ID.\n    content::GetUIThreadTaskRunner({})->PostTask(\n        FROM_HERE,\n        base::BindOnce(&IdentityGetAuthTokenFunction::CompleteFunctionWithError,\n                       weak_ptr_factory_.GetWeakPtr(), error));\n    return;\n  }\n  CompleteFunctionWithError(error);\n}\n\nvoid IdentityGetAuthTokenFunction::OnExtensionUnloaded(\n    content::BrowserContext* browser_context,\n    const Extension* extension,\n    UnloadedExtensionReason reason) {\n  if (browser_context != this->browser_context() ||\n      extension != this->extension()) {\n    return;\n  }\n  CancelAndroidAsyncRun(\n      IdentityGetAuthTokenError(\n          IdentityGetAuthTokenError::State::kRemoteConsentFlowRejected),\n      /*defer_response=*/true);\n}\n\nvoid IdentityGetAuthTokenFunction::OnShutdown(ExtensionRegistry* registry) {\n  registry_observation_.Reset();\n  OnIdentityAPIShutdown();\n}\n#endif\n\nvoid IdentityGetAuthTokenFunction::OnIdentityAPIShutdown() {\n#if BUILDFLAG(IS_ANDROID)\n  CancelAndroidAsyncRun(\n      IdentityGetAuthTokenError(\n          IdentityGetAuthTokenError::State::kBrowserContextShutDown),\n      /*defer_response=*/false);\n#else\n"
- description: Retire originating Android getAuthToken request (4).
  count: 1
  regex:
    re_pattern: "\\ \\ CompleteFunctionWithError\\(IdentityGetAuthTokenError\\(\\\n\\ \\ \\ \\ \\ \\ IdentityGetAuthTokenError::State::kBrowserContextShutDown\\)\\);\\\n\\}\\\n\\\nvoid\\ IdentityGetAuthTokenFunction::StartTokenKeyAccountAccessTokenRequest\\(\\)"
    replace: "  CompleteFunctionWithError(IdentityGetAuthTokenError(\n      IdentityGetAuthTokenError::State::kBrowserContextShutDown));\n#endif\n}\n\nvoid IdentityGetAuthTokenFunction::StartTokenKeyAccountAccessTokenRequest()"
- description: Retire originating Android getAuthToken request (5).
  count: 1
  regex:
    re_pattern: "void\\ IdentityGetAuthTokenFunction::OnShutdown\\(ExtensionRegistry\\*\\ registry\\)\\ \\{\\\n\\ \\ registry_observation_\\.Reset\\(\\);\\\n\\ \\ OnIdentityAPIShutdown\\(\\);\\\n\\}\\\n\\#endif"
    replace: "void IdentityGetAuthTokenFunction::OnShutdown(ExtensionRegistry* registry) {\n  registry_observation_.Reset();\n  OnIdentityAPIShutdown();\n}\n\nvoid IdentityGetAuthTokenFunction::OnBrowserContextShutdown() {\n  OnIdentityAPIShutdown();\n}\n#endif"

- description: Verify scope-aware requested Android OAuth account (1).
  count: 1
  regex:
    re_pattern: "\\ \\ //\\ The\\ browser\\-based\\ fallback\\ does\\ not\\ receive\\ a\\ verified\\ account\\ subject\\.\\\n\\ \\ //\\ An\\ empty\\ Gaia\\ ID\\ retains\\ the\\ upstream\\ default\\-account\\ behavior\\.\\\n\\ \\ if\\ \\(!google_apis::IsGoogleChromeAPIKeyUsed\\(\\)\\ \\&\\&\\ !gaia_id\\.empty\\(\\)\\)\\ \\{\\\n"
    replace: "  // The fallback accepts an explicit account only when existing scopes can\n  // expose its trusted subject. Default/native account behavior is unchanged.\n  if (!google_apis::IsGoogleChromeAPIKeyUsed() && !gaia_id.empty() &&\n      !ConfigureAndroidRequestedAccount(gaia_id.ToString(), scopes)) {\n"

- description: Verify scope-aware requested Android OAuth account (2).
  count: 1
  regex:
    re_pattern: "\\ \\ IdentityTokenCacheValue\\ cache_entry\\ =\\\n\\ \\ \\ \\ \\ \\ id_api\\->token_cache\\(\\)\\->GetToken\\(token_key_\\);\\\n"
    replace: "  IdentityTokenCacheValue cache_entry =\n#if BUILDFLAG(IS_ANDROID)\n      HasAndroidRequestedAccount() ? IdentityTokenCacheValue() :\n#endif\n      id_api->token_cache()->GetToken(token_key_);\n"

