    replace: "}\n#endif\n\n#if BUILDFLAG(IS_ANDROID)\n// Hold the real pending Android task before Activity creation.\n// Releasing the hold runs the ordinary popup/Tab transfer and native callback.\nclass WebAuthFlowPendingWindowAndroidBrowserTest\n    : public WebAuthFlowBrowserTest {\n public:\n  void SetUpOnMainThread() override {\n    WebAuthFlowBrowserTest::SetUpOnMainThread();\n    for (auto* browser : GetAllBrowserWindowInterfaces()) {\n      initial_window_ids_.insert(browser->GetSessionID().id());\n    }\n    ASSERT_TRUE(HeldPendingTaskIds().empty());\n  }\n\n  void TearDownOnMainThread() override {\n    // Delete the flow before disposing only the test-held pending tasks.\n    // This cleanup also runs if an ASSERT failed with duplicate requests held.\n    if (web_auth_flow()) {\n      DeleteWebAuthFlow();\n    }\n    base::RunLoop().RunUntilIdle();\n    Java_BrowserWindowCreatorBridge_clearActivityCreationPauseForTesting(\n        base::android::AttachCurrentThread());\n\n    std::vector<base::WeakPtr<BrowserWindowInterface>> created_windows;\n    for (auto* browser : GetAllBrowserWindowInterfaces()) {\n      if (!initial_window_ids_.contains(browser->GetSessionID().id())) {\n        created_windows.push_back(browser->GetWeakPtr());\n      }\n    }\n    for (const auto& browser : created_windows) {\n      if (browser) {\n        browser->GetWindow()->Close();\n        EXPECT_TRUE(base::test::RunUntil([&browser] { return !browser; }));\n      }\n    }\n    WebAuthFlowBrowserTest::TearDownOnMainThread();\n  }\n\n  std::vector<int> HeldPendingTaskIds() {\n    JNIEnv* env = base::android::AttachCurrentThread();\n    std::vector<int> ids;\n    base::android::JavaIntArrayToIntVector(\n        env,\n        Java_BrowserWindowCreatorBridge_getHeldPendingTaskIdsForTesting(env),\n        &ids);\n    return ids;\n  }\n\n  void PauseActivityCreation() {\n    Java_BrowserWindowCreatorBridge_pauseActivityCreationForTesting(\n        base::android::AttachCurrentThread());\n  }\n\n  void StartHeldFlow(const GURL& url) {\n    PauseActivityCreation();\n    WebAuthFlowTestNavigationObserver navigation(url);\n    StartWebAuthFlow(url);\n    navigation.Wait();\n    ASSERT_TRUE(\n        base::test::RunUntil([this] { return !HeldPendingTaskIds().empty(); }));\n    ASSERT_EQ(1u, HeldPendingTaskIds().size());\n    ASSERT_TRUE(web_contents());\n  }\n\n  void ResumeAndWaitForPopup() {\n    ASSERT_TRUE(web_auth_flow());\n    const auto ids = HeldPendingTaskIds();\n    ASSERT_EQ(1u, ids.size());\n    base::test::TestFuture<void> displayed;\n    web_auth_flow()->SetPopupDisplayedCallbackForTesting(\n        displayed.GetCallback());\n    Java_BrowserWindowCreatorBridge_resumePendingTaskActivityCreationForTesting(\n        base::android::AttachCurrentThread(), ids.front());\n    ASSERT_TRUE(displayed.Wait());\n    ASSERT_TRUE(HeldPendingTaskIds().empty());\n  }\n\n private:\n  std::set<int> initial_window_ids_;\n};\n\nIN_PROC_BROWSER_TEST_F(WebAuthFlowPendingWindowAndroidBrowserTest,\n                       PendingSecondNavigationTransfersOriginalContentsOnce) {\n  const size_t initial_windows = GetAllBrowserWindowInterfaces().size();\n  EXPECT_CALL(mock(), OnAuthFlowFailure(testing::_)).Times(0);\n  const GURL first_url = embedded_test_server()->GetURL(\"/title1.html\");\n  ASSERT_NO_FATAL_FAILURE(StartHeldFlow(first_url));\n  const auto original = web_contents()->GetWeakPtr();\n  const auto held_ids = HeldPendingTaskIds();\n\n  const GURL second_url = embedded_test_server()->GetURL(\"/title2.html\");\n  EXPECT_CALL(mock(), OnAuthFlowURLChange(second_url));\n  ASSERT_TRUE(content::NavigateToURLFromRenderer(original.get(), second_url));\n  ASSERT_TRUE(content::WaitForLoadStop(original.get()));\n  base::RunLoop().RunUntilIdle();\n  EXPECT_EQ(held_ids, HeldPendingTaskIds());\n  EXPECT_EQ(initial_windows, GetAllBrowserWindowInterfaces().size());\n  ASSERT_TRUE(original);\n  ASSERT_EQ(original.get(), web_contents());\n\n  ASSERT_NO_FATAL_FAILURE(ResumeAndWaitForPopup());\n  ASSERT_TRUE(original);\n  auto* popup = browser_window_util::GetBrowserForTabContents(*original);\n  ASSERT_TRUE(popup);\n  EXPECT_EQ(BrowserWindowInterface::TYPE_POPUP, popup->GetType());\n  EXPECT_EQ(GetProfile(), popup->GetProfile());\n  EXPECT_EQ(initial_windows + 1, GetAllBrowserWindowInterfaces().size());\n  auto* tabs = TabListInterface::From(popup);\n  ASSERT_TRUE(tabs);\n  // The existing creator may bootstrap another tab before WebAuthFlow inserts\n  // the provider contents. This regression only promises one popup request and\n  // one transfer of the original contents, not removal of that bootstrap tab.\n  int original_contents_count = 0;\n  for (auto* tab : tabs->GetAllTabs()) {\n    if (tab->GetContents() == original.get()) {\n      ++original_contents_count;\n    }\n  }\n  EXPECT_EQ(1, original_contents_count);\n  EXPECT_EQ(original.get(), web_contents());\n  EXPECT_EQ(second_url, original->GetLastCommittedURL());\n}\n\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  //  namespace extensions\n"
