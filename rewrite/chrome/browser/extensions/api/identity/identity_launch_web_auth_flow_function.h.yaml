substitutions:
- description: Cancel retired Android extension authentication requests (1).
  regex:
    re_pattern: '\#include\ <string>\

      \

      \#include\ "base/functional/callback_helpers\.h"\

      \#include\ "chrome/browser/extensions/api/identity/launch_web_auth_flow_delegate\.h"\

      \#include\ "chrome/browser/extensions/api/identity/web_auth_flow\.h"\

      \#include\ "extensions/browser/extension_function\.h"\

      \#include\ "extensions/browser/extension_function_histogram_value\.h"\

      \#include\ "extensions/buildflags/buildflags\.h"\

      \

      static_assert\(BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\);\

      \

      namespace\ extensions\ \{\

      \

      class\ IdentityLaunchWebAuthFlowFunction\ :\ public\ ExtensionFunction,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ WebAuthFlow::Delegate\ \{\

      \ public:\

      \ \ DECLARE_EXTENSION_FUNCTION\("identity\.launchWebAuthFlow",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ EXPERIMENTAL_IDENTITY_LAUNCHWEBAUTHFLOW\)\

      '
    replace: "#include <string>\n\n#include \"base/functional/callback_helpers.h\"\n#include \"build/build_config.h\"\n#include \"chrome/browser/extensions/api/identity/launch_web_auth_flow_delegate.h\"\n#include \"chrome/browser/extensions/api/identity/web_auth_flow.h\"\n#include \"extensions/browser/extension_function.h\"\n#include \"extensions/browser/extension_function_histogram_value.h\"\n#include \"extensions/buildflags/buildflags.h\"\n\n#if BUILDFLAG(IS_ANDROID)\n#include \"base/scoped_observation.h\"\n#include \"extensions/browser/extension_registry.h\"\n#include \"extensions/browser/extension_registry_observer.h\"\n#endif\n\nstatic_assert(BUILDFLAG(ENABLE_EXTENSIONS_CORE));\n\nnamespace extensions {\n\nclass IdentityLaunchWebAuthFlowFunction : public ExtensionFunction,\n                                          public WebAuthFlow::Delegate\n#if BUILDFLAG(IS_ANDROID)\n    ,\n                                          public ExtensionRegistryObserver\n#endif\n{\n public:\n  DECLARE_EXTENSION_FUNCTION(\"identity.launchWebAuthFlow\",\n                             EXPERIMENTAL_IDENTITY_LAUNCHWEBAUTHFLOW)\n"
- description: Cancel retired Android extension authentication requests (2).
  regex:
    re_pattern: '\ \ void\ InitFinalRedirectUrls\(const\ std::string\&\ extension_id,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ base::ListValue\*\ redirect_urls\);\

      \

      \ \ std::unique_ptr<WebAuthFlow>\ auth_flow_;\

      \ \ GURL\ default_origin_;\

      \ \ std::vector<GURL>\ final_redirect_urls_;\

      '
    replace: "  void InitFinalRedirectUrls(const std::string& extension_id,\n                             const base::ListValue* redirect_urls);\n\n#if BUILDFLAG(IS_ANDROID)\n  // ExtensionRegistryObserver:\n  void OnExtensionUnloaded(content::BrowserContext* browser_context,\n                           const Extension* extension,\n                           UnloadedExtensionReason reason) override;\n  void OnShutdown(ExtensionRegistry* registry) override;\n\n  bool completion_started_ = false;\n  base::ScopedObservation<ExtensionRegistry, ExtensionRegistryObserver>\n      registry_observation_{this};\n#endif\n\n  std::unique_ptr<WebAuthFlow> auth_flow_;\n  GURL default_origin_;\n  std::vector<GURL> final_redirect_urls_;\n"
