      \

      void\ PageCaptureSaveAsMHTMLFunction::CreateTemporaryFile\(\)\ \{\

      \ \ bool\ success\ =\ base::CreateTemporaryFile\(\&mhtml_path_\);\

      '
    replace: "}\n\nvoid PageCaptureSaveAsMHTMLFunction::OnResponseAck() {\n#if BUILDFLAG(IS_ANDROID)\n  // The dispatcher's extracted response owner releases its reference.\n#else\n  // The extension process has processed the response and has created a\n  // reference to the blob, it is safe for us to go away.\n  // This instance may be deleted after this call, so no code goes after\n  // this!!!\n  Release();  // Balanced in Run()\n#endif\n}\n\n#if BUILDFLAG(IS_ANDROID)\nvoid PageCaptureSaveAsMHTMLFunction::OnBrowserContextShutdown() {\n  if (dispatcher()) {\n    dispatcher()->RemoveResponseTarget(this);\n  }\n}\n\nbool PageCaptureSaveAsMHTMLFunction::HasLiveResponseRecipient() const {\n  if (!browser_context() || !dispatcher()) {\n    return false;\n  }\n  if (is_from_service_worker()) {\n    return true;\n  }\n  auto* frame = sender_document_.AsRenderFrameHostIfValid();\n  return frame && frame == render_frame_host() && frame->IsRenderFrameLive();\n}\n#endif\n\nvoid PageCaptureSaveAsMHTMLFunction::CreateTemporaryFile() {\n  bool success = base::CreateTemporaryFile(&mhtml_path_);\n"
