substitutions:
- description: Balance Android page-capture response ownership (1).
  regex:
    re_pattern: '\#include\ <string>\

      \

      \#include\ "base/memory/scoped_refptr\.h"\

      \#include\ "chrome/common/extensions/api/page_capture\.h"\

      \#include\ "extensions/browser/extension_api_frame_id_map\.h"\

      \#include\ "extensions/browser/extension_function\.h"\

      \#include\ "extensions/buildflags/buildflags\.h"\

      \#include\ "storage/browser/blob/shareable_file_reference\.h"\

      \

      static_assert\(BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\);\

      \

      '
    replace: '#include <string>


      #include "base/memory/scoped_refptr.h"

      #include "build/build_config.h"

      #include "chrome/common/extensions/api/page_capture.h"

      #include "extensions/browser/extension_api_frame_id_map.h"

      #include "extensions/browser/extension_function.h"

      #include "extensions/buildflags/buildflags.h"

      #include "storage/browser/blob/shareable_file_reference.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "content/public/browser/weak_document_ptr.h"

      #endif


      static_assert(BUILDFLAG(ENABLE_EXTENSIONS_CORE));


      '
- description: Balance Android page-capture response ownership (2).
  regex:
    re_pattern: '\ \ \ \ //\ generated\ data\ has\ been\ created\.\

      \ \ \ \ virtual\ void\ OnTemporaryFileCreated\(\

      \ \ \ \ \ \ \ \ scoped_refptr<storage::ShareableFileReference>\ temp_file\)\ =\ 0;\

      \ \ \};\

      \ \ static\ void\ SetTestDelegate\(TestDelegate\*\ delegate\);\

      \

      '
    replace: "    // generated data has been created.\n    virtual void OnTemporaryFileCreated(\n        scoped_refptr<storage::ShareableFileReference> temp_file) = 0;\n#if BUILDFLAG(IS_ANDROID)\n    // Called on UI after ACK ownership is established, before sending success.\n    virtual void OnResponseTargetAdded() {}\n    // Called on UI with the actual serialization result.\n    virtual void OnMHTMLGenerated(int64_t file_size) {}\n#endif\n  };\n  static void SetTestDelegate(TestDelegate* delegate);\n\n"
- description: Balance Android page-capture response ownership (3).
  regex:
    re_pattern: '\ \ \~PageCaptureSaveAsMHTMLFunction\(\)\ override;\

      \ \ ResponseAction\ Run\(\)\ override;\

      \ \ void\ OnResponseAck\(\)\ override;\

      \

      \ \ //\ Returns\ whether\ or\ not\ the\ extension\ has\ permission\ to\ capture\ the\ current\

      \ \ //\ page\.\ Sets\ \|\*error\|\ to\ an\ error\ value\ on\ failure\.\

      '
    replace: "  ~PageCaptureSaveAsMHTMLFunction() override;\n  ResponseAction Run() override;\n  void OnResponseAck() override;\n#if BUILDFLAG(IS_ANDROID)\n  void OnBrowserContextShutdown() override;\n  bool HasLiveResponseRecipient() const;\n#endif\n\n  // Returns whether or not the extension has permission to capture the current\n  // page. Sets |*error| to an error value on failure.\n"
- description: Balance Android page-capture response ownership (4).
  regex:
    re_pattern: '\ \ //\ hasn''t\ navigated\ before\ the\ capture\ completes\.\

      \ \ ExtensionApiFrameIdMap::DocumentId\ document_id_;\

      \

      \ \ std::optional<extensions::api::page_capture::SaveAsMHTML::Params>\ params_;\

      \

      \ \ //\ The\ path\ to\ the\ temporary\ file\ containing\ the\ MHTML\ data\.\

      '
    replace: "  // hasn't navigated before the capture completes.\n  ExtensionApiFrameIdMap::DocumentId document_id_;\n\n#if BUILDFLAG(IS_ANDROID)\n  // The requesting document is separate from the tab being captured.\n  content::WeakDocumentPtr sender_document_;\n#endif\n\n  std::optional<extensions::api::page_capture::SaveAsMHTML::Params> params_;\n\n  // The path to the temporary file containing the MHTML data.\n"
