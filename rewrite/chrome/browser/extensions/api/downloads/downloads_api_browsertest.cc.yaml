- description: Android Downloads exact-item reveal integration (2).
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_CHROMEOS\)\

      IN_PROC_BROWSER_TEST_F\(DownloadExtensionTest,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ DownloadsShowFunction\)\ \{\

      \ \ platform_util::internal::DisableShellOperationsForTesting\(\);\

      \ \ ScopedCancellingItem\ item\(CreateFirstSlowTestDownload\(\)\);\

      \ \ ASSERT_TRUE\(item\.get\(\)\);\

      \

      \ \ RunFunction\(base::MakeRefCounted<DownloadsShowFunction>\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ DownloadItemIdAsArgList\(item\.get\(\)\)\);\

      \}\

      \#endif\

      \

      '
    replace: "#if !BUILDFLAG(IS_CHROMEOS)\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       DownloadsShowFunction) {\n#if BUILDFLAG(IS_ANDROID)\n  // Android must acknowledge the actual Downloads row, not a disabled shell\n  // API.\n  LoadExtension(\"downloads_split\");\n#else\n  platform_util::internal::DisableShellOperationsForTesting();\n#endif\n  ScopedCancellingItem item(CreateFirstSlowTestDownload());\n  ASSERT_TRUE(item.get());\n\n#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(RunFunction(base::MakeRefCounted<DownloadsShowFunction>(),\n                          DownloadItemIdAsArgList(item.get())));\n#else\n  RunFunction(base::MakeRefCounted<DownloadsShowFunction>(),\n              DownloadItemIdAsArgList(item.get()));\n#endif\n}\n#endif\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace {\n\n// The real API's host/profile checks run before this boundary. Hold the native\n// completion so authorization and shutdown races are independent of UI timing.\nclass AndroidDownloadRevealBoundary {\n public:\n  AndroidDownloadRevealBoundary()\n      : callbacks_{base::BindRepeating(&AndroidDownloadRevealBoundary::Show,\n                                       base::Unretained(this)),\n                   base::BindRepeating(&AndroidDownloadRevealBoundary::Cancel,\n                                       base::Unretained(this))},\n        override_(\n            DownloadManagerService::SetDownloadItemRevealCallbacksForTesting(\n                &callbacks_)) {}\n\n  bool shown = true;\n  bool synchronous = false;\n  bool suppress_reply = false;\n  int show_count = 0;\n  int cancel_count = 0;\n  int consumed_count = 0;\n  std::string guid;\n  raw_ptr<content::BrowserContext> item_context = nullptr;\n  base::OnceClosure before_reply;\n\n private:\n  int64_t Show(DownloadItem* item, base::OnceCallback<void(bool)> callback) {\n    ++show_count;\n    guid = item->GetGuid();\n    item_context = content::DownloadItemUtils::GetBrowserContext(item);\n    callback_ = std::move(callback);\n    if (synchronous) {\n      Reply();\n    } else if (!suppress_reply) {\n      base::SingleThreadTaskRunner::GetCurrentDefault()->PostTask(\n          FROM_HERE, base::BindOnce(&AndroidDownloadRevealBoundary::Reply,\n                                    weak_factory_.GetWeakPtr()));\n    }\n    return 41;\n  }\n\n  void Reply() {\n    if (before_reply) {\n      std::move(before_reply).Run();\n    }\n    if (callback_) {\n      ++consumed_count;\n      std::move(callback_).Run(shown);\n    }\n  }\n\n  void Cancel(int64_t token) {\n    EXPECT_EQ(41, token);\n    ++cancel_count;\n    // Java also consumes the JNI callback after request retirement. It must be\n    // harmless when the native function has already cancelled or shut down.\n    if (callback_) {\n      ++consumed_count;\n      std::move(callback_).Run(false);\n    }\n  }\n\n  DownloadManagerService::DownloadItemRevealCallbacksForTesting callbacks_;\n  base::AutoReset<\n      const DownloadManagerService::DownloadItemRevealCallbacksForTesting*>\n      override_;\n  base::OnceCallback<void(bool)> callback_;\n  base::WeakPtrFactory<AndroidDownloadRevealBoundary> weak_factory_{this};\n};\n\nclass ShutdownDownloadsShowFunction : public DownloadsShowFunction {\n public:\n  void SimulateContextShutdown() { OnBrowserContextShutdown(); }\n\n protected:\n  ~ShutdownDownloadsShowFunction() override = default;\n};\n\n}  // namespace\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest, AndroidShowRejectsInvalidId) {\n  LoadExtension(\"downloads_split\");\n  AndroidDownloadRevealBoundary boundary;\n  EXPECT_EQ(download_extension_errors::kInvalidId,\n            RunFunctionAndReturnError(\n                base::MakeRefCounted<DownloadsShowFunction>(), \"[-1]\"));\n  EXPECT_EQ(0, boundary.show_count);\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       AndroidShowWorkerUsesForegroundProfileWithoutGesture) {\n  LoadExtension(\"downloads_split\");\n  ScopedCancellingItem item(CreateFirstSlowTestDownload());\n  ASSERT_TRUE(item.get());\n  AndroidDownloadRevealBoundary boundary;\n  auto function = base::MakeRefCounted<DownloadsShowFunction>();\n  function->set_extension(extension());\n  // Use a real function with an explicitly initialized synthetic worker ID and\n  // no sender WebContents or associated dispatcher window. This isolates native\n  // foreground selection; it does not execute JavaScript or a service worker.\n  function->set_worker_id(\n      WorkerId(extension()->id(), content::ChildProcessId::FromUnsafeValue(1),\n               /*version_id=*/1, /*thread_id=*/1));\n  EXPECT_FALSE(function->user_gesture());\n  EXPECT_TRUE(api_test_utils::RunFunction(\n      function, DownloadItemIdAsArgList(item.get()), current_profile()));\n  EXPECT_EQ(1, boundary.show_count);\n  EXPECT_EQ(item.get()->GetGuid(), boundary.guid);\n  EXPECT_EQ(current_profile(), boundary.item_context);\n  EXPECT_EQ(1, boundary.consumed_count);\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       AndroidShowSynchronousFailureRespondsOnce) {\n  LoadExtension(\"downloads_split\");\n  ScopedCancellingItem item(CreateFirstSlowTestDownload());\n  ASSERT_TRUE(item.get());\n  AndroidDownloadRevealBoundary boundary;\n  boundary.synchronous = true;\n  boundary.shown = false;\n  EXPECT_EQ(\n      download_extension_errors::kInvisibleContext,\n      RunFunctionAndReturnError(base::MakeRefCounted<DownloadsShowFunction>(),\n                                DownloadItemIdAsArgList(item.get())));\n  EXPECT_EQ(1, boundary.show_count);\n  EXPECT_EQ(1, boundary.consumed_count);\n  EXPECT_EQ(1, boundary.cancel_count);\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       AndroidShowRechecksDownloadsPermission) {\n  LoadExtension(\"downloads_split\");\n  ScopedCancellingItem item(CreateFirstSlowTestDownload());\n  ASSERT_TRUE(item.get());\n  const auto* permissions = extension()->permissions_data();\n  auto active = permissions->active_permissions().Clone();\n  auto withheld = permissions->withheld_permissions().Clone();\n  AndroidDownloadRevealBoundary boundary;\n  boundary.before_reply = base::BindLambdaForTesting([&] {\n    permissions->SetPermissions(std::make_unique<const PermissionSet>(),\n                                permissions->withheld_permissions().Clone());\n  });\n  EXPECT_EQ(\n      download_extension_errors::kInvisibleContext,\n      RunFunctionAndReturnError(base::MakeRefCounted<DownloadsShowFunction>(),\n                                DownloadItemIdAsArgList(item.get())));\n  permissions->SetPermissions(std::move(active), std::move(withheld));\n  EXPECT_EQ(1, boundary.consumed_count);\n  EXPECT_EQ(1, boundary.cancel_count);\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       AndroidShowRejectsUnloadedExtensionAtAck) {\n  LoadExtension(\"downloads_split\");\n  ScopedCancellingItem item(CreateFirstSlowTestDownload());\n  ASSERT_TRUE(item.get());\n  scoped_refptr<const Extension> retained(extension());\n  ExtensionRegistry* registry = ExtensionRegistry::Get(current_profile());\n  AndroidDownloadRevealBoundary boundary;\n  boundary.before_reply = base::BindLambdaForTesting(\n      [&] { registry->RemoveEnabled(retained->id()); });\n  EXPECT_EQ(\n      download_extension_errors::kInvisibleContext,\n      RunFunctionAndReturnError(base::MakeRefCounted<DownloadsShowFunction>(),\n                                DownloadItemIdAsArgList(item.get())));\n  registry->AddEnabled(retained);\n  EXPECT_EQ(1, boundary.consumed_count);\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       AndroidShowRechecksRemovedIdAtAck) {\n  LoadExtension(\"downloads_split\");\n  const HistoryDownloadInfo history[] = {\n      {FILE_PATH_LITERAL(\"show-item\"), DownloadItem::COMPLETE,\n       download::DOWNLOAD_DANGER_TYPE_NOT_DANGEROUS}};\n  DownloadManager::DownloadVector items;\n  ASSERT_TRUE(CreateHistoryDownloads(history, &items));\n  ASSERT_EQ(1u, items.size());\n  const std::string args = DownloadItemIdAsArgList(items[0]);\n  AndroidDownloadRevealBoundary boundary;\n  boundary.before_reply =\n      base::BindLambdaForTesting([&] { items[0]->Remove(); });\n  EXPECT_EQ(download_extension_errors::kInvalidId,\n            RunFunctionAndReturnError(\n                base::MakeRefCounted<DownloadsShowFunction>(), args));\n  EXPECT_EQ(1, boundary.consumed_count);\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       AndroidShowShutdownConsumesLateCallbackOnce) {\n  LoadExtension(\"downloads_split\");\n  ScopedCancellingItem item(CreateFirstSlowTestDownload());\n  ASSERT_TRUE(item.get());\n  auto function = base::MakeRefCounted<ShutdownDownloadsShowFunction>();\n  AndroidDownloadRevealBoundary boundary;\n  boundary.before_reply =\n      base::BindLambdaForTesting([&] { function->SimulateContextShutdown(); });\n  EXPECT_EQ(\n      download_extension_errors::kInvisibleContext,\n      RunFunctionAndReturnError(function, DownloadItemIdAsArgList(item.get())));\n  base::RunLoop().RunUntilIdle();\n  EXPECT_EQ(1, boundary.cancel_count);\n  EXPECT_EQ(1, boundary.consumed_count);\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       AndroidShowTimeoutConsumesCallbackOnce) {\n  LoadExtension(\"downloads_split\");\n  ScopedCancellingItem item(CreateFirstSlowTestDownload());\n  ASSERT_TRUE(item.get());\n  AndroidDownloadRevealBoundary boundary;\n  boundary.suppress_reply = true;\n  // Exercise the production bounded timer, not a synthesized completion.\n  EXPECT_EQ(\n      download_extension_errors::kInvisibleContext,\n      RunFunctionAndReturnError(base::MakeRefCounted<DownloadsShowFunction>(),\n                                DownloadItemIdAsArgList(item.get())));\n  EXPECT_EQ(1, boundary.cancel_count);\n  EXPECT_EQ(1, boundary.consumed_count);\n}\n#endif\n\n"
