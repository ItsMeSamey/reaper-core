- description: Keep the existing fixture non-owning extension selector current across a real Android reload while the old
    request retains its object.
  regex:
    pattern: '  const Extension* extension() { return extension_; }


      '
    replace: "  const Extension* extension() { return extension_; }\n\n#if BUILDFLAG(IS_ANDROID)\n  // Reload replaces the\
      \ object; keep this fixture's non-owning selector current.\n  const Extension* ReloadCurrentExtension() {\n    const\
      \ std::string id = extension_->id();\n    ReloadExtension(id);\n    extension_ = ExtensionRegistry::Get(current_profile())\n\
      \                     ->enabled_extensions()\n                     .GetByID(id);\n    return extension_;\n  }\n#endif\n\
      \n"
  count: 1
- description: Exercise benign same-ID reload during a held real native reveal acknowledgment, deny the old completion and
    retain a fresh replacement-request positive control.
  regex:
    pattern: "IN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       AndroidShowRechecksRemovedIdAtAck) {\n"
    replace: "IN_PROC_BROWSER_TEST_F(\n    DownloadExtensionTest,\n    AndroidShowReloadedExtensionCannotAuthorizeOldCompletion)\
      \ {\n  LoadExtension(\"downloads_split\");\n  ScopedCancellingItem item(CreateFirstSlowTestDownload());\n  ASSERT_TRUE(item.get());\n\
      \  scoped_refptr<const Extension> retained(extension());\n  auto function = base::MakeRefCounted<DownloadsShowFunction>();\n\
      \  const Extension* replacement = nullptr;\n  AndroidDownloadRevealBoundary boundary;\n  boundary.before_reply = base::BindLambdaForTesting([&]\
      \ {\n    replacement = ReloadCurrentExtension();\n    ASSERT_TRUE(replacement);\n    ASSERT_EQ(retained->id(), replacement->id());\n\
      \    ASSERT_NE(retained.get(), replacement);\n    ASSERT_TRUE(replacement->permissions_data()->HasAPIPermission(\n \
      \       mojom::APIPermissionID::kDownloads));\n    // Reload retired the old extension, not the request's browser context\
      \ or\n    // pending response. The held acknowledgment still belongs to that instance.\n    ASSERT_EQ(current_profile(),\
      \ function->browser_context());\n    ASSERT_FALSE(current_profile()->ShutdownStarted());\n    ASSERT_FALSE(function->did_respond());\n\
      \  });\n  EXPECT_EQ(\n      download_extension_errors::kInvisibleContext,\n      RunFunctionAndReturnError(function,\
      \ DownloadItemIdAsArgList(item.get())));\n  EXPECT_EQ(1, boundary.show_count);\n  EXPECT_EQ(1, boundary.consumed_count);\n\
      \  EXPECT_EQ(1, boundary.cancel_count);\n\n  // Reload keeps ordinary downloads.show usable by the replacement itself.\n\
      \  ASSERT_TRUE(replacement);\n  auto fresh_function = base::MakeRefCounted<DownloadsShowFunction>();\n  fresh_function->set_extension(replacement);\n\
      \  EXPECT_TRUE(api_test_utils::RunFunction(\n      fresh_function, DownloadItemIdAsArgList(item.get()), current_profile()));\n\
      \  EXPECT_EQ(2, boundary.show_count);\n  EXPECT_EQ(2, boundary.consumed_count);\n  EXPECT_EQ(2, boundary.cancel_count);\n\
      \  EXPECT_EQ(item.get()->GetGuid(), boundary.guid);\n  EXPECT_EQ(current_profile(), boundary.item_context);\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n\
      \                       AndroidShowRechecksRemovedIdAtAck) {\n"
  count: 1
