# Android download UI policy and truthful transfer lifecycle.
substitutions:
- description: Exercise the real Android API aggregate and unload path without a desktop toolbar assumption
  regex:
    re_pattern: class\ DownloadsApiTest\ :\ public\ ExtensionApiTest\ \{
    replace: "#if BUILDFLAG(IS_ANDROID)\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest,\n                       AndroidUiPolicyKeepsOtherDisablersUntilLastUnload) {\n  LoadExtension(\"downloads_split\");\n  LoadSecondExtension(\"downloads_spanning\");\n  auto* service = DownloadCoreServiceFactory::GetForBrowserContext(current_profile());\n  ASSERT_TRUE(RunFunction(base::MakeRefCounted<DownloadsSetUiOptionsFunction>(),\n                          R\"([{\"enabled\": false}])\"));\n  ASSERT_TRUE(RunFunctionInSecondExtension(\n      base::MakeRefCounted<DownloadsSetUiOptionsFunction>(),\n      R\"([{\"enabled\": false}])\"));\n  EXPECT_FALSE(service->IsDownloadUiEnabled());\n  EXPECT_STREQ(errors::kUiDisabled,\n      RunFunctionAndReturnErrorInSecondExtension(\n          base::MakeRefCounted<DownloadsSetUiOptionsFunction>(),\n          R\"([{\"enabled\": true}])\").c_str());\n  EXPECT_FALSE(service->IsDownloadUiEnabled());\n  ASSERT_TRUE(RunFunctionInSecondExtension(\n      base::MakeRefCounted<DownloadsSetUiOptionsFunction>(),\n      R\"([{\"enabled\": false}])\"));\n  DisableExtension(GetExtensionId());\n  EXPECT_FALSE(service->IsDownloadUiEnabled());\n  DisableExtension(GetSecondExtensionId());\n  EXPECT_TRUE(service->IsDownloadUiEnabled());\n}\n#endif\n\nclass DownloadsApiTest : public ExtensionApiTest {"
