      '
    replace: "  ASSERT_TRUE(\n      RunFunction(new DownloadsSearchFunction, \"[{\\\\\"totalBytesGreater\\\\\":2}]\"));\n}\n\n#if BUILDFLAG(IS_ANDROID)\n// Exercises the actual extension function and held Android DialogModel. The\n// synthetic native invocation has no sender frame; it does not execute JS.\nclass DownloadOpenPermissionTest : public DownloadExtensionTest {\n protected:\n  void SetUpOnMainThread() override {\n    DownloadExtensionTest::SetUpOnMainThread();\n    extension_dir_.WriteManifest(R\"({\n      \"name\": \"Optional download open\",\n      \"version\": \"1.0\",\n      \"manifest_version\": 3,\n      \"permissions\": [\"downloads\"],\n      \"optional_permissions\": [\"downloads.open\"]\n    })\");\n    open_extension_ =\n        ExtensionBrowserTest::LoadExtension(extension_dir_.UnpackedPath());\n    ASSERT_TRUE(open_extension_);\n    base::test::TestFuture<void> granted;\n    PermissionsUpdater(current_profile())\n        .GrantOptionalPermissions(\n            *open_extension_,\n            PermissionsParser::GetOptionalPermissions(open_extension_.get()),\n            granted.GetCallback());\n    ASSERT_TRUE(granted.Wait());\n    ASSERT_TRUE(open_extension_->permissions_data()->HasAPIPermission(\n        mojom::APIPermissionID::kDownloadsOpen));\n  }\n\n  void StartPendingOpen() {\n    static const HistoryDownloadInfo history[] = {\n        {FILE_PATH_LITERAL(\"file.txt\"), DownloadItem::COMPLETE,\n         download::DOWNLOAD_DANGER_TYPE_NOT_DANGEROUS}};\n    DownloadManager::DownloadVector items;\n    ASSERT_TRUE(CreateHistoryDownloads(history, &items));\n    ASSERT_EQ(1u, items.size());\n    item_ = items[0];\n    ASSERT_TRUE(item_);\n    ASSERT_TRUE(base::test::RunUntil(\n        [&] { return GetOnRecordManager()->IsManagerInitialized(); }));\n    ASSERT_TRUE(GetActiveWebContents());\n    ui::WindowAndroid* window =\n        GetActiveWebContents()->GetTopLevelNativeWindow();\n    ASSERT_TRUE(window);\n    modal_ = ui::FakeModalDialogManagerBridge::CreateForTab(\n        window, /*use_empty_java_presenter=*/true);\n\n    open_function_ = base::MakeRefCounted<DownloadsOpenFunction>();\n    open_function_->set_extension(open_extension_);\n    open_function_->set_user_gesture(true);\n    base::ListValue args;\n    args.Append(static_cast<int>(item_->GetId()));\n    open_function_->SetArgs(std::move(args));\n    dispatcher_ =\n        std::make_unique<ExtensionFunctionDispatcher>(current_profile());\n    open_function_->SetDispatcher(dispatcher_->AsWeakPtr());\n    response_ = std::make_unique<api_test_utils::SendResponseHelper>(\n        open_function_.get());\n    open_function_->RunWithValidation().Execute();\n    ASSERT_FALSE(response_->has_response());\n    ASSERT_FALSE(modal_->GetMessageParagraphs().empty());\n    ASSERT_FALSE(item_->GetOpened());\n  }\n\n  void AcceptAndExpectDenial() {\n    ASSERT_TRUE(response_);\n    ASSERT_FALSE(response_->has_response());\n    modal_->ClickPositiveButton();\n    response_->WaitForResponse();\n    EXPECT_FALSE(response_->GetResponse());\n    EXPECT_EQ(errors::kOpenPermission, open_function_->GetError());\n    EXPECT_FALSE(item_->GetOpened());\n    // Host destruction must not produce a second response after acceptance.\n    modal_->DismissAllDialogs(static_cast<int>(\n        ui::ModalDialogWrapper::DismissalCause::TAB_DESTROYED));\n    base::RunLoop().RunUntilIdle();\n  }\n\n  void TearDownOnMainThread() override {\n    if (modal_) {\n      modal_->DismissAllDialogs(static_cast<int>(\n          ui::ModalDialogWrapper::DismissalCause::TAB_DESTROYED));\n      base::RunLoop().RunUntilIdle();\n      modal_.reset();\n    }\n    response_.reset();\n    open_function_.reset();\n    dispatcher_.reset();\n    item_ = nullptr;\n    open_extension_.reset();\n    DownloadExtensionTest::TearDownOnMainThread();\n  }\n\n  TestExtensionDir extension_dir_;\n  scoped_refptr<const Extension> open_extension_;\n  raw_ptr<DownloadItem> item_ = nullptr;\n  std::unique_ptr<ExtensionFunctionDispatcher> dispatcher_;\n  scoped_refptr<DownloadsOpenFunction> open_function_;\n  std::unique_ptr<api_test_utils::SendResponseHelper> response_;\n  std::unique_ptr<ui::FakeModalDialogManagerBridge> modal_;\n};\n\nIN_PROC_BROWSER_TEST_F(DownloadOpenPermissionTest,\n                       RevokedOptionalPermissionRejectsHeldConsent) {\n  ASSERT_NO_FATAL_FAILURE(StartPendingOpen());\n  base::test::TestFuture<void> revoked;\n  PermissionsUpdater(current_profile())\n      .RevokeOptionalPermissions(\n          *open_extension_,\n          PermissionsParser::GetOptionalPermissions(open_extension_.get()),\n          PermissionsUpdater::RemoveType::kSoft, revoked.GetCallback());\n  ASSERT_TRUE(revoked.Wait());\n  ASSERT_FALSE(open_extension_->permissions_data()->HasAPIPermission(\n      mojom::APIPermissionID::kDownloadsOpen));\n  AcceptAndExpectDenial();\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadOpenPermissionTest,\n                       DisabledExtensionRejectsHeldConsent) {\n  ASSERT_NO_FATAL_FAILURE(StartPendingOpen());\n  DisableExtension(open_extension_->id());\n  ASSERT_FALSE(ExtensionRegistry::Get(current_profile())\n                   ->enabled_extensions()\n                   .Contains(open_extension_->id()));\n  AcceptAndExpectDenial();\n}\n\nIN_PROC_BROWSER_TEST_F(DownloadOpenPermissionTest,\n                       ReloadedExtensionCannotAuthorizeOldConsent) {\n  ASSERT_NO_FATAL_FAILURE(StartPendingOpen());\n  ReloadExtension(open_extension_->id());\n  const Extension* replacement = ExtensionRegistry::Get(current_profile())\n                                     ->enabled_extensions()\n                                     .GetByID(open_extension_->id());\n  ASSERT_TRUE(replacement);\n  ASSERT_NE(open_extension_.get(), replacement);\n  ASSERT_TRUE(replacement->permissions_data()->HasAPIPermission(\n      mojom::APIPermissionID::kDownloadsOpen));\n  AcceptAndExpectDenial();\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nIN_PROC_BROWSER_TEST_F(DownloadExtensionTest, DownloadExtensionTest_Open) {\n  platform_util::internal::DisableShellOperationsForTesting();\n"
