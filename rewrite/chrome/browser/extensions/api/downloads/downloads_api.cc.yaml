- description: Android Downloads exact-item reveal integration (3).
  regex:
    re_pattern: '\ \ \}\

      \ \ return\ download_item;\

      \}\

      \

      //\ Corresponds\ to\ \|DownloadFunctions\|\ enumeration\ in\ histograms\.xml\.\ Please\

      //\ keep\ these\ in\ sync\.\

      '
    replace: "  }\n  return download_item;\n}\n\n#if BUILDFLAG(IS_ANDROID)\n// Re-read permission and incognito access when an asynchronous reveal finishes.\n// GetDownload() still supplies the API's normal ID/visibility authorization.\nbool CanRevealAndroidDownload(ExtensionFunction* function,\n                              Profile* item_profile) {\n  content::BrowserContext* context = function->browser_context();\n  if (!context || context->ShutdownStarted() || !item_profile ||\n      item_profile->ShutdownStarted()) {\n    return false;\n  }\n  Profile* caller_profile = Profile::FromBrowserContext(context);\n  if (item_profile->GetOriginalProfile() !=\n          caller_profile->GetOriginalProfile() ||\n      (item_profile->IsOffTheRecord() &&\n       !item_profile->IsPrimaryOTRProfile())) {\n    return false;\n  }\n  const Extension* current_extension =\n      ExtensionRegistry::Get(context)->enabled_extensions().GetByID(\n          function->extension_id());\n  if (!current_extension ||\n      !current_extension->permissions_data()->HasAPIPermission(\n          APIPermissionID::kDownloads)) {\n    return false;\n  }\n  return !item_profile->IsOffTheRecord() ||\n         ((caller_profile->IsOffTheRecord() ||\n           function->include_incognito_information()) &&\n          util::IsIncognitoEnabled(current_extension, context) &&\n          item_profile->GetOriginalProfile()->GetPrimaryOTRProfile(false) ==\n              item_profile);\n}\n\nTabAndroid* GetAndroidDownloadRevealHost(ExtensionFunction* function,\n                                         Profile* item_profile) {\n  const auto usable_tab = [item_profile](content::WebContents* contents) {\n    TabAndroid* tab =\n        contents ? TabAndroid::FromWebContents(contents) : nullptr;\n    return tab && DownloadManagerService::CanShowDownloadItemForExtension(\n                      tab->GetJavaObject(), item_profile)\n               ? tab\n               : nullptr;\n  };\n  const auto usable_window = [function,\n                              item_profile](WindowController* window) {\n    if (!window || !window->GetBrowserWindowInterface() ||\n        window->GetBrowserWindowInterface()->IsDeleteScheduled() ||\n        window->profile()->GetOriginalProfile() !=\n            item_profile->GetOriginalProfile()) {\n      return false;\n    }\n    return windows_util::CanOperateOnWindow(function, window,\n                                            WindowController::kNoWindowFilter);\n  };\n\n  // Prefer the caller's tab, subject to the same window/profile access checks.\n  content::WebContents* sender = function->GetSenderWebContents();\n  for (WindowController* window : *WindowControllerList::GetInstance()) {\n    if (usable_window(window) && window->GetActiveTab() == sender) {\n      if (TabAndroid* tab = usable_tab(sender)) {\n        return tab;\n      }\n    }\n  }\n  WindowController* associated =\n      function->dispatcher()\n          ? function->dispatcher()->GetExtensionWindowController()\n          : nullptr;\n  if (usable_window(associated)) {\n    if (TabAndroid* tab = usable_tab(associated->GetActiveTab())) {\n      return tab;\n    }\n  }\n  // MV3 workers have no sender tab. Only a currently active, accessible browser\n  // window in the item's original profile may anchor the new Downloads surface.\n  for (WindowController* window : *WindowControllerList::GetInstance()) {\n    if (usable_window(window) && window->window()->IsActive()) {\n      if (TabAndroid* tab = usable_tab(window->GetActiveTab())) {\n        return tab;\n      }\n    }\n  }\n  return nullptr;\n}\n#endif\n\n// Corresponds to |DownloadFunctions| enumeration in histograms.xml. Please\n// keep these in sync.\n"
- description: Android Downloads exact-item reveal integration (4).
  regex:
    re_pattern: '\ \ if\ \(InvalidId\(download_item,\ \&error\)\)\ \{\

      \ \ \ \ return\ RespondNow\(Error\(std::move\(error\)\)\);\

      \ \ \}\

      \ \ download_item\->ShowDownloadInShell\(\);\

      \ \ RecordApiFunctions\(DownloadsFunctionName::kDownloadsFunctionShow\);\

      \ \ return\ RespondNow\(NoArguments\(\)\);\

      \}\

      \

      DownloadsShowDefaultFolderFunction::DownloadsShowDefaultFolderFunction\(\)\ =\

      \ \ \ \ default;\

      '
    replace: "  if (InvalidId(download_item, &error)) {\n    return RespondNow(Error(std::move(error)));\n  }\n#if BUILDFLAG(IS_ANDROID)\n  content::BrowserContext* item_context =\n      content::DownloadItemUtils::GetBrowserContext(download_item);\n  Profile* item_profile =\n      item_context ? Profile::FromBrowserContext(item_context) : nullptr;\n  if (!CanRevealAndroidDownload(this, item_profile)) {\n    return RespondNow(Error(download_extension_errors::kInvalidId));\n  }\n  TabAndroid* tab = GetAndroidDownloadRevealHost(this, item_profile);\n  if (!tab) {\n    return RespondNow(Error(download_extension_errors::kInvisibleContext));\n  }\n  // No user gesture is required by downloads.show. This selects a row in\n  // Downloads; it never opens the downloaded file.\n  waiting_for_android_show_ = true;\n  android_download_id_ = params->download_id;\n  android_download_guid_ = download_item->GetGuid();\n  android_item_profile_ = item_profile->GetWeakPtr();\n  AddRef();  // Balanced by FinishAndroidShow(), including timeout/shutdown.\n  android_show_timeout_.Start(\n      FROM_HERE, base::Seconds(10),\n      base::BindOnce(&DownloadsShowFunction::OnAndroidDownloadShown,\n                     weak_factory_.GetWeakPtr(), false));\n  RecordApiFunctions(DownloadsFunctionName::kDownloadsFunctionShow);\n  const int64_t token = DownloadManagerService::ShowDownloadItemForExtension(\n      tab->GetJavaObject(), download_item,\n      base::BindOnce(&DownloadsShowFunction::OnAndroidDownloadShown,\n                     weak_factory_.GetWeakPtr()));\n  if (waiting_for_android_show_) {\n    android_show_token_ = token;\n    if (!token) {\n      OnAndroidDownloadShown(false);\n    }\n  } else if (token) {\n    // A synchronous callback may finish before Java returns its request token.\n    DownloadManagerService::CancelDownloadItemForExtension(token);\n  }\n  return did_respond() ? AlreadyResponded() : RespondLater();\n#else\n  download_item->ShowDownloadInShell();\n  RecordApiFunctions(DownloadsFunctionName::kDownloadsFunctionShow);\n  return RespondNow(NoArguments());\n#endif\n}\n\n#if BUILDFLAG(IS_ANDROID)\nvoid DownloadsShowFunction::OnAndroidDownloadShown(bool shown) {\n  if (!waiting_for_android_show_) {\n    return;\n  }\n  if (!shown || !CanRevealAndroidDownload(this, android_item_profile_.get())) {\n    FinishAndroidShow(Error(download_extension_errors::kInvisibleContext));\n    return;\n  }\n  DownloadItem* item = GetDownload(\n      browser_context(), include_incognito_information(), android_download_id_);\n  if (!item || item->GetGuid() != android_download_guid_ ||\n      content::DownloadItemUtils::GetBrowserContext(item) !=\n          android_item_profile_.get()) {\n    FinishAndroidShow(Error(download_extension_errors::kInvalidId));\n    return;\n  }\n  FinishAndroidShow(NoArguments());\n}\n\nvoid DownloadsShowFunction::FinishAndroidShow(ResponseValue response) {\n  if (!waiting_for_android_show_) {\n    return;\n  }\n  waiting_for_android_show_ = false;\n  android_show_timeout_.Stop();\n  weak_factory_.InvalidateWeakPtrs();\n  const int64_t token = std::exchange(android_show_token_, 0);\n  android_item_profile_.reset();\n  if (token) {\n    DownloadManagerService::CancelDownloadItemForExtension(token);\n  }\n  Respond(std::move(response));\n  Release();\n}\n\nvoid DownloadsShowFunction::OnBrowserContextShutdown() {\n  if (waiting_for_android_show_) {\n    FinishAndroidShow(Error(download_extension_errors::kInvisibleContext));\n  }\n}\n#endif\n\nDownloadsShowDefaultFolderFunction::DownloadsShowDefaultFolderFunction() =\n    default;\n"
