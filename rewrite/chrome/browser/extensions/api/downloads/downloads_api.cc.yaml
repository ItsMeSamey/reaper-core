# Android download UI policy and truthful transfer lifecycle.
substitutions:
- description: Use existing Android tab and DownloadManagerService JNI bridges.
  regex:
    pattern: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/download/download_item_warning_data.h"'
    replace: '#if BUILDFLAG(IS_ANDROID)

      #include "base/android/jni_android.h"

      #include "chrome/browser/android/tab_android.h"

      // After WebContents and Profile JNI conversion specializations above.

      #include "chrome/android/chrome_jni_headers/DownloadManagerService_jni.h"

      #endif


      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/download/download_item_warning_data.h"'
- description: Open the Android collection in the resolved extension window and preserve desktop folder behavior.
  regex:
    pattern: "ExtensionFunction::ResponseAction DownloadsShowDefaultFolderFunction::Run() {\n  DownloadManager* manager = nullptr;"
    replace: "ExtensionFunction::ResponseAction DownloadsShowDefaultFolderFunction::Run() {\n#if BUILDFLAG(IS_ANDROID)\n  WindowController* window_controller =\n      ChromeExtensionFunctionDetails(this).GetCurrentWindowController();\n  content::WebContents* contents =\n      window_controller ? window_controller->GetActiveTab() : nullptr;\n  TabAndroid* tab = contents ? TabAndroid::FromWebContents(contents) : nullptr;\n  if (!tab || !Java_DownloadManagerService_showDownloadsForExtension(\n                  base::android::AttachCurrentThread(), tab->GetJavaObject())) {\n    return RespondNow(Error(download_extension_errors::kInvisibleContext));\n  }\n#else\n  DownloadManager* manager = nullptr;"
- description: End the desktop-only folder implementation before shared success accounting.
  regex:
    pattern: "      platform_util::OPEN_FOLDER, platform_util::OpenOperationCallback());\n  RecordApiFunctions("
    replace: "      platform_util::OPEN_FOLDER, platform_util::OpenOperationCallback());\n#endif\n  RecordApiFunctions("
- description: Mark the prompt pending before callbacks can run synchronously
  regex:
    re_pattern: \ \ //\ For\ testing,\ callers\ can\ use\ AcceptDialogForTesting\(\)\ to\ pre\-determine
    replace: "#if BUILDFLAG(IS_ANDROID)\n  pending_open_prompt_ = true;\n#endif\n  // For testing, callers can use AcceptDialogForTesting() to pre-determine"
- description: Respect synchronous testing completion on Android
  regex:
    re_pattern: '\ \ \ \ OpenPromptDone\(params\->download_id,\ /\*accept=\*/true\);\

      \ \ \ \ return\ RespondLater\(\);'
    replace: "    OpenPromptDone(params->download_id, /*accept=*/true);\n#if BUILDFLAG(IS_ANDROID)\n    return AlreadyResponded();\n#else\n    return RespondLater();\n#endif"
- description: Handle immediate denial when Android cannot show the confirmation
  regex:
    re_pattern: '\ \ RecordApiFunctions\(DownloadsFunctionName::kDownloadsFunctionOpen\);\

      \ \ return\ RespondLater\(\);'
    replace: "  RecordApiFunctions(DownloadsFunctionName::kDownloadsFunctionOpen);\n#if BUILDFLAG(IS_ANDROID)\n  return did_respond() ? AlreadyResponded() : RespondLater();\n#else\n  return RespondLater();\n#endif"
- description: Ignore canceled/late results before accessing any browser-context services
  regex:
    re_pattern: 'void\ DownloadsOpenFunction::OpenPromptDone\(int\ download_id,\ bool\ accept\)\ \{\

      \ \ DCHECK_CURRENTLY_ON\(BrowserThread::UI\);'
    replace: "void DownloadsOpenFunction::OpenPromptDone(int download_id, bool accept) {\n  DCHECK_CURRENTLY_ON(BrowserThread::UI);\n#if BUILDFLAG(IS_ANDROID)\n  if (!pending_open_prompt_) {\n    return;\n  }\n  pending_open_prompt_ = false;\n  if (!browser_context()) {\n    Respond(Error(download_extension_errors::kInvisibleContext));\n    return;\n  }\n#endif"
- description: Resolve pending consent with denial on profile shutdown; late retained callback cannot reopen a file
  regex:
    re_pattern: DownloadsSetShelfEnabledFunction::DownloadsSetShelfEnabledFunction\(\)\ =\ default;
    replace: "#if BUILDFLAG(IS_ANDROID)\nvoid DownloadsOpenFunction::OnBrowserContextShutdown() {\n  if (pending_open_prompt_) {\n    pending_open_prompt_ = false;\n    Respond(Error(download_extension_errors::kOpenPermission));\n  }\n}\n#endif\n\nDownloadsSetShelfEnabledFunction::DownloadsSetShelfEnabledFunction() = default;"
- description: Notify Android optional UI through its existing message bridge
  regex:
    re_pattern: \#include\ "chrome/browser/download/download_core_service\.h"
    replace: '#if BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/download/android/download_message_bridge.h"

      #endif

      #include "chrome/browser/download/download_core_service.h"'
- description: Capture aggregate UI policy before changing one extension vote
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ bool\ enabled\)\ \{\

      \ \ auto\ iter\ =\ ui_disabling_extensions_\.find\(extension\);'
    replace: "                                                 bool enabled) {\n#if BUILDFLAG(IS_ANDROID)\n  const bool was_enabled = IsUiEnabled();\n#endif\n  auto iter = ui_disabling_extensions_.find(extension);"
- description: Synchronously refresh optional Android messages only when aggregate policy changes
  regex:
    re_pattern: '\ \ \ \ ui_disabling_extensions_\.erase\(extension\);\

      \ \ \}\

      \}\

      \

      bool\ ExtensionDownloadsEventRouter::IsUiEnabled\(\)\ const'
    replace: "    ui_disabling_extensions_.erase(extension);\n  }\n#if BUILDFLAG(IS_ANDROID)\n  if (was_enabled != IsUiEnabled()) {\n    DownloadMessageBridge::NotifyDownloadUiPolicyChanged();\n  }\n#endif\n}\n\nbool ExtensionDownloadsEventRouter::IsUiEnabled() const"
- description: Reuse aggregate transition notification when an extension unloads
  regex:
    re_pattern: '\ \ auto\ iter\ =\ ui_disabling_extensions_\.find\(extension\);\

      \ \ if\ \(iter\ !=\ ui_disabling_extensions_\.end\(\)\)\ \{\

      \ \ \ \ ui_disabling_extensions_\.erase\(iter\);\

      \ \ \}\

      \}\

      \

      void\ ExtensionDownloadsEventRouter::CheckForHistoryFilesRemoval\(\)'
    replace: "  // Removing the last disabling extension also refreshes Android messages.\n  SetUiEnabled(extension, true);\n}\n\nvoid ExtensionDownloadsEventRouter::CheckForHistoryFilesRemoval()"
