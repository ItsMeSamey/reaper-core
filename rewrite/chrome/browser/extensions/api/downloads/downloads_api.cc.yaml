  regex:
    re_pattern: '\#include\ "chrome/browser/download/android/download_message_bridge\.h"\

      '
    replace: '#include "chrome/browser/download/android/download_manager_service.h"

      #include "chrome/browser/download/android/download_message_bridge.h"

      '
