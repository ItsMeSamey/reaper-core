# Android download-open confirmation completion.
substitutions:
- description: Declare Android-only prompt shutdown handling
  regex:
    re_pattern: \#include\ "base/time/time\.h"
    replace: '#include "base/time/time.h"

      #include "build/build_config.h"'
- description: Deny a pending confirmation before its browser context is destroyed
  regex:
    re_pattern: \ \ \~DownloadsOpenFunction\(\)\ override;
    replace: "  ~DownloadsOpenFunction() override;\n#if BUILDFLAG(IS_ANDROID)\n  void OnBrowserContextShutdown() override;\n#endif"
- description: Track only an already-shown confirmation, leaving download queue shutdown unchanged
  regex:
    re_pattern: \ \ void\ OpenPromptDone\(int\ download_id,\ bool\ accept\);
    replace: "  void OpenPromptDone(int download_id, bool accept);\n#if BUILDFLAG(IS_ANDROID)\n  bool pending_open_prompt_ = false;\n#endif"
- description: Android Downloads exact-item reveal integration (1).
  regex:
    re_pattern: '\#include\ "base/scoped_observation\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/download/download_danger_prompt\.h"\

      \#include\ "chrome/common/extensions/api/downloads\.h"\

      \#include\ "components/download/content/public/all_download_item_notifier\.h"\

      '
    replace: '#include "base/scoped_observation.h"

      #include "base/time/time.h"

      #include "build/build_config.h"

      #if BUILDFLAG(IS_ANDROID)

      #include "base/memory/weak_ptr.h"

      #include "base/timer/timer.h"

      #endif

      #include "chrome/browser/download/download_danger_prompt.h"

      #include "chrome/common/extensions/api/downloads.h"

      #include "components/download/content/public/all_download_item_notifier.h"

      '
- description: Android Downloads exact-item reveal integration (2).
  regex:
    re_pattern: '\

      \ protected:\

      \ \ \~DownloadsShowFunction\(\)\ override;\

      \};\

      \

      class\ DownloadsShowDefaultFolderFunction\ :\ public\ ExtensionFunction\ \{\

      '
    replace: "\n protected:\n  ~DownloadsShowFunction() override;\n#if BUILDFLAG(IS_ANDROID)\n  void OnBrowserContextShutdown() override;\n\n private:\n  void OnAndroidDownloadShown(bool shown);\n  void FinishAndroidShow(ResponseValue response);\n\n  bool waiting_for_android_show_ = false;\n  int android_download_id_ = -1;\n  std::string android_download_guid_;\n  base::WeakPtr<Profile> android_item_profile_;\n  int64_t android_show_token_ = 0;\n  base::OneShotTimer android_show_timeout_;\n  base::WeakPtrFactory<DownloadsShowFunction> weak_factory_{this};\n#endif\n};\n\nclass DownloadsShowDefaultFolderFunction : public ExtensionFunction {\n"
- description: Keep Android download-open confirmation worker alive (1).
  regex:
    re_pattern: '\ \ DownloadsOpenFunction\&\ operator=\(const\ DownloadsOpenFunction\&\)\ =\ delete;\

      \

      \ \ ResponseAction\ RunInternal\(\)\ override;\

      \

      \ \ \[\[nodiscard\]\]\ static\ base::AutoReset<bool>\ AcceptDialogForTesting\(\);\

      \

      '
    replace: "  DownloadsOpenFunction& operator=(const DownloadsOpenFunction&) = delete;\n\n  ResponseAction RunInternal() override;\n#if BUILDFLAG(IS_ANDROID)\n  bool ShouldKeepWorkerAliveIndefinitely() override;\n#endif\n\n  [[nodiscard]] static base::AutoReset<bool> AcceptDialogForTesting();\n\n"
