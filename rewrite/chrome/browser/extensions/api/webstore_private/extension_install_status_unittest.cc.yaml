substitutions:
- description: Expect removed Android enterprise request availability to remain policy denied
  regex:
    pattern: ExtensionInstallStatus::kCanRequest
    replace: kRequestableStatusForPlatform
  count: 6
- description: Expect stale Android enterprise request state to remain policy denied
  regex:
    pattern: ExtensionInstallStatus::kRequestPending
    replace: kPendingStatusForPlatform
  count: 1
- description: Keep all managed extension policy status scenarios on Android with unavailable reporting expectations
  regex:
    pattern: 'namespace extensions {

      namespace {

      '
    replace: "namespace extensions {\nnamespace {\n\n#if BUILDFLAG(IS_ANDROID)\nconstexpr ExtensionInstallStatus kRequestableStatusForPlatform\
      \ =\n    ExtensionInstallStatus::kBlockedByPolicy;\nconstexpr ExtensionInstallStatus kPendingStatusForPlatform =\n \
      \   ExtensionInstallStatus::kBlockedByPolicy;\n#else\nconstexpr ExtensionInstallStatus kRequestableStatusForPlatform\
      \ =\n    ExtensionInstallStatus::kCanRequest;\nconstexpr ExtensionInstallStatus kPendingStatusForPlatform =\n    ExtensionInstallStatus::kRequestPending;\n\
      #endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Own direct Android platform buildflag provider
  regex:
    pattern: '#include "base/values.h"

      '
    replace: '#include "base/values.h"

      #include "build/build_config.h"

      '
  count: 1
