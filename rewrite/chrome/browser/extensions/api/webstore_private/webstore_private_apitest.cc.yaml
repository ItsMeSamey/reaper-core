    replace: "  ASSERT_NO_FATAL_FAILURE(WaitForResponseOrPrompt());\n  EXPECT_FALSE(PromptAdmitted());\n  ASSERT_NO_FATAL_FAILURE(ExpectCancellationAndRelease());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionWebstorePrivateApiTest,\n                       IncognitoBeginDoesNotBlockRegularInstall) {\n  Profile* const regular_profile = profile();\n  content::WebContents* regular_contents =\n      chrome_test_utils::GetActiveWebContents(this);\n  ASSERT_TRUE(regular_contents);\n  ASSERT_EQ(regular_profile, regular_contents->GetBrowserContext());\n  auto* tracker =\n      ExtensionsBrowserClient::Get()->GetInstallTracker(regular_profile);\n  ASSERT_FALSE(tracker->GetActiveInstall(kExtensionId));\n  const int initial_approvals =\n      WebstorePrivateApi::GetPendingApprovalsCountForTesting();\n\n  // Keep failures on the old code from stranding this test's approval/marker,\n  // and retire the base fixture's raw test download-directory pointer.\n  base::ScopedClosureRunner cleanup(base::BindLambdaForTesting([&] {\n    if (Profile* private_profile = regular_profile->GetPrimaryOTRProfile(\n            /*create_if_needed=*/false)) {\n      WebstorePrivateApi::PopApprovalForTesting(private_profile, kExtensionId);\n    }\n    WebstorePrivateApi::PopApprovalForTesting(regular_profile, kExtensionId);\n    tracker->RemoveActiveInstall(kExtensionId);\n    WebstoreInstaller::SetDownloadDirectoryForTests(nullptr);\n  }));\n\n  // The older extension.crx binary is MV2 even though its neighboring\n  // unpacked manifest is MV3. Pack an actual MV3 control with the same key/ID.\n  const std::string manifest = R\"({\n    \"name\": \"Incognito install retry\",\n    \"version\": \"1.0\",\n    \"manifest_version\": 3,\n    \"permissions\": [\"tabs\"]\n  })\";\n  TestExtensionDir extension_dir;\n  extension_dir.WriteManifest(manifest);\n  // TestExtensionDir permits blocking cleanup in its destructor; the browser\n  // test body disallows blocking, including ordinary ScopedTempDir teardown.\n  TestExtensionDir delivery_dir;\n  const base::FilePath delivery_path = delivery_dir.UnpackedPath();\n  const base::FilePath packed_crx = PackExtensionWithOptions(\n      extension_dir.UnpackedPath(),\n      delivery_path.AppendASCII(\"incognito-retry.crx\"),\n      test_data_dir_.AppendASCII(\"api_test/webstore_private/extension.pem\"),\n      base::FilePath());\n  ASSERT_FALSE(packed_crx.empty());\n\n  // The base server is already started. Keep this server and its served\n  // directory alive through the real completeInstall callback instead.\n  net::EmbeddedTestServer crx_server;\n  crx_server.ServeFilesFromDirectory(delivery_path);\n  ASSERT_TRUE(crx_server.Start());\n  // The generic test packer produces a signed CRX without a Store publisher\n  // proof. Bypass only that test requirement; signature, ID and manifest\n  // verification still execute, and production publisher checks are unchanged.\n  auto publisher_verification = DisablePublisherKeyVerificationForTests();\n  const GURL page_url =\n      embedded_test_server()->GetURL(\"www.example.com\", \"/title1.html\");\n  content::WebContents* private_contents =\n      PlatformOpenURLOffTheRecord(regular_profile, page_url);\n  ASSERT_TRUE(private_contents);\n  ASSERT_TRUE(private_contents->GetBrowserContext()->IsOffTheRecord());\n  ASSERT_EQ(tracker, ExtensionsBrowserClient::Get()->GetInstallTracker(\n                         private_contents->GetBrowserContext()));\n\n  base::AutoReset<InstallPromptData::PromptType> reset_prompt(\n      &ExtensionInstallPrompt::g_last_prompt_type_for_tests,\n      InstallPromptData::UNSET_PROMPT_TYPE);\n  const std::string begin_script = content::JsReplace(R\"(\n    new Promise(resolve => {\n      chrome.webstorePrivate.beginInstallWithManifest3({\n        id: $1, manifest: $2\n      }, result => {\n        resolve([result, chrome.runtime.lastError?.message || '']);\n      });\n    });\n  )\", kExtensionId, manifest);\n  const std::string complete_script = content::JsReplace(R\"(\n    new Promise(resolve => {\n      chrome.webstorePrivate.completeInstall($1, () => {\n        resolve(chrome.runtime.lastError?.message || '');\n      });\n    });\n  )\", kExtensionId);\n\n  // Dispatch through the real renderer binding and function dispatcher. The\n  // regular install below uses the same ID, tracker and signed MV3 CRX.\n  const auto private_begin = content::EvalJs(private_contents, begin_script);\n  base::ListValue private_expected;\n  private_expected.Append(\"unknown_error\");\n  private_expected.Append(\"Apps cannot be installed in guest/incognito mode\");\n  EXPECT_EQ(private_expected, private_begin.ExtractList());\n  EXPECT_EQ(InstallPromptData::UNSET_PROMPT_TYPE,\n            ExtensionInstallPrompt::g_last_prompt_type_for_tests);\n  EXPECT_EQ(initial_approvals,\n            WebstorePrivateApi::GetPendingApprovalsCountForTesting());\n  EXPECT_FALSE(tracker->GetActiveInstall(kExtensionId));\n  EXPECT_EQ(\"Apps cannot be installed in guest/incognito mode\",\n            content::EvalJs(private_contents, complete_script));\n  EXPECT_EQ(initial_approvals,\n            WebstorePrivateApi::GetPendingApprovalsCountForTesting());\n  EXPECT_FALSE(tracker->GetActiveInstall(kExtensionId));\n\n  ASSERT_TRUE(chrome_test_utils::NavigateToURL(regular_contents, page_url));\n  extension_test_util::SetGalleryUpdateURL(\n      crx_server.GetURL(\"/incognito-retry.crx\"));\n  const auto regular_begin = content::EvalJs(regular_contents, begin_script);\n  base::ListValue regular_expected;\n  regular_expected.Append(\"\");\n  regular_expected.Append(\"\");\n  ASSERT_EQ(regular_expected, regular_begin.ExtractList());\n  ASSERT_EQ(\"\", content::EvalJs(regular_contents, complete_script));\n  const Extension* installed =\n      ExtensionRegistry::Get(regular_profile)->enabled_extensions().GetByID(\n          kExtensionId);\n  ASSERT_TRUE(installed);\n  EXPECT_EQ(3, installed->manifest_version());\n  EXPECT_TRUE(installed->from_webstore());\n  EXPECT_EQ(initial_approvals,\n            WebstorePrivateApi::GetPendingApprovalsCountForTesting());\n  EXPECT_FALSE(tracker->GetActiveInstall(kExtensionId));\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n"
