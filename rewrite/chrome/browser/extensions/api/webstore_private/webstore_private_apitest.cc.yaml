    replace: "\n  std::unique_ptr<ScopedTestDialogAutoConfirm> auto_confirm_install_;\n};\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace {\n\nusing BeginInstallFunction = WebstorePrivateBeginInstallWithManifest3Function;\nscoped_refptr<BeginInstallFunction>* g_observed_begin_install = nullptr;\n\n// Retain the real dispatched function without substituting Run, policy, prompt,\n// or the Mojo response callback. Preserve only a copy of its outgoing results.\nscoped_refptr<ExtensionFunction> ObserveBeginInstallFunction() {\n  CHECK(g_observed_begin_install);\n  CHECK(!*g_observed_begin_install);\n  auto function = base::MakeRefCounted<BeginInstallFunction>();\n  function->preserve_results_for_testing();\n  *g_observed_begin_install = function;\n  return function;\n}\n\n}  // namespace\n\nclass ExtensionWebstorePrivateDocumentApiTest\n    : public ExtensionWebstorePrivateApiTest {\n public:\n  ExtensionWebstorePrivateDocumentApiTest() {\n    features_.InitWithFeaturesAndParameters(\n        content::GetDefaultEnabledBackForwardCacheFeaturesForTesting(),\n        content::GetDefaultDisabledBackForwardCacheFeaturesForTesting());\n  }\n\n  void SetUpOnMainThread() override {\n    // The base fixture starts this server, so install the held route first.\n    icon_response_ =\n        std::make_unique<net::test_server::ControllableHttpResponse>(\n            embedded_test_server(), \"/cws-held-icon.png\");\n    ExtensionWebstorePrivateApiTest::SetUpOnMainThread();\n    ASSERT_FALSE(HasFatalFailure());\n    host_resolver()->AddRule(\"other.example.com\", \"127.0.0.1\");\n\n    {\n      base::ScopedAllowBlockingForTesting allow_blocking;\n      ASSERT_TRUE(base::ReadFileToString(\n          test_data_dir_.AppendASCII(\n              \"api_test/webstore_private/extension/icon.png\"),\n          &icon_bytes_));\n    }\n    ASSERT_FALSE(icon_bytes_.empty());\n    ASSERT_FALSE(tracker()->GetActiveInstall(kExtensionId));\n\n    // Override the base ACCEPT scope: these tests require actual prompt entry\n    // and cancellation through the real owning tab.\n    no_auto_confirm_ = std::make_unique<ScopedTestDialogAutoConfirm>(\n        ScopedTestDialogAutoConfirm::NONE);\n    prompt_reset_ =\n        std::make_unique<base::AutoReset<InstallPromptData::PromptType>>(\n            &ExtensionInstallPrompt::g_last_prompt_type_for_tests,\n            InstallPromptData::UNSET_PROMPT_TYPE);\n    function_slot_reset_ =\n        std::make_unique<base::AutoReset<scoped_refptr<BeginInstallFunction>*>>(\n            &g_observed_begin_install, &function_);\n\n    auto& registry = ExtensionFunctionRegistry::GetInstance();\n    const auto original = registry.GetFactoriesForTesting().at(\n        BeginInstallFunction::static_function_name());\n    ASSERT_TRUE(registry.OverrideFunctionForTesting(\n        BeginInstallFunction::static_function_name(),\n        &ObserveBeginInstallFunction));\n    restore_factory_.ReplaceClosure(base::BindOnce(\n        [](ExtensionFunctionRegistry::FactoryEntry entry) {\n          ExtensionFunctionRegistry::GetInstance().Register(entry);\n        },\n        original));\n  }\n\n  void TearDownOnMainThread() override {\n    // A fatal assertion must not strand a held fetch or a native dialog that\n    // owns the production function across fixtures. A timeout here is a fatal\n    // harness quiescence failure, not permission to continue with live work.\n    if (request_sender_ && !request_sender_->IsDestroyed()) {\n      CHECK(request_contents_);\n      // ExecJs can fail after sending the API request. Retire its exact\n      // associated LocalFrameHost receiver before restoring the factory, even\n      // if no function was captured. Disabling BFCache also flushes cached A.\n      content::DisableBackForwardCacheForTesting(\n          request_contents_.get(),\n          content::BackForwardCache::DisableForTestingReason::\n              TEST_REQUIRES_NO_CACHING);\n      if (!request_sender_->IsDestroyed() &&\n          request_sender_->get() == request_contents_->GetPrimaryMainFrame()) {\n        CHECK(chrome_test_utils::NavigateToURL(\n            request_contents_.get(), OtherURL(\"/title2.html?sender-cleanup\")));\n      }\n      CHECK(\n          base::test::RunUntil([&] { return request_sender_->IsDestroyed(); }));\n    }\n    if (function_) {\n      if (!icon_released_ && !function_->did_respond()) {\n        CHECK(base::test::RunUntil([&] {\n          return icon_response_->has_received_request() ||\n                 function_->did_respond();\n        }));\n      }\n      if (!icon_released_ && icon_response_->has_received_request()) {\n        ReleaseIcon();\n      }\n      if (!function_->did_respond()) {\n        CHECK(base::test::RunUntil(\n            [&] { return function_->did_respond() || PromptAdmitted(); }));\n        if (!function_->did_respond()) {\n          CHECK(request_contents_);\n          CHECK(chrome_test_utils::NavigateToURL(\n              request_contents_.get(), OtherURL(\"/title2.html?cleanup\")));\n        }\n        CHECK(base::test::RunUntil([&] { return function_->did_respond(); }));\n      }\n      function_.reset();\n    }\n\n    // Pop only this test's approval if an earlier assertion found unexpected\n    // success. Never clear approvals belonging to other requests.\n    if (WebstorePrivateApi::PopApprovalForTesting(profile(), kExtensionId)) {\n      ADD_FAILURE() << \"Unexpected approval from the delayed-prompt test\";\n      tracker()->RemoveActiveInstall(kExtensionId);\n    }\n    if (request_sender_) {\n      EXPECT_FALSE(tracker()->GetActiveInstall(kExtensionId));\n      // Isolate subsequent tests even after an unexpected successful response\n      // transferred the active-install responsibility to completeInstall.\n      tracker()->RemoveActiveInstall(kExtensionId);\n    }\n    request_sender_.reset();\n    request_contents_.reset();\n    restore_factory_.RunAndReset();\n    function_slot_reset_.reset();\n    prompt_reset_.reset();\n    no_auto_confirm_.reset();\n    icon_response_.reset();\n    WebstoreInstaller::SetDownloadDirectoryForTests(nullptr);\n    ExtensionWebstorePrivateApiTest::TearDownOnMainThread();\n  }\n\n protected:\n  content::WebContents* contents() {\n    return chrome_test_utils::GetActiveWebContents(this);\n  }\n\n  InstallTracker* tracker() {\n    return ExtensionsBrowserClient::Get()->GetInstallTracker(profile());\n  }\n\n  GURL SenderURL() {\n    return embedded_test_server()->GetURL(\"www.example.com\", \"/title1.html\");\n  }\n\n  GURL OtherURL(const std::string& path) {\n    return embedded_test_server()->GetURL(\"other.example.com\", path);\n  }\n\n  void BeginWithHeldIcon() {\n    ASSERT_TRUE(chrome_test_utils::NavigateToURL(contents(), SenderURL()));\n    request_contents_ = contents()->GetWeakPtr();\n    request_sender_ = std::make_unique<content::RenderFrameHostWrapper>(\n        request_contents_->GetPrimaryMainFrame());\n    ASSERT_TRUE(content::ExecJs(\n        request_contents_.get(),\n        content::JsReplace(R\"(\n          chrome.webstorePrivate.beginInstallWithManifest3({\n            id: $1,\n            manifest: JSON.stringify({\n              name: 'Delayed prompt document',\n              version: '1.0',\n              manifest_version: 3\n            }),\n            iconUrl: $2\n          }, () => { void chrome.runtime.lastError; });\n        )\",\n                           kExtensionId,\n                           embedded_test_server()->GetURL(\n                               \"www.example.com\", \"/cws-held-icon.png\"))));\n    ASSERT_TRUE(base::test::RunUntil([&] {\n      return icon_response_->has_received_request() ||\n             (function_ && function_->did_respond());\n    }));\n    ASSERT_TRUE(function_);\n    ASSERT_TRUE(icon_response_->has_received_request())\n        << function_->GetError();\n    ASSERT_FALSE(function_->did_respond());\n    ASSERT_TRUE(tracker()->GetActiveInstall(kExtensionId));\n    EXPECT_FALSE(PromptAdmitted());\n  }\n\n  void ReleaseIcon() {\n    CHECK(!icon_released_);\n    CHECK(icon_response_->has_received_request());\n    // has_received_request() alone does not transition the response to READY.\n    icon_response_->WaitForRequest();\n    icon_response_->Send(net::HTTP_OK, \"image/png\", icon_bytes_);\n    icon_response_->Done();\n    icon_released_ = true;\n  }\n\n  bool PromptAdmitted() const {\n    return ExtensionInstallPrompt::g_last_prompt_type_for_tests !=\n           InstallPromptData::UNSET_PROMPT_TYPE;\n  }\n\n  void WaitForResponseOrPrompt() {\n    ASSERT_TRUE(base::test::RunUntil(\n        [&] { return function_->did_respond() || PromptAdmitted(); }));\n    // Complete the native/Java dialog-creation turn, including an immediate\n    // failed-window abort. This is native admission evidence, not pixel proof.\n    base::RunLoop().RunUntilIdle();\n  }\n\n  void ExpectCancellationAndRelease() {\n    ASSERT_TRUE(function_);\n    ASSERT_TRUE(function_->did_respond());\n    EXPECT_EQ(\"User cancelled install\", function_->GetError());\n    const base::ListValue* results = function_->GetResultListForTest();\n    ASSERT_TRUE(results);\n    ASSERT_EQ(1u, results->size());\n    ASSERT_TRUE((*results)[0].is_string());\n    EXPECT_EQ(\"user_cancelled\", (*results)[0].GetString());\n    EXPECT_FALSE(\n        WebstorePrivateApi::PopApprovalForTesting(profile(), kExtensionId));\n\n    // The real function owns ScopedActiveInstall until its destructor; do not\n    // mistake this test's retained reference for a production install leak.\n    function_.reset();\n    EXPECT_TRUE(base::test::RunUntil(\n        [&] { return !tracker()->GetActiveInstall(kExtensionId); }));\n  }\n\n  void ExpectPromptThenCancel() {\n    ASSERT_NO_FATAL_FAILURE(WaitForResponseOrPrompt());\n    ASSERT_EQ(InstallPromptData::INSTALL_PROMPT,\n              ExtensionInstallPrompt::g_last_prompt_type_for_tests);\n    ASSERT_FALSE(function_->did_respond())\n        << \"Native prompt admission immediately aborted\";\n    ASSERT_TRUE(request_contents_);\n    ASSERT_TRUE(chrome_test_utils::NavigateToURL(request_contents_.get(),\n                                                 OtherURL(\"/title2.html\")));\n    ASSERT_TRUE(base::test::RunUntil([&] { return function_->did_respond(); }));\n    ASSERT_NO_FATAL_FAILURE(ExpectCancellationAndRelease());\n  }\n\n  scoped_refptr<BeginInstallFunction> function_;\n\n private:\n  base::test::ScopedFeatureList features_;\n  std::unique_ptr<net::test_server::ControllableHttpResponse> icon_response_;\n  std::string icon_bytes_;\n  base::WeakPtr<content::WebContents> request_contents_;\n  std::unique_ptr<content::RenderFrameHostWrapper> request_sender_;\n  bool icon_released_ = false;\n  std::unique_ptr<ScopedTestDialogAutoConfirm> no_auto_confirm_;\n  std::unique_ptr<base::AutoReset<InstallPromptData::PromptType>> prompt_reset_;\n  std::unique_ptr<base::AutoReset<scoped_refptr<BeginInstallFunction>*>>\n      function_slot_reset_;\n  base::ScopedClosureRunner restore_factory_;\n};\n\nIN_PROC_BROWSER_TEST_F(ExtensionWebstorePrivateDocumentApiTest,\n                       CachedSenderCancelsBeforePrompt) {\n  ASSERT_NO_FATAL_FAILURE(BeginWithHeldIcon());\n  content::RenderFrameHostWrapper sender(contents()->GetPrimaryMainFrame());\n  ASSERT_TRUE(\n      chrome_test_utils::NavigateToURL(contents(), OtherURL(\"/title2.html\")));\n  ASSERT_TRUE(sender);\n  ASSERT_NE(sender.get(), contents()->GetPrimaryMainFrame());\n  ASSERT_EQ(content::RenderFrameHost::LifecycleState::kInBackForwardCache,\n            sender->GetLifecycleState());\n\n  ReleaseIcon();\n  // On the old code, native prompt admission also ends this wait, producing an\n  // immediate failure rather than hanging for a dialog no one has accepted.\n  ASSERT_NO_FATAL_FAILURE(WaitForResponseOrPrompt());\n  EXPECT_FALSE(PromptAdmitted());\n  ASSERT_NO_FATAL_FAILURE(ExpectCancellationAndRelease());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionWebstorePrivateDocumentApiTest,\n                       LiveSenderAdmitsPrompt) {\n  ASSERT_NO_FATAL_FAILURE(BeginWithHeldIcon());\n  ReleaseIcon();\n  ASSERT_NO_FATAL_FAILURE(ExpectPromptThenCancel());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionWebstorePrivateDocumentApiTest,\n                       SameDocumentNavigationPreservesPrompt) {\n  ASSERT_NO_FATAL_FAILURE(BeginWithHeldIcon());\n  content::WeakDocumentPtr sender =\n      contents()->GetPrimaryMainFrame()->GetWeakDocumentPtr();\n  ASSERT_TRUE(chrome_test_utils::NavigateToURL(\n      contents(), GURL(SenderURL().spec() + \"#same-document\")));\n  ASSERT_EQ(sender.AsRenderFrameHostIfValid(),\n            contents()->GetPrimaryMainFrame());\n  ASSERT_TRUE(contents()->GetPrimaryMainFrame()->IsActive());\n\n  ReleaseIcon();\n  ASSERT_NO_FATAL_FAILURE(ExpectPromptThenCancel());\n}\n\nIN_PROC_BROWSER_TEST_F(ExtensionWebstorePrivateDocumentApiTest,\n                       DeletedSenderCancelsWithoutPrompt) {\n  ASSERT_NO_FATAL_FAILURE(BeginWithHeldIcon());\n  content::RenderFrameHostWrapper sender(contents()->GetPrimaryMainFrame());\n  content::DisableBackForwardCacheForTesting(\n      contents(), content::BackForwardCache::DisableForTestingReason::\n                      TEST_REQUIRES_NO_CACHING);\n  ASSERT_TRUE(\n      chrome_test_utils::NavigateToURL(contents(), OtherURL(\"/title2.html\")));\n  ASSERT_TRUE(sender.WaitUntilRenderFrameDeleted());\n  ASSERT_TRUE(base::test::RunUntil([&] { return sender.IsDestroyed(); }));\n\n  ReleaseIcon();\n  ASSERT_NO_FATAL_FAILURE(WaitForResponseOrPrompt());\n  EXPECT_FALSE(PromptAdmitted());\n  ASSERT_NO_FATAL_FAILURE(ExpectCancellationAndRelease());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n// Test cases where the user accepts the install confirmation dialog.\nIN_PROC_BROWSER_TEST_F(ExtensionWebstorePrivateApiTest, InstallAccepted) {\n"
