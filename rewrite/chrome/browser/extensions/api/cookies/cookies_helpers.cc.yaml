- description: "Android cookie enumeration omits unrepresentable transient partition keys"
  regex:
    re_pattern: "bool\\ MatchFilter::MatchesCookie\\(\\\n\\ \\ \\ \\ const\\ net::CanonicalCookie\\&\\ cookie\\)\\ \\{\\\n"
    replace: "bool MatchFilter::MatchesCookie(\n    const net::CanonicalCookie& cookie) {\n#if BUILDFLAG(IS_ANDROID)\n  // The extensions API cannot represent transient cookie partition keys.\n  if (cookie.IsPartitioned() &&\n      !cookie.PartitionKey()->IsSerializeable()) {\n    return false;\n  }\n#endif\n"
- description: "Exclude the optional cookie partition-key measurement include on Android."
  regex:
    re_pattern: "\\#include\\ \"base/metrics/histogram_functions\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/metrics/histogram_functions.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "Exclude the optional cookie partition-key well-formedness measurement on Android."
  regex:
    re_pattern: "\\ \\ //\\ Record\\ 'well\\ formatted'\\ uma\\ here\\ so\\ that\\ we\\ count\\ only\\ coercible\\\n\\ \\ //\\ partition\\ keys\\.\\\n\\ \\ base::UmaHistogramBoolean\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.CookieAPIPartitionKeyWellFormatted\",\\\n\\ \\ \\ \\ \\ \\ net::SchemefulSite::Deserialize\\(partition_key\\->top_level_site\\.value\\(\\)\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\.Serialize\\(\\)\\ ==\\ partition_key\\->top_level_site\\.value\\(\\)\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Record 'well formatted' uma here so that we count only coercible\n  // partition keys.\n  base::UmaHistogramBoolean(\n      \"Extensions.CookieAPIPartitionKeyWellFormatted\",\n      net::SchemefulSite::Deserialize(partition_key->top_level_site.value())\n              .Serialize() == partition_key->top_level_site.value());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
