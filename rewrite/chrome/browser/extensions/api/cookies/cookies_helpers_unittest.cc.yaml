substitutions:
- description: "Android ordinary cookie filter fixture includes"
  regex:
    re_pattern: "\\#include\\ \"base/logging\\.h\"\\\n"
    replace: "#include \"base/logging.h\"\n#include \"build/build_config.h\"\n#if BUILDFLAG(IS_ANDROID)\n#include \"base/unguessable_token.h\"\n#include \"net/cookies/cookie_partition_key.h\"\n#include \"net/cookies/cookie_partition_key_collection.h\"\n#endif\n"
- description: "Android ordinary cookie filter representability regression"
  regex:
    re_pattern: "\\}\\ \\ //\\ namespace\\ extensions\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\nTEST(CookiesHelperUnittest, MatchFilterExcludesUnrepresentablePartitionKeys) {\n  api::cookies::GetAll::Params::Details details;\n  cookies_helpers::MatchFilter filter(&details);\n  filter.SetCookiePartitionKeyCollection(\n      net::CookiePartitionKeyCollection::ContainsAll());\n\n  const auto make_cookie = [](std::optional<net::CookiePartitionKey> key) {\n    return net::CanonicalCookie::CreateUnsafeCookieForTesting(\n        \"cookiename\", \"cookievalue\", \"example.com\", \"/\", base::Time::Now(),\n        base::Time(), base::Time(), base::Time(), true, false,\n        net::CookieSameSite::NO_RESTRICTION, net::COOKIE_PRIORITY_DEFAULT,\n        net::CookieSourceType::kOther, key);\n  };\n  auto unpartitioned = make_cookie(std::nullopt);\n  auto serializable = make_cookie(net::CookiePartitionKey::FromURLForTesting(\n      GURL(\"https://example.com\")));\n  auto transient = make_cookie(net::CookiePartitionKey::FromURLForTesting(\n      GURL(\"https://example.com\"),\n      net::CookiePartitionKey::AncestorChainBit::kCrossSite,\n      base::UnguessableToken::Create()));\n  auto opaque = make_cookie(net::CookiePartitionKey::FromURLForTesting(\n      GURL(\"data:text/plain,opaque\")));\n  ASSERT_TRUE(unpartitioned);\n  ASSERT_TRUE(serializable);\n  ASSERT_TRUE(transient);\n  ASSERT_TRUE(opaque);\n\n  // Test the filter only; do not serialize an unrepresentable partition key.\n  EXPECT_TRUE(filter.MatchesCookie(*unpartitioned));\n  EXPECT_TRUE(filter.MatchesCookie(*serializable));\n  EXPECT_FALSE(filter.MatchesCookie(*transient));\n  EXPECT_FALSE(filter.MatchesCookie(*opaque));\n  details.name = \"different-name\";\n  EXPECT_FALSE(filter.MatchesCookie(*unpartitioned));\n  EXPECT_FALSE(filter.MatchesCookie(*serializable));\n}\n#endif\n\n}  // namespace extensions\n"
