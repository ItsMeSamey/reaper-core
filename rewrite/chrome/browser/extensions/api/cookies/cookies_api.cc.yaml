        \ change);\n}\n\nvoid CookiesEventRouter::RefreshContainerListeners() {\n  if (profile_->IsOffTheRecord()) {\n    return;\n\
        \  }\n  auto* service = ContainersServiceFactory::GetForProfile(profile_);\n  if (!service) {\n    return;\n  }\n  std::set<std::string>\
        \ ids;\n  for (const auto& id : service->GetRuntimeContainerIds()) {\n    ids.insert(id);\n  }\n  profile_->ForEachLoadedStoragePartition([&](content::StoragePartition*\
