        \ [&](const std::string& id) {\n    return id.empty() || !containers::android::IsContainerIdWellFormed(id) ||\n    \
        \       !containers::android::ResolveContainerStoragePartition(profile_, id);\n  });\n  std::erase_if(container_subscriptions_,\n\
        \                [&](const auto& entry) { return !ids.contains(entry.first); });\n  for (const auto& id : ids) {\n \
