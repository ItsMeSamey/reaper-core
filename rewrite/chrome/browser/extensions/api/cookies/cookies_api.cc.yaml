        \   return;\n  }\n  auto* manager = profile_->GetStoragePartition(*config)\n                      ->GetCookieManagerForBrowserProcess();\n\
        \  if (!manager) {\n    return;\n  }\n  auto& receiver = found->second->receiver;\n  manager->AddGlobalChangeListener(receiver.BindNewPipeAndPassRemote());\n\
        \  receiver.set_disconnect_handler(\n      base::BindOnce(&CookiesEventRouter::OnContainerConnectionError,\n       \
        \              base::Unretained(this), id));\n}\n\nvoid CookiesEventRouter::OnContainerConnectionError(const std::string&\
        \ id) {\n  auto found = container_subscriptions_.find(id);\n  if (found == container_subscriptions_.end()) {\n    return;\n\
        \  }\n  found->second->receiver.reset();\n  BindContainerListener(id);\n}\n\nvoid CookiesEventRouter::OnContainerCookieChange(\n\
        \    const std::string& id,\n    const net::CookieChangeInfo& change) {\n  if (!id.empty() && containers::android::IsContainerIdWellFormed(id)\
        \ &&\n      container_subscriptions_.contains(id) &&\n      containers::android::ResolveContainerStoragePartition(profile_,\
        \ id)) {\n    OnCookieChangeInStore(profile_, cookies_helpers::GetContainerStoreId(id),\n                          change);\n\
        \  }\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nvoid CookiesEventRouter::DispatchEvent(content::BrowserContext* context,\n\
        \                                       events::HistogramValue histogram_value,\n                                  \
        \     const std::string& event_name,\n"
