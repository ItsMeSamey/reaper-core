substitutions:
  - description:
      'Let OnCookieChangeExposeForTesting call the private OnCookieChange.'
    add_friend:
      class_name: CookiesEventRouter
      friend_type: struct OnCookieChangeExposeForTesting

  - description:
      'Let OnCookieChangeExposeForTesting reach the private
      cookies_event_router_.'
    add_friend:
      class_name: CookiesAPI
      friend_type: struct OnCookieChangeExposeForTesting

  - description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
    regex:
      re_pattern: '\

        \#ifndef\ CHROME_BROWSER_EXTENSIONS_API_COOKIES_COOKIES_API_H_\

        \#define\ CHROME_BROWSER_EXTENSIONS_API_COOKIES_COOKIES_API_H_\

        \

        \#include\ <memory>\

        \#include\ <optional>\

        \#include\ <string>\

        \

        \#include\ "base/gtest_prod_util\.h"\

        \#include\ "base/memory/raw_ptr\.h"\

        \#include\ "base/scoped_observation\.h"\

        \#include\ "base/values\.h"\

        \#include\ "chrome/browser/profiles/profile_observer\.h"\

        \#include\ "chrome/common/extensions/api/cookies\.h"\

        \#include\ "extensions/browser/browser_context_keyed_api_factory\.h"\

        \#include\ "extensions/browser/event_router\.h"\

        \#include\ "extensions/browser/extension_function\.h"\

        '
      replace: '

        #ifndef CHROME_BROWSER_EXTENSIONS_API_COOKIES_COOKIES_API_H_

        #define CHROME_BROWSER_EXTENSIONS_API_COOKIES_COOKIES_API_H_


        #include <map>

        #include <memory>

        #include <optional>

        #include <string>


        #include "base/gtest_prod_util.h"

        #include "base/memory/raw_ptr.h"

        #include "base/scoped_observation.h"

        #include "base/values.h"

        #include "build/build_config.h"

        #include "chrome/browser/profiles/profile_observer.h"

        #if BUILDFLAG(IS_ANDROID)

        #include "components/prefs/pref_change_registrar.h"

        #endif

        #include "chrome/common/extensions/api/cookies.h"

        #include "extensions/browser/browser_context_keyed_api_factory.h"

        #include "extensions/browser/event_router.h"

        #include "extensions/browser/extension_function.h"

        '
  - description: Owned Android window/auth/options/fullscreen and fixture routing final integration (2)
    regex:
      re_pattern: '\ \ \ \ \ \ Profile\*\ profile\);\

        \ \ void\ OnConnectionError\(\

        \ \ \ \ \ \ mojo::Receiver<network::mojom::CookieChangeListener>\*\ receiver\);\

        \ \ void\ OnCookieChange\(bool\ otr,\ const\ net::CookieChangeInfo\&\ change\);\

        \

        \ \ //\ This\ method\ dispatches\ events\ to\ the\ extension\ message\ service\.\

        \ \ void\ DispatchEvent\(content::BrowserContext\*\ context,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ events::HistogramValue\ histogram_value,\

        '
      replace: "      Profile* profile);\n  void OnConnectionError(\n      mojo::Receiver<network::mojom::CookieChangeListener>*\
        \ receiver);\n  void OnCookieChange(bool otr, const net::CookieChangeInfo& change);\n  void OnCookieChangeInStore(Profile*\
        \ profile,\n                             const std::string& store_id,\n                             const net::CookieChangeInfo&\
        \ change);\n#if BUILDFLAG(IS_ANDROID)\n  struct ContainerSubscription : public network::mojom::CookieChangeListener\
        \ {\n    ContainerSubscription(CookiesEventRouter* router, const std::string& id);\n    void OnCookieChange(const net::CookieChangeInfo&\
        \ change) override;\n    raw_ptr<CookiesEventRouter> router;\n    const std::string id;\n    mojo::Receiver<network::mojom::CookieChangeListener>\
        \ receiver;\n  };\n  void RefreshContainerListeners();\n  void BindContainerListener(const std::string& id);\n  void\
        \ OnContainerConnectionError(const std::string& id);\n  void OnContainerCookieChange(const std::string& id,\n      \
        \                         const net::CookieChangeInfo& change);\n  PrefChangeRegistrar container_pref_registrar_;\n\
        \  std::map<std::string, std::unique_ptr<ContainerSubscription>>\n      container_subscriptions_;\n#endif\n\n  // This\
        \ method dispatches events to the extension message service.\n  void DispatchEvent(content::BrowserContext* context,\n\
        \                     events::HistogramValue histogram_value,\n"

  - description: Android container cookie listener completion subscription (1)
    regex:
      re_pattern: '\#include\ "base/values\.h"\

        \#include\ "build/build_config\.h"\

        \#include\ "chrome/browser/profiles/profile_observer\.h"\

        \#if\ BUILDFLAG\(IS_ANDROID\)\

        \#include\ "components/prefs/pref_change_registrar\.h"\

        \#endif\

        \#include\ "chrome/common/extensions/api/cookies\.h"\

        \#include\ "extensions/browser/browser_context_keyed_api_factory\.h"\

        '
      replace: '#include "base/values.h"

        #include "build/build_config.h"

        #include "chrome/browser/profiles/profile_observer.h"

        #if BUILDFLAG(IS_ANDROID)

        #include "base/callback_list.h"

        #include "components/prefs/pref_change_registrar.h"

        #endif

        #include "chrome/common/extensions/api/cookies.h"

        #include "extensions/browser/browser_context_keyed_api_factory.h"

        '
  - description: Android container cookie listener completion subscription (2)
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ net::CookieChangeInfo\&\ change\);\

        \ \ PrefChangeRegistrar\ container_pref_registrar_;\

        \ \ std::map<std::string,\ std::unique_ptr<ContainerSubscription>>\

        \ \ \ \ \ \ container_subscriptions_;\

        \#endif\

        \

        \ \ //\ This\ method\ dispatches\ events\ to\ the\ extension\ message\ service\.\

        \ \ void\ DispatchEvent\(content::BrowserContext\*\ context,\

        '
      replace: "                               const net::CookieChangeInfo& change);\n  PrefChangeRegistrar container_pref_registrar_;\n\
        \  std::map<std::string, std::unique_ptr<ContainerSubscription>>\n      container_subscriptions_;\n  base::CallbackListSubscription\
        \ container_storage_removal_subscription_;\n#endif\n\n  // This method dispatches events to the extension message service.\n\
        \  void DispatchEvent(content::BrowserContext* context,\n"
  - description: Declare the Android-only receiver-owning subscription destructor out of line
    regex:
      pattern: '    ContainerSubscription(CookiesEventRouter* router, const std::string& id);

        '
      replace: "    ContainerSubscription(CookiesEventRouter* router, const std::string& id);\n    ~ContainerSubscription()\
        \ override;\n"
    count: 1
