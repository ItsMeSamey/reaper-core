    replace: "\n#if BUILDFLAG(IS_ANDROID)\n// Android uses the messages API for the warning message.\nvoid ExtensionDevToolsClientHost::CreateWarningMessage() {\n  if (warning_requested_) {\n    return;\n  }\n  Profile* target_profile =\n      Profile::FromBrowserContext(agent_host_->GetBrowserContext());\n  // The deliberately authorized browser target has no per-target context.\n  if (!target_profile &&\n      agent_host_->GetType() == DevToolsAgentHost::kTypeBrowser) {\n    target_profile = profile_;\n  }\n  if (!target_profile || target_profile->ShutdownStarted()) {\n    return;\n  }\n  warning_requested_ = true;\n  warning_profile_ = target_profile->GetWeakPtr();\n  if (target_profile != profile_) {\n    warning_profile_observation_.Observe(target_profile);\n  }\n  if (auto* browsers =\n          ProfileBrowserCollection::GetForProfile(target_profile)) {\n    warning_browser_observation_.Observe(browsers);\n  }\n  message_dispatcher_subscription_ =\n      messages::MessageDispatcherBridge::Get()->AddDispatcherChangedCallback(\n          base::BindRepeating(\n              &ExtensionDevToolsClientHost::ScheduleWarningMessageUpdate,\n              weak_factory_.GetWeakPtr()));\n  // Finish Attach's existing worker keepalive setup before invoking Messages.\n  ScheduleWarningMessageUpdate();\n}\n\nvoid ExtensionDevToolsClientHost::ScheduleWarningMessageUpdate() {\n  if (!warning_requested_ || warning_update_pending_) {\n    return;\n  }\n  warning_update_pending_ = true;\n  base::SingleThreadTaskRunner::GetCurrentDefault()->PostTask(\n      FROM_HERE,\n      base::BindOnce(&ExtensionDevToolsClientHost::UpdateWarningMessage,\n                     weak_factory_.GetWeakPtr()));\n}\n\nbase::android::ScopedJavaLocalRef<jobject>\nExtensionDevToolsClientHost::FindWarningWindow() {\n  Profile* target_profile = warning_profile_.get();\n  if (!target_profile || target_profile->ShutdownStarted()) {\n    return {};\n  }\n  if (WebContents* contents = agent_host_->GetWebContents();\n      contents && Profile::FromBrowserContext(contents->GetBrowserContext()) ==\n                      target_profile) {\n    if (auto* window = contents->GetTopLevelNativeWindow()) {\n      auto java_window = window->GetJavaObject();\n      if (!messages::MessageDispatcherBridge::Get()\n               ->GetMessageDispatcher(java_window)\n               .is_null()) {\n        return java_window;\n      }\n    }\n  }\n  auto* browsers = ProfileBrowserCollection::GetForProfile(target_profile);\n  if (!browsers) {\n    return {};\n  }\n  base::android::ScopedJavaLocalRef<jobject> result;\n  browsers->ForEach(\n      [target_profile, &result](BrowserWindowInterface* browser) {\n        if (browser->GetProfile() != target_profile ||\n            browser->IsDeleteScheduled()) {\n          return true;\n        }\n        auto* base_window = browser->GetWindow();\n        if (!base_window) {\n          return true;\n        }\n        auto* window = base_window->GetNativeWindow();\n        if (!window) {\n          // A pending BWI does not yet guarantee an Android OS window.\n          return true;\n        }\n        auto java_window = window->GetJavaObject();\n        if (java_window.is_null() || messages::MessageDispatcherBridge::Get()\n                                         ->GetMessageDispatcher(java_window)\n                                         .is_null()) {\n          return true;\n        }\n        result = std::move(java_window);\n        return false;\n      },\n      BrowserCollection::Order::kActivation);\n  return result;\n}\n\nvoid ExtensionDevToolsClientHost::UpdateWarningMessage() {\n  warning_update_pending_ = false;\n  if (!warning_requested_ || !warning_profile_ ||\n      warning_profile_->ShutdownStarted()) {\n    return;\n  }\n  auto weak_this = weak_factory_.GetWeakPtr();\n  auto java_window = FindWarningWindow();\n  if (!weak_this) {\n    return;\n  }\n  auto* dispatcher = messages::MessageDispatcherBridge::Get();\n  auto java_dispatcher = dispatcher->GetMessageDispatcher(java_window);\n  const bool ready = !java_dispatcher.is_null();\n\
      \  if (!weak_this) {\n    return;\n  }\n  JNIEnv* env = base::android::AttachCurrentThread();\n  if (warning_message_ && ready &&\n      env->IsSameObject(warning_window_.obj(), java_window.obj()) &&\n      env->IsSameObject(warning_dispatcher_.obj(), java_dispatcher.obj())) {\n    return;\n  }\n  warning_window_.Reset();\n  warning_dispatcher_.Reset();\n  warning_message_.reset();\n  if (!weak_this || !ready) {\n    // A real provider/browser transition will retry; do not poll or claim UI.\n    return;\n  }\n  auto* window = ui::WindowAndroid::FromJavaWindowAndroid(java_window);\n  if (!window) {\n    return;\n  }\n  auto message = std::make_unique<ExtensionDevToolsMessageDelegate>(\n      extension_->name(),\n      base::BindOnce(&ExtensionDevToolsClientHost::WarningUiDestroyed,\n                     weak_this));\n  const bool enqueued = message->Show(window);\n  if (!weak_this || !enqueued) {\n    return;\n  }\n  warning_window_.Reset(java_window);\n  warning_dispatcher_.Reset(java_dispatcher);\n  warning_message_ = std::move(message);\n}\n\nvoid ExtensionDevToolsClientHost::StopWarningMessage() {\n  warning_requested_ = false;\n  warning_update_pending_ = false;\n  weak_factory_.InvalidateWeakPtrs();\n  warning_browser_observation_.Reset();\n  warning_profile_observation_.Reset();\n  message_dispatcher_subscription_ = {};\n  warning_window_.Reset();\n  warning_dispatcher_.Reset();\n  warning_message_.reset();\n  warning_profile_.reset();\n}\n\nvoid ExtensionDevToolsClientHost::OnBrowserCreated(BrowserWindowInterface*) {\n  ScheduleWarningMessageUpdate();\n}\n\nvoid ExtensionDevToolsClientHost::OnBrowserClosed(BrowserWindowInterface*) {\n  ScheduleWarningMessageUpdate();\n}\n\nvoid ExtensionDevToolsClientHost::OnBrowserActivated(BrowserWindowInterface*) {\n  ScheduleWarningMessageUpdate();\n}\n\nvoid ExtensionDevToolsClientHost::OnBrowserDeactivated(\n    BrowserWindowInterface*) {\n  ScheduleWarningMessageUpdate();\n}\n#else\n// Win/Mac/Linux/Chrome OS use the infobar API for the warning message.\nvoid ExtensionDevToolsClientHost::CreateWarningInfobar() {\n"
