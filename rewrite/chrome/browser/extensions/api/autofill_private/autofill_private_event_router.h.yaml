# Android omits optional implementation and retains ordinary contracts.
substitutions:
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/extensions/api/autofill_private/autofill_private_event_router.h'
  regex:
    re_pattern: '\

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "base/scoped_observation\.h"\

      \#include\ "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager\.h"\

      \#include\ "components/autofill/core/browser/data_manager/personal_data_manager\.h"\

      \#include\ "components/autofill/core/browser/data_manager/personal_data_manager_observer\.h"\

      \#include\ "components/keyed_service/core/keyed_service\.h"\

      '
    replace: '

      #include "base/memory/raw_ptr.h"

      #include "base/scoped_observation.h"

      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager.h"

      #endif

      #include "components/autofill/core/browser/data_manager/personal_data_manager.h"

      #include "components/autofill/core/browser/data_manager/personal_data_manager_observer.h"

      #include "components/keyed_service/core/keyed_service.h"

      '
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/extensions/api/autofill_private/autofill_private_event_router.h'
  regex:
    re_pattern: 'class\ AutofillPrivateEventRouter\ :\ public\ KeyedService,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ EventRouter::Observer,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ autofill::PersonalDataManagerObserver,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ autofill::EntityDataManager::Observer,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ public\ syncer::SyncServiceObserver\ \{\

      \ public:\

      \ \ //\ Uses\ AutofillPrivateEventRouterFactory\ instead\.\

      '
    replace: "class AutofillPrivateEventRouter : public KeyedService,\n                                   public EventRouter::Observer,\n                                   public autofill::PersonalDataManagerObserver,\n#if !BUILDFLAG(IS_ANDROID)\n                                   public autofill::EntityDataManager::Observer,\n#endif\n                                   public syncer::SyncServiceObserver {\n public:\n  // Uses AutofillPrivateEventRouterFactory instead.\n"
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/extensions/api/autofill_private/autofill_private_event_router.h'
  regex:
    re_pattern: '\ \ //\ PersonalDataManagerObserver\ implementation\.\

      \ \ void\ OnPersonalDataChanged\(\)\ override;\

      \

      \ \ //\ autofill::EntityDataManager::Observer\ implementation\.\

      \ \ void\ OnEntityInstancesChanged\(\)\ override;\

      \

      \ \ //\ SyncServiceObserver\ implementation\.\

      \ \ void\ OnStateChanged\(syncer::SyncService\*\)\ override;\

      '
    replace: "  // PersonalDataManagerObserver implementation.\n  void OnPersonalDataChanged() override;\n\n#if !BUILDFLAG(IS_ANDROID)\n  // autofill::EntityDataManager::Observer implementation.\n  void OnEntityInstancesChanged() override;\n#endif\n\n  // SyncServiceObserver implementation.\n  void OnStateChanged(syncer::SyncService*) override;\n"
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/extensions/api/autofill_private/autofill_private_event_router.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ autofill::PersonalDataManagerObserver>\

      \ \ \ \ \ \ pdm_observer_\{this\};\

      \

      \ \ base::ScopedObservation<autofill::EntityDataManager,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ autofill::EntityDataManager::Observer>\

      \ \ \ \ \ \ entity_data_manager_observer_\{this\};\

      \

      \ \ base::ScopedObservation<syncer::SyncService,\ syncer::SyncServiceObserver>\

      \ \ \ \ \ \ sync_observer_\{this\};\

      '
    replace: "                          autofill::PersonalDataManagerObserver>\n      pdm_observer_{this};\n\n#if !BUILDFLAG(IS_ANDROID)\n  base::ScopedObservation<autofill::EntityDataManager,\n                          autofill::EntityDataManager::Observer>\n      entity_data_manager_observer_{this};\n#endif\n\n  base::ScopedObservation<syncer::SyncService, syncer::SyncServiceObserver>\n      sync_observer_{this};\n"
