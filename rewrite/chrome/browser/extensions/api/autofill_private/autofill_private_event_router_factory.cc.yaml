# Android omits optional implementation and retains ordinary contracts.
substitutions:
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/extensions/api/autofill_private/autofill_private_event_router_factory.cc'
  regex:
    re_pattern: '\

      \#include\ "chrome/browser/extensions/api/autofill_private/autofill_private_event_router_factory\.h"\

      \

      \#include\ "chrome/browser/autofill/autofill_entity_data_manager_factory\.h"\

      \#include\ "chrome/browser/autofill/personal_data_manager_factory\.h"\

      \#include\ "chrome/browser/extensions/api/autofill_private/autofill_private_event_router\.h"\

      \#include\ "chrome/browser/sync/sync_service_factory\.h"\

      '
    replace: '

      #include "chrome/browser/extensions/api/autofill_private/autofill_private_event_router_factory.h"


      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/autofill/autofill_entity_data_manager_factory.h"

      #endif

      #include "chrome/browser/autofill/personal_data_manager_factory.h"

      #include "chrome/browser/extensions/api/autofill_private/autofill_private_event_router.h"

      #include "chrome/browser/sync/sync_service_factory.h"

      '
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/extensions/api/autofill_private/autofill_private_event_router_factory.cc'
  regex:
    re_pattern: 'namespace\ extensions\ \{\

      \

      //\ static\

      AutofillPrivateEventRouter\*\

      AutofillPrivateEventRouterFactory::GetForProfile\(\

      \ \ \ \ content::BrowserContext\*\ context\)\ \{\

      \ \ return\ static_cast<AutofillPrivateEventRouter\*>\(\

      \ \ \ \ \ \ GetInstance\(\)\->GetServiceForBrowserContext\(context,\ true\)\);\

      '
    replace: "namespace extensions {\n\n// static\nAutofillPrivateEventRouter* AutofillPrivateEventRouterFactory::GetForProfile(\n    content::BrowserContext* context) {\n  return static_cast<AutofillPrivateEventRouter*>(\n      GetInstance()->GetServiceForBrowserContext(context, true));\n"
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/extensions/api/autofill_private/autofill_private_event_router_factory.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \.Build\(\)\)\ \{\

      \ \ DependsOn\(ExtensionsBrowserClient::Get\(\)\->GetExtensionSystemFactory\(\)\);\

      \ \ DependsOn\(autofill::PersonalDataManagerFactory::GetInstance\(\)\);\

      \ \ DependsOn\(autofill::AutofillEntityDataManagerFactory::GetInstance\(\)\);\

      \ \ DependsOn\(SyncServiceFactory::GetInstance\(\)\);\

      \}\

      \

      '
    replace: "              .Build()) {\n  DependsOn(ExtensionsBrowserClient::Get()->GetExtensionSystemFactory());\n  DependsOn(autofill::PersonalDataManagerFactory::GetInstance());\n#if !BUILDFLAG(IS_ANDROID)\n  DependsOn(autofill::AutofillEntityDataManagerFactory::GetInstance());\n#endif\n  DependsOn(SyncServiceFactory::GetInstance());\n}\n\n"
- description: 'Compile optional Android implementation out while retaining ordinary typed contracts: chrome/browser/extensions/api/autofill_private/autofill_private_event_router_factory.cc'
  regex:
    re_pattern: '\ \ return\ std::make_unique<AutofillPrivateEventRouter>\(context\);\

      \}\

      \

      bool\ AutofillPrivateEventRouterFactory::\

      \ \ \ \ ServiceIsCreatedWithBrowserContext\(\)\ const\ \{\

      \ \ return\ true;\

      \}\

      \

      '
    replace: "  return std::make_unique<AutofillPrivateEventRouter>(context);\n}\n\nbool AutofillPrivateEventRouterFactory::ServiceIsCreatedWithBrowserContext()\n    const {\n  return true;\n}\n\n"
