# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android optional popup/private implementation and dependency exclusion: chrome/browser/extensions/api/autofill_private/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//skia",\

      \ \ \ \ "//third_party/libaddressinput:util",\

      \ \ \]\

      \}\

      '
    replace: "    \"//skia\",\n    \"//third_party/libaddressinput:util\",\n  ]\n\n  if (is_android) {\n    sources -= [\n      \"autofill_ai_util.cc\",\n      \"autofill_ai_util.h\",\n    ]\n    deps -= [\n      \"//chrome/browser/ui/user_education\",\n      \"//components/consent_auditor\",\n      \"//components/feature_engagement/public\",\n      \"//components/wallet/core/browser\",\n      \"//components/wallet/core/common:features\",\n    ]\n  }\n}\n"
