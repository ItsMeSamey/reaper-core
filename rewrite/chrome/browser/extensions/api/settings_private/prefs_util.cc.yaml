substitutions:
- description: Exclude the retired Android image-label settings-private preference allowlist entry
  regex:
    pattern: "  (*s_allowlist)[::prefs::kAccessibilityImageLabelsEnabled] =\n      settings_api::PrefType::kBoolean;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  (*s_allowlist)[::prefs::kAccessibilityImageLabelsEnabled] =\n      settings_api::PrefType::kBoolean;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
