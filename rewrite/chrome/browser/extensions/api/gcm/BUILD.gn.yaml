# Android extension-only native GCM integration.
substitutions:
- description: Link the scoped Android extension native GCM helper
  regex:
    re_pattern: \ \ configs\ \+=\ \[\ "//build/config/compiler:wexit_time_destructors"\ \]
    replace: "  if (is_android && enable_desktop_android_extensions) {\n    deps = [ \"//brave/browser/extensions/api/gcm\" ]\n  } else {\n    deps = []\n  }\n\n  configs += [ \"//build/config/compiler:wexit_time_destructors\" ]"
- description: Preserve common GCM API dependencies
  regex:
    re_pattern: '\ \ deps\ =\ \[\

      \ \ \ \ "//base",'
    replace: "  deps += [\n    \"//base\","
