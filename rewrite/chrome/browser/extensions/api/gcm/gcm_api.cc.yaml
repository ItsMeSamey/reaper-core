# Android extension-only native GCM integration.
substitutions:
- description: Include scoped native registration helper for Android extensions
  regex:
    re_pattern: static_assert\(BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\);
    replace: '#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)

      #include "brave/browser/extensions/api/gcm/android_extension_gcm_driver.h"

      #endif


      static_assert(BUILDFLAG(ENABLE_EXTENSIONS_CORE));'
- description: Use actual multi-sender native registration only for opted-in Android extensions
  regex:
    re_pattern: 'ExtensionFunction::ResponseAction\ GcmRegisterFunction::Run\(\)\ \{\

      \ \ std::optional<api::gcm::Register::Params>\ params\ =\

      \ \ \ \ \ \ api::gcm::Register::Params::Create\(args\(\)\);\

      \ \ EXTENSION_FUNCTION_VALIDATE\(params\);\

      \

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ //\ This\ server\ API\ was\ deprecated\ by\ Firebase\ in\ 2019\.\ Don''t\ bother\ trying\ to\

      \ \ //\ implement\ register\(\)\ on\ Android\ \-\ it\ will\ just\ return\ an\ error\.\

      \ \ //\ TODO\(crbug\.com/421235963\):\ Consider\ deprecating\ on\ other\ platforms\.\

      \ \ return\ RespondNow\(Error\(GcmResultToError\(gcm::GCMClient::UNKNOWN_ERROR\)\)\);\

      \#else\

      \ \ GetGCMDriver\(\)\->Register\(\

      \ \ \ \ \ \ extension\(\)\->id\(\),\ params\->sender_ids,\

      \ \ \ \ \ \ base::BindOnce\(\&GcmRegisterFunction::CompleteFunctionWithResult,\ this\)\);\

      \

      \ \ //\ Register\(\)\ might\ have\ returned\ synchronously\.\

      \ \ return\ did_respond\(\)\ \?\ AlreadyResponded\(\)\ :\ RespondLater\(\);\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      \}\

      \

      '
    replace: "ExtensionFunction::ResponseAction GcmRegisterFunction::Run() {\n  std::optional<api::gcm::Register::Params> params =\n      api::gcm::Register::Params::Create(args());\n  EXTENSION_FUNCTION_VALIDATE(params);\n\n#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  auto* handler = ExtensionGCMAppHandler::GetFactoryInstance()->Get(browser_context());\n  auto* driver = handler ? handler->GetAndroidDriver() : nullptr;\n  if (!driver) {\n    return RespondNow(Error(kGCMDisabled));\n  }\n  driver->Register(\n      extension()->id(), params->sender_ids,\n      base::BindOnce(&GcmRegisterFunction::CompleteFunctionWithResult, this));\n  return did_respond() ? AlreadyResponded() : RespondLater();\n#elif BUILDFLAG(IS_ANDROID)\n  return RespondNow(Error(GcmResultToError(gcm::GCMClient::UNKNOWN_ERROR)));\n#else\n  GetGCMDriver()->Register(\n      extension()->id(), params->sender_ids,\n      base::BindOnce(&GcmRegisterFunction::CompleteFunctionWithResult, this));\n\n  // Register() might have returned synchronously.\n  return did_respond() ? AlreadyResponded() : RespondLater();\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n\n"
- description: Use existing native senderless unregister without changing platform InstanceID
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ //\ This\ server\ API\ was\ deprecated\ by\ Firebase\ in\ 2019\.\ Don''t\ bother\ trying\ to\

      \ \ //\ implement\ register\(\)\ on\ Android\ \-\ it\ will\ just\ return\ an\ error\.\

      \ \ //\ TODO\(crbug\.com/421235963\):\ Consider\ deprecating\ on\ other\ platforms\.\

      \ \ return\ RespondNow\(Error\(GcmResultToError\(gcm::GCMClient::UNKNOWN_ERROR\)\)\);'
    replace: "#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  auto* handler = ExtensionGCMAppHandler::GetFactoryInstance()->Get(browser_context());\n  auto* driver = handler ? handler->GetAndroidDriver() : nullptr;\n  if (!driver) {\n    return RespondNow(Error(kGCMDisabled));\n  }\n  driver->Unregister(\n      extension()->id(),\n      base::BindOnce(&GcmUnregisterFunction::CompleteFunctionWithResult, this));\n  return did_respond() ? AlreadyResponded() : RespondLater();\n#elif BUILDFLAG(IS_ANDROID)\n  return RespondNow(Error(GcmResultToError(gcm::GCMClient::UNKNOWN_ERROR)));"
- description: Format Android extension GCM integration
  regex:
    re_pattern: '\ \ \ \ \ \ api::gcm::Register::Params::Create\(args\(\)\);\

      \ \ EXTENSION_FUNCTION_VALIDATE\(params\);\

      \

      \#if\ BUILDFLAG\(IS_ANDROID\)\ \&\&\ BUILDFLAG\(ENABLE_DESKTOP_ANDROID_EXTENSIONS\)\

      \ \ auto\*\ handler\ =\ ExtensionGCMAppHandler::GetFactoryInstance\(\)\->Get\(browser_context\(\)\);\

      \ \ auto\*\ driver\ =\ handler\ \?\ handler\->GetAndroidDriver\(\)\ :\ nullptr;\

      \ \ if\ \(!driver\)\ \{\

      \ \ \ \ return\ RespondNow\(Error\(kGCMDisabled\)\);\

      \ \ \}\

      '
    replace: "      api::gcm::Register::Params::Create(args());\n  EXTENSION_FUNCTION_VALIDATE(params);\n\n#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  auto* handler =\n      ExtensionGCMAppHandler::GetFactoryInstance()->Get(browser_context());\n  auto* driver = handler ? handler->GetAndroidDriver() : nullptr;\n  if (!driver) {\n    return RespondNow(Error(kGCMDisabled));\n  }\n"
- description: Format Android extension GCM integration
  regex:
    re_pattern: 'GcmUnregisterFunction::\~GcmUnregisterFunction\(\)\ =\ default;\

      \

      ExtensionFunction::ResponseAction\ GcmUnregisterFunction::Run\(\)\ \{\

      \#if\ BUILDFLAG\(IS_ANDROID\)\ \&\&\ BUILDFLAG\(ENABLE_DESKTOP_ANDROID_EXTENSIONS\)\

      \ \ auto\*\ handler\ =\ ExtensionGCMAppHandler::GetFactoryInstance\(\)\->Get\(browser_context\(\)\);\

      \ \ auto\*\ driver\ =\ handler\ \?\ handler\->GetAndroidDriver\(\)\ :\ nullptr;\

      \ \ if\ \(!driver\)\ \{\

      \ \ \ \ return\ RespondNow\(Error\(kGCMDisabled\)\);\

      \ \ \}\

      '
    replace: "GcmUnregisterFunction::~GcmUnregisterFunction() = default;\n\nExtensionFunction::ResponseAction GcmUnregisterFunction::Run() {\n#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  auto* handler =\n      ExtensionGCMAppHandler::GetFactoryInstance()->Get(browser_context());\n  auto* driver = handler ? handler->GetAndroidDriver() : nullptr;\n  if (!driver) {\n    return RespondNow(Error(kGCMDisabled));\n  }\n"
- description: Android native GCM reserved key validation backstop
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ key\.compare\(0,\ std::size\(kCollapseKey\)\ \-\ 1,\ kCollapseKey\)\ !=\ 0\ \&\&\

      \ \ \ \ \ \ \ \ \ lower\.compare\(0,\ std::size\(kGoogleRestrictedPrefix\)\ \-\ 1,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ kGoogleRestrictedPrefix\)\ !=\ 0\ \&\&\

      \ \ \ \ \ \ \ \ \ lower\.compare\(0,\ std::size\(kGoogDotRestrictedPrefix\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ kGoogDotRestrictedPrefix\)\ !=\ 0;\

      \}\

      \

      \}\ \ //\ namespace\

      '
    replace: "         key.compare(0, std::size(kCollapseKey) - 1, kCollapseKey) != 0 &&\n         lower.compare(0, std::size(kGoogleRestrictedPrefix) - 1,\n                       kGoogleRestrictedPrefix) != 0 &&\n#if BUILDFLAG(IS_ANDROID)\n         lower.compare(0, std::size(kGoogDotRestrictedPrefix) - 1,\n                       kGoogDotRestrictedPrefix) != 0;\n#else\n         lower.compare(0, std::size(kGoogDotRestrictedPrefix),\n                       kGoogDotRestrictedPrefix) != 0;\n#endif\n}\n\n}  // namespace\n"
