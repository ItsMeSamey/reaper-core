# Finish unsupported Android GCM sends with the existing API error.
substitutions:
- description: Inspect the real Android driver completion
  regex:
    re_pattern: \#include\ "base/run_loop\.h"
    replace: '#include "base/run_loop.h"

      #include "base/test/test_future.h"'
- description: Regress Android callback completion and repeated message IDs
  regex:
    re_pattern: class\ GcmApiTest\ :\ public\ ExtensionApiTest\ \{
    replace: "#if BUILDFLAG(IS_ANDROID)\nusing GcmAndroidDriverTest = ExtensionApiTest;\n\nIN_PROC_BROWSER_TEST_F(GcmAndroidDriverTest, UnsupportedSendCompletesAndReleasesId) {\n  auto* driver = gcm::GCMProfileServiceFactory::GetForProfile(profile())->driver();\n  ASSERT_TRUE(driver);\n  gcm::OutgoingMessage message;\n  message.id = \"unsupported-android-send\";\n  message.data[\"payload\"] = \"test\";\n  // A second request with the same ID must receive the backend error again,\n  // rather than INVALID_PARAMETER from a leaked in-flight callback.\n  for (int attempt = 0; attempt < 2; ++attempt) {\n    base::test::TestFuture<std::string, gcm::GCMClient::Result> result;\n    driver->Send(\"test-extension\", \"destination-id\", message, result.GetCallback());\n    base::RunLoop().RunUntilIdle();\n    ASSERT_TRUE(result.IsReady());\n    EXPECT_EQ(message.id, result.Get<0>());\n    EXPECT_EQ(gcm::GCMClient::UNKNOWN_ERROR, result.Get<1>());\n  }\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\nclass GcmApiTest : public ExtensionApiTest {"
- description: Format the modified implementation with Chromium style
  regex:
    re_pattern: '\

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      using\ GcmAndroidDriverTest\ =\ ExtensionApiTest;\

      \

      IN_PROC_BROWSER_TEST_F\(GcmAndroidDriverTest,\ UnsupportedSendCompletesAndReleasesId\)\ \{\

      \ \ auto\*\ driver\ =\ gcm::GCMProfileServiceFactory::GetForProfile\(profile\(\)\)\->driver\(\);\

      \ \ ASSERT_TRUE\(driver\);\

      \ \ gcm::OutgoingMessage\ message;\

      \ \ message\.id\ =\ "unsupported\-android\-send";\

      \ \ message\.data\["payload"\]\ =\ "test";\

      \ \ //\ A\ second\ request\ with\ the\ same\ ID\ must\ receive\ the\ backend\ error\ again,\

      \ \ //\ rather\ than\ INVALID_PARAMETER\ from\ a\ leaked\ in\-flight\ callback\.\

      \ \ for\ \(int\ attempt\ =\ 0;\ attempt\ <\ 2;\ \+\+attempt\)\ \{\

      \ \ \ \ base::test::TestFuture<std::string,\ gcm::GCMClient::Result>\ result;\

      \ \ \ \ driver\->Send\("test\-extension",\ "destination\-id",\ message,\ result\.GetCallback\(\)\);\

      \ \ \ \ base::RunLoop\(\)\.RunUntilIdle\(\);\

      \ \ \ \ ASSERT_TRUE\(result\.IsReady\(\)\);\

      \ \ \ \ EXPECT_EQ\(message\.id,\ result\.Get<0>\(\)\);\

      \ \ \ \ EXPECT_EQ\(gcm::GCMClient::UNKNOWN_ERROR,\ result\.Get<1>\(\)\);\

      '
    replace: "\n#if BUILDFLAG(IS_ANDROID)\nusing GcmAndroidDriverTest = ExtensionApiTest;\n\nIN_PROC_BROWSER_TEST_F(GcmAndroidDriverTest,\n                       UnsupportedSendCompletesAndReleasesId) {\n  auto* driver =\n      gcm::GCMProfileServiceFactory::GetForProfile(profile())->driver();\n  ASSERT_TRUE(driver);\n  gcm::OutgoingMessage message;\n  message.id = \"unsupported-android-send\";\n  message.data[\"payload\"] = \"test\";\n  // A second request with the same ID must receive the backend error again,\n  // rather than INVALID_PARAMETER from a leaked in-flight callback.\n  for (int attempt = 0; attempt < 2; ++attempt) {\n    base::test::TestFuture<std::string, gcm::GCMClient::Result> result;\n    driver->Send(\"test-extension\", \"destination-id\", message,\n                 result.GetCallback());\n    base::RunLoop().RunUntilIdle();\n    ASSERT_TRUE(result.IsReady());\n    EXPECT_EQ(message.id, result.Get<0>());\n    EXPECT_EQ(gcm::GCMClient::UNKNOWN_ERROR, result.Get<1>());\n"
- description: Android native GCM reserved key validation backstop
  regex:
    re_pattern: '\#include\ "content/public/test/browser_test_utils\.h"\

      \#include\ "extensions/buildflags/buildflags\.h"\

      \#include\ "extensions/test/result_catcher\.h"\

      \

      static_assert\(BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\);\

      \

      '
    replace: '#include "content/public/test/browser_test_utils.h"

      #include "extensions/buildflags/buildflags.h"

      #include "extensions/test/result_catcher.h"


      #if BUILDFLAG(IS_ANDROID) && defined(NDEBUG)

      #include <utility>


      #include "base/memory/scoped_refptr.h"

      #include "extensions/browser/extension_function_dispatcher.h"

      #include "extensions/common/extension_builder.h"

      #include "extensions/common/mojom/extra_response_data.mojom.h"

      #endif


      static_assert(BUILDFLAG(ENABLE_EXTENSIONS_CORE));


      '
- description: Android native GCM reserved key validation backstop
  regex:
    re_pattern: '\ \ \}\

      \ \ return\ extension;\

      \}\

      \

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      //\ Register\ and\ unregister\ are\ deprecated\ on\ the\ server\.\ Don''t\ test\ them\.\

      '
    replace: "  }\n  return extension;\n}\n\n#if BUILDFLAG(IS_ANDROID) && defined(NDEBUG)\n// The JS binding already rejects these names. Exercise the browser's native\n// request boundary directly, because a JS-only test would pass before the fix.\n// Malformed native requests CHECK in debug builds instead of replying.\nIN_PROC_BROWSER_TEST_F(GcmApiTest, NativeSendReservedPrefixBackstop) {\n  StartCollecting();\n  auto extension = ExtensionBuilder(\"Native GCM prefix validation\")\n                       .SetManifestVersion(3)\n                       .AddAPIPermission(\"gcm\")\n                       .Build();\n  auto dispatcher = std::make_unique<ExtensionFunctionDispatcher>(profile());\n  constexpr struct {\n    const char* key;\n    bool bad_message;\n  } kCases[] = {\n      {\"goog.\", true},\n      {\"goog.foo\", true},\n      {\"GoOg.Foo\", true},\n      {\"goog\", false},\n      {\"googx.foo\", false},\n      {\"xgoog.foo\", false},\n      {\"google\", true},\n      {\"GoOgLeFoo\", true},\n      {\"xgoogle\", false},\n      {\"collapse_key\", true},\n      {\"collapse_key_tail\", true},\n      {\"Collapse_key\", false},\n      {\"normal\", false},\n  };\n  for (const auto& test_case : kCases) {\n    SCOPED_TRACE(test_case.key);\n    const auto previous_data = service()->last_sent_message().data;\n    base::DictValue data;\n    data.Set(test_case.key, \"payload\");\n    base::DictValue message;\n    message.Set(\"destinationId\", \"destination\");\n    message.Set(\"messageId\", \"native-prefix-boundary\");\n    message.Set(\"data\", std::move(data));\n    base::ListValue args;\n    args.Append(std::move(message));\n\n    auto function = base::MakeRefCounted<GcmSendFunction>();\n    function->SetName(\"gcm.send\");\n    function->set_extension(extension);\n    function->SetDispatcher(dispatcher->AsWeakPtr());\n    function->SetArgs(std::move(args));\n    function->set_has_callback(true);\n    function->preserve_results_for_testing();\n    base::test::TestFuture<ExtensionFunction::ResponseType> response;\n    function->set_response_callback(base::BindOnce(\n        [](base::test::TestFuture<ExtensionFunction::ResponseType>* future,\n           ExtensionFunction::ResponseType type, base::ListValue,\n           const std::string&, mojom::ExtraResponseDataPtr) {\n          future->SetValue(type);\n        },\n        &response));\n    function->RunWithValidation().Execute();\n    ASSERT_TRUE(response.Wait());\n    if (test_case.bad_message) {\n      EXPECT_EQ(ExtensionFunction::ResponseType::kBadMessage, response.Get());\n      // No malformed native payload may reach even the existing fake backend.\n      EXPECT_EQ(previous_data, service()->last_sent_message().data);\n    } else {\n      EXPECT_EQ(ExtensionFunction::ResponseType::kSucceeded, response.Get());\n      const auto& sent = service()->last_sent_message();\n      ASSERT_EQ(1u, sent.data.size());\n      EXPECT_EQ(\"payload\", sent.data.at(test_case.key));\n      EXPECT_EQ(\"destination\", service()->last_receiver_id());\n      const auto* result = function->GetResultListForTest();\n      ASSERT_TRUE(result);\n      ASSERT_EQ(1u, result->size());\n      EXPECT_EQ(\"native-prefix-boundary\", (*result)[0].GetString());\n    }\n  }\n}\n#endif  // BUILDFLAG(IS_ANDROID) && defined(NDEBUG)\n\n#if !BUILDFLAG(IS_ANDROID)\n// Register and unregister are deprecated on the server. Don't test them.\n"
- description: Include GCMDriver for Android debug/release compiler owners; preserve non-Android and release-only blocks
  regex:
    re_pattern: '\#include\ "extensions/buildflags/buildflags\.h"\

      \#include\ "extensions/test/result_catcher\.h"\

      \

      \#if\ BUILDFLAG\(IS_ANDROID\)\ \&\&\ defined\(NDEBUG\)\

      \#include\ <utility>\

      \

      \#include\ "base/memory/scoped_refptr\.h"\

      \#include\ "extensions/browser/extension_function_dispatcher\.h"\

      \#include\ "extensions/common/extension_builder\.h"\

      \#include\ "extensions/common/mojom/extra_response_data\.mojom\.h"\

      \#endif\

      \

      static_assert\(BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\);\

      \

      '
    replace: '#include "extensions/buildflags/buildflags.h"

      #include "extensions/test/result_catcher.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "components/gcm_driver/gcm_driver.h"


