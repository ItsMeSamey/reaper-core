      #include "extensions/common/mojom/extra_response_data.mojom.h"

      #endif  // defined(NDEBUG)

      #endif  // BUILDFLAG(IS_ANDROID)


      static_assert(BUILDFLAG(ENABLE_EXTENSIONS_CORE));


      '
- description: Match Android GCMDriver Send callback const-reference API while retaining owning TestFuture result storage
  regex:
    re_pattern: '\ \ //\ rather\ than\ INVALID_PARAMETER\ from\ a\ leaked\ in\-flight\ callback\.\

      \ \ for\ \(int\ attempt\ =\ 0;\ attempt\ <\ 2;\ \+\+attempt\)\ \{\

      \ \ \ \ base::test::TestFuture<std::string,\ gcm::GCMClient::Result>\ result;\

      \ \ \ \ driver\->Send\("test\-extension",\ "destination\-id",\ message,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ result\.GetCallback\(\)\);\

      \ \ \ \ base::RunLoop\(\)\.RunUntilIdle\(\);\

      \ \ \ \ ASSERT_TRUE\(result\.IsReady\(\)\);\

      \ \ \ \ EXPECT_EQ\(message\.id,\ result\.Get<0>\(\)\);\

      '
    replace: "  // rather than INVALID_PARAMETER from a leaked in-flight callback.\n  for (int attempt = 0; attempt < 2; ++attempt) {\n    base::test::TestFuture<std::string, gcm::GCMClient::Result> result;\n    driver->Send(\n        \"test-extension\", \"destination-id\", message,\n        result.GetCallback<const std::string&, gcm::GCMClient::Result>());\n    base::RunLoop().RunUntilIdle();\n    ASSERT_TRUE(result.IsReady());\n    EXPECT_EQ(message.id, result.Get<0>());\n"
