# Android extension-only native GCM integration.
substitutions:
- description: Guard Android-only helper ownership
  regex:
    re_pattern: \#include\ "base/scoped_observation\.h"
    replace: '#include "base/scoped_observation.h"

      #include "build/build_config.h"'
- description: Forward declare the separate native extension channel
  regex:
    re_pattern: class\ GcmJsEventRouter;
    replace: 'class GcmJsEventRouter;

      #if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)

      class AndroidExtensionGCMDriver;

      #endif'
- description: Expose the scoped Android registration owner to its API
  regex:
    re_pattern: \ \ void\ Shutdown\(\)\ override;
    replace: "  void Shutdown() override;\n#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  AndroidExtensionGCMDriver* GetAndroidDriver() const {\n    return android_driver_.get();\n  }\n#endif"
- description: Keep native GCM helper lifetime inside the existing profile service
  regex:
    re_pattern: \ \ base::WeakPtrFactory<ExtensionGCMAppHandler>\ weak_factory_\{this\};
    replace: "#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  std::unique_ptr<AndroidExtensionGCMDriver> android_driver_;\n#endif\n  base::WeakPtrFactory<ExtensionGCMAppHandler> weak_factory_{this};"
