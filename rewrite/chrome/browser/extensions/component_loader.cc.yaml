# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_loader.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/extensions/component_loader\.h"\

      \

      \#include\ <optional>\

      \#include\ <string>\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/extensions/component_loader.h"

      #include "build/build_config.h"


      #include <optional>

      #include <string>

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_loader.cc'
  regex:
    re_pattern: '\#include\ "base/values\.h"\

      \#include\ "base/version\.h"\

      \#include\ "build/branding_buildflags\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "build/chromeos_buildflags\.h"\

      \#include\ "chrome/browser/browser_process\.h"\

      \#include\ "chrome/browser/extensions/component_extensions_allowlist/allowlist\.h"\

      \#include\ "chrome/browser/extensions/component_loader_factory\.h"\

      \#include\ "chrome/browser/extensions/component_loader_prefs\.h"\

      \#include\ "chrome/browser/extensions/data_deleter\.h"\

      \#include\ "chrome/browser/extensions/glic_util\.h"\

      \#include\ "chrome/browser/extensions/profile_util\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      \#include\ "chrome/common/channel_info\.h"\

      '
    replace: '#include "base/values.h"

      #include "base/version.h"

      #include "build/branding_buildflags.h"

      #include "build/chromeos_buildflags.h"

      #include "chrome/browser/browser_process.h"

      #include "chrome/browser/extensions/component_extensions_allowlist/allowlist.h"

      #include "chrome/browser/extensions/component_loader_factory.h"

      #include "chrome/browser/extensions/component_loader_prefs.h"

      #include "chrome/browser/extensions/data_deleter.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/extensions/glic_util.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/extensions/profile_util.h"

      #include "chrome/browser/profiles/profile.h"

      #include "chrome/common/channel_info.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_loader.cc'
  regex:
    re_pattern: '\#include\ "chrome/common/chrome_paths\.h"\

      \#include\ "chrome/common/chrome_switches\.h"\

      \#include\ "chrome/common/extensions/extension_constants\.h"\

      \#include\ "chrome/grit/aim_eligibility_extension_resources\.h"\

      \#include\ "chrome/grit/branded_strings\.h"\

      \#include\ "chrome/grit/browser_resources\.h"\

      \#include\ "chrome/grit/component_extension_resources\.h"\

      \#include\ "chrome/grit/contextual_tasks_extension_resources\.h"\

      \#include\ "chrome/grit/generated_resources\.h"\

      \#include\ "components/component_updater/component_updater_paths\.h"\

      \#include\ "components/crx_file/id_util\.h"\

      '
    replace: '#include "chrome/common/chrome_paths.h"

      #include "chrome/common/chrome_switches.h"

      #include "chrome/common/extensions/extension_constants.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/grit/aim_eligibility_extension_resources.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/grit/branded_strings.h"

      #include "chrome/grit/browser_resources.h"

      #include "chrome/grit/component_extension_resources.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/grit/contextual_tasks_extension_resources.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/grit/generated_resources.h"

      #include "components/component_updater/component_updater_paths.h"

      #include "components/crx_file/id_util.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_loader.cc'
  regex:
    re_pattern: '\ \ \}\

      \}\

      \

      void\ ComponentLoader::AddAimEligibilityExtension\(\)\ \{\

      \ \ if\ \(!base::FeatureList::IsEnabled\(\

      \ \ \ \ \ \ \ \ \ \ omnibox::kAimEligibilityComponentExtension\)\)\ \{\

      '
    replace: "  }\n}\n\n#if !BUILDFLAG(IS_ANDROID)\nvoid ComponentLoader::AddAimEligibilityExtension() {\n  if (!base::FeatureList::IsEnabled(\n          omnibox::kAimEligibilityComponentExtension)) {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_loader.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ base::FilePath\(FILE_PATH_LITERAL\("contextual_tasks_extension"\)\)\);\

      \ \ \}\

      \}\

      \

      void\ ComponentLoader::AddWithNameAndDescription\(\

      \ \ \ \ int\ manifest_resource_id,\

      '
    replace: "        base::FilePath(FILE_PATH_LITERAL(\"contextual_tasks_extension\")));\n  }\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\nvoid ComponentLoader::AddWithNameAndDescription(\n    int manifest_resource_id,\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/extensions/component_loader.cc'
  regex:
    re_pattern: '\#endif\ \ //\ BUILDFLAG\(IS_CHROMEOS\)\

      \ \ \}\

      \

      \ \ AddAimEligibilityExtension\(\);\

      \ \ AddGlicExtension\(\);\

      \ \ AddContextualTasksExtension\(\);\

      \

      //\ http://crbug\.com/41070702\

      \#if\ BUILDFLAG\(GOOGLE_CHROME_BRANDING\)\ \&\&\ !BUILDFLAG\(IS_CHROMEOS\)\

      '
    replace: "#endif  // BUILDFLAG(IS_CHROMEOS)\n  }\n\n#if !BUILDFLAG(IS_ANDROID)\n  AddAimEligibilityExtension();\n  AddGlicExtension();\n  AddContextualTasksExtension();\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n// http://crbug.com/41070702\n#if BUILDFLAG(GOOGLE_CHROME_BRANDING) && !BUILDFLAG(IS_CHROMEOS)\n"
