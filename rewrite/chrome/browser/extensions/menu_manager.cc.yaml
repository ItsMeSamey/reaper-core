    replace: "\n  // Schedule a task to write to storage since there could be many calls in a\n  // short span of time. See crbug.com/40928526.\n#if BUILDFLAG(IS_ANDROID)\n  if (shutting_down_) {\n    return;\n  }\n  const uint64_t write_id = ++next_pending_write_id_;\n  CHECK_NE(write_id, 0u);\n  pending_write_ids_[extension_key] = write_id;\n  write_tasks_[extension_key].Start(\n      FROM_HERE, base::Seconds(kWriteDelayInSeconds),\n      base::BindOnce(&MenuManager::WriteToStorageInternal,\n                     weak_ptr_factory_.GetWeakPtr(), extension_key, write_id));\n#else\n  write_tasks_[extension_key].Start(\n      FROM_HERE, base::Seconds(kWriteDelayInSeconds),\n      base::BindOnce(&MenuManager::WriteToStorageInternal,\n                     weak_ptr_factory_.GetWeakPtr(), extension_key));\n#endif\n}\n\n#if BUILDFLAG(IS_ANDROID)\nbase::Value MenuManager::SerializeMenuItems(\n    const MenuItem::ExtensionKey& extension_key) const {\n  const MenuItem::OwnedList* top_items = MenuItems(extension_key);\n  MenuItem::List all_items;\n  if (top_items) {\n    for (const auto& item : *top_items) {\n      DCHECK(!item->id().extension_key.webview_instance_id);\n      item->GetFlattenedSubtree(&all_items);\n    }\n  }\n  return base::Value(base::ToValueList(all_items, &MenuItem::ToValue));\n}\n\nbool MenuManager::IsCurrentPendingWrite(\n    const MenuItem::ExtensionKey& extension_key,\n    uint64_t write_id) const {\n  const auto pending = pending_write_ids_.find(extension_key);\n  return !shutting_down_ && pending != pending_write_ids_.end() &&\n         pending->second == write_id;\n}\n\nvoid MenuManager::SubmitPendingWrite(\n    const MenuItem::ExtensionKey& extension_key,\n    uint64_t write_id,\n    base::Value value) {\n  if (!IsCurrentPendingWrite(extension_key, write_id)) {\n    return;\n  }\n  auto weak_this = weak_ptr_factory_.GetWeakPtr();\n  // A disable/termination flush can reenter an in-flight notification. Commit\n  // that owned snapshot without recursively notifying the same ObserverList.\n  if (!notifying_write_observers_) {\n    notifying_write_observers_ = true;\n    for (TestObserver& observer : observers_) {\n      observer.WillWriteToStorage(extension_key.extension_id);\n      if (!weak_this) {\n        return;\n      }\n      if (!IsCurrentPendingWrite(extension_key, write_id)) {\n        notifying_write_observers_ = false;\n        return;\n      }\n    }\n    notifying_write_observers_ = false;\n  }\n  // The value owns all item data: an observer may have removed the live tree.\n  // Retire this write before submission; do not access members after Set.\n  pending_write_ids_.erase(extension_key);\n  if (store_) {\n    store_->SetExtensionValue(extension_key.extension_id, kContextMenusKey,\n                              std::move(value));\n  }\n}\n\nvoid MenuManager::WriteToStorageInternal(\n    const MenuItem::ExtensionKey& extension_key,\n    uint64_t write_id) {\n  if (!IsCurrentPendingWrite(extension_key, write_id)) {\n    return;\n  }\n  write_tasks_.erase(extension_key);\n  SubmitPendingWrite(extension_key, write_id,\n                     SerializeMenuItems(extension_key));\n}\n#else\nvoid MenuManager::WriteToStorageInternal(\n    const MenuItem::ExtensionKey& extension_key) {\n  write_tasks_.erase(extension_key);\n"
