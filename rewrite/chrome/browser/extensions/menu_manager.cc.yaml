    replace: "  extension_menu_icon_loader_ = std::make_unique<ExtensionMenuIconLoader>();\n}\n\nMenuManager::~MenuManager() {\n#if BUILDFLAG(IS_ANDROID)\n  Shutdown();\n#endif\n}\n\n#if BUILDFLAG(IS_ANDROID)\nvoid MenuManager::Shutdown() {\n  if (shutting_down_) {\n    return;\n  }\n  shutting_down_ = true;\n  weak_ptr_factory_.InvalidateWeakPtrs();\n  extension_registry_observation_.Reset();\n  observed_profiles_.RemoveAllObservations();\n  auto pending = std::move(initial_restores_);\n  // No access to this after invoking a request: its response can destroy us.\n  for (auto& [id, restore] : pending) {\n    FailRestoreRequests(std::move(restore.requests));\n  }\n}\n\nbase::ScopedClosureRunner MenuManager::RunAfterInitialRestore(\n    const Extension& extension,\n    base::OnceCallback<void(bool)> callback) {\n  if (shutting_down_ || ExtensionRegistry::Get(browser_context_)\n                                ->enabled_extensions()\n                                .GetByID(extension.id()) != &extension) {\n    std::move(callback).Run(false);\n    return {};\n  }\n  auto it = initial_restores_.find(extension.id());\n  if (it == initial_restores_.end()) {\n    std::move(callback).Run(true);\n    return {};\n  }\n  const uint64_t request_id = ++next_restore_request_id_;\n  CHECK_NE(request_id, 0u);\n  auto cancellation = base::ScopedClosureRunner(base::BindOnce(\n      &MenuManager::CancelRestoreRequest, weak_ptr_factory_.GetWeakPtr(),\n      extension.id(), it->second.generation, request_id));\n  it->second.requests.push_back({request_id, std::move(callback)});\n  return cancellation;\n}\n\nvoid MenuManager::CancelRestoreRequest(const std::string& extension_id,\n                                       uint64_t generation,\n                                       uint64_t request_id) {\n  auto it = initial_restores_.find(extension_id);\n  if (it == initial_restores_.end() || it->second.generation != generation) {\n    return;\n  }\n  auto& requests = it->second.requests;\n  auto request =\n      std::ranges::find(requests, request_id, &PendingRestoreRequest::id);\n  if (request == requests.end()) {\n    return;\n  }\n  // Detach before releasing the retained ExtensionFunction. Its destruction\n  // must not observe an entry which is still being erased.\n  auto callback = std::move(request->callback);\n  requests.erase(request);\n}\n\nvoid MenuManager::FailRestoreRequests(\n    std::deque<PendingRestoreRequest> requests) {\n  for (auto& request : requests) {\n    std::move(request.callback).Run(false);\n  }\n}\n\nvoid MenuManager::OnInitialRestoreRead(const std::string& extension_id,\n                                       uint64_t generation,\n                                       std::optional<base::Value> value) {\n  auto it = initial_restores_.find(extension_id);\n  if (it == initial_restores_.end() || it->second.generation != generation) {\n    return;\n  }\n  if (ExtensionRegistry::Get(browser_context_)\n          ->enabled_extensions()\n          .GetByID(extension_id) != it->second.extension.get()) {\n    auto requests = std::move(it->second.requests);\n    initial_restores_.erase(it);\n    FailRestoreRequests(std::move(requests));\n    return;\n  }\n  auto weak_this = weak_ptr_factory_.GetWeakPtr();\n  ReadFromStorage(extension_id, std::move(value));\n  // Keep the record until all earlier requests finish, including requests\n  // appended by a reentrant API response or read-complete observer.\n  while (weak_this) {\n    auto current = weak_this->initial_restores_.find(extension_id);\n    if (current == weak_this->initial_restores_.end() ||\n        current->second.generation != generation) {\n      return;\n    }\n    if (current->second.requests.empty()) {\n      weak_this->initial_restores_.erase(current);\n      return;\n    }\n    auto callback = std::move(current->second.requests.front().callback);\n    current->second.requests.pop_front();\n    std::move(callback).Run(true);\n  }\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n