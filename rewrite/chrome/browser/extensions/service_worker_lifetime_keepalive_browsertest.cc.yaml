- description: Keep interactive Android OAuth worker requests alive through consent (4).
  regex:
    re_pattern: 'constexpr\ char\ kPersistentPortConnectedMessage\[\]\ =\ "Persistent\ port\ connected";\

      constexpr\ char\ kPersistentPortDisconnectedMessage\[\]\ =\

      \ \ \ \ "Persistent\ port\ disconnected";\

      \

      //\ Gets\ a\ keepalive\ matcher\ that\ enforces\ the\ extra\ data\ field\.\

      testing::Matcher<ProcessManager::ServiceWorkerKeepaliveData>\

      '
    replace: "constexpr char kPersistentPortConnectedMessage[] = \"Persistent port connected\";\nconstexpr char kPersistentPortDisconnectedMessage[] =\n    \"Persistent port disconnected\";\n\n#if BUILDFLAG(IS_ANDROID)\nclass PendingGetAuthTokenFunction;\nusing PendingOAuthCallback =\n    base::OnceCallback<void(scoped_refptr<PendingGetAuthTokenFunction>)>;\nPendingOAuthCallback* g_pending_oauth_callback = nullptr;\n\n// Substitutes a pending API body without contacting an OAuth provider.\n// Dispatch, API arguments, worker identity and the inherited production\n// keepalive policy remain real.\nclass PendingGetAuthTokenFunction : public IdentityGetAuthTokenFunction {\n public:\n  void CompleteForTest() { Respond(Error(\"Test consent completed\")); }\n\n private:\n  ~PendingGetAuthTokenFunction() override = default;\n\n  ResponseAction Run() override {\n    CHECK(is_from_service_worker());\n    CHECK(g_pending_oauth_callback);\n    CHECK(*g_pending_oauth_callback);\n    std::move(*g_pending_oauth_callback).Run(base::WrapRefCounted(this));\n    return RespondLater();\n  }\n};\n#endif\n\n// Gets a keepalive matcher that enforces the extra data field.\ntesting::Matcher<ProcessManager::ServiceWorkerKeepaliveData>\n"
- description: Keep interactive Android OAuth worker requests alive through consent (5).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ content::TriggerTimeoutAndCheckRunningState\(context,\ version_id\)\);\

      \ \ \}\

      \

      \ \ base::SimpleTestTickClock\ tick_clock_opener_;\

      \ \ base::SimpleTestTickClock\ tick_clock_receiver_;\

      \

      \ private:\

      \ \ base::test::ScopedFeatureList\ feature_list_;\

      \};\

      \

      //\ Loads\ two\ extensions\ that\ open\ a\ persistent\ port\ connection\ between\ each\

      //\ other\ and\ tests\ that\ their\ service\ worker\ will\ stop\ after\ kRequestTimeout\ \(5\

      '
    replace: "        content::TriggerTimeoutAndCheckRunningState(context, version_id));\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  void CheckOAuthRequestKeepalive(bool interactive) {\n    TestExtensionDir test_dir;\n    test_dir.WriteManifest(R\"({\n      \"name\": \"Pending OAuth worker request\",\n      \"manifest_version\": 3,\n      \"version\": \"1.0\",\n      \"permissions\": [\"identity\"],\n      \"oauth2\": {\"client_id\": \"test.apps.googleusercontent.com\",\n                 \"scopes\": [\"email\"]},\n      \"background\": {\"service_worker\": \"background.js\"}\n    })\");\n    test_dir.WriteFile(FILE_PATH_LITERAL(\"background.js\"), \"// blank\");\n    TestServiceWorkerContextObserver registration_observer(profile());\n    const Extension* extension = LoadExtension(test_dir.UnpackedPath());\n    ASSERT_TRUE(extension);\n    const int64_t version_id = registration_observer.WaitForWorkerActivated();\n\n    auto& registry = ExtensionFunctionRegistry::GetInstance();\n    const auto original =\n        registry.GetFactoriesForTesting().at(\"identity.getAuthToken\");\n    ASSERT_TRUE(registry.OverrideFunctionForTesting(\n        \"identity.getAuthToken\",\n        &NewExtensionFunction<PendingGetAuthTokenFunction>));\n    base::ScopedClosureRunner restore_factory(base::BindOnce(\n        [](ExtensionFunctionRegistry::FactoryEntry entry) {\n          ExtensionFunctionRegistry::GetInstance().Register(entry);\n        },\n        original));\n    base::test::TestFuture<scoped_refptr<PendingGetAuthTokenFunction>> pending;\n    auto callback = pending.GetCallback();\n    base::AutoReset<PendingOAuthCallback*> reset_callback(\n        &g_pending_oauth_callback, &callback);\n    const std::string script =\n        base::StringPrintf(R\"(\n      chrome.test.runWithUserGesture(() => {\n        chrome.identity.getAuthToken({interactive: %s}).then(\n          () => chrome.test.sendMessage('unexpected success'),\n          error => {\n            chrome.test.assertEq('Test consent completed', error.message);\n            chrome.test.sendMessage('consent completed');\n          });\n        chrome.test.sendScriptResult('started');\n      });)\",\n                           interactive ? \"true\" : \"false\");\n    EXPECT_EQ(\"started\",\n              BackgroundScriptExecutor::ExecuteScript(\n                  profile(), extension->id(), script,\n                  BackgroundScriptExecutor::ResultCapture::kSendScriptResult));\n    ASSERT_TRUE(pending.Wait());\n    auto function = pending.Take();\n    base::ScopedClosureRunner resolve_on_failure(base::BindOnce(\n        [](scoped_refptr<PendingGetAuthTokenFunction> request) {\n          if (!request->did_respond()) {\n            request->CompleteForTest();\n          }\n        },\n        function));\n    base::RunLoop().RunUntilIdle();\n    content::ServiceWorkerContext* context = GetServiceWorkerContext();\n    TestServiceWorkerContextObserver stopped(context, extension->id());\n    stopped.SetRunningId(version_id);\n    content::AdvanceClockAfterRequestTimeout(context, version_id,\n                                             &tick_clock_opener_);\n    if (interactive) {\n      ASSERT_TRUE(\n          content::TriggerTimeoutAndCheckRunningState(context, version_id));\n      ExtensionTestMessageListener completed(\"consent completed\");\n      function->CompleteForTest();\n      ASSERT_TRUE(completed.WaitUntilSatisfied());\n      resolve_on_failure.RunAndReset();\n      function.reset();\n      base::RunLoop().RunUntilIdle();\n      // Finishing the actual API response releases the request keepalive.\n      content::AdvanceClockAfterRequestTimeout(context, version_id,\n                                               &tick_clock_opener_);\n      ASSERT_FALSE(\n          content::TriggerTimeoutAndCheckRunningState(context, version_id));\n      stopped.WaitForWorkerStopped();\n    } else {\n      ASSERT_FALSE(\n          content::TriggerTimeoutAndCheckRunningState(context, version_id));\n      stopped.WaitForWorkerStopped();\n      // An ordinary timed-out request must still tolerate its late response.\n      function->CompleteForTest();\n      resolve_on_failure.RunAndReset();\n      function.reset();\n      base::RunLoop().RunUntilIdle();\n    }\n  }\n#endif\n\n  base::SimpleTestTickClock tick_clock_opener_;\n  base::SimpleTestTickClock tick_clock_receiver_;\n\n private:\n  base::test::ScopedFeatureList feature_list_;\n};\n\n#if BUILDFLAG(IS_ANDROID)\nIN_PROC_BROWSER_TEST_F(ServiceWorkerLifetimeKeepaliveBrowsertest,\n                       InteractiveGetAuthTokenKeepsWorkerAliveUntilResponse) {\n  CheckOAuthRequestKeepalive(true);\n}\n\nIN_PROC_BROWSER_TEST_F(ServiceWorkerLifetimeKeepaliveBrowsertest,\n                       SilentGetAuthTokenRetainsWorkerTimeout) {\n  CheckOAuthRequestKeepalive(false);\n}\n#endif\n\n// Loads two extensions that open a persistent port connection between each\n// other and tests that their service worker will stop after kRequestTimeout (5\n"
