- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.size\(\)\);\

      \}\

      \

      //\ Tests\ that\ the\ browser\ ignores\ stale\ idle\ termination\ requests\ from\ the\

      //\ renderer\ that\ were\ sent\ before\ the\ browser\ started\ an\ external\ request\.\ See\

      //\ https://crbug\.com/487746357\.\

      '
    replace: "                    .size());\n}\n\n#if BUILDFLAG(IS_ANDROID)\nIN_PROC_BROWSER_TEST_F(ServiceWorkerLifetimeKeepaliveBrowsertest,\n                       KeepaliveMetadataRetiresOnStopAndPreservesRestart) {\n  TestExtensionDir test_dir;\n  test_dir.WriteManifest(R\"({\n    \"name\": \"Worker accounting\",\n    \"manifest_version\": 3,\n    \"version\": \"1.0\",\n    \"background\": {\"service_worker\": \"background.js\"}\n  })\");\n  test_dir.WriteFile(FILE_PATH_LITERAL(\"background.js\"), \"// blank\");\n  const Extension* extension = LoadExtension(test_dir.UnpackedPath());\n  ASSERT_TRUE(extension);\n  EXPECT_EQ(\"running\", BackgroundScriptExecutor::ExecuteScript(\n                           profile(), extension->id(),\n                           \"chrome.test.sendScriptResult('running');\",\n                           BackgroundScriptExecutor::ResultCapture::\n                               kSendScriptResult));\n  base::RunLoop().RunUntilIdle();\n  ProcessManager* pm = ProcessManager::Get(profile());\n  auto workers = pm->GetServiceWorkersForExtension(extension->id());\n  ASSERT_EQ(1u, workers.size());\n  const WorkerId original_worker = workers[0];\n  ASSERT_TRUE(original_worker.start_token);\n  WorkerId tokenless_worker = original_worker;\n  tokenless_worker.start_token.reset();\n  std::optional<ServiceWorkerKeepalive> old_owner;\n  {\n    ServiceWorkerKeepalive original(\n        profile(), tokenless_worker,\n        content::ServiceWorkerExternalRequestTimeoutType::kDefault,\n        Activity::API_FUNCTION, \"ordinary accounting\");\n    EXPECT_TRUE(original.worker_id().start_token ==\n                original_worker.start_token);\n    old_owner.emplace(std::move(original));\n  }\n  EXPECT_EQ(1u, pm->GetServiceWorkerKeepaliveDataForRecords(extension->id())\n                    .size());\n\n  TestExtensionDir other_dir;\n  other_dir.WriteManifest(R\"({\n    \"name\": \"Unrelated worker accounting\",\n    \"manifest_version\": 3,\n    \"version\": \"1.0\",\n    \"background\": {\"service_worker\": \"background.js\"}\n  })\");\n  other_dir.WriteFile(FILE_PATH_LITERAL(\"background.js\"), \"// blank\");\n  const Extension* other = LoadExtension(other_dir.UnpackedPath());\n  ASSERT_TRUE(other);\n  EXPECT_EQ(\"running\", BackgroundScriptExecutor::ExecuteScript(\n                           profile(), other->id(),\n                           \"chrome.test.sendScriptResult('running');\",\n                           BackgroundScriptExecutor::ResultCapture::\n                               kSendScriptResult));\n  base::RunLoop().RunUntilIdle();\n  auto other_workers = pm->GetServiceWorkersForExtension(other->id());\n  ASSERT_EQ(1u, other_workers.size());\n  ServiceWorkerKeepalive other_owner(\n      profile(), other_workers[0],\n      content::ServiceWorkerExternalRequestTimeoutType::kDefault,\n      Activity::EVENT, \"other extension\");\n\n  browsertest_util::StopServiceWorkerForExtensionGlobalScope(profile(),\n                                                            extension->id());\n  EXPECT_TRUE(\n      pm->GetServiceWorkerKeepaliveDataForRecords(extension->id()).empty());\n  EXPECT_EQ(1u,\n            pm->GetServiceWorkerKeepaliveDataForRecords(other->id()).size());\n  EXPECT_FALSE(pm->GetServiceWorkerRunningInstance(original_worker));\n\n  EXPECT_EQ(\"restarted\", BackgroundScriptExecutor::ExecuteScript(\n                             profile(), extension->id(),\n                             \"chrome.test.sendScriptResult('restarted');\",\n                             BackgroundScriptExecutor::ResultCapture::\n                                 kSendScriptResult));\n  base::RunLoop().RunUntilIdle();\n  workers = pm->GetServiceWorkersForExtension(extension->id());\n  ASSERT_EQ(1u, workers.size());\n  ASSERT_TRUE(workers[0].start_token);\n  EXPECT_TRUE(workers[0].start_token != original_worker.start_token);\n  ServiceWorkerKeepalive new_owner(\n      profile(), workers[0],\n      content::ServiceWorkerExternalRequestTimeoutType::kDefault,\n      Activity::EVENT, \"new incarnation\");\n  old_owner.reset();\n  const auto records =\n      pm->GetServiceWorkerKeepaliveDataForRecords(extension->id());\n  ASSERT_EQ(1u, records.size());\n  EXPECT_EQ(\"new incarnation\", records[0].extra_data);\n  EXPECT_TRUE(records[0].worker_id.start_token == workers[0].start_token);\n  EXPECT_EQ(1u,\n            pm->GetServiceWorkerKeepaliveDataForRecords(other->id()).size());\n}\n\nIN_PROC_BROWSER_TEST_F(ServiceWorkerLifetimeKeepaliveBrowsertest,\n                       MovedKeepaliveUsesOwningProfileShutdown) {\n  TestExtensionDir test_dir;\n  test_dir.WriteManifest(R\"({\n    \"name\": \"Moved profile accounting\",\n    \"manifest_version\": 3,\n    \"version\": \"1.0\",\n    \"incognito\": \"split\",\n    \"background\": {\"service_worker\": \"background.js\"}\n  })\");\n  test_dir.WriteFile(FILE_PATH_LITERAL(\"background.js\"), \"// blank\");\n  const Extension* extension =\n      LoadExtension(test_dir.UnpackedPath(), {.allow_in_incognito = true});\n  ASSERT_TRUE(extension);\n  Profile* otr = profile()->GetPrimaryOTRProfile(/*create_if_needed=*/true);\n  content::WebContents* otr_contents =\n      PlatformOpenURLOffTheRecord(profile(), GURL(\"about:blank\"));\n  ASSERT_TRUE(otr_contents);\n  EXPECT_EQ(\"regular\", BackgroundScriptExecutor::ExecuteScript(\n                           profile(), extension->id(),\n                           \"chrome.test.sendScriptResult('regular');\",\n                           BackgroundScriptExecutor::ResultCapture::\n                               kSendScriptResult));\n  EXPECT_EQ(\"otr\", BackgroundScriptExecutor::ExecuteScript(\n                       otr, extension->id(),\n                       \"chrome.test.sendScriptResult('otr');\",\n                       BackgroundScriptExecutor::ResultCapture::\n                           kSendScriptResult));\n  base::RunLoop().RunUntilIdle();\n  ProcessManager* regular_pm = ProcessManager::Get(profile());\n  const auto regular_workers =\n      regular_pm->GetServiceWorkersForExtension(extension->id());\n  const auto otr_workers =\n      ProcessManager::Get(otr)->GetServiceWorkersForExtension(extension->id());\n  ASSERT_EQ(1u, regular_workers.size());\n  ASSERT_EQ(1u, otr_workers.size());\n  ServiceWorkerKeepalive regular_owner(\n      profile(), regular_workers[0],\n      content::ServiceWorkerExternalRequestTimeoutType::kDefault,\n      Activity::EVENT, \"regular profile\");\n  std::optional<ServiceWorkerKeepalive> moved_owner;\n  {\n    ServiceWorkerKeepalive original(\n        otr, otr_workers[0],\n        content::ServiceWorkerExternalRequestTimeoutType::kDefault,\n        Activity::EVENT, \"off the record profile\");\n    moved_owner.emplace(std::move(original));\n  }\n  EXPECT_EQ(1u, ProcessManager::Get(otr)\n                    ->GetServiceWorkerKeepaliveDataForRecords(extension->id())\n                    .size());\n  ProfileDestructionWaiter waiter(otr);\n  CloseTabForWebContents(otr_contents);\n  waiter.Wait();\n  base::RunLoop().RunUntilIdle();\n  // The moved destination's shutdown subscription must have nulled its context.\n  moved_owner.reset();\n  const auto records =\n      regular_pm->GetServiceWorkerKeepaliveDataForRecords(extension->id());\n  ASSERT_EQ(1u, records.size());\n  EXPECT_EQ(\"regular profile\", records[0].extra_data);\n  EXPECT_TRUE(records[0].worker_id.start_token ==\n              regular_workers[0].start_token);\n}\n\nIN_PROC_BROWSER_TEST_F(ServiceWorkerLifetimeKeepaliveBrowsertest,\n                       DebuggerMetadataRetiresBeforeLateDetach) {\n  TestExtensionDir test_dir;\n  test_dir.WriteManifest(R\"({\n    \"name\": \"Debugger accounting\",\n    \"manifest_version\": 3,\n    \"version\": \"1.0\",\n    \"permissions\": [\"debugger\", \"tabs\"],\n    \"background\": {\"service_worker\": \"background.js\"}\n  })\");\n  test_dir.WriteFile(FILE_PATH_LITERAL(\"background.js\"), R\"(\n    async function attach() {\n      const [tab] =\n          await chrome.tabs.query({active: true, currentWindow: true});\n      await chrome.debugger.attach({tabId: tab.id}, '1.3');\n      chrome.test.sendScriptResult('attached');\n    }\n    async function detach() {\n      const [tab] =\n          await chrome.tabs.query({active: true, currentWindow: true});\n      await chrome.debugger.detach({tabId: tab.id});\n      chrome.test.sendScriptResult('detached');\n    }\n  )\");\n  const Extension* extension = LoadExtension(test_dir.UnpackedPath());\n  ASSERT_TRUE(extension);\n  ASSERT_TRUE(NavigateToURL(GetActiveWebContents(), GURL(\"about:blank\")));\n  EXPECT_EQ(\"attached\", BackgroundScriptExecutor::ExecuteScript(\n                            profile(), extension->id(), \"attach();\",\n                            BackgroundScriptExecutor::ResultCapture::\n                                kSendScriptResult));\n  base::RunLoop().RunUntilIdle();\n  ProcessManager* pm = ProcessManager::Get(profile());\n  const auto original_workers =\n      pm->GetServiceWorkersForExtension(extension->id());\n  ASSERT_EQ(1u, original_workers.size());\n  auto records = pm->GetServiceWorkerKeepaliveDataForRecords(extension->id());\n  ASSERT_EQ(1u, records.size());\n  EXPECT_EQ(Activity::DEBUGGER, records[0].activity_type);\n  EXPECT_TRUE(records[0].worker_id.start_token ==\n              original_workers[0].start_token);\n\n  browsertest_util::StopServiceWorkerForExtensionGlobalScope(profile(),\n                                                            extension->id());\n  EXPECT_TRUE(\n      pm->GetServiceWorkerKeepaliveDataForRecords(extension->id()).empty());\n  EXPECT_EQ(\"restarted\", BackgroundScriptExecutor::ExecuteScript(\n                             profile(), extension->id(),\n                             \"chrome.test.sendScriptResult('restarted');\",\n                             BackgroundScriptExecutor::ResultCapture::\n                                 kSendScriptResult));\n  base::RunLoop().RunUntilIdle();\n  const auto new_workers = pm->GetServiceWorkersForExtension(extension->id());\n  ASSERT_EQ(1u, new_workers.size());\n  EXPECT_TRUE(new_workers[0].start_token != original_workers[0].start_token);\n  ServiceWorkerKeepalive new_owner(\n      profile(), new_workers[0],\n      content::ServiceWorkerExternalRequestTimeoutType::kDefault,\n      Activity::EVENT, \"new debugger incarnation\");\n  EXPECT_EQ(\"detached\", BackgroundScriptExecutor::ExecuteScript(\n                            profile(), extension->id(), \"detach();\",\n                            BackgroundScriptExecutor::ResultCapture::\n                                kSendScriptResult));\n  base::RunLoop().RunUntilIdle();\n  records = pm->GetServiceWorkerKeepaliveDataForRecords(extension->id());\n  ASSERT_EQ(1u, records.size());\n  EXPECT_EQ(\"new debugger incarnation\", records[0].extra_data);\n  EXPECT_TRUE(records[0].worker_id.start_token == new_workers[0].start_token);\n}\n#endif\n\n// Tests that the browser ignores stale idle termination requests from the\n// renderer that were sent before the browser started an external request. See\n// https://crbug.com/487746357.\n"
