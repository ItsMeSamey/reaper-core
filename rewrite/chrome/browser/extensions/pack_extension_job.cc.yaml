# Return Android Pack output-creation errors on the client sequence.
substitutions:
  - description: Stop packing and deliver Android Downloads output failure on the client sequence
    regex:
      pattern: "  if (!files) {\n    ReportFailureOnClientSequence(u\"Failed to create files under Downloads\",\n                                  ExtensionCreator::ErrorType::kOtherError);\n  }\n"
      replace: "  if (!files) {\n    if (run_mode_ == RunMode::kAsynchronous) {\n      async_reply_task_runner->PostTask(\n          FROM_HERE,\n          base::BindOnce(&PackExtensionJob::ReportFailureOnClientSequence,\n                         // The client keeps this job alive until the callback.\n                         base::Unretained(this),\n                         u\"Failed to create files under Downloads\",\n                         ExtensionCreator::ErrorType::kOtherError));\n    } else {\n      ReportFailureOnClientSequence(u\"Failed to create files under Downloads\",\n                                    ExtensionCreator::ErrorType::kOtherError);\n    }\n    return;\n  }\n"
    count: 1
