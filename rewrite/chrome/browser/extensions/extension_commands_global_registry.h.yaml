# Opt-in Android global extension hardware shortcuts.
substitutions:
- description: Observe Android service availability through generic UI callbacks
  regex:
    re_pattern: \#include\ "base/memory/raw_ptr\.h"
    replace: '#include "base/callback_list.h"

      #include "base/memory/raw_ptr.h"

      #include "build/build_config.h"'
- description: Keep service lifetime subscription within each real global registry
  regex:
    re_pattern: \ \ //\ Weak\ pointer\ to\ our\ browser\ context\.\ Not\ owned\ by\ us\.
    replace: "#if BUILDFLAG(IS_ANDROID)\n  void RefreshAndroidRegistrations();\n  base::CallbackListSubscription android_backend_subscription_;\n#endif\n\n  // Weak pointer to our browser context. Not owned by us."
- description: Format Android global shortcuts changes
  regex:
    re_pattern: '\#include\ <string>\

      \

      \#include\ "base/callback_list\.h"\

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "chrome/browser/extensions/extension_keybinding_registry\.h"\

      \#include\ "extensions/browser/browser_context_keyed_api_factory\.h"\

      \#include\ "extensions/buildflags/buildflags\.h"\

      \#include\ "ui/base/accelerators/accelerator\.h"\

      '
    replace: '#include <string>


      #include "base/callback_list.h"

      #include "base/memory/raw_ptr.h"

      #include "base/memory/weak_ptr.h"

      #include "build/build_config.h"

      #include "chrome/browser/extensions/extension_keybinding_registry.h"

      #include "extensions/browser/browser_context_keyed_api_factory.h"

      #include "extensions/buildflags/buildflags.h"

      #include "ui/base/accelerators/accelerator.h"

      '
