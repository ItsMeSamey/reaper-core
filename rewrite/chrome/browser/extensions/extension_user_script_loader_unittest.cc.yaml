- description: Android script-load failure completion/state 2
  regex:
    pattern: '// Test that a callback passed in will get called once scripts are loaded.

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\nnamespace {\n\nUserScriptList MakeOwnedScripts(const base::FilePath& extension_root,\n\
      \                                const std::string& extension_id,\n                                const std::string&\
      \ id,\n                                const std::string& contents) {\n  auto script = std::make_unique<UserScript>();\n\
      \  script->set_id(id);\n  script->add_url_pattern(\n      URLPattern(URLPattern::SCHEME_ALL, \"https://example.test/*\"\
      ));\n  auto js = UserScript::Content::CreateFile(\n      extension_root, base::FilePath(FILE_PATH_LITERAL(\"owned.js\"\
      )),\n      GURL(\"chrome-extension://\" + extension_id + \"/owned.js\"));\n  js->set_content(contents);\n  script->js_scripts().push_back(std::move(js));\n\
      \  UserScriptList scripts;\n  scripts.push_back(std::move(script));\n  return scripts;\n}\n\n// Control only the existing\
      \ asynchronous load reply. Invalid results do not\n// require resource exhaustion or execute any registered JavaScript.\n\
      class ControlledExtensionScriptLoader : public ExtensionUserScriptLoader {\n public:\n  ControlledExtensionScriptLoader(TestingProfile*\
      \ profile,\n                                  const Extension& extension,\n                                  StateStore*\
      \ state_store = nullptr)\n      : ExtensionUserScriptLoader(profile, extension, state_store,\n                     \
      \             /*content_verifier=*/nullptr),\n        extension_root_(extension.path()) {\n    SetReady(true);\n  }\n\
      \n  bool has_pending_load() const { return !pending_callback_.is_null(); }\n\n  void Register(const std::string& id,\n\
      \                const std::string& contents,\n                DynamicScriptsModifiedCallback callback) {\n    auto\
      \ operation = BeginDynamicScriptOperation({id});\n    AddOwnedDynamicScripts(\n        operation, MakeOwnedScripts(extension_root_,\
      \ host_id().id, id, contents),\n        {id}, std::move(callback));\n  }\n\n  void CompleteLoad(bool valid) {\n    ASSERT_TRUE(has_pending_load());\n\
      \    auto callback = std::move(pending_callback_);\n    auto scripts = std::move(pending_scripts_);\n    auto region\
      \ = valid ? Serialize(scripts) : base::ReadOnlySharedMemoryRegion();\n    ASSERT_EQ(valid, region.IsValid());\n    std::move(callback).Run(std::move(scripts),\
      \ std::move(region));\n    // A terminal may have destroyed this loader. Do not access members here.\n  }\n\n private:\n\
      \  void LoadScripts(UserScriptList scripts,\n                   const std::set<std::string>& added_script_ids,\n   \
      \                LoadScriptsCallback callback) override {\n    ASSERT_FALSE(has_pending_load());\n    pending_scripts_\
      \ = std::move(scripts);\n    pending_callback_ = std::move(callback);\n  }\n\n  base::FilePath extension_root_;\n  UserScriptList\
      \ pending_scripts_;\n  LoadScriptsCallback pending_callback_;\n};\n\nvoid FlushStore(StateStore& store) {\n  base::RunLoop\
      \ loop;\n  store.FlushForTesting(loop.QuitClosure());\n  loop.Run();\n}\n\nstd::set<std::string> ReadStoredScriptIds(StateStore&\
      \ store,\n                                        const ExtensionId& extension_id) {\n  std::set<std::string> ids;\n\
      \  base::RunLoop loop;\n  store.GetExtensionValue(\n      extension_id, scripting::kRegisteredScriptsStorageKey,\n \
      \     base::BindLambdaForTesting([&](std::optional<base::Value> value) {\n        EXPECT_TRUE(value && value->is_list());\n\
      \        if (value && value->is_list()) {\n          for (const auto& entry : value->GetList()) {\n            EXPECT_TRUE(entry.is_dict());\n\
      \            if (!entry.is_dict()) {\n              continue;\n            }\n            const std::string* id = entry.GetDict().FindString(\"\
      id\");\n            EXPECT_NE(nullptr, id);\n            if (id) {\n              ids.insert(*id);\n            }\n\
      \          }\n        }\n        loop.Quit();\n      }));\n  loop.Run();\n  return ids;\n}\n\n}  // namespace\n\nTEST_F(ExtensionUserScriptLoaderTest,\n\
      \       AndroidFailedUnregisterRestoresRegistrationForRetry) {\n  TestingProfile profile;\n  auto extension = ExtensionBuilder(\"\
      Test\").Build();\n  ControlledExtensionScriptLoader loader(&profile, *extension);\n  const std::string id = \"_dc_retry\"\
      ;\n  int registered = 0;\n  loader.Register(id, \"/* published */\",\n                  base::BindLambdaForTesting(\n\
      \                      [&](const std::optional<std::string>& error) {\n                        EXPECT_FALSE(error);\n\
      \                        ++registered;\n                      }));\n  loader.CompleteLoad(true);\n  ASSERT_EQ(1, registered);\n\
      \  ASSERT_TRUE(loader.IsDynamicScriptRegistrationCurrent(id));\n  ASSERT_TRUE(loader.GetPersistentDynamicScriptIDs().contains(id));\n\
      \n  int errors = 0;\n  loader.RemoveDynamicScripts(\n      {id}, base::BindLambdaForTesting(\n                [&](const\
      \ std::optional<std::string>& error) {\n                  EXPECT_TRUE(error);\n                  ++errors;\n       \
      \         }));\n  EXPECT_TRUE(loader.GetPersistentDynamicScriptIDs().contains(id));\n  loader.CompleteLoad(false);\n\
      \  ASSERT_EQ(1, errors);\n  EXPECT_TRUE(loader.IsDynamicScriptRegistrationCurrent(id));\n  EXPECT_TRUE(loader.GetPersistentDynamicScriptIDs().contains(id));\n\
      \  // This is the exact ID set used by explicit-unregister API validation.\n  EXPECT_TRUE(loader.GetDynamicScriptIDs(\n\
      \                        UserScript::Source::kDynamicContentScript)\n                  .contains(id));\n  ASSERT_EQ(1u,\
      \ loader.GetLoadedDynamicScripts().size());\n  ASSERT_EQ(1u, loader.GetLoadedDynamicScripts()[0]->js_scripts().size());\n\
      \  EXPECT_EQ(\"/* published */\",\n            loader.GetLoadedDynamicScripts()[0]->js_scripts()[0]->GetContent());\n\
      \n  int removed = 0;\n  loader.RemoveDynamicScripts(\n      {id}, base::BindLambdaForTesting(\n                [&](const\
      \ std::optional<std::string>& error) {\n                  EXPECT_FALSE(error);\n                  ++removed;\n     \
      \           }));\n  loader.CompleteLoad(true);\n  EXPECT_EQ(1, removed);\n  EXPECT_FALSE(loader.IsDynamicScriptRegistrationCurrent(id));\n\
      \  EXPECT_FALSE(loader.GetPersistentDynamicScriptIDs().contains(id));\n  EXPECT_TRUE(loader.GetDynamicScriptIDs(\n \
      \                       UserScript::Source::kDynamicContentScript)\n                  .empty());\n  EXPECT_TRUE(loader.GetLoadedDynamicScripts().empty());\n\
      }\n\nTEST_F(ExtensionUserScriptLoaderTest,\n       AndroidFailedRemovalAndReplacementPreservePublishedRegistration)\
      \ {\n  TestingProfile profile;\n  auto extension = ExtensionBuilder(\"Test\").Build();\n  ControlledExtensionScriptLoader\
      \ loader(&profile, *extension);\n  const std::string id = \"_dc_replace\";\n  loader.Register(id, \"/* old bytes */\"\
      ,\n                  base::BindLambdaForTesting(\n                      [](const std::optional<std::string>& error)\
      \ {\n                        EXPECT_FALSE(error);\n                      }));\n  loader.CompleteLoad(true);\n  ASSERT_TRUE(loader.IsDynamicScriptRegistrationCurrent(id));\n\
      \n  int errors = 0;\n  auto failed = [&errors](const std::optional<std::string>& error) {\n    EXPECT_TRUE(error);\n\
      \    ++errors;\n  };\n  loader.RemoveDynamicScripts({id}, base::BindLambdaForTesting(failed));\n  loader.Register(id,\
      \ \"/* failed replacement */\",\n                  base::BindLambdaForTesting(failed));\n  loader.CompleteLoad(false);\n\
      \  EXPECT_EQ(0, errors);\n  ASSERT_TRUE(loader.has_pending_load());\n  loader.CompleteLoad(false);\n  EXPECT_EQ(2, errors);\n\
      \  EXPECT_TRUE(loader.GetPendingDynamicScriptIDsForTesting().empty());\n  EXPECT_TRUE(loader.IsDynamicScriptRegistrationCurrent(id));\n\
      \  EXPECT_TRUE(loader.GetPersistentDynamicScriptIDs().contains(id));\n  EXPECT_TRUE(loader.GetDynamicScriptIDs(\n  \
      \                      UserScript::Source::kDynamicContentScript)\n                  .contains(id));\n  ASSERT_EQ(1u,\
      \ loader.GetLoadedDynamicScripts().size());\n  ASSERT_EQ(1u, loader.GetLoadedDynamicScripts()[0]->js_scripts().size());\n\
      \  EXPECT_EQ(\"/* old bytes */\",\n            loader.GetLoadedDynamicScripts()[0]->js_scripts()[0]->GetContent());\n\
      \  ASSERT_TRUE(loader.GetLoadedScriptsForTesting());\n  ASSERT_EQ(1u, loader.GetLoadedScriptsForTesting()->size());\n\
      \  ASSERT_EQ(1u, loader.GetLoadedScriptsForTesting()->front()->js_scripts().size());\n  EXPECT_EQ(\"/* old bytes */\"\
      ,\n            loader.GetLoadedScriptsForTesting()\n                ->front()\n                ->js_scripts()[0]\n \
      \               ->GetContent());\n\n  int removed = 0;\n  loader.RemoveDynamicScripts(\n      {id}, base::BindLambdaForTesting(\n\
      \                [&](const std::optional<std::string>& error) {\n                  EXPECT_FALSE(error);\n          \
      \        ++removed;\n                }));\n  loader.CompleteLoad(true);\n  EXPECT_EQ(1, removed);\n  EXPECT_TRUE(loader.GetLoadedDynamicScripts().empty());\n\
      \  EXPECT_FALSE(loader.GetPersistentDynamicScriptIDs().contains(id));\n}\n\nTEST_F(ExtensionUserScriptLoaderTest,\n\
      \       AndroidOldFailureDoesNotUndoNewerRetirement) {\n  TestingProfile profile;\n  auto extension = ExtensionBuilder(\"\
      Test\").Build();\n  ControlledExtensionScriptLoader loader(&profile, *extension);\n  const std::string id = \"_dc_retirement\"\
      ;\n  loader.Register(id, \"/* old bytes */\",\n                  base::BindLambdaForTesting(\n                     \
      \ [](const std::optional<std::string>& error) {\n                        EXPECT_FALSE(error);\n                    \
      \  }));\n  loader.CompleteLoad(true);\n  int errors = 0;\n  int removed = 0;\n  // Exercise native loader receipts directly,\
      \ including overlapping requests;\n  // this does not claim concurrent JavaScript API admission for duplicate IDs.\n\
      \  loader.RemoveDynamicScripts(\n      {id}, base::BindLambdaForTesting(\n                [&](const std::optional<std::string>&\
      \ error) {\n                  EXPECT_TRUE(error);\n                  ++errors;\n                  loader.RemoveDynamicScripts(\n\
      \                      {id}, base::BindLambdaForTesting(\n                                [&](const std::optional<std::string>&\
      \ later) {\n                                  EXPECT_FALSE(later);\n                                  ++removed;\n \
      \                               }));\n                }));\n  loader.RemoveDynamicScripts(\n      {id}, base::BindLambdaForTesting(\n\
      \                [&](const std::optional<std::string>& error) {\n                  EXPECT_TRUE(error);\n           \
      \       ++errors;\n                }));\n  loader.CompleteLoad(true);\n  ASSERT_TRUE(loader.has_pending_load());\n \
      \ loader.CompleteLoad(false);\n  EXPECT_EQ(2, errors);\n  EXPECT_EQ(0, removed);\n  EXPECT_FALSE(loader.IsDynamicScriptRegistrationCurrent(id));\n\
      \  EXPECT_TRUE(loader.GetDynamicScriptIDs(\n                        UserScript::Source::kDynamicContentScript)\n   \
      \               .empty());\n  EXPECT_TRUE(loader.GetPersistentDynamicScriptIDs().contains(id));\n  ASSERT_TRUE(loader.has_pending_load());\n\
      \  loader.CompleteLoad(true);\n  EXPECT_EQ(1, removed);\n  EXPECT_TRUE(loader.GetLoadedDynamicScripts().empty());\n\
      \  EXPECT_FALSE(loader.GetPersistentDynamicScriptIDs().contains(id));\n}\n\nTEST_F(ExtensionUserScriptLoaderTest,\n\
      \       AndroidUnregisterTerminalSurvivesLoaderDestruction) {\n  TestingProfile profile;\n  auto extension = ExtensionBuilder(\"\
      Test\").Build();\n  auto loader =\n      std::make_unique<ControlledExtensionScriptLoader>(&profile, *extension);\n\
      \  const std::string id = \"_dc_destroy\";\n  loader->Register(id, \"/* old bytes */\",\n                   base::BindLambdaForTesting(\n\
      \                       [](const std::optional<std::string>& error) {\n                         EXPECT_FALSE(error);\n\
      \                       }));\n  loader->CompleteLoad(true);\n  int errors = 0;\n  loader->RemoveDynamicScripts(\n  \
      \    {id}, base::BindLambdaForTesting(\n                [&](const std::optional<std::string>& error) {\n           \
      \       EXPECT_TRUE(error);\n                  ++errors;\n                }));\n  ASSERT_TRUE(loader->has_pending_load());\n\
      \  loader.reset();\n  EXPECT_EQ(1, errors);\n}\n\nTEST_F(ExtensionUserScriptLoaderTest,\n       AndroidInitialFailurePreservesStoredScriptsAcrossLaterWrite)\
      \ {\n  TestingProfile profile;\n  ASSERT_TRUE(base::WriteFile(\n      temp_dir_.GetPath().AppendASCII(\"owned.js\"),\
      \ \"/* previously accepted */\"));\n  auto extension = ExtensionBuilder(\"Test\")\n                       .SetPath(temp_dir_.GetPath())\n\
      \                       .SetManifestVersion(3)\n                       .AddAPIPermission(\"scripting\")\n          \
      \             .AddHostPermission(\"https://example.test/*\")\n                       .Build();\n  ExtensionRegistry::Get(&profile)->AddEnabled(extension);\n\
      \  auto factory =\n      base::MakeRefCounted<value_store::ValueStoreFactoryImpl>(temp_dir_.GetPath());\n  StateStore\
      \ store(&profile, factory, StateStore::BackendType::SCRIPTS,\n                   /*deferred_load=*/false);\n  const\
      \ std::string stored_id = \"_dc_stored\";\n  const std::string later_id = \"_dc_later\";\n  {\n    ControlledExtensionScriptLoader\
      \ seed(&profile, *extension, &store);\n    seed.Register(stored_id, \"/* previously accepted */\",\n               \
      \   base::BindLambdaForTesting(\n                      [](const std::optional<std::string>& error) {\n             \
      \           EXPECT_FALSE(error);\n                      }));\n    seed.CompleteLoad(true);\n    ASSERT_TRUE(seed.GetPersistentDynamicScriptIDs().contains(stored_id));\n\
      \    FlushStore(store);\n  }\n  EXPECT_EQ(std::set<std::string>({stored_id}),\n            ReadStoredScriptIds(store,\
      \ extension->id()));\n\n  ControlledExtensionScriptLoader loader(&profile, *extension, &store);\n  int initial_errors\
      \ = 0;\n  ASSERT_TRUE(loader.AddScriptsForExtensionLoad(\n      *extension,\n      base::BindLambdaForTesting(\n   \
      \       [&](UserScriptLoader* completed_loader,\n              const std::optional<std::string>& error) {\n        \
      \    EXPECT_EQ(&loader, completed_loader);\n            EXPECT_TRUE(error);\n            ++initial_errors;\n       \
      \   })));\n  FlushStore(store);\n  ASSERT_TRUE(loader.has_pending_load());\n  loader.CompleteLoad(false);\n  EXPECT_EQ(1,\
      \ initial_errors);\n  EXPECT_FALSE(loader.initial_load_complete());\n  EXPECT_TRUE(loader.GetPendingDynamicScriptIDsForTesting().empty());\n\
      \  EXPECT_TRUE(loader.IsDynamicScriptRegistrationCurrent(stored_id));\n  EXPECT_TRUE(loader.GetPersistentDynamicScriptIDs().contains(stored_id));\n\
      \  ASSERT_TRUE(loader.GetLoadedScriptsForTesting());\n  EXPECT_TRUE(loader.GetLoadedScriptsForTesting()->empty());\n\
      \  EXPECT_EQ(std::set<std::string>({stored_id}),\n            ReadStoredScriptIds(store, extension->id()));\n\n  int\
      \ later_successes = 0;\n  loader.Register(later_id, \"/* later accepted */\",\n                  base::BindLambdaForTesting(\n\
      \                      [&](const std::optional<std::string>& error) {\n                        EXPECT_FALSE(error);\n\
      \                        ++later_successes;\n                      }));\n  loader.CompleteLoad(true);\n  FlushStore(store);\n\
      \  EXPECT_EQ(1, initial_errors);\n  EXPECT_EQ(1, later_successes);\n  EXPECT_EQ(std::set<std::string>({stored_id, later_id}),\n\
      \            ReadStoredScriptIds(store, extension->id()));\n  // Persisting the prior registration does not claim automatic\
      \ native retry.\n  ASSERT_TRUE(loader.GetLoadedScriptsForTesting());\n  ASSERT_EQ(1u, loader.GetLoadedScriptsForTesting()->size());\n\
      \  EXPECT_EQ(later_id, loader.GetLoadedScriptsForTesting()->front()->id());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n\
      // Test that a callback passed in will get called once scripts are loaded.\n"
