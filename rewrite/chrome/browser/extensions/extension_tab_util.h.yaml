# Android pending Android tab lifecycle shutdown ownership.
substitutions:
- description: Permit an explicit already-authorized window when an Android window has no source tab.
  regex:
    pattern: "  // fully initiated.\n  static void NavigateToURL(WindowOpenDisposition disposition,\n                            content::WebContents* source_contents,\n                            const GURL& url,\n                            base::OnceClosure done_callback);"
    replace: "  // fully initiated. If source_contents is null, fallback_browser supplies the\n  // caller-authorized window/profile for navigation (including an empty window).\n  static void NavigateToURL(\n      WindowOpenDisposition disposition,\n      content::WebContents* source_contents,\n      const GURL& url,\n      base::OnceClosure done_callback,\n      BrowserWindowInterface* fallback_browser = nullptr);"
- description: Guard Android lifecycle accessors explicitly
  regex:
    re_pattern: \#include\ "base/values\.h"
    replace: '#include "base/values.h"

      #include "build/build_config.h"'
- description: Expose Android lifecycle state shared by tab queries and serialization
  regex:
    re_pattern: \ \ static\ constexpr\ char\ kTabsKey\[\]\ =\ "tabs";
    replace: "  static constexpr char kTabsKey[] = \"tabs\";\n\n#if BUILDFLAG(IS_ANDROID)\n  // Read the actual Android performance-manager state. A tab without a live\n  // graph has the default readable states, but mutations fail explicitly.\n  static bool IsTabAutoDiscardable(content::WebContents* contents);\n  static bool IsTabFrozen(content::WebContents* contents);\n  static bool SetTabAutoDiscardable(content::WebContents* contents, bool value);\n#endif"
- description: "Preserve native lazy-tab session identity and API behavior (literal 1)"
  regex:
    re_pattern: "class\\ TabGroupId;\\\nclass\\ TabGroupVisualData;\\\n\\}\\ \\ //\\ namespace\\ tab_groups\\\n\\\nnamespace\\ extensions\\ \\{\\\nclass\\ ChromeExtensionFunctionDetails;\\\n"
    replace: "class TabGroupId;\nclass TabGroupVisualData;\n}  // namespace tab_groups\n\nnamespace tabs {\nclass TabInterface;\n}\n\nnamespace extensions {\nclass ChromeExtensionFunctionDetails;\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 2)"
  regex:
    re_pattern: "\\\n\\ \\ static\\ int\\ GetWindowId\\(BrowserWindowInterface\\*\\ browser\\);\\\n\\ \\ static\\ int\\ GetTabId\\(const\\ content::WebContents\\*\\ web_contents\\);\\\n\\ \\ static\\ int\\ GetWindowIdOfTab\\(const\\ content::WebContents\\*\\ web_contents\\);\\\n\\\n\\ \\ static\\ WindowController\\*\\ GetControllerFromWindowID\\(\\\n"
    replace: "\n  static int GetWindowId(BrowserWindowInterface* browser);\n  static int GetTabId(const content::WebContents* web_contents);\n  static int GetTabId(const tabs::TabInterface& tab);\n  static int GetWindowIdOfTab(const tabs::TabInterface& tab);\n  static int GetWindowIdOfTab(const content::WebContents* web_contents);\n\n  static WindowController* GetControllerFromWindowID(\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 3)"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ const\\ Extension\\*\\ extension,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ TabListInterface\\*\\ tab_list,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ int\\ tab_index\\);\\\n\\ \\ //\\ Creates\\ a\\ base::DictValue\\ representing\\ the\\ window\\ for\\ the\\ given\\\n\\ \\ //\\ `browser`,\\ and\\ scrubs\\ any\\ privacy\\-sensitive\\ data\\ that\\ `extension`\\ does\\ not\\\n\\ \\ //\\ have\\ access\\ to\\.\\ `populate_tab_behavior`\\ determines\\ whether\\ tabs\\ will\\ be\\\n"
    replace: "                                        const Extension* extension,\n                                        TabListInterface* tab_list,\n                                        int tab_index);\n  // Serializes a native tab without materializing lazy Android contents.\n  // Eager tabs use the existing contents serializer.\n  static api::tabs::Tab CreateTabObject(\n      tabs::TabInterface& tab,\n      ScrubTabBehavior scrub_tab_behavior,\n      const Extension* extension,\n      TabListInterface* tab_list = nullptr,\n      int tab_index = -1);\n  static ScrubTabBehavior GetScrubTabBehavior(\n      const Extension* extension,\n      mojom::ContextType context,\n      const tabs::TabInterface& tab);\n\n  // Creates a base::DictValue representing the window for the given\n  // `browser`, and scrubs any privacy-sensitive data that `extension` does not\n  // have access to. `populate_tab_behavior` determines whether tabs will be\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 4)"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ bool\\ include_incognito,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ WindowController\\*\\*\\ window,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ content::WebContents\\*\\*\\ contents,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ int\\*\\ tab_index\\);\\\n\\ \\ static\\ bool\\ GetTabById\\(int\\ tab_id,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ content::BrowserContext\\*\\ browser_context,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ bool\\ include_incognito,\\\n"
    replace: "                         bool include_incognito,\n                         WindowController** window,\n                         content::WebContents** contents,\n                         int* tab_index,\n                         tabs::TabInterface** tab = nullptr);\n  // Asking only for native tab/window/index never loads a lazy tab. Existing\n  // contents callers materialize the one addressed tab if necessary.\n  static bool GetTabById(int tab_id,\n                         content::BrowserContext* browser_context,\n                         bool include_incognito,\n"
