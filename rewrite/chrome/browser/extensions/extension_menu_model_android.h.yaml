substitutions:
- description: Retire Android selection commands with their represented extension instances and exercise actual owner dispatch
  regex:
    re_pattern: '\#include\ "base/memory/raw_ptr\.h"\

      \#include\ "chrome/browser/extensions/context_menu_matcher\.h"\

      \#include\ "content/public/browser/context_menu_params\.h"\

      \#include\ "ui/menus/simple_menu_model\.h"\

      \

      namespace\ content\ \{\

      '
    replace: '#include "base/memory/raw_ptr.h"

      #include "chrome/browser/extensions/context_menu_matcher.h"

      #include "content/public/browser/context_menu_params.h"

      #include "extensions/common/extension_id.h"

      #include "ui/menus/simple_menu_model.h"


      namespace content {

      '
- description: Retire Android selection commands with their represented extension instances and exercise actual owner dispatch
  regex:
    re_pattern: '\ \ //\ This\ should\ be\ called\ after\ construction\.\

      \ \ void\ PopulateModel\(\);\

      \

      \ \ //\ ui::SimpleMenuModel::Delegate\ overrides:\

      \ \ bool\ IsCommandIdChecked\(int\ command_id\)\ const\ override;\

      \ \ bool\ IsCommandIdEnabled\(int\ command_id\)\ const\ override;\

      '
    replace: "  // This should be called after construction.\n  void PopulateModel();\n\n  // Returns the extensions represented by visible rows copied to the Android\n  // menu bridge, including nested items under synthetic grouping rows.\n  ExtensionIdSet GetVisibleExtensionIds();\n\n  // ui::SimpleMenuModel::Delegate overrides:\n  bool IsCommandIdChecked(int command_id) const override;\n  bool IsCommandIdEnabled(int command_id) const override;\n"
- description: Include the complete value type for the source-document handle.
  regex:
    pattern: '#include "content/public/browser/context_menu_params.h"

      '
    replace: '#include "content/public/browser/context_menu_params.h"

      #include "content/public/browser/weak_document_ptr.h"

      '
  count: 1
- description: Keep document identity without retaining a stale frame pointer.
  regex:
    pattern: "  // Store the RenderFrameHost; assumes this delegate is relatively short-lived\n  // or the menu is used while\
      \ the RFH is valid.\n  raw_ptr<content::RenderFrameHost> rfh_ptr_;\n"
    replace: "  // Menu activation must still belong to the document that opened the menu.\n  content::WeakDocumentPtr source_document_;\n"
  count: 1
