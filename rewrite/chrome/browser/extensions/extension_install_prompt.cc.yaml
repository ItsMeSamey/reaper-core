substitutions:
- description: Android manual import prompt follows originating document
  regex:
    pattern: "#include \"content/public/browser/web_contents.h\"\n"
    replace: "#include \"content/public/browser/web_contents.h\"\n#if BUILDFLAG(IS_ANDROID)\n#include \"content/public/browser/navigation_handle.h\"\n#endif\n"
  count: 1
- description: Android manual import prompt follows originating document
  regex:
    pattern: "ExtensionInstallPrompt::~ExtensionInstallPrompt() = default;\n"
    replace: "ExtensionInstallPrompt::~ExtensionInstallPrompt() = default;\n\n#if BUILDFLAG(IS_ANDROID)\nvoid ExtensionInstallPrompt::CancelOnNavigation(content::WebContents* contents) {\n  Observe(contents);\n}\n\nvoid ExtensionInstallPrompt::DidStartNavigation(\n    content::NavigationHandle* navigation) {\n  if (navigation->IsInPrimaryMainFrame() &&\n      !navigation->IsSameDocument()) {\n    canceled_by_navigation_ = true;\n  }\n}\n\nvoid ExtensionInstallPrompt::WebContentsDestroyed() {\n  canceled_by_navigation_ = true;\n}\n#endif\n"
  count: 1
- description: Android manual import prompt follows originating document
  regex:
    pattern: "void ExtensionInstallPrompt::ShowConfirmation() {\n"
    replace: "void ExtensionInstallPrompt::ShowConfirmation() {\n#if BUILDFLAG(IS_ANDROID)\n  // Check after asynchronous icon loading too. The original WebContents may\n  // still exist while its initiating document has already navigated away.\n  if (canceled_by_navigation_) {\n    std::move(done_callback_).Run(DoneCallbackPayload(Result::ABORTED));\n    return;\n  }\n#endif\n"
  count: 1
- description: Android opted-in local import cancels delayed prompt after renderer loss
  regex:
    pattern: "void ExtensionInstallPrompt::WebContentsDestroyed() {\n  canceled_by_navigation_ = true;\n}\n#endif\n\nvoid ExtensionInstallPrompt::ShowDialog(\n"
    replace: "void ExtensionInstallPrompt::WebContentsDestroyed() {\n  canceled_by_navigation_ = true;\n}\n\nvoid ExtensionInstallPrompt::PrimaryMainFrameRenderProcessGone(\n    base::TerminationStatus status) {\n  canceled_by_navigation_ = true;\n}\n#endif\n\nvoid ExtensionInstallPrompt::ShowDialog(\n"
  count: 1
- description: Android opted-in local import cancels delayed prompt after renderer loss
  regex:
    pattern: "void ExtensionInstallPrompt::ShowConfirmation() {\n#if BUILDFLAG(IS_ANDROID)\n  // Check after asynchronous icon loading too. The original WebContents may\n  // still exist while its initiating document has already navigated away.\n  if (canceled_by_navigation_) {\n    std::move(done_callback_).Run(DoneCallbackPayload(Result::ABORTED));\n    return;\n"
    replace: "void ExtensionInstallPrompt::ShowConfirmation() {\n#if BUILDFLAG(IS_ANDROID)\n  // Check after asynchronous icon loading too. The original WebContents may\n  // still exist after its initiating document navigated away or lost its\n  // renderer. Only manual-import prompts opt into these observer callbacks.\n  if (canceled_by_navigation_) {\n    std::move(done_callback_).Run(DoneCallbackPayload(Result::ABORTED));\n    return;\n"
  count: 1
