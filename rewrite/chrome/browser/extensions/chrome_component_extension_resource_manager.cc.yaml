substitutions:
  - description: |
      Register Brave's own component extension resources.
    after_function_impl:
      function_name: ChromeComponentExtensionResourceManager::Data::Data
      code: |-
        AddComponentResourceEntries(kBraveExtension);
        AddComponentResourceEntries(kBraveExtensionGenerated);
  - description: Keep the Android guard at the exact paired source indentation.
    regex:
      pattern: "  AddComponentResourceEntries(kBraveExtension);\n  AddComponentResourceEntries(kBraveExtensionGenerated);"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  AddComponentResourceEntries(kBraveExtension);\n  AddComponentResourceEntries(kBraveExtensionGenerated);\n#endif"

  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/chrome_component_extension_resource_manager.cc'
    regex:
      re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

        \

        \#include\ "chrome/browser/extensions/chrome_component_extension_resource_manager\.h"\

        \

        \#include\ <map>\

        \

        '
      replace: '// found in the LICENSE file.


        #include "chrome/browser/extensions/chrome_component_extension_resource_manager.h"

        #include "build/build_config.h"


        #include <map>


        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/chrome_component_extension_resource_manager.cc'
    regex:
      re_pattern: '\#include\ "base/files/file_path\.h"\

        \#include\ "base/path_service\.h"\

        \#include\ "base/values\.h"\

        \#include\ "build/build_config\.h"\

        \#include\ "build/chromeos_buildflags\.h"\

        \#include\ "chrome/common/chrome_features\.h"\

        \#include\ "chrome/common/chrome_paths\.h"\

        \#include\ "chrome/common/extensions/extension_constants\.h"\

        \#include\ "chrome/grit/aim_eligibility_extension_resources_map\.h"\

        \#include\ "chrome/grit/chrome_unscaled_resources\.h"\

        \#include\ "chrome/grit/component_extension_resources_map\.h"\

        \#include\ "chrome/grit/contextual_tasks_extension_resources_map\.h"\

        \#include\ "chrome/grit/theme_resources\.h"\

        \#include\ "components/contextual_tasks/public/features\.h"\

        \#include\ "components/omnibox/common/omnibox_features\.h"\

        \#include\ "content/public/browser/browser_thread\.h"\

        \#include\ "extensions/browser/extension_config_map\.h"\

        '
      replace: '#include "base/files/file_path.h"

        #include "base/path_service.h"

        #include "base/values.h"

        #include "build/chromeos_buildflags.h"

        #include "chrome/common/chrome_features.h"

        #include "chrome/common/chrome_paths.h"

        #include "chrome/common/extensions/extension_constants.h"

        #if !BUILDFLAG(IS_ANDROID)

        #include "chrome/grit/aim_eligibility_extension_resources_map.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        #include "chrome/grit/chrome_unscaled_resources.h"

        #include "chrome/grit/component_extension_resources_map.h"

        #if !BUILDFLAG(IS_ANDROID)

        #include "chrome/grit/contextual_tasks_extension_resources_map.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        #include "chrome/grit/theme_resources.h"

        #if !BUILDFLAG(IS_ANDROID)

        #include "components/contextual_tasks/public/features.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        #include "components/omnibox/common/omnibox_features.h"

        #include "content/public/browser/browser_thread.h"

        #include "extensions/browser/extension_config_map.h"

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/chrome_component_extension_resource_manager.cc'
    regex:
      re_pattern: '\

        \ \ AddComponentResourceEntries\(kComponentExtensionResources\);\

        \ \ AddComponentResourceEntries\(kExtraComponentExtensionResources\);\

        \ \ if\ \(base::FeatureList::IsEnabled\(\

        \ \ \ \ \ \ \ \ \ \ omnibox::kAimEligibilityComponentExtension\)\)\ \{\

        \ \ \ \ AddComponentResourceEntries\(kAimEligibilityExtensionResources\);\

        '
      replace: "\n  AddComponentResourceEntries(kComponentExtensionResources);\n  AddComponentResourceEntries(kExtraComponentExtensionResources);\n#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(\n          omnibox::kAimEligibilityComponentExtension)) {\n    AddComponentResourceEntries(kAimEligibilityExtensionResources);\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/extensions/chrome_component_extension_resource_manager.cc'
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ extensions_features::kApiContextualTasksPrivate\)\)\ \{\

        \ \ \ \ AddComponentResourceEntries\(kContextualTasksExtensionResources\);\

        \ \ \}\

        \

        \#if\ !BUILDFLAG\(IS_ANDROID\)\

        \ \ if\ \(base::FeatureList::IsEnabled\(features::kIndigo\)\)\ \{\

        '
      replace: "          extensions_features::kApiContextualTasksPrivate)) {\n    AddComponentResourceEntries(kContextualTasksExtensionResources);\n  }\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(features::kIndigo)) {\n"
