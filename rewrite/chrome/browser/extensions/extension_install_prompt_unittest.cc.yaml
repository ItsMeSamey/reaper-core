substitutions:
- description: Android manual import prompt follows originating document
  regex:
    pattern: "#include \"base/test/scoped_feature_list.h\"\n"
    replace: "#include \"base/test/scoped_feature_list.h\"\n#if BUILDFLAG(IS_ANDROID)\n#include \"base/test/bind.h\"\n#include \"content/public/test/navigation_simulator.h\"\n#endif\n"
  count: 1
- description: Android manual import prompt follows originating document
  regex:
    pattern: "    EXPECT_TRUE(gfx::BitmapsAreEqual(install_prompt->icon().AsBitmap(),\n                                     *app_icon.bitmap()));\n  }\n}"
    replace: "    EXPECT_TRUE(gfx::BitmapsAreEqual(install_prompt->icon().AsBitmap(),\n                                     *app_icon.bitmap()));\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  // Exercise the real asynchronous icon reply, including the gap after the\n  // import API has handed work to the installer but before a dialog exists.\n  for (const auto* scenario : {\"cross-document\", \"started\", \"same-document\",\n                               \"default\", \"reenable\"}) {\n    SCOPED_TRACE(scenario);\n    const GURL initial(\"https://example.test/import\");\n    content::WebContentsTester::For(web_contents.get())->NavigateAndCommit(initial);\n    const bool opt_in = std::string_view(scenario) != \"default\";\n    const bool same_document = std::string_view(scenario) == \"same-document\";\n    const bool reenable = std::string_view(scenario) == \"reenable\";\n    const bool started = std::string_view(scenario) == \"started\";\n    ExtensionInstallPrompt prompt(\n        web_contents.get(), std::make_unique<InstallPromptData>(\n                                reenable ? InstallPromptData::RE_ENABLE_PROMPT\n                                         : InstallPromptData::INSTALL_PROMPT));\n    if (opt_in) {\n      prompt.CancelOnNavigation(web_contents.get());\n    }\n    ShowDialogTestFuture show_dialog_future;\n    base::test::TestFuture<ExtensionInstallPrompt::DoneCallbackPayload> completed;\n    int completion_count = 0;\n    prompt.ShowDialog(\n        base::BindLambdaForTesting(\n            [&](ExtensionInstallPrompt::DoneCallbackPayload payload) {\n              ++completion_count;\n              completed.SetValue(std::move(payload));\n            }),\n        extension, nullptr, show_dialog_future.GetRepeatingCallback());\n    ASSERT_FALSE(show_dialog_future.IsReady());\n    ASSERT_FALSE(completed.IsReady());\n    std::unique_ptr<content::NavigationSimulator> pending_navigation;\n    if (started) {\n      pending_navigation = content::NavigationSimulator::CreateRendererInitiated(\n          GURL(\"https://example.test/replacement\"), web_contents.get());\n      pending_navigation->Start();\n    } else if (same_document) {\n      content::NavigationSimulator::CreateRendererInitiated(\n          GURL(\"https://example.test/import#same-document\"), web_contents.get())\n          ->CommitSameDocument();\n    } else if (!reenable) {\n      content::WebContentsTester::For(web_contents.get())\n          ->NavigateAndCommit(GURL(\"https://example.test/replacement\"));\n    }\n    if (opt_in && !same_document && !reenable) {\n      EXPECT_EQ(ExtensionInstallPrompt::Result::ABORTED,\n                completed.Take().result);\n      EXPECT_FALSE(show_dialog_future.IsReady());\n      EXPECT_FALSE(prompt.did_call_show_dialog());\n    } else {\n      auto [params, done_callback, install_prompt] = show_dialog_future.Take();\n      EXPECT_TRUE(prompt.did_call_show_dialog());\n      EXPECT_FALSE(completed.IsReady());\n      std::move(done_callback).Run(ExtensionInstallPrompt::DoneCallbackPayload(\n          ExtensionInstallPrompt::Result::USER_CANCELED));\n      EXPECT_EQ(ExtensionInstallPrompt::Result::USER_CANCELED,\n                completed.Take().result);\n    }\n    if (pending_navigation) {\n      // Commit only after the delayed image callback was canceled. No dialog\n      // may attach in the gap between navigation start and commit.\n      pending_navigation->Commit();\n    }\n    task_environment()->RunUntilIdle();\n    EXPECT_EQ(1, completion_count);\n  }\n#endif\n}"
  count: 1
- description: Android manual import prompt follows originating document
  regex:
    pattern: "#include <memory>\n"
    replace: "#include <memory>\n#if BUILDFLAG(IS_ANDROID)\n#include <string_view>\n#endif\n"
  count: 1
- description: Android opted-in local import cancels delayed prompt after renderer loss
  regex:
    pattern: "#include \"base/test/scoped_feature_list.h\"\n#if BUILDFLAG(IS_ANDROID)\n#include \"base/test/bind.h\"\n#include \"content/public/test/navigation_simulator.h\"\n#endif\n#include \"base/test/test_future.h\"\n"
    replace: "#include \"base/test/scoped_feature_list.h\"\n#if BUILDFLAG(IS_ANDROID)\n#include \"base/test/bind.h\"\n#include \"content/public/browser/render_frame_host.h\"\n#include \"content/public/test/mock_render_process_host.h\"\n#include \"content/public/test/navigation_simulator.h\"\n#endif\n#include \"base/test/test_future.h\"\n"
  count: 1
- description: Android opted-in local import cancels delayed prompt after renderer loss
  regex:
    pattern: "  // Exercise the real asynchronous icon reply, including the gap after the\n  // import API has handed work to the installer but before a dialog exists.\n  for (const auto* scenario : {\"cross-document\", \"started\", \"same-document\",\n                               \"default\", \"reenable\"}) {\n    SCOPED_TRACE(scenario);\n    const GURL initial(\"https://example.test/import\");\n    content::WebContentsTester::For(web_contents.get())->NavigateAndCommit(initial);\n    const bool opt_in = std::string_view(scenario) != \"default\";\n    const bool same_document = std::string_view(scenario) == \"same-document\";\n    const bool reenable = std::string_view(scenario) == \"reenable\";\n    const bool started = std::string_view(scenario) == \"started\";\n"
    replace: "  // Exercise the real asynchronous icon reply, including the gap after the\n  // import API has handed work to the installer but before a dialog exists.\n  for (const auto* scenario : {\"cross-document\", \"started\", \"same-document\",\n                               \"default\", \"reenable\", \"renderer-gone\",\n                               \"default-renderer-gone\",\n                               \"renderer-gone-before-show\"}) {\n    SCOPED_TRACE(scenario);\n    const GURL initial(\"https://example.test/import\");\n    content::WebContentsTester::For(web_contents.get())->NavigateAndCommit(initial);\n    const bool opt_in = std::string_view(scenario) != \"default\" &&\n                        std::string_view(scenario) != \"default-renderer-gone\";\n    const bool renderer_gone =\n        std::string_view(scenario).find(\"renderer-gone\") != std::string_view::npos;\n    const bool gone_before_show =\n        std::string_view(scenario) == \"renderer-gone-before-show\";\n    const bool same_document = std::string_view(scenario) == \"same-document\";\n    const bool reenable = std::string_view(scenario) == \"reenable\";\n    const bool started = std::string_view(scenario) == \"started\";\n"
  count: 1
- description: Android opted-in local import cancels delayed prompt after renderer loss
  regex:
    pattern: "                                         : InstallPromptData::INSTALL_PROMPT));\n    if (opt_in) {\n      prompt.CancelOnNavigation(web_contents.get());\n    }\n    ShowDialogTestFuture show_dialog_future;\n    base::test::TestFuture<ExtensionInstallPrompt::DoneCallbackPayload> completed;\n"
    replace: "                                         : InstallPromptData::INSTALL_PROMPT));\n    if (opt_in) {\n      prompt.CancelOnNavigation(web_contents.get());\n    }\n    // TestWebContents owns a mock host with no real renderer process. Exercise\n    // normal observer dispatch, including the non-opted-in default prompt.\n    auto simulate_renderer_loss = [&] {\n      static_cast<content::MockRenderProcessHost*>(\n          web_contents->GetPrimaryMainFrame()->GetProcess())\n          ->SimulateRenderProcessExit(\n              base::TERMINATION_STATUS_PROCESS_WAS_KILLED, 0);\n    };\n    if (gone_before_show) {\n      simulate_renderer_loss();\n    }\n    ShowDialogTestFuture show_dialog_future;\n    base::test::TestFuture<ExtensionInstallPrompt::DoneCallbackPayload> completed;\n"
