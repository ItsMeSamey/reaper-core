substitutions:
- description: Build the observer integration regression only on Android with Safe Browsing.
  regex:
    pattern: '#include "components/sessions/core/session_id.h"'
    replace: '#include "components/safe_browsing/buildflags.h"

      #include "components/sessions/core/session_id.h"'
- description: Reuse the real extension-host and browser delegate in the Android regression.
  regex:
    pattern: static_assert(BUILDFLAG(ENABLE_EXTENSIONS_CORE));
    replace: '#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(SAFE_BROWSING_AVAILABLE)

      #include "chrome/browser/safe_browsing/chrome_password_reuse_detection_manager_client.h"

      #include "extensions/browser/extension_host.h"

      #include "extensions/browser/safe_browsing_delegate.h"

      #include "extensions/common/mojom/view_type.mojom.h"

      #include "extensions/test/test_extension_dir.h"

      #endif  // BUILDFLAG(IS_ANDROID) && BUILDFLAG(SAFE_BROWSING_AVAILABLE)


      static_assert(BUILDFLAG(ENABLE_EXTENSIONS_CORE));'
- description: Verify extension-created pages attach the observer once without enabling desktop telemetry.
  regex:
    pattern: '}  // namespace extensions'
    replace: "#if BUILDFLAG(IS_ANDROID) && BUILDFLAG(SAFE_BROWSING_AVAILABLE)\nIN_PROC_BROWSER_TEST_F(ExtensionTabUtilBrowserTest,\n                       AndroidExtensionHostHasPasswordReuseObserver) {\n  TestExtensionDir test_dir;\n  test_dir.WriteManifest(R\"({\n    \"name\": \"Password observer integration\",\n    \"version\": \"1\",\n    \"manifest_version\": 3,\n    \"action\": {\"default_popup\": \"popup.html\"}\n  })\");\n  test_dir.WriteFile(FILE_PATH_LITERAL(\"popup.html\"),\n                     \"<!doctype html><input type=password>\");\n  const Extension* extension = LoadExtension(test_dir.UnpackedPath());\n  ASSERT_TRUE(extension);\n\n  ExtensionHost host(extension, profile(), extension->GetResourceURL(\"popup.html\"),\n                     mojom::ViewType::kExtensionPopup);\n  auto* observer = ChromePasswordReuseDetectionManagerClient::FromWebContents(\n      host.host_contents());\n  ASSERT_TRUE(observer);\n  auto* delegate = ExtensionsBrowserClient::Get()->GetSafeBrowsingDelegate();\n\
      \  delegate->CreatePasswordReuseDetectionManager(host.host_contents());\n  EXPECT_EQ(observer, ChromePasswordReuseDetectionManagerClient::FromWebContents(\n                          host.host_contents()));\n  EXPECT_FALSE(delegate->IsExtensionTelemetryServiceEnabled(profile()));\n}\n#endif  // BUILDFLAG(IS_ANDROID) && BUILDFLAG(SAFE_BROWSING_AVAILABLE)\n\n}  // namespace extensions"
