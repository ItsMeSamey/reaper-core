- description: Exercise the mandatory updater delegate and real completion callback without Android activity-pref collection
    or mutation.
  regex:
    pattern: '  void TestGalleryRequestsWithBrand(bool use_organic_brand_code) {'
    replace: "#if BUILDFLAG(IS_ANDROID)\nvoid TestAndroidUpdaterProvidesNoOptionalActivityData() {\n  ExtensionDownloaderTestHelper\
      \ helper;\n  TestDownloaderFactory factory(helper.url_loader_factory());\n  ExtensionList extensions;\n  CreateTestExtensions(1,\
      \ 1, &extensions, nullptr, ManifestLocation::kInternal);\n  SetExtensions(extensions, ExtensionList());\n  const ExtensionId\
      \ id = extensions[0]->id();\n  const base::Time original_day = base::Time::Now() - base::Days(4);\n  extension_prefs()->SetLastPingDay(id,\
      \ original_day);\n  extension_prefs()->SetLastActivePingDay(id, original_day);\n  extension_prefs()->SetActiveBit(id,\
      \ true);\n  ExtensionUpdater updater(profile());\n  updater.InitAndEnable(extension_prefs(), pref_service(), kUpdateFrequency,\n\
      \                        nullptr, factory.GetDownloaderFactory());\n  updater.Start();\n  DownloadPingData output(17,\
      \ 23, false, {});\n  EXPECT_FALSE(updater.GetPingDataForExtension(id, &output));\n  EXPECT_EQ(17, output.rollcall_days);\n\
      \  EXPECT_EQ(23, output.active_days);\n  EXPECT_FALSE(output.is_enabled);\n  ExtensionDownloaderDelegate::PingResult\
      \ ping;\n  ping.did_ping = true;\n  ping.day_start = base::Time::Now();\n  updater.OnExtensionDownloadFailed(\n    \
      \  id, ExtensionDownloaderDelegate::Error::NO_UPDATE_AVAILABLE, ping, {},\n      ExtensionDownloaderDelegate::FailureData());\n\
      \  EXPECT_EQ(original_day, extension_prefs()->LastPingDay(id));\n  EXPECT_EQ(original_day, extension_prefs()->LastActivePingDay(id));\n\
      \  EXPECT_TRUE(extension_prefs()->GetActiveBit(id));\n}\n#endif\n  void TestGalleryRequestsWithBrand(bool use_organic_brand_code)\
      \ {"
  count: 1
- description: Add bounded Android serializer/rebuild/batching, real downloader collection and updater callback-pref regressions.
  regex:
    pattern: TEST_F(ExtensionUpdaterTest, TestManifestFetchDataAddExtension) {
    replace: "#if BUILDFLAG(IS_ANDROID)\nTEST_F(ExtensionUpdaterTest, AndroidManifestUpdatesExcludeOptionalPingData) {\n \
      \ const GURL url(\"https://clients2.google.com/service/update2/crx\");\n  const ExtensionId first_id(32, 'a');\n  const\
      \ ExtensionId second_id(32, 'b');\n  const std::string query = UpdateQueryParams::Get(UpdateQueryParams::CRX);\n  const\
      \ DownloadPingData ping(ManifestFetchData::kNeverPinged, 7, false,\n                              {disable_reason::DISABLE_USER_ACTION});\n\
      \  const auto modes = std::to_array<ManifestFetchData::PingMode>(\n      {ManifestFetchData::NO_PING, ManifestFetchData::PING,\n\
      \       ManifestFetchData::PING_WITH_ENABLED_STATE});\n  for (auto mode : modes) {\n    ManifestFetchData fetch(url,\
      \ 11, \"TEST\", query, mode,\n                            DownloadFetchPriority::kBackground);\n    ASSERT_TRUE(fetch.AddExtension(first_id,\
      \ \"1.2.3\", &ping, \"bar\", \"ondemand\",\n                                   ManifestLocation::kInternal,\n      \
      \                             DownloadFetchPriority::kBackground));\n    std::map<std::string, std::string> params;\n\
      \    VerifyQueryAndExtractParameters(fetch.full_url().GetQuery(), &params);\n    EXPECT_EQ(first_id, params[\"id\"]);\n\
      \    EXPECT_EQ(\"1.2.3\", params[\"v\"]);\n    EXPECT_EQ(\"bar\", params[\"ap\"]);\n    EXPECT_EQ(\"ondemand\", params[\"\
      installsource\"]);\n    EXPECT_EQ(\"internal\", params[\"installedby\"]);\n    EXPECT_TRUE(params.contains(\"uc\"));\n\
      \    EXPECT_FALSE(params.contains(\"ping\"));\n    EXPECT_FALSE(params.contains(\"brand\"));\n    EXPECT_FALSE(fetch.DidPing(first_id,\
      \ ManifestFetchData::ROLLCALL));\n    EXPECT_FALSE(fetch.DidPing(first_id, ManifestFetchData::ACTIVE));\n    ASSERT_TRUE(fetch.AddExtension(second_id,\
      \ \"2.0\", &ping, \"bar\", \"ondemand\",\n                                   ManifestLocation::kInternal,\n        \
      \                           DownloadFetchPriority::kBackground));\n    fetch.RemoveExtensions({first_id}, query);\n\
      \    params.clear();\n    VerifyQueryAndExtractParameters(fetch.full_url().GetQuery(), &params);\n    EXPECT_EQ(second_id,\
      \ params[\"id\"]);\n    EXPECT_EQ(\"2.0\", params[\"v\"]);\n    EXPECT_EQ(\"bar\", params[\"ap\"]);\n    EXPECT_FALSE(params.contains(\"\
      ping\"));\n    EXPECT_FALSE(params.contains(\"brand\"));\n    EXPECT_FALSE(fetch.Includes(first_id));\n    EXPECT_TRUE(fetch.Includes(second_id));\n\
      \    EXPECT_FALSE(fetch.DidPing(second_id, ManifestFetchData::ROLLCALL));\n    auto other = std::make_unique<ManifestFetchData>(\n\
      \        url, 12, \"OTHER\", query, mode, DownloadFetchPriority::kForeground);\n    ASSERT_TRUE(other->AddExtension(second_id,\
      \ \"2.0\", &ping, \"bar\", \"ondemand\",\n                                    ManifestLocation::kInternal,\n       \
      \                             DownloadFetchPriority::kForeground));\n    ASSERT_EQ(fetch.full_url(), other->full_url());\n\
      \    EXPECT_EQ(DownloadFetchPriority::kBackground, fetch.fetch_priority());\n    fetch.Merge(std::move(other));\n  \
      \  EXPECT_EQ(2u, fetch.request_ids().size());\n    EXPECT_TRUE(fetch.request_ids().contains(11));\n    EXPECT_TRUE(fetch.request_ids().contains(12));\n\
      \    EXPECT_EQ(DownloadFetchPriority::kForeground, fetch.fetch_priority());\n  }\n}\n\nTEST_F(ExtensionUpdaterTest,\
      \ AndroidDownloaderDoesNotCollectOptionalPingData) {\n  ExtensionDownloaderTestHelper helper;\n  helper.downloader().set_ping_enabled_domain(\"\
      google.com\");\n  helper.downloader().set_brand_code(\"TEST\");\n  EXPECT_CALL(helper.delegate(), GetPingDataForExtension(_,\
      \ _)).Times(0);\n  const ExtensionId id =\n      crx_file::id_util::GenerateId(\"android-update-privacy\");\n  auto\
      \ task = CreateDownloaderTask(\n      id, GURL(\"https://clients2.google.com/service/update2/crx\"));\n  task.version\
      \ = base::Version(\"3.4\");\n  ASSERT_TRUE(helper.downloader().AddPendingExtension(std::move(task)));\n  helper.downloader().StartAllPending(nullptr);\n\
      \  RunUntilIdle();\n  const auto* fetch = helper.downloader().GetActiveManifestFetchForTesting();\n  ASSERT_TRUE(fetch);\n\
      \  std::map<std::string, std::string> params;\n  VerifyQueryAndExtractParameters(fetch->full_url().GetQuery(), &params);\n\
      \  EXPECT_EQ(id, params[\"id\"]);\n  EXPECT_EQ(\"3.4\", params[\"v\"]);\n  EXPECT_TRUE(params.contains(\"uc\"));\n \
      \ EXPECT_FALSE(params.contains(\"ping\"));\n  EXPECT_FALSE(params.contains(\"brand\"));\n}\n\nTEST_F(ExtensionUpdaterTest,\
      \ AndroidUpdaterProvidesNoOptionalActivityData) {\n  TestAndroidUpdaterProvidesNoOptionalActivityData();\n}\n#endif\n\
      TEST_F(ExtensionUpdaterTest, TestManifestFetchDataAddExtension) {"
  count: 1
