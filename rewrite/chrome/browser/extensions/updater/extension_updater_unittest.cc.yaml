    retain desktop daystart persistence checks.
  regex:
    pattern: "    results->daystart_elapsed_seconds = kDaystartElapsedSeconds;\n\n    updater.downloader_->HandleManifestResults(std::move(fetch_data),\n\
      \                                               std::move(results),\n                                              \
      \ /*error=*/std::nullopt);\n    Time last_ping_day = extension_prefs()->LastPingDay(extension->id());\n    EXPECT_FALSE(last_ping_day.is_null());\n\
      \    int64_t seconds_diff = (Time::Now() - last_ping_day).InSeconds();\n    EXPECT_LT(seconds_diff - kDaystartElapsedSeconds,\
      \ 5);\n"
    replace: "    results->daystart_elapsed_seconds = kDaystartElapsedSeconds;\n\n#if BUILDFLAG(IS_ANDROID)\n    const Time\
      \ original_last_ping_day =\n        extension_prefs()->LastPingDay(extension->id());\n#endif\n    updater.downloader_->HandleManifestResults(std::move(fetch_data),\n\
      \                                               std::move(results),\n                                              \
      \ /*error=*/std::nullopt);\n    Time last_ping_day = extension_prefs()->LastPingDay(extension->id());\n#if BUILDFLAG(IS_ANDROID)\n\
      \    EXPECT_EQ(original_last_ping_day, last_ping_day);\n#else\n    EXPECT_FALSE(last_ping_day.is_null());\n    int64_t\
      \ seconds_diff = (Time::Now() - last_ping_day).InSeconds();\n    EXPECT_LT(seconds_diff - kDaystartElapsedSeconds, 5);\n\
      #endif\n"
  count: 1
