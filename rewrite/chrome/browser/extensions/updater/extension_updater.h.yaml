substitutions:
- description: Declare Android build configuration directly.
  regex:
    pattern: '#include "base/unguessable_token.h"

      '
    replace: '#include "base/unguessable_token.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude private Android ping-pref mutation method.
  regex:
    pattern: '  void UpdatePingData(const ExtensionId& id, const PingResult& ping_result);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void UpdatePingData(const ExtensionId& id, const PingResult& ping_result);\n#endif\n"
  count: 1
