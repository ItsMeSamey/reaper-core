substitutions:
- description: Declare Android build configuration directly.
  regex:
    pattern: '#include "build/branding_buildflags.h"

      '
    replace: '#include "build/branding_buildflags.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Do not collect optional Google brand on Android.
  regex:
    pattern: '#if BUILDFLAG(GOOGLE_CHROME_BRANDING)

      '
    replace: '#if BUILDFLAG(GOOGLE_CHROME_BRANDING) && !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Do not configure Android optional ping domain.
  regex:
    pattern: '  downloader->set_ping_enabled_domain("google.com");

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  downloader->set_ping_enabled_domain(\"google.com\");\n#endif\n"
  count: 1
