substitutions:
  - description: |
      Skip the startup check when Brave auto-update is disabled.

      Fold the feature check into the first if's condition inside Start(),
      rather than hoisting it to the top of the function: `alive_ = true`
      (and the DCHECKs above it) must still run even when the feature is
      disabled, per BraveExtensionAutoUpdateDisabledNextCheck in
      extension_updater_unittest.cc.
    regex:
      re_pattern: '(ExtensionUpdater::Start\(\) \{.*?if \()([^)]*)(\))'
      re_flags: [DOTALL]
      replace: |-
        \1\2 && base::FeatureList::IsEnabled(
                extensions::features::kBraveAutoUpdateExtensions)\3

  - description: |
      Skip individual scheduled update checks when Brave auto-update is
      disabled.
    preempt_function_impl:
      function_name: ExtensionUpdater::NextCheck
      return_if: |-
        !base::FeatureList::IsEnabled(
            extensions::features::kBraveAutoUpdateExtensions)
  - description: Exclude Android activity/rollcall age calculators.
    regex:
      pattern: "// When we've computed a days value, we want to make sure we don't send a\n// negative value (due to the system\
        \ clock being set backwards, etc.), since -1\n// is a special sentinel value that means \"never pinged\", and other\
        \ negative\n// values don't make sense.\nint SanitizeDays(int days) {\n  return days < 0 ? 0 : days;\n}\n\n// Calculates\
        \ the value to use for the ping days parameter.\nint CalculatePingDaysForExtension(const base::Time& last_ping_day)\
        \ {\n  int days = extensions::ManifestFetchData::kNeverPinged;\n  if (!last_ping_day.is_null()) {\n    days = SanitizeDays((base::Time::Now()\
        \ - last_ping_day).InDays());\n  }\n  return days;\n}\n\nint CalculateActivePingDays(const base::Time& last_active_ping_day,\n\
        \                            bool hasActiveBit) {\n  if (!hasActiveBit) {\n    return 0;\n  }\n  if (last_active_ping_day.is_null())\
        \ {\n    return extensions::ManifestFetchData::kNeverPinged;\n  }\n  return SanitizeDays((base::Time::Now() - last_active_ping_day).InDays());\n\
        }\n\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n// When we've computed a days value, we want to make sure we don't send a\n// negative\
        \ value (due to the system clock being set backwards, etc.), since -1\n// is a special sentinel value that means \"\
        never pinged\", and other negative\n// values don't make sense.\nint SanitizeDays(int days) {\n  return days < 0 ? 0\
        \ : days;\n}\n\n// Calculates the value to use for the ping days parameter.\nint CalculatePingDaysForExtension(const\
        \ base::Time& last_ping_day) {\n  int days = extensions::ManifestFetchData::kNeverPinged;\n  if (!last_ping_day.is_null())\
        \ {\n    days = SanitizeDays((base::Time::Now() - last_ping_day).InDays());\n  }\n  return days;\n}\n\nint CalculateActivePingDays(const\
        \ base::Time& last_active_ping_day,\n                            bool hasActiveBit) {\n  if (!hasActiveBit) {\n    return\
        \ 0;\n  }\n  if (last_active_ping_day.is_null()) {\n    return extensions::ManifestFetchData::kNeverPinged;\n  }\n \
        \ return SanitizeDays((base::Time::Now() - last_active_ping_day).InDays());\n}\n\n#endif\n"
    count: 1
  - description: Preserve ordinary callback without Android optional pref mutation.
    regex:
      pattern: '  UpdatePingData(id, ping);

        '
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  UpdatePingData(id, ping);\n#endif\n"
    count: 1
  - description: Preserve ordinary callback without Android optional pref mutation.
    regex:
      pattern: '  UpdatePingData(file.extension_id, ping);

        '
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  UpdatePingData(file.extension_id, ping);\n#endif\n"
    count: 1
  - description: Return no Android activity data without reading preferences.
    regex:
      pattern: "bool ExtensionUpdater::GetPingDataForExtension(const ExtensionId& id,\n                                    \
        \           DownloadPingData* ping_data) {\n  DCHECK(alive_);\n  ping_data->rollcall_days =\n      CalculatePingDaysForExtension(extension_prefs_->LastPingDay(id));\n\
        \  ping_data->is_enabled = registrar_->IsExtensionEnabled(id);\n  if (!ping_data->is_enabled) {\n    ping_data->disable_reasons\
        \ = extension_prefs_->GetDisableReasons(id);\n  }\n  ping_data->active_days =\n      CalculateActivePingDays(extension_prefs_->LastActivePingDay(id),\n\
        \                              extension_prefs_->GetActiveBit(id));\n  return true;\n}\n"
      replace: "bool ExtensionUpdater::GetPingDataForExtension(const ExtensionId& id,\n                                    \
        \           DownloadPingData* ping_data) {\n#if BUILDFLAG(IS_ANDROID)\n  return false;\n#else\n  DCHECK(alive_);\n \
        \ ping_data->rollcall_days =\n      CalculatePingDaysForExtension(extension_prefs_->LastPingDay(id));\n  ping_data->is_enabled\
        \ = registrar_->IsExtensionEnabled(id);\n  if (!ping_data->is_enabled) {\n    ping_data->disable_reasons = extension_prefs_->GetDisableReasons(id);\n\
        \  }\n  ping_data->active_days =\n      CalculateActivePingDays(extension_prefs_->LastActivePingDay(id),\n         \
        \                     extension_prefs_->GetActiveBit(id));\n  return true;\n#endif\n}\n"
    count: 1
  - description: Exclude Android activity-bit/last-ping pref mutation implementation.
    regex:
      pattern: "void ExtensionUpdater::UpdatePingData(const ExtensionId& id,\n                                      const PingResult&\
        \ ping_result) {\n  DCHECK(alive_);\n  if (ping_result.did_ping) {\n    extension_prefs_->SetLastPingDay(id, ping_result.day_start);\n\
        \  }\n  if (extension_prefs_->GetActiveBit(id)) {\n    extension_prefs_->SetActiveBit(id, false);\n    extension_prefs_->SetLastActivePingDay(id,\
        \ ping_result.day_start);\n  }\n}\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid ExtensionUpdater::UpdatePingData(const ExtensionId& id,\n                 \
        \                     const PingResult& ping_result) {\n  DCHECK(alive_);\n  if (ping_result.did_ping) {\n    extension_prefs_->SetLastPingDay(id,\
        \ ping_result.day_start);\n  }\n  if (extension_prefs_->GetActiveBit(id)) {\n    extension_prefs_->SetActiveBit(id,\
        \ false);\n    extension_prefs_->SetLastActivePingDay(id, ping_result.day_start);\n  }\n}\n#endif\n"
    count: 1
