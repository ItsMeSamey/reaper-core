- description: No Android optional-report URL, including a custom extension update endpoint
  regex:
    pattern: "std::vector<GURL> ChromeUpdateClientConfig::PingUrl() const {\n  DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);\n\
      \  if (url_override_.has_value()) {\n    return {*url_override_};\n  }\n  return impl_.PingUrl();\n}\n"
    replace: "std::vector<GURL> ChromeUpdateClientConfig::PingUrl() const {\n  DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);\n\
      #if BUILDFLAG(IS_ANDROID)\n  return {};\n#else\n  if (url_override_.has_value()) {\n    return {*url_override_};\n \
      \ }\n  return impl_.PingUrl();\n#endif\n}\n"
