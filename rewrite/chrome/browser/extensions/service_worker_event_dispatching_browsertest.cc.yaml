    re_pattern: "\\ \\ histogram_tester\\.ExpectTotalCount\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.Events\\.DispatchToAckTime\\.ExtensionServiceWorker2\",\\\n\\ \\ \\ \\ \\ \\ /\\*expected_count=\\*/1\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histogram_tester.ExpectTotalCount(\n      \"Extensions.Events.DispatchToAckTime.ExtensionServiceWorker2\",\n      /*expected_count=*/0);\n#else\n  histogram_tester.ExpectTotalCount(\n      \"Extensions.Events.DispatchToAckTime.ExtensionServiceWorker2\",\n      /*expected_count=*/1);\n#endif\n"
  count: 4
