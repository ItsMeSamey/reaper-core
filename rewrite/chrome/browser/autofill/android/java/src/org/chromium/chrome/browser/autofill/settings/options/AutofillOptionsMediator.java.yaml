substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ void\ destroy\(\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(mReauthenticatorBridge\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mReauthenticatorBridge\.destroy\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ mReauthenticatorBridge\ =\ null;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ isAutofillAiVisible\(@AutofillOptionsReferrer\
      int\ referrer\)\ \{\

      \ \ \ \ \ \ \ \ //\ Autofill\ AI\ related\ preferences\ are\ not\ shown\ if\
      the\ fragment\ is\ opened\ using\ a\ deep\

      \ \ \ \ \ \ \ \ //\ link\ to\ show\ only\ the\ 3p\ Autofill\ services\ toggle\.\

      \ \ \ \ \ \ \ \ return\ referrer\ !=\ AutofillOptionsReferrer\.DEEP_LINK_TO_SETTINGS\
      \&\&\ isAutofillAiEnabled\(\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ static\ boolean\ isAutofillAiEnabled\(\)\ \{\

      \ \ \ \ \ \ \ \ //\ LINT\.IfChange\(AutofillEnabledCheckMediator\)\

      \ \ \ \ \ \ \ \ return\ ChromeFeatureList\.isEnabled\(ChromeFeatureList\.AUTOFILL_AI_WITH_DATA_SCHEMA\);\

      \ \ \ \ \ \ \ \ //\ LINT\.ThenChange\(AutofillEnabledCheckFragment\)\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ static\ boolean\ isAutofillAiReauthEnabled\(\)\
      \{\

      \ \ \ \ \ \ \ \ return\ ChromeFeatureList\.isEnabled\(ChromeFeatureList\.AUTOFILL_AI_REAUTH_REQUIRED\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ isAutofillAiReauthToggleVisible\(int\ referrer\)\
      \{\

      \ \ \ \ \ \ \ \ return\ isAutofillAiVisible\(referrer\)\ \&\&\ isAutofillAiReauthEnabled\(\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ isEligibleToAutofillAi\(\)\ \{\

      \ \ \ \ \ \ \ \ EntityDataManager\ manager\ =\ EntityDataManagerFactory\.getForProfile\(mProfile\);\

      \ \ \ \ \ \ \ \ return\ isAutofillAiEnabled\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ manager\.isEligibleToAutofillAi\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !prefs\(\)\.getBoolean\(Pref\.AUTOFILL_USING_PLATFORM_AUTOFILL\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ isAutofillAiOn\(\)\ \{\

      \ \ \ \ \ \ \ \ EntityDataManager\ manager\ =\ EntityDataManagerFactory\.getForProfile\(mProfile\);\

      \ \ \ \ \ \ \ \ return\ isAutofillAiEnabled\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ manager\.getAutofillAiOptInStatus\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ isEligibleToAutofillAi\(\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ void\ onAutofillAiSettingToggled\(boolean\ isOn\)\
      \{\

      \ \ \ \ \ \ \ \ @AutofillAiOptInStatus\

      \ \ \ \ \ \ \ \ int\ optInStatus\ =\ isOn\ \?\ AutofillAiOptInStatus\.OPTED_IN\
      :\ AutofillAiOptInStatus\.OPTED_OUT;\

      \ \ \ \ \ \ \ \ EntityDataManager\ manager\ =\ EntityDataManagerFactory\.getForProfile\(mProfile\);\

      \ \ \ \ \ \ \ \ if\ \(!manager\.setAutofillAiOptInStatus\(optInStatus\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ If\ failed\ to\ set,\ reset\ the\ switch\ to\ match\
      current\ status\.\

      \ \ \ \ \ \ \ \ \ \ \ \ mModel\.set\(AutofillOptionsProperties\.AUTOFILL_AI_SETTING_ON,\
      isAutofillAiOn\(\)\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ isPersonalContextOn\(\)\ \{\

      \ \ \ \ \ \ \ \ EntityDataManager\ manager\ =\ EntityDataManagerFactory\.getForProfile\(mProfile\);\

      \ \ \ \ \ \ \ \ return\ manager\.isPersonalContextEnabled\(\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ void\ onPersonalContextToggleStatusChanged\(boolean\
      enabled\)\ \{\

      \ \ \ \ \ \ \ \ EntityDataManager\ manager\ =\ EntityDataManagerFactory\.getForProfile\(mProfile\);\

      \ \ \ \ \ \ \ \ manager\.setPersonalContextEnabled\(enabled\);\

      \ \ \ \ \ \ \ \ mModel\.set\(PERSONAL_CONTEXT_ENABLED,\ enabled\);\

      \ \ \ \ \ \ \ \ RecordUserAction\.record\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ enabled\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ AutofillPersonalContextFragment\.ACTION_TOGGLED_ON\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ AutofillPersonalContextFragment\.ACTION_TOGGLED_OFF\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ void\ onManageConnectedAppsClicked\(\)\ \{\

      \ \ \ \ \ \ \ \ mCustomTabLauncher\.openUrlInCct\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mContext,\ EntityDataManager\.getPersonalContextManageConnectedAppsUrl\(\)\);\

      \ \ \ \ \ \ \ \ RecordUserAction\.record\(AutofillPersonalContextFragment\.ACTION_MANAGE_CONNECTED_APPS\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ isPersonalContextVisible\(\)\ \{\

      \ \ \ \ \ \ \ \ return\ AutofillOptionsFragment\.shouldShowPersonalContext\(mProfile\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ isAutofillAiReauthOn\(\)\ \{\

      \ \ \ \ \ \ \ \ return\ prefs\(\)\.getBoolean\(Pref\.AUTOFILL_AI_REAUTH_BEFORE_VIEWING_SENSITIVE_DATA\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ private\ void\ onAutofillAiReauthSettingToggled\(boolean\
      isOn\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(isOn\ ==\ isAutofillAiReauthOn\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ if\ \(mReauthenticatorBridge\ ==\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mReauthenticatorBridge\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ReauthenticatorBridge\.create\(mActivity,\
      mProfile,\ DeviceAuthSource\.AUTOFILL\);\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ if\ \(mReauthenticatorBridge\.getBiometricAvailabilityStatus\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ==\ BiometricStatus\.UNAVAILABLE\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ prefs\(\)\.setBoolean\(Pref\.AUTOFILL_AI_REAUTH_BEFORE_VIEWING_SENSITIVE_DATA,\
      isOn\);\

      \ \ \ \ \ \ \ \ \ \ \ \ mModel\.set\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillOptionsProperties\.AUTOFILL_AI_REAUTH_SETTING_ON,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isAutofillAiReauthOn\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ mReauthenticatorBridge\.reauthenticate\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(success\)\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(success\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ prefs\(\)\.setBoolean\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ Pref\.AUTOFILL_AI_REAUTH_BEFORE_VIEWING_SENSITIVE_DATA,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \
      \ \ isOn\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ Always\ sync\ the\ model\ to\ either\
      the\ new\ value\ or\ back\ to\ the\ old\ one\ on\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ failure\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mModel\.set\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillOptionsProperties\.AUTOFILL_AI_REAUTH_SETTING_ON,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isAutofillAiReauthOn\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Returns\ the\ fragment''s\ title\ to\ display\ depending\ on\
      the\ enabled\ state\ of\ Autofill\ AI\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ <p>TODO:\ crbug\.com/467563385\ \-\ Make\ the\ method\ private\
      and\ the\ class\ package\-private\ once\ the\

      \ \ \ \ \ \*\ feature\ is\ launched\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ context\ The\ application\ context\ to\ use\ to\ construct\
      the\ fragment''s\ title\.\

      \ \ \ \ \ \*\ @return\ The\ fragment''s\ title\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ static\ String\ getFragmentTitle\(Context\ context\)\ \{\

      \ \ \ \ \ \ \ \ return\ isAutofillAiEnabled\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ context\.getString\(R\.string\.autofill_settings_title\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ context\.getString\(R\.string\.autofill_options_title\);\

      \ \ \ \ \}'
    replace: "    /** Returns the title of the ordinary Autofill provider options\
      \ page. */\n    public static String getFragmentTitle(Context context) {\n \
      \       return context.getString(R.string.autofill_options_title);\n    }"
