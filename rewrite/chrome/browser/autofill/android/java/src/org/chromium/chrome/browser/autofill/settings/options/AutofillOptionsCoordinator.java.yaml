substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Match genuine four-argument ordinary mediator construction
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ restartRunnable,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mFragment\.getCustomTabLauncher\(\)\);'
    replace: '                        restartRunnable);'
- description: Remove AI-only reauth disposal; the real lifecycle observer still unregisters
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mMediator\.destroy\(\);\

      '
    replace: ''
- description: Match real referrer/context-only initializer
  regex:
    re_pattern: \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mFragment\.getReferrer\(\),\ mFragment\.getContext\(\),\
      mFragment\.getActivity\(\)\);
    replace: '                mFragment.getReferrer(), mFragment.getContext());'
