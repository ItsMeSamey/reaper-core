      \ \ \ \ \ \ \ \ ChromeSwitchPreference\ autofillAiAuthenticationSwitch\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ findPreference\(PREF_AUTOFILL_AI_AUTHENTICATION_SWITCH\);\

      \ \ \ \ \ \ \ \ assert\ autofillAiAuthenticationSwitch\ !=\ null;\

      \ \ \ \ \ \ \ \ return\ autofillAiAuthenticationSwitch;\

