- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ ChromeSwitchPreference\ getAutofillAiSwitch\(\)\ \{\

      \ \ \ \ \ \ \ \ ChromeSwitchPreference\ autofillAiSwitch\ =\ findPreference\(PREF_AUTOFILL_AI_SWITCH\);\

      \ \ \ \ \ \ \ \ assert\ autofillAiSwitch\ !=\ null;\

      \ \ \ \ \ \ \ \ return\ autofillAiSwitch;\

      \ \ \ \ \}'
    replace: ''
- description: Remove the actual optional AI API/body, retaining normal Autofill behavior
  regex:
    re_pattern: '\ \ \ \ ChromeSwitchPreference\ getAutofillAiAuthenticationSwitch\(\)\
