# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/autofill/android/java/res/values/dimens.xml'
  regex:
    re_pattern: '\ \ \ \ <dimen\ name="keyboard_accessory_suggestion_icon_size">20dp</dimen>\

      \

      \ \ \ \ <!\-\-\ Autofill\ AI\ preference\ dimensions\ \-\->\

      \ \ \ \ <dimen\ name="autofill_ai_preference_info_item_icon_size">20dp</dimen>\

      \ \ \ \ <dimen\ name="autofill_ai_preference_info_item_icon_padding">16dp</dimen>\

      \

      \ \ \ \ <!\-\-\ Autofill\ Personal\ Context\ dimensions\ \-\->\

      \ \ \ \ <dimen\ name="autofill_personal_context_settings_notice_icon_size">18dp</dimen>\

      '
    replace: "    <dimen name=\"keyboard_accessory_suggestion_icon_size\">20dp</dimen>\n\n    <!-- Autofill AI preference dimensions -->\n\n    <!-- Autofill Personal Context dimensions -->\n    <dimen name=\"autofill_personal_context_settings_notice_icon_size\">18dp</dimen>\n"
- {"description":"Android PersonalContext/AtMemory selected-provider omission","regex":{"re_pattern":"\\ \\ \\ \\ <!\\-\\-\\ Keyboard\\ Accessory\\ \\-\\->\\\n\\ \\ \\ \\ <dimen\\ name=\"keyboard_accessory_suggestion_icon_size\">20dp</dimen>\\\n\\\n\\ \\ \\ \\ <!\\-\\-\\ Autofill\\ AI\\ preference\\ dimensions\\ \\-\\->\\\n\\\n\\ \\ \\ \\ <!\\-\\-\\ Autofill\\ Personal\\ Context\\ dimensions\\ \\-\\->\\\n\\ \\ \\ \\ <dimen\\ name=\"autofill_personal_context_settings_notice_icon_size\">18dp</dimen>\\\n\\ \\ \\ \\ <dimen\\ name=\"autofill_personal_context_settings_notice_icon_padding\">16dp</dimen>\\\n\\ \\ \\ \\ <dimen\\ name=\"autofill_personal_context_settings_notice_item_margin_bottom\">16dp</dimen>\\\n\\ \\ \\ \\ <dimen\\ name=\"autofill_personal_context_settings_notice_vertical_padding\">16dp</dimen>\\\n</resources>\\\n","replace":"    <!-- Keyboard Accessory -->\n    <dimen name=\"keyboard_accessory_suggestion_icon_size\">20dp</dimen>\n\n    <!-- Autofill AI preference dimensions -->\n\n    <!-- Autofill Personal Context dimensions -->\n</resources>\n"},"count":1}
- description: Remove only three unused entity-prompt dimensions; preserve ordinary dimensions.
  regex:
    pattern: "    <dimen name=\"autofill_entity_attribute_top_padding\">12dp</dimen>\n    <dimen name=\"autofill_entity_prompt_edit_icon_size\"\
      >24dp</dimen>\n    <dimen name=\"autofill_entity_prompt_edit_icon_top_padding\">24dp</dimen>\n\n    <!-- Keyboard Accessory\
      \ -->\n"
    replace: "\n    <!-- Keyboard Accessory -->\n"
  count: 1
