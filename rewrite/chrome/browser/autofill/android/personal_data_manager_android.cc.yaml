# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: 'bool\ PersonalDataManagerAndroid::\

      \ \ \ \ IsAutofillAmountExtractionAiTermsSeenPrefEnabled\(\)\ \{\

      \ \ return\ payments_data_manager\(\)\

      \ \ \ \ \ \ \.IsAutofillAmountExtractionAiTermsSeenPrefEnabled\(\);\

      \}\

      \

      '
    replace: ''
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ IsAutofillTypeDisabledByEnterprisePolicy\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ static_cast<int>\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillClient::AutofillPolicyDataCategory::kPayments\)\);\

      '
    replace: "         IsAutofillTypeDisabledByEnterprisePolicy(static_cast<int>(\n             AutofillClient::AutofillPolicyDataCategory::kPayments));\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ IsAutofillTypeDisabledByEnterprisePolicy\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ static_cast<int>\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillClient::AutofillPolicyDataCategory::kContactInfo\)\);\

      '
    replace: "         IsAutofillTypeDisabledByEnterprisePolicy(static_cast<int>(\n             AutofillClient::AutofillPolicyDataCategory::kContactInfo));\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ :\ weak_java_obj_\(env,\ obj\),\

      \ \ \ \ \ \ prefs_\(prefs\)\ \{\

      '
    replace: '    : weak_java_obj_(env, obj), prefs_(prefs) {

      '
