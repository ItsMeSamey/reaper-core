      \ mDateFieldView.getFieldModel().get(VALUE));\n        verify(mValueChangedCallback).onResult(leapDate.toString());\n\
      \n        setDropdownValue(mDateFieldView.getDayPickerForTest(), \"28\");\n        String validDate = LocalDate.of(year\
      \ + 1, 2, 28).toString();\n        assertTrue(mDateFieldView.getFieldModel().get(DATE_VALID));\n        assertEquals(validDate,\
      \ mDateFieldView.getFieldModel().get(VALUE));\n        verify(mValueChangedCallback).onResult(validDate);\n    }\n}\n"
