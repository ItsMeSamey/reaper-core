    replace: "    }\n\n    @Test\n    @EnableFeatures(\"AutofillAiUseMaterialDatePickerInEntityEditor\")\n    public void\
      \ testOrdinaryDateFieldWorksWithFormerAiPickerFlagEnabled() {\n        mDateFieldView =\n                new DateFieldView(\n\
      \                        mActivity, mActivity.getSupportFragmentManager(), getDateFieldModel(null));\n        assertNotNull(mDateFieldView.getMonthPickerForTest());\n\
      \        assertNotNull(mDateFieldView.getDayPickerForTest());\n        assertNotNull(mDateFieldView.getYearPickerForTest());\n\
      \        mDateFieldView.setLabel(\"Ordinary date\", /* isRequired= */ true);\n        TextView label = mDateFieldView.findViewById(R.id.date_field_label);\n\
      \        assertEquals(\"Ordinary date\" + FieldView.REQUIRED_FIELD_INDICATOR, label.getText());\n\n        LocalDate\
      \ date = LocalDate.now();\n        setDropdownDate(mDateFieldView, date.getMonthValue(), date.getDayOfMonth(), date.getYear());\n\
      \        assertEquals(date.toString(), mDateFieldView.getFieldModel().get(VALUE));\n        assertTrue(mDateFieldView.validate());\n\
      \        verify(mValueChangedCallback).onResult(date.toString());\n        assertNull(mActivity.getSupportFragmentManager().findFragmentByTag(\"\
      MaterialDatePicker\"));\n    }\n\n    @Test\n    public void testLeapDateSelectionPreservesValueUntilCalendarDateIsValid()\
      \ {\n        int year = LocalDate.now().getYear();\n        while (!LocalDate.of(year, 1, 1).isLeapYear()) {\n     \
      \       year++;\n        }\n        LocalDate leapDate = LocalDate.of(year, 2, 29);\n        mDateFieldView =\n    \
      \            new DateFieldView(\n                        mActivity,\n                        mActivity.getSupportFragmentManager(),\n\
      \                        getDateFieldModel(leapDate));\n        assertTrue(mDateFieldView.getFieldModel().get(DATE_VALID));\n\
      \        assertEquals(\"29\", mDateFieldView.getDayPickerForTest().getDropdown().getSelectedItem());\n\n        setDropdownValue(mDateFieldView.getYearPickerForTest(),\
