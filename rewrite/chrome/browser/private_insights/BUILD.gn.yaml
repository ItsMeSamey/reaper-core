substitutions:
- description: Define dedicated Private Insights targets only outside Android; preserve original target bodies
  regex:
    pattern: "# Copyright 2026 The Chromium Authors\n# Use of this source code is governed by a BSD-style license that can\
      \ be\n# found in the LICENSE file.\n\nimport(\"//build/config/sanitizers/sanitizers.gni\")\n\nsource_set(\"private_insights\"\
      ) {\n  sources = [\n    \"private_insights_service_factory.cc\",\n    \"private_insights_service_factory.h\",\n  ]\n\
      \  public_deps = [\n    \"//base\",\n    \"//chrome/browser/profiles:profile\",\n    \"//content/public/browser\",\n\
      \  ]\n  deps = [\n    \"//base:fuzzing_buildflags\",\n    \"//chrome/browser:browser_process\",\n  ]\n\n  # FCP cannot\
      \ be linked with libprotobuf-mutator used when fuzzing, because\n  # of ODR violations related to any.proto.  This can\
      \ get removed when we stop\n  # using libprotobuf-mutator or it stops being linked with this target.\n  if (!use_fuzzing_engine)\
      \ {\n    public_deps += [ \"//components/private_insights\" ]\n  }\n}\n"
    replace: "# Copyright 2026 The Chromium Authors\n# Use of this source code is governed by a BSD-style license that can\
      \ be\n# found in the LICENSE file.\n\nimport(\"//build/config/sanitizers/sanitizers.gni\")\n\nif (!is_android) {\n \
      \ source_set(\"private_insights\") {\n    sources = [\n      \"private_insights_service_factory.cc\",\n      \"private_insights_service_factory.h\"\
      ,\n    ]\n    public_deps = [\n      \"//base\",\n      \"//chrome/browser/profiles:profile\",\n      \"//content/public/browser\"\
      ,\n    ]\n    deps = [\n      \"//base:fuzzing_buildflags\",\n      \"//chrome/browser:browser_process\",\n    ]\n\n\
      \    # FCP cannot be linked with libprotobuf-mutator used when fuzzing, because\n    # of ODR violations related to\
      \ any.proto.  This can get removed when we stop\n    # using libprotobuf-mutator or it stops being linked with this\
      \ target.\n    if (!use_fuzzing_engine) {\n      public_deps += [ \"//components/private_insights\" ]\n    }\n  }\n\
      }\n"
  count: 1
