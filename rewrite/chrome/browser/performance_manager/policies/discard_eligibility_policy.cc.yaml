# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/performance_manager/policies/discard_eligibility_policy.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/performance_manager/policies/discard_eligibility_policy\.h"\

      \

      \#include\ "base/metrics/histogram_functions\.h"\

      \#include\ "base/strings/strcat\.h"\

      \#include\ "chrome/browser/glic/public/glic_keyed_service\.h"\

      \#include\ "chrome/browser/glic/public/glic_keyed_service_factory\.h"\

      \#include\ "chrome/browser/glic/public/service/glic_instance_coordinator\.h"\

      \#include\ "chrome/common/buildflags\.h"\

      \#include\ "components/performance_manager/graph/page_node_impl\.h"\

      \#include\ "components/performance_manager/public/decorators/page_live_state_decorator\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/performance_manager/policies/discard_eligibility_policy.h"

      #include "build/build_config.h"


      #include "base/metrics/histogram_functions.h"

      #include "base/strings/strcat.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/public/glic_keyed_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/public/glic_keyed_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/public/service/glic_instance_coordinator.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/common/buildflags.h"

      #include "components/performance_manager/graph/page_node_impl.h"

      #include "components/performance_manager/public/decorators/page_live_state_decorator.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/performance_manager/policies/discard_eligibility_policy.cc'
  regex:
    re_pattern: '\ \ \}\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      \

      \ \ if\ \(live_state_data\ \&\&\ is_proactive_or_suggested\ \&\&\

      \ \ \ \ \ \ live_state_data\->IsGlicPinnedToVisibleInstance\(\)\)\ \{\

      \ \ \ \ add_reason_and_update_result\(CannotDiscardReason::kGlicShared,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ CanDiscardResult::kProtected\);\

      \ \ \}\

      \

      \ \ //\ Only\ discard\ http\(s\)\ pages\ and\ internal\ pages\ to\ make\ sure\ that\ we\ don''t\

      \ \ //\ discard\ extensions\ or\ other\ PageNode\ that\ don''t\ correspond\ to\ a\ tab\.\

      '
    replace: "  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if !BUILDFLAG(IS_ANDROID)\n  if (live_state_data && is_proactive_or_suggested &&\n      live_state_data->IsGlicPinnedToVisibleInstance()) {\n    add_reason_and_update_result(CannotDiscardReason::kGlicShared,\n                                 CanDiscardResult::kProtected);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  // Only discard http(s) pages and internal pages to make sure that we don't\n  // discard extensions or other PageNode that don't correspond to a tab.\n"
