# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/performance_manager/decorators/helpers/page_live_state_decorator_helper.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/performance_manager/decorators/helpers/page_live_state_decorator_helper\.h"\

      \

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "base/scoped_observation\.h"\

      \#include\ "chrome/browser/glic/public/glic_perf_traits_tracker\.h"\

      \#include\ "chrome/browser/media/webrtc/media_capture_devices_dispatcher\.h"\

      \#include\ "components/performance_manager/public/decorators/page_live_state_decorator\.h"\

      \#include\ "components/performance_manager/public/features\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/performance_manager/decorators/helpers/page_live_state_decorator_helper.h"

      #include "build/build_config.h"


      #include "base/memory/raw_ptr.h"

      #include "base/scoped_observation.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/public/glic_perf_traits_tracker.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/media/webrtc/media_capture_devices_dispatcher.h"

      #include "components/performance_manager/public/decorators/page_live_state_decorator.h"

      #include "components/performance_manager/public/features.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/performance_manager/decorators/helpers/page_live_state_decorator_helper.cc'
  regex:
    re_pattern: '\

      \ \ content::DevToolsAgentHost::AddObserver\(this\);\

      \

      \ \ glic_perf_traits_observation_\.Observe\(\

      \ \ \ \ \ \ glic::GlicPerfTraitsTracker::GetInstance\(\)\);\

      \}\

      \

      PageLiveStateDecoratorHelper::\~PageLiveStateDecoratorHelper\(\)\ \{\

      '
    replace: "\n  content::DevToolsAgentHost::AddObserver(this);\n\n#if !BUILDFLAG(IS_ANDROID)\n  glic_perf_traits_observation_.Observe(\n      glic::GlicPerfTraitsTracker::GetInstance());\n#endif  // !BUILDFLAG(IS_ANDROID)\n}\n\nPageLiveStateDecoratorHelper::~PageLiveStateDecoratorHelper() {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/performance_manager/decorators/helpers/page_live_state_decorator_helper.cc'
  regex:
    re_pattern: '\ \ new\ WebContentsObserver\(web_contents,\ this\);\

      \}\

      \

      void\ PageLiveStateDecoratorHelper::OnGlicActuationStateChanged\(\

      \ \ \ \ content::WebContents\*\ web_contents,\

      \ \ \ \ GlicActuationState\ state\)\ \{\

      '
    replace: "  new WebContentsObserver(web_contents, this);\n}\n\n#if !BUILDFLAG(IS_ANDROID)\nvoid PageLiveStateDecoratorHelper::OnGlicActuationStateChanged(\n    content::WebContents* web_contents,\n    GlicActuationState state) {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/performance_manager/decorators/helpers/page_live_state_decorator_helper.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ web_contents,\ is_pinned_to_visible\);\

      \}\

      \

      \}\ \ //\ namespace\ performance_manager\

      '
    replace: '      web_contents, is_pinned_to_visible);

      }


      #endif  // !BUILDFLAG(IS_ANDROID)


      }  // namespace performance_manager

      '
