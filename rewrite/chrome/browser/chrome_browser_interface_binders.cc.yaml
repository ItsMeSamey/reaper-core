# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_interface_binders.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/chrome_browser_interface_binders\.h"\

      \

      \#include\ <utility>\

      \

      \#include\ "base/feature_list\.h"\

      \#include\ "base/functional/bind\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "build/chromeos_buildflags\.h"\

      \#include\ "chrome/browser/accessibility/accessibility_labels_service\.h"\

      \#include\ "chrome/browser/accessibility/accessibility_labels_service_factory\.h"\

      \#include\ "chrome/browser/actor/actor_script_tool_receiver\.h"\

      \#include\ "chrome/browser/buildflags\.h"\

      \#include\ "chrome/browser/dom_distiller/dom_distiller_service_factory\.h"\

      \#include\ "chrome/browser/geic/geic_host\.h"\

      \#include\ "chrome/browser/glic/host/glic_page_handler\.h"\

      \#include\ "chrome/browser/glic/host/guest_util\.h"\

      \#include\ "chrome/browser/glic/public/features\.h"\

      \#include\ "chrome/browser/navigation_predictor/navigation_predictor\.h"\

      \#include\ "chrome/browser/optimization_guide/optimization_guide_keyed_service\.h"\

      \#include\ "chrome/browser/optimization_guide/optimization_guide_keyed_service_factory\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/chrome_browser_interface_binders.h"

      #include "build/build_config.h"


      #include <utility>


      #include "base/feature_list.h"

      #include "base/functional/bind.h"

      #include "build/chromeos_buildflags.h"

      #include "chrome/browser/accessibility/accessibility_labels_service.h"

      #include "chrome/browser/accessibility/accessibility_labels_service_factory.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/actor_script_tool_receiver.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/buildflags.h"

      #include "chrome/browser/dom_distiller/dom_distiller_service_factory.h"

      #include "chrome/browser/geic/geic_host.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/host/glic_page_handler.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/host/guest_util.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/public/features.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/navigation_predictor/navigation_predictor.h"

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service.h"

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service_factory.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_interface_binders.cc'
  regex:
    re_pattern: 'void\ PopulateChromeFrameBinders\(\

      \ \ \ \ mojo::BinderMapWithContext<content::RenderFrameHost\*>\*\ map,\

      \ \ \ \ content::RenderFrameHost\*\ render_frame_host\)\ \{\

      \ \ map\->Add<glic::mojom::WebClientHandler>\(\&glic::BindGlicWebClientHandler\);\

      \ \ //\ Defense\ in\ depth:\ privileged\ capability\ interfaces\ are\ not\ even\ registered\

      \ \ //\ for\ a\ frame\ outside\ a\ privileged\ process,\ so\ a\ non\-PWC\ frame\ cannot\

      \ \ //\ request\ them\ at\ all\.\ The\ bind\-time\ gate\ \(pwc::EnforceCapabilityGate\)\

      '
    replace: "void PopulateChromeFrameBinders(\n    mojo::BinderMapWithContext<content::RenderFrameHost*>* map,\n    content::RenderFrameHost* render_frame_host) {\n#if !BUILDFLAG(IS_ANDROID)\n  map->Add<glic::mojom::WebClientHandler>(&glic::BindGlicWebClientHandler);\n#endif  // !BUILDFLAG(IS_ANDROID)\n  // Defense in depth: privileged capability interfaces are not even registered\n  // for a frame outside a privileged process, so a non-PWC frame cannot\n  // request them at all. The bind-time gate (pwc::EnforceCapabilityGate)\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_interface_binders.cc'
  regex:
    re_pattern: '\ \ \}\

      \ \ map\->Add<image_annotation::mojom::Annotator>\(\&BindImageAnnotator\);\

      \

      \ \ map\->Add<blink::mojom::ScriptToolHost>\(\

      \ \ \ \ \ \ \&actor::ActorScriptToolReceiver::Create\);\

      \

      \ \ map\->Add<blink::mojom::AnchorElementMetricsHost>\(\

      \ \ \ \ \ \ \&NavigationPredictor::Create\);\

      '
    replace: "  }\n  map->Add<image_annotation::mojom::Annotator>(&BindImageAnnotator);\n\n#if !BUILDFLAG(IS_ANDROID)\n  map->Add<blink::mojom::ScriptToolHost>(\n      &actor::ActorScriptToolReceiver::Create);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  map->Add<blink::mojom::AnchorElementMetricsHost>(\n      &NavigationPredictor::Create);\n"
- description: Exclude the GEIC host include from Android binder compilation
  regex:
    re_pattern: '\#include\ "chrome/browser/geic/geic_host\.h"\

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/geic/geic_host.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude GEIC API registration while retaining the generic PWC bridge
  regex:
    re_pattern: '\ \ \ \ map\->Add<geic::mojom::GeicApi>\(\&geic::BindGeicApi\);\

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    map->Add<geic::mojom::GeicApi>(&geic::BindGeicApi);\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android headers used only by the generative broker binder in this file
  regex:
    pattern: '#include "chrome/browser/optimization_guide/optimization_guide_keyed_service.h"

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service.h"

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android generated generative broker interface include
  regex:
    pattern: '#include "components/optimization_guide/public/mojom/model_broker.mojom.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/public/mojom/model_broker.mojom.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android keyed-service generative broker binder helper
  regex:
    pattern: "void BindModelBroker(\n    content::RenderFrameHost* frame_host,\n    mojo::PendingReceiver<optimization_guide::mojom::ModelBroker>\
      \ receiver) {\n  content::BrowserContext* browser_context = frame_host->GetBrowserContext();\n  Profile* profile = Profile::FromBrowserContext(browser_context);\n\
      \  OptimizationGuideKeyedService* optimization_guide_service =\n      OptimizationGuideKeyedServiceFactory::GetForProfile(profile);\n\
      \  if (optimization_guide_service) {\n    optimization_guide_service->BindModelBroker(std::move(receiver));\n  }\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid BindModelBroker(\n    content::RenderFrameHost* frame_host,\n    mojo::PendingReceiver<optimization_guide::mojom::ModelBroker>\
      \ receiver) {\n  content::BrowserContext* browser_context = frame_host->GetBrowserContext();\n  Profile* profile = Profile::FromBrowserContext(browser_context);\n\
      \  OptimizationGuideKeyedService* optimization_guide_service =\n      OptimizationGuideKeyedServiceFactory::GetForProfile(profile);\n\
      \  if (optimization_guide_service) {\n    optimization_guide_service->BindModelBroker(std::move(receiver));\n  }\n}\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android Chrome generative broker registration while preserving adjacent ordinary binders
  regex:
    pattern: '  map->Add<optimization_guide::mojom::ModelBroker>(&BindModelBroker);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  map->Add<optimization_guide::mojom::ModelBroker>(&BindModelBroker);\n#endif  //\
      \ !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude dedicated browser image-label service headers on Android
  regex:
    pattern: '#include "chrome/browser/accessibility/accessibility_labels_service.h"

      #include "chrome/browser/accessibility/accessibility_labels_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/accessibility/accessibility_labels_service.h"

      #include "chrome/browser/accessibility/accessibility_labels_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude dedicated image annotation protocol include on Android
  regex:
    pattern: '#include "services/image_annotation/public/mojom/image_annotation.mojom.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "services/image_annotation/public/mojom/image_annotation.mojom.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude the image annotator binder implementation on Android
  regex:
    pattern: "// Forward image Annotator requests to the profile's AccessibilityLabelsService.\nvoid BindImageAnnotator(\n\
      \    content::RenderFrameHost* frame_host,\n    mojo::PendingReceiver<image_annotation::mojom::Annotator> receiver)\
      \ {\n  AccessibilityLabelsServiceFactory::GetForProfile(\n      Profile::FromBrowserContext(\n          frame_host->GetProcess()->GetBrowserContext()))\n\
      \      ->BindImageAnnotator(std::move(receiver));\n}\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Forward image Annotator requests to the profile's AccessibilityLabelsService.\n\
      void BindImageAnnotator(\n    content::RenderFrameHost* frame_host,\n    mojo::PendingReceiver<image_annotation::mojom::Annotator>\
      \ receiver) {\n  AccessibilityLabelsServiceFactory::GetForProfile(\n      Profile::FromBrowserContext(\n          frame_host->GetProcess()->GetBrowserContext()))\n\
      \      ->BindImageAnnotator(std::move(receiver));\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude image annotator binder registration on Android
  regex:
    pattern: '  map->Add<image_annotation::mojom::Annotator>(&BindImageAnnotator);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  map->Add<image_annotation::mojom::Annotator>(&BindImageAnnotator);\n#endif  //\
      \ !BUILDFLAG(IS_ANDROID)\n"
  count: 1
