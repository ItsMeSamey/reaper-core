# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_content_browser_client_receiver_bindings.cc'
  regex:
    re_pattern: '//\ This\ file\ exposes\ services\ from\ the\ browser\ to\ child\ processes\.\

      \

      \#include\ "base/feature_list\.h"\

      \#include\ "base/functional/bind\.h"\

      \#include\ "base/metrics/histogram_functions\.h"\

      \#include\ "base/task/single_thread_task_runner\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/browser_process\.h"\

      \#include\ "chrome/browser/chrome_browser_interface_binders\.h"\

      \#include\ "chrome/browser/chrome_browser_interface_binders_webui\.h"\

      '
    replace: '// This file exposes services from the browser to child processes.


      #include "base/feature_list.h"

      #include "build/build_config.h"

      #include "base/functional/bind.h"

      #include "base/metrics/histogram_functions.h"

      #include "base/task/single_thread_task_runner.h"

      #include "chrome/browser/browser_process.h"

      #include "chrome/browser/chrome_browser_interface_binders.h"

      #include "chrome/browser/chrome_browser_interface_binders_webui.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_content_browser_client_receiver_bindings.cc'
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

      \#include\ "chrome/browser/badging/badge_manager\.h"\

      \#include\ "chrome/browser/indigo/onboarding/indigo_onboarding_dialog\.h"\

      \#include\ "chrome/browser/password_manager/remote_actor/remote_actor_credential_sharing_impl\.h"\

      \#include\ "chrome/browser/record_replay/chrome_record_replay_client\.h"\

      \#include\ "chrome/browser/ui/search/search_tab_helper\.h"\

      \#include\ "chrome/browser/ui/webui_browser/webui_browser_ui\.h"\

      \#include\ "chrome/common/indigo/indigo\.mojom\.h"\

      \#include\ "chrome/common/password_manager/remote_actor_credential_sharing_policy\.h"\

      \#include\ "components/record_replay/core/common/record_replay\.mojom\.h"\

      \#endif\

      \

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/badging/badge_manager.h"

      #include "chrome/browser/indigo/onboarding/indigo_onboarding_dialog.h"

      #if !BUILDFLAG(IS_ANDROID)

