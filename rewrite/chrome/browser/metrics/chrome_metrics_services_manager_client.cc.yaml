substitutions:
- description: "Preserve reviewed Android source projection for chrome/browser/metrics/chrome_metrics_services_manager_client.cc (operation 1)."
  regex:
    re_pattern: '\#include\ "cc/base/switches\.h"\

      \#include\ "chrome/browser/browser_process\.h"\

      \#include\ "chrome/browser/metrics/chrome_metrics_service_accessor\.h"\

      \#include\ "chrome/browser/metrics/chrome_metrics_service_client\.h"\

      \#include\ "chrome/browser/metrics/variations/chrome_variations_service_client\.h"\

      \#include\ "chrome/browser/net/system_network_context_manager\.h"\

      \#include\ "chrome/browser/ui/browser_otr_state\.h"\

      '
    replace: '#include "cc/base/switches.h"

      #include "chrome/browser/browser_process.h"

      #include "chrome/browser/metrics/chrome_metrics_service_accessor.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/metrics/chrome_metrics_service_client.h"

      #endif

      #include "chrome/browser/metrics/variations/chrome_variations_service_client.h"

      #include "chrome/browser/net/system_network_context_manager.h"

      #include "chrome/browser/ui/browser_otr_state.h"

      '
- description: "Preserve reviewed Android source projection for chrome/browser/metrics/chrome_metrics_services_manager_client.cc (operation 2)."
  regex:
    re_pattern: '\ \ \~ChromeEnabledStateProvider\(\)\ override\ =\ default;\

      \

      \ \ bool\ IsConsentGiven\(\)\ const\ override\ \{\

      \ \ \ \ return\ ChromeMetricsServiceAccessor::IsMetricsAndCrashReportingEnabled\(\

      \ \ \ \ \ \ \ \ local_state_\);\

      \ \ \}\

      \

      \ \ bool\ IsReportingEnabled\(\)\ const\ override\ \{\

      \ \ \ \ return\ metrics::EnabledStateProvider::IsReportingEnabled\(\)\ \&\&\

      \ \ \ \ \ \ \ \ \ \ \ IsClientInSampleImpl\(local_state_\);\

      \ \ \}\

      \

      \ private:\

      '
    replace: "  ~ChromeEnabledStateProvider() override = default;\n\n  bool IsConsentGiven() const override {\n#if BUILDFLAG(IS_ANDROID)\n    return false;\n#else\n    return ChromeMetricsServiceAccessor::IsMetricsAndCrashReportingEnabled(\n        local_state_);\n#endif\n  }\n\n  bool IsReportingEnabled() const override {\n#if BUILDFLAG(IS_ANDROID)\n    return false;\n#else\n    return metrics::EnabledStateProvider::IsReportingEnabled() &&\n           IsClientInSampleImpl(local_state_);\n#endif\n  }\n\n private:\n"
- description: "Preserve reviewed Android source projection for chrome/browser/metrics/chrome_metrics_services_manager_client.cc (operation 3)."
  regex:
    re_pattern: 'std::unique_ptr<metrics::MetricsServiceClient>\

      ChromeMetricsServicesManagerClient::CreateMetricsServiceClient\(\

      \ \ \ \ variations::SyntheticTrialRegistry\*\ synthetic_trial_registry\)\ \{\

      \ \ DCHECK_CALLED_ON_VALID_THREAD\(thread_checker_\);\

      \ \ return\ ChromeMetricsServiceClient::Create\(GetMetricsStateManager\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ synthetic_trial_registry\);\

      \}\

      \

      metrics::MetricsStateManager\*\

      '
    replace: "std::unique_ptr<metrics::MetricsServiceClient>\nChromeMetricsServicesManagerClient::CreateMetricsServiceClient(\n    variations::SyntheticTrialRegistry* synthetic_trial_registry) {\n#if BUILDFLAG(IS_ANDROID)\n  return nullptr;\n#else\n  DCHECK_CALLED_ON_VALID_THREAD(thread_checker_);\n  return ChromeMetricsServiceClient::Create(GetMetricsStateManager(),\n                                            synthetic_trial_registry);\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n\nmetrics::MetricsStateManager*\n"
