      //\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      //\ found\ in\ the\ LICENSE\ file\.\

      '
    replace: "#include \"build/build_config.h\"\n\n#if BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/metrics/metrics_reporting_state.h\"\n\n#include <utility>\n\n#include \"base/functional/bind.h\"\n#include \"base/task/single_thread_task_runner.h\"\n\nnamespace metrics {\nvoid ChangeMetricsReportingState(\n    bool enabled,\n    ChangeMetricsReportingStateCalledFrom called_from) {}\n\nvoid ChangeMetricsReportingStateWithReply(\n    bool enabled,\n    OnMetricsReportingCallbackType callback_fn,\n    ChangeMetricsReportingStateCalledFrom called_from) {\n  if (callback_fn) {\n    base::SingleThreadTaskRunner::GetCurrentDefault()->PostTask(\n        FROM_HERE, base::BindOnce(std::move(callback_fn), false));\n  }\n}\n\nvoid UpdateMetricsPrefsOnPermissionChange(\n    bool metrics_enabled,\n    ChangeMetricsReportingStateCalledFrom called_from) {}\nvoid ApplyMetricsReportingPolicy() {}\nbool IsMetricsReportingPolicyManaged() {\n  return false;\n}\nvoid ClearPreviouslyCollectedMetricsData() {}\n}  // namespace metrics\n#else\n// Copyright 2012 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n"
- description: "Preserve reviewed Android source projection for chrome/browser/metrics/metrics_reporting_state.cc (operation 2)."
  regex:
    re_pattern: '\

      void\ RecordMetricsReportingHistogramValue\(\

      \ \ \ \ MetricsReportingChangeHistogramValue\ value\)\ \{\

      \ \ UMA_HISTOGRAM_ENUMERATION\(\

      \ \ \ \ \ \ "UMA\.MetricsReporting\.Toggle",\ value,\ METRICS_REPORTING_MAX\);\

      \}\

      \

      //\ Tries\ to\ set\ metrics\ reporting\ status\ to\ \|enabled\|\ and\ returns\ whatever\ is\

      '
    replace: "\nvoid RecordMetricsReportingHistogramValue(\n    MetricsReportingChangeHistogramValue value) {\n  UMA_HISTOGRAM_ENUMERATION(\"UMA.MetricsReporting.Toggle\", value,\n                            METRICS_REPORTING_MAX);\n}\n\n// Tries to set metrics reporting status to |enabled| and returns whatever is\n"
- description: "Preserve reviewed Android source projection for chrome/browser/metrics/metrics_reporting_state.cc (operation 3)."
  regex:
    re_pattern: '\ \ g_browser_process\->GetMetricsServicesManager\(\)\->UpdateUploadPermissions\(\);\

      \

      \ \ if\ \(to_update_pref\ ==\ updated_pref\)\ \{\

      \ \ \ \ RecordMetricsReportingHistogramValue\(updated_pref\ \?\

      \ \ \ \ \ \ \ \ METRICS_REPORTING_ENABLED\ :\ METRICS_REPORTING_DISABLED\);\

      \ \ \}\ else\ \{\

      \ \ \ \ RecordMetricsReportingHistogramValue\(METRICS_REPORTING_ERROR\);\

      \ \ \}\

      '
    replace: "  g_browser_process->GetMetricsServicesManager()->UpdateUploadPermissions();\n\n  if (to_update_pref == updated_pref) {\n    RecordMetricsReportingHistogramValue(\n        updated_pref ? METRICS_REPORTING_ENABLED : METRICS_REPORTING_DISABLED);\n  } else {\n    RecordMetricsReportingHistogramValue(METRICS_REPORTING_ERROR);\n  }\n"
