substitutions:
- description: "Preserve reviewed Android source projection for chrome/browser/metrics/chrome_metrics_service_accessor.cc (operation 1)."
  regex:
    re_pattern: '\

      \#include\ <string_view>\

      \

      \#include\ "chrome/browser/browser_process\.h"\

      \#include\ "chrome/common/pref_names\.h"\

      \#include\ "components/metrics/metrics_service\.h"\

      \#include\ "components/prefs/pref_service\.h"\

      \#include\ "content/public/browser/browser_thread\.h"\

      \

      '
    replace: '

      #include <string_view>


      #include "build/build_config.h"

      #include "chrome/browser/browser_process.h"

      #include "chrome/common/pref_names.h"

      #include "components/metrics/metrics_service.h"

      #include "components/metrics_services_manager/metrics_services_manager.h"

      #include "components/prefs/pref_service.h"

      #include "content/public/browser/browser_thread.h"


      '
- description: "Preserve reviewed Android source projection for chrome/browser/metrics/chrome_metrics_service_accessor.cc (operation 2)."
  regex:
    re_pattern: '\ \ \ \ std::string_view\ trial_name,\

      \ \ \ \ std::string_view\ group_name,\

      \ \ \ \ variations::SyntheticTrialAnnotationMode\ annotation_mode\)\ \{\

      \ \ return\ metrics::MetricsServiceAccessor::RegisterSyntheticFieldTrial\(\

      \ \ \ \ \ \ g_browser_process\->metrics_service\(\),\ trial_name,\ group_name,\

      \ \ \ \ \ \ annotation_mode\);\

      \}\

      \

      void\ ChromeMetricsServiceAccessor::SetForceIsMetricsReportingEnabledPrefLookup\(\

      '
    replace: "    std::string_view trial_name,\n    std::string_view group_name,\n    variations::SyntheticTrialAnnotationMode annotation_mode) {\n#if BUILDFLAG(IS_ANDROID)\n  auto* manager = g_browser_process->GetMetricsServicesManager();\n  if (!manager) {\n    return false;\n  }\n  return metrics::MetricsServiceAccessor::\n      RegisterSyntheticFieldTrialForRegistry(\n          manager->GetSyntheticTrialRegistry(), trial_name, group_name,\n          annotation_mode);\n#else\n  return metrics::MetricsServiceAccessor::RegisterSyntheticFieldTrial(\n      g_browser_process->metrics_service(), trial_name, group_name,\n      annotation_mode);\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n\nvoid ChromeMetricsServiceAccessor::SetForceIsMetricsReportingEnabledPrefLookup(\n"
