      '
    replace: "#endif  // BUILDFLAG(IS_ANDROID)\n}\n#endif  // BUILDFLAG(IS_WIN) || BUILDFLAG(IS_ANDROID)\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace {\nclass LocalTrialAccessor : public metrics::MetricsServiceAccessor {\n public:\n  using MetricsServiceAccessor::RegisterSyntheticFieldTrialForRegistry;\n};\n\nclass LocalTrialObserver : public variations::SyntheticTrialObserver {\n public:\n  void OnSyntheticTrialsChanged(\n      const std::vector<variations::SyntheticTrialGroup>& updated,\n      const std::vector<variations::SyntheticTrialGroup>& removed,\n      const std::vector<variations::SyntheticTrialGroup>& groups) override {\n    ++notifications;\n    for (const auto& group : groups) {\n      if (group.trial_name() == \"ReaperLocalStartupContract\") {\n        observed_group = group.group_name();\n      }\n    }\n  }\n  int notifications = 0;\n  std::string observed_group;\n};\n}  // namespace\n\nTEST_F(ChromeMetricsServicesManagerClientTest,\n       AndroidRemoteServicesStayAbsentDuringStartupCallbacks) {\n  content::BrowserTaskEnvironment task_environment;\n  local_state()->SetBoolean(metrics::prefs::kMetricsReportingEnabled, true);\n  metrics_services_manager::MetricsServicesManager manager(\n      std::make_unique<ChromeMetricsServicesManagerClient>(local_state()));\n  manager.UpdateUploadPermissions(true);\n  manager.GetOnDidStartLoadingCb().Run();\n  manager.GetOnDidStopLoadingCb().Run();\n  manager.GetOnRendererUnresponsiveCb().Run();\n  EXPECT_EQ(nullptr, manager.GetMetricsService());\n  EXPECT_EQ(nullptr, manager.GetUkmService());\n  EXPECT_EQ(nullptr, manager.GetDwaService());\n  EXPECT_EQ(nullptr, manager.GetPumaService());\n  EXPECT_EQ(nullptr, manager.GetStructuredMetricsService());\n  for (auto type :\n       {metrics::MetricsLogUploader::UMA, metrics::MetricsLogUploader::UKM,\n        metrics::MetricsLogUploader::DWA,\n        metrics::MetricsLogUploader::PRIVATE_METRICS,\n        metrics::MetricsLogUploader::STRUCTURED_METRICS}) {\n    EXPECT_EQ(nullptr, manager.GetReportingService(type));\n  }\n  EXPECT_FALSE(manager.IsMetricsReportingEnabled());\n  EXPECT_FALSE(manager.IsMetricsConsentGiven());\n  EXPECT_FALSE(manager.IsUkmAllowedForAllProfiles());\n  EXPECT_FALSE(manager.IsDwaAllowedForAllProfiles());\n}\n\nTEST_F(ChromeMetricsServicesManagerClientTest,\n       AndroidLocalBeaconPreservesPriorShutdownForOomDecisions) {\n  content::BrowserTaskEnvironment task_environment;\n  metrics_services_manager::MetricsServicesManager manager(\n      std::make_unique<ChromeMetricsServicesManagerClient>(local_state()));\n  const bool previous_shutdown_clean = manager.WasLastShutdownClean();\n  manager.LogHasSessionShutdownCleanly(false);\n  EXPECT_FALSE(\n      local_state()->GetBoolean(metrics::prefs::kStabilityExitedCleanly));\n  EXPECT_EQ(previous_shutdown_clean, manager.WasLastShutdownClean());\n  manager.LogHasSessionShutdownCleanly(true);\n  EXPECT_TRUE(\n      local_state()->GetBoolean(metrics::prefs::kStabilityExitedCleanly));\n  EXPECT_EQ(previous_shutdown_clean, manager.WasLastShutdownClean());\n  EXPECT_EQ(nullptr, manager.GetMetricsService());\n}\n\nTEST_F(ChromeMetricsServicesManagerClientTest,\n       AndroidSyntheticRegistryPublishesLocalTrials) {\n  content::BrowserTaskEnvironment task_environment;\n  metrics_services_manager::MetricsServicesManager manager(\n      std::make_unique<ChromeMetricsServicesManagerClient>(local_state()));\n  auto* registry = manager.GetSyntheticTrialRegistry();\n  ASSERT_NE(nullptr, registry);\n  LocalTrialObserver observer;\n  base::ScopedObservation<variations::SyntheticTrialRegistry,\n                          variations::SyntheticTrialObserver>\n      observation(&observer);\n  observation.Observe(registry);\n  EXPECT_TRUE(LocalTrialAccessor::RegisterSyntheticFieldTrialForRegistry(\n      registry, \"ReaperLocalStartupContract\", \"LocalOnly\",\n      variations::SyntheticTrialAnnotationMode::kCurrentLog));\n  EXPECT_EQ(1, observer.notifications);\n  EXPECT_EQ(\"LocalOnly\", observer.observed_group);\n  EXPECT_FALSE(registry->GetCurrentSyntheticFieldTrialsForTest().empty());\n\
      \  EXPECT_EQ(nullptr, manager.GetMetricsService());\n}\n\nTEST_F(ChromeMetricsServicesManagerClientTest,\n       AndroidSeedFetchStaysAbsentWithOverridesAndCachedState) {\n  content::BrowserTaskEnvironment task_environment;\n  base::test::ScopedCommandLine command_line;\n  command_line.GetProcessCommandLine()->AppendSwitchASCII(\n      \"variations-server-url\", \"https://example.invalid/seed\");\n  command_line.GetProcessCommandLine()->AppendSwitchASCII(\n      \"variations-seed-fetch-interval\", \"1\");\n  metrics_services_manager::MetricsServicesManager manager(\n      std::make_unique<ChromeMetricsServicesManagerClient>(local_state()));\n  auto* service = manager.GetVariationsService();\n  ASSERT_NE(nullptr, service);\n  const std::string original_country =\n      local_state()->GetString(variations::prefs::kVariationsCountry);\n  const base::Time original_fetch_time =\n      local_state()->GetTime(variations::prefs::kVariationsLastFetchTime);\n  const base::Time cached_fetch_time = base::Time::Now() - base::Hours(1);\n  local_state()->SetString(variations::prefs::kVariationsCountry, \"nz\");\n  local_state()->SetTime(variations::prefs::kVariationsLastFetchTime,\n                         cached_fetch_time);\n  auto* cached_store = service->GetSeedStoreForTesting();\n  variations::VariationsService::EnableFetchForTesting();\n  service->PerformPreMainMessageLoopStartup();\n  service->OnAppEnterForeground();\n  service->StartRepeatedVariationsSeedFetchForTesting();\n  task_environment.RunUntilIdle();\n  EXPECT_EQ(0, service->request_count());\n  EXPECT_EQ(nullptr, service->GetResourceRequestAllowedNotifierForTesting());\n  EXPECT_TRUE(service->IsSeedFetchingPaused());\n  EXPECT_EQ(cached_store, service->GetSeedStoreForTesting());\n  EXPECT_EQ(\"nz\", service->GetLatestCountry());\n  EXPECT_EQ(cached_fetch_time, service->GetLatestSeedFetchTime());\n  local_state()->SetString(variations::prefs::kVariationsCountry,\n                           original_country);\n  local_state()->SetTime(variations::prefs::kVariationsLastFetchTime,\n                         original_fetch_time);\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n"
