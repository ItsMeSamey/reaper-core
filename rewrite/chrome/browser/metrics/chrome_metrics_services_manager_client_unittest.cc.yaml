- description: "Preserve reviewed Android source projection for chrome/browser/metrics/chrome_metrics_services_manager_client_unittest.cc (operation 2)."
  regex:
    re_pattern: '\ \ //\ Set\ the\ pref\ to\ true\.\

      \ \ local_state\(\)\->SetBoolean\(metrics::prefs::kMetricsReportingEnabled,\ true\);\

      \

      \ \ //\ Both\ consent\ and\ reporting\ should\ be\ true\.\

      \ \ EXPECT_TRUE\(provider\.IsConsentGiven\(\)\);\

      \ \ EXPECT_TRUE\(provider\.IsReportingEnabled\(\)\);\

      \

      \ \ //\ Set\ \-\-force\-fieldtrials=\ command\-line\ flag,\ which\ should\ disable\ reporting\

      \ \ //\ but\ not\ consent\.\

      \ \ base::CommandLine::ForCurrentProcess\(\)\->AppendSwitchASCII\(\

      \ \ \ \ \ \ switches::kForceFieldTrials,\ "Foo/Bar"\);\

      \

      \ \ //\ Consent\ should\ be\ true\ but\ reporting\ should\ be\ false\.\

      \ \ EXPECT_TRUE\(provider\.IsConsentGiven\(\)\);\

      \ \ EXPECT_FALSE\(provider\.IsReportingEnabled\(\)\);\

      \}\

      \

      TEST_F\(ChromeMetricsServicesManagerClientTest,\ PopulateStartupVisibility\)\ \{\

      '
    replace: "  // Set the pref to true.\n  local_state()->SetBoolean(metrics::prefs::kMetricsReportingEnabled, true);\n\n#if BUILDFLAG(IS_ANDROID)\n  // Obsolete consent prefs cannot activate an omitted reporter.\n  EXPECT_FALSE(provider.IsConsentGiven());\n  EXPECT_FALSE(provider.IsReportingEnabled());\n#else\n  // Both consent and reporting should be true.\n  EXPECT_TRUE(provider.IsConsentGiven());\n  EXPECT_TRUE(provider.IsReportingEnabled());\n#endif\n\n  // Set --force-fieldtrials= command-line flag, which should disable reporting\n  // but not consent.\n  base::CommandLine::ForCurrentProcess()->AppendSwitchASCII(\n      switches::kForceFieldTrials, \"Foo/Bar\");\n\n#if BUILDFLAG(IS_ANDROID)\n  EXPECT_FALSE(provider.IsConsentGiven());\n  EXPECT_FALSE(provider.IsReportingEnabled());\n#else\n  // Consent should be true but reporting should be false.\n  EXPECT_TRUE(provider.IsConsentGiven());\n  EXPECT_FALSE(provider.IsReportingEnabled());\n#endif\n}\n\nTEST_F(ChromeMetricsServicesManagerClientTest, PopulateStartupVisibility) {\n"
