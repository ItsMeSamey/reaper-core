- description: Reviewed literal source edit 6
  regex:
    pattern: "    public static final String READ_ALOUD_NATIVE = \"ReadAloudNative\";\n\n    public static final MutableFlagWithSafeDefault\
      \ sReadAloudNative =\n            new MutableFlagWithSafeDefault(\n                    AccessibilityFeaturesMap.getInstance(),\n\
      \                    READ_ALOUD_NATIVE,\n                    /* defaultValue= */ false);\n\n    /** Returns true if\
      \ the native C++ Read Aloud implementation is enabled. */\n    public static boolean isNativeEnabled() {\n        return\
      \ sReadAloudNative.isEnabled();\n    }\n\n    public static final String READ_ALOUD_SERVER_SYNTHESIZER = \"ReadAloudServerSynthesizer\"\
      ;\n\n    public static final MutableFlagWithSafeDefault sReadAloudServerSynthesizer =\n            new MutableFlagWithSafeDefault(\n\
      \                    AccessibilityFeaturesMap.getInstance(),\n                    READ_ALOUD_SERVER_SYNTHESIZER,\n \
      \                   /* defaultValue= */ false);\n\n    /**\n     * Returns true if server speech synthesis is enabled.\
      \ When native C++ is initialized, this\n     * delegates directly to C++ IsReadAloudServerSynthesizerEnabled() which\
      \ evaluates\n     * kReadAloudNative as an implicit enabler while respecting explicit disable overrides.\n     */\n\
      \    public static boolean isServerSynthesizerEnabled() {\n        if (FeatureList.isNativeInitialized()) {\n      \
      \      return ReadAloudFeaturesJni.get().isServerSynthesizerEnabled();\n        }\n        if (FeatureOverrides.hasTestFeature(READ_ALOUD_SERVER_SYNTHESIZER)\n\
      \                && !sReadAloudServerSynthesizer.isEnabled()) {\n            return false;\n        }\n        return\
      \ sReadAloudServerSynthesizer.isEnabled() || isNativeEnabled();\n    }\n\n"
    replace: ''
  count: 1
