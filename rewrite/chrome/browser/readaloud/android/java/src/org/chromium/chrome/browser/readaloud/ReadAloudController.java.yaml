substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove the Actor UI implementation dependency while retaining ordinary
    browser reading/preview behavior
  regex:
    re_pattern: 'import\ org\.chromium\.chrome\.browser\.actor\.ui\.ActorUiTabController;\

      '
    replace: ''
- description: Run the existing cancelable TTS playback callback without an excluded
    Actor dialog
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ ActorUiTabController\ controller\ =\ ActorUiTabController\.from\(tab\);\

      \ \ \ \ \ \ \ \ if\ \(controller\ ==\ null\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ !controller\.showTaskAbortConfirmationDialog\(playTabImplCallback\)\)\
      \{\

      \ \ \ \ \ \ \ \ \ \ \ \ playTabImplCallback\.onResult\(true\);\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: '        playTabImplCallback.onResult(true);

      '

# Reaper Android AI physical-purge core caller adapters.
- description: Reject new playback requests after controller teardown; its callback
    controller is already null at that point
  regex:
    re_pattern: '\ \ \ \ public\ void\ playTab\(Tab\ tab,\ @Entrypoint\ int\ entrypoint\)\
      \{\

      '
    replace: "    public void playTab(Tab tab, @Entrypoint int entrypoint) {\n   \
      \     if (mIsDestroyed) return;\n"
- description: Guard the real asynchronous date-extraction continuation after destroy
    while preserving timestamp/error fallback behavior for live controllers
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ timestamp\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ReadAloudMetrics\.recordHasDateModified\(true\);\

      '
    replace: "                        timestamp -> {\n                           \
      \ if (mIsDestroyed) return;\n                            ReadAloudMetrics.recordHasDateModified(true);\n"
