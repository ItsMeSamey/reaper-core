- description: Replace historical AI confirmation positive with direct real playback
    creation; preserve its original successful createPlayback assertion
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ public\ void\ testPlayTab_WithGlicActive_Confirm\(\)\ \{\

      \ \ \ \ \ \ \ \ GlicEnabling\.setEnabledForTesting\(true\);\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.isActorActive\(\)\)\.thenReturn\(true\);\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.showTaskAbortConfirmationDialog\(any\(\)\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.thenAnswer\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ invocation\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Callback<Boolean>\ callback\
      =\ invocation\.getArgument\(0\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ callback\.onResult\(true\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \

      \ \ \ \ \ \ \ \ mFakeTranslateBridge\.setCurrentLanguage\("en"\);\

      \ \ \ \ \ \ \ \ mTab\.setGurlOverrideForTesting\(new\ GURL\("https://en\.wikipedia\.org/wiki/Google"\)\);\

      \

      \ \ \ \ \ \ \ \ mController\.playTab\(mTab,\ ReadAloudController\.Entrypoint\.MAGIC_TOOLBAR\);\

      \ \ \ \ \ \ \ \ resolvePromises\(\);\

      \

      \ \ \ \ \ \ \ \ verify\(mActorUiTabController\)\.showTaskAbortConfirmationDialog\(any\(\)\);\

      \ \ \ \ \ \ \ \ verify\(mPlaybackHooks\)\.createPlayback\(any\(\),\ any\(\)\);\

      \ \ \ \ \}\

      \

      '
    replace: "    @Test\n    public void testPlayTab_StartsWithoutTaskConfirmation()\
      \ {\n        mFakeTranslateBridge.setCurrentLanguage(\"en\");\n        mTab.setGurlOverrideForTesting(new\
      \ GURL(\"https://en.wikipedia.org/wiki/Google\"));\n\n        mController.playTab(mTab,\
      \ ReadAloudController.Entrypoint.MAGIC_TOOLBAR);\n        resolvePromises();\n\
      \n        verify(mPlaybackHooks).createPlayback(any(), any());\n    }\n\n"
- description: Remove dedicated Actor abort-dialog cancellation-only positive; ordinary
    playback cancellation/destruction tests remain compiled
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ public\ void\ testPlayTab_WithGlicActive_Cancel\(\)\ \{\

      \ \ \ \ \ \ \ \ GlicEnabling\.setEnabledForTesting\(true\);\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.isActorActive\(\)\)\.thenReturn\(true\);\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.showTaskAbortConfirmationDialog\(any\(\)\)\)\.thenReturn\(true\);\

      \

      \ \ \ \ \ \ \ \ mFakeTranslateBridge\.setCurrentLanguage\("en"\);\

      \ \ \ \ \ \ \ \ mTab\.setGurlOverrideForTesting\(new\ GURL\("https://en\.wikipedia\.org/wiki/Google"\)\);\

      \

      \ \ \ \ \ \ \ \ mController\.playTab\(mTab,\ ReadAloudController\.Entrypoint\.MAGIC_TOOLBAR\);\

      \ \ \ \ \ \ \ \ resolvePromises\(\);\

      \

      \ \ \ \ \ \ \ \ verify\(mActorUiTabController\)\.showTaskAbortConfirmationDialog\(any\(\)\);\

      \ \ \ \ \ \ \ \ verify\(mPlaybackHooks,\ never\(\)\)\.createPlayback\(any\(\),\
      any\(\)\);\

      \ \ \ \ \}\

      \

      '
    replace: ''
- description: Replace the removed Actor-confirmation lifetime test with actual unresolved
    date Promise success/error-after-destroy and public request-after-destroy tests;
    assert no hooks/player/native interactions after teardown
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ public\ void\ testPlayTab_WithGlicActive_Confirm_AfterDestroy\(\)\ \{\

      \ \ \ \ \ \ \ \ GlicEnabling\.setEnabledForTesting\(true\);\

      \ \ \ \ \ \ \ \ //\ Setup:\ Mock\ active\ Glic\ task\ and\ capture\ dialogue\
      confirm\ callback\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.isActorActive\(\)\)\.thenReturn\(true\);\

      \ \ \ \ \ \ \ \ when\(mActorUiTabController\.showTaskAbortConfirmationDialog\(mGlicCallbackCaptor\.capture\(\)\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.thenReturn\(true\);\

      \

      \ \ \ \ \ \ \ \ mFakeTranslateBridge\.setCurrentLanguage\("en"\);\

      \ \ \ \ \ \ \ \ mTab\.setGurlOverrideForTesting\(new\ GURL\("https://en\.wikipedia\.org/wiki/Google"\)\);\

      \

      \ \ \ \ \ \ \ \ //\ Action\ 1:\ Call\ playTab\ to\ show\ the\ prompt\ and\ capture\
      the\ callback\

      \ \ \ \ \ \ \ \ mController\.playTab\(mTab,\ ReadAloudController\.Entrypoint\.MAGIC_TOOLBAR\);\

      \ \ \ \ \ \ \ \ resolvePromises\(\);\

      \

      \ \ \ \ \ \ \ \ //\ Action\ 2:\ Destroy\ the\ controller\ simulating\ background\
      tab\ closing\

      \ \ \ \ \ \ \ \ mController\.destroy\(\);\

      \

      \ \ \ \ \ \ \ \ //\ Action\ 3:\ Trigger\ the\ captured\ callback\ simulating\
      clicking\ Confirm\ on\ stale\ prompt\

      \ \ \ \ \ \ \ \ //\ dialog\

      \ \ \ \ \ \ \ \ mGlicCallbackCaptor\.getValue\(\)\.onResult\(true\);\

      \ \ \ \ \ \ \ \ resolvePromises\(\);\

      \

      \ \ \ \ \ \ \ \ //\ Verification:\ Assert\ showTaskAbortConfirmationDialog\
      was\ called,\

      \ \ \ \ \ \ \ \ //\ but\ verify\ createPlayback\ was\ NEVER\ called\ \(proving\
      the\ cancelable\ wrapper\ blocked\

      \ \ \ \ \ \ \ \ //\ execution\ successfully\ after\ destroy\)\.\

      \ \ \ \ \ \ \ \ verify\(mActorUiTabController\)\.showTaskAbortConfirmationDialog\(any\(\)\);\

      \ \ \ \ \ \ \ \ verify\(mPlaybackHooks,\ never\(\)\)\.createPlayback\(any\(\),\
      any\(\)\);\

      \ \ \ \ \}\

      \

      '
    replace: "    @Test\n    public void testPlayTab_DateExtractionSuccessAfterDestroyDoesNotStartPlayback()\
      \ {\n        Promise<Long> pendingDate = new Promise<>();\n        when(mExtractor.getDateModified(any())).thenReturn(pendingDate);\n\
      \        mFakeTranslateBridge.setCurrentLanguage(\"en\");\n        mTab.setGurlOverrideForTesting(new\
      \ GURL(\"https://en.wikipedia.org/wiki/Google\"));\n\n        mController.playTab(mTab,\
      \ ReadAloudController.Entrypoint.MAGIC_TOOLBAR);\n        verify(mExtractor).getDateModified(mTab);\n\
      \        verify(mPlaybackHooks, never()).createPlayback(any(), any());\n   \
      \     mController.destroy();\n        Mockito.clearInvocations(mPlaybackHooks,\
      \ mPlayerCoordinator, mNativeBridgeNatives);\n\n        pendingDate.fulfill(1234567123456L);\n\
      \        resolvePromises();\n\n        Mockito.verifyNoInteractions(mPlaybackHooks,\
      \ mPlayerCoordinator, mNativeBridgeNatives);\n    }\n\n    @Test\n    public\
      \ void testPlayTab_DateExtractionFailureAfterDestroyDoesNotStartPlayback() {\n\
      \        Promise<Long> pendingDate = new Promise<>();\n        when(mExtractor.getDateModified(any())).thenReturn(pendingDate);\n\
      \        mFakeTranslateBridge.setCurrentLanguage(\"en\");\n        mTab.setGurlOverrideForTesting(new\
      \ GURL(\"https://en.wikipedia.org/wiki/Google\"));\n\n        mController.playTab(mTab,\
      \ ReadAloudController.Entrypoint.MAGIC_TOOLBAR);\n        verify(mExtractor).getDateModified(mTab);\n\
      \        verify(mPlaybackHooks, never()).createPlayback(any(), any());\n   \
      \     mController.destroy();\n        Mockito.clearInvocations(mPlaybackHooks,\
      \ mPlayerCoordinator, mNativeBridgeNatives);\n\n        pendingDate.reject(new\
      \ Exception(\"Date extraction failed after teardown\"));\n        resolvePromises();\n\
      \n        Mockito.verifyNoInteractions(mPlaybackHooks, mPlayerCoordinator, mNativeBridgeNatives);\n\
      \    }\n\n    @Test\n    public void testPlayTab_RequestAfterDestroyDoesNotStartPlayback()\
      \ {\n        mController.destroy();\n        Mockito.clearInvocations(mExtractor,\
      \ mPlaybackHooks, mPlayerCoordinator, mNativeBridgeNatives);\n\n        mController.playTab(mTab,\
      \ ReadAloudController.Entrypoint.MAGIC_TOOLBAR);\n        resolvePromises();\n\
      \n        Mockito.verifyNoInteractions(\n                mExtractor, mPlaybackHooks,\
      \ mPlayerCoordinator, mNativeBridgeNatives);\n    }\n\n"
