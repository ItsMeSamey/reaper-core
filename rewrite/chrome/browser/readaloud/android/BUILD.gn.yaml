# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/readaloud/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/android:ui_no_recycler_view_java",\

      \ \ \ \ "//url:gurl_java",\

      \ \ \]\

      \ \ srcjar_deps\ =\ \[\ ":jni_headers"\ \]\

      \ \ resources_package\ =\ "org\.chromium\.chrome\.browser\.readaloud"\

      \}\

      '
    replace: "    \"//ui/android:ui_no_recycler_view_java\",\n    \"//url:gurl_java\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/actor/android:java\" ]\n  }\n  srcjar_deps = [ \":jni_headers\" ]\n  resources_package = \"org.chromium.chrome.browser.readaloud\"\n}\n"
