# Android WebAuthn selected-tab request lifetime.
{
  "substitutions": [
    {
      "description": "Use the generated extension build flag for the Android-only delegate hook.",
      "regex": {
        "pattern": "import(\"//build/config/ui.gni\")",
        "replace": "import(\"//build/config/ui.gni\")\nimport(\"//extensions/buildflags/buildflags.gni\")"
      }
    },
    {
      "description": "Declare the direct extension build flag dependency.",
      "regex": {
        "pattern": "    \"//components/prefs\",\n    \"//device/fido\",\n  ]\n\n  if (is_win || is_mac || is_linux) {\n    deps += [ \"//chrome/browser/extensions/api/web_authentication_proxy\" ]",
        "replace": "    \"//components/prefs\",\n    \"//device/fido\",\n    \"//extensions/buildflags\",\n  ]\n\n  if (is_win || is_mac || is_linux || (is_android && enable_extensions_core)) {\n    deps += [ \"//chrome/browser/extensions/api/web_authentication_proxy\" ]"
      }
    },
    {
      "description": "Link the Android Chrome WebAuthn client to its native request guard",
      "count": 1,
      "regex": {
        "re_pattern": "\\ \\ \\ \\ \\ \\ \"//chrome/browser/password_manager/android/grouped_affiliations:public\",\\\n\\ \\ \\ \\ \\ \\ \"//chrome/browser/profiles:profile\",",
        "replace": "      \"//chrome/browser/password_manager/android/grouped_affiliations:public\",\n      \"//brave/browser/webauthn/android:request_guard\",\n      \"//chrome/browser/profiles:profile\","
      }
    },
    {
      "description": "Attach Android request lifetime regressions to the existing WebAuthn unit-test target",
      "count": 1,
      "regex": {
        "re_pattern": "\\ \\ if\\ \\(!is_android\\)\\ \\{\\\n\\ \\ \\ \\ sources\\ \\+=\\ \\[\\\n\\ \\ \\ \\ \\ \\ \"authenticator_request_dialog_model_unittest\\.cc\",",
        "replace": "  if (is_android) {\n    deps += [ \"//brave/browser/webauthn/android:unit_tests\" ]\n  }\n\n  if (!is_android) {\n    sources += [\n      \"authenticator_request_dialog_model_unittest.cc\","
      }
    },
    {
      "description": "Android concrete AI source/provider removal: chrome/browser/webauthn/BUILD.gn",
      "regex": {
        "re_pattern": "\\\n\\ \\ \\ \\ deps\\ =\\ \\[\\\n\\ \\ \\ \\ \\ \\ \":webauthn\",\\\n\\ \\ \\ \\ \\ \\ \"//chrome/browser/password_manager\",\\\n\\ \\ \\ \\ \\ \\ \"//chrome/browser/password_manager/android/grouped_affiliations:public\",\\\n\\ \\ \\ \\ \\ \\ \"//brave/browser/webauthn/android:request_guard\",\\\n\\ \\ \\ \\ \\ \\ \"//chrome/browser/profiles:profile\",\\\n\\ \\ \\ \\ \\ \\ \"//chrome/browser/touch_to_fill/password_manager:impl\",\\\n\\ \\ \\ \\ \\ \\ \"//components/password_manager/content/browser\",\\\n",
        "replace": "\n    deps = [\n      \":webauthn\",\n      \"//brave/browser/webauthn/android:request_guard\",\n      \"//chrome/browser/password_manager\",\n      \"//chrome/browser/password_manager/android/grouped_affiliations:public\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/touch_to_fill/password_manager:impl\",\n      \"//components/password_manager/content/browser\",\n"
      }
    },
    {
      "description": "Android concrete AI source/provider removal: chrome/browser/webauthn/BUILD.gn",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ \\ \\ \"//testing/gtest\",\\\n\\ \\ \\ \\ \\ \\ \"//ui/base\",\\\n\\ \\ \\ \\ \\]\\\n\\\n\\ \\ \\ \\ if\\ \\(!is_chromeos\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ sources\\ \\+=\\ \\[\\\n",
        "replace": "      \"//testing/gtest\",\n      \"//ui/base\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor:test_support\",\n        \"//chrome/browser/actor/ui:test_support\",\n      ]\n    }\n\n    if (!is_chromeos) {\n      sources += [\n"
      }
    },
    {
      "description": "Reuse the existing desktop extension origin and RP authorization for Android WebAuthn.",
      "regex": {
        "re_pattern": "\\ \\ if\\ \\(is_win\\ \\|\\|\\ is_mac\\ \\|\\|\\ is_linux\\ \\|\\|\\ \\(is_android\\ \\&\\&\\ enable_extensions_core\\)\\)\\ \\{\\\n\\ \\ \\ \\ deps\\ \\+=\\ \\[\\ \"//chrome/browser/extensions/api/web_authentication_proxy\"\\ \\]\\\n\\ \\ \\}\\\n",
        "replace": "  if (is_win || is_mac || is_linux || (is_android && enable_extensions_core)) {\n    deps += [ \"//chrome/browser/extensions/api/web_authentication_proxy\" ]\n  }\n\n  if (is_android && enable_extensions_core) {\n    deps += [\n      \"//extensions/browser\",\n      \"//extensions/common\",\n      \"//net\",\n      \"//url\",\n    ]\n  }\n"
      },
      "count": 1
    }
  ]
}
