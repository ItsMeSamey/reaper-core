substitutions:
- description: Retain the existing confirmation sheet so cancellation can close it.
  regex:
    pattern: "            return (accept, reject) -> {\n                var sheet = new AuthenticatorIncognitoConfirmationBottomsheet(webContents);\n                return sheet.show(accept, reject);\n            };"
    replace: "            return new CreateConfirmationUiDelegate() {\n                private @Nullable AuthenticatorIncognitoConfirmationBottomsheet mSheet;\n\n                @Override\n                public boolean show(Runnable accept, Runnable reject) {\n                    mSheet = new AuthenticatorIncognitoConfirmationBottomsheet(webContents);\n                    return mSheet.show(accept, reject);\n                }\n\n                @Override\n                public void cancel() {\n                    var sheet = mSheet;\n                    mSheet = null;\n                    if (sheet != null) sheet.close(false);\n                }\n            };"
