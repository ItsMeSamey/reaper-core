# Android WebAuthn selected-tab request lifetime.
substitutions:
- description: Use the Chrome-owned guard without component-to-Chrome dependencies
  count: 1
  regex:
    re_pattern: \#include\ "base/feature_list\.h"
    replace: '#include <utility>


      #include "base/feature_list.h"

      #include "brave/browser/webauthn/android/chrome_webauthn_request_guard.h"'
- description: Return a distinct exact-document lifetime guard for each Chrome WebAuthn request
  count: 1
  regex:
    re_pattern: ChromeWebAuthnClientAndroid::\~ChromeWebAuthnClientAndroid\(\)\ =\ default;
    replace: "ChromeWebAuthnClientAndroid::~ChromeWebAuthnClientAndroid() = default;\n\nstd::unique_ptr<webauthn::WebAuthnRequestGuard>\nChromeWebAuthnClientAndroid::CreateRequestGuard(content::RenderFrameHost* frame,\n                                              bool conditional,\n                                              base::OnceClosure on_cancel) {\n  return CreateChromeWebAuthnRequestGuard(frame, conditional, std::move(on_cancel));\n}"
- description: Format modified Android WebAuthn request guard
  count: 1
  regex:
    re_pattern: 'ChromeWebAuthnClientAndroid::\~ChromeWebAuthnClientAndroid\(\)\ =\ default;\

      \

      std::unique_ptr<webauthn::WebAuthnRequestGuard>\

      ChromeWebAuthnClientAndroid::CreateRequestGuard\(content::RenderFrameHost\*\ frame,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ bool\ conditional,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::OnceClosure\ on_cancel\)\ \{\

      \ \ return\ CreateChromeWebAuthnRequestGuard\(frame,\ conditional,\ std::move\(on_cancel\)\);\

      \}\

      \

      void\ ChromeWebAuthnClientAndroid::OnWebAuthnRequestPending\(\

      \ \ \ \ content::RenderFrameHost\*\ frame_host,\

      '
    replace: "ChromeWebAuthnClientAndroid::~ChromeWebAuthnClientAndroid() = default;\n\nstd::unique_ptr<webauthn::WebAuthnRequestGuard>\nChromeWebAuthnClientAndroid::CreateRequestGuard(content::RenderFrameHost* frame,\n                                                bool conditional,\n                                                base::OnceClosure on_cancel) {\n  return CreateChromeWebAuthnRequestGuard(frame, conditional,\n                                          std::move(on_cancel));\n}\n\nvoid ChromeWebAuthnClientAndroid::OnWebAuthnRequestPending(\n    content::RenderFrameHost* frame_host,\n"
- description: remove-actor-only-include-base/feature_list.h
  regex:
    pattern: '#include "base/feature_list.h"

      '
    replace: ''
  count: 1
- description: remove-actor-only-include-chrome/browser/actor/actor_util.h
  regex:
    pattern: '#include "chrome/browser/actor/actor_util.h"

      '
    replace: ''
  count: 1
- description: remove-actor-only-include-components/password_manager/core/browser/features/password_features.h
  regex:
    pattern: '#include "components/password_manager/core/browser/features/password_features.h"

      '
    replace: ''
  count: 1
- description: remove-actor-only-include-content/public/browser/web_contents.h
  regex:
    pattern: '#include "content/public/browser/web_contents.h"

      '
    replace: ''
  count: 1
- description: remove-actor-only-include-device/fido/public/features.h
  regex:
    pattern: '#include "device/fido/public/features.h"

      '
    replace: ''
  count: 1
- description: preserve-required-embedder-interface-without-actor-veto
  regex:
    pattern: "bool ChromeWebAuthnClientAndroid::ShouldDisallowCredentialRequest(\n    content::RenderFrameHost* render_frame_host)\
      \ {\n  if (!base::FeatureList::IsEnabled(device::kWebAuthnActorCheck) ||\n      !base::FeatureList::IsEnabled(password_manager::features::kActorLogin))\
      \ {\n    return false;\n  }\n  content::WebContents* web_contents =\n      content::WebContents::FromRenderFrameHost(render_frame_host);\n\
      \  return actor::HaveActiveTaskForContents(web_contents);\n}"
    replace: "bool ChromeWebAuthnClientAndroid::ShouldDisallowCredentialRequest(\n    content::RenderFrameHost* render_frame_host)\
      \ {\n  // Actor is not part of the Android build. Request guards remain active.\n  return false;\n}"
  count: 1
