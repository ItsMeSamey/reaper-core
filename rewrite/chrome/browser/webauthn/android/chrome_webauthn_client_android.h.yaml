# Android WebAuthn selected-tab request lifetime.
substitutions:
- description: Implement Chrome policy through the existing Android embedder boundary
  count: 1
  regex:
    re_pattern: '\ \ //\ webauthn::WebAuthnClientAndroid:'
    replace: "  // webauthn::WebAuthnClientAndroid:\n  std::unique_ptr<webauthn::WebAuthnRequestGuard> CreateRequestGuard(\n      content::RenderFrameHost* frame,\n      bool conditional,\n      base::OnceClosure on_cancel) override;"
