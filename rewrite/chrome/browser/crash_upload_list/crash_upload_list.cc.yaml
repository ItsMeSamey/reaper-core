substitutions:
- description: Apply existing recent-first ordering to the single Android local list
  regex:
    pattern: '  return new CrashUploadListAndroid(upload_log_path);

      '
    replace: "  // The Android reader merges local reports and the completed-report log.\n  // Apply the shared chronological\
      \ ordering before consumers limit the list.\n  std::vector<scoped_refptr<UploadList>> lists = {\n      base::MakeRefCounted<CrashUploadListAndroid>(upload_log_path)};\n\
      \  return base::MakeRefCounted<CombiningUploadList>(std::move(lists));\n"
  count: 1
