substitutions:
- description: Remove Android JNI imports used exclusively by the retired uploader
  regex:
    pattern: '#include "base/android/jni_android.h"

      #include "base/android/jni_string.h"

      '
    replace: ''
  count: 1
- description: Remove dedicated crash-upload debug histogram instrumentation
  regex:
    pattern: '#include "base/metrics/histogram_macros_local.h"

      '
    replace: ''
  count: 1
- description: Remove the native dependency on the excluded MinidumpUploadServiceImpl class
  regex:
    pattern: '// Must come after all headers that specialize FromJniType() / ToJniType().

      #include "chrome/android/chrome_jni_headers/MinidumpUploadServiceImpl_jni.h"


      '
    replace: ''
  count: 1
- description: Remove the dedicated upload telemetry enum and recording helper
  regex:
    pattern: "namespace {\n\nenum class UnsuccessfulUploadListState {\n  FORCED,\n  PENDING,\n  NOT_UPLOADED,\n  OTHER_FILENAME_SUFFIX,\n\
      \  FAILED_TO_LOAD_FILE_INFO,\n  FAILED_TO_LOAD_FILE_SIZE,\n  FAILED_TO_FIND_DASH,\n  ADDING_AN_UPLOAD_ENTRY,\n  COUNT\n\
      };\n\n// TODO(isherman): This is a temporary histogram for debugging\n// [ https://crbug.com/40543462 ] and should be\
      \ removed once that bug is closed.\nvoid RecordUnsuccessfulUploadListState(UnsuccessfulUploadListState state) {\n  LOCAL_HISTOGRAM_ENUMERATION(\n\
      \      \"Debug.Crash.Android.LoadUnsuccessfulUploadListState\", state,\n      UnsuccessfulUploadListState::COUNT);\n\
      }\n\n}  // namespace\n\n"
    replace: ''
  count: 1
- description: Remove unreferenced uploader-owned crash-metrics getters
  regex:
    pattern: "// static\nbool CrashUploadListAndroid::BrowserCrashMetricsInitialized() {\n  JNIEnv* env = base::android::AttachCurrentThread();\n\
      \  return Java_MinidumpUploadServiceImpl_browserCrashMetricsInitialized(env);\n}\n\n// static\nbool CrashUploadListAndroid::DidBrowserCrashRecently()\
      \ {\n  JNIEnv* env = base::android::AttachCurrentThread();\n  return Java_MinidumpUploadServiceImpl_didBrowserCrashRecently(env);\n\
      }\n\n"
    replace: ''
  count: 1
- description: Remove the uploader override; local TextLogUploadList keeps its existing no-op interface
  regex:
    pattern: "void CrashUploadListAndroid::RequestSingleUpload(const std::string& local_id) {\n  JNIEnv* env = base::android::AttachCurrentThread();\n\
      \  Java_MinidumpUploadServiceImpl_tryUploadCrashDumpWithLocalId(env, local_id);\n}\n\n"
    replace: ''
  count: 1
- description: Remove one dedicated upload histogram sample without changing file-list control flow
  regex:
    pattern: '      RecordUnsuccessfulUploadListState(UnsuccessfulUploadListState::FORCED);

      '
    replace: ''
  count: 1
- description: Remove one dedicated upload histogram sample without changing file-list control flow
  regex:
    pattern: '      RecordUnsuccessfulUploadListState(UnsuccessfulUploadListState::PENDING);

      '
    replace: ''
  count: 1
- description: Remove one dedicated upload histogram sample without changing file-list control flow
  regex:
    pattern: "      RecordUnsuccessfulUploadListState(\n          UnsuccessfulUploadListState::NOT_UPLOADED);\n"
    replace: ''
  count: 1
- description: Remove one dedicated upload histogram sample without changing file-list control flow
  regex:
    pattern: "      RecordUnsuccessfulUploadListState(\n          UnsuccessfulUploadListState::OTHER_FILENAME_SUFFIX);\n"
    replace: ''
  count: 1
- description: Remove one dedicated upload histogram sample without changing file-list control flow
  regex:
    pattern: "      RecordUnsuccessfulUploadListState(\n          UnsuccessfulUploadListState::FAILED_TO_LOAD_FILE_INFO);\n"
    replace: ''
  count: 1
- description: Remove one dedicated upload histogram sample without changing file-list control flow
  regex:
    pattern: "      RecordUnsuccessfulUploadListState(\n          UnsuccessfulUploadListState::FAILED_TO_LOAD_FILE_SIZE);\n"
    replace: ''
  count: 1
- description: Remove one dedicated upload histogram sample without changing file-list control flow
  regex:
    pattern: "      RecordUnsuccessfulUploadListState(\n          UnsuccessfulUploadListState::FAILED_TO_FIND_DASH);\n"
    replace: ''
  count: 1
- description: Remove one dedicated upload histogram sample without changing file-list control flow
  regex:
    pattern: "    RecordUnsuccessfulUploadListState(\n        UnsuccessfulUploadListState::ADDING_AN_UPLOAD_ENTRY);\n"
    replace: ''
  count: 1
- description: Remove unused uploader JNI registration
  regex:
    pattern: '

      DEFINE_JNI(MinidumpUploadServiceImpl)

      '
    replace: ''
  count: 1
