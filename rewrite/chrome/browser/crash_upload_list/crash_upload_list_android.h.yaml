substitutions:
- description: Describe the retained local-file list without the excluded uploader service
  regex:
    pattern: '// client. This uses both the Breakpad text log format, as well as inspecting

      // the un-uploaded Minidump directory, managed by the MinidumpUploadService.

      '
    replace: '// client. This reads the Breakpad text log and local minidump directory.

      '
  count: 1
- description: Remove unused uploader-owned crash-metrics API declarations
  regex:
    pattern: "  // Returns true if the browser crash metrics were initialized, only happens\n  // when minidump service is\
      \ started.\n  static bool BrowserCrashMetricsInitialized();\n\n  // Returns true if a browser crash was observed in\
      \ recent sessions. Can be\n  // called only when BrowserCrashMetricsInitialized() returns true.\n  static bool DidBrowserCrashRecently();\n\
      \n"
    replace: ''
  count: 1
- description: Use the inherited no-op upload interface for the local-only list
  regex:
    pattern: '  void RequestSingleUpload(const std::string& local_id) override;

      '
    replace: ''
  count: 1
