substitutions:
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "# Use of this source code is governed by a BSD-style license that can be\n# found in the LICENSE file.\n\nstatic_library(\"tips\") {\n  sources = [\n    \"tips_service_factory.cc\",\n    \"tips_service_factory.h\",\n  ]\n\n  deps = [\n    \"//base\",\n    \"//chrome/browser/profiles:profile\",\n    \"//chrome/browser/segmentation_platform\",\n    \"//chrome/browser/tips/core\",\n    \"//components/keyed_service/core\",\n  ]\n}\n"
      replace: "# Use of this source code is governed by a BSD-style license that can be\n# found in the LICENSE file.\n\nif (!is_android) {\n  static_library(\"tips\") {\n    sources = [\n      \"tips_service_factory.cc\",\n      \"tips_service_factory.h\",\n    ]\n\n    deps = [\n      \"//base\",\n      \"//chrome/browser/profiles:profile\",\n      \"//chrome/browser/segmentation_platform\",\n      \"//chrome/browser/tips/core\",\n      \"//components/keyed_service/core\",\n    ]\n  }\n}\n"
    count: 1
