# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/guest_view/chrome_guest_view_manager_delegate.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/guest_view/chrome_guest_view_manager_delegate\.h"\

      \

      \#include\ "build/build_config\.h"\

      \#include\ "build/buildflag\.h"\

      \#include\ "chrome/browser/glic/host/guest_util\.h"\

      \#include\ "chrome/browser/performance_manager/public/guest_view_policy\.h"\

      \#include\ "chrome/browser/task_manager/web_contents_tags\.h"\

      \#include\ "chrome/common/buildflags\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/guest_view/chrome_guest_view_manager_delegate.h"

      #include "build/build_config.h"


      #include "build/buildflag.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/host/guest_util.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/performance_manager/public/guest_view_policy.h"

      #include "chrome/browser/task_manager/web_contents_tags.h"

      #include "chrome/common/buildflags.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/guest_view/chrome_guest_view_manager_delegate.cc'
  regex:
    re_pattern: '\ \ ash::KioskController::Get\(\)\.OnGuestAdded\(guest_web_contents\);\

      \#endif\

      \

      \ \ //\ Check\ if\ guest\ belongs\ to\ glic\ and\ apply\ specific\ customizations\ if\ so\.\

      \ \ glic::OnGuestAdded\(guest_web_contents\);\

      \

      \ \ performance_manager::GuestViewAssociatedToWebContents\(guest_web_contents\);\

      \

      '
    replace: "  ash::KioskController::Get().OnGuestAdded(guest_web_contents);\n#endif\n\n#if !BUILDFLAG(IS_ANDROID)\n  // Check if guest belongs to glic and apply specific customizations if so.\n  glic::OnGuestAdded(guest_web_contents);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  performance_manager::GuestViewAssociatedToWebContents(guest_web_contents);\n\n"
