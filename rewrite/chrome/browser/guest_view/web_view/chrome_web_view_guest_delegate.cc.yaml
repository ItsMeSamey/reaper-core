# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/guest_view/web_view/chrome_web_view_guest_delegate.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/guest_view/web_view/chrome_web_view_guest_delegate\.h"\

      \

      \#include\ <memory>\

      \#include\ <optional>\

      \#include\ <utility>\

      \

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/common/webui_url_constants\.h"\

      \#include\ "components/guest_view/browser/guest_view_event\.h"\

      \#include\ "components/renderer_context_menu/context_menu_delegate\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/guest_view/web_view/chrome_web_view_guest_delegate.h"

      #include "build/build_config.h"


      #include <memory>

      #include <optional>

      #include <utility>


      #include "chrome/common/webui_url_constants.h"

      #include "components/guest_view/browser/guest_view_event.h"

      #include "components/renderer_context_menu/context_menu_delegate.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/guest_view/web_view/chrome_web_view_guest_delegate.cc'
  regex:
    re_pattern: '\

      bool\ ChromeWebViewGuestDelegate::ShouldForwardOpenUrlFromTabToOwnerWebContents\(\

      \ \ \ \ const\ GURL\&\ owner_url\)\ \{\

      \ \ //\ Allow\ contextual\ tasks\ URL\ to\ redirect\ to\ owner_web_cotnents\.\

      \ \ return\ owner_url\.scheme\(\)\ ==\ content::kChromeUIScheme\ \&\&\

      \ \ \ \ \ \ \ \ \ owner_url\.host\(\)\ ==\ chrome::kChromeUIContextualTasksHost;\

      \}\

      \

      \}\ \ //\ namespace\ extensions\

      '
    replace: "\nbool ChromeWebViewGuestDelegate::ShouldForwardOpenUrlFromTabToOwnerWebContents(\n    const GURL& owner_url) {\n#if !BUILDFLAG(IS_ANDROID)\n  // Allow contextual tasks URL to redirect to owner_web_cotnents.\n  return owner_url.scheme() == content::kChromeUIScheme &&\n         owner_url.host() == chrome::kChromeUIContextualTasksHost;\n#else\n  return false;\n#endif  // !BUILDFLAG(IS_ANDROID)\n}\n\n}  // namespace extensions\n"
