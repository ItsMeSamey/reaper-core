# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/guest_view/web_view/chrome_web_view_permission_helper_delegate.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/guest_view/web_view/chrome_web_view_permission_helper_delegate\.h"\

      \

      \#include\ <map>\

      \#include\ <utility>\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/guest_view/web_view/chrome_web_view_permission_helper_delegate.h"

      #include "build/build_config.h"


      #include <map>

      #include <utility>

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/guest_view/web_view/chrome_web_view_permission_helper_delegate.cc'
  regex:
    re_pattern: 'bool\ ChromeWebViewPermissionHelperDelegate::\

      \ \ \ \ ForwardEmbeddedMediaPermissionChecksAsEmbedder\(\

      \ \ \ \ \ \ \ \ const\ url::Origin\&\ embedder_origin\)\ \{\

      \ \ //\ Note\ that\ it\ probably\ makes\ sense\ for\ most\ WebUIs\ to\ forward\ approved\ media\

      \ \ //\ permissions\ as\ the\ embedder,\ but\ historically,\ the\ default\ has\ been\ to\

      \ \ //\ forward\ as\ the\ embedded\ origin\.\

      '
    replace: "bool ChromeWebViewPermissionHelperDelegate::\n    ForwardEmbeddedMediaPermissionChecksAsEmbedder(\n        const url::Origin& embedder_origin) {\n#if !BUILDFLAG(IS_ANDROID)\n  // Note that it probably makes sense for most WebUIs to forward approved media\n  // permissions as the embedder, but historically, the default has been to\n  // forward as the embedded origin.\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/guest_view/web_view/chrome_web_view_permission_helper_delegate.cc'
  regex:
    re_pattern: '\ \ //\ old\ behavior\.\

      \ \ return\ embedder_origin\.scheme\(\)\ ==\ content::kChromeUIScheme\ \&\&\

      \ \ \ \ \ \ \ \ \ embedder_origin\.host\(\)\ ==\ chrome::kChromeUIGlicHost;\

      \}\

      \

      std::optional<content::PermissionResult>\

      ChromeWebViewPermissionHelperDelegate::OverridePermissionResult\(\

      \ \ \ \ ContentSettingsType\ type\)\ \{\

      \ \ const\ url::Origin\&\ origin\ =\

      \ \ \ \ \ \ web_view_guest\(\)\->owner_rfh\(\)\->GetLastCommittedOrigin\(\);\

      \ \ //\ chrome://glic\ and\ chrome://contextual\-tasks\ requires\ additional\

      '
    replace: "  // old behavior.\n  return embedder_origin.scheme() == content::kChromeUIScheme &&\n         embedder_origin.host() == chrome::kChromeUIGlicHost;\n#else\n  return false;\n#endif  // !BUILDFLAG(IS_ANDROID)\n}\n\nstd::optional<content::PermissionResult>\nChromeWebViewPermissionHelperDelegate::OverridePermissionResult(\n    ContentSettingsType type) {\n#if !BUILDFLAG(IS_ANDROID)\n  const url::Origin& origin =\n      web_view_guest()->owner_rfh()->GetLastCommittedOrigin();\n  // chrome://glic and chrome://contextual-tasks requires additional\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/guest_view/web_view/chrome_web_view_permission_helper_delegate.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ break;\

      \ \ \ \ \}\

      \ \ \}\

      \ \ return\ std::nullopt;\

      \}\

      \

      '
    replace: "        break;\n    }\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  return std::nullopt;\n}\n\n"
