# Android selected-tab device chooser lifetime.
substitutions:
- description: Forward declare exact-document chooser lifetime
  regex:
    re_pattern: class\ SerialChooserDialogAndroid;
    replace: 'class SerialChooserDialogAndroid;

      class ActiveDeviceChooserRequest;'
- description: Retain cancellation until the chooser closes
  regex:
    re_pattern: \ \ std::unique_ptr<SerialChooserDialogAndroid>\ dialog_;
    replace: "  std::unique_ptr<ActiveDeviceChooserRequest> request_;\n  std::unique_ptr<SerialChooserDialogAndroid> dialog_;"
