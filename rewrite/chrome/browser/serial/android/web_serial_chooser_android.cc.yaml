# Android selected-tab device chooser lifetime.
substitutions:
- description: Reuse selected-tab and exact-document request guard
  regex:
    re_pattern: \#include\ "chrome/browser/ui/android/device_dialog/
    replace: '#include "brave/browser/ui/android/device_chooser/active_device_chooser_request.h"


      #include "chrome/browser/ui/android/device_dialog/'
- description: Reject inactive and unavailable tabs before showing Android chooser UI
  regex:
    re_pattern: \ \ dialog_\ =\ SerialChooserDialogAndroid::Create\(
    replace: "  request_ = std::make_unique<ActiveDeviceChooserRequest>(\n      frame, base::BindOnce(&WebSerialChooserAndroid::OnDialogClosed,\n                            base::Unretained(this)));\n  if (!request_->IsValid()) return;\n  dialog_ = SerialChooserDialogAndroid::Create("
- description: Cancel document tracking before completing the existing denial path
  regex:
    re_pattern: \ \ dialog_\.reset\(\);
    replace: "  // Detach the guard before destroying the controller, whose cancellation\n  // callback can reenter the service or delete this chooser.\n  request_.reset();\n  dialog_.reset();"
- description: Format Android chooser lifetime changes
  regex:
    re_pattern: '\ \ \ \ std::unique_ptr<SerialChooserController>\ controller\)\ \{\

      \ \ request_\ =\ std::make_unique<ActiveDeviceChooserRequest>\(\

      \ \ \ \ \ \ frame,\ base::BindOnce\(\&WebSerialChooserAndroid::OnDialogClosed,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::Unretained\(this\)\)\);\

      \ \ if\ \(!request_\->IsValid\(\)\)\ return;\

      \ \ dialog_\ =\ SerialChooserDialogAndroid::Create\(\

      \ \ \ \ \ \ frame,\ std::move\(controller\),\

      \ \ \ \ \ \ base::BindOnce\(\&WebSerialChooserAndroid::OnDialogClosed,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::Unretained\(this\)\)\);\

      '
    replace: "    std::unique_ptr<SerialChooserController> controller) {\n  request_ = std::make_unique<ActiveDeviceChooserRequest>(\n      frame, base::BindOnce(&WebSerialChooserAndroid::OnDialogClosed,\n                            base::Unretained(this)));\n  if (!request_->IsValid())\n    return;\n  dialog_ = SerialChooserDialogAndroid::Create(\n      frame, std::move(controller),\n      base::BindOnce(&WebSerialChooserAndroid::OnDialogClosed,\n                     base::Unretained(this)));\n"
