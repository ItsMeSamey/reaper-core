# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/chrome_navigation_ui_data.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/renderer_host/chrome_navigation_ui_data\.h"\

      \

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/actor/actor_keyed_service\.h"\

      \#include\ "chrome/browser/actor/actor_task\.h"\

      \#include\ "chrome/browser/preloading/prefetch/no_state_prefetch/chrome_no_state_prefetch_contents_delegate\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      \#include\ "components/actor/core/task_id\.h"\

      \#include\ "components/no_state_prefetch/browser/no_state_prefetch_contents\.h"\

      \#include\ "content/public/browser/navigation_handle\.h"\

      \#include\ "content/public/browser/web_contents\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/renderer_host/chrome_navigation_ui_data.h"

      #include "build/build_config.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/actor_keyed_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/actor_task.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/preloading/prefetch/no_state_prefetch/chrome_no_state_prefetch_contents_delegate.h"

      #include "chrome/browser/profiles/profile.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/actor/core/task_id.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "components/no_state_prefetch/browser/no_state_prefetch_contents.h"

      #include "content/public/browser/navigation_handle.h"

      #include "content/public/browser/web_contents.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/chrome_navigation_ui_data.cc'
  regex:
    re_pattern: '\#endif\

      \

      namespace\ \{\

      actor::TaskId\ GetActorTaskId\(content::WebContents\&\ web_contents\)\ \{\

      \ \ if\ \(auto\*\ actor_keyed_service\ =\

      \ \ \ \ \ \ \ \ \ \ actor::ActorKeyedService::Get\(web_contents\.GetBrowserContext\(\)\)\)\ \{\

      '
    replace: "#endif\n\nnamespace {\n#if !BUILDFLAG(IS_ANDROID)\nactor::TaskId GetActorTaskId(content::WebContents& web_contents) {\n  if (auto* actor_keyed_service =\n          actor::ActorKeyedService::Get(web_contents.GetBrowserContext())) {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/chrome_navigation_ui_data.cc'
  regex:
    re_pattern: '\ \ \}\

      \ \ return\ actor::TaskId\(\);\

      \}\

      \}\ \ //\ namespace\

      \

      ChromeNavigationUIData::ChromeNavigationUIData\(\)\ =\ default;\

      '
    replace: "  }\n  return actor::TaskId();\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n}  // namespace\n\nChromeNavigationUIData::ChromeNavigationUIData() = default;\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/chrome_navigation_ui_data.cc'
  regex:
    re_pattern: '\ \ \ \ is_no_state_prefetching_\ =\ true;\

      \ \ \}\

      \

      \ \ actor_task_id_\ =\ GetActorTaskId\(\*web_contents\);\

      \}\

      \

      ChromeNavigationUIData::\~ChromeNavigationUIData\(\)\ =\ default;\

      '
    replace: "    is_no_state_prefetching_ = true;\n  }\n\n#if !BUILDFLAG(IS_ANDROID)\n  actor_task_id_ = GetActorTaskId(*web_contents);\n#endif  // !BUILDFLAG(IS_ANDROID)\n}\n\nChromeNavigationUIData::~ChromeNavigationUIData() = default;\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/chrome_navigation_ui_data.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ web_contents,\ tab_id,\ window_id\);\

      \#endif\

      \

      \ \ navigation_ui_data\->actor_task_id_\ =\ GetActorTaskId\(\*web_contents\);\

      \

      \ \ return\ navigation_ui_data;\

      \}\

      '
    replace: "          web_contents, tab_id, window_id);\n#endif\n\n#if !BUILDFLAG(IS_ANDROID)\n  navigation_ui_data->actor_task_id_ = GetActorTaskId(*web_contents);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  return navigation_ui_data;\n}\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/chrome_navigation_ui_data.cc'
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ copy\->twa_launch_token_\ =\ twa_launch_token_;\

      \#endif\

      \ \ copy\->actor_task_id_\ =\ actor_task_id_;\

      \ \ copy\->navigation_initiated_from_sync_\ =\ navigation_initiated_from_sync_;\

      \

      \ \ return\ std::move\(copy\);\

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  copy->twa_launch_token_ = twa_launch_token_;\n#endif\n#if !BUILDFLAG(IS_ANDROID)\n  copy->actor_task_id_ = actor_task_id_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n  copy->navigation_initiated_from_sync_ = navigation_initiated_from_sync_;\n\n  return std::move(copy);\n"
