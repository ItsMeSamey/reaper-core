# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/chrome_navigation_ui_data.h'
  regex:
    re_pattern: '\#define\ CHROME_BROWSER_RENDERER_HOST_CHROME_NAVIGATION_UI_DATA_H_\

      \

      \#include\ <memory>\

      \#include\ <optional>\

      \#include\ <string>\

      \

      \#include\ "build/build_config\.h"\

      \#include\ "components/actor/core/task_id\.h"\

      \#include\ "components/offline_pages/buildflags/buildflags\.h"\

      \#include\ "components/offline_pages/core/request_header/offline_page_navigation_ui_data\.h"\

      \#include\ "content/public/browser/navigation_ui_data\.h"\

      '
    replace: '#define CHROME_BROWSER_RENDERER_HOST_CHROME_NAVIGATION_UI_DATA_H_


      #include <memory>

      #include "build/build_config.h"

      #include <optional>

      #include <string>


      #if !BUILDFLAG(IS_ANDROID)

      #include "components/actor/core/task_id.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "components/offline_pages/buildflags/buildflags.h"

      #include "components/offline_pages/core/request_header/offline_page_navigation_ui_data.h"

      #include "content/public/browser/navigation_ui_data.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/chrome_navigation_ui_data.h'
  regex:
    re_pattern: '\ \ \}\

      \#endif\

      \

      \ \ actor::TaskId\ actor_task_id\(\)\ const\ \{\ return\ actor_task_id_;\ \}\

      \

      \ \ bool\ navigation_initiated_from_sync\(\)\ \{\

      \ \ \ \ return\ navigation_initiated_from_sync_;\

      '
    replace: "  }\n#endif\n\n#if !BUILDFLAG(IS_ANDROID)\n  actor::TaskId actor_task_id() const { return actor_task_id_; }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  bool navigation_initiated_from_sync() {\n    return navigation_initiated_from_sync_;\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/chrome_navigation_ui_data.h'
  regex:
    re_pattern: '\ \ //\ navigation\.\

      \ \ bool\ navigation_initiated_from_sync_\ =\ false;\

      \

      \ \ //\ Id\ of\ the\ actor\ task\ active\ during\ this\ navigation\.\ Set\ only\ if\ actor\ was\

      \ \ //\ acting\ on\ the\ tab\ when\ the\ navigation\ started\.\

      \ \ actor::TaskId\ actor_task_id_;\

      \};\

      \

      \#endif\ \ //\ CHROME_BROWSER_RENDERER_HOST_CHROME_NAVIGATION_UI_DATA_H_\

      '
    replace: "  // navigation.\n  bool navigation_initiated_from_sync_ = false;\n\n#if !BUILDFLAG(IS_ANDROID)\n  // Id of the actor task active during this navigation. Set only if actor was\n  // acting on the tab when the navigation started.\n  actor::TaskId actor_task_id_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n};\n\n#endif  // CHROME_BROWSER_RENDERER_HOST_CHROME_NAVIGATION_UI_DATA_H_\n"
