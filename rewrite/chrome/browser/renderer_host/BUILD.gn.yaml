# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//content/public/browser",\

      \ \ \ \ "//extensions/buildflags",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ "//chrome/browser/actor",\

      \ \ \ \ "//chrome/browser/preloading/prefetch/no_state_prefetch",\

      \ \ \]\

      \

      \ \ if\ \(enable_extensions\)\ \{\

      \ \ \ \ public_deps\ \+=\ \[\ "//extensions/browser"\ \]\

      '
    replace: "    \"//content/public/browser\",\n    \"//extensions/buildflags\",\n  ]\n  if (is_android) {\n    public_deps -= [ \"//components/actor/core:task_id\" ]\n  }\n  deps = [\n    \"//chrome/browser/actor\",\n    \"//chrome/browser/preloading/prefetch/no_state_prefetch\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/actor\" ]\n  }\n\n  if (enable_extensions) {\n    public_deps += [ \"//extensions/browser\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_host/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/ui",\

      \ \ \ \ \ \ "//components/spellcheck/browser",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      \

      '
    replace: "      \"//chrome/browser/ui\",\n      \"//components/spellcheck/browser\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor/ui:actor_overlay\",\n        \"//chrome/browser/glic\",\n      ]\n    }\n  }\n}\n\n"
