# Android Chromium Discover implementation exclusion.
substitutions:
- description: Have the factory build and return BraveBrowsingDataRemoverDelegate.
  rename_class:
    class_name: ChromeBrowsingDataRemoverDelegate
    rename: BraveBrowsingDataRemoverDelegate
- description: Remove the dependency on an absent Discover cache service
  regex:
    re_pattern: '\#include\ "chrome/browser/feed/feed_service_factory\.h"\

      '
    replace: ''
- description: Browsing-data deletion no longer constructs a Discover service
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ DependsOn\(feed::FeedServiceFactory::GetInstance\(\)\);\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      '
    replace: ''
