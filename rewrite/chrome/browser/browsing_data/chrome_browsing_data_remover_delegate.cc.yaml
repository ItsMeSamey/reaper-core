# Android Chromium Discover implementation exclusion.
substitutions:
- description: 'Return the histogram suffix for the kIPFSCache task

    '
  regex:
    re_pattern: (ChromeBrowsingDataRemoverDelegate::GetHistogramSuffix\(.*?switch \(task\) \{\n)
    re_flags:
    - DOTALL
    replace: "\\1    case TracingDataType::kIPFSCache:\n      return \"IPFSCache\";\n"
- description: Delete only Discover cache implementation includes
  regex:
    re_pattern: '\#include\ "chrome/browser/feed/feed_service_factory\.h"\

      '
    replace: ''
- description: Delete only Discover cache implementation includes
  regex:
    re_pattern: '\#include\ "components/feed/core/v2/public/feed_service\.h"\ \ \ \ //\ nogncheck\

      '
    replace: ''
- description: Remove Discover cache cleanup while retaining Chromium cache and offline-page deletion
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ if\ \(filter_builder\->MatchesMostOriginsAndDomains\(\)\)\ \{\

      \ \ \ \ \ \ //\ Don''t\ bridge\ through\ if\ the\ service\ isn''t\ present,\ which\ means\

      \ \ \ \ \ \ //\ we''re\ probably\ running\ in\ a\ native\ unit\ test\.\

      \ \ \ \ \ \ feed::FeedService\*\ service\ =\

      \ \ \ \ \ \ \ \ \ \ feed::FeedServiceFactory::GetForBrowserContext\(profile_\);\

      \ \ \ \ \ \ if\ \(service\)\ \{\

      \ \ \ \ \ \ \ \ service\->ClearCachedData\(\);\

      \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      '
    replace: ''
- description: Format Android Chromium Discover exclusion
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ prerender::NoStatePrefetchManagerFactory::GetForBrowserContext\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ profile_\)\);\

      \ \ \ \ \}\

      \

      \

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ \ \ //\ For\ now\ we''re\ considering\ offline\ pages\ as\ cache,\ so\ if\ we''re\ removing\

      \ \ \ \ //\ cache\ we\ should\ remove\ offline\ pages\ as\ well\.\

      \ \ \ \ if\ \(remove_mask\ \&\ content::BrowsingDataRemover::DATA_TYPE_CACHE\)\ \{\

      '
    replace: "          prerender::NoStatePrefetchManagerFactory::GetForBrowserContext(\n              profile_));\n    }\n\n#if BUILDFLAG(IS_ANDROID)\n    // For now we're considering offline pages as cache, so if we're removing\n    // cache we should remove offline pages as well.\n    if (remove_mask & content::BrowsingDataRemover::DATA_TYPE_CACHE) {\n"
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\#include\ "base/trace_event/trace_event\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/autocomplete/zero_suggest_cache_service_factory\.h"\

      \#include\ "chrome/browser/autofill/autofill_entity_data_manager_factory\.h"\

      \#include\ "chrome/browser/autofill/personal_data_manager_factory\.h"\

      \#include\ "chrome/browser/bookmarks/bookmark_model_factory\.h"\

      \#include\ "chrome/browser/browser_process\.h"\

      '
    replace: '#include "base/trace_event/trace_event.h"

      #include "build/build_config.h"

      #include "chrome/browser/autocomplete/zero_suggest_cache_service_factory.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/autofill/autofill_entity_data_manager_factory.h"

      #endif

      #include "chrome/browser/autofill/personal_data_manager_factory.h"

      #include "chrome/browser/bookmarks/bookmark_model_factory.h"

      #include "chrome/browser/browser_process.h"

      '
