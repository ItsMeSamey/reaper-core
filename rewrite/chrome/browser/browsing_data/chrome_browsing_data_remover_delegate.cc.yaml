- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ \ \ if\ \(web_data_service\.get\(\)\)\ \{\

      \ \ \ \ \ \ web_data_service\->RemoveFormElementsAddedBetween\(delete_begin_,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ delete_end_\);\

      \ \ \ \ \ \ if\ \(autofill::EntityDataManager\*\ entity_data_manager\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ autofill::AutofillEntityDataManagerFactory::GetForProfile\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ profile_\)\)\ \{\

      \ \ \ \ \ \ \ \ entity_data_manager\->RemoveEntityInstancesModifiedBetween\(delete_begin_,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ delete_end_\);\

      \ \ \ \ \ \ \}\

      \ \ \ \ \ \ //\ Clear\ out\ the\ Autofill\ StrikeDatabase\ in\ its\ entirety\.\

      \ \ \ \ \ \ //\ TODO\(crbug\.com/40594007\):\ Respect\ \|delete_begin_\|\ and\ \|delete_end_\|\ and\

      \ \ \ \ \ \ //\ only\ clear\ out\ entries\ whose\ last\ strikes\ were\ created\ in\ that\

      '
    replace: "    if (web_data_service.get()) {\n      web_data_service->RemoveFormElementsAddedBetween(delete_begin_,\n                                                       delete_end_);\n#if !BUILDFLAG(IS_ANDROID)\n      if (autofill::EntityDataManager* entity_data_manager =\n              autofill::AutofillEntityDataManagerFactory::GetForProfile(\n                  profile_)) {\n        entity_data_manager->RemoveEntityInstancesModifiedBetween(delete_begin_,\n                                                                  delete_end_);\n      }\n#endif\n      // Clear out the Autofill StrikeDatabase in its entirety.\n      // TODO(crbug.com/40594007): Respect |delete_begin_| and |delete_end_| and\n      // only clear out entries whose last strikes were created in that\n"
