# Android Chromium Discover implementation exclusion.
substitutions:
- description: Expose the AI Chat buildflags to the browsing data constants.
  insert_into_list:
    target: constants
    list_name: public_deps
    values:
    - //brave/components/ai_chat/core/common/buildflags
- description: Exclude Android Discover implementation from the production native or resource graph
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/feed",\

      '
    replace: ''
- description: Exclude the Android shopping backend from impl while preserving shared providers and desktop
  regex:
    pattern: "    ]\n  }\n\n  if (is_android) {\n    deps += [ \"//chrome/browser/offline_pages\" ]\n  }\n}"
    replace: "    ]\n  }\n\n  if (is_android) {\n    deps += [ \"//chrome/browser/offline_pages\" ]\n  }\n  if (is_android)\
      \ {\n    deps -= [\n      \"//components/commerce/core:shopping_service\",\n    ]\n  }\n\n}"
  count: 1
- description: Exclude the Android shopping backend from unit_tests while preserving shared providers and desktop
  regex:
    pattern: "    deps += [\n      \"//chrome/browser/android\",\n      \"//chrome/browser/bookmarks\",\n      \"//chrome/browser/ui/android/tab_model:test_support\"\
      ,\n    ]\n  }\n}"
    replace: "    deps += [\n      \"//chrome/browser/android\",\n      \"//chrome/browser/bookmarks\",\n      \"//chrome/browser/ui/android/tab_model:test_support\"\
      ,\n    ]\n  }\n  if (is_android) {\n    deps -= [\n      \"//components/commerce/core:shopping_service_test_support\"\
      ,\n    ]\n  }\n\n}"
  count: 1
- description: Exclude the Android shopping backend from platform_browser_tests while preserving shared providers and desktop
  regex:
    pattern: "    \"//testing/gtest\",\n  ]\n\n  if (!is_android) {\n    deps += [ \"//chrome/browser/ui/browser_window\"\
      \ ]\n  }\n}"
    replace: "    \"//testing/gtest\",\n  ]\n\n  if (!is_android) {\n    deps += [ \"//chrome/browser/ui/browser_window\"\
      \ ]\n  }\n  if (is_android) {\n    deps -= [\n      \"//components/commerce/core:shopping_service_test_support\",\n\
      \    ]\n  }\n\n}"
  count: 1
- description: Exclude the unused Android commerce eligibility dependency after removing the shopping history observer branch
  regex:
    pattern: "  if (is_android) {\n    deps -= [\n      \"//components/commerce/core:shopping_service\",\n    ]\n  }\n"
    replace: "  if (is_android) {\n    deps -= [\n      \"//components/commerce/core:feature_utils\",\n      \"//components/commerce/core:shopping_service\"\
      ,\n    ]\n  }\n"
  count: 1
- description: Remove stale Android browsing-data edge after exact40+4 retained consumer closure.
  regex:
    pattern: '      "//chrome/browser/commerce/merchant_viewer:merchant_viewer_data_manager",

      '
    replace: ''
  count: 1
- description: Apply exact pinned GN formatting only (whitespace and optional trailing list commas); declarations, strings
    and comments unchanged.
  regex:
    pattern: "      \"//components/commerce/core:shopping_service\",\n    ]\n  }\n\n}\n\nsource_set(\"unit_tests\") {\n"
    replace: "      \"//components/commerce/core:shopping_service\",\n    ]\n  }\n}\n\nsource_set(\"unit_tests\") {\n"
