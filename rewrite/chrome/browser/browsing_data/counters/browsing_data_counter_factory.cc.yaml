substitutions:
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\#include\ "base/functional/bind\.h"\

      \#include\ "base/functional/callback_helpers\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/autofill/autofill_entity_data_manager_factory\.h"\

      \#include\ "chrome/browser/autofill/personal_data_manager_factory\.h"\

      \#include\ "chrome/browser/browsing_data/counters/browsing_data_counter_utils\.h"\

      \#include\ "chrome/browser/browsing_data/counters/cache_counter\.h"\

      '
    replace: '#include "base/functional/bind.h"

      #include "base/functional/callback_helpers.h"

      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/autofill/autofill_entity_data_manager_factory.h"

      #endif

      #include "chrome/browser/autofill/personal_data_manager_factory.h"

      #include "chrome/browser/browsing_data/counters/browsing_data_counter_utils.h"

      #include "chrome/browser/browsing_data/counters/cache_counter.h"

      '
- description: Android optional entity-provider adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ autofill::PersonalDataManagerFactory::GetForBrowserContext\(profile\),\

      \ \ \ \ \ \ \ \ WebDataServiceFactory::GetAutofillWebDataForProfile\(\

      \ \ \ \ \ \ \ \ \ \ \ \ profile,\ ServiceAccessType::EXPLICIT_ACCESS\),\

      \ \ \ \ \ \ \ \ autofill::AutofillEntityDataManagerFactory::GetForProfile\(profile\),\

      \ \ \ \ \ \ \ \ SyncServiceFactory::GetForProfile\(profile\)\);\

      \ \ \}\

      \

      '
    replace: "        autofill::PersonalDataManagerFactory::GetForBrowserContext(profile),\n        WebDataServiceFactory::GetAutofillWebDataForProfile(\n            profile, ServiceAccessType::EXPLICIT_ACCESS),\n#if !BUILDFLAG(IS_ANDROID)\n        autofill::AutofillEntityDataManagerFactory::GetForProfile(profile),\n#endif\n        SyncServiceFactory::GetForProfile(profile));\n  }\n\n"
