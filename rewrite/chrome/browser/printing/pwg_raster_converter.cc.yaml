substitutions:
- description: Scope print service cancellation to Android.
  regex:
    re_pattern: \#include\ "base/cancelable_callback\.h"
    replace: '#include "base/cancelable_callback.h"

      #include "build/build_config.h"'
- description: Close Android converter requests on canceled or timed-out print jobs.
  regex:
    re_pattern: '\ private:\

      \ \ friend\ class\ base::RefCounted<PwgRasterConverterHelper>;'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  void Cancel() {\n    callback_.Reset();\n    pdf_to_pwg_raster_converter_remote_.reset();\n  }\n#endif\n\n private:\n  friend class base::RefCounted<PwgRasterConverterHelper>;"
- description: Release Android converter callbacks during native client teardown.
  regex:
    re_pattern: PwgRasterConverterImpl::\~PwgRasterConverterImpl\(\)\ =\ default;
    replace: "PwgRasterConverterImpl::~PwgRasterConverterImpl() {\n#if BUILDFLAG(IS_ANDROID)\n  if (utility_client_)\n    utility_client_->Cancel();\n#endif\n}"
- description: Keep the Android helper alive across synchronous failure callbacks.
  regex:
    re_pattern: '\ \ \ \ uint32_t\ page_count\)\ \{\

      \ \ DCHECK_CURRENTLY_ON\(BrowserThread::UI\);\

      \ \ if\ \(callback_\)\ \{'
    replace: "    uint32_t page_count) {\n  DCHECK_CURRENTLY_ON(BrowserThread::UI);\n#if BUILDFLAG(IS_ANDROID)\n  // A synchronous failure can destroy the owning converter in its callback.\n  scoped_refptr<PwgRasterConverterHelper> keep_alive(this);\n#endif\n  if (callback_) {"
