# Android retains ordinary image annotation while physically omitting Manta/Anchovy integration.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/accessibility/accessibility_labels_service.cc'
  regex:
    re_pattern: '\#include\ "base/strings/string_split\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/language/url_language_histogram_factory\.h"\

      \#include\ "chrome/browser/manta/manta_service_factory\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      \#include\ "chrome/common/channel_info\.h"\

      \#include\ "chrome/common/pref_names\.h"\

      \#include\ "components/language/core/browser/language_usage_metrics\.h"\

      \#include\ "components/language/core/browser/pref_names\.h"\

      \#include\ "components/language/core/browser/url_language_histogram\.h"\

      \#include\ "components/manta/manta_service\.h"\

      \#include\ "components/pref_registry/pref_registry_syncable\.h"\

      \#include\ "components/prefs/pref_service\.h"\

      \#include\ "components/sync_preferences/pref_service_syncable\.h"\

      '
    replace: '#include "base/strings/string_split.h"

      #include "build/build_config.h"

      #include "chrome/browser/language/url_language_histogram_factory.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/manta/manta_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/profiles/profile.h"

      #include "chrome/common/channel_info.h"

      #include "chrome/common/pref_names.h"

      #include "components/language/core/browser/language_usage_metrics.h"

      #include "components/language/core/browser/pref_names.h"

      #include "components/language/core/browser/url_language_histogram.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/manta/manta_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "components/pref_registry/pref_registry_syncable.h"

      #include "components/prefs/pref_service.h"

      #include "components/sync_preferences/pref_service_syncable.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/accessibility/accessibility_labels_service.cc'
  regex:
    re_pattern: '\ \ \ \ if\ \(binder\)\ \{\

      \ \ \ \ \ \ binder\.Run\(std::move\(service_receiver\)\);\

      \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ auto\*\ manta_service\ =\ manta::MantaServiceFactory::GetForProfile\(profile_\);\

      \ \ \ \ \ \ CHECK\(manta_service\);\

      \ \ \ \ \ \ service_\ =\ std::make_unique<image_annotation::ImageAnnotationService>\(\

      \ \ \ \ \ \ \ \ \ \ std::move\(service_receiver\),\

      \ \ \ \ \ \ \ \ \ \ google_apis::GetAPIKey\(chrome::GetChannel\(\)\),\

      \ \ \ \ \ \ \ \ \ \ profile_\->GetURLLoaderFactory\(\),\

      \ \ \ \ \ \ \ \ \ \ manta_service\->CreateAnchovyProvider\(\),\

      \ \ \ \ \ \ \ \ \ \ std::make_unique<ImageAnnotatorClient>\(profile_\)\);\

      \ \ \ \ \}\

      \ \ \}\

      '
    replace: "    if (binder) {\n      binder.Run(std::move(service_receiver));\n    } else {\n#if !BUILDFLAG(IS_ANDROID)\n      auto* manta_service = manta::MantaServiceFactory::GetForProfile(profile_);\n      CHECK(manta_service);\n#endif  // !BUILDFLAG(IS_ANDROID)\n      service_ = std::make_unique<image_annotation::ImageAnnotationService>(\n          std::move(service_receiver),\n          google_apis::GetAPIKey(chrome::GetChannel()),\n          profile_->GetURLLoaderFactory(),\n#if !BUILDFLAG(IS_ANDROID)\n          manta_service->CreateAnchovyProvider(),\n#endif  // !BUILDFLAG(IS_ANDROID)\n          std::make_unique<ImageAnnotatorClient>(profile_));\n    }\n  }\n"
