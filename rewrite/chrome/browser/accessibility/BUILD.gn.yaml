substitutions:

  - description: "Expose shared image animation preference declarations on Android."
    regex:
      pattern: "  if (enable_extensions) {\n    public += [ \"animation_policy_prefs.h\" ]"
      replace: "  if (enable_extensions_core) {\n    public += [ \"animation_policy_prefs.h\" ]"

  - description: "Build shared image animation preference registration on Android."
    regex:
      pattern: "  if (enable_extensions) {\n    sources += [ \"animation_policy_prefs.cc\" ]"
      replace: "  if (enable_extensions_core) {\n    sources += [ \"animation_policy_prefs.cc\" ]"

  - description: 'Android concrete AI source/provider removal: chrome/browser/accessibility/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//ui/accessibility",\

        \ \ \ \ "//ui/accessibility/platform",\

        \ \ \]\

        \

        \ \ if\ \(is_android\)\ \{\

        \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/image_descriptions:jni_headers"\ \]\

        '
      replace: "    \"//ui/accessibility\",\n    \"//ui/accessibility/platform\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/manta\",\n      \"//components/manta\",\n    ]\n  }\n\n  if (is_android) {\n    deps += [ \"//chrome/browser/image_descriptions:jni_headers\" ]\n"
  - description: Exclude dedicated browser image-label public headers on Android
    regex:
      pattern: "  public = [\n    \"accessibility_labels_service.h\",\n    \"accessibility_labels_service_factory.h\",\n   \
        \ \"pdf_ocr_metrics.h\",\n    \"prefers_default_scrollbar_styles_prefs.h\",\n  ]\n"
      replace: "  public = [\n    \"accessibility_labels_service.h\",\n    \"accessibility_labels_service_factory.h\",\n   \
        \ \"pdf_ocr_metrics.h\",\n    \"prefers_default_scrollbar_styles_prefs.h\",\n  ]\n  if (is_android) {\n    public -=\
        \ [\n      \"accessibility_labels_service.h\",\n      \"accessibility_labels_service_factory.h\",\n    ]\n  }\n"
    count: 1
  - description: Exclude image annotation protocol dependency from Android accessibility
    regex:
      pattern: "    \"//services/image_annotation/public/mojom\",\n  ]\n"
      replace: "    \"//services/image_annotation/public/mojom\",\n  ]\n  if (is_android) {\n    public_deps -= [ \"//services/image_annotation/public/mojom\"\
        \ ]\n  }\n"
    count: 1
  - description: Exclude image-label browser backend and factory sources on Android
    regex:
      pattern: "  sources = [\n    \"accessibility_labels_service.cc\",\n    \"accessibility_labels_service_factory.cc\",\n\
        \    \"pdf_ocr_metrics.cc\",\n    \"prefers_default_scrollbar_styles_prefs.cc\",\n  ]\n"
      replace: "  sources = [\n    \"accessibility_labels_service.cc\",\n    \"accessibility_labels_service_factory.cc\",\n\
        \    \"pdf_ocr_metrics.cc\",\n    \"prefers_default_scrollbar_styles_prefs.cc\",\n  ]\n  if (is_android) {\n    sources\
        \ -= [\n      \"accessibility_labels_service.cc\",\n      \"accessibility_labels_service_factory.cc\",\n    ]\n  }\n"
    count: 1
  - description: Remove the Android incoming image annotation service dependency
    regex:
      pattern: "    deps -= [\n      \"//chrome/browser/manta\",\n"
      replace: "    deps -= [\n      \"//chrome/browser/manta\",\n      \"//services/image_annotation:service\",\n"
    count: 1
  - description: Remove dedicated Android image-description JNI admission
    regex:
      pattern: "  if (is_android) {\n    deps += [ \"//chrome/browser/image_descriptions:jni_headers\" ]\n  }\n\n"
      replace: ''
    count: 1
  - description: Normalize only the new Android dependency list using pinned GN formatting
    regex:
      pattern: "      \"//chrome/browser/manta\",\n      \"//services/image_annotation:service\",\n      \"//components/manta\"\
        ,\n"
      replace: "      \"//chrome/browser/manta\",\n      \"//components/manta\",\n      \"//services/image_annotation:service\"\
        ,\n"
    count: 1
