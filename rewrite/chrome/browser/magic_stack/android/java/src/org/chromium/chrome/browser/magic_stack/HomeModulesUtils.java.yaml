substitutions:
- description: Remove unavailable donation helper import using the adjacent retained feature-list import as exact inverse
    context
  regex:
    pattern: 'import org.chromium.chrome.browser.auxiliary_search.AuxiliarySearchDonationServiceUtils;

      import org.chromium.chrome.browser.flags.ChromeFeatureList;

      '
    replace: 'import org.chromium.chrome.browser.flags.ChromeFeatureList;

      '
  count: 1
- description: Retain the existing AUXILIARY_SEARCH case and normal title while removing only the donation-dependent title
    branch
  regex:
    pattern: "            case AUXILIARY_SEARCH:\n                // TODO(crbug.com/512359034): Remove this dependency on\
      \ auxiliary search after we\n                // implement a better UX flow.\n                if (AuxiliarySearchDonationServiceUtils.isBrowsingDataDonationEnabled())\
      \ {\n                    return context.getString(R.string.auxiliary_search_browsing_data_module_name);\n          \
      \      }\n                return context.getString(R.string.auxiliary_search_module_name);\n"
    replace: "            case AUXILIARY_SEARCH:\n                return context.getString(R.string.auxiliary_search_module_name);\n"
  count: 1
