substitutions:

  - description: "Android Finds compile-out: Remove Finds WebUI binder provider include"
    regex:
      re_pattern: "\\#include\\ \"chrome/browser/ui/webui/chrome_finds_internals/chrome_finds_internals\\.mojom\\.h\"\\\n"
      replace: ""
    count: 1

  - description: "Android Finds compile-out: Remove Finds WebUI binder provider include"
    regex:
      re_pattern: "\\#include\\ \"chrome/browser/ui/webui/chrome_finds_internals/chrome_finds_internals_ui\\.h\"\\\n"
      replace: ""
    count: 1

  - description: "Android Finds compile-out: Remove Finds WebUI interface binder"
    regex:
      re_pattern: "\\ \\ RegisterWebUIControllerInterfaceBinder<\\\n\\ \\ \\ \\ \\ \\ chrome_finds_internals::mojom::PageHandlerFactory,\\\n\\ \\ \\ \\ \\ \\ chrome_finds_internals::ChromeFindsInternalsUI>\\(map\\);\\\n"
      replace: ""
    count: 1
  - description: Remove excluded Notebook Android binder headers
    regex:
      re_pattern: '\#include\ "components/notebooks/internals/webui/notebooks_internals\.mojom\.h"\

        \#include\ "components/notebooks/internals/webui/notebooks_internals_ui\.h"\

        '
      replace: ''
    count: 1
  - description: Remove excluded Notebook Android page-handler registration
    regex:
      re_pattern: '\ \ RegisterWebUIControllerInterfaceBinder<\

        \ \ \ \ \ \ notebooks_internals::mojom::PageHandlerFactory,\

        \ \ \ \ \ \ notebooks::NotebooksInternalsUI>\(map\);\

        '
      replace: ''
    count: 1
  - description: Remove headers for the excluded Android Feed internals producer.
    regex:
      pattern: '#include "chrome/browser/ui/webui/feed_internals/feed_internals.mojom.h"

        #include "chrome/browser/ui/webui/feed_internals/feed_internals_ui.h"

        '
      replace: ''
    count: 1
  - description: Remove the unused commerce include from the Android-only binder unit.
    regex:
      pattern: '#include "components/commerce/core/commerce_feature_list.h"

        '
      replace: ''
    count: 1
  - description: Remove the excluded Feed internals binder registration; retain notifications internals.
    regex:
      pattern: "  RegisterWebUIControllerInterfaceBinder<feed_internals::mojom::PageHandler,\n                             \
        \            FeedInternalsUI>(map);\n"
      replace: ''
    count: 1
