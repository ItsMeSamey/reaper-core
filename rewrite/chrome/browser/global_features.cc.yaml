substitutions:
  - description: 'Replacing GlobalFeatures with BraveGlobalFeatures'
    regex:
      pattern: 'new GlobalFeatures()'
      replace: 'CreateBraveGlobalFeatures()'

  - description: 'Forward declare CreateBraveGlobalFeatures'
    regex:
      re_pattern: '(namespace {)'
      replace: 'GlobalFeatures* CreateBraveGlobalFeatures();\n\1'

  - description: 'Android concrete AI source/provider removal: chrome/browser/global_features.cc'
    regex:
      re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

        \

        \#include\ "chrome/browser/global_features\.h"\

        \

        \#include\ <memory>\

        \#include\ <utility>\

        '
      replace: '// found in the LICENSE file.


        #include "chrome/browser/global_features.h"

        #include "build/build_config.h"


        #include <memory>

        #include <utility>

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/global_features.cc'
    regex:
      re_pattern: '\#include\ "base/memory/ptr_util\.h"\

        \#include\ "base/no_destructor\.h"\

        \#include\ "build/branding_buildflags\.h"\

        \#include\ "build/build_config\.h"\

        \#include\ "chrome/browser/browser_process\.h"\

        \#include\ "chrome/browser/glic/glic_profile_manager\.h"\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ nogncheck\

        \#include\ "chrome/browser/glic/host/glic_synthetic_trial_manager\.h"\ \ //\ nogncheck\

        \#include\ "chrome/browser/glic/public/glic_enabling\.h"\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ nogncheck\

        \#include\ "chrome/browser/infobars/browser_infobar_manager\.h"\

        \#include\ "chrome/browser/infobars/infobar_features\.h"\

        \#include\ "chrome/browser/local_network_access/ip_address_space_overrides_prefs_observer\.h"\

        '
      replace: '#include "base/memory/ptr_util.h"

        #include "base/no_destructor.h"

        #include "build/branding_buildflags.h"

        #include "chrome/browser/browser_process.h"

        #if !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/glic/glic_profile_manager.h"               // nogncheck

        #endif  // !BUILDFLAG(IS_ANDROID)

        #if !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/glic/host/glic_synthetic_trial_manager.h"  // nogncheck

        #endif  // !BUILDFLAG(IS_ANDROID)

        #if !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/glic/public/glic_enabling.h"               // nogncheck

        #endif  // !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/infobars/browser_infobar_manager.h"

        #include "chrome/browser/infobars/infobar_features.h"

        #include "chrome/browser/local_network_access/ip_address_space_overrides_prefs_observer.h"

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/global_features.cc'
    regex:
      re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

        //\ This\ causes\ a\ gn\ error\ on\ Android\ builds,\ because\ gn\ does\ not\ understand\

        //\ buildflags,\ so\ we\ include\ it\ only\ on\ platforms\ where\ it\ is\ used\.\

        \#include\ "chrome/browser/background/glic/glic_background_mode_manager\.h"\ \ //\ nogncheck\

        \#include\ "chrome/browser/ui/omnibox/omnibox_everywhere/omnibox_everywhere_controller\.h"\

        \#include\ "chrome/browser/ui/omnibox/omnibox_next_features\.h"\

        \#include\ "chrome/browser/ui/tabs/tab_drag_api/desktop_tab_drag_impl/tab_drag_session_desktop_injector\.h"\

        '
      replace: '#if !BUILDFLAG(IS_ANDROID)

        // This causes a gn error on Android builds, because gn does not understand

        // buildflags, so we include it only on platforms where it is used.

        #if !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/background/glic/glic_background_mode_manager.h"  // nogncheck

        #endif  // !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/ui/omnibox/omnibox_everywhere/omnibox_everywhere_controller.h"

        #include "chrome/browser/ui/omnibox/omnibox_next_features.h"

        #include "chrome/browser/ui/tabs/tab_drag_api/desktop_tab_drag_impl/tab_drag_session_desktop_injector.h"

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/global_features.cc'
    regex:
      re_pattern: '\

        \ \ PostBrowserProcessInitCore\(\);\

        \

        \ \ //\ Create\ Glic\ global\ features\ for\ all\ users\ in\ case\ they\ are\ only\

        \ \ //\ temporarily\ ineligible\ \(in\ which\ case\ we\ continue\ to\ show\ the\ entrypoint\

        \ \ //\ but\ surface\ IPH\ dialogs\ instead\ of\ the\ webclient\)\.\

        '
      replace: "\n  PostBrowserProcessInitCore();\n\n#if !BUILDFLAG(IS_ANDROID)\n  // Create Glic global features for all users in case they are only\n  // temporarily ineligible (in which case we continue to show the entrypoint\n  // but surface IPH dialogs instead of the webclient).\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/global_features.cc'
    regex:
      re_pattern: '\ \ \ \ synthetic_trial_manager_\ =\

        \ \ \ \ \ \ \ \ std::make_unique<glic::GlicSyntheticTrialManager>\(\);\

        \ \ \}\

        \

        \#if\ BUILDFLAG\(IS_MAC\)\ \|\|\ BUILDFLAG\(IS_WIN\)\

        \ \ if\ \(base::FeatureList::IsEnabled\(omnibox::kOmniboxEverywhere\)\)\ \{\

        '
      replace: "    synthetic_trial_manager_ =\n        std::make_unique<glic::GlicSyntheticTrialManager>();\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n\n#if BUILDFLAG(IS_MAC) || BUILDFLAG(IS_WIN)\n  if (base::FeatureList::IsEnabled(omnibox::kOmniboxEverywhere)) {\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/global_features.cc'
    regex:
      re_pattern: '\

        \ \ application_locale_storage_\ =\ std::make_unique<ApplicationLocaleStorage>\(\);\

        \

        \ \ glic_global_enabling_\ =\ std::make_unique<glic::GlicGlobalEnabling>\(\);\

        \

        \#if\ BUILDFLAG\(IS_WIN\)\ \&\&\ BUILDFLAG\(GOOGLE_CHROME_BRANDING\)\

        \ \ installer_downloader_controller_\ =\ std::make_unique<\

        '
      replace: "\n  application_locale_storage_ = std::make_unique<ApplicationLocaleStorage>();\n\n#if !BUILDFLAG(IS_ANDROID)\n  glic_global_enabling_ = std::make_unique<glic::GlicGlobalEnabling>();\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if BUILDFLAG(IS_WIN) && BUILDFLAG(GOOGLE_CHROME_BRANDING)\n  installer_downloader_controller_ = std::make_unique<\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/global_features.cc'
    regex:
      re_pattern: '\ \ \}\

        \ \ omnibox_everywhere_controller_\.reset\(\);\

        \#endif\

        \ \ if\ \(glic_profile_manager_\)\ \{\

        \ \ \ \ glic_profile_manager_\->Shutdown\(\);\

        \ \ \ \ glic_profile_manager_\.reset\(\);\

        \ \ \}\

        \ \ synthetic_trial_manager_\.reset\(\);\

        \ \ audio_process_ml_model_forwarder_\.reset\(\);\

        \ \ optimization_guide_global_feature_\.reset\(\);\

        \

        '
      replace: "  }\n  omnibox_everywhere_controller_.reset();\n#endif\n#if !BUILDFLAG(IS_ANDROID)\n  if (glic_profile_manager_) {\n    glic_profile_manager_->Shutdown();\n    glic_profile_manager_.reset();\n  }\n  synthetic_trial_manager_.reset();\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  audio_process_ml_model_forwarder_.reset();\n  optimization_guide_global_feature_.reset();\n\n"
