# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/policy/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//media",\

      \ \ \ \ "//testing/gmock",\

      \ \ \]\

      \

      \ \ if\ \(is_chromeos\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "test/policy_certs_browsertest\.cc"\ \]\

      '
    replace: "    \"//media\",\n    \"//testing/gmock\",\n  ]\n  if (is_android) {\n    deps -= [ \"//components/skills/public\" ]\n  }\n\n  if (is_chromeos) {\n    sources += [ \"test/policy_certs_browsertest.cc\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/policy/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//testing/gmock",\

      \ \ \ \ "//testing/gtest",\

      \ \ \]\

      \

      \ \ if\ \(!is_chromeos\)\ \{\

      \ \ \ \ sources\ \+=\ \[\

      '
    replace: "    \"//testing/gmock\",\n    \"//testing/gtest\",\n  ]\n  if (is_android) {\n    deps -= [ \"//components/skills/public\" ]\n  }\n\n  if (!is_chromeos) {\n    sources += [\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/policy/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//components/variations/service",\

      \ \ \ \ "//services/device/public/cpp:device_features",\

      \ \ \]\

      \

      \ \ if\ \(enable_extensions_core\)\ \{\

      \ \ \ \ sources\ \+=\ \[\

      '
    replace: "    \"//components/variations/service\",\n    \"//services/device/public/cpp:device_features\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/contextual_tasks\",\n      \"//chrome/browser/glic\",\n      \"//components/autofill/core/browser/at_memory/policy\",\n      \"//components/contextual_tasks/public\",\n      \"//components/skills/internal\",\n      \"//components/skills/public\",\n    ]\n  }\n\n  if (enable_extensions_core) {\n    sources += [\n"

- description: "Leave the ERP-only fake target empty on Android; retain its existing policy public dependency."
  count: 1
  regex:
    pattern: "    \"//components/reporting/util:status\",\n  ]\n}\n\nsource_set(\"test_support\") {"
    replace: "    \"//components/reporting/util:status\",\n  ]\n  if (is_android) {\n    sources = []\n    deps = []\n  }\n}\n\nsource_set(\"test_support\") {"
