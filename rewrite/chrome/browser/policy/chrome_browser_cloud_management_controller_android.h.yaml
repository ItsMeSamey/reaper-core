substitutions:
- description: Omit matching Android-only reporting override slot
  regex:
    pattern: "  std::unique_ptr<enterprise_reporting::ReportingDelegateFactory>\n  GetReportingDelegateFactory() override;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<enterprise_reporting::ReportingDelegateFactory>\n  GetReportingDelegateFactory()\
      \ override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit matching Android-only reporting override slot
  regex:
    pattern: "  std::unique_ptr<enterprise_reporting::BrowserLaunchEventController>\n  CreateBrowserLaunchEventController()\
      \ override;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<enterprise_reporting::BrowserLaunchEventController>\n  CreateBrowserLaunchEventController()\
      \ override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Own direct Android platform buildflag provider
  regex:
    pattern: '#include "base/task/single_thread_task_runner.h"

      '
    replace: '#include "base/task/single_thread_task_runner.h"

      #include "build/build_config.h"

      '
  count: 1
