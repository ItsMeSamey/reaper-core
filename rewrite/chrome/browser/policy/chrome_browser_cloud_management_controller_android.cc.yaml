substitutions:
- description: Remove Android concrete SaaS delegate dependency
  regex:
    pattern: '#include "chrome/browser/enterprise/reporting/reporting_delegate_factory_android.h"

      #include "chrome/browser/enterprise/reporting/saas_usage/saas_usage_reporting_delegate_factory_impl.h"

      #include "chrome/browser/net/system_network_context_manager.h"

      '
    replace: '#include "chrome/browser/enterprise/reporting/reporting_delegate_factory_android.h"

      #include "chrome/browser/net/system_network_context_manager.h"

      '
  count: 1
- description: Retain only abstract shared delegate return-type interface in its include group
  regex:
    pattern: '#include "components/enterprise/client_certificates/core/browser_cloud_management_delegate.h"

      '
    replace: '#include "components/enterprise/browser/reporting/saas_usage/saas_usage_reporting_delegate_factory.h"

      #include "components/enterprise/client_certificates/core/browser_cloud_management_delegate.h"

      '
  count: 1
- description: Preserve shared cloud-management interface without creating SaaS feature
  regex:
    pattern: "    GetSaasUsageReportingDelegateFactory() {\n  return enterprise_reporting::SaasUsageReportingDelegateFactoryImpl::\n\
      \      CreateForBrowser();\n}\n"
    replace: "    GetSaasUsageReportingDelegateFactory() {\n  return nullptr;\n}\n"
  count: 1
- description: Omit concrete Android reporting factory include
  regex:
    pattern: '#include "chrome/browser/enterprise/reporting/reporting_delegate_factory_android.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/enterprise/reporting/reporting_delegate_factory_android.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit concrete Android reporting factory construction
  regex:
    pattern: "std::unique_ptr<enterprise_reporting::ReportingDelegateFactory>\nChromeBrowserCloudManagementControllerAndroid::GetReportingDelegateFactory()\
      \ {\n  return std::make_unique<\n      enterprise_reporting::ReportingDelegateFactoryAndroid>();\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::unique_ptr<enterprise_reporting::ReportingDelegateFactory>\nChromeBrowserCloudManagementControllerAndroid::GetReportingDelegateFactory()\
      \ {\n  return std::make_unique<\n      enterprise_reporting::ReportingDelegateFactoryAndroid>();\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit Android generic launch unique_ptr factory interface
  regex:
    pattern: "std::unique_ptr<enterprise_reporting::BrowserLaunchEventController>\nChromeBrowserCloudManagementControllerAndroid::\n\
      \    CreateBrowserLaunchEventController() {\n  // Browser launch reporting is not supported on Android.\n  return nullptr;\n\
      }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::unique_ptr<enterprise_reporting::BrowserLaunchEventController>\nChromeBrowserCloudManagementControllerAndroid::\n\
      \    CreateBrowserLaunchEventController() {\n  // Browser launch reporting is not supported on Android.\n  return nullptr;\n\
      }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Own direct Android platform buildflag provider
  regex:
    pattern: '#include "base/task/single_thread_task_runner.h"

      '
    replace: '#include "base/task/single_thread_task_runner.h"

      #include "build/build_config.h"

      '
  count: 1
