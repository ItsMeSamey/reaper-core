substitutions:
  - description: "Exclude desktop-only CBCM delegate header from Android; retain Android delegate and common controller/policy includes."
    regex:
      pattern: "#include \"chrome/browser/policy/chrome_browser_cloud_management_controller_desktop.h\"\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/policy/chrome_browser_cloud_management_controller_desktop.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
