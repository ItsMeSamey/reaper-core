# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_interface_binders_webui_parts_features.cc'
  regex:
    re_pattern: '\#include\ "build/android_buildflags\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/chrome_browser_interface_binders_webui_parts\.h"\

      \#include\ "chrome/browser/contextual_tasks/contextual_tasks_ui\.h"\

      \#include\ "chrome/browser/glic/experimental_opt_in/glic_experimental_opt_in_ui\.h"\

      \#include\ "chrome/browser/glic/host/glic_internals_ui\.h"\

      \#include\ "chrome/browser/glic/host/glic_overlay_ui\.h"\

      \#include\ "chrome/browser/glic/host/glic_ui\.h"\

      \#include\ "chrome/browser/glic/public/glic_enabling\.h"\

      \#include\ "chrome/browser/ui/ui_features\.h"\

      \#if\ !BUILDFLAG\(IS_ANDROID\)\ \|\|\ BUILDFLAG\(IS_DESKTOP_ANDROID\)\

      \#include\ "chrome/browser/ui/webui/ai_overlay_dialog/ai_overlay_dialog\.mojom\.h"\

      '
    replace: '#include "build/android_buildflags.h"

      #include "build/build_config.h"

      #include "chrome/browser/chrome_browser_interface_binders_webui_parts.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/contextual_tasks/contextual_tasks_ui.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/experimental_opt_in/glic_experimental_opt_in_ui.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/host/glic_internals_ui.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/host/glic_overlay_ui.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/host/glic_ui.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/glic/public/glic_enabling.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/ui_features.h"

      #if !BUILDFLAG(IS_ANDROID) || BUILDFLAG(IS_DESKTOP_ANDROID)

      #include "chrome/browser/ui/webui/ai_overlay_dialog/ai_overlay_dialog.mojom.h"

      '
