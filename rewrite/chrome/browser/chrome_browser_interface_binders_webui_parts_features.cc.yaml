- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_interface_binders_webui_parts_features.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ extensions::ZeroStatePromoController>\(map\);\

      \#endif\

      \

      \ \ if\ \(glic::GlicEnabling::IsProfileEligible\(Profile::FromBrowserContext\(\

      \ \ \ \ \ \ \ \ \ \ render_frame_host\->GetProcess\(\)\->GetBrowserContext\(\)\)\)\)\ \{\

      \ \ \ \ //\ Register\ binders\ for\ all\ eligible\ profiles\.\

      '
