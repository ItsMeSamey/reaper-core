- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_interface_binders_webui_parts_features.cc'
  regex:
    re_pattern: '\#endif\

      \

      \

      \#if\ BUILDFLAG\(ENABLE_SESSION_SERVICE\)\

      \ \ RegisterWebUIControllerInterfaceBinder<\

      \ \ \ \ \ \ tab_strip_internals::mojom::PageHandlerFactory,\ TabStripInternalsUI>\(map\);\

      '
    replace: "#endif\n\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if BUILDFLAG(ENABLE_SESSION_SERVICE)\n  RegisterWebUIControllerInterfaceBinder<\n      tab_strip_internals::mojom::PageHandlerFactory, TabStripInternalsUI>(map);\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/chrome_browser_interface_binders_webui_parts_features.cc'
  regex:
    re_pattern: '\

      void\ PopulateChromeWebUIFrameInterfaceBrokersUntrustedPartsFeatures\(\

      \ \ \ \ content::WebUIBrowserInterfaceBrokerRegistry\&\ registry\)\ \{\

      \#if\ BUILDFLAG\(ENABLE_COMPOSE\)\

      \ \ registry\.ForWebUI<ComposeUntrustedUI>\(\)\

      \ \ \ \ \ \ \.Add<compose::mojom::ComposeSessionUntrustedPageHandlerFactory>\(\);\

      \#endif\ \ //\ BUILDFLAG\(ENABLE_COMPOSE\)\

      '
    replace: "\nvoid PopulateChromeWebUIFrameInterfaceBrokersUntrustedPartsFeatures(\n    content::WebUIBrowserInterfaceBrokerRegistry& registry) {\n#if BUILDFLAG(ENABLE_COMPOSE) && !BUILDFLAG(IS_ANDROID)\n  registry.ForWebUI<ComposeUntrustedUI>()\n      .Add<compose::mojom::ComposeSessionUntrustedPageHandlerFactory>();\n#endif  // BUILDFLAG(ENABLE_COMPOSE)\n"
- description: Android omits the TTC and AI overlay implementation.
  count: 1
  regex:
    re_pattern: "\\#if\\ !BUILDFLAG\\(IS_ANDROID\\)\\ \\|\\|\\ BUILDFLAG\\(IS_DESKTOP_ANDROID\\)\\\n\\#include\\ \"chrome/browser/ui/webui/ai_overlay_dialog/ai_overlay_dialog\\.mojom\\.h\"\\\n\\#include\\ \"chrome/browser/ui/webui/ai_overlay_dialog/ai_overlay_dialog_untrusted_ui\\.h\"\\\n\\#endif\\ \\ //\\ !BUILDFLAG\\(IS_ANDROID\\)\\ \\|\\|\\ BUILDFLAG\\(IS_DESKTOP_ANDROID\\)\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/ui/webui/ai_overlay_dialog/ai_overlay_dialog.mojom.h\"\n#include \"chrome/browser/ui/webui/ai_overlay_dialog/ai_overlay_dialog_untrusted_ui.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Android omits the TTC and AI overlay implementation.
  count: 1
  regex:
    re_pattern: "\\#if\\ !BUILDFLAG\\(IS_ANDROID\\)\\ \\|\\|\\ BUILDFLAG\\(IS_DESKTOP_ANDROID\\)\\\n\\ \\ if\\ \\(base::FeatureList::IsEnabled\\(features::kAiOverlayDialog\\)\\)\\ \\{\\\n\\ \\ \\ \\ registry\\.ForWebUI<ttc::AiOverlayDialogUntrustedUI>\\(\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\.Add<ai_overlay_dialog::mojom::PageHandlerFactory>\\(\\);\\\n\\ \\ \\}\\\n\\#endif\\ \\ //\\ !BUILDFLAG\\(IS_ANDROID\\)\\ \\|\\|\\ BUILDFLAG\\(IS_DESKTOP_ANDROID\\)\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(features::kAiOverlayDialog)) {\n    registry.ForWebUI<ttc::AiOverlayDialogUntrustedUI>()\n        .Add<ai_overlay_dialog::mojom::PageHandlerFactory>();\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
