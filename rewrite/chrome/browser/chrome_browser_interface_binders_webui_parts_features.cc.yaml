  count: 1
  regex:
    re_pattern: "\\ \\ if\\ \\(base::FeatureList::IsEnabled\\(private_ai::kPrivateAi\\)\\)\\ \\{\\\n\\ \\ \\ \\ RegisterWebUIControllerInterfaceBinder<\\\n\\ \\ \\ \\ \\ \\ \\ \\ private_ai_internals::mojom::PrivateAiInternalsPageHandler,\\\n\\ \\ \\ \\ \\ \\ \\ \\ private_ai::PrivateAiInternalsUI>\\(map\\);\\\n\\ \\ \\}\\\n"
