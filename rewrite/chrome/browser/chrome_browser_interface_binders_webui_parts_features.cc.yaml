    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/ui/webui/private_ai_internals/private_ai_internals_ui.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Android omits the compiled-out Private AI binder.
  count: 1
