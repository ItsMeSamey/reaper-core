piler:wexit_time_destructors\",\n      \"//build/config/compiler:wglobal_constructors\",\n    ]\n\n    public_deps = [\n      \"//chrome/browser:browser_public_dependencies\",\n      \"//components/content_extraction/content/browser\",\n    ]\n    deps = [\n      \":ai\",\n      \"//chrome/browser:browser_process\",\n      \"//chrome/browser/component_updater\",\n      \"//chrome/browser/history_embeddings\",\n      \"//chrome/browser/passage_embeddings\",\n      \"//chrome/browser/ui/tabs:tabs_public\",\n      \"//components/autofill/content/browser\",\n      \"//components/autofill/core/browser\",\n      \"//components/history_embeddings/content\",\n      \"//components/history_embeddings/core\",\n      \"//components/language/core/common\",\n      \"//components/optimization_guide/content/browser\",\n      \"//components/optimization_guide/proto:optimization_guide_proto\",\n      \"//components/passage_embeddings/core\",\n      \"//components/site_engagement/content\",\n      \"//pdf:buildflags\",\n      \"//skia\",\n      \"//third_party/protobuf:protobuf_lite\",\n    ]\n    if (!is_android) {\n      deps += [\n        \"//chrome/browser/ui/browser_window\",\n        \"//chrome/browser/ui/tabs:tab_group\",\n        \"//chrome/browser/ui/tabs:tab_strip\",\n      ]\n    }\n    if (enable_pdf) {\n      deps += [\n        \"//components/pdf/browser\",\n        \"//components/pdf/common:constants\",\n      ]\n    }\n  }\n\n  source_set(\"test_support\") {\n    testonly = true\n    sources = [\n      \"ai_test_utils.cc\",\n      \"ai_test_utils.h\",\n    ]\n    public_deps = [\n      \"//chrome/browser/optimization_guide\",\n      \"//chrome/browser/optimization_guide:test_support\",\n      \"//chrome/test:test_support\",\n      \"//components/optimization_guide/core:manifest_broker_test_support\",\n      \"//components/optimization_guide/core:test_support\",\n      \"//testing/gmock\",\n      \"//testing/gtest\",\n    ]\n    deps = [ \":ai\" ]\n  }\n\n  source_set(\"unit_tests\") {\n    testonly = true\n    sources = [\n      \"ai_manager_unittest.cc\",\n      \"ai_summarizer_unittest.cc\",\n      \"ai_utils_unittest.cc\",\n    ]\n    if (!is_android) {\n      sources += [\n        \"ai_language_model_unittest.cc\",\n        \"ai_proofreader_unittest.cc\",\n        \"ai_rewriter_unittest.cc\",\n        \"ai_semantic_embedder_service_launcher_unittest.cc\",\n        \"ai_writer_unittest.cc\",\n      ]\n    }\n    deps = [\n      \":ai\",\n      \":test_support\",\n      \"//chrome/browser/component_updater\",\n      \"//chrome/browser/optimization_guide:test_support\",\n      \"//components/component_updater:test_support\",\n      \"//components/on_device_ai\",\n      \"//components/optimization_guide/core:manifest_broker_test_support\",\n      \"//components/optimization_guide/core:test_support\",\n      \"//components/passage_embeddings/core:test_support\",\n    ]\n  }\n\n  if (!is_android) {\n    source_set(\"browser_tests\") {\n      testonly = true\n      defines = [ \"HAS_OUT_OF_PROC_TEST_RUNNER\" ]\n\n      sources = [\n        \"ai_data_keyed_service_browsertest.cc\",\n        \"ai_semantic_embedder_browsertest.cc\",\n      ]\n\n      deps = [\n        \":ai\",\n        \":test_support\",\n        \"//base\",\n        \"//chrome/browser/actor:test_support\",\n        \"//chrome/browser/ui/browser_window\",\n        \"//chrome/browser/web_applications:web_applications_test_support\",\n        \"//chrome/test:test_support\",\n        \"//chrome/test:test_support_ui\",\n        \"//components/passage_embeddings/core:test_support\",\n        \"//content/test:test_support\",\n        \"//testing/gmock\",\n      ]\n    }\n  }\n\n  if (!is_android && !is_chromeos_device) {\n    source_set(\"interactive_ui_tests\") {\n      testonly = true\n      defines = [ \"HAS_OUT_OF_PROC_TEST_RUNNER\" ]\n\n      sources = [ \"ai_on_device_interactive_uitest.cc\" ]\n\n      deps = [\n        \":ai\",\n        \":test_support\",\n        \"//