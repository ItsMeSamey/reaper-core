substitutions:
- description: Remove obsolete price-notification dependency from the retained co-browse factory.
  regex:
    pattern: 'import org.chromium.chrome.browser.price_tracking.PriceDropNotificationManager;

      '
    replace: ''
  count: 1
- description: Remove obsolete price-notification dependency from the retained co-browse factory.
  regex:
    pattern: '    private final PriceDropNotificationManager mPriceDropNotificationManager;

      '
    replace: ''
  count: 1
- description: Remove obsolete price-notification dependency from the retained co-browse factory.
  regex:
    pattern: '     * @param priceDropNotificationManager The {@link PriceDropNotificationManager} for bookmarks.

      '
    replace: ''
  count: 1
- description: Remove obsolete price-notification dependency from the retained co-browse factory.
  regex:
    pattern: '            PriceDropNotificationManager priceDropNotificationManager,

      '
    replace: ''
  count: 1
- description: Remove obsolete price-notification dependency from the retained co-browse factory.
  regex:
    pattern: '        mPriceDropNotificationManager = priceDropNotificationManager;

      '
    replace: ''
  count: 1
- description: Preserve co-browse reading-list callback without forwarding an excluded notification implementation.
  regex:
    pattern: "                            mBookmarkManagerOpener,\n                            mPriceDropNotificationManager);"
    replace: '                            mBookmarkManagerOpener);'
  count: 1
