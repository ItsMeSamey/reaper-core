substitutions:
- description: Retire the unused dedicated AIM factory import while retaining ordinary test bodies.
  regex:
    pattern: 'import org.chromium.chrome.browser.search_engines.AimEligibilityServiceFactory;

      '
    replace: ''
  count: 1
- description: Retire the dedicated AIM generated JNI mock import.
  regex:
    pattern: 'import org.chromium.chrome.browser.search_engines.AimEligibilityServiceFactoryJni;

      '
    replace: ''
  count: 1
- description: Retire only the unused AIM native mock declaration.
  regex:
    pattern: '    @Mock private AimEligibilityServiceFactory.Natives mAimEligibilityNativesMock;

      '
    replace: ''
  count: 1
- description: Retire only the unused AIM mock registration from ordinary fixture setup.
  regex:
    pattern: '        AimEligibilityServiceFactoryJni.setInstanceForTesting(mAimEligibilityNativesMock);

      '
    replace: ''
  count: 1
