substitutions:
- description: Exclude retired AI starter packs without reading removed Gemini preference or AI eligibility
  regex:
    pattern: "    protected List<TemplateUrl> filterTemplateUrls(List<TemplateUrl> urls) {\n        boolean aimEnabled = AimEligibilityServiceFactory.isAimStarterPackEnabled(mProfile);\n\
      \        boolean geminiEnabled =\n                OmniboxFeatures.sStarterPackExpansion.isEnabled()\n              \
      \          && UserPrefs.get(mProfile).getInteger(Pref.GEMINI_SETTINGS) == 0;\n\n        List<TemplateUrl> filtered =\
      \ new ArrayList<>();\n        for (TemplateUrl url : urls) {\n            int starterPackId = url.getStarterPackId();\n\
      \            if (starterPackId == StarterPackId.AI_MODE && !aimEnabled) {\n                continue;\n            }\n\
      \            if (starterPackId == StarterPackId.GEMINI && !geminiEnabled) {\n                continue;\n           \
      \ }\n            filtered.add(url);\n        }\n        return filtered;\n    }\n"
    replace: "    protected List<TemplateUrl> filterTemplateUrls(List<TemplateUrl> urls) {\n        List<TemplateUrl> filtered\
      \ = new ArrayList<>();\n        for (TemplateUrl url : urls) {\n            int starterPackId = url.getStarterPackId();\n\
      \            if (starterPackId == StarterPackId.AI_MODE || starterPackId == StarterPackId.GEMINI) {\n              \
      \  continue;\n            }\n            filtered.add(url);\n        }\n        return filtered;\n    }\n"
  count: 1
