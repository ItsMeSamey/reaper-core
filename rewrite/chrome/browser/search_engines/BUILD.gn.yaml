# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/search_engines/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "template_url_service_factory\.h",\

      \ \ \ \ "ui_thread_search_terms_data\.h",\

      \ \ \]\

      \

      \ \ sources\ =\ \[\

      \ \ \ \ "ai_mode_button_service_factory\.cc",\

      '
    replace: "    \"template_url_service_factory.h\",\n    \"ui_thread_search_terms_data.h\",\n  ]\n  if (is_android) {\n    public -= [ \"ai_mode_button_service_factory.h\" ]\n  }\n\n  sources = [\n    \"ai_mode_button_service_factory.cc\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/search_engines/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "template_url_service_factory\.cc",\

      \ \ \ \ "ui_thread_search_terms_data\.cc",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ "//base",\

      '
    replace: "    \"template_url_service_factory.cc\",\n    \"ui_thread_search_terms_data.cc\",\n  ]\n  if (is_android) {\n    sources -= [ \"ai_mode_button_service_factory.cc\" ]\n  }\n\n  public_deps = [\n    \"//base\",\n"
