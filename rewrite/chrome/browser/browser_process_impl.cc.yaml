substitutions:
  - description: |
      Construct Brave's `SodaInstaller` as the global one, because Brave ships
      no SODA and installs its own on-device speech model in its place.

      `CreateBraveSodaInstaller` is defined in the chromium_src override of
      this source, returning either Brave's own installer or a stub that
      reports nothing in builds that ship no model.
    regex:
      pattern: 'std::make_unique<speech::SodaInstallerImpl>()'
      replace: 'speech::CreateBraveSodaInstaller()'

  - description: Build the Android extensions code with the core.
    count: 1
    regex:
      pattern: 'BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)'
      replace: 'BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE)'

  - description: "Include the Android storage monitor without desktop-only Chrome clients."
    regex:
      pattern: "#if BUILDFLAG(ENABLE_EXTENSIONS)\n#include \"chrome/common/extensions/chrome_extensions_client.h\""
      replace: "#if BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n#include \"components/storage_monitor/storage_monitor.h\"\n#endif\n\n#if BUILDFLAG(ENABLE_EXTENSIONS)\n#include \"chrome/common/extensions/chrome_extensions_client.h\""

  - description: "Destroy the Android monitor while browser UI infrastructure still exists."
    regex:
      pattern: "#if BUILDFLAG(ENABLE_EXTENSIONS)\n  // Remove the global instance of the Storage Monitor now."
      replace: "#if BUILDFLAG(ENABLE_EXTENSIONS) || BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  // Remove the global instance of the Storage Monitor now."

  - description: "Create the Android monitor before profile extension event listeners."
    regex:
      pattern: "  ChromeJsErrorReportProcessor::Create();\n  storage_monitor::StorageMonitor::Create();\n#endif"
      replace: "  ChromeJsErrorReportProcessor::Create();\n#endif\n#if !BUILDFLAG(IS_ANDROID) || BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)\n  storage_monitor::StorageMonitor::Create();\n#endif"
  - description: "Preserve reviewed Android source projection for chrome/browser/browser_process_impl.cc (operation 6)."
    regex:
      re_pattern: '\ \ \ \ \}\

        \ \ \}\

        \

        \ \ //\ Tell\ the\ metrics\ service\ it\ was\ cleanly\ shutdown\.\

        \ \ metrics::MetricsService\*\ metrics\ =\ g_browser_process\->metrics_service\(\);\

        \ \ if\ \(metrics\)\ \{\

        '
      replace: "    }\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  if (auto* manager = GetMetricsServicesManager()) {\n    manager->LogHasSessionShutdownCleanly(true);\n    local_state_->CommitPendingWrite(base::OnceClosure(),\n                                     rundown_counter->GetRundownClosure());\n  }\n#else\n  // Tell the metrics service it was cleanly shutdown.\n  metrics::MetricsService* metrics = g_browser_process->metrics_service();\n  if (metrics) {\n"
  - description: "Preserve reviewed Android source projection for chrome/browser/browser_process_impl.cc (operation 7)."
    regex:
      re_pattern: '\#endif\

        \ \ \}\

        \

        \ \ //\ This\ wait\ is\ legitimate\ and\ necessary\ on\ Windows,\ since\ the\ process\ will\

        \ \ //\ be\ terminated\ soon\.\

        \ \ //\ http://crbug\.com/40198606\

        '
      replace: "#endif\n  }\n\n#endif\n  // This wait is legitimate and necessary on Windows, since the process will\n  // be terminated soon.\n  // http://crbug.com/40198606\n"
