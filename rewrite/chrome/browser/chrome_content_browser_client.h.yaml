substitutions:
- description: 'Reaper Android: remove built-in AI frame/worker bindings and fallback provider; preserve
    translation and normal browser behavior.'
  regex:
    re_pattern: 'Complete\(content::RenderFrameHost\*\ rfh\)\ override;\

      \

      \ \ void\ ShowCaptionSettings\(content::RenderFrameHost\*\ rfh\)\ override;\

      \

      \ \ void\ BindAIManager\(\

      \ \ \ \ \ \ content::BrowserContext\*\ browser_context,\

      \ \ \ \ \ \ base::SupportsUserData\*\ context_user_data,\

      \ \ \ \ \ \ content::RenderFrameHost\*\ rfh,\

      \ \ \ \ \ \ mojo::PendingReceiver<blink::mojom::AIManager>\ receiver\)\ override;\

      \

      \#if\ BUILDFLAG\(ENABLE_ON_DEVICE_TRANSLATION\)\

      \ \ void\ BindTranslationManager\(\

      \ \ \ \ \ \ content::RenderProcessHost\*\ host,\

      \ \ \ '
    replace: "Complete(content::RenderFrameHost* rfh) override;\n\n  void ShowCaptionSettings(content::RenderFrameHost*\
      \ rfh) override;\n\n#if !BUILDFLAG(IS_ANDROID)\n  void BindAIManager(\n      content::BrowserContext*\
      \ browser_context,\n      base::SupportsUserData* context_user_data,\n      content::RenderFrameHost*\
      \ rfh,\n      mojo::PendingReceiver<blink::mojom::AIManager> receiver) override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n\
      \n#if BUILDFLAG(ENABLE_ON_DEVICE_TRANSLATION)\n  void BindTranslationManager(\n      content::RenderProcessHost*\
      \ host,\n   "
- description: Exclude Android ModelBrokerClient forward declaration
  regex:
    pattern: 'namespace optimization_guide {

      class ModelBrokerClient;

      }  // namespace optimization_guide

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      namespace optimization_guide {

      class ModelBrokerClient;

      }  // namespace optimization_guide

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android generative broker creation override
  regex:
    pattern: "  std::unique_ptr<optimization_guide::ModelBrokerClient>\n  CreateModelBrokerClient(content::BrowserContext*\
      \ browser_context) override;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<optimization_guide::ModelBrokerClient>\n  CreateModelBrokerClient(content::BrowserContext*\
      \ browser_context) override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit matching Android legacy report virtual override
  regex:
    pattern: "  void ReportLegacyTechEvent(\n      content::RenderFrameHost* render_frame_host,\n      const std::string&\
      \ type,\n      const GURL& url,\n      const GURL& frame_url,\n      const std::string& filename,\n      uint64_t line,\n\
      \      uint64_t column,\n      std::optional<content::LegacyTechCookieIssueDetails> cookie_issue_details)\n      override;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void ReportLegacyTechEvent(\n      content::RenderFrameHost* render_frame_host,\n\
      \      const std::string& type,\n      const GURL& url,\n      const GURL& frame_url,\n      const std::string& filename,\n\
      \      uint64_t line,\n      uint64_t column,\n      std::optional<content::LegacyTechCookieIssueDetails> cookie_issue_details)\n\
      \      override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
