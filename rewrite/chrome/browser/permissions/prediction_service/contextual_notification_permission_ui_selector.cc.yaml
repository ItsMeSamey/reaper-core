substitutions:
- description: Declare Android platform guard directly
  regex:
    pattern: '#include "base/time/default_clock.h"

      '
    replace: '#include "base/time/default_clock.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Retire Android completions before the unchanged common request reset
  regex:
    pattern: "void ContextualNotificationPermissionUiSelector::Cancel() {\n  // The computation either finishes synchronously\
      \ above, or is waiting on the\n  // Safe Browsing check.\n  safe_browsing_request_.reset();\n}\n"
    replace: "void ContextualNotificationPermissionUiSelector::Cancel() {\n#if BUILDFLAG(IS_ANDROID)\n  // Retire preload\
      \ and Safe Browsing completions before releasing state.\n  weak_factory_.InvalidateWeakPtrs();\n  callback_.Reset();\n\
      #endif\n  // The computation either finishes synchronously above, or is waiting on the\n  // Safe Browsing check.\n\
      \  safe_browsing_request_.reset();\n}\n"
  count: 1
