- description: 'Android concrete AI source/provider removal: chrome/browser/permissions/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//components/passage_embeddings/core:test_support",\

      \ \ \ \ \ \ "//components/permissions/prediction_service",\

      \ \ \ \ \]\

      \

      \ \ \ \ if\ \(enable_extensions\)\ \{\

      \ \ \ \ \ \ deps\ \+=\ \[\

