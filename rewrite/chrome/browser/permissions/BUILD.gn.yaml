# Android split pane request ownership and dialog placement.
substitutions:
- description: declare Android permission client native model header dependency
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/android:tabs_public",\

      \ \ \ \ \ \ "//components/messages/android",'
    replace: "      \"//chrome/browser/android:tabs_public\",\n      \"//chrome/browser/ui/android/tab_model\",\n      \"//components/messages/android\","

- description: 'Android concrete AI source/provider removal: chrome/browser/permissions/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//extensions/buildflags",\

      \ \ \ \ "//services/device/public/cpp/geolocation",\

      \ \ \]\

      \

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ sources\ \+=\ \[\

      '
    replace: "    \"//extensions/buildflags\",\n    \"//services/device/public/cpp/geolocation\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/actor\",\n      \"//components/contextual_tasks/public:feature_list\",\n    ]\n  }\n\n  if (is_android) {\n    sources += [\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/permissions/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//testing/gmock",\

      \ \ \ \ "//testing/gtest",\

      \ \ \]\

