# Android split pane request ownership and dialog placement.
substitutions:
- description: observe actual Chrome Android model selection for permissions
  regex:
    re_pattern: \#include\ "chrome/browser/android/resource_mapper\.h"
    replace: '#include "base/functional/bind.h"

      #include "base/memory/raw_ptr.h"

      #include "chrome/browser/android/resource_mapper.h"

      #include "chrome/browser/android/tab_android.h"

      #include "chrome/browser/ui/android/tab_model/tab_model.h"

      #include "chrome/browser/ui/android/tab_model/tab_model_list.h"

      #include "chrome/browser/ui/android/tab_model/tab_model_observer.h"'
- description: retain an RAII permission model observer with reentrant-safe callbacks
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      bool\ ShouldUseQuietUI'
    replace: "#if BUILDFLAG(IS_ANDROID)\nclass AndroidPermissionModelObserver : public TabModelObserver {\n public:\n  AndroidPermissionModelObserver(TabModel* model,\n                                 base::RepeatingCallback<void(bool)> callback)\n      : model_(model), callback_(std::move(callback)) {\n    model_->AddObserver(this);\n  }\n  ~AndroidPermissionModelObserver() override {\n    if (model_) {\n      model_->RemoveObserver(this);\n    }\n  }\n\n  void OnWillActiveStateChange(TabModel& model, bool active) override {\n    if (!active) {\n      auto callback = callback_;\n      callback.Run(false);\n    }\n  }\n  void OnDidActiveStateChange(TabModel& model, bool active) override {\n    if (active) {\n      auto callback = callback_;\n      callback.Run(true);\n    }\n  }\n  void OnTabModelDestroyed(TabModel& model) override {\n    // Removing the last observer here can destroy the JNI bridge currently\n    // dispatching model shutdown. Normal RAII teardown still unregisters.\n    model_ = nullptr;\n    auto callback = callback_;\n    callback.Run(false);\n  }\n\n private:\n  raw_ptr<TabModel> model_;\n  base::RepeatingCallback<void(bool)> callback_;\n};\n\nbool ShouldUseQuietUI"
- description: bind permission model state to exact original Android tab membership
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      bool\ ChromePermissionsClient::IsDseOrigin'
    replace: "#if BUILDFLAG(IS_ANDROID)\nbool ChromePermissionsClient::IsAndroidTabModelActive(tabs::TabInterface* tab) {\n  auto* model = TabModelList::GetTabModelForTabAndroid(\n      TabAndroid::FromTabInterface(tab));\n  return model && model->IsActiveModel();\n}\n\nbase::ScopedClosureRunner ChromePermissionsClient::ObserveAndroidTabModel(\n    tabs::TabInterface* tab,\n    base::RepeatingCallback<void(bool)> callback) {\n  auto* model = TabModelList::GetTabModelForTabAndroid(\n      TabAndroid::FromTabInterface(tab));\n  if (!model) {\n    return {};\n  }\n  auto observer =\n      std::make_unique<AndroidPermissionModelObserver>(model, std::move(callback));\n  return base::ScopedClosureRunner(base::BindOnce(\n      [](std::unique_ptr<AndroidPermissionModelObserver>) {}, std::move(observer)));\n}\n\nbool ChromePermissionsClient::IsDseOrigin"
