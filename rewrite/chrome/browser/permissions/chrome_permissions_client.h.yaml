# Android split pane request ownership and dialog placement.
substitutions:
- description: implement Android permission foreground-model hook in Chrome
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ bool\ IsDseOrigin'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  bool IsAndroidTabModelActive(tabs::TabInterface* tab) override;\n  base::ScopedClosureRunner ObserveAndroidTabModel(\n      tabs::TabInterface* tab,\n      base::RepeatingCallback<void(bool)> callback) override;\n  bool IsDseOrigin"
- description: Use retained generic permission behavior without an Android survey override
  regex:
    pattern: "  void TriggerPromptHatsSurveyIfEnabled(\n      content::WebContents* web_contents,\n      permissions::RequestType\
      \ request_type,\n      std::optional<permissions::PermissionAction> action,\n      permissions::PermissionPromptDisposition\
      \ prompt_disposition,\n      permissions::PermissionPromptDispositionReason prompt_disposition_reason,\n      permissions::PermissionRequestGestureType\
      \ gesture_type,\n      std::optional<base::TimeDelta> prompt_display_duration,\n      bool is_post_prompt,\n      const\
      \ GURL& gurl,\n      std::optional<\n          permissions::feature_params::PermissionElementPromptPosition>\n     \
      \     pepc_prompt_position,\n      ContentSetting initial_permission_status,\n      base::OnceCallback<void()> hats_shown_callback,\n\
      \      PromptOptions prompt_options) override;"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void TriggerPromptHatsSurveyIfEnabled(\n      content::WebContents* web_contents,\n\
      \      permissions::RequestType request_type,\n      std::optional<permissions::PermissionAction> action,\n      permissions::PermissionPromptDisposition\
      \ prompt_disposition,\n      permissions::PermissionPromptDispositionReason prompt_disposition_reason,\n      permissions::PermissionRequestGestureType\
      \ gesture_type,\n      std::optional<base::TimeDelta> prompt_display_duration,\n      bool is_post_prompt,\n      const\
      \ GURL& gurl,\n      std::optional<\n          permissions::feature_params::PermissionElementPromptPosition>\n     \
      \     pepc_prompt_position,\n      ContentSetting initial_permission_status,\n      base::OnceCallback<void()> hats_shown_callback,\n\
      \      PromptOptions prompt_options) override;\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
