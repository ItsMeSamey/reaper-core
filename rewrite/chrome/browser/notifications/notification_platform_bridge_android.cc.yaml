# Android extension notification policy and payload support.
substitutions:
- description: Carry the accepted extension notification payload to Android
  regex:
    re_pattern: \ \ Java_NotificationPlatformBridge_displayNotification\(
    replace: "  const bool is_extension = notification_type == NotificationHandler::Type::EXTENSION;\n  const bool is_extension_progress = is_extension &&\n      notification.type() == message_center::NOTIFICATION_TYPE_PROGRESS;\n  // Optional fields survive update() type changes. Render the current type only.\n  if (is_extension && notification.type() != message_center::NOTIFICATION_TYPE_IMAGE) {\n    image_bitmap.reset();\n  }\n  std::vector<std::u16string> item_titles;\n  std::vector<std::u16string> item_messages;\n  if (is_extension && notification.type() == message_center::NOTIFICATION_TYPE_MULTIPLE) {\n    for (const auto& item : notification.items()) {\n      item_titles.push_back(item.title);\n      item_messages.push_back(item.message);\n    }\n  }\n\n  Java_NotificationPlatformBridge_displayNotification("
- description: Supply extension-only progress, context, and list data while keeping web defaults
  regex:
    re_pattern: \ \ \ \ \ \ skip_ua_buttons\);
    replace: "      skip_ua_buttons,\n      is_extension_progress ? notification.progress() : -1,\n      is_extension ? notification.context_message() : std::u16string(),\n      item_titles, item_messages);"
- description: Format modified Android notification implementation
  regex:
    re_pattern: '\ \ SkBitmap\ badge_bitmap\ =\ notification\.small_image\(\)\.AsBitmap\(\);\

      \

      \ \ int32_t\ j_notification_type\ =\ NotificationTypeToJava\(notification_type\);\

      \

      \ \ const\ bool\ is_extension\ =\ notification_type\ ==\ NotificationHandler::Type::EXTENSION;\

      \ \ const\ bool\ is_extension_progress\ =\ is_extension\ \&\&\

      \ \ \ \ \ \ notification\.type\(\)\ ==\ message_center::NOTIFICATION_TYPE_PROGRESS;\

      \ \ //\ Optional\ fields\ survive\ update\(\)\ type\ changes\.\ Render\ the\ current\ type\ only\.\

      \ \ if\ \(is_extension\ \&\&\ notification\.type\(\)\ !=\ message_center::NOTIFICATION_TYPE_IMAGE\)\ \{\

      \ \ \ \ image_bitmap\.reset\(\);\

      \ \ \}\

      \ \ std::vector<std::u16string>\ item_titles;\

      \ \ std::vector<std::u16string>\ item_messages;\

      \ \ if\ \(is_extension\ \&\&\ notification\.type\(\)\ ==\ message_center::NOTIFICATION_TYPE_MULTIPLE\)\ \{\

      \ \ \ \ for\ \(const\ auto\&\ item\ :\ notification\.items\(\)\)\ \{\

      \ \ \ \ \ \ item_titles\.push_back\(item\.title\);\

      \ \ \ \ \ \ item_messages\.push_back\(item\.message\);\

      \ \ \ \ \}\

      '
    replace: "  SkBitmap badge_bitmap = notification.small_image().AsBitmap();\n\n  int32_t j_notification_type = NotificationTypeToJava(notification_type);\n\n  const bool is_extension =\n      notification_type == NotificationHandler::Type::EXTENSION;\n  const bool is_extension_progress =\n      is_extension &&\n      notification.type() == message_center::NOTIFICATION_TYPE_PROGRESS;\n  // Optional fields survive update() type changes. Render the current type\n  // only.\n  if (is_extension &&\n      notification.type() != message_center::NOTIFICATION_TYPE_IMAGE) {\n    image_bitmap.reset();\n  }\n  std::vector<std::u16string> item_titles;\n  std::vector<std::u16string> item_messages;\n  if (is_extension &&\n      notification.type() == message_center::NOTIFICATION_TYPE_MULTIPLE) {\n    for (const auto& item : notification.items()) {\n      item_titles.push_back(item.title);\n      item_messages.push_back(item.message);\n    }\n"
- description: Format modified Android notification implementation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \?\ test_is_suspicious_value_\

      \ \ \ \ \ \ \ \ \ \ :\ \(persistent_notification_metadata\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ persistent_notification_metadata\->is_suspicious\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ false\),\

      \ \ \ \ \ \ skip_ua_buttons,\

      \ \ \ \ \ \ is_extension_progress\ \?\ notification\.progress\(\)\ :\ \-1,\

      \ \ \ \ \ \ is_extension\ \?\ notification\.context_message\(\)\ :\ std::u16string\(\),\

      \ \ \ \ \ \ item_titles,\ item_messages\);\

      \

      \ \ regenerated_notification_infos_\[notification\.id\(\)\]\ =\

      '
    replace: "          ? test_is_suspicious_value_\n          : (persistent_notification_metadata\n                 ? persistent_notification_metadata->is_suspicious\n                 : false),\n      skip_ua_buttons, is_extension_progress ? notification.progress() : -1,\n      is_extension ? notification.context_message() : std::u16string(),\n      item_titles, item_messages);\n\n  regenerated_notification_infos_[notification.id()] =\n"
- description: Call the canonical NotificationItem title and message accessors
  regex:
    re_pattern: '\ \ if\ \(is_extension\ \&\&\

      \ \ \ \ \ \ notification\.type\(\)\ ==\ message_center::NOTIFICATION_TYPE_MULTIPLE\)\ \{\

      \ \ \ \ for\ \(const\ auto\&\ item\ :\ notification\.items\(\)\)\ \{\

      \ \ \ \ \ \ item_titles\.push_back\(item\.title\);\

      \ \ \ \ \ \ item_messages\.push_back\(item\.message\);\

      \ \ \ \ \}\

      \ \ \}\

      \

      '
    replace: "  if (is_extension &&\n      notification.type() == message_center::NOTIFICATION_TYPE_MULTIPLE) {\n    for (const auto& item : notification.items()) {\n      item_titles.push_back(item.title());\n      item_messages.push_back(item.message());\n    }\n  }\n\n"
