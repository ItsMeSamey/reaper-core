    replace: "      \"screen_capture_notification_blocker.cc\",\n      \"screen_capture_notification_blocker.h\",\n    ]\n    if (is_android) {\n      sources -= [ \"glic_actor_task_notification_handler.cc\" ]\n    }\n\n    deps += [\n      \"//chrome/app:generated_resources\",\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/notifications/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/web_applications/proto",\

      \ \ \ \ \ \ "//components/actor/core",\

      \ \ \ \ \]\

      \

      \ \ \ \ if\ \(!is_chromeos\)\ \{\

      \ \ \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/default_browser"\ \]\

      '
    replace: "      \"//chrome/browser/web_applications/proto\",\n      \"//components/actor/core\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor\",\n        \"//chrome/browser/glic/browser_ui\",\n        \"//components/actor/core\",\n      ]\n    }\n\n    if (!is_chromeos) {\n      deps += [ \"//chrome/browser/default_browser\" ]\n"

