# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/notifications/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "muted_notification_handler\.h",\

      \ \ \ \ \ \ "profile_notification\.h",\

      \ \ \ \ \]\

      \

      \ \ \ \ public_deps\ \+=\ \[\

      \ \ \ \ \ \ "//components/actor/core:task_id",\

      \ \ \ \ \ \ "//components/keep_alive_registry",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ if\ \(is_chromeos\)\ \{\

      '
    replace: "      \"muted_notification_handler.h\",\n      \"profile_notification.h\",\n    ]\n    if (is_android) {\n      public -= [ \"glic_actor_task_notification_handler.h\" ]\n    }\n\n    public_deps += [\n      \"//components/actor/core:task_id\",\n      \"//components/keep_alive_registry\",\n    ]\n    if (is_android) {\n      public_deps -= [ \"//components/actor/core:task_id\" ]\n    }\n  }\n\n  if (is_chromeos) {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/notifications/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "screen_capture_notification_blocker\.cc",\

      \ \ \ \ \ \ "screen_capture_notification_blocker\.h",\

      \ \ \ \ \]\

      \

      \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ "//chrome/app:generated_resources",\

