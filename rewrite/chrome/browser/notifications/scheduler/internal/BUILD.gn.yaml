    regex:
      pattern: "    \"stats_unittest.cc\",\n    \"tips_client_unittest.cc\",\n  ]\n\n  deps = [\n    \"//chrome/browser/notifications/proto\",\n"
      replace: "    \"stats_unittest.cc\",\n    \"tips_client_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [ \"tips_client_unittest.cc\" ]\n  }\n\n  deps = [\n    \"//chrome/browser/notifications/proto\",\n"
