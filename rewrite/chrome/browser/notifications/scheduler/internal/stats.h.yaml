substitutions:
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "#define CHROME_BROWSER_NOTIFICATIONS_SCHEDULER_INTERNAL_STATS_H_\n\n#include \"chrome/browser/notifications/scheduler/public/notification_scheduler_types.h\"\n#include \"chrome/browser/tips/core/tips_types.h\"\n\nnamespace notifications {\nstruct NotificationData;\n"
      replace: "#define CHROME_BROWSER_NOTIFICATIONS_SCHEDULER_INTERNAL_STATS_H_\n\n#include \"chrome/browser/notifications/scheduler/public/notification_scheduler_types.h\"\n#include \"build/build_config.h\"\n#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/tips/core/tips_types.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n\nnamespace notifications {\nstruct NotificationData;\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "void LogNotificationLifeCycleEvent(NotificationLifeCycleEvent event,\n                                   SchedulerClientType client_type);\n\n// Logs shown tips notifications actions.\nvoid LogTipsNotificationFeatureTypeAction(\n    UserActionType action,\n    tips::TipsNotificationsFeatureType feature_type);\n"
      replace: "void LogNotificationLifeCycleEvent(NotificationLifeCycleEvent event,\n                                   SchedulerClientType client_type);\n\n#if !BUILDFLAG(IS_ANDROID)\nvoid LogTipsNotificationFeatureTypeAction(\n    UserActionType action,\n    tips::TipsNotificationsFeatureType feature_type);\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "// Logs shown tips notifications by feature.\nvoid LogTipsNotificationFeatureTypeShown(\n    tips::TipsNotificationsFeatureType feature_type);\n}  // namespace stats\n}  // namespace notifications\n\n"
      replace: "// Logs shown tips notifications by feature.\nvoid LogTipsNotificationFeatureTypeShown(\n    tips::TipsNotificationsFeatureType feature_type);\n#endif  // !BUILDFLAG(IS_ANDROID)\n}  // namespace stats\n}  // namespace notifications\n\n"
    count: 1
