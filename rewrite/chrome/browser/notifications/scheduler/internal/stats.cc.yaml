substitutions:
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "#include \"base/strings/strcat.h\"\n#include \"base/time/time.h\"\n#include \"chrome/browser/notifications/scheduler/public/notification_data.h\"\n#include \"chrome/browser/tips/core/tips_types.h\"\n\nnamespace notifications {\nnamespace stats {\n"
      replace: "#include \"base/strings/strcat.h\"\n#include \"base/time/time.h\"\n#include \"chrome/browser/notifications/scheduler/public/notification_data.h\"\n#include \"build/build_config.h\"\n#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/tips/core/tips_types.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n\nnamespace notifications {\nnamespace stats {\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "\n// Returns the histogram tips suffix for a feature type. Should match suffix\n// NotificationTipsFeatureType in histograms.xml.\nstd::string ToHistogramTipsFeatureSuffix(\n    tips::TipsNotificationsFeatureType feature_type) {\n  switch (feature_type) {\n"
      replace: "\n// Returns the histogram tips suffix for a feature type. Should match suffix\n// NotificationTipsFeatureType in histograms.xml.\n#if !BUILDFLAG(IS_ANDROID)\nstd::string ToHistogramTipsFeatureSuffix(\n    tips::TipsNotificationsFeatureType feature_type) {\n  switch (feature_type) {\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "      NOTREACHED();\n  }\n}\n\n// Logs a histogram enumeration with client type suffix.\ntemplate <typename T>\n"
      replace: "      NOTREACHED();\n  }\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n// Logs a histogram enumeration with client type suffix.\ntemplate <typename T>\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "}\n\n// Logs a histogram enumeration with a tips feature type suffix.\ntemplate <typename T>\nvoid LogHistogramEnumWithTipsFeatureSuffix(\n    std::string_view name,\n"
      replace: "}\n\n// Logs a histogram enumeration with a tips feature type suffix.\n#if !BUILDFLAG(IS_ANDROID)\ntemplate <typename T>\nvoid LogHistogramEnumWithTipsFeatureSuffix(\n    std::string_view name,\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "  base::UmaHistogramEnumeration(\n      base::StrCat({name, ToHistogramTipsFeatureSuffix(feature_type)}), value);\n}\n\n}  // namespace\n\n"
      replace: "  base::UmaHistogramEnumeration(\n      base::StrCat({name, ToHistogramTipsFeatureSuffix(feature_type)}), value);\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n}  // namespace\n\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "      \"Notifications.Scheduler.NotificationLifeCycleEvent\", event, client_type);\n}\n\nvoid LogTipsNotificationFeatureTypeAction(\n    UserActionType action,\n    tips::TipsNotificationsFeatureType feature_type) {\n  LogHistogramEnumWithTipsFeatureSuffix(\n      \"Notifications.Scheduler.Tips.FeatureTypeAction\", action, feature_type);\n}\n\nvoid LogTipsNotificationFeatureTypeShown(\n    tips::TipsNotificationsFeatureType feature_type) {\n  base::UmaHistogramEnumeration(\"Notifications.Scheduler.Tips.FeatureTypeShown\",\n                                feature_type);\n}\n}  // namespace stats\n}  // namespace notifications\n"
      replace: "      \"Notifications.Scheduler.NotificationLifeCycleEvent\", event, client_type);\n}\n\n#if !BUILDFLAG(IS_ANDROID)\nvoid LogTipsNotificationFeatureTypeAction(\n    UserActionType action,\n    tips::TipsNotificationsFeatureType feature_type) {\n  LogHistogramEnumWithTipsFeatureSuffix(\n      \"Notifications.Scheduler.Tips.FeatureTypeAction\", action, feature_type);\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if !BUILDFLAG(IS_ANDROID)\nvoid LogTipsNotificationFeatureTypeShown(\n    tips::TipsNotificationsFeatureType feature_type) {\n  base::UmaHistogramEnumeration(\"Notifications.Scheduler.Tips.FeatureTypeShown\",\n                                feature_type);\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n}  // namespace stats\n}  // namespace notifications\n"
