substitutions:

  - description: "Android Finds compile-out: Bind Android platform condition in public factory helper header"
    regex:
      re_pattern: "\\#include\\ \"base/files/file_path\\.h\"\\\n"
      replace: "#include \"base/files/file_path.h\"\n#include \"build/build_config.h\"\n"
    count: 1

  - description: "Android Finds compile-out: Declare Finds agent only for retained desktop signature"
    regex:
      re_pattern: "class\\ FindsAgent;\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nclass FindsAgent;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1

  - description: "Android Finds compile-out: Exclude Finds agent factory parameter from Android"
    regex:
      re_pattern: "\\ \\ \\ \\ std::unique_ptr<FindsAgent>\\ finds_agent,\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<FindsAgent> finds_agent,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "#endif  // !BUILDFLAG(IS_ANDROID)\nclass NotificationBackgroundTaskScheduler;\nclass NotificationSchedulerClientRegistrar;\nclass TipsAgent;\n\n// Creates the notification schedule service with all the embedder level\n// dependencies. This layer is mainly to forbid the embedder to depend on\n"
      replace: "#endif  // !BUILDFLAG(IS_ANDROID)\nclass NotificationBackgroundTaskScheduler;\nclass NotificationSchedulerClientRegistrar;\n#if !BUILDFLAG(IS_ANDROID)\nclass TipsAgent;\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n// Creates the notification schedule service with all the embedder level\n// dependencies. This layer is mainly to forbid the embedder to depend on\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "    std::unique_ptr<NotificationBackgroundTaskScheduler>\n        background_task_scheduler,\n    std::unique_ptr<DisplayAgent> display_agent,\n    std::unique_ptr<TipsAgent> tips_agent,\n#if !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<FindsAgent> finds_agent,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
      replace: "    std::unique_ptr<NotificationBackgroundTaskScheduler>\n        background_task_scheduler,\n    std::unique_ptr<DisplayAgent> display_agent,\n#if !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<TipsAgent> tips_agent,\n#endif  // !BUILDFLAG(IS_ANDROID)\n#if !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<FindsAgent> finds_agent,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
