substitutions:

  - description: "Android Finds compile-out: Exclude default Finds agent implementation from Android"
    regex:
      re_pattern: "\\ \\ public_deps\\ =\\ \\[\\\n"
      replace: "  if (is_android) {\n    sources -= [\n      \"finds_agent.cc\",\n      \"finds_agent.h\",\n    ]\n  }\n\n  public_deps = [\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "    sources -= [\n      \"finds_agent.cc\",\n      \"finds_agent.h\",\n    ]\n  }\n\n"
      replace: "    sources -= [\n      \"finds_agent.cc\",\n      \"finds_agent.h\",\n      \"tips_agent.cc\",\n      \"tips_agent.h\",\n    ]\n  }\n\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "    \"//base\",\n    \"//chrome/browser/tips/core:types\",\n  ]\n  deps = [\n    \"//chrome/app:generated_resources\",\n    \"//chrome/common\",\n"
      replace: "    \"//base\",\n    \"//chrome/browser/tips/core:types\",\n  ]\n  if (is_android) {\n    public_deps -= [ \"//chrome/browser/tips/core:types\" ]\n  }\n  deps = [\n    \"//chrome/app:generated_resources\",\n    \"//chrome/common\",\n"
    count: 1
