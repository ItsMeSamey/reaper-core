substitutions:

  - description: "Android Finds compile-out: Include default Finds agent only outside Android"
    regex:
      re_pattern: "\\#include\\ \"chrome/browser/notifications/scheduler/public/finds_agent\\.h\"\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/public/finds_agent.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1

  - description: "Android Finds compile-out: Remove Android Finds dependency or source"
    regex:
      re_pattern: "\\#include\\ \"chrome/browser/notifications/scheduler/finds_agent_android\\.h\"\\\n"
      replace: ""
    count: 1

  - description: "Android Finds compile-out: Remove Android Finds dependency or source"
    regex:
      re_pattern: "\\ \\ auto\\ finds_agent\\ =\\ std::make_unique<FindsAgentAndroid>\\(\\);\\\n"
      replace: ""
    count: 1

  - description: "Android Finds compile-out: Exclude Android Finds argument while preserving ordinary notification clients"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ std::move\\(display_agent\\),\\ std::move\\(tips_agent\\),\\ std::move\\(finds_agent\\),\\\n"
      replace: "      std::move(display_agent), std::move(tips_agent),\n#if !BUILDFLAG(IS_ANDROID)\n      std::move(finds_agent),\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "#endif  // !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/public/notification_schedule_service.h\"\n#include \"chrome/browser/notifications/scheduler/public/notification_scheduler_client_registrar.h\"\n#include \"chrome/browser/notifications/scheduler/public/tips_agent.h\"\n#include \"chrome/browser/notifications/scheduler/schedule_service_factory_helper.h\"\n#include \"chrome/browser/profiles/profile_key.h\"\n#include \"chrome/browser/profiles/profile_manager.h\"\n"
      replace: "#endif  // !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/public/notification_schedule_service.h\"\n#include \"chrome/browser/notifications/scheduler/public/notification_scheduler_client_registrar.h\"\n#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/public/tips_agent.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/schedule_service_factory_helper.h\"\n#include \"chrome/browser/profiles/profile_key.h\"\n#include \"chrome/browser/profiles/profile_manager.h\"\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "#if BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/display_agent_android.h\"\n#include \"chrome/browser/notifications/scheduler/notification_background_task_scheduler_android.h\"\n#include \"chrome/browser/notifications/scheduler/tips_agent_android.h\"\n#endif  // BUILDFLAG(IS_ANDROID)\n\n// static\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/display_agent_android.h\"\n#include \"chrome/browser/notifications/scheduler/notification_background_task_scheduler_android.h\"\n#endif  // BUILDFLAG(IS_ANDROID)\n\n// static\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "  auto display_agent = std::make_unique<DisplayAgentAndroid>();\n  auto background_task_scheduler =\n      std::make_unique<NotificationBackgroundTaskSchedulerAndroid>();\n  auto tips_agent = std::make_unique<TipsAgentAndroid>();\n#else\n  auto display_agent = notifications::DisplayAgent::Create();\n  auto background_task_scheduler =\n"
      replace: "  auto display_agent = std::make_unique<DisplayAgentAndroid>();\n  auto background_task_scheduler =\n      std::make_unique<NotificationBackgroundTaskSchedulerAndroid>();\n#else\n  auto display_agent = notifications::DisplayAgent::Create();\n  auto background_task_scheduler =\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "  auto* db_provider = profile_key->GetProtoDatabaseProvider();\n  return notifications::CreateNotificationScheduleService(\n      std::move(client_registrar), std::move(background_task_scheduler),\n      std::move(display_agent), std::move(tips_agent),\n#if !BUILDFLAG(IS_ANDROID)\n      std::move(finds_agent),\n#endif  // !BUILDFLAG(IS_ANDROID)\n      db_provider, storage_dir, profile_key->IsOffTheRecord(),\n"
      replace: "  auto* db_provider = profile_key->GetProtoDatabaseProvider();\n  return notifications::CreateNotificationScheduleService(\n      std::move(client_registrar), std::move(background_task_scheduler),\n      std::move(display_agent),\n#if !BUILDFLAG(IS_ANDROID)\n      std::move(tips_agent),\n      std::move(finds_agent),\n#endif  // !BUILDFLAG(IS_ANDROID)\n      db_provider, storage_dir, profile_key->IsOffTheRecord(),\n"
    count: 1
