substitutions:

  - description: "Android Finds compile-out: Exclude Finds agent factory parameter from Android"
    regex:
      re_pattern: "\\ \\ \\ \\ std::unique_ptr<FindsAgent>\\ finds_agent,\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<FindsAgent> finds_agent,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1

  - description: "Android Finds compile-out: Remove Android Finds client include"
    regex:
      re_pattern: "\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\#include\\ \"chrome/browser/notifications/scheduler/internal/clients/finds_client\\.h\"\\\n\\#endif\\ \\ //\\ BUILDFLAG\\(IS_ANDROID\\)\\\n"
      replace: ""
    count: 1

  - description: "Android Finds compile-out: Remove Android Finds scheduler registration"
    regex:
      re_pattern: "\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\ \\ client_registrar\\->RegisterClient\\(\\\n\\ \\ \\ \\ \\ \\ SchedulerClientType::kChromeFinds,\\\n\\ \\ \\ \\ \\ \\ std::make_unique<FindsClient>\\(std::move\\(finds_agent\\),\\ pref_service\\)\\);\\\n\\#endif\\ \\ //\\ BUILDFLAG\\(IS_ANDROID\\)\\\n"
      replace: ""
    count: 1

  - description: "Android Finds compile-out: Include default Finds agent only outside Android"
    regex:
      re_pattern: "\\#include\\ \"chrome/browser/notifications/scheduler/public/finds_agent\\.h\"\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/public/finds_agent.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "#include \"chrome/browser/notifications/scheduler/internal/scheduled_notification_manager.h\"\n#include \"chrome/browser/notifications/scheduler/internal/scheduler_config.h\"\n#include \"chrome/browser/notifications/scheduler/internal/scheduler_utils.h\"\n#include \"chrome/browser/notifications/scheduler/internal/tips_client.h\"\n#include \"chrome/browser/notifications/scheduler/internal/webui_client.h\"\n#include \"chrome/browser/notifications/scheduler/public/display_agent.h\"\n#include \"chrome/browser/notifications/scheduler/public/features.h\"\n"
      replace: "#include \"chrome/browser/notifications/scheduler/internal/scheduled_notification_manager.h\"\n#include \"chrome/browser/notifications/scheduler/internal/scheduler_config.h\"\n#include \"chrome/browser/notifications/scheduler/internal/scheduler_utils.h\"\n#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/internal/tips_client.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/internal/webui_client.h\"\n#include \"chrome/browser/notifications/scheduler/public/display_agent.h\"\n#include \"chrome/browser/notifications/scheduler/public/features.h\"\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "#endif  // !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/public/notification_background_task_scheduler.h\"\n#include \"chrome/browser/notifications/scheduler/public/notification_scheduler_client_registrar.h\"\n#include \"chrome/browser/notifications/scheduler/public/tips_agent.h\"\n#include \"components/leveldb_proto/public/proto_database_provider.h\"\n#include \"components/leveldb_proto/public/shared_proto_database_client_list.h\"\n\n"
      replace: "#endif  // !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/public/notification_background_task_scheduler.h\"\n#include \"chrome/browser/notifications/scheduler/public/notification_scheduler_client_registrar.h\"\n#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/notifications/scheduler/public/tips_agent.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n#include \"components/leveldb_proto/public/proto_database_provider.h\"\n#include \"components/leveldb_proto/public/shared_proto_database_client_list.h\"\n\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "    std::unique_ptr<NotificationBackgroundTaskScheduler>\n        background_task_scheduler,\n    std::unique_ptr<DisplayAgent> display_agent,\n    std::unique_ptr<TipsAgent> tips_agent,\n#if !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<FindsAgent> finds_agent,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
      replace: "    std::unique_ptr<NotificationBackgroundTaskScheduler>\n        background_task_scheduler,\n    std::unique_ptr<DisplayAgent> display_agent,\n#if !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<TipsAgent> tips_agent,\n#endif  // !BUILDFLAG(IS_ANDROID)\n#if !BUILDFLAG(IS_ANDROID)\n    std::unique_ptr<FindsAgent> finds_agent,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "      {base::MayBlock(), base::TaskPriority::BEST_EFFORT});\n  client_registrar->RegisterClient(SchedulerClientType::kWebUI,\n                                   std::make_unique<WebUIClient>());\n  client_registrar->RegisterClient(\n      SchedulerClientType::kTips,\n      std::make_unique<TipsClient>(std::move(tips_agent), pref_service));\n\n  // Build icon store.\n  base::FilePath icon_store_dir = storage_dir.Append(kIconDBName);\n"
      replace: "      {base::MayBlock(), base::TaskPriority::BEST_EFFORT});\n  client_registrar->RegisterClient(SchedulerClientType::kWebUI,\n                                   std::make_unique<WebUIClient>());\n#if !BUILDFLAG(IS_ANDROID)\n  client_registrar->RegisterClient(\n      SchedulerClientType::kTips,\n      std::make_unique<TipsClient>(std::move(tips_agent), pref_service));\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  // Build icon store.\n  base::FilePath icon_store_dir = storage_dir.Append(kIconDBName);\n"
    count: 1
