# Android retains hints, prediction, security and ordinary helpers while omitting optional model execution and quality upload.
substitutions:
- description: 'Android optional model execution boundary: chrome/browser/notifications/persistent_notification_handler.cc'
  regex:
    re_pattern: '\#include\ "chrome/browser/notifications/notification_permission_context\.h"\

      \#include\ "chrome/browser/notifications/platform_notification_service_factory\.h"\

      \#include\ "chrome/browser/notifications/platform_notification_service_impl\.h"\

      \#include\ "chrome/browser/optimization_guide/optimization_guide_keyed_service\.h"\

      \#include\ "chrome/browser/optimization_guide/optimization_guide_keyed_service_factory\.h"\

      \#include\ "chrome/browser/permissions/notifications_engagement_service_factory\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      \#include\ "chrome/browser/ui/safety_hub/disruptive_notification_permissions_manager\.h"\

      '
    replace: '#include "chrome/browser/notifications/notification_permission_context.h"

      #include "chrome/browser/notifications/platform_notification_service_factory.h"

      #include "chrome/browser/notifications/platform_notification_service_impl.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service.h"

      #endif

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/optimization_guide/optimization_guide_keyed_service_factory.h"

      #endif

      #include "chrome/browser/permissions/notifications_engagement_service_factory.h"

      #include "chrome/browser/profiles/profile.h"

      #include "chrome/browser/ui/safety_hub/disruptive_notification_permissions_manager.h"

      '
- description: 'Android optional model execution boundary: chrome/browser/notifications/persistent_notification_handler.cc'
  regex:
    re_pattern: '\ \ \ \ bool\ did_user_unsubscribe\)\ \{\

      \ \ CHECK\(profile\);\

      \

      \#if\ BUILDFLAG\(SAFE_BROWSING_AVAILABLE\)\

      \ \ //\ In\ case\ the\ data\ volume\ becomes\ excessive,\ logging\ should\ happen\ at\ a\

      \ \ //\ sampled\ rate\.\ This\ rate\ is\ defined\ by\ the\

      \ \ //\ `kReportNotificationContentDetectionDataRate`\ feature\ parameter\.\

      '
    replace: "    bool did_user_unsubscribe) {\n  CHECK(profile);\n\n#if !BUILDFLAG(IS_ANDROID) && BUILDFLAG(SAFE_BROWSING_AVAILABLE)\n  // In case the data volume becomes excessive, logging should happen at a\n  // sampled rate. This rate is defined by the\n  // `kReportNotificationContentDetectionDataRate` feature parameter.\n"
