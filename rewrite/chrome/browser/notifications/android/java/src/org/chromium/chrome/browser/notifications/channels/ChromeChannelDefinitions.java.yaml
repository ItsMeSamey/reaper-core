substitutions:

  - description: "Android Finds compile-out: Remove active Finds notification channel definition"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ //\\ The\\ finds\\ notification\\ channel\\ will\\ be\\ added\\ to\\ the\\ notification\\ settings\\ when\\ a\\ user\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ //\\ explicitly\\ accepts\\ or\\ declines\\ the\\ opt\\-in\\ promo\\ for\\ the\\ first\\ time\\.\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ map\\.put\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ ChannelId\\.CHROME_FINDS,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ PredefinedChannel\\.create\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ ChannelId\\.CHROME_FINDS,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ R\\.string\\.notification_category_finds,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ NotificationManager\\.IMPORTANCE_DEFAULT,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ ChannelGroupId\\.GENERAL\\)\\);\\\n\\\n"
      replace: ""
    count: 1

  - description: "Android Finds compile-out: Retire previously created Finds channel on upgrade"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ ChromeChannelDefinitions\\.ChannelId\\.TIPS,\\\n"
      replace: "        ChromeChannelDefinitions.ChannelId.TIPS,\n        ChromeChannelDefinitions.ChannelId.CHROME_FINDS,\n"
    count: 1

  - description: "Android Finds compile-out: Trigger existing channel upgrade cleanup for retired Finds channel"
    regex:
      re_pattern: "\\ \\ \\ \\ static\\ final\\ int\\ CHANNELS_VERSION\\ =\\ 9;\\\n"
      replace: "    static final int CHANNELS_VERSION = 10;\n"
    count: 1

  - description: "Android Finds compile-out: Remove Finds from active notification channel StringDef"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ ChannelId\\.CHROME_FINDS,\\\n"
      replace: ""
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "     * set of channels returned by {@link #getStartupChannelIds()} or {@link #getLegacyChannelIds()}\n     * changes.\n     */\n    static final int CHANNELS_VERSION = 10;\n\n    private static class LazyHolder {\n        private static final ChromeChannelDefinitions sInstance = new ChromeChannelDefinitions();\n"
      replace: "     * set of channels returned by {@link #getStartupChannelIds()} or {@link #getLegacyChannelIds()}\n     * changes.\n     */\n    static final int CHANNELS_VERSION = 11;\n\n    private static class LazyHolder {\n        private static final ChromeChannelDefinitions sInstance = new ChromeChannelDefinitions();\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "        ChannelId.BLUETOOTH,\n        ChannelId.USB,\n        ChannelId.SERIAL,\n        ChannelId.TIPS, // Deprecated, use TIPS_V2.\n        ChannelId.TIPS_V2,\n    })\n    @Retention(RetentionPolicy.SOURCE)\n    public @interface ChannelId {\n"
      replace: "        ChannelId.BLUETOOTH,\n        ChannelId.USB,\n        ChannelId.SERIAL,\n    })\n    @Retention(RetentionPolicy.SOURCE)\n    public @interface ChannelId {\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "                            NotificationManager.IMPORTANCE_LOW,\n                            ChannelGroupId.GENERAL));\n\n            // The tips notification channel will appear for users who opted in.\n            // For new users, it will be created when they explicitly opt in.\n            map.put(\n                    ChannelId.TIPS_V2,\n                    PredefinedChannel.create(\n                            ChannelId.TIPS_V2,\n                            R.string.notification_category_tips,\n                            NotificationManager.IMPORTANCE_DEFAULT,\n                            ChannelGroupId.GENERAL));\n\n            MAP = Collections.unmodifiableMap(map);\n            STARTUP = Collections.unmodifiableSet(startup);\n        }\n"
      replace: "                            NotificationManager.IMPORTANCE_LOW,\n                            ChannelGroupId.GENERAL));\n\n            MAP = Collections.unmodifiableMap(map);\n            STARTUP = Collections.unmodifiableSet(startup);\n        }\n"
    count: 1
  - description: Exclude Android promotional Tips implementation while retaining core notifications
    regex:
      pattern: "        ChromeChannelDefinitions.ChannelId.PERMISSION_REQUESTS,\n        ChromeChannelDefinitions.ChannelId.PERMISSION_REQUESTS_HIGH,\n        ChromeChannelDefinitions.ChannelId.TIPS,\n        ChromeChannelDefinitions.ChannelId.CHROME_FINDS,\n    };\n\n"
      replace: "        ChromeChannelDefinitions.ChannelId.PERMISSION_REQUESTS,\n        ChromeChannelDefinitions.ChannelId.PERMISSION_REQUESTS_HIGH,\n        ChromeChannelDefinitions.ChannelId.TIPS,\n        ChromeChannelDefinitions.ChannelId.TIPS_V2,\n        ChromeChannelDefinitions.ChannelId.CHROME_FINDS,\n    };\n\n"
    count: 1
