# Android notification compile dependencies and array nullness.
substitutions:
- description: Declare optional extension-only rendering fields
  regex:
    re_pattern: import\ org\.chromium\.build\.annotations\.NullMarked;
    replace: 'import org.chromium.build.annotations.NullMarked;

      import org.chromium.build.annotations.Nullable;'
- description: Store bounded progress/list/context data while preserving normal notification defaults
  regex:
    re_pattern: \ \ \ \ private\ final\ Context\ mContext;
    replace: "    private final Context mContext;\n    private int mExtensionProgress = -1;\n    private @Nullable CharSequence mExtensionContext;\n    private @Nullable CharSequence[] mExtensionItems;\n\n    /** Adds extension content without changing attribution or public lockscreen content. */\n    public StandardNotificationBuilder setExtensionContent(\n            int progress, String context, String[] itemTitles, String[] itemMessages) {\n        if (progress < -1 || progress > 100 || itemTitles.length != itemMessages.length) {\n            throw new IllegalArgumentException(\"Invalid extension notification content\");\n        }\n        mExtensionProgress = progress;\n        mExtensionContext = limitLength(context);\n        mExtensionItems = itemTitles.length == 0 ? null : new CharSequence[itemTitles.length];\n        if (mExtensionItems != null) {\n            for (int i = 0; i < itemTitles.length; ++i) {\n                mExtensionItems[i] = assumeNonNull(limitLength(itemTitles[i] + \": \" + itemMessages[i]));\n            }\n        }\n        return this;\n    }\n\n    private @Nullable CharSequence getExpandedBody() {\n        if (mExtensionContext == null || mExtensionContext.length() == 0) return mBody;\n        return limitLength((mBody == null || mBody.length() == 0 ? \"\" : mBody + \"\\\\n\")\n                + mExtensionContext);\n    }"
- description: Render extension progress, list rows, and context with Android notification styles
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(mImage\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ builder\.setBigPictureStyle\(mImage,\ mBody\);\

      \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ builder\.setBigTextStyle\(mBody\);\

      \ \ \ \ \ \ \ \ \}'
    replace: "        if (mExtensionProgress >= 0) {\n            builder.setProgress(100, mExtensionProgress, false);\n        }\n        if (mExtensionItems != null) {\n            builder.setInboxStyle(mExtensionItems, getExpandedBody());\n        } else if (mImage != null) {\n            builder.setBigPictureStyle(mImage, getExpandedBody());\n        } else {\n            builder.setBigTextStyle(getExpandedBody());\n        }"
- description: Format modified Android notification Java sources
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mExtensionContext\ =\ limitLength\(context\);\

      \ \ \ \ \ \ \ \ mExtensionItems\ =\ itemTitles\.length\ ==\ 0\ \?\ null\ :\ new\ CharSequence\[itemTitles\.length\];\

      \ \ \ \ \ \ \ \ if\ \(mExtensionItems\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ for\ \(int\ i\ =\ 0;\ i\ <\ itemTitles\.length;\ \+\+i\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mExtensionItems\[i\]\ =\ assumeNonNull\(limitLength\(itemTitles\[i\]\ \+\ ":\ "\ \+\ itemMessages\[i\]\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ return\ this;\

      \ \ \ \ \}\

      \

      \ \ \ \ private\ @Nullable\ CharSequence\ getExpandedBody\(\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(mExtensionContext\ ==\ null\ \|\|\ mExtensionContext\.length\(\)\ ==\ 0\)\ return\ mBody;\

      \ \ \ \ \ \ \ \ return\ limitLength\(\(mBody\ ==\ null\ \|\|\ mBody\.length\(\)\ ==\ 0\ \?\ ""\ :\ mBody\ \+\ "\\n"\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \+\ mExtensionContext\);\

      \ \ \ \ \}\

      \

      \ \ \ \ public\ StandardNotificationBuilder\(Context\ context\)\ \{\

      \ \ \ \ \ \ \ \ super\(context\.getResources\(\)\);\

      '
    replace: "        mExtensionContext = limitLength(context);\n        mExtensionItems = itemTitles.length == 0 ? null : new CharSequence[itemTitles.length];\n        if (mExtensionItems != null) {\n            for (int i = 0; i < itemTitles.length; ++i) {\n                mExtensionItems[i] =\n                        assumeNonNull(limitLength(itemTitles[i] + \": \" + itemMessages[i]));\n            }\n        }\n        return this;\n    }\n\n    private @Nullable CharSequence getExpandedBody() {\n        if (mExtensionContext == null || mExtensionContext.length() == 0) return mBody;\n        return limitLength(\n                (mBody == null || mBody.length() == 0 ? \"\" : mBody + \"\\\\n\") + mExtensionContext);\n    }\n\n    public StandardNotificationBuilder(Context context) {\n        super(context.getResources());\n"
- description: Mark the optional items array nullable while retaining non-null row elements in JSpecify mode
  regex:
    re_pattern: private\ @Nullable\ CharSequence\[\]\ mExtensionItems;
    replace: private CharSequence @Nullable [] mExtensionItems;
