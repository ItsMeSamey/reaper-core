    replace: "\n    @Test\n    @Feature({\"Browser\", \"Notifications\"})\n    public void testExtensionProgressAndContextPreserveAttributionAndPrivacy() {\n        StandardNotificationBuilder builder =\n                (StandardNotificationBuilder) createAllOptionsBuilder(new PendingIntentProvider[2]);\n        builder.setImage(null);\n        builder.setExtensionContent(37, \"Private transfer details\", new String[0], new String[0]);\n        Notification notification = buildNotification(builder);\n\n        Assert.assertEquals(100, notification.extras.getInt(Notification.EXTRA_PROGRESS_MAX));\n        Assert.assertEquals(37, notification.extras.getInt(Notification.EXTRA_PROGRESS));\n        Assert.assertFalse(notification.extras.getBoolean(Notification.EXTRA_PROGRESS_INDETERMINATE));\n        Assert.assertEquals(\"body\\\\nPrivate transfer details\",\n                notification.extras.getCharSequence(Notification.EXTRA_BIG_TEXT).toString());\n        Assert.assertEquals(\"origin\", NotificationTestUtil.getExtraSubText(notification));\n        Assert.assertNotNull(notification.publicVersion);\n        Assert.assertEquals(RuntimeEnvironment.getApplication().getString(R.string.notification_hidden_text),\n                NotificationTestUtil.getExtraText(notification.publicVersion));\n        Assert.assertEquals(0, notification.publicVersion.extras.getInt(Notification.EXTRA_PROGRESS_MAX));\n        Assert.assertEquals(0, notification.publicVersion.extras.getInt(Notification.EXTRA_PROGRESS));\n        Assert.assertFalse(notification.publicVersion.extras.containsKey(Notification.EXTRA_BIG_TEXT));\n    }\n\n    @Test\n    @Feature({\"Browser\", \"Notifications\"})\n    public void testExtensionListPreservesItemsSummaryAndOrigin() {\n        StandardNotificationBuilder builder =\n                (StandardNotificationBuilder) createAllOptionsBuilder(new PendingIntentProvider[2]);\n        builder.setImage(null);\n        builder.setExtensionContent(-1, \"Two updates\",\n                new String[] {\"First\", \"Second\"}, new String[] {\"Ready\", \"Waiting\"});\n        Notification notification = buildNotification(builder);\n\n        Assert.assertEquals(\"android.app.Notification$InboxStyle\",\n                notification.extras.getString(Notification.EXTRA_TEMPLATE));\n        CharSequence[] lines = notification.extras.getCharSequenceArray(Notification.EXTRA_TEXT_LINES);\n        Assert.assertNotNull(lines);\n        Assert.assertEquals(2, lines.length);\n        Assert.assertEquals(\"First: Ready\", lines[0].toString());\n        Assert.assertEquals(\"Second: Waiting\", lines[1].toString());\n        Assert.assertEquals(\"body\\\\nTwo updates\",\n                notification.extras.getCharSequence(Notification.EXTRA_SUMMARY_TEXT).toString());\n        Assert.assertEquals(\"origin\", NotificationTestUtil.getExtraSubText(notification));\n        Assert.assertFalse(notification.publicVersion.extras.containsKey(Notification.EXTRA_TEXT_LINES));\n        Assert.assertFalse(notification.publicVersion.extras.containsKey(Notification.EXTRA_SUMMARY_TEXT));\n    }\n\n    @Test\n    @Feature({\"Browser\", \"Notifications\"})\n    public void testExtensionProgressBoundaryValuesAreRetained() {\n        for (int progress : new int[] {0, 100}) {\n            StandardNotificationBuilder builder =\n                    (StandardNotificationBuilder) createAllOptionsBuilder(new PendingIntentProvider[2]);\n            builder.setImage(null);\n            builder.setExtensionContent(progress, \"\", new String[0], new String[0]);\n            Notification notification = buildNotification(builder);\n            Assert.assertEquals(progress, notification.extras.getInt(Notification.EXTRA_PROGRESS));\n            Assert.assertEquals(100, notification.extras.getInt(Notification.EXTRA_PROGRESS_MAX));\n        }\n    }\n\n    @Test\n    @Feature({\"Browser\", \"Notifications\"})\n    public void testReplacingExtensionPayloadClearsListProgressAndContext() {\n        StandardNotificationBuilder builder =\n                (StandardNotificationBuilder) createAllOptionsBuilder(new PendingIntentProvider[2]);\n        builder.setImage(null);\n        builder.setExtensionContent(37, \"Old context\", new String[] {\"Old\"}, new String[] {\"Item\"});\n        builder.setExtensionContent(-1, \"\", new String[0], new String[0]);\n        Notification notification = buildNotification(builder);\n        Assert.assertEquals(\"android.app.Notification$BigTextStyle\",\n                notification.extras.getString(Notification.EXTRA_TEMPLATE));\n        Assert.assertEquals(\"body\",\n                notification.extras.getCharSequence(Notification.EXTRA_BIG_TEXT).toString());\n        Assert.assertFalse(notification.extras.containsKey(Notification.EXTRA_TEXT_LINES));\n        Assert.assertEquals(0, notification.extras.getInt(Notification.EXTRA_PROGRESS_MAX));\n    }\n\n}\n"
