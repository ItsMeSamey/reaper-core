# Android extension notification policy and payload support.
substitutions:
- description: Verify real Android app, origin, fallback and group policy without modifying OS settings
  regex:
    re_pattern: '\

      \}\

      '
    replace: "\n    private static final String EXTENSION_ORIGIN =\n            \"chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\";\n\n    private android.app.NotificationManager extensionNotificationManager() {\n        android.app.NotificationManager manager =\n                org.chromium.base.ContextUtils.getApplicationContext()\n                        .getSystemService(android.app.NotificationManager.class);\n        org.robolectric.Shadows.shadowOf(manager).setNotificationsEnabled(true);\n        return manager;\n    }\n\n    @Test\n    @org.robolectric.annotation.Config(sdk = android.os.Build.VERSION_CODES.Q)\n    public void testExtensionStatusReadsCurrentAppPolicyInsteadOfCachedResult() {\n        android.app.NotificationManager manager = extensionNotificationManager();\n        NotificationProxyUtils.setNotificationEnabledForTest(true);\n        org.robolectric.Shadows.shadowOf(manager).setNotificationsEnabled(false);\n        assertThat(NotificationSystemStatusUtil.getExtensionNotificationStatusSync(EXTENSION_ORIGIN),\n                is(NotificationSystemStatusUtil.APP_NOTIFICATIONS_STATUS_DISABLED));\n\n        NotificationProxyUtils.setNotificationEnabledForTest(false);\n        org.robolectric.Shadows.shadowOf(manager).setNotificationsEnabled(true);\n        assertThat(NotificationSystemStatusUtil.getExtensionNotificationStatusSync(EXTENSION_ORIGIN),\n                is(NotificationSystemStatusUtil.APP_NOTIFICATIONS_STATUS_ENABLED));\n    }\n\n    @Test\n    @org.robolectric.annotation.Config(sdk = android.os.Build.VERSION_CODES.Q)\n    public void testExtensionStatusDoesNotCreateChannelsOrGroups() {\n        android.app.NotificationManager manager = extensionNotificationManager();\n        int channelCount = manager.getNotificationChannels().size();\n        int groupCount = manager.getNotificationChannelGroups().size();\n        assertThat(NotificationSystemStatusUtil.getExtensionNotificationStatusSync(EXTENSION_ORIGIN),\n                is(NotificationSystemStatusUtil.APP_NOTIFICATIONS_STATUS_ENABLED));\n        assertThat(manager.getNotificationChannels().size(), is(channelCount));\n        assertThat(manager.getNotificationChannelGroups().size(), is(groupCount));\n    }\n\n    @Test\n    @org.robolectric.annotation.Config(sdk = android.os.Build.VERSION_CODES.Q)\n    public void testExtensionStatusUsesOwnOriginChannelAndPreservesIt() {\n        android.app.NotificationManager manager = extensionNotificationManager();\n        // An unrelated disabled site's channel cannot disable this extension.\n        manager.createNotificationChannel(new android.app.NotificationChannel(\n                \"web:https://unrelated.example;1\", \"Unrelated\", android.app.NotificationManager.IMPORTANCE_NONE));\n        assertThat(NotificationSystemStatusUtil.getExtensionNotificationStatusSync(EXTENSION_ORIGIN),\n                is(NotificationSystemStatusUtil.APP_NOTIFICATIONS_STATUS_ENABLED));\n        String channelId = \"web:\" + EXTENSION_ORIGIN + \";2\";\n        manager.createNotificationChannel(new android.app.NotificationChannel(\n                channelId, \"Extension\", android.app.NotificationManager.IMPORTANCE_NONE));\n        int channelCount = manager.getNotificationChannels().size();\n        assertThat(NotificationSystemStatusUtil.getExtensionNotificationStatusSync(EXTENSION_ORIGIN),\n                is(NotificationSystemStatusUtil.APP_NOTIFICATIONS_STATUS_DISABLED));\n        assertThat(manager.getNotificationChannels().size(), is(channelCount));\n        assertThat(manager.getNotificationChannel(channelId).getImportance(),\n                is(android.app.NotificationManager.IMPORTANCE_NONE));\n    }\n\n    @Test\n    @org.robolectric.annotation.Config(sdk = android.os.Build.VERSION_CODES.Q)\n    public void testExtensionStatusRespectsFallbackSitesChannel() {\n        android.app.NotificationManager manager = extensionNotificationManager();\n        String fallback = org.chromium.chrome.browser.notifications.channels.ChromeChannelDefinitions.ChannelId.SITES;\n        manager.createNotificationChannel(new android.app.NotificationChannel(\n                fallback, \"Sites\", android.app.NotificationManager.IMPORTANCE_NONE));\n        assertThat(NotificationSystemStatusUtil.getExtensionNotificationStatusSync(EXTENSION_ORIGIN),\n                is(NotificationSystemStatusUtil.APP_NOTIFICATIONS_STATUS_DISABLED));\n        manager.createNotificationChannel(new android.app.NotificationChannel(\n                \"web:\" + EXTENSION_ORIGIN + \";3\", \"Extension\", android.app.NotificationManager.IMPORTANCE_DEFAULT));\n        assertThat(NotificationSystemStatusUtil.getExtensionNotificationStatusSync(EXTENSION_ORIGIN),\n                is(NotificationSystemStatusUtil.APP_NOTIFICATIONS_STATUS_ENABLED));\n    }\n\n    @Test\n    @org.robolectric.annotation.Config(sdk = android.os.Build.VERSION_CODES.Q)\n    public void testExtensionStatusRespectsBlockedGroupWithoutCreatingFallback() {\n        android.app.NotificationManager manager = extensionNotificationManager();\n        String groupId = org.chromium.chrome.browser.notifications.channels.ChromeChannelDefinitions.ChannelGroupId.GENERAL;\n        android.app.NotificationChannelGroup group =\n                new android.app.NotificationChannelGroup(groupId, \"General\");\n        // Android's user-controlled blocked field has no application setter. Only\n        // the test uses reflection to model an OS-settings change.\n        org.robolectric.util.ReflectionHelpers.callInstanceMethod(group, \"setBlocked\",\n                org.robolectric.util.ReflectionHelpers.ClassParameter.from(boolean.class, true));\n        manager.createNotificationChannelGroup(group);\n        int channelCount = manager.getNotificationChannels().size();\n        assertThat(NotificationSystemStatusUtil.getExtensionNotificationStatusSync(EXTENSION_ORIGIN),\n                is(NotificationSystemStatusUtil.APP_NOTIFICATIONS_STATUS_DISABLED));\n        assertThat(manager.getNotificationChannels().size(), is(channelCount));\n    }\n\n}\n"
