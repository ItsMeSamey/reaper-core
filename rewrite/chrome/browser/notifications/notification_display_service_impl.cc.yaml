substitutions:
- description: Preserve qualified conventional P prefix before reviewed enterprise edits
  regex:
    pattern: "                             std::make_unique<NearbyNotificationHandler>());\n    }\n#endif\n  }\n\n  bridge_delegator_\
      \ = std::make_unique<NotificationPlatformBridgeDelegator>(\n"
    replace: "                             std::make_unique<NearbyNotificationHandler>());\n    }\n#endif\n    BRAVE_NOTIFICATION_DISPLAY_SERVICE_IMPL_CONSTRUCTOR;\n\
      \  }\n\n  bridge_delegator_ = std::make_unique<NotificationPlatformBridgeDelegator>(\n"
  count: 1
- description: Remove dedicated Android enterprise request notification handler include
  regex:
    pattern: '#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)

      #if BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/enterprise/reporting/extension_request/extension_request_notification_handler_android.h"

      #endif

      #include "chrome/browser/extensions/api/notifications/extension_notification_handler.h"

      '
    replace: '#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)

      #include "chrome/browser/extensions/api/notifications/extension_notification_handler.h"

      '
  count: 1
- description: Remove dedicated Android enterprise request handler registration; keep ordinary extension notifications
  regex:
    pattern: "        std::make_unique<extensions::ExtensionNotificationHandler>());\n#if BUILDFLAG(IS_ANDROID)\n    AddNotificationHandler(\n\
      \        NotificationHandler::Type::EXTENSION_REQUEST,\n        std::make_unique<\n            enterprise_reporting::ExtensionRequestNotificationHandler>());\n\
      #endif\n#endif\n"
    replace: '        std::make_unique<extensions::ExtensionNotificationHandler>());

      #endif

      '
  count: 1
- description: Complete stale Android enterprise notification callbacks before handler lookup
  regex:
    pattern: "    const std::optional<bool>& is_suspicious,\n    base::OnceClosure on_completed_cb) {\n"
    replace: "    const std::optional<bool>& is_suspicious,\n    base::OnceClosure on_completed_cb) {\n#if BUILDFLAG(IS_ANDROID)\n\
      \  // A persisted callback can outlive the removed enterprise reporting feature.\n  // Complete it without reviving\
      \ reporting or reaching the missing-handler DCHECK.\n  if (notification_type == NotificationHandler::Type::EXTENSION_REQUEST)\
      \ {\n    std::move(on_completed_cb).Run();\n    return;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
