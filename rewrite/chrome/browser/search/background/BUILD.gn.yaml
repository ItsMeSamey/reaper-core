# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android optional wallpaper provider omission and real ordinary NTP test registration: chrome/browser/search/background/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/gfx",\

      \ \ \ \ "//ui/gfx/codec",\

      \ \ \]\

      \}\

      '
    replace: "    \"//ui/gfx\",\n    \"//ui/gfx/codec\",\n  ]\n  if (is_android) {\n    public -= [\n      \"wallpaper_search/wallpaper_search_background_manager.h\",\n      \"wallpaper_search/wallpaper_search_background_manager_observer.h\",\n      \"wallpaper_search/wallpaper_search_data.h\",\n    ]\n    sources -= [\n      \"wallpaper_search/wallpaper_search_background_manager.cc\",\n      \"wallpaper_search/wallpaper_search_data.cc\",\n    ]\n    deps -= [ \"//components/optimization_guide/core:features\" ]\n  }\n}\n"
