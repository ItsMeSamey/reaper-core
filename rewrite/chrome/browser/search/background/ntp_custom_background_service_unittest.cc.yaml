# Android optional model helpers; ordinary browser behavior retained.
substitutions:
- description: 'Android optional model metadata/helpers compile boundary: chrome/browser/search/background/ntp_custom_background_service_unittest.cc'
  regex:
    re_pattern: '\#include\ "chrome/browser/search/background/ntp_custom_background_service\.h"\

      \

      \#include\ <optional>\

      \#include\ <vector>\

      \

      \#include\ "base/files/file_util\.h"\

      '
    replace: '#include "chrome/browser/search/background/ntp_custom_background_service.h"


      #include <optional>

      #include <string>

      #include <vector>


      #include "base/files/file_util.h"

      '
- description: 'Android optional model metadata/helpers compile boundary: chrome/browser/search/background/ntp_custom_background_service_unittest.cc'
  regex:
    re_pattern: '\#include\ "base/test/metrics/histogram_tester\.h"\

      \#include\ "base/test/mock_callback\.h"\

      \#include\ "base/test/simple_test_clock\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "base/token\.h"\

      \#include\ "build/build_config\.h"\

      '
    replace: '#include "base/test/metrics/histogram_tester.h"

      #include "base/test/mock_callback.h"

      #include "base/test/simple_test_clock.h"

      #include "base/test/scoped_feature_list.h"

      #include "base/time/time.h"

      #include "base/token.h"

      #include "build/build_config.h"

      '
- description: 'Android optional model metadata/helpers compile boundary: chrome/browser/search/background/ntp_custom_background_service_unittest.cc'
  regex:
    re_pattern: '\#include\ "chrome/test/base/testing_browser_process\.h"\

      \#include\ "chrome/test/base/testing_profile\.h"\

      \#include\ "components/application_locale_storage/application_locale_storage\.h"\

      \#include\ "components/sync_preferences/testing_pref_service_syncable\.h"\

      \#include\ "components/themes/ntp_custom_background_service_observer\.h"\

      \#include\ "content/public/test/browser_task_environment\.h"\

      '
    replace: '#include "chrome/test/base/testing_browser_process.h"

      #include "chrome/test/base/testing_profile.h"

      #include "components/application_locale_storage/application_locale_storage.h"

      #include "components/search/ntp_features.h"

      #include "components/sync_preferences/testing_pref_service_syncable.h"

      #include "components/themes/ntp_custom_background_service_observer.h"

      #include "content/public/test/browser_task_environment.h"

      '
- description: 'Android optional model metadata/helpers compile boundary: chrome/browser/search/background/ntp_custom_background_service_unittest.cc'
  regex:
    re_pattern: '\ \ EXPECT_EQ\(true,\ custom_background\->is_uploaded_image\);\

      \ \ EXPECT_TRUE\(custom_background\->is_inspiration_image\);\

      \}\

      '
    replace: "  EXPECT_EQ(true, custom_background->is_uploaded_image);\n  EXPECT_TRUE(custom_background->is_inspiration_image);\n}\n\n#if BUILDFLAG(IS_ANDROID)\nTEST_F(NtpCustomBackgroundServiceTest,\n       WallpaperFlagPreservesOrdinaryPrefsAndLocalImageCopy) {\n  base::test::ScopedFeatureList feature_list;\n  feature_list.InitAndEnableFeature(ntp_features::kCustomizeChromeWallpaperSearch);\n  sync_preferences::TestingPrefServiceSyncable prefs_service;\n  NtpCustomBackgroundService::RegisterProfilePrefs(prefs_service.registry());\n  EXPECT_NE(nullptr, prefs_service.FindPreference(prefs::kNtpCustomBackgroundDict));\n  EXPECT_FALSE(prefs_service.GetBoolean(prefs::kNtpCustomBackgroundLocalToDevice));\n  EXPECT_TRUE(prefs_service.GetString(prefs::kNtpCustomBackgroundLocalToDeviceId)\n                  .empty());\n  EXPECT_FALSE(prefs_service.GetBoolean(prefs::kNtpCustomBackgroundInspiration));\n  EXPECT_EQ(nullptr, prefs_service.FindPreference(prefs::kNtpWallpaperSearchHistory));\n\n  EXPECT_CALL(observer_, OnCustomBackgroundImageUpdated).Times(1);\n  const base::FilePath path = profile().GetPath().AppendASCII(\"ordinary_local_image\");\n  const base::FilePath copy_path = profile().GetPath().AppendASCII(\n      chrome::kChromeUIUntrustedNewTabPageBackgroundFilename);\n  ASSERT_TRUE(base::WriteFile(path, \"ordinary_background_bytes\"));\n  custom_background_service_->SelectLocalBackgroundImage(path);\n  task_environment_.RunUntilIdle();\n\n  std::string copied;\n  ASSERT_TRUE(base::ReadFileToString(copy_path, &copied));\n  EXPECT_EQ(\"ordinary_background_bytes\", copied);\n  EXPECT_TRUE(profile().GetPrefs()->GetBoolean(\n      prefs::kNtpCustomBackgroundLocalToDevice));\n  EXPECT_TRUE(profile().GetPrefs()->GetString(\n      prefs::kNtpCustomBackgroundLocalToDeviceId).empty());\n  auto background = custom_background_service_->GetCustomBackground();\n  ASSERT_TRUE(background);\n  EXPECT_TRUE(background->is_uploaded_image);\n  EXPECT_TRUE(custom_background_service_->IsCustomBackgroundSet());\n}\n\nTEST_F(NtpCustomBackgroundServiceTest,\n       WallpaperFlagPreservesSyncedBackgroundReplacingLocalImage) {\n  base::test::ScopedFeatureList feature_list;\n  feature_list.InitAndEnableFeature(ntp_features::kCustomizeChromeWallpaperSearch);\n  EXPECT_CALL(observer_, OnCustomBackgroundImageUpdated).Times(2);\n  const base::FilePath path = profile().GetPath().AppendASCII(\n      chrome::kChromeUIUntrustedNewTabPageBackgroundFilename);\n  ASSERT_TRUE(base::WriteFile(path, \"ordinary_local_background\"));\n  custom_background_service_->SelectLocalBackgroundImage(path);\n  task_environment_.RunUntilIdle();\n  ASSERT_TRUE(profile().GetPrefs()->GetBoolean(\n      prefs::kNtpCustomBackgroundLocalToDevice));\n  ASSERT_TRUE(base::PathExists(path));\n\n  const GURL synced_url(\"https://example.test/synced-background\");\n  profile().GetTestingPrefService()->SetUserPref(\n      prefs::kNtpCustomBackgroundDict,\n      GetBackgroundInfoAsDict(synced_url, GURL()));\n  task_environment_.RunUntilIdle();\n  auto background = custom_background_service_->GetCustomBackground();\n  ASSERT_TRUE(background);\n  EXPECT_EQ(synced_url, background->custom_background_url);\n  EXPECT_FALSE(background->is_uploaded_image);\n  EXPECT_FALSE(profile().GetPrefs()->GetBoolean(\n      prefs::kNtpCustomBackgroundLocalToDevice));\n  EXPECT_FALSE(base::PathExists(path));\n}\n#endif\n"
- description: Keep borrowed NTP theme delegate alive through TestingProfile-owned
    service destruction
  regex:
    re_pattern: '\ \ raw_ptr<ApplicationLocaleStorage>\ application_locale_storage_;\

      \ \ std::unique_ptr<TestingProfile>\ profile_;\

      \ \ base::SimpleTestClock\ clock_;\

      \ \ MockNtpCustomBackgroundServiceObserver\ observer_;\

      \ \ MockThemeDelegate\ mock_theme_delegate_;\

      '
    replace: "  raw_ptr<ApplicationLocaleStorage> application_locale_storage_;\n \
      \ MockThemeDelegate mock_theme_delegate_;\n  std::unique_ptr<TestingProfile>\
      \ profile_;\n  base::SimpleTestClock clock_;\n  MockNtpCustomBackgroundServiceObserver\
      \ observer_;\n"
