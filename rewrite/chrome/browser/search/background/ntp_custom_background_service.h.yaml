# Android optional model helpers; ordinary browser behavior retained.
substitutions:
- description: 'Android optional model metadata/helpers compile boundary: chrome/browser/search/background/ntp_custom_background_service.h'
  regex:
    re_pattern: '\#include\ "base/scoped_observation\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "base/values\.h"\

      \#include\ "chrome/browser/search/background/theme_delegate\.h"\

      \#include\ "components/image_fetcher/core/image_fetcher_impl\.h"\

      \#include\ "components/themes/ntp_background_service\.h"\

      '
    replace: '#include "base/scoped_observation.h"

      #include "base/time/time.h"

      #include "base/values.h"

      #include "build/build_config.h"

      #include "chrome/browser/search/background/theme_delegate.h"

      #include "components/image_fetcher/core/image_fetcher_impl.h"

      #include "components/themes/ntp_background_service.h"

      '
- description: 'Android optional model metadata/helpers compile boundary: chrome/browser/search/background/ntp_custom_background_service.h'
  regex:
    re_pattern: '\ \ //\ Updates\ prefs\ with\ custom\ background\ color\ for\ local\ background\ image\.\

      \ \ void\ UpdateLocalCustomBackgroundPrefsWithColor\(SkColor\ color\);\

      \

      \ \ //\ Process\ local\ background\ image\ for\ color\ extraction\

      \ \ void\ ProcessLocalImageData\(std::string\ image_data\);\

      \

      \ \ //\ Callback\ that\ updates\ custom\ background\ information\ after\ the\ fetch\ of\ its\

      \ \ //\ URL''s\ headers\ has\ been\ completed\.\

      '
    replace: "  // Updates prefs with custom background color for local background image.\n  void UpdateLocalCustomBackgroundPrefsWithColor(SkColor color);\n\n#if !BUILDFLAG(IS_ANDROID)\n  // Process local background image for color extraction\n  void ProcessLocalImageData(std::string image_data);\n#endif\n\n  // Callback that updates custom background information after the fetch of its\n  // URL's headers has been completed.\n"
