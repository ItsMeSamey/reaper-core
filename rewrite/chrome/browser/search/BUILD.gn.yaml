# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android optional wallpaper provider omission and real ordinary NTP test registration: chrome/browser/search/BUILD.gn'
  regex:
    re_pattern: '\ \ \}\

      \

      \ \ if\ \(is_android\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "contextual_search_policy_handler_android_unittest\.cc"\ \]\

      \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ ":search",\

      \ \ \ \ \ \ "//base",\

      \ \ \ \ \ \ "//chrome/common",\

      \ \ \ \ \ \ "//components/policy/core/browser",\

      \ \ \ \ \ \ "//components/policy/core/common",\

      \ \ \ \ \ \ "//components/prefs",\

      \ \ \ \ \ \ "//testing/gtest",\

      \ \ \ \ \]\

      \ \ \}\

      '
    replace: "  }\n\n  if (is_android) {\n    sources += [\n      \"background/ntp_custom_background_service_unittest.cc\",\n      \"contextual_search_policy_handler_android_unittest.cc\",\n    ]\n    deps += [\n      \":search\",\n      \"//base\",\n      \"//base/test:test_support\",\n      \"//chrome/browser/search/background\",\n      \"//chrome/browser/search_engines\",\n      \"//chrome/common\",\n      \"//chrome/test:test_support\",\n      \"//components/application_locale_storage\",\n      \"//components/policy/core/browser\",\n      \"//components/policy/core/common\",\n      \"//components/prefs\",\n      \"//components/search\",\n      \"//components/sync_preferences:test_support\",\n      \"//components/themes\",\n      \"//content/test:test_support\",\n      \"//services/data_decoder/public/cpp:test_support\",\n      \"//services/network:test_support\",\n      \"//testing/gmock\",\n      \"//testing/gtest\",\n    ]\n  }\n"
