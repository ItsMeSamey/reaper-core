substitutions:
  - description: Add the deps the Brave history_embeddings overrides need.
    add_literal_to_list:
      target: impl
      list_name: deps
      literal: brave_chromium_src_chrome_browser_history_embeddings_impl_deps
      import: //brave/chromium_src/chrome/browser/history_embeddings/sources.gni
  - description: 'Android history AI430: chrome/browser/history_embeddings/BUILD.gn step 1'
    regex:
