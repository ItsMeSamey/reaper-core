# Android extension side panel presentation and profile ownership.
substitutions:
  - description: Enable the implemented Android side panel when the extension engine is built.
    regex:
      pattern: "BASE_FEATURE(kEnableAndroidSidePanel, base::FEATURE_DISABLED_BY_DEFAULT);"
      replace: |2-
        #if BUILDFLAG(ENABLE_EXTENSIONS_CORE)
        BASE_FEATURE(kEnableAndroidSidePanel, base::FEATURE_ENABLED_BY_DEFAULT);
        #else
        BASE_FEATURE(kEnableAndroidSidePanel, base::FEATURE_DISABLED_BY_DEFAULT);
        #endif
  - description: Enable the implemented native URL override tracker when Android extensions are built.
    regex:
      pattern: "BASE_FEATURE(kChromeNativeUrlOverriding, base::FEATURE_DISABLED_BY_DEFAULT);"
      replace: |2-
        #if BUILDFLAG(ENABLE_EXTENSIONS_CORE)
        BASE_FEATURE(kChromeNativeUrlOverriding, base::FEATURE_ENABLED_BY_DEFAULT);
        #else
        BASE_FEATURE(kChromeNativeUrlOverriding, base::FEATURE_DISABLED_BY_DEFAULT);
        #endif

  - description: Enable the complete Android consent/capture/notification path.
    regex:
      pattern: BASE_FEATURE(kTabSharingToolbarAndroid, base::FEATURE_DISABLED_BY_DEFAULT);
      replace: BASE_FEATURE(kTabSharingToolbarAndroid, base::FEATURE_ENABLED_BY_DEFAULT);

