  - description: "Android Finds compile-out: Remove Android Finds feature include"
    regex:
      re_pattern: "\\#include\\ \"chrome/browser/finds/core/finds_features\\.h\"\\\n"
      replace: ""
    count: 1

  - description: "Android Finds compile-out: Remove Android Finds dependency or source"
    regex:
      re_pattern: "\\ \\ \\ \\ \\&finds::features::kChromeFinds,\\\n"
      replace: ""
    count: 1
  - description: remove-history-donation-JNI-feature-export
    regex:
      pattern: '    &kAuxiliarySearchHistoryDonation,

        '
      replace: ''
    count: 1
  - description: remove-history-donation-native-feature-definition
    regex:
      pattern: 'BASE_FEATURE(kAuxiliarySearchHistoryDonation, base::FEATURE_DISABLED_BY_DEFAULT);

        '
      replace: ''
    count: 1
  - description: Remove retired Android survey feature from native exposure map
    regex:
      pattern: '    &kChromeSurveyNextAndroid,

        '
      replace: ''
    count: 1
  - description: Remove unused native Android survey feature definition
    regex:
      pattern: 'BASE_FEATURE(kChromeSurveyNextAndroid, base::FEATURE_ENABLED_BY_DEFAULT);

        '
      replace: ''
    count: 1
  - description: Remove the obsolete Android Java feature-map entry whose dedicated survey descriptor is compiled out on Android
