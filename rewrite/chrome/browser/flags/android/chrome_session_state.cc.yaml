substitutions:
  - description: "0566 retain activity state without telemetry side effects 1"
    regex:
      pattern: "#include \"services/metrics/public/cpp/ukm_source.h\"\n"
      replace: ""
    count: 1
  - description: "0566 retain activity state without telemetry side effects 2"
    regex:
      pattern: "void SetActivityType(PrefService* local_state, ActivityType type) {\n  DCHECK(local_state);\n  DCHECK_NE(type, ActivityType::kPreFirstTab);\n\n  ActivityType prev_activity_type = activity_type;\n  activity_type = type;\n\n  // EmitActivityTypeHistograms on first SetActivityType call.\n  if (prev_activity_type == ActivityType::kPreFirstTab) {\n    EmitActivityTypeHistograms(activity_type);\n    SaveActivityTypeToLocalState(local_state, activity_type);\n  }\n\n  ukm::UkmSource::SetAndroidActivityTypeState(static_cast<int>(activity_type));\n}\n"
      replace: "void SetActivityType(PrefService* /*local_state*/, ActivityType type) {\n  DCHECK_NE(type, ActivityType::kPreFirstTab);\n  // Activity/feature selection needs the current type, without telemetry\n  // emission or persistence into the removed metrics preference registry.\n  activity_type = type;\n}\n"
    count: 1
