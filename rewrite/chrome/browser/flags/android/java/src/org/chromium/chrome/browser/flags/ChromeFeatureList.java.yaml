# Reaper side-panel cached-default startup correction.
  - description: Preserve side-panel startup for the desktop-Android fork in unofficial
      unbranded production while retaining ordinary mobile and test defaults.
    regex:
      re_pattern: 'public\ static\ final\ CachedFlag\ sEnableAndroidSidePanel\ =\

        \ \ \ \ \ \ \ \ \ \ \ \ newCachedFlag\(\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ENABLE_ANDROID_SIDE_PANEL,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ defaultValue=\ \*/\ BuildConfig\.IS_DESKTOP_ANDROID,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ In\ http://crrev\.com/c/7689838,\
        "defaultValueInTests"\ was\ set\ to\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ true\ for\ testing\ purposes\.\
        Detailed\ reasons\ are\ in\ that\ CL''s\ commit\ message\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ However,\ it\ caused\ the\ flag\
        to\ be\ also\ enabled\ in\ non\-official\ or\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ non\-Chrome\-branded\ browser\ app\
        APKs\ on\ _mobile_\ Android\ where\ there\ should\ be\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ no\ side\ panel\ \(see\ CachedFlag\.java\
        for\ details\)\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ To\ avoid\ affecting\ non\-official\
        or\ non\-Chrome\-branded\ _mobile_\ Android\ in\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ non\-testing\ environments,\ we\
        use\ BuildConfig\.IS_FOR_TEST\ to\ truly\ limit\ the\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ "true"\ value\ in\ tests\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ In\ the\ long\-term,\ this\ flag\
        will\ be\ enabled\ for\ all\ form\ factors,\ and\ the\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ code\ behind\ it\ should\ decide\
        whether\ the\ side\ panel\ UI\ should\ appear,\ based\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ on\ factors\ like\ window\ size\.\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ /\*\ defaultValueInTests=\ \*/\ BuildConfig\.IS_FOR_TEST\);'
      replace: "public static final CachedFlag sEnableAndroidSidePanel =\n         \
        \   newCachedFlag(\n                    ENABLE_ANDROID_SIDE_PANEL,\n       \
        \             /* defaultValue= */ BuildConfig.IS_DESKTOP_ANDROID,\n        \
        \            // In http://crrev.com/c/7689838, \"defaultValueInTests\" was set\
        \ to\n                    // true for testing purposes. Detailed reasons are\
        \ in that CL's commit message.\n                    //\n                   \
        \ // However, it caused the flag to be also enabled in non-official or\n   \
        \                 // non-Chrome-branded browser app APKs on _mobile_ Android\
        \ where there should be\n                    // no side panel (see CachedFlag.java\
        \ for details).\n                    //\n                    // To avoid affecting\
        \ non-official or non-Chrome-branded _mobile_ Android in\n                 \
        \   // non-testing environments, we use BuildConfig.IS_FOR_TEST to truly limit\
        \ the\n                    // \"true\" value in tests.\n                   \
        \ //\n                    // In the long-term, this flag will be enabled for\
        \ all form factors, and the\n                    // code behind it should decide\
        \ whether the side panel UI should appear, based\n                    // on\
        \ factors like window size.\n                    /* defaultValueInTests= */\
        \ BuildConfig.IS_DESKTOP_ANDROID\n                            || BuildConfig.IS_FOR_TEST);"

