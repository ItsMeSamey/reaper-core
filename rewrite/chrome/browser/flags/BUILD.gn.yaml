# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/flags/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//third_party/blink/public/common:headers",\

      \ \ \ \ "//ui/base:features",\

      \ \ \]\

      \ \ if\ \(enable_extensions_core\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//extensions/common:extension_features"\ \]\

      \ \ \}\

      '
    replace: "    \"//third_party/blink/public/common:headers\",\n    \"//ui/base:features\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/glic/public:features\",\n      \"//components/contextual_tasks/public:feature_list\",\n    ]\n  }\n  if (enable_extensions_core) {\n    deps += [ \"//extensions/common:extension_features\" ]\n  }\n"

- description: "Android Finds compile-out: Remove Android Finds dependency or source"
  regex:
    re_pattern: "\\ \\ \\ \\ \"//chrome/browser/finds/core\",\\\n"
    replace: ""
  count: 1
