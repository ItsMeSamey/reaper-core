substitutions:
  - description: |-
      Only prompt for updater promotion when Brave is using Omaha 4.

      Most macOS users are still updated by Sparkle, which manages promotion
      itself, so the Keystone promotion infobar must not reach them.
    preempt_function_impl:
      function_name: PromptUpdaterPromotion
      return_if: '!ShouldPromptUpdaterPromotion()'
  - description: "Preserve reviewed Android source projection for chrome/browser/chrome_browser_main.cc (operation 2)."
    regex:
      re_pattern: 'void\ ChromeBrowserMainParts::SetupMetrics\(\)\ \{\

        \ \ TRACE_EVENT0\("startup",\ "ChromeBrowserMainParts::SetupMetrics"\);\

        \ \ CHECK\(metrics::SubprocessMetricsProvider::CreateInstance\(\)\);\

        \ \ metrics::MetricsService\*\ metrics\ =\ browser_process_\->metrics_service\(\);\

        \ \ metrics\->GetSyntheticTrialRegistry\(\)\->AddObserver\(\

        \ \ \ \ \ \ variations::VariationsIdsProvider::GetInstance\(\)\);\

        '
      replace: "void ChromeBrowserMainParts::SetupMetrics() {\n  TRACE_EVENT0(\"startup\", \"ChromeBrowserMainParts::SetupMetrics\");\n  CHECK(metrics::SubprocessMetricsProvider::CreateInstance());\n#if BUILDFLAG(IS_ANDROID)\n  auto* registry = browser_process_->GetMetricsServicesManager()\n                       ->GetSyntheticTrialRegistry();\n  registry->AddObserver(variations::VariationsIdsProvider::GetInstance());\n  registry->AddObserver(\n      variations::SyntheticTrialsActiveGroupIdProvider::GetInstance());\n  synthetic_trial_syncer_ = content::SyntheticTrialSyncer::Create(registry);\n#else\n  metrics::MetricsService* metrics = browser_process_->metrics_service();\n  metrics->GetSyntheticTrialRegistry()->AddObserver(\n      variations::VariationsIdsProvider::GetInstance());\n"
