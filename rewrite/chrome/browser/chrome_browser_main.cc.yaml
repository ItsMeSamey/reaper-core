  - description: "Exclude ERP-only extra-parts header from Android startup."
    count: 1
    regex:
      pattern: "#include \"chrome/browser/enterprise/chrome_browser_main_extra_parts_enterprise.h\"\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/enterprise/chrome_browser_main_extra_parts_enterprise.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  - description: "Do not register the ERP provider on Android; retain metrics and every other extra part."
    count: 1
    regex:
      pattern: "  main_parts->AddParts(\n      std::make_unique<\n          enterprise_util::ChromeBrowserMainExtraPartsEnterprise>());\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  main_parts->AddParts(\n      std::make_unique<\n          enterprise_util::ChromeBrowserMainExtraPartsEnterprise>());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"

  - description: Install Android navigation driver before profile initialization.
    regex:
      re_pattern: '\ \ SCOPED_UMA_HISTOGRAM_LONG_TIMER\("Startup\.PreMainMessageLoopRunImplLongTime"\);\

        \

        '
      replace: "  SCOPED_UMA_HISTOGRAM_LONG_TIMER(\"Startup.PreMainMessageLoopRunImplLongTime\");\n\n#if BUILDFLAG(IS_ANDROID)\n  // Profile initialization can deserialize navigations while extensions start.\n  // Install Chrome's driver before the content fallback can be created.\n  sessions::ContentSerializedNavigationDriver::SetInstance(\n      ChromeSerializedNavigationDriver::GetInstance());\n#endif\n\n"
  - description: Retain late navigation-driver installation on non-Android only.
    regex:
      re_pattern: '\ \ //\ This\ has\ to\ come\ before\ the\ first\ GetInstance\(\)\ call\.\ PreBrowserStart\(\)\

        \ \ //\ seems\ like\ a\ reasonable\ place\ to\ put\ this,\ except\ on\ Android,\

        \ \ //\ OfflinePageInfoHandler::Register\(\)\ below\ calls\ GetInstance\(\)\.\

        \ \ //\ TODO\(thestig\):\ See\ if\ the\ Android\ code\ below\ can\ be\ moved\ to\ later\.\

        \ \ sessions::ContentSerializedNavigationDriver::SetInstance\(\

        \ \ \ \ \ \ ChromeSerializedNavigationDriver::GetInstance\(\)\);\

        '
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  // This has to come before the first GetInstance() call. PreBrowserStart()\n  // seems like a reasonable place to put this, except on Android,\n  // OfflinePageInfoHandler::Register() below calls GetInstance().\n  // TODO(thestig): See if the Android code below can be moved to later.\n  sessions::ContentSerializedNavigationDriver::SetInstance(\n      ChromeSerializedNavigationDriver::GetInstance());\n#endif\n"
