# Android Chromium Discover implementation exclusion.
substitutions:
- description: 'Let Brave opt specific origins into first-party storage keys. Leo

    workspace origins use this so they are not partitioned when embedded as

    iframes. BraveShouldUseFirstPartyStorageKey is defined in the

    chromium_src override.

    '
  preempt_function_impl:
    function_name: ChromeContentBrowserClient::ShouldUseFirstPartyStorageKey
    return_if: BraveShouldUseFirstPartyStorageKey(origin)
    return_value: 'true'
- description: Include only the shared animation policy declarations on Android.
  regex:
    pattern: '#if BUILDFLAG(ENABLE_EXTENSIONS)

      #include "chrome/browser/accessibility/animation_policy_prefs.h"'
    replace: '#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)

      #include "chrome/browser/accessibility/animation_policy_prefs.h"

      #endif


      #if BUILDFLAG(ENABLE_EXTENSIONS)'
- description: Apply extension-controlled animation policy to Android WebPreferences.
  regex:
    pattern: "#if BUILDFLAG(ENABLE_EXTENSIONS)\n  std::string image_animation_policy ="
    replace: "#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  std::string image_animation_policy ="
- description: Use generic stream ownership on Android
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

      \#include\ "extensions/browser/mime_handler/mime_handler_stream_manager\.h"\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      \#endif\ \ //\ BUILDFLAG\(ENABLE_EXTENSIONS\)'
    replace: '#endif  // BUILDFLAG(ENABLE_EXTENSIONS)

      #if BUILDFLAG(ENABLE_EXTENSIONS_CORE)

      #include "extensions/browser/mime_handler/mime_handler_stream_manager.h"

      #endif'
- description: Compile the generic interceptor header independently of plugins
  regex:
    re_pattern: '\#include\ "chrome/browser/plugins/plugin_response_interceptor_url_loader_throttle\.h"\

      \#endif'
    replace: '#endif

      #if BUILDFLAG(ENABLE_PLUGINS) || BUILDFLAG(ENABLE_EXTENSIONS_CORE)

      #include "chrome/browser/plugins/plugin_response_interceptor_url_loader_throttle.h"

      #endif'
- description: Actually install generic MIME response interception on Android
  regex:
    re_pattern: '\#if\ BUILDFLAG\(ENABLE_PLUGINS\)\

      \ \ result\.push_back\(std::make_unique<PluginResponseInterceptorURLLoaderThrottle>'
    replace: "#if BUILDFLAG(ENABLE_PLUGINS) || BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  result.push_back(std::make_unique<PluginResponseInterceptorURLLoaderThrottle>"
- description: Advertise registered external MIME handlers to navigation
  regex:
    re_pattern: '\#if\ BUILDFLAG\(ENABLE_PLUGINS\)\

      \ \ auto\ map\ =\ PluginUtils::GetMimeTypeToExtensionIdMap\(browser_context\);'
    replace: "#if BUILDFLAG(ENABLE_PLUGINS) || BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  auto map = PluginUtils::GetMimeTypeToExtensionIdMap(browser_context);"
- description: Preserve generic frame storage partitioning and permission boundaries on Android
  count: 10
  regex:
    re_pattern: BUILDFLAG\(ENABLE_EXTENSIONS\)\ \&\&\ !BUILDFLAG\(IS_ANDROID\)
    replace: BUILDFLAG(ENABLE_EXTENSIONS_CORE)
- description: Make the existing TTS engine delegate available to Android core
  regex:
    re_pattern: '\#if\ BUILDFLAG\(ENABLE_EXTENSIONS\)\

      \#include\ "chrome/browser/speech/extension_api/tts_engine_extension_api\.h"'
    replace: '#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)

      #include "chrome/browser/speech/extension_api/tts_engine_extension_api.h"

      #endif

      #if BUILDFLAG(ENABLE_EXTENSIONS)'
- description: Connect extension voices while retaining the native Android TTS platform
  regex:
    re_pattern: 'content::TtsPlatform\*\ ChromeContentBrowserClient::GetTtsPlatform\(\)\ \{\

      \#if\ !BUILDFLAG\(IS_ANDROID\)'
    replace: 'content::TtsPlatform* ChromeContentBrowserClient::GetTtsPlatform() {

      #if BUILDFLAG(ENABLE_EXTENSIONS_CORE)'
- description: Remove the unused Android Discover service include
  regex:
    re_pattern: '\#include\ "chrome/browser/feed/feed_service_factory\.h"\

      '
    replace: ''

