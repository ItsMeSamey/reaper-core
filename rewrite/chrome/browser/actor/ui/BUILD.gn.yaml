# Keep Actor overlay implementation and resources outside Android.
substitutions:
- description: Do not instantiate the retired Actor overlay implementation on Android
  regex:
    re_pattern: 'source_set\("actor_overlay"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "actor_overlay_handler\.cc",\

      \ \ \ \ "actor_overlay_handler\.h",\

      \ \ \ \ "actor_overlay_ui\.cc",\

      \ \ \ \ "actor_overlay_ui\.h",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":mojo_bindings",\

      \ \ \ \ ":ui",\

      \ \ \ \ "//base",\

      \ \ \ \ "//chrome/browser/actor/resources:grit_grit",\

      \ \ \ \ "//chrome/browser/profiles",\

      \ \ \ \ "//chrome/browser/resources/actor_overlay:resources",\

      \ \ \ \ "//chrome/browser/ui/color:color_headers",\

      \ \ \ \ "//chrome/browser/ui/tabs:tabs_public",\

      \ \ \ \ "//chrome/browser/ui/webui",\

      \ \ \ \ "//chrome/browser/ui/webui:webui_util",\

      \ \ \ \ "//chrome/common",\

      \ \ \ \ "//components/tabs:public",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//mojo/public/cpp/bindings",\

      \ \ \ \ "//skia",\

      \ \ \ \ "//ui/color",\

      \ \ \ \ "//ui/native_theme",\

      \ \ \ \ "//ui/webui",\

      \ \ \]\

      \

      \ \ if\ \(!is_android\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/themes"\ \]\

      \ \ \}\

      \}\

      '
    replace: "if (!is_android) {\n  source_set(\"actor_overlay\") {\n    sources = [\n      \"actor_overlay_handler.cc\"\
      ,\n      \"actor_overlay_handler.h\",\n      \"actor_overlay_ui.cc\",\n      \"actor_overlay_ui.h\"\
      ,\n    ]\n    deps = [\n      \":mojo_bindings\",\n      \":ui\",\n      \"//base\",\n      \"//chrome/browser/actor/resources:grit_grit\"\
      ,\n      \"//chrome/browser/profiles\",\n      \"//chrome/browser/resources/actor_overlay:resources\"\
      ,\n      \"//chrome/browser/ui/color:color_headers\",\n      \"//chrome/browser/ui/tabs:tabs_public\"\
      ,\n      \"//chrome/browser/ui/webui\",\n      \"//chrome/browser/ui/webui:webui_util\",\n     \
      \ \"//chrome/common\",\n      \"//components/tabs:public\",\n      \"//content/public/browser\"\
      ,\n      \"//mojo/public/cpp/bindings\",\n      \"//skia\",\n      \"//ui/color\",\n      \"//ui/native_theme\"\
      ,\n      \"//ui/webui\",\n    ]\n\n    if (!is_android) {\n      deps += [ \"//chrome/browser/themes\"\
      \ ]\n    }\n  }\n}\n"
  count: 1

