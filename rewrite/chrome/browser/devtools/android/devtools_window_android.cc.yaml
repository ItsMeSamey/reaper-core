# Android DevTools profile ownership and phone entry.
substitutions:
- description: Return the real frontend ownership transfer result
  regex:
    re_pattern: static\ void\ JNI_DevToolsWindowAndroid_AttachToBrowser\(
    replace: static bool JNI_DevToolsWindowAndroid_AttachToBrowser(
- description: Safely close stale frontend ownership without using a guessed current window
  regex:
    re_pattern: '\ \ if\ \(!window\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \ \ window\->AttachToBrowser\(\

      \ \ \ \ \ \ reinterpret_cast<BrowserWindowInterface\*>\(nativeBrowserWindowPtr\)\);\

      \#endif\

      \}\

      \

      DEFINE_JNI\(DevToolsWindowAndroid\)'
    replace: "  if (!window) {\n    return false;\n  }\n  return window->AttachToBrowser(\n      reinterpret_cast<BrowserWindowInterface*>(nativeBrowserWindowPtr));\n#else\n  return false;\n#endif\n}\n\nstatic void JNI_DevToolsWindowAndroid_CloseDevTools(\n    JNIEnv* env,\n    const jni_zero::JavaRef<jobject>& java_web_contents) {\n#if BUILDFLAG(ENABLE_DEVTOOLS_FRONTEND)\n  auto* contents = content::WebContents::FromJavaWebContents(java_web_contents);\n  if (DevToolsWindow::AsDevToolsWindow(contents)) {\n    contents->Close();\n  }\n#endif\n}\n\nDEFINE_JNI(DevToolsWindowAndroid)"
- description: "0576 Android native integration boundary for chrome/browser/devtools/android/devtools_window_android.cc"
  regex:
    pattern: "#if BUILDFLAG(ENABLE_DEVTOOLS_FRONTEND)\n#include \"chrome/browser/devtools/devtools_window.h\"\n#endif  // BUILDFLAG(ENABLE_DEVTOOLS_FRONTEND)\n"
    replace: "#if BUILDFLAG(ENABLE_DEVTOOLS_FRONTEND)\n#include \"chrome/browser/devtools/devtools_window.h\"\n#include \"chrome/browser/profiles/profile.h\"\n#endif  // BUILDFLAG(ENABLE_DEVTOOLS_FRONTEND)\n"
  count: 1
