# Android DevTools profile ownership and phone entry.
substitutions:
- description: Report native transfer failure and release abandoned frontend ownership
  regex:
    re_pattern: '\ \ \ \ public\ static\ void\ attachToBrowser\(WebContents\ webContents,\ long\ nativeBrowserWindowPtr\)\ \{\

      \ \ \ \ \ \ \ \ DevToolsWindowAndroidJni\.get\(\)\.attachToBrowser\(webContents,\ nativeBrowserWindowPtr\);\

      \ \ \ \ \}'
    replace: "    public static boolean attachToBrowser(WebContents webContents, long nativeBrowserWindowPtr) {\n        return DevToolsWindowAndroidJni.get().attachToBrowser(webContents, nativeBrowserWindowPtr);\n    }\n\n    /** Closes a frontend whose activity failed before transferring ownership to its tab model. */\n    public static void closeDevTools(WebContents webContents) {\n        DevToolsWindowAndroidJni.get().closeDevTools(webContents);\n    }"
- description: Preserve JNI return and cancellation ownership contracts
  regex:
    re_pattern: \ \ \ \ \ \ \ \ void\ attachToBrowser\(WebContents\ webContents,\ long\ nativeBrowserWindowPtr\);
    replace: "        boolean attachToBrowser(WebContents webContents, long nativeBrowserWindowPtr);\n\n        void closeDevTools(WebContents webContents);"
