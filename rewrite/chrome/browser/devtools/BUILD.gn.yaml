# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/devtools/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//testing/gtest",\

      \ \ \ \ \ \ "//ui/compositor",\

      \ \ \ \ \]\

      \

      \ \ \ \ if\ \(!is_android\)\ \{\

      \ \ \ \ \ \ deps\ \+=\ \[\

      '
    replace: "      \"//testing/gtest\",\n      \"//ui/compositor\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/actor:test_support\",\n        \"//chrome/browser/actor:tools_test_support\",\n      ]\n    }\n\n    if (!is_android) {\n      deps += [\n"
- description: "Android DevTools AIDA compile-out literal 1"
  regex:
    re_pattern: "\\ \\ \\ \\ \\]\\\n\\ \\ \\ \\ deps\\ \\+=\\ \\[\\\n\\ \\ \\ \\ \\ \\ \"//chrome/browser:browser_features\","
    replace: "    ]\n    if (is_android) {\n      sources -= [\n        \"aida_client.cc\",\n        \"aida_client.h\",\n        \"aida_service_handler.cc\",\n        \"aida_service_handler.h\",\n        \"gca_service_handler.cc\",\n        \"gca_service_handler.h\",\n      ]\n    }\n    deps += [\n      \"//chrome/browser:browser_features\","
  count: 1
- description: "Android DevTools AIDA compile-out literal 2"
  regex:
    re_pattern: "\\ \\ \\ \\ \\]\\\n\\\n\\ \\ \\ \\ if\\ \\(!is_android\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ sources\\ \\+=\\ \\[\\\n\\ \\ \\ \\ \\ \\ \\ \\ \"devtools_navigation_gating_rule_manager_unittest\\.cc\","
    replace: "    ]\n\n    if (is_android) {\n      sources -= [ \"aida_client_unittest.cc\" ]\n    }\n\n    if (!is_android) {\n      sources += [\n        \"devtools_navigation_gating_rule_manager_unittest.cc\","
  count: 1
