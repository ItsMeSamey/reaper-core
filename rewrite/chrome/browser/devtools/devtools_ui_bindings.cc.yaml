\\ timeout\\ =\\ base::Seconds\\(120\\);\\\n\\ \\ auto\\ response_handler_callback\\ =\\\n\\ \\ \\ \\ \\ \\ base::BindOnce\\(\\&DevToolsUIBindings::OnAidaConversationResponse,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ base::Unretained\\(this\\),\\ std::move\\(callback\\),\\ stream_id,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ request,\\ delay,\\ resource_request,\\ base::TimeTicks::Now\\(\\)\\);\\\n\\ \\ NetworkResourceLoader::Create\\(\\\n\\ \\ \\ \\ \\ \\ stream_id,\\ this,\\ resource_request,\\\n\\ \\ \\ \\ \\ \\ AidaServiceHandler::TrafficAnnotation\\(\\),\\ std::move\\(url_loader_factory\\),\\\n\\ \\ \\ \\ \\ \\ std::move\\(response_handler_callback\\),\\ delay,\\ std::move\\(request\\),\\ timeout\\);\\\n\\}\\\n\\\nvoid\\ DevToolsUIBindings::OnAidaRequest\\(\\\n\\ \\ \\ \\ const\\ GURL\\&\\ url,\\\n\\ \\ \\ \\ const\\ std::string\\&\\ response_histogram_name,\\\n\\ \\ \\ \\ DispatchCallback\\ callback,\\\n\\ \\ \\ \\ const\\ std::string\\&\\ request,\\\n\\ \\ \\ \\ std::variant<network::ResourceRequest,\\ std::string>\\\n\\ \\ \\ \\ \\ \\ \\ \\ resource_request_or_error\\)\\ \\{\\\n\\ \\ if\\ \\(std::holds_alternative<std::string>\\(resource_request_or_error\\)\\)\\ \\{\\\n\\ \\ \\ \\ HandleAidaRequestError\\(std::move\\(callback\\),\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ std::move\\(resource_request_or_error\\)\\);\\\n\\ \\ \\ \\ return;\\\n\\ \\ \\}\\\n\\ \\ auto\\ url_loader_factory\\ =\\ profile_\\->GetDefaultStoragePartition\\(\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\->GetURLLoaderFactoryForBrowserProcess\\(\\);\\\n\\ \\ auto\\ resource_request\\ =\\ std::make_unique<network::ResourceRequest>\\(\\\n\\ \\ \\ \\ \\ \\ std::get<network::ResourceRequest>\\(resource_request_or_error\\)\\);\\\n\\ \\ resource_request\\->url\\ =\\ url;\\\n\\ \\ auto\\ simple_url_loader\\ =\\ network::SimpleURLLoader::Create\\(\\\n\\ \\ \\ \\ \\ \\ std::move\\(resource_request\\),\\ AidaServiceHandler::TrafficAnnotation\\(\\)\\);\\\n\\ \\ simple_url_loader\\->AttachStringForUpload\\(request\\);\\\n\\\n\\ \\ network::SimpleURLLoader\\*\\ simple_url_loader_ptr\\ =\\ simple_url_loader\\.get\\(\\);\\\n\\ \\ simple_url_loader_ptr\\->DownloadToString\\(\\\n\\ \\ \\ \\ \\ \\ url_loader_factory\\.get\\(\\),\\\n\\ \\ \\ \\ \\ \\ base::BindOnce\\(\\&DevToolsUIBindings::OnAidaResponse,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ base::Unretained\\(this\\),\\ response_histogram_name,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ std::move\\(callback\\),\\ std::move\\(simple_url_loader\\),\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ base::TimeTicks::Now\\(\\)\\),\\\n\\ \\ \\ \\ \\ \\ network::SimpleURLLoader::kMaxBoundedStringDownloadSize\\);\\\n\\}\\\n\\\nvoid\\ DevToolsUIBindings::OnAidaConversationResponse\\(\\\n\\ \\ \\ \\ DispatchCallback\\ callback,\\\n\\ \\ \\ \\ int\\ stream_id,\\\n\\ \\ \\ \\ const\\ std::string\\ request,\\\n\\ \\ \\ \\ base::TimeDelta\\ delay,\\\n\\ \\ \\ \\ std::variant<network::ResourceRequest,\\ std::string>\\\n\\ \\ \\ \\ \\ \\ \\ \\ resource_request_or_error,\\\n\\ \\ \\ \\ base::TimeTicks\\ start_time,\\\n\\ \\ \\ \\ const\\ base::Value\\*\\ response\\)\\ \\{\\\n\\ \\ int\\ response_code\\ =\\\n\\ \\ \\ \\ \\ \\ response\\->is_dict\\(\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\?\\ response\\->GetDict\\(\\)\\.FindInt\\(\"statusCode\"\\)\\.value_or\\(0\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ :\\ 0;\\\n\\\n\\ \\ if\\ \\(response_code\\ >=\\ 500\\ \\|\\|\\ response_code\\ ==\\ net::HTTP_TOO_MANY_REQUESTS\\)\\ \\{\\\n\\ \\ \\ \\ OnAidaConversationRequest\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ std::move\\(callback\\),\\ stream_id,\\ request,\\\n\\ \\ \\ \\ \\ \\ \\ \\ NetworkResourceLoader::GetNextExponentialBackoffDelay\\(delay\\),\\\n\\ \\ \\ \\ \\ \\ \\ \\ resource_request_or_error\\);\\\n\\ \\ \\}\\ else\\ if\\ \\(response_code\\ ==\\ net::HTTP_UNAUTHORIZED\\)\\ \\{\\\n\\ \\ \\ \\ aida_client_\\->RemoveAccessToken\\(\\);\\\n\\ \\ \\ \\ aida_client_\\->PrepareRequestOrFail\\(base::BindOnce\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\&DevToolsUIBindings::OnAidaConversationRequest,\\ base::Unretained\\(this\\),\\\n\\ \\ \\ \\ \\ \\ \\ \\ std::move\\(callback\\),\\ stream_id,\\ request,\\\n\\ \\ \\ \\ \\ \\ \\ \\ NetworkResourceLoader::GetNextExponentialBackoffDelay\\(delay\\)\\)\\);\\\n\\ \\ \\}\\ else\\ \\{\\\n\\ \\ \\ \\ base::UmaHistogramTimes\\(\"DevTools\\.AidaResponseTime\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ base::TimeTicks::Now\\(\\)\\ \\-\\ start_time\\);\\\n\\ \\ \\ \\ std::move\\(callback\\)\\.Run\\(response\\);\\\n\\ \\ \\}\\\n\\}\\\n\\\nvoid\\ DevToolsUIBindings::OnAidaResponse\\(\\\n\\ \\ \\ \\ const\\ std::string\\&\\ histogram_name,\\\n\\ \\ \\ \\ DispatchCallback\\ callback,\\\n\\ \\ \\ \\ std::unique_ptr<network::SimpleURLLoader>\\ simple_url_loader,\\\n\\ \\ \\ \\ base::TimeTicks\\ start_time,\\\n\\ \\ \\ \\ std::optional<std::string>\\ response_body\\)\\ \\{\\\n\\ \\ int\\ response_code\\ =\\ \\-1;\\\n\\ \\ if\\ \\(simple_url_loader\\->ResponseInfo\\(\\)\\ \\&\\&\\\n\\ \\ \\ \\ \\ \\ simple_url_loader\\->ResponseInfo\\(\\)\\->headers\\)\\ \\{\\\n\\ \\ \\ \\ response_code\\ =\\ simple_url_loader\\->ResponseInfo\\(\\)\\->headers\\->response_code\\(\\);\\\n\\ \\ \\}\\\n\\ \\ if\\ \\(response_code\\ !=\\ net::HTTP_OK\\)\\ \\{\\\n\\ \\ \\ \\ base::DictValue\\ error_dict;\\\n\\ \\ \\ \\ error_dict\\.Set\\(\"error\",\\ \"Got\\ error\\ response\\ from\\ AIDA\"\\);\\\n\\ \\ \\ \\ error_dict\\.Set\\(\"detail\",\\ response_body\\.value_or\\(\"\"\\)\\);\\\n\\ \\ \\ \\ auto\\ error\\ =\\ base::Value\\(std::move\\(error_dict\\)\\);\\\n\\ \\ \\ \\ std::move\\(callback\\)\\.Run\\(\\&error\\);\\\n\\ \\ \\ \\ return;\\\n\\ \\ \\}\\\n\\\n\\ \\ base::DictValue\\ response_dict;\\\n\\ \\ response_dict\\.Set\\(\"response\",\\ response_body\\.value_or\\