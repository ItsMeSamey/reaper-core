    re_pattern: "bool\\ DevToolsUIBindings::EnsureAidaClientAvailable\\(\\)\\ \\{\\\n\\ \\ if\\ \\(!is_local_frontend_\\)\\ \\{\\\n\\ \\ \\ \\ return\\ false;\\\n\\ \\ \\}\\\n\\ \\ if\\ \\(!can_access_aida_\\ \\|\\|\\ AidaClient::CanUseAida\\(profile_\\)\\.blocked\\)\\ \\{\\\n\\ \\ \\ \\ return\\ false;\\\n\\ \\ \\}\\\n\\ \\ if\\ \\(!aida_client_\\)\\ \\{\\\n\\ \\ \\ \\ aida_client_\\ =\\ std::make_unique<AidaClient>\\(profile_\\);\\\n\\ \\ \\}\\\n\\ \\ return\\ true;\\\n\\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nbool DevToolsUIBindings::EnsureAidaClientAvailable() {\n  if (!is_local_frontend_) {\n    return false;\n  }\n  if (!can_access_aida_ || AidaClient::CanUseAida(profile_).blocked) {\n    return false;\n  }\n  if (!aida_client_) {\n    aida_client_ = std::make_unique<AidaClient>(profile_);\n  }\n  return true;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
