substitutions:
- description: Exclude Android HATS provider includes while preserving desktop includes
  regex:
    pattern: '#include "chrome/browser/ui/hats/hats_service.h"

      #include "chrome/browser/ui/hats/hats_service_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/ui/hats/hats_service.h"

      #include "chrome/browser/ui/hats/hats_service_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Complete Android showSurvey once through existing false-result callback helper; keep desktop method body
  regex:
    pattern: "void DevToolsUIBindings::ShowSurvey(DispatchCallback callback,\n                                    const std::string&\
      \ trigger) {\n  HatsService* hats_service =\n      HatsServiceFactory::GetForProfile(profile_->GetOriginalProfile(),\
      \ true);\n  if (!hats_service) {\n    ShowSurveyCallback(std::move(callback), false);\n    return;\n  }\n  auto split_callback\
      \ = base::SplitOnceCallback(std::move(callback));\n  hats_service->LaunchSurvey(\n      trigger,\n      base::BindOnce(ShowSurveyCallback,\
      \ std::move(split_callback.first), true),\n      base::BindOnce(ShowSurveyCallback, std::move(split_callback.second),\n\
      \                     false));\n}\n"
    replace: "void DevToolsUIBindings::ShowSurvey(DispatchCallback callback,\n                                    const std::string&\
      \ trigger) {\n#if BUILDFLAG(IS_ANDROID)\n  ShowSurveyCallback(std::move(callback), false);\n#else\n  HatsService* hats_service\
      \ =\n      HatsServiceFactory::GetForProfile(profile_->GetOriginalProfile(), true);\n  if (!hats_service) {\n    ShowSurveyCallback(std::move(callback),\
      \ false);\n    return;\n  }\n  auto split_callback = base::SplitOnceCallback(std::move(callback));\n  hats_service->LaunchSurvey(\n\
      \      trigger,\n      base::BindOnce(ShowSurveyCallback, std::move(split_callback.first), true),\n      base::BindOnce(ShowSurveyCallback,\
      \ std::move(split_callback.second),\n                     false));\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n"
  count: 1
- description: Report false for Android canShowSurvey and retain shared response/callback tail
  regex:
    pattern: "  HatsService* hats_service =\n      HatsServiceFactory::GetForProfile(profile_->GetOriginalProfile(), true);\n\
      \  bool can_show = hats_service ? hats_service->CanShowSurvey(trigger) : false;\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  bool can_show = false;\n#else\n  HatsService* hats_service =\n      HatsServiceFactory::GetForProfile(profile_->GetOriginalProfile(),\
      \ true);\n  bool can_show = hats_service ? hats_service->CanShowSurvey(trigger) : false;\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
