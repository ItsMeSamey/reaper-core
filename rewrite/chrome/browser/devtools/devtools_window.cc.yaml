# Android DevTools profile ownership and phone entry.
substitutions:
- description: Do not attach an already transferred frontend twice
  regex:
    re_pattern: 'void\ DevToolsWindow::AttachToBrowser\(BrowserWindowInterface\*\ browser\)\ \{\

      \ \ if\ \(!owned_main_web_contents_\)\ \{\

      \ \ \ \ return;\

      \ \ \}'
    replace: "bool DevToolsWindow::AttachToBrowser(BrowserWindowInterface* browser) {\n  if (!owned_main_web_contents_) {\n    return false;\n  }"
- description: Validate exact native profile and surviving transfer before reporting attachment
  regex:
    re_pattern: '\ \ if\ \(!owned_web_contents\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \ \ auto\*\ tab_list\ =\ TabListInterface::From\(browser\);\

      \ \ if\ \(!tab_list\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \ \ tab_list\->InsertWebContentsAt\(0,\ std::move\(owned_web_contents\),\ false,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::nullopt\);'
    replace: "  if (!owned_web_contents || !browser ||\n      browser->GetProfile() != owned_web_contents->GetBrowserContext()) {\n    return false;\n  }\n  auto* tab_list = TabListInterface::From(browser);\n  if (!tab_list) {\n    return false;\n  }\n  auto weak_contents = owned_web_contents->GetWeakPtr();\n  // The call may reject and destroy its by-value unique_ptr argument. Complete\n  // that full expression before checking the frontend's continued lifetime.\n  auto* inserted = tab_list->InsertWebContentsAt(\n      0, std::move(owned_web_contents), false, std::nullopt);\n  return inserted && weak_contents && !weak_contents->IsBeingDestroyed();"
