substitutions:
  - description: Add the deps the Brave passage_embeddings overrides need.
    add_literal_to_list:
      target: passage_embeddings
      list_name: deps
      literal: brave_chromium_src_chrome_browser_passage_embeddings_deps
      import: //brave/chromium_src/chrome/browser/passage_embeddings/sources.gni
  - description: 'Android history AI430: chrome/browser/passage_embeddings/BUILD.gn step 1'
    regex:
      pattern: "    \"//services/passage_embeddings/public/mojom\",\n  ]"
      replace: "    \"//services/passage_embeddings/public/mojom\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/history_embeddings\",\n    ]\n  }"
    count: 1
  - description: Exclude the dedicated Chrome passage producer target on Android; desktop target body retained.
    regex:
      pattern: "source_set(\"passage_embeddings\") {\n  sources = [\n    \"chrome_passage_embeddings_service_controller.cc\"\
        ,\n    \"chrome_passage_embeddings_service_controller.h\",\n    \"chrome_passage_embeddings_service_launcher.cc\",\n\
        \    \"chrome_passage_embeddings_service_launcher.h\",\n    \"cpu_histogram_logger.cc\",\n    \"cpu_histogram_logger.h\"\
        ,\n    \"passage_embedder_model_observer_factory.cc\",\n    \"passage_embedder_model_observer_factory.h\",\n  ]\n\n\
        \  public_deps = [ \"//components/passage_embeddings/core\" ]\n\n  deps = [\n    \"//chrome/browser:browser_process\"\
        ,\n    \"//chrome/browser/history_embeddings\",\n    \"//chrome/browser/optimization_guide\",\n    \"//chrome/browser/profiles\"\
        ,\n    \"//components/page_content_annotations/core\",\n    \"//components/performance_manager\",\n    \"//components/permissions:permissions_common\"\
        ,\n    \"//content/public/browser\",\n    \"//services/passage_embeddings/public/mojom\",\n  ]\n  if (is_android) {\n\
        \    deps -= [\n      \"//chrome/browser/history_embeddings\",\n    ]\n  }\n  deps += brave_chromium_src_chrome_browser_passage_embeddings_deps\n\
        \  if (is_chromeos) {\n    deps += [ \"//chromeos/constants\" ]\n  }\n}\n"
      replace: "if (!is_android) {\n  source_set(\"passage_embeddings\") {\n    sources = [\n      \"chrome_passage_embeddings_service_controller.cc\"\
        ,\n      \"chrome_passage_embeddings_service_controller.h\",\n      \"chrome_passage_embeddings_service_launcher.cc\"\
        ,\n      \"chrome_passage_embeddings_service_launcher.h\",\n      \"cpu_histogram_logger.cc\",\n      \"cpu_histogram_logger.h\"\
        ,\n      \"passage_embedder_model_observer_factory.cc\",\n      \"passage_embedder_model_observer_factory.h\",\n   \
        \ ]\n\n    public_deps = [ \"//components/passage_embeddings/core\" ]\n\n    deps = [\n      \"//chrome/browser:browser_process\"\
        ,\n      \"//chrome/browser/history_embeddings\",\n      \"//chrome/browser/optimization_guide\",\n      \"//chrome/browser/profiles\"\
        ,\n      \"//components/page_content_annotations/core\",\n      \"//components/performance_manager\",\n      \"//components/permissions:permissions_common\"\
        ,\n      \"//content/public/browser\",\n      \"//services/passage_embeddings/public/mojom\",\n    ]\n    if (is_android)\
        \ {\n      deps -= [\n        \"//chrome/browser/history_embeddings\",\n      ]\n    }\n    deps += brave_chromium_src_chrome_browser_passage_embeddings_deps\n\
        \    if (is_chromeos) {\n      deps += [ \"//chromeos/constants\" ]\n    }\n  }\n}\n"
    count: 1
