substitutions:
- description: 'Reaper Android: exclude ContextualTasks test-only header dependency while preserving all
    ordinary auth/signout cases and desktop tests.'
  regex:
    re_pattern: '\#include\ "components/contextual_tasks/public/features\.h"\

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/contextual_tasks/public/features.h"

      #endif

      '
