# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/signin/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//components/sync_bookmarks",\

      \ \ \ \ "//extensions/buildflags",\

      \ \ \]\

      \

      \ \ if\ \(enable_extensions_core\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/extensions"\ \]\

      '
    replace: "    \"//components/sync_bookmarks\",\n    \"//extensions/buildflags\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//components/contextual_tasks/public:feature_list\",\n      \"//components/site_token_provider\",\n      \"//components/skills:features\",\n    ]\n  }\n\n  if (enable_extensions_core) {\n    deps += [ \"//chrome/browser/extensions\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/signin/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//components/reading_list/core:test_support",\

      \ \ \ \ \ \ "//services/tracing/public/cpp/background_tracing",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ if\ \(!is_android\)\ \{\

      '
    replace: "      \"//components/reading_list/core:test_support\",\n      \"//services/tracing/public/cpp/background_tracing\",\n    ]\n    if (is_android) {\n      deps -= [ \"//components/contextual_tasks/public:feature_list\" ]\n    }\n  }\n\n  if (!is_android) {\n"
- description: Remove only the dedicated Browser Actuator impl Android admission.
  regex:
    pattern: "    \"//components/supervised_user/core/browser\",\n    \"//components/sync_bookmarks\",\n    \"//extensions/buildflags\"\
      ,\n  ]\n  if (is_android) {\n    deps -= [\n      \"//components/contextual_tasks/public:feature_list\",\n      \"//components/site_token_provider\"\
      ,\n"
    replace: "    \"//components/supervised_user/core/browser\",\n    \"//components/sync_bookmarks\",\n    \"//extensions/buildflags\"\
      ,\n  ]\n  if (is_android) {\n    deps -= [\n      \"//components/browser_actuator/public:feature_list\",\n    ]\n  }\n\
      \  if (is_android) {\n    deps -= [\n      \"//components/contextual_tasks/public:feature_list\",\n      \"//components/site_token_provider\"\
      ,\n"
  count: 1
- description: Exclude dedicated native sign-in survey source signin_hats_util.h
  regex:
    pattern: "        \"bound_session_credentials/dice_bound_session_cookie_service_factory.h\",\n      ]\n    }\n  }\n}"
    replace: "        \"bound_session_credentials/dice_bound_session_cookie_service_factory.h\",\n      ]\n    }\n  }\n  if\
      \ (is_android) {\n    sources -= [ \"signin_hats_util.h\" ]\n  }\n}"
  count: 1
- description: Exclude dedicated native sign-in survey source signin_hats_util.cc
  regex:
    pattern: "        \"bound_session_credentials/dice_bound_session_cookie_service_factory.cc\",\n      ]\n    }\n  }\n}"
    replace: "        \"bound_session_credentials/dice_bound_session_cookie_service_factory.cc\",\n      ]\n    }\n  }\n \
      \ if (is_android) {\n    sources -= [ \"signin_hats_util.cc\" ]\n  }\n}"
  count: 1
- description: Subtract the Android-only survey header from the headers target public list that owns it, preserving the separate
    implementation source exclusion.
  regex:
    pattern: "  if (is_android) {\n    sources -= [ \"signin_hats_util.h\" ]\n  }\n"
    replace: "  if (is_android) {\n    public -= [ \"signin_hats_util.h\" ]\n  }\n"
  count: 1
