- description: "Preserve reviewed Android source projection for chrome/browser/android/oom_intervention/oom_intervention_decider.cc (operation 2)."
  regex:
    re_pattern: 'class\ DelegateImpl\ :\ public\ OomInterventionDecider::Delegate\ \{\

      \ public:\

      \ \ bool\ WasLastShutdownClean\(\)\ override\ \{\

      \ \ \ \ if\ \(!g_browser_process\ \|\|\ !g_browser_process\->metrics_service\(\)\)\

      \ \ \ \ \ \ return\ true;\

      \ \ \ \ return\ g_browser_process\->metrics_service\(\)\->WasLastShutdownClean\(\);\

      \ \ \}\

      \};\

      \

      '
    replace: "class DelegateImpl : public OomInterventionDecider::Delegate {\n public:\n  bool WasLastShutdownClean() override {\n    auto* manager = g_browser_process\n                        ? g_browser_process->GetMetricsServicesManager()\n                        : nullptr;\n    return !manager || manager->WasLastShutdownClean();\n  }\n};\n\n"
