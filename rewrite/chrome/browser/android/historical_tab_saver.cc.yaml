# Reaper Android containers lifecycle; complete raw-pin ancestry.
substitutions:
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ if\ \(web_contents_state\->state_version\(\)\ !=\ \-1\)\ \{\

      \ \ \ \ auto\ native_contents\ =\ WebContentsState::RestoreContentsFromByteBuffer\(\

      \ \ \ \ \ \ \ \ tab\->GetProfile\(\),\ web_contents_state,\ /\*initially_hidden=\*/true,\

      \ \ \ \ \ \ \ \ /\*no_renderer=\*/true\);\

      \ \ \ \ if\ \(native_contents\)\ \{\

      \ \ \ \ \ \ return\ std::make_unique<ScopedWebContents>\(std::move\(native_contents\)\);\

      \ \ \ \ \}\

      '
    replace: "  if (web_contents_state->state_version() != -1) {\n    auto native_contents = WebContentsState::RestoreContentsFromByteBuffer(\n        tab->GetProfile(), web_contents_state, /*initially_hidden=*/true,\n        /*no_renderer=*/true, tab->GetContainerId());\n    if (native_contents) {\n      return std::make_unique<ScopedWebContents>(std::move(native_contents));\n    }\n"
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ CHECK\(!tab\->IsIncognito\(\)\);\

      \

      \ \ content::WebContents::CreateParams\ params\(tab\->GetProfile\(\)\);\

      \ \ params\.initially_hidden\ =\ true;\

      \ \ params\.desired_renderer_state\ =\

      \ \ \ \ \ \ content::WebContents::CreateParams::kNoRendererProcess;\

      '
    replace: "  CHECK(!tab->IsIncognito());\n\n  content::WebContents::CreateParams params(tab->GetProfile());\n  if (!tab->GetContainerId().empty()) {\n    // No valid history exists. Do not manufacture a default historical tab.\n    return std::make_unique<ScopedWebContents>(\n        static_cast<content::WebContents*>(nullptr));\n  }\n  params.initially_hidden = true;\n  params.desired_renderer_state =\n      content::WebContents::CreateParams::kNoRendererProcess;\n"
