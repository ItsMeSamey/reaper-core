# Reaper Android containers lifecycle; complete raw-pin ancestry.
substitutions:
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '//\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      //\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "base/android/jni_android\.h"\

      \#include\ "chrome/browser/android/content/web_contents_factory_data_deleter\.h"\

      \#include\ "chrome/browser/browser_process\.h"\

      \#include\ "chrome/browser/profiles/profile\.h"\

      '
    replace: '// Use of this source code is governed by a BSD-style license that can be

      // found in the LICENSE file.


      #include <string>


      #include "base/android/jni_android.h"

      #include "brave/browser/containers/android/containers_bridge.h"

      #include "chrome/browser/android/content/web_contents_factory_data_deleter.h"

      #include "chrome/browser/browser_process.h"

      #include "chrome/browser/profiles/profile.h"

      '
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\

      using\ base::android::JavaRef;\

      using\ base::android::ScopedJavaLocalRef;\

      \

      static\ ScopedJavaLocalRef<jobject>\ JNI_WebContentsFactory_CreateWebContents\(\

      \ \ \ \ JNIEnv\*\ env,\

      '
    replace: "\nusing base::android::JavaRef;\nusing base::android::ScopedJavaLocalRef;\n\nnamespace {\n\n// Keep creation and the trusted CCT adoption check bound to the same config.\ncontent::StoragePartitionConfig ExperimentPartitionConfig(Profile* profile) {\n  return content::StoragePartitionConfig::Create(\n      profile, \"MayLaunchUrlUsesSeparateStoragePartitionDomain\", \"1\",\n      /*in_memory=*/true);\n}\n\n}  // namespace\n\nstatic bool\nJNI_WebContentsFactory_IsWebContentsForSeparateStoragePartitionExperiment(\n    JNIEnv* env,\n    Profile* profile,\n    content::WebContents* web_contents) {\n  if (!profile || profile->ShutdownStarted() || profile->IsOffTheRecord() ||\n      !web_contents ||\n      web_contents->IsBeingDestroyed() ||\n      web_contents->GetBrowserContext() != profile) {\n    return false;\n  }\n  auto* site_instance = web_contents->GetSiteInstance();\n  return site_instance && site_instance->GetBrowserContext() == profile &&\n         site_instance->GetSecurityPrincipal().GetStoragePartitionConfig() ==\n             ExperimentPartitionConfig(profile);\n}\n\nstatic ScopedJavaLocalRef<jobject> JNI_WebContentsFactory_CreateWebContents(\n    JNIEnv* env,\n"
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\}\

      \

      static\ ScopedJavaLocalRef<jobject>\

      JNI_WebContentsFactory_CreateWebContentsWithSeparateStoragePartitionForExperiment\(\

      \ \ \ \ JNIEnv\*\ env,\

      \ \ \ \ Profile\*\ profile,\

      \ \ \ \ const\ JavaRef<jthrowable>\&\ j_creator_location\)\ \{\

      \ \ auto\ partition_config\ =\ content::StoragePartitionConfig::Create\(\

      \ \ \ \ \ \ profile,\

      \ \ \ \ \ \ /\*partition_domain=\*/"MayLaunchUrlUsesSeparateStoragePartitionDomain",\

      \ \ \ \ \ \ /\*partition_name=\*/"1",\ /\*in_memory=\*/true\);\

      \

      \ \ auto\ site_instance\ =\ content::SiteInstance::CreateForFixedStoragePartition\(\

      \ \ \ \ \ \ profile,\ GURL\(\),\ partition_config\);\

      '
    replace: "}\n\nstatic ScopedJavaLocalRef<jobject>\nJNI_WebContentsFactory_CreateWebContentsForContainer(\n    JNIEnv* env,\n    Profile* profile,\n    bool initially_hidden,\n    bool initialize_renderer,\n    bool uses_platform_autofill,\n    int64_t j_target_network,\n    const std::string& container_id,\n    const JavaRef<jthrowable>& j_creator_location) {\n  auto partition = containers::android::ResolveContainerStoragePartition(\n      profile, container_id);\n  if (!partition) {\n    return {};\n  }\n  content::WebContents::CreateParams params(profile);\n  if (!container_id.empty()) {\n    params.site_instance =\n        content::SiteInstance::CreateForFixedStoragePartition(\n            profile, GURL(), *partition);\n  }\n  params.initially_hidden = initially_hidden;\n  params.initially_use_platform_autofill = uses_platform_autofill;\n  params.desired_renderer_state =\n      initialize_renderer\n          ? content::WebContents::CreateParams::kInitializeAndWarmupRendererProcess\n          : content::WebContents::CreateParams::kOkayToHaveRendererProcess;\n  params.target_network = j_target_network;\n  params.java_creator_location = j_creator_location;\n  return content::WebContents::Create(params).release()->GetJavaWebContents();\n}\n\nstatic ScopedJavaLocalRef<jobject>\nJNI_WebContentsFactory_CreateWebContentsWithSeparateStoragePartitionForExperiment(\n    JNIEnv* env,\n    Profile* profile,\n    const JavaRef<jthrowable>& j_creator_location) {\n  auto partition_config = ExperimentPartitionConfig(profile);\n\n  auto site_instance = content::SiteInstance::CreateForFixedStoragePartition(\n      profile, GURL(), partition_config);\n"
- description: Include the existing std::string JNI conversion specialization before generated JNI bindings.
  regex:
    pattern: '#include "base/android/jni_android.h"

      '
    replace: '#include "base/android/jni_android.h"

      #include "base/android/jni_string.h"

      '
  count: 1
- description: Declare existing CHECK and profile-owned container service APIs.
  regex:
    pattern: '#include "base/android/jni_string.h"

      #include "brave/browser/containers/android/containers_bridge.h"

      '
    replace: '#include "base/android/jni_string.h"

      #include "base/check.h"

      #include "brave/browser/containers/android/containers_bridge.h"

      #include "brave/browser/containers/containers_service_factory.h"

      #include "brave/components/containers/core/browser/containers_service.h"

      '
  count: 1
- description: Record used metadata only after successfully creating fresh admitted named contents.
  regex:
    pattern: "  params.java_creator_location = j_creator_location;\n  return content::WebContents::Create(params).release()->GetJavaWebContents();\n\
      }\n\nstatic ScopedJavaLocalRef<jobject>\nJNI_WebContentsFactory_CreateWebContentsWithSeparateStoragePartitionForExperiment(\n"
    replace: "  params.java_creator_location = j_creator_location;\n  auto web_contents = content::WebContents::Create(params);\n\
      \  if (!container_id.empty()) {\n    // Preserve this admitted identity's metadata before it can be removed from\n \
      \   // the selector. Android does not use the desktop navigation tracker.\n    auto* service = ContainersServiceFactory::GetForProfile(profile);\n\
      \    CHECK(service);\n    service->MarkContainerUsed(container_id);\n  }\n  return web_contents.release()->GetJavaWebContents();\n\
      }\n\nstatic ScopedJavaLocalRef<jobject>\nJNI_WebContentsFactory_CreateWebContentsWithSeparateStoragePartitionForExperiment(\n"
  count: 1
