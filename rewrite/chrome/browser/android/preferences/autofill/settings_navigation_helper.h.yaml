# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/android/preferences/autofill/settings_navigation_helper.h'
  regex:
    re_pattern: '\

      \#ifndef\ CHROME_BROWSER_ANDROID_PREFERENCES_AUTOFILL_SETTINGS_NAVIGATION_HELPER_H_\

      \#define\ CHROME_BROWSER_ANDROID_PREFERENCES_AUTOFILL_SETTINGS_NAVIGATION_HELPER_H_\

      \

      namespace\ content\ \{\

      class\ WebContents;\

      '
    replace: '

      #ifndef CHROME_BROWSER_ANDROID_PREFERENCES_AUTOFILL_SETTINGS_NAVIGATION_HELPER_H_

      #define CHROME_BROWSER_ANDROID_PREFERENCES_AUTOFILL_SETTINGS_NAVIGATION_HELPER_H_


      #include "build/build_config.h"


      namespace content {

      class WebContents;

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/android/preferences/autofill/settings_navigation_helper.h'
  regex:
    re_pattern: 'void\ ShowAutofillCreditCardSettings\(content::WebContents\*\ web_contents\);\

      \

      //\ Opens\ the\ autofill\ settings\ page\ for\ identity\ docs\.\

      void\ ShowAutofillIdentityDocsSettings\(content::WebContents\*\ web_contents\);\

      \

      //\ Opens\ the\ autofill\ settings\ page\ for\ travel\.\

      void\ ShowAutofillTravelSettings\(content::WebContents\*\ web_contents\);\

      \

      //\ Opens\ the\ autofill\ settings\ page\ for\ shopping\.\

      void\ ShowAutofillShoppingSettings\(content::WebContents\*\ web_contents\);\

      \

      //\ Opens\ the\ autofill\ settings\ page\ for\ personal\ context\.\

      void\ ShowAutofillPersonalContextSettings\(content::WebContents\*\ web_contents,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AutofillOptionsReferrer\ referrer\);\

      \

      //\ Open\ the\ autofill\ settings\ page\.\

      void\ ShowAutofillSettingsPage\(content::WebContents\*\ web_contents\);\

      '
    replace: "void ShowAutofillCreditCardSettings(content::WebContents* web_contents);\n\n// Opens the autofill settings page for identity docs.\n#if !BUILDFLAG(IS_ANDROID)\nvoid ShowAutofillIdentityDocsSettings(content::WebContents* web_contents);\n#endif\n\n// Opens the autofill settings page for travel.\n#if !BUILDFLAG(IS_ANDROID)\nvoid ShowAutofillTravelSettings(content::WebContents* web_contents);\n#endif\n\n// Opens the autofill settings page for shopping.\n#if !BUILDFLAG(IS_ANDROID)\nvoid ShowAutofillShoppingSettings(content::WebContents* web_contents);\n#endif\n\n// Opens the autofill settings page for personal context.\n#if !BUILDFLAG(IS_ANDROID)\nvoid ShowAutofillPersonalContextSettings(content::WebContents* web_contents,\n                                         AutofillOptionsReferrer referrer);\n#endif\n\n// Open the autofill settings page.\nvoid ShowAutofillSettingsPage(content::WebContents* web_contents);\n"
