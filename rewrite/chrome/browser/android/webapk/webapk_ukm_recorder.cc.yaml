substitutions:
  - description: "Add compile-time Android platform guard"
    regex:
      pattern: "\nnamespace "
      replace: "\n#include \"build/build_config.h\"\n\nnamespace "
    count: 1
  - description: "Android no-op void WebApkUkmRecorder::RecordInstall("
    regex:
      pattern: "{\n  if (!manifest_id.is_valid()) {\n    return;\n  }\n\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n\n  // All installs through this method are browser-installs (ie, they should all\n  // use the \"browser\" distributor).\n  ukm::builders::WebAPK_Install(source_id)\n      .SetDistributor(static_cast<int64_t>(webapps::WebApkDistributor::BROWSER))\n      .SetInstall(1)\n      .SetInstallSource(static_cast<int64_t>(install_source))\n      .SetDisplayMode(static_cast<int64_t>(display))\n      .Record(ukm::UkmRecorder::Get());\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (!manifest_id.is_valid()) {\n    return;\n  }\n\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n\n  // All installs through this method are browser-installs (ie, they should all\n  // use the \"browser\" distributor).\n  ukm::builders::WebAPK_Install(source_id)\n      .SetDistributor(static_cast<int64_t>(webapps::WebApkDistributor::BROWSER))\n      .SetInstall(1)\n      .SetInstallSource(static_cast<int64_t>(install_source))\n      .SetDisplayMode(static_cast<int64_t>(display))\n      .Record(ukm::UkmRecorder::Get());\n#endif\n}"
    count: 1
  - description: "Android no-op void WebApkUkmRecorder::RecordSessionDuration("
    regex:
      pattern: "{\n  if (!manifest_id.is_valid()) {\n    return;\n  }\n\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n  ukm::builders::WebAPK_SessionEnd(source_id)\n      .SetDistributor(distributor)\n      .SetAppVersion(version_code)\n      .SetSessionDuration(ukm::GetExponentialBucketMinForUserTiming(duration))\n      .Record(ukm::UkmRecorder::Get());\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (!manifest_id.is_valid()) {\n    return;\n  }\n\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n  ukm::builders::WebAPK_SessionEnd(source_id)\n      .SetDistributor(distributor)\n      .SetAppVersion(version_code)\n      .SetSessionDuration(ukm::GetExponentialBucketMinForUserTiming(duration))\n      .Record(ukm::UkmRecorder::Get());\n#endif\n}"
    count: 1
  - description: "Android no-op void WebApkUkmRecorder::RecordVisit("
    regex:
      pattern: "{\n  if (!manifest_id.is_valid()) {\n    return;\n  }\n\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n  ukm::builders::WebAPK_Visit(source_id)\n      .SetDistributor(distributor)\n      .SetAppVersion(version_code)\n      .SetLaunchSource(source)\n      .SetLaunch(1)\n      .Record(ukm::UkmRecorder::Get());\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (!manifest_id.is_valid()) {\n    return;\n  }\n\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n  ukm::builders::WebAPK_Visit(source_id)\n      .SetDistributor(distributor)\n      .SetAppVersion(version_code)\n      .SetLaunchSource(source)\n      .SetLaunch(1)\n      .Record(ukm::UkmRecorder::Get());\n#endif\n}"
    count: 1
  - description: "Android no-op void WebApkUkmRecorder::RecordUninstall("
    regex:
      pattern: "{\n  // UKM metric |launch_count| parameter is enum. '2' indicates >= 2 launches.\n  launch_count = std::clamp<int64_t>(launch_count, 0, 2);\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n  ukm::builders::WebAPK_Uninstall(source_id)\n      .SetDistributor(distributor)\n      .SetAppVersion(version_code)\n      .SetLifetimeLaunches(launch_count)\n      .SetInstalledDuration(\n          ukm::GetExponentialBucketMinForUserTiming(installed_duration_ms))\n      .SetUninstall(1)\n      .Record(ukm::UkmRecorder::Get());\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  // UKM metric |launch_count| parameter is enum. '2' indicates >= 2 launches.\n  launch_count = std::clamp<int64_t>(launch_count, 0, 2);\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n  ukm::builders::WebAPK_Uninstall(source_id)\n      .SetDistributor(distributor)\n      .SetAppVersion(version_code)\n      .SetLifetimeLaunches(launch_count)\n      .SetInstalledDuration(\n          ukm::GetExponentialBucketMinForUserTiming(installed_duration_ms))\n      .SetUninstall(1)\n      .Record(ukm::UkmRecorder::Get());\n#endif\n}"
    count: 1
  - description: "Android no-op void WebApkUkmRecorder::RecordWebApkableVisit("
    regex:
      pattern: "{\n  if (!manifest_id.is_valid()) {\n    return;\n  }\n\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n  ukm::builders::PWA_Visit(source_id).SetWebAPKableSiteVisit(1).Record(\n      ukm::UkmRecorder::Get());\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  if (!manifest_id.is_valid()) {\n    return;\n  }\n\n  ukm::SourceId source_id =\n      ukm::AppSourceUrlRecorder::GetSourceIdForPWA(manifest_id);\n  ukm::builders::PWA_Visit(source_id).SetWebAPKableSiteVisit(1).Record(\n      ukm::UkmRecorder::Get());\n#endif\n}"
    count: 1
  - description: "Android no-op static void JNI_WebApkUkmRecorder_RecordSessionDuration("
    regex:
      pattern: "{\n  WebApkUkmRecorder::RecordSessionDuration(GURL(manifest_id), distributor,\n                                           version_code, duration);\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  WebApkUkmRecorder::RecordSessionDuration(GURL(manifest_id), distributor,\n                                           version_code, duration);\n#endif\n}"
    count: 1
  - description: "Android no-op static void JNI_WebApkUkmRecorder_RecordVisit("
    regex:
      pattern: "{\n  WebApkUkmRecorder::RecordVisit(GURL(manifest_id), distributor, version_code,\n                                 source);\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  WebApkUkmRecorder::RecordVisit(GURL(manifest_id), distributor, version_code,\n                                 source);\n#endif\n}"
    count: 1
  - description: "Android no-op static void JNI_WebApkUkmRecorder_RecordUninstall("
    regex:
      pattern: "{\n  WebApkUkmRecorder::RecordUninstall(GURL(manifest_id), distributor,\n                                     version_code, launch_count,\n                                     installed_duration_ms);\n}"
      replace: "{\n#if BUILDFLAG(IS_ANDROID)\n#else\n  WebApkUkmRecorder::RecordUninstall(GURL(manifest_id), distributor,\n                                     version_code, launch_count,\n                                     installed_duration_ms);\n#endif\n}"
    count: 1
