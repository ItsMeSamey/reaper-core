- description: Cover native split history values and order across unsplit, complete-pair restoration and orphan filtering
  count: 1
  regex:
    re_pattern: //\ Test\ WebContentsByteBuffer\ non\-empty\ object\ creation\.
    replace: "IN_PROC_BROWSER_TEST_F(HistoricalTabSaverBrowserTest,\n                       SplitHistoryKeepsOrderAndReconstructsAfterGrouping) {\n  Navigate();\n  JNIEnv* env = base::android::AttachCurrentThread();\n  TabAndroid* leading = TabAndroid::FromWebContents(GetActiveWebContents());\n  ASSERT_TRUE(leading);\n  TabModel* model = TabModelList::FindTabModelWithWindowSessionId(leading->GetWindowId());\n  ASSERT_TRUE(model);\n  const GURL url = embedded_test_server()->GetURL(\"/android/google.html\");\n  auto* opened = model->OpenTab(url, model->GetTabCount(), false);\n  ASSERT_TRUE(opened);\n  TabAndroid* trailing = TabAndroid::FromWebContents(opened->GetContents());\n  ASSERT_TRUE(trailing);\n  ASSERT_TRUE(content::NavigateToURL(trailing->web_contents(), url));\n  const auto id = split_tabs::SplitTabId::GenerateNew();\n  ASSERT_TRUE(Java_TabModelJniBridge_restoreSplit(\n      env, model->GetJavaObject(), id.token(),\n      std::vector<int>{leading->GetAndroidId(), trailing->GetAndroidId()}, 1, 0.37));\n  ASSERT_EQ(leading->GetSplit(), id);\n  ASSERT_EQ(trailing->GetSplit(), id);\n\n  std::vector<WebContentsStateByteBuffer> states;\n  states.emplace_back(WebContentsState::GetContentsStateAsByteBuffer(env, trailing->web_contents()), 2);\n  states.emplace_back(WebContentsState::GetContentsStateAsByteBuffer(env, leading->web_contents()), 2);\n  AndroidLiveTabContextCloseWrapper closing(model, {trailing, leading}, {}, {}, {}, std::move(states));\n  auto* first = closing.GetLiveTabAt(0);\n  auto* second = closing.GetLiveTabAt(1);\n  ASSERT_NE(first, second);\n  EXPECT_EQ(&static_cast<sessions::ContentLiveTab*>(first)->GetWebContents(), leading->web_contents());\n  EXPECT_EQ(&static_cast<sessions::ContentLiveTab*>(second)->GetWebContents(), trailing->web_contents());\n  EXPECT_EQ(closing.GetLiveTabAt(0), first);\n  model->Unsplit(id);\n  EXPECT_FALSE(leading->GetSplit());\n  EXPECT_EQ(closing.GetSplitForTab(0), id);\n  EXPECT_EQ(closing.GetSplitForTab(1), id);\n  ASSERT_TRUE(closing.GetVisualDataForSplit(id));\n  EXPECT_EQ(closing.GetVisualDataForSplit(id)->split_layout(), split_tabs::SplitTabLayout::kStacked);\n  EXPECT_DOUBLE_EQ(closing.GetVisualDataForSplit(id)->split_ratio(), 0.37);\n\n  auto* service = TabRestoreServiceFactory::GetForProfile(GetProfile());\n  ASSERT_TRUE(service);\n  service->ClearEntries();\n  service->BrowserClosing(&closing);\n  service->BrowserClosed(&closing);\n  ASSERT_EQ(service->entries().size(), 1u);\n  ASSERT_EQ(service->entries().front()->type, sessions::tab_restore::Type::WINDOW);\n  const auto& saved = static_cast<const sessions::tab_restore::Window&>(*service->entries().front());\n  ASSERT_EQ(saved.tabs.size(), 2u);\n  EXPECT_EQ(saved.tabs[0]->split_id, id);\n  EXPECT_EQ(saved.tabs[1]->split_id, id);\n  ASSERT_TRUE(saved.tabs[0]->split_visual_data);\n  EXPECT_DOUBLE_EQ(saved.tabs[0]->split_visual_data->split_ratio(), 0.37);\n\n  AndroidLiveTabContextRestoreWrapper restoring(model);\n  restoring.ReconstructSplit(first, second, id, *closing.GetVisualDataForSplit(id));\n  EXPECT_FALSE(leading->GetSplit());\n  // The Java group restore happens at this boundary in the real bridge.\n  restoring.RestoreSplits();\n  EXPECT_EQ(leading->GetSplit(), id);\n  EXPECT_EQ(trailing->GetSplit(), id);\n  restoring.RestoreSplits();\n  EXPECT_EQ(leading->GetSplit(), id);\n\n  std::vector<WebContentsStateByteBuffer> orphan_state;\n  orphan_state.emplace_back(WebContentsState::GetContentsStateAsByteBuffer(env, leading->web_contents()), 2);\n  AndroidLiveTabContextCloseWrapper orphan(model, {leading}, {}, {}, {}, std::move(orphan_state));\n  EXPECT_FALSE(orphan.GetSplitForTab(0));\n  model->Unsplit(id);\n  service->ClearEntries();\n}\n\n// Test WebContentsByteBuffer non-empty object creation."
