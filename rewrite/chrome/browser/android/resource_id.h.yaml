# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android optional History/Search icon resource removal: chrome/browser/android/resource_id.h'
  regex:
    re_pattern: '//\ A\ generic\ help\ icon\.\

      DECLARE_RESOURCE_ID\(IDR_ANDROID_IC_HELP_24DP,\ R\.drawable\.ic_help_24dp\)\

      \

      DECLARE_RESOURCE_ID\(IDR_ANDROID_IC_SPARK_24DP,\ R\.drawable\.ic_spark_24dp\)\

      DECLARE_RESOURCE_ID\(IDR_ANDROID_IC_SPARK_BLUE,\ R\.drawable\.ic_spark_blue_24dp\)\

      DECLARE_RESOURCE_ID\(IDR_ANDROID_IC_GOOGLE_SERVICES,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.drawable\.ic_google_services_24dp\)\

      '
    replace: "// A generic help icon.\nDECLARE_RESOURCE_ID(IDR_ANDROID_IC_HELP_24DP, R.drawable.ic_help_24dp)\n\nDECLARE_RESOURCE_ID(IDR_ANDROID_IC_SPARK_BLUE, R.drawable.ic_spark_blue_24dp)\nDECLARE_RESOURCE_ID(IDR_ANDROID_IC_GOOGLE_SERVICES,\n                    R.drawable.ic_google_services_24dp)\n"
