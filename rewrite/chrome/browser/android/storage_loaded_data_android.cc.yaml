# Reaper Android containers lifecycle; complete raw-pin ancestry.
substitutions:
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ tab_state\.user_agent\(\),\

      \ \ \ \ \ \ \ \ \ \ tab_state\.last_navigation_committed_timestamp_millis\(\),\

      \ \ \ \ \ \ \ \ \ \ j_tab_group_id,\ tab_state\.tab_has_sensitive_content\(\),\

      \ \ \ \ \ \ \ \ \ \ tab_state\.is_pinned\(\),\ tab_state\.url\(\)\);\

      \

      \ \ return\ Java_StorageLoadedData_createLoadedTabState\(env,\ tab_state\.tab_id\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ j_tab_state\);\

      '
    replace: "          tab_state.user_agent(),\n          tab_state.last_navigation_committed_timestamp_millis(),\n          j_tab_group_id, tab_state.tab_has_sensitive_content(),\n          tab_state.is_pinned(), tab_state.url(), tab_state.container_id());\n\n  return Java_StorageLoadedData_createLoadedTabState(env, tab_state.tab_id(),\n                                                     j_tab_state);\n"
