# Observe Android lazy tab materialization without loading tabs at startup.
substitutions:
  - description: "Observe lazy TabAndroid destruction in the stock unit test (literal 1)"
    regex:
      re_pattern: "\\#include\\ \"base/android/jni_android\\.h\"\\\n\\#include\\ \"base/android/scoped_java_ref\\.h\"\\\n\\#include\\ \"base/memory/raw_ptr\\.h\"\\\n\\#include\\ \"base/test/scoped_feature_list\\.h\"\\\n\\#include\\ \"base/test/task_environment\\.h\"\\\n\\#include\\ \"cc/slim/layer\\.h\"\\\n"
      replace: "#include \"base/android/jni_android.h\"\n#include \"base/android/scoped_java_ref.h\"\n#include \"base/memory/raw_ptr.h\"\n#include \"base/scoped_observation.h\"\n#include \"base/test/scoped_feature_list.h\"\n#include \"base/test/task_environment.h\"\n#include \"cc/slim/layer.h\"\n"
  - description: "Observe lazy TabAndroid destruction in the stock unit test (literal 2)"
    regex:
      re_pattern: "\\}\\\n\\\nDEFINE_JNI\\(TabAndroidTestHelper\\)\\\n"
      replace: "}\n\nDEFINE_JNI(TabAndroidTestHelper)\n\n\n// Destruction may happen after a lazy tab has detached from its model, before\n// it ever initializes WebContents. Observers must not outlive the tab.\nTEST_F(TabAndroidTest, LazyTabDestructionAllowsObserverToStopObserving) {\n  class Observer final : public TabAndroid::Observer {\n   public:\n    void OnInitWebContents(TabAndroid*) override { ADD_FAILURE(); }\n    void OnTabAndroidDestroyed(TabAndroid* tab) override {\n      EXPECT_EQ(nullptr, tab->GetContents());\n      ++destroyed;\n      observation.Reset();\n    }\n    int destroyed = 0;\n    base::ScopedObservation<TabAndroid, TabAndroid::Observer> observation{this};\n  } observer;\n  auto lazy = TabAndroid::CreateForTesting(profile_.get(), kTabId + 1, nullptr);\n  observer.observation.Observe(lazy.get());\n  lazy.reset();\n  EXPECT_EQ(1, observer.destroyed);\n  EXPECT_FALSE(observer.observation.IsObserving());\n}\n"
  - description: "Preserve native lazy-tab session identity and API behavior (literal 1)"
    regex:
      re_pattern: "\\#include\\ \"chrome/browser/android/tab_group_android\\.h\"\\\n\\#include\\ \"chrome/browser/android/tab_web_contents_delegate_android\\.h\"\\\n\\#include\\ \"chrome/browser/profiles/profile\\.h\"\\\n\\#include\\ \"chrome/browser/ui/android/tab_model/tab_model\\.h\"\\\n\\#include\\ \"chrome/browser/ui/webui/webui_embedding_context\\.h\"\\\n\\#include\\ \"chrome/common/chrome_features\\.h\"\\\n"
      replace: "#include \"chrome/browser/android/tab_group_android.h\"\n#include \"chrome/browser/android/tab_web_contents_delegate_android.h\"\n#include \"chrome/browser/profiles/profile.h\"\n#include \"chrome/browser/sessions/session_tab_helper_factory.h\"\n#include \"components/sessions/content/session_tab_helper.h\"\n#include \"components/tabs/public/tab_handle_factory.h\"\n#include \"chrome/browser/ui/android/tab_model/tab_model.h\"\n#include \"chrome/browser/ui/webui/webui_embedding_context.h\"\n#include \"chrome/common/chrome_features.h\"\n"
  - description: "Preserve native lazy-tab session identity and API behavior (literal 2)"
    regex:
      re_pattern: "\\ \\ EXPECT_EQ\\(1,\\ observer\\.destroyed\\);\\\n\\ \\ EXPECT_FALSE\\(observer\\.observation\\.IsObserving\\(\\)\\);\\\n\\}\\\n"
      replace: "  EXPECT_EQ(1, observer.destroyed);\n  EXPECT_FALSE(observer.observation.IsObserving());\n}\n\n// Native IDs exist before contents, and the first immutable helper consumes that\n// exact identity. These use the real Chrome factory and native tab lookup.\nTEST_F(TabAndroidTest, ReservesGenuineIdentityBeforeSessionHelper) {\n  auto contents = content::WebContents::Create(\n      content::WebContents::CreateParams(profile_.get()));\n  auto tab = TabAndroid::CreateForTesting(profile_.get(), kTabId + 1,\n                                         std::move(contents));\n  auto& factory = tabs::SessionMappedTabHandleFactory::GetInstance();\n  const auto id = factory.GetSessionIdForHandle(tab->GetHandle().raw_value());\n  ASSERT_TRUE(id);\n  EXPECT_TRUE(SessionID::IsValidValue(*id));\n  CreateSessionServiceTabHelper(tab->GetContents());\n  EXPECT_EQ(*id, sessions::SessionTabHelper::IdForTab(tab->GetContents()).id());\n  CreateSessionServiceTabHelper(tab->GetContents());\n  EXPECT_EQ(id, factory.GetSessionIdForHandle(tab->GetHandle().raw_value()));\n}\n\nTEST_F(TabAndroidTest, ExistingEagerHelperIdentityWinsAndSurvivesReparent) {\n  auto contents = content::WebContents::Create(\n      content::WebContents::CreateParams(profile_.get()));\n  const SessionID actual = SessionID::NewUnique();\n  sessions::SessionTabHelper::CreateForWebContents(\n      contents.get(), sessions::SessionTabHelper::DelegateLookup(), actual);\n  auto tab = TabAndroid::CreateForTesting(profile_.get(), kTabId + 1,\n                                         std::move(contents));\n  auto& factory = tabs::SessionMappedTabHandleFactory::GetInstance();\n  EXPECT_EQ(actual.id(),\n            factory.GetSessionIdForHandle(tab->GetHandle().raw_value()));\n  CreateSessionServiceTabHelper(tab->GetContents());\n  EXPECT_EQ(actual, sessions::SessionTabHelper::IdForTab(tab->GetContents()));\n  auto released = tab->ReleaseWebContentsForTesting();\n  EXPECT_FALSE(factory.GetSessionIdForHandle(tab->GetHandle().raw_value()));\n  EXPECT_EQ(actual, sessions::SessionTabHelper::IdForTab(released.get()));\n  auto adopted = TabAndroid::CreateForTesting(profile_.get(), kTabId + 2,\n                                             std::move(released));\n  EXPECT_EQ(actual.id(),\n            factory.GetSessionIdForHandle(adopted->GetHandle().raw_value()));\n  const auto handle = adopted->GetHandle();\n  adopted.reset();\n  EXPECT_FALSE(factory.GetSessionIdForHandle(handle.raw_value()));\n  EXPECT_EQ(0, factory.GetHandleForSessionId(actual.id()));\n}\n\nTEST_F(TabAndroidTest, DestroyContentsRetainsReservedIdentity) {\n  auto contents = content::WebContents::Create(\n      content::WebContents::CreateParams(profile_.get()));\n  auto tab = TabAndroid::CreateForTesting(profile_.get(), kTabId + 1,\n                                         std::move(contents));\n  CreateSessionServiceTabHelper(tab->GetContents());\n  auto& factory = tabs::SessionMappedTabHandleFactory::GetInstance();\n  const auto id = factory.GetSessionIdForHandle(tab->GetHandle().raw_value());\n  tab->DestroyWebContents();\n  EXPECT_EQ(nullptr, tab->GetContents());\n  EXPECT_EQ(id, factory.GetSessionIdForHandle(tab->GetHandle().raw_value()));\n}\n"

  - description: "Keep Android tab tests independent of removed actor implementation (literal 1)"
    regex:
      pattern: "#include \"base/test/task_environment.h\"\n"
      replace: "#include \"base/test/task_environment.h\"\n#include \"build/build_config.h\"\n"
    count: 1
  - description: "Keep Android tab tests independent of removed actor implementation (literal 2)"
    regex:
      pattern: "#include \"chrome/browser/actor/actor_keyed_service.h\"\n#include \"chrome/browser/actor/actor_task.h\"\n#include \"chrome/browser/actor/actor_test_util.h\"\n#include \"chrome/browser/actor/actor_util.h\"\n#include \"chrome/browser/actor/ui/test_support/mock_actor_ui_tab_controller.h\"\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"chrome/browser/actor/actor_keyed_service.h\"\n#include \"chrome/browser/actor/actor_task.h\"\n#include \"chrome/browser/actor/actor_test_util.h\"\n#include \"chrome/browser/actor/actor_util.h\"\n#include \"chrome/browser/actor/ui/test_support/mock_actor_ui_tab_controller.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Keep Android tab tests independent of removed actor implementation (literal 3)"
    regex:
      pattern: "#include \"components/actor/core/actor_features.h\"\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/actor/core/actor_features.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Keep Android tab tests independent of removed actor implementation (literal 4)"
    regex:
      pattern: "class GlicTabAndroidTest : public TabAndroidTest {\n public:\n  GlicTabAndroidTest() {\n    scoped_feature_list_.InitWithFeatures(\n        /*enabled_features=*/{features::kGlic, features::kGlicActor},\n        /*disabled_features=*/{});\n  }\n\n private:\n  base::test::ScopedFeatureList scoped_feature_list_;\n};\n\nTEST_F(GlicTabAndroidTest, IsWebContentsCreationOverridden_GlicSandboxCheck) {\n  // Create a WebContents.\n  std::unique_ptr<content::WebContents> web_contents =\n      content::WebContents::Create(\n          content::WebContents::CreateParams(profile_.get()));\n  content::WebContents* raw_web_contents = web_contents.get();\n\n  // Create TabAndroid for testing.\n  std::unique_ptr<TabAndroid> tab = TabAndroid::CreateForTesting(\n      profile_.get(), kTabId + 1, std::move(web_contents));\n\n  // Register the tab lookup helper.\n  tabs::TabLookupFromWebContents::CreateForWebContents(raw_web_contents,\n                                                       tab.get());\n\n  // Create the delegate with a null Java reference.\n  auto delegate = std::make_unique<android::TabWebContentsDelegateAndroid>(\n      env_, base::android::ScopedJavaLocalRef<jobject>());\n\n  // Set the delegate on the web contents.\n  raw_web_contents->SetDelegate(delegate.get());\n\n  content::RenderFrameHost* main_frame =\n      raw_web_contents->GetPrimaryMainFrame();\n\n  // 1. Without Glic Actor active, it should return false.\n  EXPECT_FALSE(delegate->IsWebContentsCreationOverridden(\n      main_frame, nullptr, content::mojom::WindowContainerType::NORMAL, GURL(),\n      \"\", GURL()));\n\n  // 2. Start Glic Actor task and attach the tab to it.\n  actor::ActorKeyedService* service =\n      actor::ActorKeyedService::Get(profile_.get());\n  ASSERT_NE(nullptr, service);\n  actor::TaskId task_id = service->CreateTask(\n      actor::TestTaskSourceInfo(), actor::NoEnterprisePolicyChecker());\n  actor::ActorTask* task = service->GetTask(task_id);\n  ASSERT_NE(nullptr, task);\n\n  // Add the tab to the task.\n  actor::ui::MockActorUiTabController mock_controller(*tab);\n  actor::AddTabToTask(*tab, *task);\n\n  // Ensure HasActorTaskPreventingNewWebContents returns true.\n  ASSERT_TRUE(actor::HasActorTaskPreventingNewWebContents(main_frame));\n\n  // 3. Under Glic Actor control, if the frame is NOT sandboxed, it should\n  // override creation.\n  EXPECT_TRUE(delegate->IsWebContentsCreationOverridden(\n      main_frame, nullptr, content::mojom::WindowContainerType::NORMAL, GURL(),\n      \"\", GURL()));\n\n  // 4. Under Glic Actor control, if the frame IS sandboxed with kTopNavigation,\n  // it should NOT override creation.\n  auto simulator = content::NavigationSimulator::CreateBrowserInitiated(\n      GURL(\"https://sandboxed.example.com\"), raw_web_contents);\n  auto headers =\n      base::MakeRefCounted<net::HttpResponseHeaders>(\"HTTP/1.1 200 OK\");\n  headers->AddHeader(\"Content-Security-Policy\", \"sandbox allow-popups\");\n  simulator->SetResponseHeaders(headers);\n  simulator->Commit();\n\n  content::RenderFrameHost* sandboxed_frame =\n      raw_web_contents->GetPrimaryMainFrame();\n  ASSERT_TRUE(sandboxed_frame->IsSandboxed(\n      network::mojom::WebSandboxFlags::kTopNavigation));\n\n  EXPECT_FALSE(delegate->IsWebContentsCreationOverridden(\n      sandboxed_frame, nullptr, content::mojom::WindowContainerType::NORMAL,\n      GURL(), \"\", GURL()));\n}\n\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nclass GlicTabAndroidTest : public TabAndroidTest {\n public:\n  GlicTabAndroidTest() {\n    scoped_feature_list_.InitWithFeatures(\n        /*enabled_features=*/{features::kGlic, features::kGlicActor},\n        /*disabled_features=*/{});\n  }\n\n private:\n  base::test::ScopedFeatureList scoped_feature_list_;\n};\n\nTEST_F(GlicTabAndroidTest, IsWebContentsCreationOverridden_GlicSandboxCheck) {\n  // Create a WebContents.\n  std::unique_ptr<content::WebContents> web_contents =\n      content::WebContents::Create(\n          content::WebContents::CreateParams(profile_.get()));\n  content::WebContents* raw_web_contents = web_contents.get();\n\n  // Create TabAndroid for testing.\n  std::unique_ptr<TabAndroid> tab = TabAndroid::CreateForTesting(\n      profile_.get(), kTabId + 1, std::move(web_contents));\n\n  // Register the tab lookup helper.\n  tabs::TabLookupFromWebContents::CreateForWebContents(raw_web_contents,\n                                                       tab.get());\n\n  // Create the delegate with a null Java reference.\n  auto delegate = std::make_unique<android::TabWebContentsDelegateAndroid>(\n      env_, base::android::ScopedJavaLocalRef<jobject>());\n\n  // Set the delegate on the web contents.\n  raw_web_contents->SetDelegate(delegate.get());\n\n  content::RenderFrameHost* main_frame =\n      raw_web_contents->GetPrimaryMainFrame();\n\n  // 1. Without Glic Actor active, it should return false.\n  EXPECT_FALSE(delegate->IsWebContentsCreationOverridden(\n      main_frame, nullptr, content::mojom::WindowContainerType::NORMAL, GURL(),\n      \"\", GURL()));\n\n  // 2. Start Glic Actor task and attach the tab to it.\n  actor::ActorKeyedService* service =\n      actor::ActorKeyedService::Get(profile_.get());\n  ASSERT_NE(nullptr, service);\n  actor::TaskId task_id = service->CreateTask(\n      actor::TestTaskSourceInfo(), actor::NoEnterprisePolicyChecker());\n  actor::ActorTask* task = service->GetTask(task_id);\n  ASSERT_NE(nullptr, task);\n\n  // Add the tab to the task.\n  actor::ui::MockActorUiTabController mock_controller(*tab);\n  actor::AddTabToTask(*tab, *task);\n\n  // Ensure HasActorTaskPreventingNewWebContents returns true.\n  ASSERT_TRUE(actor::HasActorTaskPreventingNewWebContents(main_frame));\n\n  // 3. Under Glic Actor control, if the frame is NOT sandboxed, it should\n  // override creation.\n  EXPECT_TRUE(delegate->IsWebContentsCreationOverridden(\n      main_frame, nullptr, content::mojom::WindowContainerType::NORMAL, GURL(),\n      \"\", GURL()));\n\n  // 4. Under Glic Actor control, if the frame IS sandboxed with kTopNavigation,\n  // it should NOT override creation.\n  auto simulator = content::NavigationSimulator::CreateBrowserInitiated(\n      GURL(\"https://sandboxed.example.com\"), raw_web_contents);\n  auto headers =\n      base::MakeRefCounted<net::HttpResponseHeaders>(\"HTTP/1.1 200 OK\");\n  headers->AddHeader(\"Content-Security-Policy\", \"sandbox allow-popups\");\n  simulator->SetResponseHeaders(headers);\n  simulator->Commit();\n\n  content::RenderFrameHost* sandboxed_frame =\n      raw_web_contents->GetPrimaryMainFrame();\n  ASSERT_TRUE(sandboxed_frame->IsSandboxed(\n      network::mojom::WebSandboxFlags::kTopNavigation));\n\n  EXPECT_FALSE(delegate->IsWebContentsCreationOverridden(\n      sandboxed_frame, nullptr, content::mojom::WindowContainerType::NORMAL,\n      GURL(), \"\", GURL()));\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n"
    count: 1
