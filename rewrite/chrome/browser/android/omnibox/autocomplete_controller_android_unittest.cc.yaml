substitutions:
  - description: "Remove unused ToolMode protocol include."
    count: 1
    regex:
      pattern: "#include \"third_party/omnibox_proto/tool_mode.pb.h\"\n"
      replace: ""
  - description: "Match the five-argument NTP focus API."
    count: 1
    regex:
      pattern: "  controller()->OnOmniboxFocused(nullptr, u\"\", url, page_classification,\n                                 omnibox::TOOL_MODE_UNSPECIFIED, u\"title\");\n"
      replace: "  controller()->OnOmniboxFocused(nullptr, u\"\", url, page_classification,\n                                 u\"title\");\n"
  - description: "Match the five-argument ordinary-page focus API."
    count: 1
    regex:
      pattern: "  controller()->OnOmniboxFocused(nullptr, u\"text\", url, page_classification,\n                                 omnibox::TOOL_MODE_UNSPECIFIED, u\"title\");\n"
      replace: "  controller()->OnOmniboxFocused(nullptr, u\"text\", url, page_classification,\n                                 u\"title\");\n"
  - description: "Match the ten-argument keyword Start API."
    count: 1
    regex:
      pattern: "  controller()->Start(nullptr, u\"query\", -1, \"\", url, OEP::OTHER,\n                      omnibox::TOOL_MODE_UNSPECIFIED, false, true, false, true);\n"
      replace: "  controller()->Start(nullptr, u\"query\", -1, \"\", url, OEP::OTHER,\n                      false, true, false, true);\n"
