      \ \ \ \ \ \ ::metrics::OmniboxEventProto::PageClassification\ page_classification,\

      \ \ \ \ \ \ omnibox::ToolMode\ tool_mode,\

      \ \ \ \ \ \ bool\ prevent_inline_autocomplete,\

      \ \ \ \ \ \ bool\ in_keyword_mode,\

      \ \ \ \ \ \ bool\ allow_exact_keyword_match,\

      '
