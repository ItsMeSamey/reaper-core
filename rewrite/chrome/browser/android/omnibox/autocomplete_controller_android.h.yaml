# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/android/omnibox/autocomplete_controller_android.h'
  regex:
    re_pattern: '\#include\ "base/memory/raw_ptr\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "base/no_destructor\.h"\

      \#include\ "chrome/browser/android/omnibox/composebox_query_controller_bridge\.h"\

      \#include\ "chrome/browser/profiles/profile_keyed_service_factory\.h"\

      \#include\ "components/keyed_service/core/keyed_service\.h"\

      \#include\ "components/omnibox/browser/autocomplete_controller\.h"\

      \#include\ "components/omnibox/browser/autocomplete_input\.h"\

      \#include\ "content/public/browser/browser_context\.h"\

      \#include\ "third_party/omnibox_proto/tool_mode\.pb\.h"\

      \#include\ "url/gurl\.h"\

      \

      class\ AutocompleteResult;\

      '
    replace: '#include "base/memory/raw_ptr.h"

      #include "base/memory/weak_ptr.h"

      #include "base/no_destructor.h"

      #include "chrome/browser/profiles/profile_keyed_service_factory.h"

      #include "components/keyed_service/core/keyed_service.h"

      #include "components/omnibox/browser/autocomplete_controller.h"

      #include "components/omnibox/browser/autocomplete_input.h"

      #include "content/public/browser/browser_context.h"

      #include "url/gurl.h"


      class AutocompleteResult;

      '
