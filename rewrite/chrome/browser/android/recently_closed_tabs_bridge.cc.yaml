- description: Define group restoration in the existing JNI owner without changing its body.
  regex:
    re_pattern: 'DEFINE_JNI\(RecentlyClosedBridge\)\

      '
    replace: "bool AndroidLiveTabContextRestoreWrapper::RestoreTabGroups(TabModel* model) {\n  const auto is_live = [model] {\n    const auto& models = TabModelList::models();\n    return std::ranges::find(models, model) != models.end();\n  };\n  JNIEnv* env = base::android::AttachCurrentThread();\n  for (const auto& [id, group] : tab_groups_) {\n    if (!is_live()) {\n      return false;\n    }\n    Java_RecentlyClosedBridge_restoreTabGroup(\n        env, model, group.visual_data.title(),\n        static_cast<int>(group.visual_data.color()), group.tab_ids);\n  }\n  return is_live();\n}\n\nDEFINE_JNI(RecentlyClosedBridge)\n"
- description: Repair reviewed AN Android native compiler integration errors without changing intended behavior
  regex:
    re_pattern: '\ \ \ \ if\ \(!is_live\(\)\)\ \{\

      \ \ \ \ \ \ return\ false;\

      \ \ \ \ \}\

      \ \ \ \ Java_RecentlyClosedBridge_restoreTabGroup\(\

      \ \ \ \ \ \ \ \ env,\ model,\ group\.visual_data\.title\(\),\

      \ \ \ \ \ \ \ \ static_cast<int>\(group\.visual_data\.color\(\)\),\ group\.tab_ids\);\

      \ \ \}\

      '
    replace: "    if (!is_live()) {\n      return false;\n    }\n    recent_tabs::Java_RecentlyClosedBridge_restoreTabGroup(\n        env, model, group.visual_data.title(),\n        static_cast<int>(group.visual_data.color()), group.tab_ids);\n  }\n"
