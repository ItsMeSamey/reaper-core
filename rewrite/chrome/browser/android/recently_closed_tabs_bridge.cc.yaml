- description: Include the model list used by the relocated group restoration body.
  regex:
    re_pattern: '\#include\ "chrome/browser/ui/android/tab_model/tab_model_jni_bridge\.h"\

      '
    replace: '#include "chrome/browser/ui/android/tab_model/tab_model_jni_bridge.h"

