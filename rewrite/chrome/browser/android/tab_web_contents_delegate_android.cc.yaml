# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/android/tab_web_contents_delegate_android.cc'
  regex:
    re_pattern: '\#include\ "base/metrics/histogram_macros\.h"\

      \#include\ "base/rand_util\.h"\

      \#include\ "base/task/single_thread_task_runner\.h"\

      \#include\ "chrome/browser/actor/actor_util\.h"\

      \#include\ "chrome/browser/android/customtabs/client_data_header_web_contents_observer\.h"\

      \#include\ "chrome/browser/android/framebust_intervention/framebust_blocked_delegate_android\.h"\

      \#include\ "chrome/browser/android/tab_android\.h"\

      '
    replace: '#include "base/metrics/histogram_macros.h"

      #include "base/rand_util.h"

      #include "base/task/single_thread_task_runner.h"

      #include "chrome/browser/android/customtabs/client_data_header_web_contents_observer.h"

      #include "chrome/browser/android/framebust_intervention/framebust_blocked_delegate_android.h"

      #include "chrome/browser/android/tab_android.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/android/tab_web_contents_delegate_android.cc'
  regex:
    re_pattern: '\ \ \ \ const\ GURL\&\ opener_url,\

      \ \ \ \ const\ std::string\&\ frame_name,\

      \ \ \ \ const\ GURL\&\ target_url\)\ \{\

      \ \ if\ \(actor::HasActorTaskPreventingNewWebContents\(opener\)\)\ \{\

      \ \ \ \ //\ If\ an\ ExecutionEngine\ is\ acting\ on\ the\ opener,\ prevent\ it\ from\ creating\ a\

      \ \ \ \ //\ new\ WebContents\.\ We''ll\ instead\ force\ the\ navigation\ to\ happen\ in\ the\ same\

      \ \ \ \ //\ tab\.\ Note,\ we\ do\ this\ even\ if\ the\ task\ isn''t\ active\ \(e\.g\.\ paused\)\ so\ that\

      \ \ \ \ //\ a\ user\ action\ on\ behalf\ of\ the\ actor\ has\ the\ same\ behavior\ since\ the\

      \ \ \ \ //\ resumed\ task\ will\ still\ be\ fixed\ to\ the\ tab\.\

      \

      \ \ \ \ //\ However,\ if\ the\ opener\ is\ sandboxed\ and\ restricted\ from\ top\-level\

      \ \ \ \ //\ navigation,\ we\ cannot\ force\ a\ same\-tab\ redirection\ as\ it\ would\ violate\

      \ \ \ \ //\ the\ sandbox\.\ Instead,\ we\ decline\ to\ override\ creation,\ allowing\ the\

      \ \ \ \ //\ browser\ to\ safely\ open\ a\ new\ popup\ window\ \(since\ kPopups\ is\ allowed\)\.\

      \ \ \ \ if\ \(opener\ \&\&\

      \ \ \ \ \ \ \ \ opener\->IsSandboxed\(network::mojom::WebSandboxFlags::kTopNavigation\)\)\ \{\

      \ \ \ \ \ \ return\ false;\

      \ \ \ \ \}\

      \ \ \ \ return\ true;\

      \ \ \}\

      \

      \ \ return\ WebContentsDelegateAndroid::IsWebContentsCreationOverridden\(\

      \ \ \ \ \ \ opener,\ source_site_instance,\ window_container_type,\ opener_url,\

      '
    replace: "    const GURL& opener_url,\n    const std::string& frame_name,\n    const GURL& target_url) {\n\n\n  return WebContentsDelegateAndroid::IsWebContentsCreationOverridden(\n      opener, source_site_instance, window_container_type, opener_url,\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/android/tab_web_contents_delegate_android.cc'
  regex:
    re_pattern: '\ \ \ \ const\ blink::mojom::WindowFeatures\&\ window_features,\

      \ \ \ \ const\ content::StoragePartitionConfig\&\ partition_config,\

      \ \ \ \ content::SessionStorageNamespaceHandle\*\ session_storage_namespace\)\ \{\

      \ \ if\ \(actor::HasActorTaskPreventingNewWebContents\(opener\)\)\ \{\

      \ \ \ \ //\ If\ an\ ExecutionEngine\ is\ acting\ on\ the\ opener,\ we\ force\ the\ navigation\

      \ \ \ \ //\ to\ happen\ in\ the\ same\ tab\.\

      \ \ \ \ content::NavigationController::LoadURLParams\ params\(target_url\);\

      \ \ \ \ params\.initiator_frame_token\ =\ opener\->GetFrameToken\(\);\

      \ \ \ \ params\.initiator_process_id\ =\ opener\->GetProcess\(\)\->GetID\(\);\

      \ \ \ \ params\.initiator_origin\ =\ opener\->GetLastCommittedOrigin\(\);\

      \ \ \ \ params\.source_site_instance\ =\ source_site_instance;\

      \ \ \ \ params\.transition_type\ =\ ui::PAGE_TRANSITION_LINK;\

      \ \ \ \ params\.is_renderer_initiated\ =\ true;\

      \ \ \ \ auto\*\ opener_contents\ =\ content::WebContents::FromRenderFrameHost\(opener\);\

      \ \ \ \ opener_contents\->GetController\(\)\.LoadURLWithParams\(params\);\

      \ \ \ \ VLOG\(1\)\ <<\ "Actor\ treated\ window\ open\ as\ same\ tab\ navigation\.\ "\

      \ \ \ \ \ \ \ \ \ \ \ \ <<\ target_url;\

      \ \ \ \ return\ nullptr;\

      \ \ \}\

      \

      \ \ return\ WebContentsDelegateAndroid::CreateCustomWebContents\(\

      \ \ \ \ \ \ opener,\ source_site_instance,\ is_new_browsing_instance,\ opener_url,\

      '
    replace: "    const blink::mojom::WindowFeatures& window_features,\n    const content::StoragePartitionConfig& partition_config,\n    content::SessionStorageNamespaceHandle* session_storage_namespace) {\n\n\n  return WebContentsDelegateAndroid::CreateCustomWebContents(\n      opener, source_site_instance, is_new_browsing_instance, opener_url,\n"
- description: Remove the Android delegate AI provider include.
  regex:
    pattern: '#include "components/optimization_guide/content/browser/page_content_proto_provider.h"

      '
    replace: ''
  count: 1
- description: Remove the Android delegate AI provider include.
  regex:
    pattern: '#include "third_party/blink/public/mojom/content_extraction/ai_page_content.mojom.h"

      '
    replace: ''
  count: 1
- description: Use the existing base delegate unsupported completion instead of the Android AI extractor.
  regex:
    pattern: "void TabWebContentsDelegateAndroid::GetAIPageContent(\n    content::WebContents* web_contents,\n    bool include_actionable_elements,\n\
      \    base::OnceCallback<void(base::expected<std::string, std::string>)>\n        callback) {\n  auto options = include_actionable_elements\n\
      \                     ? optimization_guide::ActionableAIPageContentOptions(\n                           /*on_critical_path=*/false)\n\
      \                     : optimization_guide::DefaultAIPageContentOptions(\n                           /*on_critical_path=*/false);\n\
      \n  optimization_guide::GetAIPageContent(\n      web_contents, std::move(options),\n      base::BindOnce([](optimization_guide::AIPageContentResultOrError\
      \ result)\n                         -> base::expected<std::string, std::string> {\n        if (!result.has_value())\
      \ {\n          return base::unexpected(result.error());\n        }\n        return base::ok(result->proto.SerializeAsString());\n\
      \      }).Then(std::move(callback)));\n}\n\n"
    replace: ''
  count: 1
- description: Preserve source parentage before popup blocking retains the request.
  regex:
    pattern: "  nav_params.window_action = NavigateParams::WindowAction::kShowWindow;\n  auto popup_delegate =\n"
    replace: "  nav_params.window_action = NavigateParams::WindowAction::kShowWindow;\n  // A blocked request must retain\
      \ its source tab when replayed later.\n  nav_params.opened_by_another_window = true;\n  auto popup_delegate =\n"
  count: 1
- description: Dispatch immediate requests with the same already-initialized parentage.
  regex:
    pattern: "  popup_delegate->nav_params()->opened_by_another_window = true;\n  TabModelList::HandlePopupNavigation(popup_delegate->nav_params());\n"
    replace: '  TabModelList::HandlePopupNavigation(popup_delegate->nav_params());

      '
  count: 1
