substitutions:
- description: Remove callback-only pointer and PCA service includes.
  regex:
    pattern: '#include "base/memory/raw_ptr.h"

      #include "chrome/browser/android/persisted_tab_data/persisted_tab_data_android.h"

      #include "components/page_content_annotations/core/page_content_annotations_service.h"

      '
    replace: '#include "chrome/browser/android/persisted_tab_data/persisted_tab_data_android.h"

      '
  count: 1
- description: Keep the persisted-data base without the PCA observer interface.
  regex:
    pattern: "    : public PersistedTabDataAndroid,\n      public page_content_annotations::PageContentAnnotationsService::\n\
      \          PageContentAnnotationsObserver {"
    replace: '    : public PersistedTabDataAndroid {'
  count: 1
- description: Remove PCA registration from the Android persisted-data API.
  regex:
    pattern: "  void RegisterPCAService(\n      page_content_annotations::PageContentAnnotationsService*\n          page_content_annotations_service);\n"
    replace: ''
  count: 1
- description: Remove only the PCA callback declaration.
  regex:
    pattern: "  // page_content_annotations::PageContentAnnotationsService::PageContentAnnotationsObserver\n  void OnPageContentAnnotated(\n\
      \      const page_content_annotations::HistoryVisit& visit,\n      const page_content_annotations::PageContentAnnotationsResult&\
      \ result)\n      override;\n\n"
    replace: ''
  count: 1
- description: Remove state owned only by the retired PCA callback path.
  regex:
    pattern: "  raw_ptr<TabAndroid> tab_;\n\n  // Not owned. Register manually through RegisterPCAService\n  raw_ptr<page_content_annotations::PageContentAnnotationsService>\n\
      \      page_content_annotations_service_ = nullptr;\n"
    replace: ''
  count: 1
