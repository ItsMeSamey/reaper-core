substitutions:
- description: Remove the provider include used only by the PCA notification.
  regex:
    pattern: '#include "components/content_capture/browser/onscreen_content_provider.h"

      '
    replace: ''
  count: 1
- description: Stop retaining a TabAndroid pointer solely for PCA callbacks.
  regex:
    pattern: "          SensitivityPersistedTabDataAndroid::UserDataKey()),\n      tab_(tab_android) {}"
    replace: '          SensitivityPersistedTabDataAndroid::UserDataKey()) {}'
  count: 1
- description: Remove PCA observer registration and teardown while keeping the base destructor contract.
  regex:
    pattern: "void SensitivityPersistedTabDataAndroid::RegisterPCAService(\n    page_content_annotations::PageContentAnnotationsService*\n\
      \        page_content_annotations_service) {\n  DCHECK(page_content_annotations_service);\n  if (page_content_annotations_service_\
      \ == page_content_annotations_service) {\n    return;\n  }\n  if (page_content_annotations_service_ != nullptr) {\n\
      \    page_content_annotations_service_->RemoveObserver(\n        page_content_annotations::AnnotationType::kContentVisibility,\
      \ this);\n  }\n\n  page_content_annotations_service_ = page_content_annotations_service;\n  page_content_annotations_service_->AddObserver(\n\
      \      page_content_annotations::AnnotationType::kContentVisibility, this);\n}\n\nSensitivityPersistedTabDataAndroid::~SensitivityPersistedTabDataAndroid()\
      \ {\n  if (page_content_annotations_service_ != nullptr) {\n    page_content_annotations_service_->RemoveObserver(\n\
      \        page_content_annotations::AnnotationType::kContentVisibility, this);\n  }\n}\n\n"
    replace: "SensitivityPersistedTabDataAndroid::~SensitivityPersistedTabDataAndroid() =\n    default;\n\n"
  count: 1
- description: Remove only the PCA notification and score forwarding path.
  regex:
    pattern: "void SensitivityPersistedTabDataAndroid::OnPageContentAnnotated(\n    const page_content_annotations::HistoryVisit&\
      \ visit,\n    const page_content_annotations::PageContentAnnotationsResult& result) {\n  if (tab_->GetURL() != visit.url)\
      \ {\n    return;\n  }\n  set_sensitivity_score(result.GetContentVisibilityScore());\n\n  if (!tab_->web_contents())\
      \ {\n    return;\n  }\n  content_capture::OnscreenContentProvider* onscreen_content_provider =\n      content_capture::OnscreenContentProvider::FromWebContents(\n\
      \          tab_->web_contents());\n  if (onscreen_content_provider) {\n    onscreen_content_provider->DidUpdateSensitivityScore(\n\
      \        result.GetContentVisibilityScore());\n  }\n}\n\n"
    replace: ''
  count: 1
