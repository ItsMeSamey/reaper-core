substitutions:
- description: Remove the PCA-only result header.
  regex:
    pattern: '#include "components/page_content_annotations/core/page_content_annotations_common.h"

      '
    replace: ''
  count: 1
- description: Remove constants used only by the three PCA observer cases.
  regex:
    pattern: "namespace {\nusing page_content_annotations::HistoryVisit;\nconst char kSensitiveRelUrl[] = \"/android/sensitive.html\"\
      ;\nconst char kNonSensitiveRelUrl[] = \"/android/hello.html\";\nconst char kNonSensitiveRelUrl2[] = \"/android/second.html\"\
      ;\nconst page_content_annotations::PageContentAnnotationsResult kSensitiveResult =\n    page_content_annotations::PageContentAnnotationsResult::\n\
      \        CreateContentVisibilityScoreResult(0.1);\nconst page_content_annotations::PageContentAnnotationsResult\n  \
      \  kNonSensitiveResult = page_content_annotations::\n        PageContentAnnotationsResult::CreateContentVisibilityScoreResult(0.7);\n\
      const page_content_annotations::PageContentAnnotationsResult\n    kNonSensitiveResult2 = page_content_annotations::\n\
      \        PageContentAnnotationsResult::CreateContentVisibilityScoreResult(0.8);\n}  // namespace\n\n"
    replace: ''
  count: 1
- description: Remove the three PCA observer cases while retaining the four storage cases.
  regex:
    pattern: "IN_PROC_BROWSER_TEST_F(SensitivityPersistedTabDataAndroidBrowserTest,\n                       TestOnPageContentAnnotatedSensitivePage)\
      \ {\n  const GURL sensitive_url =\n      embedded_test_server()->GetURL(\"localhost\", kSensitiveRelUrl);\n  // TODO:\
      \ handle return value.\n  std::ignore = content::NavigateToURL(web_contents(), sensitive_url);\n\n  TabAndroid* tab_android\
      \ = TabAndroid::FromWebContents(web_contents());\n  SensitivityPersistedTabDataAndroid* sptda =\n      new SensitivityPersistedTabDataAndroid(tab_android);\n\
      \n  EXPECT_EQ(tab_android->GetURL().spec(), sensitive_url.spec());\n\n  sptda->OnPageContentAnnotated(HistoryVisit({},\
      \ sensitive_url),\n                                kSensitiveResult);\n  EXPECT_TRUE(sptda->is_sensitive());\n  EXPECT_FLOAT_EQ(0.1,\
      \ sptda->sensitivity_score());\n}\n\nIN_PROC_BROWSER_TEST_F(SensitivityPersistedTabDataAndroidBrowserTest,\n       \
      \                TestOnPageContentAnnotatedNonSensitivePage) {\n  const GURL non_sensitive_url =\n      embedded_test_server()->GetURL(\"\
      localhost\", kNonSensitiveRelUrl);\n  // TODO: handle return value.\n  std::ignore = content::NavigateToURL(web_contents(),\
      \ non_sensitive_url);\n\n  TabAndroid* tab_android = TabAndroid::FromWebContents(web_contents());\n  SensitivityPersistedTabDataAndroid*\
      \ sptda =\n      new SensitivityPersistedTabDataAndroid(tab_android);\n  EXPECT_EQ(tab_android->GetURL().spec(), non_sensitive_url.spec());\n\
      \n  sptda->OnPageContentAnnotated(HistoryVisit({}, non_sensitive_url),\n                                kNonSensitiveResult);\n\
      \  EXPECT_FALSE(sptda->is_sensitive());\n  EXPECT_FLOAT_EQ(0.7, sptda->sensitivity_score());\n}\n\nIN_PROC_BROWSER_TEST_F(SensitivityPersistedTabDataAndroidBrowserTest,\n\
      \                       TestMultipleAnnotations) {\n  base::RunLoop run_loop;\n\n  const GURL sensitive_url =\n    \
      \  embedded_test_server()->GetURL(\"localhost\", kSensitiveRelUrl);\n  const GURL non_sensitive_url =\n      embedded_test_server()->GetURL(\"\
      localhost\", kNonSensitiveRelUrl);\n  const GURL non_sensitive_url2 =\n      embedded_test_server()->GetURL(\"localhost\"\
      , kNonSensitiveRelUrl2);\n\n  // TODO: handle return value.\n  std::ignore = content::NavigateToURL(web_contents(),\
      \ sensitive_url);\n  TabAndroid* tab_android = TabAndroid::FromWebContents(web_contents());\n  SensitivityPersistedTabDataAndroid*\
      \ sptda =\n      new SensitivityPersistedTabDataAndroid(tab_android);\n  EXPECT_EQ(tab_android->GetURL().spec(), sensitive_url.spec());\n\
      \n  // Annotate both sensitive and non-sensitive tabs\n  sptda->OnPageContentAnnotated(HistoryVisit({}, non_sensitive_url),\n\
      \                                kNonSensitiveResult);\n  sptda->OnPageContentAnnotated(HistoryVisit({}, sensitive_url),\n\
      \                                kSensitiveResult);\n  sptda->OnPageContentAnnotated(HistoryVisit({}, non_sensitive_url2),\n\
      \                                kNonSensitiveResult2);\n  tab_android->SetUserData(SensitivityPersistedTabDataAndroid::UserDataKey(),\n\
      \                           nullptr);\n\n  SensitivityPersistedTabDataAndroid::From(\n      tab_android,\n      base::BindOnce(\n\
      \          [](base::OnceClosure done,\n             PersistedTabDataAndroid* persisted_tab_data) {\n            SensitivityPersistedTabDataAndroid*\
      \ sensitive_persisted_tab_data =\n                static_cast<SensitivityPersistedTabDataAndroid*>(\n              \
      \      persisted_tab_data);\n            EXPECT_TRUE(sensitive_persisted_tab_data->is_sensitive());\n            EXPECT_FLOAT_EQ(0.1,\n\
      \                            sensitive_persisted_tab_data->sensitivity_score());\n            std::move(done).Run();\n\
      \          },\n          run_loop.QuitClosure()));\n  run_loop.Run();\n}\n\n"
    replace: ''
  count: 1
