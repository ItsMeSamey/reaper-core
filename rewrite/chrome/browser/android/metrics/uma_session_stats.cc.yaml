- description: "Preserve reviewed Android source projection for chrome/browser/android/metrics/uma_session_stats.cc (operation 2)."
  regex:
    re_pattern: 'void\ UmaSessionStats::UmaResumeSession\(\)\ \{\

      \ \ DCHECK\(g_browser_process\);\

      \ \ if\ \(\+\+active_session_count_\ ==\ 1\)\ \{\

      \ \ \ \ const\ bool\ had_background_session\ =\

      \ \ \ \ \ \ \ \ session_time_tracker_\.BeginForegroundSession\(\);\

      \

      \ \ \ \ //\ Tell\ the\ metrics\ services\ that\ the\ application\ resumes\.\

      \ \ \ \ metrics::MetricsService\*\ metrics\ =\ g_browser_process\->metrics_service\(\);\

      \ \ \ \ if\ \(metrics\)\ \{\

      \ \ \ \ \ \ //\ Forcing\ a\ new\ log\ allows\ foreground\ and\ background\ metrics\ can\ be\

      \ \ \ \ \ \ //\ separated\ in\ analysis\.\

      \ \ \ \ \ \ const\ bool\ force_new_log\ =\ base::FeatureList::IsEnabled\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ chrome::android::kUmaBackgroundSessions\)\ \&\&\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ had_background_session;\

      \

      \ \ \ \ \ \ metrics\->OnAppEnterForeground\(force_new_log\);\

      \ \ \ \ \}\

      \ \ \ \ //\ Report\ background\ session\ time\ if\ it\ wasn''t\ already\ reported\ by\

      \ \ \ \ //\ OnAppEnterForeground\(\)\ \->\ ProvideCurrentSessionData\(\)\.\

      \ \ \ \ session_time_tracker_\.ReportBackgroundSessionTime\(\);\

      \

      \ \ \ \ ukm::UkmService\*\ ukm_service\ =\

      \ \ \ \ \ \ \ \ g_browser_process\->GetMetricsServicesManager\(\)\->GetUkmService\(\);\

      \ \ \ \ if\ \(ukm_service\)\ \{\

      \ \ \ \ \ \ ukm_service\->OnAppEnterForeground\(\);\

      \ \ \ \ \}\

      \

      \ \ \ \ AndroidSessionDurationsServiceFactory::OnAppEnterForeground\(\

      \ \ \ \ \ \ \ \ session_time_tracker_\.session_start_time\(\)\);\

      '
    replace: "void UmaSessionStats::UmaResumeSession() {\n  DCHECK(g_browser_process);\n  if (++active_session_count_ == 1) {\n    session_time_tracker_.BeginForegroundSession();\n\n    // Retain the local crash-recovery beacon without remote collection.\n    g_browser_process->GetMetricsServicesManager()\n        ->LogHasSessionShutdownCleanly(false);\n    session_time_tracker_.ReportBackgroundSessionTime();\n\n    AndroidSessionDurationsServiceFactory::OnAppEnterForeground(\n        session_time_tracker_.session_start_time());\n"
