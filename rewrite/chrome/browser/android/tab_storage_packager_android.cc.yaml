# Reaper Android containers lifecycle; complete raw-pin ancestry.
substitutions:
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/android/tab_storage_packager_android\.h"\

      \

      \#include\ <jni\.h>\

      \

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/android/tab_storage_packager_android.h"


      #include "brave/browser/containers/android/containers_bridge.h"


      #include <jni.h>


      '
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ tabs_pb::TabState\ tab_state;\

      \ \ tab_state\.set_tab_id\(tab_android\->GetAndroidId\(\)\);\

      \ \ tab_state\.set_parent_id\(tab_android\->GetParentId\(\)\);\

      \ \ tab_state\.set_launch_type_at_creation\(\

      \ \ \ \ \ \ tab_android\->GetTabLaunchTypeAtCreation\(\)\);\

      \ \ tab_state\.set_user_agent\(tab_android\->GetUserAgent\(\)\);\

      '
    replace: "  tabs_pb::TabState tab_state;\n  tab_state.set_tab_id(tab_android->GetAndroidId());\n  tab_state.set_parent_id(tab_android->GetParentId());\n  const std::string container_id = tab_android->GetContainerId();\n  if (!container_id.empty()) {\n    containers::android::InvalidatePersistentContainerReferences(profile_);\n    // Refresh is coalesced in Java; the database query is sequenced behind\n    // the pending batch commit, so this cannot publish a partially written row.\n    containers::android::RefreshPersistentContainerReferences(profile_);\n  }\n  tab_state.set_container_id(container_id);\n  tab_state.set_launch_type_at_creation(\n      tab_android->GetTabLaunchTypeAtCreation());\n  tab_state.set_user_agent(tab_android->GetUserAgent());\n"
