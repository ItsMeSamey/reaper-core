# Android Chromium Discover implementation exclusion.
substitutions:
- description: Do not reconstruct an absent Discover background refresh task
  regex:
    re_pattern: '\#include\ "chrome/browser/feed/android/background_refresh_task\.h"\

      '
    replace: ''
- description: Do not reconstruct an absent Discover background refresh task
  regex:
    re_pattern: '\#include\ "components/feed/core/v2/public/types\.h"\

      '
    replace: ''
- description: Do not reconstruct an absent Discover background refresh task
  regex:
    re_pattern: '\ \ \ \ case\ static_cast<int>\(background_task::TaskIds::FEEDV2_REFRESH_JOB_ID\):\

      \ \ \ \ \ \ return\ std::make_unique<feed::BackgroundRefreshTask>\(\);\

      '
    replace: ''
- description: "Preserve reviewed Android source projection for chrome/browser/android/background_task_scheduler/chrome_background_task_factory.cc (operation 4)."
  regex:
    re_pattern: '\#include\ <utility>\

      \

      \#include\ "chrome/android/chrome_jni_headers/ChromeBackgroundTaskFactory_jni\.h"\

      \#include\ "chrome/browser/metrics/android/background_upload_task\.h"\

      \#include\ "components/background_task_scheduler/task_ids\.h"\

      \

      //\ static\

      void\ ChromeBackgroundTaskFactory::SetAsDefault\(\)\ \{\

      '
    replace: '#include <utility>


      #include "chrome/android/chrome_jni_headers/ChromeBackgroundTaskFactory_jni.h"


      // static

      void ChromeBackgroundTaskFactory::SetAsDefault() {

      '
- description: "Preserve reviewed Android source projection for chrome/browser/android/background_task_scheduler/chrome_background_task_factory.cc (operation 5)."
  regex:
    re_pattern: 'ChromeBackgroundTaskFactory::GetNativeBackgroundTaskFromTaskId\(int\ task_id\)\ \{\

      \ \ //\ Add\ your\ tasks\ here\ with\ mappings\ to\ the\ given\ task_id\.\

      \ \ switch\ \(task_id\)\ \{\

      \ \ \ \ case\ static_cast<int>\(background_task::TaskIds::UMA_UPLOAD_JOB_ID\):\

      \ \ \ \ case\ static_cast<int>\(background_task::TaskIds::UKM_UPLOAD_JOB_ID\):\

      \ \ \ \ case\ static_cast<int>\(background_task::TaskIds::DWA_UPLOAD_JOB_ID\):\

      \ \ \ \ case\ static_cast<int>\(background_task::TaskIds::PUMA_UPLOAD_JOB_ID\):\

      \ \ \ \ case\ static_cast<int>\(\

      \ \ \ \ \ \ \ \ background_task::TaskIds::STRUCTURED_METRICS_UPLOAD_JOB_ID\):\

      \ \ \ \ \ \ return\ std::make_unique<metrics::BackgroundUploadTask>\(\

      \ \ \ \ \ \ \ \ \ \ static_cast<background_task::TaskIds>\(task_id\)\);\

      \ \ \ \ default:\

      \ \ \ \ \ \ break;\

      \ \ \}\

      '
    replace: "ChromeBackgroundTaskFactory::GetNativeBackgroundTaskFromTaskId(int task_id) {\n  // Add your tasks here with mappings to the given task_id.\n  switch (task_id) {\n    default:\n      break;\n  }\n"
