# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/android/tab_features.h'
  regex:
    re_pattern: 'class\ QwacWebContentsObserver;\

      class\ NewTabPagePreloadPipelineManager;\

      \

      namespace\ actor\ \{\

      class\ ActorTabData;\

      \}\ \ //\ namespace\ actor\

      \

      namespace\ contextual_tasks\ \{\

      class\ ContextualTasksTabVisitTracker;\

      \}\ \ //\ namespace\ contextual_tasks\

      \

      namespace\ actor::ui\ \{\

      class\ ActorUiTabControllerInterface;\

      \}\ \ //\ namespace\ actor::ui\

      \

      namespace\ content\ \{\

      class\ WebContents;\

      \}\ \ //\ namespace\ content\

      '
    replace: 'class QwacWebContentsObserver;

      class NewTabPagePreloadPipelineManager;


      namespace content {

      class WebContents;

      }  // namespace content

      '
