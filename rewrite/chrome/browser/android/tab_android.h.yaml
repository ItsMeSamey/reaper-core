# Connect Android split collections to model and transfer APIs.
substitutions:
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ \ \ const\ base::android::JavaRef<jobject>\&\ jweb_contents_delegate,\

      \ \ \ \ \ \ const\ base::android::JavaRef<jobject>\&\ jcontext_menu_populator_factory\);\

      \ \ void\ SendDidActivateUpdate\(JNIEnv\*\ env\);\

      \ \ void\ SendWillDeactivateUpdate\(JNIEnv\*\ env\);\

      \ \ void\ SendWillDetachUpdate\(JNIEnv\*\ env,\ int32_t\ detach_reason\);\

      \ \ void\ SendDidInsertUpdate\(JNIEnv\*\ env\);\

      \ \ tabs::TabDestroyStatus\ DestroyWebContents\(\);\

      \ \ void\ ReleaseWebContents\(\);\

      '
    replace: "      const base::android::JavaRef<jobject>& jweb_contents_delegate,\n      const base::android::JavaRef<jobject>& jcontext_menu_populator_factory);\n  void SendDidActivateUpdate(JNIEnv* env);\n  void SendWillDeactivateUpdate(JNIEnv* env);\n  void SendDidBecomeVisibleUpdate(JNIEnv* env);\n  void SendWillBecomeHiddenUpdate(JNIEnv* env);\n  void SendWillDetachUpdate(JNIEnv* env, int32_t detach_reason);\n  void SendDidInsertUpdate(JNIEnv* env);\n  tabs::TabDestroyStatus DestroyWebContents();\n  void ReleaseWebContents();\n"
- description: Declare direct closing-split field forwarding on the existing TabAndroid interface.
  regex:
    re_pattern: '\ \ //\ Function\ to\ attach\ helpers\ to\ the\ `web_contents`\.\

      '
    replace: "  // Reads Java closing-split snapshots through the TabImpl JNI owner.\n  static std::optional<base::Token> GetHistoricalSplitTabId(\n      JNIEnv* env, const base::android::JavaRef<jobject>& tab);\n  static int GetHistoricalSplitLayout(\n      JNIEnv* env, const base::android::JavaRef<jobject>& tab);\n  static double GetHistoricalSplitRatio(\n      JNIEnv* env, const base::android::JavaRef<jobject>& tab);\n  static int GetHistoricalSplitPosition(\n      JNIEnv* env, const base::android::JavaRef<jobject>& tab);\n\n  // Function to attach helpers to the `web_contents`.\n"
- description: "Allow tab observers to retire before native Android tab destruction (literal 1)"
  regex:
    re_pattern: "\\ \\ \\ public:\\\n\\ \\ \\ \\ //\\ Called\\ when\\ WebContents\\ is\\ initialized\\.\\\n\\ \\ \\ \\ virtual\\ void\\ OnInitWebContents\\(TabAndroid\\*\\ tab\\)\\ =\\ 0;\\\n\\ \\ \\};\\\n\\\n\\ \\ //\\ Denotes\\ an\\ invalid\\ Tab\\ Id\\.\\\n"
    replace: "   public:\n    // Called when WebContents is initialized.\n    virtual void OnInitWebContents(TabAndroid* tab) = 0;\n\n    // Called before the tab and its observer list are destroyed. Observers must\n    // stop observing the tab during this callback.\n    virtual void OnTabAndroidDestroyed(TabAndroid* tab) {}\n  };\n\n  // Denotes an invalid Tab Id.\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 1)"
  regex:
    re_pattern: "\\ \\ \\ public:\\\n\\ \\ \\ \\ //\\ Called\\ when\\ WebContents\\ is\\ initialized\\.\\\n\\ \\ \\ \\ virtual\\ void\\ OnInitWebContents\\(TabAndroid\\*\\ tab\\)\\ =\\ 0;\\\n\\\n\\ \\ \\ \\ //\\ Called\\ before\\ the\\ tab\\ and\\ its\\ observer\\ list\\ are\\ destroyed\\.\\ Observers\\ must\\\n\\ \\ \\ \\ //\\ stop\\ observing\\ the\\ tab\\ during\\ this\\ callback\\.\\\n"
    replace: "   public:\n    // Called when WebContents is initialized.\n    virtual void OnInitWebContents(TabAndroid* tab) = 0;\n\n    // Called before native association is removed or contents are destroyed.\n    // `keep_session_id` distinguishes freezing/teardown from a true release.\n    virtual void OnWillDetachWebContents(TabAndroid* tab,\n                                         bool keep_session_id) {}\n\n    // Called before the tab and its observer list are destroyed. Observers must\n    // stop observing the tab during this callback.\n"
- description: "Preserve native lazy-tab session identity and API behavior (literal 2)"
  regex:
    re_pattern: "\\ \\ void\\ LoadIfNeeded\\(\\)\\ override;\\\n\\ \\ std::u16string\\ GetTitle\\(\\)\\ const\\ override;\\\n\\ \\ GURL\\ GetURL\\(\\)\\ const\\ override;\\\n\\ \\ base::Time\\ GetLastActiveTime\\(\\)\\ const\\ override;\\\n\\ \\ Profile\\*\\ GetProfile\\(\\)\\ const\\ override;\\\n\\ \\ //\\ This\\ implementation\\ of\\ close\\ immediately\\ closes\\ the\\ tab\\ without\\ undo\\\n"
    replace: "  void LoadIfNeeded() override;\n  std::u16string GetTitle() const override;\n  GURL GetURL() const override;\n  // The URL of a lazy initial navigation, without creating WebContents.\n  GURL GetPendingURL() const;\n  base::Time GetLastActiveTime() const override;\n  Profile* GetProfile() const override;\n  // This implementation of close immediately closes the tab without undo\n"
- description: "Preserve serialized pending and committed metadata (literal 1)"
  regex:
    re_pattern: "\\ \\ //\\ The\\ URL\\ of\\ a\\ lazy\\ initial\\ navigation,\\ without\\ creating\\ WebContents\\.\\\n\\ \\ GURL\\ GetPendingURL\\(\\)\\ const;"
    replace: "  // Deferred navigation metadata, without creating WebContents.\n  GURL GetPendingURL() const;\n  GURL GetCommittedURL() const;\n  std::u16string GetCommittedTitle() const;"

- description: 'Android concrete AI source/provider removal: chrome/browser/android/tab_android.h'
  regex:
    re_pattern: 'namespace\ sync_sessions\ \{\

      class\ SyncedTabDelegate;\

      \}\ \ //\ namespace\ sync_sessions\

      \

      namespace\ glic\ \{\

      class\ GlicTabIndicatorHelper;\

      \}\

      \

      namespace\ tabs\ \{\

      enum\ class\ TabAlert;\

      '
    replace: 'namespace sync_sessions {

      class SyncedTabDelegate;

      }  // namespace sync_sessions


      namespace tabs {

      enum class TabAlert;

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/android/tab_android.h'
  regex:
    re_pattern: '\ \ \ \ \ \ will_detach_callback_list_;\

      \ \ base::RepeatingCallbackList<void\(TabInterface\*\)>\ did_insert_callback_list_;\

      \

      \ \ std::unique_ptr<glic::GlicTabIndicatorHelper>\ glic_tab_indicator_helper_;\

      \ \ std::unique_ptr<tabs::TabAlertController>\ tab_alert_controller_;\

      \ \ base::CallbackListSubscription\ alert_to_show_subscription_;\

      \ \ const\ base::WeakPtr<Profile>\ profile_;\

      '
    replace: "      will_detach_callback_list_;\n  base::RepeatingCallbackList<void(TabInterface*)> did_insert_callback_list_;\n\n  std::unique_ptr<tabs::TabAlertController> tab_alert_controller_;\n  base::CallbackListSubscription alert_to_show_subscription_;\n  const base::WeakPtr<Profile> profile_;\n"

# Reaper Android containers lifecycle successor; retain the complete inherited recipe.
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ std::u16string\ GetCommittedTitle\(\)\ const;\

      \ \ base::Time\ GetLastActiveTime\(\)\ const\ override;\

      \ \ Profile\*\ GetProfile\(\)\ const\ override;\

      \ \ //\ This\ implementation\ of\ close\ immediately\ closes\ the\ tab\ without\ undo\

      \ \ //\ support\ and\ without\ a\ warning\ dialog\ when\ closing\ the\ last\ tab\ in\ a\ tab\

      \ \ //\ group\.\ For\ more\ granular\ control\ it\ is\ strongly\ recommended\ to\ close\ tabs\

      '
    replace: "  std::u16string GetCommittedTitle() const;\n  base::Time GetLastActiveTime() const override;\n  Profile* GetProfile() const override;\n\n  // Immutable Java storage identity, available for frozen and archived tabs.\n  std::string GetContainerId() const;\n  // This implementation of close immediately closes the tab without undo\n  // support and without a warning dialog when closing the last tab in a tab\n  // group. For more granular control it is strongly recommended to close tabs\n"
