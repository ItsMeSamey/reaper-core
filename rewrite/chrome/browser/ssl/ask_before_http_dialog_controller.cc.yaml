# Android split pane request ownership and dialog placement.
substitutions:
- description: Point Learn More link to the Brave support article.
  regex:
    re_pattern: (kLearnMoreLink[^=]*=\s*)(?:"[^"]*"\s*)+;
    replace: \1"https://support.brave.app/hc/en-us/articles/15513090104717";
  count: 1
- description: Preserve the originating contents when dispatching the Android tab dialog
  regex:
    re_pattern: \ \ ui::ModalDialogWrapper::ShowTabModal\(std::move\(dialog_model\),\ window\);
    replace: "  ui::ModalDialogWrapper::ShowTabModal(\n      std::move(dialog_model), window, web_contents->GetJavaWebContents());"
- description: Format modified Android split dialog code
  regex:
    re_pattern: '\ \ CHECK\(focused_view\);\

      \ \ focused_view\->RequestFocus\(\);\

      \#else\

      \ \ current_dialog_model_\ =\ dialog_model\.get\(\);\

      \ \ ui::ModalDialogWrapper::ShowTabModal\(\

      \ \ \ \ \ \ std::move\(dialog_model\),\ window,\ web_contents\->GetJavaWebContents\(\)\);\

      \#endif\

      \}\

      \

      bool\ AskBeforeHttpDialogController::HasOpenDialog\(\)\ const\ \{\

      '
    replace: "  CHECK(focused_view);\n  focused_view->RequestFocus();\n#else\n  current_dialog_model_ = dialog_model.get();\n  ui::ModalDialogWrapper::ShowTabModal(std::move(dialog_model), window,\n                                       web_contents->GetJavaWebContents());\n#endif\n}\n\nbool AskBeforeHttpDialogController::HasOpenDialog() const {\n"
