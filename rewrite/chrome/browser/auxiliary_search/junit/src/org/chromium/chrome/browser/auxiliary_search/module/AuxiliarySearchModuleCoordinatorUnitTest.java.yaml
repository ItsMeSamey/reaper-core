substitutions:
- description: Retire dedicated browsing-history donation test testGetModuleContextMenuHideText_BrowsingDataDonation.
  regex:
    pattern: "\n    @Test\n    @SmallTest\n    @EnableFeatures({ChromeFeatureList.AUXILIARY_SEARCH_HISTORY_DONATION})\n  \
      \  public void testGetModuleContextMenuHideText_BrowsingDataDonation() {\n        when(mHooks.isBrowsingDataDonationSupported()).thenReturn(true);\n\
      \        assertEquals(\n                mContext.getString(\n                        R.string.auxiliary_search_browsing_data_module_context_menu_hide),\n\
      \                mCoordinator.getModuleContextMenuHideText(mContext));\n    }\n"
    replace: ''
  count: 1
- description: Retire dedicated browsing-history donation test testGetModuleContextMenuHideText_BrowsingDataDonationNotSupported.
  regex:
    pattern: "\n    @Test\n    @SmallTest\n    @EnableFeatures({ChromeFeatureList.AUXILIARY_SEARCH_HISTORY_DONATION})\n  \
      \  public void testGetModuleContextMenuHideText_BrowsingDataDonationNotSupported() {\n        when(mHooks.isBrowsingDataDonationSupported()).thenReturn(false);\n\
      \        assertEquals(\n                mContext.getString(R.string.auxiliary_search_module_context_menu_hide),\n  \
      \              mCoordinator.getModuleContextMenuHideText(mContext));\n    }\n"
    replace: ''
  count: 1
- description: Remove obsolete donation feature annotation from the retained default-label test.
  regex:
    pattern: '    @DisableFeatures({ChromeFeatureList.AUXILIARY_SEARCH_HISTORY_DONATION})

      '
    replace: ''
  count: 1
- description: Remove unused donation-only import when.
  regex:
    pattern: 'import static org.mockito.Mockito.when;

      '
    replace: ''
  count: 1
- description: Remove unused donation-only import DisableFeatures.
  regex:
    pattern: 'import org.chromium.base.test.util.Features.DisableFeatures;

      '
    replace: ''
  count: 1
- description: Remove unused donation-only import EnableFeatures.
  regex:
    pattern: 'import org.chromium.base.test.util.Features.EnableFeatures;

      '
    replace: ''
  count: 1
- description: Remove unused donation-only import ChromeFeatureList.
  regex:
    pattern: 'import org.chromium.chrome.browser.flags.ChromeFeatureList;

      '
    replace: ''
  count: 1
