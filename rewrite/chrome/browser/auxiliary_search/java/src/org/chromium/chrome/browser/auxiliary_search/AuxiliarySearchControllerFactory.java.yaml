substitutions:
- description: retire-exclusive-history-ui-assertion
  regex:
    pattern: "        // The tab sharing UI should never be shown at the same time as the browsing data UI:\n        // -\
      \ The current Magic Stack card is designed for both features individually and isn't\n        //   generic enough to\
      \ support both features on at the same time.\n        // - Having two separate settings toggles for very similar features\
      \ is confusing for users.\n        // - Donating separately is bad for efficiency.\n        // As of writing (August\
      \ 2026) these two features are never enabled at the same time, but a\n        // future change to an external app may\
      \ cause this assert to start failing. We expect this\n        // to either never happen, or only happen after the below\
      \ todo is resolved.\n        // TODO(crbug.com/512359034): Remove this assert once we resolve how these features should\n\
      \        // interact with each other.\n        assert !(isCompatible\n                && AuxiliarySearchDonationServiceUtils.isBrowsingDataDonationEnabled());\n"
    replace: ''
  count: 1
