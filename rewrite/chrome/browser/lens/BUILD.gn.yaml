substitutions:

# Lens Android production source closure; preserve ordinary image/toolbar/core APIs.
- description: "Lens production: add_annotation_enum_only_API_target"
  regex:
    re_pattern: "\\ \\ android_library\\(\"java\"\\)\\ \\{\\\n"
    replace: "  android_library(\"api_java\") {\n    sources =\n        [ \"java/src/org/chromium/chrome/browser/lens/LensEntryPoint.java\" ]\n    deps = [\n      \"//base:base_java\",\n      \"//build/android:build_java\",\n      \"//third_party/androidx:androidx_annotation_annotation_java\",\n    ]\n  }\n\n  android_library(\"java\") {\n"
  count: 1
- description: "Lens production: move_enum_to_API_without_duplicate_class"
  regex:
    re_pattern: "\\ \\ android_library\\(\"util_java\"\\)\\ \\{\\\n\\ \\ \\ \\ sources\\ =\\ \\[\\\n\\ \\ \\ \\ \\ \\ \"java/src/org/chromium/chrome/browser/lens/LensEntryPoint\\.java\",\\\n"
    replace: "  android_library(\"util_java\") {\n    public_deps = [ \":api_java\" ]\n    sources = [\n"
  count: 1

# Lens coupled extra production and test source closure; ordinary APIs/classes retained.
- description: "Lens extra: Android Lens JNI/overlay implementation edge 0"
  regex:
    re_pattern: "\\ \\ \\ \\ deps\\ =\\ \\[\\\n\\ \\ \\ \\ \\ \\ \":jni_headers\",\\\n\\ \\ \\ \\ \\ \\ \"//chrome/android:jni_headers\",\\\n"
    replace: "    deps = [\n      \"//chrome/android:jni_headers\",\n"
  count: 1
