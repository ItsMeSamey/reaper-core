# Android extension text-to-speech engine integration.
substitutions:
- description: Ignore final extension callbacks after profile teardown clears their context
  regex:
    re_pattern: \ \ \ \ if\ \(utterance\->GetSrcId\(\)\ <\ 0\)\ \{
    replace: "#if BUILDFLAG(IS_ANDROID)\n    auto* context = utterance->GetBrowserContext();\n    if (!context || context->ShutdownStarted()) {\n      return;\n    }\n#endif\n    if (utterance->GetSrcId() < 0) {"
