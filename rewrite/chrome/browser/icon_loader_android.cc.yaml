substitutions:
  - description: "Support Android MIME icons while preserving the standard asynchronous loader contract."
    regex:
      pattern: "// Copyright 2012 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\n#include \"chrome/browser/icon_loader.h\"\n\n#include \"base/notimplemented.h\"\n\n// static\nIconLoader::IconGroup IconLoader::GroupForFilepath(\n    const base::FilePath& file_path) {\n  NOTIMPLEMENTED();\n  return IconLoader::IconGroup();\n}\n\n// static\nscoped_refptr<base::TaskRunner> IconLoader::GetReadIconTaskRunner() {\n  NOTIMPLEMENTED();\n  return nullptr;\n}\n\nvoid IconLoader::ReadIcon() {\n  NOTIMPLEMENTED();\n  delete this;\n}\n"
      replace: "// Copyright 2012 The Chromium Authors\n// Use of this source code is governed by a BSD-style license that can be\n// found in the LICENSE file.\n\n#include \"chrome/browser/icon_loader.h\"\n\n#include <cmath>\n#include <utility>\n\n#include \"base/android/jni_android.h\"\n#include \"base/android/jni_string.h\"\n#include \"base/functional/bind.h\"\n#include \"base/strings/string_util.h\"\n#include \"content/public/browser/browser_task_traits.h\"\n#include \"content/public/browser/browser_thread.h\"\n#include \"ui/gfx/android/java_bitmap.h\"\n#include \"ui/gfx/image/image_skia.h\"\n#include \"ui/gfx/image/image_skia_rep.h\"\n\n// Must follow headers specializing FromJniType() / ToJniType().\n#include \"brave/browser/extensions/android/download_icons/jni_headers/ReaperDownloadFileIcon_jni.h\"\n\n// static\nIconLoader::IconGroup IconLoader::GroupForFilepath(\n    const base::FilePath& file_path) {\n  // MIME icons depend only on the suffix; do not open the downloaded file.\n  return base::ToLowerASCII(file_path.FinalExtension());\n}\n\n// static\nscoped_refptr<base::TaskRunner> IconLoader::GetReadIconTaskRunner() {\n  return content::GetUIThreadTaskRunner({});\n}\n\nvoid IconLoader::ReadIcon() {\n  DCHECK_CURRENTLY_ON(content::BrowserThread::UI);\n  int dip_size = 32;\n  switch (icon_size_) {\n    case SMALL:\n      dip_size = 16;\n      break;\n    case LARGE:\n      dip_size = 48;\n      break;\n    case NORMAL:\n    case ALL:\n      break;\n  }\n\n  // Bound allocation before converting to int. Reject subpixel/invalid sizes\n  // rather than producing an image with an invalid scale or huge DIP\n  // dimensions.\n  constexpr int kMaxIconPixels = 256;\n  const double scaled_size = dip_size * static_cast<double>(scale_);\n  gfx::Image image;\n  if (std::isfinite(scaled_size) && scaled_size >= 1 &&\n      scaled_size <= kMaxIconPixels) {\n    const int size_pixels = static_cast<int>(std::ceil(scaled_size));\n    auto java_icon = Java_ReaperDownloadFileIcon_loadIcon(\n        base::android::AttachCurrentThread(), group_, size_pixels);\n    if (!java_icon.is_null()) {\n      gfx::JavaBitmap bitmap(java_icon);\n      if (bitmap.size().width() == size_pixels &&\n          bitmap.size().height() == size_pixels &&\n          bitmap.format() == gfx::BITMAP_FORMAT_ARGB_8888 && bitmap.pixels()) {\n        SkBitmap sk_bitmap = gfx::CreateSkBitmapFromJavaBitmap(bitmap);\n        if (!sk_bitmap.drawsNothing()) {\n          gfx::ImageSkia icon{gfx::ImageSkiaRep(sk_bitmap, scale_)};\n          icon.MakeThreadSafe();\n          image = gfx::Image(icon);\n        }\n      }\n    }\n  }\n\n  // Match the platform loaders: success and failure both complete on the\n  // requesting sequence, with an empty image representing failure.\n  target_task_runner_->PostTask(\n      FROM_HERE,\n      base::BindOnce(std::move(callback_), std::move(image), group_));\n  delete this;\n}\n\nDEFINE_JNI(ReaperDownloadFileIcon)\n"
