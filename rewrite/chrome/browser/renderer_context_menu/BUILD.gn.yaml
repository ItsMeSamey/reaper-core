# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_context_menu/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/menus",\

      \ \ \ \ \ \ "//url",\

      \ \ \ \ \]\

      \

      \ \ \ \ if\ \(enable_print_preview\)\ \{\

      \ \ \ \ \ \ deps\ \+=\ \[\ "//chrome/browser/printing"\ \]\

      '
    replace: "      \"//ui/menus\",\n      \"//url\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/compose\",\n        \"//chrome/browser/context_hub\",\n        \"//chrome/browser/glic\",\n        \"//chrome/browser/glic/browser_ui\",\n        \"//chrome/browser/glic/public:features\",\n        \"//chrome/browser/glic/resources:browser_resources\",\n        \"//chrome/browser/ui/views/context_hub:save_to_memory_bank_bubble_controller\",\n        \"//components/compose/core/browser\",\n        \"//components/compose/core/browser:features\",\n      ]\n    }\n\n    if (enable_print_preview) {\n      deps += [ \"//chrome/browser/printing\" ]\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_context_menu/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//chrome/browser/compose",\

      \ \ \ \ \ \ "//chrome/browser/indigo",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ if\ \(is_chromeos\)\ \{\

      '
    replace: "      \"//chrome/browser/compose\",\n      \"//chrome/browser/indigo\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/compose\" ]\n    }\n  }\n\n  if (is_chromeos) {\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_context_menu/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/events:test_support",\

      \ \ \ \ \ \ "//url",\

      \ \ \ \ \]\

      \

      \ \ \ \ if\ \(is_linux\ \|\|\ is_chromeos\ \|\|\ is_win\)\ \{\

      \ \ \ \ \ \ sources\ \+=\ \[\

      '
    replace: "      \"//ui/events:test_support\",\n      \"//url\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/compose:test_support\",\n        \"//chrome/browser/context_hub\",\n        \"//chrome/browser/ui/views/context_hub:save_to_memory_bank_bubble_controller\",\n      ]\n    }\n\n    if (is_linux || is_chromeos || is_win) {\n      sources += [\n"
- description: 'Android concrete AI source/provider removal: chrome/browser/renderer_context_menu/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//ui/base/clipboard:clipboard_test_support",\

      \ \ \ \ \ \ "//url",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      '
    replace: "      \"//ui/base/clipboard:clipboard_test_support\",\n      \"//url\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/glic\",\n        \"//chrome/browser/glic:mojo_bindings\",\n        \"//chrome/browser/glic/test_support\",\n      ]\n    }\n  }\n}\n"
