      replace: "      \"//chromeos/version\",\n    ]\n  }\n  if (is_linux) {\n    sources += [\n      \"system_logs/log_sources/ozone_platform_state_dump_source.cc\",\n      \"system_logs/log_sources/ozone_platform_state_dump_source.h\",\n    ]\n    deps += [ \"//ui/ozone\" ]\n  }\n\n  if (is_android) {\n    # Keep the existing disabled Android interface without uploader code or roots.\n    sources = []\n    sources = [\n      \"report_unsafe_site_dialog.h\",\n      \"report_unsafe_site_dialog_android.cc\",\n    ]\n    deps = []\n    deps = [ \"//base\" ]\n    public_deps = []\n  }\n}\n\nsource_set(\"unit_tests\") {\n  testonly = true\n\n  deps = [\n    \":feedback_impl\",\n    \"//base/test:test_support\",\n    \"//chrome/browser:browser_features\",\n    \"//chrome/browser/performance_manager:test_support\",\n    \"//chrome/common:constants\",\n    \"//chrome/test:test_support\",\n    \"//components/safe_browsing/core/common\",\n    \"//content/test:test_support\",\n    \"//testing/gtest\",\n  ]\n  if (is_android) {\n    sources = [\n      \"report_unsafe_site_dialog_android_unittest.cc\",\n    ]\n    deps += [\n      \"//chrome/browser/flags:flags_android\",\n      \"//chrome/browser/signin\",\n      \"//chrome/browser/signin:test_support\",\n      \"//chrome/browser/supervised_user:test_support\",\n      \"//chrome/test:test_support_jni_headers\",\n    ]\n  } else {\n    sources = [\n      \"report_unsafe_site_dialog_views_unittest.cc\",\n      \"show_feedback_page_unittest.cc\",\n"
    count: 1
