# Reaper Android removes Discover-only feedback payload.
substitutions:
- description: Remove the Discover-only Map feedback overload; preserve ordinary help
    and feedback entrypoints.
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Starts\ an\ activity\ prompting\ the\ user\ to\ enter\ feedback\
      for\ the\ interest\ feed\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ <p>Note:\ Please\ check\ the\ isUserFeedbackAllowed\ policy\ \(via\
      \{@link\

      \ \ \ \ \ \*\ FeedbackPolicyManager\#isUserFeedbackAllowed\(\)\}\)\ when\ adding\
      a\ UI\ entry\ to\ send\ feedback\.\ See\

      \ \ \ \ \ \*\ crbug\.com/467060116\ for\ more\ details\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ activity\ The\ activity\ to\ use\ for\ starting\ the\
      feedback\ activity\ and\ to\ take\ a\

      \ \ \ \ \ \*\ \ \ \ \ screenshot\ of\.\

      \ \ \ \ \ \*\ @param\ categoryTag\ The\ category\ that\ this\ feedback\ report\
      falls\ under\.\ Before\ making\ any\

      \ \ \ \ \ \*\ \ \ \ \ changes\ to\ categories\ or\ adding\ a\ new\ category\
      tag\ to\ feedback\ collection,\ please\ ensure\

      \ \ \ \ \ \*\ \ \ \ \ the\ teams\ that\ operationalize\ feedback\ are\ aware\
      and\ supportive\.\ Contact:\ chrome\-gtech@\.\

      \ \ \ \ \ \*\ @param\ feedContext\ Feed\ specific\ parameters\ \(url,\ title,\
      etc\)\ to\ include\ with\ feedback\.\

      \ \ \ \ \ \*/\

      \ \ \ \ void\ showFeedback\(\

      \ \ \ \ \ \ \ \ \ \ \ \ Activity\ activity,\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ String\ url,\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ String\ categoryTag,\

      \ \ \ \ \ \ \ \ \ \ \ \ @Nullable\ Map<String,\ String>\ feedContext\);\

      \

      '
    replace: ''
- description: Remove the import used only by the deleted Feed feedback overload.
  regex:
    re_pattern: 'import\ java\.util\.Map;\

      \

      '
    replace: ''
