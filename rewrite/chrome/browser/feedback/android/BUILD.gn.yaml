# Reaper Android removes Discover-only feedback payload.
substitutions:
- description: Exclude the removed Interest Feed feedback source while retaining ordinary
    feedback.
  regex:
    re_pattern: '\ \ \ \ "java/src/org/chromium/chrome/browser/feedback/InterestFeedFeedbackSource\.java",\

      '
    replace: ''
