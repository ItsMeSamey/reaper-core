substitutions:
  - description: Refresh app-owned settings search labels from the current available index without rewriting user history.
    regex:
      re_pattern: "\\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ /\\*\\*\\ Persists\\ pending\\ user\\ mutations,\\ if\\ any\\.\\ \\*/\\\n\\ \\ \\ \\ public\\ void\\ flushIfDirty\\(\\)\\ \\{\\\n"
      replace: "    }\n\n    /** Returns recent selections with current app-owned labels, without rewriting history. */\n    public ArrayList<SettingsIndexData.Entry> getEntriesForDisplay(SettingsIndexData index) {\n        return resolveEntriesForDisplay(values(), index);\n    }\n\n    /** Refreshes labels from the available index; IDs, order and selection arguments stay intact. */\n    static ArrayList<SettingsIndexData.Entry> resolveEntriesForDisplay(\n            Iterable<SettingsIndexData.Entry> entries, SettingsIndexData index) {\n        ArrayList<SettingsIndexData.Entry> result = new ArrayList<>();\n        for (SettingsIndexData.Entry entry : entries) {\n            SettingsIndexData.Entry current = index.getEntry(entry.id);\n            if (current == null || !current.isSearchable) continue;\n            result.add(\n                    new SettingsIndexData.Entry.Builder(entry)\n                            .setTitle(current.title)\n                            .setSummary(current.summary)\n                            .setHeader(current.header)\n                            .build());\n        }\n        return result;\n    }\n\n    /** Persists pending user mutations, if any. */\n    public void flushIfDirty() {\n"
