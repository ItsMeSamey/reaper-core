      \ \ \ \ "android/java/src/org/chromium/chrome/browser/tabmodel/RecordingTabCreatorManager\.java",\

      \ \ \ \ "android/java/src/org/chromium/chrome/browser/tabmodel/StubTabModel\.java",\

      \ \ \ \ "android/java/src/org/chromium/chrome/browser/tabmodel/SupportedProfileType\.java",\

      \ \ \ \ "android/java/src/org/chromium/chrome/browser/tabmodel/TabCloseType\.java",\

      \ \ \ \ "android/java/src/org/chromium/chrome/browser/tabmodel/TabClosingSource\.java",\

