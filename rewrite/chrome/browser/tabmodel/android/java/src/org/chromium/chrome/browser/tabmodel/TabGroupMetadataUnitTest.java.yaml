    replace: "        } finally {\n            parcel.recycle();\n        }\n    }\n    @Test\n    public void splitMetadataSurvivesRealParcelWithRatioAndOrder() {\n        SplitInfo split = new SplitInfo(new Token(8, 9), 2, 1, SplitInfo.STACKED, 0.37);\n        TabGroupMetadata original = new TabGroupMetadata(SELECTED_TAB_ID, SOURCE_WINDOW_INDEX,\n                TAB_GROUP_ID, TAB_IDS_TO_URLS, TAB_GROUP_COLOR, TAB_GROUP_TITLE, MHTML_TAB_TITLE,\n                TAB_GROUP_COLLAPSED, IS_GROUP_SHARED, IS_INCOGNITO, List.of(split));\n        Parcel parcel = Parcel.obtain();\n        try {\n            parcel.writeBundle(original.toBundle());\n            parcel.setDataPosition(0);\n            TabGroupMetadata restored = TabGroupMetadata.maybeCreateFromBundle(\n                    parcel.readBundle(getClass().getClassLoader()));\n            assertThat(restored).isNotNull();\n            assertThat(restored.splits).containsExactly(split);\n            assertThat(restored).isEqualTo(original);\n        } finally {\n            parcel.recycle();\n        }\n    }\n\n    @Test\n    public void malformedSplitMetadataDoesNotDropTransferredTabs() {\n        Bundle bundle = mTabGroupMetadata.toBundle();\n        Bundle split = new Bundle();\n        split.putBundle(\"token\", new Token(8, 9).toBundle());\n        split.putInt(\"first\", 1);\n        split.putInt(\"second\", 2);\n        split.putInt(\"layout\", SplitInfo.SIDE_BY_SIDE);\n        split.putDouble(\"ratio\", Double.NaN);\n        bundle.putParcelableArrayList(\"splitCollections\", new ArrayList<>(List.of(split)));\n        TabGroupMetadata restored = TabGroupMetadata.maybeCreateFromBundle(bundle);\n        assertThat(restored).isNotNull();\n        assertThat(restored.splits).isEmpty();\n        assertThat(restored.tabIdsToUrls).containsExactlyElementsIn(TAB_IDS_TO_URLS).inOrder();\n    }\n\n    @Test\n    public void splitCannotReferToTabOutsideTransferredGroup() {\n        Bundle bundle = mTabGroupMetadata.toBundle();\n        Bundle split = new Bundle();\n        split.putBundle(\"token\", new Token(8, 9).toBundle());\n        split.putInt(\"first\", 1);\n        split.putInt(\"second\", 999);\n        split.putInt(\"layout\", SplitInfo.SIDE_BY_SIDE);\n        split.putDouble(\"ratio\", 0.5);\n        bundle.putParcelableArrayList(\"splitCollections\", new ArrayList<>(List.of(split)));\n        TabGroupMetadata restored = TabGroupMetadata.maybeCreateFromBundle(bundle);\n        assertThat(restored).isNotNull();\n        assertThat(restored.splits).isEmpty();\n        assertThat(restored.tabIdsToUrls).hasSize(TAB_IDS_TO_URLS.size());\n    }\n\n}\n"
