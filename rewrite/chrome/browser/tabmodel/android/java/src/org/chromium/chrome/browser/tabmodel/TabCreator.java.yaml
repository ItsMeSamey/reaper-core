substitutions:
- description: Add safe virtual container route with exact ordinary empty-ID forwarding
  regex:
    pattern: "    /**\n     * Creates a new tab and posts to UI.\n     *\n     * @param loadUrlParams parameters of the url\
      \ load.\n     * @param title The title to use for a lazily loaded tab.\n"
    replace: "    /**\n     * Creates a fresh tab in the requested storage container at the restore position.\n     *\n  \
      \   * <p>Creators without container support must not substitute Default storage for a named ID.\n     *\n     * @return\
      \ The new tab, or null if this creator cannot use the requested container.\n     */\n    default @Nullable Tab createNewTabInContainer(\n\
      \            LoadUrlParams loadUrlParams,\n            @TabLaunchType int type,\n            String containerId,\n \
      \           int position) {\n        if (containerId.isEmpty()) {\n            return createNewTab(loadUrlParams, type,\
      \ null, position);\n        }\n        return null;\n    }\n\n    /**\n     * Creates a new tab and posts to UI.\n \
      \    *\n     * @param loadUrlParams parameters of the url load.\n     * @param title The title to use for a lazily loaded\
      \ tab.\n"
  count: 1
