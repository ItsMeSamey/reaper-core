# Connect Android split collections to model and transfer APIs.
substitutions:
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ tabModel\.setTabGroupTitle\(tabGroupId,\ tabGroupTitle\);\

      \ \ \ \ \ \ \ \ if\ \(shouldApplyCollapse\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ tabModel\.setTabGroupCollapsed\(tabGroupId,\ tabGroupCollapsed,\ /\*\ animate=\ \*/\ false\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Checks\ to\ see\ if\ any\ tab\ in\ a\ list\ of\ tabs\ is\ in\ a\ tab\ group\.\

      '
    replace: "        tabModel.setTabGroupTitle(tabGroupId, tabGroupTitle);\n        if (shouldApplyCollapse) {\n            tabModel.setTabGroupCollapsed(tabGroupId, tabGroupCollapsed, /* animate= */ false);\n        }\n        // Only recreate saved real pairs after all group members reached the destination model.\n        // Missing, reordered, cross-profile or partially transferred pairs remain ordinary tabs.\n        for (SplitInfo split : tabGroupMetadata.splits) tabModel.restoreSplit(split);\n    }\n\n    /**\n     * Checks to see if any tab in a list of tabs is in a tab group.\n"
