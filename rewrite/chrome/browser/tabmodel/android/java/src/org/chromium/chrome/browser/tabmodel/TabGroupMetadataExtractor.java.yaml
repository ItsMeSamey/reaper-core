# Connect Android split collections to model and transfer APIs.
substitutions:
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\

      \ \ \ \ \ \ \ \ //\ If\ the\ tab\ group\ is\ collapsed,\ do\ not\ select\ any\ tab\ within\ the\ group\.\

      \ \ \ \ \ \ \ \ if\ \(tabGroupCollapsed\)\ selectedTabId\ =\ Tab\.INVALID_TAB_ID;\

      \

      \ \ \ \ \ \ \ \ //\ 4\.\ Create\ and\ populate\ TabGroupMetadata\ with\ data\ gathered\ above\.\

      \ \ \ \ \ \ \ \ return\ new\ TabGroupMetadata\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ selectedTabId,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ sourceWindowIndex,\

      '
    replace: "\n        // If the tab group is collapsed, do not select any tab within the group.\n        if (tabGroupCollapsed) selectedTabId = Tab.INVALID_TAB_ID;\n\n        java.util.Map<Token, SplitInfo> splits = new java.util.LinkedHashMap<>();\n        java.util.Set<Integer> groupIds = new java.util.HashSet<>();\n        for (Tab tab : groupedTabs) groupIds.add(tab.getId());\n        for (Tab tab : groupedTabs) {\n            SplitInfo split = tabModel.getSplitInfoForTab(tab.getId());\n            if (split != null && groupIds.contains(split.getFirstTabId())\n                    && groupIds.contains(split.getSecondTabId())) {\n                splits.put(split.getToken(), split);\n            }\n        }\n        // 4. Create and populate TabGroupMetadata with data gathered above.\n        return new TabGroupMetadata(\n                selectedTabId,\n                sourceWindowIndex,\n"
- description: Connect Android split collection model, events and transfer semantics
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tabGroupTitle,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mhtmlTabTitle,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ tabGroupCollapsed,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ isGroupShared,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ firstTab\.isIncognitoBranded\(\)\);\

      \ \ \ \ \}\

      \

      \ \ \ \ private\ static\ boolean\ isMhtmlUrl\(String\ url\)\ \{\

      \ \ \ \ \ \ \ \ String\ scheme\ =\ ExternalNavigationHandler\.getSanitizedUrlScheme\(url\);\

      '
    replace: "                tabGroupTitle,\n                mhtmlTabTitle,\n                tabGroupCollapsed,\n                isGroupShared,\n                firstTab.isIncognitoBranded(), new ArrayList<>(splits.values()));\n    }\n\n    private static boolean isMhtmlUrl(String url) {\n        String scheme = ExternalNavigationHandler.getSanitizedUrlScheme(url);\n"
