substitutions:
- description: Preserve recorder attempt ordering and forward exact identity/index through delegate interface
  regex:
    pattern: "    @Override\n    public @Nullable Tab createNewTab(\n            LoadUrlParams loadUrlParams,\n          \
      \  String title,\n"
    replace: "    @Override\n    public @Nullable Tab createNewTabInContainer(\n            LoadUrlParams loadUrlParams,\n\
      \            @TabLaunchType int type,\n            String containerId,\n            int position) {\n        assertInitialized();\n\
      \        recordNewTab(loadUrlParams.getUrl());\n        return mDelegate.createNewTabInContainer(loadUrlParams, type,\
      \ containerId, position);\n    }\n\n    @Override\n    public @Nullable Tab createNewTab(\n            LoadUrlParams\
      \ loadUrlParams,\n            String title,\n"
  count: 1
