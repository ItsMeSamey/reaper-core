      '
    replace: "     * @return the bundle {@link Bundle} stores the TabGroupMetadata properties.\n     */\n    public Bundle toBundle() {\n        Bundle bundle = new Bundle();\n        ArrayList<Bundle> splitBundles = new ArrayList<>();\n        for (SplitInfo split : splits) {\n            Bundle value = new Bundle();\n            value.putBundle(\"token\", split.getToken().toBundle());\n            value.putInt(\"first\", split.getFirstTabId());\n            value.putInt(\"second\", split.getSecondTabId());\n            value.putInt(\"layout\", split.getLayout());\n            value.putDouble(\"ratio\", split.getRatio());\n            splitBundles.add(value);\n        }\n        bundle.putParcelableArrayList(KEY_SPLITS, splitBundles);\n        bundle.putInt(KEY_SELECTED_TAB_ID, selectedTabId);\n        bundle.putInt(KEY_SOURCE_WINDOW_ID, sourceWindowId);\n        bundle.putBundle(KEY_TAB_GROUP_ID, tabGroupId.toBundle());\n        bundle.putSerializable(KEY_TAB_IDS_TO_URLS, tabIdsToUrls);\n"
