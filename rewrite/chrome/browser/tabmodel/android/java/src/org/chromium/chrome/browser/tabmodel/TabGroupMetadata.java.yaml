      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ @param\ bundle\ Bundle\ to\ be\ parsed\.\

      '
    replace: "        bundle.putBoolean(KEY_TAB_GROUP_COLLAPSED, tabGroupCollapsed);\n        bundle.putBoolean(KEY_IS_GROUP_SHARED, isGroupShared);\n        bundle.putBoolean(KEY_IS_INCOGNITO, isIncognito);\n        return bundle;\n    }\n\n    private static List<SplitInfo> readSplits(\n            Bundle bundle, ArrayList<Map.Entry<Integer, String>> tabs) {\n        ArrayList<Bundle> encoded = bundle.getParcelableArrayList(KEY_SPLITS);\n        if (encoded == null || encoded.size() > tabs.size() / 2) return List.of();\n        List<SplitInfo> result = new ArrayList<>();\n        java.util.Set<Integer> members = new java.util.HashSet<>();\n        java.util.Set<Integer> validTabs = new java.util.HashSet<>();\n        java.util.Set<Token> tokens = new java.util.HashSet<>();\n        for (Map.Entry<Integer, String> tab : tabs) validTabs.add(tab.getKey());\n        for (Bundle value : encoded) {\n            if (value == null || !value.containsKey(\"first\") || !value.containsKey(\"second\")\n                    || !value.containsKey(\"layout\") || !value.containsKey(\"ratio\")) continue;\n            Token token = Token.maybeCreateFromBundle(value.getBundle(\"token\"));\n            int first = value.getInt(\"first\");\n            int second = value.getInt(\"second\");\n            if (token == null || !validTabs.contains(first) || !validTabs.contains(second)\n                    || members.contains(first) || members.contains(second) || tokens.contains(token)) {\n                continue;\n            }\n            try {\n                SplitInfo split = new SplitInfo(token, first, second,\n                        value.getInt(\"layout\"), value.getDouble(\"ratio\"));\n                result.add(split);\n                tokens.add(token);\n                members.add(first);\n                members.add(second);\n            } catch (IllegalArgumentException invalid) {\n                // Old or malformed split metadata must never discard the actual transferred tabs.\n            }\n        }\n        return result;\n    }\n\n    /**\n     * @param bundle Bundle to be parsed.\n"
