- description: validate exact Android picker document tab profile and active owning model
  regex:
    re_pattern: 'void\ FileSelectHelper::OnTabDeactivated\(tabs::TabInterface\*\ tab\)\ \{\

      \ \ RunFileChooserEnd\(\);\

      \}\

      '
    replace: "void FileSelectHelper::OnTabDeactivated(tabs::TabInterface* tab) {\n  RunFileChooserEnd();\n}\n\n#if BUILDFLAG(IS_ANDROID)\nvoid FileSelectHelper::OnVisibilityChanged(content::Visibility visibility) {\n  if (android_file_picker_request_ && !android_file_picker_started_ &&\n      visibility == content::Visibility::HIDDEN) {\n    RunFileChooserEnd();\n  }\n}\n\nvoid FileSelectHelper::OnAndroidTabHidden(tabs::TabInterface* tab) {\n  // A launched OS picker naturally hides its owner. Only preparation is\n  // canceled on hide; actual tab deactivation remains a cancellation above.\n  if (android_file_picker_request_ && !android_file_picker_started_) {\n    RunFileChooserEnd();\n  }\n}\n\nbool FileSelectHelper::IsAndroidPickerOwnerValid() const {\n  auto* document = requesting_document_.AsRenderFrameHostIfValid();\n  if (!document || !document->IsActive() || document != render_frame_host_ ||\n      !web_contents_ ||\n      WebContents::FromRenderFrameHost(document) != web_contents_ ||\n      !IsValidProfile(profile_) ||\n      Profile::FromBrowserContext(web_contents_->GetBrowserContext()) !=\n          profile_) {\n    return false;\n  }\n  auto* tab = requesting_tab_.get();\n  if (!tab) {\n    return false;\n  }\n  if (android_extension_picker_request_) {\n    auto* browser = requesting_extension_browser_.get();\n    auto* tab_list = browser ? TabListInterface::From(browser) : nullptr;\n    if (!browser || !tab_list ||\n        GetAndroidExtensionPickerBrowser(web_contents_, profile_) !=\n                        browser ||\n        tab_list->GetActiveTab() != tab ||\n        browser->GetProfile() != tab->GetProfile() ||\n        !web_contents_->GetTopLevelNativeWindow()) {\n      return false;\n    }\n  } else if (TabAndroid::FromWebContents(web_contents_) != tab ||\n             tab->GetContents() != web_contents_ || tab->GetProfile() != profile_) {\n    return false;\n  }\n  auto* model = TabModelList::GetTabModelForTabAndroid(\n      TabAndroid::FromTabInterface(tab));\n  return model && model->GetProfile() == tab->GetProfile() &&\n         model->IsActiveModel() && model->GetActiveTab() == tab;\n}\n#endif\n"
