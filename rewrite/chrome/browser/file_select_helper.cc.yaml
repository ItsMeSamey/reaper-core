- description: resolve registered Android extension picker host to its exact factory window
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      std::u16string\ GetDisplayName'
    replace: "#if BUILDFLAG(IS_ANDROID)\nBrowserWindowInterface* GetAndroidExtensionPickerBrowser(\n    content::WebContents* contents,\n    Profile* profile) {\n#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n  auto* registry = extensions::ExtensionHostRegistry::Get(profile);\n  auto* host = registry ? registry->GetExtensionHostForPrimaryMainFrame(\n                              contents->GetPrimaryMainFrame())\n                        : nullptr;\n  if (!host || host->host_contents() != contents || !host->extension() ||\n      (host->extension_host_type() !=\n           extensions::mojom::ViewType::kExtensionPopup &&\n       host->extension_host_type() !=\n           extensions::mojom::ViewType::kExtensionSidePanel) ||\n      !extensions::ExtensionRegistry::Get(profile)->enabled_extensions().Contains(\n          host->extension()->id())) {\n    return nullptr;\n  }\n  // Popup/side-panel hosts are Chrome ExtensionViewHosts. Their delegate keeps\n  // the exact weak browser or tab supplied by the factory, never last-focused.\n  auto* controller = static_cast<extensions::ExtensionViewHost*>(host)\n                         ->GetExtensionWindowController();\n  auto* browser = controller ? controller->GetBrowserWindowInterface() : nullptr;\n  if (!browser || !browser->GetWindow()) {\n    return nullptr;\n  }\n  Profile* owner_profile = browser->GetProfile();\n  // Spanning incognito extensions intentionally execute in the original\n  // profile; require that precise factory-supported relationship and grant.\n  if (owner_profile != profile &&\n      (!owner_profile->IsOffTheRecord() ||\n       owner_profile->GetOriginalProfile() != profile ||\n       extensions::IncognitoInfo::IsSplitMode(host->extension()) ||\n       !extensions::util::IsIncognitoEnabled(host->extension()->id(),\n                                            owner_profile))) {\n    return nullptr;\n  }\n  return browser;\n#else\n  return nullptr;\n#endif\n}\n\nstd::u16string GetDisplayName"
- description: retire Android picker when its owning selector model is deactivated
  regex:
    re_pattern: FileSelectHelper::FileSelectHelper\(Profile\*\ profile\)
    replace: "#if BUILDFLAG(IS_ANDROID)\n// Model selection is distinct from Activity visibility and from the current\n// tab retained by each regular/incognito model. Retire the original request\n// when its model loses selection, even if that model is selected again later.\nclass FileSelectHelper::AndroidPickerModelObserver : public TabModelObserver {\n public:\n  AndroidPickerModelObserver(FileSelectHelper* helper, TabModel* model)\n      : helper_(helper), model_(model) {\n    model_->AddObserver(this);\n  }\n  ~AndroidPickerModelObserver() override {\n    if (model_) {\n      model_->RemoveObserver(this);\n    }\n  }\n  void OnWillActiveStateChange(TabModel& model, bool active) override {\n    if (!active) {\n      helper_->RunFileChooserEnd();\n    }\n  }\n  void OnTabModelDestroyed(TabModel& model) override {\n    // Shutdown can be dispatched by the model's last JNI observer bridge.\n    // Forget the dying model before the owner deletes this observer.\n    model_ = nullptr;\n    helper_->RunFileChooserEnd();\n  }\n\n private:\n  raw_ptr<FileSelectHelper> helper_;\n  raw_ptr<TabModel> model_;\n};\n#endif\n\nFileSelectHelper::FileSelectHelper(Profile* profile)"
