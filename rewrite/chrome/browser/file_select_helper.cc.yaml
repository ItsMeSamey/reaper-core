# Android split pane request ownership and dialog placement.
substitutions:
- description: 'Strip tracking metadata from uploaded images.


    NotifyListenerAndEnd is the point where the chosen files are

    handed to the renderer. Therefore we override this point to select the picked

    JPEG files, and pass to our metadata stripping pipeline.'
  preempt_function_impl:
    function_name: FileSelectHelper::NotifyListenerAndEnd
    code: "if (brave::MaybeStripImageMetadataForUpload(\n        image_metadata_processed_, temporary_files_, list,\n        base::BindOnce(&FileSelectHelper::NotifyListenerAndEnd, this))) {\n  return;\n}"
- description: 'Recursively delete Brave-owned upload-strip temp directories.


    FileSelectHelper::DeleteFiles uses DeleteFile, which cannot remove a

    non-empty directory. The metadata stripper creates one temporary root directory

    which contains K sub-directories where each sub-directory is mapped to one stripped image.

    This method helps to recursively delete only the temporary root directory we created for a stripping stage.'
  preempt_function_impl:
    function_name: DeleteFiles
    code: brave::MaybeDeleteImageMetadataStripperTemporaryDir(paths);
