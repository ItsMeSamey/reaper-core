# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/apps/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "//pdf:features",\

      \ \ \ \ \ \ "//ui/events:gesture_detection",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ source_set\("interactive_ui_tests"\)\ \{\

      '
    replace: "      \"//pdf:features\",\n      \"//ui/events:gesture_detection\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//chrome/browser/autocomplete:aim_eligibility_service\",\n        \"//chrome/browser/glic/test_support\",\n      ]\n    }\n  }\n\n  source_set(\"interactive_ui_tests\") {\n"
