# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/tab_ui/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//ui/android:ui_no_recycler_view_java",\

      \ \ \ \ "//url:gurl_java",\

      \ \ \]\

      \ \ resources_package\ =\ "org\.chromium\.chrome\.browser\.tab_ui"\

      \}\

      \

      '
    replace: "    \"//ui/android:ui_no_recycler_view_java\",\n    \"//url:gurl_java\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/actor/android:java\" ]\n  }\n  resources_package = \"org.chromium.chrome.browser.tab_ui\"\n}\n\n"
- description: "Reviewed resource8 after538 source 9/1: reviewed literal edit"
  regex:
    re_pattern: "import\\(\"//build/config/android/rules\\.gni\"\\)"
    replace: "import(\"//build/config/android/copy_ex.gni\")\nimport(\"//build/config/android/rules.gni\")"
  count: 1
- description: "Reviewed resource8 after538 source 9/2: reviewed literal edit"
  regex:
    re_pattern: "android_resources\\(\"java_resources\"\\)\\ \\{\\\n\\ \\ sources\\ =\\ \\[\\\n\\ \\ \\ \\ \"java/res/drawable/empty_thumbnail_background\\.xml\",\\\n\\ \\ \\ \\ \"java/res/drawable/ic_tab_placeholder\\.xml\",\\\n\\ \\ \\ \\ \"java/res/drawable/iph_drag_and_drop_animated_drawable\\.xml\",\\\n\\ \\ \\ \\ \"java/res/drawable/tab_strip_favicon_circle\\.xml\",\\\n\\ \\ \\ \\ \"java/res/drawable/tabstrip_favicon_background\\.xml\",\\\n\\ \\ \\ \\ \"java/res/values/attrs\\.xml\",\\\n\\ \\ \\ \\ \"java/res/values/colors\\.xml\",\\\n\\ \\ \\ \\ \"java/res/values/dimens\\.xml\",\\\n\\ \\ \\ \\ \"java/res/values/values\\.xml\",\\\n\\ \\ \\]\\\n\\ \\ deps\\ =\\ \\[\\\n\\ \\ \\ \\ \":java_strings_grd\",\\\n\\ \\ \\ \\ \"//chrome/browser/ui/android/strings:ui_strings_grd\",\\\n\\ \\ \\ \\ \"//components/browser_ui/strings/android:browser_ui_strings_grd\",\\\n\\ \\ \\ \\ \"//components/browser_ui/styles/android:java_resources\",\\\n\\ \\ \\]\\\n\\}"
    replace: "_tab_ui_resource_spec = {\n  sources = [\n    \"java/res/drawable/empty_thumbnail_background.xml\",\n    \"java/res/drawable/ic_tab_placeholder.xml\",\n    \"java/res/drawable/iph_drag_and_drop_animated_drawable.xml\",\n    \"java/res/drawable/tab_strip_favicon_circle.xml\",\n    \"java/res/drawable/tabstrip_favicon_background.xml\",\n    \"java/res/values/attrs.xml\",\n    \"java/res/values/colors.xml\",\n    \"java/res/values/dimens.xml\",\n    \"java/res/values/values.xml\",\n  ]\n  if (is_android) {\n    sources -= [ \"java/res/drawable/ic_tab_placeholder.xml\" ]\n  }\n}\n\n_tab_ui_resource_sources = _tab_ui_resource_spec.sources\n_tab_ui_resource_copy_deps = []\nif (is_android) {\n  _tab_ui_resource_sources = []\n  _tab_ui_resource_directories = []\n  foreach(_source, _tab_ui_resource_spec.sources) {\n    _directory = get_path_info(_source, \"dir\")\n    if (filter_include(_tab_ui_resource_directories, [ _directory ]) == []) {\n      _tab_ui_resource_directories += [ _directory ]\n    }\n    _root = \"$target_gen_dir/java_resources_selected/\" +\n            string_replace(_directory, \"/\", \"_\")\n    _qualifier = get_path_info(_directory, \"file\")\n    _file = get_path_info(_source, \"file\")\n    _tab_ui_resource_sources += [ \"$_root/$_qualifier/$_file\" ]\n  }\n  foreach(_directory, _tab_ui_resource_directories) {\n    _copy_target = \"copy_selected_tab_ui_\" +\n                   string_replace(_directory, \"/\", \"-\")\n    copy_ex(_copy_target) {\n      sources = filter_include(_tab_ui_resource_spec.sources, [ \"$_directory/*\" ])\n      _root = \"$target_gen_dir/java_resources_selected/\" +\n              string_replace(_directory, \"/\", \"_\")\n      _qualifier = get_path_info(_directory, \"file\")\n      dest = \"$_root/$_qualifier\"\n      outputs = process_file_template(sources, [ \"$dest/{{source_file_part}}\" ])\n      args = [ \"--clear\" ]\n    }\n    _tab_ui_resource_copy_deps += [ \":$_copy_target\" ]\n  }\n}\n\nandroid_resources(\"java_resources\") {\n  sources = _tab_ui_resource_sources\n  deps = [\n    \":java_strings_grd\",\n    \"//chrome/browser/ui/android/strings:ui_strings_grd\",\n    \"//components/browser_ui/strings/android:browser_ui_strings_grd\",\n    \"//components/browser_ui/styles/android:java_resources\",\n  ]\n  deps += _tab_ui_resource_copy_deps\n}"
  count: 1
