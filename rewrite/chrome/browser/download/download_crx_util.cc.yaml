- {"description":"Select a live exact-profile Android download prompt host","count":1,"regex":{"re_pattern":"\\ \\ if\\ \\(!web_contents\\)\\ \\{\\\n\\ \\ \\ \\ BrowserWindowInterface\\*\\ browser\\ =\\\n\\ \\ \\ \\ \\ \\ \\ \\ extensions::browser_window_util::GetLastActiveBrowserWithProfile\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\*profile,\\ false\\);\\\n\\ \\ \\ \\ if\\ \\(!browser\\)\\ \\{\\\n\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\ \\ \\ \\ \\ \\ //\\ TODO\\(crbug\\.com/474161414\\):\\ Implement\\ fallback\\ if\\ no\\ browser\\ is\\ found\\.\\\n\\ \\ \\ \\ \\ \\ //\\ Android\\ does\\ not\\ have\\ Browser\\ implementation\\ yet,\\ but\\ we\\ are\\ okay\\ with\\\n\\ \\ \\ \\ \\ \\ //\\ not\\ showing\\ an\\ installed\\ dialog\\ if\\ no\\ window\\ is\\ open\\.\\ The\\ caller\\\n\\ \\ \\ \\ \\ \\ //\\ handles\\ having\\ an\\ empty\\ ExtensionInstallPrompt\\.\\\n\\ \\ \\ \\ \\ \\ return\\ nullptr;\\\n\\#else\\\n\\ \\ \\ \\ \\ \\ browser\\ =\\ CreateBrowserWindow\\(BrowserWindowCreateParams\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ BrowserWindowInterface::TYPE_NORMAL,\\ profile,\\ true\\)\\);\\\n\\#endif\\\n\\ \\ \\ \\ \\}\\\n\\ \\ \\ \\ TabListInterface\\*\\ tab_list\\ =\\ TabListInterface::From\\(browser\\);\\\n\\ \\ \\ \\ web_contents\\ =\\ tab_list\\->GetActiveTab\\(\\)\\->GetContents\\(\\);\\\n\\ \\ \\}\\\n","replace":"#if BUILDFLAG(IS_ANDROID)\n  const auto can_use_prompt_host = [profile](content::WebContents* contents) {\n    return contents && !contents->IsBeingDestroyed() &&\n           contents->GetBrowserContext() == profile &&\n           contents->GetTopLevelNativeWindow();\n  };\n  if (!can_use_prompt_host(web_contents)) {\n    web_contents = nullptr;\n    // Keep the existing activation preference, skipping windows without a\n    // live prompt host in this exact profile.\n    ForEachCurrentBrowserWindowInterfaceOrderedByActivation(\n        [&](BrowserWindowInterface* browser) {\n          if (browser->GetProfile() != profile || browser->IsDeleteScheduled()) {\n            return true;\n          }\n          TabListInterface* tab_list = TabListInterface::From(browser);\n          if (!tab_list) {\n            return true;\n          }\n          auto* active_tab = tab_list->GetActiveTab();\n          if (!active_tab) {\n            return true;\n          }\n          content::WebContents* contents = active_tab->GetContents();\n          if (!can_use_prompt_host(contents)) {\n            return true;\n          }\n          web_contents = contents;\n          return false;\n        });\n  }\n  if (!web_contents) {\n    return nullptr;\n  }\n#else\n  if (!web_contents) {\n    BrowserWindowInterface* browser =\n        extensions::browser_window_util::GetLastActiveBrowserWithProfile(\n            *profile, false);\n    if (!browser) {\n#if BUILDFLAG(IS_ANDROID)\n      // TODO(crbug.com/474161414): Implement fallback if no browser is found.\n      // Android does not have Browser implementation yet, but we are okay with\n      // not showing an installed dialog if no window is open. The caller\n      // handles having an empty ExtensionInstallPrompt.\n      return nullptr;\n#else\n      browser = CreateBrowserWindow(BrowserWindowCreateParams(\n          BrowserWindowInterface::TYPE_NORMAL, profile, true));\n#endif\n    }\n    TabListInterface* tab_list = TabListInterface::From(browser);\n    web_contents = tab_list->GetActiveTab()->GetContents();\n  }\n#endif\n"}}
