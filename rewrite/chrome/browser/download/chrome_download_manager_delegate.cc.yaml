# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: chrome/browser/download/chrome_download_manager_delegate.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "chrome/browser/download/chrome_download_manager_delegate\.h"\

      \

      \#include\ <algorithm>\

      \#include\ <memory>\

      '
    replace: '// found in the LICENSE file.


      #include "chrome/browser/download/chrome_download_manager_delegate.h"

      #include "build/build_config.h"


      #include <algorithm>

      #include <memory>

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/download/chrome_download_manager_delegate.cc'
  regex:
    re_pattern: '\#include\ "base/task/task_runner\.h"\

      \#include\ "base/task/thread_pool\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "chrome/browser/browser_process\.h"\

      \#include\ "chrome/browser/download/download_core_service\.h"\

      \#include\ "chrome/browser/download/download_core_service_factory\.h"\

      '
    replace: '#include "base/task/task_runner.h"

      #include "base/task/thread_pool.h"

      #include "base/time/time.h"

      #include "chrome/browser/browser_process.h"

      #include "chrome/browser/download/download_core_service.h"

      #include "chrome/browser/download/download_core_service_factory.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/download/chrome_download_manager_delegate.cc'
  regex:
    re_pattern: '\#include\ "chrome/common/chrome_paths\.h"\

      \#include\ "chrome/common/pref_names\.h"\

      \#include\ "chrome/grit/generated_resources\.h"\

      \#include\ "components/actor/core/actor_features\.h"\

      \#include\ "components/actor/public/mojom/actor_types\.mojom\.h"\

      \#include\ "components/download/public/common/download_danger_type\.h"\

      \#include\ "components/download/public/common/download_features\.h"\

      \#include\ "components/download/public/common/download_interrupt_reasons\.h"\

      '
    replace: '#include "chrome/common/chrome_paths.h"

      #include "chrome/common/pref_names.h"

      #include "chrome/grit/generated_resources.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/actor/core/actor_features.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/actor/public/mojom/actor_types.mojom.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "components/download/public/common/download_danger_type.h"

      #include "components/download/public/common/download_features.h"

      #include "components/download/public/common/download_interrupt_reasons.h"

      '
- description: 'Android concrete AI source/provider removal: chrome/browser/download/chrome_download_manager_delegate.cc'
  regex:
    re_pattern: '\#include\ "third_party/blink/public/common/mime_util/mime_util\.h"\

      \#include\ "ui/android/window_android\.h"\

      \#else\

      \#include\ "chrome/browser/actor/actor_keyed_service\.h"\

      \#include\ "chrome/browser/actor/actor_task\.h"\

      \#include\ "chrome/browser/actor/execution_engine\.h"\

      \#include\ "chrome/browser/download/download_item_web_app_data\.h"\

      \#include\ "chrome/browser/ui/browser_window/public/browser_window_interface\.h"\

      \#include\ "chrome/browser/ui/browser_window/public/global_browser_collection\.h"\

      '
    replace: '#include "third_party/blink/public/common/mime_util/mime_util.h"

      #include "ui/android/window_android.h"

      #else

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/actor_keyed_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/actor_task.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/actor/execution_engine.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "chrome/browser/download/download_item_web_app_data.h"

      #include "chrome/browser/ui/browser_window/public/browser_window_interface.h"

      #include "chrome/browser/ui/browser_window/public/global_browser_collection.h"

      '
