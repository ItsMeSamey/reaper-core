# Android download UI policy and truthful transfer lifecycle.
substitutions:
- description: Build the Android extensions code with the core.
  count: 1
  regex:
    pattern: BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)
    replace: BUILDFLAG(IS_ANDROID) && BUILDFLAG(ENABLE_EXTENSIONS_CORE)
- description: Keep Android provider updates truthful regardless of optional browser UI policy
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\ \&\&\ BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\

      \ \ //\ On\ desktop\ Android,\ the\ extensions\ chrome\.download\.setUiOptions\(\)\ function\

      \ \ //\ can\ disable\ UI\ updates\.\

      \ \ //\ TODO\(crbug\.com/459823225\):\ Expand\ the\ IsDangerous\(\)\ check\ to\ other\

      \ \ //\ situations\ where\ UI\ should\ be\ forced\ on\.\

      \ \ const\ bool\ always_show_ui\ =\ item\->IsDangerous\(\);\

      \ \ if\ \(!should_notify\ \&\&\ !always_show_ui\ \&\&\ profile_\)\ \{\

      \ \ \ \ DownloadCoreService\*\ service\ =\

      \ \ \ \ \ \ \ \ DownloadCoreServiceFactory::GetForBrowserContext\(profile_\);\

      \ \ \ \ if\ \(service\ \&\&\ !service\->IsDownloadUiEnabled\(\)\)\ \{\

      \ \ \ \ \ \ return;\

      \ \ \ \ \}\

      \ \ \}\

      \#endif'
    replace: "  // Extension UI policy only controls optional browser messages on Android.\n  // Never suppress these data updates: the notification bridge must keep the\n  // foreground service/user-initiated job attached to a real active transfer\n  // and receive terminal states that retire its notification and bookkeeping."
