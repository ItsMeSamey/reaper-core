substitutions:
- description: Android Downloads exact-item reveal integration (1).
  regex:
    re_pattern: 'import\ org\.chromium\.components\.browser_ui\.widget\.gesture\.BackPressHandler;\

      import\ org\.chromium\.components\.browser_ui\.widget\.selectable_list\.SelectionDelegate;\

      import\ org\.chromium\.components\.feature_engagement\.Tracker;\

      import\ org\.chromium\.components\.offline_items_collection\.OfflineContentProvider;\

      import\ org\.chromium\.components\.offline_items_collection\.OfflineItem;\

      import\ org\.chromium\.ui\.modaldialog\.ModalDialogManager;\

      '
    replace: 'import org.chromium.components.browser_ui.widget.gesture.BackPressHandler;

      import org.chromium.components.browser_ui.widget.selectable_list.SelectionDelegate;

      import org.chromium.components.feature_engagement.Tracker;

      import org.chromium.components.offline_items_collection.ContentId;

      import org.chromium.components.offline_items_collection.OfflineContentProvider;

      import org.chromium.components.offline_items_collection.OfflineItem;

      import org.chromium.ui.modaldialog.ModalDialogManager;

      '
- description: Android Downloads exact-item reveal integration (2).
  regex:
    re_pattern: '\ \ \ \ private\ ViewGroup\ mMainView;\

      \

      \ \ \ \ private\ boolean\ mMuteFilterChanges;\

      \

      \ \ \ \ /\*\*\ Builds\ a\ \{@link\ DownloadManagerCoordinatorImpl\}\ instance\.\ \*/\

      \ \ \ \ public\ DownloadManagerCoordinatorImpl\(\

      '
    replace: "    private ViewGroup mMainView;\n\n    private boolean mMuteFilterChanges;\n    private boolean mDestroyed;\n\n    /** Builds a {@link DownloadManagerCoordinatorImpl} instance. */\n    public DownloadManagerCoordinatorImpl(\n"
- description: Android Downloads exact-item reveal integration (3).
  regex:
    re_pattern: '\ \ \ \ //\ DownloadManagerCoordinator\ implementation\.\

      \ \ \ \ @Override\

      \ \ \ \ public\ void\ destroy\(\)\ \{\

      \ \ \ \ \ \ \ \ mDeleteCoordinator\.destroy\(\);\

      \ \ \ \ \ \ \ \ mListCoordinator\.destroy\(\);\

      \ \ \ \ \ \ \ \ mToolbarCoordinator\.destroy\(\);\

      '
    replace: "    // DownloadManagerCoordinator implementation.\n    @Override\n    public void destroy() {\n        if (mDestroyed) return;\n        mDestroyed = true;\n        mDeleteCoordinator.destroy();\n        mListCoordinator.destroy();\n        mToolbarCoordinator.destroy();\n"
- description: Android Downloads exact-item reveal integration (4).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ try\ \(FilterChangeBlock\ block\ =\ new\ FilterChangeBlock\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mListCoordinator\.setSelectedFilter\(Filters\.fromUrl\(url\)\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      \ \ \ \ @Override\

      '
    replace: "        try (FilterChangeBlock block = new FilterChangeBlock()) {\n            mListCoordinator.setSelectedFilter(Filters.fromUrl(url));\n        }\n    }\n\n    @Override\n    public void revealItem(ContentId id, Callback<Boolean> callback) {\n        if (mDestroyed) {\n            callback.onResult(false);\n            return;\n        }\n        mToolbarCoordinator.handleBackPressed();\n        mListCoordinator.revealItem(id, callback);\n    }\n\n    @Override\n    public void cancelRevealItem() {\n        mListCoordinator.cancelRevealItem();\n    }\n\n    @Override\n"
- description: Android Downloads observer teardown guard and regression coverage (1).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mObservers\.addObserver\(observer\);\

      \ \ \ \ \ \ \ \ PostTask\.postTask\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TaskTraits\.UI_DEFAULT,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ observer\.onUrlChanged\(Filters\.toUrl\(mListCoordinator\.getSelectedFilter\(\)\)\)\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Override\

      '
    replace: "        mObservers.addObserver(observer);\n        PostTask.postTask(\n                TaskTraits.UI_DEFAULT,\n                () -> {\n                    // The page may detach or the coordinator may be destroyed before this task.\n                    if (mDestroyed || !mObservers.hasObserver(observer)) return;\n                    observer.onUrlChanged(Filters.toUrl(mListCoordinator.getSelectedFilter()));\n                });\n    }\n\n    @Override\n"
