substitutions:
- description: Android Downloads exact-item reveal integration (1).
  regex:
    re_pattern: 'import\ org\.chromium\.components\.browser_ui\.util\.DimensionCompat;\

      import\ org\.chromium\.components\.browser_ui\.widget\.gesture\.BackPressHandler;\

      import\ org\.chromium\.components\.browser_ui\.widget\.selectable_list\.SelectionDelegate;\

      import\ org\.chromium\.components\.offline_items_collection\.OfflineContentProvider;\

      import\ org\.chromium\.components\.offline_items_collection\.OfflineItem;\

      import\ org\.chromium\.ui\.modaldialog\.ModalDialogManager;\

      '
    replace: 'import org.chromium.components.browser_ui.util.DimensionCompat;

      import org.chromium.components.browser_ui.widget.gesture.BackPressHandler;

      import org.chromium.components.browser_ui.widget.selectable_list.SelectionDelegate;

      import org.chromium.components.offline_items_collection.ContentId;

      import org.chromium.components.offline_items_collection.OfflineContentProvider;

      import org.chromium.components.offline_items_collection.OfflineItem;

      import org.chromium.ui.modaldialog.ModalDialogManager;

      '
- description: Android Downloads exact-item reveal integration (2).
  regex:
    re_pattern: '\ \ \ \ private\ ViewGroup\ mMainView;\

      \ \ \ \ private\ View\ mEmptyView;\

      \ \ \ \ private\ int\ mWindowHeight;\

      \ \ \ \ private\ final\ int\ mDownloadStorageSummaryHeightPx;\

      \ \ \ \ private\ final\ int\ mSelectableListToolbarHeightPx;\

      \

      '
    replace: "    private ViewGroup mMainView;\n    private View mEmptyView;\n    private int mWindowHeight;\n    private boolean mDestroyed;\n    private final int mDownloadStorageSummaryHeightPx;\n    private final int mSelectableListToolbarHeightPx;\n\n"
- description: Android Downloads exact-item reveal integration (3).
  regex:
    re_pattern: '\

      \ \ \ \ /\*\*\ Tears\ down\ this\ coordinator\.\ \*/\

      \ \ \ \ public\ void\ destroy\(\)\ \{\

      \ \ \ \ \ \ \ \ mFilterCoordinator\.destroy\(\);\

      \ \ \ \ \ \ \ \ mMediator\.destroy\(\);\

      \ \ \ \ \ \ \ \ mRenameDialogManager\.destroy\(\);\

      '
    replace: "\n    /** Tears down this coordinator. */\n    public void destroy() {\n        if (mDestroyed) return;\n        mDestroyed = true;\n        mFilterCoordinator.destroy();\n        mMediator.destroy();\n        mRenameDialogManager.destroy();\n"
- description: Android Downloads exact-item reveal integration (4).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mFilterCoordinator\.setSelectedFilter\(filter\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\ @return\ The\ currently\ selected\ filter\.\ \*/\

      \ \ \ \ public\ @FilterType\ int\ getSelectedFilter\(\)\ \{\

      \ \ \ \ \ \ \ \ return\ mFilterCoordinator\.getSelectedFilter\(\);\

      '
    replace: "        mFilterCoordinator.setSelectedFilter(filter);\n    }\n\n    /** Selects the requested file download and requests scrolling its row into view. */\n    public void revealItem(ContentId id, Callback<Boolean> callback) {\n        if (mDestroyed) {\n            callback.onResult(false);\n            return;\n        }\n        if (mSearchBarCoordinator != null) mSearchBarCoordinator.clearText();\n        setSearchQuery(null);\n        setSelectedFilter(FilterType.NONE);\n        mMediator.revealItem(id, callback, mListView::scrollToItem);\n    }\n\n    /** Completes any pending reveal request false. */\n    public void cancelRevealItem() {\n        mMediator.cancelRevealItem();\n    }\n\n    /** @return The currently selected filter. */\n    public @FilterType int getSelectedFilter() {\n        return mFilterCoordinator.getSelectedFilter();\n"
