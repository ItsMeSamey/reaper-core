substitutions:
- description: Android Downloads exact-item reveal integration (1).
  regex:
    re_pattern: 'import\ org\.chromium\.components\.browser_ui\.widget\.displaystyle\.HorizontalDisplayStyle;\

      import\ org\.chromium\.components\.browser_ui\.widget\.displaystyle\.UiConfig;\

      import\ org\.chromium\.components\.browser_ui\.widget\.displaystyle\.ViewResizerUtil;\

      import\ org\.chromium\.ui\.edge_to_edge\.EdgeToEdgePadAdjuster;\

      import\ org\.chromium\.ui\.modelutil\.ForwardingListObservable;\

      import\ org\.chromium\.ui\.modelutil\.PropertyModelChangeProcessor;\

      import\ org\.chromium\.ui\.modelutil\.RecyclerViewAdapter;\

      \

      /\*\*\

      \ \*\ The\ View\ component\ of\ a\ DateOrderedList\.\ This\ takes\ the\ DateOrderedListModel\ and\ creates\ the\ glue\

      '
    replace: "import org.chromium.components.browser_ui.widget.displaystyle.HorizontalDisplayStyle;\nimport org.chromium.components.browser_ui.widget.displaystyle.UiConfig;\nimport org.chromium.components.browser_ui.widget.displaystyle.ViewResizerUtil;\nimport org.chromium.components.offline_items_collection.ContentId;\nimport org.chromium.ui.edge_to_edge.EdgeToEdgePadAdjuster;\nimport org.chromium.ui.modelutil.ForwardingListObservable;\nimport org.chromium.ui.modelutil.PropertyModelChangeProcessor;\nimport org.chromium.ui.modelutil.RecyclerViewAdapter;\n\nimport java.util.Objects;\n\n/**\n * The View component of a DateOrderedList. This takes the DateOrderedListModel and creates the glue\n"
- description: Android Downloads exact-item reveal integration (2).
  regex:
    re_pattern: '\ \ \ \ private\ final\ GridLayoutManager\ mGridLayoutManager;\

      \ \ \ \ private\ final\ UiConfig\ mUiConfig;\

      \ \ \ \ private\ final\ Runnable\ mOnConfigurationChangedCallback;\

      \

      \ \ \ \ private\ final\ @Nullable\ EdgeToEdgePadAdjuster\ mEdgeToEdgePadAdjuster;\

      \

      '
    replace: "    private final GridLayoutManager mGridLayoutManager;\n    private final UiConfig mUiConfig;\n    private final Runnable mOnConfigurationChangedCallback;\n    private boolean mDestroyed;\n\n    private final @Nullable EdgeToEdgePadAdjuster mEdgeToEdgePadAdjuster;\n\n"
- description: Android Downloads exact-item reveal integration (3).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ return\ mView;\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\ Destroy\ this\ \{@link\ DateOrderedListView\}\.\ \*/\

      \ \ \ \ public\ void\ destroy\(\)\ \{\

      \ \ \ \ \ \ \ \ if\ \(mEdgeToEdgePadAdjuster\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ mEdgeToEdgePadAdjuster\.destroy\(\);\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: "        return mView;\n    }\n\n    /** Issues a scroll request for the exact item, accounting for all decoration headers. */\n    public boolean scrollToItem(ContentId id) {\n        if (mDestroyed) return false;\n        for (int i = 0; i < mModel.size(); i++) {\n            ListItem item = mModel.get(i);\n            if (item instanceof OfflineItemListItem\n                    && Objects.equals(((OfflineItemListItem) item).item.id, id)) {\n                mGridLayoutManager.scrollToPositionWithOffset(i, 0);\n                return true;\n            }\n        }\n        return false;\n    }\n\n    /** Destroy this {@link DateOrderedListView}. */\n    public void destroy() {\n        mDestroyed = true;\n        if (mEdgeToEdgePadAdjuster != null) {\n            mEdgeToEdgePadAdjuster.destroy();\n        }\n"
