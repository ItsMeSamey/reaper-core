    replace: "                mDownloadCoordinator.getBackPressHandlers());\n\n        mDownloadCoordinator.updateForUrl(UrlConstants.DOWNLOADS_URL);\n    }\n\n    /** Holds the actual initial source callback instead of faking a populated list model. */\n    private static class DelayedOfflineContentProvider extends StubbedOfflineContentProvider {\n        private Callback<ArrayList<OfflineItem>> mPendingItems;\n\n        @Override\n        public void getAllItems(Callback<ArrayList<OfflineItem>> callback) {\n            Assert.assertNull(mPendingItems);\n            mPendingItems = callback;\n        }\n\n        void releaseItems(List<OfflineItem> items) {\n            Assert.assertNotNull(mPendingItems);\n            Callback<ArrayList<OfflineItem>> callback = mPendingItems;\n            mPendingItems = null;\n            getItems().clear();\n            getItems().addAll(items);\n            callback.onResult(new ArrayList<>(items));\n        }\n    }\n\n    @After\n    public void destroyRevealTestCoordinator() {\n        if (mDestroyRevealCoordinator) {\n            ThreadUtils.runOnUiThreadBlocking(this::destroyRevealCoordinator);\n        }\n    }\n\n    private void destroyRevealCoordinator() {\n        if (mDownloadCoordinator == null) return;\n        mDownloadCoordinator.destroy();\n        mDownloadCoordinator = null;\n    }\n\n    private void setUpRevealUi(boolean inlineSearchBar) {\n        mDestroyRevealCoordinator = true;\n        setUpUi(\n                /* showDangerousItems= */ false,\n                inlineSearchBar,\n                /* autoFocusSearchBox= */ false,\n                /* forcePaginationHeaders= */ true);\n    }\n\n    private static ArrayList<OfflineItem> createRevealItems(int count) {\n        ArrayList<OfflineItem> items = new ArrayList<>();\n        for (int i = 0; i < count; i++) {\n            // Distinct days force DateListPaginator to stop at multiple page boundaries.\n            OfflineItem item =\n                    StubbedProvider.createOfflineItem(\n                            \"reveal-guid-\" + i,\n                            JUnitTestGURLs.URL_1,\n                            OfflineItemState.COMPLETE,\n                            1024,\n                            \"reveal item \" + i,\n                            \"/data/fake_path/Downloads/reveal-\" + i,\n                            1_700_000_000_000L - i * 86_400_000L,\n                            1024,\n                            OfflineItemFilter.OTHER);\n            item.id = new ContentId(\"download\", \"reveal-guid-\" + i);\n            items.add(item);\n        }\n        return items;\n    }\n\n    private void setRevealItems(List<OfflineItem> items) {\n        mStubbedOfflineContentProvider.getItems().clear();\n        mStubbedOfflineContentProvider.getItems().addAll(items);\n    }\n\n    private View findAttachedRevealRow(OfflineItem item) {\n        RecyclerView list = (RecyclerView) mDownloadCoordinator.getListViewForTesting();\n        for (int i = 0; i < list.getChildCount(); i++) {\n            View row = list.getChildAt(i);\n            ArrayList<View> matches = new ArrayList<>();\n            row.findViewsWithText(matches, item.title, View.FIND_VIEWS_WITH_TEXT);\n            for (View match : matches) {\n                if (match instanceof TextView\n                        && item.title.contentEquals(((TextView) match).getText())\n                        && isDisplayed().matches(match)) {\n                    Rect visible = new Rect();\n                    Rect viewport = new Rect();\n                    if (match.getGlobalVisibleRect(visible)\n                            && list.getGlobalVisibleRect(viewport)\n                            && Rect.intersects(visible, viewport)) {\n                        return row;\n                    }\n                }\n            }\n        }\n        return null;\n    }\n\n    private void assertRevealSelectedAndVisible(OfflineItem item) {\n        // Never scroll from the test: the public reveal operation must bring this row into view.\n        CriteriaHelper.pollUiThread(\n                () -> {\n                    View row = findAttachedRevealRow(item);\n                    if (row == null) return false;\n                    SelectionView selection = row.findViewById(R.id.selection);\n                    return selection != null && selection.isSelected();\n                });\n    }\n\n    private void assertRevealResult(ArrayList<Boolean> results, boolean expected) {\n        CriteriaHelper.pollUiThread(() -> results.size() == 1);\n        InstrumentationRegistry.getInstrumentation().waitForIdleSync();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> assertEquals(Collections.singletonList(expected), results));\n    }\n\n    private void assertRevealNotSelected(OfflineItem item) {\n        CriteriaHelper.pollUiThread(() -> findAttachedRevealRow(item) != null);\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    SelectionView selection =\n                            findAttachedRevealRow(item).findViewById(R.id.selection);\n                    assertFalse(selection.isSelected());\n                });\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealBeyondPaginationSelectsAndScrollsDecoratedRow() {\n        ArrayList<OfflineItem> items = createRevealItems(80);\n        OfflineItem target = items.get(items.size() - 1);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    setRevealItems(items);\n                    setUpRevealUi(false);\n                });\n        CriteriaHelper.pollUiThread(() -> findAttachedRevealRow(items.get(0)) != null);\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    RecyclerView list = (RecyclerView) mDownloadCoordinator.getListViewForTesting();\n                    assertTrue(\n                            \"The initial model must actually be paginated\",\n                            list.getAdapter().getItemCount() < items.size());\n                    Assert.assertNull(findAttachedRevealRow(target));\n                    mDownloadCoordinator.revealItem(target.id, results::add);\n                });\n        assertRevealResult(results, true);\n        assertRevealSelectedAndVisible(target);\n\n        // Resetting the already-selected All filter must not strand a previously expanded page.\n        ArrayList<Boolean> repeated = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> mDownloadCoordinator.revealItem(target.id, repeated::add));\n        assertRevealResult(repeated, true);\n        assertRevealSelectedAndVisible(target);\n        assertRevealResult(results, true);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealUsesNamespaceAsWellAsGuid() {\n        ArrayList<OfflineItem> items = createRevealItems(2);\n        OfflineItem otherNamespace = items.get(0);\n        OfflineItem target = items.get(1);\n        otherNamespace.id = new ContentId(\"other-provider\", target.id.id);\n        // Keep both rows on one day so both selection handles can be inspected without scrolling.\n        otherNamespace.creationTimeMs = target.creationTimeMs;\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    setRevealItems(items);\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(target.id, results::add);\n                });\n        assertRevealResult(results, true);\n        assertRevealSelectedAndVisible(target);\n        assertRevealNotSelected(otherNamespace);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealWrongNamespaceDoesNotSelectSameGuid() {\n        OfflineItem item = createRevealItems(1).get(0);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    setRevealItems(Collections.singletonList(item));\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(\n                            new ContentId(\"wrong-provider\", item.id.id), results::add);\n                });\n        assertRevealResult(results, false);\n        assertRevealNotSelected(item);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealMissingItemReturnsFalse() {\n        OfflineItem item = createRevealItems(1).get(0);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    setRevealItems(Collections.singletonList(item));\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(\n                            new ContentId(item.id.namespace, \"missing-guid\"), results::add);\n                });\n        assertRevealResult(results, false);\n        assertRevealNotSelected(item);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealDangerousFilteredItemReturnsFalse() {\n        OfflineItem target = createRevealItems(1).get(0);\n        target.isDangerous = true;\n        target.dangerType = DownloadDangerType.DANGEROUS_CONTENT;\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    setRevealItems(Collections.singletonList(target));\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(target.id, results::add);\n                });\n        assertRevealResult(results, false);\n        onView(withText(target.title)).check(doesNotExist());\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealOffTheRecordFilteredItemReturnsFalse() {\n        OfflineItem target = createRevealItems(1).get(0);\n        target.isOffTheRecord = true;\n        OtrProfileId primaryId = OtrProfileId.getPrimaryOtrProfileId();\n        target.otrProfileId = OtrProfileId.serialize(primaryId);\n        Profile regularProfile = Mockito.mock(Profile.class);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    when(regularProfile.hasOffTheRecordProfile(eq(primaryId))).thenReturn(true);\n                    ProfileManager.setLastUsedProfileForTesting(regularProfile);\n                    // Prove this is a valid existing OTR profile, not a deserialize failure.\n                    assertEquals(primaryId, OtrProfileId.deserialize(target.otrProfileId));\n                    setRevealItems(Collections.singletonList(target));\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(target.id, results::add);\n                });\n        assertRevealResult(results, false);\n        onView(withText(target.title)).check(doesNotExist());\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealWaitsForInitialNonemptyItems() {\n        DelayedOfflineContentProvider provider = new DelayedOfflineContentProvider();\n        OfflineItem target = createRevealItems(1).get(0);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mStubbedOfflineContentProvider = provider;\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(target.id, results::add);\n                });\n        InstrumentationRegistry.getInstrumentation().waitForIdleSync();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    assertTrue(results.isEmpty());\n                    // OfflineItemSource signals availability before it adds these actual rows.\n                    provider.releaseItems(Collections.singletonList(target));\n                });\n        assertRevealResult(results, true);\n        assertRevealSelectedAndVisible(target);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealInitialEmptyItemsCompletesFalseOnce() {\n        DelayedOfflineContentProvider provider = new DelayedOfflineContentProvider();\n        OfflineItem target = createRevealItems(1).get(0);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mStubbedOfflineContentProvider = provider;\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(target.id, results::add);\n                });\n        InstrumentationRegistry.getInstrumentation().waitForIdleSync();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    assertTrue(results.isEmpty());\n                    provider.releaseItems(Collections.emptyList());\n                });\n        assertRevealResult(results, false);\n        ThreadUtils.runOnUiThreadBlocking(() -> provider.addItem(target));\n        assertRevealNotSelected(target);\n        assertRevealResult(results, false);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealDestroyThenLateInitialCallbackCompletesFalseOnce() {\n        DelayedOfflineContentProvider provider = new DelayedOfflineContentProvider();\n        OfflineItem target = createRevealItems(1).get(0);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mStubbedOfflineContentProvider = provider;\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(target.id, results::add);\n                    assertTrue(results.isEmpty());\n                    destroyRevealCoordinator();\n                });\n        assertRevealResult(results, false);\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> provider.releaseItems(Collections.singletonList(target)));\n        assertRevealResult(results, false);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealCancellationCompletesFalseOnce() {\n        DelayedOfflineContentProvider provider = new DelayedOfflineContentProvider();\n        OfflineItem target = createRevealItems(1).get(0);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mStubbedOfflineContentProvider = provider;\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(target.id, results::add);\n                    assertTrue(results.isEmpty());\n                    mDownloadCoordinator.cancelRevealItem();\n                    mDownloadCoordinator.cancelRevealItem();\n                });\n        assertRevealResult(results, false);\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> provider.releaseItems(Collections.singletonList(target)));\n        assertRevealNotSelected(target);\n        assertRevealResult(results, false);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealSupersedesPendingRequestOnce() {\n        DelayedOfflineContentProvider provider = new DelayedOfflineContentProvider();\n        ArrayList<OfflineItem> items = createRevealItems(2);\n        ArrayList<Boolean> first = new ArrayList<>();\n        ArrayList<Boolean> second = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mStubbedOfflineContentProvider = provider;\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(items.get(0).id, first::add);\n                    assertTrue(first.isEmpty());\n                    mDownloadCoordinator.revealItem(items.get(1).id, second::add);\n                });\n        assertRevealResult(first, false);\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    assertTrue(second.isEmpty());\n                    provider.releaseItems(items);\n                });\n        assertRevealResult(second, true);\n        assertRevealSelectedAndVisible(items.get(1));\n        assertRevealResult(first, false);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealSupersededCallbackCanCancelReplacementOnce() {\n        DelayedOfflineContentProvider provider = new DelayedOfflineContentProvider();\n        OfflineItem target = createRevealItems(1).get(0);\n        ArrayList<Boolean> first = new ArrayList<>();\n        ArrayList<Boolean> second = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    mStubbedOfflineContentProvider = provider;\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(\n                            target.id,\n                            result -> {\n                                first.add(result);\n                                mDownloadCoordinator.cancelRevealItem();\n                            });\n                    assertTrue(first.isEmpty());\n                    mDownloadCoordinator.revealItem(target.id, second::add);\n                });\n        assertRevealResult(first, false);\n        assertRevealResult(second, false);\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> provider.releaseItems(Collections.singletonList(target)));\n        assertRevealNotSelected(target);\n        assertRevealResult(first, false);\n        assertRevealResult(second, false);\n    }\n\n    @Test\n    @MediumTest\n    public void testRepeatedRevealRemainsSelectedAndCanBeDeselected() {\n        OfflineItem target = createRevealItems(1).get(0);\n        ArrayList<Boolean> first = new ArrayList<>();\n        ArrayList<Boolean> second = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    setRevealItems(Collections.singletonList(target));\n                    setUpRevealUi(false);\n                    mDownloadCoordinator.revealItem(target.id, first::add);\n                });\n        assertRevealResult(first, true);\n        assertRevealSelectedAndVisible(target);\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> mDownloadCoordinator.revealItem(target.id, second::add));\n        assertRevealResult(second, true);\n        assertRevealSelectedAndVisible(target);\n        // A normal selection toggle must still work after programmatic selection.\n        onView(withText(target.title)).perform(ViewActions.click());\n        assertRevealNotSelected(target);\n        onView(withId(R.id.selection_mode_number)).check(matches(not(isDisplayed())));\n        assertRevealResult(first, true);\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealClearsInlineSearchAndRestoresFilesTab() {\n        OfflineItem target = createRevealItems(1).get(0);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    setRevealItems(Collections.singletonList(target));\n                    setUpRevealUi(true);\n                });\n        CriteriaHelper.pollUiThread(() -> findAttachedRevealRow(target) != null);\n        Matcher<View> inlineSearch =\n                allOf(withId(R.id.search_text), isDescendantOfA(withId(R.id.download_search_bar)));\n        onView(inlineSearch)\n                .perform(\n                        ViewActions.replaceText(\"absent search term\"),\n                        ViewActions.closeSoftKeyboard());\n        TextView searchField =\n                ThreadUtils.runOnUiThreadBlocking(\n                        () -> {\n                            View searchBar = sActivity.findViewById(R.id.download_search_bar);\n                            return searchBar.findViewById(R.id.search_text);\n                        });\n        ThreadUtils.runOnUiThreadBlocking(\n                () ->\n                        mDownloadCoordinator.updateForUrl(\n                                Filters.toUrl(Filters.FilterType.PREFETCHED)));\n        onView(withText(target.title)).check(doesNotExist());\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> mDownloadCoordinator.revealItem(target.id, results::add));\n        assertRevealResult(results, true);\n        assertRevealSelectedAndVisible(target);\n        // The reveal may scroll the search header offscreen; inspect the same actual widget.\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> assertEquals(\"\", searchField.getText().toString()));\n    }\n\n    @Test\n    @MediumTest\n    public void testRevealClearsToolbarSearchAndTypeFilter() {\n        OfflineItem target = createRevealItems(1).get(0);\n        ArrayList<Boolean> results = new ArrayList<>();\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    setRevealItems(Collections.singletonList(target));\n                    setUpRevealUi(false);\n                });\n        CriteriaHelper.pollUiThread(() -> findAttachedRevealRow(target) != null);\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> {\n                    DownloadHomeToolbar toolbar = sActivity.findViewById(R.id.download_toolbar);\n                    toolbar.getMenu().performIdentifierAction(R.id.search_menu_id, 0);\n                });\n        onView(withId(R.id.search_text))\n                .perform(\n                        ViewActions.replaceText(\"absent search term\"),\n                        ViewActions.closeSoftKeyboard());\n        ThreadUtils.runOnUiThreadBlocking(\n                () ->\n                        mDownloadCoordinator.updateForUrl(\n                                Filters.toUrl(Filters.FilterType.SITES)));\n        onView(withText(target.title)).check(doesNotExist());\n        ThreadUtils.runOnUiThreadBlocking(\n                () -> mDownloadCoordinator.revealItem(target.id, results::add));\n        assertRevea