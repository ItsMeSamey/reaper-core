# Android download UI policy and truthful transfer lifecycle.
substitutions:
- description: Forward aggregate transitions without creating a download item or changing its state
  regex:
    re_pattern: DownloadMessageBridge::DownloadMessageBridge\(\)\ =\ default;
    replace: "// static\nvoid DownloadMessageBridge::NotifyDownloadUiPolicyChanged() {\n  Java_DownloadMessageBridge_onDownloadUiPolicyChanged(\n      base::android::AttachCurrentThread());\n}\n\nDownloadMessageBridge::DownloadMessageBridge() = default;"
