substitutions:
- description: Android Downloads exact-item reveal integration (1).
  regex:
    re_pattern: 'import\ android\.view\.View;\

      import\ android\.view\.ViewGroup;\

      \

      import\ org\.chromium\.build\.annotations\.NullMarked;\

      import\ org\.chromium\.components\.browser_ui\.widget\.gesture\.BackPressHandler;\

      \

      /\*\*\

      \ \*\ A\ coordinator\ that\ represents\ the\ main\ download\ manager\ UI\ page\.\ This\ visually\ shows\ a\ list\ of\

      '
    replace: "import android.view.View;\nimport android.view.ViewGroup;\n\nimport org.chromium.base.Callback;\nimport org.chromium.build.annotations.NullMarked;\nimport org.chromium.components.browser_ui.widget.gesture.BackPressHandler;\nimport org.chromium.components.offline_items_collection.ContentId;\n\n/**\n * A coordinator that represents the main download manager UI page. This visually shows a list of\n"
- description: Android Downloads exact-item reveal integration (2).
  regex:
    re_pattern: '\ \ \ \ /\*\*\ To\ be\ called\ to\ push\ the\ url\ containing\ internal\ state\ to\ the\ coordinator\.\ \*/\

      \ \ \ \ void\ updateForUrl\(String\ url\);\

      \

      \ \ \ \ /\*\*\ Adds\ \{@code\ observer\}\ to\ be\ notified\ of\ url\ state\ changes\.\ \*/\

      \ \ \ \ void\ addObserver\(Observer\ observer\);\

      \

      '
    replace: "    /** To be called to push the url containing internal state to the coordinator. */\n    void updateForUrl(String url);\n\n    /**\n     * Selects the exact download and requests scrolling it into view. The callback receives true\n     * after both requests are accepted, or false if the item cannot be revealed. Initial item\n     * loading may delay completion; cancellation and destruction complete a pending request false.\n     */\n    void revealItem(ContentId id, Callback<Boolean> callback);\n\n    /** Cancels a pending reveal request, completing its callback false exactly once. */\n    void cancelRevealItem();\n\n    /** Adds {@code observer} to be notified of url state changes. */\n    void addObserver(Observer observer);\n\n"
