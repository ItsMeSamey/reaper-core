# Android download UI policy and truthful transfer lifecycle.
substitutions:
- description: Keep a default non-suppressing delegate contract for non-extension clients and test doubles
  regex:
    re_pattern: \ \ \ \ \ \ \ \ /\*\*\ Called\ to\ remove\ a\ notification\.\ \*/
    replace: "        /** Whether extension policy suppresses optional messages for this item's profile. */\n        default boolean shouldSuppressDownloadUi(@Nullable String serializedOtrProfileId) {\n            return false;\n        }\n\n        /** Called to remove a notification. */"
- description: Refresh existing message UI without mutating the shared offline-item provider
  regex:
    re_pattern: \ \ \ \ void\ onDownloadStarted\(\);
    replace: "    void onDownloadStarted();\n\n    /** Early feedback can precede an OfflineItem, so retain its actual profile identity. */\n    default void onDownloadStarted(@Nullable OtrProfileId otrProfileId) {\n        onDownloadStarted();\n    }\n\n    /** Refresh optional in-app messages after an aggregate extension policy transition. */\n    default void onDownloadUiPolicyChanged() {}"
