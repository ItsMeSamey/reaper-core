# Android download folder forwarding through its JNI owner.
substitutions:
- description: Declare Android folder opening on the existing native download service.
  regex:
    re_pattern: '\ \ static\ DownloadManagerService\*\ GetInstance\(\);\

      '
    replace: "  static DownloadManagerService* GetInstance();\n\n  // Opens the Downloads surface for the supplied tab through the JNI owner.\n  static bool ShowDownloadsForExtension(const JavaRef<jobject>& tab);\n"
- description: Android Downloads exact-item reveal integration (1).
  regex:
    re_pattern: '\#include\ <vector>\

      \

      \#include\ "base/android/scoped_java_ref\.h"\

      \#include\ "base/functional/callback\.h"\

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "base/memory/singleton\.h"\

      '
    replace: '#include <vector>


      #include "base/android/scoped_java_ref.h"

      #include "base/auto_reset.h"

      #include "base/functional/callback.h"

      #include "base/memory/raw_ptr.h"

      #include "base/memory/singleton.h"

      '
- description: Android Downloads exact-item reveal integration (2).
  regex:
    re_pattern: '\

      \ \ //\ Opens\ the\ Downloads\ surface\ for\ the\ supplied\ tab\ through\ the\ JNI\ owner\.\

      \ \ static\ bool\ ShowDownloadsForExtension\(const\ JavaRef<jobject>\&\ tab\);\

      \

      \ \ static\ base::android::ScopedJavaLocalRef<jobject>\ CreateJavaDownloadInfo\(\

      \ \ \ \ \ \ JNIEnv\*\ env,\

      '
    replace: "\n  // Opens the Downloads surface for the supplied tab through the JNI owner.\n  static bool ShowDownloadsForExtension(const JavaRef<jobject>& tab);\n\n  // Host validation does not create an Activity or a reveal request.\n  static bool CanShowDownloadItemForExtension(const JavaRef<jobject>& tab,\n                                              Profile* item_profile);\n\n  // A zero token means callback(false) has already run. The callback may run\n  // synchronously. Cancellation retires the Java request and consumes its JNI\n  // callback with false; callers must invalidate their weak callback first.\n  static int64_t ShowDownloadItemForExtension(\n      const JavaRef<jobject>& tab,\n      download::DownloadItem* item,\n      base::OnceCallback<void(bool)> callback);\n  static void CancelDownloadItemForExtension(int64_t token);\n\n  // Overrides only request dispatch/cancellation in native tests. Host/profile\n  // validation still runs before invoking show.\n  struct DownloadItemRevealCallbacksForTesting {\n    base::RepeatingCallback<int64_t(download::DownloadItem*,\n                                    base::OnceCallback<void(bool)>)>\n        show;\n    base::RepeatingCallback<void(int64_t)> cancel;\n  };\n  static base::AutoReset<const DownloadItemRevealCallbacksForTesting*>\n  SetDownloadItemRevealCallbacksForTesting(\n      const DownloadItemRevealCallbacksForTesting* callbacks);\n\n  static base::android::ScopedJavaLocalRef<jobject> CreateJavaDownloadInfo(\n      JNIEnv* env,\n"
