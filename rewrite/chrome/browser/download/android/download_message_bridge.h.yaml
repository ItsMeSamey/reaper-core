# Android download UI policy and truthful transfer lifecycle.
substitutions:
- description: Expose a policy-only Android message refresh
  regex:
    re_pattern: \ \ DownloadMessageBridge\(\);
    replace: "  // Refresh optional in-app UI; OS transfer notifications are unaffected.\n  static void NotifyDownloadUiPolicyChanged();\n\n  DownloadMessageBridge();"
