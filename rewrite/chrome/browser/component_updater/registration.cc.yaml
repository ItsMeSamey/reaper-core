substitutions:
  - description: 'Register Brave-only components after the upstream ones.'
    after_function_impl:
      function_name: RegisterComponentsForUpdate
      code: |-
        RegisterBraveComponentsForUpdate();

  - description: 'Android concrete AI source/provider removal: chrome/browser/component_updater/registration.cc'
    regex:
      re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

        \

        \#include\ "chrome/browser/component_updater/registration\.h"\

        \

        \#include\ "base/feature_list\.h"\

        \#include\ "base/files/file_path\.h"\

        '
      replace: '// found in the LICENSE file.


        #include "chrome/browser/component_updater/registration.h"

        #include "build/build_config.h"


        #include "base/feature_list.h"

        #include "base/files/file_path.h"

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/component_updater/registration.cc'
    regex:
      re_pattern: '\#include\ "base/metrics/histogram_functions\.h"\

        \#include\ "base/path_service\.h"\

        \#include\ "base/task/thread_pool\.h"\

        \#include\ "build/build_config\.h"\

        \#include\ "chrome/browser/browser_process\.h"\

        \#include\ "chrome/browser/buildflags\.h"\

        \#include\ "chrome/browser/component_updater/ai_embeddings_component_installer\.h"\

        '
      replace: '#include "base/metrics/histogram_functions.h"

        #include "base/path_service.h"

        #include "base/task/thread_pool.h"

        #include "chrome/browser/browser_process.h"

        #include "chrome/browser/buildflags.h"

        #include "chrome/browser/component_updater/ai_embeddings_component_installer.h"

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/component_updater/registration.cc'
    regex:
      re_pattern: '\#include\ "chrome/common/pref_names\.h"\

        \#include\ "components/autofill/core/common/autofill_payments_features\.h"\

        \#include\ "components/component_updater/component_updater_service\.h"\

        \#include\ "components/component_updater/installer_policies/actor_safety_lists_component_installer\.h"\

        \#include\ "components/component_updater/installer_policies/history_search_strings_component_installer\.h"\

        \#include\ "components/component_updater/installer_policies/on_device_head_suggest_component_installer\.h"\

        \#include\ "components/component_updater/installer_policies/optimization_hints_component_installer\.h"\

        '
      replace: '#include "chrome/common/pref_names.h"

        #include "components/autofill/core/common/autofill_payments_features.h"

        #include "components/component_updater/component_updater_service.h"

        #if !BUILDFLAG(IS_ANDROID)

        #include "components/component_updater/installer_policies/actor_safety_lists_component_installer.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        #include "components/component_updater/installer_policies/history_search_strings_component_installer.h"

        #include "components/component_updater/installer_policies/on_device_head_suggest_component_installer.h"

        #include "components/component_updater/installer_policies/optimization_hints_component_installer.h"

        '
  - description: 'Android concrete AI source/provider removal: chrome/browser/component_updater/registration.cc'
    regex:
      re_pattern: '\ \ RegisterPrivateVerificationTokensComponentIfEnabled\(cus\);\

        \ \ RegisterFirstPartySetsComponent\(cus\);\

        \ \ RegisterPrivacySandboxAttestationsComponent\(cus\);\

        \ \ RegisterActorSafetyListsComponent\(cus,\ base::OnceClosure\(\)\);\

        \ \ if\ \(history_embeddings::IsHistoryEmbeddingsFeatureEnabled\(\)\)\ \{\

        \ \ \ \ RegisterHistorySearchStringsComponent\(cus\);\

        \ \ \}\

        '
      replace: "  RegisterPrivateVerificationTokensComponentIfEnabled(cus);\n  RegisterFirstPartySetsComponent(cus);\n  RegisterPrivacySandboxAttestationsComponent(cus);\n#if !BUILDFLAG(IS_ANDROID)\n  RegisterActorSafetyListsComponent(cus, base::OnceClosure());\n#endif  // !BUILDFLAG(IS_ANDROID)\n  if (history_embeddings::IsHistoryEmbeddingsFeatureEnabled()) {\n    RegisterHistorySearchStringsComponent(cus);\n  }\n"
  - description: 'Android history AI430: chrome/browser/component_updater/registration.cc step 1'
    regex:
      pattern: '#include "chrome/browser/history_embeddings/history_embeddings_utils.h"

        '
      replace: '#if !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/history_embeddings/history_embeddings_utils.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        '
    count: 1
  - description: 'Android history AI430: chrome/browser/component_updater/registration.cc step 2'
    regex:
      pattern: '#include "components/component_updater/installer_policies/history_search_strings_component_installer.h"

        '
      replace: '#if !BUILDFLAG(IS_ANDROID)

        #include "components/component_updater/installer_policies/history_search_strings_component_installer.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        '
    count: 1
  - description: 'Android history AI430: chrome/browser/component_updater/registration.cc step 3'
    regex:
      pattern: "  if (history_embeddings::IsHistoryEmbeddingsFeatureEnabled()) {\n    RegisterHistorySearchStringsComponent(cus);\n  }\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (history_embeddings::IsHistoryEmbeddingsFeatureEnabled()) {\n    RegisterHistorySearchStringsComponent(cus);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: 'Android history AI430: chrome/browser/component_updater/registration.cc step 4'
    regex:
      pattern: "    if (!history_embeddings::IsHistoryEmbeddingsFeatureEnabled()) {\n      DeleteHistorySearchStringsComponent(path);\n    }\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n    if (!history_embeddings::IsHistoryEmbeddingsFeatureEnabled()) {\n      DeleteHistorySearchStringsComponent(path);\n    }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: 'Android AI Embeddings Core431: chrome/browser/component_updater/registration.cc step 1'
    regex:
      pattern: '#include "chrome/browser/component_updater/ai_embeddings_component_installer.h"

        '
      replace: '#if !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/component_updater/ai_embeddings_component_installer.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        '
    count: 1
  - description: 'Android AI Embeddings Core431: chrome/browser/component_updater/registration.cc step 2'
    regex:
      pattern: "    ManageAIEmbeddingsComponentRegistration(cus,\n                                            g_browser_process->local_state());\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n    ManageAIEmbeddingsComponentRegistration(cus,\n                                            g_browser_process->local_state());\n\
        #endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: 'Android orphan AIM updater Core431: chrome/browser/component_updater/registration.cc step 1'
    regex:
      pattern: '#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)

        #include "chrome/browser/component_updater/aim_eligibility_component_installer.h"

        #endif  // BUILDFLAG(ENABLE_EXTENSIONS_CORE)

        '
      replace: '#if BUILDFLAG(ENABLE_EXTENSIONS_CORE) && !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/component_updater/aim_eligibility_component_installer.h"

        #endif  // BUILDFLAG(ENABLE_EXTENSIONS_CORE) && !BUILDFLAG(IS_ANDROID)

        '
    count: 1
  - description: 'Android orphan AIM updater Core431: chrome/browser/component_updater/registration.cc step 2'
    regex:
      pattern: "#if BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n    ManageAimEligibilityComponentRegistration(cus);\n#endif  // BUILDFLAG(ENABLE_EXTENSIONS_CORE)\n"
      replace: "#if BUILDFLAG(ENABLE_EXTENSIONS_CORE) && !BUILDFLAG(IS_ANDROID)\n    ManageAimEligibilityComponentRegistration(cus);\n#endif  // BUILDFLAG(ENABLE_EXTENSIONS_CORE)\
        \ && !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Exclude the dedicated Commerce Heuristics installer header from Android registration
    regex:
      pattern: '#include "chrome/browser/component_updater/commerce_heuristics_component_installer.h"

        '
      replace: '#if !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/component_updater/commerce_heuristics_component_installer.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        '
    count: 1
  - description: Do not register the dedicated Commerce Heuristics component on Android
    regex:
      pattern: '  RegisterCommerceHeuristicsComponent(cus);

        '
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  RegisterCommerceHeuristicsComponent(cus);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Avoid the unused desktop AI utility and removed generated-quality header in ordinary Android component registration
    regex:
      pattern: '#include "components/optimization_guide/core/model_execution/model_execution_util.h"

        '
      replace: '#if !BUILDFLAG(IS_ANDROID)

        #include "components/optimization_guide/core/model_execution/model_execution_util.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        '
    count: 1
  - description: Keep the disabled metrics installer interface out of Android registration compilation.
    regex:
      pattern: '#include "chrome/browser/component_updater/captcha_provider_component_installer.h"

        '
      replace: '#if !BUILDFLAG(IS_ANDROID)

        #include "chrome/browser/component_updater/captcha_provider_component_installer.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        '
    count: 1
  - description: Do not register the Android-excluded metrics classification component; other component registrations remain
      exact.
    regex:
      pattern: '  RegisterCaptchaProviderComponent(cus);

        '
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  RegisterCaptchaProviderComponent(cus);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
