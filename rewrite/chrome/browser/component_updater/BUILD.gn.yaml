substitutions:
  - description: Add the deps the Brave component_updater overrides need.
    add_literal_to_list:
      target: impl
      list_name: deps
      literal: brave_chromium_src_chrome_browser_component_updater_impl_deps
      import: //brave/chromium_src/chrome/browser/component_updater/sources.gni

  - description: 'Android concrete AI source/provider removal: chrome/browser/component_updater/BUILD.gn'
    regex:
      re_pattern: '\

        \ \ if\ \(enable_extensions_core\)\ \{\

        \ \ \ \ public\ \+=\ \[\ "aim_eligibility_component_installer\.h"\ \]\

        \ \ \}\

        \}\

        \

        '
      replace: "\n  if (enable_extensions_core) {\n    public += [ \"aim_eligibility_component_installer.h\" ]\n    if (is_android) {\n      public -= [ \"aim_eligibility_component_installer.h\" ]\n    }\n  }\n}\n\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/component_updater/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//services/cert_verifier/public/mojom",\

        \ \ \ \ "//services/network/public/cpp",\

        \ \ \]\

        \ \ deps\ \+=\ brave_chromium_src_chrome_browser_component_updater_impl_deps\

        \

        \ \ if\ \(safe_browsing_mode\ ==\ 2\)\ \{\

        '
      replace: "    \"//services/cert_verifier/public/mojom\",\n    \"//services/network/public/cpp\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/actor:impl\",\n      \"//chrome/browser/ai\",\n    ]\n  }\n  deps += brave_chromium_src_chrome_browser_component_updater_impl_deps\n\n  if (safe_browsing_mode == 2) {\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/component_updater/BUILD.gn'
    regex:
      re_pattern: '\

        \ \ if\ \(enable_extensions_core\)\ \{\

        \ \ \ \ sources\ \+=\ \[\ "aim_eligibility_component_installer\.cc"\ \]\

        \ \ \ \ deps\ \+=\ \[\

        \ \ \ \ \ \ "//chrome/browser/extensions",\

        \ \ \ \ \ \ "//chrome/browser/resources/omnibox/aim_eligibility_extension:resources",\

        \ \ \ \ \]\

        \ \ \}\

        \

        \ \ if\ \(!is_android\)\ \{\

        '
      replace: "\n  if (enable_extensions_core) {\n    sources += [ \"aim_eligibility_component_installer.cc\" ]\n    if (is_android) {\n      sources -= [ \"aim_eligibility_component_installer.cc\" ]\n    }\n    deps += [\n      \"//chrome/browser/extensions\",\n      \"//chrome/browser/resources/omnibox/aim_eligibility_extension:resources\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/resources/omnibox/aim_eligibility_extension:resources\" ]\n    }\n  }\n\n  if (!is_android) {\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/component_updater/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "//components/webapps/isolated_web_apps",\

        \ \ \ \ \ \ "//third_party/zxcvbn\-cpp",\

        \ \ \ \ \]\

        \ \ \}\

        \

        \ \ if\ \(!is_android\ \&\&\ !is_chromeos\)\ \{\

        '
      replace: "      \"//components/webapps/isolated_web_apps\",\n      \"//third_party/zxcvbn-cpp\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/actor:impl\" ]\n    }\n  }\n\n  if (!is_android && !is_chromeos) {\n"
  - description: 'Android concrete AI source/provider removal: chrome/browser/component_updater/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//testing/gmock",\

        \ \ \ \ "//testing/gtest",\

        \ \ \]\

        \

        \ \ if\ \(enable_extensions_core\)\ \{\

        \ \ \ \ sources\ \+=\ \[\ "aim_eligibility_component_installer_unittest\.cc"\ \]\

        \ \ \ \ deps\ \+=\ \[\

        \ \ \ \ \ \ "//chrome/browser/extensions",\

        \ \ \ \ \ \ "//chrome/browser/resources/omnibox/aim_eligibility_extension:resources",\

        \ \ \ \ \]\

        \ \ \}\

        \

        \ \ if\ \(!is_android\)\ \{\

        '
      replace: "    \"//testing/gmock\",\n    \"//testing/gtest\",\n  ]\n  if (is_android) {\n    deps -= [ \"//chrome/browser/ai\" ]\n  }\n\n  if (enable_extensions_core) {\n    sources += [ \"aim_eligibility_component_installer_unittest.cc\" ]\n    if (is_android) {\n      sources -= [ \"aim_eligibility_component_installer_unittest.cc\" ]\n    }\n    deps += [\n      \"//chrome/browser/extensions\",\n      \"//chrome/browser/resources/omnibox/aim_eligibility_extension:resources\",\n    ]\n    if (is_android) {\n      deps -= [ \"//chrome/browser/resources/omnibox/aim_eligibility_extension:resources\" ]\n    }\n  }\n\n  if (!is_android) {\n"
  - description: 'Android history AI430: chrome/browser/component_updater/BUILD.gn step 1'
    regex:
      pattern: "    \"//services/network/public/cpp\",\n  ]"
      replace: "    \"//services/network/public/cpp\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/browser/history_embeddings\",\n    ]\n  }"
    count: 1
  - description: 'Android AI Embeddings Core431: chrome/browser/component_updater/BUILD.gn step 1'
    regex:
      pattern: "    \"wasm_tts_engine_component_installer.h\",\n  ]"
      replace: "    \"wasm_tts_engine_component_installer.h\",\n  ]\n  if (is_android) {\n    public -= [ \"ai_embeddings_component_installer.h\" ]\n  }"
    count: 1
  - description: 'Android AI Embeddings Core431: chrome/browser/component_updater/BUILD.gn step 2'
    regex:
      pattern: "    \"wasm_tts_engine_component_installer.cc\",\n  ]"
      replace: "    \"wasm_tts_engine_component_installer.cc\",\n  ]\n  if (is_android) {\n    sources -= [ \"ai_embeddings_component_installer.cc\" ]\n  }"
    count: 1
  - description: 'Android AI Embeddings Core431: chrome/browser/component_updater/BUILD.gn step 3'
    regex:
      pattern: "    \"subresource_filter_component_installer_unittest.cc\",\n  ]"
      replace: "    \"subresource_filter_component_installer_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [ \"ai_embeddings_component_installer_unittest.cc\"\
        \ ]\n  }"
    count: 1
  - description: Exclude the Commerce Heuristics public installer header from the Android target
    regex:
      pattern: '    public -= [ "ai_embeddings_component_installer.h" ]

        '
      replace: "    public -= [\n      \"ai_embeddings_component_installer.h\",\n      \"commerce_heuristics_component_installer.h\"\
        ,\n    ]\n"
    count: 1
  - description: Exclude the Commerce Heuristics installer implementation from Android
    regex:
      pattern: '    sources -= [ "ai_embeddings_component_installer.cc" ]

        '
      replace: "    sources -= [\n      \"ai_embeddings_component_installer.cc\",\n      \"commerce_heuristics_component_installer.cc\"\
        ,\n    ]\n"
    count: 1
  - description: Remove this installer's sole-use commerce dependencies from Android impl
    regex:
      pattern: '  deps += brave_chromium_src_chrome_browser_component_updater_impl_deps

        '
      replace: "  if (is_android) {\n    deps -= [\n      \"//components/commerce/core:commerce_heuristics_data\",\n      \"\
        //components/commerce/core:feature_list\",\n    ]\n  }\n  deps += brave_chromium_src_chrome_browser_component_updater_impl_deps\n"
    count: 1
  - description: Keep ordinary component updater admission while removing its already-excluded AI installer's passage dependency.
    regex:
      pattern: "  if (is_android) {\n    deps -= [\n      \"//chrome/browser/history_embeddings\",\n    ]\n  }"
      replace: "  if (is_android) {\n    deps -= [\n      \"//chrome/browser/history_embeddings\",\n      \"//components/passage_embeddings/core\"\
        ,\n    ]\n  }"
    count: 1
  - description: Exclude the disabled metrics-only CAPTCHA component header from the existing Android public list.
    regex:
      pattern: "    public -= [\n      \"ai_embeddings_component_installer.h\",\n      \"commerce_heuristics_component_installer.h\"\
        ,\n    ]\n"
      replace: "    public -= [\n      \"ai_embeddings_component_installer.h\",\n      \"captcha_provider_component_installer.h\"\
        ,\n      \"commerce_heuristics_component_installer.h\",\n    ]\n"
    count: 1
  - description: Exclude the metrics-only CAPTCHA component implementation whose manager is already Android-excluded.
    regex:
      pattern: "    sources -= [\n      \"ai_embeddings_component_installer.cc\",\n      \"commerce_heuristics_component_installer.cc\"\
        ,\n    ]\n"
      replace: "    sources -= [\n      \"ai_embeddings_component_installer.cc\",\n      \"captcha_provider_component_installer.cc\"\
        ,\n      \"commerce_heuristics_component_installer.cc\",\n    ]\n"
    count: 1
