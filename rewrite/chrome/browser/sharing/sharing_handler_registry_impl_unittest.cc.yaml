substitutions:
- description: Declare the platform buildflag used by the new scoped fixture guards.
  regex:
    pattern: '#include "base/test/scoped_feature_list.h"

      '
    replace: '#include "base/test/scoped_feature_list.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude unused Actuator feature declarations from the Android registry fixture.
  regex:
    pattern: '#include "components/browser_actuator/public/features.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/browser_actuator/public/features.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Retire only the two product-specific handler registration cases on Android.
  regex:
    pattern: "TEST_F(SharingHandlerRegistryImplTest,\n       BrowserActuatorDownstreamMessage_AddedWhenFeatureEnabled) {\n\
      \  base::test::ScopedFeatureList scoped_feature_list;\n  scoped_feature_list.InitAndEnableFeature(browser_actuator::kBrowserActuator);\n\
      \  auto handler_registry = CreateHandlerRegistry();\n  EXPECT_TRUE(handler_registry->GetSharingHandler(\n      components_sharing_message::SharingMessage::kActuatorDownstreamMessage));\n\
      }\n\nTEST_F(SharingHandlerRegistryImplTest,\n       BrowserActuatorDownstreamMessage_NotAddedWhenFeatureDisabled) {\n\
      \  base::test::ScopedFeatureList scoped_feature_list;\n  scoped_feature_list.InitAndDisableFeature(browser_actuator::kBrowserActuator);\n\
      \  auto handler_registry = CreateHandlerRegistry();\n  EXPECT_FALSE(handler_registry->GetSharingHandler(\n      components_sharing_message::SharingMessage::kActuatorDownstreamMessage));\n\
      }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nTEST_F(SharingHandlerRegistryImplTest,\n       BrowserActuatorDownstreamMessage_AddedWhenFeatureEnabled)\
      \ {\n  base::test::ScopedFeatureList scoped_feature_list;\n  scoped_feature_list.InitAndEnableFeature(browser_actuator::kBrowserActuator);\n\
      \  auto handler_registry = CreateHandlerRegistry();\n  EXPECT_TRUE(handler_registry->GetSharingHandler(\n      components_sharing_message::SharingMessage::kActuatorDownstreamMessage));\n\
      }\n\nTEST_F(SharingHandlerRegistryImplTest,\n       BrowserActuatorDownstreamMessage_NotAddedWhenFeatureDisabled) {\n\
      \  base::test::ScopedFeatureList scoped_feature_list;\n  scoped_feature_list.InitAndDisableFeature(browser_actuator::kBrowserActuator);\n\
      \  auto handler_registry = CreateHandlerRegistry();\n  EXPECT_FALSE(handler_registry->GetSharingHandler(\n      components_sharing_message::SharingMessage::kActuatorDownstreamMessage));\n\
      }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
