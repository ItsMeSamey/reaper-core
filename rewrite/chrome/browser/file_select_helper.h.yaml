# Android split pane request ownership and dialog placement.
substitutions:
- description: 'Guard the upload image-metadata strip so it runs once.


    NotifyListenerAndEnd is re-entered with the sanitized list once the async

    strip completes; this flag lets the Brave interposition take over on the

    first pass and fall through to the upstream notification on the second.'
  add_to_protected:
    class_name: FileSelectHelper
    code: bool image_metadata_processed_ = false;
- description: retain exact Android extension browser lifetime
  regex:
    re_pattern: class\ Profile;
    replace: 'class Profile;

      class BrowserWindowInterface;'
- description: allow real Android tab-model picker lifecycle regression fixture
  regex:
    re_pattern: \ \ friend\ class\ FileSelectHelperTest;
    replace: "  friend class FileSelectHelperTest;\n#if BUILDFLAG(IS_ANDROID)\n  friend class AndroidFileSelectHelperTest;\n#endif"
- description: declare exact Android file-picker document identity
  regex:
    re_pattern: '\#include\ "content/public/browser/web_contents_observer\.h"\

      '
    replace: '#include "content/public/browser/web_contents_observer.h"

      #if BUILDFLAG(IS_ANDROID)

      #include "content/public/browser/weak_document_ptr.h"

      #endif

      '
- description: declare Android picker request ownership and preparation lifetime
  regex:
    re_pattern: '\ \ base::CallbackListSubscription\ tab_deactivated_subscription_;\

      '
    replace: "  base::CallbackListSubscription tab_deactivated_subscription_;\n#if BUILDFLAG(IS_ANDROID)\n  void OnAndroidTabHidden(tabs::TabInterface* tab);\n  void OnVisibilityChanged(content::Visibility visibility) override;\n  bool IsAndroidPickerOwnerValid() const;\n\n  class AndroidPickerModelObserver;\n  std::unique_ptr<AndroidPickerModelObserver> picker_model_observer_;\n  base::CallbackListSubscription tab_hidden_subscription_;\n  base::WeakPtr<tabs::TabInterface> requesting_tab_;\n  base::WeakPtr<BrowserWindowInterface> requesting_extension_browser_;\n  content::WeakDocumentPtr requesting_document_;\n  bool android_file_picker_request_ = false;\n  bool android_file_picker_started_ = false;\n  bool android_extension_picker_request_ = false;\n#endif\n"
