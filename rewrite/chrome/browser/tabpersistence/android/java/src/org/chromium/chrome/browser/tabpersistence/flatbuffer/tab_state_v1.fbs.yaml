# Android real split persistence and recently-closed restoration.
substitutions:
- description: Append backwards-compatible fields for actual split identity and visual data
  count: 1
  regex:
    re_pattern: \ \ \ \ url:string;
    replace: "    url:string;\n\n    // Native split state; absent fields in old files mean unsplit.\n    split_tab_id:TabGroupIdToken;\n    split_layout:int = 0;\n    split_ratio:double = 0.5;\n    split_position:int = -1;"

# Reaper Android containers lifecycle successor; retain the complete inherited recipe.
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ split_layout:int\ =\ 0;\

      \ \ \ \ split_ratio:double\ =\ 0\.5;\

      \ \ \ \ split_position:int\ =\ \-1;\

      \}\

      \

      '
    replace: "    split_layout:int = 0;\n    split_ratio:double = 0.5;\n    split_position:int = -1;\n\n    // Storage-container UUID, independent of tab groups. Old files use default.\n    container_id:string;\n}\n\n"
