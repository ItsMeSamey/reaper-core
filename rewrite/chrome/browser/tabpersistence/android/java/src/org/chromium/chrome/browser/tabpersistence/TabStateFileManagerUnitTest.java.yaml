# Reaper Android containers lifecycle successor; retain the complete inherited recipe.
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ Assert\.assertNotNull\("restored\ TabState\ should\ not\ be\ null",\ restored\);\

      \ \ \ \ \ \ \ \ Assert\.assertTrue\(restored\.isIncognito\);\

      \ \ \ \ \}\

      \}\

      '
    replace: "        Assert.assertNotNull(\"restored TabState should not be null\", restored);\n        Assert.assertTrue(restored.isIncognito);\n    }\n    @Test\n    public void testContainerIdentityRoundTripsThroughLegacyAndFlatBuffer() throws IOException {\n        String named = \"4a4d13b6-c971-4c61-ae11-e7a864f58165\";\n        for (String id : new String[] {\"\", named, \"t-\" + named}) {\n            TabState state = createTabState(new WebContentsState(\n                    ByteBuffer.allocateDirect(0), VERSION));\n            state.containerId = id;\n            File file = temporaryFolder.newFile(\"tabContainer\" + id);\n            TabStateFileManager.saveStateInternal(file, state, false, mCipherFactory);\n            TabState restored = TabStateFileManager.restoreTabStateInternal(file, false, null);\n            Assert.assertNotNull(restored);\n            assertEquals(id, restored.containerId);\n            FlatBufferTabStateSerializer serializer = new FlatBufferTabStateSerializer(false);\n            TabState flat = serializer.deserialize(serializer.serialize(state));\n            Assert.assertNotNull(flat);\n            assertEquals(id, flat.containerId);\n        }\n    }\n\n    @Test\n    public void testTruncatedNewLegacyContainerFieldDoesNotBecomeDefault() throws IOException {\n        File file = temporaryFolder.newFile(\"tabContainerTruncated\");\n        TabState state = createTabState(new WebContentsState(\n                ByteBuffer.allocateDirect(0), VERSION));\n        state.containerId = \"4a4d13b6-c971-4c61-ae11-e7a864f58165\";\n        TabStateFileManager.saveStateInternal(file, state, false, mCipherFactory);\n        try (java.io.RandomAccessFile bytes = new java.io.RandomAccessFile(file, \"rw\")) {\n            bytes.setLength(bytes.length() - 1);\n        }\n        assertNull(TabStateFileManager.restoreTabStateInternal(file, false, null));\n    }\n\n    @Test(expected = IllegalArgumentException.class)\n    public void testFlatBufferRefusesMalformedContainerIdentity() {\n        TabState state = createTabState(new WebContentsState(\n                ByteBuffer.allocateDirect(0), VERSION));\n        state.containerId = \"not-a-container\";\n        new FlatBufferTabStateSerializer(false).serialize(state);\n    }\n\n}\n"

# Initialized Android JUnit fixture prerequisite correction; inherited recipe preserved.
- description: "Keep initialized Android regression fixture prerequisites (TabStateFileManagerUnitTest, 1)."
  regex:
    pattern: "    public void testLargeContentsState() throws IOException {\n        File file = createTestTabStateFile();\n        ByteBuffer buffer = ByteBuffer.allocateDirect(LARGE_BYTE_BUFFER_SIZE);\n        for (int i = 0; i < LARGE_BYTE_BUFFER_SIZE; i++) {\n            buffer.put((byte) (i % Byte.MAX_VALUE));\n        }\n        WebContentsState contentsState =\n                new WebContentsState(buffer, WebContentsState.CONTENTS_STATE_CURRENT_VERSION);\n"
    replace: "    public void testLargeContentsState() throws IOException {\n        File file = createTestTabStateFile();\n        ByteBuffer buffer = ByteBuffer.allocateDirect(LARGE_BYTE_BUFFER_SIZE);\n        // Repeat the same byte pattern in bulk without reducing the full-size round-trip.\n        byte[] pattern = new byte[Byte.MAX_VALUE * 1024];\n        for (int i = 0; i < pattern.length; i++) {\n            pattern[i] = (byte) (i % Byte.MAX_VALUE);\n        }\n        while (buffer.hasRemaining()) {\n            buffer.put(pattern, 0, Math.min(pattern.length, buffer.remaining()));\n        }\n        WebContentsState contentsState =\n                new WebContentsState(buffer, WebContentsState.CONTENTS_STATE_CURRENT_VERSION);\n"
  count: 1
