  count: 1
  regex:
    re_pattern: '\ \ \ \ @Test\

      \ \ \ \ public\ void\ testFlatBufferValuesUnchanged\(\)'
    replace: "    @Test\n    public void testSplitFlatBufferRoundTripPreservesVisualsAndGroup() {\n        for (boolean encrypted : new boolean[] {false, true}) {\n            for (int position = 0; position < 2; position++) {\n                TabState state = createTabState(new WebContentsState(\n                        ByteBuffer.allocateDirect(0), VERSION));\n                state.splitTabId = new Token(73, 91);\n                state.splitLayout = position;\n                state.splitRatio = 0.37;\n                state.splitPosition = position;\n                FlatBufferTabStateSerializer serializer = new FlatBufferTabStateSerializer(encrypted);\n                TabState restored = serializer.deserialize(serializer.serialize(state));\n                Assert.assertNotNull(restored);\n                assertEquals(state.splitTabId, restored.splitTabId);\n                assertEquals(state.splitLayout, restored.splitLayout);\n                assertEquals(0.37, restored.splitRatio, 0);\n                assertEquals(position, restored.splitPosition);\n                assertEquals(TAB_GROUP_ID, restored.tabGroupId);\n                assertEquals(IS_PINNED, restored.isPinned);\n                assertEquals(encrypted, restored.isIncognito);\n            }\n        }\n    }\n\n    @Test\n    public void testSplitFieldsAbsentInOldFormatsRestoreUnsplit() throws IOException {\n        File legacy = createTestTabStateFile();\n        TabState oldState = createTabStateWithMappedByteBuffer(legacy, TAB_GROUP_ID);\n        TabStateFileManager.saveStateInternal(legacy, oldState, false, mCipherFactory);\n        TabState restoredLegacy = TabStateFileManager.restoreTabStateInternal(legacy, false, mCipherFactory);\n        Assert.assertNotNull(restoredLegacy);\n        assertNull(restoredLegacy.splitTabId);\n        assertEquals(-1, restoredLegacy.splitPosition);\n        FlatBufferTabStateSerializer serializer = new FlatBufferTabStateSerializer(false);\n        TabState restoredFlat = serializer.deserialize(serializer.serialize(oldState));\n        Assert.assertNotNull(restoredFlat);\n        assertNull(restoredFlat.splitTabId);\n        assertEquals(0, restoredFlat.splitLayout);\n        assertEquals(0.5, restoredFlat.splitRatio, 0);\n        assertEquals(-1, restoredFlat.splitPosition);\n    }\n\n    @Test\n    public void testInvalidSplitFieldsOnDiskRestoreUnsplit() {\n        double[][] invalid = {{2, 0.5, 0}, {0, Double.NaN, 0},\n                {0, 0, 0}, {0, 1, 0}, {0, 0.5, -1}, {0, 0.5, 2}};\n        for (double[] values : invalid) {\n            FlatBufferBuilder builder = new FlatBufferBuilder();\n            int url = builder.createString(URL.getSpec());\n            TabStateFlatBufferV1.startTabStateFlatBufferV1(builder);\n            TabStateFlatBufferV1.addSplitTabId(builder,\n                    TabGroupIdToken.createTabGroupIdToken(builder, 73, 91));\n            TabStateFlatBufferV1.addSplitLayout(builder, (int) values[0]);\n            TabStateFlatBufferV1.addSplitRatio(builder, values[1]);\n            TabStateFlatBufferV1.addSplitPosition(builder, (int) values[2]);\n            TabStateFlatBufferV1.addUrl(builder, url);\n            builder.finish(TabStateFlatBufferV1.endTabStateFlatBufferV1(builder));\n            TabState restored = new FlatBufferTabStateSerializer(false).deserialize(builder.dataBuffer());\n            Assert.assertNotNull(restored);\n            assertNull(restored.splitTabId);\n            assertEquals(-1, restored.splitPosition);\n            assertEquals(0.5, restored.splitRatio, 0);\n        }\n    }\n\n    @Test\n    public void testFlatBufferValuesUnchanged()"
