# Android real split persistence and recently-closed restoration.
substitutions:
- description: Validate persisted split tokens and visual data before use
  count: 1
  regex:
    re_pattern: import\ org\.chromium\.chrome\.browser\.tab\.TabLaunchType;
    replace: 'import org.chromium.chrome.browser.tab.Tab;

      import org.chromium.chrome.browser.tab.TabLaunchType;'
- description: Write valid native split fields in the shipping FlatBuffer format
  count: 1
  regex:
    re_pattern: \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addIsPinned\(fbb,\ state\.isPinned\);
    replace: "        TabStateFlatBufferV1.addIsPinned(fbb, state.isPinned);\n        Token splitToken = state.splitTabId;\n        if (Tab.SplitData.isValid(splitToken, state.splitLayout, state.splitRatio, state.splitPosition)) {\n            assert splitToken != null;\n            TabStateFlatBufferV1.addSplitTabId(fbb,\n                    TabGroupIdToken.createTabGroupIdToken(fbb, splitToken.getHigh(), splitToken.getLow()));\n            TabStateFlatBufferV1.addSplitLayout(fbb, state.splitLayout);\n            TabStateFlatBufferV1.addSplitRatio(fbb, state.splitRatio);\n            TabStateFlatBufferV1.addSplitPosition(fbb, state.splitPosition);\n        }"
- description: Treat corrupt, absent or out-of-range split fields as unsplit
  count: 1
  regex:
    re_pattern: \ \ \ \ \ \ \ \ \ \ \ \ state\.isPinned\ =\ tabStateFlatBuffer\.isPinned\(\);
    replace: "            state.isPinned = tabStateFlatBuffer.isPinned();\n            var split = tabStateFlatBuffer.splitTabId();\n            Token splitToken = split == null ? null : new Token(split.high(), split.low());\n            int layout = tabStateFlatBuffer.splitLayout();\n            double ratio = tabStateFlatBuffer.splitRatio();\n            int position = tabStateFlatBuffer.splitPosition();\n            if (Tab.SplitData.isValid(splitToken, layout, ratio, position)) {\n                state.splitTabId = splitToken;\n                state.splitLayout = layout;\n                state.splitRatio = ratio;\n                state.splitPosition = position;\n            }"
- description: Format modified Android split persistence Java sources
  count: 1
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ fbb,\ TabGroupIdToken\.createTabGroupIdToken\(fbb,\ tokenHigh,\ tokenLow\)\);\

      \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addTabHasSensitiveContent\(fbb,\ state\.tabHasSensitiveContent\);\

      \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addIsPinned\(fbb,\ state\.isPinned\);\

      \ \ \ \ \ \ \ \ Token\ splitToken\ =\ state\.splitTabId;\

      \ \ \ \ \ \ \ \ if\ \(Tab\.SplitData\.isValid\(splitToken,\ state\.splitLayout,\ state\.splitRatio,\ state\.splitPosition\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ assert\ splitToken\ !=\ null;\

      \ \ \ \ \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addSplitTabId\(fbb,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ TabGroupIdToken\.createTabGroupIdToken\(fbb,\ splitToken\.getHigh\(\),\ splitToken\.getLow\(\)\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addSplitLayout\(fbb,\ state\.splitLayout\);\

      \ \ \ \ \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addSplitRatio\(fbb,\ state\.splitRatio\);\

      \ \ \ \ \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addSplitPosition\(fbb,\ state\.splitPosition\);\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: "                fbb, TabGroupIdToken.createTabGroupIdToken(fbb, tokenHigh, tokenLow));\n        TabStateFlatBufferV1.addTabHasSensitiveContent(fbb, state.tabHasSensitiveContent);\n        TabStateFlatBufferV1.addIsPinned(fbb, state.isPinned);\n        Token splitToken = state.splitTabId;\n        if (Tab.SplitData.isValid(\n                splitToken, state.splitLayout, state.splitRatio, state.splitPosition)) {\n            assert splitToken != null;\n            TabStateFlatBufferV1.addSplitTabId(\n                    fbb,\n                    TabGroupIdToken.createTabGroupIdToken(\n                            fbb, splitToken.getHigh(), splitToken.getLow()));\n            TabStateFlatBufferV1.addSplitLayout(fbb, state.splitLayout);\n            TabStateFlatBufferV1.addSplitRatio(fbb, state.splitRatio);\n            TabStateFlatBufferV1.addSplitPosition(fbb, state.splitPosition);\n        }\n"

# Reaper Android containers lifecycle successor; retain the complete inherited recipe.
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\

      \ \ \ \ @Override\

      \ \ \ \ public\ ByteBuffer\ serialize\(TabState\ state\)\ \{\

      \ \ \ \ \ \ \ \ FlatBufferBuilder\ fbb\ =\ new\ FlatBufferBuilder\(\);\

      \ \ \ \ \ \ \ \ ByteBuffer\ contentsStateBuffer\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ state\.contentsState\ ==\ null\

      '
    replace: "\n    @Override\n    public ByteBuffer serialize(TabState state) {\n        if (!Tab.isContainerIdWellFormed(state.containerId)) {\n            throw new IllegalArgumentException(\"Malformed storage-container UUID\");\n        }\n        FlatBufferBuilder fbb = new FlatBufferBuilder();\n        ByteBuffer contentsStateBuffer =\n                state.contentsState == null\n"
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ int\ openerAppId\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ fbb\.createString\(state\.openerAppId\ ==\ null\ \?\ NULL_STR\ :\ state\.openerAppId\);\

      \ \ \ \ \ \ \ \ int\ url\ =\ fbb\.createString\(state\.url\ ==\ null\ \?\ NULL_STR\ :\ state\.url\.getSpec\(\)\);\

      \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.startTabStateFlatBufferV1\(fbb\);\

      \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addParentId\(fbb,\ state\.parentId\);\

      \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addRootId\(fbb,\ state\.rootId\);\

      '
    replace: "        int openerAppId =\n                fbb.createString(state.openerAppId == null ? NULL_STR : state.openerAppId);\n        int url = fbb.createString(state.url == null ? NULL_STR : state.url.getSpec());\n        int containerId = fbb.createString(state.containerId);\n        TabStateFlatBufferV1.startTabStateFlatBufferV1(fbb);\n        TabStateFlatBufferV1.addParentId(fbb, state.parentId);\n        TabStateFlatBufferV1.addRootId(fbb, state.rootId);\n"
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ TabStateFlatBufferV1\.addUrl\(fbb,\ url\);\

      \ \ \ \ \ \ \ \ int\ r\ =\ TabStateFlatBufferV1\.endTabStateFlatBufferV1\(fbb\);\

      \ \ \ \ \ \ \ \ fbb\.finish\(r\);\

      \ \ \ \ \ \ \ \ return\ fbb\.dataBuffer\(\);\

      '
    replace: "        }\n\n        TabStateFlatBufferV1.addUrl(fbb, url);\n        TabStateFlatBufferV1.addContainerId(fbb, containerId);\n        int r = TabStateFlatBufferV1.endTabStateFlatBufferV1(fbb);\n        fbb.finish(r);\n        return fbb.dataBuffer();\n"
- description: 'Reaper Android containers: immutable tab identity, trusted CCT admission, persistent partition/SQL/reference lifecycle.'
  regex:
    re_pattern: '\

      \ \ \ \ \ \ \ \ \ \ \ \ TabState\ state\ =\ new\ TabState\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ state\.isIncognito\ =\ mIsEncrypted;\

      \ \ \ \ \ \ \ \ \ \ \ \ state\.parentId\ =\ tabStateFlatBuffer\.parentId\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ state\.rootId\ =\ tabStateFlatBuffer\.rootId\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ String\ openerAppId\ =\ tabStateFlatBuffer\.openerAppId\(\);\

      '
    replace: "\n            TabState state = new TabState();\n            state.isIncognito = mIsEncrypted;\n            String containerId = tabStateFlatBuffer.containerId();\n            state.containerId = containerId == null ? \"\" : containerId;\n            if (!Tab.isContainerIdWellFormed(state.containerId)) {\n                throw new IllegalArgumentException(\"Malformed storage-container UUID\");\n            }\n            state.parentId = tabStateFlatBuffer.parentId();\n            state.rootId = tabStateFlatBuffer.rootId();\n            String openerAppId = tabStateFlatBuffer.openerAppId();\n"
