substitutions:
- description: Exclude Android Actor generated header
  regex:
    pattern: '#include "chrome/common/actor.mojom.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/common/actor.mojom.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android Actor executor and owned monitor headers
  regex:
    pattern: '#include "chrome/renderer/actor/tool_executor.h"

      #include "components/actor/core/task_id.h"  // nogncheck

      #include "components/page_content_annotations/content/mojom/page_stability.mojom.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "chrome/renderer/actor/tool_executor.h"

      #include "components/actor/core/task_id.h"  // nogncheck

      #include "components/page_content_annotations/content/mojom/page_stability.mojom.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android Actor journal forward declaration
  regex:
    pattern: 'namespace actor {

      class Journal;

      }  // namespace actor

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      namespace actor {

      class Journal;

      }  // namespace actor

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android Actor-owned monitor forward declaration
  regex:
    pattern: 'namespace page_content_annotations {

      class PageStabilityMonitor;

      }

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      namespace page_content_annotations {

      class PageStabilityMonitor;

      }

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude all seven Android Actor native overrides
  regex:
    pattern: "  // TODO(crbug.com/471252374): Move actor mojom methods to its own interface.\n  void InitializeTool(actor::mojom::ToolInvocationPtr\
      \ request,\n                      InitializeToolCallback callback) override;\n  void ExecuteTool(const actor::TaskId&\
      \ task_id,\n                   ExecuteToolCallback callback) override;\n  void InvokeTool(actor::mojom::ToolInvocationPtr\
      \ request,\n                  InvokeToolCallback callback) override;\n  void CancelTool(const actor::TaskId& task_id)\
      \ override;\n  void StartActorJournal(\n      mojo::PendingAssociatedRemote<actor::mojom::JournalClient> client)\n \
      \     override;\n  void GetCrossDocumentScriptToolResult(\n      const base::UnguessableToken& execution_id,\n     \
      \ GetCrossDocumentScriptToolResultCallback callback) override;\n  // Multiple calls will clobber a PageStabilityMonitor\
      \ previously created and\n  // it's the caller's responsibility to ensure the monitor is unneeded before\n  // creating\
      \ a new one.\n  //\n  // `task_id` identifies the ID of the active actor tool.\n  // `supports_paint_stability` indicates\
      \ whether to include paint stability in\n  // page stability heuristics.\n  void CreatePageStabilityMonitor(\n     \
      \ mojo::PendingReceiver<\n          page_content_annotations::mojom::PageStabilityMonitor> monitor,\n      const actor::TaskId&\
      \ task_id,\n      bool supports_paint_stability) override;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // TODO(crbug.com/471252374): Move actor mojom methods to its own interface.\n\
      \  void InitializeTool(actor::mojom::ToolInvocationPtr request,\n                      InitializeToolCallback callback)\
      \ override;\n  void ExecuteTool(const actor::TaskId& task_id,\n                   ExecuteToolCallback callback) override;\n\
      \  void InvokeTool(actor::mojom::ToolInvocationPtr request,\n                  InvokeToolCallback callback) override;\n\
      \  void CancelTool(const actor::TaskId& task_id) override;\n  void StartActorJournal(\n      mojo::PendingAssociatedRemote<actor::mojom::JournalClient>\
      \ client)\n      override;\n  void GetCrossDocumentScriptToolResult(\n      const base::UnguessableToken& execution_id,\n\
      \      GetCrossDocumentScriptToolResultCallback callback) override;\n  // Multiple calls will clobber a PageStabilityMonitor\
      \ previously created and\n  // it's the caller's responsibility to ensure the monitor is unneeded before\n  // creating\
      \ a new one.\n  //\n  // `task_id` identifies the ID of the active actor tool.\n  // `supports_paint_stability` indicates\
      \ whether to include paint stability in\n  // page stability heuristics.\n  void CreatePageStabilityMonitor(\n     \
      \ mojo::PendingReceiver<\n          page_content_annotations::mojom::PageStabilityMonitor> monitor,\n      const actor::TaskId&\
      \ task_id,\n      bool supports_paint_stability) override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android Actor journal ownership
  regex:
    pattern: '  std::unique_ptr<actor::Journal> actor_journal_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<actor::Journal> actor_journal_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android Actor executor and monitor ownership
  regex:
    pattern: "  std::unique_ptr<actor::ToolExecutor> tool_executor_;\n  std::unique_ptr<page_content_annotations::PageStabilityMonitor>\n\
      \      page_stability_monitor_;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<actor::ToolExecutor> tool_executor_;\n  std::unique_ptr<page_content_annotations::PageStabilityMonitor>\n\
      \      page_stability_monitor_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
