substitutions:
  - description: |-
      Use BraveContentSettingsAgentImpl instead of the upstream agent.
    regex:
      pattern: 'new content_settings::ContentSettingsAgentImpl('
      replace: 'new content_settings::BraveContentSettingsAgentImpl('

  - description: |-
      Prevents unnecessary js console logs spam.
    regex:
      pattern:
        'new dom_distiller::DistillabilityAgent(render_frame, DCHECK_IS_ON())'
      replace: 'new dom_distiller::DistillabilityAgent(render_frame, false)'

  - description: |-
      Give ~ChromeContentRendererClient() a real body to preempt.

      It is `= default` upstream, and `preempt_function_impl` needs an actual
      compound statement to insert into.
    regex:
      pattern:
        'ChromeContentRendererClient::~ChromeContentRendererClient() = default;'
      replace:
        "ChromeContentRendererClient::~ChromeContentRendererClient() {\n}"

  - description: |-
      Leak chrome_observer_ instead of crashing on teardown.

      chrome_observer_ (a ChromeRenderThreadObserver) owns several mojo
      objects (visited_link_reader_, content_settings_manager_,
      renderer_configuration_receivers_) bound to the render thread's
      sequence. The only place that ever explicitly destroys a
      ChromeContentRendererClient via a destructible unique_ptr is the
      test-only ChromeTestChromeMainDelegate
      (chrome/test/base/chrome_test_launcher.h); in a real browser process
      (desktop or Android), the renderer is always torn down by the OS
      (TerminateCurrentProcessImmediately on desktop, Process.killProcess()
      or OS reclaim on Android) before this destructor could ever run. So the
      only way to reach this code at all is --single-process test teardown,
      where the render thread's sequence may already be gone by the time
      this runs, tripping
      mojo::InterfaceEndpointClient::CalledOnValidSequence() on whichever
      sequence-affine member is destroyed first, and crashing.
      RenderThreadImpl::ShouldBeDestroyed() already leaks the render thread
      itself for the exact same reason; leaking chrome_observer_ as a whole
      here avoids having to track down each sequence-affine member
      individually, since there is no reachable call site where a clean
      destruction would be either possible or necessary.
    preempt_function_impl:
      function_name: ChromeContentRendererClient::~ChromeContentRendererClient
      code: |
        chrome_observer_.release();
  - description: Exclude only the shopping renderer implementation import on Android
    regex:
      pattern: '#include "components/commerce/content/renderer/commerce_web_extractor.h"

        '
      replace: '#if !BUILDFLAG(IS_ANDROID)

        #include "components/commerce/content/renderer/commerce_web_extractor.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        '
    count: 1
  - description: Exclude only optional shopping main-frame extractor construction on Android
    regex:
      pattern: "  if (render_frame->IsMainFrame()) {\n    new commerce::CommerceWebExtractor(render_frame, registry);\n  }\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (render_frame->IsMainFrame()) {\n    new commerce::CommerceWebExtractor(render_frame,\
        \ registry);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Keep wallet renderer includes outside Android
    regex:
      pattern: '#include "components/wallet/content/renderer/image_extractor.h"

        #include "components/wallet/core/common/wallet_features.h"

        '
      replace: '#if !BUILDFLAG(IS_ANDROID)

        #include "components/wallet/content/renderer/image_extractor.h"

        #include "components/wallet/core/common/wallet_features.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        '
    count: 1
  - description: Remove legacy Android boarding pass renderer include
    regex:
      pattern: '#include "chrome/renderer/wallet/boarding_pass_extractor.h"

        '
      replace: ''
    count: 1
  - description: Remove legacy Android boarding pass observer construction
    regex:
      pattern: "#if BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(features::kBoardingPassDetector) &&\n      render_frame->IsMainFrame())\
        \ {\n    new wallet::BoardingPassExtractor(render_frame, registry);\n  }\n#endif\n\n"
      replace: ''
    count: 1
  - description: Keep wallet image extraction construction outside Android
    regex:
      pattern: "  if (base::FeatureList::IsEnabled(\n          wallet::features::kWalletablePassDetection) &&\n      render_frame->IsMainFrame())\
        \ {\n    wallet::ImageExtractor::Create(render_frame, registry);\n  }\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(\n          wallet::features::kWalletablePassDetection)\
        \ &&\n      render_frame->IsMainFrame()) {\n    wallet::ImageExtractor::Create(render_frame, registry);\n  }\n#endif\
        \  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
