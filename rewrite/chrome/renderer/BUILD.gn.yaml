substitutions:
  - description: Add the Brave renderer sources.
    add_literal_to_list:
      target: renderer
      list_name: sources
      literal: brave_chrome_renderer_sources
      import: //brave/renderer/sources.gni

  - description: Add the Brave renderer deps.
    add_literal_to_list:
      target: renderer
      list_name: deps
      literal: brave_chrome_renderer_deps
      import: //brave/renderer/sources.gni

  - description: Add the Brave renderer public_deps.
    add_literal_to_list:
      target: renderer
      list_name: public_deps
      literal: brave_chrome_renderer_public_deps
      import: //brave/renderer/sources.gni

  - description: 'Android concrete AI source/provider removal: chrome/renderer/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//ui/gfx/geometry",\

        \ \ \ \ "//v8",\

        \ \ \]\

        \ \ deps\ \+=\ brave_chrome_renderer_deps\

        \

        \ \ if\ \(is_mac\ \|\|\ is_win\ \|\|\ is_linux\ \|\|\ is_chromeos\)\ \{\

        '
      replace: "    \"//ui/gfx/geometry\",\n    \"//v8\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//chrome/renderer/actor\",\n      \"//components/actor/core:features\",\n      \"//components/actor/core:task_id\",\n    ]\n  }\n  deps += brave_chrome_renderer_deps\n\n  if (is_mac || is_win || is_linux || is_chromeos) {\n"
  - description: 'Android concrete AI source/provider removal: chrome/renderer/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ \ \ "searchbox/searchbox_extension\.cc",\

        \ \ \ \ \ \ "searchbox/searchbox_extension\.h",\

        \ \ \ \ \]\

        \

        \ \ \ \ deps\ \+=\ \[\

        \ \ \ \ \ \ "//chrome/common/read_anything:mojo_bindings",\

        '
      replace: "      \"searchbox/searchbox_extension.cc\",\n      \"searchbox/searchbox_extension.h\",\n    ]\n    if (is_android) {\n      sources -= [\n        \"password_manager/remote_actor_credential_sharing_extension.cc\",\n        \"password_manager/remote_actor_credential_sharing_extension.h\",\n      ]\n    }\n\n    deps += [\n      \"//chrome/common/read_anything:mojo_bindings\",\n"
  - description: Exclude the Android shopping backend from renderer while preserving shared providers and desktop
    regex:
      pattern: "      \"indigo/indigo_agent.cc\",\n      \"indigo/indigo_agent.h\",\n      \"indigo/onboarding_agent.cc\",\n\
        \      \"indigo/onboarding_agent.h\",\n    ]\n  }\n}"
      replace: "      \"indigo/indigo_agent.cc\",\n      \"indigo/indigo_agent.h\",\n      \"indigo/onboarding_agent.cc\",\n\
        \      \"indigo/onboarding_agent.h\",\n    ]\n  }\n  if (is_android) {\n    deps -= [\n      \"//components/commerce/content/renderer\"\
        ,\n    ]\n  }\n\n}"
    count: 1
  - description: Exclude both dedicated wallet renderer paths from Android admissions
    regex:
      pattern: "  if (is_android) {\n    sources += [\n      \"net/page_auto_fetcher_helper_android.cc\",\n      \"net/page_auto_fetcher_helper_android.h\"\
        ,\n      \"sandbox_status_extension_android.cc\",\n      \"sandbox_status_extension_android.h\",\n      \"wallet/boarding_pass_extractor.cc\"\
        ,\n      \"wallet/boarding_pass_extractor.h\",\n    ]\n    deps += [ \"//chrome/common/wallet:mojo_bindings\" ]\n  }\
        \ else {\n"
      replace: "  if (is_android) {\n    deps -= [\n      \"//components/wallet/content/renderer\",\n      \"//components/wallet/core/common:features\"\
        ,\n    ]\n    sources += [\n      \"net/page_auto_fetcher_helper_android.cc\",\n      \"net/page_auto_fetcher_helper_android.h\"\
        ,\n      \"sandbox_status_extension_android.cc\",\n      \"sandbox_status_extension_android.h\",\n    ]\n  } else {\n"
    count: 1
  - description: "Reviewed resource8 after538 source 2/1: Android renderer retains generated Lens metadata IPC but does not depend on unused broad Lens implementation library."
    regex:
      re_pattern: "\\ \\ if\\ \\(is_android\\)\\ \\{\\\n\\ \\ \\ \\ deps\\ \\-=\\ \\[\\\n\\ \\ \\ \\ \\ \\ \"//chrome/renderer/actor\",\\\n\\ \\ \\ \\ \\ \\ \"//components/actor/core:features\",\\\n\\ \\ \\ \\ \\ \\ \"//components/actor/core:task_id\",\\\n\\ \\ \\ \\ \\]\\\n\\ \\ \\}\\\n"
      replace: "  if (is_android) {\n    deps -= [\n      \"//chrome/renderer/actor\",\n      \"//components/actor/core:features\",\n      \"//components/actor/core:task_id\",\n      \"//components/lens\",\n    ]\n  }\n"
    count: 1
