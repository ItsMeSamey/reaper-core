# Isolated Android script-loader native tests; ordinary defaults preserved.
substitutions:
- description: "Expose a separate Android script-loader test APK and fixed capsule resources."
  regex:
    re_pattern: "test\\(\"extensions_unittests\"\\)\\ \\{\\\n"
    replace: "test(\"extensions_unittests\") {\n  if (is_android) {\n    reaper_isolated_script_loader_apk = true\n    reaper_script_loader_asset_sources =\n        [ \"$root_out_dir/extensions_shell_and_test.pak\" ]\n    reaper_script_loader_asset_paths =\n        [ \"reaper_script_loader_test_data/extensions_shell_and_test.pak\" ]\n    reaper_script_loader_asset_deps = [ \":shell_and_test_pak\" ]\n  }\n"
