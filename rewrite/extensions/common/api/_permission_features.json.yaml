substitutions:
- description: Allow the implemented system.storage permission on desktop Android.
  regex:
    pattern: "    // \"desktop_android\" is not supported.\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\"]\n  },\n  \"system.display\""
    replace: "    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\", \"desktop_android\"]\n  },\n  \"system.display\""
- description: Permit ordinary MV3 printer providers through the Android print service.
  regex:
    re_pattern: '\ \ "printerProvider":\ \{\

      \ \ \ \ "channel":\ "stable",\

      \ \ \ \ "extension_types":\ \["extension",\ "platform_app"\ \],\

      \ \ \ \ //\ "desktop_android"\ is\ not\ supported\.\

      \ \ \ \ "platforms":\ \["chromeos",\ "linux",\ "mac",\ "win"\]\

      \ \ \},'
    replace: "  \"printerProvider\": {\n    \"channel\": \"stable\",\n    \"extension_types\": [\"extension\", \"platform_app\" ],\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\", \"desktop_android\"]\n  },"
