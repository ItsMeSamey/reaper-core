# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Include the Android types-only schemas with the core.
  regex:
    pattern: if (enable_desktop_android_extensions) {
    replace: if (is_android && enable_extensions_core) {
- description: Generate system.storage bindings for Android extension builds.
  regex:
    pattern: '  "system_network.webidl",'
    replace: "  \"system_network.webidl\",\n  \"system_storage.webidl\","
- description: Avoid generating the storage schema twice on desktop.
  regex:
    pattern: '    "system_storage.webidl",

      '
    replace: ''
- description: Generate printer provider bindings with extension core.
  regex:
    re_pattern: \ \ "power\.webidl",
    replace: "  \"power.webidl\",\n  \"printer_provider_internal.webidl\",\n  \"printer_provider.webidl\","
- description: Remove duplicate desktop printer provider schemas.
  regex:
    re_pattern: '\ \ \ \ "printer_provider_internal\.webidl",\

      \ \ \ \ "printer_provider\.webidl",\

      '
    replace: ''
- description: Compile public MIME handler bindings with extensions core remove desktop duplicate
  regex:
    re_pattern: '\ \ \ \ "mime_handler\.webidl",\

      '
    replace: ''
- description: Compile public MIME handler bindings with extensions core
  regex:
    re_pattern: '\ \ "offscreen\.webidl",\

      '
    replace: "  \"mime_handler.webidl\",\n  \"offscreen.webidl\",\n"
