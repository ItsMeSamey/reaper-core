substitutions:
- description: Expose public MIME API only with its implemented Android stream backend
  regex:
    re_pattern: '\ \ "mimeHandler":\ \[\{\

      \ \ \ \ "dependencies":\ \["manifest:mime_types_handler"\],\

      \ \ \ \ "contexts":\ \["privileged_extension"\],\

      \ \ \ \ //\ "desktop_android"\ is\ not\ supported\.\

      \ \ \ \ "platforms":\ \["chromeos",\ "linux",\ "mac",\ "win"\],\

      \ \ \ \ "channel":\ "dev",\

      \ \ \ \ "requires_delegated_availability_check":\ true\

      \ \ \},\ \{\

      \ \ \ \ "dependencies":\ \["manifest:mime_types_handler"\],\

      \ \ \ \ "contexts":\ \["privileged_extension"\],\

      \ \ \ \ //\ "desktop_android"\ is\ not\ supported\.\

      \ \ \ \ "platforms":\ \["chromeos",\ "linux",\ "mac",\ "win"\],\

      \ \ \ \ "channel":\ "stable",\

      \ \ \ \ "feature_flag":\ "ApiMimeHandler"\

      \ \ \}\],\

      '
    replace: "  \"mimeHandler\": [{\n    \"dependencies\": [\"manifest:mime_types_handler\"],\n    \"contexts\": [\"privileged_extension\"],\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\", \"desktop_android\"],\n    \"channel\": \"dev\",\n    \"requires_delegated_availability_check\": true\n  }, {\n    \"dependencies\": [\"manifest:mime_types_handler\"],\n    \"contexts\": [\"privileged_extension\"],\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\", \"desktop_android\"],\n    \"channel\": \"stable\",\n    \"feature_flag\": \"ApiMimeHandler\"\n  }],\n"
- description: Expose replacement web apps with the real Android hosted-PWA backend.
  regex:
    pattern: "    // \"desktop_android\" is not supported. http://crbug.com/371332103\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\"]"
    replace: "    // Android uses validated standalone PWA consent and confirmed launcher pinning.\n    \"platforms\": [\"chromeos\", \"linux\", \"mac\", \"win\", \"desktop_android\"]"
