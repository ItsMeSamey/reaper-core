substitutions:
  - description: "Exclude developer AI guidance URL on Android."
    regex:
      pattern: "const char kModernWebGuidanceURL[] =\n    \"https://developer.chrome.com/docs/extensions/ai/\"\n    \"build-with-ai#modern_web_guidance\";\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nconst char kModernWebGuidanceURL[] =\n    \"https://developer.chrome.com/docs/extensions/ai/\"\n    \"build-with-ai#modern_web_guidance\";\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Exclude developer documentation URL on Android."
    regex:
      pattern: "GURL GetModernWebGuidanceURL() {\n  return GURL(kModernWebGuidanceURL);\n}\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nGURL GetModernWebGuidanceURL() {\n  return GURL(kModernWebGuidanceURL);\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
