substitutions:
  - description: "Make the Android platform guard available for extension URLs."
    regex:
      pattern: "#include \"build/branding_buildflags.h\"\n"
      replace: "#include \"build/branding_buildflags.h\"\n#include \"build/build_config.h\"\n"
    count: 1
  - description: "Exclude developer documentation URL declaration on Android."
    regex:
      pattern: "extern const char kModernWebGuidanceURL[];\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nextern const char kModernWebGuidanceURL[];\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Exclude developer AI guidance URL declaration on Android."
    regex:
      pattern: "// Returns the URL to the Chrome Web Store's \"Modern Web Guidance\" page for\n// extensions.\nGURL GetModernWebGuidanceURL();\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n// Returns the URL to the Chrome Web Store's \"Modern Web Guidance\" page for\n// extensions.\nGURL GetModernWebGuidanceURL();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
