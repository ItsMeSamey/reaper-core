substitutions:
  - description: 'Ship kApiGlicPrivate disabled.'
    set_feature_flag_default_state:
      feature_name: kApiGlicPrivate
      value: base::FEATURE_DISABLED_BY_DEFAULT
  - description: 'Ship kApiDesktopAndroidNativeMessaging disabled.'
    set_feature_flag_default_state:
      feature_name: kApiDesktopAndroidNativeMessaging
      value: base::FEATURE_DISABLED_BY_DEFAULT
  - description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
    regex:
      re_pattern: 'BASE_FEATURE\(kWebRequestPerContextEventDispatch,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ base::FEATURE_ENABLED_BY_DEFAULT\);\

        \

        BASE_OVERRIDDEN_FEATURE\(kApiDesktopAndroidNativeMessaging,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ base::FEATURE_DISABLED_BY_DEFAULT\);\

        \

        BASE_FEATURE\(kApiDesktopAndroidNativeMessagingBypassExtensionAllowlist,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ base::FEATURE_DISABLED_BY_DEFAULT\);\

        '
      replace: "BASE_FEATURE(kWebRequestPerContextEventDispatch,\n             base::FEATURE_ENABLED_BY_DEFAULT);\n\n#if BUILDFLAG(IS_ANDROID)\nBASE_OVERRIDDEN_FEATURE(kApiDesktopAndroidNativeMessaging,\n                        base::FEATURE_ENABLED_BY_DEFAULT);\n#else\nBASE_OVERRIDDEN_FEATURE(kApiDesktopAndroidNativeMessaging,\n                        base::FEATURE_DISABLED_BY_DEFAULT);\n#endif\n\nBASE_FEATURE(kApiDesktopAndroidNativeMessagingBypassExtensionAllowlist,\n             base::FEATURE_DISABLED_BY_DEFAULT);\n"
