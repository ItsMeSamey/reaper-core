substitutions:
- description: "Exclude the shared optional acknowledgement metric-limit definition on Android after closing all consumers."
  regex:
    re_pattern: "base::TimeDelta\\ kEventAckMetricTimeLimit\\ =\\ base::Minutes\\(5\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nbase::TimeDelta kEventAckMetricTimeLimit = base::Minutes(5);\n#endif\n"
  count: 1
