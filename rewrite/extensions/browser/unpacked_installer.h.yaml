      "description": "Keep Android read-only SAF static DNR indexes in the owning profile",
      "regex": {
        "pattern": "  // The BrowserContext the extension is being installed in.\n  raw_ptr<content::BrowserContext> browser_context_;\n\n  // The pathname of the directory to load from, which is an absolute path\n  // after GetAbsolutePath has been called.\n  base::FilePath extension_path_;\n",
        "replace": "  // The BrowserContext the extension is being installed in.\n  raw_ptr<content::BrowserContext> browser_context_;\n\n  // Captured on UI before worker indexing; never dereference a context there.\n  const base::FilePath profile_path_;\n\n  // The pathname of the directory to load from, which is an absolute path\n  // after GetAbsolutePath has been called.\n  base::FilePath extension_path_;\n"
      },
      "count": 1
    }
  ]
}
