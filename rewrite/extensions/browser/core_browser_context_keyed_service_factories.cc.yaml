# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Keep legacy guest streams desktop-only while admitting generic registry
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

      \#include\ "extensions/browser/mime_handler/mime_handler_registry\.h"\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      \#endif\ \ //\ BUILDFLAG\(ENABLE_EXTENSIONS\)'
    replace: '#endif  // BUILDFLAG(ENABLE_EXTENSIONS)

      #include "extensions/browser/mime_handler/mime_handler_registry.h"'
- description: Construct generic MIME registry on Android
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

      \ \ MimeHandlerRegistry::EnsureFactoryBuilt\(\);\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      \#endif\ \ //\ BUILDFLAG\(ENABLE_EXTENSIONS\)'
    replace: "#endif  // BUILDFLAG(ENABLE_EXTENSIONS)\n  MimeHandlerRegistry::EnsureFactoryBuilt();"
- description: Declare optional Mojo registry factory for Android early registration
  regex:
    re_pattern: '\#include\ "extensions/buildflags/buildflags\.h"\

      '
    replace: '#include "extensions/buildflags/buildflags.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "extensions/browser/extension_mojo_binder_registry_factory.h"

      #endif

      '
- description: Register Android Mojo binder factory before extension renderer startup
  regex:
    re_pattern: '\ \ ExtensionFunction::EnsureShutdownNotifierFactoryBuilt\(\);\

      '
    replace: "  ExtensionFunction::EnsureShutdownNotifierFactoryBuilt();\n#if BUILDFLAG(IS_ANDROID)\n\
      \  ExtensionMojoBinderRegistryFactory::GetInstance();\n#endif\n"
- description: "Android config-map early registration 1"
  regex:
    re_pattern: "\\#include\\ \"extensions/browser/extension_mojo_binder_registry_factory\\.h\""
    replace: "#include \"extensions/browser/extension_config_map_factory.h\"\n#include \"extensions/browser/extension_mojo_binder_registry_factory.h\""
  count: 1
- description: "Android config-map early registration 2"
  regex:
    re_pattern: "\\ \\ ExtensionMojoBinderRegistryFactory::GetInstance\\(\\);"
    replace: "  ExtensionConfigMapFactory::GetInstance();\n  ExtensionMojoBinderRegistryFactory::GetInstance();"
  count: 1
