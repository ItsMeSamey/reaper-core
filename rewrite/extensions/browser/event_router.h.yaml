substitutions:
- description: "Declare the Android build flag for the shared metric limit boundary."
  regex:
    re_pattern: "\\#include\\ \"base/values\\.h\"\\\n"
    replace: "#include \"base/values.h\"\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Exclude the optional acknowledgement metric-limit extern and comment on Android."
  regex:
    re_pattern: "//\\ The\\ upper\\ bound\\ of\\ time\\ allowed\\ for\\ event\\ dispatch\\ histograms\\.\\ Also\\ used\\ in\\\n//\\ histograms\\ for\\ determining\\ when\\ an\\ event\\ is\\ \"late\"\\ \\(it\\ has\\ not\\ been\\ acked\\ by\\\n//\\ the\\ renderer\\ to\\ the\\ browser\\ by\\ this\\ time\\)\\.\\\nextern\\ base::TimeDelta\\ kEventAckMetricTimeLimit;\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// The upper bound of time allowed for event dispatch histograms. Also used in\n// histograms for determining when an event is \"late\" (it has not been acked by\n// the renderer to the browser by this time).\nextern base::TimeDelta kEventAckMetricTimeLimit;\n#endif\n"
  count: 1
- description: "Exclude its desktop-only metric test setter on Android."
  regex:
    re_pattern: "\\ \\ void\\ SetEventAckMetricTimeLimitForTesting\\(base::TimeDelta\\ time_limit\\)\\ \\{\\\n\\ \\ \\ \\ kEventAckMetricTimeLimit\\ =\\ time_limit;\\\n\\ \\ \\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void SetEventAckMetricTimeLimitForTesting(base::TimeDelta time_limit) {\n    kEventAckMetricTimeLimit = time_limit;\n  }\n#endif\n"
  count: 1
