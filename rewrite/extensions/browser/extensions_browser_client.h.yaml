substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '\ \ //\ WARNING:\ This\ may\ create\ a\ new\ off\-the\-record\ context\.\ To\ avoid\ creating\

      \ \ //\ another\ context,\ check\ HasOffTheRecordContext\(\)\ first\.\

      \ \ virtual\ content::BrowserContext\*\ GetOffTheRecordContext\(\

      \ \ \ \ \ \ content::BrowserContext\*\ context\)\ =\ 0;\

      \

      \ \ //\ Returns\ the\ original\ "recording"\ context\.\ This\ method\ returns\ `context`\ if\

      \ \ //\ `context`\ is\ not\ incognito\.\

      \ \ virtual\ content::BrowserContext\*\ GetOriginalContext\(\

      '
    replace: "  // WARNING: This may create a new off-the-record context. To avoid creating\n  // another context, check HasOffTheRecordContext()\
      \ first.\n  virtual content::BrowserContext* GetOffTheRecordContext(\n      content::BrowserContext* context) = 0;\n\
      \n#if BUILDFLAG(IS_ANDROID)\n  // Existing related contexts whose factories share extension interception\n  // state.\
      \ This invalidation-only enumeration neither grants permissions nor\n  // creates an off-the-record context. Other embedders\
      \ retain their own\n  // context.\n  virtual std::vector<content::BrowserContext*>\n  GetRelatedContextsForFactoryReset(content::BrowserContext*\
      \ context) const;\n#endif\n\n  // Returns the original \"recording\" context. This method returns `context` if\n  //\
      \ `context` is not incognito.\n  virtual content::BrowserContext* GetOriginalContext(\n"
