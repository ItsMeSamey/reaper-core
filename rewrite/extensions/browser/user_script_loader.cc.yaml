substitutions:
- description: Android script-load failure completion/state 1
  regex:
    pattern: "const char kNoScriptChangesErrorMsg[] =\n    \"No changes to loaded scripts would result from this operation.\"\
      ;\n"
    replace: "const char kNoScriptChangesErrorMsg[] =\n    \"No changes to loaded scripts would result from this operation.\"\
      ;\n\n#if BUILDFLAG(IS_ANDROID)\nconst char kUserScriptSerializationErrorMsg[] =\n    \"Scripts could not be loaded because\
      \ shared memory could not be created.\";\n#endif\n"
  count: 1
- description: Android script-load failure completion/state 2
  regex:
    pattern: '  remaining_callbacks.splice(remaining_callbacks.end(), loading_callbacks_);

      '
    replace: "  remaining_callbacks.splice(remaining_callbacks.end(), loading_callbacks_);\n#if BUILDFLAG(IS_ANDROID)\n  remaining_callbacks.splice(remaining_callbacks.end(),\
      \ failed_load_callbacks_);\n#endif\n"
  count: 1
- description: Android script-load failure completion/state 3
  regex:
    pattern: "  // Reload any loaded scripts, and clear out |loaded_scripts_| to indicate that\n  // the scripts aren't currently\
      \ ready.\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Keep the last published state through any coalesced reloads. An operation\n\
      \  // reported as failed must not appear in a later unrelated successful load.\n  if (!scripts_before_load_) {\n   \
      \ scripts_before_load_.emplace();\n    for (const auto& script : *loaded_scripts_) {\n      auto copy = UserScript::CopyMetadataFrom(*script);\n\
      \      for (size_t i = 0; i < script->js_scripts().size(); ++i) {\n        copy->js_scripts()[i]->set_content(\n   \
      \         std::string(script->js_scripts()[i]->GetContent()));\n      }\n      for (size_t i = 0; i < script->css_scripts().size();\
      \ ++i) {\n        copy->css_scripts()[i]->set_content(\n            std::string(script->css_scripts()[i]->GetContent()));\n\
      \      }\n      scripts_before_load_->push_back(std::move(copy));\n    }\n  }\n#endif\n\n  // Reload any loaded scripts,\
      \ and clear out |loaded_scripts_| to indicate that\n  // the scripts aren't currently ready.\n"
  count: 1
- description: Android script-load failure completion/state 4
  regex:
    pattern: "    // Pretend the extension change didn't happen.\n    return;\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n    // Roll back before completing clients, which may start another load or\n   \
      \ // destroy this loader. Preserve shared_memory_ and do not announce success.\n    DCHECK(scripts_before_load_);\n\
      \    loaded_scripts_ = std::move(*scripts_before_load_);\n    scripts_before_load_.reset();\n    failed_load_callbacks_.splice(failed_load_callbacks_.end(),\n\
      \                                 loading_callbacks_);\n    base::WeakPtr<UserScriptLoader> weak_this = weak_factory_.GetWeakPtr();\n\
      \    while (!failed_load_callbacks_.empty()) {\n      auto callback = std::move(failed_load_callbacks_.front());\n \
      \     failed_load_callbacks_.pop_front();\n      std::move(callback).Run(\n          this, std::make_optional(kUserScriptSerializationErrorMsg));\n\
      \      if (!weak_this) {\n        return;\n      }\n    }\n#endif\n    // Pretend the extension change didn't happen.\n\
      \    return;\n"
  count: 1
- description: Android script-load failure completion/state 5
  regex:
    pattern: "  // We've got scripts ready to go.\n  shared_memory_ = std::move(shared_memory);\n"
    replace: "  // We've got scripts ready to go.\n#if BUILDFLAG(IS_ANDROID)\n  scripts_before_load_.reset();\n#endif\n  shared_memory_\
      \ = std::move(shared_memory);\n"
  count: 1
