    replace: "  if (!download_started_) {\n    download_started_ = true;\n  }\n#if BUILDFLAG(IS_ANDROID)\n  // DownloadManager can deliver an already-interrupted item with a successful\n  // started callback. Its state notification predates our observer, so consume\n  // terminal errors now instead of leaving the install operation pending.\n  const auto state = item->GetState();\n  if (state == DownloadItem::INTERRUPTED || state == DownloadItem::CANCELLED) {\n    OnDownloadUpdated(item);\n  }\n#endif\n}\n\nvoid WebstoreInstaller::OnDownloadUpdated(DownloadItem* download) {\n"
  count: 1
- description: Android WebstoreInstaller retires a destroyed download before CRX handoff
  regex:
    re_pattern: "\\ \\ CHECK_EQ\\(download_item_,\\ download\\);\\\n\\ \\ download_item_\\->RemoveObserver\\(this\\);\\\n\\ \\ download_item_\\ =\\ nullptr;\\\n\\}\\\n\\\nvoid\\ WebstoreInstaller::DownloadNextPendingModule\\(\\)\\ \\{\\\n"
    replace: "  CHECK_EQ(download_item_, download);\n  download_item_->RemoveObserver(this);\n  download_item_ = nullptr;\n#if BUILDFLAG(IS_ANDROID)\n  // If the item disappears before CRX installation takes ownership, no further\n  // download update can complete the operation. Clear the item before reporting\n  // failure so retirement never touches the object currently being destroyed.\n  if (!completed_ && !crx_installer_) {\n    ReportFailure(kDownloadCanceledError, FAILURE_REASON_CANCELLED);\n  }\n#endif\n}\n\nvoid WebstoreInstaller::DownloadNextPendingModule() {\n"
  count: 1
