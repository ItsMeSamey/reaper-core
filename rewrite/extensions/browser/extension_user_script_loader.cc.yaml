    replace: "}\n\nExtensionUserScriptLoader::~ExtensionUserScriptLoader() = default;\n\nvoid ExtensionUserScriptLoader::AddPendingDynamicScriptIDs(\n    std::set<std::string> script_ids) {\n#if BUILDFLAG(IS_ANDROID)\n  for (const auto& id : script_ids) {\n    auto& state = dynamic_script_states_[id];\n    if (state.epoch.is_empty()) {\n      state.epoch = base::UnguessableToken::Create();\n    }\n    state.legacy_pending = true;\n  }\n#endif\n  pending_dynamic_script_ids_.insert(\n      std::make_move_iterator(script_ids.begin()),\n      std::make_move_iterator(script_ids.end()));\n}\n\nvoid ExtensionUserScriptLoader::RemovePendingDynamicScriptIDs(\n    const std::set<std::string>& script_ids) {\n#if BUILDFLAG(IS_ANDROID)\n  for (const auto& id : script_ids) {\n    auto& state = dynamic_script_states_[id];\n    state.epoch = base::UnguessableToken();\n    state.operations.clear();\n    state.submitted = DynamicScriptOperation();\n    state.submitted_script.reset();\n    state.legacy_pending = false;\n    state.initial_restore_cancelled = true;\n    pending_dynamic_script_ids_.erase(id);\n  }\n  PruneDynamicScriptStates();\n#else\n  for (const auto& id : script_ids)\n    pending_dynamic_script_ids_.erase(id);\n#endif\n}\n\n#if BUILDFLAG(IS_ANDROID)\nExtensionUserScriptLoader::DynamicScriptOperation\nExtensionUserScriptLoader::BeginDynamicScriptOperation(\n    const std::set<std::string>& script_ids, bool for_update) {\n  DynamicScriptOperation operation = base::UnguessableToken::Create();\n  auto& epochs = dynamic_script_operations_[operation];\n  for (const auto& id : script_ids) {\n    auto& state = dynamic_script_states_[id];\n    if (for_update && !IsDynamicScriptRegistrationCurrent(id)) {\n      continue;\n    }\n    if (state.epoch.is_empty() ||\n        (state.operations.empty() && !state.legacy_pending &&\n         state.committed.is_empty())) {\n      state.epoch = base::UnguessableToken::Create();\n    }\n    epochs.emplace(id, state.epoch);\n    state.operations.insert(operation);\n    pending_dynamic_script_ids_.insert(id);\n  }\n  return operation;\n}\n\nbool ExtensionUserScriptLoader::IsDynamicScriptRegistrationCurrent(\n    const std::string& id) const {\n  auto state = dynamic_script_states_.find(id);\n  return state != dynamic_script_states_.end() &&\n         !state->second.epoch.is_empty() &&\n         !state->second.committed.is_empty() &&\n         state->second.committed != state->second.retired_committed;\n}\n\nbool ExtensionUserScriptLoader::IsCurrentDynamicScriptOperation(\n    const DynamicScriptOperation& operation,\n    const std::string& id) const {\n  auto pending = dynamic_script_operations_.find(operation);\n  if (pending == dynamic_script_operations_.end()) {\n    return false;\n  }\n  auto epoch = pending->second.find(id);\n  auto state = dynamic_script_states_.find(id);\n  return epoch != pending->second.end() &&\n         state != dynamic_script_states_.end() &&\n         state->second.epoch == epoch->second &&\n         state->second.operations.contains(operation);\n}\n\nvoid ExtensionUserScriptLoader::FinishDynamicScriptOperation(\n    const DynamicScriptOperation& operation) {\n  auto pending = dynamic_script_operations_.extract(operation);\n  if (pending.empty()) {\n    return;\n  }\n  for (const auto& [id, epoch] : pending.mapped()) {\n    auto state = dynamic_script_states_.find(id);\n    if (state == dynamic_script_states_.end() || state->second.epoch != epoch) {\n      continue;\n    }\n    state->second.operations.erase(operation);\n    if (state->second.submitted == operation) {\n      state->second.submitted = DynamicScriptOperation();\n      state->second.submitted_script.reset();\n    }\n    if (state->second.operations.empty() && !state->second.legacy_pending) {\n      pending_dynamic_script_ids_.erase(id);\n    }\n  }\n  PruneDynamicScriptStates();\n}\n\nvoid ExtensionUserScriptLoader::PruneDynamicScriptStates() {\n  // Cancellation tombstones must survive until the raw StateStore input has\n  // been filtered, even when disabled sources need no native shared-memory load.\n  if (initial_dynamic_scripts_read_pending_) {\n    return;\n  }\n  std::erase_if(dynamic_script_states_, [this](const auto& entry) {\n    const auto& [id, state] = entry;\n    // An unused epoch is not ownership. Old replies still carry their unique\n    // epoch and cannot claim a newly created state after this entry is erased.\n    return state.operations.empty() && !state.submitted_script &&\n           state.committed.is_empty() && !state.legacy_pending &&\n           !pending_dynamic_script_ids_.contains(id);\n  });\n}\n\nExtensionUserScriptLoader::DynamicScriptOwners\nExtensionUserScriptLoader::CaptureDynamicScriptOwners(\n    const std::set<std::string>& ids) {\n  DynamicScriptOwners owners;\n  for (const auto& id : ids) {\n    auto& state = dynamic_script_states_[id];\n    if (state.committed.is_empty() &&\n        std::ranges::any_of(loaded_dynamic_scripts_, [&id](const auto& script) {\n          return script->id() == id;\n        })) {\n      state.committed = base::UnguessableToken::Create();\n    }\n    owners.emplace(id, state.committed);\n  }\n  return owners;\n}\n\nvoid ExtensionUserScriptLoader::AddOwnedDynamicScripts(\n    DynamicScriptOperation operation,\n    UserScriptList scripts,\n    std::set<std::string> persistent_script_ids,\n    DynamicScriptsModifiedCallback callback) {\n  std::erase_if(scripts, [this, &operation](const auto& script) {\n    return !IsCurrentDynamicScriptOperation(operation, script->id());\n  });\n  if (scripts.empty()) {\n    FinishDynamicScriptOperation(operation);\n    std::move(callback).Run(std::nullopt);\n    return;\n  }\n\n  UserScriptList scripts_to_add;\n  std::set<std::string> admitted_ids;\n  for (const auto& script : scripts) {\n    admitted_ids.insert(script->id());\n    dynamic_script_states_.at(script->id()).submitted = operation;\n    dynamic_script_states_.at(script->id()).submitted_script =\n        CopyDynamicScriptInfo(*script);\n    if (!disabled_sources_.contains(script->GetSource())) {\n      scripts_to_add.push_back(CopyDynamicScriptInfo(*script));\n    }\n  }\n  std::erase_if(persistent_script_ids, [&admitted_ids](const auto& id) {\n    return !admitted_ids.contains(id);\n  });\n\n  if (scripts_to_add.empty()) {\n    OnOwnedDynamicScriptsAdded(operation, std::move(scripts),\n                              std::move(persistent_script_ids),\n                              std::move(callback), std::nullopt);\n    return;\n  }\n  AddScripts(\n      std::move(scripts_to_add),\n      base::BindOnce(\n          [](base::WeakPtr<ExtensionUserScriptLoader> owner,\n             DynamicScriptOperation operation, UserScriptList scripts,\n             std::set<std::string> persistent_ids,\n             DynamicScriptsModifiedCallback callback, UserScriptLoader*,\n             const std::optional<std::string>& error) {\n            // Keep the terminal client outside the weak receiver. Base-loader\n            // destruction must still balance the API's response and reference.\n            if (!owner) {\n              std::move(callback).Run(error);\n              return;\n            }\n            owner->OnOwnedDynamicScriptsAdded(\n                operation, std::move(scripts), std::move(persistent_ids),\n                std::move(callback), error);\n          },\n          weak_factory_.GetWeakPtr(), operation, std::move(scripts),\n          std::move(persistent_script_ids), std::move(callback)));\n}\n\nvoid ExtensionUserScriptLoader::UpdateOwnedDynamicScripts(\n    DynamicScriptOperation operation,\n    UserScriptList scripts,\n    std::set<std::string> persistent_script_ids,\n    DynamicScriptsModifiedCallback callback) {\n  std::set<std::string> ids;\n  for (const auto& script : scripts) {\n    if (IsCurrentDynamicScriptOperation(operation, script->id())) {\n      ids.insert(script->id());\n    }\n  }\n  if (!ids.empty()) {\n    // Remove old base bytes without unregistering this registration epoch.\n    RemoveScripts(\n        ids, base::BindOnce(\n                 &ExtensionUserScriptLoader::OnOwnedDynamicScriptsRemoved,\n                 weak_factory_.GetWeakPtr(), CaptureDynamicScriptOwners(ids),\n                 base::DoNothing()));\n  }\n  AddOwnedDynamicScripts(operation, std::move(scripts),\n                         std::move(persistent_script_ids), std::move(callback));\n}\n\nvoid ExtensionUserScriptLoader::OnOwnedDynamicScriptsAdded(\n    DynamicScriptOperation operation,\n    UserScriptList scripts,\n    std::set<std::string> persistent_ids,\n    DynamicScriptsModifiedCallback callback,\n    const std::optional<std::string>& error) {\n  if (!error) {\n    for (auto& script : scripts) {\n      const std::string id = script->id();\n      if (!IsCurrentDynamicScriptOperation(operation, id) ||\n          dynamic_script_states_.at(id).submitted != operation) {\n        continue;\n      }\n      // Coalesced base loads contain the latest submitted bytes. Older\n      // completions must not commit different derived metadata or persistence.\n      std::erase_if(loaded_dynamic_scripts_, [&id](const auto& loaded) {\n        return loaded->id() == id;\n      });\n      dynamic_script_states_.at(id).committed = operation;\n      dynamic_script_states_.at(id).retired_committed =\n          base::UnguessableToken();\n      if (persistent_ids.contains(id)) {\n        persistent_dynamic_script_ids_.insert(id);\n      } else {\n        persistent_dynamic_script_ids_.erase(id);\n      }\n      loaded_dynamic_scripts_.push_back(std::move(script));\n    }\n    helper_.SetDynamicScripts(loaded_dynamic_scripts_,\n                              persistent_dynamic_script_ids_);\n  }\n  FinishDynamicScriptOperation(operation);\n  std::move(callback).Run(error);\n}\n\nvoid ExtensionUserScriptLoader::OnOwnedDynamicScriptsRemoved(\n    DynamicScriptOwners owners,\n    DynamicScriptsModifiedCallback callback,\n    UserScriptLoader*,\n    const std::optional<std::string>& error) {\n  if (!error) {\n    for (const auto& [id, owner] : owners) {\n      auto state = dynamic_script_states_.find(id);\n      if (state == dynamic_script_states_.end() ||\n          state->second.committed != owner ||\n          (owner.is_empty() && !state->second.epoch.is_empty())) {\n        continue;\n      }\n      std::erase_if(loaded_dynamic_scripts_, [&id](const auto& script) {\n        return script->id() == id;\n      });\n      state->second.committed = base::UnguessableToken();\n      state->second.retired_committed = base::UnguessableToken();\n      persistent_dynamic_script_ids_.erase(id);\n    }\n    helper_.SetDynamicScripts(loaded_dynamic_scripts_,\n                              persistent_dynamic_script_ids_);\n  }\n  PruneDynamicScriptStates();\n  std::move(callback).Run(error);\n}\n#endif\n\nbool ExtensionUserScriptLoader::AddScriptsForExtensionLoad(\n    const Extension& extension,\n    UserScriptLoader::ScriptsLoadedCallback callback) {\n  UserScriptList manifest_scripts =\n      GetManifestScriptsMetadata(browser_context(), extension);\n"
