substitutions:
- description: "Declare the host Android build flag before conditional private declarations."
  regex:
    re_pattern: "\\#include\\ \"base/observer_list\\.h\"\\\n"
    replace: "#include \"base/observer_list.h\"\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Exclude the measurement-only late-ack declaration on Android."
  regex:
    re_pattern: "\\ \\ //\\ Emits\\ a\\ stale\\ event\\ ack\\ metric\\ if\\ an\\ event\\ with\\ `event_id`\\ is\\ not\\ present\\\n\\ \\ //\\ in\\ `unacked_messages_`\\.\\ Meaning\\ that\\ the\\ event\\ was\\ not\\ yet\\ acked\\ by\\ the\\\n\\ \\ //\\ renderer\\ to\\ the\\ browser\\.\\\n\\ \\ void\\ EmitLateAckedEventTask\\(int\\ event_id\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Emits a stale event ack metric if an event with `event_id` is not present\n  // in `unacked_messages_`. Meaning that the event was not yet acked by the\n  // renderer to the browser.\n  void EmitLateAckedEventTask(int event_id);\n#endif\n"
  count: 1
- description: "Exclude the measurement-only first-load declaration on Android."
  regex:
    re_pattern: "\\ \\ //\\ Records\\ UMA\\ for\\ load\\ events\\.\\\n\\ \\ void\\ RecordStopLoadingUMA\\(\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Records UMA for load events.\n  void RecordStopLoadingUMA();\n#endif\n"
  count: 1
- description: "Exclude the sole elapsed-timer forward declaration on Android."
  regex:
    re_pattern: "namespace\\ base\\ \\{\\\nclass\\ ElapsedTimer;\\\n\\}\\ \\ //\\ namespace\\ base\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nnamespace base {\nclass ElapsedTimer;\n}  // namespace base\n#endif\n"
  count: 1
- description: "Exclude the measurement-only initial-load timer field on Android."
  regex:
    re_pattern: "\\ \\ //\\ Measures\\ how\\ long\\ since\\ the\\ initial\\ URL\\ started\\ loading\\.\\ This\\ timer\\ is\\\n\\ \\ //\\ started\\ only\\ once\\ the\\ ExtensionHost\\ has\\ exited\\ the\\ ExtensionHostQueue\\.\\\n\\ \\ std::unique_ptr<base::ElapsedTimer>\\ load_start_;\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Measures how long since the initial URL started loading. This timer is\n  // started only once the ExtensionHost has exited the ExtensionHostQueue.\n  std::unique_ptr<base::ElapsedTimer> load_start_;\n#endif\n"
  count: 1
- description: "Exclude the private event-map measurement-only metadata fields on Android."
  regex:
    re_pattern: "\\ \\ \\ \\ //\\ When\\ the\\ event\\ router\\ received\\ the\\ event\\ to\\ be\\ dispatched\\ to\\ the\\\n\\ \\ \\ \\ //\\ extension\\.\\ Used\\ in\\ UMA\\ histograms\\.\\\n\\ \\ \\ \\ base::TimeTicks\\ dispatch_start_time;\\\n\\\n\\ \\ \\ \\ //\\ The\\ event\\ dispatching\\ processing\\ flow\\ that\\ was\\ followed\\ for\\ this\\ event\\.\\\n\\ \\ \\ \\ EventDispatchSource\\ dispatch_source;\\\n\\\n\\ \\ \\ \\ //\\ `true`\\ if\\ the\\ event\\ was\\ dispatched\\ to\\ a\\ active/running\\ lazy\\ background\\.\\\n\\ \\ \\ \\ //\\ Used\\ in\\ UMA\\ histograms\\.\\\n\\ \\ \\ \\ bool\\ lazy_background_active_on_dispatch;\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    // When the event router received the event to be dispatched to the\n    // extension. Used in UMA histograms.\n    base::TimeTicks dispatch_start_time;\n\n    // The event dispatching processing flow that was followed for this event.\n    EventDispatchSource dispatch_source;\n\n    // `true` if the event was dispatched to a active/running lazy background.\n    // Used in UMA histograms.\n    bool lazy_background_active_on_dispatch;\n#endif\n"
  count: 1
