substitutions:
- description: Reject an installed Android update after uninstall (1).
  regex:
    re_pattern: '\#include\ "base/scoped_observation\.h"\

      \#include\ "base/values\.h"\

      \#include\ "base/version\.h"\

      \#include\ "components/sync/model/string_ordinal\.h"\

      \#include\ "extensions/browser/extension_install_prompt_client\.h"\

      \#include\ "extensions/browser/extension_system\.h"\

      '
    replace: '#include "base/scoped_observation.h"

      #include "base/values.h"

      #include "base/version.h"

      #include "build/build_config.h"

      #include "components/sync/model/string_ordinal.h"

      #include "extensions/browser/extension_install_prompt_client.h"

      #include "extensions/browser/extension_system.h"

      '
- description: Reject an installed Android update after uninstall (2).
  regex:
    re_pattern: '\#include\ "extensions/common/extension\.h"\

      \#include\ "extensions/common/extension_id\.h"\

      \#include\ "extensions/common/manifest\.h"\

      \

      static_assert\(BUILDFLAG\(ENABLE_EXTENSIONS_CORE\)\);\

      \

      '
    replace: '#include "extensions/common/extension.h"

      #include "extensions/common/extension_id.h"

      #include "extensions/common/manifest.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "extensions/browser/extension_registry.h"

      #include "extensions/browser/extension_registry_observer.h"

      #endif


      static_assert(BUILDFLAG(ENABLE_EXTENSIONS_CORE));


      '
- description: Reject an installed Android update after uninstall (3).
  regex:
    re_pattern: '//\

      //\ Installation\ is\ aborted\ if\ the\ CrxInstaller\ object\ learns\ that\ Chrome\ is\

      //\ terminating\ during\ the\ install\.\

      class\ CrxInstaller\ :\ public\ SandboxedUnpackerClient\ \{\

      \ public:\

      \ \ //\ A\ callback\ to\ be\ executed\ when\ the\ install\ finishes\.\

      \ \ using\ InstallerResultCallback\ =\ ExtensionSystem::InstallUpdateCallback;\

      '
    replace: "//\n// Installation is aborted if the CrxInstaller object learns that Chrome is\n// terminating during the install.\nclass CrxInstaller : public SandboxedUnpackerClient\n#if BUILDFLAG(IS_ANDROID)\n    ,\n                     public ExtensionRegistryObserver\n#endif\n{\n public:\n  // A callback to be executed when the install finishes.\n  using InstallerResultCallback = ExtensionSystem::InstallUpdateCallback;\n"
- description: Reject an installed Android update after uninstall (4).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::DictValue\ ruleset_install_prefs\)\ override;\

      \ \ void\ OnStageChanged\(InstallationStage\ stage\)\ override;\

      \

      \ \ //\ Called\ on\ BrowserContext\ shutdown\.\

      \ \ void\ Shutdown\(\);\

      \

      '
    replace: "                       base::DictValue ruleset_install_prefs) override;\n  void OnStageChanged(InstallationStage stage) override;\n\n#if BUILDFLAG(IS_ANDROID)\n  // An installed update must not become a new install after an uninstall, even\n  // if the same ID has since been reinstalled. All access is on the UI thread.\n  void OnExtensionUninstalled(content::BrowserContext* browser_context,\n                              const Extension* extension,\n                              UninstallReason reason) override;\n  void OnShutdown(ExtensionRegistry* registry) override;\n  bool AbortIfInstalledUpdateWasUninstalled();\n#endif\n\n  // Called on BrowserContext shutdown.\n  void Shutdown();\n\n"
- description: Reject an installed Android update after uninstall (5).
  regex:
    re_pattern: '\ \ //\ Whether\ the\ operation\ is\ an\ extension\ update\.\

      \ \ bool\ is_update_\ =\ false;\

      \

      \ \ //\ The\ flags\ for\ ExtensionService::OnExtensionInstalled\.\

      \ \ int\ install_flags_;\

      \

      '
    replace: "  // Whether the operation is an extension update.\n  bool is_update_ = false;\n\n#if BUILDFLAG(IS_ANDROID)\n  ExtensionId installed_update_id_;\n  bool installed_update_was_uninstalled_ = false;\n  base::ScopedObservation<ExtensionRegistry, ExtensionRegistryObserver>\n      installed_update_observation_{this};\n#endif\n\n  // The flags for ExtensionService::OnExtensionInstalled.\n  int install_flags_;\n\n"
