substitutions:
- description: Retire Android permission consent across extension generations (1).
  regex:
    re_pattern: '\#include\ "base/functional/bind\.h"\

      \#include\ "base/notimplemented\.h"\

      \#include\ "base/strings/string_number_conversions\.h"\

      \#include\ "content/public/browser/web_contents\.h"\

      \#include\ "extensions/browser/api/permissions/permissions_api_helpers\.h"\

      \#include\ "extensions/browser/extension_api_frame_id_map\.h"\

      '
    replace: '#include "base/functional/bind.h"

      #include "base/notimplemented.h"

      #include "base/strings/string_number_conversions.h"

      #include "build/build_config.h"

      #include "content/public/browser/web_contents.h"

      #include "extensions/browser/api/permissions/permissions_api_helpers.h"

      #include "extensions/browser/extension_api_frame_id_map.h"

      '
- description: Retire Android permission consent across extension generations (2).
  regex:
    re_pattern: '\#include\ "extensions/common/permissions/permissions_info\.h"\

      \#include\ "extensions/common/url_pattern\.h"\

      \#include\ "extensions/common/url_pattern_set\.h"\

      \

      namespace\ extensions\ \{\

      \

      '
    replace: '#include "extensions/common/permissions/permissions_info.h"

      #include "extensions/common/url_pattern.h"

      #include "extensions/common/url_pattern_set.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "extensions/browser/extension_registry.h"

      #endif


      namespace extensions {


      '
- description: Retire Android permission consent across extension generations (3).
  regex:
    re_pattern: '\ \ \ \ Respond\(ArgumentList\(api::permissions::Request::Results::Create\(false\)\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \ \ PermissionsUpdater\ permissions_updater\(browser_context\(\)\);\

      \ \ requesting_withheld_permissions_\ =\ !requested_withheld_\->IsEmpty\(\);\

      \ \ requesting_optional_permissions_\ =\ !requested_optional_\->IsEmpty\(\);\

      '
    replace: "    Respond(ArgumentList(api::permissions::Request::Results::Create(false)));\n    return;\n  }\n#if BUILDFLAG(IS_ANDROID)\n  // Consent belongs to the enabled extension instance that requested it. A\n  // reload or reinstall must not grant through a retired instance into ID-keyed\n  // preferences or the replacement renderer's permissions.\n  if (!browser_context() || ExtensionRegistry::Get(browser_context())\n                                    ->enabled_extensions()\n                                    .GetByID(extension_id()) != extension()) {\n    Respond(ArgumentList(api::permissions::Request::Results::Create(false)));\n    return;\n  }\n#endif\n  PermissionsUpdater permissions_updater(browser_context());\n  requesting_withheld_permissions_ = !requested_withheld_->IsEmpty();\n  requesting_optional_permissions_ = !requested_optional_->IsEmpty();\n"
- description: Recheck current management policy after Android consent and before persisted grants.
  regex:
    pattern: "    return;\n  }\n#endif\n  PermissionsUpdater permissions_updater(browser_context());\n"
    replace: "    return;\n  }\n  // Management policy may change while the consent dialog is open. Check the\n  // current\
      \ policy before committing either optional or withheld permissions.\n  std::unique_ptr<const PermissionSet> requested_permissions\
      \ =\n      PermissionSet::CreateUnion(*requested_withheld_, *requested_optional_);\n  if (!ExtensionsBrowserClient::Get()\n\
      \           ->GetExtensionManagementClient(browser_context())\n           ->IsPermissionSetAllowed(extension(), *requested_permissions))\
      \ {\n    Respond(Error(kBlockedByEnterprisePolicy));\n    return;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n  PermissionsUpdater\
      \ permissions_updater(browser_context());\n"
  count: 1
