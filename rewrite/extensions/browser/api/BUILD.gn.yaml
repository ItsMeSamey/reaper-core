# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Build system.storage and its event router with the extension core.
  regex:
    pattern: '    "//extensions/browser/api/system_network",'
    replace: "    \"//extensions/browser/api/system_network\",\n    \"//extensions/browser/api/system_info\",\n    \"//extensions/browser/api/system_storage\","
- description: Remove desktop-only duplicate storage API dependencies.
  regex:
    pattern: "      \"//extensions/browser/api/system_info\",\n      \"//extensions/browser/api/system_storage\",\n"
    replace: ''
- description: Build printer provider dispatcher with extension core.
  regex:
    re_pattern: \ \ \ \ "//extensions/browser/api/power",
    replace: "    \"//extensions/browser/api/power\",\n    \"//extensions/browser/api/printer_provider\","
- description: Remove duplicate desktop printer provider dependency.
  regex:
    re_pattern: '\ \ \ \ \ \ "//extensions/browser/api/printer_provider",\

      '
    replace: ''
- description: Build the generic MIME API on Android remove desktop duplicate
  regex:
    re_pattern: '\ \ \ \ "//extensions/browser/api/mime_handler",\

      '
    replace: ''
- description: Build the generic MIME API on Android
  regex:
    re_pattern: '\ \ "//extensions/browser/api/offscreen",\

      '
    replace: "  \"//extensions/browser/api/mime_handler\",\n  \"//extensions/browser/api/offscreen\",\n"
