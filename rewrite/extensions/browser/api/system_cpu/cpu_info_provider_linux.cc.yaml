substitutions:
- description: Android CPU milliseconds normalization and parser regression coverage (1).
  regex:
    re_pattern: '\#include\ "base/compiler_specific\.h"\

      \#include\ "base/files/file_util\.h"\

      \#include\ "base/format_macros\.h"\

      \

      namespace\ extensions\ \{\

      \

      '
    replace: '#include "base/compiler_specific.h"

      #include "base/files/file_util.h"

      #include "base/format_macros.h"


      #if BUILDFLAG(IS_ANDROID)

      #include <unistd.h>

      #endif


      namespace extensions {


      '
- description: Android CPU milliseconds normalization and parser regression coverage (2).
  regex:
    re_pattern: '\ \ \ \ return\ false;\

      \ \ \}\

      \

      \ \ std::istringstream\ iss\(contents\);\

      \ \ std::string\ line;\

      \

      '
    replace: "    return false;\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  return ParseCpuTimeForAndroid(contents, sysconf(_SC_CLK_TCK), infos);\n#else\n  std::istringstream iss(contents);\n  std::string line;\n\n"
- description: Android CPU milliseconds normalization and parser regression coverage (3).
  regex:
    re_pattern: '\ \ \}\

      \

      \ \ return\ true;\

      \}\

      \

      \}\ \ //\ namespace\ extensions\

      '
    replace: "  }\n\n  return true;\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n\n#if BUILDFLAG(IS_ANDROID)\nbool CpuInfoProvider::ParseCpuTimeForAndroid(\n    const std::string& contents,\n    long ticks_per_second,\n    std::vector<api::system_cpu::ProcessorInfo>* infos) {\n  DCHECK(infos);\n  if (ticks_per_second <= 0) {\n    return false;\n  }\n  const double milliseconds_per_tick = 1000.0 / ticks_per_second;\n  std::istringstream iss(contents);\n  std::string line;\n  // The first row aggregates all processors; the API reports each cpuN row.\n  std::getline(iss, line);\n  while (std::getline(iss, line)) {\n    if (line.compare(0, 3, \"cpu\") != 0) {\n      continue;\n    }\n    uint64_t user = 0, nice = 0, sys = 0, idle = 0;\n    uint32_t pindex = 0;\n    int vals = UNSAFE_TODO(sscanf(line.c_str(),\n                                \"cpu%\" SCNu32 \" %\" SCNu64 \" %\" SCNu64\n                                \" %\" SCNu64 \" %\" SCNu64,\n                                &pindex, &user, &nice, &sys, &idle));\n    if (vals != 5 || pindex >= infos->size()) {\n      return false;\n    }\n    auto& usage = infos->at(pindex).usage;\n    // Convert before adding so valid uint64 counters cannot wrap their sums.\n    usage.kernel = static_cast<double>(sys) * milliseconds_per_tick;\n    usage.user = (static_cast<double>(user) + static_cast<double>(nice)) *\n                 milliseconds_per_tick;\n    usage.idle = static_cast<double>(idle) * milliseconds_per_tick;\n    usage.total = usage.user + usage.kernel + usage.idle;\n  }\n  return true;\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace extensions\n"
