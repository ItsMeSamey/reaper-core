substitutions:
- description: Android CPU milliseconds normalization and parser regression coverage (1).
  regex:
    re_pattern: '\#ifndef\ EXTENSIONS_BROWSER_API_SYSTEM_CPU_CPU_INFO_PROVIDER_H_\

      \#define\ EXTENSIONS_BROWSER_API_SYSTEM_CPU_CPU_INFO_PROVIDER_H_\

      \

      \#include\ <vector>\

      \

      \#include\ "base/lazy_instance\.h"\

      '
    replace: '#ifndef EXTENSIONS_BROWSER_API_SYSTEM_CPU_CPU_INFO_PROVIDER_H_

      #define EXTENSIONS_BROWSER_API_SYSTEM_CPU_CPU_INFO_PROVIDER_H_


      #include <string>

      #include <vector>


      #include "base/lazy_instance.h"

      '
- description: Android CPU milliseconds normalization and parser regression coverage (2).
  regex:
    re_pattern: '\ \ virtual\ bool\ QueryCpuTimePerProcessor\(\

      \ \ \ \ \ \ std::vector<api::system_cpu::ProcessorInfo>\*\ infos\);\

      \

      \ \ //\ Overriden\ from\ SystemInfoProvider\.\

      \ \ bool\ QueryInfo\(\)\ override;\

      \

      '
    replace: "  virtual bool QueryCpuTimePerProcessor(\n      std::vector<api::system_cpu::ProcessorInfo>* infos);\n\n#if BUILDFLAG(IS_ANDROID)\n  // Parses Linux counters using the platform clock frequency. Used by the\n  // Android provider and its regression tests; desktop units remain unchanged.\n  static bool ParseCpuTimeForAndroid(\n      const std::string& contents,\n      long ticks_per_second,\n      std::vector<api::system_cpu::ProcessorInfo>* infos);\n#endif\n\n  // Overriden from SystemInfoProvider.\n  bool QueryInfo() override;\n\n"
