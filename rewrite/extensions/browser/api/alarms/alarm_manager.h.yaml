substitutions:
- description: Bind Android alarm restores to their activation generation (1).
  regex:
    re_pattern: '\#include\ "base/scoped_observation\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "base/timer/wall_clock_timer\.h"\

      \#include\ "extensions/browser/browser_context_keyed_api_factory\.h"\

      \#include\ "extensions/browser/extension_registry\.h"\

      \#include\ "extensions/browser/extension_registry_observer\.h"\

      \#include\ "extensions/common/api/alarms\.h"\

      \#include\ "extensions/common/extension_id\.h"\

      \

      namespace\ base\ \{\

      class\ Clock;\

      '
    replace: '#include "base/scoped_observation.h"

      #include "base/time/time.h"

      #include "base/timer/wall_clock_timer.h"

      #include "build/build_config.h"

      #include "extensions/browser/browser_context_keyed_api_factory.h"

      #include "extensions/browser/extension_registry.h"

      #include "extensions/browser/extension_registry_observer.h"

      #include "extensions/common/api/alarms.h"

      #include "extensions/common/extension_id.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "base/unguessable_token.h"

      #endif


      namespace base {

      class Clock;

      '
- description: Bind Android alarm restores to their activation generation (2).
  regex:
    re_pattern: '\

      \ \ using\ ReadyAction\ =\ base::OnceCallback<void\(const\ std::string\&\)>;\

      \ \ using\ ReadyQueue\ =\ base::queue<ReadyAction>;\

      \ \ using\ ReadyMap\ =\ std::map<ExtensionId,\ ReadyQueue>;\

      \ \ using\ LastPollTimeMap\ =\ std::map<ExtensionId,\ base::Time>;\

      \

      \ \ //\ Iterator\ used\ to\ identify\ a\ particular\ alarm\ within\ the\ Map/List\ pair\.\

      '
    replace: "\n  using ReadyAction = base::OnceCallback<void(const std::string&)>;\n  using ReadyQueue = base::queue<ReadyAction>;\n#if BUILDFLAG(IS_ANDROID)\n  struct ReadyState {\n    base::UnguessableToken generation = base::UnguessableToken::Create();\n    ReadyQueue actions;\n  };\n  using ReadyMap = std::map<ExtensionId, ReadyState>;\n#else\n  using ReadyMap = std::map<ExtensionId, ReadyQueue>;\n#endif\n  using LastPollTimeMap = std::map<ExtensionId, base::Time>;\n\n  // Iterator used to identify a particular alarm within the Map/List pair.\n"
- description: Bind Android alarm restores to their activation generation (3).
  regex:
    re_pattern: '\

      \ \ //\ Syncs\ our\ alarm\ data\ for\ the\ given\ extension\ to/from\ the\ state\ storage\.\

      \ \ void\ WriteToStorage\(const\ ExtensionId\&\ extension_id\);\

      \ \ void\ ReadFromStorage\(const\ ExtensionId\&\ extension_id,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::TimeDelta\ min_delay,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::optional<base::Value>\ value\);\

      '
    replace: "\n  // Syncs our alarm data for the given extension to/from the state storage.\n  void WriteToStorage(const ExtensionId& extension_id);\n#if BUILDFLAG(IS_ANDROID)\n  void ReadFromStorageForActivation(const ExtensionId& extension_id,\n                                    base::TimeDelta min_delay,\n                                    base::UnguessableToken generation,\n                                    std::optional<base::Value> value);\n#endif\n  void ReadFromStorage(const ExtensionId& extension_id,\n                       base::TimeDelta min_delay,\n                       std::optional<base::Value> value);\n"
- description: Check Android alarm quota after the initial persisted alarm state is restored
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Alarm\ alarm,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AddAlarmCallback\ callback\);\

      \

      \ \ using\ GetAlarmCallback\ =\ base::OnceCallback<void\(Alarm\*\)>;\

      \ \ //\ Passes\ the\ alarm\ with\ the\ given\ name,\ or\ NULL\ if\ none\ exists,\ to\

      \ \ //\ `callback`\.\

      '
    replace: "                Alarm alarm,\n                AddAlarmCallback callback);\n\n#if BUILDFLAG(IS_ANDROID)\n  using AddAlarmWithQuotaCallback = base::OnceCallback<void(bool)>;\n  // Checks the active-alarm limit after restoration and earlier queued changes.\n  // Replacing an existing name does not consume another slot. The callback\n  // receives false only when a new name would exceed the limit.\n  void AddAlarmWithQuota(const ExtensionId& extension_id,\n                        Alarm alarm,\n                        AddAlarmWithQuotaCallback callback);\n#endif\n\n  using GetAlarmCallback = base::OnceCallback<void(Alarm*)>;\n  // Passes the alarm with the given name, or NULL if none exists, to\n  // `callback`.\n"
- description: Check Android alarm quota after the initial persisted alarm state is restored
  regex:
    re_pattern: '\ \ void\ AddAlarmWhenReady\(Alarm\ alarm,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AddAlarmCallback\ callback,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ ExtensionId\&\ extension_id\);\

      \

      \ \ //\ Part\ of\ GetAlarm\ that\ is\ executed\ after\ alarms\ are\ loaded\.\

      \ \ void\ GetAlarmWhenReady\(const\ std::string\&\ name,\

      '
    replace: "  void AddAlarmWhenReady(Alarm alarm,\n                         AddAlarmCallback callback,\n                         const ExtensionId& extension_id);\n\n#if BUILDFLAG(IS_ANDROID)\n  void AddAlarmWithQuotaWhenReady(Alarm alarm,\n                                  AddAlarmWithQuotaCallback callback,\n                                  const ExtensionId& extension_id);\n#endif\n\n  // Part of GetAlarm that is executed after alarms are loaded.\n  void GetAlarmWhenReady(const std::string& name,\n"
- description: Android bounds the internal repeat interval while preserving alarm API data.
  count: 1
  regex:
    re_pattern: "\\ \\ FRIEND_TEST_ALL_PREFIXES\\(ExtensionAlarmsSchedulingTest,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ RepeatingAlarmsScheduledPredictably\\);\\\n"
    replace: "  FRIEND_TEST_ALL_PREFIXES(ExtensionAlarmsSchedulingTest,\n                           RepeatingAlarmsScheduledPredictably);\n#if BUILDFLAG(IS_ANDROID)\n  FRIEND_TEST_ALL_PREFIXES(ExtensionAlarmsSchedulingTest,\n                           EffectiveRepeatIntervalPreservesRequestedPeriod);\n#endif\n"
