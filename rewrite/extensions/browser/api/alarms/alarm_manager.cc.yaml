    replace: "#include \"extensions/common/extension_id.h\"\n#if BUILDFLAG(IS_ANDROID)\n\n#include <cmath>\n#endif\n"
- description: Android bounds the internal repeat interval while preserving alarm API data.
  count: 1
  regex:
    re_pattern: "\\ \\ \\ \\ //\\ Find\\ out\\ how\\ many\\ periods\\ have\\ transpired\\ since\\ the\\ alarm\\ last\\ went\\ off\\\n\\ \\ \\ \\ //\\ \\(it's\\ possible\\ that\\ we\\ missed\\ some\\)\\.\\\n\\ \\ \\ \\ int\\ transpired_periods\\ =\\ \\(clock_\\->Now\\(\\)\\.InMillisecondsFSinceUnixEpoch\\(\\)\\ \\-\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ alarm\\.js_alarm\\->scheduled_time\\)\\ /\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ period_in_js_time;\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n    // Keep the requested period in the public/persisted alarm, but use the\n    // same positive minimum interval for rescheduling as for polling.\n    period_in_js_time = std::max(\n        alarm.minimum_granularity.InMillisecondsF(), period_in_js_time);\n    // Preserve the original phase without narrowing a missed-period count.\n    const double transpired_periods = std::max(\n        0.0, std::floor((clock_->Now().InMillisecondsFSinceUnixEpoch() -\n                         alarm.js_alarm->scheduled_time) /\n                        period_in_js_time));\n#else\n    // Find out how many periods have transpired since the alarm last went off\n    // (it's possible that we missed some).\n    int transpired_periods = (clock_->Now().InMillisecondsFSinceUnixEpoch() -\n                              alarm.js_alarm->scheduled_time) /\n                             period_in_js_time;\n#endif\n"
