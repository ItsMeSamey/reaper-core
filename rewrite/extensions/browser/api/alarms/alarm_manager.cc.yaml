    replace: "  WriteToStorage(extension_id);\n  std::move(callback).Run();\n}\n\n#if BUILDFLAG(IS_ANDROID)\nvoid AlarmManager::AddAlarmWithQuotaWhenReady(\n    Alarm alarm,\n    AddAlarmWithQuotaCallback callback,\n    const ExtensionId& extension_id) {\n  if (GetCountForExtension(extension_id) >= kMaxAlarmsPerExtension &&\n      GetAlarmIterator(extension_id, alarm.js_alarm->name).first ==\n          alarms_.end()) {\n    std::move(callback).Run(false);\n    return;\n  }\n  AddAlarmWhenReady(std::move(alarm),\n                    base::BindOnce(std::move(callback), true), extension_id);\n}\n#endif\n\nvoid AlarmManager::GetAlarmWhenReady(const std::string& name,\n                                     GetAlarmCallback callback,\n"
