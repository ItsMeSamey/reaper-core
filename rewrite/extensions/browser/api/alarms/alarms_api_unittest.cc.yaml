    re_pattern: "TEST_F\\(ExtensionAlarmsSchedulingTest,\\ PerExtensionLastPollTime\\)\\ \\{\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\nTEST_F(ExtensionAlarmsSchedulingTest,\n       EffectiveRepeatIntervalPreservesRequestedPeriod) {\n  const base::TimeDelta minimum = alarms_api_constants::GetMinimumDelay(\n      Manifest::IsUnpackedLocation(extension()->location()),\n      extension()->manifest_version());\n  ASSERT_GT(minimum, base::TimeDelta());\n  const base::Time start = base::Time::FromSecondsSinceUnixEpoch(10);\n  for (const base::TimeDelta requested :\n       {minimum / 2, minimum, minimum * 2}) {\n    test_clock_.SetNow(start);\n    alarm_manager_->last_poll_times_.clear();\n    alarm_delegate_->alarms_seen.clear();\n\n    api::alarms::AlarmCreateInfo info;\n    info.name = \"repeat\";\n    info.when = start.InMillisecondsFSinceUnixEpoch();\n    info.period_in_minutes = requested.InSecondsF() / 60.0;\n    const double requested_minutes = *info.period_in_minutes;\n    alarm_manager_->AddAlarm(extension()->id(),\n                             Alarm(info, minimum, test_clock_.Now()),\n                             base::DoNothing());\n    alarm_manager_->PollAlarms();\n    ASSERT_EQ(1u, alarm_delegate_->alarms_seen.size());\n\n    const base::TimeDelta effective = std::max(minimum, requested);\n    base::test::TestFuture<Alarm*> alarm_future;\n    alarm_manager_->GetAlarm(extension()->id(), \"repeat\",\n                             alarm_future.GetCallback());\n    Alarm* alarm = alarm_future.Get();\n    ASSERT_TRUE(alarm);\n    ASSERT_TRUE(alarm->js_alarm->period_in_minutes);\n    EXPECT_DOUBLE_EQ(requested_minutes, *alarm->js_alarm->period_in_minutes);\n    EXPECT_DOUBLE_EQ((start + effective).InMillisecondsFSinceUnixEpoch(),\n                     alarm->js_alarm->scheduled_time);\n    EXPECT_EQ(start + effective, alarm_manager_->next_poll_time_);\n\n    // A delayed poll skips missed occurrences but retains the original phase.\n    test_clock_.Advance(effective * 2 + effective / 2);\n    alarm_manager_->PollAlarms();\n    EXPECT_EQ(2u, alarm_delegate_->alarms_seen.size());\n    EXPECT_DOUBLE_EQ((start + effective * 3).InMillisecondsFSinceUnixEpoch(),\n                     alarm->js_alarm->scheduled_time);\n    EXPECT_DOUBLE_EQ(requested_minutes, *alarm->js_alarm->period_in_minutes);\n    RemoveAlarm(\"repeat\");\n  }\n}\n#endif  // BUILDFLAG(IS_ANDROID)\nTEST_F(ExtensionAlarmsSchedulingTest, PerExtensionLastPollTime) {\n"
