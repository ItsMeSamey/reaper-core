_EQ(0, second->successful_responses);\n  EXPECT_EQ(1, second->failed_responses);\n  EXPECT_EQ(\"An extension cannot have more than 500 active alarms.\",\n            second->error);\n  EXPECT_EQ(AlarmManager::kMaxAlarmsPerExtension,\n            manager_->GetCountForExtension(extension_->id()));\n  EXPECT_TRUE(FindAlarm(extension_->id(), \"first\"));\n  EXPECT_FALSE(FindAlarm(extension_->id(), \"second\"));\n\n  Disable(extension_);\n  Enable(extension_);\n  task_environment()->RunUntilIdle();\n  EXPECT_EQ(AlarmManager::kMaxAlarmsPerExtension,\n            manager_->GetCountForExtension(extension_->id()));\n  EXPECT_TRUE(FindAlarm(extension_->id(), \"first\"));\n  EXPECT_FALSE(FindAlarm(extension_->id(), \"second\"));\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest, ReplacementAtQuotaDoesNotNeedAnotherSlot) {\n  SeedAlarms(AlarmManager::kMaxAlarmsPerExtension);\n  Enable(extension_);\n  task_environment()->RunUntilIdle();\n  const base::Time replacement_time = base::Time::Now() + base::Hours(2);\n  auto result = std::make_shared<RestoreApiResult>();\n  StartApi(base::MakeRefCounted<AlarmsCreateFunction>(),\n           base::test::ParseJsonList(\n               R\"([\"stored-0\", {\"delayInMinutes\": 120}])\"),\n           result);\n\n  EXPECT_EQ(1, result->successful_responses);\n  EXPECT_EQ(0, result->failed_responses);\n  EXPECT_EQ(AlarmManager::kMaxAlarmsPerExtension,\n            manager_->GetCountForExtension(extension_->id()));\n  Alarm* alarm = FindAlarm(extension_->id(), \"stored-0\");\n  ASSERT_TRUE(alarm);\n  EXPECT_DOUBLE_EQ(replacement_time.InMillisecondsFSinceUnixEpoch(),\n                   alarm->js_alarm->scheduled_time);\n  EXPECT_EQ(static_cast<size_t>(AlarmManager::kMaxAlarmsPerExtension),\n            ReadStoredAlarms(extension_->id()).size());\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest, QueuedClearFreesSlotForFollowingCreate) {\n  SeedAlarms(AlarmManager::kMaxAlarmsPerExtension);\n  Enable(extension_);\n  auto cleared = std::make_shared<RestoreApiResult>();\n  auto created = std::make_shared<RestoreApiResult>();\n  StartApi(base::MakeRefCounted<AlarmsClearFunction>(),\n           base::test::ParseJsonList(R\"([\"stored-0\"])\"), cleared);\n  StartApi(base::MakeRefCounted<AlarmsCreateFunction>(),\n           base::test::ParseJsonList(R\"([\"extra\", {\"delayInMinutes\": 120}])\"),\n           created);\n  FinishBackendWithoutUi();\n  task_environment()->RunUntilIdle();\n\n  EXPECT_EQ(1, cleared->successful_responses);\n  EXPECT_EQ(0, cleared->failed_responses);\n  ASSERT_EQ(1u, cleared->values.size());\n  EXPECT_TRUE(cleared->values[0].GetBool());\n  EXPECT_EQ(1, created->successful_responses);\n  EXPECT_EQ(0, created->failed_responses);\n  EXPECT_EQ(AlarmManager::kMaxAlarmsPerExtension,\n            manager_->GetCountForExtension(extension_->id()));\n  EXPECT_FALSE(FindAlarm(extension_->id(), \"stored-0\"));\n  EXPECT_TRUE(FindAlarm(extension_->id(), \"extra\"));\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest, UnloadCancelsQueuedQuotaCreate) {\n  SeedAlarms(AlarmManager::kMaxAlarmsPerExtension - 1);\n  Enable(extension_);\n  auto result = std::make_shared<RestoreApiResult>();\n  StartApi(base::MakeRefCounted<ObservedAlarmsCreateFunction>(result),\n           base::test::ParseJsonList(R\"([\"retired\", {\"delayInMinutes\": 120}])\"),\n           result);\n  EXPECT_FALSE(result->destroyed);\n  Disable(extension_);\n  EXPECT_TRUE(result->destroyed);\n  EXPECT_EQ(0, result->successful_responses);\n  // As in UnloadReleasesPendingApiBeforeReenable, destruction may report a\n  // debug-only failure. The old request must never succeed on the new load.\n  Enable(extension_);\n  FinishBackendWithoutUi();\n  task_environment()->RunUntilIdle();\n\n  EXPECT_EQ(0, result->successful_responses);\n  EXPECT_EQ(AlarmManager::kMaxAlarmsPerExtension - 1,\n            manager_->GetCountForExtension(extension_->id()));\n  EXPECT_FALSE(FindAlarm(extension_->id(), \"retired\"));\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest,\n       OrdinaryRestoreAndReenableKeepPersistence) {\n"
- description: Android bounds the internal repeat interval while preserving alarm API data.
