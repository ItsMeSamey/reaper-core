- description: Bind Android alarm restores to their activation generation (3).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ alarm_manager_\->last_poll_times_\[extension2\->id\(\)\]\);\

      \}\

      \

      \}\ \ //\ namespace\ extensions\

      '
    replace: "            alarm_manager_->last_poll_times_[extension2->id()]);\n}\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace {\n\nclass AlarmStateStoreExtensionSystem : public MockExtensionSystem {\n public:\n  explicit AlarmStateStoreExtensionSystem(content::BrowserContext* context)\n      : MockExtensionSystem(context),\n        state_store_(context,\n                     base::MakeRefCounted<value_store::TestValueStoreFactory>(),\n                     StateStore::BackendType::STATE,\n                     /*deferred_load=*/false) {}\n\n  StateStore* state_store() override { return &state_store_; }\n\n private:\n  StateStore state_store_;\n};\n\nstruct RestoreCallbackResult {\n  int calls = 0;\n  int released = 0;\n  bool has_alarm = false;\n  double scheduled_time = 0;\n};\n\nAlarmManager::GetAlarmCallback ObserveRestoredAlarm(\n    std::shared_ptr<RestoreCallbackResult> result,\n    base::OnceClosure action = {}) {\n  base::ScopedClosureRunner release(base::BindOnce(\n      [](std::shared_ptr<RestoreCallbackResult> result) { ++result->released; },\n      result));\n  return base::BindOnce(\n      [](std::shared_ptr<RestoreCallbackResult> result,\n         base::ScopedClosureRunner release, base::OnceClosure action,\n         Alarm* alarm) {\n        ++result->calls;\n        result->has_alarm = alarm != nullptr;\n        if (alarm) {\n          result->scheduled_time = alarm->js_alarm->scheduled_time;\n        }\n        if (action) {\n          std::move(action).Run();\n        }\n      },\n      std::move(result), std::move(release), std::move(action));\n}\n\nstruct RestoreApiResult {\n  int successful_responses = 0;\n  bool destroyed = false;\n  base::ListValue values;\n};\n\n// Uses the real AlarmsClearAllFunction::Run and its bound callback ownership.\nclass ObservedAlarmsClearAllFunction : public AlarmsClearAllFunction {\n public:\n  explicit ObservedAlarmsClearAllFunction(\n      std::shared_ptr<RestoreApiResult> result)\n      : result_(std::move(result)) {}\n\n protected:\n  ~ObservedAlarmsClearAllFunction() override { result_->destroyed = true; }\n\n private:\n  std::shared_ptr<RestoreApiResult> result_;\n};\n\n}  // namespace\n\n// These tests retain the real StateStore frontend, sequenced backend, registry\n// notifications, AlarmManager and event delegate/router. Only the value-store\n// storage implementation is in memory. No restore callback is invoked directly.\nclass ExtensionAlarmsStateStoreTest : public ExtensionsTest {\n public:\n  ExtensionAlarmsStateStoreTest()\n      : ExtensionsTest(content::BrowserTaskEnvironment::TimeSource::MOCK_TIME) {\n  }\n\n protected:\n  void SetUp() override {\n    ExtensionsTest::SetUp();\n    extensions_browser_client()->set_extension_system_factory(&system_factory_);\n    store_ = ExtensionSystem::Get(browser_context())->state_store();\n    ASSERT_TRUE(store_);\n    ASSERT_TRUE(store_->IsInitialized());\n\n    auto* router = static_cast<EventRouter*>(\n        EventRouterFactory::GetInstance()->SetTestingFactoryAndUse(\n            browser_context(),\n            base::BindOnce([](content::BrowserContext* context)\n                               -> std::unique_ptr<KeyedService> {\n              return std::make_unique<EventRouter>(\n                  context, ExtensionPrefs::Get(context));\n            })));\n    event_observer_ = std::make_unique<TestEventRouterObserver>(router);\n    manager_ = static_cast<AlarmManager*>(\n        AlarmManager::GetFactoryInstance()->SetTestingFactoryAndUse(\n            browser_context(),\n            base::BindOnce([](content::BrowserContext* context)\n                               -> std::unique_ptr<KeyedService> {\n              return std::make_unique<AlarmManager>(context);\n            })));\n    dispatcher_ =\n        std::make_unique<ExtensionFunctionDispatcher>(browser_context());\n    extension_ = ExtensionBuilder(\"Persistent alarms\")\n                     .SetManifestVersion(3)\n                     .AddAPIPermission(\"alarms\")\n                     .Build();\n  }\n\n  void TearDown() override {\n    // Retire any API callbacks while their extension is actually disabled.\n    std::vector<scoped_refptr<const Extension>> enabled;\n    for (const auto& extension : registry()->enabled_extensions()) {\n      enabled.push_back(extension);\n    }\n    for (const auto& extension : enabled) {\n      Disable(extension);\n    }\n    DestroyManager();\n    task_environment()->RunUntilIdle();\n    dispatcher_.reset();\n    event_observer_.reset();\n    extension_.reset();\n    store_ = nullptr;\n    ExtensionsTest::TearDown();\n  }\n\n  ExtensionRegistry* registry() {\n    return ExtensionRegistry::Get(browser_context());\n  }\n\n  void Enable(const scoped_refptr<const Extension>& extension) {\n    registry()->RemoveDisabled(extension->id());\n    CHECK(registry()->AddEnabled(extension));\n    registry()->TriggerOnLoaded(extension.get());\n  }\n\n  void Disable(const scoped_refptr<const Extension>& extension) {\n    CHECK(registry()->AddDisabled(extension));\n    CHECK(registry()->RemoveEnabled(extension->id()));\n    registry()->TriggerOnUnloaded(extension.get(),\n                                  UnloadedExtensionReason::DISABLE);\n  }\n\n  void DestroyManager() {\n    manager_ = nullptr;\n    AlarmManager::GetFactoryInstance()->SetTestingFactory(browser_context(),\n                                                          {});\n  }\n\n  // Finish backend operations without pumping UI. Thus both GetA and GetB can\n  // own real old snapshots before callbackA runs any queued API action.\n  void FinishBackendWithoutUi() {\n    auto marker = std::make_shared<base::WaitableEvent>();\n    CHECK(GetExtensionFileTaskRunner()->PostTask(\n        FROM_HERE, base::BindOnce(\n                       [](std::shared_ptr<base::WaitableEvent> marker) {\n                         marker->Signal();\n                       },\n                       marker)));\n    base::ScopedAllowBaseSyncPrimitivesForTesting allow_wait;\n    CHECK(marker->TimedWait(TestTimeouts::action_timeout()));\n  }\n\n  void SeedAlarm(const ExtensionId& id, base::Time when) {\n    base::ListValue alarms;\n    alarms.Append(\n        base::DictValue()\n            .Set(\"name\", \"stored\")\n            .Set(\"scheduledTime\", when.InMillisecondsFSinceUnixEpoch())\n            .Set(\"persistAcrossSessions\", true));\n    store_->SetExtensionValue(id, \"alarms\", base::Value(std::move(alarms)));\n    FinishBackendWithoutUi();\n  }\n\n  base::ListValue ReadStoredAlarms(const ExtensionId& id) {\n    base::test::TestFuture<std::optional<base::Value>> value;\n    store_->GetExtensionValue(id, \"alarms\", value.GetCallback());\n    CHECK(value.Wait());\n    CHECK(value.Get());\n    CHECK(value.Get()->is_list());\n    return value.Get()->GetList().Clone();\n  }\n\n  Alarm* FindAlarm(const ExtensionId& id) {\n    base::test::TestFuture<Alarm*> result;\n    manager_->GetAlarm(id, \"stored\", result.GetCallback());\n    return result.Get();\n  }\n\n  void StartApi(scoped_refptr<ExtensionFunction> function,\n                base::ListValue args,\n                std::shared_ptr<RestoreApiResult> result) {\n    function->set_extension(extension_.get());\n    function->SetDispatcher(dispatcher_->AsWeakPtr());\n    function->SetArgs(std::move(args));\n    function->set_has_callback(true);\n    function->set_response_callback(base::BindOnce(\n        [](std::shared_ptr<RestoreApiResult> result,\n           ExtensionFunction::ResponseType response, base::ListValue values,\n           const std::string& error, mojom::ExtraResponseDataPtr extra) {\n          if (response == ExtensionFunction::ResponseType::kSucceeded) {\n            ++result->successful_responses;\n            result->values = std::move(values);\n          }\n        },\n        std::move(result)));\n    function->RunWithValidation().Execute();\n  }\n\n  MockExtensionSystemFactory<AlarmStateStoreExtensionSystem> system_factory_;\n  raw_ptr<StateStore> store_ = nullptr;\n  raw_ptr<AlarmManager> manager_ = nullptr;\n  std::unique_ptr<TestEventRouterObserver> event_observer_;\n  std::unique_ptr<ExtensionFunctionDispatcher> dispatcher_;\n  scoped_refptr<const Extension> extension_;\n};\n\nTEST_F(ExtensionAlarmsStateStoreTest,\n       OrdinaryRestoreAndReenableKeepPersistence) {\n  const base::Time when = base::Time::Now() + base::Hours(1);\n  SeedAlarm(extension_->id(), when);\n  Enable(extension_);\n  auto restored = std::make_shared<RestoreCallbackResult>();\n  manager_->GetAlarm(extension_->id(), \"stored\",\n                     ObserveRestoredAlarm(restored));\n  EXPECT_EQ(0, restored->calls);\n  FinishBackendWithoutUi();\n  EXPECT_EQ(0, restored->calls);\n  task_environment()->RunUntilIdle();\n  EXPECT_EQ(1, restored->calls);\n  EXPECT_EQ(1, restored->released);\n  EXPECT_TRUE(restored->has_alarm);\n  EXPECT_DOUBLE_EQ(when.InMillisecondsFSinceUnixEpoch(),\n                   restored->scheduled_time);\n\n  Disable(extension_);\n  EXPECT_EQ(0, manager_->GetCountForExtension(extension_->id()));\n  ASSERT_EQ(1u, ReadStoredAlarms(extension_->id()).size());\n  Enable(extension_);  // Reuses the actual same Extension object.\n  task_environment()->RunUntilIdle();\n  Alarm* alarm = FindAlarm(extension_->id());\n  ASSERT_TRUE(alarm);\n  EXPECT_DOUBLE_EQ(when.InMillisecondsFSinceUnixEpoch(),\n                   alarm->js_alarm->scheduled_time);\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest,\n       DisabledLateRestoreDoesNotConsumeOneShot) {\n  SeedAlarm(extension_->id(), base::Time::Now() - base::Seconds(1));\n  Enable(extension_);\n  Disable(extension_);\n  FinishBackendWithoutUi();\n  task_environment()->RunUntilIdle();\n  task_environment()->FastForwardBy(base::Minutes(1));\n\n  EXPECT_EQ(0, manager_->GetCountForExtension(extension_->id()));\n  // The real default delegate/router is retained. With no enabled listener,\n  // dispatch is not delivery; the regression is silent consumption of storage.\n  EXPECT_TRUE(event_observer_->all_dispatched_events().empty());\n  base::ListValue stored = ReadStoredAlarms(extension_->id());\n  ASSERT_EQ(1u, stored.size());\n  ASSERT_TRUE(stored[0].GetDict().FindString(\"name\"));\n  EXPECT_EQ(\"stored\", *stored[0].GetDict().FindString(\"name\"));\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest,\n       SameObjectReenableClearSurvivesBothReads) {\n  SeedAlarm(extension_->id(), base::Time::Now() + base::Hours(1));\n  Enable(extension_);\n  Disable(extension_);\n  Enable(extension_);\n  auto result = std::make_shared<RestoreApiResult>();\n  StartApi(base::MakeRefCounted<ObservedAlarmsClearAllFunction>(result),\n           base::ListValue(), result);\n  EXPECT_EQ(0, result->successful_responses);\n  FinishBackendWithoutUi();\n  EXPECT_EQ(0, result->successful_responses);\n  task_environment()->RunUntilIdle();\n\n  EXPECT_EQ(1, result->successful_responses);\n  EXPECT_TRUE(result->destroyed);\n  ASSERT_EQ(1u, result->values.size());\n  EXPECT_TRUE(result->values[0].GetBool());\n  EXPECT_FALSE(FindAlarm(extension_->id()));\n  EXPECT_TRUE(ReadStoredAlarms(extension_->id()).empty());\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest,\n       SameObjectReenableReplacementSurvivesBothReads) {\n  const base::Time replacement_time = base::Time::Now() + base::Hours(2);\n  SeedAlarm(extension_->id(), base::Time::Now() + base::Hours(1));\n  Enable(extension_);\n  Disable(extension_);\n  Enable(extension_);\n  auto result = std::make_shared<RestoreApiResult>();\n  StartApi(\n      base::MakeRefCounted<AlarmsCreateFunction>(),\n      base::test::ParseJsonList(\n          R\"([\"stored\", {\"delayInMinutes\": 120, \"persistAcrossSessions\": true}])\"),\n      result);\n  EXPECT_EQ(0, result->successful_responses);\n  FinishBackendWithoutUi();\n  task_environment()->RunUntilIdle();\n\n  EXPECT_EQ(1, result->successful_responses);\n  Alarm* alarm = FindAlarm(extension_->id());\n  ASSERT_TRUE(alarm);\n  EXPECT_DOUBLE_EQ(replacement_time.InMillisecondsFSinceUnixEpoch(),\n                   alarm->js_alarm->scheduled_time);\n  base::ListValue stored = ReadStoredAlarms(extension_->id());\n  ASSERT_EQ(1u, stored.size());\n  EXPECT_EQ(replacement_time.InMillisecondsFSinceUnixEpoch(),\n            stored[0].GetDict().FindDouble(\"scheduledTime\"));\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest, UnloadingOneIdDoesNotCancelOtherRestore) {\n  auto other = ExtensionBuilder(\"Other alarms\")\n                   .SetManifestVersion(3)\n                   .AddAPIPermission(\"alarms\")\n                   .Build();\n  SeedAlarm(extension_->id(), base::Time::Now() + base::Hours(1));\n  SeedAlarm(other->id(), base::Time::Now() + base::Hours(2));\n  Enable(extension_);\n  Enable(other);\n  auto restored = std::make_shared<RestoreCallbackResult>();\n  manager_->GetAlarm(other->id(), \"stored\", ObserveRestoredAlarm(restored));\n  Disable(extension_);\n  FinishBackendWithoutUi();\n  task_environment()->RunUntilIdle();\n\n  EXPECT_EQ(0, manager_->GetCountForExtension(extension_->id()));\n  EXPECT_EQ(1, restored->calls);\n  EXPECT_EQ(1, restored->released);\n  EXPECT_TRUE(restored->has_alarm);\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest, ReadyCallbackReenablesWithoutOldActions) {\n  SeedAlarm(extension_->id(), base::Time::Now() + base::Hours(1));\n  Enable(extension_);\n  auto first = std::make_shared<RestoreCallbackResult>();\n  auto retired = std::make_shared<RestoreCallbackResult>();\n  auto replacement = std::make_shared<RestoreCallbackResult>();\n  manager_->GetAlarm(\n      extension_->id(), \"stored\",\n      ObserveRestoredAlarm(first, base::BindOnce([this, replacement]() {\n                             Disable(extension_);\n                             Enable(extension_);\n                             manager_->GetAlarm(\n                                 extension_->id(), \"stored\",\n                                 ObserveRestoredAlarm(replacement));\n                           })));\n  manager_->GetAlarm(extension_->id(), \"stored\", ObserveRestoredAlarm(retired));\n  FinishBackendWithoutUi();\n  task_environment()->RunUntilIdle();\n\n  EXPECT_EQ(1, first->calls);\n  EXPECT_EQ(1, first->released);\n  EXPECT_EQ(0, retired->calls);\n  EXPECT_EQ(1, retired->released);\n  EXPECT_EQ(1, replacement->calls);\n  EXPECT_EQ(1, replacement->released);\n  EXPECT_TRUE(replacement->has_alarm);\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest, ReadyCallbackCanDestroyManager) {\n  SeedAlarm(extension_->id(), base::Time::Now() + base::Hours(1));\n  Enable(extension_);\n  auto first = std::make_shared<RestoreCallbackResult>();\n  auto retired = std::make_shared<RestoreCallbackResult>();\n  manager_->GetAlarm(\n      extension_->id(), \"stored\",\n      ObserveRestoredAlarm(\n          first, base::BindOnce(&ExtensionAlarmsStateStoreTest::DestroyManager,\n                                base::Unretained(this))));\n  manager_->GetAlarm(extension_->id(), \"stored\", ObserveRestoredAlarm(retired));\n  FinishBackendWithoutUi();\n  task_environment()->RunUntilIdle();\n\n  EXPECT_FALSE(manager_);\n  EXPECT_EQ(1, first->calls);\n  EXPECT_EQ(1, first->released);\n  EXPECT_EQ(0, retired->calls);\n  EXPECT_EQ(1, retired->released);\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest, UnloadReleasesPendingApiBeforeReenable) {\n  SeedAlarm(extension_->id(), base::Time::Now() + base::Hours(1));\n  Enable(extension_);\n  auto result = std::make_shared<RestoreApiResult>();\n  StartApi(base::MakeRefCounted<ObservedAlarmsClearAllFunction>(result),\n           base::ListValue(), result);\n  // StartApi has released its external reference; only the real ready action\n  // owns the API function now. Its destruction is legal while disabled.\n  EXPECT_FALSE(result->destroyed);\n  Disable(extension_);\n  EXPECT_TRUE(result->destroyed);\n  EXPECT_EQ(0, result->successful_responses);\n  // DCHECK builds may synthesize a failure in ExtensionFunction's destructor;\n  // this test intentionally does not assert a build-dependent callback count.\n  Enable(extension_);\n  FinishBackendWithoutUi();\n  task_environment()->RunUntilIdle();\n\n  EXPECT_EQ(0, result->successful_responses);\n  EXPECT_TRUE(FindAlarm(extension_->id()));\n  EXPECT_EQ(1u, ReadStoredAlarms(extension_->id()).size());\n}\n\nTEST_F(ExtensionAlarmsStateStoreTest, DestroyedManagerDropsRealPendingRead) {\n  SeedAlarm(extension_->id(), base::Time::Now() + base::Hours(1));\n  Enable(extension_);\n  auto retired = std::make_shared<RestoreCallbackResult>();\n  manager_->GetAlarm(extension_->id(), \"stored\", ObserveRestoredAlarm(retired));\n  DestroyManager();\n  EXPECT_EQ(0, retired->calls);\n  EXPECT_EQ(1, retired->released);\n  FinishBackendWithoutUi();\n  task_environment()->RunUntilIdle();\n\n  EXPECT_EQ(0, retired->calls);\n  EXPECT_EQ(1, retired->released);\n  EXPECT_EQ(1u, ReadStoredAlarms(extension_->id()).size());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace extensions\n"
