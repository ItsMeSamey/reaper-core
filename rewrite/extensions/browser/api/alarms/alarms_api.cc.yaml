substitutions:
- description: Check Android alarm quota after the initial persisted alarm state is restored
  regex:
    re_pattern: '\ \ AlarmManager\*\ const\ alarm_manager\ =\ AlarmManager::Get\(browser_context\(\)\);\

      \ \ EXTENSION_FUNCTION_VALIDATE\(alarm_manager\);\

      \

      \ \ if\ \(alarm_manager\->GetCountForExtension\(extension_id\(\)\)\ >=\

      \ \ \ \ \ \ AlarmManager::kMaxAlarmsPerExtension\)\ \{\

      \ \ \ \ return\ RespondNow\(Error\(base::StringPrintf\(\

      \ \ \ \ \ \ \ \ kMaxAlarmsError,\ AlarmManager::kMaxAlarmsPerExtension\)\)\);\

      \ \ \}\

      \

      \ \ if\ \(!params\->alarm_info\.name\.has_value\(\)\)\ \{\

      \ \ \ \ params\->alarm_info\.name\ =\ params\->name\.value_or\(kDefaultAlarmName\);\

      '
    replace: "  AlarmManager* const alarm_manager = AlarmManager::Get(browser_context());\n  EXTENSION_FUNCTION_VALIDATE(alarm_manager);\n\n#if !BUILDFLAG(IS_ANDROID)\n  if (alarm_manager->GetCountForExtension(extension_id()) >=\n      AlarmManager::kMaxAlarmsPerExtension) {\n    return RespondNow(Error(base::StringPrintf(\n        kMaxAlarmsError, AlarmManager::kMaxAlarmsPerExtension)));\n  }\n#endif\n\n  if (!params->alarm_info.name.has_value()) {\n    params->alarm_info.name = params->name.value_or(kDefaultAlarmName);\n"
- description: Check Android alarm quota after the initial persisted alarm state is restored
  regex:
    re_pattern: '\ \ \ \ \ \ Manifest::IsUnpackedLocation\(extension\(\)\->location\(\)\),\

      \ \ \ \ \ \ extension\(\)\->manifest_version\(\)\);\

      \ \ Alarm\ alarm\(params\->alarm_info,\ granularity,\ clock_\->Now\(\)\);\

      \ \ alarm_manager\->AddAlarm\(\

      \ \ \ \ \ \ extension_id\(\),\ std::move\(alarm\),\

      \ \ \ \ \ \ base::BindOnce\(\&AlarmsCreateFunction::Callback,\ this\)\);\

      \

      \ \ //\ AddAlarm\ might\ have\ already\ responded\.\

      \ \ return\ did_respond\(\)\ \?\ AlreadyResponded\(\)\ :\ RespondLater\(\);\

      \}\

      \

      void\ AlarmsCreateFunction::Callback\(\)\ \{\

      \ \ Respond\(NoArguments\(\)\);\

      \}\

      \

      ExtensionFunction::ResponseAction\ AlarmsGetFunction::Run\(\)\ \{\

      \ \ std::optional<alarms::Get::Params>\ params\ =\

      '
    replace: "      Manifest::IsUnpackedLocation(extension()->location()),\n      extension()->manifest_version());\n  Alarm alarm(params->alarm_info, granularity, clock_->Now());\n#if BUILDFLAG(IS_ANDROID)\n  alarm_manager->AddAlarmWithQuota(\n      extension_id(), std::move(alarm),\n      base::BindOnce(&AlarmsCreateFunction::CallbackWithQuota, this));\n#else\n  alarm_manager->AddAlarm(\n      extension_id(), std::move(alarm),\n      base::BindOnce(&AlarmsCreateFunction::Callback, this));\n#endif\n\n  // AddAlarm might have already responded.\n  return did_respond() ? AlreadyResponded() : RespondLater();\n}\n\n#if BUILDFLAG(IS_ANDROID)\nvoid AlarmsCreateFunction::CallbackWithQuota(bool added) {\n  if (!added) {\n    Respond(Error(base::StringPrintf(kMaxAlarmsError,\n                                    AlarmManager::kMaxAlarmsPerExtension)));\n    return;\n  }\n  Respond(NoArguments());\n}\n#else\nvoid AlarmsCreateFunction::Callback() {\n  Respond(NoArguments());\n}\n#endif\n\nExtensionFunction::ResponseAction AlarmsGetFunction::Run() {\n  std::optional<alarms::Get::Params> params =\n"
