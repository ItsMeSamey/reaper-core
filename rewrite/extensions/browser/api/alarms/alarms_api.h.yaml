substitutions:
- description: Check Android alarm quota after the initial persisted alarm state is restored
  regex:
    re_pattern: '\#include\ <vector>\

      \

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "extensions/browser/extension_function\.h"\

      \

      namespace\ base\ \{\

      '
    replace: '#include <vector>


      #include "base/memory/raw_ptr.h"

      #include "build/build_config.h"

      #include "extensions/browser/extension_function.h"


      namespace base {

      '
- description: Check Android alarm quota after the initial persisted alarm state is restored
  regex:
    re_pattern: '\ \ ResponseAction\ Run\(\)\ override;\

      \ \ DECLARE_EXTENSION_FUNCTION\("alarms\.create",\ ALARMS_CREATE\)\

      \ private:\

      \ \ void\ Callback\(\);\

      \

      \ \ const\ raw_ptr<base::Clock>\ clock_;\

      \};\

      '
    replace: "  ResponseAction Run() override;\n  DECLARE_EXTENSION_FUNCTION(\"alarms.create\", ALARMS_CREATE)\n private:\n#if BUILDFLAG(IS_ANDROID)\n  void CallbackWithQuota(bool added);\n#else\n  void Callback();\n#endif\n\n  const raw_ptr<base::Clock> clock_;\n};\n"
