substitutions:

  - description: "The storage backend is available on Android extension-core builds."
    regex:
      pattern: "assert(enable_extensions,\n       \"Cannot depend on extensions because enable_extensions=false.\")"
      replace: "assert(enable_extensions_core,\n       \"Cannot depend on extensions because enable_extensions_core=false.\")"
