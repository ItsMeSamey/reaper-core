substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\#include\ "base/compiler_specific\.h"\

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "extensions/browser/api/messaging/message_port\.h"\

      \#include\ "extensions/browser/api/messaging/native_message_host\.h"\

      \#include\ "extensions/browser/browser_context_keyed_api_factory\.h"\

      '
    replace: '#include "base/compiler_specific.h"

      #include "base/memory/raw_ptr.h"

      #include "base/memory/weak_ptr.h"

      #include "build/build_config.h"

      #include "extensions/browser/api/messaging/message_port.h"

      #include "extensions/browser/api/messaging/native_message_host.h"

      #include "extensions/browser/browser_context_keyed_api_factory.h"

      '
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\

      \ \ //\ Convenience\ method\ to\ get\ the\ MessageService\ for\ a\ browser\ context\.\

      \ \ static\ MessageService\*\ Get\(content::BrowserContext\*\ context\);\

      \

      \ \ //\ Given\ an\ extension''s\ ID,\ opens\ a\ channel\ between\ the\ given\ renderer\ "port"\

      \ \ //\ and\ every\ listening\ context\ owned\ by\ that\ extension\.\ `channel_name`\ is\

      '
    replace: "\n  // Convenience method to get the MessageService for a browser context.\n  static MessageService* Get(content::BrowserContext* context);\n\n#if BUILDFLAG(IS_ANDROID)\n  // These established companions retain their original AIDL entry point.\n  static bool IsAndroidLegacyNativeMessagingExtensionId(\n      const ExtensionId& extension_id);\n#endif\n\n  // Given an extension's ID, opens a channel between the given renderer \"port\"\n  // and every listening context owned by that extension. `channel_name` is\n"
