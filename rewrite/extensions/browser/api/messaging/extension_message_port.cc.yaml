    replace: "}\n\nbool ExtensionMessagePort::UnregisterWorker(const WorkerId& worker_id) {\n#if BUILDFLAG(IS_ANDROID)\n  // RevalidatePort may pass a key in service_workers_; own the identity before\n  // removing that receiver.\n  const WorkerId captured_worker_id = worker_id;\n#endif\n  if (extension_id_ != worker_id.extension_id)\n    return false;\n#if BUILDFLAG(IS_ANDROID)\n  // A live remote disconnect still owns UUIDs until normal channel balancing.\n  // Only a retired incarnation or shutting-down context can drop them here.\n  const bool worker_retired =\n      browser_context_->ShutdownStarted() ||\n      !ProcessManager::Get(browser_context_)\n           ->GetServiceWorkerRunningInstance(captured_worker_id);\n  auto keepalives = pending_keepalive_uuids_.find(captured_worker_id);\n  if (worker_retired && keepalives != pending_keepalive_uuids_.end() &&\n      keepalives->first.start_token == captured_worker_id.start_token) {\n    pending_keepalive_uuids_.erase(keepalives);\n  }\n  auto receiver = service_workers_.find(captured_worker_id);\n  if (receiver != service_workers_.end() &&\n      receiver->first.start_token == captured_worker_id.start_token) {\n    service_workers_.erase(receiver);\n  }\n  auto pending = pending_service_workers_.find(captured_worker_id);\n  if (pending != pending_service_workers_.end() &&\n      pending->start_token == captured_worker_id.start_token) {\n    pending_service_workers_.erase(pending);\n  }\n#else\n  service_workers_.erase(worker_id);\n  pending_service_workers_.erase(worker_id);\n#endif\n\n  if (!IsValidPort()) {\n    CloseChannel();\n"
