substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\#include\ "extensions/common/extension\.h"\

      \#include\ "extensions/common/extension_features\.h"\

      \#include\ "extensions/common/extension_id\.h"\

      \#include\ "extensions/common/manifest_constants\.h"\

      \#include\ "extensions/common/manifest_handlers/background_info\.h"\

      \#include\ "extensions/common/manifest_handlers/externally_connectable\.h"\

      '
    replace: '#include "extensions/common/extension.h"

      #include "extensions/common/extension_features.h"

      #include "extensions/common/extension_id.h"

      #include "extensions/common/manifest.h"

      #include "extensions/common/manifest_constants.h"

      #include "extensions/common/manifest_handlers/background_info.h"

      #include "extensions/common/manifest_handlers/externally_connectable.h"

      '
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: 'constexpr\ char\ kUnauthorizedExtensionError\[\]\ =\

      \ \ \ \ "Access\ to\ native\ messaging\ is\ unauthorized\ for\ this\ extension\.";\

      \

      //\ TODO\(crbug\.com/555299632\):\ Currently\ native\ messaging\ on\ desktop\ Android\ is\

      //\ restricted\ to\ allowlisted\ extensions\.\ This\ allowlist\ restriction\ will\ be\

      //\ removed\ once\ a\ library\ is\ added\ that\ would\ allow\ external\ app\ developers\ to\

      //\ securely\ audit\ the\ connection\ between\ Chrome/extensions\ and\ their\ app\.\

      constexpr\ auto\ kAndroidNativeMessagingAllowedExtensionIds\ =\

      \ \ \ \ base::MakeFixedFlatSet<std::string_view>\(\{\

      \ \ \ \ \ \ \ \ //\ gnubbyd\-v3\ dev\

      '
    replace: "constexpr char kUnauthorizedExtensionError[] =\n    \"Access to native messaging is unauthorized for this extension.\";\n\n// Existing gnubbyd companions retain their original, app-authorized contract.\n// Other extensions use the authenticated Android companion entry point.\nconstexpr auto kAndroidNativeMessagingAllowedExtensionIds =\n    base::MakeFixedFlatSet<std::string_view>({\n        // gnubbyd-v3 dev\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\}\

      \

      //\ static\

      MessageService\*\ MessageService::Get\(BrowserContext\*\ context\)\ \{\

      \ \ return\ BrowserContextKeyedAPIFactory<MessageService>::Get\(context\);\

      \}\

      '
    replace: "}\n\n// static\n#if BUILDFLAG(IS_ANDROID)\n// static\nbool MessageService::IsAndroidLegacyNativeMessagingExtensionId(\n    const ExtensionId& extension_id) {\n  return kAndroidNativeMessagingAllowedExtensionIds.contains(extension_id);\n}\n#endif\n\nMessageService* MessageService::Get(BrowserContext* context) {\n  return BrowserContextKeyedAPIFactory<MessageService>::Get(context);\n}\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \}\

      \

      \#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ if\ \(!base::FeatureList::IsEnabled\(\

      \ \ \ \ \ \ \ \ \ \ extensions_features::\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ kApiDesktopAndroidNativeMessagingBypassExtensionAllowlist\)\ \&\&\

      \ \ \ \ \ \ !kAndroidNativeMessagingAllowedExtensionIds\.contains\(extension\->id\(\)\)\)\ \{\

      \ \ \ \ opener_port\->DispatchOnDisconnect\(kUnauthorizedExtensionError\);\

      \ \ \ \ return;\

      \ \ \}\

      '
    replace: "  }\n\n#if BUILDFLAG(IS_ANDROID)\n  // Generic companions must authenticate the browser and extension through the\n  // authorized AIDL entry point. Require a declared target certificate even\n  // for unpacked extensions; packed legacy extensions have the same backstop.\n  if (android_certificates.empty() &&\n      (!Manifest::IsUnpackedLocation(extension->location()) ||\n       !IsAndroidLegacyNativeMessagingExtensionId(extension->id()))) {\n    opener_port->DispatchOnDisconnect(kUnauthorizedExtensionError);\n    return;\n  }\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ return;\

      \ \ \}\

      \

      \ \ std::unique_ptr<MessageChannel>\ channel\ =\ std::make_unique<MessageChannel>\(\);\

      \ \ channel\->opener\ =\ std::move\(opener_port\);\

      \ \ channel\->opener\->OpenPort\(source\.render_process_id\(\),\ source\.port_context\(\)\);\

      '
    replace: "    return;\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  // Generic Android companions have no desktop system-host registration.\n  // Do not ignore a managed restriction on user-level native messaging hosts.\n  if (policy_permission ==\n          MessagingDelegate::PolicyPermission::ALLOW_SYSTEM_ONLY &&\n      !IsAndroidLegacyNativeMessagingExtensionId(extension->id())) {\n    opener_port->DispatchOnDisconnect(kProhibitedByPoliciesError);\n    return;\n  }\n#endif\n\n  std::unique_ptr<MessageChannel> channel = std::make_unique<MessageChannel>();\n  channel->opener = std::move(opener_port);\n  channel->opener->OpenPort(source.render_process_id(), source.port_context());\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ //\ NOTE:\ We''re\ creating\ \|receiver\|\ with\ nullptr\ \|source_render_frame_host\|,\

      \ \ //\ which\ seems\ to\ work\ for\ native\ messaging\ tests\.\ This\ might\ need\ further\

      \ \ //\ checking\ in\ case\ any\ issues\ arise\ from\ it\.\

      \ \ std::unique_ptr<MessagePort>\ receiver\(\

      \ \ \ \ \ \ messaging_delegate_\->CreateReceiverForNativeApp\(\

      \ \ \ \ \ \ \ \ \ \ context_,\ weak_factory_\.GetWeakPtr\(\),\ source_render_frame_host,\

      \ \ \ \ \ \ \ \ \ \ extension\->id\(\),\ receiver_port_id,\ native_app_name,\

      \ \ \ \ \ \ \ \ \ \ policy_permission\ ==\ MessagingDelegate::PolicyPermission::ALLOW_ALL,\

      \ \ \ \ \ \ \ \ \ \ android_certificates,\ \&error\)\);\

      '
    replace: "  // NOTE: We're creating |receiver| with nullptr |source_render_frame_host|,\n  // which seems to work for native messaging tests. This might need further\n  // checking in case any issues arise from it.\n  BrowserContext* receiver_context = context_;\n#if BUILDFLAG(IS_ANDROID)\n  if (!IsAndroidLegacyNativeMessagingExtensionId(extension->id())) {\n    receiver_context = source_context;\n  }\n#endif\n  std::unique_ptr<MessagePort> receiver(\n      messaging_delegate_->CreateReceiverForNativeApp(\n          receiver_context, weak_factory_.GetWeakPtr(), source_render_frame_host,\n          extension->id(), receiver_port_id, native_app_name,\n          policy_permission == MessagingDelegate::PolicyPermission::ALLOW_ALL,\n          android_certificates, &error));\n"
