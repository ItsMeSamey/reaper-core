substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\#include\ "base/functional/bind\.h"\

      \#include\ "base/strings/string_number_conversions\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "content/public/browser/browser_task_traits\.h"\

      \#include\ "content/public/browser/browser_thread\.h"\

      \#include\ "extensions/browser/api/declarative_net_request/action_tracker\.h"\

      '
    replace: '#include "base/functional/bind.h"

      #include "base/strings/string_number_conversions.h"

      #include "base/time/time.h"

      #include "build/build_config.h"

      #include "content/public/browser/browser_task_traits.h"

      #include "content/public/browser/browser_thread.h"

      #include "extensions/browser/api/declarative_net_request/action_tracker.h"

      '
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ \ \ \ \ for\ \(const\ auto\&\ value\ :\ values\.GetList\(\)\)\ \{\

      \ \ \ \ \ \ \ \ //\ Check\ that\ header\ values\ are\ valid\ strings\.\

      \ \ \ \ \ \ \ \ if\ \(!value\.is_string\(\)\ \|\|\

      \ \ \ \ \ \ \ \ \ \ \ \ !net::HttpUtil::IsValidHeaderName\(value\.GetString\(\)\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ error\ =\ ErrorUtils::FormatErrorMessage\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ declarative_net_request::kInvalidResponseHeaderValueError,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ header\);\

      '
    replace: "      for (const auto& value : values.GetList()) {\n        // Check that header values are valid strings.\n        if (!value.is_string() ||\n#if BUILDFLAG(IS_ANDROID)\n            !net::HttpUtil::IsValidHeaderValue(value.GetString())) {\n#else\n            !net::HttpUtil::IsValidHeaderName(value.GetString())) {\n#endif\n          error = ErrorUtils::FormatErrorMessage(\n              declarative_net_request::kInvalidResponseHeaderValueError,\n              header);\n"
- description: Android dynamic-rule telemetry compile-out only
  regex:
    re_pattern: '\ \ //\ Collect\ rules\ to\ add\ in\ the\ Extension\ Telemetry\ Service\.\

      \ \ if\ \(!rules_to_add\.empty\(\)\)\ \{\

      \ \ \ \ ExtensionsBrowserClient::Get\(\)\

      \ \ \ \ \ \ \ \ \->GetSafeBrowsingDelegate\(\)\

      \ \ \ \ \ \ \ \ \->NotifyExtensionApiDeclarativeNetRequest\(browser_context\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ extension_id\(\),\ rules_to_add\);\

      \ \ \}\

      \

      \ \ auto\*\ rules_monitor_service\ =\

      \ \ \ \ \ \ declarative_net_request::RulesMonitorService::Get\(browser_context\(\)\);\

      \ \ DCHECK\(rules_monitor_service\);\

      \ \ DCHECK\(extension\(\)\);'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Collect rules to add in the Extension Telemetry Service.\n  if (!rules_to_add.empty()) {\n    ExtensionsBrowserClient::Get()\n        ->GetSafeBrowsingDelegate()\n        ->NotifyExtensionApiDeclarativeNetRequest(browser_context(),\n                                                  extension_id(), rules_to_add);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  auto* rules_monitor_service =\n      declarative_net_request::RulesMonitorService::Get(browser_context());\n  DCHECK(rules_monitor_service);\n  DCHECK(extension());"
- description: Android session-rule telemetry compile-out only
  regex:
    re_pattern: '\ \ //\ Collect\ rules\ to\ add\ in\ the\ Extension\ Telemetry\ Service\.\

      \ \ if\ \(!rules_to_add\.empty\(\)\)\ \{\

      \ \ \ \ ExtensionsBrowserClient::Get\(\)\

      \ \ \ \ \ \ \ \ \->GetSafeBrowsingDelegate\(\)\

      \ \ \ \ \ \ \ \ \->NotifyExtensionApiDeclarativeNetRequest\(browser_context\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ extension_id\(\),\ rules_to_add\);\

      \ \ \}\

      \

      \ \ auto\*\ rules_monitor_service\ =\

      \ \ \ \ \ \ declarative_net_request::RulesMonitorService::Get\(browser_context\(\)\);\

      \ \ DCHECK\(rules_monitor_service\);\

      \ \ rules_monitor_service\->UpdateSessionRules\('
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Collect rules to add in the Extension Telemetry Service.\n  if (!rules_to_add.empty()) {\n    ExtensionsBrowserClient::Get()\n        ->GetSafeBrowsingDelegate()\n        ->NotifyExtensionApiDeclarativeNetRequest(browser_context(),\n                                                  extension_id(), rules_to_add);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  auto* rules_monitor_service =\n      declarative_net_request::RulesMonitorService::Get(browser_context());\n  DCHECK(rules_monitor_service);\n  rules_monitor_service->UpdateSessionRules("
