        "replace": "}\n\n}  // namespace\n\n#if BUILDFLAG(IS_ANDROID)\n// Keep the production mapper under test, but use ordinary temporary JSON files\n// for index I/O. A DocumentsProvider and picker consent remain device coverage.\nclass FileBackedRulesetSourceAndroidSafCacheTest : public FileSequenceHelperTest {\n protected:\n  void SetUp() override {\n    FileSequenceHelperTest::SetUp();\n    ASSERT_TRUE(directory_.CreateUniqueTempDir());\n  }\n\n  FileBackedRulesetSource Source(std::string_view filename = \"rules.json\",\n                                int ruleset_id = 1) {\n    return FileBackedRulesetSource(\n        directory_.GetPath().AppendASCII(filename),\n        directory_.GetPath().AppendASCII(\"cache\").AppendASCII(\n            base::NumberToString(ruleset_id)),\n        RulesetID(ruleset_id), GetMaximumRulesPerRuleset(),\n        GenerateDummyExtensionID(), true, true);\n  }\n\n  void WriteRules(const FileBackedRulesetSource& source,\n                  std::string_view filter) {\n    const std::string json = base::StrCat(\n        {R\"([{\"id\":1,\"priority\":1,\"action\":{\"type\":\"block\"},\"condition\":{\"urlFilter\":\")\",\n         filter, R\"(\",\"resourceTypes\":[\"xmlhttprequest\"]}}])\"});\n    ASSERT_TRUE(base::WriteFile(source.json_path(), json));\n  }\n\n  IndexAndPersistJSONRulesetResult Index(\n      const FileBackedRulesetSource& source) {\n    return source.IndexAndPersistJSONRuleset(\n        RulesetSource::kRaiseErrorOnInvalidRules);\n  }\n\n  std::string Read(const base::FilePath& path) {\n    std::string data;\n    EXPECT_TRUE(base::ReadFileToString(path, &data));\n    return data;\n  }\n\n  base::ScopedTempDir directory_;\n};\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       MapperKeepsOriginalSourceAndSeparatesProfilesAndTrees) {\n  auto extension = ExtensionBuilder(\"SAF cache\")\n                       .SetPath(base::FilePath(\"/SAF/provider/tree/first\"))\n                       .SetLocation(mojom::ManifestLocation::kUnpacked)\n                       .Build();\n  DNRManifestData::RulesetInfo info;\n  info.id = RulesetID(1);\n  info.relative_path = base::FilePath(\"rules.json\");\n  info.enabled = true;\n  const auto original_path = extension->path();\n  const auto original_id = extension->id();\n  const auto profile = directory_.GetPath().AppendASCII(\"profile\");\n  auto source = FileBackedRulesetSource::CreateStatic(*extension, info, profile);\n  auto other_profile = FileBackedRulesetSource::CreateStatic(\n      *extension, info, directory_.GetPath().AppendASCII(\"other\"));\n  auto other_extension = ExtensionBuilder(\"SAF cache\")\n                             .SetPath(base::FilePath(\"/SAF/provider/tree/second\"))\n                             .SetLocation(mojom::ManifestLocation::kUnpacked)\n                             .Build();\n  auto other_tree =\n      FileBackedRulesetSource::CreateStatic(*other_extension, info, profile);\n  EXPECT_EQ(original_path.Append(info.relative_path), source.json_path());\n  EXPECT_EQ(original_id, source.extension_id());\n  EXPECT_EQ(original_path, extension->path());\n  EXPECT_TRUE(profile.IsParent(source.IndexedPathForChecksum(17)));\n  EXPECT_NE(source.IndexedPathForChecksum(17),\n            other_profile.IndexedPathForChecksum(17));\n  EXPECT_NE(source.IndexedPathForChecksum(17),\n            other_tree.IndexedPathForChecksum(17));\n  EXPECT_NE(source.IndexedPathForChecksum(17), source.IndexedPathForChecksum(18));\n  EXPECT_EQ(source.IndexedPathForChecksum(17),\n            source.Clone().IndexedPathForChecksum(17));\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       LocalAndPackedStaticPathsRemainUnchanged) {\n  DNRManifestData::RulesetInfo info;\n  info.id = RulesetID(1);\n  info.relative_path = base::FilePath(\"rules.json\");\n  for (const auto& path : {base::FilePath(\"/ordinary/extension\"),\n                           base::FilePath(\"/SAF/provider/tree/packed\")}) {\n    const auto location = path.IsVirtualDocumentPath()\n                              ? mojom::ManifestLocation::kInternal\n                              : mojom::ManifestLocation::kUnpacked;\n    auto extension = ExtensionBuilder(\"normal cache\")\n                         .SetPath(path).SetLocation(location).Build();\n    auto source = FileBackedRulesetSource::CreateStatic(*extension, info);\n    EXPECT_EQ(path.Append(file_util::GetIndexedRulesetRelativePath(1)),\n              source.indexed_path());\n    EXPECT_EQ(source.indexed_path(), source.IndexedPathForChecksum(17));\n  }\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       FailedLaterRulesetKeepsPreviouslyInstalledIndexAndPrefs) {\n  auto source = Source();\n  WriteRules(source, \"previous\");\n  auto old_result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess,\n            old_result.status);\n  const int old_checksum = old_result.ruleset_checksum;\n  const auto old_path = source.IndexedPathForChecksum(old_checksum);\n  const auto old_bytes = Read(old_path);\n  PrefsHelper prefs(*ExtensionPrefs::Get(browser_context()));\n  prefs.SetStaticRulesetChecksum(source.extension_id(), source.id(), old_checksum);\n\n  WriteRules(source, \"candidate\");\n  auto candidate = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, candidate.status);\n  ASSERT_NE(old_checksum, candidate.ruleset_checksum);\n  auto later = Source(\"later.json\", 2);\n  ASSERT_TRUE(base::WriteFile(later.json_path(), \"{invalid\"));\n  EXPECT_EQ(IndexAndPersistJSONRulesetResult::Status::kError, Index(later).status);\n\n  // Install prefs are committed only by the installer after every ruleset and\n  // policy check succeeds. Indexing a rejected candidate must not change them.\n  int stored_checksum = -1;\n  ASSERT_TRUE(prefs.GetStaticRulesetChecksum(source.extension_id(), source.id(),\n                                           stored_checksum));\n  EXPECT_EQ(old_checksum, stored_checksum);\n  EXPECT_EQ(old_bytes, Read(old_path));\n  std::unique_ptr<RulesetMatcher> matcher;\n  EXPECT_EQ(LoadRulesetResult::kSuccess,\n            source.CreateVerifiedMatcher(old_checksum, &matcher));\n  WriteRules(later, \"corrected\");\n  EXPECT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, Index(later).status);\n  EXPECT_EQ(old_bytes, Read(old_path));\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       SameChecksumDifferentCurrentPayloadCannotReplaceInstalledIndex) {\n  OverrideGetChecksumForTest(12345);\n  base::ScopedClosureRunner reset(\n      base::BindOnce(&OverrideGetChecksumForTest, -1));\n  auto source = Source();\n  WriteRules(source, \"first\");\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, Index(source).status);\n  const auto path = source.IndexedPathForChecksum(12345);\n  const auto first = Read(path);\n  WriteRules(source, \"second\");\n  EXPECT_EQ(IndexAndPersistJSONRulesetResult::Status::kError, Index(source).status);\n  EXPECT_EQ(first, Read(path));\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       IdenticalCurrentPayloadIsReusedAndCloneLoadsIt) {\n  auto source = Source();\n  WriteRules(source, \"same\");\n  auto result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, result.status);\n  const auto path = source.IndexedPathForChecksum(result.ruleset_checksum);\n  const auto before = Read(path);\n  auto again = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, again.status);\n  EXPECT_EQ(result.ruleset_checksum, again.ruleset_checksum);\n  EXPECT_EQ(before, Read(path));\n  std::unique_ptr<RulesetMatcher> matcher;\n  EXPECT_EQ(LoadRulesetResult::kSuccess,\n            source.Clone().CreateVerifiedMatcher(result.ruleset_checksum, &matcher));\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       GenuineVersionMismatchReindexesThroughExistingLoadFlow) {\n  auto source = Source();\n  WriteRules(source, \"old-format\");\n  auto result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, result.status);\n  auto scoped_version = CreateScopedIncrementRulesetVersionForTesting();\n  std::unique_ptr<RulesetMatcher> matcher;\n  EXPECT_EQ(LoadRulesetResult::kErrorVersionMismatch,\n            source.CreateVerifiedMatcher(result.ruleset_checksum, &matcher));\n  std::vector<TestCase> cases;\n  cases.emplace_back(source.Clone());\n  cases.back().checksum = result.ruleset_checksum;\n  cases.back().expected_result.has_new_checksum = true;\n  cases.back().expected_result.load_result = LoadRulesetResult::kSuccess;\n  TestLoadRulesets(cases);\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       TrueCacheMissReindexesWithoutChangingExpectedChecksum) {\n  auto source = Source();\n  WriteRules(source, \"unchanged\");\n  auto result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, result.status);\n  ASSERT_TRUE(base::DeleteFile(source.IndexedPathForChecksum(result.ruleset_checksum)));\n  std::vector<TestCase> cases;\n  cases.emplace_back(source.Clone());\n  cases.back().checksum = result.ruleset_checksum;\n  cases.back().expected_result.has_new_checksum = false;\n  cases.back().expected_result.load_result = LoadRulesetResult::kSuccess;\n  TestLoadRulesets(cases);\n  EXPECT_TRUE(base::PathExists(source.IndexedPathForChecksum(result.ruleset_checksum)));\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       MissingCacheWithChangedJsonDoesNotSilentlyChangeExpectedChecksum) {\n  auto source = Source();\n  WriteRules(source, \"installed\");\n  auto result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, result.status);\n  ASSERT_TRUE(base::DeleteFile(source.IndexedPathForChecksum(result.ruleset_checksum)));\n  WriteRules(source, \"externally-changed\");\n  std::vector<TestCase> cases;\n  cases.emplace_back(source.Clone());\n  cases.back().checksum = result.ruleset_checksum;\n  cases.back().expected_result.has_new_checksum = false;\n  cases.back().expected_result.load_result = LoadRulesetResult::kErrorInvalidPath;\n  TestLoadRulesets(cases);\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       MalformedGeneratedCacheReindexesThroughExistingLoadFlow) {\n  auto source = Source();\n  WriteRules(source, \"valid\");\n  auto result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, result.status);\n  const auto path = source.IndexedPathForChecksum(result.ruleset_checksum);\n  ASSERT_TRUE(base::WriteFile(path, \"not-a-version-header\"));\n  std::vector<TestCase> cases;\n  cases.emplace_back(source.Clone());\n  cases.back().checksum = result.ruleset_checksum;\n  cases.back().expected_result.has_new_checksum = true;\n  cases.back().expected_result.load_result = LoadRulesetResult::kSuccess;\n  TestLoadRulesets(cases);\n  EXPECT_NE(\"not-a-version-header\", Read(path));\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       CorruptCurrentChecksumReindexesThroughExistingLoadFlow) {\n  auto source = Source();\n  WriteRules(source, \"valid\");\n  auto result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, result.status);\n  const auto path = source.IndexedPathForChecksum(result.ruleset_checksum);\n  auto corrupted = Read(path);\n  corrupted.back() ^= 1;\n  ASSERT_TRUE(base::WriteFile(path, corrupted));\n  std::vector<TestCase> cases;\n  cases.emplace_back(source.Clone());\n  cases.back().checksum = result.ruleset_checksum;\n  cases.back().expected_result.has_new_checksum = true;\n  cases.back().expected_result.load_result = LoadRulesetResult::kSuccess;\n  TestLoadRulesets(cases);\n  EXPECT_NE(corrupted, Read(path));\n}\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       UnreadableCachePathDoesNotPermitReplacingIt) {\n  auto source = Source();\n  WriteRules(source, \"valid\");\n  auto result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, result.status);\n  const auto path = source.IndexedPathForChecksum(result.ruleset_checksum);\n  ASSERT_TRUE(base::DeleteFile(path));\n  ASSERT_TRUE(base::CreateDirectory(path));\n  EXPECT_EQ(IndexAndPersistJSONRulesetResult::Status::kError, Index(source).status);\n  EXPECT_TRUE(base::DirectoryExists(path));\n}\n\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       MatchingChecksumInvalidFlatBufferStillRepairs) {\n  OverrideGetChecksumForTest(12345);\n  base::ScopedClosureRunner reset(\n      base::BindOnce(&OverrideGetChecksumForTest, -1));\n  auto source = Source();\n  WriteRules(source, \"valid\");\n  auto result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, result.status);\n  const auto path = source.IndexedPathForChecksum(result.ruleset_checksum);\n  const std::string invalid =\n      GetIndexedRulesetData(base::as_byte_span(std::string_view(\"invalid\")));\n  ASSERT_TRUE(base::WriteFile(path, invalid));\n  std::unique_ptr<RulesetMatcher> matcher;\n  EXPECT_EQ(LoadRulesetResult::kErrorChecksumMismatch,\n            source.CreateVerifiedMatcher(result.ruleset_checksum, &matcher));\n  std::vector<TestCase> cases;\n  cases.emplace_back(source.Clone());\n  cases.back().checksum = result.ruleset_checksum;\n  cases.back().expected_result.has_new_checksum = true;\n  cases.back().expected_result.load_result = LoadRulesetResult::kSuccess;\n  TestLoadRulesets(cases);\n  EXPECT_NE(invalid, Read(path));\n}\n\n\nTEST_F(FileBackedRulesetSourceAndroidSafCacheTest,\n       OversizedGeneratedIndexReindexesWithinExistingSmallLimit) {\n  constexpr size_t kLimit = 12 * 1024;\n  auto source = Source();\n  WriteRules(source, \"valid\");\n  auto result = Index(source);\n  ASSERT_EQ(IndexAndPersistJSONRulesetResult::Status::kSuccess, result.status);\n  const auto path = source.IndexedPathForChecksum(result.ruleset_checksum);\n  const auto original = Read(path);\n  const auto source_json = Read(source.json_path());\n  ASSERT_LT(original.size(), kLimit);\n  ASSERT_LT(source_json.