substitutions:
  - description: "Remove recording-only dependencies from the shared list"
    regex:
      pattern: "    \"//services/metrics/public/cpp:ukm_builders\",\n    \"//url\",\n"
      replace: ""
    count: 1
  - description: "Keep UKM recording dependencies desktop-only"
    regex:
      pattern: "    \"//extensions/common/api\",\n  ]\n"
      replace: "    \"//extensions/common/api\",\n  ]\n  if (!is_android) {\n    deps += [\n      \"//services/metrics/public/cpp:ukm_builders\",\n      \"//url\",\n    ]\n  }\n"
    count: 1
