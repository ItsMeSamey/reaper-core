substitutions:
  - description: "Declare the Android compile-time boundary"
    regex:
      pattern: "#include \"base/hash/hash.h\"\n"
      replace: "#include \"build/build_config.h\"\n\n#if !BUILDFLAG(IS_ANDROID)\n#include \"base/hash/hash.h\"\n#endif\n"
    count: 1
  - description: "Keep recording-only native headers desktop-only"
    regex:
      pattern: "#include \"base/metrics/histogram.h\"\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/metrics/histogram.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
