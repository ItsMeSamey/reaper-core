substitutions:
- description: Move storage event service declaration out of desktop-only APIs.
  regex:
    pattern: '#include "extensions/browser/api/system_info/system_info_api.h"

      '
    replace: ''
- description: Register storage event service on every supported extension build.
  regex:
    pattern: '#include "extensions/browser/api/system_display/system_display_api.h"'
    replace: '#include "extensions/browser/api/system_display/system_display_api.h"

      #include "extensions/browser/api/system_info/system_info_api.h"'
- description: Move storage event factory out of desktop-only APIs.
  regex:
    pattern: '  SystemInfoAPI::GetFactoryInstance();

      '
    replace: ''
- description: Create the storage listener observer before extensions start.
  regex:
    pattern: '  TestStartedAndFinishedEventQueue::GetFactoryInstance();'
    replace: "  SystemInfoAPI::GetFactoryInstance();\n  TestStartedAndFinishedEventQueue::GetFactoryInstance();"
- description: Move printer provider factory out of desktop-only includes.
  regex:
    re_pattern: '\#include\ "extensions/browser/api/printer_provider/printer_provider_api_factory\.h"\

      '
    replace: ''
- description: Include printer provider factory for core extensions.
  regex:
    re_pattern: '\#include\ "extensions/browser/api/power/power_api\.h"\

      '
    replace: '#include "extensions/browser/api/power/power_api.h"

      #include "extensions/browser/api/printer_provider/printer_provider_api_factory.h"

      '
- description: Remove desktop-only printer provider factory registration.
  regex:
    re_pattern: '\ \ PrinterProviderAPIFactory::GetInstance\(\);\

      '
    replace: ''
- description: Register printer provider factory for core extensions.
  regex:
    re_pattern: '\ \ PowerAPI::GetFactoryInstance\(\);\

      '
    replace: "  PowerAPI::GetFactoryInstance();\n  PrinterProviderAPIFactory::GetInstance();\n"
