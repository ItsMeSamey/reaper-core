substitutions:

  - description: "Declare optional Android power lease errors."
    regex:
      pattern: "#include <memory>"
      replace: "#include <memory>\n#include <optional>"

  - description: "Expose an Android-only embedder power lease interface."
    regex:
      pattern: "class AutomationInternalApiDelegate;"
      replace: "#if BUILDFLAG(IS_ANDROID)\n// Android display leases are restricted to foreground windows; CPU leases use\n// the platform's normal wake-lock contract and never bypass device policy.\nclass AndroidPowerDelegate {\n public:\n  virtual ~AndroidPowerDelegate() = default;\n  // Transactional acquisition errors leave the previous aggregate unchanged.\n  // Nontransactional removal must revoke no-longer-requested resources before\n  // acquiring any remaining lease. New display requests require a foreground\n  // window; existing requests may wait for one to return.\n  virtual std::optional<std::string> Apply(bool system,\n                                           bool display,\n                                           bool require_foreground_display,\n                                           bool transactional) = 0;\n  virtual void Cancel() = 0;\n};\n#endif\n\nclass AutomationInternalApiDelegate;"

  - description: "Let Android embedders supply a real power backend."
    regex:
      pattern: "  // Storage API support."
      replace: "#if BUILDFLAG(IS_ANDROID)\n  virtual std::unique_ptr<AndroidPowerDelegate> CreateAndroidPowerDelegate(\n      content::BrowserContext* context) const;\n#endif\n\n  // Storage API support."
