substitutions:

  - description: "Use the existing Android display event owner alongside storage events."
    regex:
      pattern: "#include \"base/values.h\""
      replace: "#include \"base/values.h\"\n#include \"build/build_config.h\""

  - description: "Leave Android display observation with SystemDisplayAPI."
    regex:
      pattern: "  router->RegisterObserver(this, system_display::OnDisplayChanged::kEventName);\n\n  SystemInfoEventRouter::GetInstance()->CheckForDisplayListeners(context);"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  router->RegisterObserver(this, system_display::OnDisplayChanged::kEventName);\n\n  SystemInfoEventRouter::GetInstance()->CheckForDisplayListeners(context);\n#endif"
