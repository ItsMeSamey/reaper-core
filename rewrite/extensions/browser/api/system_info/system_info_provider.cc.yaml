substitutions:

  - description: "Declare the Android extension build flag used by storage conversions."
    regex:
      pattern: "#include \"content/public/browser/browser_thread.h\""
      replace: "#include \"content/public/browser/browser_thread.h\"\n#include \"extensions/buildflags/buildflags.h\""

  - description: "Reuse StorageUnitInfo conversion with the Android storage monitor."
    count: 2
    regex:
      pattern: "#if !BUILDFLAG(IS_ANDROID)"
      replace: "#if !BUILDFLAG(IS_ANDROID) || BUILDFLAG(ENABLE_DESKTOP_ANDROID_EXTENSIONS)"
