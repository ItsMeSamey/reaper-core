substitutions:
- description: Include Android native print client token type.
  regex:
    re_pattern: \#include\ "base/values\.h"
    replace: '#include "base/values.h"

      #include "build/build_config.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "base/unguessable_token.h"

      #endif'
- description: Track Android print requests for bounded cancellation.
  regex:
    re_pattern: '\ \ //\ The\ print\ job\ title\.\

      \ \ std::u16string\ job_title;'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Opaque native client correlation; never exposed to extension JavaScript.\n  base::UnguessableToken client_token;\n#endif\n\n  // The print job title.\n  std::u16string job_title;"
