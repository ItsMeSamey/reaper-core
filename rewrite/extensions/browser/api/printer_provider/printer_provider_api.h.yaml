substitutions:
- description: Declare Android printer client cancellation tokens.
  regex:
    re_pattern: \#include\ "base/values\.h"
    replace: '#include "base/values.h"

      #include "build/build_config.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "base/unguessable_token.h"

      #endif'
- description: Allow Android print service teardown to release pending document bytes.
  regex:
    re_pattern: '\ \ virtual\ void\ DispatchPrintRequested\(PrinterProviderPrintJob\ job,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PrintCallback\ callback\)\ =\ 0;'
    replace: "  virtual void DispatchPrintRequested(PrinterProviderPrintJob job,\n                                      PrintCallback callback) = 0;\n\n#if BUILDFLAG(IS_ANDROID)\n  // Cancels only native retention/callbacks. The extension API does not expose\n  // an event that can stop a document already sent to a physical printer.\n  virtual void CancelPrintJob(const base::UnguessableToken& client_token) {}\n#endif"
