substitutions:
- description: Own direct Android buildflag provider
  regex:
    pattern: '#include "base/values.h"

      '
    replace: '#include "base/values.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Retain Android policy denial without offering removed enterprise report requests
  regex:
    pattern: '  // Check if it''s possible for the extension to be requested.

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Enterprise report transmission is compiled out. Policy denial still applies,\n\
      \  // and cannot become an apparently submitted approval request.\n  if (is_blocked_by_policy) {\n    return kBlockedByPolicy;\n\
      \  }\n#else\n  // Check if it's possible for the extension to be requested.\n"
  count: 1
- description: Close non-Android enterprise-request policy branch
  regex:
    pattern: '  // Check if the extension is using an unsupported manifest version.

      '
    replace: "#endif  // BUILDFLAG(IS_ANDROID)\n\n  // Check if the extension is using an unsupported manifest version.\n"
  count: 1
- description: Omit Android pending/requestable enterprise report status lookup
  regex:
    pattern: '  // If an installed extension is disabled due to policy, return kCanRequest or

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // If an installed extension is disabled due to policy, return kCanRequest or\n"
  count: 1
- description: Close omitted Android enterprise request status branch
  regex:
    pattern: '  if (registry->disabled_extensions().Contains(extension_id)) {

      '
    replace: "#endif  // !BUILDFLAG(IS_ANDROID)\n\n  if (registry->disabled_extensions().Contains(extension_id)) {\n"
  count: 1
