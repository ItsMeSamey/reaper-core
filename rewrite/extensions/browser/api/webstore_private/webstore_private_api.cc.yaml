- description: Complete unavailable Android enterprise request callback with explicit policy failure
  regex:
    pattern: "void WebstorePrivateBeginInstallWithManifest3Function::OnRequestPromptDone(\n    ExtensionInstallPromptClient::DoneCallbackPayload\
      \ payload) {\n  switch (payload.result) {\n    case ExtensionInstallPromptClient::Result::ACCEPTED:\n      AddExtensionToPendingList(details().id,\
      \ browser_context_,\n                                payload.justification);\n      break;\n    case ExtensionInstallPromptClient::Result::USER_CANCELED:\n\
      \    case ExtensionInstallPromptClient::Result::ABORTED:\n      break;\n    case ExtensionInstallPromptClient::Result::\n\
      \        ACCEPTED_WITH_WITHHELD_PERMISSIONS:\n      NOTREACHED();\n  }\n\n  Respond(BuildResponse(api::webstore_private::Result::kUserCancelled,\n\
      \                        kWebstoreUserCancelledError));\n}\n"
    replace: "void WebstorePrivateBeginInstallWithManifest3Function::OnRequestPromptDone(\n    ExtensionInstallPromptClient::DoneCallbackPayload\
      \ payload) {\n#if BUILDFLAG(IS_ANDROID)\n  // No enterprise reporting backend exists; never record or claim submission.\n\
      \  Respond(BuildResponse(api::webstore_private::Result::kBlockedByPolicy,\n                        kWebstoreBlockByPolicy));\n\
      #else\n  switch (payload.result) {\n    case ExtensionInstallPromptClient::Result::ACCEPTED:\n      AddExtensionToPendingList(details().id,\
      \ browser_context_,\n                                payload.justification);\n      break;\n    case ExtensionInstallPromptClient::Result::USER_CANCELED:\n\
      \    case ExtensionInstallPromptClient::Result::ABORTED:\n      break;\n    case ExtensionInstallPromptClient::Result::\n\
      \        ACCEPTED_WITH_WITHHELD_PERMISSIONS:\n      NOTREACHED();\n  }\n\n  Respond(BuildResponse(api::webstore_private::Result::kUserCancelled,\n\
      \                        kWebstoreUserCancelledError));\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n"
  count: 1
