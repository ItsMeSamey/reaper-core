- description: Omit Android enterprise request timestamp/justification pending-list collector
  regex:
    pattern: "ExtensionInstallStatus AddExtensionToPendingList(\n    const ExtensionId& id,\n    content::BrowserContext*\
      \ browser_context,\n    const std::string& justification) {\n  // There is no need to check whether the extension's\
      \ required permissions or\n  // manifest type are blocked  by the enterprise policy because extensions\n  // blocked\
      \ by those are still requestable.\n  ExtensionInstallStatus status =\n      GetWebstoreExtensionInstallStatus(id, browser_context);\n\
      \  // We put the |id| into the pending request list if it can be requested.\n  // Ideally we should not get here if\
      \ the status is not |kCanRequest|. However\n  // policy might be updated between the client calling |requestExtension|\
      \ or\n  // |beginInstallWithManifest3| and us checking the status here. Handle\n  // approvals and rejections for this\
      \ case by adding the |id| into the pending\n  // list. ExtensionRequestObserver will observe this update and show the\n\
      \  // notificaion immediately.\n  // Please note that only the |id| that can be requested will be uploaded to\n  //\
      \ the server and ExtensionRequestObserver will also show notifications once\n  // it's approved or rejected.\n  // |id|\
      \ will be removed from the pending list once the notification is\n  // confirmed or closed by the user.\n  if (status\
      \ != kCanRequest && status != kInstallable &&\n      status != kBlockedByPolicy && status != kForceInstalled) {\n  \
      \  return status;\n  }\n\n  PrefService* prefs = user_prefs::UserPrefs::Get(browser_context);\n  ScopedDictPrefUpdate\
      \ pending_requests_update(\n      prefs, enterprise_reporting::kCloudExtensionRequestIds);\n  DCHECK(!pending_requests_update->Find(id));\n\
      \  base::DictValue request_data;\n  request_data.Set(extension_misc::kExtensionRequestTimestamp,\n                 \
      \  ::base::TimeToValue(base::Time::Now()));\n  if (!justification.empty()) {\n    request_data.Set(extension_misc::kExtensionWorkflowJustification,\n\
      \                     justification);\n  }\n  pending_requests_update->Set(id, std::move(request_data));\n  // Query\
      \ the new extension install status again. It should be changed from\n  // |kCanRequest| to |kRequestPending| if the\
      \ id has been added into pending\n  // list successfully. Otherwise, it shouldn't be changed.\n  ExtensionInstallStatus\
      \ new_status =\n      GetWebstoreExtensionInstallStatus(id, browser_context);\n#if DCHECK_IS_ON()\n  if (status == kCanRequest)\
      \ {\n    DCHECK_EQ(kRequestPending, new_status);\n  } else {\n    DCHECK_EQ(status, new_status);\n  }\n#endif  // DCHECK_IS_ON()\n\
      \  return new_status;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nExtensionInstallStatus AddExtensionToPendingList(\n    const ExtensionId& id,\n\
      \    content::BrowserContext* browser_context,\n    const std::string& justification) {\n  // There is no need to check\
      \ whether the extension's required permissions or\n  // manifest type are blocked  by the enterprise policy because\
      \ extensions\n  // blocked by those are still requestable.\n  ExtensionInstallStatus status =\n      GetWebstoreExtensionInstallStatus(id,\
      \ browser_context);\n  // We put the |id| into the pending request list if it can be requested.\n  // Ideally we should\
      \ not get here if the status is not |kCanRequest|. However\n  // policy might be updated between the client calling\
      \ |requestExtension| or\n  // |beginInstallWithManifest3| and us checking the status here. Handle\n  // approvals and\
      \ rejections for this case by adding the |id| into the pending\n  // list. ExtensionRequestObserver will observe this\
      \ update and show the\n  // notificaion immediately.\n  // Please note that only the |id| that can be requested will\
      \ be uploaded to\n  // the server and ExtensionRequestObserver will also show notifications once\n  // it's approved\
      \ or rejected.\n  // |id| will be removed from the pending list once the notification is\n  // confirmed or closed by\
      \ the user.\n  if (status != kCanRequest && status != kInstallable &&\n      status != kBlockedByPolicy && status !=\
      \ kForceInstalled) {\n    return status;\n  }\n\n  PrefService* prefs = user_prefs::UserPrefs::Get(browser_context);\n\
      \  ScopedDictPrefUpdate pending_requests_update(\n      prefs, enterprise_reporting::kCloudExtensionRequestIds);\n \
      \ DCHECK(!pending_requests_update->Find(id));\n  base::DictValue request_data;\n  request_data.Set(extension_misc::kExtensionRequestTimestamp,\n\
      \                   ::base::TimeToValue(base::Time::Now()));\n  if (!justification.empty()) {\n    request_data.Set(extension_misc::kExtensionWorkflowJustification,\n\
      \                     justification);\n  }\n  pending_requests_update->Set(id, std::move(request_data));\n  // Query\
      \ the new extension install status again. It should be changed from\n  // |kCanRequest| to |kRequestPending| if the\
      \ id has been added into pending\n  // list successfully. Otherwise, it shouldn't be changed.\n  ExtensionInstallStatus\
      \ new_status =\n      GetWebstoreExtensionInstallStatus(id, browser_context);\n#if DCHECK_IS_ON()\n  if (status == kCanRequest)\
      \ {\n    DCHECK_EQ(kRequestPending, new_status);\n  } else {\n    DCHECK_EQ(status, new_status);\n  }\n#endif  // DCHECK_IS_ON()\n\
      \  return new_status;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
