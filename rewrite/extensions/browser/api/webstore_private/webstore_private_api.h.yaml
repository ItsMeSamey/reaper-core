substitutions:
- description: Bind Android delayed Web Store prompts to the original live active document and exercise real held-icon dispatch
  regex:
    re_pattern: '\#include\ "extensions/buildflags/buildflags\.h"\

      \#include\ "extensions/common/api/webstore_private\.h"\

      \#include\ "third_party/skia/include/core/SkBitmap\.h"\

      \

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      \#include\ "components/enterprise/browser/promotion/promotion_eligibility_checker\.h"\ \ //\ nogncheck\

      '
    replace: '#include "extensions/buildflags/buildflags.h"

      #include "extensions/common/api/webstore_private.h"

      #include "third_party/skia/include/core/SkBitmap.h"


      #if BUILDFLAG(IS_ANDROID)

      #include "content/public/browser/weak_document_ptr.h"

      #endif


      #if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/promotion/promotion_eligibility_checker.h"  // nogncheck

      '
- description: Bind Android delayed Web Store prompts to the original live active document and exercise real held-icon dispatch
  regex:
    re_pattern: '\ \ std::optional<Params>\ params_;\

      \

      \ \ raw_ptr<content::BrowserContext>\ browser_context_\ =\ nullptr;\

      \

      \ \ std::unique_ptr<ScopedActiveInstall>\ scoped_active_install_;\

      \

      '
    replace: "  std::optional<Params> params_;\n\n  raw_ptr<content::BrowserContext> browser_context_ = nullptr;\n\n#if BUILDFLAG(IS_ANDROID)\n  // The requesting document may leave the active page while icon parsing or\n  // installation policy checks are pending.\n  content::WeakDocumentPtr requesting_document_;\n#endif\n\n  std::unique_ptr<ScopedActiveInstall> scoped_active_install_;\n\n"
