    replace: "  return parsed_script;\n}\n\nvoid ScriptingUpdateContentScriptsFunction::OnContentScriptFilesValidated(\n#if BUILDFLAG(IS_ANDROID)\n    base::WeakPtr<ExtensionUserScriptLoader> validation_loader,\n    base::UnguessableToken operation,\n#endif\n    std::set<std::string> persistent_script_ids,\n    scripting::ValidateScriptsResult result) {\n  // We cannot proceed if the `browser_context` is not valid as the\n  // `ExtensionSystem` will not exist.\n  if (!browser_context()) {\n#if BUILDFLAG(IS_ANDROID)\n    if (validation_loader) {\n      validation_loader->FinishDynamicScriptOperation(operation);\n    }\n#endif\n    Release();  // Matches the `AddRef()` in `Run()`.\n    return;\n  }\n\n  // We cannot proceed if the extension is uninstalled or unloaded in the middle\n  // of validating its script files.\n  ExtensionRegistry* registry = ExtensionRegistry::Get(browser_context());\n#if BUILDFLAG(IS_ANDROID)\n  if (!validation_loader || !extension() ||\n      registry->enabled_extensions().GetByID(extension_id()) != extension()) {\n    if (validation_loader) {\n      validation_loader->FinishDynamicScriptOperation(operation);\n    }\n    Respond(Error(\n        \"The extension was unloaded before script validation finished.\"));\n    Release();  // Matches the AddRef() in Run().\n    return;\n  }\n#else\n"
