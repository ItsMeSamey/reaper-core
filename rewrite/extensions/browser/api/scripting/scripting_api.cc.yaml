nsionSystem`\\ will\\ not\\ exist\\.\\\n\\ \\ if\\ \\(!browser_context\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ Release\\(\\);\\ \\ //\\ Matches\\ the\\ `AddRef\\(\\)`\\ in\\ `Run\\(\\)`\\.\\\n\\ \\ \\ \\ return;\\\n\\ \\ \\}\\\n\\\n\\ \\ //\\ We\\ cannot\\ proceed\\ if\\ the\\ extension\\ is\\ uninstalled\\ or\\ unloaded\\ in\\ the\\ middle\\\n\\ \\ //\\ of\\ validating\\ its\\ script\\ files\\.\\\n\\ \\ ExtensionRegistry\\*\\ registry\\ =\\ ExtensionRegistry::Get\\(browser_context\\(\\)\\);\\\n\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\ \\ if\\ \\(!validation_loader\\ \\|\\|\\ !extension\\(\\)\\ \\|\\|\\\n\\ \\ \\ \\ \\ \\ registry\\->enabled_extensions\\(\\)\\.GetByID\\(extension_id\\(\\)\\)\\ !=\\ extension\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ Respond\\(Error\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \"The\\ extension\\ was\\ unloaded\\ before\\ script\\ validation\\ finished\\.\"\\)\\);\\\n\\ \\ \\ \\ Release\\(\\);\\ \\ //\\ Matches\\ the\\ AddRef\\(\\)\\ in\\ Run\\(\\)\\.\\\n\\ \\ \\ \\ return;\\\n\\ \\ \\}\\\n\\#else\\\n"
    replace: "  }\n  // The contents of `scripts` have all been std::move()'d.\n  scripts.clear();\n\n  // Add new script IDs now in case another call with the same script IDs is\n  // made immediately following this one.\n#if BUILDFLAG(IS_ANDROID)\n  const auto operation = loader->BeginDynamicScriptOperation(new_script_ids);\n#else\n  loader->AddPendingDynamicScriptIDs(std::move(new_script_ids));\n#endif\n\n  GetExtensionFileTaskRunner()->PostTaskAndReplyWithResult(\n      FROM_HERE,\n      base::BindOnce(&scripting::ValidateParsedScriptsOnFileThread,\n                     script_parsing::GetSymlinkPolicy(extension()),\n                     std::move(parsed_scripts)),\n      base::BindOnce(&ScriptingRegisterContentScriptsFunction::\n                         OnContentScriptFilesValidated,\n                     this,\n#if BUILDFLAG(IS_ANDROID)\n                     loader->GetWeakPtr(), operation,\n#endif\n                     std::move(persistent_script_ids)));\n\n  // Balanced in `OnContentScriptFilesValidated()` or\n  // `OnContentScriptsRegistered()`.\n  AddRef();\n  return RespondLater();\n}\n\nvoid ScriptingRegisterContentScriptsFunction::OnContentScriptFilesValidated(\n#if BUILDFLAG(IS_ANDROID)\n    base::WeakPtr<ExtensionUserScriptLoader> validation_loader,\n    base::UnguessableToken operation,\n#endif\n    std::set<std::string> persistent_script_ids,\n    scripting::ValidateScriptsResult result) {\n  // We cannot proceed if the `browser_context` is not valid as the\n  // `ExtensionSystem` will not exist.\n  if (!browser_context()) {\n#if BUILDFLAG(IS_ANDROID)\n    if (validation_loader) {\n      validation_loader->FinishDynamicScriptOperation(operation);\n    }\n#endif\n    Release();  // Matches the `AddRef()` in `Run()`.\n    return;\n  }\n\n  // We cannot proceed if the extension is uninstalled or unloaded in the middle\n  // of validating its script files.\n  ExtensionRegistry* registry = ExtensionRegistry::Get(browser_context());\n#if BUILDFLAG(IS_ANDROID)\n  if (!validation_loader || !extension() ||\n      registry->enabled_extensions().GetByID(extension_id()) != extension()) {\n    if (validation_loader) {\n      validation_loader->FinishDynamicScriptOperation(operation);\n    }\n    Respond(Error(\n        \"The extension was unloaded before script validation finished.\"));\n    Release();  // Matches the AddRef() in Run().\n    return;\n  }\n#else\n"
- description: "Android per-registration operation ownership225 (2)"
  regex:
    re_pattern: "\\ \\ if\\ \\(error\\.has_value\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ std::set<std::string>\\ ids_to_remove;\\\n\\ \\ \\ \\ for\\ \\(const\\ auto\\&\\ script\\ :\\ scripts\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ ids_to_remove\\.insert\\(script\\->id\\(\\)\\);\\\n\\ \\ \\ \\ \\}\\\n\\\n\\ \\ \\ \\ loader\\->RemovePendingDynamicScriptIDs\\(std::move\\(ids_to_remove\\)\\);\\\n\\ \\ \\ \\ Respond\\(Error\\(std::move\\(\\*error\\)\\)\\);\\\n\\ \\ \\ \\ Release\\(\\);\\ \\ //\\ Matches\\ the\\ `AddRef\\(\\)`\\ in\\ `Run\\(\\)`\\.\\\n\\ \\ \\ \\ return;\\\n\\ \\ \\}\\\n\\\n\\ \\ loader\\->AddDynamicScripts\\(\\\n\\ \\ \\ \\ \\ \\ std::move\\(scripts\\),\\ std::move\\(persistent_script_ids\\),\\\n\\ \\ \\ \\ \\ \\ base::BindOnce\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\&ScriptingRegisterContentScriptsFunction::OnContentScriptsRegistered,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ this\\)\\);\\\n\\}\\\n\\\n"
    replace: "  if (error.has_value()) {\n    std::set<std::string> ids_to_remove;\n    for (const auto& script : scripts) {\n      ids_to_remove.insert(script->id());\n    }\n\n#if BUILDFLAG(IS_ANDROID)\n    loader->FinishDynamicScriptOperation(operation);\n#else\n    loader->RemovePendingDynamicScriptIDs(std::move(ids_to_remove));\n#endif\n    Respond(Error(std::move(*error)));\n    Release();  // Matches the `AddRef()` in `Run()`.\n    return;\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  loader->AddOwnedDynamicScripts(operation,\n#else\n  loader->AddDynamicScripts(\n#endif\n      std::move(scripts), std::move(persistent_script_ids),\n      base::BindOnce(\n          &ScriptingRegisterContentScriptsFunction::OnContentScriptsRegistered,\n          this));\n}\n\n"
- description: "Android per-registration operation ownership225 (3)"
  regex:
    re_pattern: "\\\n\\ \\ if\\ \\(!error\\.empty\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ CHECK\\(parsed_scripts\\.empty\\(\\)\\);\\\n\\ \\ \\ \\ return\\ RespondNow\\(Error\\(std::move\\(error\\)\\)\\);\\\n\\ \\ \\}\\\n\\\n\\ \\ //\\ Add\\ new\\ script\\ IDs\\ now\\ in\\ case\\ another\\ call\\ with\\ the\\ same\\ script\\ IDs\\ is\\\n\\ \\ //\\ made\\ immediately\\ following\\ this\\ one\\.\\\n\\ \\ loader\\->AddPendingDynamicScriptIDs\\(std::move\\(ids_to_update\\)\\);\\\n\\\n\\ \\ GetExtensionFileTaskRunner\\(\\)\\->PostTaskAndReplyWithResult\\(\\\n\\ \\ \\ \\ \\ \\ FROM_HERE,\\\n\\ \\ \\ \\ \\ \\ base::BindOnce\\(\\&scripting::ValidateParsedScriptsOnFileThread,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ script_parsing::GetSymlinkPolicy\\(extension\\(\\)\\),\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ std::move\\(parsed_scripts\\)\\),\\\n\\ \\ \\ \\ \\ \\ base::BindOnce\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\&ScriptingUpdateContentScriptsFunction::OnContentScriptFilesValidated,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ this,\\\n\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ loader\\->GetWeakPtr\\(\\),\\\n\\#endif\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ std::move\\(updated_script_ids_to_persist\\)\\)\\);\\\n\\\n\\ \\ //\\ Balanced\\ in\\ `OnContentScriptFilesValidated\\(\\)`\\ or\\\n\\ \\ //\\ `OnContentScriptsRegistered\\(\\)`\\.\\\n\\ \\ AddRef\\(\\);\\\n"
    replace: "\n  if (!error.empty()) {\n    CHECK(parsed_scripts.empty());\n    return RespondNow(Error(std::move(error)));\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  // Metadata awaiting a native removal callback no longer owns a registration.\n  for (const auto& id : ids_to_update) {\n    if (!loader->IsDynamicScriptRegistrationCurrent(id)) {\n      return RespondNow(\n          Error(\"The script registration was removed before the update.\"));\n    }\n  }\n#endif\n\n  // Add new script IDs now in case another call with the same script IDs is\n  // made immediately following this one.\n#if BUILDFLAG(IS_ANDROID)\n  const auto operation = loader->BeginDynamicScriptOperation(\n      ids_to_update, /*for_update=*/true);\n#else\n  loader->AddPendingDynamicScriptIDs(std::move(ids_to_update));\n#endif\n\n  GetExtensionFileTaskRunner()->PostTaskAndReplyWithResult(\n      FROM_HERE,\n      base::BindOnce(&scripting::ValidateParsedScriptsOnFileThread,\n                     script_parsing::GetSymlinkPolicy(extension()),\n                     std::move(parsed_scripts)),\n      base::BindOnce(\n          &ScriptingUpdateContentScriptsFunction::OnContentScriptFilesValidated,\n          this,\n#if BUILDFLAG(IS_ANDROID)\n          loader->GetWeakPtr(), operation,\n#endif\n          std::move(updated_script_ids_to_persist)));\n\n  // Balanced in `OnContentScriptFilesValidated()` or\n  // `OnContentScriptsRegistered()`.\n  AddRef();\n"
