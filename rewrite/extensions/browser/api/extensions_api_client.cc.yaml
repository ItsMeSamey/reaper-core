substitutions:

  - description: "Report unavailable Android power support through a null factory."
    regex:
      pattern: "void ExtensionsAPIClient::AddAdditionalValueStoreCaches("
      replace: "#if BUILDFLAG(IS_ANDROID)\nstd::unique_ptr<AndroidPowerDelegate>\nExtensionsAPIClient::CreateAndroidPowerDelegate(\n    content::BrowserContext* context) const {\n  return nullptr;\n}\n#endif\n\nvoid ExtensionsAPIClient::AddAdditionalValueStoreCaches("
