substitutions:

  - description: "Declare Android embedder regression dependencies."
    regex:
      pattern: "#include \"base/memory/raw_ptr.h\""
      replace: "#include \"base/memory/raw_ptr.h\"\n#include \"base/memory/raw_ref.h\"\n#include \"extensions/browser/api/extensions_api_client.h\""

  - description: "Exercise Android request aggregation, rollback, unload and shutdown ownership."
    regex:
      pattern: "}  // namespace extensions\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\nnamespace {\n\nstruct AndroidPowerState {\n  bool system = false;\n  bool display = false;\n  bool reject = false;\n  bool last_transactional = false;\n  bool last_require_foreground = false;\n  int created = 0;\n  int cancelled = 0;\n  int destroyed = 0;\n};\n\nclass FakeAndroidPowerDelegate : public AndroidPowerDelegate {\n public:\n  explicit FakeAndroidPowerDelegate(AndroidPowerState& state) : state_(state) {\n    ++state_->created;\n  }\n  ~FakeAndroidPowerDelegate() override { ++state_->destroyed; }\n\n  std::optional<std::string> Apply(bool system,\n                                   bool display,\n                                   bool require_foreground_display,\n                                   bool transactional) override {\n    state_->last_transactional = transactional;\n    state_->last_require_foreground = require_foreground_display;\n    if (!transactional) {\n      state_->system &= system;\n      state_->display &= display;\n    }\n    if (state_->reject) {\n      return \"Android rejected the requested power lease.\";\n    }\n    state_->system = system;\n    state_->display = display;\n    return std::nullopt;\n  }\n\n  void Cancel() override {\n    ++state_->cancelled;\n    state_->system = false;\n    state_->display = false;\n  }\n\n private:\n  const raw_ref<AndroidPowerState> state_;\n};\n\nclass PowerTestAPIClient : public ExtensionsAPIClient {\n public:\n  explicit PowerTestAPIClient(AndroidPowerState& state) : state_(state) {}\n\n  std::unique_ptr<AndroidPowerDelegate> CreateAndroidPowerDelegate(\n      content::BrowserContext* context) const override {\n    return std::make_unique<FakeAndroidPowerDelegate>(*state_);\n  }\n\n private:\n  const raw_ref<AndroidPowerState> state_;\n};\n\n}  // namespace\n\nclass AndroidPowerAPITest : public ApiUnitTest {\n public:\n  void SetUp() override {\n    ApiUnitTest::SetUp();\n    ASSERT_EQ(nullptr, ExtensionsAPIClient::Get());\n    client_ = std::make_unique<PowerTestAPIClient>(state_);\n  }\n\n  void TearDown() override {\n    ApiUnitTest::TearDown();\n    // Keyed-service shutdown cancels leases and destroys the lifecycle owner\n    // before its browser context and this fake embedder disappear.\n    EXPECT_FALSE(state_.system);\n    EXPECT_FALSE(state_.display);\n    EXPECT_EQ(state_.created, state_.destroyed);\n    client_.reset();\n  }\n\n protected:\n  AndroidPowerState state_;\n  std::unique_ptr<PowerTestAPIClient> client_;\n};\n\nTEST_F(AndroidPowerAPITest, SeparateAggregatesAndTransactionalReplacement) {\n  auto* service = PowerAPI::Get(browser_context());\n  EXPECT_EQ(service, PowerAPI::Get(incognito_context()));\n  auto other = ExtensionBuilder(\"other\").Build();\n  EXPECT_FALSE(service->AddRequest(extension()->id(), api::power::Level::kSystem));\n  EXPECT_FALSE(service->AddRequest(other->id(), api::power::Level::kDisplay));\n  EXPECT_TRUE(state_.system);\n  EXPECT_TRUE(state_.display);\n  EXPECT_TRUE(state_.last_transactional);\n  EXPECT_TRUE(state_.last_require_foreground);\n\n  state_.reject = true;\n  EXPECT_TRUE(service->AddRequest(extension()->id(), api::power::Level::kDisplay));\n  EXPECT_EQ(api::power::Level::kSystem,\n            service->extension_levels().at(extension()->id()));\n  EXPECT_TRUE(state_.system);\n  EXPECT_TRUE(state_.display);\n\n  state_.reject = false;\n  service->RemoveRequest(other->id());\n  EXPECT_TRUE(state_.system);\n  EXPECT_FALSE(state_.display);\n  EXPECT_FALSE(state_.last_transactional);\n  EXPECT_FALSE(state_.last_require_foreground);\n}\n\nTEST_F(AndroidPowerAPITest, UnloadRevokesEvenWhenRemainingAcquisitionFails) {\n  auto* service = PowerAPI::Get(browser_context());\n  auto other = ExtensionBuilder(\"other\").Build();\n  EXPECT_FALSE(service->AddRequest(extension()->id(), api::power::Level::kSystem));\n  EXPECT_FALSE(service->AddRequest(other->id(), api::power::Level::kDisplay));\n  state_.reject = true;\n  service->OnExtensionUnloaded(browser_context(), extension(),\n                           UnloadedExtensionReason::UNINSTALL);\n  EXPECT_FALSE(service->extension_levels().contains(extension()->id()));\n  EXPECT_FALSE(state_.system);\n  EXPECT_TRUE(state_.display);\n  EXPECT_FALSE(state_.last_transactional);\n  service->RemoveRequest(other->id());\n  EXPECT_FALSE(state_.display);\n  EXPECT_GT(state_.cancelled, 0);\n}\n\nTEST_F(AndroidPowerAPITest, ApiReturnsBackendErrorWithoutPersistingRequest) {\n  state_.reject = true;\n  EXPECT_EQ(\n      \"Android rejected the requested power lease.\",\n      RunFunctionAndReturnError(\n          base::MakeRefCounted<PowerRequestKeepAwakeFunction>(), kDisplayArgs));\n  EXPECT_TRUE(PowerAPI::Get(browser_context())->extension_levels().empty());\n  EXPECT_FALSE(state_.system);\n  EXPECT_FALSE(state_.display);\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n}  // namespace extensions\n"
