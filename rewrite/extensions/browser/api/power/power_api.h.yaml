substitutions:

  - description: "Make lease acquisition failures representable."
    regex:
      pattern: "#include <memory>"
      replace: "#include <memory>\n#include <optional>"

  - description: "Use the explicit Android platform build flag."
    regex:
      pattern: "#include \"build/chromeos_buildflags.h\""
      replace: "#include \"build/build_config.h\"\n#include \"build/chromeos_buildflags.h\""

  - description: "Forward declare the Android embedder adapter."
    regex:
      pattern: "namespace extensions {"
      replace: "namespace extensions {\n\n#if BUILDFLAG(IS_ANDROID)\nclass AndroidPowerDelegate;\n#endif"

  - description: "Return Android lease failures without committing a failed request."
    regex:
      pattern: "  void AddRequest(const ExtensionId& extension_id, api::power::Level level);"
      replace: "  std::optional<std::string> AddRequest(const ExtensionId& extension_id,\n                                         api::power::Level level);"

  - description: "Propagate optional backend errors and distinguish a fresh display request."
    regex:
      pattern: "  void UpdateWakeLock();"
      replace: "  std::optional<std::string> UpdateWakeLock(\n      bool require_foreground_display = false, bool transactional = false);"

  - description: "Own Android lease and preserve existing injected wake-lock test functions."
    regex:
      pattern: "  mojo::Remote<device::mojom::WakeLock> wake_lock_;"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<AndroidPowerDelegate> android_delegate_;\n  bool use_custom_wake_lock_functions_for_testing_ = false;\n#endif\n  mojo::Remote<device::mojom::WakeLock> wake_lock_;"
