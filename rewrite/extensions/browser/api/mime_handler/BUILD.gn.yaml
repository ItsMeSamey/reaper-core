# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Require the extensions core engine
  regex:
    re_pattern: 'assert\(enable_extensions,\

      \ \ \ \ \ \ \ "Cannot\ depend\ on\ extensions\ because\ enable_extensions=false\."\)'
    replace: "assert(enable_extensions_core,\n       \"Cannot depend on extensions because enable_extensions_core=false.\")"
