substitutions:
- description: "Declare the Android build flag for the existing storage metric expectations."
  regex:
    re_pattern: "\\#include\\ \"base/test/metrics/histogram_tester\\.h\"\\\n"
    replace: "#include \"base/test/metrics/histogram_tester.h\"\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Expect no optional Android set-status samples while retaining the successful storage callback and wait."
  regex:
    re_pattern: "\\ \\ histogram_tester\\.ExpectUniqueSample\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.Database\\.Local\\.StatusCodeByOperation\\.set\",\\\n\\ \\ \\ \\ \\ \\ /\\*sample=\\*/value_store::ValueStore::StatusCode::OK,\\\n\\ \\ \\ \\ \\ \\ /\\*expected_bucket_count=\\*/1\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histogram_tester.ExpectTotalCount(\n      \"Extensions.Database.Local.StatusCodeByOperation.set\", 0);\n#else\n  histogram_tester.ExpectUniqueSample(\n      \"Extensions.Database.Local.StatusCodeByOperation.set\",\n      /*sample=*/value_store::ValueStore::StatusCode::OK,\n      /*expected_bucket_count=*/1);\n#endif\n"
  count: 1
- description: "Expect no optional Android error/status samples while preserving the existing quota-error result, input and wait."
  regex:
    re_pattern: "\\ \\ histogram_tester\\.ExpectUniqueSample\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.Database\\.Local\\.ErrorByOperation\",\\\n\\ \\ \\ \\ \\ \\ /\\*sample=\\*/StorageFrontend::ExtensionsDatabaseOperation::kSet,\\\n\\ \\ \\ \\ \\ \\ /\\*expected_bucket_count=\\*/1\\);\\\n\\ \\ histogram_tester\\.ExpectUniqueSample\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.Database\\.Local\\.StatusCodeByOperation\\.set\",\\\n\\ \\ \\ \\ \\ \\ /\\*sample=\\*/value_store::ValueStore::StatusCode::QUOTA_EXCEEDED,\\\n\\ \\ \\ \\ \\ \\ /\\*expected_bucket_count=\\*/1\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histogram_tester.ExpectTotalCount(\n      \"Extensions.Database.Local.ErrorByOperation\", 0);\n  histogram_tester.ExpectTotalCount(\n      \"Extensions.Database.Local.StatusCodeByOperation.set\", 0);\n#else\n  histogram_tester.ExpectUniqueSample(\n      \"Extensions.Database.Local.ErrorByOperation\",\n      /*sample=*/StorageFrontend::ExtensionsDatabaseOperation::kSet,\n      /*expected_bucket_count=*/1);\n  histogram_tester.ExpectUniqueSample(\n      \"Extensions.Database.Local.StatusCodeByOperation.set\",\n      /*sample=*/value_store::ValueStore::StatusCode::QUOTA_EXCEEDED,\n      /*expected_bucket_count=*/1);\n#endif\n"
  count: 1
- description: "Expect no optional Android settings observer timer sample while preserving listener registration and observer delivery."
  regex:
    re_pattern: "\\ \\ histogram_tester\\.ExpectTotalCount\\(\"Extensions\\.Storage\\.OnSettingsChangedTime\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ 1\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histogram_tester.ExpectTotalCount(\"Extensions.Storage.OnSettingsChangedTime\",\n                                    0);\n#else\n  histogram_tester.ExpectTotalCount(\"Extensions.Storage.OnSettingsChangedTime\",\n                                    1);\n#endif\n"
  count: 1
