substitutions:
- description: "Declare the Android build flag before the storage measurement guards."
  regex:
    re_pattern: "\\#include\\ \"base/trace_event/trace_event\\.h\"\\\n"
    replace: "#include \"base/trace_event/trace_event.h\"\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Exclude the storage frontend sole optional histogram/timer include on Android."
  regex:
    re_pattern: "\\#include\\ \"base/metrics/histogram_functions\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/metrics/histogram_functions.h\"\n#endif\n"
  count: 1
- description: "Exclude the complete pure local-storage status/error/restore measurement helper on Android."
  regex:
    re_pattern: "//\\ Logs\\ a\\ database\\ error\\ or\\ a\\ restore/repair\\ attempt\\ for\\ a\\ local\\ storage\\\n//\\ operation\\.\\\nvoid\\ LogLocalErrorOrRestore\\(\\\n\\ \\ \\ \\ StorageFrontend::ExtensionsDatabaseOperation\\ operation,\\\n\\ \\ \\ \\ const\\ ValueStore::Status\\&\\ status,\\\n\\ \\ \\ \\ StorageAreaNamespace\\ storage_area\\)\\ \\{\\\n\\ \\ if\\ \\(storage_area\\ !=\\ StorageAreaNamespace::kLocal\\)\\ \\{\\\n\\ \\ \\ \\ return;\\\n\\ \\ \\}\\\n\\\n\\ \\ std::string\\ operation_name;\\\n\\ \\ switch\\ \\(operation\\)\\ \\{\\\n\\ \\ \\ \\ case\\ StorageFrontend::ExtensionsDatabaseOperation::kGet:\\\n\\ \\ \\ \\ \\ \\ operation_name\\ =\\ \"get\";\\\n\\ \\ \\ \\ \\ \\ break;\\\n\\ \\ \\ \\ case\\ StorageFrontend::ExtensionsDatabaseOperation::kSet:\\\n\\ \\ \\ \\ \\ \\ operation_name\\ =\\ \"set\";\\\n\\ \\ \\ \\ \\ \\ break;\\\n\\ \\ \\ \\ case\\ StorageFrontend::ExtensionsDatabaseOperation::kRemove:\\\n\\ \\ \\ \\ \\ \\ operation_name\\ =\\ \"remove\";\\\n\\ \\ \\ \\ \\ \\ break;\\\n\\ \\ \\ \\ case\\ StorageFrontend::ExtensionsDatabaseOperation::kClear:\\\n\\ \\ \\ \\ \\ \\ operation_name\\ =\\ \"clear\";\\\n\\ \\ \\ \\ \\ \\ break;\\\n\\ \\ \\}\\\n\\\n\\ \\ base::UmaHistogramEnumeration\\(\\\n\\ \\ \\ \\ \\ \\ base::StringPrintf\\(\"Extensions\\.Database\\.Local\\.StatusCodeByOperation\\.%s\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ operation_name\\.c_str\\(\\)\\),\\\n\\ \\ \\ \\ \\ \\ status\\.code,\\ value_store::ValueStore::STATUS_CODE_MAX\\);\\\n\\\n\\ \\ if\\ \\(status\\.restore_status\\ !=\\ value_store::ValueStore::RESTORE_NONE\\)\\ \\{\\\n\\ \\ \\ \\ base::UmaHistogramEnumeration\\(\"Extensions\\.Database\\.Local\\.RestoreStatus\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ status\\.restore_status,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ value_store::ValueStore::RESTORE_STATUS_MAX\\);\\\n\\ \\ \\}\\\n\\\n\\ \\ if\\ \\(!status\\.ok\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ base::UmaHistogramEnumeration\\(\"Extensions\\.Database\\.Local\\.ErrorByOperation\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ operation\\);\\\n\\ \\ \\}\\\n\\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Logs a database error or a restore/repair attempt for a local storage\n// operation.\nvoid LogLocalErrorOrRestore(\n    StorageFrontend::ExtensionsDatabaseOperation operation,\n    const ValueStore::Status& status,\n    StorageAreaNamespace storage_area) {\n  if (storage_area != StorageAreaNamespace::kLocal) {\n    return;\n  }\n\n  std::string operation_name;\n  switch (operation) {\n    case StorageFrontend::ExtensionsDatabaseOperation::kGet:\n      operation_name = \"get\";\n      break;\n    case StorageFrontend::ExtensionsDatabaseOperation::kSet:\n      operation_name = \"set\";\n      break;\n    case StorageFrontend::ExtensionsDatabaseOperation::kRemove:\n      operation_name = \"remove\";\n      break;\n    case StorageFrontend::ExtensionsDatabaseOperation::kClear:\n      operation_name = \"clear\";\n      break;\n  }\n\n  base::UmaHistogramEnumeration(\n      base::StringPrintf(\"Extensions.Database.Local.StatusCodeByOperation.%s\",\n                         operation_name.c_str()),\n      status.code, value_store::ValueStore::STATUS_CODE_MAX);\n\n  if (status.restore_status != value_store::ValueStore::RESTORE_NONE) {\n    base::UmaHistogramEnumeration(\"Extensions.Database.Local.RestoreStatus\",\n                                  status.restore_status,\n                                  value_store::ValueStore::RESTORE_STATUS_MAX);\n  }\n\n  if (!status.ok()) {\n    base::UmaHistogramEnumeration(\"Extensions.Database.Local.ErrorByOperation\",\n                                  operation);\n  }\n}\n#endif\n"
  count: 1
- description: "Exclude both optional local-storage getKeys/get measurement callers on Android."
  regex:
    re_pattern: "\\ \\ LogLocalErrorOrRestore\\(StorageFrontend::ExtensionsDatabaseOperation::kGet,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ result\\.status\\(\\),\\ storage_area\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  LogLocalErrorOrRestore(StorageFrontend::ExtensionsDatabaseOperation::kGet,\n                         result.status(), storage_area);\n#endif\n"
  count: 2
- description: "Exclude only the optional local-storage set measurement caller on Android."
  regex:
    re_pattern: "\\ \\ LogLocalErrorOrRestore\\(StorageFrontend::ExtensionsDatabaseOperation::kSet,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ result\\.status\\(\\),\\ storage_area\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  LogLocalErrorOrRestore(StorageFrontend::ExtensionsDatabaseOperation::kSet,\n                         result.status(), storage_area);\n#endif\n"
  count: 1
- description: "Exclude only the optional local-storage remove measurement caller on Android."
  regex:
    re_pattern: "\\ \\ LogLocalErrorOrRestore\\(StorageFrontend::ExtensionsDatabaseOperation::kRemove,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ result\\.status\\(\\),\\ storage_area\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  LogLocalErrorOrRestore(StorageFrontend::ExtensionsDatabaseOperation::kRemove,\n                         result.status(), storage_area);\n#endif\n"
  count: 1
- description: "Exclude only the optional local-storage clear measurement caller on Android."
  regex:
    re_pattern: "\\ \\ LogLocalErrorOrRestore\\(StorageFrontend::ExtensionsDatabaseOperation::kClear,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ result\\.status\\(\\),\\ storage_area\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  LogLocalErrorOrRestore(StorageFrontend::ExtensionsDatabaseOperation::kClear,\n                         result.status(), storage_area);\n#endif\n"
  count: 1
- description: "Exclude the pure settings observer elapsed-time measurement work on Android."
  regex:
    re_pattern: "\\ \\ base::ScopedUmaHistogramTimer\\ timer\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.Storage\\.OnSettingsChangedTime\"\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::ScopedUmaHistogramTimer timer(\n      \"Extensions.Storage.OnSettingsChangedTime\");\n#endif\n"
  count: 1
