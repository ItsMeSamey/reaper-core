substitutions:
- description: "Declare the Android build flag before the measurement-only storage operation enum."
  regex:
    re_pattern: "\\#include\\ \"base/values\\.h\"\\\n"
    replace: "#include \"base/values.h\"\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Exclude the operation enum used only by local-storage measurement and its desktop expectations on Android."
  regex:
    re_pattern: "\\ \\ //\\ These\\ values\\ are\\ persisted\\ to\\ logs\\.\\ Entries\\ should\\ not\\ be\\ renumbered\\ and\\\n\\ \\ //\\ numeric\\ values\\ should\\ never\\ be\\ reused\\.\\\n\\ \\ enum\\ class\\ ExtensionsDatabaseOperation\\ \\{\\\n\\ \\ \\ \\ kGet\\ =\\ 0,\\\n\\ \\ \\ \\ kSet\\ =\\ 1,\\\n\\ \\ \\ \\ kRemove\\ =\\ 2,\\\n\\ \\ \\ \\ kClear\\ =\\ 3,\\\n\\ \\ \\ \\ kMaxValue\\ =\\ kClear,\\\n\\ \\ \\};\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // These values are persisted to logs. Entries should not be renumbered and\n  // numeric values should never be reused.\n  enum class ExtensionsDatabaseOperation {\n    kGet = 0,\n    kSet = 1,\n    kRemove = 2,\n    kClear = 3,\n    kMaxValue = kClear,\n  };\n#endif\n"
  count: 1
