substitutions:
- description: Bind Android re-enable consent to the displayed extension and exercise its real modal
  regex:
    re_pattern: '\}\

      \

      void\ ManagementSetEnabledFunction::CheckPermissionsIncrease\(\)\ \{\

      \ \ //\ Extension\ could\ have\ been\ uninstalled\ externally\ while\ previous\ check\ was\

      \ \ //\ happening\.\

      \ \ const\ Extension\*\ extension\ =\

      '
    replace: "}\n\nvoid ManagementSetEnabledFunction::CheckPermissionsIncrease() {\n#if BUILDFLAG(IS_ANDROID)\n  if (!browser_context()) {\n    FinishEnable(Error(keys::kUserDidNotReEnableError));\n    return;\n  }\n#endif\n\n  // Extension could have been uninstalled externally while previous check was\n  // happening.\n  const Extension* extension =\n"
- description: Bind Android re-enable consent to the displayed extension and exercise its real modal
  regex:
    re_pattern: '\ \ \ \ const\ ManagementAPIDelegate\*\ delegate\ =\ ManagementAPI::GetFactoryInstance\(\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \->Get\(browser_context\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \->GetDelegate\(\);\

      \ \ \ \ install_prompt_\ =\ delegate\->SetEnabledFunctionDelegate\(\

      \ \ \ \ \ \ \ \ GetSenderWebContents\(\),\ browser_context\(\),\ extension,\

      \ \ \ \ \ \ \ \ base::BindOnce\(\

      '
    replace: "    const ManagementAPIDelegate* delegate = ManagementAPI::GetFactoryInstance()\n                                                ->Get(browser_context())\n                                                ->GetDelegate();\n#if BUILDFLAG(IS_ANDROID)\n    // Capture before creating the delegate, which may complete synchronously.\n    permissions_prompt_extension_ = extension;\n#endif\n    install_prompt_ = delegate->SetEnabledFunctionDelegate(\n        GetSenderWebContents(), browser_context(), extension,\n        base::BindOnce(\n"
- description: Bind Android re-enable consent to the displayed extension and exercise its real modal
  regex:
    re_pattern: '\ \ \ \ FinishEnable\(Error\(keys::kUserDidNotReEnableError\)\);\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ //\ Continue\ with\ the\ enable\ extension\ flow\.\

      \ \ CheckManifestV2Deprecation\(\);\

      '
    replace: "    FinishEnable(Error(keys::kUserDidNotReEnableError));\n    return;\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  if (!browser_context() ||\n      (permissions_prompt_extension_ &&\n       ExtensionRegistry::Get(browser_context())->GetInstalledExtension(\n           extension_id_) != permissions_prompt_extension_.get())) {\n    FinishEnable(Error(keys::kUserDidNotReEnableError));\n    return;\n  }\n#endif\n\n  // Continue with the enable extension flow.\n  CheckManifestV2Deprecation();\n"
- description: Cancel Android deferred management uninstall after browser context shutdown
  regex:
    re_pattern: "void\\ ManagementUninstallFunctionBase::UninstallExtension\\(\\)\\ \\{\\\n"
    replace: "void ManagementUninstallFunctionBase::UninstallExtension() {\n#if BUILDFLAG(IS_ANDROID)\n  // The deferred callback can run after its browser context shuts down.\n  if (!browser_context()) {\n    Finish(false,\n           ErrorUtils::FormatErrorMessage(keys::kUninstallCanceledError,\n                                          target_extension_id_));\n    return;\n  }\n#endif\n\n"
- description: Cancel Android permission re-enable when requesting contents is absent
  regex:
    pattern: "    if (!user_gesture()) {\n      FinishEnable(Error(keys::kGestureNeededForEscalationError));\n      return;\n\
      \    }\n\n"
    replace: "    if (!user_gesture()) {\n      FinishEnable(Error(keys::kGestureNeededForEscalationError));\n      return;\n\
      \    }\n\n    content::WebContents* web_contents = GetSenderWebContents();\n#if BUILDFLAG(IS_ANDROID)\n    if (!web_contents)\
      \ {\n      FinishEnable(Error(keys::kUserDidNotReEnableError));\n      return;\n    }\n#endif\n\n"
  count: 1
- description: Use the captured requesting contents for the existing consent delegate
  regex:
    pattern: "    install_prompt_ = delegate->SetEnabledFunctionDelegate(\n        GetSenderWebContents(), browser_context(),\
      \ extension,\n"
    replace: "    install_prompt_ = delegate->SetEnabledFunctionDelegate(\n        web_contents, browser_context(), extension,\n"
  count: 1
