substitutions:
- description: Bind Android re-enable consent to the displayed extension and exercise its real modal
  regex:
    re_pattern: '\

      \#include\ "base/compiler_specific\.h"\

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "base/scoped_observation\.h"\

      \#include\ "components/keyed_service/core/keyed_service\.h"\

      \#include\ "extensions/browser/api/management/management_api_delegate\.h"\

      \#include\ "extensions/browser/browser_context_keyed_api_factory\.h"\

      '
    replace: '

      #include "base/compiler_specific.h"

      #include "base/memory/raw_ptr.h"

      #include "base/memory/scoped_refptr.h"

      #include "base/scoped_observation.h"

      #include "build/build_config.h"

      #include "components/keyed_service/core/keyed_service.h"

      #include "extensions/browser/api/management/management_api_delegate.h"

      #include "extensions/browser/browser_context_keyed_api_factory.h"

      '
- description: Bind Android re-enable consent to the displayed extension and exercise its real modal
  regex:
    re_pattern: '\

      \ \ //\ Extension\ to\ be\ enabled\ or\ disabled\.\

      \ \ ExtensionId\ extension_id_;\

      \

      \ \ //\ Permissions\ increase\ delegate,\ which\ uses\ an\ install\ prompt\ to\ show\ the\

      \ \ //\ dialog\ \(crbug\.com/352038135:\ permissions\ increase\ should\ have\ its\ own\

      '
    replace: "\n  // Extension to be enabled or disabled.\n  ExtensionId extension_id_;\n\n#if BUILDFLAG(IS_ANDROID)\n  // Consent applies to this exact installed instance, even while it is disabled.\n  scoped_refptr<const Extension> permissions_prompt_extension_;\n#endif\n\n  // Permissions increase delegate, which uses an install prompt to show the\n  // dialog (crbug.com/352038135: permissions increase should have its own\n"
