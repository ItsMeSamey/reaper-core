substitutions:
- description: Owned Android window/auth/options/fullscreen and fixture routing final integration (1)
  regex:
    re_pattern: '\ \ \ \ \ \ \->HasAnyExtraHeadersListener\(browser_context_\);\

      \}\

      \

      void\ WebRequestAPI::ResetURLLoaderFactories\(\)\ \{\

      \ \ browser_context_\->GetDefaultStoragePartition\(\)\->ResetURLLoaderFactories\(\);\

      \ \ if\ \(g_test_observer\)\ \{\

      \ \ \ \ g_test_observer\->OnDidResetURLLoaderFactories\(\);\

      \ \ \}\

      \}\

      '
    replace: "      ->HasAnyExtraHeadersListener(browser_context_);\n}\n\nvoid WebRequestAPI::ResetURLLoaderFactories() {\n\
      #if BUILDFLAG(IS_ANDROID)\n  // This service is shared with OTR profiles. Each existing related context\n  // owns its\
      \ own partitions and factories, including container/webview jars.\n  // Invalidation grants no extension permission\
      \ and must not create OTR\n  // profiles.\n  for (content::BrowserContext* context :\n       ExtensionsBrowserClient::Get()->GetRelatedContextsForFactoryReset(\n\
      \           browser_context_)) {\n    context->ForEachLoadedStoragePartition(\n        [](content::StoragePartition*\
      \ partition) {\n          partition->ResetURLLoaderFactories();\n        });\n  }\n#else\n  browser_context_->GetDefaultStoragePartition()->ResetURLLoaderFactories();\n\
      #endif\n  if (g_test_observer) {\n    g_test_observer->OnDidResetURLLoaderFactories();\n  }\n}\n"
