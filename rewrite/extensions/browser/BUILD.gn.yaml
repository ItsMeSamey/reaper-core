# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Build the Android extension action enums with the core.
  count: 2
  regex:
    pattern: if (enable_desktop_android_extensions) {
    replace: if (is_android && enable_extensions_core) {
- description: Initialize the generic registry with core services
  regex:
    re_pattern: '\ \ if\ \(enable_extensions\ \&\&\ !is_android\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//extensions/browser/mime_handler:mime_handler_registry"\ \]\

      \ \ \}'
    replace: '  deps += [ "//extensions/browser/mime_handler:mime_handler_registry" ]'
- description: Remove the desktop-only generic MIME test admission
  regex:
    re_pattern: '\ \ \ \ if\ \(!is_android\)\ \{\

      \ \ \ \ \ \ sources\ \+=\ \[\ "api/mime_handler/mime_handler_api_unittest\.cc"\ \]\

      \ \ \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ \ \ "//extensions/browser/api/mime_handler",\

      \ \ \ \ \ \ \ \ "//extensions/browser/mime_handler",\

      \ \ \ \ \ \ \ \ "//extensions/browser/mime_handler:stream_container",\

      \ \ \ \ \ \ \ \ "//extensions/browser/mime_handler:test_helpers",\

      \ \ \ \ \ \ \ \ "//extensions/browser/mime_handler:unit_tests",\

      \ \ \ \ \ \ \]\

      \ \ \ \ \}\

      '
    replace: ''
- description: Include portable MIME and Android fallback tests in extensions_unittests
  regex:
    re_pattern: '\ \ if\ \(enable_platform_apps\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "app_window/app_window_geometry_cache_unittest\.cc"\ \]'
    replace: "  # Generic MIME streams and their public API are supported with the core.\n  sources += [ \"api/mime_handler/mime_handler_api_unittest.cc\" ]\n  deps += [\n    \"//extensions/browser/api/mime_handler\",\n    \"//extensions/browser/mime_handler\",\n    \"//extensions/browser/mime_handler:stream_container\",\n    \"//extensions/browser/mime_handler:test_helpers\",\n    \"//extensions/browser/mime_handler:unit_tests\",\n  ]\n\n  if (enable_platform_apps) {\n    sources += [ \"app_window/app_window_geometry_cache_unittest.cc\" ]"
