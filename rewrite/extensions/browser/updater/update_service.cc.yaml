{
  "substitutions": [
    {
      "description": "Android UpdateService shutdown ownership 1",
      "regex": {
        "re_pattern": "\\#include\\ \"components/update_client/crx_update_item\\.h\"\\\n",
        "replace": "#include \"build/build_config.h\"\n#include \"components/update_client/crx_update_item.h\"\n"
      }
    },
    {
      "description": "Android UpdateService shutdown ownership 2",
      "regex": {
        "re_pattern": "void\\ UpdateService::Shutdown\\(\\)\\ \\{\\\n\\ \\ DCHECK_CALLED_ON_VALID_THREAD\\(thread_checker_\\);\\\n",
        "replace": "void UpdateService::Shutdown() {\n  DCHECK_CALLED_ON_VALID_THREAD(thread_checker_);\n#if BUILDFLAG(IS_ANDROID)\n  // Backend work may outlive this keyed-service shutdown. Retire its UI\n  // callbacks before clearing the context and releasing our client reference.\n  weak_ptr_factory_.InvalidateWeakPtrs();\n#endif\n"
      }
    },
    {
      "description": "Android UpdateService shutdown ownership 3",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ \\ \\ if\\ \\(update_found_callback\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ \\ \\ update_found_callback\\.Run\\(item\\.id,\\ item\\.next_version\\);\\\n\\ \\ \\ \\ \\ \\ \\}\\\n",
        "replace": "      if (update_found_callback) {\n#if BUILDFLAG(IS_ANDROID)\n        auto weak_this = weak_ptr_factory_.GetWeakPtr();\n#endif\n        update_found_callback.Run(item.id, item.next_version);\n#if BUILDFLAG(IS_ANDROID)\n        // The notification may retire this service or its browser context.\n        if (!weak_this) {\n          return;\n        }\n#endif\n      }\n"
      }
    },
    {
      "description": "Android UpdateService shutdown ownership 4",
      "regex": {
        "re_pattern": "void\\ UpdateService::UpdateCheckComplete\\(InProgressUpdate\\ update\\)\\ \\{\\\n\\ \\ VLOG\\(2\\)\\ <<\\ \"UpdateService::UpdateCheckComplete\";\\\n\\ \\ DCHECK_CALLED_ON_VALID_THREAD\\(thread_checker_\\);\\\n",
        "replace": "void UpdateService::UpdateCheckComplete(InProgressUpdate update) {\n  VLOG(2) << \"UpdateService::UpdateCheckComplete\";\n  DCHECK_CALLED_ON_VALID_THREAD(thread_checker_);\n#if BUILDFLAG(IS_ANDROID)\n  auto weak_this = weak_ptr_factory_.GetWeakPtr();\n#endif\n"
      }
    },
    {
      "description": "Android UpdateService shutdown ownership 5",
      "regex": {
        "re_pattern": "\\ \\ \\ \\ \\ \\ \\ \\ delayed_install_manager\\->FinishDelayedInstallationIfReady\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ extension_id,\\ /\\*install_immediately=\\*/true\\);\\\n",
        "replace": "        delayed_install_manager->FinishDelayedInstallationIfReady(\n            extension_id, /*install_immediately=*/true);\n#if BUILDFLAG(IS_ANDROID)\n        // Installing a delayed update notifies external observers. Stop before\n        // using their retired manager or delivering another completion.\n        if (!weak_this) {\n          return;\n        }\n#endif\n"
      }
    },
    {
      "description": "No Android uninstall event upload",
      "regex": {
        "pattern": "void UpdateService::SendUninstallPing(const std::string& id,\n                                      const base::Version& version,\n                                      int reason) {\n  DCHECK_CALLED_ON_VALID_THREAD(thread_checker_);\n  DCHECK(update_client_);\n\n  update_client::CrxComponent crx;\n  crx.app_id = id;\n  crx.version = version;\n  // A ScopedBrowserContextKeepAlive is bound into the callback to keep the\n  // context alive throughout the operation.\n  update_client_->SendPing(\n      crx,\n      {.event_type = update_client::protocol_request::kEventUninstall,\n       .result = update_client::protocol_request::kEventResultSuccess,\n       .error_code = 0,\n       .extra_code1 = reason},\n      base::BindOnce([](std::unique_ptr<ScopedBrowserContextKeepAlive>,\n                        update_client::Error) {},\n                     ExtensionsBrowserClient::Get()->CreateUpdaterKeepAlive(\n                         browser_context_)));\n}\n",
        "replace": "#if !BUILDFLAG(IS_ANDROID)\nvoid UpdateService::SendUninstallPing(const std::string& id,\n                                      const base::Version& version,\n                                      int reason) {\n  DCHECK_CALLED_ON_VALID_THREAD(thread_checker_);\n  DCHECK(update_client_);\n\n  update_client::CrxComponent crx;\n  crx.app_id = id;\n  crx.version = version;\n  // A ScopedBrowserContextKeepAlive is bound into the callback to keep the\n  // context alive throughout the operation.\n  update_client_->SendPing(\n      crx,\n      {.event_type = update_client::protocol_request::kEventUninstall,\n       .result = update_client::protocol_request::kEventResultSuccess,\n       .error_code = 0,\n       .extra_code1 = reason},\n      base::BindOnce([](std::unique_ptr<ScopedBrowserContextKeepAlive>,\n                        update_client::Error) {},\n                     ExtensionsBrowserClient::Get()->CreateUpdaterKeepAlive(\n                         browser_context_)));\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
      },
      "count": 1
    }
  ]
}
