      "description": "Android UpdateService shutdown ownership 2",
      "regex": {
        "re_pattern": "TEST_F\\(UpdateServiceTest,\\ UninstallPings\\)\\ \\{\\\n",
        "replace": "#if BUILDFLAG(IS_ANDROID)\nTEST_F(UpdateServiceTest, ShutdownCancelsPendingStateCallbacks) {\n  const auto extension =\n      ExtensionBuilder(\"Pending update\")\n          .SetVersion(\"1.0\")\n          .SetID(crx_file::id_util::GenerateId(\"pending-update\"))\n          .Build();\n  ASSERT_TRUE(\n      ExtensionRegistry::Get(browser_context())->AddEnabled(extension));\n\n  ExtensionUpdateCheckParams params;\n  params.update_info[extension->id()] = ExtensionUpdateData();\n  bool found_update = false;\n  bool completed = false;\n  StartUpdateCheck(true, params, found_update, completed);\n  ASSERT_EQ(1, update_client()->num_update_requests());\n  const auto& state_callback =\n      update_client()->update_request(0).state_change_callback;\n  ASSERT_FALSE(state_callback.is_null());\n  ASSERT_FALSE(state_callback.IsCancelled());\n\n  update_service()->Shutdown();\n\n  // Inspect cancellation without invoking any retired callback.\n  EXPECT_TRUE(state_callback.IsCancelled());\n  EXPECT_FALSE(found_update);\n  EXPECT_FALSE(completed);\n  update_service()->Shutdown();\n  EXPECT_TRUE(state_callback.IsCancelled());\n}\n#endif\n\nTEST_F(UpdateServiceTest, UninstallPings) {\n"
      }
