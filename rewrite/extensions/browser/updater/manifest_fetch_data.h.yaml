substitutions:
- description: Declare Android build configuration directly.
  regex:
    pattern: '#include "base/version.h"

      '
    replace: '#include "base/version.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude sent-ping cache from Android objects.
  regex:
    pattern: '  std::map<std::string, DownloadPingData> pings_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::map<std::string, DownloadPingData> pings_;\n#endif\n"
  count: 1
- description: Exclude optional brand state on Android.
  regex:
    pattern: '  const std::string brand_code_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const std::string brand_code_;\n#endif\n"
  count: 1
- description: Exclude optional mode state on Android.
  regex:
    pattern: '  const PingMode ping_mode_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const PingMode ping_mode_;\n#endif\n"
  count: 1
