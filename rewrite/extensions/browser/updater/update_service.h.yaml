substitutions:
- description: No Android uninstall event API
  regex:
    pattern: "  virtual void SendUninstallPing(const std::string& id,\n                                 const base::Version&\
      \ version,\n                                 int reason);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  virtual void SendUninstallPing(const std::string& id,\n                      \
      \           const base::Version& version,\n                                 int reason);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Use Android compile-time guards explicitly
  regex:
    pattern: '#include "base/functional/callback.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/functional/callback.h"

      '
  count: 1
