substitutions:
- description: Declare Android build configuration directly.
  regex:
    pattern: '#include "base/version.h"

      '
    replace: '#include "base/version.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Retain shared set_brand_code API without Android optional data.
  regex:
    pattern: "  void set_brand_code(const std::string& brand_code) {\n    brand_code_ = brand_code;\n  }\n"
    replace: "  void set_brand_code(const std::string& brand_code) {\n#if !BUILDFLAG(IS_ANDROID)\n    brand_code_ = brand_code;\n\
      #else\n    (void)brand_code;\n#endif\n  }\n"
  count: 1
- description: Retain shared set_ping_enabled_domain API without Android optional data.
  regex:
    pattern: "  void set_ping_enabled_domain(const std::string& domain) {\n    ping_enabled_domain_ = domain;\n  }\n"
    replace: "  void set_ping_enabled_domain(const std::string& domain) {\n#if !BUILDFLAG(IS_ANDROID)\n    ping_enabled_domain_\
      \ = domain;\n#else\n    (void)domain;\n#endif\n  }\n"
  count: 1
- description: Exclude Android brand_code_ storage.
  regex:
    pattern: '  std::string brand_code_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::string brand_code_;\n#endif\n"
  count: 1
- description: Exclude Android ping_enabled_domain_ storage.
  regex:
    pattern: '  std::string ping_enabled_domain_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::string ping_enabled_domain_;\n#endif\n"
  count: 1
- description: Exclude optional response ping map on Android.
  regex:
    pattern: '  std::map<ExtensionId, ExtensionDownloaderDelegate::PingResult> ping_results_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::map<ExtensionId, ExtensionDownloaderDelegate::PingResult> ping_results_;\n\
      #endif\n"
  count: 1
