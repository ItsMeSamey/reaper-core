substitutions:
- description: Compile Android profile activity/rollcall collection out.
  regex:
    pattern: "  DownloadPingData ping_data;\n  DownloadPingData* optional_ping_data = nullptr;\n  if (delegate_->GetPingDataForExtension(task.id,\
      \ &ping_data))\n    optional_ping_data = &ping_data;\n"
    replace: "  DownloadPingData* optional_ping_data = nullptr;\n#if !BUILDFLAG(IS_ANDROID)\n  DownloadPingData ping_data;\n\
      \  if (delegate_->GetPingDataForExtension(task.id, &ping_data))\n    optional_ping_data = &ping_data;\n#endif\n"
  count: 1
- description: Exclude Android server ping-day response bookkeeping.
  regex:
    pattern: "  // If the manifest response included a <daystart> element, we want to save\n  // that value for any extensions\
      \ which had sent a ping in the request.\n  if (fetch_data->base_url().DomainIs(kGoogleDotCom) &&\n      results->daystart_elapsed_seconds\
      \ >= 0) {\n    Time day_start =\n        Time::Now() - base::Seconds(results->daystart_elapsed_seconds);\n\n    for\
      \ (const ExtensionId& id : extension_ids) {\n      ExtensionDownloaderDelegate::PingResult& result = ping_results_[id];\n\
      \      result.did_ping = fetch_data->DidPing(id, ManifestFetchData::ROLLCALL);\n      result.day_start = day_start;\n\
      \    }\n  }\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // If the manifest response included a <daystart> element, we want to save\n \
      \ // that value for any extensions which had sent a ping in the request.\n  if (fetch_data->base_url().DomainIs(kGoogleDotCom)\
      \ &&\n      results->daystart_elapsed_seconds >= 0) {\n    Time day_start =\n        Time::Now() - base::Seconds(results->daystart_elapsed_seconds);\n\
      \n    for (const ExtensionId& id : extension_ids) {\n      ExtensionDownloaderDelegate::PingResult& result = ping_results_[id];\n\
      \      result.did_ping = fetch_data->DidPing(id, ManifestFetchData::ROLLCALL);\n      result.day_start = day_start;\n\
      \    }\n  }\n\n#endif\n"
  count: 1
- description: Preserve completion callback with default no-ping Android metadata.
  regex:
    pattern: "  delegate_->OnExtensionDownloadFinished(\n      crx_info, file_ownership_passed, url, ping_results_[id], request_ids,\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  const ExtensionDownloaderDelegate::PingResult ping;\n#else\n  const auto& ping\
      \ = ping_results_[id];\n#endif\n  delegate_->OnExtensionDownloadFinished(\n      crx_info, file_ownership_passed, url,\
      \ ping, request_ids,\n"
  count: 1
- description: Exclude optional cache erasure.
  regex:
    pattern: "  if (!from_cache)\n    ping_results_.erase(id);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (!from_cache)\n    ping_results_.erase(id);\n#endif\n"
  count: 1
- description: Exclude optional cache-install erasure.
  regex:
    pattern: '  ping_results_.erase(fetch_data->id);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  ping_results_.erase(fetch_data->id);\n#endif\n"
  count: 1
- description: Preserve failure callback without Android ping map.
  regex:
    pattern: '    const ExtensionDownloaderDelegate::PingResult& ping = ping_results_[id];

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n    const ExtensionDownloaderDelegate::PingResult ping;\n#else\n    const ExtensionDownloaderDelegate::PingResult&\
      \ ping = ping_results_[id];\n#endif\n"
  count: 1
- description: Exclude optional failure erasure.
  regex:
    pattern: "    ping_results_.erase(id);\n    if (extensions_queue_.active_request())"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    ping_results_.erase(id);\n#endif\n    if (extensions_queue_.active_request())"
  count: 1
- description: Preserve it failure delivery without Android optional cache.
  regex:
    pattern: "    auto ping_iter = ping_results_.find(it);\n    delegate_->OnExtensionDownloadFailed(\n        it, error,\n\
      \        ping_iter == ping_results_.end()\n            ? ExtensionDownloaderDelegate::PingResult()\n            : ping_iter->second,\n\
      \        request_ids, data);\n    ping_results_.erase(it);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n    delegate_->OnExtensionDownloadFailed(\n        it, error, ExtensionDownloaderDelegate::PingResult(),\
      \ request_ids, data);\n#else\n    auto ping_iter = ping_results_.find(it);\n    delegate_->OnExtensionDownloadFailed(\n\
      \        it, error,\n        ping_iter == ping_results_.end()\n            ? ExtensionDownloaderDelegate::PingResult()\n\
      \            : ping_iter->second,\n        request_ids, data);\n    ping_results_.erase(it);\n#endif\n"
  count: 1
- description: Preserve extension_id failure delivery without Android optional cache.
  regex:
    pattern: "    auto ping_iter = ping_results_.find(extension_id);\n    delegate_->OnExtensionDownloadFailed(\n        extension_id,\
      \ error,\n        ping_iter == ping_results_.end()\n            ? ExtensionDownloaderDelegate::PingResult()\n      \
      \      : ping_iter->second,\n        request_ids, data);\n    ping_results_.erase(extension_id);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n    delegate_->OnExtensionDownloadFailed(\n        extension_id, error, ExtensionDownloaderDelegate::PingResult(),\
      \ request_ids, data);\n#else\n    auto ping_iter = ping_results_.find(extension_id);\n    delegate_->OnExtensionDownloadFailed(\n\
      \        extension_id, error,\n        ping_iter == ping_results_.end()\n            ? ExtensionDownloaderDelegate::PingResult()\n\
      \            : ping_iter->second,\n        request_ids, data);\n    ping_results_.erase(extension_id);\n#endif\n"
  count: 1
- description: Build Android fetches without optional brand/domain state.
  regex:
    pattern: "ManifestFetchData* ExtensionDownloader::CreateManifestFetchData(\n    const GURL& update_url,\n    int request_id,\n\
      \    DownloadFetchPriority fetch_priority) {\n  ManifestFetchData::PingMode ping_mode = ManifestFetchData::NO_PING;\n\
      \  if (update_url.DomainIs(ping_enabled_domain_.c_str()))\n    ping_mode = ManifestFetchData::PING_WITH_ENABLED_STATE;\n\
      \  return new ManifestFetchData(update_url, request_id, brand_code_,\n                               manifest_query_params_,\
      \ ping_mode,\n                               fetch_priority);\n}\n"
    replace: "ManifestFetchData* ExtensionDownloader::CreateManifestFetchData(\n    const GURL& update_url,\n    int request_id,\n\
      \    DownloadFetchPriority fetch_priority) {\n#if BUILDFLAG(IS_ANDROID)\n  return new ManifestFetchData(update_url,\
      \ request_id, std::string(),\n                               manifest_query_params_, ManifestFetchData::NO_PING,\n \
      \                              fetch_priority);\n#else\n  ManifestFetchData::PingMode ping_mode = ManifestFetchData::NO_PING;\n\
      \  if (update_url.DomainIs(ping_enabled_domain_.c_str()))\n    ping_mode = ManifestFetchData::PING_WITH_ENABLED_STATE;\n\
      \  return new ManifestFetchData(update_url, request_id, brand_code_,\n                               manifest_query_params_,\
      \ ping_mode,\n                               fetch_priority);\n#endif\n}\n"
  count: 1
