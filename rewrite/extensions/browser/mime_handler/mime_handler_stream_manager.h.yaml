# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Store a navigation identifier for Android fallback
  regex:
    re_pattern: \#include\ <map>
    replace: '#include <cstdint>

      #include <map>'
- description: Scope Android fallback lifecycle helpers
  regex:
    re_pattern: \#include\ "base/containers/flat_map\.h"
    replace: '#include "base/containers/flat_map.h"

      #include "build/build_config.h"'
- description: Bind native fallback to the single reload that initiated it
  regex:
    re_pattern: '\ \ struct\ PendingNativeFallback\ \{\

      \ \ \ \ GURL\ original_url;\

      \ \ \ \ CachedFallbackBody\ body;\

      \ \ \};'
    replace: "  struct PendingNativeFallback {\n    GURL original_url;\n    CachedFallbackBody body;\n    int64_t navigation_id = 0;\n    content::GlobalRenderFrameHostId embedder_id{};\n    int32_t stream_instance_id = 0;\n  };"
- description: Expose the navigation-scoped Android fallback decision
  regex:
    re_pattern: \ \ //\ Returns\ whether\ there's\ an\ unclaimed\ stream\ info
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Whether this frame's active reload is handing its response back to Android.\n  // Redirects in that reload must also bypass extension interception.\n  bool ShouldBypassForNativeFallback(content::FrameTreeNodeId frame_id) const;\n#endif\n\n  // Returns whether there's an unclaimed stream info"
- description: Retire a handler after download fallback without touching a new document
  regex:
    re_pattern: \ \ //\ Destroys\ `iter`'s\ frame\ container
    replace: "#if BUILDFLAG(IS_ANDROID)\n  void FinishAndroidNativeFallback(content::GlobalRenderFrameHostId embedder_id,\n                                   int32_t stream_instance_id);\n#endif\n\n  // Destroys `iter`'s frame container"
- description: Format the modified MIME implementation with Chromium style
  regex:
    re_pattern: '\#include\ <memory>\

      \#include\ <optional>\

      \

      \#include\ "base/containers/flat_map\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "base/scoped_observation\.h"\

      \#include\ "content/public/browser/web_contents_observer\.h"\

      \#include\ "content/public/browser/web_contents_user_data\.h"\

      \#include\ "extensions/browser/extension_registry_observer\.h"\

      \#include\ "extensions/browser/mime_handler/stream_info\.h"\

      '
    replace: '#include <memory>

      #include <optional>


      #include "base/containers/flat_map.h"

      #include "base/memory/weak_ptr.h"

      #include "base/scoped_observation.h"

      #include "build/build_config.h"

      #include "content/public/browser/web_contents_observer.h"

      #include "content/public/browser/web_contents_user_data.h"

      #include "extensions/browser/extension_registry_observer.h"

      #include "extensions/browser/mime_handler/stream_info.h"

      '
