- description: Format the modified MIME implementation with Chromium style
  regex:
    re_pattern: 'TEST_F\(MimeHandlerStreamManagerTest,\ AndroidFallbackRedirectAndCancellation\)\ \{\

      \ \ auto\*\ embedder\ =\ NavigateAndCommit\(main_rfh\(\),\ GURL\(kOriginalUrl1\)\);\

      \ \ SetUpSimpleStream\(embedder,\ 1,\ false\);\

      \ \ auto\*\ manager\ =\ mime_handler_stream_manager\(\);\

      \ \ manager\->GetClaimedStreamInfoForTesting\(embedder\)\->SetDidExtensionFinishNavigation\(\);\

      \ \ const\ auto\ frame_id\ =\ embedder\->GetFrameTreeNodeId\(\);\

      \ \ manager\->AbortAndFallbackToNativeHandler\(embedder\);\

      \ \ EXPECT_TRUE\(manager\->ShouldBypassForNativeFallback\(frame_id\)\);\

      \ \ EXPECT_FALSE\(manager\->ShouldBypassForNativeFallback\(content::FrameTreeNodeId\(\)\)\);\

      \

      \ \ NiceMock<content::MockNavigationHandle>\ same_document\(GURL\(kOriginalUrl1\),\ embedder\);\

      \ \ same_document\.set_is_same_document\(true\);\

      \ \ manager\->DidStartNavigation\(\&same_document\);\

      \ \ manager\->DidFinishNavigation\(\&same_document\);\

      \ \ EXPECT_TRUE\(manager\->ShouldBypassForNativeFallback\(frame_id\)\);\

      '
    replace: "TEST_F(MimeHandlerStreamManagerTest, AndroidFallbackRedirectAndCancellation) {\n  auto* embedder = NavigateAndCommit(main_rfh(), GURL(kOriginalUrl1));\n  SetUpSimpleStream(embedder, 1, false);\n  auto* manager = mime_handler_stream_manager();\n  manager->GetClaimedStreamInfoForTesting(embedder)\n      ->SetDidExtensionFinishNavigation();\n  const auto frame_id = embedder->GetFrameTreeNodeId();\n  manager->AbortAndFallbackToNativeHandler(embedder);\n  EXPECT_TRUE(manager->ShouldBypassForNativeFallback(frame_id));\n  EXPECT_FALSE(\n      manager->ShouldBypassForNativeFallback(content::FrameTreeNodeId()));\n\n  NiceMock<content::MockNavigationHandle> same_document(GURL(kOriginalUrl1),\n                                                        embedder);\n  same_document.set_is_same_document(true);\n  manager->DidStartNavigation(&same_document);\n  manager->DidFinishNavigation(&same_document);\n  EXPECT_TRUE(manager->ShouldBypassForNativeFallback(frame_id));\n"
- description: Format the modified MIME implementation with Chromium style
  regex:
    re_pattern: '\ \ auto\ navigation\ =\ content::NavigationSimulator::CreateFromPending\(\

      \ \ \ \ \ \ web_contents\(\)\->GetController\(\)\);\

      \ \ navigation\->Redirect\(GURL\(kOriginalUrl2\)\);\

      \ \ EXPECT_TRUE\(manager\->ShouldBypassForNativeFallback\(frame_id\)\);\

      \ \ //\ Redirected\ responses\ are\ re\-fetched,\ never\ served\ from\ a\ different\ URL''s\ cache\.\

      \ \ EXPECT_FALSE\(manager\->TakeCachedFallbackBody\(frame_id,\ GURL\(kOriginalUrl2\)\)\);\

      \ \ navigation\->Fail\(net::ERR_ABORTED\);\

      \ \ task_environment\(\)\->RunUntilIdle\(\);\

      \ \ EXPECT_FALSE\(mime_handler_stream_manager\(\)\);\

      \}\

      \

      TEST_F\(MimeHandlerStreamManagerTest,\ AndroidFallbackDoesNotClaimLaterNavigation\)\ \{\

      \ \ auto\*\ embedder\ =\ NavigateAndCommit\(main_rfh\(\),\ GURL\(kOriginalUrl1\)\);\

      \ \ SetUpSimpleStream\(embedder,\ 1,\ false\);\

      \ \ auto\*\ manager\ =\ mime_handler_stream_manager\(\);\

      \ \ manager\->GetClaimedStreamInfoForTesting\(embedder\)\->SetDidExtensionFinishNavigation\(\);\

      \ \ const\ auto\ frame_id\ =\ embedder\->GetFrameTreeNodeId\(\);\

      \ \ manager\->AbortAndFallbackToNativeHandler\(embedder\);\

      \ \ ASSERT_TRUE\(manager\->ShouldBypassForNativeFallback\(frame_id\)\);\

      \ \ NiceMock<content::MockNavigationHandle>\ later\(GURL\(kOriginalUrl2\),\ embedder\);\

      '
    replace: "  auto navigation = content::NavigationSimulator::CreateFromPending(\n      web_contents()->GetController());\n  navigation->Redirect(GURL(kOriginalUrl2));\n  EXPECT_TRUE(manager->ShouldBypassForNativeFallback(frame_id));\n  // Redirected responses are re-fetched, never served from a different URL's\n  // cache.\n  EXPECT_FALSE(manager->TakeCachedFallbackBody(frame_id, GURL(kOriginalUrl2)));\n  navigation->Fail(net::ERR_ABORTED);\n  task_environment()->RunUntilIdle();\n  EXPECT_FALSE(mime_handler_stream_manager());\n}\n\nTEST_F(MimeHandlerStreamManagerTest,\n       AndroidFallbackDoesNotClaimLaterNavigation) {\n  auto* embedder = NavigateAndCommit(main_rfh(), GURL(kOriginalUrl1));\n  SetUpSimpleStream(embedder, 1, false);\n  auto* manager = mime_handler_stream_manager();\n  manager->GetClaimedStreamInfoForTesting(embedder)\n      ->SetDidExtensionFinishNavigation();\n  const auto frame_id = embedder->GetFrameTreeNodeId();\n  manager->AbortAndFallbackToNativeHandler(embedder);\n  ASSERT_TRUE(manager->ShouldBypassForNativeFallback(frame_id));\n  NiceMock<content::MockNavigationHandle> later(GURL(kOriginalUrl2), embedder);\n"
