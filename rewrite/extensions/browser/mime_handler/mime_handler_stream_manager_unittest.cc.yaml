# Android generic MIME extension handling; legacy plugin and PDF flags stay disabled.
substitutions:
- description: Use Android fallback regression fixtures
  regex:
    re_pattern: \#include\ "base/test/run_until\.h"
    replace: '#include "base/test/run_until.h"

      #include "build/build_config.h"

      #include "net/base/net_errors.h"'
- description: Finish the actual Android reload in the existing fallback mark regression
  regex:
    re_pattern: '\ \ NiceMock<content::MockNavigationHandle>\ finish_handle\(web_contents\(\)\);\

      \ \ finish_handle\.set_render_frame_host\(embedder_host\);\

      \ \ manager\->DidFinishNavigation\(\&finish_handle\);'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  auto finish = content::NavigationSimulator::CreateFromPending(\n      web_contents()->GetController());\n  finish->Fail(net::ERR_ABORTED);\n#else\n  NiceMock<content::MockNavigationHandle> finish_handle(web_contents());\n  finish_handle.set_render_frame_host(embedder_host);\n  manager->DidFinishNavigation(&finish_handle);\n#endif"
- description: Exercise redirected and canceled native fallback without intercepting later navigations
  regex:
    re_pattern: \}\ \ //\ namespace\ extensions::mime_handler
    replace: "#if BUILDFLAG(IS_ANDROID)\nTEST_F(MimeHandlerStreamManagerTest, AndroidFallbackRedirectAndCancellation) {\n  auto* embedder = NavigateAndCommit(main_rfh(), GURL(kOriginalUrl1));\n  SetUpSimpleStream(embedder, 1, false);\n  auto* manager = mime_handler_stream_manager();\n  manager->GetClaimedStreamInfoForTesting(embedder)->SetDidExtensionFinishNavigation();\n  const auto frame_id = embedder->GetFrameTreeNodeId();\n  manager->AbortAndFallbackToNativeHandler(embedder);\n  EXPECT_TRUE(manager->ShouldBypassForNativeFallback(frame_id));\n  EXPECT_FALSE(manager->ShouldBypassForNativeFallback(content::FrameTreeNodeId()));\n\n  NiceMock<content::MockNavigationHandle> same_document(GURL(kOriginalUrl1), embedder);\n  same_document.set_is_same_document(true);\n  manager->DidStartNavigation(&same_document);\n  manager->DidFinishNavigation(&same_document);\n  EXPECT_TRUE(manager->ShouldBypassForNativeFallback(frame_id));\n\n  // A stale completion in the same frame must not consume this reload's mark.\n  NiceMock<content::MockNavigationHandle> stale(GURL(kOriginalUrl1), embedder);\n  manager->DidFinishNavigation(&stale);\n  EXPECT_TRUE(manager->ShouldBypassForNativeFallback(frame_id));\n\n  auto navigation = content::NavigationSimulator::CreateFromPending(\n      web_contents()->GetController());\n  navigation->Redirect(GURL(kOriginalUrl2));\n  EXPECT_TRUE(manager->ShouldBypassForNativeFallback(frame_id));\n  // Redirected responses are re-fetched, never served from a different URL's cache.\n  EXPECT_FALSE(manager->TakeCachedFallbackBody(frame_id, GURL(kOriginalUrl2)));\n  navigation->Fail(net::ERR_ABORTED);\n  task_environment()->RunUntilIdle();\n  EXPECT_FALSE(mime_handler_stream_manager());\n}\n\nTEST_F(MimeHandlerStreamManagerTest, AndroidFallbackDoesNotClaimLaterNavigation) {\n  auto* embedder = NavigateAndCommit(main_rfh(), GURL(kOriginalUrl1));\n  SetUpSimpleStream(embedder, 1, false);\n  auto* manager = mime_handler_stream_manager();\n  manager->GetClaimedStreamInfoForTesting(embedder)->SetDidExtensionFinishNavigation();\n  const auto frame_id = embedder->GetFrameTreeNodeId();\n  manager->AbortAndFallbackToNativeHandler(embedder);\n  ASSERT_TRUE(manager->ShouldBypassForNativeFallback(frame_id));\n  NiceMock<content::MockNavigationHandle> later(GURL(kOriginalUrl2), embedder);\n  manager->DidStartNavigation(&later);\n  EXPECT_FALSE(manager->ShouldBypassForNativeFallback(frame_id));\n  EXPECT_TRUE(manager->GetStreamContainer(embedder));\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace extensions::mime_handler"
