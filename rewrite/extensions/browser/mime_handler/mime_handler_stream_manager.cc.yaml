  regex:
    re_pattern: '\ \ \ \ \ \ navigation_handle\->GetFrameTreeNodeId\(\)\);\

      \ \ if\ \(!navigation_handle\->IsSameDocument\(\)\ \&\&\

      \ \ \ \ \ \ fallback\ !=\ pending_native_fallback_frames_\.end\(\)\)\ \{\

      \ \ \ \ if\ \(fallback\->second\.navigation_id\ ==\ 0\ \&\&\

      \ \ \ \ \ \ \ \ navigation_handle\->GetURL\(\)\.EqualsIgnoringRef\(fallback\->second\.original_url\)\)\ \{\

      \ \ \ \ \ \ fallback\->second\.navigation_id\ =\ navigation_handle\->GetNavigationId\(\);\

      \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ //\ A\ subsequent\ navigation\ is\ independent\ of\ this\ abort\ request\.\ Never\

      \ \ \ \ \ \ //\ suppress\ a\ handler\ chosen\ for\ a\ later\ user\ navigation\ in\ the\ same\ frame\.\

      \ \ \ \ \ \ pending_native_fallback_frames_\.erase\(fallback\);\

      \ \ \ \ \}\

      \ \ \}\

      \#endif\

      '
    replace: "      navigation_handle->GetFrameTreeNodeId());\n  if (!navigation_handle->IsSameDocument() &&\n      fallback != pending_native_fallback_frames_.end()) {\n    if (fallback->second.navigation_id == 0 &&\n        navigation_handle->GetURL().EqualsIgnoringRef(\n            fallback->second.original_url)) {\n      fallback->second.navigation_id = navigation_handle->GetNavigationId();\n    } else {\n      // A subsequent navigation is independent of this abort request. Never\n      // suppress a handler chosen for a later user navigation in the same\n      // frame.\n      pending_native_fallback_frames_.erase(fallback);\n    }\n  }\n#endif\n"
