      \ \ \ \ return;\

      \ \ \}\

      \ \ auto\*\ stream\ =\ GetClaimedStreamInfo\(embedder\);\

      \ \ if\ \(!stream\ \|\|\ stream\->instance_id\(\)\ !=\ stream_instance_id\)\ \{\

      '
    replace: "void MimeHandlerStreamManager::FinishAndroidNativeFallback(\n    content::GlobalRenderFrameHostId embedder_id,\n    int32_t stream_instance_id) {\n  auto* embedder = content::RenderFrameHost::FromID(embedder_id);\n  if (!embedder ||\n      content::WebContents::FromRenderFrameHost(embedder) != web_contents()) {\n    return;\n  }\n  auto* stream = GetClaimedStreamInfo(embedder);\n  if (!stream || stream->instance_id() != stream_instance_id) {\n"
- description: Format the modified MIME implementation with Chromium style
  regex:
    re_pattern: '\ \ if\ \(extension_frame\ \&\&\ extension_frame\->GetParent\(\)\ ==\ embedder\ \&\&\

      \ \ \ \ \ \ IsExtensionHost\(extension_frame\)\)\ \{\

      \ \ \ \ //\ This\ lookup\ is\ checked\ against\ both\ the\ surviving\ RFH\ and\ stream\

      \ \ \ \ //\ identity;\ it\ cannot\ navigate\ another\ frame\ after\ a\ cross\-process\ swap\.\

      \ \ \ \ content::NavigationController::LoadURLParams\ params\{GURL\(url::kAboutBlankURL\)\};\

      \ \ \ \ params\.frame_tree_node_id\ =\ extension_frame\->GetFrameTreeNodeId\(\);\

      \ \ \ \ params\.should_replace_current_entry\ =\ true;\

      \ \ \ \ auto\ weak_this\ =\ weak_factory_\.GetWeakPtr\(\);\

      \ \ \ \ web_contents\(\)\->GetController\(\)\.LoadURLWithParams\(params\);\

      '
    replace: "  if (extension_frame && extension_frame->GetParent() == embedder &&\n      IsExtensionHost(extension_frame)) {\n    // This lookup is checked against both the surviving RFH and stream\n    // identity; it cannot navigate another frame after a cross-process swap.\n    content::NavigationController::LoadURLParams params{\n        GURL(url::kAboutBlankURL)};\n    params.frame_tree_node_id = extension_frame->GetFrameTreeNodeId();\n    params.should_replace_current_entry = true;\n    auto weak_this = weak_factory_.GetWeakPtr();\n    web_contents()->GetController().LoadURLWithParams(params);\n"
