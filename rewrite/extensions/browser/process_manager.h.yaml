substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\#include\ "base/observer_list\.h"\

      \#include\ "base/scoped_multi_source_observation\.h"\

      \#include\ "base/uuid\.h"\

      \#include\ "components/keyed_service/core/keyed_service\.h"\

      \#include\ "content/public/browser/devtools_agent_host_observer\.h"\

      \#include\ "content/public/browser/render_process_host_observer\.h"\

      '
    replace: '#include "base/observer_list.h"

      #include "base/scoped_multi_source_observation.h"

      #include "base/uuid.h"

      #include "build/build_config.h"

      #include "components/keyed_service/core/keyed_service.h"

      #include "content/public/browser/devtools_agent_host_observer.h"

      #include "content/public/browser/render_process_host_observer.h"

      '
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\#include\ "extensions/browser/service_worker/worker_id\.h"\

      \#include\ "extensions/browser/service_worker/worker_id_set\.h"\

      \#include\ "extensions/common/extension_id\.h"\

      \

      class\ GURL;\

      \

      '
    replace: '#include "extensions/browser/service_worker/worker_id.h"

      #include "extensions/browser/service_worker/worker_id_set.h"

      #include "extensions/common/extension_id.h"


      #if BUILDFLAG(IS_ANDROID)

      #include <optional>

      #endif


      class GURL;


      '
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ //\ `worker_id`\.\

      \ \ bool\ HasServiceWorker\(const\ WorkerId\&\ worker_id\)\ const;\

      \

      \ \ //\ Returns\ all\ the\ Service\ Worker\ infos\ that\ is\ active\ for\ the\ extension\ with\

      \ \ //\ `extension_id`\.\

      \ \ std::vector<WorkerId>\ GetServiceWorkersForExtension\(\

      '
    replace: "  // `worker_id`.\n  bool HasServiceWorker(const WorkerId& worker_id) const;\n\n#if BUILDFLAG(IS_ANDROID)\n  // Returns the tracked full identity matching `worker_id`. A supplied start\n  // token must match; a tokenless caller can capture the current token once.\n  std::optional<WorkerId> GetServiceWorkerRunningInstance(\n      const WorkerId& worker_id) const;\n#endif\n\n  // Returns all the Service Worker infos that is active for the extension with\n  // `extension_id`.\n  std::vector<WorkerId> GetServiceWorkersForExtension(\n"
