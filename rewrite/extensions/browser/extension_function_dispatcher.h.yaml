substitutions:
- description: Balance Android page-capture response ownership (1).
  regex:
    re_pattern: '\#define\ EXTENSIONS_BROWSER_EXTENSION_FUNCTION_DISPATCHER_H_\

      \

      \#include\ <map>\

      \#include\ <set>\

      \#include\ <string>\

      \#include\ <vector>\

      \

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "base/values\.h"\

      \#include\ "extensions/browser/extension_function\.h"\

      \#include\ "extensions/common/features/feature\.h"\

      \#include\ "extensions/common/mojom/context_type\.mojom\-forward\.h"\

      '
    replace: '#define EXTENSIONS_BROWSER_EXTENSION_FUNCTION_DISPATCHER_H_


      #include <map>

      #include <memory>

      #include <set>

      #include <string>

      #include <vector>


      #include "base/memory/raw_ptr.h"

      #include "base/memory/weak_ptr.h"

      #include "base/uuid.h"

      #include "base/values.h"

      #include "build/build_config.h"

      #include "extensions/browser/extension_function.h"

      #include "extensions/common/features/feature.h"

      #include "extensions/common/mojom/context_type.mojom-forward.h"

      '
- description: Balance Android page-capture response ownership (2).
  regex:
    re_pattern: '\ \ //\ responses\ from\ the\ renderer\.\

      \ \ void\ AddResponseTarget\(ExtensionFunction\*\ func\);\

      \

      \ \ //\ Processes\ a\ response\ ack\ from\ a\ renderer\.\

      \ \ void\ ProcessResponseAck\(const\ base::Uuid\&\ request_uuid\);\

      \

      '
    replace: "  // responses from the renderer.\n  void AddResponseTarget(ExtensionFunction* func);\n\n#if BUILDFLAG(IS_ANDROID)\n  // Drops only the pending response owned by this exact function.\n  void RemoveResponseTarget(ExtensionFunction* func);\n#endif\n\n  // Processes a response ack from a renderer.\n  void ProcessResponseAck(const base::Uuid& request_uuid);\n\n"
- description: Balance Android page-capture response ownership (3).
  regex:
    re_pattern: '\

      \ \ raw_ptr<Delegate,\ AcrossTasksDanglingUntriaged>\ delegate_;\

      \

      \ \ //\ The\ set\ of\ ExtensionFunction\ instances\ waiting\ for\ responses\ from\

      \ \ //\ the\ renderer\.\ These\ are\ removed\ once\ the\ response\ is\ processed\.\

      \ \ //\ The\ lifetimes\ of\ the\ instances\ are\ managed\ by\ the\ instances\ themselves\.\

      \ \ std::set<raw_ptr<ExtensionFunction,\ SetExperimental>>\ response_targets_;\

      \

      \ \ base::WeakPtrFactory<ExtensionFunctionDispatcher>\ weak_ptr_factory_\{this\};\

      \};\

      '
    replace: "\n  raw_ptr<Delegate, AcrossTasksDanglingUntriaged> delegate_;\n\n#if BUILDFLAG(IS_ANDROID)\n  class ResponseTarget;\n  // Owns the functions until the renderer ACK or its exact recipient goes away.\n  std::map<base::Uuid, std::unique_ptr<ResponseTarget>> response_targets_;\n#else\n  // The set of ExtensionFunction instances waiting for responses from\n  // the renderer. These are removed once the response is processed.\n  // The lifetimes of the instances are managed by the instances themselves.\n  std::set<raw_ptr<ExtensionFunction, SetExperimental>> response_targets_;\n#endif\n\n  base::WeakPtrFactory<ExtensionFunctionDispatcher> weak_ptr_factory_{this};\n};\n"
