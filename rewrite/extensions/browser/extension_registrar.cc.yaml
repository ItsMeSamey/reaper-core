substitutions:
- description: "Declare the Android build flag for the registrar worker-unregistration measurement guards."
  regex:
    re_pattern: "\\#include\\ \"extensions/browser/extension_registrar\\.h\"\\\n"
    replace: "#include \"extensions/browser/extension_registrar.h\"\n\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Exclude the registrar worker-counter sole histogram-functions include on Android."
  regex:
    re_pattern: "\\#include\\ \"base/metrics/histogram_functions\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/metrics/histogram_functions.h\"\n#endif\n"
  count: 1
- description: "Exclude the optional registrar generic worker-unregistration outcome recording on Android."
  regex:
    re_pattern: "\\ \\ base::UmaHistogramBoolean\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.WorkerUnregistrationState\",\\ success\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::UmaHistogramBoolean(\n      \"Extensions.ServiceWorkerBackground.WorkerUnregistrationState\", success);\n#endif\n"
  count: 1
- description: "Exclude the optional registrar AddExtension worker-unregistration outcome recording on Android."
  regex:
    re_pattern: "\\ \\ base::UmaHistogramBoolean\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.WorkerUnregistrationState_\"\\\n\\ \\ \\ \\ \\ \\ \"AddExtension\",\\\n\\ \\ \\ \\ \\ \\ success\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::UmaHistogramBoolean(\n      \"Extensions.ServiceWorkerBackground.WorkerUnregistrationState_\"\n      \"AddExtension\",\n      success);\n#endif\n"
  count: 1
- description: "Exclude the optional registrar generic worker-unregistration failure status recording on Android."
  regex:
    re_pattern: "\\ \\ \\ \\ base::UmaHistogramEnumeration\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.WorkerUnregistrationFailureStatus\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ status\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    base::UmaHistogramEnumeration(\n        \"Extensions.ServiceWorkerBackground.WorkerUnregistrationFailureStatus\",\n        status);\n#endif\n"
  count: 1
- description: "Exclude the optional registrar AddExtension worker-unregistration failure status recording on Android."
  regex:
    re_pattern: "\\ \\ \\ \\ base::UmaHistogramEnumeration\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.WorkerUnregistrationFailureStatus_\"\\\n\\ \\ \\ \\ \\ \\ \\ \\ \"AddExtension\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ status\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    base::UmaHistogramEnumeration(\n        \"Extensions.ServiceWorkerBackground.WorkerUnregistrationFailureStatus_\"\n        \"AddExtension\",\n        status);\n#endif\n"
  count: 1
- description: "Exclude the registrar sole remaining local-measurement macro include on Android."
  regex:
    re_pattern: "\\#include\\ \"base/metrics/histogram_macros\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/metrics/histogram_macros.h\"\n#endif\n"
  count: 1
- description: "Exclude only the optional uninstall-type local measurement on Android."
  regex:
    re_pattern: "\\ \\ UMA_HISTOGRAM_ENUMERATION\\(\"Extensions\\.UninstallType\",\\ extension\\->GetType\\(\\),\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ 100\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  UMA_HISTOGRAM_ENUMERATION(\"Extensions.UninstallType\", extension->GetType(),\n                            100);\n#endif\n"
  count: 1
