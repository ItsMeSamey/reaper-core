# Android actual base-loader test observation.
substitutions:
- description: "Android per-registration operation ownership225 (1)"
  regex:
    re_pattern: "\\#include\\ \"base/observer_list\\.h\"\\\n\\#include\\ \"base/observer_list_types\\.h\"\\\n\\#include\\ \"content/public/browser/render_process_host_creation_observer\\.h\"\\\n\\#include\\ \"extensions/common/mojom/host_id\\.mojom\\.h\"\\\n\\#include\\ \"extensions/common/user_script\\.h\"\\\n\\\n"
    replace: "#include \"base/observer_list.h\"\n#include \"base/observer_list_types.h\"\n#include \"content/public/browser/render_process_host_creation_observer.h\"\n#include \"build/build_config.h\"\n#include \"extensions/common/mojom/host_id.mojom.h\"\n#include \"extensions/common/user_script.h\"\n\n"
- description: "Android per-registration operation ownership225 (2)"
  regex:
    re_pattern: "\\\n\\ \\ //\\ Returns\\ true\\ if\\ the\\ scripts\\ for\\ this\\ loader's\\ HostID\\ have\\ been\\ loaded\\.\\\n\\ \\ bool\\ HasLoadedScripts\\(\\)\\ const;\\\n\\\n\\ \\ //\\ Returns\\ true\\ if\\ we\\ have\\ any\\ scripts\\ ready\\.\\\n\\ \\ bool\\ initial_load_complete\\(\\)\\ const\\ \\{\\ return\\ shared_memory_\\.IsValid\\(\\);\\ \\}\\\n"
    replace: "\n  // Returns true if the scripts for this loader's HostID have been loaded.\n  bool HasLoadedScripts() const;\n\n#if BUILDFLAG(IS_ANDROID)\n  const std::optional<UserScriptList>& GetLoadedScriptsForTesting() const {\n    return loaded_scripts_;\n  }\n#endif\n\n  // Returns true if we have any scripts ready.\n  bool initial_load_complete() const { return shared_memory_.IsValid(); }\n"
- description: Android script-load failure completion/state 1
  regex:
    pattern: '  std::optional<UserScriptList> loaded_scripts_;


      '
    replace: "  std::optional<UserScriptList> loaded_scripts_;\n\n#if BUILDFLAG(IS_ANDROID)\n  // The last published scripts,\
      \ retained across coalesced loads for rollback.\n  std::optional<UserScriptList> scripts_before_load_;\n#endif\n\n"
  count: 1
- description: Android script-load failure completion/state 2
  regex:
    pattern: '  std::list<ScriptsLoadedCallback> loading_callbacks_;


      '
    replace: "  std::list<ScriptsLoadedCallback> loading_callbacks_;\n\n#if BUILDFLAG(IS_ANDROID)\n  // Failed clients stay\
      \ destructor-owned while a callback is running. New\n  // reentrant loads use loading_callbacks_ and cannot consume\
      \ this batch.\n  std::list<ScriptsLoadedCallback> failed_load_callbacks_;\n#endif\n\n"
  count: 1
