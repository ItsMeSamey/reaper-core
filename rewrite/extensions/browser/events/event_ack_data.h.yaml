substitutions:
- description: "Declare the Android build flag before conditional acknowledgement members."
  regex:
    re_pattern: "\\#include\\ <map>\\\n"
    replace: "#include <map>\n\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Exclude the acknowledgement metric delayed-task sole weak-pointer include on Android."
  regex:
    re_pattern: "\\#include\\ \"base/memory/weak_ptr\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/memory/weak_ptr.h\"\n#endif\n"
  count: 1
- description: "Keep only functional private EventInfo constructor parameters on Android."
  regex:
    re_pattern: "\\ \\ \\ \\ EventInfo\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ const\\ base::Uuid\\&\\ request_uuid,\\\n\\ \\ \\ \\ \\ \\ \\ \\ int\\ render_process_id,\\\n\\ \\ \\ \\ \\ \\ \\ \\ int64_t\\ version_id,\\\n\\ \\ \\ \\ \\ \\ \\ \\ int\\ worker_thread_id,\\\n\\ \\ \\ \\ \\ \\ \\ \\ bool\\ start_ok,\\\n\\ \\ \\ \\ \\ \\ \\ \\ content::ServiceWorkerExternalRequestResult\\ external_request_result,\\\n\\ \\ \\ \\ \\ \\ \\ \\ base::TimeTicks\\ dispatch_start_time,\\\n\\ \\ \\ \\ \\ \\ \\ \\ EventDispatchSource\\ dispatch_source,\\\n\\ \\ \\ \\ \\ \\ \\ \\ bool\\ lazy_background_active_on_dispatch,\\\n\\ \\ \\ \\ \\ \\ \\ \\ const\\ events::HistogramValue\\ histogram_value\\);\\\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n    EventInfo(const base::Uuid& request_uuid,\n              int render_process_id,\n              int64_t version_id,\n              int worker_thread_id,\n              bool start_ok);\n#else\n    EventInfo(\n        const base::Uuid& request_uuid,\n        int render_process_id,\n        int64_t version_id,\n        int worker_thread_id,\n        bool start_ok,\n        content::ServiceWorkerExternalRequestResult external_request_result,\n        base::TimeTicks dispatch_start_time,\n        EventDispatchSource dispatch_source,\n        bool lazy_background_active_on_dispatch,\n        const events::HistogramValue histogram_value);\n#endif\n"
  count: 1
- description: "Exclude measurement-only private acknowledgement status/timing/routing fields on Android."
  regex:
    re_pattern: "\\ \\ \\ \\ //\\ The\\ status\\ returned\\ for\\ StartExternalRequest\\.\\\n\\ \\ \\ \\ content::ServiceWorkerExternalRequestResult\\ external_request_result;\\\n\\ \\ \\ \\ //\\ The\\ time\\ the\\ event\\ was\\ dispatched\\ to\\ the\\ event\\ router\\ for\\ the\\ extension\\.\\\n\\ \\ \\ \\ base::TimeTicks\\ dispatch_start_time;\\\n\\ \\ \\ \\ //\\ The\\ event\\ dispatching\\ processing\\ flow\\ that\\ was\\ followed\\ for\\ this\\ event\\.\\\n\\ \\ \\ \\ EventDispatchSource\\ dispatch_source;\\\n\\ \\ \\ \\ //\\ `true`\\ if\\ the\\ event\\ was\\ dispatched\\ to\\ a\\ active/running\\ lazy\\ background\\.\\\n\\ \\ \\ \\ bool\\ lazy_background_active_on_dispatch;\\\n\\ \\ \\ \\ //\\ See\\ `EventRouter::Event\\.histogram_value`\\.\\\n\\ \\ \\ \\ events::HistogramValue\\ histogram_value;\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    // The status returned for StartExternalRequest.\n    content::ServiceWorkerExternalRequestResult external_request_result;\n    // The time the event was dispatched to the event router for the extension.\n    base::TimeTicks dispatch_start_time;\n    // The event dispatching processing flow that was followed for this event.\n    EventDispatchSource dispatch_source;\n    // `true` if the event was dispatched to a active/running lazy background.\n    bool lazy_background_active_on_dispatch;\n    // See `EventRouter::Event.histogram_value`.\n    events::HistogramValue histogram_value;\n#endif\n"
  count: 1
- description: "Exclude pure late-ack and dispatch-time declarations and their metric-only comments on Android."
  regex:
    re_pattern: "\\ \\ //\\ Emits\\ a\\ stale\\ event\\ ack\\ metric\\ if\\ an\\ event\\ with\\ `event_id`\\ is\\ not\\ present\\\n\\ \\ //\\ in\\ `unacked_events_`\\.\\ Meaning\\ that\\ the\\ event\\ was\\ not\\ yet\\ acked\\ by\\ the\\\n\\ \\ //\\ renderer\\ to\\ the\\ browser\\.\\\n\\ \\ void\\ EmitLateAckedEventTask\\(int\\ event_id\\);\\\n\\ \\ void\\ EmitLateAckedEventTaskMetrics\\(const\\ EventInfo\\&\\ event_info\\);\\\n\\\n\\ \\ //\\ Emit\\ all\\ the\\ time\\ related\\ event\\ dispatch\\ metrics\\ when\\ an\\ event\\ is\\ acked\\\n\\ \\ //\\ from\\ the\\ renderer\\.\\\n\\ \\ static\\ void\\ EmitDispatchTimeMetrics\\(EventInfo\\&\\ event_info\\);\\\n\\\n\\ \\ //\\ TODO\\(crbug\\.com/40909770\\):\\ Mark\\ events\\ that\\ are\\ not\\ acked\\ within\\ 5\\ minutes\\\n\\ \\ //\\ \\(if\\ the\\ worker\\ is\\ still\\ around\\)\\ as\\ stale,\\ and\\ emit\\\n\\ \\ //\\ Extensions\\.Events\\.DispatchToAckTime\\.ExtensionServiceWorker2\\ at\\ that\\ point\\.\\\n\\ \\ //\\ Acks\\ after\\ that\\ point\\ should\\ check\\ staleness\\ and\\ not\\ emit\\ a\\ second\\ time\\.\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Emits a stale event ack metric if an event with `event_id` is not present\n  // in `unacked_events_`. Meaning that the event was not yet acked by the\n  // renderer to the browser.\n  void EmitLateAckedEventTask(int event_id);\n  void EmitLateAckedEventTaskMetrics(const EventInfo& event_info);\n\n  // Emit all the time related event dispatch metrics when an event is acked\n  // from the renderer.\n  static void EmitDispatchTimeMetrics(EventInfo& event_info);\n\n  // TODO(crbug.com/40909770): Mark events that are not acked within 5 minutes\n  // (if the worker is still around) as stale, and emit\n  // Extensions.Events.DispatchToAckTime.ExtensionServiceWorker2 at that point.\n  // Acks after that point should check staleness and not emit a second time.\n#endif\n"
  count: 1
- description: "Exclude the metric-task sole weak factory allocation on Android."
  regex:
    re_pattern: "\\ \\ base::WeakPtrFactory<EventAckData>\\ weak_factory_\\{this\\};\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::WeakPtrFactory<EventAckData> weak_factory_{this};\n#endif\n"
  count: 1
