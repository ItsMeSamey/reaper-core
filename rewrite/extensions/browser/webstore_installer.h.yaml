substitutions:
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\#include\ "base/scoped_observation\.h"\

      \#include\ "base/timer/timer\.h"\

      \#include\ "base/version\.h"\

      \#include\ "components/download/public/common/download_interrupt_reasons\.h"\

      \#include\ "components/download/public/common/download_item\.h"\

      \#include\ "content/public/browser/browser_thread\.h"\

      '
    replace: '#include "base/scoped_observation.h"

      #include "base/timer/timer.h"

      #include "base/version.h"

      #include "build/build_config.h"

      #include "components/download/public/common/download_interrupt_reasons.h"

      #include "components/download/public/common/download_item.h"

      #include "content/public/browser/browser_thread.h"

      '
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ void\ OnExtensionInstalled\(content::BrowserContext\*\ browser_context,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ Extension\*\ extension,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ bool\ is_update\)\ override;\

      \

      \ \ //\ Instead\ of\ using\ the\ default\ download\ directory,\ use\ `directory`\ instead\.\

      \ \ //\ This\ does\ \*not\*\ transfer\ ownership\ of\ `directory`\.\

      '
    replace: "  void OnExtensionInstalled(content::BrowserContext* browser_context,\n                            const Extension* extension,\n                            bool is_update) override;\n#if BUILDFLAG(IS_ANDROID)\n  void OnShutdown(ExtensionRegistry* registry) override;\n#endif\n\n  // Instead of using the default download directory, use `directory` instead.\n  // This does *not* transfer ownership of `directory`.\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ private:\

      \ \ FRIEND_TEST_ALL_PREFIXES\(WebstoreInstallerTest,\ PlatformParams\);\

      \ \ FRIEND_TEST_ALL_PREFIXES\(WebstoreInstallerTest,\ AuthUserParameterEncoding\);\

      \ \ friend\ struct\ content::BrowserThread::DeleteOnThread<\

      \ \ \ \ \ \ content::BrowserThread::UI>;\

      \ \ friend\ class\ base::DeleteHelper<WebstoreInstaller>;\

      '
    replace: " private:\n  FRIEND_TEST_ALL_PREFIXES(WebstoreInstallerTest, PlatformParams);\n  FRIEND_TEST_ALL_PREFIXES(WebstoreInstallerTest, AuthUserParameterEncoding);\n#if BUILDFLAG(IS_ANDROID)\n  friend class WebstoreInstallerAndroidLifecycleTest;\n#endif\n  friend struct content::BrowserThread::DeleteOnThread<\n      content::BrowserThread::UI>;\n  friend class base::DeleteHelper<WebstoreInstaller>;\n"
- description: Integrate reviewed Android extension UI, MV3 lifecycle, authenticated native messaging and artifact-parser source with retained desktop behavior
  regex:
    re_pattern: '\ \ //\ Called\ when\ crx_installer_\->InstallCrx\(\)\ finishes\.\

      \ \ void\ OnInstallerDone\(const\ std::optional<CrxInstallError>\&\ error\);\

      \

      \ \ base::ScopedObservation<ExtensionRegistry,\ ExtensionRegistryObserver>\

      \ \ \ \ \ \ extension_registry_observation_\{this\};\

      \ \ base::WeakPtr<content::WebContents>\ web_contents_;\

      '
    replace: "  // Called when crx_installer_->InstallCrx() finishes.\n  void OnInstallerDone(const std::optional<CrxInstallError>& error);\n\n#if BUILDFLAG(IS_ANDROID)\n  // Retire context ownership before invoking external completion callbacks.\n  // Returns whether the reference acquired by Start() must be released.\n  bool RetireOperation(bool report_failure);\n  bool completed_ = false;\n  bool start_ref_held_ = false;\n#endif\n\n  base::ScopedObservation<ExtensionRegistry, ExtensionRegistryObserver>\n      extension_registry_observation_{this};\n  base::WeakPtr<content::WebContents> web_contents_;\n"
