substitutions:
- description: Complete Android worker registration failure lifecycle (1).
  count: 1
  regex:
    re_pattern: '\#include\ "base/version\.h"\

      '
    replace: '#include "base/version.h"

      #include "build/build_config.h"

      '
- description: Complete Android worker registration failure lifecycle (2).
  count: 1
  regex:
    re_pattern: '\ \ std::set<SequencedContextId>\ worker_registered_;\

      \

      \ \ base::WeakPtrFactory<ServiceWorkerTaskQueue>\ weak_factory_\{this\};'
    replace: "  std::set<SequencedContextId> worker_registered_;\n\n#if BUILDFLAG(IS_ANDROID)\n  // Terminal registration\
      \ failures are scoped to one extension activation.\n  std::set<SequencedContextId> failed_registrations_;\n#endif\n\
      \  base::WeakPtrFactory<ServiceWorkerTaskQueue> weak_factory_{this};"
- description: "Exclude the measurement-only worker-start declaration on Android."
  regex:
    re_pattern: "\\ \\ //\\ Emit\\ histograms\\ when\\ we\\ know\\ we're\\ going\\ to\\ start\\ the\\ worker\\.\\\n\\ \\ void\\ EmitWorkerWillBeStartedHistograms\\(const\\ ExtensionId\\&\\ extension_id\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Emit histograms when we know we're going to start the worker.\n  void EmitWorkerWillBeStartedHistograms(const ExtensionId& extension_id);\n#endif\n"
  count: 1
