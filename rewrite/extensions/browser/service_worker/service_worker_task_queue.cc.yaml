substitutions:
- description: Complete Android worker registration failure lifecycle (1).
  count: 1
  regex:
    re_pattern: '\ \ const\ ServiceWorkerState\*\ worker_state\ =\ GetWorkerState\(context_id\);\

      \

      \ \ return\ worker_state\ \&\&\ worker_state\->IsReady\(\);'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  if (failed_registrations_.contains(context_id)) {\n    return false;\n  }\n#endif\n\
      \  const ServiceWorkerState* worker_state = GetWorkerState(context_id);\n\n  return worker_state && worker_state->IsReady();"
- description: Complete Android worker registration failure lifecycle (2).
  count: 1
  regex:
    re_pattern: \ \ if\ \(!worker_registered_\.contains\(context_id\)\)\ \{
    replace: "#if BUILDFLAG(IS_ANDROID)\n  if (failed_registrations_.contains(context_id)) {\n    std::move(task).Run(nullptr);\n\
      \    return;\n  }\n#endif\n  if (!worker_registered_.contains(context_id)) {"
- description: Complete Android worker registration failure lifecycle (3).
  count: 1
  regex:
    re_pattern: '\ \ \ \ const\ Extension\&\ extension\)\ \{\

      \ \ //\ If\ there\ is\ a\ pending\ unregistration'
    replace: "    const Extension& extension) {\n#if BUILDFLAG(IS_ANDROID)\n  // A fresh registration attempt can satisfy\
      \ newly queued work.\n  failed_registrations_.erase(context_id);\n#endif\n  // If there is a pending unregistration"
- description: Complete Android worker registration failure lifecycle (4).
  count: 1
  regex:
    re_pattern: '\ \ RunAndClearPendingTasksWithNullContext\(context_id\);\

      \ \ worker_state_observations_\.RemoveObservation\(worker_state\);'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  failed_registrations_.erase(context_id);\n#endif\n  RunAndClearPendingTasksWithNullContext(context_id);\n\
      \  worker_state_observations_.RemoveObservation(worker_state);"
- description: Complete Android worker registration failure lifecycle (5).
  count: 1
  regex:
    re_pattern: '\ \ \ \ std::string\ msg\ =\ base::StringPrintf\(\

      \ \ \ \ \ \ \ \ "Service\ worker\ registration\ failed\.\ Status\ code:\ %d",'
    replace: "#if BUILDFLAG(IS_ANDROID)\n    // Retryable failures return above. This activation has no usable worker;\n \
      \   // later requests must receive the same ordinary failed-load completion.\n    failed_registrations_.insert(context_id);\n\
      \    auto weak_this = weak_factory_.GetWeakPtr();\n#endif\n    std::string msg = base::StringPrintf(\n        \"Service\
      \ worker registration failed. Status code: %d\","
- description: Complete Android worker registration failure lifecycle (6).
  count: 1
  regex:
    re_pattern: '\ \ \ \ ExtensionsBrowserClient::Get\(\)\->ReportError\(browser_context_,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ std::move\(error\)\);\

      \ \ \ \ if\ \(g_test_observer\)\ \{\

      \ \ \ \ \ \ g_test_observer\->OnWorkerRegistered\(context_id\.extension_id\);\

      \ \ \ \ \}\

      \ \ \ \ return;\

      \ \ \}\

      \ \ base::UmaHistogramTimes\("Extensions\.ServiceWorkerBackground\.RegistrationTime",'
    replace: "    ExtensionsBrowserClient::Get()->ReportError(browser_context_,\n                                        \
      \        std::move(error));\n#if BUILDFLAG(IS_ANDROID)\n    if (!weak_this) {\n      return;\n    }\n#endif\n    if\
      \ (g_test_observer) {\n      g_test_observer->OnWorkerRegistered(context_id.extension_id);\n    }\n#if BUILDFLAG(IS_ANDROID)\n\
      \    // External notifications or pending-task callbacks may retire the owner.\n    // Complete the current activation\
      \ last, without touching it afterward.\n    if (weak_this &&\n        IsCurrentActivation(context_id.extension_id, context_id.token))\
      \ {\n      RunAndClearPendingTasksWithNullContext(context_id);\n    }\n#endif\n    return;\n  }\n  base::UmaHistogramTimes(\"\
      Extensions.ServiceWorkerBackground.RegistrationTime\","
- description: Complete Android worker registration failure lifecycle (7).
  count: 1
  regex:
    re_pattern: '\ \ worker_registered_\.insert\(context_id\);\

      \ \ pending_storage_registrations_\.insert_or_assign\('
    replace: "#if BUILDFLAG(IS_ANDROID)\n  failed_registrations_.erase(context_id);\n#endif\n  worker_registered_.insert(context_id);\n\
      \  pending_storage_registrations_.insert_or_assign("
- description: "Exclude the worker queue sole metric include on Android."
  regex:
    re_pattern: "\\#include\\ \"base/metrics/histogram_functions\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/metrics/histogram_functions.h\"\n#endif\n"
  count: 1
- description: "Exclude the measurement-only worker-start helper on Android."
  regex:
    re_pattern: "void\\ ServiceWorkerTaskQueue::EmitWorkerWillBeStartedHistograms\\(\\\n\\ \\ \\ \\ const\\ ExtensionId\\&\\ extension_id\\)\\ \\{\\\n\\ \\ bool\\ worker_is_ready_to_run_tasks\\ =\\ IsReadyToRunTasks\\(\\\n\\ \\ \\ \\ \\ \\ browser_context_,\\ extensions::ExtensionRegistry::Get\\(browser_context_\\)\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\->GetInstalledExtension\\(extension_id\\)\\);\\\n\\ \\ base::UmaHistogramBoolean\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.\"\\\n\\ \\ \\ \\ \\ \\ \"RequestedWorkerStartForStartedWorker3\",\\\n\\ \\ \\ \\ \\ \\ worker_is_ready_to_run_tasks\\);\\\n\\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid ServiceWorkerTaskQueue::EmitWorkerWillBeStartedHistograms(\n    const ExtensionId& extension_id) {\n  bool worker_is_ready_to_run_tasks = IsReadyToRunTasks(\n      browser_context_, extensions::ExtensionRegistry::Get(browser_context_)\n                            ->GetInstalledExtension(extension_id));\n  base::UmaHistogramBoolean(\n      \"Extensions.ServiceWorkerBackground.\"\n      \"RequestedWorkerStartForStartedWorker3\",\n      worker_is_ready_to_run_tasks);\n}\n#endif\n"
  count: 1
- description: "Exclude the measurement-only worker-start caller on Android."
  regex:
    re_pattern: "\\ \\ EmitWorkerWillBeStartedHistograms\\(context_id\\.extension_id\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  EmitWorkerWillBeStartedHistograms(context_id.extension_id);\n#endif\n"
  count: 1
- description: "Exclude retry outcome recording while retaining retry-map cleanup."
  regex:
    re_pattern: "\\ \\ if\\ \\(histogram_name\\ \\&\\&\\ it\\->second\\->backoff_entry\\.failure_count\\(\\)\\ >\\ 0\\)\\ \\{\\\n\\ \\ \\ \\ base::UmaHistogramBoolean\\(histogram_name,\\ success\\);\\\n\\ \\ \\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (histogram_name && it->second->backoff_entry.failure_count() > 0) {\n    base::UmaHistogramBoolean(histogram_name, success);\n  }\n#endif\n"
  count: 1
- description: "Omit the optional worker-start retry metric name on Android (true)."
  regex:
    re_pattern: "\\ \\ ClearRetryState\\(\\\n\\ \\ \\ \\ \\ \\ context_id\\.token,\\ worker_start_retries_,\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.StartWorkerRetryAttemptsResult\",\\\n\\ \\ \\ \\ \\ \\ /\\*success=\\*/true\\);\\\n"
    replace: "  ClearRetryState(\n      context_id.token, worker_start_retries_,\n#if !BUILDFLAG(IS_ANDROID)\n      \"Extensions.ServiceWorkerBackground.StartWorkerRetryAttemptsResult\",\n#else\n      nullptr,\n#endif\n      /*success=*/true);\n"
  count: 1
- description: "Omit the optional worker-start retry metric name on Android (false)."
  regex:
    re_pattern: "\\ \\ ClearRetryState\\(\\\n\\ \\ \\ \\ \\ \\ context_id\\.token,\\ worker_start_retries_,\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.StartWorkerRetryAttemptsResult\",\\\n\\ \\ \\ \\ \\ \\ /\\*success=\\*/false\\);\\\n"
    replace: "  ClearRetryState(\n      context_id.token, worker_start_retries_,\n#if !BUILDFLAG(IS_ANDROID)\n      \"Extensions.ServiceWorkerBackground.StartWorkerRetryAttemptsResult\",\n#else\n      nullptr,\n#endif\n      /*success=*/false);\n"
  count: 1
- description: "Omit the optional registration retry metric name on Android."
  regex:
    re_pattern: "\\ \\ ClearRetryState\\(context_id\\.token,\\ worker_registration_retries_,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.\"\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \"WorkerRegistrationRetryAttemptsResult\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ success\\);\\\n"
    replace: "  ClearRetryState(context_id.token, worker_registration_retries_,\n#if !BUILDFLAG(IS_ANDROID)\n                  \"Extensions.ServiceWorkerBackground.\"\n                  \"WorkerRegistrationRetryAttemptsResult\",\n#else\n                  nullptr,\n#endif\n                  success);\n"
  count: 1
- description: "Exclude the measurement-only final registration failure block on Android."
  regex:
    re_pattern: "\\ \\ if\\ \\(!success\\)\\ \\{\\\n\\ \\ \\ \\ base::UmaHistogramEnumeration\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.Registration_FailStatus\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ status_code\\);\\\n\\ \\ \\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (!success) {\n    base::UmaHistogramEnumeration(\n        \"Extensions.ServiceWorkerBackground.Registration_FailStatus\",\n        status_code);\n  }\n#endif\n"
  count: 1
- description: "Exclude the measurement-only registration mismatch failure block on Android."
  regex:
    re_pattern: "\\ \\ \\ \\ if\\ \\(!success\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ //\\ TODO\\(crbug\\.com/346732739\\):\\ Create\\ a\\ test\\ for\\ this\\ if\\ it\\ is\\ feasible\\.\\\n\\ \\ \\ \\ \\ \\ base::UmaHistogramEnumeration\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.RegistrationMismatchMitigated_\"\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \"FailStatus\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ status_code\\);\\\n\\ \\ \\ \\ \\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    if (!success) {\n      // TODO(crbug.com/346732739): Create a test for this if it is feasible.\n      base::UmaHistogramEnumeration(\n          \"Extensions.ServiceWorkerBackground.RegistrationMismatchMitigated_\"\n          \"FailStatus\",\n          status_code);\n    }\n#endif\n"
  count: 1
- description: "Exclude Android optional Extensions.ServiceWorkerBackground.AddPendingTaskForRunningWorker3 recording."
