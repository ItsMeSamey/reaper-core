substitutions:
- description: "Declare the Android build flag for worker state measurement guards."
  regex:
    re_pattern: "\\#include\\ \"extensions/browser/service_worker/service_worker_state\\.h\"\\\n"
    replace: "#include \"extensions/browser/service_worker/service_worker_state.h\"\n\n#include \"build/build_config.h\"\n"
  count: 1
- description: "Exclude the worker state sole metric includes on Android."
  regex:
    re_pattern: "\\#include\\ \"base/metrics/histogram_functions\\.h\"\\\n\\#include\\ \"base/metrics/histogram_macros\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"base/metrics/histogram_functions.h\"\n#include \"base/metrics/histogram_macros.h\"\n#endif\n"
  count: 1
- description: "Exclude the measurement-only worker-version enum and helper on Android."
  regex:
    re_pattern: "//\\ NOTE:\\ These\\ values\\ are\\ persisted\\ to\\ logs\\.\\ Entries\\ should\\ not\\ be\\ renumbered\\\n//\\ and\\ numeric\\ values\\ should\\ never\\ be\\ reused\\.\\\nenum\\ class\\ WorkerVersionIdState\\ \\{\\\n\\ \\ kNewVersionIsOlder\\ =\\ 0,\\ \\ //\\ The\\ newly\\ received\\ `version_id`\\ is\\ older\\.\\\n\\ \\ kNewVersionIsEqual\\ =\\ 1,\\ \\ //\\ The\\ newly\\ received\\ `version_id`\\ is\\ equal\\.\\\n\\ \\ kNewVersionIsNewer\\ =\\ 2,\\ \\ //\\ The\\ newly\\ received\\ `version_id`\\ is\\ newer\\.\\\n\\ \\ kMaxValue\\ =\\ kNewVersionIsNewer,\\\n\\};\\\n\\\nvoid\\ RecordWorkerVersionIdStateHistogram\\(int64_t\\ new_version_id,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ int64_t\\ preexisting_version_id\\)\\ \\{\\\n\\ \\ WorkerVersionIdState\\ state\\ =\\ WorkerVersionIdState::kNewVersionIsEqual;\\\n\\ \\ if\\ \\(new_version_id\\ <\\ preexisting_version_id\\)\\ \\{\\\n\\ \\ \\ \\ state\\ =\\ WorkerVersionIdState::kNewVersionIsOlder;\\\n\\ \\ \\}\\ else\\ if\\ \\(new_version_id\\ >\\ preexisting_version_id\\)\\ \\{\\\n\\ \\ \\ \\ state\\ =\\ WorkerVersionIdState::kNewVersionIsNewer;\\\n\\ \\ \\}\\\n\\ \\ base::UmaHistogramEnumeration\\(\\\n\\ \\ \\ \\ \\ \\ \"Extensions\\.ServiceWorkerBackground\\.WorkerVersionIdState_OnInitialized_\"\\\n\\ \\ \\ \\ \\ \\ \"NotActive\",\\\n\\ \\ \\ \\ \\ \\ state\\);\\\n\\}\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// NOTE: These values are persisted to logs. Entries should not be renumbered\n// and numeric values should never be reused.\nenum class WorkerVersionIdState {\n  kNewVersionIsOlder = 0,  // The newly received `version_id` is older.\n  kNewVersionIsEqual = 1,  // The newly received `version_id` is equal.\n  kNewVersionIsNewer = 2,  // The newly received `version_id` is newer.\n  kMaxValue = kNewVersionIsNewer,\n};\n\nvoid RecordWorkerVersionIdStateHistogram(int64_t new_version_id,\n                                         int64_t preexisting_version_id) {\n  WorkerVersionIdState state = WorkerVersionIdState::kNewVersionIsEqual;\n  if (new_version_id < preexisting_version_id) {\n    state = WorkerVersionIdState::kNewVersionIsOlder;\n  } else if (new_version_id > preexisting_version_id) {\n    state = WorkerVersionIdState::kNewVersionIsNewer;\n  }\n  base::UmaHistogramEnumeration(\n      \"Extensions.ServiceWorkerBackground.WorkerVersionIdState_OnInitialized_\"\n      \"NotActive\",\n      state);\n}\n#endif\n"
  count: 1
- description: "Exclude the measurement-only worker-version caller on Android."
  regex:
    re_pattern: "\\ \\ \\ \\ RecordWorkerVersionIdStateHistogram\\(new_version_id,\\ preexisting_version_id\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    RecordWorkerVersionIdStateHistogram(new_version_id, preexisting_version_id);\n#endif\n"
  count: 1
- description: "Exclude Android optional Extensions.ServiceWorkerBackground.StartWorkerStatus recording."
  regex:
    re_pattern: "\\ \\ UMA_HISTOGRAM_BOOLEAN\\(\"Extensions\\.ServiceWorkerBackground\\.StartWorkerStatus\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ true\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  UMA_HISTOGRAM_BOOLEAN(\"Extensions.ServiceWorkerBackground.StartWorkerStatus\",\n                        true);\n#endif\n"
  count: 1
- description: "Exclude Android optional Extensions.ServiceWorkerBackground.StartWorkerTime recording."
  regex:
    re_pattern: "\\ \\ UMA_HISTOGRAM_TIMES\\(\"Extensions\\.ServiceWorkerBackground\\.StartWorkerTime\",\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ base::Time::Now\\(\\)\\ \\-\\ start_time\\);\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  UMA_HISTOGRAM_TIMES(\"Extensions.ServiceWorkerBackground.StartWorkerTime\",\n                      base::Time::Now() - start_time);\n#endif\n"
  count: 1
