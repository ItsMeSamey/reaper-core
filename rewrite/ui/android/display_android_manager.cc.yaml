substitutions:
- description: Android complete display opt-in registration and real manager regression coverage (1).
  regex:
    re_pattern: '\

      \ \ JNIEnv\*\ env\ =\ AttachCurrentThread\(\);\

      \ \ Java_DisplayAndroidManager_onNativeSideCreated\(env,\ \(int64_t\)manager\);\

      \}\

      \

      bool\ DisplayAndroidManager::IsDisplayTopologyAvailable\(\)\ \{\

      '
    replace: "\n  JNIEnv* env = AttachCurrentThread();\n  Java_DisplayAndroidManager_onNativeSideCreated(env, (int64_t)manager);\n}\n\nvoid DisplayAndroidManager::EnsureAllDisplaysRegistered() {\n  Java_DisplayAndroidManager_ensureAllDisplaysRegistered(AttachCurrentThread());\n}\n\nbool DisplayAndroidManager::IsDisplayTopologyAvailable() {\n"
