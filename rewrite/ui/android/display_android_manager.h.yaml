substitutions:
- description: Android complete display opt-in registration and real manager regression coverage (1).
  regex:
    re_pattern: '\

      class\ UI_ANDROID_EXPORT\ DisplayAndroidManager\ :\ public\ display::ScreenBase\ \{\

      \ public:\

      \ \ static\ bool\ IsDisplayTopologyAvailable\(\);\

      \ \ static\ void\ SetIsDisplayTopologyAvailableForTesting\(bool\ value\);\

      \

      '
    replace: "\nclass UI_ANDROID_EXPORT DisplayAndroidManager : public display::ScreenBase {\n public:\n  // Opt in to tracking all accessible displays, including those without a\n  // browser window. Must be called on the UI thread.\n  static void EnsureAllDisplaysRegistered();\n\n  static bool IsDisplayTopologyAvailable();\n  static void SetIsDisplayTopologyAvailableForTesting(bool value);\n\n"
