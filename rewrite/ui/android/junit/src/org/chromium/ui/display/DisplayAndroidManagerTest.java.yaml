- description: Android complete display opt-in registration and real manager regression coverage (4).
  regex:
    re_pattern: '\ \ \ \ @Rule\ public\ MockitoRule\ mMockitoRule\ =\ MockitoJUnit\.rule\(\);\

      \

      \ \ \ \ @Mock\ private\ AconfigFlaggedApiDelegate\ mAconfigFlaggedApiDelegate;\

      \

      \ \ \ \ private\ final\ DisplayManager\ mDisplayManager\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \(DisplayManager\)\

      '
    replace: "    @Rule public MockitoRule mMockitoRule = MockitoJUnit.rule();\n\n    @Mock private AconfigFlaggedApiDelegate mAconfigFlaggedApiDelegate;\n    @Mock private DisplayAndroidManager.Natives mNativeMock;\n\n    private final DisplayManager mDisplayManager =\n            (DisplayManager)\n"
- description: Android complete display opt-in registration and real manager regression coverage (5).
  regex:
    re_pattern: '\

      \ \ \ \ @Before\

      \ \ \ \ public\ void\ setup\(\)\ \{\

      \ \ \ \ \ \ \ \ //\ DisplayManager\ has\ a\ default\ display\ with\ the\ Display\.DEFAULT_DISPLAY\ id\.\

      \ \ \ \ \ \ \ \ final\ ShadowDisplay\ defaultDisplay\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Shadows\.shadowOf\(mDisplayManager\.getDisplay\(Display\.DEFAULT_DISPLAY\)\);\

      '
    replace: "\n    @Before\n    public void setup() {\n        DisplayAndroidManagerJni.setInstanceForTesting(mNativeMock);\n        // DisplayManager has a default display with the Display.DEFAULT_DISPLAY id.\n        final ShadowDisplay defaultDisplay =\n                Shadows.shadowOf(mDisplayManager.getDisplay(Display.DEFAULT_DISPLAY));\n"
- description: Android complete display opt-in registration and real manager regression coverage (6).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ checkDisplays\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Display\ adding\ after\ removing\ with\ disabled\ display\ registration\ is\ incorrect\.",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ displayAndroidManager\.mIdMap\);\

      \ \ \ \ \}\

      \

      \ \ \ \ @Test\

      '
    replace: "        checkDisplays(\n                \"Display adding after removing with disabled display registration is incorrect.\",\n                displayAndroidManager.mIdMap);\n    }\n\n    @Test\n    @DisableFeatures({UiAndroidFeatures.ANDROID_USE_DISPLAY_TOPOLOGY})\n    public void testCompleteRegistrationIncludesExistingDisplayAndIsIdempotent() {\n        int externalId = ShadowDisplayManager.addDisplay(\"\");\n        DisplayAndroidManager manager = DisplayAndroidManager.getInstance();\n        assertNull(manager.mIdMap.get(externalId));\n        attachNativeManager(manager);\n\n        DisplayAndroidManager.ensureAllDisplaysRegistered();\n\n        DisplayAndroid external = manager.mIdMap.get(externalId);\n        assertNotNull(external);\n        assertEquals(2, manager.mIdMap.size());\n        verifyNativeDisplayUpdate(externalId);\n        clearInvocations(mNativeMock);\n\n        DisplayAndroidManager.ensureAllDisplaysRegistered();\n\n        assertSame(external, manager.mIdMap.get(externalId));\n        assertEquals(2, manager.mIdMap.size());\n        verifyNoInteractions(mNativeMock);\n    }\n\n    @Test\n    @DisableFeatures({UiAndroidFeatures.ANDROID_USE_DISPLAY_TOPOLOGY})\n    public void testCompleteRegistrationTracksAttachmentAndRemoval() {\n        DisplayAndroidManager manager = DisplayAndroidManager.getInstance();\n        DisplayAndroidManager.ensureAllDisplaysRegistered();\n        attachNativeManager(manager);\n\n        int externalId = ShadowDisplayManager.addDisplay(\"\");\n        Shadows.shadowOf(Looper.getMainLooper()).idle();\n\n        assertNotNull(manager.mIdMap.get(externalId));\n        verifyNativeDisplayUpdate(externalId);\n        clearInvocations(mNativeMock);\n\n        ShadowDisplayManager.removeDisplay(externalId);\n        Shadows.shadowOf(Looper.getMainLooper()).idle();\n\n        assertNull(manager.mIdMap.get(externalId));\n        assertEquals(1, manager.mIdMap.size());\n        verify(mNativeMock).removeDisplay(1L, externalId);\n        clearInvocations(mNativeMock);\n\n        // A late platform change for the removed ID must not revive its object.\n        manager.new DisplayListenerBackend().onDisplayChanged(externalId);\n        assertNull(manager.mIdMap.get(externalId));\n        verifyNoInteractions(mNativeMock);\n    }\n\n    @Test\n    @DisableFeatures({UiAndroidFeatures.ANDROID_USE_DISPLAY_TOPOLOGY})\n    public void testCompleteRegistrationUpdatesMetricsOfUnusedDisplay() {\n        int externalId = addDisplay(1280, 720, DisplayMetrics.DENSITY_MEDIUM, \"external\");\n        DisplayAndroidManager manager = DisplayAndroidManager.getInstance();\n        DisplayAndroidManager.ensureAllDisplaysRegistered();\n        attachNativeManager(manager);\n        DisplayAndroid external = manager.mIdMap.get(externalId);\n        assertNotNull(external);\n        assertEquals(1.0f, external.getDipScale(), 0.0f);\n\n        Context displayContext = external.getWindowContext();\n        assertNotNull(displayContext);\n        Resources resources = displayContext.getResources();\n        Configuration configuration = new Configuration(resources.getConfiguration());\n        configuration.densityDpi = DisplayMetrics.DENSITY_XHIGH;\n        resources.updateConfiguration(configuration, resources.getDisplayMetrics());\n        ShadowDisplayManager.changeDisplay(externalId, \"+\");\n        Shadows.shadowOf(Looper.getMainLooper()).idle();\n\n        assertSame(external, manager.mIdMap.get(externalId));\n        assertEquals(2.0f, external.getDipScale(), 0.0f);\n        verifyNativeDisplayUpdate(externalId);\n    }\n\n    @Test\n    @DisableFeatures({UiAndroidFeatures.ANDROID_USE_DISPLAY_TOPOLOGY})\n    public void testCompleteRegistrationIgnoresUnavailableDisplay() {\n        DisplayAndroidManager manager = DisplayAndroidManager.getInstance();\n        DisplayAndroidManager.ensureAllDisplaysRegistered();\n        attachNativeManager(manager);\n        int absentId = Integer.MAX_VALUE;\n\n        manager.new DisplayListenerBackend().onDisplayAdded(absentId);\n        manager.new DisplayListenerBackend().onDisplayChanged(absentId);\n        manager.new DisplayListenerBackend().onDisplayRemoved(absentId);\n\n        assertEquals(1, manager.mIdMap.size());\n        verifyNoInteractions(mNativeMock);\n    }\n\n    @Test\n    @DisableFeatures({UiAndroidFeatures.ANDROID_USE_DISPLAY_TOPOLOGY})\n    public void testCompleteRegistrationBeforeNativeInitialization() {\n        int externalId = ShadowDisplayManager.addDisplay(\"\");\n        DisplayAndroidManager manager = DisplayAndroidManager.getInstance();\n\n        DisplayAndroidManager.ensureAllDisplaysRegistered();\n\n        assertNotNull(manager.mIdMap.get(externalId));\n        verifyNoInteractions(mNativeMock);\n        // The real native-initialization path publishes the already complete map.\n        ReflectionHelpers.callInstanceMethod(\n                manager, \"setNativePointer\", ClassParameter.from(long.class, 1L));\n        verifyNativeDisplayUpdate(externalId);\n    }\n\n    @Test\n    public void testCompleteRegistrationPreservesTopologyOwnership() {\n        int externalId = ShadowDisplayManager.addDisplay(\"\");\n        DisplayAndroidManager manager = DisplayAndroidManager.getInstance();\n        attachNativeManager(manager);\n\n        DisplayAndroidManager.ensureAllDisplaysRegistered();\n        manager.new DisplayListenerBackend().onDisplayAdded(externalId);\n\n        assertNull(manager.mIdMap.get(externalId));\n        verifyNoInteractions(mNativeMock);\n        mBounds.put(externalId, new RectF(1920, 0, 2720, 600));\n        updateDisplayTopology(manager);\n        assertNotNull(manager.mIdMap.get(externalId));\n        verifyNativeDisplayUpdate(externalId);\n    }\n\n    private void attachNativeManager(DisplayAndroidManager manager) {\n        ReflectionHelpers.callInstanceMethod(\n                manager, \"setNativePointer\", ClassParameter.from(long.class, 1L));\n        clearInvocations(mNativeMock);\n    }\n\n    private void verifyNativeDisplayUpdate(int displayId) {\n        verify(mNativeMock, atLeastOnce())\n                .updateDisplay(\n                        eq(1L),\n                        eq(displayId),\n                        any(),\n                        any(),\n                        any(),\n                        anyInt(),\n                        anyInt(),\n                        anyFloat(),\n                        anyFloat(),\n                        anyFloat(),\n                        anyInt(),\n                        anyInt(),\n                        anyInt(),\n                        anyBoolean(),\n                        anyBoolean(),\n                        anyFloat(),\n                        anyBoolean());\n    }\n\n    @Test\n"
