# Keep suspended dialog queue notifications non-null and bound to their original dialog type.
substitutions:
- description: Use the existing Robolectric reflection helper to exercise the real dismissal transient
  regex:
    re_pattern: 'import\ org\.mockito\.junit\.MockitoRule;\

      '
    replace: 'import org.mockito.junit.MockitoRule;

      import org.robolectric.util.ReflectionHelpers;

      '
- description: Cover absent presenter models and reentrant queued observer attribution
  regex:
    re_pattern: '\ \ \ \ /\*\*\ Tests\ resuming\ dialogs\ of\ a\ certain\ type\.\ \*/\

      '
    replace: "    /** A dismissal observer can run after the presenter has already cleared its model. */\n    @Test\n    @Feature({\"ModalDialogManagerObserver\"})\n    public void testSuspendCurrentDialog_NullModelDuringDismissalIsNotQueued() {\n        PropertyModel model = mDialogModels.get(0);\n        int[] dismissalCallbacks = {0};\n        mModalDialogManager.addObserver(\n                new ModalDialogManagerObserver() {\n                    @Override\n                    public void onDialogDismissed(PropertyModel dismissedModel) {\n                        assertEquals(model, dismissedModel);\n                        dismissalCallbacks[0]++;\n                        // Exercise the genuine teardown window, without introducing a second\n                        // dialog into the still-running outer dismissDialog call.\n                        assertTrue(mModalDialogManager.isShowing());\n                        assertNull(mModalDialogManager.getCurrentDialogForTest());\n                        ReflectionHelpers.callInstanceMethod(\n                                mModalDialogManager, \"suspendCurrentDialog\");\n                        assertFalse(mModalDialogManager.isShowing());\n                        assertNull(\n                                mModalDialogManager.getPendingDialogsForTest(ModalDialogType.APP));\n                        assertNull(\n                                mModalDialogManager.getPendingDialogsForTest(ModalDialogType.TAB));\n                        verify(mObserver, times(0)).onDialogQueued(any(), anyInt());\n                    }\n                });\n\n        mModalDialogManager.showDialog(model, ModalDialogType.APP);\n        mModalDialogManager.dismissDialog(model, DialogDismissalCause.UNKNOWN);\n\n        assertEquals(1, dismissalCallbacks[0]);\n        assertFalse(mModalDialogManager.isShowing());\n        assertNull(mModalDialogManager.getCurrentPresenterForTest());\n        assertNull(mModalDialogManager.getCurrentDialogForTest());\n        assertNull(mModalDialogManager.getPendingDialogsForTest(ModalDialogType.APP));\n        assertNull(mModalDialogManager.getPendingDialogsForTest(ModalDialogType.TAB));\n        verify(mObserver, times(0)).onDialogQueued(any(), anyInt());\n        verify(mObserver, times(1)).onDialogDismissed(model);\n        verify(mObserver, times(1)).onLastDialogDismissed();\n        verify(mAppModalPresenter, times(1)).removeDialogView(model);\n        verify(mAppModalPresenter, times(0)).removeDialogView(null);\n        assertOnDismissCalled(model, 1);\n    }\n\n    /** Reentrant observers cannot change the type reported for an already queued dialog. */\n    @Test\n    @Feature({\"ModalDialogManagerObserver\"})\n    public void testSuspendCurrentDialog_ReentrantObserverPreservesQueuedType() {\n        PropertyModel appModel = mDialogModels.get(0);\n        PropertyModel tabModel = mDialogModels.get(1);\n        int[] queuedCallbacks = {0};\n        mModalDialogManager.addObserver(\n                new ModalDialogManagerObserver() {\n                    @Override\n                    public void onDialogQueued(PropertyModel queuedModel, int dialogType) {\n                        assertEquals(appModel, queuedModel);\n                        assertEquals(ModalDialogType.APP, dialogType);\n                        queuedCallbacks[0]++;\n                        assertTrue(mModalDialogManager.isSuspended(ModalDialogType.APP));\n\n                        // Change the manager's current type, then finish the nested dialog so\n                        // suspendType can safely continue with no active presenter.\n                        mModalDialogManager.showDialog(tabModel, ModalDialogType.TAB);\n                        assertEquals(tabModel, mModalDialogManager.getCurrentDialogForTest());\n                        mModalDialogManager.dismissDialog(tabModel, DialogDismissalCause.UNKNOWN);\n                        assertEquals(ModalDialogType.TAB, mModalDialogManager.getCurrentType());\n                        assertFalse(mModalDialogManager.isShowing());\n                    }\n                });\n        ModalDialogManagerObserver laterObserver =\n                Mockito.mock(ModalDialogManagerObserver.class);\n        mModalDialogManager.addObserver(laterObserver);\n\n        mModalDialogManager.showDialog(appModel, ModalDialogType.APP);\n        int token = mModalDialogManager.suspendType(ModalDialogType.APP);\n\n        assertEquals(1, queuedCallbacks[0]);\n        verify(laterObserver, times(1)).onDialogQueued(appModel, ModalDialogType.APP);\n        verify(laterObserver, times(1)).onDialogQueued(any(), anyInt());\n        assertFalse(mModalDialogManager.isShowing());\n        assertEquals(ModalDialogType.TAB, mModalDialogManager.getCurrentType());\n        assertEquals(1, mModalDialogManager.getPendingDialogsForTest(ModalDialogType.APP).size());\n        assertEquals(\n                appModel, mModalDialogManager.getPendingDialogsForTest(ModalDialogType.APP).get(0));\n        assertNull(mModalDialogManager.getPendingDialogsForTest(ModalDialogType.TAB));\n        assertOnDismissCalled(tabModel, 1);\n        assertOnDismissCalled(appModel, 0);\n\n        mModalDialogManager.resumeType(ModalDialogType.APP, token);\n\n        assertEquals(appModel, mModalDialogManager.getCurrentDialogForTest());\n        assertEquals(ModalDialogType.APP, mModalDialogManager.getCurrentType());\n        assertNull(mModalDialogManager.getPendingDialogsForTest(ModalDialogType.APP));\n        assertEquals(1, queuedCallbacks[0]);\n        verify(laterObserver, times(1)).onDialogQueued(any(), anyInt());\n    }\n\n    /** Tests resuming dialogs of a certain type. */\n"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assertEquals\(ModalDialogType\.TAB,\ mModalDialogManager\.getCurrentType\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assertFalse\(mModalDialogManager\.isShowing\(\)\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\);\

      \ \ \ \ \ \ \ \ ModalDialogManagerObserver\ laterObserver\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Mockito\.mock\(ModalDialogManagerObserver\.class\);\

      \ \ \ \ \ \ \ \ mModalDialogManager\.addObserver\(laterObserver\);\

      \

      \ \ \ \ \ \ \ \ mModalDialogManager\.showDialog\(appModel,\ ModalDialogType\.APP\);\

      \ \ \ \ \ \ \ \ int\ token\ =\ mModalDialogManager\.suspendType\(ModalDialogType\.APP\);\

      '
    replace: "                        assertEquals(ModalDialogType.TAB, mModalDialogManager.getCurrentType());\n                        assertFalse(mModalDialogManager.isShowing());\n                    }\n                });\n        ModalDialogManagerObserver laterObserver = Mockito.mock(ModalDialogManagerObserver.class);\n        mModalDialogManager.addObserver(laterObserver);\n\n        mModalDialogManager.showDialog(appModel, ModalDialogType.APP);\n        int token = mModalDialogManager.suspendType(ModalDialogType.APP);\n"
