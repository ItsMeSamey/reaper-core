- description: Cover valid completion and rejected validation with real validator decisions, callback counts and the actual
    toast manager boundary.
  regex:
    pattern: "    @Test\n    public void testFilePathTasks() throws IOException {\n"
    replace: "    @Test\n    public void testFilePathSelectedTaskSuccessDoesNotShowError() {\n        ToastManager toastManager\
      \ = Mockito.mock(ToastManager.class);\n        ToastManager.setInstanceForTesting(toastManager);\n        FileUtilsJni.setInstanceForTesting(mFileUtilsMocks);\n\
      \        doReturn(\"/data/local/tmp.jpg\").when(mFileUtilsMocks).getAbsoluteFilePath(any());\n\n        TestSelectFileDialog\
      \ selectFileDialog = new TestSelectFileDialog(0);\n        SelectFileDialog.FilePathSelectedTask task =\n          \
      \      selectFileDialog\n                .new FilePathSelectedTask(\n                        ContextUtils.getApplicationContext(),\
      \ \"/data/local/tmp.jpg\", null);\n        Boolean validPath = task.doInBackground();\n        assertTrue(validPath);\n\
      \        task.onPostExecute(validPath);\n\n        assertEquals(1, selectFileDialog.mFileSelectionSuccess);\n      \
      \  assertEquals(0, selectFileDialog.mFileSelectionAborted);\n        Mockito.verify(toastManager, Mockito.never()).requestShow(any());\n\
      \    }\n\n    @Test\n    public void testFilePathSelectedTaskValidationFailureShowsError() {\n        ToastManager toastManager\
      \ = Mockito.mock(ToastManager.class);\n        ToastManager.setInstanceForTesting(toastManager);\n        FileUtilsJni.setInstanceForTesting(mFileUtilsMocks);\n\
      \        doReturn(\"\").when(mFileUtilsMocks).getAbsoluteFilePath(any());\n\n        TestSelectFileDialog selectFileDialog\
      \ = new TestSelectFileDialog(0);\n        SelectFileDialog.FilePathSelectedTask task =\n                selectFileDialog\n\
      \                .new FilePathSelectedTask(\n                        ContextUtils.getApplicationContext(), \"/data/local/tmp.jpg\"\
      , null);\n        Boolean validPath = task.doInBackground();\n        assertFalse(validPath);\n        task.onPostExecute(validPath);\n\
      \n        assertEquals(0, selectFileDialog.mFileSelectionSuccess);\n        assertEquals(1, selectFileDialog.mFileSelectionAborted);\n\
      \        ArgumentCaptor<Toast> toast = ArgumentCaptor.forClass(Toast.class);\n        Mockito.verify(toastManager).requestShow(toast.capture());\n\
      \        assertEquals(\n                ContextUtils.getApplicationContext().getString(R.string.opening_file_error),\n\
      \                toast.getValue().getText());\n    }\n\n    @Test\n    public void testFilePathTasks() throws IOException\
      \ {\n"
  count: 1
