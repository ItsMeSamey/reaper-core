- description: Cover ordinary cancellation, both empty-success forms, and valid camera fallback exactly once
  regex:
    pattern: "    @Test\n    @DisableFeatures({UiAndroidFeatures.CHECK_INTENT_CALLER_PERMISSION})\n    public void testIntentCompletedWithCaseVariantClipDataUri()\
      \ {\n"
    replace: "    @Test\n    public void testIntentCompletedCanceledWithoutCameraOutput() {\n        TestSelectFileDialog\
      \ selectFileDialog = new TestSelectFileDialog(0);\n        int callCount = mOnActionCallback.getCallCount();\n\n   \
      \     selectFileDialog.onIntentCompleted(Activity.RESULT_CANCELED, null);\n\n        assertEquals(0, selectFileDialog.mFileSelectionSuccess);\n\
      \        assertEquals(1, selectFileDialog.mFileSelectionAborted);\n        assertEquals(callCount + 1, mOnActionCallback.getCallCount());\n\
      \    }\n\n    @Test\n    public void testIntentCompletedWithNullResultWithoutCameraOutput() {\n        TestSelectFileDialog\
      \ selectFileDialog = new TestSelectFileDialog(0);\n        int callCount = mOnActionCallback.getCallCount();\n\n   \
      \     selectFileDialog.onIntentCompleted(Activity.RESULT_OK, null);\n\n        assertEquals(0, selectFileDialog.mFileSelectionSuccess);\n\
      \        assertEquals(1, selectFileDialog.mFileSelectionAborted);\n        assertEquals(callCount + 1, mOnActionCallback.getCallCount());\n\
      \    }\n\n    @Test\n    public void testIntentCompletedWithEmptyResultWithoutCameraOutput() {\n        TestSelectFileDialog\
      \ selectFileDialog = new TestSelectFileDialog(0);\n        int callCount = mOnActionCallback.getCallCount();\n\n   \
      \     selectFileDialog.onIntentCompleted(Activity.RESULT_OK, new Intent());\n\n        assertEquals(0, selectFileDialog.mFileSelectionSuccess);\n\
      \        assertEquals(1, selectFileDialog.mFileSelectionAborted);\n        assertEquals(callCount + 1, mOnActionCallback.getCallCount());\n\
      \    }\n\n    @Test\n    public void testIntentCompletedWithNullResultUsesCameraOutput() {\n        TestSelectFileDialog\
      \ selectFileDialog = new TestSelectFileDialog(0);\n        WindowAndroid windowAndroid = Mockito.mock(WindowAndroid.class);\n\
      \        when(windowAndroid.getApplicationContext()).thenReturn(ContextUtils.getApplicationContext());\n        Uri\
      \ cameraOutputUri = Uri.parse(\"file:///storage/emulated/0/DCIM/Camera/IMG_0.jpg\");\n        ReflectionHelpers.setField(selectFileDialog,\
      \ \"mWindowAndroid\", windowAndroid);\n        ReflectionHelpers.setField(selectFileDialog, \"mCameraOutputUri\", cameraOutputUri);\n\
      \        int callCount = mOnActionCallback.getCallCount();\n\n        selectFileDialog.onIntentCompleted(Activity.RESULT_OK,\
      \ null);\n\n        assertEquals(1, selectFileDialog.mFileSelectionSuccess);\n        assertEquals(0, selectFileDialog.mFileSelectionAborted);\n\
      \        assertEquals(callCount + 1, mOnActionCallback.getCallCount());\n        ArgumentCaptor<Intent> scannerIntent\
      \ = ArgumentCaptor.forClass(Intent.class);\n        Mockito.verify(windowAndroid).sendBroadcast(scannerIntent.capture());\n\
      \        assertEquals(Intent.ACTION_MEDIA_SCANNER_SCAN_FILE, scannerIntent.getValue().getAction());\n        assertEquals(cameraOutputUri,\
      \ scannerIntent.getValue().getData());\n    }\n\n    @Test\n    @DisableFeatures({UiAndroidFeatures.CHECK_INTENT_CALLER_PERMISSION})\n\
      \    public void testIntentCompletedWithCaseVariantClipDataUri() {\n"
  count: 1
