# Android split pane request ownership and dialog placement.
substitutions:
- description: expose actual Android container eligibility before sensitive UI launch
  regex:
    re_pattern: '\ \ bool\ HasFocus\(\);\

      \ \ void\ RequestFocus\(\);'
    replace: "  bool HasFocus();\n  // Checks the current Java container, including ancestor visibility and actual\n  // window focus. Use before launching UI; external activities may then hide it.\n  bool IsAttachedAndVisibleWithWindowFocus();\n  void RequestFocus();"
- description: Format modified Android split dialog code
  regex:
    re_pattern: '\ \ void\ RemoveFromParent\(\);\

      \

      \ \ bool\ HasFocus\(\);\

      \ \ //\ Checks\ the\ current\ Java\ container,\ including\ ancestor\ visibility\ and\ actual\

      \ \ //\ window\ focus\.\ Use\ before\ launching\ UI;\ external\ activities\ may\ then\ hide\ it\.\

      \ \ bool\ IsAttachedAndVisibleWithWindowFocus\(\);\

      \ \ void\ RequestFocus\(\);\

      \

      \ \ //\ Pass\ necessary\ \|jdrop_data\|\ to\ build\ Android\ ClipData\ for\ drag\ and\ drop\.\

      '
    replace: "  void RemoveFromParent();\n\n  bool HasFocus();\n  // Checks the current Java container, including ancestor visibility and actual\n  // window focus. Use before launching UI; external activities may then hide\n  // it.\n  bool IsAttachedAndVisibleWithWindowFocus();\n  void RequestFocus();\n\n  // Pass necessary |jdrop_data| to build Android ClipData for drag and drop.\n"
