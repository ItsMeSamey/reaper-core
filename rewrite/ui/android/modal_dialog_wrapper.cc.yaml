      \#include\ <jni\.h>\

      \

      \#include\ "base/android/callback_android\.h"\

      \#include\ "base/android/jni_android\.h"\

      '
    replace: '#include "ui/android/modal_dialog_wrapper.h"


      #include <jni.h>


      #include <algorithm>

      #include <numeric>


      #include "base/android/callback_android.h"

      #include "base/android/jni_android.h"

      '
