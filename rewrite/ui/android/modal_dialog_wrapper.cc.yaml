# Android split pane request ownership and dialog placement.
substitutions:
- description: Accept optional tab-scoped requester metadata
  regex:
    re_pattern: \ \ \ \ ui::WindowAndroid\*\ window\)\ \{
    replace: "    ui::WindowAndroid* window,\n    const base::android::JavaRef<jobject>& owner) {"
- description: Assign requester before the model enters the dialog queue
  regex:
    re_pattern: \ \ tab_modal\->BuildPropertyModel\(\);
    replace: "  tab_modal->BuildPropertyModel();\n  Java_ModalDialogWrapper_withDialogOwner(\n      base::android::AttachCurrentThread(), tab_modal->java_obj_, owner);"
- description: Format modified Android split dialog code
  regex:
    re_pattern: '\ \ ModalDialogWrapper\*\ tab_modal\ =\

      \ \ \ \ \ \ new\ ModalDialogWrapper\(std::move\(dialog_model\),\ window\);\

      \ \ g_dialog_ptr_for_testing\ =\ tab_modal;\

      \ \ tab_modal\->BuildPropertyModel\(\);\

      \ \ Java_ModalDialogWrapper_withDialogOwner\(\

      \ \ \ \ \ \ base::android::AttachCurrentThread\(\),\ tab_modal\->java_obj_,\ owner\);\

      \ \ dialog_manager\->ShowDialog\(tab_modal\->java_obj_,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ModalDialogManagerBridge::ModalDialogType::kTab\);\

      \ \ //\ `tab_modal`\ will\ delete\ itself\ when\ dialog\ is\ dismissed\.\

      \}\

      '
    replace: "  ModalDialogWrapper* tab_modal =\n      new ModalDialogWrapper(std::move(dialog_model), window);\n  g_dialog_ptr_for_testing = tab_modal;\n  tab_modal->BuildPropertyModel();\n  Java_ModalDialogWrapper_withDialogOwner(base::android::AttachCurrentThread(),\n                                          tab_modal->java_obj_, owner);\n  dialog_manager->ShowDialog(tab_modal->java_obj_,\n                             ModalDialogManagerBridge::ModalDialogType::kTab);\n  // `tab_modal` will delete itself when dialog is dismissed.\n}\n"
- description: Preserve translated Android paragraph order, replacement callbacks and UTF-16 offsets
