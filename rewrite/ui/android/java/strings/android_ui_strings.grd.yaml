substitutions:
  - description: Use Reaper branding for the Android app menu accessibility label
    regex:
      pattern: "      <message name=\"IDS_ACCESSIBILITY_TOOLBAR_BTN_MENU\" desc=\"Content description for the settings menu button.\">\n        Customize and control Google Chrome\n      </message>"
      replace: "      <message name=\"IDS_ACCESSIBILITY_TOOLBAR_BTN_MENU\" desc=\"Content description for the settings menu button.\">\n        Customize and control Reaper\n      </message>"
    count: 1
