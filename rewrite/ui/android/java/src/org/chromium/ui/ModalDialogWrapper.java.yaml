# Android split pane request ownership and dialog placement.
substitutions:
- description: Store native callers requester identity in the model
  regex:
    re_pattern: \ \ \ \ public\ PropertyModel\ getPropertyModel\(\)\ \{
    replace: "    @CalledByNative\n    private void withDialogOwner(@Nullable Object owner) {\n        mPropertyModelBuilder.with(ModalDialogProperties.TAB_MODAL_OWNER, owner);\n    }\n\n    public PropertyModel getPropertyModel() {"
