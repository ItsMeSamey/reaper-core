substitutions:
- description: Android complete display opt-in registration and real manager regression coverage (1).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ //\ newDisplaysAbsoluteCoordinates\)\}\ when\ \{@link\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ DisplayTopologyListenerBackend\#onDisplayTopologyChanged\(SparseArray<RectF>\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ absoluteBounds\)\}\ is\ triggered\.\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ If\ Display\ Topology\ is\ not\ available,\ then\ DisplayAndroid\ is\ added\ lazily\ on\ first\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ use\.\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      '
    replace: "            // newDisplaysAbsoluteCoordinates)} when {@link\n            // DisplayTopologyListenerBackend#onDisplayTopologyChanged(SparseArray<RectF>\n            // absoluteBounds)} is triggered.\n            // Without topology, preserve lazy registration until a caller needs the complete\n            // display list (for example the extension system.display API).\n            if (!isDisplayTopologyAvailable() && mRegisterAllDisplays) {\n                updateDisplay(sdkDisplayId);\n            }\n        }\n\n        @Override\n"
- description: Android complete display opt-in registration and real manager regression coverage (2).
  regex:
    re_pattern: '\

      \ \ \ \ private\ long\ mNativePointer;\

      \ \ \ \ private\ int\ mMainSdkDisplayId;\

      \ \ \ \ @VisibleForTesting\ final\ SparseArray<DisplayAndroid>\ mIdMap\ =\ new\ SparseArray<>\(\);\

      \ \ \ \ private\ final\ DisplayListenerBackend\ mBackend\ =\ new\ DisplayListenerBackend\(\);\

      \

      '
    replace: "\n    private long mNativePointer;\n    private int mMainSdkDisplayId;\n    private boolean mRegisterAllDisplays;\n    @VisibleForTesting final SparseArray<DisplayAndroid> mIdMap = new SparseArray<>();\n    private final DisplayListenerBackend mBackend = new DisplayListenerBackend();\n\n"
- description: Android complete display opt-in registration and real manager regression coverage (3).
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ singleton\.setNativePointer\(nativePointer\);\

      \ \ \ \ \}\

      \

      \ \ \ \ private\ DisplayAndroidManager\(\)\ \{\}\

      '
    replace: "        }\n\n        singleton.setNativePointer(nativePointer);\n    }\n\n    @CalledByNative\n    static void ensureAllDisplaysRegistered() {\n        ThreadUtils.assertOnUiThread();\n        final DisplayAndroidManager singleton = getInstance();\n        if (isDisplayTopologyAvailable() || singleton.mRegisterAllDisplays) return;\n\n        // The manager already owns the process-wide DisplayListener. Keep its\n        // existing native update and removal paths; no profile/window is retained.\n        singleton.mRegisterAllDisplays = true;\n        for (Display display : getDisplayManager().getDisplays()) {\n            singleton.getDisplayAndroid(display);\n        }\n    }\n\n    private DisplayAndroidManager() {}\n"
- description: Android complete display opt-in registration and real manager regression coverage (4).
  regex:
    re_pattern: '\

      \ \ \ \ \ \ \ \ //\ Note\ display\ null\ check\ here\ is\ needed\ because\ there\ appear\ to\ be\ an\ edge\ case\ in\

      \ \ \ \ \ \ \ \ //\ android\ display\ code,\ similar\ to\ onDisplayAdded\.\

      \ \ \ \ \ \ \ \ if\ \(displayAndroid\ !=\ null\ \&\&\ display\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ displayAndroid\.updateFromDisplay\(display\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}\

      \

      '
    replace: "\n        // Note display null check here is needed because there appear to be an edge case in\n        // android display code, similar to onDisplayAdded.\n        if (display == null) return;\n        if (displayAndroid != null) {\n            displayAndroid.updateFromDisplay(display);\n        } else if (mRegisterAllDisplays && !isDisplayTopologyAvailable()) {\n            // Also recovers an added display whose first platform lookup was null.\n            getDisplayAndroid(display);\n        }\n    }\n\n"
