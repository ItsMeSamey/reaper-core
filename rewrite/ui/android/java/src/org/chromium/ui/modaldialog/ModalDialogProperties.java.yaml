# Android split pane request ownership and dialog placement.
substitutions:
- description: Carry an opaque requester identity without depending on browser or content classes
  regex:
    re_pattern: \ \ \ \ public\ static\ final\ PropertyKey\[\]\ ALL_KEYS\ =
    replace: "    /**\n     * Optional embedder-owned tab identity, captured by the requester before queueing.\n     * The generic UI layer keeps it opaque; the embedder validates and positions it.\n     */\n    public static final WritableObjectPropertyKey<Object> TAB_MODAL_OWNER =\n            new WritableObjectPropertyKey<>();\n\n    public static final PropertyKey[] ALL_KEYS ="
- description: Include requester metadata in normal dialog property models
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ NAME,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ CONTROLLER,'
    replace: "                NAME,\n                TAB_MODAL_OWNER,\n                CONTROLLER,"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ /\*\*\ Disable\ the\ scrim\ overlay\ under\ the\ dialog\.\ <b>Only\ allowed\ on\ Android\ XR\.</b>\ \*/\

      \ \ \ \ public\ static\ final\ ReadableBooleanPropertyKey\ DISABLE_SCRIM\ =\ new\ ReadableBooleanPropertyKey\(\);\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Optional\ embedder\-owned\ tab\ identity,\ captured\ by\ the\ requester\ before\ queueing\.\

      \ \ \ \ \ \*\ The\ generic\ UI\ layer\ keeps\ it\ opaque;\ the\ embedder\ validates\ and\ positions\ it\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ static\ final\ WritableObjectPropertyKey<Object>\ TAB_MODAL_OWNER\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ new\ WritableObjectPropertyKey<>\(\);\

      \

      '
    replace: "    /** Disable the scrim overlay under the dialog. <b>Only allowed on Android XR.</b> */\n    public static final ReadableBooleanPropertyKey DISABLE_SCRIM = new ReadableBooleanPropertyKey();\n\n    /**\n     * Optional embedder-owned tab identity, captured by the requester before queueing. The generic\n     * UI layer keeps it opaque; the embedder validates and positions it.\n     */\n    public static final WritableObjectPropertyKey<Object> TAB_MODAL_OWNER =\n            new WritableObjectPropertyKey<>();\n\n"
