# Android split pane request ownership and dialog placement.
substitutions:
- description: require attached shown actual Android container and window focus before UI launch
  regex:
    re_pattern: '\ \ \ \ @CalledByNative\

      \ \ \ \ private\ void\ requestFocus\(\)\ \{'
    replace: "    @CalledByNative\n    @VisibleForTesting\n    boolean isAttachedAndVisibleWithWindowFocus() {\n        View containerView = getContainerView();\n        return containerView != null\n                && containerView.isAttachedToWindow()\n                && containerView.isShown()\n                && containerView.hasWindowFocus();\n    }\n\n    @CalledByNative\n    private void requestFocus() {"
