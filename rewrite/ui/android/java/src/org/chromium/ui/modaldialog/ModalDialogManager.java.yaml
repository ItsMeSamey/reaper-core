# Keep suspended dialog queue notifications non-null and bound to their original dialog type.
substitutions:
- description: Notify ownership observers on every pending dialog insertion
  regex:
    re_pattern: \ \ \ \ \ \ \ \ default\ void\ onDialogAdded\(PropertyModel\ model\)\ \{\}
    replace: "        default void onDialogAdded(PropertyModel model) {}\n\n        /**\n         * The model entered the pending queue, including when a shown dialog is suspended.\n         * Observers may dismiss a stale request without affecting the current dialog.\n         */\n        default void onDialogQueued(PropertyModel model, @ModalDialogType int dialogType) {}"
- description: Observe queued very-high-priority requests too
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mPendingDialogContainer\.put\(dialogType,\ dialogPriority,\ model,\ showAsNext\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;'
    replace: "                mPendingDialogContainer.put(dialogType, dialogPriority, model, showAsNext);\n                for (ModalDialogManagerObserver o : mObserverList) o.onDialogQueued(model, dialogType);\n                return;"
- description: Observe pending normal-priority models without changing suppression notifications
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mPendingDialogContainer\.put\(dialogType,\ dialogPriority,\ model,\ showAsNext\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ for\ \(ModalDialogManagerObserver\ o\ :\ mObserverList\)\ o\.onDialogSuppressed\(model\);'
    replace: "                mPendingDialogContainer.put(dialogType, dialogPriority, model, showAsNext);\n                for (ModalDialogManagerObserver o : mObserverList) o.onDialogQueued(model, dialogType);\n                for (ModalDialogManagerObserver o : mObserverList) o.onDialogSuppressed(model);"
- description: Restore owner lifecycle observation when a displayed model is suspended
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mPendingDialogContainer\.put\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mCurrentType,\ mCurrentPriority,\ dialogView,\ /\*\ showAsNext=\ \*/\ true\);'
    replace: "        mPendingDialogContainer.put(\n                mCurrentType, mCurrentPriority, dialogView, /* showAsNext= */ true);\n        for (ModalDialogManagerObserver o : mObserverList) o.onDialogQueued(dialogView, mCurrentType);"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ if\ \(isShowing\(\)\ \&\&\ mCurrentPriority\ >=\ dialogPriority\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assert\ mCurrentPriority\ ==\ ModalDialogPriority\.VERY_HIGH\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ "Higher\ priority\ is\ not\ supported\.";\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mPendingDialogContainer\.put\(dialogType,\ dialogPriority,\ model,\ showAsNext\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ for\ \(ModalDialogManagerObserver\ o\ :\ mObserverList\)\ o\.onDialogQueued\(model,\ dialogType\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ Put\ the\ new\ dialog\ in\ pending\ list\ if\ the\ dialog\ type\ is\ suspended\ or\ the\ current\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ dialog\ is\ of\ higher\ priority\.\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(mSuspendedTypes\.contains\(dialogType\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ \(isShowing\(\)\ \&\&\ mCurrentPriority\ >=\ dialogPriority\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mPendingDialogContainer\.put\(dialogType,\ dialogPriority,\ model,\ showAsNext\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ for\ \(ModalDialogManagerObserver\ o\ :\ mObserverList\)\ o\.onDialogQueued\(model,\ dialogType\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ for\ \(ModalDialogManagerObserver\ o\ :\ mObserverList\)\ o\.onDialogSuppressed\(model\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: "            if (isShowing() && mCurrentPriority >= dialogPriority) {\n                assert mCurrentPriority == ModalDialogPriority.VERY_HIGH\n                        : \"Higher priority is not supported.\";\n                mPendingDialogContainer.put(dialogType, dialogPriority, model, showAsNext);\n                for (ModalDialogManagerObserver o : mObserverList)\n                    o.onDialogQueued(model, dialogType);\n                return;\n            }\n        } else {\n            // Put the new dialog in pending list if the dialog type is suspended or the current\n            // dialog is of higher priority.\n            if (mSuspendedTypes.contains(dialogType)\n                    || (isShowing() && mCurrentPriority >= dialogPriority)) {\n                mPendingDialogContainer.put(dialogType, dialogPriority, model, showAsNext);\n                for (ModalDialogManagerObserver o : mObserverList)\n                    o.onDialogQueued(model, dialogType);\n                for (ModalDialogManagerObserver o : mObserverList) o.onDialogSuppressed(model);\n                return;\n            }\n        }\n"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ mCurrentPresenter\.setDialogModel\(null,\ null,\ null,\ null\);\

      \ \ \ \ \ \ \ \ mCurrentPresenter\ =\ null;\

      \ \ \ \ \ \ \ \ mPendingDialogContainer\.put\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mCurrentType,\ mCurrentPriority,\ dialogView,\ /\*\ showAsNext=\ \*/\ true\);\

      \ \ \ \ \ \ \ \ for\ \(ModalDialogManagerObserver\ o\ :\ mObserverList\)\ o\.onDialogQueued\(dialogView,\ mCurrentType\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\ Helper\ method\ for\ showing\ the\ next\ available\ dialog\ in\ the\ pending\ dialog\ list\.\ \*/\

      \ \ \ \ private\ void\ showNextDialog\(\)\ \{\

      '
    replace: "        mCurrentPresenter.setDialogModel(null, null, null, null);\n        mCurrentPresenter = null;\n        mPendingDialogContainer.put(\n                mCurrentType, mCurrentPriority, dialogView, /* showAsNext= */ true);\n        for (ModalDialogManagerObserver o : mObserverList)\n            o.onDialogQueued(dialogView, mCurrentType);\n    }\n\n    /** Helper method for showing the next available dialog in the pending dialog list. */\n    private void showNextDialog() {\n"
- description: Do not queue an absent presenter model and preserve suspended dialog attribution across callbacks
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ PropertyModel\ dialogView\ =\ mCurrentPresenter\.getDialogModel\(\);\

      \ \ \ \ \ \ \ \ mCurrentPresenter\.setDialogModel\(null,\ null,\ null,\ null\);\

      \ \ \ \ \ \ \ \ mCurrentPresenter\ =\ null;\

      \ \ \ \ \ \ \ \ mPendingDialogContainer\.put\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mCurrentType,\ mCurrentPriority,\ dialogView,\ /\*\ showAsNext=\ \*/\ true\);\

      \ \ \ \ \ \ \ \ for\ \(ModalDialogManagerObserver\ o\ :\ mObserverList\)\

      \ \ \ \ \ \ \ \ \ \ \ \ o\.onDialogQueued\(dialogView,\ mCurrentType\);\

      '
    replace: "        PropertyModel dialogView = mCurrentPresenter.getDialogModel();\n        // Dismissal observers may run after the presenter has cleared its model.\n        if (dialogView == null) {\n            mCurrentPresenter = null;\n            return;\n        }\n        @ModalDialogType int dialogType = mCurrentType;\n        @ModalDialogPriority int dialogPriority = mCurrentPriority;\n        mCurrentPresenter.setDialogModel(null, null, null, null);\n        mCurrentPresenter = null;\n        mPendingDialogContainer.put(\n                dialogType, dialogPriority, dialogView, /* showAsNext= */ true);\n        for (ModalDialogManagerObserver o : mObserverList)\n            o.onDialogQueued(dialogView, dialogType);\n"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ @ModalDialogType\ int\ dialogType\ =\ mCurrentType;\

      \ \ \ \ \ \ \ \ @ModalDialogPriority\ int\ dialogPriority\ =\ mCurrentPriority;\

      \ \ \ \ \ \ \ \ mCurrentPresenter\.setDialogModel\(null,\ null,\ null,\ null\);\

      \ \ \ \ \ \ \ \ mCurrentPresenter\ =\ null;\

      \ \ \ \ \ \ \ \ mPendingDialogContainer\.put\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ dialogType,\ dialogPriority,\ dialogView,\ /\*\ showAsNext=\ \*/\ true\);\

      \ \ \ \ \ \ \ \ for\ \(ModalDialogManagerObserver\ o\ :\ mObserverList\)\

      \ \ \ \ \ \ \ \ \ \ \ \ o\.onDialogQueued\(dialogView,\ dialogType\);\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\ Helper\ method\ for\ showing\ the\ next\ available\ dialog\ in\ the\ pending\ dialog\ list\.\ \*/\

      \ \ \ \ private\ void\ showNextDialog\(\)\ \{\

      '
    replace: "        @ModalDialogType int dialogType = mCurrentType;\n        @ModalDialogPriority int dialogPriority = mCurrentPriority;\n        mCurrentPresenter.setDialogModel(null, null, null, null);\n        mCurrentPresenter = null;\n        mPendingDialogContainer.put(dialogType, dialogPriority, dialogView, /* showAsNext= */ true);\n        for (ModalDialogManagerObserver o : mObserverList) o.onDialogQueued(dialogView, dialogType);\n    }\n\n    /** Helper method for showing the next available dialog in the pending dialog list. */\n    private void showNextDialog() {\n"
