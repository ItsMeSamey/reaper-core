substitutions:
- description: Preserve translated Android paragraph order, replacement callbacks and UTF-16 offsets
  regex:
    re_pattern: '\

      \#include\ "base/android/jni_android\.h"\

      \#include\ "base/android/scoped_java_ref\.h"\

      \#include\ "base/functional/bind\.h"\

      \#include\ "base/functional/callback\.h"\

      \#include\ "base/functional/callback_helpers\.h"\

      '
    replace: '

      #include "base/android/jni_android.h"

      #include "base/android/scoped_java_ref.h"

      #include "base/files/file_path.h"

      #include "base/functional/bind.h"

      #include "base/functional/callback.h"

      #include "base/functional/callback_helpers.h"

      '
- description: Preserve translated Android paragraph order, replacement callbacks and UTF-16 offsets
  regex:
    re_pattern: '\ \ EXPECT_TRUE\(callbacks_called\[cancel_index\]\);\

      \}\

      \

      TEST_F\(ModalDialogWrapperTest,\ Checkbox_InitialStateUnchecked\)\ \{\

      \ \ auto\ dialog_model\ =\

      \ \ \ \ \ \ DialogModelBuilder\(\&dialog_destroyed_\)\.WithCheckbox\(false\)\.Build\(\);\

      '
    replace: "  EXPECT_TRUE(callbacks_called[cancel_index]);\n}\n\nTEST_F(ModalDialogWrapperTest, ParagraphReplacementsFollowLocalizedOrder) {\n  ResourceBundle::SharedInstanceSwapperForTesting restore_resources;\n  ResourceBundle::InitSharedInstanceWithPakPath(base::FilePath());\n  base::ScopedClosureRunner cleanup_resources(\n      base::BindOnce(&ResourceBundle::CleanupSharedInstance));\n  auto& resources = ResourceBundle::GetSharedInstance();\n  resources.OverrideLocaleStringResource(IDS_APP_OK, u\"First\");\n  resources.OverrideLocaleStringResource(IDS_APP_CLOSE, u\"Third\");\n  resources.OverrideLocaleStringResource(\n      IDS_CONCAT_THREE_STRINGS_WITH_COMMA,\n      u\"Before $3, then $1 and $2 after.\");\n  std::vector<int> clicked;\n  auto dialog_model =\n      DialogModel::Builder()\n          .SetTitle(u\"Localized replacements\")\n          .AddOkButton(base::DoNothing())\n          .SetDialogDestroyingCallback(\n              base::BindLambdaForTesting([&]() { dialog_destroyed_ = true; }))\n          .AddParagraph(DialogModelLabel::CreateWithReplacements(\n              IDS_CONCAT_THREE_STRINGS_WITH_COMMA,\n              {DialogModelLabel::CreateLink(\n                   IDS_APP_OK,\n                   base::BindLambdaForTesting([&]() { clicked.push_back(1); })),\n               DialogModelLabel::CreatePlainText(u\"PLAIN\"),\n               DialogModelLabel::CreateLink(\n                   IDS_APP_CLOSE,\n                   base::BindLambdaForTesting([&]() { clicked.push_back(3); }))}))\n          .Build();\n  ModalDialogWrapper::ShowTabModal(std::move(dialog_model), window_->get());\n  base::ScopedClosureRunner close_dialog(base::BindLambdaForTesting([&]() {\n    if (!dialog_destroyed_) {\n      ModalDialogWrapper::GetDialogForTesting()->Close();\n    }\n  }));\n\n  const auto paragraphs = fake_dialog_manager_->GetMessageParagraphs();\n  ASSERT_EQ(1u, paragraphs.size());\n  EXPECT_EQ(u\"Before Third, then First and PLAIN after.\", paragraphs[0]);\n  EXPECT_TRUE(clicked.empty());\n  fake_dialog_manager_->ClickLinkInMessageParagraphs(0);\n  EXPECT_EQ((std::vector<int>{3}), clicked);\n  fake_dialog_manager_->ClickLinkInMessageParagraphs(1);\n  EXPECT_EQ((std::vector<int>{3, 1}), clicked);\n  fake_dialog_manager_->ClickPositiveButton();\n  EXPECT_TRUE(dialog_destroyed_);\n}\n\nTEST_F(ModalDialogWrapperTest, EmptyReorderedReplacementDoesNotRepeatText) {\n  ResourceBundle::SharedInstanceSwapperForTesting restore_resources;\n  ResourceBundle::InitSharedInstanceWithPakPath(base::FilePath());\n  base::ScopedClosureRunner cleanup_resources(\n      base::BindOnce(&ResourceBundle::CleanupSharedInstance));\n  auto& resources = ResourceBundle::GetSharedInstance();\n  resources.OverrideLocaleStringResource(IDS_APP_OK, u\"First\");\n  resources.OverrideLocaleStringResource(IDS_APP_CLOSE, u\"Third\");\n  // $2 is empty and shares its offset with $1, despite being first on screen.\n  resources.OverrideLocaleStringResource(IDS_CONCAT_THREE_STRINGS_WITH_COMMA,\n                                        u\"$2$1|$3\");\n  std::vector<int> clicked;\n  auto dialog_model =\n      DialogModel::Builder()\n          .SetTitle(u\"Empty localized replacement\")\n          .AddOkButton(base::DoNothing())\n          .SetDialogDestroyingCallback(\n              base::BindLambdaForTesting([&]() { dialog_destroyed_ = true; }))\n          .AddParagraph(DialogModelLabel::CreateWithReplacements(\n              IDS_CONCAT_THREE_STRINGS_WITH_COMMA,\n              {DialogModelLabel::CreateLink(\n                   IDS_APP_OK,\n                   base::BindLambdaForTesting([&]() { clicked.push_back(1); })),\n               DialogModelLabel::CreatePlainText(u\"\"),\n               DialogModelLabel::CreateLink(\n                   IDS_APP_CLOSE,\n                   base::BindLambdaForTesting([&]() { clicked.push_back(3); }))}))\n          .Build();\n  ModalDialogWrapper::ShowTabModal(std::move(dialog_model), window_->get());\n  base::ScopedClosureRunner close_dialog(base::BindLambdaForTesting([&]() {\n    if (!dialog_destroyed_) {\n      ModalDialogWrapper::GetDialogForTesting()->Close();\n    }\n  }));\n\n  const auto paragraphs = fake_dialog_manager_->GetMessageParagraphs();\n  ASSERT_EQ(1u, paragraphs.size());\n  EXPECT_EQ(u\"First|Third\", paragraphs[0]);\n  EXPECT_TRUE(clicked.empty());\n  fake_dialog_manager_->ClickLinkInMessageParagraphs(0);\n  EXPECT_EQ((std::vector<int>{1}), clicked);\n  fake_dialog_manager_->ClickLinkInMessageParagraphs(1);\n  EXPECT_EQ((std::vector<int>{1, 3}), clicked);\n  fake_dialog_manager_->ClickPositiveButton();\n  EXPECT_TRUE(dialog_destroyed_);\n}\n\nTEST_F(ModalDialogWrapperTest, ReorderedReplacementsPreserveUtf16Offsets) {\n  ResourceBundle::SharedInstanceSwapperForTesting restore_resources;\n  ResourceBundle::InitSharedInstanceWithPakPath(base::FilePath());\n  base::ScopedClosureRunner cleanup_resources(\n      base::BindOnce(&ResourceBundle::CleanupSharedInstance));\n  auto& resources = ResourceBundle::GetSharedInstance();\n  resources.OverrideLocaleStringResource(IDS_APP_OK, u\"First \\\\U0001F9E9\");\n  resources.OverrideLocaleStringResource(IDS_APP_CLOSE, u\"\\\\U0001F512 Third\");\n  resources.OverrideLocaleStringResource(\n      IDS_CONCAT_THREE_STRINGS_WITH_COMMA,\n      u\"\\\\U0001F680 $3, then $1 and $2 \\\\U0001F31F\");\n  std::vector<int> clicked;\n  auto dialog_model =\n      DialogModel::Builder()\n          .SetTitle(u\"UTF-16 localized replacements\")\n          .AddOkButton(base::DoNothing())\n          .SetDialogDestroyingCallback(\n              base::BindLambdaForTesting([&]() { dialog_destroyed_ = true; }))\n          .AddParagraph(DialogModelLabel::CreateWithReplacements(\n              IDS_CONCAT_THREE_STRINGS_WITH_COMMA,\n              {DialogModelLabel::CreateLink(\n                   IDS_APP_OK,\n                   base::BindLambdaForTesting([&]() { clicked.push_back(1); })),\n               DialogModelLabel::CreatePlainText(u\"\\\\U0001F4C4 plain\"),\n               DialogModelLabel::CreateLink(\n                   IDS_APP_CLOSE,\n                   base::BindLambdaForTesting([&]() { clicked.push_back(3); }))}))\n          .Build();\n  ModalDialogWrapper::ShowTabModal(std::move(dialog_model), window_->get());\n  base::ScopedClosureRunner close_dialog(base::BindLambdaForTesting([&]() {\n    if (!dialog_destroyed_) {\n      ModalDialogWrapper::GetDialogForTesting()->Close();\n    }\n  }));\n\n  const auto paragraphs = fake_dialog_manager_->GetMessageParagraphs();\n  ASSERT_EQ(1u, paragraphs.size());\n  EXPECT_EQ(u\"\\\\U0001F680 \\\\U0001F512 Third, then First \\\\U0001F9E9 and \"\n            u\"\\\\U0001F4C4 plain \\\\U0001F31F\",\n            paragraphs[0]);\n  EXPECT_TRUE(clicked.empty());\n  fake_dialog_manager_->ClickLinkInMessageParagraphs(0);\n  EXPECT_EQ((std::vector<int>{3}), clicked);\n  fake_dialog_manager_->ClickLinkInMessageParagraphs(1);\n  EXPECT_EQ((std::vector<int>{3, 1}), clicked);\n  fake_dialog_manager_->ClickPositiveButton();\n  EXPECT_TRUE(dialog_destroyed_);\n}\n\nTEST_F(ModalDialogWrapperTest, Checkbox_InitialStateUnchecked) {\n  auto dialog_model =\n      DialogModelBuilder(&dialog_destroyed_).WithCheckbox(false).Build();\n"
