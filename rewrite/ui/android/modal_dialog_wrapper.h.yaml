# Android split pane request ownership and dialog placement.
substitutions:
- description: Let tab-scoped callers supply their requester without a UI-to-content dependency
  regex:
    re_pattern: \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ui::WindowAndroid\*\ window\);
    replace: "                           ui::WindowAndroid* window,\n                           const base::android::JavaRef<jobject>& owner =\n                               base::android::ScopedJavaLocalRef<jobject>());"
