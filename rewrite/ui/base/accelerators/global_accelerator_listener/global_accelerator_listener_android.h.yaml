# Opt-in Android global extension hardware shortcuts.
substitutions:
- description: Declare generic Android global-shortcut backend callbacks
  regex:
    re_pattern: \#include\ "base/memory/raw_ptr\.h"
    replace: '#include "base/callback_list.h"

      #include "base/functional/callback.h"

      #include "base/memory/weak_ptr.h"

      #include "base/memory/raw_ptr.h"'
- description: Own complete native accelerator values
  regex:
    re_pattern: \#include\ "base/types/pass_key\.h"
    replace: '#include "base/types/pass_key.h"

      #include "ui/base/accelerators/accelerator.h"'
- description: Document opt-in Android backend availability
  regex:
    re_pattern: //\ Currently\ it\ does\ nothing\.
    replace: '// The embedder may attach an explicitly user-enabled platform key service.

      // Without an available backend registration fails normally.'
- description: Expose embedder-neutral availability and hardware-event boundary
  regex:
    re_pattern: '\ private:\

      \ \ //\ GlobalAcceleratorListener:'
    replace: "  using RegistrationCallback =\n      base::RepeatingCallback<bool(const Accelerator&, bool register_shortcut)>;\n  // All methods run on the browser UI thread. Ownership is exact: a stale\n  // service cannot detach or dispatch through its replacement.\n  bool AttachBackend(const void* owner, RegistrationCallback callback);\n  void DetachBackend(const void* owner);\n  bool HasBackend() const;\n  bool DispatchAccelerator(const void* owner, const Accelerator& accelerator);\n  base::CallbackListSubscription AddBackendObserver(base::RepeatingClosure callback);\n  void RefreshBackendRegistrations();\n\n private:\n  // GlobalAcceleratorListener:"
- description: Own only live platform registrations and availability subscriptions
  regex:
    re_pattern: \ \ void\ StopListeningForAccelerator\(const\ Accelerator\&\ accelerator\)\ override;
    replace: "  void StopListeningForAccelerator(const Accelerator& accelerator) override;\n\n  const void* backend_owner_ = nullptr;\n  RegistrationCallback registration_callback_;\n  std::set<Accelerator> registered_accelerators_;\n  base::RepeatingClosureList backend_observers_;\n  bool refresh_pending_ = false;\n  base::WeakPtrFactory<GlobalAcceleratorListenerAndroid> weak_factory_{this};"
- description: Format Android global shortcuts changes
  regex:
    re_pattern: '\#include\ <set>\

      \

      \#include\ "base/callback_list\.h"\

      \#include\ "base/functional/callback\.h"\

      \#include\ "base/memory/weak_ptr\.h"\

      \#include\ "base/memory/raw_ptr\.h"\

      \#include\ "base/types/pass_key\.h"\

      \#include\ "ui/base/accelerators/accelerator\.h"\

      \#include\ "ui/base/accelerators/global_accelerator_listener/global_accelerator_listener\.h"\

      \#include\ "ui/events/keycodes/keyboard_codes\.h"\

      '
    replace: '#include <set>


      #include "base/callback_list.h"

      #include "base/functional/callback.h"

      #include "base/memory/raw_ptr.h"

      #include "base/memory/weak_ptr.h"

      #include "base/types/pass_key.h"

      #include "ui/base/accelerators/accelerator.h"

      #include "ui/base/accelerators/global_accelerator_listener/global_accelerator_listener.h"

      #include "ui/events/keycodes/keyboard_codes.h"

      '
- description: Format Android global shortcuts changes
  regex:
    re_pattern: '\ \ bool\ AttachBackend\(const\ void\*\ owner,\ RegistrationCallback\ callback\);\

      \ \ void\ DetachBackend\(const\ void\*\ owner\);\

      \ \ bool\ HasBackend\(\)\ const;\

      \ \ bool\ DispatchAccelerator\(const\ void\*\ owner,\ const\ Accelerator\&\ accelerator\);\

      \ \ base::CallbackListSubscription\ AddBackendObserver\(base::RepeatingClosure\ callback\);\

      \ \ void\ RefreshBackendRegistrations\(\);\

      \

      \ private:\

      \ \ //\ GlobalAcceleratorListener:\

      '
    replace: "  bool AttachBackend(const void* owner, RegistrationCallback callback);\n  void DetachBackend(const void* owner);\n  bool HasBackend() const;\n  bool DispatchAccelerator(const void* owner, const Accelerator& accelerator);\n  base::CallbackListSubscription AddBackendObserver(\n      base::RepeatingClosure callback);\n  void RefreshBackendRegistrations();\n\n private:\n  // GlobalAcceleratorListener:\n"
- description: Correct Android extension declaration and protected test callback compiler errors without changing dispatch semantics
  regex:
    re_pattern: '\ \ bool\ StartListeningForAccelerator\(const\ Accelerator\&\ accelerator\)\ override;\

      \ \ void\ StopListeningForAccelerator\(const\ Accelerator\&\ accelerator\)\ override;\

      \

      \ \ const\ void\*\ backend_owner_\ =\ nullptr;\

      \ \ RegistrationCallback\ registration_callback_;\

      \ \ std::set<Accelerator>\ registered_accelerators_;\

      \ \ base::RepeatingClosureList\ backend_observers_;\

      '
    replace: "  bool StartListeningForAccelerator(const Accelerator& accelerator) override;\n  void StopListeningForAccelerator(const Accelerator& accelerator) override;\n\n  raw_ptr<const void> backend_owner_ = nullptr;\n  RegistrationCallback registration_callback_;\n  std::set<Accelerator> registered_accelerators_;\n  base::RepeatingClosureList backend_observers_;\n"
