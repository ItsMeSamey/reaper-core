substitutions:
- description: "SAF557: preserve picker location separately from registered paths (1)."
  count: 1
  regex:
    pattern: "  // If default_path ends with a separator, then suggested_name was empty.\n  if (default_path.EndsWithSeparator()) {"
    replace: "  // A folder picker receives a directory, not a suggested filename.\n  const bool is_directory_picker =\n      type == SelectFileDialog::SELECT_FOLDER ||\n      type == SelectFileDialog::SELECT_UPLOAD_FOLDER ||\n      type == SelectFileDialog::SELECT_EXISTING_FOLDER;\n  // For file pickers, a trailing separator means no suggested filename.\n  if (is_directory_picker || default_path.EndsWithSeparator()) {"
