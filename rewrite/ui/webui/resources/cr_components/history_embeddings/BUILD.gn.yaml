# Android omits the optional AI frontend; ordinary history/search controls stay selected.
substitutions:
- description: 'Exclude optional history/composebox AI frontend targets on Android: ui/webui/resources/cr_components/history_embeddings/BUILD.gn'
  regex:
    re_pattern: '\#\ Copyright\ 2024\ The\ Chromium\ Authors\

      \#\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      \#\ found\ in\ the\ LICENSE\ file\.\

      \

      import\("//mojo/public/tools/bindings/mojom\.gni"\)\

      import\("//ui/webui/resources/tools/build_webui\.gni"\)\

      import\("//ui/webui/webui_features\.gni"\)\

      \

      assert\(!is_android\ \|\|\ is_desktop_android\)\

      \

      mojom\("mojo_bindings"\)\ \{\

      \ \ sources\ =\ \[\ "history_embeddings\.mojom"\ \]\

      \ \ webui_module_path\ =\ ""\

      \ \ public_deps\ =\ \[\

      \ \ \ \ "//mojo/public/mojom/base",\

      \ \ \ \ "//url/mojom:url_mojom_gurl",\

      \ \ \]\

      \}\

      \

      build_webui\("build"\)\ \{\

      \ \ grd_prefix\ =\ "cr_components_history_embeddings"\

      \ \ ts_files\ =\ \[\

      \ \ \ \ "filter_chips\.html\.ts",\

      \ \ \ \ "filter_chips\.ts",\

      \ \ \ \ "history_embeddings\.html\.ts",\

      \ \ \ \ "history_embeddings\.ts",\

      \ \ \ \ "result_image\.html\.ts",\

      \ \ \ \ "result_image\.ts",\

      \ \ \]\

      \ \ css_files\ =\ \[\

      \ \ \ \ "filter_chips\.css",\

      \ \ \ \ "history_embeddings\.css",\

      \ \ \ \ "result_image\.css",\

      \ \ \]\

      \ \ icons_html_files\ =\ \[\ "icons\.html"\ \]\

      \

      \ \ mojo_files_deps\ =\ \[\ ":mojo_bindings_ts__generator"\ \]\

      \ \ mojo_files\ =\ \[\ "\$target_gen_dir/history_embeddings\.mojom\-webui\.ts"\ \]\

      \

      \ \ ts_out_dir\ =\

      \ \ \ \ \ \ "\$root_gen_dir/ui/webui/resources/tsc/cr_components/history_embeddings"\

      \ \ ts_composite\ =\ true\

      \ \ ts_deps\ =\ \[\

      \ \ \ \ "\.\./page_image_service:build_ts",\

      \ \ \ \ "//third_party/lit/v3_0:build_ts",\

      \ \ \ \ "//ui/webui/resources/cr_components/history:build_ts",\

      \ \ \ \ "//ui/webui/resources/cr_elements:build_ts",\

      \ \ \ \ "//ui/webui/resources/js:build_ts",\

      \ \ \ \ "//ui/webui/resources/mojo:build_ts",\

      \ \ \]\

      \ \ webui_context_type\ =\ "relative"\

      \ \ generate_grdp\ =\ true\

      \ \ grd_resource_path_prefix\ =\ rebase_path\("\.",\ "//ui/webui/resources"\)\

      \}\

      '
    replace: "if (!is_android) {\n  # Copyright 2024 The Chromium Authors\n  # Use of this source code is governed by a BSD-style license that can be\n  # found in the LICENSE file.\n\n  import(\"//mojo/public/tools/bindings/mojom.gni\")\n  import(\"//ui/webui/resources/tools/build_webui.gni\")\n  import(\"//ui/webui/webui_features.gni\")\n\n  assert(!is_android || is_desktop_android)\n\n  mojom(\"mojo_bindings\") {\n    sources = [ \"history_embeddings.mojom\" ]\n    webui_module_path = \"\"\n    public_deps = [\n      \"//mojo/public/mojom/base\",\n      \"//url/mojom:url_mojom_gurl\",\n    ]\n  }\n\n  build_webui(\"build\") {\n    grd_prefix = \"cr_components_history_embeddings\"\n    ts_files = [\n      \"filter_chips.html.ts\",\n      \"filter_chips.ts\",\n      \"history_embeddings.html.ts\",\n      \"history_embeddings.ts\",\n      \"result_image.html.ts\",\n      \"result_image.ts\",\n    ]\n    css_files = [\n      \"filter_chips.css\",\n      \"history_embeddings.css\",\n      \"result_image.css\",\n    ]\n    icons_html_files = [ \"icons.html\" ]\n\n    mojo_files_deps = [ \":mojo_bindings_ts__generator\" ]\n    mojo_files = [ \"$target_gen_dir/history_embeddings.mojom-webui.ts\" ]\n\n    ts_out_dir =\n        \"$root_gen_dir/ui/webui/resources/tsc/cr_components/history_embeddings\"\n    ts_composite = true\n    ts_deps = [\n      \"../page_image_service:build_ts\",\n      \"//third_party/lit/v3_0:build_ts\",\n      \"//ui/webui/resources/cr_components/history:build_ts\",\n      \"//ui/webui/resources/cr_elements:build_ts\",\n      \"//ui/webui/resources/js:build_ts\",\n      \"//ui/webui/resources/mojo:build_ts\",\n    ]\n    webui_context_type = \"relative\"\n    generate_grdp = true\n    grd_resource_path_prefix = rebase_path(\".\", \"//ui/webui/resources\")\n  }\n}\n"
  count: 1
