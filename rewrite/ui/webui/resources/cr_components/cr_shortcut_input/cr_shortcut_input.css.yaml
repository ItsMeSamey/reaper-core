substitutions:
- description: Fit Android extension shortcut controls within narrow cards
  regex:
    re_pattern: '\ \#main\ \{\

      \ \ position:\ relative;\

      \ \ width:\ 200px;\

      \}\

      \

      \#input\ \{\

      '
    replace: " #main {\n  position: relative;\n  width: 200px;\n<if expr=\"is_android\">\n  max-width: 100%;\n</if>\n}\n\n#input {\n"
