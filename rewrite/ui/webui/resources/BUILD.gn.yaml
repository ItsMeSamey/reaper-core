substitutions:
  - description: Add the Brave grdp files to the WebUI resources.
    add_literal_to_list:
      target: build_grd
      list_name: grdp_files
      literal: brave_resources_extra_grdps
      import: //brave/ui/webui/resources/sources.gni

  - description: Depend on the targets producing the Brave grdp files.
    add_literal_to_list:
      target: build_grd
      list_name: public_deps
      literal: brave_resources_extra_grdps_deps
      import: //brave/ui/webui/resources/sources.gni

  - description: 'Exclude optional history/composebox AI frontend targets on Android: ui/webui/resources/BUILD.gn'
    regex:
      re_pattern: '\ \ if\ \(!is_ios\)\ \{\

        \ \ \ \ \#\ TODO\(crbug\.com/527601593\):\ Revert\ by\ moving\ these\ components\ back\ into\ the\

        \ \ \ \ \#\ main\ desktop\ block\ at\ L53\ if\ we\ disable\ composebox\ on\ Android\ phones\.\

        \ \ \ \ public_deps\ \+=\ \[\

        \ \ \ \ \ \ "cr_components/composebox:build_grdp",\

        \ \ \ \ \ \ "cr_components/help_bubble:build_grdp",\

        \ \ \ \ \ \ "cr_components/localized_link:build_grdp",\

        \ \ \ \ \ \ "cr_components/search:build_grdp",\

        \ \ \ \ \ \ "cr_components/searchbox/icons:build_grdp",\

        \ \ \ \ \]\

        \ \ \ \ grdp_files\ \+=\ \[\

        \ \ \ \ \ \ "\$target_gen_dir/cr_components/composebox/resources\.grdp",\

        \ \ \ \ \ \ "\$target_gen_dir/cr_components/help_bubble/resources\.grdp",\

        \ \ \ \ \ \ "\$target_gen_dir/cr_components/localized_link/resources\.grdp",\

        \ \ \ \ \ \ "\$target_gen_dir/cr_components/search/resources\.grdp",\

        \ \ \ \ \ \ "\$target_gen_dir/cr_components/searchbox/icons/resources\.grdp",\

        \ \ \ \ \]\

        \ \ \ \ if\ \(is_chrome_branded\)\ \{\

        \ \ \ \ \ \ public_deps\ \+=\

        \ \ \ \ \ \ \ \ \ \ \[\ "cr_components/searchbox/icons:chrome_branded_build_grdp"\ \]\

        \ \ \ \ \ \ grdp_files\ \+=\ \[\ "\$target_gen_dir/cr_components/searchbox/icons/chrome_branded_resources\.grdp"\ \]\

        \ \ \ \ \}\

        \ \ \}\

        '
      replace: "  if (!is_ios) {\n    # TODO(crbug.com/527601593): Revert by moving these components back into the\n    # main desktop block at L53 if we disable composebox on Android phones.\n    public_deps += [\n      \"cr_components/composebox:build_grdp\",\n      \"cr_components/help_bubble:build_grdp\",\n      \"cr_components/localized_link:build_grdp\",\n      \"cr_components/search:build_grdp\",\n      \"cr_components/searchbox/icons:build_grdp\",\n    ]\n    grdp_files += [\n      \"$target_gen_dir/cr_components/composebox/resources.grdp\",\n      \"$target_gen_dir/cr_components/help_bubble/resources.grdp\",\n      \"$target_gen_dir/cr_components/localized_link/resources.grdp\",\n      \"$target_gen_dir/cr_components/search/resources.grdp\",\n      \"$target_gen_dir/cr_components/searchbox/icons/resources.grdp\",\n    ]\n    if (is_chrome_branded) {\n      public_deps +=\n          [ \"cr_components/searchbox/icons:chrome_branded_build_grdp\" ]\n      grdp_files += [ \"$target_gen_dir/cr_components/searchbox/icons/chrome_branded_resources.grdp\" ]\n    }\n  }\n\n  # Reaper keeps shared history/search controls, without optional AI frontends.\n  if (is_android) {\n    if (is_desktop_android) {\n      public_deps -= [\n        \"cr_components/history_embeddings:build_grdp\",\n        \"cr_components/searchbox:build_grdp\",\n      ]\n      grdp_files -= [\n        \"$target_gen_dir/cr_components/history_embeddings/resources.grdp\",\n        \"$target_gen_dir/cr_components/searchbox/resources.grdp\",\n      ]\n    }\n    public_deps -= [ \"cr_components/composebox:build_grdp\" ]\n    grdp_files -= [ \"$target_gen_dir/cr_components/composebox/resources.grdp\" ]\n  }\n"
    count: 1
