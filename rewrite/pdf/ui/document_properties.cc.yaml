substitutions:
- description: Compile localized formatter dependencies only when PDF viewer strings are built
  regex:
    pattern: '#include "base/i18n/number_formatting.h"

      '
    replace: '#if BUILDFLAG(ENABLE_PDF)

      #include "base/i18n/number_formatting.h"

      '
  count: 1
- description: Close localized dependencies before the shared PDF namespace
  regex:
    pattern: 'using printing::kPointsPerInch;

      '
    replace: 'using printing::kPointsPerInch;

      #endif  // BUILDFLAG(ENABLE_PDF)

      '
  count: 1
- description: Compile the exact existing localized helper and formatter bodies only with their resource provider
  regex:
    pattern: 'namespace chrome_pdf {


      namespace {

      '
    replace: 'namespace chrome_pdf {


      #if BUILDFLAG(ENABLE_PDF)

      namespace {

      '
  count: 1
- description: Retain the exact PDF version implementation on Android and non-Android
  regex:
    pattern: 'std::string FormatPdfVersion(PdfVersion version) {

      '
    replace: '#endif  // BUILDFLAG(ENABLE_PDF)


      std::string FormatPdfVersion(PdfVersion version) {

      '
  count: 1
