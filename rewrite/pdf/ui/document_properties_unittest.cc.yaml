substitutions:
- description: Keep existing localized format fixture with its implementation and strings
  regex:
    pattern: 'class FormatPageSizeTest : public testing::Test {

      '
    replace: '#if BUILDFLAG(ENABLE_PDF)

      class FormatPageSizeTest : public testing::Test {

      '
  count: 1
- description: Preserve anonymous-namespace and version-test visibility on Android
  regex:
    pattern: '  std::optional<base::i18n::ScopedDefaultIcuLocale> icu_locale_override_;

      };

      '
    replace: '  std::optional<base::i18n::ScopedDefaultIcuLocale> icu_locale_override_;

      };

      #endif  // BUILDFLAG(ENABLE_PDF)

      '
  count: 1
- description: Select existing localized tests only when the tested implementation and real strings are present
  regex:
    pattern: 'TEST_F(FormatPageSizeTest, NoUniformSize) {

      '
    replace: '#if BUILDFLAG(ENABLE_PDF)

      TEST_F(FormatPageSizeTest, NoUniformSize) {

      '
  count: 1
- description: Keep both original PDF version tests enabled on Android
  regex:
    pattern: 'TEST(FormatPdfVersion, Valid) {

      '
    replace: '#endif  // BUILDFLAG(ENABLE_PDF)


      TEST(FormatPdfVersion, Valid) {

      '
  count: 1
