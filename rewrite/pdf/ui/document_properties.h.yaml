substitutions:
- description: Use the generated PDF buildflag shared with the real localized resource provider
  regex:
    pattern: '#include "pdf/document_metadata.h"

      '
    replace: '#include "pdf/buildflags.h"

      #include "pdf/document_metadata.h"

      '
  count: 1
- description: Declare the viewer-only localized page-size formatter only when its resource provider is built
  regex:
    pattern: '// Formats `size_points` of a page to a localized string suitable for display to

      '
    replace: '#if BUILDFLAG(ENABLE_PDF)

      // Formats `size_points` of a page to a localized string suitable for display to

      '
  count: 1
- description: Keep nonlocalized PDF version formatting outside the viewer-resource boundary
  regex:
    pattern: 'std::u16string FormatPageSize(const std::optional<gfx::Size>& size_points);

      '
    replace: 'std::u16string FormatPageSize(const std::optional<gfx::Size>& size_points);

      #endif  // BUILDFLAG(ENABLE_PDF)

      '
  count: 1
