    re_pattern: \ \ return\ engine_exports\->RenderPDFPageToBitmap\(pdf_buffer,\ page_index,\ settings,
    replace: "#if BUILDFLAG(IS_ANDROID)\n  settings.bounds_are_device_units = options.bounds_are_device_units;\n#endif\n  return engine_exports->RenderPDFPageToBitmap(pdf_buffer, page_index, settings,"
