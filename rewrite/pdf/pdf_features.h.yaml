substitutions:
- description: Preserve the desktop PDF-feature assertion while allowing the existing Android extension-printing backend without
    enabling viewer feature flags.
  regex:
    pattern: 'static_assert(BUILDFLAG(ENABLE_PDF), "ENABLE_PDF not set to true");

      '
    replace: '// Android extension printing uses the real PDF backend without the viewer.

      #if !BUILDFLAG(IS_ANDROID)

      static_assert(BUILDFLAG(ENABLE_PDF), "ENABLE_PDF not set to true");

      #endif

      '
  count: 1
