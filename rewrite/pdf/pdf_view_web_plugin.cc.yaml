substitutions:
- description: Reviewed literal edit 1
  regex:
    pattern: '#include "base/values.h"

      '
    replace: '#include "base/values.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Reviewed literal edit 2
  regex:
    pattern: "      (void)image_data_.tryAllocPixels(SkImageInfo::MakeN32(\n          new_image_size.width(), new_image_size.height(),\
      \ alpha_type));\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n      // The engine buffer uses PDFium's BGRA order, independent of Skia N32.\n \
      \     (void)image_data_.tryAllocPixels(SkImageInfo::Make(\n          new_image_size.width(), new_image_size.height(),\n\
      \          kBGRA_8888_SkColorType, alpha_type));\n#else\n      (void)image_data_.tryAllocPixels(SkImageInfo::MakeN32(\n\
      \          new_image_size.width(), new_image_size.height(), alpha_type));\n#endif\n"
  count: 1
