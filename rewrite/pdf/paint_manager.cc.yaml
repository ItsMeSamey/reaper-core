- description: Reviewed literal edit 2
  regex:
    pattern: "    static_assert(SkColorType::kN32_SkColorType ==\n                  SkColorType::kBGRA_8888_SkColorType);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    static_assert(SkColorType::kN32_SkColorType ==\n                  SkColorType::kBGRA_8888_SkColorType);\n\
      #endif\n"
  count: 1
- description: Reviewed literal edit 3
  regex:
    pattern: "      image_info_ = SkImageInfo::MakeN32(padded_new_size.width(),\n                                        \
      \ padded_new_size.height(), alpha_type);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n      // PDFium writes BGRA even when Skia's native Android format is RGBA.\n   \
      \   image_info_ = SkImageInfo::Make(\n          padded_new_size.width(), padded_new_size.height(),\n          kBGRA_8888_SkColorType,\
      \ alpha_type);\n#else\n      image_info_ = SkImageInfo::MakeN32(padded_new_size.width(),\n                         \
      \                padded_new_size.height(), alpha_type);\n#endif\n"
