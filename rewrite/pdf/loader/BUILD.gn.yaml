substitutions:
- description: Allow existing PDF loader dependency for the Android conversion library.
  regex:
    re_pattern: import\("//pdf/features\.gni"\)
    replace: 'import("//extensions/buildflags/buildflags.gni")

      import("//pdf/features.gni")'
- description: Permit PDF conversion library loader without the browser viewer.
  regex:
    re_pattern: assert\(enable_pdf\)
    replace: assert(enable_pdf || (is_android && enable_extensions_core))
- description: Allow the owning PDF Android test template auxiliaries to access the test-only loader helper.
  regex:
    pattern: '  visibility = [ "//pdf:pdf_unittests${exec_target_suffix}" ]'
    replace: "  visibility = [ \"//pdf:pdf_unittests${exec_target_suffix}\" ]\n  if (is_android) {\n    # Android test() expands into native, JNI metadata, and APK targets in\n    # //pdf. Keep this helper testonly; desktop keeps its exact test label.\n    visibility += [ \"//pdf:*\" ]\n  }"
