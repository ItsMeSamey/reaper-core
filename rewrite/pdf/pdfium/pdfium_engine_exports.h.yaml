substitutions:
- description: Opt in Android PWG rendering to physical bitmap bounds.
  regex:
    re_pattern: \ \ \ \ bool\ render_for_printing;
    replace: "    bool render_for_printing;\n#if BUILDFLAG(IS_ANDROID)\n  // The Android PWG caller supplies physical bitmap dimensions per axis.\n  bool bounds_are_device_units = false;\n#endif"
