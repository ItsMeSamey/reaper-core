substitutions:
- description: Correct anisotropic PWG positioning while keeping physical bitmap allocation.
  regex:
    re_pattern: '\ \ gfx::Rect\ dest;\

      \ \ int\ rotate\ =\ CalculatePosition\(page,\ settings,\ \&dest\);\

      \

      \ \ ScopedFPDFBitmap\ bitmap\('
    replace: "  gfx::Rect dest;\n#if BUILDFLAG(IS_ANDROID)\n  PDFiumEngineExports::RenderingSettings positioning(settings);\n  if (settings.bounds_are_device_units) {\n    const int dpi_x = settings.dpi.width();\n    const int dpi_y = settings.dpi.height();\n    if (dpi_x <= 0 || dpi_y <= 0)\n      return false;\n    const int max_dpi = std::max(dpi_x, dpi_y);\n    base::CheckedNumeric<int> logical_width = settings.bounds.width();\n    base::CheckedNumeric<int> logical_height = settings.bounds.height();\n    // Use a wide intermediate: the logical page can be larger than the\n    // physical bitmap when horizontal and vertical printer DPI differ.\n    const int64_t width = int64_t{settings.bounds.width()} * max_dpi / dpi_x;\n    const int64_t height = int64_t{settings.bounds.height()} * max_dpi / dpi_y;\n    logical_width = width;\n    logical_height = height;\n    // CalculatePosition scales in int arithmetic; validate its intermediate\n    // products as well as the final logical dimensions before calling it.\n    base::CheckedNumeric<int> scaled_width = width;\n    base::CheckedNumeric<int> scaled_height = height;\n    scaled_width *= dpi_x;\n    scaled_height *= dpi_y;\n    if (!logical_width.IsValid() || !logical_height.IsValid() ||\n        !scaled_width.IsValid() || !scaled_height.IsValid())\n      return false;\n    positioning.bounds.set_size(\n        gfx::Size(logical_width.ValueOrDie(), logical_height.ValueOrDie()));\n  }\n  int rotate = CalculatePosition(page, positioning, &dest);\n#else\n  int rotate = CalculatePosition(page, settings, &dest);\n#endif\n\n  ScopedFPDFBitmap bitmap("
