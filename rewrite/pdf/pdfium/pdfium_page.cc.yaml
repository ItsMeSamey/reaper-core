substitutions:
- description: Include platform build config explicitly for the Android consumer boundary
  regex:
    pattern: '#include "base/strings/utf_string_conversions.h"

      #include "pdf/accessibility_helper.h"

      '
    replace: '#include "base/strings/utf_string_conversions.h"

      #include "build/build_config.h"

      #include "pdf/accessibility_helper.h"

      '
  count: 1
- description: Use existing nominal PDF font-size fallback on Android while retaining the desktop-only heuristic branch elsewhere
  regex:
    pattern: "  if (FPDFTextObj_GetFontSize(text_object, &font_size)) {\n    FS_MATRIX matrix;\n    if (::features::IsPdfAccessibilityHeuristicEnhancementsEnabled()\
      \ &&\n        FPDFText_GetMatrix(text_page, char_index, &matrix)) {\n      // Scale the font size with the font matrix\
      \ to get a more accurate size.\n      // Font size is based only on the vertical height, which corresponds to\n    \
      \  // c & d in the matrix.\n      style_info.font_size = font_size * std::hypot(matrix.c, matrix.d);\n    } else {\n\
      \      style_info.font_size = font_size;\n    }\n  }\n"
    replace: "  if (FPDFTextObj_GetFontSize(text_object, &font_size)) {\n#if BUILDFLAG(IS_ANDROID)\n    style_info.font_size\
      \ = font_size;\n#else\n    FS_MATRIX matrix;\n    if (::features::IsPdfAccessibilityHeuristicEnhancementsEnabled() &&\n\
      \        FPDFText_GetMatrix(text_page, char_index, &matrix)) {\n      // Scale the font size with the font matrix to\
      \ get a more accurate size.\n      // Font size is based only on the vertical height, which corresponds to\n      //\
      \ c & d in the matrix.\n      style_info.font_size = font_size * std::hypot(matrix.c, matrix.d);\n    } else {\n   \
      \   style_info.font_size = font_size;\n    }\n#endif  // BUILDFLAG(IS_ANDROID)\n  }\n"
  count: 1
