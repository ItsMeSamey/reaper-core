substitutions:
- description: Allow Android core printing to reuse PDF library targets.
  regex:
    re_pattern: import\("//pdf/features\.gni"\)
    replace: 'import("//extensions/buildflags/buildflags.gni")

      import("//pdf/features.gni")'
- description: Build existing PDF conversion library independently of browser PDF support.
  regex:
    re_pattern: if\ \(enable_pdf\)\ \{
    replace: if (enable_pdf || (is_android && enable_extensions_core)) {
- description: Keep desktop PDF plugin outside Android conversion library.
  regex:
    re_pattern: '\ \ static_library\("pdf_view_web_plugin"\)\ \{\

      \ \ \ \ assert\(enable_plugins,\ "The\ PDF\ viewer\ relies\ on\ plugin\ infrastructure"\)\

      \

      \ \ \ \ visibility\ =\ \[\

      \ \ \ \ \ \ ":\*",\

      \ \ \ \ \ \ "//components/pdf/renderer",\

      \ \ \ \ \]\

      \

      \ \ \ \ sources\ =\ \[\

      \ \ \ \ \ \ "pdf_view_web_plugin\.cc",\

      \ \ \ \ \ \ "post_message_receiver\.cc",\

      \ \ \ \ \ \ "post_message_receiver\.h",\

      \ \ \ \ \ \ "v8_value_converter\.h",\

      \ \ \ \ \]\

      \

      \ \ \ \ if\ \(enable_pdf_save_to_drive\)\ \{\

      \ \ \ \ \ \ sources\ \+=\ \[\

      \ \ \ \ \ \ \ \ "save_data_buffer_handler_for_drive\.cc",\

      \ \ \ \ \ \ \ \ "save_data_buffer_handler_for_drive\.h",\

      \ \ \ \ \ \ \]\

      \ \ \ \ \}\

      \

      \ \ \ \ friend\ =\ \[\ ":pdf_unittests"\ \]\

      \

      \ \ \ \ configs\ \+=\ \[\ ":strict"\ \]\

      \

      \ \ \ \ public\ =\ \[\ "pdf_view_web_plugin\.h"\ \]\

      \

      \ \ \ \ public_deps\ =\ \[\

      \ \ \ \ \ \ "//pdf/mojom",\

      \ \ \ \ \ \ "//ui/base",\

      \ \ \ \ \]\

      \

      \ \ \ \ deps\ =\ \[\

      \ \ \ \ \ \ ":accessibility",\

      \ \ \ \ \ \ ":buildflags",\

      \ \ \ \ \ \ ":content_restriction",\

      \ \ \ \ \ \ ":features",\

      \ \ \ \ \ \ ":internal",\

      \ \ \ \ \ \ "//base",\

      \ \ \ \ \ \ "//base:i18n",\

      \ \ \ \ \ \ "//cc/paint",\

      \ \ \ \ \ \ "//gin",\

      \ \ \ \ \ \ "//net",\

      \ \ \ \ \ \ "//pdf/loader",\

      \ \ \ \ \ \ "//printing",\

      \ \ \ \ \ \ "//services/network/public/mojom:url_loader_base",\

      \ \ \ \ \ \ "//services/screen_ai/buildflags",\

      \ \ \ \ \ \ "//skia",\

      \ \ \ \ \ \ "//third_party/blink/public:blink_headers",\

      \ \ \ \ \ \ "//third_party/blink/public/common:headers",\

      \ \ \ \ \ \ "//ui/base/cursor",\

      \ \ \ \ \ \ "//ui/base/cursor/mojom:cursor_type",\

      \ \ \ \ \ \ "//ui/events/blink",\

      \ \ \ \ \ \ "//ui/gfx/range",\

      \ \ \ \ \ \ "//v8",\

      \ \ \ \ \]\

      \ \ \}\

      \

      '
    replace: "  if (!is_android) {\n    static_library(\"pdf_view_web_plugin\") {\n      assert(enable_plugins, \"The PDF viewer relies on plugin infrastructure\")\n\n      visibility = [\n        \":*\",\n        \"//components/pdf/renderer\",\n      ]\n\n      sources = [\n        \"pdf_view_web_plugin.cc\",\n        \"post_message_receiver.cc\",\n        \"post_message_receiver.h\",\n        \"v8_value_converter.h\",\n      ]\n\n      if (enable_pdf_save_to_drive) {\n        sources += [\n          \"save_data_buffer_handler_for_drive.cc\",\n          \"save_data_buffer_handler_for_drive.h\",\n        ]\n      }\n\n      friend = [ \":pdf_unittests\" ]\n\n      configs += [ \":strict\" ]\n\n      public = [ \"pdf_view_web_plugin.h\" ]\n\n      public_deps = [\n        \"//pdf/mojom\",\n        \"//ui/base\",\n      ]\n\n      deps = [\n        \":accessibility\",\n        \":buildflags\",\n        \":content_restriction\",\n        \":features\",\n        \":internal\",\n        \"//base\",\n        \"//base:i18n\",\n        \"//cc/paint\",\n        \"//gin\",\n        \"//net\",\n        \"//pdf/loader\",\n        \"//printing\",\n        \"//services/network/public/mojom:url_loader_base\",\n        \"//services/screen_ai/buildflags\",\n        \"//skia\",\n        \"//third_party/blink/public:blink_headers\",\n        \"//third_party/blink/public/common:headers\",\n        \"//ui/base/cursor\",\n        \"//ui/base/cursor/mojom:cursor_type\",\n        \"//ui/events/blink\",\n        \"//ui/gfx/range\",\n        \"//v8\",\n      ]\n    }\n  }\n\n"
- description: Keep desktop PDF plugin tests outside Android converter tests.
  regex:
    re_pattern: '\ \ \ \ \ \ "pdf_view_web_plugin_unittest\.cc",\

      '
    replace: ''
- description: Keep desktop PDF plugin test dependency outside Android.
  regex:
    re_pattern: '\ \ \ \ \ \ ":pdf_view_web_plugin",\

      '
    replace: ''
- description: Preserve existing desktop plugin test coverage.
  regex:
    re_pattern: '\ \ \ \ data_deps\ =\ \[\

      \ \ \ \ \ \ ":pdf_unittests_pak",'
    replace: "    if (!is_android) {\n      sources += [ \"pdf_view_web_plugin_unittest.cc\" ]\n      deps += [ \":pdf_view_web_plugin\" ]\n    }\n\n    data_deps = [\n      \":pdf_unittests_pak\","
- {"description":"Honor the actual PDF build flag independently of Android extensions.","regex":{"re_pattern":"if\\ \\(enable_pdf\\ \\|\\|\\ \\(is_android\\ \\&\\&\\ enable_extensions_core\\)\\)\\ \\{\\\n","replace":"if (enable_pdf) {\n"}}
- description: Admit the existing real PDF producer for retained Android extension printer-provider conversion without enabling
    viewer feature flags.
  regex:
    pattern: "if (enable_pdf) {\n  config(\"strict\") {"
    replace: "# Android extension printer providers require the real PDF conversion APIs\n# without enabling the desktop viewer,\
      \ plugin, or public PDF feature flags.\nif (enable_pdf || (is_android && enable_extensions_core)) {\n  config(\"strict\"\
      ) {"
  count: 1
- description: Exclude ScreenAI-only PDF bitmap helpers on Android without changing the retained extension-printing backend
    or desktop.
  regex:
    pattern: "      \"//ui/gfx/range\",\n    ]\n\n    if (is_linux || is_chromeos) {\n"
    replace: "      \"//ui/gfx/range\",\n    ]\n\n    # Android printing keeps the PDF backend without the ScreenAI OCR helpers.\n\
      \    if (is_android && !enable_screen_ai_service) {\n      sources -= [\n        \"pdfium/pdfium_ocr.cc\",\n       \
      \ \"pdfium/pdfium_ocr.h\",\n      ]\n    }\n\n    if (is_linux || is_chromeos) {\n"
  count: 1
