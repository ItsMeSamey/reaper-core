substitutions:
- description: Android serial Mojo parser and existing Brave inline override (1).
  regex:
    re_pattern: '\ \ \ \ \(mojom_abspath,\ mojom_path,\ enabled_features\)\

      \ \ \ \ for\ mojom_abspath,\ mojom_path\ in\ mojom_files_to_parse\.items\(\)\

      \ \ \)\

      \ \ for\ mojom_abspath,\ ast\ in\ _Shard\(_ParseAstHelper,\ map_args\):\

      \ \ \ \ loaded_mojom_asts\[mojom_abspath\]\ =\ ast\

      \

      \ \ logging\.info\(''Processing\ dependencies''\)\

      '
    replace: "    (mojom_abspath, mojom_path, enabled_features)\n    for mojom_abspath, mojom_path in mojom_files_to_parse.items()\n  )\n  # Keep Android generators within the build scheduler's memory budget.\n  processes = 1 if 'is_android' in enabled_features else None\n  for mojom_abspath, ast in _Shard(_ParseAstHelper, map_args, processes=processes):\n    loaded_mojom_asts[mojom_abspath] = ast\n\n  logging.info('Processing dependencies')\n"
- description: Android serial Mojo parser and existing Brave inline override (2).
  regex:
    re_pattern: '\ \ _SerializeHelper\.output_root_path\ =\ output_root_path\

      \ \ \#\ Doesn''t\ seem\ to\ help\ past\ 4\.\ Perhaps\ IO\ bound\ here\?\

      \ \ processes\ =\ 4\ if\ _MULTIPROCESSING_USES_FORK\ else\ 0\

      \ \ map_args\ =\ mojom_files_to_parse\.items\(\)\

      \ \ for\ _\ in\ _Shard\(_SerializeHelper,\ map_args,\ processes=processes\):\

      \ \ \ \ pass\

      '
    replace: "  _SerializeHelper.output_root_path = output_root_path\n  # Doesn't seem to help past 4. Perhaps IO bound here?\n  processes = 4 if _MULTIPROCESSING_USES_FORK else 0\n  if 'is_android' in enabled_features:\n    processes = 1\n  map_args = mojom_files_to_parse.items()\n  for _ in _Shard(_SerializeHelper, map_args, processes=processes):\n    pass\n"
- description: Android serial Mojo parser and existing Brave inline override (3).
  regex:
    re_pattern: '\ \ logging\.info\(''Finished''\)\

      \

      \

      if\ __name__\ ==\ ''__main__'':\

      \ \ Run\(sys\.argv\[1:\]\)\

      \ \ \#\ Exit\ without\ running\ GC,\ which\ can\ save\ multiple\ seconds\ due\ to\ the\ large\

      '
    replace: "  logging.info('Finished')\n\n\nfrom brave_chromium_utils import inline_chromium_src_override; inline_chromium_src_override(globals(), locals())\nif __name__ == '__main__':\n  Run(sys.argv[1:])\n  # Exit without running GC, which can save multiple seconds due to the large\n"
