substitutions:
  - description: |-
      Admit the shared Lottie resources for desktop Android independently of
      WebUI NTP, matching the resource aggregate and cr_lottie consumers.
    regex:
      pattern: 'assert((!is_android && !is_ios) || enable_webui_ntp)'
      replace: 'assert((!is_android && !is_ios) || enable_webui_ntp || is_desktop_android)'
