substitutions:
  - description: Add the Brave blink platform mojom public_deps.
    add_literal_to_list:
      target: mojom_platform
      list_name: public_deps
      literal: brave_third_party_blink_public_mojom_platform_public_deps
      import: //brave/third_party/blink/public/mojom/sources.gni

  - description: 'Android concrete AI source/provider removal: third_party/blink/public/mojom/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "worker/worker_options\.mojom",\

        \ \ \ \ "worker/worklet_global_scope_creation_params\.mojom",\

        \ \ \]\

        \

        \ \ if\ \(is_android\)\ \{\

        \ \ \ \ sources\ \+=\ \[\ "input/synchronous_compositor\.mojom"\ \]\

        '
      replace: "    \"worker/worker_options.mojom\",\n    \"worker/worklet_global_scope_creation_params.mojom\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"ai/ai_language_model.mojom\",\n      \"ai/ai_manager.mojom\",\n      \"ai/ai_proofreader.mojom\",\n      \"ai/ai_rewriter.mojom\",\n      \"ai/ai_semantic_embedder.mojom\",\n      \"ai/ai_summarizer.mojom\",\n      \"ai/ai_writer.mojom\",\n    ]\n  }\n\n  if (is_android) {\n    sources += [ \"input/synchronous_compositor.mojom\" ]\n"

  - description: 'Android concrete AI source/provider removal: third_party/blink/public/mojom/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "worker/worker_options\.mojom",\

        \ \ \ \ "worker/worklet_global_scope_creation_params\.mojom",\

        \ \ \]\

        \ \ if\ \(is_android\)\ \{\

        \ \ \ \ sources\ \-=\ \[\

        \ \ \ \ \ \ "ai/ai_language_model\.mojom",\

        \ \ \ \ \ \ "ai/ai_manager\.mojom",\

        '
      replace: "    \"worker/worker_options.mojom\",\n    \"worker/worklet_global_scope_creation_params.mojom\",\n  ]\n  if (target_os == \"android\") {\n    sources -= [\n      \"ai/ai_language_model.mojom\",\n      \"ai/ai_manager.mojom\",\n"
  - description: Keep Android translation download progress without model execution dependencies
    regex:
      pattern: "    \"//url/mojom:url_mojom_scheme_host_port\",\n  ]\n  public_deps += brave_third_party_blink_public_mojom_platform_public_deps\n\n  if (is_android) {\n    # Direct deps (instead of transitive deps) are necessary for java targets.\n"
      replace: "    \"//url/mojom:url_mojom_scheme_host_port\",\n  ]\n  public_deps += brave_third_party_blink_public_mojom_platform_public_deps\n  if (is_android) {\n    # The retained translation protocol imports only download progress.\n    public_deps -= [ \"//services/on_device_model/public/mojom\" ]\n    public_deps += [ \"//services/on_device_model/public/mojom:download_observer\" ]\n  }\n\n  if (is_android) {\n    # Direct deps (instead of transitive deps) are necessary for java targets.\n"
    count: 1
