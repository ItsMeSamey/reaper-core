substitutions:
  - description: Add the Brave web IDL database inputs.
    add_literal_to_list:
      target: web_idl_database
      list_name: inputs
      literal: brave_third_party_blink_renderer_bindings_web_idl_database_inputs
      import: //brave/third_party/blink/renderer/bindings/sources.gni

  - description: Add the Brave web IDL database deps.
    add_literal_to_list:
      target: web_idl_database
      list_name: deps
      literal: brave_third_party_blink_renderer_bindings_web_idl_database_deps
      import: //brave/third_party/blink/renderer/bindings/sources.gni

  - description: |
      Add the Brave bindings generation inputs.

      `collect_idl_files` declares an `action_with_pydeps(target_name)` too,
      so the template is named to pick out the one meant here.
    add_literal_to_list:
      target: target_name
      type: action_with_pydeps
      template: generate_bindings
      list_name: inputs
      literal: brave_third_party_blink_renderer_bindings_generate_bindings_inputs
      import: //brave/third_party/blink/renderer/bindings/sources.gni

  - description: Add the Brave bindings generation deps.
    add_literal_to_list:
      target: target_name
      type: action_with_pydeps
      template: generate_bindings
      list_name: deps
      literal: brave_third_party_blink_renderer_bindings_generate_bindings_deps
      import: //brave/third_party/blink/renderer/bindings/sources.gni
  - description: Run Android Blink binding generation in one process within the build memory budget.
    regex:
      re_pattern: '\ \ \ \ args\ \+=\ invoker\.targets\

        '
      replace: "    if (is_android) {\n      args += [ \"--single_process\" ]\n    }\n    args += invoker.targets\n"
  - description: Select Android Blink union naming configuration (Core434).
    regex:
      pattern: 'bindings_gen_dir = get_path_info(".", "gen_dir")

        '
      replace: "bindings_gen_dir = get_path_info(\".\", \"gen_dir\")\n\n# Match the target-level IDL selection, including Android's host snapshot tools.\nunion_name_config = \"//third_party/blink/renderer/bindings/union_name_map.conf\"\nif (target_os == \"android\") {\n  union_name_config = \"${bindings_gen_dir}/union_name_map_android.conf\"\n  union_name_entries = read_file(\"union_name_map.conf\", \"list lines\")\n  union_name_entries = filter_exclude(\n      union_name_entries,\n      [\n        \"MapUnionName(\\\"LanguageModelPrompt\\\")\",\n        \"MapUnionName(\\\"LanguageModelMessageValue\\\")\",\n      ])\n  write_file(union_name_config, union_name_entries)\n}\n"
  - description: Select Android Blink union naming configuration (Core434).
    regex:
      pattern: '      "union_name_map.conf",'
      replace: '      union_name_config,'
  - description: Select Android Blink union naming configuration (Core434).
    regex:
      pattern: '    "//third_party/blink/renderer/bindings/union_name_map.conf",'
      replace: '    union_name_config,'
  - description: Select Android Blink union naming configuration (Core434).
    regex:
      pattern: "\n      \"--web_idl_database\",\n      rebase_path(web_idl_database, root_build_dir),\n      \"--root_src_dir\",\n"
      replace: "\n      \"--web_idl_database\",\n      rebase_path(web_idl_database, root_build_dir),\n      \"--union_name_config\",\n      rebase_path(union_name_config, root_build_dir),\n      \"--root_src_dir\",\n"
  - description: Select Android Blink union naming configuration (Core434).
    regex:
      pattern: "\n    \"--web_idl_database\",\n    rebase_path(web_idl_database, root_build_dir),\n    \"--root_src_dir\",\n"
      replace: "\n    \"--web_idl_database\",\n    rebase_path(web_idl_database, root_build_dir),\n    \"--union_name_config\",\n    rebase_path(union_name_config, root_build_dir),\n    \"--root_src_dir\",\n"

  - description: Keep raw and filtered Android union-name lists distinct (Core437).
    regex:
      pattern: "  union_name_entries = read_file(\"union_name_map.conf\", \"list lines\")\n  union_name_entries = filter_exclude(\n      union_name_entries,"
      replace: "  union_name_entries_raw = read_file(\"union_name_map.conf\", \"list lines\")\n  union_name_entries = filter_exclude(\n      union_name_entries_raw,"
