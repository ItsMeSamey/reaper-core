substitutions:
- description: Select Android Blink union naming configuration (Core434).
  regex:
    pattern: '    parser.add_argument("--root_src_dir",'
    replace: "    parser.add_argument(\"--union_name_config\",\n                        type=str,\n                        help=\"filepath of the union naming configuration\")\n    parser.add_argument(\"--root_src_dir\","
- description: Select Android Blink union naming configuration (Core434).
  regex:
    pattern: '                  component_reldirs=component_reldirs)'
    replace: "                  component_reldirs=component_reldirs,\n                  union_name_config=options.union_name_config)"
