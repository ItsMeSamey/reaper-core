substitutions:
- description: Select Android Blink union naming configuration (Core434).
  regex:
    pattern: '                 enable_code_generation_tracing):'
    replace: '                 enable_code_generation_tracing, union_name_config=None):'
- description: Select Android Blink union naming configuration (Core434).
  regex:
    pattern: '                code.

      '
    replace: "                code.\n            union_name_config: Optional union naming configuration file path.\n"
- description: Select Android Blink union naming configuration (Core434).
  regex:
    pattern: '        self._enable_code_generation_tracing = enable_code_generation_tracing

      '
    replace: "        self._enable_code_generation_tracing = enable_code_generation_tracing\n        self._union_name_config = union_name_config\n"
- description: Select Android Blink union naming configuration (Core434).
  regex:
    pattern: "        union_name_config = os.path.abspath(\n            os.path.join(self._root_src_dir, \"third_party\", \"blink\",\n                         \"renderer\", \"bindings\", \"union_name_map.conf\"))\n"
    replace: "        union_name_config = self._union_name_config\n        if union_name_config is None:\n            union_name_config = os.path.abspath(\n                os.path.join(self._root_src_dir, \"third_party\", \"blink\",\n                             \"renderer\", \"bindings\", \"union_name_map.conf\"))\n"
