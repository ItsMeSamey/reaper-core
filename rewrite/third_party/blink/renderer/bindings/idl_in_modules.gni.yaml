substitutions:
  - description: |-
      Add the Brave static IDL files, dropping the upstream ones Brave excludes

      Appended at the end of the file, after every upstream addition, so no
      later addition can bring an excluded file back.
    add_at_end_of_the_file:
      code: |-
        static_idl_files_in_modules += brave_static_idl_files_in_modules
        static_idl_files_in_modules -= brave_static_idl_files_to_exclude_in_modules

  - description: 'Android concrete AI source/provider removal: third_party/blink/renderer/bindings/idl_in_modules.gni'
    regex:
      re_pattern: '\ \ "//third_party/blink/renderer/modules/xr/xr_webgl_layer_init\.idl",\

        \ \ "//third_party/blink/renderer/modules/xr/xr_webgl_sub_image\.idl",\

        \]\

        \

        \#\ Direct\ Sockets\

        \#\ This\ uses\ target_os\ rather\ than\ current_os\ \(which\ is\ what\ is_android\ is\ set\

        '
      replace: "  \"//third_party/blink/renderer/modules/xr/xr_webgl_layer_init.idl\",\n  \"//third_party/blink/renderer/modules/xr/xr_webgl_sub_image.idl\",\n]\nif (is_android) {\n  static_idl_files_in_modules -= [\n    \"//third_party/blink/renderer/modules/ai/semantic_embedder.idl\",\n    \"//third_party/blink/renderer/modules/ai/language_model.idl\",\n    \"//third_party/blink/renderer/modules/ai/language_model_create_options.idl\",\n    \"//third_party/blink/renderer/modules/ai/language_model_params.idl\",\n    \"//third_party/blink/renderer/modules/ai/proofreader.idl\",\n    \"//third_party/blink/renderer/modules/ai/rewriter.idl\",\n    \"//third_party/blink/renderer/modules/ai/summarizer.idl\",\n    \"//third_party/blink/renderer/modules/ai/writer.idl\",\n  ]\n}\n\n# Direct Sockets\n# This uses target_os rather than current_os (which is what is_android is set\n"

  - description: 'Android concrete AI source/provider removal: third_party/blink/renderer/bindings/idl_in_modules.gni'
    regex:
      re_pattern: '\ \ "//third_party/blink/renderer/modules/xr/xr_webgl_layer_init\.idl",\

        \ \ "//third_party/blink/renderer/modules/xr/xr_webgl_sub_image\.idl",\

        \]\

        if\ \(is_android\)\ \{\

        \ \ static_idl_files_in_modules\ \-=\ \[\

        \ \ \ \ "//third_party/blink/renderer/modules/ai/semantic_embedder\.idl",\

        \ \ \ \ "//third_party/blink/renderer/modules/ai/language_model\.idl",\

        '
      replace: "  \"//third_party/blink/renderer/modules/xr/xr_webgl_layer_init.idl\",\n  \"//third_party/blink/renderer/modules/xr/xr_webgl_sub_image.idl\",\n]\nif (target_os == \"android\") {\n  static_idl_files_in_modules -= [\n    \"//third_party/blink/renderer/modules/ai/semantic_embedder.idl\",\n    \"//third_party/blink/renderer/modules/ai/language_model.idl\",\n"
  - description: Exclude AI-only test IDL from Android binding generation.
    regex:
      pattern: "static_idl_files_in_modules_for_testing = [\n  \"//third_party/blink/renderer/modules/accessibility/testing/accessibility_properties.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/accessibility/testing/internals_accessibility.idl\",\n  \"//third_party/blink/renderer/modules/credentialmanagement/testing/internals_fed_cm.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/content_extraction/testing/internals_content_extraction.idl\",\n  \"//third_party/blink/renderer/modules/device_posture/testing/internals_device_posture.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/fuzzing/internals_fuzzing.idl\",\n  \"//third_party/blink/renderer/modules/mediastream/testing/internals_media_stream.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/netinfo/testing/internals_net_info.idl\",\n  \"//third_party/blink/renderer/modules/peerconnection/testing/internals_rtc_certificate.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/peerconnection/testing/internals_rtc_peer_connection.idl\",\n  \"//third_party/blink/renderer/modules/permissions/testing/internals_permission.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/sensor/testing/internals_sensor.idl\",\n  \"//third_party/blink/renderer/modules/sensor/testing/create_virtual_sensor_options.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/sensor/testing/virtual_sensor_information.idl\",\n  \"//third_party/blink/renderer/modules/sensor/testing/virtual_sensor_reading.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/service_worker/testing/internals_service_worker.idl\",\n  \"//third_party/blink/renderer/modules/speech/testing/internals_speech_synthesis.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/vibration/testing/internals_vibration.idl\",\n  \"//third_party/blink/renderer/modules/webaudio/testing/internals_web_audio.idl\"\
        ,\n]\n"
      replace: "static_idl_files_in_modules_for_testing = [\n  \"//third_party/blink/renderer/modules/accessibility/testing/accessibility_properties.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/accessibility/testing/internals_accessibility.idl\",\n  \"//third_party/blink/renderer/modules/credentialmanagement/testing/internals_fed_cm.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/content_extraction/testing/internals_content_extraction.idl\",\n  \"//third_party/blink/renderer/modules/device_posture/testing/internals_device_posture.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/fuzzing/internals_fuzzing.idl\",\n  \"//third_party/blink/renderer/modules/mediastream/testing/internals_media_stream.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/netinfo/testing/internals_net_info.idl\",\n  \"//third_party/blink/renderer/modules/peerconnection/testing/internals_rtc_certificate.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/peerconnection/testing/internals_rtc_peer_connection.idl\",\n  \"//third_party/blink/renderer/modules/permissions/testing/internals_permission.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/sensor/testing/internals_sensor.idl\",\n  \"//third_party/blink/renderer/modules/sensor/testing/create_virtual_sensor_options.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/sensor/testing/virtual_sensor_information.idl\",\n  \"//third_party/blink/renderer/modules/sensor/testing/virtual_sensor_reading.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/service_worker/testing/internals_service_worker.idl\",\n  \"//third_party/blink/renderer/modules/speech/testing/internals_speech_synthesis.idl\"\
        ,\n  \"//third_party/blink/renderer/modules/vibration/testing/internals_vibration.idl\",\n  \"//third_party/blink/renderer/modules/webaudio/testing/internals_web_audio.idl\"\
        ,\n]\n\n\nif (target_os_is_android) {\n  static_idl_files_in_modules_for_testing -= [\n    \"//third_party/blink/renderer/modules/content_extraction/testing/internals_content_extraction.idl\"\
        ,\n  ]\n}\n"
    count: 1
  - description: Keep the existing GN blank-line style around the new Android exclusion.
    regex:
      pattern: ']



        if (target_os_is_android)'
      replace: ']


        if (target_os_is_android)'
    count: 1
