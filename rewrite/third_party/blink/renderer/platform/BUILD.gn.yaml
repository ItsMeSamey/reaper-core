substitutions:
  - description: |-
      Let Brave targets see blink platform

      `visibility` is reset and reassigned upstream, so the append closes the
      body instead of following the first assignment.
    add_literal_to_list:
      target: platform
      list_name: visibility
      literal: brave_blink_renderer_platform_visibility
      assume_defined: true

  - description: Add the Brave blink platform public_deps.
    add_literal_to_list:
      target: platform
      list_name: public_deps
      literal: brave_blink_renderer_platform_public_deps

  - description: Add the Brave blink platform sources.
    add_literal_to_list:
      target: platform
      list_name: sources
      literal: brave_blink_renderer_platform_sources

  - description: Add the Brave blink platform deps.
    add_literal_to_list:
      target: platform
      list_name: deps
      literal: brave_blink_renderer_platform_deps

  - description: 'Android concrete AI source/provider removal: third_party/blink/renderer/platform/BUILD.gn'
    regex:
      re_pattern: '\#\ Blink\ to\ disable\ features\ that\ depend\ on\ it\.\

        has_zstd_compression\ =\ !is_fuchsia\

        \

        buildflag_header\("bindings_buildflags"\)\ \{\

        \ \ header\ =\ "buildflags\.h"\

        \ \ header_dir\ =\ "third_party/blink/renderer/platform/bindings"\

        '
      replace: "# Blink to disable features that depend on it.\nhas_zstd_compression = !is_fuchsia\n\n# Android host snapshot generation must omit optional model APIs too.\nenable_web_ai_model_apis = target_os != \"android\"\n\nbuildflag_header(\"bindings_buildflags\") {\n  header = \"buildflags.h\"\n  header_dir = \"third_party/blink/renderer/platform/bindings\"\n"
  - description: 'Android concrete AI source/provider removal: third_party/blink/renderer/platform/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "RCS_COUNT_EVERYTHING=\$runtime_call_stats_count_everything",\

        \ \ \ \ "BLINK_BINDINGS_TRACE_ENABLED=\$enable_blink_bindings_tracing",\

        \ \ \ \ "HAS_ZSTD_COMPRESSION=\$has_zstd_compression",\

        \ \ \]\

        \}\

        \

        '
      replace: "    \"RCS_COUNT_EVERYTHING=$runtime_call_stats_count_everything\",\n    \"BLINK_BINDINGS_TRACE_ENABLED=$enable_blink_bindings_tracing\",\n    \"HAS_ZSTD_COMPRESSION=$has_zstd_compression\",\n    \"ENABLE_WEB_AI_MODEL_APIS=$enable_web_ai_model_apis\",\n  ]\n}\n\n"
