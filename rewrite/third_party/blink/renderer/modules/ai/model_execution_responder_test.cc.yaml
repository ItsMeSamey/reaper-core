# Android excludes optional built-in Web AI and retains translation/language detection.
substitutions:
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ \ \ static_cast<int>\(kResponseTokens\),\ 1\);\

      \}\

      \

      '
    replace: "      static_cast<int>(kResponseTokens), 1);\n}\n\n#if BUILDFLAG(IS_ANDROID)\nTEST(CreateModelExecutionResponder, AndroidToolCallsRejectWithoutExecuting) {\n  test::TaskEnvironment task_environment;\n  V8TestingScope scope;\n  ScriptState* script_state = scope.GetScriptState();\n  auto* resolver =\n      MakeGarbageCollected<ScriptPromiseResolver<IDLString>>(script_state);\n  auto promise = resolver->Promise();\n  int complete_calls = 0;\n  int tool_calls = 0;\n  auto pending_remote = CreateModelExecutionResponder(\n      script_state, nullptr,\n      blink::scheduler::GetSequencedTaskRunnerForTesting(),\n      AIMetrics::AISessionType::kTranslator,\n      base::BindOnce(\n          [](int* calls, ScriptPromiseResolver<IDLString>* resolver,\n             const String& response,\n             mojom::blink::ModelExecutionContextInfoPtr info) {\n            ++*calls;\n            ResolvePromiseOnCompletion(resolver, response, std::move(info));\n          },\n          base::Unretained(&complete_calls), WrapPersistent(resolver)),\n      base::BindRepeating(\n          [](int* calls, Vector<mojom::blink::ToolCallPtr> tools) { ++*calls; },\n          base::Unretained(&tool_calls)),\n      base::DoNothing(),\n      base::BindOnce(&RejectPromiseOnError<IDLString>,\n                     WrapPersistent(resolver)),\n      base::BindOnce(&RejectPromiseOnAbort<IDLString>, WrapPersistent(resolver),\n                     nullptr, WrapPersistent(script_state)));\n  mojo::Remote<mojom::blink::ModelStreamingResponder> responder(\n      std::move(pending_remote));\n  base::RunLoop disconnected;\n  responder.set_disconnect_handler(disconnected.QuitClosure());\n  Vector<mojom::blink::ToolCallPtr> tools;\n  auto tool = mojom::blink::ToolCall::New();\n  tool->call_id = \"unsupported-call\";\n  tool->name = \"unsupported-tool\";\n  tools.push_back(std::move(tool));\n  responder->OnToolCalls(std::move(tools));\n  responder->OnCompletion(mojom::blink::ModelExecutionContextInfo::New(1, 1));\n  ScriptPromiseTester tester(script_state, promise);\n  tester.WaitUntilSettled();\n  EXPECT_TRUE(tester.IsRejected());\n  auto* exception = V8DOMException::ToWrappable(script_state->GetIsolate(),\n                                                tester.Value().V8Value());\n  ASSERT_TRUE(exception);\n  EXPECT_EQ(exception->name(),\n            DOMException(DOMExceptionCode::kUnknownError).name());\n  EXPECT_EQ(tool_calls, 0);\n  EXPECT_EQ(complete_calls, 0);\n  disconnected.Run();\n}\n\nTEST(CreateModelExecutionStreamingResponder,\n     AndroidToolCallsErrorAndDisconnect) {\n  test::TaskEnvironment task_environment;\n  V8TestingScope scope;\n  ScriptState* script_state = scope.GetScriptState();\n  int complete_calls = 0;\n  auto [stream, pending_remote] = CreateModelExecutionStreamingResponder(\n      script_state, nullptr,\n      blink::scheduler::GetSequencedTaskRunnerForTesting(),\n      AIMetrics::AISessionType::kTranslator,\n      base::BindOnce(\n          [](int* calls, mojom::blink::ModelExecutionContextInfoPtr info) {\n            ++*calls;\n          },\n          base::Unretained(&complete_calls)),\n      base::DoNothing());\n  mojo::Remote<mojom::blink::ModelStreamingResponder> responder(\n      std::move(pending_remote));\n  base::RunLoop disconnected;\n  responder.set_disconnect_handler(disconnected.QuitClosure());\n  Vector<mojom::blink::ToolCallPtr> tools;\n  auto tool = mojom::blink::ToolCall::New();\n  tool->call_id = \"unsupported-call\";\n  tool->name = \"unsupported-tool\";\n  tools.push_back(std::move(tool));\n  responder->OnToolCalls(std::move(tools));\n  responder->OnCompletion(mojom::blink::ModelExecutionContextInfo::New(1, 1));\n  auto* reader =\n      stream->GetDefaultReaderForTesting(script_state, ASSERT_NO_EXCEPTION);\n  auto read_promise = reader->read(script_state, ASSERT_NO_EXCEPTION);\n  ScriptPromiseTester tester(script_state, read_promise);\n  tester.WaitUntilSettled();\n  EXPECT_TRUE(tester.IsRejected());\n  auto* exception = V8DOMException::ToWrappable(script_state->GetIsolate(),\n                                                tester.Value().V8Value());\n  ASSERT_TRUE(exception);\n  EXPECT_EQ(exception->name(),\n            DOMException(DOMExceptionCode::kUnknownError).name());\n  EXPECT_EQ(complete_calls, 0);\n  disconnected.Run();\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ "base/test/metrics/histogram_tester\.h"\

      '
    replace: '#include "base/test/metrics/histogram_tester.h"

      #include "build/build_config.h"

      '

