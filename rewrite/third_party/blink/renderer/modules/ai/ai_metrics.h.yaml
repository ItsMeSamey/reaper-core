# Android excludes optional built-in Web AI and retains translation/language detection.
substitutions:
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ \ \ mojom::blink::AILanguageModelPromptRole\ role\);\

      '
    replace: '      mojom::blink::AILanguageModelPromptRole role);

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ static\ std::string\ GetAISessionCrashedMetricName\(AISessionType\ session_type\);\

      \

      '
    replace: '  static std::string GetAISessionCrashedMetricName(AISessionType session_type);


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ "third_party/blink/renderer/bindings/modules/v8/v8_language_model_message_content\.h"\

      '
    replace: '#include "third_party/blink/renderer/bindings/modules/v8/v8_language_model_message_content.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ "third_party/blink/public/mojom/ai/ai_language_model\.mojom\-blink\.h"\

      '
    replace: '#include "third_party/blink/public/mojom/ai/ai_language_model.mojom-blink.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ <string>\

      \

      '
    replace: '#include <string>


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ <string>\

      '
    replace: '#include <string>

      #include "build/build_config.h"

      '

- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\ \ \ \ \ \ mojom::blink::AILanguageModelPromptRole\ role\);\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '      mojom::blink::AILanguageModelPromptRole role);

      #endif  // BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\ \ static\ std::string\ GetAISessionCrashedMetricName\(AISessionType\ session_type\);\

      \

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '  static std::string GetAISessionCrashedMetricName(AISessionType session_type);


      #if BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#include\ "third_party/blink/renderer/bindings/modules/v8/v8_language_model_message_content\.h"\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '#include "third_party/blink/renderer/bindings/modules/v8/v8_language_model_message_content.h"

      #endif  // BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '#endif  // BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      #if BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '#if BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#include\ "build/build_config\.h"\

      '
    replace: '#include "third_party/blink/renderer/platform/bindings/buildflags.h"

      '
