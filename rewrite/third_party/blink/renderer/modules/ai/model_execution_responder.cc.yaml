# Android excludes optional built-in Web AI and retains translation/language detection.
substitutions:
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ \ \ Controller\(\)\->Enqueue\(message_v8\);\

      \ \ \ \ \}\

      '
    replace: "      Controller()->Enqueue(message_v8);\n    }\n#endif  // BUILDFLAG(IS_ANDROID)\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ Controller\(\)\->Error\(ConvertModelStreamingResponseErrorToDOMException\(\

      \ \ \ \ \ \ \ \ status,\ std::move\(quota_error_info\)\)\);\

      \ \ \ \ RecordResponseMetrics\(\);\

      \ \ \ \ Cleanup\(\);\

      \ \ \}\

      \

      \ \ void\ OnContextOverflow\(\)\ override\ \{\

      \ \ \ \ if\ \(overflow_callback_\)\ \{\

      \ \ \ \ \ \ overflow_callback_\.Run\(\);\

      \ \ \ \ \}\

      \ \ \}\

      \

      \ \ void\ OnToolCalls\(Vector<mojom::blink::ToolCallPtr>\ tool_calls\)\ override\ \{\

      '
    replace: "    Controller()->Error(ConvertModelStreamingResponseErrorToDOMException(\n        status, std::move(quota_error_info)));\n    RecordResponseMetrics();\n    Cleanup();\n  }\n\n  void OnContextOverflow() override {\n    if (overflow_callback_) {\n      overflow_callback_.Run();\n    }\n  }\n\n  void OnToolCalls(Vector<mojom::blink::ToolCallPtr> tool_calls) override {\n#if BUILDFLAG(IS_ANDROID)\n    OnError(mojom::blink::ModelStreamingResponseStatus::kErrorGenericFailure,\n            nullptr);\n#else\n\n"
