- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ \ \ :\ script_state_\(script_state\),\

      \ \ \ \ \ \ \ \ receiver_\(this,\ ExecutionContext::From\(script_state\)\),\

      \ \ \ \ \ \ \ \ abort_signal_\(signal\),\

      \ \ \ \ \ \ \ \ session_type_\(session_type\),\

      \ \ \ \ \ \ \ \ complete_callback_\(std::move\(complete_callback\)\),\

      '
    replace: "      : script_state_(script_state),\n        receiver_(this, ExecutionContext::From(script_state)),\n        abort_signal_(signal),\n        session_type_(session_type),\n        complete_callback_(std::move(complete_callback)),\n#if !BUILDFLAG(IS_ANDROID)\n"
