# Android excludes optional built-in Web AI and retains translation/language detection.
substitutions:
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ return\ ai_manager_remote_;\

      \}\

      \

      '
    replace: '  return ai_manager_remote_;

      }


      #endif  // !BUILDFLAG(IS_ANDROID)


      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ std::move\(callback\)\)\);\

      \}\

      \

      '
    replace: '          std::move(callback)));

      }


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ return\ From\(execution_context\)\->GetAIManagerRemoteImpl\(execution_context\);\

      \}\

      '
    replace: '  return From(execution_context)->GetAIManagerRemoteImpl(execution_context);

      }


      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
