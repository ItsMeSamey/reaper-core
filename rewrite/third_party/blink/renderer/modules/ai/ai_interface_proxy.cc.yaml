      \}\

      \

      '
    replace: '      ->GetLanguageDetectionModelImpl(execution_context, std::move(callback));

      }


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ visitor\->Trace\(ai_manager_remote_\);\

      '
    replace: '  visitor->Trace(ai_manager_remote_);

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ visitor\->Trace\(language_detection_model_\);\

      '
    replace: '  visitor->Trace(language_detection_model_);

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ "third_party/blink/renderer/modules/ai/ai_interface_proxy\.h"\

      '
    replace: '#include "third_party/blink/renderer/modules/ai/ai_interface_proxy.h"


      #include "build/build_config.h"

