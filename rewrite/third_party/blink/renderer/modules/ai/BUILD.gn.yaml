# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: third_party/blink/renderer/modules/ai/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "writer\.cc",\

      \ \ \ \ "writer\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\ "//third_party/blink/public/mojom:mojom_modules_blink"\ \]\

      \

      '
    replace: "    \"writer.cc\",\n    \"writer.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"ai_writing_assistance_base.h\",\n      \"ai_writing_assistance_create_client.h\",\n      \"language_model.cc\",\n      \"language_model.h\",\n      \"language_model_create_client.cc\",\n      \"language_model_create_client.h\",\n      \"language_model_create_options.h\",\n      \"language_model_params.cc\",\n      \"language_model_params.h\",\n      \"language_model_prompt_builder.cc\",\n      \"language_model_prompt_builder.h\",\n      \"language_model_tool_call.cc\",\n      \"language_model_tool_call.h\",\n      \"language_model_tool_error.cc\",\n      \"language_model_tool_error.h\",\n      \"language_model_tool_success.cc\",\n      \"language_model_tool_success.h\",\n      \"proofreader.cc\",\n      \"proofreader.h\",\n      \"rewriter.cc\",\n      \"rewriter.h\",\n      \"semantic_embedder.cc\",\n      \"semantic_embedder.h\",\n      \"summarizer.cc\",\n      \"summarizer.h\",\n      \"writer.cc\",\n      \"writer.h\",\n    ]\n  }\n\n  public_deps = [ \"//third_party/blink/public/mojom:mojom_modules_blink\" ]\n\n"
