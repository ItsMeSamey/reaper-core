      \ \ \}\

      '
    replace: "              kUnavailableTranslationNotEligible);\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ mojom::blink::CanCreateTranslatorResult\ result\)\ \{\

      '
    replace: "    mojom::blink::CanCreateTranslatorResult result) {\n#if BUILDFLAG(IS_ANDROID)\n  switch (result) {\n    case mojom::blink::CanCreateTranslatorResult::kReadily:\n      return RecordLanguageAvailability(execution_context,\n                                        AIMetrics::AISessionType::kTranslator,\n                                        Availability::kAvailable);\n    case mojom::blink::CanCreateTranslatorResult::kAfterDownloadLibraryNotReady:\n    case mojom::blink::CanCreateTranslatorResult::\n        kAfterDownloadLanguagePackNotReady:\n    case mojom::blink::CanCreateTranslatorResult::\n        kAfterDownloadLibraryAndLanguagePackNotReady:\n    case mojom::blink::CanCreateTranslatorResult::\n        kAfterDownloadTranslatorCreationRequired:\n      return RecordLanguageAvailability(execution_context,\n                                        AIMetrics::AISessionType::kTranslator,\n                                        Availability::kDownloadable);\n    case mojom::blink::CanCreateTranslatorResult::kNoNotSupportedLanguage:\n      return RecordLanguageAvailability(\n          execution_context, AIMetrics::AISessionType::kTranslator,\n          Availability::kUnavailable,\n          \"The requested language options are not supported.\");\n    case mojom::blink::CanCreateTranslatorResult::kNoServiceCrashed:\n    case mojom::blink::CanCreateTranslatorResult::kNoDisallowedByPolicy:\n    case mojom::blink::CanCreateTranslatorResult::\n        kNoExceedsServiceCountLimitation:\n    case mojom::blink::CanCreateTranslatorResult::kNoInvalidStoragePartition:\n      return RecordLanguageAvailability(\n          execution_context, AIMetrics::AISessionType::kTranslator,\n          Availability::kUnavailable,\n          \"The on-device translation is not available.\");\n  }\n#else\n\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ return\ availability;\

      \}\

      \

      '
    replace: "  return availability;\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace {\nAvailability RecordLanguageAvailability(ExecutionContext* execution_context,\n                                        AIMetrics::AISessionType session_type,\n                                        Availability availability,\n                                        const char* warning = nullptr) {\n  if (execution_context && availability == Availability::kUnavailable) {\n    CHECK(warning);\n    execution_context->AddConsoleMessage(\n        mojom::blink::ConsoleMessageSource::kJavaScript,\n        mojom::blink::ConsoleMessageLevel::kWarning, warning);\n  }\n  base::UmaHistogramEnumeration(\n      AIMetrics::GetAvailabilityMetricName(session_type), availability);\n  return availability;\n}\n}  // namespace\n#endif  // BUILDFLAG(IS_ANDROID)\n\n"
