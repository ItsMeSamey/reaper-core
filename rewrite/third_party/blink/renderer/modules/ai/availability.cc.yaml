# Android excludes optional built-in Web AI and retains translation/language detection.
substitutions:
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ kUnavailableLanguageDetectionModelNotAvailable\);\

      \ \ \}\

      '
    replace: "              kUnavailableLanguageDetectionModelNotAvailable);\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ language_detection::mojom::blink::LanguageDetectionModelStatus\ result\)\ \{\

      '
    replace: "    language_detection::mojom::blink::LanguageDetectionModelStatus result) {\n#if BUILDFLAG(IS_ANDROID)\n  switch (result) {\n    case language_detection::mojom::blink::LanguageDetectionModelStatus::\n        kReadily:\n      return RecordLanguageAvailability(\n          execution_context, AIMetrics::AISessionType::kLanguageDetector,\n          Availability::kAvailable);\n    case language_detection::mojom::blink::LanguageDetectionModelStatus::\n        kAfterDownload:\n      return RecordLanguageAvailability(\n          execution_context, AIMetrics::AISessionType::kLanguageDetector,\n          Availability::kDownloadable);\n    case language_detection::mojom::blink::LanguageDetectionModelStatus::\n        kNotAvailable:\n      return RecordLanguageAvailability(\n          execution_context, AIMetrics::AISessionType::kLanguageDetector,\n          Availability::kUnavailable,\n          \"The language detection model was required but not available.\");\n  }\n#else\n\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
