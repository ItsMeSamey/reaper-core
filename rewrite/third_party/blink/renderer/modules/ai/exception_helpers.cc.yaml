# Android excludes optional built-in Web AI and retains translation/language detection.
substitutions:
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '//\ LINT\.ThenChange\(//third_party/blink/public/mojom/ai/ai_manager\.mojom:ModelAvailabilityCheckResult\)\

      \

      '
    replace: '// LINT.ThenChange(//third_party/blink/public/mojom/ai/ai_manager.mojom:ModelAvailabilityCheckResult)


      #endif  // !BUILDFLAG(IS_ANDROID)


      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ NOTREACHED\(\);\

      \}\

      \

      '
    replace: '  NOTREACHED();

      }


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ kDoNotExternalize\);\

      \}\

      \

      '
    replace: '                               kDoNotExternalize);

      }


      #endif  // !BUILDFLAG(IS_ANDROID)


      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ return\ true;\

      \}\

      \

      '
    replace: '  return true;

      }


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ "`samplingMode:''most\-predictable''`\ or\ `topK:1`\ or\ `temperature:0`\.";\

      '
    replace: '    "`samplingMode:''most-predictable''` or `topK:1` or `temperature:0`.";

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
