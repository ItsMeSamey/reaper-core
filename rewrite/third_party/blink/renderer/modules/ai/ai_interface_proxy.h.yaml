# Android excludes optional built-in Web AI and retains translation/language detection.
substitutions:
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ HeapMojoRemote<mojom::blink::AIManager>\ ai_manager_remote_\{nullptr\};\

      '
    replace: '  HeapMojoRemote<mojom::blink::AIManager> ai_manager_remote_{nullptr};

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ Member<LanguageDetectionModel>\ language_detection_model_;\

      \

      '
    replace: '  Member<LanguageDetectionModel> language_detection_model_;


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ HeapMojoRemote<mojom::blink::AIManager>\&\ GetAIManagerRemoteImpl\(\

      \ \ \ \ \ \ ExecutionContext\*\ execution_context\);\

      '
    replace: "  HeapMojoRemote<mojom::blink::AIManager>& GetAIManagerRemoteImpl(\n      ExecutionContext* execution_context);\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ void\ GetLanguageDetectionModelImpl\(\

      \ \ \ \ \ \ ExecutionContext\*\ execution_context,\

      \ \ \ \ \ \ GetLanguageDetectionModelCallback\ callback\);\

      \

      '
    replace: "  void GetLanguageDetectionModelImpl(\n      ExecutionContext* execution_context,\n      GetLanguageDetectionModelCallback callback);\n\n#if !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ static\ HeapMojoRemote<mojom::blink::AIManager>\&\ GetAIManagerRemote\(\

      \ \ \ \ \ \ ExecutionContext\*\ execution_context\);\

      '
    replace: "  static HeapMojoRemote<mojom::blink::AIManager>& GetAIManagerRemote(\n      ExecutionContext* execution_context);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ static\ void\ GetLanguageDetectionModel\(\

      \ \ \ \ \ \ ExecutionContext\*\ execution_context,\

      \ \ \ \ \ \ GetLanguageDetectionModelCallback\ callback\);\

      \

      '
    replace: "  static void GetLanguageDetectionModel(\n      ExecutionContext* execution_context,\n      GetLanguageDetectionModelCallback callback);\n\n#if !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ "third_party/blink/public/mojom/ai/ai_manager\.mojom\-blink\.h"\

      '
    replace: '#include "third_party/blink/public/mojom/ai/ai_manager.mojom-blink.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ "components/language_detection/content/common/language_detection\.mojom\-blink\.h"\

      '
    replace: '#include "components/language_detection/content/common/language_detection.mojom-blink.h"

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ "base/task/sequenced_task_runner\.h"\

      '
    replace: '#include "base/task/sequenced_task_runner.h"

      #include "build/build_config.h"

      '

- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\ \ HeapMojoRemote<mojom::blink::AIManager>\ ai_manager_remote_\{nullptr\};\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '  HeapMojoRemote<mojom::blink::AIManager> ai_manager_remote_{nullptr};

      #endif  // BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\ \ Member<LanguageDetectionModel>\ language_detection_model_;\

      \

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '  Member<LanguageDetectionModel> language_detection_model_;


      #if BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\ \ \ \ \ \ ExecutionContext\*\ execution_context\);\

      \

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '      ExecutionContext* execution_context);


      #endif  // BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\ \ void\ GetLanguageDetectionModelImpl\(\

      \ \ \ \ \ \ ExecutionContext\*\ execution_context,\

      \ \ \ \ \ \ GetLanguageDetectionModelCallback\ callback\);\

      \

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: "  void GetLanguageDetectionModelImpl(\n      ExecutionContext* execution_context,\n      GetLanguageDetectionModelCallback callback);\n\n#if BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)\n"
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\ \ \ \ \ \ ExecutionContext\*\ execution_context\);\

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '      ExecutionContext* execution_context);

      #endif  // BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\ \ \ \ \ \ GetLanguageDetectionModelCallback\ callback\);\

      \

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '      GetLanguageDetectionModelCallback callback);


      #if BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '#endif  // BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '#include "third_party/blink/renderer/platform/bindings/buildflags.h"

      #if BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#include\ "build/build_config\.h"\

      '
    replace: ''
