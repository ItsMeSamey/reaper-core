# Android excludes optional built-in Web AI and retains translation/language detection.
substitutions:
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\ \ \ \ AIMetrics::AISessionType\ session_type,\

      \ \ \ \ mojom::blink::ModelAvailabilityCheckResult\ result\);\

      '
    replace: "    AIMetrics::AISessionType session_type,\n    mojom::blink::ModelAvailabilityCheckResult result);\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: 'MODULES_EXPORT\ V8Availability\ AvailabilityToV8\(Availability\ availability\);\

      \

      '
    replace: 'MODULES_EXPORT V8Availability AvailabilityToV8(Availability availability);


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ "third_party/blink/public/mojom/ai/ai_manager\.mojom\-blink\-forward\.h"\

      '
    replace: '#include "third_party/blink/public/mojom/ai/ai_manager.mojom-blink-forward.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#include\ "components/language_detection/content/common/language_detection\.mojom\-blink\-forward\.h"\

      '
    replace: '#include "components/language_detection/content/common/language_detection.mojom-blink-forward.h"

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude optional built-in Android Web AI code and preserve ordinary translation and detection paths
  regex:
    re_pattern: '\#define\ THIRD_PARTY_BLINK_RENDERER_MODULES_AI_AVAILABILITY_H_\

      \

      '
    replace: '#define THIRD_PARTY_BLINK_RENDERER_MODULES_AI_AVAILABILITY_H_


      #include "build/build_config.h"

      '

- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\ \ \ \ mojom::blink::ModelAvailabilityCheckResult\ result\);\

      \

      \#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '    mojom::blink::ModelAvailabilityCheckResult result);


      #endif  // BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: 'MODULES_EXPORT\ V8Availability\ AvailabilityToV8\(Availability\ availability\);\

      \

      \#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: 'MODULES_EXPORT V8Availability AvailabilityToV8(Availability availability);


      #if BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#endif\ \ //\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '#endif  // BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#if\ !BUILDFLAG\(IS_ANDROID\)\

      '
    replace: '#include "third_party/blink/renderer/platform/bindings/buildflags.h"

      #if BUILDFLAG(ENABLE_WEB_AI_MODEL_APIS)

      '
- description: Use target-derived optional Web AI model capability for Android device and host snapshot compilation
  regex:
    re_pattern: '\#include\ "build/build_config\.h"\

      '
    replace: ''
