substitutions:
- description: Exclude Android AI extraction and metadata sources while retaining inner text, inner HTML and their document
    chunker.
  regex:
    pattern: "  ]\n\n  deps = [\n"
    replace: "  ]\n\n  if (is_android) {\n    sources -= [\n      \"ai_page_content_agent.cc\",\n      \"ai_page_content_agent.h\"\
      ,\n      \"ai_page_content_debug_utils.cc\",\n      \"ai_page_content_debug_utils.h\",\n      \"frame_metadata_observer_registry.cc\"\
      ,\n      \"frame_metadata_observer_registry.h\",\n      \"paid_content.cc\",\n      \"paid_content.h\",\n    ]\n  }\n\
      \n  deps = [\n"
  count: 1
