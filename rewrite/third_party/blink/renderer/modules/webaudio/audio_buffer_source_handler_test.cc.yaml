# Android native-test API integration; exact reviewed source literals.
substitutions:
  - description: "Android native integration581, exact reviewed source literal 1: direct_build_config_header"
    regex:
      pattern: "#include \"base/synchronization/waitable_event.h\"\n"
      replace: "#include \"base/synchronization/waitable_event.h\"\n#include \"build/build_config.h\"\n"
    count: 1
  - description: "Android native integration581, exact reviewed source literal 2: Android_existing_internal_one_arg_channel_zero_access"
    regex:
      pattern: "    DOMFloat32Array* channel_data =\n        audio_buffer->getChannelData(0, ASSERT_NO_EXCEPTION).Get();\n"
      replace: "    DOMFloat32Array* channel_data =\n#if BUILDFLAG(IS_ANDROID)\n        audio_buffer->getChannelData(0).Get();\n#else\n        audio_buffer->getChannelData(0, ASSERT_NO_EXCEPTION).Get();\n#endif\n"
    count: 1
