substitutions:
  - description: "Include the explicit Android build-flag declaration."
    count: 1
    regex:
      pattern: "#include \"testing/gtest/include/gtest/gtest.h\"\n"
      replace: "#include \"build/build_config.h\"\n#include \"testing/gtest/include/gtest/gtest.h\"\n"
  - description: "Include the directly used ScriptPromise conversion API."
    count: 1
    regex:
      pattern: "#include \"third_party/blink/renderer/bindings/core/v8/script_promise_tester.h\"\n"
      replace: "#include \"third_party/blink/renderer/bindings/core/v8/script_promise.h\"\n#include \"third_party/blink/renderer/bindings/core/v8/script_promise_tester.h\"\n"
  - description: "Observe the same estimate V8 promise as IDLAny only on Android; preserve typed desktop observation."
    count: 1
    regex:
      pattern: "    auto promise = storage_access_handle->estimate(scope.GetScriptState(),\n                                                   scope.GetExceptionState());\n    ScriptPromiseTester tester(scope.GetScriptState(), promise);\n"
      replace: "    auto promise = storage_access_handle->estimate(scope.GetScriptState(),\n                                                   scope.GetExceptionState());\n#if BUILDFLAG(IS_ANDROID)\n    // This block checks promise state and rejection, not dictionary conversion.\n    ScriptPromiseTester tester(\n        scope.GetScriptState(),\n        ScriptPromise<IDLAny>::FromV8Promise(scope.GetIsolate(),\n                                             promise.V8Promise()));\n#else\n    ScriptPromiseTester tester(scope.GetScriptState(), promise);\n#endif\n"
