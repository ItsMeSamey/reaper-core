substitutions:
- description: Exclude dedicated AI renderer headers on Android.
  regex:
    pattern: '#include "third_party/blink/renderer/modules/content_extraction/ai_page_content_agent.h"

      #include "third_party/blink/renderer/modules/content_extraction/frame_metadata_observer_registry.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "third_party/blink/renderer/modules/content_extraction/ai_page_content_agent.h"

      #include "third_party/blink/renderer/modules/content_extraction/frame_metadata_observer_registry.h"

      #endif

      '
  count: 1
- description: Exclude dedicated AI renderer interface registration on Android.
  regex:
    pattern: "  if (frame.IsLocalRoot()) {\n    frame.GetInterfaceRegistry()->AddInterface(BindRepeating(\n        &AIPageContentAgent::BindReceiver,\
      \ WrapWeakPersistent(&frame)));\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (frame.IsLocalRoot()) {\n    frame.GetInterfaceRegistry()->AddInterface(BindRepeating(\n\
      \        &AIPageContentAgent::BindReceiver, WrapWeakPersistent(&frame)));\n  }\n#endif\n"
  count: 1
- description: Exclude dedicated AI renderer interface registration on Android.
  regex:
    pattern: "  if (base::FeatureList::IsEnabled(features::kFrameMetadataObserver)) {\n    frame.GetInterfaceRegistry()->AddInterface(\n\
      \        BindRepeating(&FrameMetadataObserverRegistry::BindReceiver,\n                      WrapWeakPersistent(&frame)));\n\
      \  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(features::kFrameMetadataObserver)) {\n    frame.GetInterfaceRegistry()->AddInterface(\n\
      \        BindRepeating(&FrameMetadataObserverRegistry::BindReceiver,\n                      WrapWeakPersistent(&frame)));\n\
      \  }\n#endif\n"
  count: 1
- description: Exclude automatic debug AI extraction on Android.
  regex:
    pattern: "#if DCHECK_IS_ON()\n  if (frame.IsLocalRoot() &&\n      RuntimeEnabledFeatures::AIPageContentBuildOnLoadForTestingEnabled())\
      \ {"
    replace: "#if DCHECK_IS_ON() && !BUILDFLAG(IS_ANDROID)\n  if (frame.IsLocalRoot() &&\n      RuntimeEnabledFeatures::AIPageContentBuildOnLoadForTestingEnabled())\
      \ {"
  count: 1
