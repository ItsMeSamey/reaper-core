substitutions:
- description: "0580 accepted native validation test integration literal 1"
  regex:
    pattern: "#include \"base/time/time.h\"\n"
    replace: "#include \"base/time/time.h\"\n#include \"build/build_config.h\"\n"
  count: 1
- description: "0580 accepted native validation test integration literal 2"
  regex:
    pattern: "  int resolution = TimeClamper::kCoarseResolutionMicroseconds;\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  const int resolution = TimeClamper::CoarseResolutionMicroseconds();\n#else\n  int resolution = TimeClamper::kCoarseResolutionMicroseconds;\n#endif\n"
  count: 1
