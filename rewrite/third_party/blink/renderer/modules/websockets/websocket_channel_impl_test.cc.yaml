# Android native-test API integration; exact reviewed source literals.
substitutions:
  - description: "Android native integration581, exact reviewed source literal 1: direct-build-config-include"
    regex:
      pattern: "#include \"base/test/mock_callback.h\"\n"
      replace: "#include \"base/test/mock_callback.h\"\n#include \"build/build_config.h\"\n"
    count: 1
  - description: "Android native integration581, exact reviewed source literal 2: Android-fixture-accessor-matches-factory-base"
    regex:
      pattern: "  WebSocketChannelImpl* Channel() { return channel_.Get(); }\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  // The inherited testing factory creates the Chromium base object.\n  WebSocketChannelImpl_ChromiumImpl* Channel() { return channel_.Get(); }\n#else\n  WebSocketChannelImpl* Channel() { return channel_.Get(); }\n#endif\n"
    count: 1
  - description: "Android native integration581, exact reviewed source literal 3: Android-persistent-matches-factory-base"
    regex:
      pattern: "  Persistent<WebSocketChannelImpl> channel_;\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  Persistent<WebSocketChannelImpl_ChromiumImpl> channel_;\n#else\n  Persistent<WebSocketChannelImpl> channel_;\n#endif\n"
    count: 1
  - description: "Android native integration581, exact reviewed source literal 4: Android-ConnectionLimit-array-and-reference-match-factory-base"
    regex:
      pattern: "  WebSocketChannelImpl*\n      channels[WebSocketChannelImpl::kMaxWebSocketsPerRenderProcess] = {};\n  for (WebSocketChannelImpl*& channel : channels) {\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  WebSocketChannelImpl_ChromiumImpl*\n      channels[WebSocketChannelImpl::kMaxWebSocketsPerRenderProcess] = {};\n  for (WebSocketChannelImpl_ChromiumImpl*& channel : channels) {\n#else\n  WebSocketChannelImpl*\n      channels[WebSocketChannelImpl::kMaxWebSocketsPerRenderProcess] = {};\n  for (WebSocketChannelImpl*& channel : channels) {\n#endif\n"
    count: 1
