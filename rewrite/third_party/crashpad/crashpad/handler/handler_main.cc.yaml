- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\ \ ScopedStoppable\ upload_thread;\

      \ \ if\ \(!options\.url\.empty\(\)\)\ \{\

      \ \ \ \ //\ TODO\(scottmg\):\ options\.rate_limit\ should\ be\ removed\ when\ we\ have\ a\

      \ \ \ \ //\ configurable\ database\ setting\ to\ control\ upload\ limiting\.\

      \ \ \ \ //\ See\ https://crashpad\.chromium\.org/bug/23\.\

      \ \ \ \ CrashReportUploadThread::Options\ upload_thread_options;\

      \ \ \ \ upload_thread_options\.identify_client_via_url\ =\

      \ \ \ \ \ \ \ \ options\.identify_client_via_url;\

      \ \ \ \ upload_thread_options\.rate_limit\ =\ options\.rate_limit;\

      \ \ \ \ upload_thread_options\.upload_gzip\ =\ options\.upload_gzip;\

      \ \ \ \ upload_thread_options\.watch_pending_reports\ =\ options\.periodic_tasks;\

      \

      \ \ \ \ upload_thread\.Reset\(new\ CrashReportUploadThread\(\

      \ \ \ \ \ \ \ \ database\.get\(\),\

      \ \ \ \ \ \ \ \ options\.url,\

      \ \ \ \ \ \ \ \ upload_thread_options,\

      \ \ \ \ \ \ \ \ CrashReportUploadThread::ProcessPendingReportsObservationCallback\(\)\)\);\

      \ \ \ \ upload_thread\.Get\(\)\->Start\(\);\

      \ \ \}\

      \

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  ScopedStoppable upload_thread;\n  if (!options.url.empty()) {\n    // TODO(scottmg): options.rate_limit should be removed when we have a\n    // configurable database setting to control upload limiting.\n    // See https://crashpad.chromium.org/bug/23.\n    CrashReportUploadThread::Options upload_thread_options;\n    upload_thread_options.identify_client_via_url =\n        options.identify_client_via_url;\n    upload_thread_options.rate_limit = options.rate_limit;\n    upload_thread_options.upload_gzip = options.upload_gzip;\n    upload_thread_options.watch_pending_reports = options.periodic_tasks;\n\n    upload_thread.Reset(new CrashReportUploadThread(\n        database.get(),\n        options.url,\n        upload_thread_options,\n        CrashReportUploadThread::ProcessPendingReportsObservationCallback()));\n    upload_thread.Get()->Start();\n  }\n\n#endif\n"
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ static_cast<CrashReportUploadThread\*>\(upload_thread\.Get\(\)\),\

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n        static_cast<CrashReportUploadThread*>(upload_thread.Get()),\n#endif\n"
