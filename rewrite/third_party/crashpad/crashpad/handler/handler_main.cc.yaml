      \ \ \ \ if\ \(base::GlobalHistogramAllocator::CreateWithActiveFileInDir\(\

      \ \ \ \ \ \ \ \ \ \ \ \ options\.metrics_dir,\ kMetricsFileSize,\ 0,\ kMetricsName\)\)\ \{\

      \ \ \ \ \ \ histogram_allocator\ =\ base::GlobalHistogramAllocator::Get\(\);\

      \ \ \ \ \ \ histogram_allocator\->CreateTrackingHistograms\(kMetricsName\);\

      \ \ \ \ \}\

      \ \ \}\

      \

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::GlobalHistogramAllocator* histogram_allocator = nullptr;\n  if (!options.metrics_dir.empty()) {\n    static constexpr char kMetricsName[] = \"CrashpadMetrics\";\n    constexpr size_t kMetricsFileSize = 1 << 20;\n    if (base::GlobalHistogramAllocator::CreateWithActiveFileInDir(\n            options.metrics_dir, kMetricsFileSize, 0, kMetricsName)) {\n      histogram_allocator = base::GlobalHistogramAllocator::Get();\n      histogram_allocator->CreateTrackingHistograms(kMetricsName);\n    }\n  }\n\n#endif\n"
