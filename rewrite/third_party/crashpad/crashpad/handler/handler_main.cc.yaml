# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\#include\ "handler/crash_report_upload_thread\.h"\

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "handler/crash_report_upload_thread.h"

      #endif

      '
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\ \ std::string\ url;\

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::string url;\n#endif\n"
