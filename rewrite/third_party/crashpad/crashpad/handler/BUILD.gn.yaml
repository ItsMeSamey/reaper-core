# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ "crash_report_upload_rate_limit\.cc",\

      \ \ \ \ "crash_report_upload_rate_limit\.h",\

      \ \ \ \ "crash_report_upload_thread\.cc",\

      \ \ \ \ "crash_report_upload_thread\.h",\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ if\ \(crashpad_is_apple\)\ \{\

      '
    replace: "  if (!crashpad_is_android) {\n    sources += [\n      \"crash_report_upload_rate_limit.cc\",\n      \"crash_report_upload_rate_limit.h\",\n      \"crash_report_upload_thread.cc\",\n      \"crash_report_upload_thread.h\",\n    ]\n  }\n  if (crashpad_is_apple) {\n"
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ "crash_report_upload_rate_limit_test\.cc",\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ if\ \(crashpad_is_linux\ \|\|\ crashpad_is_android\)\ \{\

      \ \ \ \ \ \ sources\ \+=\ \[\ "linux/exception_handler_server_test\.cc"\ \]\

      \ \ \ \ \}\

      '
    replace: "    if (!crashpad_is_android) {\n      sources += [ \"crash_report_upload_rate_limit_test.cc\" ]\n    }\n    if (crashpad_is_linux || crashpad_is_android) {\n      sources += [ \"linux/exception_handler_server_test.cc\" ]\n    }\n"
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \ \ sources\ =\ \[\

      \ \ \ \ \ \ "minidump_to_upload_parameters_test\.cc",\

      \ \ \ \ \]\

      '
    replace: '    sources = [ "minidump_to_upload_parameters_test.cc" ]

      '
