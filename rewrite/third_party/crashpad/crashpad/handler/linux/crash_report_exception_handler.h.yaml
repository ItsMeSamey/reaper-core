# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\#include\ "handler/crash_report_upload_thread\.h"\

      '
    replace: '#include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "handler/crash_report_upload_thread.h"

      #endif

      '
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: 'class\ ProcessSnapshotLinux;\

      '
    replace: 'class CrashReportUploadThread;

      class ProcessSnapshotLinux;

      '
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\ \ CrashReportUploadThread\*\ upload_thread_;\ \ //\ weak\

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  CrashReportUploadThread* upload_thread_;  // weak\n#endif\n"
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ const\ std::vector<base::FilePath>\*\ attachments_;\ \ //\ weak\

      '
    replace: '  const std::vector<base::FilePath>* attachments_;                 // weak

      '
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\#include\ "build/build_config\.h"\

      '
    replace: ''
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\#include\ <string>\

      \

      '
    replace: '#include <string>


      #include "build/build_config.h"

      '
