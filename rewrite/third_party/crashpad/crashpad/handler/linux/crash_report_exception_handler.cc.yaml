# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\ \ \ \ \ \ upload_thread_\(upload_thread\),\

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      upload_thread_(upload_thread),\n#endif\n"
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ DCHECK\(write_minidump_to_database_\ \|\ write_minidump_to_log_\);\

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Keep the local exception-handler constructor contract without a uploader.\n  (void)upload_thread;\n#endif\n  DCHECK(write_minidump_to_database_ | write_minidump_to_log_);\n"
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\ \ if\ \(upload_thread_\)\ \{\

      \ \ \ \ upload_thread_\->ReportPending\(uuid\);\

      \ \ \}\

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (upload_thread_) {\n    upload_thread_->ReportPending(uuid);\n  }\n#endif\n"
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ write_minidump_to_log_,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ local_report_id\)\

      '
    replace: '                                       write_minidump_to_log_, local_report_id)

      '
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ if\ \(!CaptureSnapshot\(connection,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ info,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \*process_annotations_,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ client_uid,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ requesting_thread_stack_address,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ requesting_thread_id,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&process_snapshot,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&sanitized_snapshot\)\)\ \{\

      '
    replace: "  if (!CaptureSnapshot(connection, info, *process_annotations_, client_uid,\n                       requesting_thread_stack_address, requesting_thread_id,\n                       &process_snapshot, &sanitized_snapshot)) {\n"
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ return\ HandleExceptionWithConnection\(\

      \ \ \ \ \ \ \&client,\ info,\ client_uid,\ 0,\ nullptr,\ local_report_id\);\

      '
    replace: "  return HandleExceptionWithConnection(&client, info, client_uid, 0, nullptr,\n                                       local_report_id);\n"
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ requesting_thread_id,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ local_report_id\);\

      '
    replace: '                                       requesting_thread_id, local_report_id);

      '
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ return\ HandleExceptionWithConnection\(\&connection,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ info,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ client_uid,\

      '
    replace: '  return HandleExceptionWithConnection(&connection, info, client_uid,

      '
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \ \ return\ __android_log_buf_write\(\

      \ \ \ \ \ \ \ \ LOG_ID_CRASH,\ ANDROID_LOG_FATAL,\ "crashpad",\ buf\)\ >\ 0;\

      '
    replace: "    return __android_log_buf_write(LOG_ID_CRASH, ANDROID_LOG_FATAL, \"crashpad\",\n                                   buf) > 0;\n"
