# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ "net/http_transport\.cc",\

      \ \ \ \ "net/http_transport\.h",\

      \ \ \ \ "net/url\.cc",\

      \ \ \ \ "net/url\.h",\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ if\ \(crashpad_http_transport_impl\ ==\ "socket"\)\ \{\

      '
    replace: "  if (!crashpad_is_android) {\n    sources += [\n      \"net/http_transport.cc\",\n      \"net/http_transport.h\",\n      \"net/url.cc\",\n      \"net/url.h\",\n    ]\n  }\n\n  if (!crashpad_is_android && crashpad_http_transport_impl == \"socket\") {\n"
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \}\ else\ if\ \(crashpad_http_transport_impl\ ==\ "libcurl"\)\ \{\

      '
    replace: '  } else if (!crashpad_is_android && crashpad_http_transport_impl == "libcurl") {

      '
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ "net/url_test\.cc",\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ if\ \(!crashpad_is_android\ \&\&\ !crashpad_is_ios\ \&\&\ !crashpad_is_fuchsia\)\ \{\

      \ \ \ \ \#\ Android\ requires\ an\ HTTPTransport\ implementation\.\

      '
    replace: "  if (!crashpad_is_android) {\n    sources += [ \"net/url_test.cc\" ]\n  }\n  if (!crashpad_is_android && !crashpad_is_ios && !crashpad_is_fuchsia) {\n    # Transport tests are excluded with the Android sender implementation.\n"
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \}\ else\ if\ \(!crashpad_is_android\ \&\&\ crashpad_http_transport_impl\ ==\ "libcurl"\)\ \{\

      '
    replace: "  } else if (!crashpad_is_android &&\n             crashpad_http_transport_impl == \"libcurl\") {\n"
