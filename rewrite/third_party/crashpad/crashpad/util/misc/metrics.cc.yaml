# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Physically exclude Android Crashpad UMA implementation and includes
  regex:
    re_pattern: '\#include\ "base/metrics/histogram_functions\.h"\

      \#include\ "base/metrics/histogram_macros\.h"\

      \#include\ "base/numerics/safe_conversions\.h"\

      \#include\ "build/build_config\.h"\

      \

      \#if\ BUILDFLAG\(IS_APPLE\)\

      \#define\ METRICS_OS_NAME\ "Mac"\

      \#elif\ BUILDFLAG\(IS_WIN\)\

      \#define\ METRICS_OS_NAME\ "Win"\

      \#elif\ BUILDFLAG\(IS_ANDROID\)\

      \#define\ METRICS_OS_NAME\ "Android"\

      \#elif\ BUILDFLAG\(IS_LINUX\)\ \|\|\ BUILDFLAG\(IS_CHROMEOS\)\

      \#define\ METRICS_OS_NAME\ "Linux"\

      \#elif\ BUILDFLAG\(IS_FUCHSIA\)\

      \#define\ METRICS_OS_NAME\ "Fuchsia"\

      \#endif\

      \

      namespace\ crashpad\ \{\

      \

      namespace\ \{\

      \

      //!\ \\brief\ Metrics\ values\ used\ to\ track\ the\ start\ and\ completion\ of\ a\ crash\

      //!\ \ \ \ \ handling\.\ These\ are\ used\ as\ metrics\ values\ directly,\ so\

      //!\ \ \ \ \ enumeration\ values\ so\ new\ values\ should\ always\ be\ added\ at\ the\ end,\

      //!\ \ \ \ \ before\ kMaxValue\.\

      enum\ class\ ExceptionProcessingState\ \{\

      \ \ //!\ \\brief\ Logged\ when\ exception\ processing\ is\ started\.\

      \ \ kStarted\ =\ 0,\

      \

      \ \ //!\ \\brief\ Logged\ when\ exception\ processing\ completes\.\

      \ \ kFinished\ =\ 1,\

      \

      \ \ //!\ \\brief\ The\ highest\ valid\ value\ in\ this\ enumeration\.\

      \ \ kMaxValue\ =\ kFinished,\

      \};\

      \

      void\ ExceptionProcessing\(ExceptionProcessingState\ state\)\ \{\

      \ \ UMA_HISTOGRAM_ENUMERATION\("Crashpad\.ExceptionEncountered",\ state\);\

      \}\

      \

      \}\ \ //\ namespace\

      \

      //\ static\

      void\ Metrics::CrashReportPending\(PendingReportReason\ reason\)\ \{\

      \ \ UMA_HISTOGRAM_ENUMERATION\("Crashpad\.CrashReportPending",\ reason\);\

      \}\

      \

      //\ static\

      void\ Metrics::CrashReportSize\(FileOffset\ size\)\ \{\

      \ \ UMA_HISTOGRAM_CUSTOM_COUNTS\("Crashpad\.CrashReportSize",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::saturated_cast<uint32_t>\(size\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 0,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 20\ \*\ 1024\ \*\ 1024,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 50\);\

      \}\

      \

      //\ static\

      void\ Metrics::CrashUploadAttempted\(bool\ successful\)\ \{\

      \ \ UMA_HISTOGRAM_BOOLEAN\("Crashpad\.CrashUpload\.AttemptSuccessful",\ successful\);\

      \}\

      \

      \#if\ BUILDFLAG\(IS_APPLE\)\

      //\ static\

      void\ Metrics::CrashUploadErrorCode\(int\ error_code\)\ \{\

      \ \ base::UmaHistogramSparse\("Crashpad\.CrashUpload\.ErrorCode",\ error_code\);\

      \}\

      \#endif\

      \

      //\ static\

      void\ Metrics::CrashUploadSkipped\(CrashSkippedReason\ reason\)\ \{\

      \ \ UMA_HISTOGRAM_ENUMERATION\("Crashpad\.CrashUpload\.Skipped",\ reason\);\

      \}\

      \

      //\ static\

      void\ Metrics::ExceptionCaptureResult\(CaptureResult\ result\)\ \{\

      \ \ ExceptionProcessing\(ExceptionProcessingState::kFinished\);\

      \ \ UMA_HISTOGRAM_ENUMERATION\("Crashpad\.ExceptionCaptureResult",\ result\);\

      \}\

      \

      //\ static\

      void\ Metrics::ExceptionCode\(uint32_t\ exception_code\)\ \{\

      \ \ base::UmaHistogramSparse\("Crashpad\.ExceptionCode\."\ METRICS_OS_NAME,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ exception_code\);\

      \}\

      \

      //\ static\

      void\ Metrics::ExceptionEncountered\(\)\ \{\

      \ \ ExceptionProcessing\(ExceptionProcessingState::kStarted\);\

      \}\

      \

      //\ static\

      void\ Metrics::HandlerLifetimeMilestone\(LifetimeMilestone\ milestone\)\ \{\

      \ \ UMA_HISTOGRAM_ENUMERATION\("Crashpad\.HandlerLifetimeMilestone",\ milestone\);\

      \}\

      \

      //\ static\

      void\ Metrics::HandlerCrashed\(uint32_t\ exception_code\)\ \{\

      \ \ base::UmaHistogramSparse\(\

      \ \ \ \ \ \ "Crashpad\.HandlerCrash\.ExceptionCode\."\ METRICS_OS_NAME,\ exception_code\);\

      \}\

      \

      \#if\ BUILDFLAG\(IS_IOS\)\

      //\ static\

      void\ Metrics::MissingIntermediateDumpKey\(\

      \ \ \ \ const\ internal::IntermediateDumpKey\&\ key\)\ \{\

      \ \ base::UmaHistogramSparse\("Crashpad\.IntermediateDump\.Reader\.MissingKey",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ static_cast<uint16_t>\(key\)\);\

      \}\

      \

      //\ static\

      void\ Metrics::InvalidIntermediateDumpKeySize\(\

      \ \ \ \ const\ internal::IntermediateDumpKey\&\ key\)\ \{\

      \ \ base::UmaHistogramSparse\("Crashpad\.IntermediateDump\.Reader\.InvalidKeySize",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ static_cast<uint16_t>\(key\)\);\

      \}\

      \#endif\

      \

      //\ static\

      \

      \}\ \ //\ namespace\ crashpad\

      '
    replace: "#include \"build/build_config.h\"\n\n#if BUILDFLAG(IS_ANDROID)\nnamespace crashpad {\n// Local capture keeps the Metrics ABI; no Android recorder is instantiated.\nvoid Metrics::CrashReportPending(PendingReportReason) {}\nvoid Metrics::CrashReportSize(FileOffset) {}\nvoid Metrics::CrashUploadAttempted(bool) {}\nvoid Metrics::CrashUploadSkipped(CrashSkippedReason) {}\nvoid Metrics::ExceptionCaptureResult(CaptureResult) {}\nvoid Metrics::ExceptionCode(uint32_t) {}\nvoid Metrics::ExceptionEncountered() {}\nvoid Metrics::HandlerLifetimeMilestone(LifetimeMilestone) {}\nvoid Metrics::HandlerCrashed(uint32_t) {}\n}  // namespace crashpad\n#else\n#include \"base/metrics/histogram_functions.h\"\n#include \"base/metrics/histogram_macros.h\"\n#include \"base/numerics/safe_conversions.h\"\n#include \"build/build_config.h\"\n\n#if BUILDFLAG(IS_APPLE)\n#define METRICS_OS_NAME \"Mac\"\n#elif BUILDFLAG(IS_WIN)\n#define METRICS_OS_NAME \"Win\"\n#elif BUILDFLAG(IS_ANDROID)\n#define METRICS_OS_NAME \"Android\"\n#elif BUILDFLAG(IS_LINUX) || BUILDFLAG(IS_CHROMEOS)\n#define METRICS_OS_NAME \"Linux\"\n#elif BUILDFLAG(IS_FUCHSIA)\n#define METRICS_OS_NAME \"Fuchsia\"\n#endif\n\nnamespace crashpad {\n\nnamespace {\n\n//! \\\\brief Metrics values used to track the start and completion of a crash\n//!     handling. These are used as metrics values directly, so\n//!     enumeration values so new values should always be added at the end,\n//!     before kMaxValue.\nenum class ExceptionProcessingState {\n  //! \\\\brief Logged when exception processing is started.\n  kStarted = 0,\n\n  //! \\\\brief Logged when exception processing completes.\n  kFinished = 1,\n\n  //! \\\\brief The highest valid value in this enumeration.\n  kMaxValue = kFinished,\n};\n\nvoid ExceptionProcessing(ExceptionProcessingState state) {\n  UMA_HISTOGRAM_ENUMERATION(\"Crashpad.ExceptionEncountered\", state);\n}\n\n}  // namespace\n\n// static\nvoid Metrics::CrashReportPending(PendingReportReason reason) {\n  UMA_HISTOGRAM_ENUMERATION(\"Crashpad.CrashReportPending\", reason);\n}\n\n// static\nvoid Metrics::CrashReportSize(FileOffset size) {\n  UMA_HISTOGRAM_CUSTOM_COUNTS(\"Crashpad.CrashReportSize\",\n                              base::saturated_cast<uint32_t>(size),\n                              0,\n                              20 * 1024 * 1024,\n                              50);\n}\n\n// static\nvoid Metrics::CrashUploadAttempted(bool successful) {\n  UMA_HISTOGRAM_BOOLEAN(\"Crashpad.CrashUpload.AttemptSuccessful\", successful);\n}\n\n#if BUILDFLAG(IS_APPLE)\n// static\nvoid Metrics::CrashUploadErrorCode(int error_code) {\n  base::UmaHistogramSparse(\"Crashpad.CrashUpload.ErrorCode\", error_code);\n}\n#endif\n\n// static\nvoid Metrics::CrashUploadSkipped(CrashSkippedReason reason) {\n  UMA_HISTOGRAM_ENUMERATION(\"Crashpad.CrashUpload.Skipped\", reason);\n}\n\n// static\nvoid Metrics::ExceptionCaptureResult(CaptureResult result) {\n  ExceptionProcessing(ExceptionProcessingState::kFinished);\n  UMA_HISTOGRAM_ENUMERATION(\"Crashpad.ExceptionCaptureResult\", result);\n}\n\n// static\nvoid Metrics::ExceptionCode(uint32_t exception_code) {\n  base::UmaHistogramSparse(\"Crashpad.ExceptionCode.\" METRICS_OS_NAME,\n                           exception_code);\n}\n\n// static\nvoid Metrics::ExceptionEncountered() {\n  ExceptionProcessing(ExceptionProcessingState::kStarted);\n}\n\n// static\nvoid Metrics::HandlerLifetimeMilestone(LifetimeMilestone milestone) {\n  UMA_HISTOGRAM_ENUMERATION(\"Crashpad.HandlerLifetimeMilestone\", milestone);\n}\n\n// static\nvoid Metrics::HandlerCrashed(uint32_t exception_code) {\n  base::UmaHistogramSparse(\n      \"Crashpad.HandlerCrash.ExceptionCode.\" METRICS_OS_NAME, exception_code);\n}\n\n#if BUILDFLAG(IS_IOS)\n// static\nvoid Metrics::MissingIntermediateDumpKey(\n    const internal::IntermediateDumpKey& key) {\n  base::UmaHistogramSparse(\"Crashpad.IntermediateDump.Reader.MissingKey\",\n                           static_cast<uint16_t>(key));\n}\n\n// static\nvoid Metrics::InvalidIntermediateDumpKeySize(\n    const internal::IntermediateDumpKey& key) {\n  base::UmaHistogramSparse(\"Crashpad.IntermediateDump.Reader.InvalidKeySize\",\n                           static_cast<uint16_t>(key));\n}\n#endif\n\n// static\n\n}  // namespace crashpad\n\n#endif  // BUILDFLAG(IS_ANDROID)\n"
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ base::saturated_cast<uint32_t>\(size\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 0,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 20\ \*\ 1024\ \*\ 1024,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ 50\);\

      '
    replace: "                              base::saturated_cast<uint32_t>(size), 0,\n                              20 * 1024 * 1024, 50);\n"
