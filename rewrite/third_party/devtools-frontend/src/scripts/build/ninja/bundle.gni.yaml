substitutions:
  - description: "0564 Android DevTools AI producer boundary 1 for scripts/build/ninja/bundle.gni"
    regex:
      pattern: "      \"--depfile\",\n      rebase_path(_depfile, root_build_dir),\n    ]\n\n    if (_sourcemap) {\n      args += [ \"--configSourcemaps\" ]\n"
      replace: "      \"--depfile\",\n      rebase_path(_depfile, root_build_dir),\n    ]\n\n    if (defined(invoker.prefer_generated_ts) && invoker.prefer_generated_ts) {\n      args += [\n        \"--preferGeneratedTs\",\n        \"--processedSourcesFile\",\n        rebase_path(_android_sources_file, root_build_dir),\n      ]\n    }\n\n    if (_sourcemap) {\n      args += [ \"--configSourcemaps\" ]\n"
    count: 1
  - description: "0564 Android DevTools AI producer boundary 2 for scripts/build/ninja/bundle.gni"
    regex:
      pattern: "    ]\n    if (defined(invoker.inputs)) {\n      inputs += invoker.inputs\n    }\n\n    if (!_bundle_all) {\n"
      replace: "    ]\n    if (defined(invoker.inputs)) {\n      inputs += invoker.inputs\n    }\n    if (_android_sources_file != \"\") {\n      inputs += [ _android_sources_file ]\n    }\n\n    if (!_bundle_all) {\n"
    count: 1
  - description: "0564 Android DevTools AI producer boundary 3 for scripts/build/ninja/bundle.gni"
    regex:
      pattern: "    _sourcemap = false\n  }\n\n  node_action(target_name) {\n    script = \"scripts/build/esbuild.js\"\n\n    deps = []\n    if (defined(invoker.deps)) {\n      deps += invoker.deps\n    }\n\n    # esbuild resolves the module type and package configuration from\n"
      replace: "    _sourcemap = false\n  }\n\n  _android_sources_target = \"\"\n  _android_sources_file = \"\"\n  if (defined(invoker.prefer_generated_ts) && invoker.prefer_generated_ts) {\n    _android_sources_target = \"${target_name}_android_sources\"\n    _android_sources_file = \"$target_gen_dir/$_android_sources_target.json\"\n    generated_file(_android_sources_target) {\n      outputs = [ _android_sources_file ]\n      output_conversion = \"json\"\n      data_keys = [ \"android_processed_ts_files\" ]\n      if (defined(invoker.deps)) {\n        deps = invoker.deps\n      }\n    }\n  }\n\n  node_action(target_name) {\n    script = \"scripts/build/esbuild.js\"\n\n    deps = []\n    if (defined(invoker.deps)) {\n      deps += invoker.deps\n    }\n\n    if (_android_sources_target != \"\") {\n      deps += [ \":$_android_sources_target\" ]\n    }\n\n    # esbuild resolves the module type and package configuration from\n"
    count: 1
