substitutions:
  - description: "0564 Android DevTools AI producer boundary 1 for scripts/build/ninja/devtools_entrypoint.gni"
    regex:
      pattern: "    # 2. Bundle from the source TS file to out/<config>/gen.\n    bundle(_bundle_target) {\n      entrypoint = invoker.entrypoint\n      output_file_location = \"$target_gen_dir/$_file_name.js\"\n      deps = _bundle_deps\n      forward_variables_from(invoker, [ \"testonly\" ])\n      visibility = [ \":*\" ]\n    }\n"
      replace: "    # 2. Bundle from the source TS file to out/<config>/gen.\n    bundle(_bundle_target) {\n      entrypoint = invoker.entrypoint\n      if (defined(target_os) && target_os == \"android\" &&\n          defined(invoker.android_preprocess) && invoker.android_preprocess) {\n        _processed_entrypoint =\n            get_target_outputs(\":${_ts_target}_android_preprocess\")\n        entrypoint = _processed_entrypoint[0]\n        prefer_generated_ts = true\n      }\n      output_file_location = \"$target_gen_dir/$_file_name.js\"\n      deps = _bundle_deps\n      if (defined(target_os) && target_os == \"android\" &&\n          defined(invoker.android_preprocess) && invoker.android_preprocess) {\n        deps += [ \":${_ts_target}_android_preprocess\" ]\n      }\n      forward_variables_from(invoker, [ \"testonly\" ])\n      visibility = [ \":*\" ]\n    }\n"
    count: 1
  - description: "0564 Android DevTools AI producer boundary 2 for scripts/build/ninja/devtools_entrypoint.gni"
    regex:
      pattern: "\n    group(_sources_target) {\n      forward_variables_from(invoker, [ \"testonly\" ])\n    }\n\n    _bundle_deps = [ \":$_sources_target\" ]\n"
      replace: "\n    group(_sources_target) {\n      forward_variables_from(invoker, [ \"testonly\" ])\n      if (defined(target_os) && target_os == \"android\" &&\n          defined(invoker.android_preprocess) && invoker.android_preprocess) {\n        metadata = {\n          android_processed_ts_files =\n              rebase_path(get_target_outputs(\":${_ts_target}_android_preprocess\"),\n                          root_gen_dir)\n        }\n      }\n    }\n\n    _bundle_deps = [ \":$_sources_target\" ]\n"
    count: 1
