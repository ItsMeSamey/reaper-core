substitutions:
  - description: "0564 Android DevTools AI producer boundary 1 for scripts/build/ninja/devtools_module.gni"
    regex:
      pattern: "      deps = invoker.deps\n    }\n\n    es_target = \"es2023\"\n    es_libs = []\n    runs_in = \"node\"\n  }\n\n  ts_library(target_name) {\n    forward_variables_from(invoker, \"*\", [ \"visibility\" ])\n\n    es_target = \"es2023\"\n    es_libs = [\n      \"dom\",\n      \"dom.iterable\",\n    ]\n\n    visibility += [ \":*\" ]\n\n    public_deps += [ \":$_node_type_check_target\" ]\n  }\n}\n\ntemplate(\"devtools_ui_module\") {\n"
      replace: "      deps = invoker.deps\n    }\n\n    sources = invoker.sources\n    if (defined(invoker.rootdir)) {\n      rootdir = invoker.rootdir\n    }\n    if (defined(target_os) && target_os == \"android\" &&\n        defined(invoker.android_preprocess) && invoker.android_preprocess) {\n      sources = get_target_outputs(\":$_android_preprocess_target\")\n      rootdir = target_gen_dir\n      if (!defined(deps)) {\n        deps = []\n      }\n      deps += [ \":$_android_preprocess_target\" ]\n    }\n\n    es_target = \"es2023\"\n    es_libs = []\n    runs_in = \"node\"\n  }\n\n}\n\ntemplate(\"devtools_ui_module\") {\n"
    count: 1
