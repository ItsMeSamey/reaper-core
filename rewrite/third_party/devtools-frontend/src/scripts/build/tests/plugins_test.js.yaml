      replace: "    }\n  });\n});\n\n\ndescribe('esbuild_plugin current Android processed-source ownership', () => {\n  const root = path.resolve(import.meta.dirname, '../../..');\n  const gen = path.join(root, 'out/Default/gen');\n  const relative = 'front_end/core/root/Owned.ts';\n  const rawTs = path.join(root, relative);\n  const rawJs = rawTs.slice(0, -3) + '.js';\n  const generatedTs = path.join(gen, relative);\n  const importer = path.join(root, 'front_end/core/root/root.ts');\n  const generatedImporter = path.join(gen, 'front_end/core/root/root.ts');\n  const outdir = path.dirname(generatedImporter);\n  let existsStub;\n\n  beforeEach(() => {\n    existsStub = sinon.stub(fs, 'existsSync').returns(false);\n  });\n\n  afterEach(() => {\n    existsStub.restore();\n  });\n\n  it('prefers the current declared processed TS over existing ordinary JS and TS', () => {\n    existsStub.withArgs(rawJs).returns(true);\n    existsStub.withArgs(rawTs).returns(true);\n    existsStub.withArgs(generatedTs).returns(true);\n    const plugin = esbuildPlugin(outdir, gen, root, new Set(), false, true, new Set([relative]));\n    assert.deepEqual(plugin({path: './Owned.js', importer}), {path: generatedTs});\n  });\n\n  it('does not resurrect stale generated TS absent from current producer metadata', () => {\n    existsStub.withArgs(rawTs).returns(true);\n    existsStub.withArgs(generatedTs).returns(true);\n    const plugin = esbuildPlugin(outdir, gen, root, new Set(), false, true, new Set());\n    assert.deepEqual(plugin({path: './Owned.js', importer}), {path: rawTs});\n  });\n\n  it('resolves ordinary nonmembers from a generated importer back to current source', () => {\n    existsStub.withArgs(rawTs).returns(true);\n    existsStub.withArgs(generatedTs).returns(true);\n    const plugin = esbuildPlugin(outdir, gen, root, new Set(), false, true, new Set());\n    assert.deepEqual(plugin({path: './Owned.js', importer: generatedImporter}), {path: rawTs});\n  });\n\n  it('keeps a missing declared output as a missing output instead of using raw source', () => {\n    existsStub.withArgs(rawJs).returns(true);\n    existsStub.withArgs(rawTs).returns(true);\n    const plugin = esbuildPlugin(outdir, gen, root, new Set(), false, true, new Set([relative]));\n    assert.deepEqual(plugin({path: './Owned.js', importer}), {path: generatedTs});\n    assert.isFalse(fs.existsSync(generatedTs));\n  });\n\n  it('keeps separate entrypoint imports external even if their sources are processed', () => {\n    const external = new Set(['front_end/core/root/Owned.js']);\n    const plugin = esbuildPlugin(outdir, gen, root, external, false, true, new Set([relative]));\n    assert.deepEqual(plugin({path: './Owned.js', importer}), {path: './Owned.js', external: true});\n  });\n\n  it('leaves the ordinary source preference intact when Android preprocessing is off', () => {\n    existsStub.withArgs(rawTs).returns(true);\n    existsStub.withArgs(generatedTs).returns(true);\n    const plugin = esbuildPlugin(outdir, gen, root, new Set(), false, false, new Set([relative]));\n    assert.deepEqual(plugin({path: './Owned.js', importer}), {path: rawTs});\n  });\n\n  it('keeps the existing generated CSS fallback for nonmembers', () => {\n    const generatedCss = path.join(gen, 'front_end/core/root/ordinary.css.js');\n    existsStub.withArgs(generatedCss).returns(true);\n    const plugin = esbuildPlugin(outdir, gen, root, new Set(), false, true, new Set());\n    assert.deepEqual(plugin({path: './ordinary.css.js', importer}), {path: generatedCss});\n  });\n\n  it('keeps the existing Brave patch sibling fallback for nonmembers', () => {\n    const patchTs = path.join(root, 'brave/chromium_src/front_end/core/root/Owned.ts');\n    existsStub.withArgs(patchTs).returns(true);\n    const plugin = esbuildPlugin(outdir, gen, root, new Set(), false, true, new Set());\n    assert.deepEqual(plugin({path: './Owned.patch.js', importer}), {path: patchTs});\n  });\n});\n"
