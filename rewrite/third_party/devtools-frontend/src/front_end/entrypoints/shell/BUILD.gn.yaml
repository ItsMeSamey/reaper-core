substitutions:
  - description: "0564 Android DevTools AI producer boundary 1 for front_end/entrypoints/shell/BUILD.gn"
    regex:
      pattern: "  ]\n\n  visibility += devtools_entrypoints_visibility\n}\n"
      replace: "  ]\n\n  visibility += devtools_entrypoints_visibility\n  if (defined(target_os) && target_os == \"android\") {\n    ts_deps -= [\n      \"../../panels/ai_assistance:meta\",\n      \"../../panels/explain:meta\",\n    ]\n  }\n}\n"
    count: 1
  - description: "0564 Android DevTools AI producer boundary 2 for front_end/entrypoints/shell/BUILD.gn"
    regex:
      pattern: "import(\"../visibility.gni\")\n\ndevtools_entrypoint(\"shell\") {\n  entrypoint = \"shell.ts\"\n\n  deps = [ \"../../Images:optimize_images\" ]\n"
      replace: "import(\"../visibility.gni\")\n\ndevtools_entrypoint(\"shell\") {\n  android_preprocess = true\n  entrypoint = \"shell.ts\"\n\n  deps = [ \"../../Images:optimize_images\" ]\n"
    count: 1
