substitutions:
  - description: Add the Brave network panel sources.
    add_literal_to_list:
      target: network
      type: devtools_ui_module
      list_name: sources
      literal: brave_devtools_front_end_panels_network_sources
      import: //brave/third_party/devtools-frontend/src/front_end/panels/network/sources.gni

  - description: Add the Brave network panel deps.
    add_literal_to_list:
      target: network
      type: devtools_ui_module
      list_name: ts_deps
      literal: brave_devtools_front_end_panels_network_ts_deps
      import: //brave/third_party/devtools-frontend/src/front_end/panels/network/sources.gni
  - description: "0564 Android DevTools AI producer boundary 1 for front_end/panels/network/BUILD.gn"
    regex:
      pattern: "    \"./forward:bundle\",\n  ]\n  ts_deps += brave_devtools_front_end_panels_network_ts_deps\n}\n\ndevtools_entrypoint(\"bundle\") {\n  entrypoint = \"network.ts\"\n\n  deps = [\n"
      replace: "    \"./forward:bundle\",\n  ]\n  ts_deps += brave_devtools_front_end_panels_network_ts_deps\n  if (defined(target_os) && target_os == \"android\") {\n    ts_deps -= [\n      \"../../models/ai_assistance:bundle\",\n    ]\n    android_patch_sources = [\n      {\n        source = \"//brave/chromium_src/third_party/devtools-frontend/src/front_end/panels/network/NetworkDataGridNode.ts\"\n        file = \"NetworkDataGridNode.patch.ts\"\n      },\n      {\n        source = \"//brave/chromium_src/third_party/devtools-frontend/src/front_end/panels/network/NetworkItemView.ts\"\n        file = \"NetworkItemView.patch.ts\"\n      },\n    ]\n  }\n}\n\ndevtools_entrypoint(\"bundle\") {\n  android_preprocess = true\n  entrypoint = \"network.ts\"\n\n  deps = [\n"
    count: 1
  - description: "0564 Android DevTools AI producer boundary 2 for front_end/panels/network/BUILD.gn"
    regex:
      pattern: "}\n\ndevtools_ui_module(\"network\") {\n  sources = [\n    \"BinaryResourceView.ts\",\n    \"EventSourceMessagesView.ts\",\n"
      replace: "}\n\ndevtools_ui_module(\"network\") {\n  android_preprocess = true\n  sources = [\n    \"BinaryResourceView.ts\",\n    \"EventSourceMessagesView.ts\",\n"
    count: 1
