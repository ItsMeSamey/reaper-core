substitutions:
  - description: "0574 Android DevTools integration for front_end/third_party/codemirror.next/BUILD.gn"
    regex:
      pattern: "    \"codemirror.next.js.map\",\n  ]\n}\n"
      replace: "    \"codemirror.next.js.map\",\n  ]\n\n  if (defined(target_os) && target_os == \"android\") {\n    # Keep one declaration identity for raw and generated TypeScript consumers.\n    # Runtime JavaScript and source maps still use the ordinary copy target.\n    sources -= [ \"codemirror.next.d.ts\" ]\n    public_deps = [\n      \":canonical_types\",\n      \":bundle_tsconfig_ref\",\n    ]\n  }\n}\n\nif (defined(target_os) && target_os == \"android\") {\n  _canonical_declaration_import =\n      rebase_path(\"codemirror.next.js\", target_gen_dir)\n  group(\"canonical_types\") {\n    public_inputs = [\n      \"codemirror.next.d.ts\",\n      \"$target_gen_dir/codemirror.next.d.ts\",\n    ]\n    public_deps = [ \":canonical_types_file\" ]\n  }\n\n  generated_file(\"canonical_types_file\") {\n    outputs = [ \"$target_gen_dir/codemirror.next.d.ts\" ]\n    output_conversion = \"list lines\"\n    contents = [ \"export * from \\\\\"$_canonical_declaration_import\\\\\";\" ]\n  }\n\n  # Match the standard prebuilt reference contract without duplicating types.\n  generated_file(\"bundle_tsconfig_ref\") {\n    outputs = [ \"$target_gen_dir/bundle-tsconfig.ref.json\" ]\n    output_conversion = \"json\"\n    contents = {\n      compilerOptions = {\n        composite = true\n        declaration = true\n        skipLibCheck = true\n        rootDir = \".\"\n        outDir = \".\"\n      }\n      files = [ \"codemirror.next.d.ts\" ]\n      references = []\n    }\n  }\n}\n"
    count: 1
