substitutions:
  - description: "0564 Android DevTools AI producer boundary 1 for front_end/BUILD.gn"
    regex:
      pattern: "\ngroup(\"front_end\") {\n  public_deps = [\n    \":color_tokens\",\n    \":devtools_json\",\n    \":embedder-scripts\",\n    \":html_entrypoints\",\n    \"Images\",\n    \"core/i18n/locales\",\n    \"entrypoints/device_mode_emulation_frame\",\n    \"entrypoints/devtools_app:entrypoint\",\n    \"entrypoints/formatter_worker:worker_entrypoint\",\n"
      replace: "\ngroup(\"front_end\") {\n  public_deps = [\n    \":frontend_sources\",\n    \"core/i18n/locales\",\n  ]\n}\n\n# Keep locale collection downstream of production sources, without making\n# TypeScript or bundle production depend on the locale resource outputs.\ngroup(\"frontend_sources\") {\n  public_deps = [\n    \":color_tokens\",\n    \":devtools_json\",\n    \":embedder-scripts\",\n    \":html_entrypoints\",\n    \"Images\",\n    \"entrypoints/device_mode_emulation_frame\",\n    \"entrypoints/devtools_app:entrypoint\",\n    \"entrypoints/formatter_worker:worker_entrypoint\",\n"
    count: 1
