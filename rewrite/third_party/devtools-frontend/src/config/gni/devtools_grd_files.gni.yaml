substitutions:
  - description: Add the Brave devtools unbundled grd sources.
    add_literal_to_variable:
      variable: grd_files_unbundled_sources
      literal: brave_grd_files_unbundled_sources
      import: //brave/third_party/devtools-frontend/src/config/gni/sources.gni
  - description: "0564 Android DevTools AI producer boundary 1 for config/gni/devtools_grd_files.gni"
    regex:
      pattern: "]\ngrd_files_unbundled_sources += brave_grd_files_unbundled_sources\n\n# Confirm that there is no overlap between the two lists.\n_grd_files_bundled_sources =\n    filter_exclude(grd_files_bundled_sources, grd_files_unbundled_sources)\n"
      replace: "]\ngrd_files_unbundled_sources += brave_grd_files_unbundled_sources\n\n# Android callers and GN production dependencies compile the dedicated AI\n# implementations out. Keep the expected resource catalog in step with those\n# producers for both bundled and unbundled DevTools builds.\nif (defined(target_os) && target_os == \"android\") {\n  grd_files_bundled_sources = filter_exclude(grd_files_bundled_sources, [\n    \"front_end/Images/geminiInDevTools.png\",\n    \"front_end/Images/geminiInDevTools_2x.png\",\n    \"front_end/models/ai_assistance/*\",\n    \"front_end/models/ai_code_completion/*\",\n    \"front_end/models/ai_code_generation/*\",\n    \"front_end/panels/ai_assistance/*\",\n    \"front_end/panels/explain/*\",\n  ])\n  grd_files_unbundled_sources = filter_exclude(grd_files_unbundled_sources, [\n    \"front_end/models/ai_assistance/*\",\n    \"front_end/models/ai_code_completion/*\",\n    \"front_end/models/ai_code_generation/*\",\n    \"front_end/panels/ai_assistance/*\",\n    \"front_end/panels/explain/*\",\n    \"front_end/core/host/AidaGcaTranslation.js\",\n    \"front_end/core/host/GcaClient.js\",\n    \"front_end/entrypoints/main/GlobalAiButton.js\",\n    \"front_end/entrypoints/main/globalAiButton.css.js\",\n    \"front_end/panels/common/AiCodeCompletionSummaryToolbar.js\",\n    \"front_end/panels/common/GeminiRebrandPromoDialog.js\",\n    \"front_end/panels/common/aiCodeCompletionSummaryToolbar.css.js\",\n    \"front_end/panels/common/geminiRebrandPromoDialog.css.js\",\n    \"front_end/panels/console/ConsoleInsightTeaser.js\",\n    \"front_end/panels/console/PromptBuilder.js\",\n    \"front_end/panels/console/consoleInsightTeaser.css.js\",\n    \"front_end/panels/elements/StylesAiCodeCompletionProvider.js\",\n    \"front_end/panels/settings/AISettingsTab.js\",\n    \"front_end/panels/settings/aiSettingsTab.css.js\",\n    \"front_end/panels/sources/AiCodeCompletionPlugin.js\",\n    \"front_end/ui/components/text_editor/AiCodeCompletionDisclaimer.js\",\n    \"front_end/ui/components/text_editor/AiCodeCompletionProvider.js\",\n    \"front_end/ui/components/text_editor/AiCodeCompletionTeaser.js\",\n    \"front_end/ui/components/text_editor/AiCodeGenerationParser.js\",\n    \"front_end/ui/components/text_editor/AiCodeGenerationProvider.js\",\n    \"front_end/ui/components/text_editor/AiCodeGenerationTeaser.js\",\n    \"front_end/ui/components/text_editor/AiCodeGenerationUpgradeDialog.js\",\n    \"front_end/ui/components/text_editor/aiCodeCompletionDisclaimer.css.js\",\n    \"front_end/ui/components/text_editor/aiCodeCompletionTeaser.css.js\",\n    \"front_end/ui/components/text_editor/aiCodeGenerationTeaser.css.js\",\n    \"front_end/ui/components/text_editor/aiCodeGenerationUpgradeDialog.css.js\",\n    \"front_end/ui/legacy/components/data_grid/dataGridAiButton.css.js\",\n  ])\n}\n\n# Confirm that there is no overlap between the two lists.\n_grd_files_bundled_sources =\n    filter_exclude(grd_files_bundled_sources, grd_files_unbundled_sources)\n"
    count: 1
  - description: "0569 Android GN list maintenance 1 for config/gni/devtools_grd_files.gni"
    regex:
      pattern: "  grd_files_bundled_sources = filter_exclude(grd_files_bundled_sources, [\n    \"front_end/Images/geminiInDevTools.png\",\n    \"front_end/Images/geminiInDevTools_2x.png\",\n    \"front_end/models/ai_assistance/*\",\n    \"front_end/models/ai_code_completion/*\",\n    \"front_end/models/ai_code_generation/*\",\n    \"front_end/panels/ai_assistance/*\",\n    \"front_end/panels/explain/*\",\n  ])\n"
      replace: "  _reaper_filtered_grd_files_bundled_sources = filter_exclude(grd_files_bundled_sources, [\n    \"front_end/Images/geminiInDevTools.png\",\n    \"front_end/Images/geminiInDevTools_2x.png\",\n    \"front_end/models/ai_assistance/*\",\n    \"front_end/models/ai_code_completion/*\",\n    \"front_end/models/ai_code_generation/*\",\n    \"front_end/panels/ai_assistance/*\",\n    \"front_end/panels/explain/*\",\n  ])\n  grd_files_bundled_sources = []\n  grd_files_bundled_sources = _reaper_filtered_grd_files_bundled_sources\n"
    count: 1
