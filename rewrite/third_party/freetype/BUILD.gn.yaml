substitutions:
- description: Enable the matching PDFium Type1/CID module configuration on Android.
  regex:
    pattern: "  if (!is_android) {\n    # Selects type1cid.c"
    replace: "  if (!is_android || is_desktop_android) {\n    # Selects type1cid.c"
- description: Compile Type1/CID sources required by Android PDFium fonts.
  regex:
    pattern: "  if (!is_android) {\n    sources += [\n      \"src/src/base/ftcid.c\","
    replace: "  if (!is_android || is_desktop_android) {\n    sources += [\n      \"src/src/base/ftcid.c\","
