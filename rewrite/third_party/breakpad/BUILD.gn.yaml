# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ "breakpad/src/common/linux/google_crashdump_uploader\.cc",\

      \ \ \ \ \ \ "breakpad/src/common/linux/google_crashdump_uploader\.h",\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ "breakpad/src/common/linux/libcurl_wrapper\.cc",\

      \ \ \ \ \ \ "breakpad/src/common/linux/libcurl_wrapper\.h",\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ configs\ \-=\ \[\ "//build/config/compiler:chromium_code"\ \]\

      \ \ \ \ configs\ \+=\ \[\ "//build/config/compiler:no_chromium_code"\ \]\

      \ \ \ \ public_configs\ =\ \[\ ":client_config"\ \]\

      '
    replace: "    if (!is_android) {\n      sources += [\n        \"breakpad/src/common/linux/google_crashdump_uploader.cc\",\n        \"breakpad/src/common/linux/google_crashdump_uploader.h\",\n        \"breakpad/src/common/linux/libcurl_wrapper.cc\",\n        \"breakpad/src/common/linux/libcurl_wrapper.h\",\n      ]\n    }\n\n    configs -= [ \"//build/config/compiler:chromium_code\" ]\n    configs += [ \"//build/config/compiler:no_chromium_code\" ]\n    public_configs = [ \":client_config\" ]\n"
