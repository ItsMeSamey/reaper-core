# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: third_party/omnibox_proto/BUILD.gn'
  regex:
    re_pattern: '\ \ "types\.proto",\

      \ \ "url_param\.proto",\

      \]\

      \

      proto_library\("omnibox_proto"\)\ \{\

      \ \ sources\ =\ _proto_files\

      '
    replace: "  \"types.proto\",\n  \"url_param.proto\",\n]\nif (is_android) {\n  _proto_files -= [\n    \"aim_eligibility_client_request.proto\",\n    \"aim_eligibility_response.proto\",\n    \"ntp_composebox_config.proto\",\n  ]\n}\n\nproto_library(\"omnibox_proto\") {\n  sources = _proto_files\n"
