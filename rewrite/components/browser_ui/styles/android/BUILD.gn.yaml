# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/browser_ui/styles/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "java/res_chromium/drawable\-xxxhdpi/product_logo_name\.png",\

      \ \ \ \ "java/res_chromium/raw/signin_spin\.json",\

      \ \ \]\

      \

      \ \ if\ \(enable_arcore\)\ \{\

      \ \ \ \ sources\ \+=\ \[\ "java/res\-arcore/drawable/ic_ar_core_install\.xml"\ \]\

      '
    replace: "    \"java/res_chromium/drawable-xxxhdpi/product_logo_name.png\",\n    \"java/res_chromium/raw/signin_spin.json\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"java/res/drawable/ic_arrow_selector_spark_16dp.xml\",\n      \"java/res/drawable/ic_arrow_selector_spark_24dp.xml\",\n    ]\n  }\n\n  if (enable_arcore) {\n    sources += [ \"java/res-arcore/drawable/ic_ar_core_install.xml\" ]\n"

- description: 'Android optional History/Search icon resource removal: components/browser_ui/styles/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "java/res/drawable/ic_shield_24dp\.xml",\

      \ \ \ \ "java/res/drawable/ic_skip_next_white_24dp\.xml",\

      \ \ \ \ "java/res/drawable/ic_skip_previous_white_24dp\.xml",\

      \ \ \ \ "java/res/drawable/ic_spark_24dp\.xml",\

      \ \ \ \ "java/res/drawable/ic_spark_filled_24dp\.xml",\

      \ \ \ \ "java/res/drawable/ic_speed_24dp\.xml",\

      \ \ \ \ "java/res/drawable/ic_star_24dp\.xml",\

      '
    replace: "    \"java/res/drawable/ic_shield_24dp.xml\",\n    \"java/res/drawable/ic_skip_next_white_24dp.xml\",\n    \"java/res/drawable/ic_skip_previous_white_24dp.xml\",\n    \"java/res/drawable/ic_spark_filled_24dp.xml\",\n    \"java/res/drawable/ic_speed_24dp.xml\",\n    \"java/res/drawable/ic_star_24dp.xml\",\n"

- description: 'Android optional search-spark and accessory message resource removal: components/browser_ui/styles/android/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "java/res/drawable/open_in_new\.xml",\

      \ \ \ \ "java/res/drawable/pill_background\.xml",\

      \ \ \ \ "java/res/drawable/report_octagon\.xml",\

      \ \ \ \ "java/res/drawable/search_spark\.xml",\

      \ \ \ \ "java/res/drawable/secured_by_brand_shield_24\.xml",\

      \ \ \ \ "java/res/drawable/smartphone_black_24dp\.xml",\

      \ \ \ \ "java/res/drawable/toolbar_hairline\.xml",\

      '
    replace: "    \"java/res/drawable/open_in_new.xml\",\n    \"java/res/drawable/pill_background.xml\",\n    \"java/res/drawable/report_octagon.xml\",\n    \"java/res/drawable/secured_by_brand_shield_24.xml\",\n    \"java/res/drawable/smartphone_black_24dp.xml\",\n    \"java/res/drawable/toolbar_hairline.xml\",\n"

- description: "Android selected resource staging Core442 step 1"
  regex:
    re_pattern: "import\\(\"//build/config/android/rules\\.gni\"\\)\\\n"
    replace: "import(\"//build/config/android/copy_ex.gni\")\nimport(\"//build/config/android/rules.gni\")\n"

- description: "Android selected resource staging Core442 step 2"
  regex:
    re_pattern: "android_resources\\(\"java_resources\"\\)\\ \\{\\\n"
    replace: "_java_resources = {\n"

- description: "Android selected resource staging Core442 step 3"
  regex:
    re_pattern: "\\ \\ deps\\ =\\ \\[\\\n\\ \\ \\ \\ \"//third_party/android_deps:material_design_java\",\\\n\\ \\ \\ \\ \"//ui/android:ui_java_resources\",\\\n\\ \\ \\]\\\n\\}\\\n"
    replace: "}\n\n_java_resource_sources = _java_resources.sources\n_java_resource_copy_deps = []\nif (is_android) {\n  # Each qualifier gets its own root so retired qualifiers cannot be rediscovered.\n  _java_resource_sources = []\n  _java_resource_directories = []\n  foreach(_source, _java_resources.sources) {\n    _directory = get_path_info(_source, \"dir\")\n    if (filter_include(_java_resource_directories, [ _directory ]) == []) {\n      _java_resource_directories += [ _directory ]\n    }\n    _root = \"$target_gen_dir/java_resources_selected/\" +\n            string_replace(_directory, \"/\", \"_\")\n    _qualifier = get_path_info(_directory, \"file\")\n    _file = get_path_info(_source, \"file\")\n    _java_resource_sources += [ \"$_root/$_qualifier/$_file\" ]\n  }\n  foreach(_directory, _java_resource_directories) {\n    _copy_target = \"java_resources_selected_\" +\n                   string_replace(_directory, \"/\", \"_\")\n    copy_ex(_copy_target) {\n      sources = filter_include(_java_resources.sources, [ \"$_directory/*\" ])\n      _root = \"$target_gen_dir/java_resources_selected/\" +\n              string_replace(_directory, \"/\", \"_\")\n      _qualifier = get_path_info(_directory, \"file\")\n      dest = \"$_root/$_qualifier\"\n      outputs = process_file_template(sources, [ \"$dest/{{source_file_part}}\" ])\n      args = [ \"--clear\" ]\n    }\n    _java_resource_copy_deps += [ \":$_copy_target\" ]\n  }\n}\n\nandroid_resources(\"java_resources\") {\n  sources = _java_resource_sources\n  deps = [\n    \"//third_party/android_deps:material_design_java\",\n    \"//ui/android:ui_java_resources\",\n  ]\n  deps += _java_resource_copy_deps\n}\n"

- description: "Android selected resource staging Core446 step 1"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \"java/res/drawable/ic_arrow_selector_spark_24dp\\.xml\",\\\n"
    replace: "      \"java/res/drawable/ic_arrow_selector_spark_24dp.xml\",\n      \"java/res/drawable/ic_spark_filled_24dp.xml\",\n"

- description: "Android styles copy actions use non-Java target names (Core455)"
  regex:
    re_pattern: "\\ \\ \\ \\ _copy_target\\ =\\ \"java_resources_selected_\"\\ \\+\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ string_replace\\(_directory,\\ \"/\",\\ \"_\"\\)\\\n"
    replace: "    _copy_target = \"copy_selected_styles_\" +\n                   string_replace(_directory, \"/\", \"-\")\n"
- description: "Reviewed coherent post537 source 6/1: reviewed literal edit"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \"java/res/drawable/ic_spark_filled_24dp\\.xml\",\\\n"
    replace: "      \"java/res/drawable/ic_psychiatry_24dp.xml\",\n      \"java/res/drawable/ic_screensaver_auto_24dp.xml\",\n      \"java/res/drawable/ic_shield_24dp.xml\",\n      \"java/res/drawable/ic_spark_filled_24dp.xml\",\n"
  count: 1
- description: "Reviewed resource8 after538 source 11/1: reviewed literal edit"
  regex:
    re_pattern: "\\ \\ if\\ \\(is_android\\)\\ \\{\\\n\\ \\ \\ \\ sources\\ \\-=\\ \\[\\\n\\ \\ \\ \\ \\ \\ \"java/res/drawable/ic_arrow_selector_spark_16dp\\.xml\","
    replace: "  if (is_android) {\n    sources -= [\n      \"java/res/color/color_primary_with_alpha_8.xml\",\n      \"java/res/drawable/ic_arrow_selector_spark_16dp.xml\","
  count: 1
- description: "Reviewed resource8 after538 source 11/2: reviewed literal edit"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \"java/res/drawable/ic_arrow_selector_spark_24dp\\.xml\",\\\n"
    replace: "      \"java/res/drawable/ic_arrow_selector_spark_24dp.xml\",\n      \"java/res/drawable/ic_check_circle_24dp.xml\",\n"
  count: 1
- description: "Reviewed resource8 after538 source 11/3: reviewed literal edit"
  regex:
    re_pattern: "\\ \\ \\ \\ \\ \\ \"java/res/drawable/ic_spark_filled_24dp\\.xml\",\\\n"
    replace: "      \"java/res/drawable/ic_spark_filled_24dp.xml\",\n      \"java/res/drawable/ic_tab_group_24dp.xml\",\n"
  count: 1
