substitutions:
- description: Preserve qualified conventional P prefix before reviewed enterprise edits
  regex:
    pattern: "    <dimen name=\"modern_toolbar_tablet_background_size\">48dp</dimen>\n    <!-- Sometimes the modern toolbar\
      \ is shown at 48dp so a corner radius of\n         24dp is needed to completely round the corners. -->\n    <dimen name=\"\
      modern_toolbar_background_corner_radius\">24dp</dimen>\n    <dimen name=\"modern_toolbar_background_inner_corner_radius\"\
      >16dp</dimen>\n    <!-- The offset is required for the background drawable used by the\n         location bar on tablets.\
      \ -->\n"
    replace: "    <dimen name=\"modern_toolbar_tablet_background_size\">48dp</dimen>\n    <!-- Sometimes the modern toolbar\
      \ is shown at 48dp so a corner radius of\n         24dp is needed to completely round the corners. -->\n    <dimen name=\"\
      modern_toolbar_background_corner_radius\">8dp</dimen>\n    <dimen name=\"modern_toolbar_background_inner_corner_radius\"\
      >16dp</dimen>\n    <!-- The offset is required for the background drawable used by the\n         location bar on tablets.\
      \ -->\n"
  count: 1
- description: Reviewed literal edit 1
  regex:
    pattern: "    <dimen name=\"price_change_indicator_card_radius\">8dp</dimen>\n    <dimen name=\"price_change_indicator_card_height\"\
      >24dp</dimen>\n"
    replace: '    <dimen name="price_change_indicator_card_height">24dp</dimen>

      '
  count: 1
- description: Reviewed literal edit 2
  regex:
    pattern: "    <dimen name=\"price_change_indicator_card_height\">24dp</dimen>\n\n    <!-- Loading Fullscreen dimens -->\n"
    replace: "\n    <!-- Loading Fullscreen dimens -->\n"
  count: 1
