substitutions:
- description: Remove dedicated image descriptions preference key
  regex:
    pattern: '    public static final String PREF_IMAGE_DESCRIPTIONS = "image_descriptions";

      '
    replace: ''
  count: 1
- description: Remove image descriptions settings visibility wiring
  regex:
    pattern: "        Preference imageDescriptionsPreference = findPreference(PREF_IMAGE_DESCRIPTIONS);\n        imageDescriptionsPreference.setVisible(shouldShowImageDescriptionsPref(mDelegate));\n\
      \n"
    replace: ''
  count: 1
- description: Remove dedicated image descriptions visibility helper
  regex:
    pattern: "    private static boolean shouldShowImageDescriptionsPref(AccessibilitySettingsDelegate delegate) {\n     \
      \   return delegate.shouldShowImageDescriptionsSetting();\n    }\n\n"
    replace: ''
  count: 1
- description: Remove image descriptions search-index filtering for the removed preference
  regex:
    pattern: "        if (!shouldShowImageDescriptionsPref(delegate)) {\n            indexData.removeEntryForKey(prefFragment,\
      \ PREF_IMAGE_DESCRIPTIONS);\n        }\n"
    replace: ''
  count: 1
