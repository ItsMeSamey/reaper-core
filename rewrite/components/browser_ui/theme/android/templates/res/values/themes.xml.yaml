substitutions:
- description: Remove Glic-only mobile task-menu theme attributes
  regex:
    pattern: "        <!-- Glic task menu attributes -->\n        <item name=\"glicTaskMenuEndIconWidth\">@dimen/glic_menu_end_icon_width</item>\n\
      \        <item name=\"glicTaskMenuMaxWidth\">@dimen/glic_task_menu_max_width</item>\n\n"
    replace: ''
  count: 1
- description: Remove Glic-only desktop-density task-menu theme attributes
  regex:
    pattern: "        <!-- Glic task menu attributes -->\n        <item name=\"glicTaskMenuEndIconWidth\">@dimen/glic_menu_end_icon_width_desktop</item>\n\
      \        <item name=\"glicTaskMenuMaxWidth\">@dimen/glic_task_menu_max_width_desktop</item>\n\n"
    replace: ''
  count: 1
