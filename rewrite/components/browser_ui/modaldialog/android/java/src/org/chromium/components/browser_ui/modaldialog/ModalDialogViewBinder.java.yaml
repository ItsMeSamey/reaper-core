# Android split pane request ownership and dialog placement.
substitutions:
- description: Leave opaque requester metadata to the embedder presenter
  regex:
    re_pattern: \ \ \ \ \ \ \ \ if\ \(ModalDialogProperties\.NAME\ ==\ propertyKey\)\ \{
    replace: "        if (ModalDialogProperties.NAME == propertyKey\n                || ModalDialogProperties.TAB_MODAL_OWNER == propertyKey) {"
