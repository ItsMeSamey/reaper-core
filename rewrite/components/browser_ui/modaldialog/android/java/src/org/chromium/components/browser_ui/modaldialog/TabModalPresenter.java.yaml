# Cancel the enter callback before hiding the departing Android dialog from accessibility.
substitutions:
- description: Keep a dismissed dialog hidden when cancellation completes its enter animator
  count: 1
  regex:
    pattern: "        dialogView.clearFocus();\n        // Disable interaction with the dialog while it is being animated out.\n        updateContainerHierarchy(false);\n        dialogView.blockInputs(true);\n        assumeNonNull(mDialogContainer).setClickable(false);\n        assumeNonNull(mDialogContainer).animate().cancel();\n"
    replace: "        dialogView.clearFocus();\n        assumeNonNull(mDialogContainer).animate().cancel();\n        // Disable interaction with the dialog while it is being animated out.\n        updateContainerHierarchy(false);\n        dialogView.blockInputs(true);\n        assumeNonNull(mDialogContainer).setClickable(false);\n"
