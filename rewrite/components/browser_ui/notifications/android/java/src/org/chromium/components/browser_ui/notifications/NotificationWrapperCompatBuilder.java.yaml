# Android extension notification policy and payload support.
substitutions:
- description: Reuse AndroidX InboxStyle for extension list notifications
  regex:
    re_pattern: '\ \ \ \ @Override\

      \ \ \ \ public\ NotificationWrapperBuilder\ setBigTextStyle'
    replace: "    @Override\n    public NotificationWrapperBuilder setInboxStyle(\n            CharSequence[] lines, @Nullable CharSequence summaryText) {\n        NotificationCompat.InboxStyle style = new NotificationCompat.InboxStyle();\n        for (CharSequence line : lines) style.addLine(line);\n        mBuilder.setStyle(style.setSummaryText(summaryText));\n        return this;\n    }\n\n    @Override\n    public NotificationWrapperBuilder setBigTextStyle"
