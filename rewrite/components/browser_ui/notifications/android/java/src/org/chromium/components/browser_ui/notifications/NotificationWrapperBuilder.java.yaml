# Android extension notification policy and payload support.
substitutions:
- description: Expose Android InboxStyle through the existing notification wrapper
  regex:
    re_pattern: \ \ \ \ NotificationWrapperBuilder\ setBigTextStyle\(@Nullable\ CharSequence\ bigText\);
    replace: "    NotificationWrapperBuilder setBigTextStyle(@Nullable CharSequence bigText);\n\n    NotificationWrapperBuilder setInboxStyle(\n            CharSequence[] lines, @Nullable CharSequence summaryText);"
