# Android WebAuthn selected-tab request lifetime.
substitutions:
- description: Expose request-owned embedder guards without importing Chrome into components
  count: 1
  regex:
    re_pattern: class\ WebAuthnClientAndroid\ \{
    replace: "// Per-request embedder policy and lifetime. Origin/RP validation remains the\n// responsibility of the existing WebAuthn security layer.\nclass WebAuthnRequestGuard {\n public:\n  virtual ~WebAuthnRequestGuard();\n  // The original document and owning tab/model still exist, without a latched\n  // cancellation. Conditional requests may remain valid while waiting inactive.\n  virtual bool IsValid() const = 0;\n  // Admit actual interactive UI only in the selected visible tab. Once begun,\n  // a real tab/model switch permanently invalidates this request.\n  virtual bool BeginInteraction() = 0;\n  // Recheck success delivery without requiring visibility: an OS authenticator\n  // activity may legitimately cover the browser until its result is delivered.\n  virtual bool CanCompleteRequest() const = 0;\n};\n\nclass WebAuthnClientAndroid {"
- description: Let Chrome bind Android WebAuthn UI and completion to the original document and active model
  count: 1
  regex:
    re_pattern: \ \ virtual\ \~WebAuthnClientAndroid\(\);
    replace: "  virtual ~WebAuthnClientAndroid();\n\n  // Default-empty preserves other embedders. Chrome supplies a guard even when\n  // admission fails; its cancellation callback is posted, never synchronous.\n  virtual std::unique_ptr<WebAuthnRequestGuard> CreateRequestGuard(\n      content::RenderFrameHost* frame,\n      bool conditional,\n      base::OnceClosure on_cancel);"
