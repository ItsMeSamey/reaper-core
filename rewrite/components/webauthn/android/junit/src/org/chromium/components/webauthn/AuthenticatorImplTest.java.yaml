- description: Regress actual Authenticator dispatch, cancellation, identity and completion boundaries
  regex:
    re_pattern: \ \ \ \ private\ GetCredentialOptions\ proxyGetOptions\(\)\ \{
    replace: "    private WebAuthenticationProxyBridge enableOrdinaryRequestGuard() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(GmsCoreUtils.GMSCORE_MIN_VERSION);\n        WebAuthenticationProxyBridge bridge = enableProxy();\n        when(mProxyNatives.isActive(1L)).thenReturn(false);\n        when(mProxyNatives.makeCredential(eq(1L), any())).thenReturn(false);\n        when(mProxyNatives.getCredential(eq(1L), any())).thenReturn(false);\n        return bridge;\n    }\n\n    private AuthenticationContextProvider capturedContext() {\n        ArgumentCaptor<AuthenticationContextProvider> context =\n                ArgumentCaptor.forClass(AuthenticationContextProvider.class);\n        verify(mFido2CredentialRequestMock).setAuthenticationContextProvider(context.capture());\n        return context.getValue();\n    }\n\n    @Test\n    public void testInactivePaneCannotStartCredentialRequest() {\n        enableOrdinaryRequestGuard();\n        when(mProxyNatives.startRequestGuard(eq(1L), anyLong(), anyBoolean())).thenReturn(false);\n        Authenticator.MakeCredential_Response callback = mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        verify(callback).call(eq(AuthenticatorStatus.NOT_FOCUSED), any(), any());\n        verify(mFido2CredentialRequestMock, never()).handleMakeCredentialRequest(any(), any(), any(), any(), any());\n        verify(mProxyNatives, never()).makeCredential(anyLong(), any());\n    }\n\n    @Test\n    public void testCancelledRequestProviderCannotResolveReplacement() {\n        WebAuthenticationProxyBridge bridge = enableOrdinaryRequestGuard();\n        Authenticator.MakeCredential_Response first = mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), first);\n        AuthenticationContextProvider oldContext = capturedContext();\n        WebauthnRequestCallback oldCallback = oldContext.getRequestCallback();\n        ArgumentCaptor<Long> id = ArgumentCaptor.forClass(Long.class);\n        verify(mProxyNatives).startRequestGuard(eq(1L), id.capture(), eq(false));\n        bridge.onRequestInvalidated(id.getValue());\n        verify(first).call(eq(AuthenticatorStatus.ABORT_ERROR), any(), any());\n        assertNull(oldContext.getRequestCallback());\n        Authenticator.MakeCredential_Response replacement = mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), replacement);\n        // Old OS work can retain both the provider and the original callback.\n        assertNull(oldContext.getRequestCallback());\n        assertTrue(oldContext.shouldBlockUserInteraction());\n        oldCallback.onComplete(WebauthnRequestResponse.forSuccessfulMakeCredential(\n                new MakeCredentialAuthenticatorResponse(), new RequestMetrics.Builder().build()));\n        bridge.onRequestInvalidated(id.getValue());\n        verify(first, times(1)).call(anyInt(), any(), any());\n        verify(replacement, never()).call(anyInt(), any(), any());\n        verify(mProxyNatives, times(2)).startRequestGuard(eq(1L), anyLong(), eq(false));\n    }\n\n    @Test\n    public void testCredentialSuccessRechecksActiveOwner() {\n        enableOrdinaryRequestGuard();\n        Authenticator.MakeCredential_Response callback = mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        WebauthnRequestCallback pending = capturedContext().getRequestCallback();\n        when(mProxyNatives.canCompleteRequest(eq(1L), anyLong())).thenReturn(false);\n        pending.onComplete(WebauthnRequestResponse.forSuccessfulMakeCredential(\n                new MakeCredentialAuthenticatorResponse(), new RequestMetrics.Builder().build()));\n        verify(callback).call(eq(AuthenticatorStatus.NOT_FOCUSED), any(), any());\n    }\n\n    @Test\n    public void testOsAuthenticatorActivityHideDoesNotRejectValidOwner() {\n        enableOrdinaryRequestGuard();\n        Authenticator.MakeCredential_Response callback = mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        WebauthnRequestCallback pending = capturedContext().getRequestCallback();\n        when(mWebContents.getVisibility()).thenReturn(Visibility.HIDDEN);\n        MakeCredentialAuthenticatorResponse response = new MakeCredentialAuthenticatorResponse();\n        pending.onComplete(WebauthnRequestResponse.forSuccessfulMakeCredential(\n                response, new RequestMetrics.Builder().build()));\n        verify(callback).call(eq(AuthenticatorStatus.SUCCESS), eq(response), any());\n    }\n\n    @Test\n    public void testConditionalRequestWaitsButRechecksInteractivePromotion() {\n        enableOrdinaryRequestGuard();\n        when(mWebContents.getVisibility()).thenReturn(Visibility.HIDDEN);\n        Authenticator.GetCredential_Response callback = mock(Authenticator.GetCredential_Response.class);\n        GetCredentialOptions options = proxyGetOptions();\n        options.mediation = Mediation.CONDITIONAL;\n        mAuthenticator.getCredential(options, callback);\n        verify(mProxyNatives).startRequestGuard(eq(1L), anyLong(), eq(true));\n        verify(mProxyNatives, never()).beginRequestInteraction(anyLong(), anyLong());\n        AuthenticationContextProvider context = capturedContext();\n        assertNotNull(context.getRequestCallback());\n        when(mProxyNatives.beginRequestInteraction(eq(1L), anyLong())).thenReturn(false);\n        assertTrue(context.shouldBlockUserInteraction());\n        verify(callback, never()).call(any());\n    }\n\n    @Test\n    public void testClosedAuthenticatorDropsProviderAndGuardReplies() {\n        WebAuthenticationProxyBridge bridge = enableOrdinaryRequestGuard();\n        Authenticator.MakeCredential_Response callback = mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        AuthenticationContextProvider context = capturedContext();\n        ArgumentCaptor<Long> id = ArgumentCaptor.forClass(Long.class);\n        verify(mProxyNatives).startRequestGuard(eq(1L), id.capture(), eq(false));\n        mAuthenticator.close();\n        assertNull(context.getRequestCallback());\n        bridge.onRequestInvalidated(id.getValue());\n        verify(callback, never()).call(anyInt(), any(), any());\n    }\n\n    @Test\n    public void testNativeInvalidationBlocksProviderBeforePostedCancellation() {\n        WebAuthenticationProxyBridge bridge = enableOrdinaryRequestGuard();\n        Authenticator.MakeCredential_Response callback = mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        AuthenticationContextProvider context = capturedContext();\n        ArgumentCaptor<Long> id = ArgumentCaptor.forClass(Long.class);\n        verify(mProxyNatives).startRequestGuard(eq(1L), id.capture(), eq(false));\n        when(mProxyNatives.isRequestValid(eq(1L), anyLong())).thenReturn(false);\n        assertNull(context.getRequestCallback());\n        verify(callback, never()).call(anyInt(), any(), any());\n        bridge.onRequestInvalidated(id.getValue());\n        verify(callback).call(eq(AuthenticatorStatus.ABORT_ERROR), any(), any());\n    }\n\n    private GetCredentialOptions proxyGetOptions() {"
