  regex:
    pattern: "    @Test\n    public void testGetClientCapabilities_CallsIsUvpaa()"
    replace: "    @Test\n    public void testProxyCannotAcceptConfirmationAfterNativeSuspension() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(GmsCoreUtils.GMSCORE_MIN_VERSION);\n        CreateConfirmationUiDelegate confirmation = mock(CreateConfirmationUiDelegate.class);\n        when(confirmation.show(any(), any())).thenReturn(true);\n        mAuthenticator = new AuthenticatorImpl(ApplicationProvider.getApplicationContext(),\n                mWebContents, mIntentSender, confirmation, mRenderFrameHost, mTopOrigin);\n        enableProxy();\n        when(mProxyNatives.isActive(1L)).thenReturn(false);\n        Authenticator.MakeCredential_Response callback =\n                mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        ArgumentCaptor<Runnable> accept = ArgumentCaptor.forClass(Runnable.class);\n        verify(confirmation).show(accept.capture(), any());\n        // A proxy attaches only after suspension invalidated the original document watch.\n        when(mProxyNatives.isActive(1L)).thenReturn(true);\n        // Java cancellation is still queued when the old acceptance arrives.\n        when(mProxyNatives.finishConfirmation(eq(1L), anyLong())).thenReturn(false);\n        accept.getValue().run();\n        verify(confirmation).cancel();\n        verify(callback).call(eq(AuthenticatorStatus.ABORT_ERROR), any(), any());\n        verify(mProxyNatives, never()).makeCredential(anyLong(), any());\n        verify(mFido2CredentialRequestMock, never())\n                .handleMakeCredentialRequest(any(), any(), any(), any(), any());\n    }\n\n    @Test\n    public void testProxyDocumentSuspensionClosesIncognitoConfirmation() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(0);\n        CreateConfirmationUiDelegate confirmation = mock(CreateConfirmationUiDelegate.class);\n        when(confirmation.show(any(), any())).thenReturn(true);\n        mAuthenticator = new AuthenticatorImpl(ApplicationProvider.getApplicationContext(),\n                mWebContents, mIntentSender, confirmation, mRenderFrameHost, mTopOrigin);\n        WebAuthenticationProxyBridge bridge = enableProxy();\n        Authenticator.MakeCredential_Response callback =\n                mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        ArgumentCaptor<Runnable> accept = ArgumentCaptor.forClass(Runnable.class);\n        verify(confirmation).show(accept.capture(), any());\n        ArgumentCaptor<Long> id = ArgumentCaptor.forClass(Long.class);\n        verify(mProxyNatives).watchConfirmation(eq(1L), id.capture());\n        bridge.onConfirmationCancelled(id.getValue());\n        verify(confirmation).cancel();\n        verify(callback).call(eq(AuthenticatorStatus.ABORT_ERROR), any(), any());\n        accept.getValue().run();\n        verify(mProxyNatives, never()).makeCredential(anyLong(), any());\n    }\n\n    @Test\n    public void testProxyCancelIncognitoConfirmationDiscardsOldAcceptance() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(0);\n        CreateConfirmationUiDelegate confirmation = mock(CreateConfirmationUiDelegate.class);\n        when(confirmation.show(any(), any())).thenReturn(true);\n        mAuthenticator = new AuthenticatorImpl(ApplicationProvider.getApplicationContext(),\n                mWebContents, mIntentSender, confirmation, mRenderFrameHost, mTopOrigin);\n        enableProxy();\n        Authenticator.MakeCredential_Response callback =\n                mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        ArgumentCaptor<Runnable> accept = ArgumentCaptor.forClass(Runnable.class);\n        verify(confirmation).show(accept.capture(), any());\n        mAuthenticator.cancel();\n        verify(confirmation).cancel();\n        verify(callback).call(eq(AuthenticatorStatus.ABORT_ERROR), any(), any());\n        accept.getValue().run();\n        verify(mProxyNatives, never()).makeCredential(anyLong(), any());\n        verify(mFido2CredentialRequestMock, never())\n                .handleMakeCredentialRequest(any(), any(), any(), any(), any());\n    }\n\n    @Test\n    public void testProxyCapabilitiesWithoutGms() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(0);\n        WebAuthenticationProxyBridge bridge = enableProxy();\n        Authenticator.GetClientCapabilities_Response callback =\n                mock(Authenticator.GetClientCapabilities_Response.class);\n        mAuthenticator.getClientCapabilities(callback);\n        ArgumentCaptor<Integer> id = ArgumentCaptor.forClass(Integer.class);\n        verify(mProxyNatives).isUvpaa(eq(1L), id.capture());\n        bridge.onUvpaaResponse(id.getValue(), true);\n        verify(callback).call(mCapabilitiesCaptor.capture());\n        assertEquals(10, mCapabilitiesCaptor.getValue().length);\n        for (WebAuthnClientCapability capability : mCapabilitiesCaptor.getValue()) {\n            if (capability.name.equals(AuthenticatorConstants.CAPABILITY_UVPAA)) {\n                assertEquals(true, capability.supported);\n            }\n            if (capability.name.equals(AuthenticatorConstants.CAPABILITY_CONDITIONAL_GET)) {\n                assertEquals(false, capability.supported);\n            }\n        }\n    }\n\n    private WebAuthenticationProxyBridge enableProxy() {\n        when(mProxyNatives.create(any(), eq(mRenderFrameHost))).thenReturn(1L);\n        when(mProxyNatives.isActive(1L)).thenReturn(true);\n        when(mProxyNatives.finishConfirmation(eq(1L), anyLong())).thenReturn(true);\n        when(mProxyNatives.makeCredential(eq(1L), any())).thenReturn(true);\n        when(mProxyNatives.getCredential(eq(1L), any())).thenReturn(true);\n        when(mProxyNatives.isUvpaa(eq(1L), anyInt())).thenReturn(true);\n        mAuthenticator.enableRequestProxy();\n        ArgumentCaptor<WebAuthenticationProxyBridge> bridge =\n                ArgumentCaptor.forClass(WebAuthenticationProxyBridge.class);\n        verify(mProxyNatives).create(bridge.capture(), eq(mRenderFrameHost));\n        return bridge.getValue();\n    }\n\n    private GetCredentialOptions proxyGetOptions() {\n        GetCredentialOptions options = new GetCredentialOptions();\n        options.publicKey = Fido2ApiTestHelper.createDefaultGetAssertionOptions();\n        return options;\n    }\n\n    @Test\n    public void testProxyCreateWithoutGmsAndStructuredError() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(0);\n        WebAuthenticationProxyBridge bridge = enableProxy();\n        Authenticator.MakeCredential_Response callback =\n                mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        verify(mProxyNatives).makeCredential(eq(1L), any());\n        verify(mFido2CredentialRequestMock, never())\n                .handleMakeCredentialRequest(any(), any(), any(), any(), any());\n        WebAuthnDomExceptionDetails error = new WebAuthnDomExceptionDetails();\n        error.name = \"InvalidStateError\";\n        error.message = \"The remote credential already exists.\";\n        java.nio.ByteBuffer serialized = error.serialize();\n        byte[] bytes = new byte[serialized.remaining()];\n        serialized.get(bytes);\n        bridge.onMakeResponse(AuthenticatorStatus.ERROR_WITH_DOM_EXCEPTION_DETAILS, null, bytes);\n        ArgumentCaptor<WebAuthnDomExceptionDetails> returned =\n                ArgumentCaptor.forClass(WebAuthnDomExceptionDetails.class);\n        verify(callback).call(eq(AuthenticatorStatus.ERROR_WITH_DOM_EXCEPTION_DETAILS),\n                any(), returned.capture());\n        assertEquals(error.name, returned.getValue().name);\n        assertEquals(error.message, returned.getValue().message);\n    }\n\n    @Test\n    public void testProxyCreateCancelDoesNotReachLocalProvider() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(0);\n        WebAuthenticationProxyBridge bridge = enableProxy();\n        Authenticator.MakeCredential_Response callback =\n                mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        mAuthenticator.cancel();\n        verify(mProxyNatives).cancel(1L);\n        bridge.onMakeResponse(AuthenticatorStatus.ABORT_ERROR, null, null);\n        verify(callback).call(eq(AuthenticatorStatus.ABORT_ERROR), any(), any());\n    }\n\n    @Test\n    public void testProxyGetWithoutGmsAndCancel() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(0);\n        WebAuthenticationProxyBridge bridge = enableProxy();\n        Authenticator.GetCredential_Response callback =\n                mock(Authenticator.GetCredential_Response.class);\n        mAuthenticator.getCredential(proxyGetOptions(), callback);\n        verify(mProxyNatives).getCredential(eq(1L), any());\n        verify(mFido2CredentialRequestMock, never())\n                .handleGetCredentialRequest(any(), any(), any(), any());\n        mAuthenticator.cancel();\n        verify(mProxyNatives).cancel(1L);\n        bridge.onGetResponse(AuthenticatorStatus.ABORT_ERROR, null, null);\n        ArgumentCaptor<GetCredentialResponse> response =\n                ArgumentCaptor.forClass(GetCredentialResponse.class);\n        verify(callback).call(response.capture());\n        assertEquals(AuthenticatorStatus.ABORT_ERROR,\n                response.getValue().getGetAssertionResponse().status);\n    }\n\n    @Test\n    public void testProxyDoesNotBypassEmbedderRejection() {\n        enableProxy();\n        when(mWebauthnBrowserBridgeNativesMock.shouldDisallowCredentialRequest(mRenderFrameHost))\n                .thenReturn(true);\n        Authenticator.MakeCredential_Response callback =\n                mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        verify(callback).call(eq(AuthenticatorStatus.NOT_ALLOWED_ERROR), any(), any());\n        verify(mProxyNatives, never()).makeCredential(anyLong(), any());\n    }\n\n    @Test\n    public void testProxyDoesNotBypassHiddenDocument() {\n        enableProxy();\n        when(mWebContents.getVisibility()).thenReturn(Visibility.HIDDEN);\n        Authenticator.GetCredential_Response callback =\n                mock(Authenticator.GetCredential_Response.class);\n        mAuthenticator.getCredential(proxyGetOptions(), callback);\n        verify(mProxyNatives, never()).getCredential(anyLong(), any());\n        ArgumentCaptor<GetCredentialResponse> response =\n                ArgumentCaptor.forClass(GetCredentialResponse.class);\n        verify(callback).call(response.capture());\n        assertEquals(AuthenticatorStatus.NOT_FOCUSED,\n                response.getValue().getGetAssertionResponse().status);\n    }\n\n    @Test\n    public void testProxyUvpaaWithoutGms() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(0);\n        WebAuthenticationProxyBridge bridge = enableProxy();\n        Authenticator.IsUserVerifyingPlatformAuthenticatorAvailable_Response callback =\n                mock(Authenticator.IsUserVerifyingPlatformAuthenticatorAvailable_Response.class);\n        mAuthenticator.isUserVerifyingPlatformAuthenticatorAvailable(callback);\n        ArgumentCaptor<Integer> id = ArgumentCaptor.forClass(Integer.class);\n        verify(mProxyNatives).isUvpaa(eq(1L), id.capture());\n        bridge.onUvpaaResponse(id.getValue(), true);\n        verify(callback).call(true);\n        verify(mFido2CredentialRequestMock, never())\n                .handleIsUserVerifyingPlatformAuthenticatorAvailableRequest(any());\n    }\n\n    @Test\n    public void testProxyDisablesConditionalMediation() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(GmsCoreUtils.GMSCORE_MIN_VERSION);\n        enableProxy();\n        Authenticator.IsConditionalMediationAvailable_Response callback =\n                mock(Authenticator.IsConditionalMediationAvailable_Response.class);\n        mAuthenticator.isConditionalMediationAvailable(callback);\n        verify(callback).call(false);\n        verify(mFido2CredentialRequestMock, never())\n                .handleIsUserVerifyingPlatformAuthenticatorAvailableRequest(any());\n    }\n\n    @Test\n    public void testProxyCloseDiscardsLateCallback() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(0);\n        WebAuthenticationProxyBridge bridge = enableProxy();\n        Authenticator.MakeCredential_Response callback =\n                mock(Authenticator.MakeCredential_Response.class);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(), callback);\n        mAuthenticator.close();\n        verify(mProxyNatives).destroy(1L);\n        bridge.onMakeResponse(AuthenticatorStatus.ABORT_ERROR, null, null);\n        verify(callback, never()).call(anyInt(), any(), any());\n    }\n\n    @Test\n    public void testProxyDetachFallsBackToLocalProvider() {\n        GmsCoreUtils.setGmsCoreVersionForTesting(GmsCoreUtils.GMSCORE_MIN_VERSION);\n        enableProxy();\n        when(mProxyNatives.makeCredential(eq(1L), any())).thenReturn(false);\n        mAuthenticator.makeCredential(Fido2ApiTestHelper.createDefaultMakeCredentialOptions(),\n                mock(Authenticator.MakeCredential_Response.class));\n        verify(mFido2CredentialRequestMock)\n                .handleMakeCredentialRequest(any(), any(), any(), any(), any());\n    }\n\n    @Test\n    public void testGetClientCapabilities_CallsIsUvpaa()"
