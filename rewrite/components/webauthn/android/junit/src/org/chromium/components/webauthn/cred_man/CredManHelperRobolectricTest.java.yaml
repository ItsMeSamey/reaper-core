# Android WebAuthn request activation and lifetime.
substitutions:
- description: Exercise cleanup using real request completion callbacks
  regex:
    re_pattern: import\ org\.chromium\.components\.webauthn\.WebauthnRequestCallback;
    replace: 'import org.chromium.components.webauthn.WebauthnRequestCallback;

      import org.chromium.components.webauthn.WebauthnRequestResponse;

      import org.chromium.components.webauthn.RequestMetrics;'
- description: Ignore retired CredentialManager results before browser delegate side effects
  regex:
    re_pattern: '\ \ \ \ @Before\

      \ \ \ \ public\ void\ setUp\(\)'
    replace: "    private ShadowCredentialManager startGetRequestForRetiredResultTest() {\n        mRequestCallback =\n                WebauthnRequestCallback.forGetCredential(mGetCredentialResponseCallback, null);\n        when(mAuthenticationContextProviderMock.getRequestCallback()).thenReturn(mRequestCallback);\n        int status =\n                mCredManHelper.startGetRequest(\n                        mRequestOptions, mOriginString, null, mClientDataHash, false);\n        assertThat(status).isEqualTo(AuthenticatorStatus.SUCCESS);\n        ShadowCredentialManager manager = Shadow.extract(mCredentialManager);\n        assertThat(manager.getGetCredentialCallback()).isNotNull();\n        // The per-request provider returns null after cancellation, even when a\n        // replacement request in this document is using the same browser bridge.\n        when(mAuthenticationContextProviderMock.getRequestCallback()).thenReturn(null);\n        Mockito.clearInvocations(mBrowserBridge, mGetCredentialResponseCallback, mFrameHost);\n        return manager;\n    }\n\n    @Test\n    @SmallTest\n    public void testRetiredGetErrorDoesNotMutateBrowserDelegate() {\n        ShadowCredentialManager manager = startGetRequestForRetiredResultTest();\n        manager.getGetCredentialCallback()\n                .onError(\n                        new GetCredentialException(\n                                GetCredentialException.TYPE_USER_CANCELED, \"late\"));\n        Mockito.verifyNoInteractions(mBrowserBridge, mGetCredentialResponseCallback, mFrameHost);\n    }\n\n    @Test\n    @SmallTest\n    public void testRetiredGetResultDoesNotFillOrCleanBrowserDelegate() {\n        ShadowCredentialManager manager = startGetRequestForRetiredResultTest();\n        manager.getGetCredentialCallback()\n                .onResult(\n                        new GetCredentialResponse(\n                                createPasswordCredential(\"old-user\", \"old-password\")));\n        Mockito.verifyNoInteractions(mBrowserBridge, mGetCredentialResponseCallback, mFrameHost);\n    }\n\n    @Test\n    @SmallTest\n    public void testRetiredConditionalBarrierDoesNotPublishNewBrowserRequest() {\n        mRequestOptions.mediation = Mediation.CONDITIONAL;\n        mRequestCallback =\n                WebauthnRequestCallback.forGetCredential(mGetCredentialResponseCallback, null);\n        when(mAuthenticationContextProviderMock.getRequestCallback()).thenReturn(mRequestCallback);\n        mCredManHelper.startPrefetchRequest(\n                mRequestOptions, mOriginString, null, mClientDataHash, mBarrier, null, false);\n        ShadowCredentialManager manager = Shadow.extract(mCredentialManager);\n        manager.getPrepareGetCredentialCallback()\n                .onResult(Shadow.newInstanceOf(PrepareGetCredentialResponse.class));\n        ArgumentCaptor<Runnable> ready = ArgumentCaptor.forClass(Runnable.class);\n        verify(mBarrier).onCredManSuccessful(ready.capture());\n        when(mAuthenticationContextProviderMock.getRequestCallback()).thenReturn(null);\n        Mockito.clearInvocations(mBrowserBridge, mGetCredentialResponseCallback, mFrameHost);\n\n        // Enumeration completed before cancellation, but the delayed barrier\n        // must not install the old request into a replacement document delegate.\n        ready.getValue().run();\n        Mockito.verifyNoInteractions(mBrowserBridge, mGetCredentialResponseCallback, mFrameHost);\n        assertThat(manager.getGetCredentialCallback()).isNull();\n    }\n\n    @Test\n    @SmallTest\n    public void testCompletionCleanupUsesOriginalBridgeWithoutResolvingReplacement() {\n        WebauthnBrowserBridge replacement = Mockito.mock(WebauthnBrowserBridge.class);\n        java.util.concurrent.atomic.AtomicReference<WebauthnBrowserBridge> currentBridge =\n                new java.util.concurrent.atomic.AtomicReference<>(mBrowserBridge);\n        mCredManHelper = new CredManHelper(mAuthenticationContextProviderMock,\n                currentBridge::get, /* playServicesAvailable= */ true);\n        mCredManHelper.setMetricsHelperForTesting(mMetricsHelper);\n        mRequestCallback = WebauthnRequestCallback.forGetCredential(mGetCredentialResponseCallback, null);\n        when(mAuthenticationContextProviderMock.getRequestCallback()).thenReturn(mRequestCallback);\n        assertThat(mCredManHelper.startGetRequest(mRequestOptions, mOriginString, null,\n                mClientDataHash, false)).isEqualTo(AuthenticatorStatus.SUCCESS);\n        // Completion callbacks must not consult a provider that now resolves a\n        // different request's document-scoped bridge.\n        currentBridge.set(replacement);\n        mRequestCallback.onComplete(WebauthnRequestResponse.forFailedGetCredential(\n                AuthenticatorStatus.ABORT_ERROR, new RequestMetrics.Builder().build()));\n        verify(mBrowserBridge).cleanupRequest(any());\n        Mockito.verifyNoInteractions(replacement);\n    }\n\n    @Before\n    public void setUp()"
