    replace: "    public void testCompletionCleanupUsesOriginalBridgeWithoutResolvingReplacement() {\n        WebauthnBrowserBridge replacement = Mockito.mock(WebauthnBrowserBridge.class);\n        java.util.concurrent.atomic.AtomicReference<WebauthnBrowserBridge> currentBridge =\n                new java.util.concurrent.atomic.AtomicReference<>(mBrowserBridge);\n        mCredManHelper =\n                new CredManHelper(\n                        mAuthenticationContextProviderMock,\n                        currentBridge::get,\n                        /* playServicesAvailable= */ true);\n        mCredManHelper.setMetricsHelperForTesting(mMetricsHelper);\n        mRequestCallback =\n                WebauthnRequestCallback.forGetCredential(mGetCredentialResponseCallback, null);\n        when(mAuthenticationContextProviderMock.getRequestCallback()).thenReturn(mRequestCallback);\n        assertThat(\n                        mCredManHelper.startGetRequest(\n                                mRequestOptions, mOriginString, null, mClientDataHash, false))\n                .isEqualTo(AuthenticatorStatus.SUCCESS);\n        // Completion callbacks must not consult a provider that now resolves a\n        // different request's document-scoped bridge.\n        currentBridge.set(replacement);\n        mRequestCallback.onComplete(\n                WebauthnRequestResponse.forFailedGetCredential(\n                        AuthenticatorStatus.ABORT_ERROR, new RequestMetrics.Builder().build()));\n        verify(mBrowserBridge).cleanupRequest(any());\n        Mockito.verifyNoInteractions(replacement);\n    }\n\n"
