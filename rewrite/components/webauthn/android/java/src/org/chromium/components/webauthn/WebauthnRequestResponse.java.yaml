# Android WebAuthn request activation and lifetime.
substitutions:
- description: Retain structured extension errors in the existing Mojo response wrapper.
  regex:
    pattern: import org.chromium.blink.mojom.MakeCredentialAuthenticatorResponse;
    replace: 'import org.chromium.blink.mojom.MakeCredentialAuthenticatorResponse;

      import org.chromium.blink.mojom.WebAuthnDomExceptionDetails;'
- description: Store the same DOMException payload supported by native Chromium.
  regex:
    pattern: '    private int mAuthenticatorStatus;'
    replace: "    private int mAuthenticatorStatus;\n    private @Nullable WebAuthnDomExceptionDetails mDomExceptionDetails;"
- description: Create a proxied response without dropping the extension-provided error name/message.
  regex:
    pattern: '    public static WebauthnRequestResponse forSuccessfulMakeCredential('
    replace: "    static WebauthnRequestResponse forProxyMakeCredential(\n            int status, @Nullable MakeCredentialAuthenticatorResponse credential,\n            @Nullable WebAuthnDomExceptionDetails exception) {\n        WebauthnRequestResponse response = new WebauthnRequestResponse();\n        response.mAuthenticatorStatus = status;\n        response.mMakeCredentialResponse = credential;\n        response.mDomExceptionDetails = exception;\n        response.mRequestMetrics = new RequestMetrics.Builder().build();\n        return response;\n    }\n\n    @Nullable WebAuthnDomExceptionDetails getDomExceptionDetails() {\n        return mDomExceptionDetails;\n    }\n\n    public static WebauthnRequestResponse forSuccessfulMakeCredential("
- description: Identify actual credential success before final owner validation
  regex:
    re_pattern: \ \ \ \ public\ int\ getAuthenticatorStatus\(\)\ \{
    replace: "    boolean isSuccessfulCredential() {\n        if (mGetCredentialResponse != null) {\n            return mGetCredentialResponse.which() == GetCredentialResponse.Tag.PasswordResponse\n                    || (mGetCredentialResponse.which()\n                                    == GetCredentialResponse.Tag.GetAssertionResponse\n                            && mGetCredentialResponse.getGetAssertionResponse().status\n                                    == AuthenticatorStatus.SUCCESS);\n        }\n        return mMakeCredentialResponse != null && mAuthenticatorStatus == AuthenticatorStatus.SUCCESS;\n    }\n\n    public int getAuthenticatorStatus() {"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ==\ GetCredentialResponse\.Tag\.GetAssertionResponse\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ mGetCredentialResponse\.getGetAssertionResponse\(\)\.status\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ==\ AuthenticatorStatus\.SUCCESS\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ return\ mMakeCredentialResponse\ !=\ null\ \&\&\ mAuthenticatorStatus\ ==\ AuthenticatorStatus\.SUCCESS;\

      \ \ \ \ \}\

      \

      \ \ \ \ public\ int\ getAuthenticatorStatus\(\)\ \{\

      \ \ \ \ \ \ \ \ return\ mAuthenticatorStatus;\

      '
    replace: "                                    == GetCredentialResponse.Tag.GetAssertionResponse\n                            && mGetCredentialResponse.getGetAssertionResponse().status\n                                    == AuthenticatorStatus.SUCCESS);\n        }\n        return mMakeCredentialResponse != null\n                && mAuthenticatorStatus == AuthenticatorStatus.SUCCESS;\n    }\n\n    public int getAuthenticatorStatus() {\n        return mAuthenticatorStatus;\n"
