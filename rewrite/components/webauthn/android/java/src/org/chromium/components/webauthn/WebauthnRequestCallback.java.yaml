# Android WebAuthn request activation and lifetime.
substitutions:
- description: Preserve structured native proxy errors through the renderer response.
  regex:
    pattern: '            mMakeCredentialCallback.call(response.getAuthenticatorStatus(), null, null);'
    replace: "            mMakeCredentialCallback.call(response.getAuthenticatorStatus(), null,\n                    response.getDomExceptionDetails());"
- description: Provide one final request-specific credential-delivery check
  regex:
    re_pattern: import\ java\.util\.List;
    replace: 'import java.util.List;

      import java.util.function.BooleanSupplier;'
- description: Bind the final permission check to this callback rather than a replacement request
  regex:
    re_pattern: \ \ \ \ private\ @Nullable\ RecordOutcomeCallback\ mRecordingCallback;
    replace: "    private @Nullable RecordOutcomeCallback mRecordingCallback;\n    private @Nullable BooleanSupplier mResponseValidator;\n\n    void setResponseValidator(BooleanSupplier validator) { mResponseValidator = validator; }"
- description: Reject a late successful credential from an inactive or replaced request owner
  regex:
    re_pattern: \ \ \ \ \ \ \ \ if\ \(response\.getRequestMetrics\(\)\ !=\ null\)\ \{
    replace: "        if (response.isSuccessfulCredential() && mResponseValidator != null\n                && !mResponseValidator.getAsBoolean()) {\n            response = mCallbackType == CallbackType.MAKE_CREDENTIAL\n                    ? WebauthnRequestResponse.forFailedMakeCredential(\n                            AuthenticatorStatus.NOT_FOCUSED, new RequestMetrics.Builder().build())\n                    : WebauthnRequestResponse.forFailedGetCredential(\n                            AuthenticatorStatus.NOT_FOCUSED, new RequestMetrics.Builder().build());\n        }\n        if (response.getRequestMetrics() != null) {"
- description: Release the activation validator after exact-once completion
  regex:
    re_pattern: \ \ \ \ \ \ \ \ mRecordingCallback\ =\ null;
    replace: "        mRecordingCallback = null;\n        mResponseValidator = null;"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\

      \ \ \ \ private\ @Nullable\ RecordOutcomeCallback\ mRecordingCallback;\

      \ \ \ \ private\ @Nullable\ BooleanSupplier\ mResponseValidator;\

      \

      \ \ \ \ void\ setResponseValidator\(BooleanSupplier\ validator\)\ \{\ mResponseValidator\ =\ validator;\ \}\

      \

      \ \ \ \ //\ Private\ constructor\ to\ enforce\ creation\ via\ static\ factory\ methods\.\

      \ \ \ \ private\ WebauthnRequestCallback\(\

      \ \ \ \ \ \ \ \ \ \ \ \ @CallbackType\ int\ callbackType,\

      '
    replace: "\n    private @Nullable RecordOutcomeCallback mRecordingCallback;\n    private @Nullable BooleanSupplier mResponseValidator;\n\n    void setResponseValidator(BooleanSupplier validator) {\n        mResponseValidator = validator;\n    }\n\n    // Private constructor to enforce creation via static factory methods.\n    private WebauthnRequestCallback(\n            @CallbackType int callbackType,\n"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ if\ \(isRequestComplete\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ logError\(TAG,\ "No\ callbacks\ to\ handle\ response\."\);\

      \ \ \ \ \ \ \ \ \ \ \ \ return;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ if\ \(response\.isSuccessfulCredential\(\)\ \&\&\ mResponseValidator\ !=\ null\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !mResponseValidator\.getAsBoolean\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ response\ =\ mCallbackType\ ==\ CallbackType\.MAKE_CREDENTIAL\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \?\ WebauthnRequestResponse\.forFailedMakeCredential\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AuthenticatorStatus\.NOT_FOCUSED,\ new\ RequestMetrics\.Builder\(\)\.build\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ WebauthnRequestResponse\.forFailedGetCredential\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AuthenticatorStatus\.NOT_FOCUSED,\ new\ RequestMetrics\.Builder\(\)\.build\(\)\);\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ if\ \(response\.getRequestMetrics\(\)\ !=\ null\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ recordOutcome\(response\.getRequestMetrics\(\)\);\

      \ \ \ \ \ \ \ \ \}\

      '
    replace: "        if (isRequestComplete()) {\n            logError(TAG, \"No callbacks to handle response.\");\n            return;\n        }\n        if (response.isSuccessfulCredential()\n                && mResponseValidator != null\n                && !mResponseValidator.getAsBoolean()) {\n            response =\n                    mCallbackType == CallbackType.MAKE_CREDENTIAL\n                            ? WebauthnRequestResponse.forFailedMakeCredential(\n                                    AuthenticatorStatus.NOT_FOCUSED,\n                                    new RequestMetrics.Builder().build())\n                            : WebauthnRequestResponse.forFailedGetCredential(\n                                    AuthenticatorStatus.NOT_FOCUSED,\n                                    new RequestMetrics.Builder().build());\n        }\n        if (response.getRequestMetrics() != null) {\n            recordOutcome(response.getRequestMetrics());\n        }\n"
