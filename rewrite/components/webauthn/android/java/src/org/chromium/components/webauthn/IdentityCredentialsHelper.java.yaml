# Android WebAuthn request activation and lifetime.
substitutions:
- description: Do not create an identity credential for a superseded or inactive request
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ WebauthnRequestCallback\ callback\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assertNonNull\(mAuthenticationContextProvider\.getRequestCallback\(\)\);'
    replace: "        WebauthnRequestCallback callback = mAuthenticationContextProvider.getRequestCallback();\n        if (callback == null) return;\n        if (mAuthenticationContextProvider.shouldBlockUserInteraction()) {\n            callback.onComplete(WebauthnRequestResponse.forFailedMakeCredential(\n                    AuthenticatorStatus.NOT_FOCUSED, new RequestMetrics.Builder().build()));\n            return;\n        }"
- description: Drop late conditional-create results after cancellation without touching a new request
  regex:
    re_pattern: \ \ \ \ \ \ \ \ log\(TAG,\ "onConditionalCreateSuccess"\);
    replace: "        log(TAG, \"onConditionalCreateSuccess\");\n        WebauthnRequestCallback callback = mAuthenticationContextProvider.getRequestCallback();\n        if (callback == null) return;"
- description: Use the request identity rechecked at conditional-create completion
  regex:
    re_pattern: 'assumeNonNull\(mAuthenticationContextProvider\.getRequestCallback\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.onComplete\('
    replace: callback.onComplete(
- description: Deliver only through the original current conditional-create callback
  regex:
    re_pattern: 'assumeNonNull\(mAuthenticationContextProvider\.getRequestCallback\(\)\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.onComplete\('
    replace: callback.onComplete(
