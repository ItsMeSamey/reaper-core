substitutions:
- description: Only the ordinary renderer factory enables proxying, leaving internal payment authenticators unchanged.
  regex:
    pattern: '        return new AuthenticatorImpl('
    replace: '        AuthenticatorImpl authenticator = new AuthenticatorImpl('
- description: Enable the adapter only for Chrome, never WebView authentication.
  regex:
    pattern: '                topOrigin);'
    replace: "                topOrigin);\n        if (WebauthnModeProvider.isChrome(webContents)) {\n            authenticator.enableRequestProxy();\n        }\n        return authenticator;"
