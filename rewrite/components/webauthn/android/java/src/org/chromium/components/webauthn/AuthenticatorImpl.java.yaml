- description: Report proxy capabilities independently from Android credential-provider availability.
  regex:
    pattern: '        log(TAG, "getClientCapabilities");'
    replace: "        log(TAG, \"getClientCapabilities\");\n        // A proxy answers UVPAA independently of Android credential providers.\n        // Only advertise operations supported by the forwarding protocol.\n        if (mRequestProxy != null && mRequestProxy.isUvpaa(isUvpaa -> {\n            ArrayList<WebAuthnClientCapability> proxyCapabilities = new ArrayList<>();\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_RELATED_ORIGINS, true));\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_HYBRID_TRANSPORT, false));\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_PPAA, isUvpaa));\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_UVPAA, isUvpaa));\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_CONDITIONAL_GET, false));\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_CONDITIONAL_CREATE, true));\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_IMMEDIATE_GET, true));\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_SIGNAL_ALL_ACCEPTED_CREDENTIALS, false));\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_SIGNAL_CURRENT_USER_DETAILS, false));\n            proxyCapabilities.add(createWebAuthnClientCapability(\n                    AuthenticatorConstants.CAPABILITY_SIGNAL_UNKNOWN_CREDENTIAL, false));\n            callback.call(proxyCapabilities.toArray(new WebAuthnClientCapability[0]));\n        })) return;\n"
- description: Cancel either proxied operation before Android platform-specific cancellation.
  regex:
    pattern: '        log(TAG, "cancel");'
    replace: "        log(TAG, \"cancel\");\n        if (mAwaitingProxyConfirmation && mRequestCallback != null) {\n            cancelProxyConfirmation(mRequestCallback);\n            return;\n        }\n        if (mRequestProxy != null && mRequestProxy.cancel()) return;"
- description: Clear pending confirmation state at request completion.
