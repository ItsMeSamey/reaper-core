- description: Keep ordinary provider callbacks and actual UI dispatch bound to their initiating request
  regex:
    re_pattern: \ \ \ \ private\ Fido2CredentialRequest\ getFido2CredentialRequest\(\)\ \{
    replace: "    private boolean isCurrentRequest(WebauthnRequestCallback expected) {\n        return !mClosed && mRequestCallback == expected;\n    }\n\n    private boolean beginGuardedRequest(WebauthnRequestCallback expected, boolean conditional) {\n        WebAuthenticationProxyBridge bridge = mRequestProxy;\n        if (bridge == null) return true;\n        mGuardedRequest = expected;\n        if (!bridge.startRequestGuard(conditional, () -> cancelForContextLoss(expected))) {\n            completeContextFailure(expected, AuthenticatorStatus.NOT_FOCUSED);\n            return false;\n        }\n        expected.setResponseValidator(\n                () -> isCurrentRequest(expected) && mRequestProxy == bridge\n                        && bridge.canCompleteRequest());\n        return true;\n    }\n\n    private void completeContextFailure(WebauthnRequestCallback expected, int status) {\n        expected.onComplete(expected.getCallbackType()\n                                == WebauthnRequestCallback.CallbackType.MAKE_CREDENTIAL\n                        ? WebauthnRequestResponse.forFailedMakeCredential(\n                                status, new RequestMetrics.Builder().build())\n                        : WebauthnRequestResponse.forFailedGetCredential(\n                                status, new RequestMetrics.Builder().build()));\n    }\n\n    private void cancelForContextLoss(WebauthnRequestCallback expected) {\n        if (!isCurrentRequest(expected)) return;\n        Fido2CredentialRequest pending = mPendingFido2CredentialRequest;\n        boolean confirmation = mAwaitingProxyConfirmation;\n        // Retire the old callback before canceling providers; cancellation can\n        // synchronously reply, and a later OS result must never target a new call.\n        cleanupRequest();\n        if (mRequestProxy != null) mRequestProxy.cancel();\n        if (confirmation && mCreateConfirmationUiDelegate != null) {\n            mCreateConfirmationUiDelegate.cancel();\n        }\n        if (pending != null) {\n            if (expected.getCallbackType() == WebauthnRequestCallback.CallbackType.GET_CREDENTIAL) {\n                pending.cancelGetAssertion();\n            }\n            pending.destroyBridge();\n        }\n        completeContextFailure(expected, AuthenticatorStatus.ABORT_ERROR);\n    }\n\n    private boolean beginRequestInteraction(WebauthnRequestCallback expected) {\n        if (!isCurrentRequest(expected)) return false;\n        return mGuardedRequest != expected || mRequestProxy == null\n                || mRequestProxy.beginRequestInteraction();\n    }\n\n    private AuthenticationContextProvider contextForRequest(\n            @Nullable WebauthnRequestCallback expected) {\n        return new AuthenticationContextProvider() {\n            @Override\n            public @Nullable Context getContext() { return mContext; }\n            @Override\n            public @Nullable RenderFrameHost getRenderFrameHost() { return mRenderFrameHost; }\n            @Override\n            public @Nullable WebContents getWebContents() { return mWebContents; }\n            @Override\n            public @Nullable WebauthnRequestCallback getRequestCallback() {\n                if (expected == null || !isCurrentRequest(expected)) return null;\n                if (mGuardedRequest == expected && mRequestProxy != null\n                        && !mRequestProxy.isRequestValid()) return null;\n                return expected;\n            }\n            @Override\n            public boolean shouldBlockUserInteraction() {\n                return expected != null && !beginRequestInteraction(expected);\n            }\n            @Override\n            public FidoIntentSender getIntentSender() {\n                FidoIntentSender sender = AuthenticatorImpl.this.getIntentSender();\n                return (PendingIntent intent, Callback<Pair<Integer, @Nullable Intent>> callback) -> {\n                    if (shouldBlockUserInteraction()) return false;\n                    return sender.showIntent(intent, result -> {\n                        if (expected == null || isCurrentRequest(expected)) callback.onResult(result);\n                    });\n                };\n            }\n        };\n    }\n\n    private Fido2CredentialRequest getFido2CredentialRequest() {\n        AuthenticationContextProvider provider = contextForRequest(mRequestCallback);"
