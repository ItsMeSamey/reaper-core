# Android WebAuthn request activation and lifetime.
substitutions:
- description: Keep the native proxy lifetime within this renderer authenticator.
  regex:
    pattern: '    private @Nullable WebauthnRequestCallback mRequestCallback;'
    replace: "    private @Nullable WebAuthenticationProxyBridge mRequestProxy;\n    private boolean mClosed;\n    private boolean mAwaitingProxyConfirmation;\n    private @Nullable WebauthnRequestCallback mRequestCallback;"
- description: The renderer factory alone opts into extension request forwarding.
  regex:
    pattern: '    private Fido2CredentialRequest getFido2CredentialRequest() {'
    replace: "    void enableRequestProxy() {\n        assert mRequestProxy == null && mRenderFrameHost != null;\n        mRequestProxy = new WebAuthenticationProxyBridge(assertNonNull(mRenderFrameHost));\n    }\n\n    private boolean hasRequestProxy() {\n        return !mClosed && mRequestProxy != null && mRequestProxy.isActive();\n    }\n\n    private void completeProxyRequest(WebauthnRequestCallback expected,\n            WebauthnRequestResponse response) {\n        if (!mClosed && mRequestCallback == expected) expected.onComplete(response);\n    }\n\n    private void cancelProxyConfirmation(WebauthnRequestCallback expected) {\n        if (mClosed || mRequestCallback != expected || !mAwaitingProxyConfirmation) return;\n        mRequestCallback = null;\n        mAwaitingProxyConfirmation = false;\n        if (mRequestProxy != null) mRequestProxy.clearConfirmation();\n        if (mCreateConfirmationUiDelegate != null) mCreateConfirmationUiDelegate.cancel();\n        expected.onComplete(WebauthnRequestResponse.forFailedMakeCredential(\n                AuthenticatorStatus.ABORT_ERROR, new RequestMetrics.Builder().build()));\n    }\n\n    private Fido2CredentialRequest getFido2CredentialRequest() {"
