    pattern: '    private void cleanupRequest() {'
    replace: "    private void cleanupRequest() {\n        mAwaitingProxyConfirmation = false;\n        if (mRequestProxy != null) mRequestProxy.clearConfirmation();"
- description: Invalidate callbacks before disposing the native document observer.
