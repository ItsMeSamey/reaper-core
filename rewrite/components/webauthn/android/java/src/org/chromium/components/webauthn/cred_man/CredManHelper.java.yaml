# Android WebAuthn request activation and lifetime.
substitutions:
- description: Retain only the browser bridge actually used by this credential request
  regex:
    re_pattern: \ \ \ \ private\ final\ WebauthnBrowserBridge\.Provider\ mBridgeProvider;
    replace: "    private final WebauthnBrowserBridge.Provider mBridgeProvider;\n    private @Nullable WebauthnBrowserBridge mRequestBridge;"
- description: Remember the exact request bridge for later non-creating cleanup
  regex:
    re_pattern: \ \ \ \ \ \ \ \ final\ WebauthnBrowserBridge\ localBridge\ =\ assumeNonNull\(mBridgeProvider\.getBridge\(\)\);
    replace: "        final WebauthnBrowserBridge localBridge = assumeNonNull(mBridgeProvider.getBridge());\n        mRequestBridge = localBridge;"
  count: 2
- description: Never create an old request bridge while cleaning up after a replacement response
  regex:
    re_pattern: '\ \ \ \ private\ void\ cleanupRequest\(\)\ \{\

      \ \ \ \ \ \ \ \ WebauthnBrowserBridge\ bridge\ =\ mBridgeProvider\.getBridge\(\);'
    replace: "    private void cleanupRequest() {\n        WebauthnBrowserBridge bridge = mRequestBridge;\n        mRequestBridge = null;"
- description: Revalidate the requesting pane before Android CredentialManager interaction
  regex:
    re_pattern: \ \ \ \ \ \ \ \ log\(TAG,\ "startMakeRequest"\);
    replace: "        log(TAG, \"startMakeRequest\");\n        if (mAuthenticationContextProvider.shouldBlockUserInteraction()) {\n            return AuthenticatorStatus.NOT_FOCUSED;\n        }"
- description: Revalidate the requesting pane before Android CredentialManager interaction
  regex:
    re_pattern: \ \ \ \ \ \ \ \ log\(TAG,\ "startGetRequest"\);
    replace: "        log(TAG, \"startGetRequest\");\n        if (mAuthenticationContextProvider.shouldBlockUserInteraction()) {\n            return AuthenticatorStatus.NOT_FOCUSED;\n        }"
- description: Ignore obsolete Android credential callbacks before document-scoped side effects
  regex:
    re_pattern: public\ void\ onError\(CreateCredentialException\ exception\)\ \{
    replace: "public void onError(CreateCredentialException exception) {\n                        if (mAuthenticationContextProvider.getRequestCallback() == null) return;"
- description: Ignore obsolete Android credential callbacks before document-scoped side effects
  regex:
    re_pattern: public\ void\ onResult\(CreateCredentialResponse\ createCredentialResponse\)\ \{
    replace: "public void onResult(CreateCredentialResponse createCredentialResponse) {\n                        if (mAuthenticationContextProvider.getRequestCallback() == null) return;"
- description: Ignore obsolete Android credential callbacks before document-scoped side effects
  regex:
    re_pattern: public\ void\ onError\(GetCredentialException\ e\)\ \{
    replace: "public void onError(GetCredentialException e) {\n                        if (mAuthenticationContextProvider.getRequestCallback() == null) return;"
- description: Ignore obsolete Android credential callbacks before document-scoped side effects
  regex:
    re_pattern: PrepareGetCredentialResponse\ prepareGetCredentialResponse\)\ \{
    replace: "PrepareGetCredentialResponse prepareGetCredentialResponse) {\n                        if (mAuthenticationContextProvider.getRequestCallback() == null) return;"
- description: Ignore obsolete Android credential callbacks before document-scoped side effects
  regex:
    re_pattern: public\ void\ onError\(GetCredentialException\ getCredentialException\)\ \{
    replace: "public void onError(GetCredentialException getCredentialException) {\n                        if (mAuthenticationContextProvider.getRequestCallback() == null) return;"
- description: Ignore obsolete Android credential callbacks before document-scoped side effects
  regex:
    re_pattern: public\ void\ onResult\(GetCredentialResponse\ getCredentialResponse\)\ \{
    replace: "public void onResult(GetCredentialResponse getCredentialResponse) {\n                        if (mAuthenticationContextProvider.getRequestCallback() == null) return;"
- description: Do not publish stale conditional credentials after a delayed barrier completes
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ localBridge\.onCredManConditionalRequestPending\('
    replace: "                                    () -> {\n                                        if (mAuthenticationContextProvider.getRequestCallback() == null) return;\n                                        localBridge.onCredManConditionalRequestPending("
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ignoreGpm\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\ else\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ barrierCallback\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(mAuthenticationContextProvider\.getRequestCallback\(\)\ ==\ null\)\ return;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ localBridge\.onCredManConditionalRequestPending\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ frameHost,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ hasPublicKeyCredentials\ \|\|\ hasAuthenticationResults,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(requestPasswords\)\ \->\ \{\

      '
    replace: "                                                    ignoreGpm);\n                        } else {\n                            barrierCallback =\n                                    () -> {\n                                        if (mAuthenticationContextProvider.getRequestCallback()\n                                                == null) return;\n                                        localBridge.onCredManConditionalRequestPending(\n                                                frameHost,\n                                                hasPublicKeyCredentials || hasAuthenticationResults,\n                                                (requestPasswords) -> {\n"
