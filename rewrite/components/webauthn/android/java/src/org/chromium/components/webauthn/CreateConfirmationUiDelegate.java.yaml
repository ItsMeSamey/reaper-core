substitutions:
- description: Allow an aborted proxy request to dismiss its incognito confirmation.
  regex:
    pattern: '    boolean show(Runnable onUserAccept, Runnable onUserReject);'
    replace: "    boolean show(Runnable onUserAccept, Runnable onUserReject);\n\n    /** Dismisses pending confirmation when its document/request is cancelled. */\n    default void cancel() {}"
