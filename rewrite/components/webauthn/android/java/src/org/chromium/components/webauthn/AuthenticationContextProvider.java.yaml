# Android WebAuthn request activation and lifetime.
substitutions:
- description: Let ordinary provider flows reuse embedder activation checks without Chrome dependencies
  regex:
    re_pattern: \ \ \ \ FidoIntentSender\ getIntentSender\(\);
    replace: "    FidoIntentSender getIntentSender();\n\n    /** Revalidates and promotes this request immediately before interactive platform UI. */\n    default boolean shouldBlockUserInteraction() { return false; }"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\

      \ \ \ \ FidoIntentSender\ getIntentSender\(\);\

      \

      \ \ \ \ /\*\*\ Revalidates\ and\ promotes\ this\ request\ immediately\ before\ interactive\ platform\ UI\.\ \*/\

      \ \ \ \ default\ boolean\ shouldBlockUserInteraction\(\)\ \{\ return\ false;\ \}\

      \

      \ \ \ \ @Nullable\ WebContents\ getWebContents\(\);\

      \

      \ \ \ \ /\*\*\

      '
    replace: "\n    FidoIntentSender getIntentSender();\n\n    /** Revalidates and promotes this request immediately before interactive platform UI. */\n    default boolean shouldBlockUserInteraction() {\n        return false;\n    }\n\n    @Nullable WebContents getWebContents();\n\n    /**\n"
