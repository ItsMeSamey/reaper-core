# Android WebAuthn selected-tab request lifetime.
substitutions:
- description: Preserve default behavior for embedders that do not install a Chrome request guard
  count: 1
  regex:
    re_pattern: WebAuthnClientAndroid::\~WebAuthnClientAndroid\(\)\ =\ default;
    replace: "WebAuthnRequestGuard::~WebAuthnRequestGuard() = default;\n\nWebAuthnClientAndroid::~WebAuthnClientAndroid() = default;\n\nstd::unique_ptr<WebAuthnRequestGuard> WebAuthnClientAndroid::CreateRequestGuard(\n    content::RenderFrameHost* frame,\n    bool conditional,\n    base::OnceClosure on_cancel) {\n  return nullptr;\n}"
