# Android split pane request ownership and dialog placement.
substitutions:
- description: preserve visibility fallback for non-Chrome Android permission clients
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      bool\ PermissionsClient::IsDseOrigin'
    replace: "#if BUILDFLAG(IS_ANDROID)\nbool PermissionsClient::IsAndroidTabModelActive(tabs::TabInterface* tab) {\n  return true;\n}\n\nbase::ScopedClosureRunner PermissionsClient::ObserveAndroidTabModel(\n    tabs::TabInterface* tab,\n    base::RepeatingCallback<void(bool)> callback) {\n  return {};\n}\n\nbool PermissionsClient::IsDseOrigin"
- description: 'Compile survey-only function only outside Android: void PermissionsClient::TriggerPromptHatsSurveyIfEnabled('
  regex:
    pattern: "void PermissionsClient::TriggerPromptHatsSurveyIfEnabled(\n    content::WebContents* web_contents,\n    permissions::RequestType\
      \ request_type,\n    std::optional<permissions::PermissionAction> action,\n    permissions::PermissionPromptDisposition\
      \ prompt_disposition,\n    permissions::PermissionPromptDispositionReason prompt_disposition_reason,\n    permissions::PermissionRequestGestureType\
      \ gesture_type,\n    std::optional<base::TimeDelta> prompt_display_duration,\n    bool is_post_prompt,\n    const GURL&\
      \ gurl,\n    std::optional<permissions::feature_params::PermissionElementPromptPosition>\n        pepc_prompt_position,\n\
      \    ContentSetting initial_permission_status,\n    base::OnceCallback<void()> hats_shown_callback,\n    PromptOptions\
      \ prompt_options) {}"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid PermissionsClient::TriggerPromptHatsSurveyIfEnabled(\n    content::WebContents*\
      \ web_contents,\n    permissions::RequestType request_type,\n    std::optional<permissions::PermissionAction> action,\n\
      \    permissions::PermissionPromptDisposition prompt_disposition,\n    permissions::PermissionPromptDispositionReason\
      \ prompt_disposition_reason,\n    permissions::PermissionRequestGestureType gesture_type,\n    std::optional<base::TimeDelta>\
      \ prompt_display_duration,\n    bool is_post_prompt,\n    const GURL& gurl,\n    std::optional<permissions::feature_params::PermissionElementPromptPosition>\n\
      \        pepc_prompt_position,\n    ContentSetting initial_permission_status,\n    base::OnceCallback<void()> hats_shown_callback,\n\
      \    PromptOptions prompt_options) {}\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
