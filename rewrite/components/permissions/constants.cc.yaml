substitutions:
- description: Use direct Android platform guard
  regex:
    pattern: '#include "components/permissions/constants.h"

      '
    replace: '#include "components/permissions/constants.h"


      #include "build/build_config.h"

      '
  count: 1
- description: Exclude13 dedicated permission-survey PSD keys; preserve ordinary permissions constants
  regex:
    pattern: "// The key in `Product Specific String Data` under which the disposition of the\n// permission prompt is recorded\
      \ in the prompt HaTS survey.\nconst char kPermissionsPromptSurveyPromptDispositionKey[] = \"PromptDisposition\";\n\n\
      // The key in `Product Specific String Data` under which the quiet UI reason is\n// recorded in the prompt HaTS survey.\n\
      const char kPermissionsPromptSurveyPromptDispositionReasonKey[] =\n    \"PromptDispositionReason\";\n\n// The key in\
      \ `Product Specific String Data` under which the request action is\n// recorded in the prompt HaTS survey.\nconst char\
      \ kPermissionsPromptSurveyActionKey[] = \"Action\";\n\n// The key in `Product Specific String Data` under which the\
      \ request type is\n// recorded in the prompt HaTS survey.\nconst char kPermissionsPromptSurveyRequestTypeKey[] = \"\
      RequestType\";\n\n// The key in `Product Specific String Data` under which the display timing of\n// the survey is recorded\
      \ in the prompt HaTS survey.\nextern const char kPermissionsPromptSurveyDisplayTimeKey[] =\n    \"SurveyDisplayTime\"\
      ;\n\n// The key in `Product Specific String Data` under which the 'one time prompts\n// decided' count bucket of the\
      \ user taking the prompt HaTS survey is recorded.\nextern const char kPermissionPromptSurveyOneTimePromptsDecidedBucketKey[]\
      \ =\n    \"OneTimePromptsDecidedBucket\";\n\n// The key in `Product Specific String Data` under which the URL on which\
      \ the\n// prompt HaTS survey was triggered is recorded.\nextern const char kPermissionPromptSurveyUrlKey[] = \"PromptSurveyUrl\"\
      ;\n\n// The key in `Product Specific Bits Data` under which whether the prompt\n// was triggered by a user gestured\
      \ is recorded in the prompt HaTS survey.\nconst char kPermissionsPromptSurveyHadGestureKey[] = \"HadGesture\";\n\n//\
      \ The key in `Product Specific String Data` under which the release channel on\n// which the prompt was triggered is\
      \ recorded in the prompt HaTS survey.\n// Note that a finch config typically defines a min_version to run the\n// experiment.\
      \ When Version V is stable, Beta (V+1), Dev (V+2) and Canary (V+3)\n// all have higher version numbers and will therefore\
      \ be part of the experiment\n// with min_version V with the rollout plan for stable. This filter allows\n// restriction\
      \ to specific channels (typically to stable).\nconst char kPermissionsPromptSurveyReleaseChannelKey[] = \"ReleaseChannel\"\
      ;\n\nconst char kPermissionPromptSurveyPepcPromptPositionKey[] =\n    \"PepcPromptPosition\";\n\nconst char kPermissionPromptSurveyInitialPermissionStatusKey[]\
      \ =\n    \"InitialPermissionStatus\";\n\nconst char kPermissionPromptSurveyPromptOptionsKey[] = \"PromptOptions\";\n\
      \nconst char kPermissionPromptSurveyPromptDisplayDurationKey[] =\n    \"PromptDisplayDuration\";"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// The key in `Product Specific String Data` under which the disposition of the\n\
      // permission prompt is recorded in the prompt HaTS survey.\nconst char kPermissionsPromptSurveyPromptDispositionKey[]\
      \ = \"PromptDisposition\";\n\n// The key in `Product Specific String Data` under which the quiet UI reason is\n// recorded\
      \ in the prompt HaTS survey.\nconst char kPermissionsPromptSurveyPromptDispositionReasonKey[] =\n    \"PromptDispositionReason\"\
      ;\n\n// The key in `Product Specific String Data` under which the request action is\n// recorded in the prompt HaTS\
      \ survey.\nconst char kPermissionsPromptSurveyActionKey[] = \"Action\";\n\n// The key in `Product Specific String Data`\
      \ under which the request type is\n// recorded in the prompt HaTS survey.\nconst char kPermissionsPromptSurveyRequestTypeKey[]\
      \ = \"RequestType\";\n\n// The key in `Product Specific String Data` under which the display timing of\n// the survey\
      \ is recorded in the prompt HaTS survey.\nextern const char kPermissionsPromptSurveyDisplayTimeKey[] =\n    \"SurveyDisplayTime\"\
      ;\n\n// The key in `Product Specific String Data` under which the 'one time prompts\n// decided' count bucket of the\
      \ user taking the prompt HaTS survey is recorded.\nextern const char kPermissionPromptSurveyOneTimePromptsDecidedBucketKey[]\
      \ =\n    \"OneTimePromptsDecidedBucket\";\n\n// The key in `Product Specific String Data` under which the URL on which\
      \ the\n// prompt HaTS survey was triggered is recorded.\nextern const char kPermissionPromptSurveyUrlKey[] = \"PromptSurveyUrl\"\
      ;\n\n// The key in `Product Specific Bits Data` under which whether the prompt\n// was triggered by a user gestured\
      \ is recorded in the prompt HaTS survey.\nconst char kPermissionsPromptSurveyHadGestureKey[] = \"HadGesture\";\n\n//\
      \ The key in `Product Specific String Data` under which the release channel on\n// which the prompt was triggered is\
      \ recorded in the prompt HaTS survey.\n// Note that a finch config typically defines a min_version to run the\n// experiment.\
      \ When Version V is stable, Beta (V+1), Dev (V+2) and Canary (V+3)\n// all have higher version numbers and will therefore\
      \ be part of the experiment\n// with min_version V with the rollout plan for stable. This filter allows\n// restriction\
      \ to specific channels (typically to stable).\nconst char kPermissionsPromptSurveyReleaseChannelKey[] = \"ReleaseChannel\"\
      ;\n\nconst char kPermissionPromptSurveyPepcPromptPositionKey[] =\n    \"PepcPromptPosition\";\n\nconst char kPermissionPromptSurveyInitialPermissionStatusKey[]\
      \ =\n    \"InitialPermissionStatus\";\n\nconst char kPermissionPromptSurveyPromptOptionsKey[] = \"PromptOptions\";\n\
      \nconst char kPermissionPromptSurveyPromptDisplayDurationKey[] =\n    \"PromptDisplayDuration\";\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
