substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "components/permissions/permission_prompt.h"

      #include "content/public/browser/web_contents.h"

      '
    replace: '#include "components/permissions/permission_prompt.h"


      #include "build/build_config.h"

      #include "content/public/browser/web_contents.h"

      '
  count: 1
- description: Match the platform-guarded permission prompt delegate interface
  regex:
    pattern: "  MOCK_METHOD(void,\n              SetHatsShownCallback,\n              (base::OnceCallback<void()>),\n    \
      \          (override));"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(void,\n              SetHatsShownCallback,\n              (base::OnceCallback<void()>),\n\
      \              (override));\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
