substitutions:
- description: Exclude the removed survey helper-only counter preference on Android
  regex:
    pattern: "// The number of one time permission prompts a user has seen.\nconst char kOneTimePermissionPromptsDecidedCount[]\
      \ =\n    \"profile.one_time_permission_prompts_decided_count\";"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// The number of one time permission prompts a user has seen.\nconst char kOneTimePermissionPromptsDecidedCount[]\
      \ =\n    \"profile.one_time_permission_prompts_decided_count\";\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
