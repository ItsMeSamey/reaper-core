- description: Exclude dedicated Android prediction/AI workflow instrumentation GetPredictionModelString; ordinary prompt
    metrics remain.
  regex:
    pattern: "std::string PermissionUmaUtil::GetPredictionModelString(\n    PredictionModelType model_type) {\n  switch (model_type)\
      \ {\n    case PredictionModelType::kServerSideCpssV3Model:\n      return \"PredictionService\";\n    case PredictionModelType::kOnDeviceCpssV1Model:\n\
      \      return \"OnDevicePredictionService\";\n    case PredictionModelType::kOnDeviceAiV4Model:\n      return \"AIv4\"\
      ;\n    case PredictionModelType::kUnknown:\n      NOTREACHED();\n  }\n  NOTREACHED();\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::string PermissionUmaUtil::GetPredictionModelString(\n    PredictionModelType\
      \ model_type) {\n  switch (model_type) {\n    case PredictionModelType::kServerSideCpssV3Model:\n      return \"PredictionService\"\
      ;\n    case PredictionModelType::kOnDeviceCpssV1Model:\n      return \"OnDevicePredictionService\";\n    case PredictionModelType::kOnDeviceAiV4Model:\n\
      \      return \"AIv4\";\n    case PredictionModelType::kUnknown:\n      NOTREACHED();\n  }\n  NOTREACHED();\n}\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude dedicated Android prediction/AI workflow instrumentation RecordPermissionRequestRelevance; ordinary
