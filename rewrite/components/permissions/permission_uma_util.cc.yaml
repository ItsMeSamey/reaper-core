    pattern: "    case ContentSettingsType::LOOPBACK_NETWORK:\n      return \"LoopbackNetwork\";\n    default:\n      break;\n\
      \  }\n  // The user is not prompted for these permissions thus there is no\n"
    replace: "    case ContentSettingsType::LOOPBACK_NETWORK:\n      return \"LoopbackNetwork\";\n    default:\n      BRAVE_GET_PERMISSION_STRING_FOR_UMA\n\
      \      break;\n  }\n  // The user is not prompted for these permissions thus there is no\n"
