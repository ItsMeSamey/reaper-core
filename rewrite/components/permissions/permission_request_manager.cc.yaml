- description: latch native permission activation and retire old owner prompt
  regex:
    re_pattern: '\ \ const\ bool\ prior_tab_is_active_\ =\ tab_is_active_;\

      \ \ tab_is_active_\ =\ is_active;\

      \ \ if\ \(prior_tab_is_active_\ !=\ tab_is_active_\)\ \{'
    replace: "  const bool prior_tab_is_active_ = tab_is_active_;\n#if BUILDFLAG(IS_ANDROID)\n  // WillDeactivate runs before the Java model commits its new selection.\n  // The callback value, rather than IsActivated(), is authoritative here.\n  android_native_tab_active_ = is_active;\n  tab_is_active_ = is_active && android_tab_model_active_ &&\n                   web_contents()->GetVisibility() != content::Visibility::HIDDEN;\n  // An OS permission activity only changes visibility and must retain its\n  // native prompt for the result. Actual tab deactivation retires that prompt,\n  // including when the OS activity already hid the WebContents.\n  if (!is_active && view_ &&\n      view_->GetTabSwitchingBehavior() ==\n          PermissionPrompt::TabSwitchingBehavior::kKeepPromptAlive) {\n    auto weak_this = weak_factory_.GetWeakPtr();\n    DeletePrompt();\n    if (!weak_this) {\n      return;\n    }\n  }\n#else\n  tab_is_active_ = is_active;\n#endif\n  if (prior_tab_is_active_ != tab_is_active_) {"
