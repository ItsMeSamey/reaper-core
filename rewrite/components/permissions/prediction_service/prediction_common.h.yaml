substitutions:
- description: Retain a dependency-light Android math header; request/proto includes are producer-only.
  regex:
    pattern: '#include "components/permissions/prediction_service/prediction_request_features.h"

      #include "components/permissions/prediction_service/prediction_service_messages.pb.h"

      '
    replace: '#include "build/build_config.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "components/permissions/prediction_service/prediction_request_features.h"

      #include "components/permissions/prediction_service/prediction_service_messages.pb.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Compile out dedicated permission prediction URL/switch constants on Android, retaining math constants.
  regex:
    pattern: "constexpr char kDefaultPredictionServiceUrl[] =\n    \"https://webpermissionpredictions.googleapis.com/v1:generatePredictions\"\
      ;\n\n// A command line switch to override the default service url.\nconstexpr char kDefaultPredictionServiceUrlSwitchKey[]\
      \ =\n    \"permission-predictions-service-url\";\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nconstexpr char kDefaultPredictionServiceUrl[] =\n    \"https://webpermissionpredictions.googleapis.com/v1:generatePredictions\"\
      ;\n\n// A command line switch to override the default service url.\nconstexpr char kDefaultPredictionServiceUrlSwitchKey[]\
      \ =\n    \"permission-predictions-service-url\";\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Compile out platform/gesture/request serialization APIs while retaining all three ordinary math declarations.
  regex:
    pattern: "// Get the current platform for proto message purposes.\nClientFeatures_Platform GetCurrentPlatformProto();\n\
      \n// Get the current platform for proto message purposes.\nClientFeatures_PlatformEnum GetCurrentPlatformEnumProto();\n\
      \n// Convert PermissionRequestGestureType to ClientFeatures_Gesture.\nClientFeatures_Gesture ConvertToProtoGesture(\n\
      \    const permissions::PermissionRequestGestureType type);\n\n// Convert PermissionRequestGestureType to ClientFeatures_GestureEnum.\n\
      ClientFeatures_GestureEnum ConvertToProtoGestureEnum(\n    const permissions::PermissionRequestGestureType type);\n\n\
      // Fill in the values in StatsFeature using the values in\n// PredictionRequestFeatures::ActionCounts\nvoid FillInStatsFeatures(const\
      \ PredictionRequestFeatures::ActionCounts& counts,\n                         StatsFeatures* features);\n\nstd::unique_ptr<GeneratePredictionsRequest>\
      \ GetPredictionRequestProto(\n    const PredictionRequestFeatures& entity);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Get the current platform for proto message purposes.\nClientFeatures_Platform\
      \ GetCurrentPlatformProto();\n\n// Get the current platform for proto message purposes.\nClientFeatures_PlatformEnum\
      \ GetCurrentPlatformEnumProto();\n\n// Convert PermissionRequestGestureType to ClientFeatures_Gesture.\nClientFeatures_Gesture\
      \ ConvertToProtoGesture(\n    const permissions::PermissionRequestGestureType type);\n\n// Convert PermissionRequestGestureType\
      \ to ClientFeatures_GestureEnum.\nClientFeatures_GestureEnum ConvertToProtoGestureEnum(\n    const permissions::PermissionRequestGestureType\
      \ type);\n\n// Fill in the values in StatsFeature using the values in\n// PredictionRequestFeatures::ActionCounts\n\
      void FillInStatsFeatures(const PredictionRequestFeatures::ActionCounts& counts,\n                         StatsFeatures*\
      \ features);\n\nstd::unique_ptr<GeneratePredictionsRequest> GetPredictionRequestProto(\n    const PredictionRequestFeatures&\
      \ entity);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
