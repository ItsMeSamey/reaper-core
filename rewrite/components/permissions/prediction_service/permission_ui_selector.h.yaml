substitutions:
- description: Expose the Android build flag directly in the retained generic selector contract.
  regex:
    pattern: '#include "base/functional/callback_forward.h"

      '
    replace: '#include "base/functional/callback_forward.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Retain the exact six fixed-int likelihood names/values as an Android-native generic enum; desktop protobuf
    forward declaration remains.
  regex:
    pattern: 'enum PermissionPrediction_Likelihood_DiscretizedLikelihood : int;

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n// Preserve ordinary permission likelihood statistics without generating the\n//\
      \ dedicated prediction service request/response protobuf on Android.\nenum PermissionPrediction_Likelihood_DiscretizedLikelihood\
      \ : int {\n  PermissionPrediction_Likelihood_DiscretizedLikelihood_DISCRETIZED_LIKELIHOOD_UNSPECIFIED =\n      0,\n\
      \  PermissionPrediction_Likelihood_DiscretizedLikelihood_VERY_UNLIKELY =\n      1,\n  PermissionPrediction_Likelihood_DiscretizedLikelihood_UNLIKELY\
      \ =\n      2,\n  PermissionPrediction_Likelihood_DiscretizedLikelihood_NEUTRAL =\n      3,\n  PermissionPrediction_Likelihood_DiscretizedLikelihood_LIKELY\
      \ =\n      4,\n  PermissionPrediction_Likelihood_DiscretizedLikelihood_VERY_LIKELY =\n      5,\n};\n#else\nenum PermissionPrediction_Likelihood_DiscretizedLikelihood\
      \ : int;\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
