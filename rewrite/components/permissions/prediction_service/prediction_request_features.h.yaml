substitutions:
- description: Retain only explicit size_t/build dependencies for ordinary Android action counting.
  regex:
    pattern: '#include "components/permissions/permission_request_enums.h"

      #include "components/permissions/request_type.h"

      #include "url/gurl.h"

      '
    replace: '#include <cstddef>


      #include "build/build_config.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "components/permissions/permission_request_enums.h"

      #include "components/permissions/request_type.h"

      #include "url/gurl.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Retire prediction-server experiment IDs on Android while retaining nested ActionCounts.
  regex:
    pattern: "  // Do not delete / modify enum assignments, as they will be interpreted on the\n  // server side and should\
      \ be backwards compatible!\n  enum class ExperimentId {\n    kNoExperimentId = 0,\n    kCpssV3ExperimentId = 1,\n  \
      \  kAiV1ExperimentId = 2,  // Deprecated\n    kAiV3ExperimentId = 3,  // Deprecated\n    kAiV4ExperimentId = 4,\n  };\n\
      \n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Do not delete / modify enum assignments, as they will be interpreted on the\n\
      \  // server side and should be backwards compatible!\n  enum class ExperimentId {\n    kNoExperimentId = 0,\n    kCpssV3ExperimentId\
      \ = 1,\n    kAiV1ExperimentId = 2,  // Deprecated\n    kAiV3ExperimentId = 3,  // Deprecated\n    kAiV4ExperimentId\
      \ = 4,\n  };\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n"
  count: 1
- description: Retire Android request URL/gesture/relevance/experiment fields; generic action counts remain byte-exact.
  regex:
    pattern: "  // Whether a gesture is present or not.\n  PermissionRequestGestureType gesture;\n\n  // Which permissions\
      \ request type this is for.\n  RequestType type;\n\n  // The permission action counts for this specific permission type.\n\
      \  ActionCounts requested_permission_counts;\n\n  // The permission action counts for all permissions type.\n  ActionCounts\
      \ all_permission_counts;\n\n  // The origin of the website requesting the permission.\n  GURL url;\n\n  // The id of\
      \ a currently conducted Finch experiment.\n  // 0 = default, client is in Finch experiment control group,\n  // Different\
      \ than 0 = client is in Finch enabled group.\n  ExperimentId experiment_id = ExperimentId::kNoExperimentId;\n\n  //\
      \ The permission request relevance generated by the AI on-device model.\n  // Default initialized to kUnspecified.\n\
      \  PermissionRequestRelevance permission_relevance =\n      PermissionRequestRelevance::kUnspecified;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Whether a gesture is present or not.\n  PermissionRequestGestureType gesture;\n\
      \n  // Which permissions request type this is for.\n  RequestType type;\n\n  // The permission action counts for this\
      \ specific permission type.\n  ActionCounts requested_permission_counts;\n\n  // The permission action counts for all\
      \ permissions type.\n  ActionCounts all_permission_counts;\n\n  // The origin of the website requesting the permission.\n\
      \  GURL url;\n\n  // The id of a currently conducted Finch experiment.\n  // 0 = default, client is in Finch experiment\
      \ control group,\n  // Different than 0 = client is in Finch enabled group.\n  ExperimentId experiment_id = ExperimentId::kNoExperimentId;\n\
      \n  // The permission request relevance generated by the AI on-device model.\n  // Default initialized to kUnspecified.\n\
      \  PermissionRequestRelevance permission_relevance =\n      PermissionRequestRelevance::kUnspecified;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
