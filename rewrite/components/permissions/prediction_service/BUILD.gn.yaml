substitutions:
- description: Retire two dedicated Android model metadata schemas; retain shared prediction messages used by generic permission
    enum/statistics.
  regex:
    pattern: "    \"permissions_aiv4_model_metadata.proto\",\n    \"prediction_model_metadata.proto\",\n    \"prediction_service_messages.proto\"\
      ,\n  ]\n}"
    replace: "    \"permissions_aiv4_model_metadata.proto\",\n    \"prediction_model_metadata.proto\",\n    \"prediction_service_messages.proto\"\
      ,\n  ]\n  if (is_android) {\n    sources -= [\n      \"permissions_aiv4_model_metadata.proto\",\n      \"prediction_model_metadata.proto\"\
      ,\n    ]\n  }\n}"
  count: 1
- description: Retire Android TFLite-specific target configuration from the retained shared selector/math target.
  regex:
    pattern: "  _configs = configs\n  configs = []\n  configs = [ \"//third_party/tflite:tflite_shim_config\" ] + _configs\n"
    replace: "  if (!is_android) {\n    _configs = configs\n    configs = []\n    configs = [ \"//third_party/tflite:tflite_shim_config\"\
      \ ] + _configs\n  }\n"
  count: 1
- description: Exclude dedicated Android AI encoders/executors/handlers/network prediction sources and model dependencies,
    retaining selector/math/request-feature headers.
  regex:
    pattern: "source_set(\"prediction_service\") {\n  if (!is_android) {\n    _configs = configs\n    configs = []\n    configs\
      \ = [ \"//third_party/tflite:tflite_shim_config\" ] + _configs\n  }\n  sources = [\n    \"permission_ui_selector.cc\"\
      ,\n    \"permission_ui_selector.h\",\n    \"permissions_ai_encoder_base.cc\",\n    \"permissions_ai_encoder_base.h\"\
      ,\n    \"permissions_aiv4_executor.cc\",\n    \"permissions_aiv4_executor.h\",\n    \"permissions_aiv4_handler.cc\"\
      ,\n    \"permissions_aiv4_handler.h\",\n    \"prediction_common.cc\",\n    \"prediction_common.h\",\n    \"prediction_model_executor.cc\"\
      ,\n    \"prediction_model_executor.h\",\n    \"prediction_model_handler.cc\",\n    \"prediction_model_handler.h\",\n\
      \    \"prediction_request_features.h\",\n    \"prediction_service.cc\",\n    \"prediction_service.h\",\n    \"prediction_service_base.h\"\
      ,\n    \"prediction_signature_model_executor.cc\",\n    \"prediction_signature_model_executor.h\",\n  ]\n  deps = [\n\
      \    \"//components/keyed_service/content\",\n    \"//components/passage_embeddings/core\",\n    \"//components/permissions:permissions_common\"\
      ,\n    \"//components/version_info\",\n    \"//content/public/browser\",\n    \"//services/network/public/cpp\",\n \
      \   \"//skia\",\n    \"//third_party/protobuf:protobuf_lite\",\n    \"//third_party/tflite:tflite_public_headers\",\n\
      \    \"//third_party/tflite_support\",\n    \"//third_party/tflite_support:tflite_support_proto\",\n  ]\n  public_deps\
      \ = [\n    \":prediction_service_messages_proto\",\n    \"//components/optimization_guide/core\",\n    \"//components/optimization_guide/proto:optimization_guide_proto\"\
      ,\n  ]\n}"
    replace: "source_set(\"prediction_service\") {\n  if (!is_android) {\n    _configs = configs\n    configs = []\n    configs\
      \ = [ \"//third_party/tflite:tflite_shim_config\" ] + _configs\n  }\n  sources = [\n    \"permission_ui_selector.cc\"\
      ,\n    \"permission_ui_selector.h\",\n    \"permissions_ai_encoder_base.cc\",\n    \"permissions_ai_encoder_base.h\"\
      ,\n    \"permissions_aiv4_executor.cc\",\n    \"permissions_aiv4_executor.h\",\n    \"permissions_aiv4_handler.cc\"\
      ,\n    \"permissions_aiv4_handler.h\",\n    \"prediction_common.cc\",\n    \"prediction_common.h\",\n    \"prediction_model_executor.cc\"\
      ,\n    \"prediction_model_executor.h\",\n    \"prediction_model_handler.cc\",\n    \"prediction_model_handler.h\",\n\
      \    \"prediction_request_features.h\",\n    \"prediction_service.cc\",\n    \"prediction_service.h\",\n    \"prediction_service_base.h\"\
      ,\n    \"prediction_signature_model_executor.cc\",\n    \"prediction_signature_model_executor.h\",\n  ]\n  deps = [\n\
      \    \"//components/keyed_service/content\",\n    \"//components/passage_embeddings/core\",\n    \"//components/permissions:permissions_common\"\
      ,\n    \"//components/version_info\",\n    \"//content/public/browser\",\n    \"//services/network/public/cpp\",\n \
      \   \"//skia\",\n    \"//third_party/protobuf:protobuf_lite\",\n    \"//third_party/tflite:tflite_public_headers\",\n\
      \    \"//third_party/tflite_support\",\n    \"//third_party/tflite_support:tflite_support_proto\",\n  ]\n  public_deps\
      \ = [\n    \":prediction_service_messages_proto\",\n    \"//components/optimization_guide/core\",\n    \"//components/optimization_guide/proto:optimization_guide_proto\"\
      ,\n  ]\n  if (is_android) {\n    sources -= [\n      \"permissions_ai_encoder_base.cc\",\n      \"permissions_ai_encoder_base.h\"\
      ,\n      \"permissions_aiv4_executor.cc\",\n      \"permissions_aiv4_executor.h\",\n      \"permissions_aiv4_handler.cc\"\
      ,\n      \"permissions_aiv4_handler.h\",\n      \"prediction_model_executor.cc\",\n      \"prediction_model_executor.h\"\
      ,\n      \"prediction_model_handler.cc\",\n      \"prediction_model_handler.h\",\n      \"prediction_service.cc\",\n\
      \      \"prediction_service.h\",\n      \"prediction_signature_model_executor.cc\",\n      \"prediction_signature_model_executor.h\"\
      ,\n      \"prediction_service_base.h\",\n    ]\n    deps -= [\n      \"//components/keyed_service/content\",\n     \
      \ \"//components/passage_embeddings/core\",\n      \"//components/version_info\",\n      \"//services/network/public/cpp\"\
      ,\n      \"//third_party/tflite:tflite_public_headers\",\n      \"//third_party/tflite_support\",\n      \"//third_party/tflite_support:tflite_support_proto\"\
      ,\n    ]\n    deps += [ \"//base\" ]\n  }\n}"
  count: 1
- description: Exclude the two dedicated prediction model/network fixtures on Android.
  regex:
    pattern: "source_set(\"unit_tests\") {\n  testonly = true\n  sources = [\n    \"permissions_aiv4_handler_unittest.cc\"\
      ,\n    \"prediction_service_unittest.cc\",\n  ]\n  deps = [\n    \":prediction_service\",\n    \"//base\",\n    \"//base/test:test_support\"\
      ,\n    \"//components/optimization_guide/core:test_support\",\n    \"//components/permissions:permissions_common\",\n\
      \    \"//components/permissions:test_support\",\n    \"//services/network:test_support\",\n    \"//services/network/public/cpp\"\
      ,\n    \"//testing/gtest\",\n    \"//third_party/protobuf:protobuf_lite\",\n    \"//ui/gfx\",\n  ]\n  data = [ \"//components/test/data/permissions/\"\
      \ ]\n\n  # TODO(crbug.com/40031409): Fix code that adds exit-time destructors and\n  # enable the diagnostic by removing\
      \ this line.\n  configs += [ \"//build/config/compiler:no_exit_time_destructors\" ]\n}\n"
    replace: "if (!is_android) {\n  source_set(\"unit_tests\") {\n    testonly = true\n    sources = [\n      \"permissions_aiv4_handler_unittest.cc\"\
      ,\n      \"prediction_service_unittest.cc\",\n    ]\n    deps = [\n      \":prediction_service\",\n      \"//base\"\
      ,\n      \"//base/test:test_support\",\n      \"//components/optimization_guide/core:test_support\",\n      \"//components/permissions:permissions_common\"\
      ,\n      \"//components/permissions:test_support\",\n      \"//services/network:test_support\",\n      \"//services/network/public/cpp\"\
      ,\n      \"//testing/gtest\",\n      \"//third_party/protobuf:protobuf_lite\",\n      \"//ui/gfx\",\n    ]\n    data\
      \ = [ \"//components/test/data/permissions/\" ]\n\n    # TODO(crbug.com/40031409): Fix code that adds exit-time destructors\
      \ and\n    # enable the diagnostic by removing this line.\n    configs += [ \"//build/config/compiler:no_exit_time_destructors\"\
      \ ]\n  }\n}\n"
  count: 1
- description: Remove producer-only content and bitmap dependencies; retained request header uses only ordinary enums and
    GURL.
  regex:
    pattern: '      "//components/version_info",

      '
    replace: "      \"//components/version_info\",\n      \"//content/public/browser\",\n      \"//skia\",\n"
  count: 1
- description: Export explicit ordinary base and URL dependencies instead of producer-only OptimizationGuide providers.
  regex:
    pattern: '    deps += [ "//base" ]

      '
    replace: "    public_deps -= [\n      \"//components/optimization_guide/core\",\n      \"//components/optimization_guide/proto:optimization_guide_proto\"\
      ,\n    ]\n    public_deps += [\n      \"//base\",\n      \"//url\",\n    ]\n"
  count: 1
- description: Exclude the complete dedicated prediction request/response/model-metadata protobuf target on Android; desktop
    schemas remain exact.
  regex:
    pattern: "proto_library(\"prediction_service_messages_proto\") {\n  sources = [\n    \"permissions_aiv4_model_metadata.proto\"\
      ,\n    \"prediction_model_metadata.proto\",\n    \"prediction_service_messages.proto\",\n  ]\n  if (is_android) {\n\
      \    sources -= [\n      \"permissions_aiv4_model_metadata.proto\",\n      \"prediction_model_metadata.proto\",\n  \
      \  ]\n  }\n}\n"
    replace: "if (!is_android) {\n  proto_library(\"prediction_service_messages_proto\") {\n    sources = [\n      \"permissions_aiv4_model_metadata.proto\"\
      ,\n      \"prediction_model_metadata.proto\",\n      \"prediction_service_messages.proto\",\n    ]\n  }\n}\n"
  count: 1
- description: Remove the now-unused Android protobuf implementation dependency after native generic contracts are retained.
  regex:
    pattern: '      "//skia",

      '
    replace: "      \"//skia\",\n      \"//third_party/protobuf:protobuf_lite\",\n"
  count: 1
- description: Retire Android public generation edge for dedicated prediction service schemas.
  regex:
    pattern: '    public_deps -= [

      '
    replace: "    public_deps -= [\n      \":prediction_service_messages_proto\",\n"
  count: 1
- description: Remove the now-unused Android URL edge after request fields are excluded.
  regex:
    pattern: '      "//url",

      '
    replace: ''
  count: 1
