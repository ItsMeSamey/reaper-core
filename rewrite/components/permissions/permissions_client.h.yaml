# Android split pane request ownership and dialog placement.
substitutions:
- description: expose RAII permission model observer lifetime
  regex:
    re_pattern: \#include\ "base/functional/callback_forward\.h"
    replace: '#include "base/functional/callback_forward.h"

      #include "base/functional/callback_helpers.h"'
- description: forward-declare embedder tab for Android permission model observation
  regex:
    re_pattern: namespace\ permissions\ \{
    replace: 'namespace tabs {

      class TabInterface;

      }


      namespace permissions {'
- description: add Android permission foreground-model query and observation hook
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ //\ Returns\ whether\ the\ given\ origin'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // The owning regular/incognito model can lose foreground selection while\n  // retaining its current tab. Embedders without such models return true and\n  // an empty observation. The observation does not invoke callback on creation;\n  // false is sent before deselection, true only after selection commits.\n  virtual bool IsAndroidTabModelActive(tabs::TabInterface* tab);\n  virtual base::ScopedClosureRunner ObserveAndroidTabModel(\n      tabs::TabInterface* tab,\n      base::RepeatingCallback<void(bool)> callback);\n\n  // Returns whether the given origin"
- description: Exclude survey-only Android declaration virtual void TriggerPromptHatsSurveyIfEnabled(
  regex:
    pattern: "  virtual void TriggerPromptHatsSurveyIfEnabled(\n      content::WebContents* web_contents,\n      permissions::RequestType\
      \ request_type,\n      std::optional<permissions::PermissionAction> action,\n      permissions::PermissionPromptDisposition\
      \ prompt_disposition,\n      permissions::PermissionPromptDispositionReason prompt_disposition_reason,\n      permissions::PermissionRequestGestureType\
      \ gesture_type,\n      std::optional<base::TimeDelta> prompt_display_duration,\n      bool is_post_prompt,\n      const\
      \ GURL& gurl,\n      std::optional<\n          permissions::feature_params::PermissionElementPromptPosition>\n     \
      \     pepc_prompt_position,\n      ContentSetting initial_permission_status,\n      base::OnceCallback<void()> hats_shown_callback_,\n\
      \      PromptOptions prompt_options);"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  virtual void TriggerPromptHatsSurveyIfEnabled(\n      content::WebContents* web_contents,\n\
      \      permissions::RequestType request_type,\n      std::optional<permissions::PermissionAction> action,\n      permissions::PermissionPromptDisposition\
      \ prompt_disposition,\n      permissions::PermissionPromptDispositionReason prompt_disposition_reason,\n      permissions::PermissionRequestGestureType\
      \ gesture_type,\n      std::optional<base::TimeDelta> prompt_display_duration,\n      bool is_post_prompt,\n      const\
      \ GURL& gurl,\n      std::optional<\n          permissions::feature_params::PermissionElementPromptPosition>\n     \
      \     pepc_prompt_position,\n      ContentSetting initial_permission_status,\n      base::OnceCallback<void()> hats_shown_callback_,\n\
      \      PromptOptions prompt_options);\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
