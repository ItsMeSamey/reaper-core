# Android split pane request ownership and dialog placement.
substitutions:
- description: own Android permission model observer teardown
  regex:
    re_pattern: \#include\ "base/check_is_test\.h"
    replace: '#include "base/check_is_test.h"

      #include "base/functional/callback_helpers.h"'
- description: declare embedder-specific Android permission model observation
  regex:
    re_pattern: \ \ void\ OnTabActiveChanged\(\);
    replace: "  void OnTabActiveChanged();\n#if BUILDFLAG(IS_ANDROID)\n  void RefreshAndroidTabModelObserver(tabs::TabInterface* tab_interface);\n  void OnAndroidTabModelActiveChanged(bool active);\n#endif"
- description: retain Android native activation separately from effective visibility
  regex:
    re_pattern: '\ \ bool\ tab_is_active_;\

      '
    replace: "  bool tab_is_active_;\n#if BUILDFLAG(IS_ANDROID)\n  // Without a TabInterface, visibility remains the fallback. Once adopted,\n  // this is latched from native activation notifications, including pre-change\n  // WillDeactivate callbacks.\n  bool android_native_tab_active_ = true;\n  bool android_tab_model_active_ = true;\n  base::ScopedClosureRunner android_tab_model_observation_;\n#endif\n"
- description: allow Android lifecycle fixture to adopt an existing tab
  regex:
    re_pattern: \ \ friend\ class\ test::MockPermissionRequestManager;
    replace: "  friend class test::MockPermissionRequestManager;\n#if BUILDFLAG(IS_ANDROID)\n  friend class PermissionRequestManagerAndroidTabTest;\n#endif"
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "base/callback_list.h"

      #include "base/check_is_test.h"

      '
    replace: '#include "base/callback_list.h"


      #include "build/build_config.h"

      #include "base/check_is_test.h"

      '
  count: 1
- description: Exclude survey-only Android declaration void SetHatsShownCallback(
  regex:
    pattern: '  void SetHatsShownCallback(base::OnceCallback<void()> callback) override;'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void SetHatsShownCallback(base::OnceCallback<void()> callback) override;\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Do not store survey callback state on Android
  regex:
    pattern: '  std::optional<base::OnceCallback<void()>> hats_shown_callback_;'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::optional<base::OnceCallback<void()>> hats_shown_callback_;\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
