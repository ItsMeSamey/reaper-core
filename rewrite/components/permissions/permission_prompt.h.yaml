substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "base/functional/callback.h"

      #include "base/memory/raw_ptr.h"

      '
    replace: '#include "base/functional/callback.h"


      #include "build/build_config.h"

      #include "base/memory/raw_ptr.h"

      '
  count: 1
- description: Exclude survey-only Android declaration virtual void SetHatsShownCallback(
  regex:
    pattern: '    virtual void SetHatsShownCallback(base::OnceCallback<void()> callback) = 0;'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    virtual void SetHatsShownCallback(base::OnceCallback<void()> callback) = 0;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
