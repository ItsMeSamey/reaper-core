# Android split pane request ownership and dialog placement.
substitutions:
- description: retain permission modal model for exact owner attribution
  regex:
    re_pattern: '\ \ \ \ protected\ PropertyModel\ createModalDialogModel\(View\ view\)\ \{\

      \ \ \ \ \ \ \ \ return\ PermissionDialogModelFactory\.getModel\(\

      '
    replace: "    protected PropertyModel createModalDialogModel(View view) {\n        PropertyModel model = PermissionDialogModelFactory.getModel(\n"
- description: propagate original requester through ordinary and embedded permission models
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ showFilteredTouchEventDialogIfPossible\(\)\);\

      \ \ \ \ \}\

      '
    replace: "                () -> showFilteredTouchEventDialogIfPossible());\n        model.set(\n                ModalDialogProperties.TAB_MODAL_OWNER,\n                assumeNonNull(mDialogDelegate).getDialogOwner());\n        return model;\n    }\n"
- description: Format changed Java with the pinned Chromium formatter
  regex:
    re_pattern: '\ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ view\ The\ \{@link\ View\}\ custom\ view\ going\ to\ be\ shown\ on\ permission\ dialog\.\

      \ \ \ \ \ \*/\

      \ \ \ \ protected\ PropertyModel\ createModalDialogModel\(View\ view\)\ \{\

      \ \ \ \ \ \ \ \ PropertyModel\ model\ =\ PermissionDialogModelFactory\.getModel\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ this,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assumeNonNull\(mDialogDelegate\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ view,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(\)\ \->\ showFilteredTouchEventDialogIfPossible\(\)\);\

      \ \ \ \ \ \ \ \ model\.set\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ModalDialogProperties\.TAB_MODAL_OWNER,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assumeNonNull\(mDialogDelegate\)\.getDialogOwner\(\)\);\

      \ \ \ \ \ \ \ \ return\ model;\

      '
    replace: "     *\n     * @param view The {@link View} custom view going to be shown on permission dialog.\n     */\n    protected PropertyModel createModalDialogModel(View view) {\n        PropertyModel model =\n                PermissionDialogModelFactory.getModel(\n                        this,\n                        assumeNonNull(mDialogDelegate),\n                        view,\n                        () -> showFilteredTouchEventDialogIfPossible());\n        model.set(\n                ModalDialogProperties.TAB_MODAL_OWNER,\n                assumeNonNull(mDialogDelegate).getDialogOwner());\n        return model;\n"
