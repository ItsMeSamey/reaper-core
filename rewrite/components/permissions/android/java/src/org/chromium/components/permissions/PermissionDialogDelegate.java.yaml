# Android split pane request ownership and dialog placement.
substitutions:
- description: retain exact permission requester before controller queueing
  regex:
    re_pattern: '\ \ \ \ private\ final\ WindowAndroid\ mWindow;\

      '
    replace: "    private final WindowAndroid mWindow;\n\n    // Captured before PermissionDialogController queues this delegate. The UI\n    // layer treats the WebContents identity as opaque owner metadata.\n    private @Nullable Object mDialogOwner;\n\n    @CalledByNative\n    void setDialogOwner(Object owner) {\n        mDialogOwner = owner;\n    }\n\n    public @Nullable Object getDialogOwner() {\n        return mDialogOwner;\n    }\n"
