# Android split pane request ownership and dialog placement.
substitutions:
- description: Add the Brave permissions java sources.
  add_literal_to_list:
    target: java
    list_name: sources
    literal: brave_components_permissions_java_sources
- description: Add the Brave permissions java deps.
  add_literal_to_list:
    target: java
    list_name: deps
    literal: brave_components_permissions_java_deps
- description: Compile actual queued permission ownership regressions with their direct dependencies
  regex:
    re_pattern: 'robolectric_library\("components_permissions_junit_tests"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "junit/src/org/chromium/components/permissions/PermissionDialogCustomViewBinderTest\.java",\

      \ \ \ \ "junit/src/org/chromium/components/permissions/PermissionVerticalButtonsDialogCustomViewBinderTest\.java",\

      \ \ \ \ "junit/src/org/chromium/components/permissions/nfc/NfcSystemLevelPromptTest\.java",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":java",\

      \ \ \ \ ":java_resources",\

      \ \ \ \ "//base:base_java_test_support",\

      \ \ \ \ "//base:base_junit_test_support",\

      \ \ \ \ "//components/browser_ui/theme/android:java_resources",\

      \ \ \ \ "//components/browser_ui/widget/android:java",\

      \ \ \ \ "//third_party/androidx:androidx_appcompat_appcompat_resources_java",\

      \ \ \ \ "//third_party/androidx:androidx_core_core_java",\

      \ \ \ \ "//third_party/androidx:androidx_test_runner_java",\

      \ \ \ \ "//third_party/junit",\

      \ \ \ \ "//third_party/mockito:mockito_java",\

      \ \ \ \ "//ui/android:ui_java",\

      \ \ \ \ "//ui/android:ui_java_test_support",\

      \ \ \]\

      \ \ resources_package\ =\ "org\.chromium\.components\.permissions"\

      \}\

      '
    replace: "robolectric_library(\"components_permissions_junit_tests\") {\n  sources = [\n    \"//brave/android/junit/src/org/chromium/components/permissions/PermissionDialogOwnerTest.java\",\n    \"junit/src/org/chromium/components/permissions/PermissionDialogCustomViewBinderTest.java\",\n    \"junit/src/org/chromium/components/permissions/PermissionVerticalButtonsDialogCustomViewBinderTest.java\",\n    \"junit/src/org/chromium/components/permissions/nfc/NfcSystemLevelPromptTest.java\",\n  ]\n  deps = [\n    \"//third_party/androidx:androidx_activity_activity_java\",\n    \"//components/content_settings/android:content_settings_enums_java\",\n    \"//build/android:build_java\",\n    \"//base:base_java\",\n    \":java\",\n    \":java_resources\",\n    \"//base:base_java_test_support\",\n    \"//base:base_junit_test_support\",\n    \"//components/browser_ui/theme/android:java_resources\",\n    \"//components/browser_ui/widget/android:java\",\n    \"//third_party/androidx:androidx_appcompat_appcompat_resources_java\",\n    \"//third_party/androidx:androidx_core_core_java\",\n    \"//third_party/androidx:androidx_test_runner_java\",\n    \"//third_party/junit\",\n    \"//third_party/mockito:mockito_java\",\n    \"//ui/android:ui_java\",\n    \"//ui/android:ui_java_test_support\",\n  ]\n  resources_package = \"org.chromium.components.permissions\"\n}\n"
- description: "Declare the permission owner fixture core delegate and embedded prompt enum dependencies."
  regex:
    re_pattern: "(robolectric_library\\(\"components_permissions_junit_tests\"\\) \\{[\\s\\S]*?\\n  deps = \\[\\n)"
    replace: "\\1    \":core_java\",\n    \":embedded_permission_prompt_enums_java\",\n"
