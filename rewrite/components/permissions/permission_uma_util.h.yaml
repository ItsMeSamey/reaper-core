substitutions:
- description: Keep build flags directly visible for Android-specific producer API exclusion.
  regex:
    pattern: '#include "base/version.h"

      '
    replace: '#include "base/version.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Keep passage implementation types outside the retained Android permission metrics interface.
  regex:
    pattern: '#include "components/passage_embeddings/core/passage_embeddings_types.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/passage_embeddings/core/passage_embeddings_types.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordPermissionPredictionConcurrentRequests.
  regex:
    pattern: "  static void RecordPermissionPredictionConcurrentRequests(\n      RequestType request_type);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordPermissionPredictionConcurrentRequests(\n      RequestType request_type);\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordPermissionPredictionSource.
  regex:
    pattern: "  static void RecordPermissionPredictionSource(\n      PermissionPredictionSource prediction_source,\n     \
      \ const PermissionRequest& request);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordPermissionPredictionSource(\n      PermissionPredictionSource\
      \ prediction_source,\n      const PermissionRequest& request);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordPermissionPredictionServiceHoldback.
  regex:
    pattern: "  static void RecordPermissionPredictionServiceHoldback(\n      RequestType request_type,\n      PredictionModelType\
      \ model_type,\n      bool is_heldback);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordPermissionPredictionServiceHoldback(\n      RequestType request_type,\n\
      \      PredictionModelType model_type,\n      bool is_heldback);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration GetPredictionModelString.
  regex:
    pattern: '  static std::string GetPredictionModelString(PredictionModelType model_type);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static std::string GetPredictionModelString(PredictionModelType model_type);\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordPermissionRequestRelevance.
  regex:
    pattern: "  static void RecordPermissionRequestRelevance(\n      permissions::RequestType permission_request_type,\n \
      \     PermissionRequestRelevance permission_request_relevance,\n      PredictionModelType model_type);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordPermissionRequestRelevance(\n      permissions::RequestType\
      \ permission_request_type,\n      PermissionRequestRelevance permission_request_relevance,\n      PredictionModelType\
      \ model_type);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordRenderedTextSize.
  regex:
    pattern: "  static void RecordRenderedTextSize(PredictionModelType model_type,\n                                     RequestType\
      \ request_type,\n                                     size_t text_size);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordRenderedTextSize(PredictionModelType model_type,\n         \
      \                            RequestType request_type,\n                                     size_t text_size);\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordPredictionModelInquireTime.
  regex:
    pattern: "  static void RecordPredictionModelInquireTime(\n      PredictionModelType model_type,\n      base::TimeTicks\
      \ model_inquire_start_time);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordPredictionModelInquireTime(\n      PredictionModelType model_type,\n\
      \      base::TimeTicks model_inquire_start_time);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordRenderedTextAcquireSuccessForAivX.
  regex:
    pattern: "  static void RecordRenderedTextAcquireSuccessForAivX(\n      PredictionModelType model_type,\n      bool success);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordRenderedTextAcquireSuccessForAivX(\n      PredictionModelType\
      \ model_type,\n      bool success);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordTryCancelPreviousEmbeddingsModelExecution.
  regex:
    pattern: "  static void RecordTryCancelPreviousEmbeddingsModelExecution(\n      PredictionModelType model_type,\n    \
      \  bool cancel_previous_job);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordTryCancelPreviousEmbeddingsModelExecution(\n      PredictionModelType\
      \ model_type,\n      bool cancel_previous_job);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordFinishedPassageEmbeddingsJobOutdated.
  regex:
    pattern: "  static void RecordFinishedPassageEmbeddingsJobOutdated(\n      PredictionModelType model_type,\n      bool\
      \ outdated);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordFinishedPassageEmbeddingsJobOutdated(\n      PredictionModelType\
