    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordPassageEmbedderMetadataValid(bool valid);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordPredictionServiceTimeout.
  regex:
    pattern: '  static void RecordPredictionServiceTimeout(bool timeout);

