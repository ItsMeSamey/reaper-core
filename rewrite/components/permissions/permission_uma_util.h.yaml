    replace: "#if !BUILDFLAG(IS_ANDROID)\n  static void RecordPassageEmbeddingsCalculationTimeout(bool timeout);\n#endif \
      \ // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android-only producer instrumentation declaration RecordPassageEmbedderMetadataValid.
  regex:
    pattern: '  static void RecordPassageEmbedderMetadataValid(bool valid);

