substitutions:
- description: "Preserve reviewed Android source projection for components/metrics/structured/BUILD.gn (operation 1)."
  regex:
    re_pattern: '\ \ \ \ "structured_metrics_service\.h",\

      \ \ \]\

      \

      \ \ if\ \(is_chromeos\)\ \{\

      \ \ \ \ sources\ \+=\ \[\

      \ \ \ \ \ \ "flushed_map\.cc",\

      '
    replace: "    \"structured_metrics_service.h\",\n  ]\n\n  if (is_android) {\n    # Keep local histograms and field trials; omit remote reporter sources.\n    sources -= [\n      \"key_data_prefs_delegate.cc\",\n      \"key_data_provider_file.cc\",\n      \"key_data_provider_prefs.cc\",\n      \"reporting/structured_metrics_log_metrics.cc\",\n      \"structured_metrics_recorder.cc\",\n    ]\n  }\n\n  if (is_android) {\n    # Keep local histograms and field trials; omit remote reporter sources.\n    sources -= [\n      \"reporting/structured_metrics_reporting_service.cc\",\n      \"structured_metrics_scheduler.cc\",\n      \"structured_metrics_service.cc\",\n    ]\n  }\n\n  if (is_chromeos) {\n    sources += [\n      \"flushed_map.cc\",\n"
- description: "Preserve reviewed Android source projection for components/metrics/structured/BUILD.gn (operation 2)."
  regex:
    re_pattern: '\ \ \ \ "//third_party/metrics_proto",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":structured_events",\

      \ \ \ \ ":structured_metrics_validator",\

      '
    replace: "    \"//third_party/metrics_proto\",\n  ]\n\n  if (is_android) {\n    public_deps -= [\n      \":proto\",\n      \"//components/metrics/structured/lib:proto\",\n    ]\n  }\n\n  deps = [\n    \":structured_events\",\n    \":structured_metrics_validator\",\n"
- description: "Preserve reviewed Android source projection for components/metrics/structured/BUILD.gn (operation 3)."
  regex:
    re_pattern: '\ \ \ \ "//crypto",\

      \ \ \ \ "//third_party/protobuf:protobuf_lite",\

      \ \ \]\

      \}\

      \

      if\ \(is_chromeos\)\ \{\

      '
    replace: "    \"//crypto\",\n    \"//third_party/protobuf:protobuf_lite\",\n  ]\n\n  if (is_android) {\n    deps -= [\n      \":structured_events\",\n      \":structured_metrics_validator\",\n      \"//components/background_task_scheduler\",\n      \"//components/metrics/structured/lib\",\n      \"//components/metrics/structured/lib:proto\",\n      \"//components/metrics/structured/mojom\",\n      \"//crypto\",\n    ]\n  }\n}\n\nif (is_chromeos) {\n"
- description: "Preserve reviewed Android source projection for components/metrics/structured/BUILD.gn (operation 4)."
  regex:
    re_pattern: '\ \ \ \ "recorder\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ ":events",\

      \ \ \ \ ":structured_metrics_features",\

      '
    replace: "    \"recorder.h\",\n  ]\n\n  if (is_android) {\n    # Keep local histograms and field trials; omit remote reporter sources.\n    sources -= [\n      \"delegating_events_processor.cc\",\n      \"histogram_util.cc\",\n    ]\n  }\n\n  public_deps = [\n    \":events\",\n    \":structured_metrics_features\",\n"
- description: "Preserve reviewed Android source projection for components/metrics/structured/BUILD.gn (operation 5)."
  regex:
    re_pattern: '\ \ \ \ "//components/prefs",\

      \ \ \ \ "//third_party/metrics_proto",\

      \ \ \]\

      \}\

      \

      source_set\("structured_metrics_features"\)\ \{\

      '
    replace: "    \"//components/prefs\",\n    \"//third_party/metrics_proto\",\n  ]\n\n  if (is_android) {\n    deps -= [\n      \":proto\",\n      \":structured_metrics_validator\",\n      \"//components/metrics/structured/lib\",\n      \"//components/prefs\",\n    ]\n  }\n}\n\nsource_set(\"structured_metrics_features\") {\n"
