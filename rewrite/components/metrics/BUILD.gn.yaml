substitutions:
  - description: Add the Brave metrics deps.
    add_literal_to_list:
      target: metrics
      list_name: deps
      literal: brave_components_metrics_deps
      import: //brave/components/metrics/sources.gni
  - description: "Preserve reviewed Android source projection for components/metrics/BUILD.gn (operation 2)."
    regex:
      re_pattern: '\ \ \ \ \ \ "unsent_log_store_metrics_impl\.cc",\

        \ \ \ \ \ \ "version_utils\.cc",\

        \ \ \ \ \]\

        \

        \ \ \ \ \#\ TODO\(crbug\.com/438235148\):\ Refactor\ this\ component\ to\ have\ a\ smaller,\ more\

        \ \ \ \ \#\ granular\ public\ API\.\

        '
      replace: "      \"unsent_log_store_metrics_impl.cc\",\n      \"version_utils.cc\",\n    ]\n\n    if (is_android) {\n      # Keep local histograms and field trials; omit remote reporter sources.\n      sources -= [\n        \"metrics_reporting_service.cc\",\n        \"metrics_rotation_scheduler.cc\",\n        \"metrics_service.cc\",\n        \"metrics_upload_scheduler.cc\",\n        \"reporting_service.cc\",\n      ]\n    }\n\n    # TODO(crbug.com/438235148): Refactor this component to have a smaller, more\n    # granular public API.\n"
  - description: "Preserve reviewed Android source projection for components/metrics/BUILD.gn (operation 3)."
    regex:
      re_pattern: '\ \ \ \ \ \ "net/network_metrics_provider\.h",\

        \ \ \ \ \]\

        \

        \ \ \ \ configs\ \+=\ \[\

        \ \ \ \ \ \ "//build/config/compiler:wexit_time_destructors",\

        \ \ \ \ \ \ "//build/config/compiler:wglobal_constructors",\

        '
      replace: "      \"net/network_metrics_provider.h\",\n    ]\n\n    if (is_android) {\n      # Keep local histograms and field trials; omit remote reporter sources.\n      sources -= [ \"net/net_metrics_log_uploader.cc\" ]\n    }\n\n    configs += [\n      \"//build/config/compiler:wexit_time_destructors\",\n      \"//build/config/compiler:wglobal_constructors\",\n"
  - description: "Preserve reviewed Android source projection for components/metrics/BUILD.gn (operation 4)."
    regex:
      re_pattern: '\ \ \ \ \ \ "//third_party/zlib/google:compression_utils",\

        \ \ \ \ \ \ "//url",\

        \ \ \ \ \]\

        \ \ \}\

        \

        \ \ static_library\("ui"\)\ \{\

        '
      replace: "      \"//third_party/zlib/google:compression_utils\",\n      \"//url\",\n    ]\n\n    if (is_android) {\n      deps -= [\n        \"//components/encrypted_messages\",\n        \"//components/encrypted_messages:encrypted_message_proto\",\n      ]\n    }\n  }\n\n  static_library(\"ui\") {\n"
  - description: "Preserve reviewed Android source projection for components/metrics/BUILD.gn (operation 5)."
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \"unsent_log_store_unittest\\.cc\",\\\n\\ \\ \\ \\ \\]\\\n\\\n\\ \\ \\ \\ deps\\ =\\ \\[\\\n\\ \\ \\ \\ \\ \\ \":call_stack_profile_builder\","
      replace: "      \"unsent_log_store_unittest.cc\",\n    ]\n\n    if (is_android) {\n      # Upload/service implementations are absent from Reaper Android.\n      sources -= [\n        \"metrics_service_unittest.cc\",\n        \"net/net_metrics_log_uploader_unittest.cc\",\n        \"reporting_service_unittest.cc\",\n      ]\n    }\n\n    deps = [\n      \":call_stack_profile_builder\","
