      #include "base/component_export.h"

      #include "base/sequence_checker.h"

      #include "build/build_config.h"

      #include "components/metrics/private_metrics/puma_histogram_functions.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "third_party/abseil-cpp/absl/container/flat_hash_map.h"

      #endif

      #include "third_party/metrics_proto/histogram_event.pb.h"

      #include "third_party/metrics_proto/private_metrics/private_user_metrics.pb.h"


      '
- description: "Preserve reviewed Android source projection for components/metrics/private_metrics/lom_recorder.h (operation 2)."
  regex:
    re_pattern: '\ \ TakeHistogramEvents\(\);\

      \

      \ private:\

      \ \ void\ RecordSample\(std::string_view\ name,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int64_t\ sample,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ int64_t\ min,\

      '
    replace: "  TakeHistogramEvents();\n\n private:\n#if !BUILDFLAG(IS_ANDROID)\n  void RecordSample(std::string_view name,\n                    int64_t sample,\n                    int64_t min,\n"
- description: "Preserve reviewed Android source projection for components/metrics/private_metrics/lom_recorder.h (operation 3)."
  regex:
    re_pattern: '\ \ //\ Maps\ a\ histogram\ name\ hash\ to\ its\ profile\-keyed\ histogram\ events\.\

      \ \ //\ The\ key\ is\ the\ hash\ of\ the\ histogram\ name\.\

      \ \ absl::flat_hash_map<uint64_t,\ ProfileKeyedHistogramMap>\ histograms_;\

      \};\

      \

      \}\ \ //\ namespace\ metrics::private_metrics\

      '
    replace: "  // Maps a histogram name hash to its profile-keyed histogram events.\n  // The key is the hash of the histogram name.\n  absl::flat_hash_map<uint64_t, ProfileKeyedHistogramMap> histograms_;\n#endif\n};\n\n}  // namespace metrics::private_metrics\n"
