substitutions:
- description: "Preserve reviewed Android source projection for components/metrics/private_metrics/BUILD.gn (operation 1)."
  regex:
    re_pattern: '\ \ \ \ "puma_service\.cc",\

      \ \ \ \ "puma_service\.h",\

      \ \ \]\

      \ \ public_deps\ =\ \[\

      \ \ \ \ ":dwa_recorder",\

      \ \ \ \ ":private_metrics_recorders",\

      '
    replace: "    \"puma_service.cc\",\n    \"puma_service.h\",\n  ]\n\n  if (is_android) {\n    # Keep local histograms and field trials; omit remote reporter sources.\n    sources -= [\n      \"//components/metrics/dwa/dwa_rotation_scheduler.cc\",\n      \"//components/metrics/dwa/dwa_service.cc\",\n      \"data_upload_config_downloader.cc\",\n      \"private_metrics_reporting_service.cc\",\n      \"private_metrics_unsent_log_store_metrics.cc\",\n      \"puma_histogram_encoder.cc\",\n      \"puma_service.cc\",\n    ]\n  }\n  public_deps = [\n    \":dwa_recorder\",\n    \":private_metrics_recorders\",\n"
- description: "Preserve reviewed Android source projection for components/metrics/private_metrics/BUILD.gn (operation 2)."
  regex:
    re_pattern: '\ \ \ \ "//third_party/federated_compute:confidential_compute_proto",\

      \ \ \ \ "//third_party/metrics_proto",\

      \ \ \]\

      \ \ defines\ =\ \[\ "IS_DWA_IMPL"\ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":private_metrics_features",\

      '
    replace: "    \"//third_party/federated_compute:confidential_compute_proto\",\n    \"//third_party/metrics_proto\",\n  ]\n\n  if (is_android) {\n    public_deps -=\n        [ \"//third_party/federated_compute:confidential_compute_proto\" ]\n  }\n  defines = [ \"IS_DWA_IMPL\" ]\n  deps = [\n    \":private_metrics_features\",\n"
- description: "Preserve reviewed Android source projection for components/metrics/private_metrics/BUILD.gn (operation 3)."
  regex:
    re_pattern: '\ \ \ \ "//third_party/federated_compute:confidential_compute",\

      \ \ \ \ "//third_party/oak:oak_proto",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      '
    replace: "    \"//third_party/federated_compute:confidential_compute\",\n    \"//third_party/oak:oak_proto\",\n  ]\n\n  if (is_android) {\n    deps -= [\n      \"//components/background_task_scheduler\",\n      \"//components/metrics:library_support\",\n      \"//net\",\n      \"//services/network/public/cpp\",\n      \"//third_party/federated_compute:confidential_compute\",\n      \"//third_party/oak:oak_proto\",\n    ]\n  }\n}\n\nsource_set(\"unit_tests\") {\n"
