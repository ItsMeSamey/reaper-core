substitutions:
- description: "Preserve reviewed Android source projection for components/metrics/metrics_service_accessor.cc (operation 1)."
  regex:
    re_pattern: '\#include\ "base/base_switches\.h"\

      \#include\ "base/feature_list\.h"\

      \#include\ "build/branding_buildflags\.h"\

      \#include\ "components/metrics/metrics_features\.h"\

      \#include\ "components/metrics/metrics_pref_names\.h"\

      \#include\ "components/metrics/metrics_reporting_choice_service\.h"\

      '
    replace: '#include "base/base_switches.h"

      #include "base/feature_list.h"

      #include "build/branding_buildflags.h"

      #include "build/build_config.h"

      #include "components/metrics/metrics_features.h"

      #include "components/metrics/metrics_pref_names.h"

      #include "components/metrics/metrics_reporting_choice_service.h"

      '
- description: "Preserve reviewed Android source projection for components/metrics/metrics_service_accessor.cc (operation 2)."
  regex:
    re_pattern: '\

      bool\ g_force_official_enabled_test\ =\ false;\

      \

      bool\ IsMetricsReportingEnabledForOfficialBuild\(PrefService\*\ local_state\)\ \{\

      \ \ return\ MetricsReportingChoiceService::IsBasicMetricsReportingEnabled\(\

      \ \ \ \ \ \ local_state\);\

      \}\

      \

      \}\ \ //\ namespace\

      \

      //\ static\

      bool\ MetricsServiceAccessor::IsMetricsReportingEnabled\(\

      \ \ \ \ PrefService\*\ local_state\)\ \{\

      \ \ if\ \(IsMetricsReportingForceEnabled\(\)\)\ \{\

      \ \ \ \ LOG\(WARNING\)\ <<\ "Metrics\ Reporting\ is\ force\ enabled,\ data\ will\ be\ sent\ to\ "\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "servers\.\ Should\ not\ be\ used\ for\ tests\.";\

      '
    replace: "\nbool g_force_official_enabled_test = false;\n\n#if !BUILDFLAG(IS_ANDROID)\nbool IsMetricsReportingEnabledForOfficialBuild(PrefService* local_state) {\n  return MetricsReportingChoiceService::IsBasicMetricsReportingEnabled(\n      local_state);\n}\n\n#endif\n\n}  // namespace\n\n// static\nbool MetricsServiceAccessor::IsMetricsReportingEnabled(\n    PrefService* local_state) {\n#if BUILDFLAG(IS_ANDROID)\n  return false;\n#else\n  if (IsMetricsReportingForceEnabled()) {\n    LOG(WARNING) << \"Metrics Reporting is force enabled, data will be sent to \"\n                    \"servers. Should not be used for tests.\";\n"
- description: "Preserve reviewed Android source projection for components/metrics/metrics_service_accessor.cc (operation 3)."
  regex:
    re_pattern: '\ \ return\ g_force_official_enabled_test\ \&\&\

      \ \ \ \ \ \ \ \ \ IsMetricsReportingEnabledForOfficialBuild\(local_state\);\

      \#endif\ \ //\ BUILDFLAG\(GOOGLE_CHROME_BRANDING\)\

      \}\

      \

      //\ static\

      '
    replace: "  return g_force_official_enabled_test &&\n         IsMetricsReportingEnabledForOfficialBuild(local_state);\n#endif  // BUILDFLAG(GOOGLE_CHROME_BRANDING)\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n\n// static\n"
- description: "Preserve reviewed Android source projection for components/metrics/metrics_service_accessor.cc (operation 4)."
  regex:
    re_pattern: '\ \ \ \ std::string_view\ trial_name,\

      \ \ \ \ std::string_view\ group_name,\

      \ \ \ \ variations::SyntheticTrialAnnotationMode\ annotation_mode\)\ \{\

      \ \ if\ \(!metrics_service\)\ \{\

      \ \ \ \ return\ false;\

      \ \ \}\

      '
    replace: "    std::string_view trial_name,\n    std::string_view group_name,\n    variations::SyntheticTrialAnnotationMode annotation_mode) {\n#if BUILDFLAG(IS_ANDROID)\n  return false;\n#else\n  if (!metrics_service) {\n    return false;\n  }\n"
- description: "Preserve reviewed Android source projection for components/metrics/metrics_service_accessor.cc (operation 5)."
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ annotation_mode\);\

      \ \ metrics_service\->GetSyntheticTrialRegistry\(\)\->RegisterSyntheticFieldTrial\(\

      \ \ \ \ \ \ trial_group\);\

      \ \ return\ true;\

      \}\

      \

      '
    replace: "                                              annotation_mode);\n  metrics_service->GetSyntheticTrialRegistry()->RegisterSyntheticFieldTrial(\n      trial_group);\n  return true;\n#endif  // BUILDFLAG(IS_ANDROID)\n}\n\n// static\nbool MetricsServiceAccessor::RegisterSyntheticFieldTrialForRegistry(\n    variations::SyntheticTrialRegistry* registry,\n    std::string_view trial_name,\n    std::string_view group_name,\n    variations::SyntheticTrialAnnotationMode annotation_mode) {\n  if (!registry) {\n    return false;\n  }\n  registry->RegisterSyntheticFieldTrial(\n      variations::SyntheticTrialGroup(trial_name, group_name, annotation_mode));\n  return true;\n}\n\n"
