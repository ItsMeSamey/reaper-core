substitutions:
- description: "Preserve reviewed Android source projection for components/metrics/metrics_service_accessor.h (operation 1)."
  regex:
    re_pattern: '\#include\ "components/variations/synthetic_trials\.h"\

      \

      class\ PrefService;\

      \

      namespace\ metrics\ \{\

      \

      '
    replace: '#include "components/variations/synthetic_trials.h"


      class PrefService;


      namespace variations {

      class SyntheticTrialRegistry;

      }


      namespace metrics {


      '
- description: "Preserve reviewed Android source projection for components/metrics/metrics_service_accessor.h (operation 2)."
  regex:
    re_pattern: '\ \ \ \ \ \ std::string_view\ group_name,\

      \ \ \ \ \ \ variations::SyntheticTrialAnnotationMode\ annotation_mode\);\

      \

      \ \ //\ IsMetricsReportingEnabled\(\)\ in\ non\-official\ builds\ unconditionally\ returns\

      \ \ //\ false\.\ This\ results\ in\ different\ behavior\ for\ tests\ running\ in\ official\ vs\

      \ \ //\ non\-official\ builds\.\ To\ get\ consistent\ behavior\ call\ this\ with\ true,\ which\

      '
    replace: "      std::string_view group_name,\n      variations::SyntheticTrialAnnotationMode annotation_mode);\n\n  // Registers a local synthetic trial without requiring a reporting service.\n  static bool RegisterSyntheticFieldTrialForRegistry(\n      variations::SyntheticTrialRegistry* registry,\n      std::string_view trial_name,\n      std::string_view group_name,\n      variations::SyntheticTrialAnnotationMode annotation_mode);\n\n  // IsMetricsReportingEnabled() in non-official builds unconditionally returns\n  // false. This results in different behavior for tests running in official vs\n  // non-official builds. To get consistent behavior call this with true, which\n"
