substitutions:
- description: Remove survey model sources from the common model list
  regex:
    pattern: "    \"metrics_clustering.cc\",\n    \"metrics_clustering.h\",\n"
    replace: ''
  count: 1
- description: Admit the real survey model only outside Android, preserving the shared archive
  regex:
    pattern: "    \"url_visit_resumption_ranker.h\",\n  ]\n"
    replace: "    \"url_visit_resumption_ranker.h\",\n  ]\n  if (!is_android) {\n    sources += [\n      \"metrics_clustering.cc\"\
      ,\n      \"metrics_clustering.h\",\n    ]\n  }\n"
  count: 1
- description: Remove dedicated survey fixture from the common tests
  regex:
    pattern: '    "metrics_clustering_unittest.cc",

      '
    replace: ''
  count: 1
- description: Preserve the survey fixture on its supported non-Android model build
  regex:
    pattern: "    \"url_visit_resumption_ranker_unittest.cc\",\n  ]\n"
    replace: "    \"url_visit_resumption_ranker_unittest.cc\",\n  ]\n  if (!is_android) {\n    sources += [ \"metrics_clustering_unittest.cc\"\
      \ ]\n  }\n"
  count: 1
- description: Exclude four classifier implementations and headers only on Android
  regex:
    pattern: "  if (is_android) {\n    sources += [\n      \"device_tier_segment.cc\",\n"
    replace: "  if (is_android) {\n    sources -= [\n      \"chrome_user_engagement.cc\",\n      \"chrome_user_engagement.h\",\n      \"feed_user_segment.cc\",\n      \"feed_user_segment.h\",\n      \"low_user_engagement_model.cc\",\n      \"low_user_engagement_model.h\",\n      \"shopping_user_model.cc\",\n      \"shopping_user_model.h\",\n    ]\n    sources += [\n      \"device_tier_segment.cc\",\n"
  count: 1
- description: Exclude four classifier dedicated tests only on Android
  regex:
    pattern: "  if (is_android) {\n    sources += [\n      \"device_tier_segment_unittest.cc\",\n"
    replace: "  if (is_android) {\n    sources -= [\n      \"chrome_user_engagement_unittest.cc\",\n      \"feed_user_segment_unittest.cc\",\n      \"low_user_engagement_model_unittest.cc\",\n      \"shopping_user_model_unittest.cc\",\n    ]\n    sources += [\n      \"device_tier_segment_unittest.cc\",\n"
  count: 1
- description: Exclude Android promotional Tips implementation while retaining core notifications
  regex:
    pattern: "      \"low_user_engagement_model.h\",\n      \"shopping_user_model.cc\",\n      \"shopping_user_model.h\",\n    ]\n    sources += [\n      \"device_tier_segment.cc\",\n"
    replace: "      \"low_user_engagement_model.h\",\n      \"shopping_user_model.cc\",\n      \"shopping_user_model.h\",\n      \"tips_notifications_ranker.cc\",\n      \"tips_notifications_ranker.h\",\n    ]\n    sources += [\n      \"device_tier_segment.cc\",\n"
  count: 1
- description: Exclude Android promotional Tips implementation while retaining core notifications
  regex:
    pattern: "      \"feed_user_segment_unittest.cc\",\n      \"low_user_engagement_model_unittest.cc\",\n      \"shopping_user_model_unittest.cc\",\n    ]\n    sources += [\n      \"device_tier_segment_unittest.cc\",\n"
    replace: "      \"feed_user_segment_unittest.cc\",\n      \"low_user_engagement_model_unittest.cc\",\n      \"shopping_user_model_unittest.cc\",\n      \"tips_notifications_ranker_unittest.cc\",\n    ]\n    sources += [\n      \"device_tier_segment_unittest.cc\",\n"
  count: 1
