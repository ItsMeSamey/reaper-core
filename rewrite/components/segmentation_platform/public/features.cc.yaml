substitutions:
  - description: 'Ship kSegmentationPlatformDeviceTier disabled.'
    set_feature_flag_default_state:
      feature_name: kSegmentationPlatformDeviceTier
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kSegmentationPlatformFeature disabled.'
    set_feature_flag_default_state:
      feature_name: kSegmentationPlatformFeature
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kSegmentationPlatformTimeDelaySampling disabled.'
    set_feature_flag_default_state:
      feature_name: kSegmentationPlatformTimeDelaySampling
      value: base::FEATURE_DISABLED_BY_DEFAULT
  - description: Exclude the dedicated survey feature and parameter definitions from Android
    regex:
      pattern: "BASE_FEATURE(kSegmentationSurveyPage,\n#if BUILDFLAG(IS_ANDROID)\n             base::FEATURE_ENABLED_BY_DEFAULT);\n\
        #else\n             base::FEATURE_DISABLED_BY_DEFAULT);\n#endif\n\nconstexpr base::FeatureParam<bool> kSegmentationSurveyInternalsPage{\n\
        \    &kSegmentationSurveyPage, \"survey_internals_page\", /*default_value=*/true};\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nBASE_FEATURE(kSegmentationSurveyPage, base::FEATURE_DISABLED_BY_DEFAULT);\n\nconstexpr\
        \ base::FeatureParam<bool> kSegmentationSurveyInternalsPage{\n    &kSegmentationSurveyPage, \"survey_internals_page\"\
        , /*default_value=*/true};\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
