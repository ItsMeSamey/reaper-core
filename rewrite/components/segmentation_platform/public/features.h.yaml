substitutions:
- description: Include the platform predicate used by the survey declarations
  regex:
    pattern: '#include "base/metrics/field_trial_params.h"

      '
    replace: '#include "base/metrics/field_trial_params.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude matching survey-only declarations from Android
  regex:
    pattern: 'BASE_DECLARE_FEATURE(kSegmentationSurveyPage);

      extern const base::FeatureParam<bool> kSegmentationSurveyInternalsPage;

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      BASE_DECLARE_FEATURE(kSegmentationSurveyPage);

      extern const base::FeatureParam<bool> kSegmentationSurveyInternalsPage;

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
