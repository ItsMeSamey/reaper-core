substitutions:
- description: Include the platform predicate for the survey-only option
  regex:
    pattern: '#include "base/time/time.h"

      '
    replace: '#include "base/time/time.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Remove the survey parameter query on Android without bypassing signal requirements or replacing the shared
    provider
  regex:
    pattern: "  // Survey page needs to check the signal requirements. Surveys would be\n  // disabled when not running, so\
      \ local tests should not be affected. Consider\n  // passing this value from the internals page and reset the bool based\
      \ on\n  // which internals page is active.\n  bool force_refresh = !features::kSegmentationSurveyInternalsPage.Get();\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Preserve signal collection requirements for ordinary internals predictions.\n\
      \  constexpr bool force_refresh = false;\n#else\n  // Survey page needs to check the signal requirements. Surveys would\
      \ be\n  // disabled when not running, so local tests should not be affected. Consider\n  // passing this value from\
      \ the internals page and reset the bool based on\n  // which internals page is active.\n  bool force_refresh = !features::kSegmentationSurveyInternalsPage.Get();\n\
      #endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
