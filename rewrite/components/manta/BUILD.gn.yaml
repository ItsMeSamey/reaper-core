# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/manta/BUILD.gn'
  regex:
    re_pattern: '\#\ Copyright\ 2023\ The\ Chromium\ Authors\

      \#\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      \#\ found\ in\ the\ LICENSE\ file\.\

      \

      component\("manta"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "anchovy/anchovy_proto_helper\.cc",\

      \ \ \ \ "anchovy/anchovy_proto_helper\.h",\

      \ \ \ \ "anchovy/anchovy_provider\.cc",\

      \ \ \ \ "anchovy/anchovy_provider\.h",\

      \ \ \ \ "anchovy/anchovy_requests\.cc",\

      \ \ \ \ "anchovy/anchovy_requests\.h",\

      \ \ \ \ "base_provider\.cc",\

      \ \ \ \ "base_provider\.h",\

      \ \ \ \ "features\.cc",\

      \ \ \ \ "features\.h",\

      \ \ \ \ "manta_service\.cc",\

      \ \ \ \ "manta_service\.h",\

      \ \ \ \ "manta_service_callbacks\.cc",\

      \ \ \ \ "manta_service_callbacks\.h",\

      \ \ \ \ "manta_status\.h",\

      \ \ \ \ "provider_params\.h",\

      \ \ \]\

      \

      \ \ defines\ =\ \[\ "IS_MANTA_IMPL"\ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "proto",\

      \ \ \ \ "//base",\

      \ \ \ \ "//components/account_id",\

      \ \ \ \ "//components/endpoint_fetcher",\

      \ \ \ \ "//components/keyed_service/core",\

      \ \ \ \ "//components/signin/public/identity_manager",\

      \ \ \ \ "//net",\

      \ \ \]\

      \

      \ \ if\ \(is_chromeos\)\ \{\

      \ \ \ \ sources\ \+=\ \[\

      \ \ \ \ \ \ "mahi_provider\.cc",\

      \ \ \ \ \ \ "mahi_provider\.h",\

      \ \ \ \ \ \ "orca_provider\.cc",\

      \ \ \ \ \ \ "orca_provider\.h",\

      \ \ \ \ \ \ "scanner_provider\.cc",\

      \ \ \ \ \ \ "scanner_provider\.h",\

      \ \ \ \ \ \ "snapper_provider\.cc",\

      \ \ \ \ \ \ "snapper_provider\.h",\

      \ \ \ \ \ \ "walrus_provider\.cc",\

      \ \ \ \ \ \ "walrus_provider\.h",\

      \ \ \ \ \]\

      \ \ \ \ deps\ \+=\ \[\

      \ \ \ \ \ \ "//chromeos/components/magic_boost/public/cpp",\

      \ \ \ \ \ \ "//chromeos/constants",\

      \ \ \ \ \]\

      \ \ \}\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \

      \ \ sources\ =\ \[\

      \ \ \ \ "base_provider_test_helper\.cc",\

      \ \ \ \ "base_provider_test_helper\.h",\

      \ \ \]\

      \

      \ \ if\ \(is_chromeos\)\ \{\

      \ \ \ \ sources\ \+=\ \[\

      \ \ \ \ \ \ "orca_provider_unittest\.cc",\

      \ \ \ \ \ \ "scanner_provider_unittest\.cc",\

      \ \ \ \ \ \ "snapper_provider_unittest\.cc",\

      \ \ \ \ \ \ "walrus_provider_unittest\.cc",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":manta",\

      \ \ \ \ "proto",\

      \ \ \ \ "//base",\

      \ \ \ \ "//base/test:test_support",\

      \ \ \ \ "//components/endpoint_fetcher",\

      \ \ \ \ "//components/signin/public/identity_manager:test_support",\

      \ \ \ \ "//net/traffic_annotation:test_support",\

      \ \ \ \ "//services/network:test_support",\

      \ \ \ \ "//testing/gtest",\

      \ \ \]\

      \}\

      '
    replace: "if (!is_android) {\n  # Copyright 2023 The Chromium Authors\n  # Use of this source code is governed by a BSD-style license that can be\n  # found in the LICENSE file.\n\n  component(\"manta\") {\n    sources = [\n      \"anchovy/anchovy_proto_helper.cc\",\n      \"anchovy/anchovy_proto_helper.h\",\n      \"anchovy/anchovy_provider.cc\",\n      \"anchovy/anchovy_provider.h\",\n      \"anchovy/anchovy_requests.cc\",\n      \"anchovy/anchovy_requests.h\",\n      \"base_provider.cc\",\n      \"base_provider.h\",\n      \"features.cc\",\n      \"features.h\",\n      \"manta_service.cc\",\n      \"manta_service.h\",\n      \"manta_service_callbacks.cc\",\n      \"manta_service_callbacks.h\",\n      \"manta_status.h\",\n      \"provider_params.h\",\n    ]\n\n    defines = [ \"IS_MANTA_IMPL\" ]\n\n    deps = [\n      \"proto\",\n      \"//base\",\n      \"//components/account_id\",\n      \"//components/endpoint_fetcher\",\n      \"//components/keyed_service/core\",\n      \"//components/signin/public/identity_manager\",\n      \"//net\",\n    ]\n\n    if (is_chromeos) {\n      sources += [\n        \"mahi_provider.cc\",\n        \"mahi_provider.h\",\n        \"orca_provider.cc\",\n        \"orca_provider.h\",\n        \"scanner_provider.cc\",\n        \"scanner_provider.h\",\n        \"snapper_provider.cc\",\n        \"snapper_provider.h\",\n        \"walrus_provider.cc\",\n        \"walrus_provider.h\",\n      ]\n      deps += [\n        \"//chromeos/components/magic_boost/public/cpp\",\n        \"//chromeos/constants\",\n      ]\n    }\n  }\n\n  source_set(\"unit_tests\") {\n    testonly = true\n\n    sources = [\n      \"base_provider_test_helper.cc\",\n      \"base_provider_test_helper.h\",\n    ]\n\n    if (is_chromeos) {\n      sources += [\n        \"orca_provider_unittest.cc\",\n        \"scanner_provider_unittest.cc\",\n        \"snapper_provider_unittest.cc\",\n        \"walrus_provider_unittest.cc\",\n      ]\n    }\n\n    deps = [\n      \":manta\",\n      \"proto\",\n      \"//base\",\n      \"//base/test:test_support\",\n      \"//components/endpoint_fetcher\",\n      \"//components/signin/public/identity_manager:test_support\",\n      \"//net/traffic_annotation:test_support\",\n      \"//services/network:test_support\",\n      \"//testing/gtest\",\n    ]\n  }\n}\n"
