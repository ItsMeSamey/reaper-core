# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: 'import\ org\.chromium\.components\.minidump_uploader\.util\.CrashReportingPermissionManager;\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: /\*\*\ TestRule\ for\ Crash\ upload\ related\ tests\.\ \*/
    replace: /** TestRule for local crash file tests. */
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ A\ utility\ instantiation\ of\ CrashReportingPermissionManager\ providing\ a\ compact\ way\ of\

      \ \ \ \ \ \*\ overriding\ different\ permission\ settings\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ static\ class\ MockCrashReportingPermissionManager\

      \ \ \ \ \ \ \ \ \ \ \ \ implements\ CrashReportingPermissionManager\ \{\

      \ \ \ \ \ \ \ \ protected\ boolean\ mIsInSample;\

      \ \ \ \ \ \ \ \ protected\ boolean\ mIsUserPermitted;\

      \ \ \ \ \ \ \ \ protected\ boolean\ mIsNetworkAvailable;\

      \ \ \ \ \ \ \ \ protected\ boolean\ mIsEnabledForTests;\

      \

      \ \ \ \ \ \ \ \ public\ MockCrashReportingPermissionManager\(\)\ \{\}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ boolean\ isClientInSampleForCrashes\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ mIsInSample;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ boolean\ isNetworkAvailableForCrashUploads\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ mIsNetworkAvailable;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ boolean\ isUsageAndCrashReportingPermittedByPolicy\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ boolean\ isUsageAndCrashReportingPermittedByUser\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ mIsUserPermitted;\

      \ \ \ \ \ \ \ \ \}\

      \

      \ \ \ \ \ \ \ \ @Override\

      \ \ \ \ \ \ \ \ public\ boolean\ isUploadEnabledForTests\(\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ mIsEnabledForTests;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \}'
    replace: ''
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \ \ \}\

      \

      \

      '
    replace: '    }

      '
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \ \ \ \*\ Returns\ the\ cache\ directory\ where\ we\ should\ store\ minidumps\.\

      \ \ \ \ \ \*\ Can\ be\ overriden\ by\ sub\-classes\ to\ allow\ for\ use\ with\ different\ cache\ directories\.\

      '
    replace: "     * Returns the cache directory where we should store minidumps. Can be overriden by sub-classes\n     * to allow for use with different cache directories.\n"
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\

      import\ org\.chromium\.base\.ContextUtils;\

      import\ org\.chromium\.base\.Log;\

      '
    replace: ''
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: 'package\ org\.chromium\.components\.minidump_uploader;\

      \

      '
    replace: 'package org.chromium.components.minidump_uploader;


      import org.chromium.base.ContextUtils;

      import org.chromium.base.Log;

      '
