# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/optimization_guide/features.gni'
  regex:
    re_pattern: '\ \ \#\ TODO:\ crbug\.com/393434571\ \-\ Clarify\ the\ boundary\ /\ strategy\ here\.\

      \ \ build_with_model_execution\ =\ !\(is_fuchsia\ \&\&\ is_web_engine\)\

      \}\

      '
    replace: "  # TODO: crbug.com/393434571 - Clarify the boundary / strategy here.\n  build_with_model_execution = !(is_fuchsia && is_web_engine)\n}\n\n# Android retains hints and prediction providers without optional model\n# execution.\nif (is_android) {\n  build_with_model_execution = false\n}\n"
