substitutions:
- description: Exclude only AX converter imports on Android.
  regex:
    pattern: '#include "base/strings/strcat.h"

      #include "base/strings/utf_string_conversions.h"

      #include "components/optimization_guide/proto/features/common_quality_data.pb.h"

      #include "ui/accessibility/ax_enums.mojom.h"

      #include "ui/accessibility/ax_node_data.h"

      #include "ui/accessibility/ax_relative_bounds.h"

      #include "ui/accessibility/ax_tree_data.h"

      #include "ui/accessibility/ax_tree_update.h"

      '
    replace: '#include "base/strings/strcat.h"

      #include "build/build_config.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "base/strings/utf_string_conversions.h"

      #include "components/optimization_guide/proto/features/common_quality_data.pb.h"

      #include "ui/accessibility/ax_enums.mojom.h"

      #include "ui/accessibility/ax_node_data.h"

      #include "ui/accessibility/ax_relative_bounds.h"

      #include "ui/accessibility/ax_tree_data.h"

      #include "ui/accessibility/ax_tree_update.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude private AX conversion helpers and AXRoleToProto on Android.
  regex:
    pattern: 'namespace optimization_guide {


      namespace {'
    replace: 'namespace optimization_guide {


      #if !BUILDFLAG(IS_ANDROID)

      namespace {'
  count: 1
- description: Close AX guard before the unchanged generic AnyWrapProto.
  regex:
    pattern: '

      proto::Any AnyWrapProto('
    replace: '

      #endif  // !BUILDFLAG(IS_ANDROID)


      proto::Any AnyWrapProto('
  count: 1
- description: Exclude public AX tree conversion definition on Android.
  regex:
    pattern: '

      void PopulateAXTreeUpdateProto('
    replace: '

      #if !BUILDFLAG(IS_ANDROID)

      void PopulateAXTreeUpdateProto('
  count: 1
- description: Close AX tree guard before the unchanged outer namespace.
  regex:
    pattern: '

      }  // namespace optimization_guide

      '
    replace: '

      #endif  // !BUILDFLAG(IS_ANDROID)


      }  // namespace optimization_guide

      '
  count: 1
