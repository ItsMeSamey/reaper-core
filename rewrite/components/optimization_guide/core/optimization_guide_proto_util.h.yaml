substitutions:
- description: Retain generic common_types while excluding AX proto/accessibility imports on Android.
  regex:
    pattern: '#include "components/optimization_guide/proto/common_types.pb.h"

      #include "components/optimization_guide/proto/features/common_quality_data.pb.h"

      #include "ui/accessibility/ax_enums.mojom.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/optimization_guide/proto/common_types.pb.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/proto/features/common_quality_data.pb.h"

      #include "ui/accessibility/ax_enums.mojom.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude only the two optional AX converter declarations on Android.
  regex:
    pattern: "// Convert the enum role to the equivalent proto.\noptimization_guide::proto::AXRole AXRoleToProto(ax::mojom::Role\
      \ role);\n\n// Populate the AXTreeUpdate proto structure from the ui structure.\nvoid PopulateAXTreeUpdateProto(\n \
      \   const ui::AXTreeUpdate& source,\n    optimization_guide::proto::AXTreeUpdate* destination);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Convert the enum role to the equivalent proto.\noptimization_guide::proto::AXRole\
      \ AXRoleToProto(ax::mojom::Role role);\n\n// Populate the AXTreeUpdate proto structure from the ui structure.\nvoid\
      \ PopulateAXTreeUpdateProto(\n    const ui::AXTreeUpdate& source,\n    optimization_guide::proto::AXTreeUpdate* destination);\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
