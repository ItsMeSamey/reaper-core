# Android fixture excludes the unused execution header and preserves all ordinary cases.
substitutions:
- description: 'Android fixture excludes unused execution header; preserves ordinary assertions: components/optimization_guide/core/optimization_guide_util_unittest.cc'
  regex:
    re_pattern: '\

      \#include\ "base/test/task_environment\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "components/optimization_guide/core/model_execution/feature_keys\.h"\

      \#include\ "components/optimization_guide/proto/loading_predictor_metadata\.pb\.h"\

      \#include\ "components/prefs/testing_pref_service\.h"\

      \#include\ "testing/gtest/include/gtest/gtest\.h"\

      '
    replace: '

      #include "base/test/task_environment.h"

      #include "base/time/time.h"

      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/model_execution/feature_keys.h"

      #endif

      #include "components/optimization_guide/proto/loading_predictor_metadata.pb.h"

      #include "components/prefs/testing_pref_service.h"

      #include "testing/gtest/include/gtest/gtest.h"

      '
