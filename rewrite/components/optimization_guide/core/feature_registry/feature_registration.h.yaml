# Android optional registry/helper compile boundary; ordinary profile policy retained.
substitutions:
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.h'
  regex:
    re_pattern: '\#define\ COMPONENTS_OPTIMIZATION_GUIDE_CORE_FEATURE_REGISTRY_FEATURE_REGISTRATION_H_\

      \

      \#include\ "base/component_export\.h"\

      \#include\ "base/feature_list\.h"\

      \

      class\ PrefRegistrySimple;\

      namespace\ optimization_guide\ \{\

      \

      namespace\ prefs\ \{\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      extern\ const\ char\ kComposeEnterprisePolicyAllowed\[\];\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      '
    replace: '#define COMPONENTS_OPTIMIZATION_GUIDE_CORE_FEATURE_REGISTRY_FEATURE_REGISTRATION_H_


      #include "base/component_export.h"

      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "base/feature_list.h"

      #endif


      class PrefRegistrySimple;

      namespace optimization_guide {


      namespace prefs {

      #if !BUILDFLAG(IS_ANDROID)

      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      extern const char kComposeEnterprisePolicyAllowed[];

      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      '
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.h'
  regex:
    re_pattern: 'extern\ const\ char\ kHistorySearchEnterprisePolicyAllowed\[\];\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      extern\ const\ char\ kAutomatedPasswordChangeEnterprisePolicyAllowed\[\];\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      extern\ const\ char\ kProductSpecificationsEnterprisePolicyAllowed\[\];\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      extern\ const\ char\ kAutofillPredictionImprovementsEnterprisePolicyAllowed\[\];\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      '
    replace: 'extern const char kHistorySearchEnterprisePolicyAllowed[];

      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      extern const char kAutomatedPasswordChangeEnterprisePolicyAllowed[];

      #endif

      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      extern const char kProductSpecificationsEnterprisePolicyAllowed[];

      #if !BUILDFLAG(IS_ANDROID)

      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      extern const char kAutofillPredictionImprovementsEnterprisePolicyAllowed[];

      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      '
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.h'
  regex:
    re_pattern: '\

      \ \ kMaxValue\ =\ kDisabled\

      \};\

      \}\ \ //\ namespace\ prefs\

      \

      namespace\ features\ \{\

      BASE_DECLARE_FEATURE\(kActorLoginMqlsLogging\);\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      '
    replace: "\n  kMaxValue = kDisabled\n};\n#endif\n}  // namespace prefs\n\n#if !BUILDFLAG(IS_ANDROID)\nnamespace features {\nBASE_DECLARE_FEATURE(kActorLoginMqlsLogging);\nCOMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)\n"
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.h'
  regex:
    re_pattern: 'COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      BASE_DECLARE_FEATURE\(kFindsMqlsLogging\);\

      \}\ \ //\ namespace\ features\

      \

      void\ RegisterGenAiFeatures\(PrefRegistrySimple\*\ registry\);\

      \

      '
    replace: 'COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      BASE_DECLARE_FEATURE(kFindsMqlsLogging);

      }  // namespace features

      #endif


      void RegisterGenAiFeatures(PrefRegistrySimple* registry);


      '
