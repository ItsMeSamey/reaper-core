# Android optional registry/helper compile boundary; ordinary profile policy retained.
substitutions:
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.cc'
  regex:
    re_pattern: '\

      \#include\ "components/optimization_guide/core/feature_registry/feature_registration\.h"\

      \

      \#include\ "base/feature_list\.h"\

      \#include\ "components/optimization_guide/core/feature_registry/enterprise_policy_registry\.h"\

      \#include\ "components/optimization_guide/core/feature_registry/mqls_feature_registry\.h"\

      '
    replace: '

      #include "components/optimization_guide/core/feature_registry/feature_registration.h"


      #include "build/build_config.h"

      #include "components/optimization_guide/core/model_execution/model_execution_prefs.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "base/feature_list.h"

      #include "components/optimization_guide/core/feature_registry/enterprise_policy_registry.h"

      #include "components/optimization_guide/core/feature_registry/mqls_feature_registry.h"

      '
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.cc'
  regex:
    re_pattern: '\#include\ "components/optimization_guide/core/model_execution/feature_keys\.h"\

      \#include\ "components/optimization_guide/proto/features/common_quality_data\.pb\.h"\

      \#include\ "components/optimization_guide/proto/model_quality_service\.pb\.h"\

      \#include\ "components/prefs/pref_registry_simple\.h"\

      \

      namespace\ optimization_guide\ \{\

      \

      namespace\ prefs\ \{\

      \

      const\ char\ kComposeEnterprisePolicyAllowed\[\]\ =\

      \ \ \ \ "optimization_guide\.model_execution\.compose_enterprise_policy_allowed";\

      '
    replace: "#include \"components/optimization_guide/core/model_execution/feature_keys.h\"\n#include \"components/optimization_guide/proto/features/common_quality_data.pb.h\"\n#include \"components/optimization_guide/proto/model_quality_service.pb.h\"\n#endif\n#include \"components/prefs/pref_registry_simple.h\"\n\nnamespace optimization_guide {\n\nnamespace prefs {\n\n#if !BUILDFLAG(IS_ANDROID)\n\nconst char kComposeEnterprisePolicyAllowed[] =\n    \"optimization_guide.model_execution.compose_enterprise_policy_allowed\";\n"
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.cc'
  regex:
    re_pattern: '\ \ \ \ "optimization_guide\.model_execution\.history_search_"\

      \ \ \ \ "enterprise_policy_allowed";\

      \

      const\ char\ kProductSpecificationsEnterprisePolicyAllowed\[\]\ =\

      \ \ \ \ "optimization_guide\.model_execution\.tab_compare_settings_enterprise_policy";\

      \

      const\ char\ kAutofillPredictionImprovementsEnterprisePolicyAllowed\[\]\ =\

      \ \ \ \ "optimization_guide\.model_execution\.autofill_prediction_improvements_"\

      '
    replace: "    \"optimization_guide.model_execution.history_search_\"\n    \"enterprise_policy_allowed\";\n\n#endif\n\nconst char kProductSpecificationsEnterprisePolicyAllowed[] =\n    \"optimization_guide.model_execution.tab_compare_settings_enterprise_policy\";\n\n#if !BUILDFLAG(IS_ANDROID)\n\nconst char kAutofillPredictionImprovementsEnterprisePolicyAllowed[] =\n    \"optimization_guide.model_execution.autofill_prediction_improvements_\"\n"
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.cc'
  regex:
    re_pattern: 'const\ char\ kFindAndFillWithGeminiSettings\[\]\ =\

      \ \ \ \ "autofill\.personal_context\.find_and_fill_with_gemini_settings";\

      //\ LINT\.ThenChange\(//chrome/browser/ui/android/autofill/internal/java/src/org/chromium/chrome/browser/ui/autofill/AtMemoryBottomSheetMediator\.java:FindAndFillWithGeminiSettings\)\

      \}\ \ //\ namespace\ prefs\

      \

      namespace\ features\ \{\

      BASE_FEATURE\(kActorLoginMqlsLogging,\ base::FEATURE_ENABLED_BY_DEFAULT\);\

      \

      '
    replace: "const char kFindAndFillWithGeminiSettings[] =\n    \"autofill.personal_context.find_and_fill_with_gemini_settings\";\n// LINT.ThenChange(//chrome/browser/ui/android/autofill/internal/java/src/org/chromium/chrome/browser/ui/autofill/AtMemoryBottomSheetMediator.java:FindAndFillWithGeminiSettings)\n\n#endif\n}  // namespace prefs\n\n\n#if !BUILDFLAG(IS_ANDROID)\nnamespace features {\nBASE_FEATURE(kActorLoginMqlsLogging, base::FEATURE_ENABLED_BY_DEFAULT);\n\n"
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.cc'
  regex:
    re_pattern: '\}\

      \

      \}\ \ //\ anonymous\ namespace\

      \

      void\ RegisterGenAiFeatures\(PrefRegistrySimple\*\ pref_registry\)\ \{\

      \ \ static\ bool\ features_registered\ =\ false;\

      \ \ //\ When\ adding\ a\ value\ here,\ also\ update:\

      \ \ //\ \-\ tools/metrics/histograms/metadata/optimization_guide/histogram\.xml:\

      '
    replace: "}\n\n}  // anonymous namespace\n#endif\n\nvoid RegisterGenAiFeatures(PrefRegistrySimple* pref_registry) {\n#if BUILDFLAG(IS_ANDROID)\n  // The ordinary product-specification policy does not require any model,\n  // feedback callback or settings registry.\n  pref_registry->RegisterIntegerPref(\n      prefs::kProductSpecificationsEnterprisePolicyAllowed,\n      static_cast<int>(\n          model_execution::prefs::ModelExecutionEnterprisePolicyValue::kAllow),\n      PrefRegistry::LOSSY_PREF);\n#else\n  static bool features_registered = false;\n  // When adding a value here, also update:\n  // - tools/metrics/histograms/metadata/optimization_guide/histogram.xml:\n"
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/feature_registry/feature_registration.cc'
  regex:
    re_pattern: '\ \ \ \ features_registered\ =\ true;\

      \ \ \}\

      \ \ EnterprisePolicyRegistry::GetInstance\(\)\.RegisterProfilePrefs\(pref_registry\);\

      \}\

      \

      \}\ \ //\ namespace\ optimization_guide\

      '
    replace: "    features_registered = true;\n  }\n  EnterprisePolicyRegistry::GetInstance().RegisterProfilePrefs(pref_registry);\n#endif\n}\n\n}  // namespace optimization_guide\n"
