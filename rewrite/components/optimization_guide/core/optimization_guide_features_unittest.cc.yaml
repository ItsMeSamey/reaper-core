# Android optional model helpers; ordinary hints and prediction retained.
substitutions:
- description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features_unittest.cc'
  regex:
    re_pattern: '\#include\ "base/test/scoped_feature_list\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "components/optimization_guide/core/delivery/model_util\.h"\

      \#include\ "components/optimization_guide/core/feature_registry/feature_registration\.h"\

      \#include\ "components/optimization_guide/core/feature_registry/mqls_feature_registry\.h"\

      \#include\ "components/optimization_guide/proto/models\.pb\.h"\

      \#include\ "components/prefs/testing_pref_service\.h"\

      \#include\ "google_apis/gaia/gaia_constants\.h"\

      '
    replace: '#include "base/test/scoped_feature_list.h"

      #include "build/build_config.h"

      #include "components/optimization_guide/core/delivery/model_util.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/feature_registry/feature_registration.h"

      #include "components/optimization_guide/core/feature_registry/mqls_feature_registry.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/model_execution/model_execution_prefs.h"

      #include "components/optimization_guide/proto/models.pb.h"

      #include "components/prefs/testing_pref_service.h"

      #include "google_apis/gaia/gaia_constants.h"

      '
- description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features_unittest.cc'
  regex:
    re_pattern: '\ \ TestingPrefServiceSimple\ prefs_;\

      \};\

      \

      TEST_F\(OptimizationGuideFeaturesTest,\ ModelQualityLoggingDefault\)\ \{\

      \ \ base::test::ScopedFeatureList\ scoped_feature_list;\

      \

      '
    replace: "  TestingPrefServiceSimple prefs_;\n};\n\n#if !BUILDFLAG(IS_ANDROID)\nTEST_F(OptimizationGuideFeaturesTest, ModelQualityLoggingDefault) {\n  base::test::ScopedFeatureList scoped_feature_list;\n\n"
- description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features_unittest.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ features::IsModelQualityLoggingEnabledForFeature\(registry\.GetFeature\(\

      \ \ \ \ \ \ \ \ \ \ proto::LogAiDataRequest::FeatureCase::kWallpaperSearch\)\)\);\

      \}\

      \

      TEST_F\(OptimizationGuideFeaturesTest,\

      \ \ \ \ \ \ \ OptimizationGuidePersonalizedFetchingDefaultBehaviour\)\ \{\

      '
    replace: "      features::IsModelQualityLoggingEnabledForFeature(registry.GetFeature(\n          proto::LogAiDataRequest::FeatureCase::kWallpaperSearch)));\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\nTEST_F(OptimizationGuideFeaturesTest,\n       OptimizationGuidePersonalizedFetchingDefaultBehaviour) {\n"
- description: Keep model-execution setup header inside existing non-Android AI test include block
  regex:
    pattern: '#include "components/optimization_guide/core/feature_registry/mqls_feature_registry.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/model_execution/model_execution_prefs.h"

      '
    replace: '#include "components/optimization_guide/core/feature_registry/mqls_feature_registry.h"

      #include "components/optimization_guide/core/model_execution/model_execution_prefs.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Compile test-only AI preference service include out on Android
  regex:
    pattern: '#include "components/prefs/testing_pref_service.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/prefs/testing_pref_service.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep dedicated AI preference setup/state on desktop while preserving every ordinary feature test body
  regex:
    pattern: "class OptimizationGuideFeaturesTest : public testing::Test {\n public:\n  void SetUp() override {\n    model_execution::prefs::RegisterProfilePrefs(prefs_.registry());\n\
      \  }\n\n private:\n  TestingPrefServiceSimple prefs_;\n};"
    replace: "class OptimizationGuideFeaturesTest : public testing::Test {\n#if !BUILDFLAG(IS_ANDROID)\n public:\n  void SetUp()\
      \ override {\n    model_execution::prefs::RegisterProfilePrefs(prefs_.registry());\n  }\n\n private:\n  TestingPrefServiceSimple\
      \ prefs_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n};"
  count: 1
