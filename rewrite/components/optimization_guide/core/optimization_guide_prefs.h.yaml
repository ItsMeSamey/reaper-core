# Android retains hints, prediction, security and ordinary helpers while omitting optional model execution and quality upload.
substitutions:
- description: 'Android optional model execution boundary: components/optimization_guide/core/optimization_guide_prefs.h'
  regex:
    re_pattern: '\#define\ COMPONENTS_OPTIMIZATION_GUIDE_CORE_OPTIMIZATION_GUIDE_PREFS_H_\

      \

      \#include\ "base/component_export\.h"\

      \#include\ "components/optimization_guide/core/model_execution/feature_keys\.h"\

      \

      class\ PrefRegistrySimple;\

      \

      '
    replace: '#define COMPONENTS_OPTIMIZATION_GUIDE_CORE_OPTIMIZATION_GUIDE_PREFS_H_


      #include "base/component_export.h"

      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/model_execution/feature_keys.h"

      #endif


      class PrefRegistrySimple;


      '
- description: 'Android optional model execution boundary: components/optimization_guide/core/optimization_guide_prefs.h'
  regex:
    re_pattern: '\ \ kDisabled\ =\ 2\

      \};\

      \

      //\ Returns\ the\ name\ of\ the\ pref\ that\ stores\ the\ user''s\ setting\ opt\-in\ state\ for\

      //\ the\ given\ `feature`\.\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      std::string\ GetSettingEnabledPrefName\(UserVisibleFeatureKey\ feature\);\

      \

      namespace\ localstate\ \{\

      \

      //\ Local\ state\ prefs\.\

      '
    replace: '  kDisabled = 2

      };


      #if !BUILDFLAG(IS_ANDROID)

      // Returns the name of the pref that stores the user''s setting opt-in state for

      // the given `feature`.

      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      std::string GetSettingEnabledPrefName(UserVisibleFeatureKey feature);


      #endif

      namespace localstate {


      // Local state prefs.

      '
