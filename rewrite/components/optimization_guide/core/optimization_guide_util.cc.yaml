# Android retains hints, prediction, security and ordinary helpers while omitting optional model execution and quality upload.
substitutions:
- description: 'Android optional model execution boundary: components/optimization_guide/core/optimization_guide_util.cc'
  regex:
    re_pattern: '\#include\ "base/strings/strcat\.h"\

      \#include\ "base/strings/string_number_conversions\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "components/optimization_guide/core/model_execution/feature_keys\.h"\

      \#include\ "components/optimization_guide/core/optimization_guide_enums\.h"\

      \#include\ "components/optimization_guide/core/optimization_guide_features\.h"\

      \#include\ "components/optimization_guide/core/optimization_guide_logger\.h"\

      \#include\ "components/optimization_guide/core/optimization_guide_prefs\.h"\

      \#include\ "components/optimization_guide/proto/features/common_quality_data\.pb\.h"\

      \#include\ "components/prefs/pref_service\.h"\

      \#include\ "google_apis/common/api_key_request_util\.h"\

      \#include\ "net/base/url_util\.h"\

      '
    replace: '#include "base/strings/strcat.h"

      #include "base/strings/string_number_conversions.h"

      #include "build/build_config.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/model_execution/feature_keys.h"

      #endif

      #include "components/optimization_guide/core/optimization_guide_enums.h"

      #include "components/optimization_guide/core/optimization_guide_features.h"

      #include "components/optimization_guide/core/optimization_guide_logger.h"

      #include "components/optimization_guide/core/optimization_guide_prefs.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/proto/features/common_quality_data.pb.h"

      #endif

      #include "components/prefs/pref_service.h"

      #include "google_apis/common/api_key_request_util.h"

      #include "net/base/url_util.h"

      '
- description: 'Android optional model execution boundary: components/optimization_guide/core/optimization_guide_util.cc'
  regex:
    re_pattern: '\

      namespace\ optimization_guide\ \{\

      \

      std::string_view\ GetStringNameForModelExecutionFeature\(\

      \ \ \ \ std::optional<UserVisibleFeatureKey>\ feature\)\ \{\

      \ \ if\ \(!feature\)\ \{\

      '
    replace: "\nnamespace optimization_guide {\n\n#if !BUILDFLAG(IS_ANDROID)\nstd::string_view GetStringNameForModelExecutionFeature(\n    std::optional<UserVisibleFeatureKey> feature) {\n  if (!feature) {\n"
- description: 'Android optional model execution boundary: components/optimization_guide/core/optimization_guide_util.cc'
  regex:
    re_pattern: '\ \ \}\

      \}\

      \

      bool\ IsHostValidToFetchFromRemoteOptimizationGuide\(const\ std::string\&\ host\)\ \{\

      \ \ if\ \(net::HostStringIsLocalhost\(host\)\)\ \{\

      \ \ \ \ return\ false;\

      '
    replace: "  }\n}\n\n#endif\nbool IsHostValidToFetchFromRemoteOptimizationGuide(const std::string& host) {\n  if (net::HostStringIsLocalhost(host)) {\n    return false;\n"
- description: Android excludes quality-proto ChromePlatform implementation
  regex:
    pattern: "optimization_guide::proto::ChromePlatform GetChromePlatform() {\n#if BUILDFLAG(IS_WIN)\n  return optimization_guide::proto::CHROME_PLATFORM_WINDOWS;\n\
      #elif BUILDFLAG(IS_IOS)\n  return optimization_guide::proto::CHROME_PLATFORM_IOS;\n#elif BUILDFLAG(IS_MAC)\n  return\
      \ optimization_guide::proto::CHROME_PLATFORM_MAC;\n#elif BUILDFLAG(IS_CHROMEOS)\n  return optimization_guide::proto::CHROME_PLATFORM_CHROMEOS;\n\
      #elif BUILDFLAG(IS_ANDROID)\n  return optimization_guide::proto::CHROME_PLATFORM_ANDROID;\n#elif BUILDFLAG(IS_LINUX)\n\
      \  return optimization_guide::proto::CHROME_PLATFORM_LINUX;\n#else\n  return optimization_guide::proto::CHROME_PLATFORM_UNKNOWN;\n\
      #endif\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\noptimization_guide::proto::ChromePlatform GetChromePlatform() {\n#if BUILDFLAG(IS_WIN)\n\
      \  return optimization_guide::proto::CHROME_PLATFORM_WINDOWS;\n#elif BUILDFLAG(IS_IOS)\n  return optimization_guide::proto::CHROME_PLATFORM_IOS;\n\
      #elif BUILDFLAG(IS_MAC)\n  return optimization_guide::proto::CHROME_PLATFORM_MAC;\n#elif BUILDFLAG(IS_CHROMEOS)\n  return\
      \ optimization_guide::proto::CHROME_PLATFORM_CHROMEOS;\n#elif BUILDFLAG(IS_ANDROID)\n  return optimization_guide::proto::CHROME_PLATFORM_ANDROID;\n\
      #elif BUILDFLAG(IS_LINUX)\n  return optimization_guide::proto::CHROME_PLATFORM_LINUX;\n#else\n  return optimization_guide::proto::CHROME_PLATFORM_UNKNOWN;\n\
      #endif\n}\n#endif\n"
  count: 1
