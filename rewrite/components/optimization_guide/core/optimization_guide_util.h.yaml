      // Returns the equivalent string name for a `feature`. The returned string can

      // be used to index persistent data (e.g., prefs, histograms etc.).

      std::string_view GetStringNameForModelExecutionFeature(

      '
- description: 'Android optional model execution boundary: components/optimization_guide/core/optimization_guide_util.h'
  regex:
    re_pattern: 'std::string_view\ GetStringNameForModelExecutionFeature\(\

      \ \ \ \ proto::ModelExecutionFeature\ feature\);\

      \

      //\ Returns\ false\ if\ the\ host\ is\ an\ IP\ address,\ localhosts,\ or\ an\ invalid\

      //\ host\ that\ is\ not\ supported\ by\ the\ remote\ optimization\ guide\.\

      bool\ IsHostValidToFetchFromRemoteOptimizationGuide\(const\ std::string\&\ host\);\

      '
    replace: "std::string_view GetStringNameForModelExecutionFeature(\n    proto::ModelExecutionFeature feature);\n\n#endif\n// Returns false if the host is an IP address, localhosts, or an invalid\n// host that is not supported by the remote optimization guide.\nbool IsHostValidToFetchFromRemoteOptimizationGuide(const std::string& host);\n"
- description: Android excludes quality-proto ChromePlatform forward declaration
  regex:
    pattern: 'namespace proto {

      enum ChromePlatform : int;

      }  // namespace proto

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      namespace proto {

      enum ChromePlatform : int;

      }  // namespace proto

      #endif

      '
  count: 1
- description: Android excludes unavailable quality platform API
  regex:
    pattern: '// Returns the Chrome platform the client is running on.

      proto::ChromePlatform GetChromePlatform();

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      // Returns the Chrome platform the client is running on.

      proto::ChromePlatform GetChromePlatform();

      #endif

      '
  count: 1
