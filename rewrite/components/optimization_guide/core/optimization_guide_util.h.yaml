# Android retains hints, prediction, security and ordinary helpers while omitting optional model execution and quality upload.
substitutions:
- description: 'Android optional model execution boundary: components/optimization_guide/core/optimization_guide_util.h'
  regex:
    re_pattern: '\

      \#include\ "base/strings/string_split\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "components/optimization_guide/core/model_execution/feature_keys\.h"\

      \#include\ "components/optimization_guide/core/optimization_guide_enums\.h"\

      \#include\ "components/optimization_guide/core/optimization_guide_permissions_util\.h"\

      \#include\ "components/optimization_guide/core/optimization_guide_switches\.h"\

      \#include\ "components/optimization_guide/proto/common_types\.pb\.h"\

      \#include\ "components/optimization_guide/proto/model_execution\.pb\.h"\

      \

      \#define\ OPTIMIZATION_GUIDE_LOG\(log_source,\ optimization_guide_logger,\ message\)\ \\\

      \ \ do\ \{\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \\\

      '
    replace: "\n#include \"base/strings/string_split.h\"\n#include \"base/time/time.h\"\n#include \"build/build_config.h\"\n#if !BUILDFLAG(IS_ANDROID)\n#include \"components/optimization_guide/core/model_execution/feature_keys.h\"\n#endif\n#include \"components/optimization_guide/core/optimization_guide_enums.h\"\n#include \"components/optimization_guide/core/optimization_guide_permissions_util.h\"\n#include \"components/optimization_guide/core/optimization_guide_switches.h\"\n#include \"components/optimization_guide/proto/common_types.pb.h\"\n#if !BUILDFLAG(IS_ANDROID)\n#include \"components/optimization_guide/proto/model_execution.pb.h\"\n#endif\n\n#define OPTIMIZATION_GUIDE_LOG(log_source, optimization_guide_logger, message) \\\\\n  do {                                                                         \\\\\n"
