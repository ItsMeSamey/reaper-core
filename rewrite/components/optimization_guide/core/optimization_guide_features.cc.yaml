substitutions:
  - description: 'Ship kOptimizationGuideFetchingForSRP disabled.'
    set_feature_flag_default_state:
      feature_name: kOptimizationGuideFetchingForSRP
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kOptimizationGuideModelExecution disabled.'
    set_feature_flag_default_state:
      feature_name: kOptimizationGuideModelExecution
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kOptimizationHints disabled.'
    set_feature_flag_default_state:
      feature_name: kOptimizationHints
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features.cc'
    regex:
      re_pattern: '\#include\ "base/strings/to_string\.h"\

        \#include\ "base/system/sys_info\.h"\

        \#include\ "base/time/time\.h"\

        \#include\ "components/optimization_guide/core/feature_registry/mqls_feature_registry\.h"\

        \#include\ "components/optimization_guide/core/model_execution/feature_keys\.h"\

        \#include\ "components/optimization_guide/core/model_execution/on_device_features\.h"\

        \#include\ "components/optimization_guide/core/optimization_guide_enums\.h"\

        \#include\ "components/optimization_guide/proto/common_types\.pb\.h"\

        \#include\ "components/variations/hashing\.h"\

        '
      replace: '#include "base/strings/to_string.h"

        #include "base/system/sys_info.h"

        #include "base/time/time.h"

        #if !BUILDFLAG(IS_ANDROID)

        #include "components/optimization_guide/core/feature_registry/mqls_feature_registry.h"

        #include "components/optimization_guide/core/model_execution/feature_keys.h"

        #include "components/optimization_guide/core/model_execution/on_device_features.h"

        #endif  // !BUILDFLAG(IS_ANDROID)

        #include "components/optimization_guide/core/optimization_guide_enums.h"

        #include "components/optimization_guide/proto/common_types.pb.h"

        #include "components/variations/hashing.h"

        '
