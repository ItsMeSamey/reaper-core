        //\ Service\.\

        '
      replace: "\nBASE_FEATURE(kBrokerModelSessionsForUntrustedProcesses,\n             base::FEATURE_DISABLED_BY_DEFAULT);\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n// Enables proactively sending GAIA information to the Optimization Guide\n// Service.\n"
  - description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features.cc'
