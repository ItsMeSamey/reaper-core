        //\ Controls\ whether\ to\ enforce\ a\ timeout\ for\ subframe\ page\ content\ extraction\.\

        //\ If\ enabled,\ defaults\ to\ 1\ second\.\ If\ disabled,\ wait\ indefinitely\ for\ all\

