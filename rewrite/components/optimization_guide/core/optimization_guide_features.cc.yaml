    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ "OptimizationHintsFetchingSRP",\

        \ \ \ \ \ \ \ \ \ \ \ \ \ base::FEATURE_DISABLED_BY_DEFAULT\);\

        \

        //\ Kill\ switch\ for\ disabling\ model\ quality\ logging\.\

        BASE_FEATURE\(kModelQualityLogging,\ base::FEATURE_ENABLED_BY_DEFAULT\);\

        \

        //\ An\ emergency\ kill\ switch\ feature\ to\ stop\ serving\ certain\ model\ versions\ per\

        //\ optimization\ target\.\ This\ is\ useful\ in\ exceptional\ situations\ when\ a\ bad\

        '
      replace: "             \"OptimizationHintsFetchingSRP\",\n             base::FEATURE_DISABLED_BY_DEFAULT);\n\n#if !BUILDFLAG(IS_ANDROID)\n// Kill switch for disabling model quality logging.\nBASE_FEATURE(kModelQualityLogging, base::FEATURE_ENABLED_BY_DEFAULT);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n// An emergency kill switch feature to stop serving certain model versions per\n// optimization target. This is useful in exceptional situations when a bad\n"
  - description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features.cc'
    regex:
      re_pattern: 'BASE_FEATURE\(kOptimizationGuidePredictionModelKillswitch,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ base::FEATURE_DISABLED_BY_DEFAULT\);\

        \

        //\ Whether\ to\ enable\ model\ execution\.\

        BASE_OVERRIDDEN_FEATURE\(kOptimizationGuideModelExecution,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ base::FEATURE_DISABLED_BY_DEFAULT\);\

        '
      replace: "BASE_FEATURE(kOptimizationGuidePredictionModelKillswitch,\n             base::FEATURE_DISABLED_BY_DEFAULT);\n\n#if !BUILDFLAG(IS_ANDROID)\n// Whether to enable model execution.\nBASE_OVERRIDDEN_FEATURE(kOptimizationGuideModelExecution,\n             base::FEATURE_DISABLED_BY_DEFAULT);\n"
  - description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features.cc'
    regex:
      re_pattern: '//\ metrics\.\

        BASE_FEATURE\(kLogOnDeviceMetricsOnStartup,\ base::FEATURE_DISABLED_BY_DEFAULT\);\

