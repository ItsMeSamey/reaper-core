      replace: "// metrics.\nBASE_FEATURE(kLogOnDeviceMetricsOnStartup, base::FEATURE_DISABLED_BY_DEFAULT);\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n// Whether to scan the full text when running the language detection in the text\n// safety classifier.\nBASE_FEATURE(kTextSafetyScanLanguageDetection,\n             base::FEATURE_DISABLED_BY_DEFAULT);\n\n#if !BUILDFLAG(IS_ANDROID)\n// Whether performance class should be fetched each startup or just after a\n// version update.\nBASE_FEATURE(kOnDeviceModelFetchPerformanceClassEveryStartup,\n"
  - description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features.cc'
    regex:
      re_pattern: '\

        BASE_FEATURE\(kOnDeviceModelPerformanceParams,\ base::FEATURE_ENABLED_BY_DEFAULT\);\

        \

        BASE_FEATURE\(kAnnotatedPageContentWithActionableElements,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ base::FEATURE_DISABLED_BY_DEFAULT\);\

        \

        BASE_FEATURE\(kAnnotatedPageContentWithMediaData,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ base::FEATURE_DISABLED_BY_DEFAULT\);\

        \

        const\ base::FeatureParam<std::string>\ kPerformanceClassListForOnDeviceModel\{\

        \ \ \ \ \&kOnDeviceModelPerformanceParams,\

        \ \ \ \ "compatible_on_device_performance_classes",\ "3,4,5,6"\};\

        '
      replace: "\nBASE_FEATURE(kOnDeviceModelPerformanceParams, base::FEATURE_ENABLED_BY_DEFAULT);\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n\nBASE_FEATURE(kAnnotatedPageContentWithActionableElements,\n             base::FEATURE_DISABLED_BY_DEFAULT);\n\nBASE_FEATURE(kAnnotatedPageContentWithMediaData,\n             base::FEATURE_DISABLED_BY_DEFAULT);\n\n#if !BUILDFLAG(IS_ANDROID)\nconst base::FeatureParam<std::string> kPerformanceClassListForOnDeviceModel{\n    &kOnDeviceModelPerformanceParams,\n    \"compatible_on_device_performance_classes\", \"3,4,5,6\"};\n"
  - description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features.cc'
    regex:
      re_pattern: '\

        BASE_FEATURE\(kBrokerModelSessionsForUntrustedProcesses,\

        \ \ \ \ \ \ \ \ \ \ \ \ \ base::FEATURE_DISABLED_BY_DEFAULT\);\

