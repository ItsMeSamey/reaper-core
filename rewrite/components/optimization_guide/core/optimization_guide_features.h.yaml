      #endif  // !BUILDFLAG(IS_ANDROID)


      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      BASE_DECLARE_FEATURE(kGetAIPageContentSubframeTimeoutEnabled);

      '
- description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features.h'
  regex:
    re_pattern: 'std::optional<int>\ OverrideNumThreadsForOptTarget\(\

      \ \ \ \ proto::OptimizationTarget\ opt_target\);\

      \

      //\ Whether\ logging\ of\ model\ quality\ is\ enabled\.\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      bool\ IsModelQualityLoggingEnabled\(\);\

