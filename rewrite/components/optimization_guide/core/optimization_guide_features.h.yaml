# Android optional model helpers; ordinary hints and prediction retained.
substitutions:
- description: 'Android optional model metadata/helpers compile boundary: components/optimization_guide/core/optimization_guide_features.h'
  regex:
    re_pattern: '\#include\ "components/optimization_guide/core/optimization_guide_enums\.h"\

      \#include\ "components/optimization_guide/proto/hints\.pb\.h"\

      \#include\ "components/optimization_guide/proto/models\.pb\.h"\

      \#include\ "components/optimization_guide/public/mojom/model_broker\.mojom\-shared\.h"\

      \#include\ "net/nqe/effective_connection_type\.h"\

      \#include\ "url/gurl\.h"\

      \

      namespace\ optimization_guide\ \{\

      \

      class\ MqlsFeatureMetadata;\

      namespace\ features\ \{\

      \

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      '
    replace: '#include "components/optimization_guide/core/optimization_guide_enums.h"

      #include "components/optimization_guide/proto/hints.pb.h"

      #include "components/optimization_guide/proto/models.pb.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/public/mojom/model_broker.mojom-shared.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "net/nqe/effective_connection_type.h"

      #include "url/gurl.h"


      namespace optimization_guide {


      #if !BUILDFLAG(IS_ANDROID)

      class MqlsFeatureMetadata;

      #endif  // !BUILDFLAG(IS_ANDROID)

      namespace features {


      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      '
