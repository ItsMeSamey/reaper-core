# Android optional registry/helper compile boundary; ordinary profile policy retained.
substitutions:
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/model_execution/on_device_features.cc'
  regex:
    re_pattern: '//\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "components/optimization_guide/core/model_execution/on_device_features\.h"\

      \

      \#include\ "base/containers/flat_map\.h"\

      \#include\ "base/no_destructor\.h"\

      '
    replace: '// found in the LICENSE file.


      #include "components/optimization_guide/core/model_execution/on_device_features.h"


      #include "build/build_config.h"


      #if !BUILDFLAG(IS_ANDROID)


      #include "base/containers/flat_map.h"

      #include "base/no_destructor.h"

      '
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/model_execution/on_device_features.cc'
  regex:
    re_pattern: '\}\

      \

      \}\ \ //\ namespace\ optimization_guide\

      '
    replace: '}


      }  // namespace optimization_guide

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
