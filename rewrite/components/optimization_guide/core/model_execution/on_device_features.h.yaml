# Android optional registry/helper compile boundary; ordinary profile policy retained.
substitutions:
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/model_execution/on_device_features.h'
  regex:
    re_pattern: '\#ifndef\ COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_ON_DEVICE_FEATURES_H_\

      \#define\ COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_ON_DEVICE_FEATURES_H_\

      \

      \#include\ <optional>\

      \#include\ <string_view>\

      \

      \#include\ "base/component_export\.h"\

      \#include\ "base/containers/enum_set\.h"\

      \#include\ "components/optimization_guide/proto/model_execution\.pb\.h"\

      \#include\ "components/optimization_guide/proto/models\.pb\.h"\

      \#include\ "components/optimization_guide/public/mojom/model_broker\.mojom\-shared\.h"\

      \

      namespace\ optimization_guide\ \{\

      '
    replace: '#ifndef COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_ON_DEVICE_FEATURES_H_

      #define COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_ON_DEVICE_FEATURES_H_


      #include "build/build_config.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include <optional>

      #include <string_view>

      #endif


      #include "base/component_export.h"

      #include "base/containers/enum_set.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/proto/model_execution.pb.h"

      #include "components/optimization_guide/proto/models.pb.h"

      #endif

      #include "components/optimization_guide/public/mojom/model_broker.mojom-shared.h"


      namespace optimization_guide {

      '
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/model_execution/on_device_features.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mojom::OnDeviceFeature::kMinValue,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mojom::OnDeviceFeature::kMaxValue>;\

      \

      //\ Return\ the\ name\ to\ use\ in\ histogram\ variants\ for\ this\ feature\ key\.\

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      std::string_view\ GetVariantName\(mojom::OnDeviceFeature\ feature\);\

      '
    replace: "                                         mojom::OnDeviceFeature::kMinValue,\n                                         mojom::OnDeviceFeature::kMaxValue>;\n\n#if !BUILDFLAG(IS_ANDROID)\n// Return the name to use in histogram variants for this feature key.\nCOMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)\nstd::string_view GetVariantName(mojom::OnDeviceFeature feature);\n"
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/model_execution/on_device_features.h'
  regex:
    re_pattern: 'std::optional<mojom::OnDeviceFeature>\ GetFeatureForUseCase\(\

      \ \ \ \ const\ std::string\&\ use_case_name\);\

      \

      \}\ \ //\ namespace\ optimization_guide\

      \

      \#endif\ \ //\ COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_ON_DEVICE_FEATURES_H_\

      '
    replace: "std::optional<mojom::OnDeviceFeature> GetFeatureForUseCase(\n    const std::string& use_case_name);\n\n#endif\n\n}  // namespace optimization_guide\n\n#endif  // COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_ON_DEVICE_FEATURES_H_\n"
- description: Do not include the broker enum generated header for Android AI-disabled feature declarations
  regex:
    pattern: '#include "components/optimization_guide/public/mojom/model_broker.mojom-shared.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/public/mojom/model_broker.mojom-shared.h"

      #endif

      '
  count: 1
- description: Keep the AI-only feature enum set with its existing nonAndroid model helper declarations
  regex:
    pattern: "using OnDeviceFeatureSet = base::EnumSet<mojom::OnDeviceFeature,\n                                         mojom::OnDeviceFeature::kMinValue,\n\
      \                                         mojom::OnDeviceFeature::kMaxValue>;\n\n#if !BUILDFLAG(IS_ANDROID)\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nusing OnDeviceFeatureSet = base::EnumSet<mojom::OnDeviceFeature,\n             \
      \                            mojom::OnDeviceFeature::kMinValue,\n                                         mojom::OnDeviceFeature::kMaxValue>;\n\
      \n"
  count: 1
