# Android optional registry/helper compile boundary; ordinary profile policy retained.
substitutions:
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/model_execution/model_execution_prefs.h'
  regex:
    re_pattern: '\#define\ COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_MODEL_EXECUTION_PREFS_H_\

      \

      \#include\ "base/component_export\.h"\

      \#include\ "base/time/time\.h"\

      \#include\ "components/optimization_guide/public/mojom/model_broker\.mojom\-forward\.h"\

      \#include\ "components/prefs/prefs_export\.h"\

      \

      class\ PrefRegistrySimple;\

      class\ PrefService;\

      '
    replace: '#define COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_MODEL_EXECUTION_PREFS_H_


      #include "base/component_export.h"

      #include "build/build_config.h"


      #if !BUILDFLAG(IS_ANDROID)

      #include "base/time/time.h"

      #include "components/optimization_guide/public/mojom/model_broker.mojom-forward.h"

      #include "components/prefs/prefs_export.h"

      #endif


      class PrefRegistrySimple;

      class PrefService;

      '
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/model_execution/model_execution_prefs.h'
  regex:
    re_pattern: 'COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      void\ RegisterProfilePrefs\(PrefRegistrySimple\*\ registry\);\

      \

      namespace\ localstate\ \{\

      \

      COMPONENT_EXPORT\(OPTIMIZATION_GUIDE_FEATURES\)\

      '
    replace: 'COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      void RegisterProfilePrefs(PrefRegistrySimple* registry);


      #if !BUILDFLAG(IS_ANDROID)

      namespace localstate {


      COMPONENT_EXPORT(OPTIMIZATION_GUIDE_FEATURES)

      '
- description: 'Android ordinary preference registration without optional model registries: components/optimization_guide/core/model_execution/model_execution_prefs.h'
  regex:
    re_pattern: 'bool\ WasUseCaseRecentlyUsed\(const\ PrefService\*\ local_state,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::string\&\ use_case_name\);\

      \

      \}\ \ //\ namespace\ optimization_guide::model_execution::prefs\

      \

      \#endif\ \ //\ COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_MODEL_EXECUTION_PREFS_H_\

      '
    replace: "bool WasUseCaseRecentlyUsed(const PrefService* local_state,\n                            const std::string& use_case_name);\n\n#endif\n\n}  // namespace optimization_guide::model_execution::prefs\n\n#endif  // COMPONENTS_OPTIMIZATION_GUIDE_CORE_MODEL_EXECUTION_MODEL_EXECUTION_PREFS_H_\n"
