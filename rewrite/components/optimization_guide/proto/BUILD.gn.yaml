substitutions:
- description: Exclude orphan Glic cueing protocol generation from Android
  regex:
    pattern: '  # Python stubs are needed at runtime for model validation tests.

      '
    replace: "  if (is_android) {\n    sources -= [ \"contextual_cueing_metadata.proto\" ]\n  }\n\n  # Python stubs are needed\
      \ at runtime for model validation tests.\n"
  count: 1
- description: Exclude unused dedicated AI feature and quality-service native protocols on Android
  regex:
    pattern: "  if (is_android) {\n    sources -= [ \"contextual_cueing_metadata.proto\" ]\n  }\n"
    replace: "  if (is_android) {\n    # Dedicated AI feature payloads and quality uploads have no Android consumers.\n  \
      \  # Keep shared hints, prediction, Autofill and security model schemas below.\n    sources -= [\n      \"contextual_cueing_metadata.proto\"\
      ,\n      \"features/actor_login.proto\",\n      \"features/amount_extraction.proto\",\n      \"features/annotation_reducer_live_tab_resolver.proto\"\
      ,\n      \"features/annotation_reducer_one_p_resolver.proto\",\n      \"features/annotation_reducer_query_classifier.proto\"\
      ,\n      \"features/at_memory.proto\",\n      \"features/atmem_query_analyzer.proto\",\n      \"features/bling_prototyping.proto\"\
      ,\n      \"features/classify_api.proto\",\n      \"features/compose.proto\",\n      \"features/content_annotation.proto\"\
      ,\n      \"features/context_hub.proto\",\n      \"features/contextual_cueing.proto\",\n      \"features/contextual_tasks_context.proto\"\
      ,\n      \"features/default.proto\",\n      \"features/enhanced_calendar.proto\",\n      \"features/finds.proto\",\n\
      \      \"features/forms_classifications.proto\",\n      \"features/gemini_antiscam_protection.proto\",\n      \"features/history_answer.proto\"\
      ,\n      \"features/history_query.proto\",\n      \"features/history_query_intent.proto\",\n      \"features/ios_smart_tab_grouping.proto\"\
      ,\n      \"features/model_prototyping.proto\",\n      \"features/notification_content_detection.proto\",\n      \"features/password_change_submission.proto\"\
      ,\n      \"features/product_specifications.proto\",\n      \"features/prompt_api.proto\",\n      \"features/proofreader_api.proto\"\
      ,\n      \"features/read_aloud_generate_text.proto\",\n      \"features/read_aloud_synthesize.proto\",\n      \"features/scam_detection.proto\"\
      ,\n      \"features/skills.proto\",\n      \"features/summarize.proto\",\n      \"features/updater_chat.proto\",\n \
      \     \"features/walletable_pass_extraction.proto\",\n      \"features/wallpaper_search.proto\",\n      \"features/writing_assistance_api.proto\"\
      ,\n      \"features/zero_state_suggestions.proto\",\n      \"manifest.proto\",\n      \"model_quality_metadata.proto\"\
      ,\n      \"model_quality_service.proto\",\n      \"model_validation.proto\",\n    ]\n  }\n"
  count: 1
- description: Keep proto extras aligned with the Android content-annotation and quality-metadata exclusions
  regex:
    pattern: "    \"on_device_base_model_metadata.proto\",\n  ]\n  deps = [ \":optimization_guide_proto\" ]\n"
    replace: "    \"on_device_base_model_metadata.proto\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"features/content_annotation.proto\"\
      ,\n      \"model_quality_metadata.proto\",\n    ]\n  }\n  deps = [ \":optimization_guide_proto\" ]\n"
  count: 1
- description: Remove the now-unused Android native metrics-proto dependency after quality metadata exclusion
  regex:
    pattern: "    \"//components/multistep_filter/core/annotation_index/proto\",\n    \"//third_party/metrics_proto\",\n \
      \ ]\n  import_dirs = [ \"//third_party/metrics_proto/\" ]\n"
    replace: "    \"//components/multistep_filter/core/annotation_index/proto\",\n    \"//third_party/metrics_proto\",\n \
      \ ]\n  if (is_android) {\n    deps -= [ \"//third_party/metrics_proto\" ]\n  }\n  import_dirs = [ \"//third_party/metrics_proto/\"\
      \ ]\n"
  count: 1
- description: Remove the now-unused Android metrics extras dependency after quality metadata exclusion
  regex:
    pattern: "  extras_deps = [ \"//third_party/metrics_proto:metrics_proto_with_extension_and_system_extras\" ]\n  import_dirs\
      \ = [ \"//third_party/metrics_proto/\" ]\n"
    replace: "  extras_deps = [ \"//third_party/metrics_proto:metrics_proto_with_extension_and_system_extras\" ]\n  if (is_android)\
      \ {\n    extras_deps -= [ \"//third_party/metrics_proto:metrics_proto_with_extension_and_system_extras\" ]\n  }\n  import_dirs\
      \ = [ \"//third_party/metrics_proto/\" ]\n"
  count: 1
