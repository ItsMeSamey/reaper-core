substitutions:
- description: Exclude the dedicated optimization_guide_content_java implementation and dependencies on Android; preserve
    its desktop target
  regex:
    pattern: "android_library(\"optimization_guide_content_java\") {\n  deps = [\n    \"//base:base_java\",\n    \"//build/android:build_java\"\
      ,\n    \"//components/optimization_guide/proto:optimization_guide_proto_java\",\n    \"//content/public/android:content_java\"\
      ,\n    \"//third_party/android_deps:protobuf_lite_runtime_java\",\n    \"//third_party/androidx:androidx_annotation_annotation_java\"\
      ,\n    \"//third_party/jni_zero:jni_zero_java\",\n    \"//url:gurl_java\",\n  ]\n\n  srcjar_deps = [ \":jni_headers\"\
      \ ]\n  sources = [ \"java/src/org/chromium/components/optimization_guide/content/PageContentProtoProviderBridge.java\"\
      \ ]\n}"
    replace: "if (is_android) {\n  group(\"optimization_guide_content_java\") {}\n} else {\n  android_library(\"optimization_guide_content_java\"\
      ) {\n    deps = [\n      \"//base:base_java\",\n      \"//build/android:build_java\",\n      \"//components/optimization_guide/proto:optimization_guide_proto_java\"\
      ,\n      \"//content/public/android:content_java\",\n      \"//third_party/android_deps:protobuf_lite_runtime_java\"\
      ,\n      \"//third_party/androidx:androidx_annotation_annotation_java\",\n      \"//third_party/jni_zero:jni_zero_java\"\
      ,\n      \"//url:gurl_java\",\n    ]\n\n    srcjar_deps = [ \":jni_headers\" ]\n    sources = [ \"java/src/org/chromium/components/optimization_guide/content/PageContentProtoProviderBridge.java\"\
      \ ]\n  }\n}"
  count: 1
- description: Exclude the dedicated jni_headers implementation and dependencies on Android; preserve its desktop target
  regex:
    pattern: "generate_jni(\"jni_headers\") {\n  sources = [ \"java/src/org/chromium/components/optimization_guide/content/PageContentProtoProviderBridge.java\"\
      \ ]\n}"
    replace: "if (is_android) {\n  group(\"jni_headers\") {}\n} else {\n  generate_jni(\"jni_headers\") {\n    sources = [\
      \ \"java/src/org/chromium/components/optimization_guide/content/PageContentProtoProviderBridge.java\" ]\n  }\n}"
  count: 1
- description: Exclude the dedicated junit implementation and dependencies on Android; preserve its desktop target
  regex:
    pattern: "robolectric_library(\"junit\") {\n  sources = [ \"java/src/org/chromium/components/optimization_guide/content/PageContentProtoProviderBridgeUnitTest.java\"\
      \ ]\n  deps = [\n    \":optimization_guide_content_java\",\n    \"//base:base_java\",\n    \"//base:base_java_test_support\"\
      ,\n    \"//base:base_junit_test_support\",\n    \"//components/optimization_guide/proto:optimization_guide_proto_java\"\
      ,\n    \"//content/public/android:content_java\",\n    \"//content/public/test/android:content_java_test_support\",\n\
      \    \"//third_party/android_deps:protobuf_lite_runtime_java\",\n    \"//third_party/androidx:androidx_test_runner_java\"\
      ,\n    \"//third_party/jni_zero:jni_zero_java\",\n    \"//third_party/junit\",\n    \"//third_party/mockito:mockito_java\"\
      ,\n  ]\n}"
    replace: "if (is_android) {\n  group(\"junit\") {\n    testonly = true\n  }\n} else {\n  robolectric_library(\"junit\"\
      ) {\n    sources = [ \"java/src/org/chromium/components/optimization_guide/content/PageContentProtoProviderBridgeUnitTest.java\"\
      \ ]\n    deps = [\n      \":optimization_guide_content_java\",\n      \"//base:base_java\",\n      \"//base:base_java_test_support\"\
      ,\n      \"//base:base_junit_test_support\",\n      \"//components/optimization_guide/proto:optimization_guide_proto_java\"\
      ,\n      \"//content/public/android:content_java\",\n      \"//content/public/test/android:content_java_test_support\"\
      ,\n      \"//third_party/android_deps:protobuf_lite_runtime_java\",\n      \"//third_party/androidx:androidx_test_runner_java\"\
      ,\n      \"//third_party/jni_zero:jni_zero_java\",\n      \"//third_party/junit\",\n      \"//third_party/mockito:mockito_java\"\
      ,\n    ]\n  }\n}"
  count: 1
- description: Apply the pinned GN formatter spelling to this new empty Android group
  regex:
    pattern: '  group("optimization_guide_content_java") {}'
    replace: "  group(\"optimization_guide_content_java\") {\n  }"
  count: 1
- description: Apply the pinned GN formatter spelling to this new empty Android group
  regex:
    pattern: '  group("jni_headers") {}'
    replace: "  group(\"jni_headers\") {\n  }"
  count: 1
