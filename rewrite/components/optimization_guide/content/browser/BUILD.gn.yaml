substitutions:
- description: Exclude Android AI producer/metadata implementation while preserving all four plain-text source files
  regex:
    pattern: "    \"page_text_observer.h\",\n  ]\n"
    replace: "    \"page_text_observer.h\",\n  ]\n\n  if (is_android) {\n    sources -= [\n      \"autofill_annotations_provider.cc\"\
      ,\n      \"autofill_annotations_provider.h\",\n      \"media_transcript_provider.cc\",\n      \"media_transcript_provider.h\"\
      ,\n      \"page_content_image_extractor.cc\",\n      \"page_content_image_extractor.h\",\n      \"page_content_metadata_observer.cc\"\
      ,\n      \"page_content_metadata_observer.h\",\n      \"page_content_proto_provider.cc\",\n      \"page_content_proto_provider.h\"\
      ,\n      \"page_content_proto_util.cc\",\n      \"page_content_proto_util.h\",\n    ]\n  }\n"
  count: 1
- description: Remove the Android AI proto JNI producer and generated-header dependency
  regex:
    pattern: "  if (is_android) {\n    sources += [ \"page_content_proto_provider_bridge.cc\" ]\n    public_deps += [ \"android:jni_headers\"\
      \ ]\n  }\n"
    replace: ''
  count: 1
- description: Remove the dedicated page-content core dependency from the remaining Android plain-text target
  regex:
    pattern: '  configs += [ "//build/config/compiler:wexit_time_destructors" ]

      '
    replace: "  configs += [ \"//build/config/compiler:wexit_time_destructors\" ]\n  if (is_android) {\n    public_deps -=\
      \ [ \"//components/optimization_guide/core:page_content\" ]\n  }\n"
  count: 1
- description: Exclude the dedicated page_context_eligibility_api implementation and dependencies on Android; preserve its
    desktop target
  regex:
    pattern: "source_set(\"page_context_eligibility_api\") {\n  public = [ \"page_context_eligibility_api.h\" ]\n  sources\
      \ = [ \"page_context_eligibility_api.cc\" ]\n}"
    replace: "if (is_android) {\n  group(\"page_context_eligibility_api\") {}\n} else {\n  source_set(\"page_context_eligibility_api\"\
      ) {\n    public = [ \"page_context_eligibility_api.h\" ]\n    sources = [ \"page_context_eligibility_api.cc\" ]\n  }\n\
      }"
  count: 1
- description: Exclude the dedicated page_context_eligibility implementation and dependencies on Android; preserve its desktop
    target
  regex:
    pattern: "static_library(\"page_context_eligibility\") {\n  public = [\n    \"page_context_eligibility.h\",\n    \"page_context_eligibility_observer.h\"\
      ,\n  ]\n  sources = [\n    \"page_context_eligibility.cc\",\n    \"page_context_eligibility_observer.cc\",\n  ]\n\n\
      \  public_deps = [\n    \":browser\",\n    \":page_context_eligibility_api\",\n    \"//base\",\n    \"//components/optimization_guide/core:optimization_guide_library_holder\"\
      ,\n  ]\n\n  # On desktop, the internal library is built as a runtime data dependency.\n  # On Android, it is packaged\
      \ into the Chrome APK/bundle via loadable_modules\n  # and dynamically loaded at runtime by OptimizationGuideLibraryHolder.\n\
      \  if (build_with_internal_optimization_guide && !is_android) {\n    data_deps = [\n      \"//components/optimization_guide/internal:optimization_guide_internal\"\
      ,\n    ]\n  }\n}"
    replace: "if (is_android) {\n  group(\"page_context_eligibility\") {}\n} else {\n  static_library(\"page_context_eligibility\"\
      ) {\n    public = [\n      \"page_context_eligibility.h\",\n      \"page_context_eligibility_observer.h\",\n    ]\n\
      \    sources = [\n      \"page_context_eligibility.cc\",\n      \"page_context_eligibility_observer.cc\",\n    ]\n\n\
      \    public_deps = [\n      \":browser\",\n      \":page_context_eligibility_api\",\n      \"//base\",\n      \"//components/optimization_guide/core:optimization_guide_library_holder\"\
      ,\n    ]\n\n    # On desktop, the internal library is built as a runtime data dependency.\n    # On Android, it is packaged\
      \ into the Chrome APK/bundle via loadable_modules\n    # and dynamically loaded at runtime by OptimizationGuideLibraryHolder.\n\
      \    if (build_with_internal_optimization_guide && !is_android) {\n      data_deps = [\n        \"//components/optimization_guide/internal:optimization_guide_internal\"\
      ,\n      ]\n    }\n  }\n}"
  count: 1
- description: Exclude the dedicated test_support implementation and dependencies on Android; preserve its desktop target
  regex:
    pattern: "source_set(\"test_support\") {\n  testonly = true\n  sources = [\n    \"mock_autofill_annotations_provider.cc\"\
      ,\n    \"mock_autofill_annotations_provider.h\",\n    \"mock_media_transcript_provider.cc\",\n    \"mock_media_transcript_provider.h\"\
      ,\n    \"no_response_ai_page_content_agent.cc\",\n    \"no_response_ai_page_content_agent.h\",\n    \"page_content_test_utils.cc\"\
      ,\n    \"page_content_test_utils.h\",\n  ]\n  public_deps = [\n    \":browser\",\n    \"//base\",\n    \"//content/public/browser\"\
      ,\n    \"//mojo/public/cpp/bindings\",\n    \"//services/service_manager/public/cpp\",\n    \"//testing/gmock\",\n \
      \ ]\n}"
    replace: "if (is_android) {\n  group(\"test_support\") {\n    testonly = true\n  }\n} else {\n  source_set(\"test_support\"\
      ) {\n    testonly = true\n    sources = [\n      \"mock_autofill_annotations_provider.cc\",\n      \"mock_autofill_annotations_provider.h\"\
      ,\n      \"mock_media_transcript_provider.cc\",\n      \"mock_media_transcript_provider.h\",\n      \"no_response_ai_page_content_agent.cc\"\
      ,\n      \"no_response_ai_page_content_agent.h\",\n      \"page_content_test_utils.cc\",\n      \"page_content_test_utils.h\"\
      ,\n    ]\n    public_deps = [\n      \":browser\",\n      \"//base\",\n      \"//content/public/browser\",\n      \"\
      //mojo/public/cpp/bindings\",\n      \"//services/service_manager/public/cpp\",\n      \"//testing/gmock\",\n    ]\n\
      \  }\n}"
  count: 1
- description: Confine AI fixture TensorFlow compiler configuration to desktop
  regex:
    pattern: "  _configs = configs\n  configs = []\n  configs = [ \"//third_party/tflite:tflite_shim_config\" ] + _configs\n"
    replace: "  if (!is_android) {\n    _configs = configs\n    configs = []\n    configs = [ \"//third_party/tflite:tflite_shim_config\"\
      \ ] + _configs\n  }\n"
  count: 1
- description: Preserve the two ordinary plain-text unit tests while excluding four AI-specific cases
  regex:
    pattern: "    \"page_text_observer_unittest.cc\",\n  ]\n"
    replace: "    \"page_text_observer_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"media_transcript_provider_unittest.cc\"\
      ,\n      \"page_content_proto_util_unittest.cc\",\n      \"page_context_eligibility_observer_unittest.cc\",\n      \"\
      page_context_eligibility_unittest.cc\",\n    ]\n  }\n"
  count: 1
- description: Remove dependencies used only by excluded AI unit tests from the Android plain-text test target
  regex:
    pattern: "    \"//third_party/tflite_support:tflite_support_proto\",\n  ]\n"
    replace: "    \"//third_party/tflite_support:tflite_support_proto\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"\
      :page_context_eligibility\",\n      \":test_support\",\n      \"//third_party/tflite\",\n      \"//third_party/tflite:tflite_public_headers\"\
      ,\n      \"//third_party/tflite_support\",\n      \"//third_party/tflite_support:tflite_support_proto\",\n    ]\n  }\n"
  count: 1
- description: Apply the pinned GN formatter spelling to this new empty Android group
  regex:
    pattern: '  group("page_context_eligibility_api") {}'
    replace: "  group(\"page_context_eligibility_api\") {\n  }"
  count: 1
- description: Apply the pinned GN formatter spelling to this new empty Android group
  regex:
    pattern: '  group("page_context_eligibility") {}'
    replace: "  group(\"page_context_eligibility\") {\n  }"
  count: 1
- description: Apply the pinned GN formatter blank-line normalization at the modified Android dependency block
  regex:
    pattern: "    public_deps -= [ \"//components/optimization_guide/core:page_content\" ]\n  }\n\n}"
    replace: "    public_deps -= [ \"//components/optimization_guide/core:page_content\" ]\n  }\n}"
  count: 1
