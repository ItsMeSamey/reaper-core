substitutions:
- description: Exclude dedicated generative test support or broker IPC target definitions on Android
  regex:
    pattern: "mojom(\"mojom\") {\n  sources = [\n    \"model_broker.mojom\",\n    \"model_broker_debug.mojom\",\n  ]\n  webui_module_path\
      \ = \"/\"\n\n  deps = [\n    \"//mojo/public/mojom/base\",\n    \"//mojo/public/mojom/base:protobuf_support\",\n   \
      \ \"//services/on_device_model/public/mojom\",\n  ]\n}\n"
    replace: "if (!is_android) {\n  mojom(\"mojom\") {\n    sources = [\n      \"model_broker.mojom\",\n      \"model_broker_debug.mojom\"\
      ,\n    ]\n    webui_module_path = \"/\"\n\n    deps = [\n      \"//mojo/public/mojom/base\",\n      \"//mojo/public/mojom/base:protobuf_support\"\
      ,\n      \"//services/on_device_model/public/mojom\",\n    ]\n  }\n}\n"
  count: 1
