substitutions:
- description: Exclude complete Notebook-owned target definitions from Android
  regex:
    re_pattern: 'build_webui\("build"\)\ \{\

      \ \ grd_prefix\ =\ "notebooks_internals"\

      \

      \ \ static_files\ =\ \[\ "notebooks_internals\.html"\ \]\

      \

      \ \ css_files\ =\ \[\ "app\.css"\ \]\

      \

      \ \ ts_files\ =\ \[\

      \ \ \ \ "app\.html\.ts",\

      \ \ \ \ "app\.ts",\

      \ \ \]\

      \

      \ \ mojo_files_deps\ =\

      \ \ \ \ \ \ \[\ "//components/notebooks/internals/webui:mojo_bindings_ts__generator"\
      \]\

      \ \ mojo_files\ =\ \[\ "\$root_gen_dir/components/notebooks/internals/webui/notebooks_internals\.mojom\-webui\.ts"\
      \]\

      \

      \ \ ts_composite\ =\ true\

      \ \ ts_deps\ =\ \[\

      \ \ \ \ "//third_party/lit/v3_0:build_ts",\

      \ \ \ \ "//ui/webui/resources/js:build_ts",\

      \ \ \ \ "//ui/webui/resources/mojo:build_ts",\

      \ \ \]\

      \

      \ \ webui_context_type\ =\ "trusted"\

      \ \ grit_output_dir\ =\ "\$root_gen_dir/components"\

      \}\

      '
    replace: "if (!is_android) {\n  build_webui(\"build\") {\n    grd_prefix = \"\
      notebooks_internals\"\n\n    static_files = [ \"notebooks_internals.html\" ]\n\
      \n    css_files = [ \"app.css\" ]\n\n    ts_files = [\n      \"app.html.ts\"\
      ,\n      \"app.ts\",\n    ]\n\n    mojo_files_deps =\n        [ \"//components/notebooks/internals/webui:mojo_bindings_ts__generator\"\
      \ ]\n    mojo_files = [ \"$root_gen_dir/components/notebooks/internals/webui/notebooks_internals.mojom-webui.ts\"\
      \ ]\n\n    ts_composite = true\n    ts_deps = [\n      \"//third_party/lit/v3_0:build_ts\"\
      ,\n      \"//ui/webui/resources/js:build_ts\",\n      \"//ui/webui/resources/mojo:build_ts\"\
      ,\n    ]\n\n    webui_context_type = \"trusted\"\n    grit_output_dir = \"$root_gen_dir/components\"\
      \n  }\n}\n"
  count: 1
