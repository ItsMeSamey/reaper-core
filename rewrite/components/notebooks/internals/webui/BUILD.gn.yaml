substitutions:
- description: Exclude complete Notebook-owned target definitions from Android
  regex:
    re_pattern: 'mojom\("mojo_bindings"\)\ \{\

      \ \ sources\ =\ \[\ "notebooks_internals\.mojom"\ \]\

      \ \ webui_module_path\ =\ "/"\

      \ \ public_deps\ =\ \[\ "//url/mojom:url_mojom_gurl"\ \]\

      \}\

      \

      source_set\("webui"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "notebooks_internals_page_handler\.cc",\

      \ \ \ \ "notebooks_internals_page_handler\.h",\

      \ \ \ \ "notebooks_internals_ui\.cc",\

      \ \ \ \ "notebooks_internals_ui\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\ ":mojo_bindings"\ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//components/notebooks/internals/webui/resources",\

      \ \ \ \ "//components/notebooks/public",\

      \ \ \ \ "//content/public/browser",\

      \ \ \ \ "//ui/webui",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \ \ sources\ =\ \[\ "notebooks_internals_page_handler_unittest\.cc"\ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":webui",\

      \ \ \ \ "//base/test:test_support",\

      \ \ \ \ "//components/notebooks/public",\

      \ \ \ \ "//testing/gtest",\

      \ \ \ \ "//url",\

      \ \ \]\

      \}\

      '
    replace: "if (!is_android) {\n  mojom(\"mojo_bindings\") {\n    sources = [ \"\
      notebooks_internals.mojom\" ]\n    webui_module_path = \"/\"\n    public_deps\
      \ = [ \"//url/mojom:url_mojom_gurl\" ]\n  }\n\n  source_set(\"webui\") {\n \
      \   sources = [\n      \"notebooks_internals_page_handler.cc\",\n      \"notebooks_internals_page_handler.h\"\
      ,\n      \"notebooks_internals_ui.cc\",\n      \"notebooks_internals_ui.h\"\
      ,\n    ]\n\n    public_deps = [ \":mojo_bindings\" ]\n\n    deps = [\n     \
      \ \"//components/notebooks/internals/webui/resources\",\n      \"//components/notebooks/public\"\
      ,\n      \"//content/public/browser\",\n      \"//ui/webui\",\n    ]\n  }\n\n\
      \  source_set(\"unit_tests\") {\n    testonly = true\n    sources = [ \"notebooks_internals_page_handler_unittest.cc\"\
      \ ]\n\n    deps = [\n      \":webui\",\n      \"//base/test:test_support\",\n\
      \      \"//components/notebooks/public\",\n      \"//testing/gtest\",\n    \
      \  \"//url\",\n    ]\n  }\n}\n"
  count: 1
