substitutions:
- description: Exclude complete Notebook-owned target definitions from Android
  regex:
    re_pattern: 'group\("unit_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//components/notebooks/internal:unit_tests",\

      \ \ \ \ "//components/notebooks/public:unit_tests",\

      \ \ \]\

      \

      \ \ if\ \(use_blink\)\ \{\

      \ \ \ \ deps\ \+=\ \[\ "//components/notebooks/internals/webui:unit_tests"\
      \]\

      \ \ \}\

      \}\

      '
    replace: "if (!is_android) {\n  group(\"unit_tests\") {\n    testonly = true\n\
      \n    deps = [\n      \"//components/notebooks/internal:unit_tests\",\n    \
      \  \"//components/notebooks/public:unit_tests\",\n    ]\n\n    if (use_blink)\
      \ {\n      deps += [ \"//components/notebooks/internals/webui:unit_tests\" ]\n\
      \    }\n  }\n}\n"
  count: 1
