substitutions:
- description: Exclude complete Notebook-owned target definitions from Android
  regex:
    re_pattern: 'source_set\("public"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "features\.cc",\

      \ \ \ \ "features\.h",\

      \ \ \ \ "notebook\.cc",\

      \ \ \ \ "notebook\.h",\

      \ \ \ \ "notebook_id\.h",\

      \ \ \ \ "notebooks_constants\.h",\

      \ \ \ \ "notebooks_eligibility_service\.h",\

      \ \ \ \ "notebooks_network_service\.cc",\

      \ \ \ \ "notebooks_network_service\.h",\

      \ \ \ \ "notebooks_service\.cc",\

      \ \ \ \ "notebooks_service\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//components/keyed_service/core",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \

      \ \ visibility\ =\ \[\ "//components/notebooks:unit_tests"\ \]\

      \

      \ \ sources\ =\ \[\ "notebook_unittest\.cc"\ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":public",\

      \ \ \ \ "//base",\

      \ \ \ \ "//testing/gtest",\

      \ \ \]\

      \}\

      '
    replace: "if (!is_android) {\n  source_set(\"public\") {\n    sources = [\n  \
      \    \"features.cc\",\n      \"features.h\",\n      \"notebook.cc\",\n     \
      \ \"notebook.h\",\n      \"notebook_id.h\",\n      \"notebooks_constants.h\"\
      ,\n      \"notebooks_eligibility_service.h\",\n      \"notebooks_network_service.cc\"\
      ,\n      \"notebooks_network_service.h\",\n      \"notebooks_service.cc\",\n\
      \      \"notebooks_service.h\",\n    ]\n\n    public_deps = [\n      \"//base\"\
      ,\n      \"//components/keyed_service/core\",\n    ]\n  }\n\n  source_set(\"\
      unit_tests\") {\n    testonly = true\n\n    visibility = [ \"//components/notebooks:unit_tests\"\
      \ ]\n\n    sources = [ \"notebook_unittest.cc\" ]\n\n    deps = [\n      \"\
      :public\",\n      \"//base\",\n      \"//testing/gtest\",\n    ]\n  }\n}\n"
  count: 1
