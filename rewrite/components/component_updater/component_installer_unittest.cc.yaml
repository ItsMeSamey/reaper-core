substitutions:
  - description: "Match Android component test mocks to retained updater interface (1)"
    count: 1
    regex:
      re_pattern: "\\#include\\ \"build/branding_buildflags\\.h\"\\\n"
      replace: "#include \"build/branding_buildflags.h\"\n#include \"build/build_config.h\"\n"
  - description: "Match Android component test mocks to retained updater interface (2)"
    count: 1
    regex:
      re_pattern: "\\ \\ MOCK_METHOD\\(void,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ SendPing,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\(const\\ CrxComponent\\&\\ crx_component,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ PingParams\\ ping_params,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ Callback\\ callback\\),\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\(override\\)\\);\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(void,\n              SendPing,\n              (const CrxComponent& crx_component,\n               PingParams ping_params,\n               Callback callback),\n              (override));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
