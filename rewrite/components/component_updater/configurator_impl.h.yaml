substitutions:
- description: No Android ping-option state
  regex:
    pattern: '  const bool pings_enabled_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const bool pings_enabled_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/containers/flat_map.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/containers/flat_map.h"

      '
  count: 1
