# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/component_updater/installer_policies/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "trust_token_key_commitments_component_installer_policy\.cc",\

      \ \ \ \ "trust_token_key_commitments_component_installer_policy\.h",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//base",\

      '
    replace: "    \"trust_token_key_commitments_component_installer_policy.cc\",\n    \"trust_token_key_commitments_component_installer_policy.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"actor_safety_lists_component_installer.cc\",\n      \"actor_safety_lists_component_installer.h\",\n    ]\n  }\n\n  deps = [\n    \"//base\",\n"
- description: 'Android concrete AI source/provider removal: components/component_updater/installer_policies/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//mojo/public/cpp/base:protobuf_support",\

      \ \ \ \ "//services/network/public/cpp",\

      \ \ \]\

      \

      \ \ \#\ Disallow\ depending\ on\ content\.\

      \ \ assert_no_deps\ =\ \[\ "//content/public"\ \]\

      '
    replace: "    \"//mojo/public/cpp/base:protobuf_support\",\n    \"//services/network/public/cpp\",\n  ]\n  if (is_android) {\n    deps -= [ \"//components/actor/core\" ]\n  }\n\n  # Disallow depending on content.\n  assert_no_deps = [ \"//content/public\" ]\n"
- description: 'Android concrete AI source/provider removal: components/component_updater/installer_policies/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "private_verification_tokens_installer_policy_unittest\.cc",\

      \ \ \ \ "trust_token_key_commitments_component_installer_policy_unittest\.cc",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":installer_policies",\

      '
    replace: "    \"private_verification_tokens_installer_policy_unittest.cc\",\n    \"trust_token_key_commitments_component_installer_policy_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [ \"actor_safety_lists_component_installer_policy_unittest.cc\" ]\n  }\n\n  deps = [\n    \":installer_policies\",\n"
- description: 'Android history AI430: components/component_updater/installer_policies/BUILD.gn step 1'
  regex:
    pattern: "    \"//url\",\n  ]"
    replace: "    \"//url\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//components/history_embeddings/core\",\n    ]\n  }"
  count: 1
- description: 'Android history AI430: components/component_updater/installer_policies/BUILD.gn step 2'
  regex:
    pattern: "    \"trust_token_key_commitments_component_installer_policy_unittest.cc\",\n  ]"
    replace: "    \"trust_token_key_commitments_component_installer_policy_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"history_search_strings_component_installer_unittest.cc\",\n    ]\n  }"
  count: 1
- description: 'Android history AI430: components/component_updater/installer_policies/BUILD.gn step 3'
  regex:
    pattern: "    \"//third_party/zlib/google:zip\",\n  ]"
    replace: "    \"//third_party/zlib/google:zip\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//components/history_embeddings/core\",\n    ]\n  }"
  count: 1
- description: 'Android history AI430: components/component_updater/installer_policies/BUILD.gn step 4'
  regex:
    pattern: "    \"prediction_model_component_installer.h\",\n  ]"
    replace: "    \"prediction_model_component_installer.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"history_search_strings_component_installer.cc\",\n      \"history_search_strings_component_installer.h\",\n    ]\n  }"
  count: 1
