substitutions:
- description: Do not initialize a removed Android reporting option
  regex:
    pattern: '      pings_enabled_(config_policy.PingsEnabled()),

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      pings_enabled_(config_policy.PingsEnabled()),\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: The retained configurator exposes no Android event-report endpoints
  regex:
    pattern: '  return pings_enabled_ ? UpdateUrl() : std::vector<GURL>();

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  return {};\n#else\n  return pings_enabled_ ? UpdateUrl() : std::vector<GURL>();\n\
      #endif\n"
  count: 1
