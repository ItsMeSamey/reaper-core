substitutions:
- description: Confine the seven dedicated MerchantTrust messages to non-Android resource generation, preserving each message
    byte.
  regex:
    pattern: '  <!-- Merchant trust strings -->

      '
    replace: "  <!-- Merchant trust strings -->\n  <if expr=\"not is_android\">\n"
  count: 1
- description: Close the non-Android MerchantTrust resource block before ordinary History messages.
  regex:
    pattern: "  <message name=\"IDS_PAGE_INFO_MERCHANT_TRUST_REVIEWS_SUMMARY_TITLE\" desc=\"The title of the reviews summary\
      \ section of the merchant trust feature in the page info\">\n    What people are saying\n  </message>\n"
    replace: "  <message name=\"IDS_PAGE_INFO_MERCHANT_TRUST_REVIEWS_SUMMARY_TITLE\" desc=\"The title of the reviews summary\
      \ section of the merchant trust feature in the page info\">\n    What people are saying\n  </message>\n  </if>\n"
  count: 1
