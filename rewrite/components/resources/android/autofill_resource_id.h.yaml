# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android optional search-spark and accessory message resource removal: components/resources/android/autofill_resource_id.h'
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.drawable\.ic_outline_email_24dp\)\

      \

      //\ AtMemory\ search\ icon\.\

      DECLARE_RESOURCE_ID\(IDR_ANDROID_AUTOFILL_SEARCH_SPARK,\ R\.drawable\.search_spark\)\

      DECLARE_RESOURCE_ID\(IDR_ANDROID_AUTOFILL_SAD_TAB,\ R\.drawable\.autofill_sad_tab\)\

      DECLARE_RESOURCE_ID\(IDR_ANDROID_AUTOFILL_SETTINGS,\ R\.drawable\.ic_chrome\)\

      '
    replace: '                    R.drawable.ic_outline_email_24dp)


      // AtMemory search icon.

      DECLARE_RESOURCE_ID(IDR_ANDROID_AUTOFILL_SAD_TAB, R.drawable.autofill_sad_tab)

      DECLARE_RESOURCE_ID(IDR_ANDROID_AUTOFILL_SETTINGS, R.drawable.ic_chrome)

      '
