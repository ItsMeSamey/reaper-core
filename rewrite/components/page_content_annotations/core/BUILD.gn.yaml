      \ ]\n  deps = [\n    \":core\",\n    \"//base\",\n    \"//base/test:test_support\",\n  ]\n}"
    replace: "if (is_android) {\n  group(\"optimization_guide_page_visibility_model_fuzzer\") {\n    testonly = true\n  }\n\
      } else {\n  fuzzer_test(\"optimization_guide_page_visibility_model_fuzzer\") {\n    sources = [ \"page_visibility_model_fuzzer.cc\"\
      \ ]\n    deps = [\n      \":core\",\n      \"//base\",\n      \"//base/test:test_support\",\n    ]\n  }\n}"
