- description: Exclude the PCA-only test_support target on Android while preserving its desktop definition.
  regex:
    pattern: "static_library(\"test_support\") {\n  testonly = true\n  sources = [\n    \"test_page_content_annotations_service.cc\"\
      ,\n    \"test_page_content_annotations_service.h\",\n    \"test_page_content_annotator.cc\",\n    \"test_page_content_annotator.h\"\
      ,\n  ]\n  deps = [\n    \":core\",\n    \":features\",\n    \"//components/history/core/test\",\n    \"//components/optimization_guide/core:test_support\"\
      ,\n    \"//testing/gtest\",\n  ]\n}"
    replace: "if (is_android) {\n  group(\"test_support\") {\n    testonly = true\n  }\n} else {\n  static_library(\"test_support\"\
      ) {\n    testonly = true\n    sources = [\n      \"test_page_content_annotations_service.cc\",\n      \"test_page_content_annotations_service.h\"\
      ,\n      \"test_page_content_annotator.cc\",\n      \"test_page_content_annotator.h\",\n    ]\n    deps = [\n      \"\
      :core\",\n      \":features\",\n      \"//components/history/core/test\",\n      \"//components/optimization_guide/core:test_support\"\
      ,\n      \"//testing/gtest\",\n    ]\n  }\n}"
  count: 1
- description: Exclude the PCA-only unit_tests target on Android while preserving its desktop definition.
  regex:
    pattern: "source_set(\"unit_tests\") {\n  testonly = true\n  sources = [\n    \"category_classifier_model_handler_unittest.cc\"\
      ,\n    \"on_device_category_classifier_unittest.cc\",\n    \"page_content_annotation_job_executor_unittest.cc\",\n \
      \   \"page_content_annotation_job_unittest.cc\",\n    \"page_content_annotations_common_unittest.cc\",\n    \"page_content_annotations_features_unittest.cc\"\
      ,\n    \"page_content_annotations_service_unittest.cc\",\n    \"page_content_annotations_validator_unittest.cc\",\n\
      \    \"page_content_cache_unittest.cc\",\n    \"page_content_store_unittest.cc\",\n    \"page_visibility_model_handler_unittest.cc\"\
      ,\n  ]\n\n  # crbug.com/1279884 Flaky on CrOS\n  if (!is_chromeos) {\n    sources += [ \"page_content_annotations_model_manager_unittest.cc\"\
      \ ]\n  }\n  deps = [\n    \":core\",\n    \":features\",\n    \":test_support\",\n    \"//base/test:test_support\",\n\
      \    \"//components/history/core/test\",\n    \"//components/optimization_guide/core:test_support\",\n    \"//components/passage_embeddings/core:passage_embeddings_types\"\
      ,\n    \"//components/search_engines:test_support\",\n    \"//testing/gmock\",\n    \"//testing/gtest\",\n  ]\n  if\
      \ (is_ios) {\n    deps += [ \"//components/test:page_content_annotations_test_bundle_data\" ]\n  }\n}"
    replace: "if (is_android) {\n  group(\"unit_tests\") {\n    testonly = true\n  }\n} else {\n  source_set(\"unit_tests\"\
      ) {\n    testonly = true\n    sources = [\n      \"category_classifier_model_handler_unittest.cc\",\n      \"on_device_category_classifier_unittest.cc\"\
      ,\n      \"page_content_annotation_job_executor_unittest.cc\",\n      \"page_content_annotation_job_unittest.cc\",\n\
      \      \"page_content_annotations_common_unittest.cc\",\n      \"page_content_annotations_features_unittest.cc\",\n\
      \      \"page_content_annotations_service_unittest.cc\",\n      \"page_content_annotations_validator_unittest.cc\",\n\
      \      \"page_content_cache_unittest.cc\",\n      \"page_content_store_unittest.cc\",\n      \"page_visibility_model_handler_unittest.cc\"\
      ,\n    ]\n\n    # crbug.com/1279884 Flaky on CrOS\n    if (!is_chromeos) {\n      sources += [ \"page_content_annotations_model_manager_unittest.cc\"\
      \ ]\n    }\n    deps = [\n      \":core\",\n      \":features\",\n      \":test_support\",\n      \"//base/test:test_support\"\
      ,\n      \"//components/history/core/test\",\n      \"//components/optimization_guide/core:test_support\",\n      \"\
      //components/passage_embeddings/core:passage_embeddings_types\",\n      \"//components/search_engines:test_support\"\
      ,\n      \"//testing/gmock\",\n      \"//testing/gtest\",\n    ]\n    if (is_ios) {\n      deps += [ \"//components/test:page_content_annotations_test_bundle_data\"\
      \ ]\n    }\n  }\n}"
  count: 1
- description: Exclude the PCA-only optimization_guide_page_visibility_model_fuzzer target on Android while preserving its
