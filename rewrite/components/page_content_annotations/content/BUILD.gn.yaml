- description: Exclude the dedicated page_embeddings implementation and dependencies on Android; preserve its desktop target
  regex:
    pattern: "source_set(\"page_embeddings\") {\n  sources = [\n    \"embeddings_candidate_generator.cc\",\n    \"embeddings_candidate_generator.h\"\
      ,\n    \"page_category_classifier_bridge_impl.cc\",\n    \"page_category_classifier_bridge_impl.h\",\n    \"page_embeddings_service.cc\"\
      ,\n    \"page_embeddings_service.h\",\n  ]\n\n  public_deps = [\n    \":content\",\n    \"//base\",\n    \"//components/keyed_service/core\"\
      ,\n    \"//components/passage_embeddings/core\",\n    \"//content/public/browser\",\n  ]\n\n  deps = [\n    \"//components/optimization_guide/proto:optimization_guide_proto\"\
      ,\n    \"//components/page_content_annotations/core\",\n    \"//components/passage_embeddings/core:passage_embeddings_types\"\
      ,\n    \"//services/passage_embeddings/public/mojom\",\n  ]\n}"
    replace: "if (is_android) {\n  group(\"page_embeddings\") {}\n} else {\n  source_set(\"page_embeddings\") {\n    sources\
      \ = [\n      \"embeddings_candidate_generator.cc\",\n      \"embeddings_candidate_generator.h\",\n      \"page_category_classifier_bridge_impl.cc\"\
      ,\n      \"page_category_classifier_bridge_impl.h\",\n      \"page_embeddings_service.cc\",\n      \"page_embeddings_service.h\"\
      ,\n    ]\n\n    public_deps = [\n      \":content\",\n      \"//base\",\n      \"//components/keyed_service/core\",\n\
      \      \"//components/passage_embeddings/core\",\n      \"//content/public/browser\",\n    ]\n\n    deps = [\n     \
      \ \"//components/optimization_guide/proto:optimization_guide_proto\",\n      \"//components/page_content_annotations/core\"\
      ,\n      \"//components/passage_embeddings/core:passage_embeddings_types\",\n      \"//services/passage_embeddings/public/mojom\"\
      ,\n    ]\n  }\n}"
  count: 1
- description: Exclude the dedicated test_support implementation and dependencies on Android; preserve its desktop target
  regex:
    pattern: "source_set(\"test_support\") {\n  testonly = true\n  sources = [\n    \"mock_page_content_services.cc\",\n \
      \   \"mock_page_content_services.h\",\n  ]\n\n  public_deps = [\n    \":content\",\n    \":page_embeddings\",\n    \"\
      //components/page_content_annotations/core\",\n    \"//testing/gmock\",\n  ]\n\n  deps = [\n    \"//base\",\n    \"\
      //components/optimization_guide/proto:optimization_guide_proto\",\n    \"//components/passage_embeddings/core:passage_embeddings_types\"\
      ,\n    \"//content/public/browser\",\n  ]\n}"
    replace: "if (is_android) {\n  group(\"test_support\") {\n    testonly = true\n  }\n} else {\n  source_set(\"test_support\"\
      ) {\n    testonly = true\n    sources = [\n      \"mock_page_content_services.cc\",\n      \"mock_page_content_services.h\"\
      ,\n    ]\n\n    public_deps = [\n      \":content\",\n      \":page_embeddings\",\n      \"//components/page_content_annotations/core\"\
      ,\n      \"//testing/gmock\",\n    ]\n\n    deps = [\n      \"//base\",\n      \"//components/optimization_guide/proto:optimization_guide_proto\"\
      ,\n      \"//components/passage_embeddings/core:passage_embeddings_types\",\n      \"//content/public/browser\",\n \
      \   ]\n  }\n}"
  count: 1
