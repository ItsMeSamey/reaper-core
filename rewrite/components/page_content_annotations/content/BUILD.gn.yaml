      ,\n      \"page_context_fetcher.cc\",\n      \"page_context_fetcher.h\",\n      \"page_context_fetcher_manager.cc\"\
      ,\n      \"page_context_fetcher_manager.h\",\n      \"page_context_fetcher_options.cc\",\n      \"page_context_fetcher_options.h\"\
      ,\n    ]\n\n    public_deps = [\n      \"//base\",\n      \"//components/content_extraction/content/browser\",\n   \
      \   \"//components/feature_engagement/public\",\n      \"//components/feature_engagement/public:feature_constants\"\
      ,\n      \"//components/optimization_guide/content/browser\",\n      \"//components/page_content_annotations/content/browser\"\
      ,\n      \"//components/paint_preview/browser\",\n      \"//components/paint_preview/common\",\n      \"//components/paint_preview/common/mojom\"\
      ,\n      \"//components/paint_preview/public\",\n      \"//components/viz/common\",\n      \"//content/public/browser\"\
      ,\n      \"//skia\",\n      \"//ui/gfx/geometry\",\n      \"//url\",\n    ]\n\n    deps = [\n      \":metrics\",\n \
      \     \"//components/continuous_search/browser\",\n      \"//components/optimization_guide/content/browser:page_context_eligibility\"\
      ,\n      \"//components/optimization_guide/core:page_content\",\n      \"//components/page_content_annotations/core\"\
      ,\n      \"//components/pdf/common:constants\",\n      \"//components/performance_manager/scenario_api\",\n      \"\
      //components/services/paint_preview_compositor/public/mojom\",\n      \"//pdf:buildflags\",\n    ]\n\n    if (enable_pdf)\
      \ {\n      deps += [\n        \"//components/pdf/browser\",\n        \"//pdf/mojom\",\n      ]\n    }\n  }\n}"
