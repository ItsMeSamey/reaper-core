substitutions:
- description: Exclude the dedicated metrics implementation and dependencies on Android; preserve its desktop target
  regex:
    pattern: "source_set(\"metrics\") {\n  sources = [\n    \"annotate_page_content_request_metrics.cc\",\n    \"annotate_page_content_request_metrics.h\"\
      ,\n    \"page_context_fetcher_metrics.cc\",\n    \"page_context_fetcher_metrics.h\",\n  ]\n  deps = [ \"//base\" ]\n\
      }"
    replace: "if (is_android) {\n  group(\"metrics\") {}\n} else {\n  source_set(\"metrics\") {\n    sources = [\n      \"\
      annotate_page_content_request_metrics.cc\",\n      \"annotate_page_content_request_metrics.h\",\n      \"page_context_fetcher_metrics.cc\"\
      ,\n      \"page_context_fetcher_metrics.h\",\n    ]\n    deps = [ \"//base\" ]\n  }\n}"
  count: 1
- description: Exclude the dedicated content implementation and dependencies on Android; preserve its desktop target
  regex:
    pattern: "source_set(\"content\") {\n  sources = [\n    \"annotate_page_content_request.cc\",\n    \"annotate_page_content_request.h\"\
      ,\n    \"page_content_annotations_web_contents_observer.cc\",\n    \"page_content_annotations_web_contents_observer.h\"\
      ,\n    \"page_content_extraction_service.cc\",\n    \"page_content_extraction_service.h\",\n    \"page_content_screenshot_service.cc\"\
      ,\n    \"page_content_screenshot_service.h\",\n    \"page_context_fetcher.cc\",\n    \"page_context_fetcher.h\",\n \
