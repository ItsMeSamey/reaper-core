substitutions:
  - description: Remove Android diagnostic collection and uploading while retaining Help and shared screenshots
    regex:
      pattern: "    \"//components/variations/net\",\n    \"//google_apis\",\n    \"//services/network/public/cpp\",\n    \"//third_party/re2\",\n    \"//third_party/zlib/google:zip\",\n  ]\n\n  if (is_chromeos) {\n    deps += [ \"//ash/constants/\" ]\n  }\n}\n\nsource_set(\"unit_tests\") {\n  testonly = true\n  sources = [\n    \"feedback_common_unittest.cc\",\n    \"feedback_data_unittest.cc\",\n    \"feedback_uploader_dispatch_unittest.cc\",\n    \"feedback_uploader_unittest.cc\",\n  ]\n"
      replace: "    \"//components/variations/net\",\n    \"//google_apis\",\n    \"//services/network/public/cpp\",\n    \"//third_party/re2\",\n    \"//third_party/zlib/google:zip\",\n  ]\n\n  if (is_chromeos) {\n    deps += [ \"//ash/constants/\" ]\n  }\n\n  if (is_android) {\n    # Reaper Android has no feedback submission service. Shared report constants,\n    # redaction, and local system-log utility types remain available.\n    sources -= [\n      \"feedback_data.cc\",\n      \"feedback_data.h\",\n      \"feedback_uploader.cc\",\n      \"feedback_uploader.h\",\n    ]\n  }\n}\n\nsource_set(\"unit_tests\") {\n  testonly = true\n  sources = [\n    \"feedback_common_unittest.cc\",\n    \"feedback_data_unittest.cc\",\n    \"feedback_uploader_dispatch_unittest.cc\",\n    \"feedback_uploader_unittest.cc\",\n  ]\n"
    count: 1
  - description: Remove Android diagnostic collection and uploading while retaining Help and shared screenshots
    regex:
      pattern: "    \"//components/sync_preferences:test_support\",\n    \"//components/user_prefs\",\n    \"//components/variations:test_support\",\n    \"//components/variations/net\",\n    \"//net:test_support\",\n    \"//services/network:test_support\",\n    \"//services/network/public/cpp\",\n    \"//testing/gmock\",\n    \"//testing/gtest\",\n  ]\n}\n\nif (!is_ios) {\n  fuzzer_test(\"redaction_tool_fuzzer\") {\n    sources = [ \"redaction_tool_fuzzer.cc\" ]\n    deps = [\n      \":feedback\",\n      \"//components/feedback/redaction_tool\",\n    ]\n    dict = \"redaction_tool_fuzzer.dict\"\n"
      replace: "    \"//components/sync_preferences:test_support\",\n    \"//components/user_prefs\",\n    \"//components/variations:test_support\",\n    \"//components/variations/net\",\n    \"//net:test_support\",\n    \"//services/network:test_support\",\n    \"//services/network/public/cpp\",\n    \"//testing/gmock\",\n    \"//testing/gtest\",\n  ]\n\n  if (is_android) {\n    sources -= [\n      \"feedback_data_unittest.cc\",\n      \"feedback_uploader_dispatch_unittest.cc\",\n      \"feedback_uploader_unittest.cc\",\n    ]\n  }\n}\n\nif (!is_ios) {\n  fuzzer_test(\"redaction_tool_fuzzer\") {\n    sources = [ \"redaction_tool_fuzzer.cc\" ]\n    deps = [\n      \":feedback\",\n      \"//components/feedback/redaction_tool\",\n    ]\n    dict = \"redaction_tool_fuzzer.dict\"\n"
    count: 1
