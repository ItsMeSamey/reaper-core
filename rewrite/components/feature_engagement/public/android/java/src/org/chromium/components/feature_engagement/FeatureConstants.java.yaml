substitutions:
- description: Remove dedicated Android bookmark save-flow IPH feature registration
  regex:
    pattern: '    FeatureConstants.SHOPPING_LIST_SAVE_FLOW_FEATURE,

      '
    replace: ''
  count: 1
- description: Remove dedicated Android bookmark save-flow IPH feature registration
  regex:
    pattern: "    /** An IPH that shows in the bookmark save flow when bookmarking a product. */\n    String SHOPPING_LIST_SAVE_FLOW_FEATURE\
      \ = \"IPH_ShoppingListSaveFlow\";\n\n"
    replace: ''
  count: 1
- description: Remove retired Android shopping-menu or merchant PageInfo IPH registration
  regex:
    pattern: '    FeatureConstants.PAGE_INFO_STORE_INFO_FEATURE,

      '
    replace: ''
  count: 1
- description: Remove retired Android shopping-menu or merchant PageInfo IPH registration
  regex:
    pattern: '    FeatureConstants.SHOPPING_LIST_MENU_ITEM_FEATURE,

      '
    replace: ''
  count: 1
- description: Remove retired Android shopping-menu or merchant PageInfo IPH registration
  regex:
    pattern: "    /** An IPH feature to inform users about the StoreInfo feature in PageInfo. */\n    String PAGE_INFO_STORE_INFO_FEATURE\
      \ = \"IPH_PageInfoStoreInfo\";\n\n"
    replace: ''
  count: 1
- description: Remove retired Android shopping-menu or merchant PageInfo IPH registration
  regex:
    pattern: "    /**\n     * An IPH that shows when a page is detected to be shopping related that shows the user a menu\n\
      \     * item is available to track price.\n     */\n    String SHOPPING_LIST_MENU_ITEM_FEATURE = \"IPH_ShoppingListMenuItem\"\
      ;\n\n"
    replace: ''
  count: 1
