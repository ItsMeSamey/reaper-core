substitutions:
- description: Remove dedicated Android shopping-menu IPH client-side configuration with its retired registration
  regex:
    pattern: "  if (kIPHShoppingListMenuItemFeature.name == feature->name) {\n    // Allows a shopping list menu item IPH\
      \ to be displayed at most:\n    // * Once per week.\n    // * Up to 3 times per year.\n    // * And only as long as\
      \ the user has never initiated price tracking from\n    // the menu.\n    FeatureConfig config;\n    config.valid =\
      \ true;\n    config.availability = Comparator(ANY, 0);\n    config.session_rate = Comparator(EQUAL, 1);\n    config.trigger\
      \ = EventConfig(\"shopping_list_menu_item_iph_triggered\",\n                                 Comparator(EQUAL, 0), 7,\
      \ 7);\n    config.event_configs.insert(\n        EventConfig(\"shopping_list_menu_item_iph_triggered\",\n          \
      \          Comparator(LESS_THAN, 3), 360, 360));\n    config.used = EventConfig(\"shopping_list_track_price_from_menu\"\
      ,\n                              Comparator(EQUAL, 0), 360, 360);\n    return config;\n  }\n"
    replace: ''
  count: 1
