# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/omnibox_strings.grdp'
  regex:
    re_pattern: '\ \ <message\ name="IDS_ACC_OMNIBOX_SUGGESTION_TYPE_NAVIGATION"\ desc="Accessibility\ announcement\ for\ navigation\ suggestion\ type\."\ formatter_data="android_java">\

      \ \ \ \ Navigation\

      \ \ </message>\

      \ \ <message\ name="IDS_ACC_OMNIBOX_SUGGESTION_TYPE_CONVERSATION"\ desc="Accessibility\ announcement\ for\ conversation\ suggestion\ type\."\ formatter_data="android_java">\

      \ \ \ \ Conversation\

      \ \ </message>\

      \

      \ \ <!\-\-\ Accessibility\ templates\ for\ Grouped\ Omnibox\ Suggestions\ \-\->\

      \ \ <message\ name="IDS_ACC_OMNIBOX_SUGGESTION_IN_GROUP_WITH_TYPE"\ desc="Accessibility\ text\ for\ an\ omnibox\ suggestion\ in\ a\ specific\ group\.\ Speaks\ the\ suggestion\ title,\ suggestion\ type,\ its\ position\ within\ the\ group,\ and\ the\ group''s\ header\ if\ exists\."\ formatter_data="android_java">\

      '
    replace: "  <message name=\"IDS_ACC_OMNIBOX_SUGGESTION_TYPE_NAVIGATION\" desc=\"Accessibility announcement for navigation suggestion type.\" formatter_data=\"android_java\">\n    Navigation\n  </message>\n  <if expr=\"not is_android\">\n<message name=\"IDS_ACC_OMNIBOX_SUGGESTION_TYPE_CONVERSATION\" desc=\"Accessibility announcement for conversation suggestion type.\" formatter_data=\"android_java\">\n    Conversation\n  </message>\n</if>\n\n  <!-- Accessibility templates for Grouped Omnibox Suggestions -->\n  <message name=\"IDS_ACC_OMNIBOX_SUGGESTION_IN_GROUP_WITH_TYPE\" desc=\"Accessibility text for an omnibox suggestion in a specific group. Speaks the suggestion title, suggestion type, its position within the group, and the group's header if exists.\" formatter_data=\"android_java\">\n"

