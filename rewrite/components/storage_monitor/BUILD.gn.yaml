substitutions:

  - description: "Use the public-API Android volume monitor instead of desktop mount backends."
    regex:
      pattern: "  if (is_win) {\n    sources += [\n      \"storage_monitor_win.cc\","
      replace: "  if (is_android) {\n    sources += [\n      \"//brave/components/storage_monitor/android/storage_monitor_android.cc\",\n      \"//brave/components/storage_monitor/android/storage_monitor_android.h\",\n    ]\n    deps += [ \"//brave/components/storage_monitor/android:jni_headers\" ]\n  }\n\n  if (is_win) {\n    sources += [\n      \"storage_monitor_win.cc\","
