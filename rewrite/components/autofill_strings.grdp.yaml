  regex:
    pattern: "  <message name=\"IDS_AUTOFILL_AI_UPDATE_ENTITY_TO_WALLET_DIALOG_SUBTITLE\" desc=\"A description that appears beneath the Update title prompt asking users whether they want to update their data stored in Google Wallet. For example, the user previously saved information related to their passport. Now, the user is filling out a new form either with additional details associated with the passport or with different values than what was previously saved. The interface shows new or modified values at the top with blue dots to indicate they\u2019re new. Existing information associated with the passport that isn\u2019t changing appears at the bottom without blue dots. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data updated at this moment. This is a similar moment to updating a password or credit card with Chrome.\">\n    Your info is saved in <ph name=\"IDS_AUTOFILL_GOOGLE_WALLET_TITLE\">$1<ex>Google Wallet</ex></ph> for <ph name=\"ACCOUNT\">$2<ex>alexpark@gmail.com</ex></ph>\n  </message>\n"
    replace: "  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_UPDATE_ENTITY_TO_WALLET_DIALOG_SUBTITLE\" desc=\"A description that appears beneath the Update title prompt asking users whether they want to update their data stored in Google Wallet. For example, the user previously saved information related to their passport. Now, the user is filling out a new form either with additional details associated with the passport or with different values than what was previously saved. The interface shows new or modified values at the top with blue dots to indicate they\u2019re new. Existing information associated with the passport that isn\u2019t changing appears at the bottom without blue dots. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data updated at this moment. This is a similar moment to updating a password or credit card with Chrome.\">\n    Your info is saved in <ph name=\"IDS_AUTOFILL_GOOGLE_WALLET_TITLE\">$1<ex>Google Wallet</ex></ph> for <ph name=\"ACCOUNT\">$2<ex>alexpark@gmail.com</ex></ph>\n  </message>\n  </if>\n"
- description: "Android omits exact native Autofill AI/AtMemory resource definitions: IDS_AUTOFILL_AI_SAVE_ENTITY_TO_WALLET_DIALOG_SUBTITLE_NEW"
