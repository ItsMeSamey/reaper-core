      \ \ \ \ <message\ name="IDS_AUTOFILL_AI_SAVE_VEHICLE_ENTITY_DIALOG_TITLE_ANDROID"\ desc="The\ title\ of\ a\ dialog\ that\ prompts\ the\ user\ to\ save\ information\ they\ just\ filled\ in\ on\ a\ form\.\ For\ example,\ the\ user\ has\ filled\ in\ details\ related\ to\ their\ car\.\ When\ they\ click\ Submit,\ we\ offer\ to\ save\ the\ data\ in\ Chrome\.\ Depending\ on\ the\ form\ and\ what\ Chrome\ recognizes,\ there\ might\ be\ just\ one\ or\ several\ pieces\ of\ data\ saved\ at\ this\ moment\.\ This\ is\ a\ similar\ moment\ to\ saving\ a\ password\ or\ credit\ card\ with\ Chrome\.">\

