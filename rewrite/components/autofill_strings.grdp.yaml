      \ \ \ \ </message>\

      \ \ </if>\

      \

      \ \ <!\-\-\ FFR\ Dialog\ \-\->\

      '
    replace: "    <message name=\"IDS_AUTOFILL_AI_ENTITY_EDITOR_DATE_FIELD_YEAR_LABEL\" desc=\"The default value in the date field year picker in the editor dialog.\" formatter_data=\"android_java\">\n      Year\n    </message>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_ENTITY_EDITOR_INVALID_DATE_ERROR_MESSAGE\" desc=\"An error message that appears beneath a date picker in the case that the user doesn't add a full date. For example, the user sees this error if they set the month but not the day or year, or choose an invalid date like February 30.\" formatter_data=\"android_java\">\n      Check the date\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_ENTITY_EDITOR_REQUIRED_FIELD_ERROR_MESSAGE\" desc=\"An error message that appears beneath the required field in the entity editor if it was left blank by the user and the user tapped the 'Done' button.\" formatter_data=\"android_java\">\n      Enter <ph name=\"FIELD\">$1<ex>Passport number</ex></ph>\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_ENTITY_EDITOR_SINGLE_REQUIRED_FIELD_ERROR_MESSAGE\" desc=\"An error message that appears beneath the list of fields in the entity editor if a single required field was left blank by the user and the user tapped the 'Done' button.\" formatter_data=\"android_java\">\n      <ph name=\"FIELD_1\">$1<ex>Passport number</ex></ph> is required\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_ENTITY_EDITOR_TWO_REQUIRED_FIELDS_ERROR_MESSAGE\" desc=\"An error message that appears beneath the list of fields in the entity editor if any of the two required fields was left blank by the user and the user tapped the 'Done' button.\" formatter_data=\"android_java\">\n      <ph name=\"FIELD_1\">$1<ex>Passport number</ex></ph> or <ph name=\"FIELD_2\">$2<ex>Passport number</ex></ph> is required\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_ENTITY_EDITOR_THREE_REQUIRED_FIELDS_ERROR_MESSAGE\" desc=\"An error message that appears beneath the list of fields in the entity editor if any of the three required fields were left blank by the user and the user tapped the 'Done' button.\" formatter_data=\"android_java\">\n      <ph name=\"FIELD_1\">$1<ex>Passport number</ex></ph>, <ph name=\"FIELD_2\">$2<ex>Passport number</ex></ph> or <ph name=\"FIELD_3\">$3<ex>Passport number</ex></ph> is required\n    </message>\n    </if>\n  </if>\n\n  <!-- FFR Dialog -->\n"

- description: 'Android exact ten remaining optional Autofill message definitions: components/autofill_strings.grdp'
  regex:
    re_pattern: '\ \ </message>\

      \

      \ \ <!\-\-\ Iph\ \-\->\

      \ \ <message\ name="IDS_AUTOFILL_AI_OPT_IN_IPH_TITLE"\ desc="The\ title\ of\ a\ promotional\ bubble\ that\ is\ likely\ the\ user''s\ first\ engagement\ with\ enhanced\ autofill\.\ Many\ users\ are\ familiar\ with\ Chrome\ Autofill\ and\ use\ it\ to\ automatically\ fill\ in\ things\ like\ passwords\ and\ credit\ cards\.\ This\ service\ promoted\ on\ this\ screen\ frames\ the\ new\ service\ as\ the\ autofill\ that\ users\ are\ familiar\ with\ but\ better,\ because\ it''s\ powered\ by\ AI\ and\ can\ do\ more\ for\ you\.">\

      \ \ \ \ Autofill\ just\ got\ better\

      \ \ </message>\

      \ \ <if\ expr="not\ is_android">\

      \ \ <message\ name="IDS_AUTOFILL_AI_OPT_IN_IPH_BODY"\ desc="The\ body\ text\ in\ a\ promotional\ bubble\ that\ appears\ beneath\ the\ title:\ “Autofill\ just\ got\ better”\.\ \*\ “Turn\ on”:\ This\ new\ feature\ is\ opt\ in,\ so\ we\ want\ to\ encourage\ users\ to\ click\ “Go\ to\ settings”\ and\ turn\ the\ feature\ on\.\ “enhanced\ autofill”\ is\ what\ we''re\ calling\ this\ new\ feature\.\ We\ want\ users\ to\ associate\ the\ new\ feature\ with\ the\ familiar\ autofill\ functionality\ they''re\ already\ used\ to\ but\ want\ to\ convey\ how\ it''s\ different\ \(AI\)\.\ \*\ “automatically”\ should\ feel\ valuable\ to\ users\ as\ the\ autofill\ service\ is\ making\ tasks\ for\ them\ simpler\.\ \*\ “more\ fields”:\ the\ existing\ autofill\ functionality\ in\ Chrome\ covers\ things\ like\ passwords,\ credit\ cards,\ and\ building\ addresses\.\ With\ this\ new\ service,\ we\ can\ also\ cover\ 1\)\ passports,\ 2\)\ vehicles,\ and\ 3\)\ driver''s\ licenses\.">\

      \ \ \ \ Turn\ on\ enhanced\ autofill\ to\ automatically\ fill\ more\ fields\

      '
    replace: "  </message>\n\n  <!-- Iph -->\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_OPT_IN_IPH_TITLE\" desc=\"The title of a promotional bubble that is likely the user's first engagement with enhanced autofill. Many users are familiar with Chrome Autofill and use it to automatically fill in things like passwords and credit cards. This service promoted on this screen frames the new service as the autofill that users are familiar with but better, because it's powered by AI and can do more for you.\">\n    Autofill just got better\n  </message>\n  </if>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_OPT_IN_IPH_BODY\" desc=\"The body text in a promotional bubble that appears beneath the title: “Autofill just got better”. * “Turn on”: This new feature is opt in, so we want to encourage users to click “Go to settings” and turn the feature on. “enhanced autofill” is what we're calling this new feature. We want users to associate the new feature with the familiar autofill functionality they're already used to but want to convey how it's different (AI). * “automatically” should feel valuable to users as the autofill service is making tasks for them simpler. * “more fields”: the existing autofill functionality in Chrome covers things like passwords, credit cards, and building addresses. With this new service, we can also cover 1) passports, 2) vehicles, and 3) driver's licenses.\">\n    Turn on enhanced autofill to automatically fill more fields\n"
