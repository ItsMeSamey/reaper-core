      \ \ \ \ <message\ name="IDS_AUTOFILL_AI_SAVE_KNOWN_TRAVELER_NUMBER_ENTITY_DIALOG_TITLE_ANDROID"\ desc="The\ title\ of\ a\ dialog\ that\ prompts\ the\ user\ to\ save\ information\ they\ just\ filled\ in\ on\ a\ form\.\ For\ example,\ the\ user\ has\ filled\ in\ details\ related\ to\ their\ Known\ Traveler\ Number\.\ When\ they\ click\ Submit,\ we\ offer\ to\ save\ the\ data\ in\ Chrome\.\ Depending\ on\ the\ form\ and\ what\ Chrome\ recognizes,\ there\ might\ be\ just\ one\ or\ several\ pieces\ of\ data\ saved\ at\ this\ moment\.\ This\ is\ a\ similar\ moment\ to\ saving\ a\ password\ or\ credit\ card\ with\ Chrome\.\ This\ is\ designed\ for\ Known\ Traveler\ Numbers\ issued\ by\ the\ United\ States\ only\.\ For\ more\ info,\ see\ https://www\.tsa\.gov/travel/frequently\-asked\-questions/what\-known\-traveler\-number\-ktn\.">\

