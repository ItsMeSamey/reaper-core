tle of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save passport securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_PASSPORT_ENTITY_DIALOG_TITLE_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form.\">\n      Save passport securely\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_VEHICLE_ENTITY_DIALOG_TITLE_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save vehicle in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_VEHICLE_ENTITY_DIALOG_TITLE_VARIANT_1_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save vehicle securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_VEHICLE_ENTITY_DIALOG_TITLE_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form.\">\n      Save vehicle securely\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_KNOWN_TRAVELER_NUMBER_ENTITY_DIALOG_TITLE_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save KTN in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_KNOWN_TRAVELER_NUMBER_ENTITY_DIALOG_TITLE_VARIANT_1_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save KTN securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_KNOWN_TRAVELER_NUMBER_ENTITY_DIALOG_TITLE_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form.\">\n      Save KTN securely\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_REDRESS_NUMBER_ENTITY_DIALOG_TITLE_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save redress number in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_REDRESS_NUMBER_ENTITY_DIALOG_TITLE_VARIANT_1_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save redress number securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_REDRESS_NUMBER_ENTITY_DIALOG_TITLE_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form.\">\n      Save redress number securely\n    </message>\n    </if>\n\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_UPDATE_DRIVERS_LICENSE_ENTITY_DIALOG_TITLE\" desc=\"The title of a dialog that prompts the user to update information associated with something they have previously saved. For example, the user previously saved information related to their driver’s license. Now, the user is filling out a new form either with additional details associated with the driver’s license or with different values than what was previously saved. The interface shows new or modified values at the top with blue dots to indicate they’re new. Existing information associated with the driver’s license that isn’t