      \ \ \ \ <message\ name="IDS_AUTOFILL_AI_UPDATE_ENTITY_DIALOG_SUBTITLE"\ desc="A\ description\ that\ appears\ beneath\ the\ Update\ title\ prompt\ asking\ users\ whether\ they\ want\ to\ update\ their\ data\ stored\ locally\.\ For\ example,\ the\ user\ previously\ saved\ information\ related\ to\ their\ passport\.\ Now,\ the\ user\ is\ filling\ out\ a\ new\ form\ either\ with\ additional\ details\ associated\ with\ the\ passport\ or\ with\ different\ values\ than\ what\ was\ previously\ saved\.\ The\ interface\ shows\ new\ or\ modified\ values\ at\ the\ top\ with\ blue\ dots\ to\ indicate\ they’re\ new\.\ Existing\ information\ associated\ with\ the\ passport\ that\ isn’t\ changing\ appears\ at\ the\ bottom\ without\ blue\ dots\.\ Depending\ on\ the\ form\ and\ what\ Chrome\ recognizes,\ there\ might\ be\ just\ one\ or\ several\ pieces\ of\ data\ updated\ at\ this\ moment\.\ This\ is\ a\ similar\ moment\ to\ updating\ a\ password\ or\ credit\ card\ with\ Chrome\.">\

