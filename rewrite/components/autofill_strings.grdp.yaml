      \ \ <message\ name="IDS_AUTOFILL_AI_FFR_WHEN_ON_TITLE"\ desc="A\ sub\ title\ that\ highlights\ the\ benefits\ of\ using\ ‘enhanced\ autofill’\.\ ‘More\ fields’\ is\ referring\ to\ values\ in\ online\ forms\.\ The\ user\ can\ fill\ more\ fields\ faster\ because\ ‘enhanced\ autofill’\ supports\ more\ data\ types\ than\ standard\ autofill,\ including\ passports,\ driver’s\ licenses,\ and\ vehicles\.">\

      \ \ \ \ Fill\ more\ fields\ faster\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_FFR_WHEN_ON_DESCRIPTION"\ desc="Body\ text\ beneath\ the\ “Fill\ more\ fields\ faster”\ sub\ title\.\ This\ conveys\ the\ value\ of\ using\ ‘enhanced\ autofill’\.">\

      \ \ \ \ Enhanced\ autofill\ understands\ forms\ better\ and\ can\ autofill\ them\ faster\ for\ you\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_FFR_CONSIDER_DESCRIPTION"\ desc="Body\ text\ beneath\ the\ “Things\ to\ consider”\ sub\ title\.\ This\ describes\ to\ users\ things\ they\ might\ want\ to\ weigh\ before\ using\ this\ feature\.\ Ideally,\ we\ lead\ with\ ‘To\ offer\ suggestions’,\ because\ it\ redefines\ the\ value\ of\ ‘enhanced\ autofill’\ and\ offers\ a\ rationale\ for\ the\ data\ use\ that\ immediately\ follows\.\ The\ data\ used\ includes\ 1\)\ the\ URL\ of\ a\ page\ visited\ and\ 2\)\ the\ content\ of\ that\ page\.\ Both\ are\ shared\ from\ Chrome\ to\ a\ Google\ service\ that\ generates\ autofill\ suggestions\.\ Inludes\ a\ placeholder\ for\ a\ learn\ more\ link,\ \$1\ =\ IDS_AUTOFILL_AI_FFR_CONSIDER_LEARN_MORE">\

      \ \ \ \ To\ offer\ suggestions\ and\ improve\ this\ feature,\ the\ page’s\ URL\ and\ content\ are\ shared\ with\ Google\.\ Change\ your\ mind\ anytime\ and\ <ph\ name="LEARN_MORE">\$1<ex>learn\ more\ about\ enhanced\ autofill\ in\ settings</ex></ph>\.\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_FFR_CONSIDER_LEARN_MORE"\ desc="Link\ for\ the\ enhanced\ autofill\ settings\ page\ to\ learn\ more\ about\ this\ feature\.">\

      \ \ \ \ learn\ more\ about\ enhanced\ autofill\ in\ settings\

      \ \ </message>\

      \ \ <message\ name="IDS_SETTINGS_AUTOFILL_AI_AUTHENTICATION_TOGGLE_TITLE"\ desc="The\ title\ of\ the\ toggle\ shown\ in\ the\ settings\ page\ that\ allows\ managing\ the\ authentication\ requirement\ before\ seeings\ smarter\ form\ understanding\ settings\ sensitive\ fields,\ such\ as\ passport\ number\ and\ national\ id\ card\ number\."\ formatter_data="android_java">\

      \ \ \ \ Verify\ it’s\ you\ to\ autofill\ sensitive\ info\

      \ \ </message>\

      '
    replace: "\n  <!-- FFR Dialog -->\n  <!-- TODO: crbug.com/440488776 - Remove FFR strings once default availability is launched. -->\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_FFR_WHEN_ON_TITLE\" desc=\"A sub title that highlights the benefits of using ‘enhanced autofill’. ‘More fields’ is referring to values in online forms. The user can fill more fields faster because ‘enhanced autofill’ supports more data types than standard autofill, including passports, driver’s licenses, and vehicles.\">\n    Fill more fields faster\n  </message>\n  </if>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_FFR_WHEN_ON_DESCRIPTION\" desc=\"Body text beneath the “Fill more fields faster” sub title. This conveys the value of using ‘enhanced autofill’.\">\n    Enhanced autofill understands forms better and can autofill them faster for you\n  </message>\n  </if>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_FFR_CONSIDER_DESCRIPTION\" desc=\"Body text beneath the “Things to consider” sub title. This describes to users things they might want to weigh before using this feature. Ideally, we lead with ‘To offer suggestions’, because it redefines the value of ‘enhanced autofill’ and offers a rationale for the data use that immediately follows. The data used includes 1) the URL of a page visited and 2) the content of that page. Both are shared from Chrome to a Google service that generates autofill suggestions. Inludes a placeholder for a learn more link, $1 = IDS_AUTOFILL_AI_FFR_CONSIDER_LEARN_MORE\">\n    To offer suggestions and improve this feature, the page’s URL and content are shared with Google. Change your mind anytime and <ph name=\"LEARN_MORE\">$1<ex>learn more about enhanced autofill in settings</ex></ph>.\n  </message>\n  </if>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_FFR_CONSIDER_LEARN_MORE\" desc=\"Link for the enhanced autofill settings page to learn more about this feature.\">\n    learn more about enhanced autofill in settings\n  </message>\n  </if>\n  <message name=\"IDS_SETTINGS_AUTOFILL_AI_AUTHENTICATION_TOGGLE_TITLE\" desc=\"The title of the toggle shown in the settings page that allows managing the authentication requirement before seeings smarter form understanding settings sensitive fields, such as passport number and national id card number.\" formatter_data=\"android_java\">\n    Verify it’s you to autofill sensitive info\n  </message>\n"
