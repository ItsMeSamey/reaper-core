    replace: "  <message name=\"IDS_AUTOFILL_GOOGLE_WALLET_TITLE\" desc=\"The name of the Google Wallet product. This is displayed in some smarter form understanding save and update prompts as a link. Upon clicking the user is taken to a their wallet passes pages. For example the user would see 'Your info is saved to Google Wallet for elisa.beckett@gmail.com'\" formatter_data=\"android_java\">\n    Google Wallet\n  </message>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_UPDATE_ENTITY_TO_WALLET_DIALOG_SUBTITLE\" desc=\"A description that appears beneath the Update title prompt asking users whether they want to update their data stored in Google Wallet. For example, the user previously saved information related to their passport. Now, the user is filling out a new form either with additional details associated with the passport or with different values than what was previously saved. The interface shows new or modified values at the top with blue dots to indicate they’re new. Existing information associated with the passport that isn’t changing appears at the bottom without blue dots. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data updated at this moment. This is a similar moment to updating a password or credit card with Chrome.\">\n    Your info is saved in <ph name=\"IDS_AUTOFILL_GOOGLE_WALLET_TITLE\">$1<ex>Google Wallet</ex></ph> for <ph name=\"ACCOUNT\">$2<ex>alexpark@gmail.com</ex></ph>\n  </message>\n  </if>\n  <message name=\"IDS_AUTOFILL_AI_SAVE_ENTITY_TO_WALLET_DIALOG_SUBTITLE_NEW\" desc=\"A description that appears beneath the Save title prompt asking users whether they want to save their data to Google Wallet. This sentence essentially defines Autofill in Chrome. We prompt the user to save their information with Google Wallet with the promise that Chrome can then help the user fill out forms across devices more quickly using their saved info.\">\n    Save your info in <ph name=\"GOOGLE_WALLET_TITLE_1\">$1<ex>Google Wallet</ex></ph> and get things done faster, like filling forms across Google products. You can <ph name=\"MANAGE_INFO_LINK\">$2<ex>manage your info</ex></ph> in <ph name=\"GOOGLE_WALLET_TITLE_2\">$3<ex>Google Wallet</ex></ph> for <ph name=\"ACCOUNT\">$4<ex>alexpark@gmail.com</ex></ph>.\n  </message>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_SAVE_ENTITY_TO_WALLET_DIALOG_SUBTITLE_BRANDED\" desc=\"A description that appears beneath the Save title prompt asking users whether they want to save their data to Google Wallet, used when Google Wallet branding is already present in the title.\">\n    Save your info and get things done faster, like filling forms across Google products. You can <ph name=\"MANAGE_WALLET_SETTINGS_LINK\">$1<ex>manage your Wallet settings</ex></ph> for <ph name=\"ACCOUNT\">$2<ex>alexpark@gmail.com</ex></ph>.\n  </message>\n  </if>\n  <!-- Prompt strings used on Desktop -->\n  <if expr=\"not is_android\">\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_DRIVERS_LICENSE_ENTITY_DIALOG_TITLE\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user is renting a car and just filled in info about their driver’s license. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome.\">\n      Save driver's license\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_NATIONAL_ID_CARD_ENTITY_DIALOG_TITLE\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user is applying for a parking permit with their municipal government and fills out a form that requires their identity information. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome. Important: Avoid translations that refer to a single, specific government document. Instead try to find a general term that is inclusive of all identity cards that meet the definition below, including documents issued by foreign governments. DEFINITION OF “NATIONAL IDENTITY CARD”: The definition we use for this feature is: “An identity document that meets the following criteria: 1) Issued by the government 2) Primary purpose is proving a natural person's identity (as opposed to e.g. their residence) 3) Common form of identification that most people keep with them 4) Not a passport or driver’s license.” EXAMPLES: This definition would include https://www.service-public.fr/particuliers/vosdroits/N358?lang=en. It would not include a United States Social Security Number or https://www.bzst.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node.html. \">\n      Save ID card\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_ID_CARD_ENTITY_DIALOG_TITLE\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user is applying for a parking permit with their municipal government and fills out a form that requires their identity information. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome. Important: Avoid translations that refer to a single, specific government document. Instead try to find a general term that is inclusive of all identity cards that meet the definition below, including documents issued by foreign governments. DEFINITION OF “NATIONAL IDENTITY CARD”: The definition we use for this feature is: “An identity document that meets the following criteria: 1) Issued by the government 2) Primary purpose is proving a natural person's identity (as opposed to e.g. their residence) 3) Common form of identification that most people keep with them 4) Not a passport or driver’s license.” EXAMPLES: This definition would include https://www.service-public.fr/particuliers/vosdroits/N358?lang=en. It would not include a United States Social Security Number or https://www.bzst.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node.html. \">\n      Save ID card\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_PASSPORT_ENTITY_DIALOG_TITLE\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user is booking a flight and filled in their passport info in a form. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome.\">\n      Save passport\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_VEHICLE_ENTITY_DIALOG_TITLE\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user has filled in details related to their car. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome.\">\n      Save vehicle\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_KNOWN_TRAVELER_NUMBER_ENTITY_DIALOG_TITLE\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user has filled in details related to their Known Traveler Number. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome. This is designed for Known Traveler Numbers issued by the United States only. For more info, see https://www.tsa.gov/travel/frequently-asked-questions/what-known-traveler-number-ktn.\">\n      Save Known Traveler Number\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_REDRESS_NUMBER_ENTITY_DIALOG_TITLE\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user is booking a flight and is prompted to add their redress number. This field is designed for redress numbers issued by the United States only. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome.  This is similar to adding a Credit card to Chrome. Now a user can also save a “Redress number”. This is designed for redress numbers issued by the United States only. For more info, see https://www.dhs.gov/dhs-trip.\">\n      Save redress number\n    </message>\n    </if>\n\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_DRIVERS_LICENSE_ENTITY_DIALOG_TITLE_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save driver's license in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\"