- description: "Android omits exact native Autofill AI/AtMemory resource definitions: IDS_AUTOFILL_AT_MEMORY_SOURCE_ATTRIBUTION_PERSONAL_INTELLIGENCE, IDS_AUTOFILL_AT_MEMORY_NO_DATA, IDS_AUTOFILL_AT_MEMORY_AI_DISCLOSURE, IDS_AUTOFILL_AT_MEMORY_AI_DISCLOSURE_LINK, IDS_AUTOFILL_AT_MEMORY_NO_CONNECTION, IDS_AUTOFILL_AT_MEMORY_GENERIC_ERROR, IDS_AUTOFILL_AT_MEMORY_FETCH_ERROR_NOTIFICATION, IDS_AUTOFILL_AT_MEMORY_REAUTH_IN_PROGRESS_ERROR_NOTIFICATION, IDS_AUTOFILL_AT_MEMORY_SEARCH_AFFORDANCE_TITLE, IDS_AUTOFILL_AT_MEMORY_SEARCH_AFFORDANCE_SUBTITLE, IDS_AUTOFILL_AT_MEMORY_SEARCH_RESULTS_A11Y_ANNOUNCEMENT, IDS_AUTOFILL_AT_MEMORY_FETCHING, IDS_AUTOFILL_AT_MEMORY_FETCHING_FINDING_INFO_WITH_GEMINI, IDS_AUTOFILL_AT_MEMORY_FETCHING_REVIEWING_CONNECTED_APPS, IDS_AUTOFILL_AT_MEMORY_FETCHING_PUTTING_IT_TOGETHER, IDS_AUTOFILL_AT_MEMORY_LOADING_A11Y_ANNOUNCEMENT, IDS_AUTOFILL_AT_MEMORY_UNSUPPORTED_QUERY_TITLE, IDS_AUTOFILL_AT_MEMORY_UNSUPPORTED_QUERY_DESCRIPTION, IDS_AUTOFILL_AT_MEMORY_PREVIOUSLY_FILLED"
  count: 1
  regex:
    pattern: "  <message name=\"IDS_AUTOFILL_AT_MEMORY_SOURCE_ATTRIBUTION_PERSONAL_INTELLIGENCE\" desc=\"Attribution text for Gemini-sourced results.\">\n    Suggested by Gemini\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_NO_DATA\" desc=\"Message shown when no data is found in AtMemory search.\" translateable=\"false\">\n    Couldn't find this info\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_AI_DISCLOSURE\" desc=\"The text shown at the bottom of the AtMemory search popup to set user expectations regarding potential incorrect suggestions. $1 is the link text.\" translateable=\"false\">\n    Gemini is AI and can make mistakes. <ph name=\"LEARN_MORE\">$1</ph>\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_AI_DISCLOSURE_LINK\" desc=\"Link text for the AI disclosure that points to a settings page.\" translateable=\"false\">\n    More about relevant data sent to Google\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_NO_CONNECTION\" desc=\"Message shown when AtMemory search fails to connect to the server.\" translateable=\"false\">\n    Couldn't connect\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_GENERIC_ERROR\" desc=\"Message shown when AtMemory search fails due to a generic or internal error.\" translateable=\"false\">\n    Something went wrong\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_FETCH_ERROR_NOTIFICATION\" desc=\"A toast message appearing at the top of the screen when fetching AtMemory information fails.\" translateable=\"false\">\n    Something went wrong. Try again\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_REAUTH_IN_PROGRESS_ERROR_NOTIFICATION\" desc=\"A toast message appearing at the top of the screen when fetching AtMemory information fails due to reauth already in progress.\" translateable=\"false\">\n    Another verification is in progress. Try again later.\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_SEARCH_AFFORDANCE_TITLE\" desc=\"Title of the AtMemory search trigger affordance.\" translateable=\"false\">\n    Try searching in Chrome Memory\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_SEARCH_AFFORDANCE_SUBTITLE\" desc=\"Descriptor under the query for enhanced autofill. 'Gemini' is a brand name and should match standard branding guidelines across languages.\">\n    Find and fill with Gemini\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_SEARCH_RESULTS_A11Y_ANNOUNCEMENT\" is_accessibility_with_no_ui=\"true\" desc=\"Screen reader announcement when AtMemory search results are presented to the user.\" translateable=\"false\">\n    Search results available. Use up and down arrow keys to navigate.\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_FETCHING\" desc=\"Descriptor for the loading state when enhanced autofill is fetching results. 'Gemini' is a brand name and should match standard branding guidelines across languages.\">\n    Find and fill with Gemini\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_FETCHING_FINDING_INFO_WITH_GEMINI\" desc=\"Loading message shown while finding info with Gemini during enhanced autofill search.\" translateable=\"false\">\n    Finding info with Gemini...\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_FETCHING_REVIEWING_CONNECTED_APPS\" desc=\"Loading message shown while reviewing info from connected apps during enhanced autofill search.\" translateable=\"false\">\n    Reviewing info from Connected Apps...\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_FETCHING_PUTTING_IT_TOGETHER\" desc=\"Loading message shown while putting information together during enhanced autofill search.\" translateable=\"false\">\n    Putting it all together...\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_LOADING_A11Y_ANNOUNCEMENT\" is_accessibility_with_no_ui=\"true\" desc=\"Accessibility announcement read by screen readers when enhanced autofill is loading search results.\" translateable=\"false\">\n    Loading\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_UNSUPPORTED_QUERY_TITLE\" desc=\"This error message is to help users understand that enhanced autofill wasn't able to find and fill relevant info. The technical reason is that the query is not supported by enhanced autofill. It appears on the query results empty state.\">\n    Couldn't find this info\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_UNSUPPORTED_QUERY_DESCRIPTION\" desc=\"A linkout that suggests using Gemini for a broader search or query, as the current recall feature could not handle the request. This text is a verb phrase short for the longer phrase: 'Try submitting your query to the Gemini in Chrome side panel'.\">\n    Ask Gemini in Chrome instead\n  </message>\n  <message name=\"IDS_AUTOFILL_AT_MEMORY_PREVIOUSLY_FILLED\" desc=\"Title shown in the AtMemory suggestions above suggestions that was previously filled on this page.\" translateable=\"false\">\n    Previously filled\n  </message>\n"
