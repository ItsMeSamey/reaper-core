redress number securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_UPDATE_REDRESS_NUMBER_ENTITY_DIALOG_TITLE_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to update information associated with something they have previously saved.\">\n      Update redress number securely\n    </message>\n    </if>\n\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_UPDATE_ENTITY_DIALOG_SUBTITLE\" desc=\"A description that appears beneath the Update title prompt asking users whether they want to update their data stored locally. For example, the user previously saved information related to their passport. Now, the user is filling out a new form either with additional details associated with the passport or with different values than what was previously saved. The interface shows new or modified values at the top with blue dots to indicate they’re new. Existing information associated with the passport that isn’t changing appears at the bottom without blue dots. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data updated at this moment. This is a similar moment to updating a password or credit card with Chrome.\">\n      Saves to your device\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_ENTITY_DIALOG_SUBTITLE\" desc=\"A description that appears beneath the Save title prompt. This sentence essentially defines Autofill in Chrome. We prompt the user to save their information with Chrome with the promise that Chrome can then help the user fill out forms more quickly using their saved info.\">\n      Save your information and fill out forms faster. Saves to your device.\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_ENTITY_TO_WALLET_DIALOG_SUBTITLE\" desc=\"A description that appears beneath the Save title prompt asking users whether they want to save their data to Google Wallet. This sentence essentially defines Autofill in Chrome. We prompt the user to save their information with Google Wallet with the promise that Chrome can then help the user fill out forms across devices more quickly using their saved info.\">\n      Save your info to get things done faster, across Google products. Your info is saved to <ph name=\"IDS_AUTOFILL_GOOGLE_WALLET_TITLE\">$1<ex>Google Wallet</ex></ph> for <ph name=\"ACCOUNT\">$2<ex>alexpark@gmail.com</ex></ph>.\n    </message>\n    </if>\n    <message name=\"IDS_AUTOFILL_MANAGE_YOUR_INFO_LINK\" desc=\"Link text prompting users to manage their autofill information.\">\n      manage your info\n    </message>\n    <message name=\"IDS_AUTOFILL_MANAGE_YOUR_WALLET_SETTINGS_LINK\" desc=\"Link text prompting users to manage their Google Wallet settings.\">\n      manage your Wallet settings\n    </message>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_UPDATE_ENTITY_DIALOG_UPDATED_ATTRIBUTE_ACCESSIBLE_NAME\" desc=\"Used in entity update dialogs, as the accessible names for rows with updated attributes\">\n      <ph name=\"ATTRIBUTE_NAME\">$1<ex>Passport number</ex></ph> updated\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_UPDATE_ENTITY_DIALOG_NEW_ATTRIBUTE_ACCESSIBLE_NAME\" desc=\"Used in entity update dialogs, as the accessible names for rows with new attributes\">\n      <ph name=\"ATTRIBUTE_NAME\">$1<ex>Passport number</ex></ph> added\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_UPDATE_ENTITY_DIALOG_NEW_ATTRIBUTE_ACCESSIBLE_NAME_V2\" desc=\"Used in entity update dialogs, as the accessible names for rows with new attributes\">\n      <ph name=\"ATTRIBUTE_VALUE\">$1<ex>New York</ex></ph>, new\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_UPDATE_ENTITY_DIALOG_UPDATED_ATTRIBUTE_ACCESSIBLE_NAME_V2\" desc=\"Used in entity update dialogs, as the accessible names for rows with updated attributes\">\n      <ph name=\"ATTRIBUTE_VALUE\">$1<ex>Jan 1, 2035</ex></ph>, was <ph name=\"PREVIOUS_VALUE\">$2<ex>Jan 1, 2034</ex></ph>\n    </message>\n    </if>\n\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_WALLET_UPLOAD_THROBBER_ACCESSIBLE_NAME\" desc=\"Announced when the loading throbber during upload to Google Wallet is shown.\">\n      Saving your info...\n    </message>\n    </if>\n\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_LOCAL_SAVE_NOTIFICATION_TITLE\" desc=\"The title of an informational dialog. This dialog appears when a user attempts to save data (like a driver's license) to Google Wallet, but the request fails (e.g., due to server error or connection issues). The title clarifies that the information was not lost, but rather saved locally to the device instead.\">\n      Info saved to device only\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_LOCAL_SAVE_NOTIFICATION_DESCRIPTION\" desc=\"The body text of an informational dialog. The user sees this after a failed attempt to save to Google Wallet. 'Couldn't save...' acknowledges the server failure. 'Saved to Chrome...' confirms the safety of the data (local fallback). 'Chrome will offer...' sets expectations that the system will retry the cloud save the next time this data is accessed.\">\n      Couldn't save this info to your Google Wallet. It's saved to Chrome on this device instead. Chrome will offer to save it to Wallet next time you use it.\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_LOCAL_SAVE_NOTIFICATION_DISMISS_BUTTON_LABEL\" desc=\"A button on an informational dialog. Clicking this button dismisses the dialog. The user accepts that the data is saved locally for now.\">\n      Got it\n    </message>\n    </if>\n  </if>\n\n\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_WALLET_UPDATE_OR_MIGRATE_FAILURE_NOTIFICATION\" desc=\"A message that appears when an attempt to update or migrate data to Google Wallet fails.\">\n    Couldn't save to Google Wallet\n  </message>\n  </if>\n\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_FETCH_ENTITY_FAILURE_NOTIFICATION\" desc=\"A snackbar (toast) message appearing at the top of the screen. The user sees this error if they attempt to autofill information but the request fails due to network connectivity issues.\">\n    Trouble filling your info. Check your connection.\n  </message>\n  </if>\n\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_PRE_FETCH_ERROR_MESSAGE\" desc=\"A message that appears when prefetching Autofill AI entities fails.\">\n    Trouble filling your info\n  </message>\n  </if>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_PRE_FETCH_ERROR_MESSAGE_BUTTON_TEXT\" desc=\"A button that is shown in the message that appears when prefetching Autofill AI entities fails.\">\n    Got it\n  </message>\n  </if>\n\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_ENTITY_SUPPRESSION_UNDO_TOAST_TEXT\" desc=\"Text displayed in a toast notification when an Autofill AI suggestion has been removed by the user, explaining that the suggestion is removed and the original source data is not deleted.\" translateable=\"false\">\n    <!-- TODO(crbug.com/501036619): Make string translateable once finalized. -->\n    Suggestion removed. Your original source won't be deleted.\n  </message>\n  </if>\n\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_PRIVATE_INFERENCE_NOTICE_TITLE\" desc=\"A title of the notice that infroms the user that page content will be processed privately in the cloud.\">\n    Smarter autofill, kept private\n  </message>\n  </if>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_PRIVATE_INFERENCE_NOTICE_DESCRIPTION\" desc=\"A description text of the notice that infroms the user that page content will be processed privately in the cloud.\">\n    To better understand and fill forms, the content and URLs of the pages you visit can be processed in a private space in the cloud.\n  </message>\n  </if>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_PRIVATE_INFERENCE_NOTICE_PRIMARY_BUTTON_TEXT\" desc=\"A primary button text of the notice that infroms the user that page content will be processed privately in the cloud.\">\n    Got it\n  </message>\n  </if>\n  <message name=\"IDS_AUTOFILL_AI_PRIVATE_INFERENCE_NOTICE_PRIMARY_BUTTON_A11Y_LABEL\" is_accessibility_with_no_ui=\"true\" desc=\"Accessibility label for a standard acknowledgment button label to dismiss the informational notice. Clicking the button will close only the notice row, but not the whole popup.\">\n    Got it, close notice\n  </message>\n\n  <!-- Prompt strings used on Android -->\n  <if expr=\"is_android\">\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_DRIVERS_LICENSE_ENTITY_DIALOG_TITLE_ANDROID\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user is renting a car and just filled in info about their driver’s license. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome.\">\n      Save driver's license\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_NATIONAL_ID_CARD_ENTITY_DIALOG_TITLE_ANDROID\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user is applying for a parking permit with their municipal government and fills out a form that requires their identity information. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome. Important: Avoid translations that refer to a single, specific government document. Instead try to find a general term that is inclusive of all identity cards that meet the definition below, including documents issued by foreign governments. DEFINITION OF “NATIONAL IDENTITY CARD”: The definition we use for this feature is: “An identity document that meets the following criteria: 1) Issued by the government 2) Primary purpose is proving a natural person's identity (as opposed to e.g. their residence) 3) Common form of identification that most people keep with them 4) Not a passport or driver’s license.” EXAMPLES: This definition would include https://www.service-public.fr/particuliers/vosdroits/N358?lang=en. It would not include a United States Social Security Number or https://www.bzst.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node.html. \">\n      Save identity card\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_PASSPORT_ENTITY_DIALOG_TITLE_ANDROID\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user is booking a flight and filled in their passport info in a form. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome.\">\n      Save passport\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_VEHICLE_ENTITY_DIALOG_TITLE_ANDROID\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user has filled in details related to their car. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome.\">\n      Save vehicle\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_KNOWN_TRAVELER_NUMBER_ENTITY_DIALOG_TITLE_ANDROID\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user has filled in details related to their Known Traveler Number. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome. This is designed for Known Traveler Numbers issued by the United States only. For more info, see https://www.tsa.gov/travel/frequently-asked-questions/what-known-traveler-number-ktn.\">\n      Save Known Traveler Number\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_REDRESS_NUMBER_ENTITY_DIALOG_TITLE_ANDROID\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form. For example, the user is booking a flight and is prompted to add their redress number. This field is designed for redress numbers issued by the United States only. When they click Submit, we offer to save the data in Chrome. Depending on the form and what Chrome recognizes, there might be just one or several pieces of data saved at this moment. This is a similar moment to saving a password or credit card with Chrome.  This is similar to adding a Credit card to Chrome. Now a user can also save a “Redress number”. This is designed for redress numbers issued by the United States only. For more info, see https://www.dhs.gov/dhs-trip.\">\n      Save redress number\n    </message>\n    </if>\n\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_DRIVERS_LICENSE_ENTITY_DIALOG_TITLE_ANDROID_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save driver's license in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_DRIVERS_LICENSE_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_1_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save driver's license securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_DRIVERS_LICENSE_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form.\">\n      Save driver's license securely\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_NATIONAL_ID_CARD_ENTITY_DIALOG_TITLE_ANDROID_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save identity card in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_NATIONAL_ID_CARD_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_1_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save identity card securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_NATIONAL_ID_CARD_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form.\">\n      Save identity card securely\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_PASSPORT_ENTITY_DIALOG_TITLE_ANDROID_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save passport in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_PASSPORT_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_1_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save passport securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_PASSPORT_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form.\">\n      Save passport securely\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_VEHICLE_ENTITY_DIALOG_TITLE_ANDROID_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save vehicle in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_VEHICLE_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_1_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save vehicle securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_VEHICLE_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form.\">\n      Save vehicle securely\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_KNOWN_TRAVELER_NUMBER_ENTITY_DIALOG_TITLE_ANDROID_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save Known Traveler Number in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_KNOWN_TRAVELER_NUMBER_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_1_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save Known Traveler Number securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_KNOWN_TRAVELER_NUMBER_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form.\">\n      Save Known Traveler Number securely\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_REDRESS_NUMBER_ENTITY_DIALOG_TITLE_ANDROID_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save redress number in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_REDRESS_NUMBER_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_1_BRANDED\" desc=\"The title of a dialog that prompts the user to save information they just filled in on a form, with Google Wallet branding.\">\n      Save redress number securely in Google Wallet\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_REDRESS_NUMBER_ENTITY_DIALOG_TITLE_ANDROID_VARIANT_2_SECURELY\" desc=\"The title of a dialog that prompts the user to save information they just filled in on