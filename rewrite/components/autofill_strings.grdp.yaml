- description: "Android omits exact native Autofill AI/AtMemory resource definitions: IDS_AUTOFILL_AI_OPT_IN_IPH_BODY"
  count: 1
  regex:
    pattern: "  <message name=\"IDS_AUTOFILL_AI_OPT_IN_IPH_BODY\" desc=\"The body text in a promotional bubble that appears beneath the title: \u201cAutofill just got better\u201d. * \u201cTurn on\u201d: This new feature is opt in, so we want to encourage users to click \u201cGo to settings\u201d and turn the feature on. \u201cenhanced autofill\u201d is what we're calling this new feature. We want users to associate the new feature with the familiar autofill functionality they're already used to but want to convey how it's different (AI). * \u201cautomatically\u201d should feel valuable to users as the autofill service is making tasks for them simpler. * \u201cmore fields\u201d: the existing autofill functionality in Chrome covers things like passwords, credit cards, and building addresses. With this new service, we can also cover 1) passports, 2) vehicles, and 3) driver's licenses.\">\n    Turn on enhanced autofill to automatically fill more fields\n  </message>\n"
    replace: "  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_OPT_IN_IPH_BODY\" desc=\"The body text in a promotional bubble that appears beneath the title: \u201cAutofill just got better\u201d. * \u201cTurn on\u201d: This new feature is opt in, so we want to encourage users to click \u201cGo to settings\u201d and turn the feature on. \u201cenhanced autofill\u201d is what we're calling this new feature. We want users to associate the new feature with the familiar autofill functionality they're already used to but want to convey how it's different (AI). * \u201cautomatically\u201d should feel valuable to users as the autofill service is making tasks for them simpler. * \u201cmore fields\u201d: the existing autofill functionality in Chrome covers things like passwords, credit cards, and building addresses. With this new service, we can also cover 1) passports, 2) vehicles, and 3) driver's licenses.\">\n    Turn on enhanced autofill to automatically fill more fields\n  </message>\n  </if>\n"
