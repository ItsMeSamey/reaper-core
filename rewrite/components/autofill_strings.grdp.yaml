      \ \ \ \ <message\ name="IDS_AUTOFILL_AI_SAVE_DRIVERS_LICENSE_ENTITY_DIALOG_TITLE_ANDROID"\ desc="The\ title\ of\ a\ dialog\ that\ prompts\ the\ user\ to\ save\ information\ they\ just\ filled\ in\ on\ a\ form\.\ For\ example,\ the\ user\ is\ renting\ a\ car\ and\ just\ filled\ in\ info\ about\ their\ driver’s\ license\.\ When\ they\ click\ Submit,\ we\ offer\ to\ save\ the\ data\ in\ Chrome\.\ Depending\ on\ the\ form\ and\ what\ Chrome\ recognizes,\ there\ might\ be\ just\ one\ or\ several\ pieces\ of\ data\ saved\ at\ this\ moment\.\ This\ is\ a\ similar\ moment\ to\ saving\ a\ password\ or\ credit\ card\ with\ Chrome\.">\

      \ \ \ \ \ \ Save\ driver''s\ license\

      \ \ \ \ </message>\

      \ \ \ \ <message\ name="IDS_AUTOFILL_AI_SAVE_NATIONAL_ID_CARD_ENTITY_DIALOG_TITLE_ANDROID"\ desc="The\ title\ of\ a\ dialog\ that\ prompts\ the\ user\ to\ save\ information\ they\ just\ filled\ in\ on\ a\ form\.\ For\ example,\ the\ user\ is\ applying\ for\ a\ parking\ permit\ with\ their\ municipal\ government\ and\ fills\ out\ a\ form\ that\ requires\ their\ identity\ information\.\ When\ they\ click\ Submit,\ we\ offer\ to\ save\ the\ data\ in\ Chrome\.\ Depending\ on\ the\ form\ and\ what\ Chrome\ recognizes,\ there\ might\ be\ just\ one\ or\ several\ pieces\ of\ data\ saved\ at\ this\ moment\.\ This\ is\ a\ similar\ moment\ to\ saving\ a\ password\ or\ credit\ card\ with\ Chrome\.\ Important:\ Avoid\ translations\ that\ refer\ to\ a\ single,\ specific\ government\ document\.\ Instead\ try\ to\ find\ a\ general\ term\ that\ is\ inclusive\ of\ all\ identity\ cards\ that\ meet\ the\ definition\ below,\ including\ documents\ issued\ by\ foreign\ governments\.\ DEFINITION\ OF\ “NATIONAL\ IDENTITY\ CARD”:\ The\ definition\ we\ use\ for\ this\ feature\ is:\ “An\ identity\ document\ that\ meets\ the\ following\ criteria:\ 1\)\ Issued\ by\ the\ government\ 2\)\ Primary\ purpose\ is\ proving\ a\ natural\ person''s\ identity\ \(as\ opposed\ to\ e\.g\.\ their\ residence\)\ 3\)\ Common\ form\ of\ identification\ that\ most\ people\ keep\ with\ them\ 4\)\ Not\ a\ passport\ or\ driver’s\ license\.”\ EXAMPLES:\ This\ definition\ would\ include\ https://www\.service\-public\.fr/particuliers/vosdroits/N358\?lang=en\.\ It\ would\ not\ include\ a\ United\ States\ Social\ Security\ Number\ or\ https://www\.bzst\.de/EN/Private_individuals/Tax_identification_number/tax_identification_number_node\.html\.\ ">\

      \ \ \ \ \ \ Save\ identity\ card\

      \ \ \ \ </message>\

      \ \ \ \ <message\ name="IDS_AUTOFILL_AI_SAVE_PASSPORT_ENTITY_DIALOG_TITLE_ANDROID"\ desc="The\ title\ of\ a\ dialog\ that\ prompts\ the\ user\ to\ save\ information\ they\ just\ filled\ in\ on\ a\ form\.\ For\ example,\ the\ user\ is\ booking\ a\ flight\ and\ filled\ in\ their\ passport\ info\ in\ a\ form\.\ When\ they\ click\ Submit,\ we\ offer\ to\ save\ the\ data\ in\ Chrome\.\ Depending\ on\ the\ form\ and\ what\ Chrome\ recognizes,\ there\ might\ be\ just\ one\ or\ several\ pieces\ of\ data\ saved\ at\ this\ moment\.\ This\ is\ a\ similar\ moment\ to\ saving\ a\ password\ or\ credit\ card\ with\ Chrome\.">\

      \ \ \ \ \ \ Save\ passport\

