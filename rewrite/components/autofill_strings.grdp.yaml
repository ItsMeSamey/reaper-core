- description: 'Android excludes exact optional Autofill AI message definitions: components/autofill_strings.grdp'
  regex:
    re_pattern: '\ \ <message\ name="IDS_AUTOFILL_AI_OPT_IN_IPH_TITLE"\ desc="The\ title\ of\ a\ promotional\ bubble\ that\ is\ likely\ the\ user''s\ first\ engagement\ with\ enhanced\ autofill\.\ Many\ users\ are\ familiar\ with\ Chrome\ Autofill\ and\ use\ it\ to\ automatically\ fill\ in\ things\ like\ passwords\ and\ credit\ cards\.\ This\ service\ promoted\ on\ this\ screen\ frames\ the\ new\ service\ as\ the\ autofill\ that\ users\ are\ familiar\ with\ but\ better,\ because\ it''s\ powered\ by\ AI\ and\ can\ do\ more\ for\ you\.">\

      \ \ \ \ Autofill\ just\ got\ better\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_OPT_IN_IPH_BODY"\ desc="The\ body\ text\ in\ a\ promotional\ bubble\ that\ appears\ beneath\ the\ title:\ “Autofill\ just\ got\ better”\.\ \*\ “Turn\ on”:\ This\ new\ feature\ is\ opt\ in,\ so\ we\ want\ to\ encourage\ users\ to\ click\ “Go\ to\ settings”\ and\ turn\ the\ feature\ on\.\ “enhanced\ autofill”\ is\ what\ we''re\ calling\ this\ new\ feature\.\ We\ want\ users\ to\ associate\ the\ new\ feature\ with\ the\ familiar\ autofill\ functionality\ they''re\ already\ used\ to\ but\ want\ to\ convey\ how\ it''s\ different\ \(AI\)\.\ \*\ “automatically”\ should\ feel\ valuable\ to\ users\ as\ the\ autofill\ service\ is\ making\ tasks\ for\ them\ simpler\.\ \*\ “more\ fields”:\ the\ existing\ autofill\ functionality\ in\ Chrome\ covers\ things\ like\ passwords,\ credit\ cards,\ and\ building\ addresses\.\ With\ this\ new\ service,\ we\ can\ also\ cover\ 1\)\ passports,\ 2\)\ vehicles,\ and\ 3\)\ driver''s\ licenses\.">\

      \ \ \ \ Turn\ on\ enhanced\ autofill\ to\ automatically\ fill\ more\ fields\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_OPT_IN_IPH_TURN_ON"\ desc="The\ right\ of\ two\ buttons\ that’s\ the\ user’s\ path\ learning\ more\ and\ turning\ on\ enhanced\ autofill\.\ This\ button\ label\ should\ pair\ with\ the\ title\ \(in\ other\ words,\ assume\ the\ user\ doesn’t\ read\ the\ body\ text\.\ Does\ the\ title\ and\ primary\ button\ label\ make\ sense\ together\)\?">\

      \ \ \ \ Turn\ on\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_OPT_IN_IPH_MAYBE_LATER"\ desc="The\ left\ of\ two\ buttons\ that’s\ essentially\ the\ user’s\ path\ to\ not\ learning\ more\ or\ turning\ on\ enhanced\ autofill\.\ “Maybe\ later”\ conveys\ that\ the\ user\ won’t\ do\ it\ now\ but\ that\ they’ll\ have\ the\ choice\ to\ do\ it\ later\.\ Localizer\ has\ existing\ translations\ of\ this\ button\ label\.">\

      \ \ \ \ Maybe\ later\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_VALUABLES_IPH_TITLE"\ desc="IPH\ toast\ for\ a\ suggestion\ item\ with\ an\ item\ from\ Google\ Wallet\.">\

      \ \ \ \ Now\ you\ can\ autofill\ more\ info\ from\ Google\ Wallet\

      \ \ </message>\

      '
    replace: "  <message name=\"IDS_AUTOFILL_AI_OPT_IN_IPH_TITLE\" desc=\"The title of a promotional bubble that is likely the user's first engagement with enhanced autofill. Many users are familiar with Chrome Autofill and use it to automatically fill in things like passwords and credit cards. This service promoted on this screen frames the new service as the autofill that users are familiar with but better, because it's powered by AI and can do more for you.\">\n    Autofill just got better\n  </message>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_OPT_IN_IPH_BODY\" desc=\"The body text in a promotional bubble that appears beneath the title: “Autofill just got better”. * “Turn on”: This new feature is opt in, so we want to encourage users to click “Go to settings” and turn the feature on. “enhanced autofill” is what we're calling this new feature. We want users to associate the new feature with the familiar autofill functionality they're already used to but want to convey how it's different (AI). * “automatically” should feel valuable to users as the autofill service is making tasks for them simpler. * “more fields”: the existing autofill functionality in Chrome covers things like passwords, credit cards, and building addresses. With this new service, we can also cover 1) passports, 2) vehicles, and 3) driver's licenses.\">\n    Turn on enhanced autofill to automatically fill more fields\n  </message>\n  </if>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_OPT_IN_IPH_TURN_ON\" desc=\"The right of two buttons that’s the user’s path learning more and turning on enhanced autofill. This button label should pair with the title (in other words, assume the user doesn’t read the body text. Does the title and primary button label make sense together)?\">\n    Turn on\n  </message>\n  </if>\n  <if expr=\"not is_android\">\n  <message name=\"IDS_AUTOFILL_AI_OPT_IN_IPH_MAYBE_LATER\" desc=\"The left of two buttons that’s essentially the user’s path to not learning more or turning on enhanced autofill. “Maybe later” conveys that the user won’t do it now but that they’ll have the choice to do it later. Localizer has existing translations of this button label.\">\n    Maybe later\n  </message>\n  </if>\n  <message name=\"IDS_AUTOFILL_AI_VALUABLES_IPH_TITLE\" desc=\"IPH toast for a suggestion item with an item from Google Wallet.\">\n    Now you can autofill more info from Google Wallet\n  </message>\n"
- description: 'Android excludes exact optional Autofill AI message definitions: components/autofill_strings.grdp'
  regex:
    re_pattern: '\ \ <message\ name="IDS_AUTOFILL_GOOGLE_WALLET_TITLE"\ desc="The\ name\ of\ the\ Google\ Wallet\ product\.\ This\ is\ displayed\ in\ some\ smarter\ form\ understanding\ save\ and\ update\ prompts\ as\ a\ link\.\ Upon\ clicking\ the\ user\ is\ taken\ to\ a\ their\ wallet\ passes\ pages\.\ For\ example\ the\ user\ would\ see\ ''Your\ info\ is\ saved\ to\ Google\ Wallet\ for\ elisa\.beckett@gmail\.com''"\ formatter_data="android_java">\

      \ \ \ \ Google\ Wallet\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_UPDATE_ENTITY_TO_WALLET_DIALOG_SUBTITLE"\ desc="A\ description\ that\ appears\ beneath\ the\ Update\ title\ prompt\ asking\ users\ whether\ they\ want\ to\ update\ their\ data\ stored\ in\ Google\ Wallet\.\ For\ example,\ the\ user\ previously\ saved\ information\ related\ to\ their\ passport\.\ Now,\ the\ user\ is\ filling\ out\ a\ new\ form\ either\ with\ additional\ details\ associated\ with\ the\ passport\ or\ with\ different\ values\ than\ what\ was\ previously\ saved\.\ The\ interface\ shows\ new\ or\ modified\ values\ at\ the\ top\ with\ blue\ dots\ to\ indicate\ they’re\ new\.\ Existing\ information\ associated\ with\ the\ passport\ that\ isn’t\ changing\ appears\ at\ the\ bottom\ without\ blue\ dots\.\ Depending\ on\ the\ form\ and\ what\ Chrome\ recognizes,\ there\ might\ be\ just\ one\ or\ several\ pieces\ of\ data\ updated\ at\ this\ moment\.\ This\ is\ a\ similar\ moment\ to\ updating\ a\ password\ or\ credit\ card\ with\ Chrome\.">\

      \ \ \ \ Your\ info\ is\ saved\ in\ <ph\ name="IDS_AUTOFILL_GOOGLE_WALLET_TITLE">\$1<ex>Google\ Wallet</ex></ph>\ for\ <ph\ name="ACCOUNT">\$2<ex>alexpark@gmail\.com</ex></ph>\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_SAVE_ENTITY_TO_WALLET_DIALOG_SUBTITLE_NEW"\ desc="A\ description\ that\ appears\ beneath\ the\ Save\ title\ prompt\ asking\ users\ whether\ they\ want\ to\ save\ their\ data\ to\ Google\ Wallet\.\ This\ sentence\ essentially\ defines\ Autofill\ in\ Chrome\.\ We\ prompt\ the\ user\ to\ save\ their\ information\ with\ Google\ Wallet\ with\ the\ promise\ that\ Chrome\ can\ then\ help\ the\ user\ fill\ out\ forms\ across\ devices\ more\ quickly\ using\ their\ saved\ info\.">\

      \ \ \ \ Save\ your\ info\ in\ <ph\ name="GOOGLE_WALLET_TITLE_1">\$1<ex>Google\ Wallet</ex></ph>\ and\ get\ things\ done\ faster,\ like\ filling\ forms\ across\ Google\ products\.\ You\ can\ <ph\ name="MANAGE_INFO_LINK">\$2<ex>manage\ your\ info</ex></ph>\ in\ <ph\ name="GOOGLE_WALLET_TITLE_2">\$3<ex>Google\ Wallet</ex></ph>\ for\ <ph\ name="ACCOUNT">\$4<ex>alexpark@gmail\.com</ex></ph>\.\

      \ \ </message>\

      \ \ <message\ name="IDS_AUTOFILL_AI_SAVE_ENTITY_TO_WALLET_DIALOG_SUBTITLE_BRANDED"\ desc="A\ description\ that\ appears\ beneath\ the\ Save\ title\ prompt\ asking\ users\ whether\ they\ want\ to\ save\ their\ data\ to\ Google\ Wallet,\ used\ when\ Google\ Wallet\ branding\ is\ already\ present\ in\ the\ title\.">\

      \ \ \ \ Save\ your\ info\ and\ get\ things\ done\ faster,\ like\ filling\ forms\ across\ Google\ products\.\ You\ can\ <ph\ name="MANAGE_WALLET_SETTINGS_LINK">\$1<ex>manage\ your\ Wallet\ settings</ex></ph>\ for\ <ph\ name="ACCOUNT">\$2<ex>alexpark@gmail\.com</ex></ph>\.\

      \ \ </message>\

      \ \ <!\-\-\ Prompt\ strings\ used\ on\ Desktop\ \-\->\

      \ \ <if\ expr="not\ is_android">\

      \ \ \ \ <message\ name="IDS_AUTOFILL_AI_SAVE_DRIVERS_LICENSE_ENTITY_DIALOG_TITLE"\ desc="The\ title\ of\ a\ dialog\ that\ prompts\ the\ user\ to\ save\ information\ they\ just\ filled\ in\ on\ a\ form\.\ For\ example,\ the\ user\ is\ renting\ a\ car\ and\ just\ filled\ in\ info\ about\ their\ driver’s\ license\.\ When\ they\ click\ Submit,\ we\ offer\ to\ save\ the\ data\ in\ Chrome\.\ Depending\ on\ the\ form\ and\ what\ Chrome\ recognizes,\ there\ might\ be\ just\ one\ or\ several\ pieces\ of\ data\ saved\ at\ this\ moment\.\ This\ is\ a\ similar\ moment\ to\ saving\ a\ password\ or\ credit\ card\ with\ Chrome\.">\

