S_AUTOFILL_GOOGLE_WALLET_TITLE\">$1<ex>Google Wallet</ex></ph> for <ph name=\"ACCOUNT\">$2<ex>alexpark@gmail.com</ex></ph>\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_OR_UPDATE_LOCAL_ENTITY_SOURCE_NOTICE\" desc=\"A description that appears beneath the entity details notifying the user that their data is going to be stored locally on device.\" formatter_data=\"android_java\">\n      Your info is saved to your device\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_OR_UPDATE_ENTITY_IN_WALLET_SOURCE_NOTICE\" desc=\"A description that appears beneath the entity details notifying the user that their data is going to be stored in Google Wallet.\" formatter_data=\"android_java\">\n      Save your info in <ph name=\"IDS_AUTOFILL_GOOGLE_WALLET_TITLE_1\">$1<ex>Google Wallet</ex></ph> and get things done faster, like filling forms across Google products. You can <ph name=\"BEGIN_LINK\">&lt;link&gt;</ph>manage your info<ph name=\"END_LINK\">&lt;/link&gt;</ph> in <ph name=\"IDS_AUTOFILL_GOOGLE_WALLET_TITLE_2\">$2<ex>Google Wallet</ex></ph> for <ph name=\"ACCOUNT\">$3<ex>alexpark@gmail.com</ex></ph>\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_OR_UPDATE_ENTITY_NEW_ATTRIBUTE_ACCESSIBILITY_NAME\" desc=\"Used in entity update dialogs, as the accessible names for rows with new attributes\" formatter_data=\"android_java\">\n      <ph name=\"ATTRIBUTE_NAME\">$1<ex>Passport number</ex></ph>, new\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_OR_UPDATE_ENTITY_UPDATED_ATTRIBUTE_ACCESSIBILITY_NAME\" desc=\"Used in entity update dialogs, as the accessible names for rows with updated attributes\" formatter_data=\"android_java\">\n      <ph name=\"ATTRIBUTE_NAME\">$1<ex>Passport number</ex></ph>, was <ph name=\"OLD_ATTRIBUTE_ATTRIBUTE\">$2<ex>old value</ex></ph>\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_OR_UPDATE_ENTITY_NEW_ATTRIBUTE_WITH_BADGE\" desc=\"Used in entity update dialogs, as the special badge to indicate newly added attributes that were not saved before.\" formatter_data=\"android_java\">\n      <ph name=\"ATTRIBUTE_VALUE\">$1<ex>John Doe</ex></ph>  <ph name=\"BEGIN_NEW\">&lt;new&gt;</ph>New<ph name=\"END_NEW\">&lt;/new&gt;</ph>\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_OR_UPDATE_ENTITY_FAILED_WALLET_SAVE_DIALOG_TITLE\" desc=\"The title of the dialog shown when an entity (like passport, driver's license, etc) fails to be saved to Google Wallet.\" formatter_data=\"android_java\">\n      Info saved to device only\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SAVE_OR_UPDATE_ENTITY_FAILED_WALLET_SAVE_DIALOG_DESCRIPTION\" desc=\"The description text of the dialog shown when an entity (like passport, driver's license, etc) fails to be saved to Google Wallet.\" formatter_data=\"android_java\">\n      Chrome will offer to save it to <ph name=\"IDS_AUTOFILL_GOOGLE_WALLET_TITLE\">$1<ex>Google Wallet</ex></ph> next time you use it\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SNACK_BAR_CONFIRMATION_BUTTON_LABEL\" desc=\"The confirmation button text of the dialog shown when an entity (like passport, driver's license, etc) fails to be saved to Google Wallet.\" formatter_data=\"android_java\">\n      Got it\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_ENTITY_STORED_IN_GOOGLE_WALLET_ACCESSIBILITY_LABEL\" desc=\"The accessibility label used for entities listed in settings that are stored in Google Wallet.\" formatter_data=\"android_java\">\n      Stored in Google Wallet\n    </message>\n    </if>\n\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_LOADING_DIALOG_LABEL\" desc=\"The string shown in the loading dialog that is opened after successful user authentication. It's is informing the user about an ongoing request to fetch their data from the server.\">\n      Filling your info\n    </message>\n    </if>\n\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SUGGESTION_LONG_PRESS_DIALOG_DESCRIPTION\" desc=\"The description text shown in the dialog after the user long presses a suggestion in the keyboard accessory.\" formatter_data=\"android_java\">\n      Suggested by Gemini. Manage enhanced autofill in settings.\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SUGGESTION_LONG_PRESS_DIALOG_POSITIVE_BUTTON\" desc=\"The positive button shown in the dialog after the user long presses a suggestion in the keyboard accessory.\" formatter_data=\"android_java\">\n      Settings\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SUGGESTION_LONG_PRESS_DIALOG_NEGATIVE_BUTTON\" desc=\"The negative button shown in the dialog after the user long presses a suggestion in the keyboard accessory.\" formatter_data=\"android_java\">\n      Back\n    </message>\n    </if>\n\n    <!-- Autofill AI Suppression Dialog Strings (Android) -->\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SUPPRESSION_DIALOG_BODY\" desc=\"Description for the modal confirmation dialog on Android.\">\n      Suggested by Gemini · <ph name=\"SRC_LINK\">&lt;src_link&gt;</ph>View sources<ph name=\"END_SRC_LINK\">&lt;/src_link&gt;</ph>\nYou can remove this suggestion from Chrome. Your original source won't be deleted. <ph name=\"MANAGE_LINK\">&lt;manage_link&gt;</ph>Manage enhanced autofill<ph name=\"END_MANAGE_LINK\">&lt;/manage_link&gt;</ph>\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SUPPRESSION_DIALOG_PRIMARY_BUTTON\" desc=\"Label for the primary acknowledgment button in the Autofill AI suppression dialog on Android.\">\n      Got it\n    </message>\n    </if>\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_SUPPRESSION_DIALOG_SECONDARY_BUTTON\" desc=\"Label for the secondary suppression action button in the Autofill AI suppression dialog on Android.\">\n      Remove from Chrome\n    </message>\n    </if>\n  </if>\n\n  <!-- Entity editor strings used on Android -->\n  <if expr=\"is_android\">\n    <if expr=\"not is_android\">\n    <message name=\"IDS_AUTOFILL_AI_ENTITY_EDITOR_DELETE_LOCAL_ENTITY_DIALOG_TEXT\" desc=\"The text that appears beneath a 'Delete object' title. We want the 'Autofill' keyword to be as prominent as possible because that word captures the value of saved information. 'On this device': helps the user understand that information is saved locally, not in the Cloud.\" formatter_data=\"android_java\">\n      Autofill won't have this info on this device to help fill out forms\n    </message>\n    </if>\n    <message name=\"IDS_AUTOFILL_AI_ENTITY_EDITOR_DATE_FIELD_MONTH_LABEL\" desc=\"The default value in the date field month picker in the editor dialog.\" formatter_data=\"android_java\">\n      Month\n    </message>\n"
