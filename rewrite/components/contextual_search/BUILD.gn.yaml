# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/contextual_search/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//third_party/omnibox_proto",\

      \ \ \ \ "//url",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ ":types",\

      '
    replace: "    \"//third_party/omnibox_proto\",\n    \"//url\",\n  ]\n  if (is_android) {\n    deps -= [ \"//components/omnibox/composebox:mojo_bindings\" ]\n  }\n\n  public_deps = [\n    \":types\",\n"
