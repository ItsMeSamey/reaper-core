    replace: "\n  EXPECT_TRUE(message_dispatcher_bridge.IsMessagesEnabledForEmbedder());\n}\n\nTEST(MessageDispatcherBridgeTest,\n     DispatcherObserverLeaseUsesFirstAndLastSubscriber) {\n  MessageDispatcherBridgeForTesting bridge;\n  auto first = bridge.AddDispatcherChangedCallback(base::BindRepeating([] {}));\n  auto second = bridge.AddDispatcherChangedCallback(base::BindRepeating([] {}));\n  EXPECT_EQ(bridge.notifications_enabled, std::vector<bool>({true}));\n  first = {};\n  EXPECT_EQ(bridge.notifications_enabled, std::vector<bool>({true}));\n  second = {};\n  EXPECT_EQ(bridge.notifications_enabled, std::vector<bool>({true, false}));\n}\n\nTEST(MessageDispatcherBridgeTest,\n     DispatcherChangesReachOnlySubscribedCallbacks) {\n  MessageDispatcherBridgeForTesting bridge;\n  int first_count = 0;\n  int second_count = 0;\n  auto first = bridge.AddDispatcherChangedCallback(\n      base::BindRepeating([](int* count) { ++*count; }, &first_count));\n  auto second = bridge.AddDispatcherChangedCallback(\n      base::BindRepeating([](int* count) { ++*count; }, &second_count));\n  EXPECT_EQ(first_count, 0);\n  EXPECT_EQ(second_count, 0);\n  bridge.NotifyDispatcherChanged();\n  EXPECT_EQ(first_count, 1);\n  EXPECT_EQ(second_count, 1);\n  first = {};\n  bridge.NotifyDispatcherChanged();\n  EXPECT_EQ(first_count, 1);\n  EXPECT_EQ(second_count, 2);\n}\n\nTEST(MessageDispatcherBridgeTest,\n     DispatcherSubscriptionCanEndDuringNotification) {\n  MessageDispatcherBridgeForTesting bridge;\n  base::CallbackListSubscription subscription;\n  int count = 0;\n  subscription = bridge.AddDispatcherChangedCallback(base::BindRepeating(\n      [](base::CallbackListSubscription* subscription, int* count) {\n        ++*count;\n        *subscription = {};\n      },\n      &subscription, &count));\n  bridge.NotifyDispatcherChanged();\n  bridge.NotifyDispatcherChanged();\n  EXPECT_EQ(count, 1);\n  EXPECT_EQ(bridge.notifications_enabled, std::vector<bool>({true, false}));\n}\n\n}  // namespace messages\n"
