    replace: "// found in the LICENSE file.\n\npackage org.chromium.components.messages;\n\nimport androidx.annotation.VisibleForTesting;\n\nimport org.chromium.build.annotations.NullMarked;\nimport org.chromium.build.annotations.Nullable;\nimport org.chromium.content_public.browser.WebContents;\nimport org.chromium.ui.base.WindowAndroid;\nimport org.jni_zero.CalledByNative;\nimport org.jni_zero.JNINamespace;\nimport org.jni_zero.NativeMethods;\n\n/**\n * Java counterpart to MessageDispatcherBridge. Enables C++ feature code to enqueue/dismiss messages\n * with MessageDispatcher.\n */\n@JNINamespace(\"messages\")\n@NullMarked\npublic class MessageDispatcherBridge {\n    // Installed only by native subscribers, after native initialization.\n    private static final Runnable DISPATCHER_OBSERVER =\n            () -> MessageDispatcherBridgeJni.get().onMessageDispatcherChanged();\n\n    @CalledByNative\n    private static void setDispatcherNotificationsEnabled(boolean enabled) {\n        if (enabled) {\n            MessageDispatcherProvider.addObserver(DISPATCHER_OBSERVER);\n        } else {\n            MessageDispatcherProvider.removeObserver(DISPATCHER_OBSERVER);\n        }\n    }\n\n    @CalledByNative\n    private static @Nullable MessageDispatcher getMessageDispatcher(WindowAndroid windowAndroid) {\n        return MessageDispatcherProvider.from(windowAndroid);\n    }\n\n    /**\n     * Return false if it fails to enqueue message, which usually happens when\n     * activity is being recreated or destroyed; otherwise, return true.\n     */\n"
