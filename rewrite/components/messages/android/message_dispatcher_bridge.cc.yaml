    replace: "    ui::WindowAndroid* window_android,\n    MessagePriority priority) {\n  CHECK(!message->is_in_queue());\n  JNIEnv* env = base::android::AttachCurrentThread();\n  auto java_window_android = window_android->GetJavaObject();\n  if (Java_MessageDispatcherBridge_enqueueWindowScopedMessage(\n          env, message->GetJavaMessageWrapper(), java_window_android,\n          priority == MessagePriority::kUrgent) == JNI_TRUE) {\n    message->SetMessageEnqueued(java_window_android);\n    return true;\n  }\n  return false;\n}\n"
