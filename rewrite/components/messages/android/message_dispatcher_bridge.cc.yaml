    replace: "    MessageDispatcherBridge* instance) {\n  g_message_dospatcher_bridge_for_testing = instance;\n}\n\nMessageDispatcherBridge::MessageDispatcherBridge() {\n  dispatcher_callbacks_.set_removal_callback(base::BindRepeating(\n      &MessageDispatcherBridge::OnDispatcherCallbacksRemoved,\n      base::Unretained(this)));\n}\nMessageDispatcherBridge::~MessageDispatcherBridge() {\n  DCHECK(dispatcher_callbacks_.empty());\n}\n\nbase::CallbackListSubscription\nMessageDispatcherBridge::AddDispatcherChangedCallback(\n    base::RepeatingClosure callback) {\n  const bool was_empty = dispatcher_callbacks_.empty();\n  auto subscription = dispatcher_callbacks_.Add(std::move(callback));\n  if (was_empty) {\n    SetDispatcherNotificationsEnabled(true);\n  }\n  return subscription;\n}\n\nvoid MessageDispatcherBridge::OnDispatcherCallbacksRemoved() {\n  if (dispatcher_callbacks_.empty()) {\n    SetDispatcherNotificationsEnabled(false);\n  }\n}\n\nvoid MessageDispatcherBridge::SetDispatcherNotificationsEnabled(bool enabled) {\n  Java_MessageDispatcherBridge_setDispatcherNotificationsEnabled(\n      base::android::AttachCurrentThread(), enabled);\n}\n\nbase::android::ScopedJavaLocalRef<jobject>\nMessageDispatcherBridge::GetMessageDispatcher(\n    const base::android::JavaRef<jobject>& java_window_android) {\n  if (java_window_android.is_null()) {\n    return {};\n  }\n  return Java_MessageDispatcherBridge_getMessageDispatcher(\n      base::android::AttachCurrentThread(), java_window_android);\n}\n\nvoid MessageDispatcherBridge::NotifyDispatcherChanged() {\n  dispatcher_callbacks_.Notify();\n}\n\nstatic void JNI_MessageDispatcherBridge_OnMessageDispatcherChanged(JNIEnv*) {\n  MessageDispatcherBridge::Get()->NotifyDispatcherChanged();\n}\n\nbool MessageDispatcherBridge::EnqueueMessage(MessageWrapper* message,\n                                             content::WebContents* web_contents,\n                                             MessageScopeType scope_type,\n"
