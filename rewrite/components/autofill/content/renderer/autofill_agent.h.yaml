# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ AtMemoryHandler\ at_memory_handler_\{this\};\

      '
    replace: '  AtMemoryHandler at_memory_handler_{this};

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \}\ ask_for_values_to_fill_throttle_;\

      \

      '
    replace: '  } ask_for_values_to_fill_throttle_;


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ base::OneShotTimer\ inactivity_timer_;\

      '
    replace: '  base::OneShotTimer inactivity_timer_;

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ //\ losing\ focus\)\ for\ triggering\ the\ autosuggest\ nudge\.\

      '
    replace: '  // losing focus) for triggering the autosuggest nudge.

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ void\ OnInactivityTimerFired\(FieldRendererId\ field_id\);\

      '
    replace: '  void OnInactivityTimerFired(FieldRendererId field_id);

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ //\ implications\ due\ to\ the\ frequency\ of\ selectionchange\ events\.\

      '
    replace: '  // implications due to the frequency of selectionchange events.

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/content/renderer/at_memory_handler\.h"\

      '
    replace: '#include "components/autofill/content/renderer/at_memory_handler.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/content/common/mojom/autofill_driver\.mojom\.h"\

      '
    replace: '#include "components/autofill/content/common/mojom/autofill_driver.mojom.h"

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "base/types/strong_alias\.h"\

      '
    replace: '#include "base/types/strong_alias.h"

      #include "build/build_config.h"

      '
