# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#if\ BUILDFLAG\(IS_ANDROID\)\

      \ \ if\ \(base::FeatureList::IsEnabled\(\

      \ \ \ \ \ \ \ \ \ \ features::kAutofillAtMemorySupportContenteditableOnAndroid\)\ \&\&\

      \ \ \ \ \ \ element\ \&\&\ element\.IsContentEditable\(\)\)\ \{\

      \ \ \ \ if\ \(std::optional<FormData>\ form\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ form_util::FindFormForContentEditable\(element\)\)\ \{\

      \ \ \ \ \ \ CHECK_EQ\(form\->fields\(\)\.size\(\),\ 1u\);\

      \ \ \ \ \ \ return\ \{mojom::FocusedFieldType::kContenteditableField,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ form\->fields\(\)\.front\(\)\.renderer_id\(\)\};\

      \ \ \ \ \}\

      \ \ \}\

      \#endif\

      '
    replace: ''
