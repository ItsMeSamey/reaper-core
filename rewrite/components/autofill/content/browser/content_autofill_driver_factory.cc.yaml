substitutions:
- description: Include the canonical build platform macro definition for the Android registration boundary.
  regex:
    pattern: '#include "base/metrics/histogram_functions.h"

      '
    replace: '#include "base/metrics/histogram_functions.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Keep the Actor/APC adapter include only on platforms that retain the annotation producer.
  regex:
    pattern: '#include "components/autofill/content/browser/integrators/actor/autofill_annotations_provider_impl.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/content/browser/integrators/actor/autofill_annotations_provider_impl.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Do not construct/register the removed APC metadata adapter on Android; ordinary driver factory construction
    and lifetime stay unchanged.
  regex:
    pattern: "  optimization_guide::AutofillAnnotationsProviderImpl::SetFor(\n      web_contents,\n      std::make_unique<optimization_guide::AutofillAnnotationsProviderImpl>());\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  optimization_guide::AutofillAnnotationsProviderImpl::SetFor(\n      web_contents,\n\
      \      std::make_unique<optimization_guide::AutofillAnnotationsProviderImpl>());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
