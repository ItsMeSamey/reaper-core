substitutions:
- description: Exclude the dedicated Actor/APC Autofill annotation implementation and its optimization-guide dependency on
    Android; ordinary Autofill sources remain admitted.
  regex:
    pattern: "  if (!is_android) {\n    deps += [ \"//components/webauthn/content/browser\" ]\n  }\n"
    replace: "  if (is_android) {\n    sources -= [\n      \"integrators/actor/autofill_annotations_provider_impl.cc\",\n\
      \      \"integrators/actor/autofill_annotations_provider_impl.h\",\n    ]\n    public_deps -= [ \"//components/optimization_guide/content/browser\"\
      \ ]\n  }\n\n  if (!is_android) {\n    deps += [ \"//components/webauthn/content/browser\" ]\n  }\n"
  count: 1
- description: Exclude only the dedicated Actor/APC annotation fixture on Android, preserving all ordinary Autofill content
    test admissions.
  regex:
    pattern: "    \"suggestions/identity_credential_suggestion_generator_unittest.cc\",\n  ]\n\n  deps = [\n"
    replace: "    \"suggestions/identity_credential_suggestion_generator_unittest.cc\",\n  ]\n\n  if (is_android) {\n    sources\
      \ -= [ \"integrators/actor/autofill_annotations_provider_impl_unittest.cc\" ]\n  }\n\n  deps = [\n"
  count: 1
