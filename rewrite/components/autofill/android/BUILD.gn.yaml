    replace: "_autofill_browser_resource_spec = {\n  sources = [\n    \"browser/java/res/drawable/autofill_external_link.xml\",\n    \"browser/java/res/drawable/autofill_sad_tab.xml\",\n    \"browser/java/res/drawable/car_spark.xml\",\n    \"browser/java/res/drawable/card_generic_spark.xml\",\n    \"browser/java/res/drawable/card_generic_vector.xml\",\n    \"browser/java/res/drawable/chrome_product.xml\",\n    \"browser/java/res/drawable/directions_car.xml\",\n    \"browser/java/res/drawable/flight.xml\",\n    \"browser/java/res/drawable/flight_spark.xml\",\n    \"browser/java/res/drawable/id_card.xml\",\n    \"browser/java/res/drawable/id_card_2.xml\",\n    \"browser/java/res/drawable/id_card_2_spark.xml\",\n    \"browser/java/res/drawable/id_card_spark.xml\",\n    \"browser/java/res/drawable/local_shipping.xml\",\n    \"browser/java/res/drawable/local_shipping_spark.xml\",\n    \"browser/java/res/drawable/location.xml\",\n    \"browser/java/res/drawable/location_spark.xml\",\n    \"browser/java/res/drawable/passport.xml\",\n    \"browser/java/res/drawable/passport_spark.xml\",\n    \"browser/java/res/drawable/person_check.xml\",\n    \"browser/java/res/drawable/shopping_bag.xml\",\n    \"browser/java/res/drawable/shopping_bag_spark.xml\",\n    \"browser/java/res/drawable/spark.xml\",\n    \"browser/java/res/drawable/travel_luggage_and_bags.xml\",\n    \"browser/java/res/drawable/travel_trip.xml\",\n    \"browser/java/res/drawable/work_logo.xml\",\n  ]\n  if (is_android) {\n    sources -= [ \"browser/java/res/drawable/travel_trip.xml\" ]\n  }\n}\n\n_autofill_browser_resource_sources = _autofill_browser_resource_spec.sources\n_autofill_browser_resource_copy_deps = []\nif (is_android) {\n  _autofill_browser_resource_sources = []\n  _autofill_browser_resource_directories = []\n  foreach(_source, _autofill_browser_resource_spec.sources) {\n    _directory = get_path_info(_source, \"dir\")\n    if (filter_include(_autofill_browser_resource_directories, [ _directory ]) == []) {\n      _autofill_browser_resource_directories += [ _directory ]\n    }\n    _root = \"$target_gen_dir/autofill_browser_resources_selected/\" +\n            string_replace(_directory, \"/\", \"_\")\n    _qualifier = get_path_info(_directory, \"file\")\n    _file = get_path_info(_source, \"file\")\n    _autofill_browser_resource_sources += [ \"$_root/$_qualifier/$_file\" ]\n  }\n  foreach(_directory, _autofill_browser_resource_directories) {\n    _qualifier = get_path_info(_directory, \"file\")\n    _copy_target = \"copy_selected_autofill_browser_$_qualifier\"\n    copy_ex(_copy_target) {\n      sources = filter_include(_autofill_browser_resource_spec.sources, [ \"$_directory/*\" ])\n      _root = \"$target_gen_dir/autofill_browser_resources_selected/\" +\n              string_replace(_directory, \"/\", \"_\")\n      dest = \"$_root/$_qualifier\"\n      outputs = process_file_template(sources, [ \"$dest/{{source_file_part}}\" ])\n      args = [ \"--clear\" ]\n    }\n    _autofill_browser_resource_copy_deps += [ \":$_copy_target\" ]\n  }\n}\n\nandroid_resources(\"autofill_browser_resources\") {\n  sources = _autofill_browser_resource_sources\n  if (is_android) {\n    deps = _autofill_browser_resource_copy_deps\n  }\n}"
  count: 1
