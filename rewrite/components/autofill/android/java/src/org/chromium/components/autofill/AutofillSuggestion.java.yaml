substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Only ordinary profile/payment Java payload implementations remain;
    generic constructor arity stays
  regex:
    re_pattern: permits\ AtMemoryPayload,\ AutofillAiPayload,\ AutofillProfilePayload,\
      PaymentsPayload\ \{\}
    replace: permits AutofillProfilePayload, PaymentsPayload {}
- description: Remove stale AI-only nonexistent constructor-param documentation
  regex:
    re_pattern: '\ \ \ \ \ \*\ @param\ showLoadingOnAcceptance\ Whether\ accepting\
      this\ suggestion\ should\ show\ a\ loading\ UI\

      \ \ \ \ \ \*\ \ \ \ \ \(e\.g\.,\ if\ it\ requires\ a\ fetch\ from\ the\ server\)\.\

      '
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Returns\ whether\ accepting\ this\ suggestion\ should\ show\ a\
      loading\ UI\ \(e\.g\.,\ if\ it\ requires\ a\

      \ \ \ \ \ \*\ fetch\ from\ the\ server\)\.\

      \ \ \ \ \ \*/\

      \ \ \ \ public\ boolean\ showLoadingOnAcceptance\(\)\ \{\

      \ \ \ \ \ \ \ \ AutofillAiPayload\ aiPayload\ =\ getAutofillAiPayload\(\);\

      \ \ \ \ \ \ \ \ return\ aiPayload\ !=\ null\ \&\&\ aiPayload\.requiresServerFetch\(\);\

      \ \ \ \ \}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ public\ @Nullable\ AtMemoryPayload\ getAtMemoryPayload\(\)\
      \{\

      \ \ \ \ \ \ \ \ if\ \(mPayload\ instanceof\ AtMemoryPayload\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ \(AtMemoryPayload\)\ mPayload;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ return\ null;\

      \ \ \ \ \}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ public\ @Nullable\ AutofillAiPayload\ getAutofillAiPayload\(\)\
      \{\

      \ \ \ \ \ \ \ \ if\ \(mPayload\ instanceof\ AutofillAiPayload\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ return\ \(AutofillAiPayload\)\ mPayload;\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ return\ null;\

      \ \ \ \ \}'
    replace: ''
- description: Remove concrete AI notice exceptions from retained ordinary builder
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ mSuggestionType\
      ==\ SuggestionType\.PERSONAL_CONTEXT_NOTICE\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ mSuggestionType\
      ==\ SuggestionType\.AT_MEMORY_AI_DISCLOSURE\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \|\|\ mSuggestionType\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ==\
      SuggestionType\.AUTOFILL_AI_PRIVATE_INFERENCE_NOTICE\

      '
    replace: ''
- description: State the retained ordinary builder contract
  regex:
    re_pattern: Only\ separators\ and\ personal\ context\ notices\ may\ have\ an\
      empty\ label\.
    replace: Only separators may have an empty label.
