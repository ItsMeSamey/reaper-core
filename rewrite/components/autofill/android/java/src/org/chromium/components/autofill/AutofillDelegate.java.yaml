substitutions:

# Reaper Android AI physical-purge core caller adapters.
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Initiates\ the\ flow\ to\ show\ Autofill\ AI\ suggestion\ details\
      \(such\ as\ attribution\ and\

      \ \ \ \ \ \*\ suppression\ dialog\)\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ listIndex\ The\ index\ of\ the\ suggestion\.\

      \ \ \ \ \ \*/\

      \ \ \ \ default\ void\ showAutofillAiSuggestionDetails\(int\ listIndex\)\ \{\}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Opens\ settings\ for\ the\ given\ entity\ type\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ entityType\ The\ entity\ type\ for\ which\ to\ open\ settings\.\

      \ \ \ \ \ \*/\

      \ \ \ \ default\ void\ openSettingsForEntityType\(@EntityTypeName\ int\ entityType\)\
      \{\}'
    replace: ''
- description: Remove the concrete optional AI API/body rather than provide a stub
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Handles\ the\ acceptance\ of\ an\ Autofill\ suggestion,\ with\
      metadata\ about\ whether\ the\ suggestion\

      \ \ \ \ \ \*\ triggers\ a\ loading\ state\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @param\ listIndex\ The\ index\ of\ the\ accepted\ Autofill\ suggestion\.\

      \ \ \ \ \ \*\ @param\ showLoadingOnAcceptance\ True\ if\ the\ suggestion\ shows\
      a\ loading\ UI\ on\ acceptance\.\

      \ \ \ \ \ \*/\

      \ \ \ \ default\ void\ suggestionAccepted\(int\ listIndex,\ boolean\ showLoadingOnAcceptance\)\
      \{\

      \ \ \ \ \ \ \ \ suggestionAccepted\(listIndex\);\

      \ \ \ \ \}'
    replace: ''
- description: Drop an import with no remaining real source reference
  regex:
    re_pattern: 'import\ org\.chromium\.components\.autofill\.autofill_ai\.EntityTypeName;\

      '
    replace: ''
