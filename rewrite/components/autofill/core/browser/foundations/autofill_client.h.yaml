  - description: Compile the AI page-content callback alias and virtual API out on Android
    regex:
      pattern: "  // Attempts to the annotated page content for the current tab and calls\n  // `callback` with the results.\n\
        \  using GetAiPageContentCallback = base::OnceCallback<void(\n      std::optional<optimization_guide::proto::AnnotatedPageContent>)>;\n\
        \  virtual void GetAiPageContent(GetAiPageContentCallback callback);\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Attempts to the annotated page content for the current tab and calls\n  //\
        \ `callback` with the results.\n  using GetAiPageContentCallback = base::OnceCallback<void(\n      std::optional<optimization_guide::proto::AnnotatedPageContent>)>;\n\
        \  virtual void GetAiPageContent(GetAiPageContentCallback callback);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
