substitutions:
  - description: "Keep the selected Android AI compile-out consistent in test helpers; preserve the exact desktop implementation."
    count: 1
    regex:
      re_pattern: "\\#include\\ \"components/autofill/core/browser/payments/test/mock_ai_card_recommendation_manager\\.h\"\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/autofill/core/browser/payments/test/mock_ai_card_recommendation_manager.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  - description: "Keep the selected Android AI compile-out consistent in test helpers; preserve the exact desktop implementation."
    count: 1
    regex:
      re_pattern: "testing::NiceMock<MockAiCardRecommendationManager>\\&\\\nTestBrowserAutofillManager::GetAiCardRecommendationManager\\(\\)\\ \\{\\\n\\ \\ return\\ mock_ai_card_recommendation_manager_;\\\n\\}\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\ntesting::NiceMock<MockAiCardRecommendationManager>&\nTestBrowserAutofillManager::GetAiCardRecommendationManager() {\n  return mock_ai_card_recommendation_manager_;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
