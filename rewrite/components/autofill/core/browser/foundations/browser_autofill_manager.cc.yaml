- description: Reviewed literal source edit 2
  regex:
    pattern: "// Generates a compose suggestion for the given `form` and `field` if conditions\n// are met, returns `std::nullopt`\
      \ otherwise.\n// TODO(crbug.com/409962888): Remove once new suggestion generator architecture\n// is launched.\nstd::optional<Suggestion>\
      \ GenerateComposeSuggestion(\n    const FormData& form,\n    const FormFieldData& field,\n    AutofillSuggestionTriggerSource\
      \ trigger_source,\n    AutofillClient& client) {\n  ComposeSuggestionGenerator suggestion_generator(trigger_source);\n\
      \  std::vector<Suggestion> suggestions;\n\n  auto on_suggestions_generated =\n      [&suggestions](\n          SuggestionGenerator::ReturnedSuggestions\
      \ returned_suggestions) {\n        suggestions = std::move(returned_suggestions.second);\n      };\n\n  // Since the\
      \ `on_suggestions_generated` callback is called synchronously, we\n  // can assume that `suggestions` will hold the\
      \ correct value.\n  suggestion_generator.GenerateSuggestions(\n      form, field, /*form_structure=*/nullptr,\n    \
      \  /*trigger_autofill_field=*/nullptr, client, on_suggestions_generated);\n  if (suggestions.empty()) {\n    return\
      \ std::nullopt;\n  }\n  CHECK_EQ(suggestions.size(), 1u);\n  return suggestions[0];\n}\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Generates a compose suggestion for the given `form` and `field` if conditions\n\
      // are met, returns `std::nullopt` otherwise.\n// TODO(crbug.com/409962888): Remove once new suggestion generator architecture\n\
      // is launched.\nstd::optional<Suggestion> GenerateComposeSuggestion(\n    const FormData& form,\n    const FormFieldData&\
      \ field,\n    AutofillSuggestionTriggerSource trigger_source,\n    AutofillClient& client) {\n  ComposeSuggestionGenerator\
      \ suggestion_generator(trigger_source);\n  std::vector<Suggestion> suggestions;\n\n  auto on_suggestions_generated =\n\
      \      [&suggestions](\n          SuggestionGenerator::ReturnedSuggestions returned_suggestions) {\n        suggestions\
      \ = std::move(returned_suggestions.second);\n      };\n\n  // Since the `on_suggestions_generated` callback is called\
      \ synchronously, we\n  // can assume that `suggestions` will hold the correct value.\n  suggestion_generator.GenerateSuggestions(\n\
      \      form, field, /*form_structure=*/nullptr,\n      /*trigger_autofill_field=*/nullptr, client, on_suggestions_generated);\n\
      \  if (suggestions.empty()) {\n    return std::nullopt;\n  }\n  CHECK_EQ(suggestions.size(), 1u);\n  return suggestions[0];\n\
      }\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
