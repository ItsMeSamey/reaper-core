substitutions:
  - description: "Keep the selected Android AI compile-out consistent in test helpers; preserve the exact desktop implementation."
    count: 1
    regex:
      re_pattern: "\\#include\\ \"components/autofill/core/browser/payments/test/mock_ai_card_recommendation_manager\\.h\"\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/autofill/core/browser/payments/test/mock_ai_card_recommendation_manager.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  - description: "Keep the selected Android AI compile-out consistent in test helpers; preserve the exact desktop implementation."
    count: 1
    regex:
      re_pattern: "\\ \\ testing::NiceMock<MockAiCardRecommendationManager>\\&\\\n\\ \\ GetAiCardRecommendationManager\\(\\)\\ override;\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  testing::NiceMock<MockAiCardRecommendationManager>&\n  GetAiCardRecommendationManager() override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  - description: "Keep the selected Android AI compile-out consistent in test helpers; preserve the exact desktop implementation."
    count: 1
    regex:
      re_pattern: "\\ \\ testing::NiceMock<MockAiCardRecommendationManager>\\\n\\ \\ \\ \\ \\ \\ mock_ai_card_recommendation_manager_\\{this\\};\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  testing::NiceMock<MockAiCardRecommendationManager>\n      mock_ai_card_recommendation_manager_{this};\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
