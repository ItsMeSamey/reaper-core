# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/autofill/core/browser/autofill_and_password_manager_internals/autofill_and_password_manager_internals.html'
  regex:
    re_pattern: '\

      \.log\-entry\[scope=''TouchToFill''\]\ \{\

      \ \ background\-color:\ \#C5CAE9;\ /\*\ Indigo\ \*/\

      \}\

      \

      \.log\-entry\[scope=''AutofillAi''\]\ \{\

      \ \ background\-color:\ \#E1BEE7;\ /\*\ Purple\ \*/\

      \}\

      \

      \.log\-entry\[scope=''AutofillActor''\]\ \{\

      \ \ background\-color:\ \#FFE0B2;\ /\*\ Orange\ \*/\

      \}\

      \

      \.log\-entry\[scope=''OneTimeTokens''\]\ \{\

      \ \ background\-color:\ \#E4FFA9;\ /\*\ Yellow\ Green\ \*/\

      \}\

      \

      \.log\-entry\[scope=''AtMemory''\]\ \{\

      \ \ background\-color:\ \#DCEDC8;\ /\*\ Light\ Green\ \*/\

      \}\

      \

      /\*\

      \ \*\ Checkboxes\ add/remove\ hide\-<Scope>\ classes\ to\ the\ \#log\-entries\.\ Hiding\ of\ the\

      '
    replace: "\n.log-entry[scope='TouchToFill'] {\n  background-color: #C5CAE9; /* Indigo */\n}<!-- <if expr=\"not is_android\"> -->\n\n\n.log-entry[scope='AutofillAi'] {\n  background-color: #E1BEE7; /* Purple */\n}\n<!-- </if> --><!-- <if expr=\"not is_android\"> -->\n\n\n.log-entry[scope='AutofillActor'] {\n  background-color: #FFE0B2; /* Orange */\n}\n<!-- </if> -->\n\n.log-entry[scope='OneTimeTokens'] {\n  background-color: #E4FFA9; /* Yellow Green */\n}<!-- <if expr=\"not is_android\"> -->\n\n\n.log-entry[scope='AtMemory'] {\n  background-color: #DCEDC8; /* Light Green */\n}\n<!-- </if> -->\n\n/*\n * Checkboxes add/remove hide-<Scope> classes to the #log-entries. Hiding of the\n"
- description: 'Android concrete AI source/provider removal: components/autofill/core/browser/autofill_and_password_manager_internals/autofill_and_password_manager_internals.html'
  regex:
    re_pattern: '\.hide\-OneTimeTokens\ \.log\-entry\[scope=''OneTimeTokens''\],\

      \.hide\-OneTimeTokens\ \.log\-entry\[scope=''OneTimeTokens''\]\ \+\ hr\ \{\

      \ \ display:\ none;\

      \}\

      \

      \.hide\-AtMemory\ \.log\-entry\[scope=''AtMemory''\],\

      \.hide\-AtMemory\ \.log\-entry\[scope=''AtMemory''\]\ \+\ hr\ \{\

      \ \ display:\ none;\

      \}\

      \

      \.preserve\-white\-space\ \{\

      \ \ white\-space:\ pre\-wrap;\

      '
    replace: ".hide-OneTimeTokens .log-entry[scope='OneTimeTokens'],\n.hide-OneTimeTokens .log-entry[scope='OneTimeTokens'] + hr {\n  display: none;\n}<!-- <if expr=\"not is_android\"> -->\n\n\n.hide-AtMemory .log-entry[scope='AtMemory'],\n.hide-AtMemory .log-entry[scope='AtMemory'] + hr {\n  display: none;\n}\n<!-- </if> -->\n\n.preserve-white-space {\n  white-space: pre-wrap;\n"
