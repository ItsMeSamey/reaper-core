substitutions:
- description: Declare platform guard directly
  regex:
    pattern: '#include "base/values.h"

      '
    replace: '#include "base/values.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude entity data-manager include
  regex:
    pattern: '#include "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude entity model includes
  regex:
    pattern: '#include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      #include "components/autofill/core/browser/data_model/autofill_ai/entity_type.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      #include "components/autofill/core/browser/data_model/autofill_ai/entity_type.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude personal-context access implementation include
  regex:
    pattern: '#include "components/autofill/core/browser/network/autofill_ai/autofill_ai_personal_context_access_manager_impl.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/network/autofill_ai/autofill_ai_personal_context_access_manager_impl.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Remove entity payload field from Android import data
  regex:
    pattern: '  std::optional<std::vector<EntityInstance>> entities;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::optional<std::vector<EntityInstance>> entities;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove entity JSON key from Android loader
  regex:
    pattern: 'constexpr std::string_view kKeyEntities = "entities";

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      constexpr std::string_view kKeyEntities = "entities";

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Remove entity-only JSON attribute/source keys
  regex:
    pattern: 'constexpr std::string_view kKeyEntityType = "entity_type";

      constexpr std::string_view kKeyAttributes = "attributes";

      constexpr std::string_view kKeySources = "sources";

      constexpr std::string_view kKeySourceType = "type";

      constexpr std::string_view kKeySourceUrl = "url";

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      constexpr std::string_view kKeyEntityType = "entity_type";

      constexpr std::string_view kKeyAttributes = "attributes";

      constexpr std::string_view kKeySources = "sources";

      constexpr std::string_view kKeySourceType = "type";

      constexpr std::string_view kKeySourceUrl = "url";

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Remove entity record/source mappings
  regex:
    pattern: "constexpr auto kEntityRecordTypeMapping =\n    base::MakeFixedFlatMap<std::string_view, EntityInstance::RecordType>(\n\
      \        {{\"local\", EntityInstance::RecordType::kLocal},\n         {\"serverWallet\", EntityInstance::RecordType::kServerWallet},\n\
      \         {\"personalContext\", EntityInstance::RecordType::kPersonalContext}});\nconstexpr auto kEntityPayloadSourceTypeMapping\
      \ = base::MakeFixedFlatMap<\n    std::string_view,\n    EntityInstance::PersonalContextRecordTypePayload::Source::Type>(\n\
      \    {{\"gmail\",\n      EntityInstance::PersonalContextRecordTypePayload::Source::Type::kGmail},\n     {\"photos\"\
      , EntityInstance::PersonalContextRecordTypePayload::Source::Type::\n                    kPhotos}});\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nconstexpr auto kEntityRecordTypeMapping =\n    base::MakeFixedFlatMap<std::string_view,\
      \ EntityInstance::RecordType>(\n        {{\"local\", EntityInstance::RecordType::kLocal},\n         {\"serverWallet\"\
      , EntityInstance::RecordType::kServerWallet},\n         {\"personalContext\", EntityInstance::RecordType::kPersonalContext}});\n\
      constexpr auto kEntityPayloadSourceTypeMapping = base::MakeFixedFlatMap<\n    std::string_view,\n    EntityInstance::PersonalContextRecordTypePayload::Source::Type>(\n\
      \    {{\"gmail\",\n      EntityInstance::PersonalContextRecordTypePayload::Source::Type::kGmail},\n     {\"photos\"\
      , EntityInstance::PersonalContextRecordTypePayload::Source::Type::\n                    kPhotos}});\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove entity record-type decoder
  regex:
    pattern: "std::optional<EntityInstance::RecordType> GetEntityRecordTypeFromDict(\n    const base::DictValue& dict) {\n\
      \  if (!dict.contains(kKeyRecordType)) {\n    return EntityInstance::RecordType::kLocal;\n  }\n  if (const std::string*\
      \ record_type_value = dict.FindString(kKeyRecordType)) {\n    if (auto it = kEntityRecordTypeMapping.find(*record_type_value);\n\
      \        it != kEntityRecordTypeMapping.end()) {\n      return it->second;\n    }\n  }\n  LOG(ERROR) << \"Invalid \"\
      \ << kKeyRecordType << \" value for entity.\";\n  return std::nullopt;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::optional<EntityInstance::RecordType> GetEntityRecordTypeFromDict(\n    const\
      \ base::DictValue& dict) {\n  if (!dict.contains(kKeyRecordType)) {\n    return EntityInstance::RecordType::kLocal;\n\
      \  }\n  if (const std::string* record_type_value = dict.FindString(kKeyRecordType)) {\n    if (auto it = kEntityRecordTypeMapping.find(*record_type_value);\n\
      \        it != kEntityRecordTypeMapping.end()) {\n      return it->second;\n    }\n  }\n  LOG(ERROR) << \"Invalid \"\
      \ << kKeyRecordType << \" value for entity.\";\n  return std::nullopt;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove personal-context source and entity constructors
  regex:
    pattern: "std::vector<EntityInstance::PersonalContextRecordTypePayload::Source>\nGetPersonalContextSourcesFromDict(const\
      \ base::DictValue& dict) {\n  using Source = EntityInstance::PersonalContextRecordTypePayload::Source;\n  const base::ListValue*\
      \ sources_list = dict.FindList(kKeySources);\n  if (!sources_list) {\n    return {};\n  }\n\n  std::vector<Source> sources;\n\
      \  sources.reserve(sources_list->size());\n  for (const base::Value& item : *sources_list) {\n    if (!item.is_dict())\
      \ {\n      LOG(ERROR) << \"Source entry is not a dictionary.\";\n      continue;\n    }\n    const base::DictValue&\
      \ src_dict = item.GetDict();\n    const std::string* type_str = src_dict.FindString(kKeySourceType);\n    const std::string*\
      \ url_str = src_dict.FindString(kKeySourceUrl);\n    if (!type_str || !url_str) {\n      LOG(ERROR) << \"Source entry\
      \ missing 'type' or 'url'.\";\n      continue;\n    }\n    const Source::Type* type =\n        base::FindOrNull(kEntityPayloadSourceTypeMapping,\
      \ *type_str);\n    if (!type) {\n      LOG(ERROR) << \"Invalid source type: \" << *type_str << \".\";\n      continue;\n\
      \    }\n    sources.push_back({.type = *type, .url = *url_str});\n  }\n  return sources;\n}\n\nstd::optional<EntityInstance>\
      \ MakeEntity(const base::DictValue& dict) {\n  const std::string* entity_type_str = dict.FindString(kKeyEntityType);\n\
      \  if (!entity_type_str) {\n    LOG(ERROR) << \"Missing \" << kKeyEntityType << \".\";\n    return std::nullopt;\n \
      \ }\n  std::optional<EntityType> entity_type = StringToEntityType(*entity_type_str);\n  if (!entity_type) {\n    LOG(ERROR)\
      \ << \"Invalid entity type: \" << *entity_type_str << \".\";\n    return std::nullopt;\n  }\n\n  const base::DictValue*\
      \ attributes_dict = dict.FindDict(kKeyAttributes);\n  if (!attributes_dict) {\n    LOG(ERROR) << \"Missing \" << kKeyAttributes\
      \ << \".\";\n    return std::nullopt;\n  }\n\n  base::flat_set<AttributeInstance, AttributeInstance::CompareByType>\n\
      \      attributes;\n  for (const auto [attr_name, attr_value] : *attributes_dict) {\n    std::optional<AttributeType>\
      \ attribute_type =\n        StringToAttributeType(*entity_type, attr_name);\n    if (!attribute_type) {\n      LOG(ERROR)\
      \ << \"Invalid attribute type: \" << attr_name << \" for entity \"\n                 << *entity_type_str << \".\";\n\
      \      return std::nullopt;\n    }\n    AttributeInstance attribute(*attribute_type);\n    attribute.SetRawInfo(std::nullopt,\n\
      \                         base::UTF8ToUTF16(attr_value.GetString()),\n                         VerificationStatus::kObserved);\n\
      \    attribute.FinalizeInfo();\n    attributes.insert(std::move(attribute));\n  }\n\n  if (attributes.empty()) {\n \
      \   LOG(ERROR) << \"Entity has no attributes.\";\n    return std::nullopt;\n  }\n\n  std::optional<EntityInstance::RecordType>\
      \ record_type =\n      GetEntityRecordTypeFromDict(dict);\n  if (!record_type.has_value()) {\n    return std::nullopt;\n\
      \  }\n\n  auto record_type_data = [&] -> EntityInstance::RecordTypeData {\n    switch (*record_type) {\n      case EntityInstance::RecordType::kLocal:\n\
      \        return EntityInstance::LocalRecordTypePayload{};\n      case EntityInstance::RecordType::kServerWallet:\n \
      \       return EntityInstance::WalletRecordTypePayload{};\n      case EntityInstance::RecordType::kPersonalContext:\n\
      \        return EntityInstance::PersonalContextRecordTypePayload{\n            .sources = GetPersonalContextSourcesFromDict(dict)};\n\
      \    }\n    NOTREACHED();\n  }();\n  return EntityInstance(\n      *entity_type, std::move(attributes),\n      EntityInstance::EntityId(base::Uuid::GenerateRandomV4()),\n\
      \      /*nickname=*/\"\", base::Time::Now(), /*use_count=*/0,\n      /*use_date=*/base::Time(), std::move(record_type_data),\n\
      \      EntityInstance::AreAttributesReadOnly(false),\n      /*frecency_override=*/\"\");\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::vector<EntityInstance::PersonalContextRecordTypePayload::Source>\nGetPersonalContextSourcesFromDict(const\
      \ base::DictValue& dict) {\n  using Source = EntityInstance::PersonalContextRecordTypePayload::Source;\n  const base::ListValue*\
      \ sources_list = dict.FindList(kKeySources);\n  if (!sources_list) {\n    return {};\n  }\n\n  std::vector<Source> sources;\n\
      \  sources.reserve(sources_list->size());\n  for (const base::Value& item : *sources_list) {\n    if (!item.is_dict())\
      \ {\n      LOG(ERROR) << \"Source entry is not a dictionary.\";\n      continue;\n    }\n    const base::DictValue&\
      \ src_dict = item.GetDict();\n    const std::string* type_str = src_dict.FindString(kKeySourceType);\n    const std::string*\
      \ url_str = src_dict.FindString(kKeySourceUrl);\n    if (!type_str || !url_str) {\n      LOG(ERROR) << \"Source entry\
      \ missing 'type' or 'url'.\";\n      continue;\n    }\n    const Source::Type* type =\n        base::FindOrNull(kEntityPayloadSourceTypeMapping,\
      \ *type_str);\n    if (!type) {\n      LOG(ERROR) << \"Invalid source type: \" << *type_str << \".\";\n      continue;\n\
      \    }\n    sources.push_back({.type = *type, .url = *url_str});\n  }\n  return sources;\n}\n\nstd::optional<EntityInstance>\
      \ MakeEntity(const base::DictValue& dict) {\n  const std::string* entity_type_str = dict.FindString(kKeyEntityType);\n\
      \  if (!entity_type_str) {\n    LOG(ERROR) << \"Missing \" << kKeyEntityType << \".\";\n    return std::nullopt;\n \
      \ }\n  std::optional<EntityType> entity_type = StringToEntityType(*entity_type_str);\n  if (!entity_type) {\n    LOG(ERROR)\
      \ << \"Invalid entity type: \" << *entity_type_str << \".\";\n    return std::nullopt;\n  }\n\n  const base::DictValue*\
      \ attributes_dict = dict.FindDict(kKeyAttributes);\n  if (!attributes_dict) {\n    LOG(ERROR) << \"Missing \" << kKeyAttributes\
      \ << \".\";\n    return std::nullopt;\n  }\n\n  base::flat_set<AttributeInstance, AttributeInstance::CompareByType>\n\
      \      attributes;\n  for (const auto [attr_name, attr_value] : *attributes_dict) {\n    std::optional<AttributeType>\
      \ attribute_type =\n        StringToAttributeType(*entity_type, attr_name);\n    if (!attribute_type) {\n      LOG(ERROR)\
      \ << \"Invalid attribute type: \" << attr_name << \" for entity \"\n                 << *entity_type_str << \".\";\n\
      \      return std::nullopt;\n    }\n    AttributeInstance attribute(*attribute_type);\n    attribute.SetRawInfo(std::nullopt,\n\
      \                         base::UTF8ToUTF16(attr_value.GetString()),\n                         VerificationStatus::kObserved);\n\
      \    attribute.FinalizeInfo();\n    attributes.insert(std::move(attribute));\n  }\n\n  if (attributes.empty()) {\n \
      \   LOG(ERROR) << \"Entity has no attributes.\";\n    return std::nullopt;\n  }\n\n  std::optional<EntityInstance::RecordType>\
      \ record_type =\n      GetEntityRecordTypeFromDict(dict);\n  if (!record_type.has_value()) {\n    return std::nullopt;\n\
      \  }\n\n  auto record_type_data = [&] -> EntityInstance::RecordTypeData {\n    switch (*record_type) {\n      case EntityInstance::RecordType::kLocal:\n\
      \        return EntityInstance::LocalRecordTypePayload{};\n      case EntityInstance::RecordType::kServerWallet:\n \
      \       return EntityInstance::WalletRecordTypePayload{};\n      case EntityInstance::RecordType::kPersonalContext:\n\
      \        return EntityInstance::PersonalContextRecordTypePayload{\n            .sources = GetPersonalContextSourcesFromDict(dict)};\n\
      \    }\n    NOTREACHED();\n  }();\n  return EntityInstance(\n      *entity_type, std::move(attributes),\n      EntityInstance::EntityId(base::Uuid::GenerateRandomV4()),\n\
      \      /*nickname=*/\"\", base::Time::Now(), /*use_count=*/0,\n      /*use_date=*/base::Time(), std::move(record_type_data),\n\
      \      EntityInstance::AreAttributesReadOnly(false),\n      /*frecency_override=*/\"\");\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove entity-manager population
  regex:
    pattern: "// Sets all of the `edm`'s entities if the `edm` still exists.\nvoid SetDataForEDM(base::WeakPtr<EntityDataManager>\
      \ edm,\n                   std::optional<AutofillImportData> import_data) {\n  if (!import_data.has_value() || !import_data->entities.has_value())\
      \ {\n    return;\n  }\n  if (edm == nullptr) {\n    return;\n  }\n  if (!import_data->entities->empty()) {\n    std::vector<EntityInstance>\
      \ personal_context_entities;\n    for (const EntityInstance& entity : *import_data->entities) {\n      switch (entity.record_type())\
      \ {\n        case EntityInstance::RecordType::kLocal:\n        case EntityInstance::RecordType::kServerWallet:\n   \
      \       edm->AddOrUpdateEntityInstance(entity);\n          break;\n        case EntityInstance::RecordType::kPersonalContext:\n\
      \          personal_context_entities.emplace_back(entity);\n          break;\n      }\n    }\n    edm->SetPersonalContextEntitiesForTesting(\n\
      \        std::move(personal_context_entities));\n  }\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Sets all of the `edm`'s entities if the `edm` still exists.\nvoid SetDataForEDM(base::WeakPtr<EntityDataManager>\
      \ edm,\n                   std::optional<AutofillImportData> import_data) {\n  if (!import_data.has_value() || !import_data->entities.has_value())\
      \ {\n    return;\n  }\n  if (edm == nullptr) {\n    return;\n  }\n  if (!import_data->entities->empty()) {\n    std::vector<EntityInstance>\
      \ personal_context_entities;\n    for (const EntityInstance& entity : *import_data->entities) {\n      switch (entity.record_type())\
      \ {\n        case EntityInstance::RecordType::kLocal:\n        case EntityInstance::RecordType::kServerWallet:\n   \
      \       edm->AddOrUpdateEntityInstance(entity);\n          break;\n        case EntityInstance::RecordType::kPersonalContext:\n\
      \          personal_context_entities.emplace_back(entity);\n          break;\n      }\n    }\n    edm->SetPersonalContextEntitiesForTesting(\n\
      \        std::move(personal_context_entities));\n  }\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove entity-file loader definition
  regex:
    pattern: "std::optional<std::vector<EntityInstance>> LoadEntitiesFromFile(\n    base::FilePath file) {\n  if (std::optional<AutofillImportData>\
      \ import_data = LoadDataFromFile(file)) {\n    return import_data->entities;\n  }\n  return std::nullopt;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::optional<std::vector<EntityInstance>> LoadEntitiesFromFile(\n    base::FilePath\
      \ file) {\n  if (std::optional<AutofillImportData> import_data = LoadDataFromFile(file)) {\n    return import_data->entities;\n\
      \  }\n  return std::nullopt;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove entity JSON conversion definition
  regex:
    pattern: "std::optional<std::vector<EntityInstance>> EntitiesFromJSON(\n    const base::ListValue* const entities_json)\
      \ {\n  return DataModelsFromJSON(entities_json, base::BindRepeating(&MakeEntity));\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::optional<std::vector<EntityInstance>> EntitiesFromJSON(\n    const base::ListValue*\
      \ const entities_json) {\n  return DataModelsFromJSON(entities_json, base::BindRepeating(&MakeEntity));\n}\n#endif \
      \ // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove entity-manager async test import definition
  regex:
    pattern: "void MaybeImportEntitiesForTesting(base::WeakPtr<EntityDataManager> edm) {\n  const auto* kCommandLine = base::CommandLine::ForCurrentProcess();\n\
      \  if (kCommandLine->HasSwitch(kManualFileImportForTestingFlag)) {\n    base::ThreadPool::PostTaskAndReplyWithResult(\n\
      \        FROM_HERE, {base::TaskPriority::BEST_EFFORT, base::MayBlock()},\n        base::BindOnce(&LoadDataFromFile,\
      \ kCommandLine->GetSwitchValuePath(\n                                              kManualFileImportForTestingFlag)),\n\
      \        base::BindOnce(&SetDataForEDM, edm));\n  } else if (kCommandLine->HasSwitch(kManualContentImportForTestingFlag))\
      \ {\n    SetDataForEDM(edm,\n                  LoadDataFromJSONContent(kCommandLine->GetSwitchValueASCII(\n        \
      \              kManualContentImportForTestingFlag)));\n  }\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid MaybeImportEntitiesForTesting(base::WeakPtr<EntityDataManager> edm) {\n  const\
      \ auto* kCommandLine = base::CommandLine::ForCurrentProcess();\n  if (kCommandLine->HasSwitch(kManualFileImportForTestingFlag))\
      \ {\n    base::ThreadPool::PostTaskAndReplyWithResult(\n        FROM_HERE, {base::TaskPriority::BEST_EFFORT, base::MayBlock()},\n\
      \        base::BindOnce(&LoadDataFromFile, kCommandLine->GetSwitchValuePath(\n                                     \
      \         kManualFileImportForTestingFlag)),\n        base::BindOnce(&SetDataForEDM, edm));\n  } else if (kCommandLine->HasSwitch(kManualContentImportForTestingFlag))\
      \ {\n    SetDataForEDM(edm,\n                  LoadDataFromJSONContent(kCommandLine->GetSwitchValueASCII(\n        \
      \              kManualContentImportForTestingFlag)));\n  }\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Parse only ordinary profile/card data on Android; preserve desktop entity import
  regex:
    pattern: "  const base::ListValue* const entities_json = json->FindList(kKeyEntities);\n  if (!cards_json && !profiles_json\
      \ && !entities_json) {\n    LOG(ERROR) << \"JSON has no \" << kKeyProfiles << \", \" << kKeyCreditCards\n          \
      \     << \" or \" << kKeyEntities << \" keys.\";\n    return std::nullopt;\n  }\n  return AutofillImportData{.profiles\
      \ = AutofillProfilesFromJSON(profiles_json),\n                            .credit_cards = CreditCardsFromJSON(cards_json),\n\
      \                            .entities = EntitiesFromJSON(entities_json)};\n}\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  if (!cards_json && !profiles_json) {\n    LOG(ERROR) << \"JSON has no \" << kKeyProfiles\
      \ << \" or \" << kKeyCreditCards\n               << \" keys.\";\n    return std::nullopt;\n  }\n#else\n  const base::ListValue*\
      \ const entities_json = json->FindList(kKeyEntities);\n  if (!cards_json && !profiles_json && !entities_json) {\n  \
      \  LOG(ERROR) << \"JSON has no \" << kKeyProfiles << \", \" << kKeyCreditCards\n               << \" or \" << kKeyEntities\
      \ << \" keys.\";\n    return std::nullopt;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n  return AutofillImportData{\n  \
      \    .profiles = AutofillProfilesFromJSON(profiles_json),\n      .credit_cards = CreditCardsFromJSON(cards_json),\n\
      #if !BUILDFLAG(IS_ANDROID)\n      .entities = EntitiesFromJSON(entities_json),\n#endif  // !BUILDFLAG(IS_ANDROID)\n\
      \  };\n}\n"
  count: 1
