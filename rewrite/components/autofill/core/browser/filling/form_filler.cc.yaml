substitutions:
- description: Bind Android build flags directly
  regex:
    pattern: '#include "components/autofill/core/browser/filling/form_filler.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/autofill/core/browser/filling/form_filler.h"

      '
  count: 1
- description: Exclude Android AI filling dependency include
  regex:
    pattern: '#include "components/autofill/core/browser/filling/autofill_ai/field_filling_entity_util.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/filling/autofill_ai/field_filling_entity_util.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android AI filling dependency include
  regex:
    pattern: '#include "components/autofill/core/browser/form_processing/autofill_ai/determine_attribute_types.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/form_processing/autofill_ai/determine_attribute_types.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android internal AI filling payload
  regex:
    pattern: "  using EntityPayload = std::pair<const EntityInstance*,\n                                  std::vector<AutofillFieldWithAttributeType>>;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  using EntityPayload = std::pair<const EntityInstance*,\n                     \
      \             std::vector<AutofillFieldWithAttributeType>>;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android entity alternative from internal filling visitor
  regex:
    pattern: '                               EntityPayload,

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n                               EntityPayload,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Compile out AI payload processing; public Android entry rejects this compatibility payload before conversion
  regex:
    pattern: "                [&](const EntityInstance* entity) -> Variant {\n                  return std::pair(entity,\n\
      \                                   RationalizeAndDetermineAttributeTypes(\n                                       form.fields(),\
      \ trigger_field.section(),\n                                       entity->type()));\n                },\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n                [&](const EntityInstance* entity) -> Variant {\n               \
      \   return std::pair(entity,\n                                   RationalizeAndDetermineAttributeTypes(\n          \
      \                             form.fields(), trigger_field.section(),\n                                       entity->type()));\n\
      \                },\n#else\n                [](const EntityInstance*) -> Variant { NOTREACHED(); },\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude internal Android AI filling-product visitor
  regex:
    pattern: '            [](const EntityPayload&) { return FillingProduct::kAutofillAi; },

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n            [](const EntityPayload&) { return FillingProduct::kAutofillAi; },\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android AI refill visitor while preserving address/card refill storage
  regex:
    pattern: "            absl::Overload{// Autofill with AI doesn't support refills.\n                           [](const\
      \ AugmentedFillingPayload::EntityPayload&)\n                               -> std::variant<CreditCard, AutofillProfile>\
      \ {\n                             // Beware that `EntityPayload::second` holds\n                             // raw_refs\
      \ to AutofillFields. These references\n                             // must not be stored in a RefillContext because\n\
      \                             // they would dangle.\n                             NOTREACHED();\n                  \
      \         },\n"
    replace: "            absl::Overload{\n#if !BUILDFLAG(IS_ANDROID)\n                           // Autofill with AI doesn't\
      \ support refills.\n                           [](const AugmentedFillingPayload::EntityPayload&)\n                 \
      \              -> std::variant<CreditCard, AutofillProfile> {\n                             // Beware that `EntityPayload::second`\
      \ holds\n                             // raw_refs to AutofillFields. These references\n                            \
      \ // must not be stored in a RefillContext because\n                             // they would dangle.\n           \
      \                  NOTREACHED();\n                           },\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Retain Android ordinary address filling without removed AI field blocking
  regex:
    pattern: "  if (filling_product == FillingProduct::kAddress) {\n    blocked_fields.insert_range(GetFieldsFillableByAutofillAi(form,\
      \ client));\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (filling_product == FillingProduct::kAddress) {\n    blocked_fields.insert_range(GetFieldsFillableByAutofillAi(form,\
      \ client));\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Reject unsupported Android entity payload before any form mutation, matching existing manager boundary
  regex:
    pattern: "    RefillOptions refill_options) {\n  const AugmentedFillingPayload augmented_filling_payload =\n"
    replace: "    RefillOptions refill_options) {\n#if BUILDFLAG(IS_ANDROID)\n  if (std::holds_alternative<const EntityInstance*>(filling_payload))\
      \ {\n    return;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n  const AugmentedFillingPayload augmented_filling_payload =\n"
  count: 1
- description: Exclude Android entity-value filling implementation from generic visitor
  regex:
    pattern: "          [&](const AugmentedFillingPayload::EntityPayload&\n                  entity_and_fields_and_types)\
      \ {\n            const EntityInstance& entity =\n                CHECK_DEREF(entity_and_fields_and_types.first);\n \
      \           const std::vector<AutofillFieldWithAttributeType>& fields =\n                entity_and_fields_and_types.second;\n\
      \            return GetFillingValueAndTypeForEntity(\n                entity, fields, field, action_persistence,\n \
      \               manager_->client().GetAppLocale(),\n                manager_->client().GetAddressNormalizer());\n  \
      \        },\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n          [&](const AugmentedFillingPayload::EntityPayload&\n                  entity_and_fields_and_types)\
      \ {\n            const EntityInstance& entity =\n                CHECK_DEREF(entity_and_fields_and_types.first);\n \
      \           const std::vector<AutofillFieldWithAttributeType>& fields =\n                entity_and_fields_and_types.second;\n\
      \            return GetFillingValueAndTypeForEntity(\n                entity, fields, field, action_persistence,\n \
      \               manager_->client().GetAppLocale(),\n                manager_->client().GetAddressNormalizer());\n  \
      \        },\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
