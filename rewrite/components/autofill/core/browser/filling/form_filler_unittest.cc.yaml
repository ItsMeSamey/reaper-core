      \   {.role = ADDRESS_HOME_COUNTRY},\n                                         // Issue date:\n                     \
      \                    {.role = UNKNOWN_TYPE},\n                                         // Expiration date:\n       \
      \                                  {.role = UNKNOWN_TYPE},\n                                     }});\n  FormsSeen({form});\n\
      \n  FormStructure* form_structure = GetFormStructure(form);\n  ASSERT_TRUE(form_structure);\n  auto set_server_type\
