# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ base::OnceClosure\ cancel_callback,\

      \ \ \ \ \ \ bool\ has_seen_ai_terms\)\ =\ 0;\

      '
    replace: "      base::OnceClosure cancel_callback\n#if !BUILDFLAG(IS_ANDROID)\n      ,\n      bool has_seen_ai_terms\n#endif\n      ) = 0;\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "base/functional/callback_forward\.h"\

      '
    replace: '#include "base/functional/callback_forward.h"

      #include "build/build_config.h"

      '
