# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\}\ \ //\ namespace\

      \

      '
    replace: "}  // namespace\n\n#if BUILDFLAG(IS_ANDROID)\nTEST_F(AutofillExternalDelegateTest,\n       AndroidLateUnsupportedCallbacksCannotPreviewFillOrRetagTheQuery) {\n  IssueOnQuery();\n  const FieldGlobalId ordinary_query = external_delegate().GetQueriedFieldId();\n  EXPECT_CALL(autofill_driver(), ApplyFieldAction).Times(0);\n  EXPECT_CALL(autofill_driver(), ApplyFormAction).Times(0);\n  EXPECT_CALL(autofill_driver(), RendererShouldTriggerSuggestions).Times(0);\n  EXPECT_CALL(autofill_client(), ShowAutofillSuggestions).Times(0);\n  FormData incoming = CreateTestFormWithBounds();\n  for (auto source : {AutofillSuggestionTriggerSource::kAtMemoryDoubleCtrl,\n                      AutofillSuggestionTriggerSource::kAtMemoryContextMenu,\n                      AutofillSuggestionTriggerSource::kGlic}) {\n    external_delegate().OnQuery(incoming, incoming.fields().front(),\n                                gfx::Rect(), source);\n    EXPECT_EQ(external_delegate().GetQueriedFieldId(), ordinary_query);\n  }\n  for (auto type :\n       {SuggestionType::kAtMemorySearchResult,\n        SuggestionType::kAtMemorySearchAffordance,\n        SuggestionType::kAtMemoryOpenGemini,\n        SuggestionType::kPersonalContextNotice,\n        SuggestionType::kMaximizeCreditCardBenefitsEntry,\n        SuggestionType::kFillAutofillAi, SuggestionType::kFetchingAmbientData,\n        SuggestionType::kRemoveAutofillAi, SuggestionType::kManageAutofillAi,\n        SuggestionType::kAutofillAiPrivateInferenceNotice}) {\n    Suggestion incoming_suggestion(type);\n    external_delegate().DidSelectSuggestion(incoming_suggestion);\n    external_delegate().DidAcceptSuggestion(\n        incoming_suggestion, SuggestionPosition{.multi_index = {0}});\n    EXPECT_FALSE(external_delegate().RemoveSuggestion(incoming_suggestion));\n    EXPECT_EQ(external_delegate().GetQueriedFieldId(), ordinary_query);\n  }\n}\n\nTEST_F(AutofillExternalDelegateTest,\n       AndroidReturnedRowsPruneNestedUnsupportedItemsAndKeepOrdinaryRows) {\n  IssueOnQuery();\n  Suggestion address = CreateAutofillSuggestion(SuggestionType::kAddressEntry,\n                                                u\"address suggestion\");\n  address.children = {\n      Suggestion(SuggestionType::kAtMemorySearchResult),\n      CreateAutofillSuggestion(SuggestionType::kAutocompleteEntry,\n                               u\"ordinary nested value\"),\n      Suggestion(SuggestionType::kPersonalContextNotice)};\n  Suggestion payment = CreateAutofillSuggestion(\n      SuggestionType::kCreditCardEntry, u\"ordinary card\");\n  EXPECT_CALL(autofill_client(), ShowAutofillSuggestions(_, _))\n      .WillOnce([](const AutofillClient::PopupOpenArgs& args,\n                   base::WeakPtr<AutofillSuggestionDelegate>) {\n        EXPECT_EQ(args.suggestions.size(), 2u);\n        if (args.suggestions.size() != 2u) {\n          return AutofillClient::SuggestionUiSessionId(1);\n        }\n        EXPECT_EQ(args.suggestions[0].type, SuggestionType::kAddressEntry);\n        EXPECT_EQ(args.suggestions[1].type, SuggestionType::kCreditCardEntry);\n        EXPECT_THAT(\n            args.suggestions[0].children,\n            ElementsAre(testing::Field(&Suggestion::type,\n                                       SuggestionType::kAutocompleteEntry)));\n        return AutofillClient::SuggestionUiSessionId(1);\n      });\n  OnSuggestionsReturned(\n      queried_field(),\n      {Suggestion(SuggestionType::kMaximizeCreditCardBenefitsEntry), address,\n       Suggestion(SuggestionType::kAtMemorySearchAffordance), payment});\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n"
