# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ base::optional_ref<const\ EntityInstance>\ GetEntityInstance\(\

      \ \ \ \ \ \ const\ Suggestion\&\ suggestion\)\ const;\

      '
    replace: "  base::optional_ref<const EntityInstance> GetEntityInstance(\n      const Suggestion& suggestion) const;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ //\ has\ an\ `AutofillAiPayload`\.\

      '
    replace: '  // has an `AutofillAiPayload`.

      #if !BUILDFLAG(IS_ANDROID)

      '
