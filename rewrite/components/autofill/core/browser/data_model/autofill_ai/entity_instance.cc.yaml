substitutions:
- description: Own explicit platform macro provider
  regex:
    pattern: '#include "base/types/optional_ref.h"

      '
    replace: '#include "base/types/optional_ref.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude removed personal-context generated header on Android
  regex:
    pattern: '#include "components/personal_context/proto/features/at_memory.pb.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/personal_context/proto/features/at_memory.pb.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit only personal-context typed-value conversion implementation
  regex:
    pattern: "personal_context::proto::TypedValue AttributeInstance::GetTypedValue() const {\n  personal_context::proto::TypedValue\
      \ typed_value;\n  std::visit(\n      absl::Overload{[&typed_value](const CountryInfo& country) {\n                 \
      \      std::string code = country.GetCountryCode();\n                       if (!code.empty()) {\n                 \
      \        typed_value.set_country_code(std::move(code));\n                       }\n                     },\n       \
      \              [&typed_value](const DateInfo& date) {\n                       personal_context::proto::Date date_proto\
      \ =\n                           date.GetDateProto();\n                       if (date_proto.year() != 0 || date_proto.month()\
      \ != 0 ||\n                           date_proto.day() != 0) {\n                         *typed_value.mutable_date()\
      \ = std::move(date_proto);\n                       }\n                     },\n                     [](const NameInfo&)\
      \ {}, [](const StateInfo&) {},\n                     [](const std::u16string&) {}},\n      info_);\n  return typed_value;\n\
      }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\npersonal_context::proto::TypedValue AttributeInstance::GetTypedValue() const {\n\
      \  personal_context::proto::TypedValue typed_value;\n  std::visit(\n      absl::Overload{[&typed_value](const CountryInfo&\
      \ country) {\n                       std::string code = country.GetCountryCode();\n                       if (!code.empty())\
      \ {\n                         typed_value.set_country_code(std::move(code));\n                       }\n           \
      \          },\n                     [&typed_value](const DateInfo& date) {\n                       personal_context::proto::Date\
      \ date_proto =\n                           date.GetDateProto();\n                       if (date_proto.year() != 0 ||\
      \ date_proto.month() != 0 ||\n                           date_proto.day() != 0) {\n                         *typed_value.mutable_date()\
      \ = std::move(date_proto);\n                       }\n                     },\n                     [](const NameInfo&)\
      \ {}, [](const StateInfo&) {},\n                     [](const std::u16string&) {}},\n      info_);\n  return typed_value;\n\
      }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
