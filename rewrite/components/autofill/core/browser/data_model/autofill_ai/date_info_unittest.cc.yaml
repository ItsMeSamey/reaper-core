substitutions:
- description: Only removed personalcontext generated header
  regex:
    pattern: '#include "components/personal_context/proto/features/common_data.pb.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/personal_context/proto/features/common_data.pb.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Only one personalcontext Date proto conversion case
  regex:
    pattern: "// Tests that GetDateProto() populates a proto with  year, month, and day.\nTEST(DateInfo, GetDateProto) {\n\
      \  DateInfo info;\n  info.SetDate(u\"16/12/2022\", u\"DD/MM/YYYY\");\n  personal_context::proto::Date proto = info.GetDateProto();\n\
      \  EXPECT_EQ(proto.year(), 2022);\n  EXPECT_EQ(proto.month(), 12);\n  EXPECT_EQ(proto.day(), 16);\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Tests that GetDateProto() populates a proto with  year, month, and day.\nTEST(DateInfo,\
      \ GetDateProto) {\n  DateInfo info;\n  info.SetDate(u\"16/12/2022\", u\"DD/MM/YYYY\");\n  personal_context::proto::Date\
      \ proto = info.GetDateProto();\n  EXPECT_EQ(proto.year(), 2022);\n  EXPECT_EQ(proto.month(), 12);\n  EXPECT_EQ(proto.day(),\
      \ 16);\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Verify invalid date input resets the previous valid date
  regex:
    pattern: "  info.SetDate(u\"foobar\", u\"DD/MM/YYYY\");\n  EXPECT_EQ(info.GetDate(u\"\"), u\"\");\n"
    replace: "  info.SetDate(u\"foobar\", u\"DD/MM/YYYY\");\n  EXPECT_EQ(info.GetDate(u\"YYYY-MM-DD\"), u\"\");\n"
  count: 1
