substitutions:
- description: Own explicit platform macro provider
  regex:
    pattern: '#include "base/uuid.h"

      '
    replace: '#include "base/uuid.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Omit personal-context forward types on Android
  regex:
    pattern: 'namespace personal_context::proto {

      class Entity;

      class TypedValue;

      }  // namespace personal_context::proto

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      namespace personal_context::proto {

      class Entity;

      class TypedValue;

      }  // namespace personal_context::proto

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit personal-context-only typed-value conversion declaration
  regex:
    pattern: "  // Returns a TypedValue representation of the attribute if available (e.g.,\n  // country code for CountryInfo\
      \ or calendar date for DateInfo).\n  // If the attribute has no typed representation or is empty/unset, returns a\n\
      \  // default-constructed TypedValue whose oneof value is not set. We return a\n  // TypedValue by value (instead of\
      \ std::optional<TypedValue>) so that\n  // TypedValue can be forward-declared in this header without including the\n\
      \  // protobuf header.\n  personal_context::proto::TypedValue GetTypedValue() const;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Returns a TypedValue representation of the attribute if available (e.g.,\n\
      \  // country code for CountryInfo or calendar date for DateInfo).\n  // If the attribute has no typed representation\
      \ or is empty/unset, returns a\n  // default-constructed TypedValue whose oneof value is not set. We return a\n  //\
      \ TypedValue by value (instead of std::optional<TypedValue>) so that\n  // TypedValue can be forward-declared in this\
      \ header without including the\n  // protobuf header.\n  personal_context::proto::TypedValue GetTypedValue() const;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit friend declaration for removed personal-context-only conversion
  regex:
    pattern: "    friend std::optional<EntityInstance> PersonalContextEntityToEntityInstance(\n        const personal_context::proto::Entity&,\n\
      \        bool);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    friend std::optional<EntityInstance> PersonalContextEntityToEntityInstance(\n\
      \        const personal_context::proto::Entity&,\n        bool);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
