substitutions:
- description: Own explicit platform macro provider
  regex:
    pattern: '#include "base/time/time.h"

      '
    replace: '#include "base/time/time.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude removed personal-context generated header on Android
  regex:
    pattern: '#include "components/personal_context/proto/features/common_data.pb.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/personal_context/proto/features/common_data.pb.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit only personal-context Date proto conversion implementation
  regex:
    pattern: "personal_context::proto::Date DateInfo::GetDateProto() const {\n  personal_context::proto::Date proto_date;\n\
      \  proto_date.set_year(date_.year);\n  proto_date.set_month(date_.month);\n  proto_date.set_day(date_.day);\n  return\
      \ proto_date;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\npersonal_context::proto::Date DateInfo::GetDateProto() const {\n  personal_context::proto::Date\
      \ proto_date;\n  proto_date.set_year(date_.year);\n  proto_date.set_month(date_.month);\n  proto_date.set_day(date_.day);\n\
      \  return proto_date;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
