substitutions:
- description: Explicit platform macro provider
  regex:
    pattern: '#include "base/uuid.h"

      '
    replace: '#include "base/uuid.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Only removed personalcontext generated header
  regex:
    pattern: '#include "components/personal_context/proto/features/at_memory.pb.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/personal_context/proto/features/at_memory.pb.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Only three TypedValue personalcontext conversion cases
  regex:
    pattern: "// Tests that GetTypedValue() returns the country code for a country attribute.\nTEST_F(AutofillEntityInstanceTest,\
      \ GetTypedValue_Country) {\n  AttributeType type(kPassportCountry);\n  AttributeInstance attribute(type);\n  attribute.SetInfo(PASSPORT_ISSUING_COUNTRY,\
      \ u\"United States\",\n                    /*app_locale=*/\"en_US\",\n                    /*format_string=*/std::nullopt,\n\
      \                    VerificationStatus::kObserved);\n  personal_context::proto::TypedValue val = attribute.GetTypedValue();\n\
      \  EXPECT_TRUE(val.has_country_code());\n  EXPECT_EQ(val.country_code(), \"US\");\n}\n\n// Tests that GetTypedValue()\
      \ returns the date proto for a date attribute.\nTEST_F(AutofillEntityInstanceTest, GetTypedValue_Date) {\n  AttributeType\
      \ type(kFlightReservationDepartureDate);\n  AttributeInstance attribute(type);\n  attribute.SetInfo(FLIGHT_RESERVATION_DEPARTURE_DATE,\
      \ u\"2025-01-01\",\n                    /*app_locale=*/\"en_US\",\n                    AutofillFormatString(u\"YYYY-MM-DD\"\
      , FormatString_Type_DATE),\n                    VerificationStatus::kObserved);\n  personal_context::proto::TypedValue\
      \ val = attribute.GetTypedValue();\n  EXPECT_TRUE(val.has_date());\n  EXPECT_EQ(val.date().year(), 2025);\n  EXPECT_EQ(val.date().month(),\
      \ 1);\n  EXPECT_EQ(val.date().day(), 1);\n}\n\n// Tests that GetTypedValue() returns an unset TypedValue for a string\n\
      // attribute.\nTEST_F(AutofillEntityInstanceTest, GetTypedValue_Unset) {\n  AttributeType type(kPassportNumber);\n \
      \ AttributeInstance attribute(type);\n  attribute.SetInfo(PASSPORT_NUMBER, u\"12345\", /*app_locale=*/\"en_US\",\n \
      \                   /*format_string=*/std::nullopt,\n                    VerificationStatus::kObserved);\n  personal_context::proto::TypedValue\
      \ val = attribute.GetTypedValue();\n  EXPECT_EQ(val.value_case(),\n            personal_context::proto::TypedValue::VALUE_NOT_SET);\n\
      }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Tests that GetTypedValue() returns the country code for a country attribute.\n\
      TEST_F(AutofillEntityInstanceTest, GetTypedValue_Country) {\n  AttributeType type(kPassportCountry);\n  AttributeInstance\
      \ attribute(type);\n  attribute.SetInfo(PASSPORT_ISSUING_COUNTRY, u\"United States\",\n                    /*app_locale=*/\"\
      en_US\",\n                    /*format_string=*/std::nullopt,\n                    VerificationStatus::kObserved);\n\
      \  personal_context::proto::TypedValue val = attribute.GetTypedValue();\n  EXPECT_TRUE(val.has_country_code());\n  EXPECT_EQ(val.country_code(),\
      \ \"US\");\n}\n\n// Tests that GetTypedValue() returns the date proto for a date attribute.\nTEST_F(AutofillEntityInstanceTest,\
      \ GetTypedValue_Date) {\n  AttributeType type(kFlightReservationDepartureDate);\n  AttributeInstance attribute(type);\n\
      \  attribute.SetInfo(FLIGHT_RESERVATION_DEPARTURE_DATE, u\"2025-01-01\",\n                    /*app_locale=*/\"en_US\"\
      ,\n                    AutofillFormatString(u\"YYYY-MM-DD\", FormatString_Type_DATE),\n                    VerificationStatus::kObserved);\n\
      \  personal_context::proto::TypedValue val = attribute.GetTypedValue();\n  EXPECT_TRUE(val.has_date());\n  EXPECT_EQ(val.date().year(),\
      \ 2025);\n  EXPECT_EQ(val.date().month(), 1);\n  EXPECT_EQ(val.date().day(), 1);\n}\n\n// Tests that GetTypedValue()\
      \ returns an unset TypedValue for a string\n// attribute.\nTEST_F(AutofillEntityInstanceTest, GetTypedValue_Unset) {\n\
      \  AttributeType type(kPassportNumber);\n  AttributeInstance attribute(type);\n  attribute.SetInfo(PASSPORT_NUMBER,\
      \ u\"12345\", /*app_locale=*/\"en_US\",\n                    /*format_string=*/std::nullopt,\n                    VerificationStatus::kObserved);\n\
      \  personal_context::proto::TypedValue val = attribute.GetTypedValue();\n  EXPECT_EQ(val.value_case(),\n           \
      \ personal_context::proto::TypedValue::VALUE_NOT_SET);\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
