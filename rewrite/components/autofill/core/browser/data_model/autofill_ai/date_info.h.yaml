substitutions:
- description: Own explicit platform macro provider
  regex:
    pattern: '#include "components/autofill/core/browser/data_model/data_model_util.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/autofill/core/browser/data_model/data_model_util.h"

      '
  count: 1
- description: Omit personal-context Date forward type on Android
  regex:
    pattern: 'namespace personal_context::proto {

      class Date;

      }  // namespace personal_context::proto

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      namespace personal_context::proto {

      class Date;

      }  // namespace personal_context::proto

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit personal-context-only conversion declaration
  regex:
    pattern: "  // Returns the date in a `personal_context::proto::Date` representation.\n  personal_context::proto::Date\
      \ GetDateProto() const;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Returns the date in a `personal_context::proto::Date` representation.\n  personal_context::proto::Date\
      \ GetDateProto() const;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
