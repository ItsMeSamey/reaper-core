# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\}\ \ //\ namespace\ autofill\

      '
    replace: '}  // namespace autofill

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/core/browser/integrators/personal_context/personal_context_autofill_util\.h"\

      \

      '
    replace: '#include "components/autofill/core/browser/integrators/personal_context/personal_context_autofill_util.h"


      #if !BUILDFLAG(IS_ANDROID)

      '
