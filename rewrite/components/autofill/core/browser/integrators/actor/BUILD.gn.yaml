# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/autofill/core/browser/integrators/actor/BUILD.gn'
  regex:
    re_pattern: 'static_library\("actor_form_filling_types"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "actor_form_filling_types\.cc",\

      \ \ \ \ "actor_form_filling_types\.h",\

      \ \ \]\

      \ \ public_deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//components/optimization_guide/proto:optimization_guide_proto",\

      \ \ \ \ "//ui/gfx",\

      \ \ \ \ "//url",\

      \ \ \]\

      \}\

      '
    replace: "if (!is_android) {\n  static_library(\"actor_form_filling_types\") {\n    sources = [\n      \"actor_form_filling_types.cc\",\n      \"actor_form_filling_types.h\",\n    ]\n    public_deps = [\n      \"//base\",\n      \"//components/optimization_guide/proto:optimization_guide_proto\",\n      \"//ui/gfx\",\n      \"//url\",\n    ]\n  }\n}\n"
