- description: Android mixed Valuable loyalty adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ sync_pb::EntitySpecifics\ TrimAllSupportedFieldsFromRemoteSpecifics\(\

      \ \ \ \ \ \ const\ sync_pb::EntitySpecifics\&\ entity_specifics\)\ const\ override;\

      \

      \ \ //\ AutofillWebDataServiceObserverOnDBSequence:\

      \ \ void\ ServerEntityInstanceMetadataChanged\(\

      \ \ \ \ \ \ const\ EntityInstanceMetadataChange\&\ change\)\ override;\

      \

      \ \ //\ AutofillWebDataServiceObserverOnDBSequence:\

      \ \ void\ ValuableMetadataChanged\(const\ ValuableMetadataChange\&\ change\)\ override;\

      '
    replace: "  sync_pb::EntitySpecifics TrimAllSupportedFieldsFromRemoteSpecifics(\n      const sync_pb::EntitySpecifics& entity_specifics) const override;\n\n#if !BUILDFLAG(IS_ANDROID)\n  // AutofillWebDataServiceObserverOnDBSequence:\n  void ServerEntityInstanceMetadataChanged(\n      const EntityInstanceMetadataChange& change) override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  // AutofillWebDataServiceObserverOnDBSequence:\n  void ValuableMetadataChanged(const ValuableMetadataChange& change) override;\n"
- description: Android mixed Valuable loyalty adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ \ \ \ \ std::unique_ptr<syncer::MetadataChangeList>\ metadata_change_list,\

      \ \ \ \ \ \ syncer::EntityChangeList\ entity_data\);\

      \

      \ \ //\ Uploads\ local\ data\ that\ is\ not\ part\ of\ `entity_data`\ received\ from\ the\

      \ \ //\ server\ during\ initial\ `MergeFullSyncData\(\)`\.\

      \ \ void\ UploadInitialLocalEntityMetadata\(\

      \ \ \ \ \ \ syncer::MetadataChangeList\*\ metadata_change_list,\

      \ \ \ \ \ \ const\ syncer::EntityChangeList\&\ entity_data\);\

      \

      \ \ //\ Uploads\ local\ valuable\ metadata\ that\ is\ not\ part\ of\ `entity_data`\ received\

      \ \ //\ from\ the\ server\ during\ initial\ `MergeFullSyncData\(\)`\.\

      '
    replace: "      std::unique_ptr<syncer::MetadataChangeList> metadata_change_list,\n      syncer::EntityChangeList entity_data);\n\n#if !BUILDFLAG(IS_ANDROID)\n  // Uploads local data that is not part of `entity_data` received from the\n  // server during initial `MergeFullSyncData()`.\n  void UploadInitialLocalEntityMetadata(\n      syncer::MetadataChangeList* metadata_change_list,\n      const syncer::EntityChangeList& entity_data);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  // Uploads local valuable metadata that is not part of `entity_data` received\n  // from the server during initial `MergeFullSyncData()`.\n"
- description: Android mixed Valuable loyalty adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ //\ the\ number\ of\ metadata\ records\ that\ were\ deleted\ from\ the\ valuables\ and\

      \ \ //\ entity\ tables,\ respectively\.\

      \ \ void\ DeleteOrphanMetadata\(\);\

      \ \ int\ DeleteOrphanEntityMetadata\(\

      \ \ \ \ \ \ syncer::MetadataChangeList\*\ metadata_change_list,\

      \ \ \ \ \ \ const\ base::flat_set<ValuableId>\&\ non_orphan_loyalty_card_ids\);\

      \ \ int\ DeleteOrphanValuableMetadata\(\

      \ \ \ \ \ \ syncer::MetadataChangeList\*\ metadata_change_list,\

      \ \ \ \ \ \ const\ base::flat_set<ValuableId>\&\ non_orphan_loyalty_card_ids\);\

      '
    replace: "  // the number of metadata records that were deleted from the valuables and\n  // entity tables, respectively.\n  void DeleteOrphanMetadata();\n#if !BUILDFLAG(IS_ANDROID)\n  int DeleteOrphanEntityMetadata(\n      syncer::MetadataChangeList* metadata_change_list,\n      const base::flat_set<ValuableId>& non_orphan_loyalty_card_ids);\n#endif  // !BUILDFLAG(IS_ANDROID)\n  int DeleteOrphanValuableMetadata(\n      syncer::MetadataChangeList* metadata_change_list,\n      const base::flat_set<ValuableId>& non_orphan_loyalty_card_ids);\n"
- description: Android mixed Valuable loyalty adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ bool\ SyncMetadataCacheContainsSupportedFields\(\

      \ \ \ \ \ \ const\ syncer::EntityMetadataMap\&\ metadata_map\)\ const;\

      \

      \ \ //\ Returns\ the\ `EntityTable`\ associated\ with\ the\ `web_data_backend_`\.\

      \ \ EntityTable\*\ GetEntityTable\(\);\

      \

      '
