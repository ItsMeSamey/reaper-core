- description: Android mixed Valuable loyalty adapter, exact unique predecessor span.
  regex:
    re_pattern: '\ \ //\ Returns\ the\ `PassType`\ of\ the\ entity\ associated\ with\ the\ metadata\.\

      \ \ std::optional<sync_pb::AutofillValuableMetadataSpecifics::PassType>\

      \ \ GetPassTypeForEntityId\(const\ EntityInstance::EntityId\&\ guid\);\

      \

