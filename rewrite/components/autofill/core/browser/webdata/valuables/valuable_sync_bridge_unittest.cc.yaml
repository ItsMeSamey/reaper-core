    pattern: "#if BUILDFLAG(IS_ANDROID)\nTEST_F(ValuableSyncBridgeTest,\n       AndroidFullSyncMixedDocumentsRetainsLoyaltyCards) {\n  const LoyaltyCard card = TestLoyaltyCard(\"1\");\n  sync_pb::AutofillValuableSpecifics document;\n  document.set_id(\"document\");\n  document.mutable_vehicle_registration();\n  auto unsupported = CreateEntityDataFromSpecifics(document);\n  EXPECT_FALSE(bridge().IsEntityDataValid(*unsupported));\n  syncer::EntityChangeList changes;\n  changes.push_back(\n      syncer::EntityChange::CreateAdd(document.id(), std::move(*unsupported)));\n  changes.push_back(syncer::EntityChange::CreateAdd(card.id().value(),\n                                                    CardToEntityData(card)));\n  EXPECT_FALSE(bridge()\n                   .MergeFullSyncData(bridge().CreateMetadataChangeList(),\n                                      std::move(changes))\n                   .has_value());\n  EXPECT_THAT(GetAllLoyaltyCardsFromTable(), ElementsAre(card));\n  EXPECT_THAT(\n      ExtractLoyaltyCardsFromDataBatch(bridge().GetAllDataForDebugging()),\n      ElementsAre(card));\n}\nTEST_F(ValuableSyncBridgeTest,\n       AndroidRealIncrementalBridgeIgnoresDocumentsWithoutDroppingLoyalty) {\n  ASSERT_TRUE(bridge().SupportsIncrementalUpdates());\n  const LoyaltyCard card = TestLoyaltyCard(\"1\");\n  sync_pb::AutofillValuableSpecifics document;\n  document.set_id(\"document\");\n  document.mutable_flight_reservation();\n  syncer::EntityChangeList changes;\n  changes.push_back(syncer::EntityChange::CreateAdd(\n      document.id(), std::move(*CreateEntityDataFromSpecifics(document))));\n  changes.push_back(syncer::EntityChange::CreateAdd(card.id().value(),\n                                                    CardToEntityData(card)));\n  EXPECT_FALSE(bridge()\n                   .ApplyIncrementalSyncChanges(\n                       bridge().CreateMetadataChangeList(), std::move(changes))\n                   .has_value());\n  EXPECT_THAT(GetAllLoyaltyCardsFromTable(), ElementsAre(card));\n  syncer::EntityChangeList deletes;\n  deletes.push_back(syncer::EntityChange::CreateDelete(card.id().value(),\n                                                       CardToEntityData(card)));\n  EXPECT_FALSE(bridge()\n                   .ApplyIncrementalSyncChanges(\n                       bridge().CreateMetadataChangeList(), std::move(deletes))\n                   .has_value());\n  EXPECT_TRUE(GetAllLoyaltyCardsFromTable().empty());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n"
