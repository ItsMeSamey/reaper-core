# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/autofill/core/browser/actor/BUILD.gn'
  regex:
    re_pattern: '\

      import\("//build/config/features\.gni"\)\

      \

      source_set\("actor"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "actor_autofill_manager\.cc",\

      \ \ \ \ "actor_autofill_manager\.h",\

      \ \ \ \ "actor_filling_observer\.cc",\

      \ \ \ \ "actor_filling_observer\.h",\

      \ \ \ \ "actor_form_filling_service\.h",\

      \ \ \ \ "actor_form_filling_service_impl\.cc",\

      \ \ \ \ "actor_form_filling_service_impl\.h",\

      \ \ \ \ "actor_form_section_splitter\.cc",\

      \ \ \ \ "actor_form_section_splitter\.h",\

      \ \ \ \ "actor_key_metrics_recorder\.cc",\

      \ \ \ \ "actor_key_metrics_recorder\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ "//base",\

      \ \ \ \ "//components/actor/core:journal",\

      \ \ \ \ "//components/autofill/core/browser/integrators/actor:actor_form_filling_types",\

      \ \ \ \ "//components/keyed_service/core",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//components/autofill/core/browser",\

      \ \ \ \ "//components/autofill/core/common",\

      \ \ \ \ "//components/critical_actions/core/browser",\

      \ \ \ \ "//ui/gfx/geometry",\

      \ \ \]\

      \}\

      \

      source_set\("test_support"\)\ \{\

      \ \ testonly\ =\ true\

      \ \ sources\ =\ \[\

      \ \ \ \ "actor_form_filling_service_impl_test_api\.h",\

      \ \ \ \ "actor_test_util\.cc",\

      \ \ \ \ "actor_test_util\.h",\

      \ \ \ \ "mock_actor_form_filling_service\.cc",\

      \ \ \ \ "mock_actor_form_filling_service\.h",\

      \ \ \]\

      \

      \ \ public_deps\ =\ \[\

      \ \ \ \ ":actor",\

      \ \ \ \ "//base",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ "//base/test:test_support",\

      \ \ \ \ "//components/autofill/core/browser:test_support",\

      \ \ \ \ "//testing/gmock",\

      \ \ \ \ "//testing/gtest",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \ \ sources\ =\ \[\

      \ \ \ \ "actor_autofill_manager_unittest\.cc",\

      \ \ \ \ "actor_filling_observer_unittest\.cc",\

      \ \ \ \ "actor_form_filling_service_unittest\.cc",\

      \ \ \ \ "actor_form_section_splitter_unittest\.cc",\

      \ \ \ \ "actor_key_metrics_recorder_unittest\.cc",\

      \ \ \]\

      \

      \ \ deps\ =\ \[\

      \ \ \ \ ":actor",\

      \ \ \ \ ":test_support",\

      \ \ \ \ "//base",\

      \ \ \ \ "//base/test:test_support",\

      \ \ \ \ "//components/autofill/core/browser:test_support",\

      \ \ \ \ "//components/critical_actions/core/browser",\

      \ \ \ \ "//testing/gmock",\

      \ \ \ \ "//testing/gtest",\

      \ \ \ \ "//ui/gfx:test_support",\

      \ \ \]\

      \}\

      '
    replace: "\nimport(\"//build/config/features.gni\")\n\nif (!is_android) {\n  source_set(\"actor\") {\n    sources = [\n      \"actor_autofill_manager.cc\",\n      \"actor_autofill_manager.h\",\n      \"actor_filling_observer.cc\",\n      \"actor_filling_observer.h\",\n      \"actor_form_filling_service.h\",\n      \"actor_form_filling_service_impl.cc\",\n      \"actor_form_filling_service_impl.h\",\n      \"actor_form_section_splitter.cc\",\n      \"actor_form_section_splitter.h\",\n      \"actor_key_metrics_recorder.cc\",\n      \"actor_key_metrics_recorder.h\",\n    ]\n\n    public_deps = [\n      \"//base\",\n      \"//components/actor/core:journal\",\n      \"//components/autofill/core/browser/integrators/actor:actor_form_filling_types\",\n      \"//components/keyed_service/core\",\n    ]\n\n    deps = [\n      \"//components/autofill/core/browser\",\n      \"//components/autofill/core/common\",\n      \"//components/critical_actions/core/browser\",\n      \"//ui/gfx/geometry\",\n    ]\n  }\n\n  source_set(\"test_support\") {\n    testonly = true\n    sources = [\n      \"actor_form_filling_service_impl_test_api.h\",\n      \"actor_test_util.cc\",\n      \"actor_test_util.h\",\n      \"mock_actor_form_filling_service.cc\",\n      \"mock_actor_form_filling_service.h\",\n    ]\n\n    public_deps = [\n      \":actor\",\n      \"//base\",\n    ]\n\n    deps = [\n      \"//base/test:test_support\",\n      \"//components/autofill/core/browser:test_support\",\n      \"//testing/gmock\",\n      \"//testing/gtest\",\n    ]\n  }\n\n  source_set(\"unit_tests\") {\n    testonly = true\n    sources = [\n      \"actor_autofill_manager_unittest.cc\",\n      \"actor_filling_observer_unittest.cc\",\n      \"actor_form_filling_service_unittest.cc\",\n      \"actor_form_section_splitter_unittest.cc\",\n      \"actor_key_metrics_recorder_unittest.cc\",\n    ]\n\n    deps = [\n      \":actor\",\n      \":test_support\",\n      \"//base\",\n      \"//base/test:test_support\",\n      \"//components/autofill/core/browser:test_support\",\n      \"//components/critical_actions/core/browser\",\n      \"//testing/gmock\",\n      \"//testing/gtest\",\n      \"//ui/gfx:test_support\",\n    ]\n  }\n}\n"
