# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ return\ bnpl_manager_\->HasSeenAmountExtractionAiTerms\(\);\

      \ \ \}\

      '
    replace: "    return bnpl_manager_->HasSeenAmountExtractionAiTerms();\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ bnpl_manager_\->UpdateBnplPaymentInstrument\(\);\

      \ \ \}\

      \

      '
    replace: "    bnpl_manager_->UpdateBnplPaymentInstrument();\n  }\n\n#if !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "base/check_deref\.h"\

      '
    replace: '#include "base/check_deref.h"

      #include "build/build_config.h"

      '
