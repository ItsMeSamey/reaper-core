substitutions:
- description: Include the explicit Android build guard definition
  regex:
    pattern: '#include "base/notreached.h"

      '
    replace: '#include "base/notreached.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude public-pass-only include while preserving ordinary card payments
  regex:
    pattern: '#include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude public-pass-only include while preserving ordinary card payments
  regex:
    pattern: '#include "components/autofill/core/browser/integrators/autofill_ai/autofill_ai_wallet_util.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/integrators/autofill_ai/autofill_ai_wallet_util.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Compile out only the public-pass eligibility overload on Android
  regex:
    pattern: "bool WalletReminderNoticeManager::IsWalletReminderNoticeEligible(\n    const EntityType& type,\n    const EntityInstance::RecordType&\
      \ record_type) {\n  if (!base::FeatureList::IsEnabled(\n          autofill::features::kAutofillEnableWalletReminderNoticePublicPass))\
      \ {\n    return false;\n  }\n  // The notice applies to any entity that is a public pass upstreamed to\n  // wallet\
      \ (e.g., Vehicles) and is not read-only.\n  if (!IsEligibleForWalletNotice(type, record_type)) {\n    return false;\n\
      \  }\n  if (prefs::HasShownWalletReminderNotice(client_->GetPrefs())) {\n    autofill_metrics::LogWalletReminderNoticeShowResult(\n\
      \        autofill_metrics::WalletReminderNoticeShowResult::\n            kNotShownAlreadyAcknowledgedAccordingToPref);\n\
      \    return false;\n  }\n  return true;\n}\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nbool WalletReminderNoticeManager::IsWalletReminderNoticeEligible(\n    const EntityType&\
      \ type,\n    const EntityInstance::RecordType& record_type) {\n  if (!base::FeatureList::IsEnabled(\n          autofill::features::kAutofillEnableWalletReminderNoticePublicPass))\
      \ {\n    return false;\n  }\n  // The notice applies to any entity that is a public pass upstreamed to\n  // wallet\
      \ (e.g., Vehicles) and is not read-only.\n  if (!IsEligibleForWalletNotice(type, record_type)) {\n    return false;\n\
      \  }\n  if (prefs::HasShownWalletReminderNotice(client_->GetPrefs())) {\n    autofill_metrics::LogWalletReminderNoticeShowResult(\n\
      \        autofill_metrics::WalletReminderNoticeShowResult::\n            kNotShownAlreadyAcknowledgedAccordingToPref);\n\
      \    return false;\n  }\n  return true;\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
