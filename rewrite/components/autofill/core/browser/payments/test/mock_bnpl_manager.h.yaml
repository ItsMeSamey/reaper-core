# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \(const\ payments::AiAmountExtractionResult::ResultType\ result\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(override\)\);\

      '
    replace: "              (const payments::AiAmountExtractionResult::ResultType result),\n              (override));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \(const\ std::optional<int64_t>\&,\ bool\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \(override\)\);\

      \

      '
    replace: "              (const std::optional<int64_t>&, bool),\n              (override));\n\n#if !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#define\ COMPONENTS_AUTOFILL_CORE_BROWSER_PAYMENTS_TEST_MOCK_BNPL_MANAGER_H_\

      \

      '
    replace: '#define COMPONENTS_AUTOFILL_CORE_BROWSER_PAYMENTS_TEST_MOCK_BNPL_MANAGER_H_


      #include "build/build_config.h"

      '
