- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ u"settings\.";\

      \ \ const\ std::u16string\ kLinkText\ =\ u"payment\ settings";\

      \ \ const\ size_t\ kLinkOffset\ =\ kExpectedFullFooterText\.find\(kLinkText\);\

      \

      \ \ EXPECT_THAT\(\

      \ \ \ \ \ \ GetBnplUiFooterTextForAi\(\

      \ \ \ \ \ \ \ \ \ \ autofill_client\(\)\.GetPersonalDataManager\(\)\.payments_data_manager\(\)\),\

      \ \ \ \ \ \ testing::FieldsAre\(\

      \ \ \ \ \ \ \ \ \ \ kExpectedFullFooterText,\ gfx::Range\(0,\ 0\),\

      \ \ \ \ \ \ \ \ \ \ gfx::Range\(kLinkOffset,\ kLinkOffset\ \+\ kLinkText\.length\(\)\),\ _\)\);\

      \}\

      '
    replace: "      u\"settings.\";\n  const std::u16string kLinkText = u\"payment settings\";\n  const size_t kLinkOffset = kExpectedFullFooterText.find(kLinkText);\n\n  EXPECT_THAT(\n      GetBnplUiFooterTextForAi(\n          autofill_client().GetPersonalDataManager().payments_data_manager()),\n      testing::FieldsAre(\n          kExpectedFullFooterText, gfx::Range(0, 0),\n          gfx::Range(kLinkOffset, kLinkOffset + kLinkText.length()), _));\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
