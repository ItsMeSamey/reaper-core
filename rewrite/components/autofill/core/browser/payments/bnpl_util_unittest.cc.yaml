    replace: "                                             Suggestion::Icon::kBnplZip}));\n\n#if BUILDFLAG(IS_ANDROID)\nTEST_F(BnplUtilTest, AndroidKnownAmountPreservesIssuerOrderWithAiFlagOn) {\n  std::vector<BnplIssuer> order{\n      test::GetTestLinkedBnplIssuer(IssuerId::kBnplZip),\n      test::GetTestLinkedBnplIssuer(IssuerId::kBnplAffirm)};\n  std::vector<BnplIssuerContext> contexts =\n      GetSortedBnplIssuerContext(autofill_client(), 100'000'000, order);\n  ASSERT_EQ(contexts.size(), 2U);\n  EXPECT_EQ(contexts[0].issuer.issuer_id(), IssuerId::kBnplZip);\n  EXPECT_EQ(contexts[1].issuer.issuer_id(), IssuerId::kBnplAffirm);\n  EXPECT_TRUE(contexts[0].IsEligible());\n  EXPECT_TRUE(contexts[1].IsEligible());\n}\n#endif\n\n"
