substitutions:
- description: Include the explicit Android build guard definition
  regex:
    pattern: '#include "base/memory/weak_ptr.h"

      '
    replace: '#include "base/memory/weak_ptr.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude pass entity dependencies from the ordinary payment interface on Android
  regex:
    pattern: '#include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      #include "components/autofill/core/browser/data_model/autofill_ai/entity_type.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      #include "components/autofill/core/browser/data_model/autofill_ai/entity_type.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Keep the credit-card overload and shared request lifecycle; omit the Android pass overload
  regex:
    pattern: "  // Checks if a user is eligible to see the Wallet reminder notice for a public\n  // pass with `type` and\
      \ `record_type`. Returns true if the entity is eligible\n  // and the notice has not already been acknowledged.\n  bool\
      \ IsWalletReminderNoticeEligible(\n      const EntityType& type,\n      const EntityInstance::RecordType& record_type);\n\
      \n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Checks if a user is eligible to see the Wallet reminder notice for a public\n\
      \  // pass with `type` and `record_type`. Returns true if the entity is eligible\n  // and the notice has not already\
      \ been acknowledged.\n  bool IsWalletReminderNoticeEligible(\n      const EntityType& type,\n      const EntityInstance::RecordType&\
      \ record_type);\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
