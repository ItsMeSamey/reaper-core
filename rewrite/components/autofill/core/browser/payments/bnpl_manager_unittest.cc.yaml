# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#endif\ \ //\ BUILDFLAG\(IS_ANDROID\)\

      \

      \}\ \ //\ namespace\

      '
    replace: "#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace\n\n#if BUILDFLAG(IS_ANDROID)\nTEST_F(BnplManagerTest,\n       AndroidAiFlagCannotSendIssuerRequestWithoutOrdinaryAmount) {\n  base::test::ScopedFeatureList scoped_features;\n  scoped_features.InitWithFeatures(\n      {features::kAutofillEnableAiBasedAmountExtraction},\n      {features::kAutofillEnablePayNowPayLaterTabs});\n  auto& data = payments_autofill_client().GetPaymentsDataManager();\n  ASSERT_FALSE(data.IsAutofillAmountExtractionAiTermsSeenPrefEnabled());\n  EXPECT_CALL(GetBnplUiDelegate(),\n              ShowProgressUi(\n                  AutofillProgressUiType::kBnplAmountExtractionProgressUi, _));\n  EXPECT_CALL(GetBnplUiDelegate(), ShowSelectBnplIssuerUi(_, _, _, _)).Times(0);\n  EXPECT_CALL(*payments_network_interface_,\n              GetDetailsForCreateBnplPaymentInstrument(_, _))\n      .Times(0);\n  EXPECT_CALL(*payments_network_interface_,\n              GetDetailsForUpdateBnplPaymentInstrument(_, _))\n      .Times(0);\n  EXPECT_CALL(*payments_network_interface_,\n              GetBnplPaymentInstrumentForFetchingUrl(_, _))\n      .Times(0);\n  bnpl_manager_->OnUserDecisionToUseBnpl(std::nullopt, base::DoNothing());\n  bnpl_manager_->OnIssuerAccepted(test::GetTestUnlinkedBnplIssuer());\n  EXPECT_FALSE(data.IsAutofillAmountExtractionAiTermsSeenPrefEnabled());\n  EXPECT_FALSE(\n      test_api(*bnpl_manager_).GetOngoingFlowState()->final_checkout_amount);\n  EXPECT_CALL(*mock_amount_extraction_manager_, Reset()).Times(1);\n  bnpl_manager_->Reset();\n}\n\nTEST_F(BnplManagerTest,\n       AndroidOrdinaryAmountCompletesIssuerSelectionWithAiFlagOn) {\n  base::test::ScopedFeatureList scoped_features;\n  scoped_features.InitWithFeatures(\n      {features::kAutofillEnableAiBasedAmountExtraction},\n      {features::kAutofillEnablePayNowPayLaterTabs});\n  SetUpLinkedBnplIssuer(0, 1'000'000'000, IssuerId::kBnplAffirm, 1234);\n  bnpl_manager_->OnUserDecisionToUseBnpl(std::nullopt, base::DoNothing());\n  EXPECT_CALL(payments_autofill_client(),\n              OnPurchaseAmountExtracted(_, Optional(kAmount), true, _, _, _));\n  bnpl_manager_->OnAmountExtractionReturned(kAmount, false);\n  EXPECT_EQ(\n      test_api(*bnpl_manager_).GetOngoingFlowState()->final_checkout_amount,\n      kAmount);\n  EXPECT_FALSE(payments_autofill_client()\n                   .GetPaymentsDataManager()\n                   .IsAutofillAmountExtractionAiTermsSeenPrefEnabled());\n}\n#endif\n\n"
