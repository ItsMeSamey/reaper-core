# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\}\ \ //\ namespace\

      '
    replace: "}  // namespace\n#if BUILDFLAG(IS_ANDROID)\nTEST_F(AmountExtractionManagerTest,\n       AndroidAiFlagCannotBypassOrdinaryPaymentAndCvcEligibility) {\n  base::test::ScopedFeatureList feature_list;\n  feature_list.InitWithFeatures(\n      {features::kAutofillEnableAiBasedAmountExtraction},\n      {features::kAutofillEnablePayNowPayLaterTabs});\n  const std::vector<Suggestion> suggestions = {\n      Suggestion(SuggestionType::kCreditCardEntry),\n      Suggestion(SuggestionType::kBnplEntry)};\n  EXPECT_THAT(amount_extraction_manager_->GetEligibleFeatures(\n                  false, suggestions, CREDIT_CARD_NUMBER),\n              IsEmpty());\n  EXPECT_THAT(amount_extraction_manager_->GetEligibleFeatures(\n                  true, suggestions, CREDIT_CARD_VERIFICATION_CODE),\n              IsEmpty());\n  EXPECT_THAT(amount_extraction_manager_->GetEligibleFeatures(\n                  true, suggestions, CREDIT_CARD_STANDALONE_VERIFICATION_CODE),\n              IsEmpty());\n}\n\nTEST_F(AmountExtractionManagerTest,\n       AndroidAiFlagCannotBypassPendingRequestAndOrdinaryReset) {\n  base::test::ScopedFeatureList feature_list;\n  feature_list.InitWithFeatures(\n      {features::kAutofillEnableAiBasedAmountExtraction},\n      {features::kAutofillEnablePayNowPayLaterTabs});\n  const std::vector<Suggestion> suggestions = {\n      Suggestion(SuggestionType::kCreditCardEntry),\n      Suggestion(SuggestionType::kBnplEntry)};\n  test_api(*amount_extraction_manager_).SetSearchRequestPending(true);\n  EXPECT_THAT(amount_extraction_manager_->GetEligibleFeatures(\n                  true, suggestions, CREDIT_CARD_NUMBER),\n              IsEmpty());\n  test_api(*amount_extraction_manager_).Reset();\n  EXPECT_FALSE(test_api(*amount_extraction_manager_).GetSearchRequestPending());\n  EXPECT_THAT(amount_extraction_manager_->GetEligibleFeatures(\n                  true, suggestions, CREDIT_CARD_NUMBER),\n              ElementsAre(AmountExtractionManager::EligibleFeature::kBnpl));\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n"
