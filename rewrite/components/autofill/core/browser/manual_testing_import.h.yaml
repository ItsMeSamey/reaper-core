substitutions:
- description: Declare platform guard directly
  regex:
    pattern: '#include "base/values.h"

      '
    replace: '#include "base/values.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Keep public FilePath type independent of removed AI includes
  regex:
    pattern: '#include "base/memory/weak_ptr.h"

      '
    replace: '#include "base/files/file_path.h"

      #include "base/memory/weak_ptr.h"

      '
  count: 1
- description: Keep public CreditCard complete independently of entity headers
  regex:
    pattern: '#include "components/autofill/core/browser/data_model/addresses/autofill_profile.h"

      '
    replace: '#include "components/autofill/core/browser/data_model/addresses/autofill_profile.h"

      #include "components/autofill/core/browser/data_model/payments/credit_card.h"

      '
  count: 1
- description: Exclude entity data manager include on Android
  regex:
    pattern: '#include "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude entity and personal-context access implementation includes on Android
  regex:
    pattern: '#include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      #include "components/autofill/core/browser/network/autofill_ai/autofill_ai_personal_context_access_manager_impl.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      #include "components/autofill/core/browser/network/autofill_ai/autofill_ai_personal_context_access_manager_impl.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude entity-file import API on Android
  regex:
    pattern: "// Reads the contents of `file`, parses it as a JSON file and converts its\n// content into a list of EntityInstances.\n\
      // If any step fails, an error message is logged and std::nullopt is returned.\nstd::optional<std::vector<EntityInstance>>\
      \ LoadEntitiesFromFile(\n    base::FilePath file);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Reads the contents of `file`, parses it as a JSON file and converts its\n// content\
      \ into a list of EntityInstances.\n// If any step fails, an error message is logged and std::nullopt is returned.\n\
      std::optional<std::vector<EntityInstance>> LoadEntitiesFromFile(\n    base::FilePath file);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude entity JSON import API on Android
  regex:
    pattern: "// Given the array of valid entities in the aforementioned JSON format,\n// converts it to a vector of EntityInstances.\n\
      // If the JSON list doesn't adhere to the above format, an error message is\n// logged and std::nullopt is returned.\n\
      std::optional<std::vector<EntityInstance>> EntitiesFromJSON(\n    const base::ListValue* const entities_json);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Given the array of valid entities in the aforementioned JSON format,\n// converts\
      \ it to a vector of EntityInstances.\n// If the JSON list doesn't adhere to the above format, an error message is\n\
      // logged and std::nullopt is returned.\nstd::optional<std::vector<EntityInstance>> EntitiesFromJSON(\n    const base::ListValue*\
      \ const entities_json);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude entity manager test import API on Android
  regex:
    pattern: 'void MaybeImportEntitiesForTesting(base::WeakPtr<EntityDataManager> edm);

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      void MaybeImportEntitiesForTesting(base::WeakPtr<EntityDataManager> edm);

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
