substitutions:
- description: Bind Android build flags directly
  regex:
    pattern: '#include "components/autofill/core/browser/crowdsourcing/votes_uploader.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/autofill/core/browser/crowdsourcing/votes_uploader.h"

      '
  count: 1
- description: Exclude Android AI entity dependency include
  regex:
    pattern: '#include "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android AI entity dependency include
  regex:
    pattern: '#include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_model/autofill_ai/entity_instance.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android vote-data entity storage
  regex:
    pattern: "  std::vector<CreditCard> credit_cards;\n  std::vector<EntityInstance> entities;\n"
    replace: "  std::vector<CreditCard> credit_cards;\n#if !BUILDFLAG(IS_ANDROID)\n  std::vector<EntityInstance> entities;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep ordinary vote availability independent of removed entities
  regex:
    pattern: "  return profiles.empty() && credit_cards.empty() && entities.empty() &&\n         loyalty_cards.empty() &&\
      \ otps.empty();\n"
    replace: "  return profiles.empty() && credit_cards.empty() &&\n#if !BUILDFLAG(IS_ANDROID)\n         entities.empty()\
      \ &&\n#endif  // !BUILDFLAG(IS_ANDROID)\n         loyalty_cards.empty() && otps.empty();\n"
  count: 1
- description: Exclude Android entity collection from vote upload
  regex:
    pattern: "  std::vector<EntityInstance> entities;\n  if (EntityDataManager* edm = client_->GetEntityDataManager()) {\n\
      \    entities = base::ToVector(edm->GetEntityInstances());\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::vector<EntityInstance> entities;\n  if (EntityDataManager* edm = client_->GetEntityDataManager())\
      \ {\n    entities = base::ToVector(edm->GetEntityInstances());\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android entity vote-data initialization
  regex:
    pattern: '      .entities = std::move(entities),

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      .entities = std::move(entities),\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Retain ordinary matching-work limit without entity input
  regex:
    pattern: '           vote_data.entities.size() + vote_data.loyalty_cards.size()) >=

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n           vote_data.entities.size() +\n#endif  // !BUILDFLAG(IS_ANDROID)\n    \
      \       vote_data.loyalty_cards.size()) >=\n"
  count: 1
- description: Retain generic matcher signature without Android entity collection
  regex:
    pattern: '                    vote_data.entities, vote_data.loyalty_cards,

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n                    vote_data.entities,\n#else\n                    /*entities=*/{},\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n                    vote_data.loyalty_cards,\n"
  count: 1
- description: Retain ordinary available-type computation without Android entities
  regex:
    pattern: "                vote_data.profiles, vote_data.credit_cards, vote_data.entities,\n                vote_data.loyalty_cards,\
      \ last_unlocked_credit_card_cvc,\n"
    replace: "                vote_data.profiles, vote_data.credit_cards,\n#if !BUILDFLAG(IS_ANDROID)\n                vote_data.entities,\n\
      #else\n                /*entities=*/{},\n#endif  // !BUILDFLAG(IS_ANDROID)\n                vote_data.loyalty_cards,\
      \ last_unlocked_credit_card_cvc,\n"
  count: 1
