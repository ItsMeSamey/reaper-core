- description: Exclude Android AI matching call while retaining generic voting
  regex:
    pattern: "  if (base::FeatureList::IsEnabled(features::kAutofillAiWithDataSchema)) {\n    AddPossibleAutofillAiTypes(entities,\
      \ value_u16, app_locale, pt);\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(features::kAutofillAiWithDataSchema)) {\n   \
      \ AddPossibleAutofillAiTypes(entities, value_u16, app_locale, pt);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
