# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\}\ \ //\ namespace\

      '
    replace: "}  // namespace\n#if BUILDFLAG(IS_ANDROID)\nTEST(SuggestionTest, AndroidUnsupportedRowsCannotBecomeSelectableOrAcceptable) {\n  using enum SuggestionType;\n  for (SuggestionType type : {kAtMemoryAiDisclosure,\n                              kAtMemoryFetching,\n                              kAtMemoryGenericError,\n                              kAtMemoryInactivityNudge,\n                              kAtMemoryNoConnection,\n                              kAtMemoryOpenGemini,\n                              kAtMemorySearchAffordance,\n                              kAtMemorySearchResult,\n                              kAtMemorySourceAttribution,\n                              kAutocompleteAtMemoryButton,\n                              kPersonalContextNotice,\n                              kManageEnhancedAutofill,\n                              kMaximizeCreditCardBenefitsEntry,\n                              kManageAutofillAi,\n                              kManageAutofillAiIdentityDocs,\n                              kManageAutofillAiShopping,\n                              kManageAutofillAiTravel,\n                              kFillAutofillAi,\n                              kFetchingAmbientData,\n                              kAutofillAiOtherOrders,\n                              kAutofillAiPrivateInferenceNotice,\n                              kAutofillAiOtherShipments,\n                              kRemoveAutofillAi,\n                              kAutofillAiSourceAttribution}) {\n    for (auto acceptability :\n         {Suggestion::Acceptability::kSelectableAndAcceptable,\n          Suggestion::Acceptability::kSelectableButUnacceptable,\n          Suggestion::Acceptability::kUnselectableAndUnacceptable}) {\n      Suggestion suggestion(type);\n      suggestion.acceptability = acceptability;\n      EXPECT_FALSE(suggestion.IsSelectable());\n      EXPECT_FALSE(suggestion.IsAcceptable());\n    }\n  }\n}\n\nTEST(SuggestionTest,\n     AndroidOrdinaryAddressAndPaymentPayloadCopiesRemainUsable) {\n  const Suggestion::Guid guid(\"00000000-0000-0000-0000-000000000123\");\n  Suggestion address(SuggestionType::kAddressEntry);\n  address.payload = Suggestion::AutofillProfilePayload(guid);\n  Suggestion address_copy = address;\n  EXPECT_EQ(address_copy.GetPayload<Suggestion::AutofillProfilePayload>().guid,\n            guid);\n  EXPECT_TRUE(address_copy.IsSelectable());\n  EXPECT_TRUE(address_copy.IsAcceptable());\n  address_copy.acceptability =\n      Suggestion::Acceptability::kSelectableButUnacceptable;\n  EXPECT_TRUE(address_copy.IsSelectable());\n  EXPECT_FALSE(address_copy.IsAcceptable());\n\n  Suggestion payment(SuggestionType::kCreditCardEntry);\n  payment.payload = Suggestion::PaymentsPayload(u\"Ordinary card\", true, guid);\n  Suggestion payment_copy = payment;\n  EXPECT_EQ(payment_copy.GetPayload<Suggestion::PaymentsPayload>().guid, guid);\n  EXPECT_TRUE(payment_copy.IsSelectable());\n  EXPECT_TRUE(payment_copy.IsAcceptable());\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n"
