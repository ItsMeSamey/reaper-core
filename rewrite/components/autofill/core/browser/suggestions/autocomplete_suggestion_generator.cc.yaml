# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ SuggestionType::kAutocompleteAtMemoryButton\);\

      \ \ \}\

      '
    replace: "        SuggestionType::kAutocompleteAtMemoryButton);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \}\);\

      \ \ \}\

      '
    replace: "        });\n  }\n#if !BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ bool\ is_at_memory_enabled,\

      '
    replace: '    bool is_at_memory_enabled,

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ QueryHandler\ query_handler,\

      '
    replace: '    QueryHandler query_handler,

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ QueryHandler\(trigger_field\.value\(\),\ std::move\(callback\)\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ is_at_memory_enabled\);\

      '
    replace: "                     QueryHandler(trigger_field.value(), std::move(callback))\n#if !BUILDFLAG(IS_ANDROID)\n                         ,\n                     is_at_memory_enabled\n#endif\n      );\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ client,\ trigger_field\.origin\(\)\.GetURL\(\)\);\

      '
    replace: '                               client, trigger_field.origin().GetURL());

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ //\ \(when\ the\ database\ read\ completes\)\.\

      '
    replace: '  // (when the database read completes).

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/core/browser/at_memory/at_memory_enablement_util\.h"\

      '
    replace: '#include "components/autofill/core/browser/at_memory/at_memory_enablement_util.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "base/memory/scoped_refptr\.h"\

      '
    replace: '#include "base/memory/scoped_refptr.h"

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/core/browser/suggestions/autocomplete_suggestion_generator\.h"\

      '
    replace: '#include "components/autofill/core/browser/suggestions/autocomplete_suggestion_generator.h"

      #include "build/build_config.h"

      '
