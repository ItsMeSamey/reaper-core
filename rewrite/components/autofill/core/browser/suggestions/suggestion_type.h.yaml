# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '//\ LINT\.ThenChange\(/tools/metrics/histograms/metadata/autofill/enums\.xml:SuggestionType\)\

      \

      '
    replace: '// LINT.ThenChange(/tools/metrics/histograms/metadata/autofill/enums.xml:SuggestionType)


      #if BUILDFLAG(IS_ANDROID)

      // Keep persisted enum IDs stable while rejecting absent optional providers.

      bool IsUnsupportedSuggestionTypeOnAndroid(SuggestionType type);

      #endif


      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ <string_view>\

      '
    replace: '#include <string_view>


      #include "build/build_config.h"

      '
