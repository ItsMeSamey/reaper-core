# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ return\ os;\

      \}\

      \

      '
    replace: "  return os;\n}\n\n#if BUILDFLAG(IS_ANDROID)\nbool IsUnsupportedSuggestionTypeOnAndroid(SuggestionType type) {\n  switch (type) {\n    case SuggestionType::kAtMemoryAiDisclosure:\n    case SuggestionType::kAtMemoryFetching:\n    case SuggestionType::kAtMemoryGenericError:\n    case SuggestionType::kAtMemoryInactivityNudge:\n    case SuggestionType::kAtMemoryNoConnection:\n    case SuggestionType::kAtMemoryOpenGemini:\n    case SuggestionType::kAtMemorySearchAffordance:\n    case SuggestionType::kAtMemorySearchResult:\n    case SuggestionType::kAtMemorySourceAttribution:\n    case SuggestionType::kAutocompleteAtMemoryButton:\n    case SuggestionType::kPersonalContextNotice:\n    case SuggestionType::kManageEnhancedAutofill:\n    case SuggestionType::kMaximizeCreditCardBenefitsEntry:\n    case SuggestionType::kManageAutofillAi:\n    case SuggestionType::kManageAutofillAiIdentityDocs:\n    case SuggestionType::kManageAutofillAiShopping:\n    case SuggestionType::kManageAutofillAiTravel:\n    case SuggestionType::kFetchingAmbientData:\n    case SuggestionType::kFillAutofillAi:\n    case SuggestionType::kAutofillAiOtherOrders:\n    case SuggestionType::kAutofillAiPrivateInferenceNotice:\n    case SuggestionType::kAutofillAiOtherShipments:\n    case SuggestionType::kRemoveAutofillAi:\n    case SuggestionType::kAutofillAiSourceAttribution:\n      return true;\n    default:\n      return false;\n  }\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n"
