substitutions:
  - description: |-
      Add a flag identifying a new-email-alias suggestion.

      Set and read in brave/chromium_src/chrome/browser/ui/autofill/
      chrome_autofill_client.cc and .../views/autofill/popup/
      popup_row_factory_utils.cc. Suggestion is a plain struct with no
      explicit `public:` label for add_to_public to anchor on, so this
      uses a direct regex instead, appending as the struct's last field.
    regex:
      re_pattern: '(struct Suggestion \{.+?\n)\};'
      re_flags: [DOTALL]
      replace: |-
        \1  bool brave_new_email_alias_suggestion = false;
          bool brave_email_alias_suggestion = false;
        };

  - description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ return\ std::holds_alternative<OpenGeminiPayload>\(payload\);\

        '
      replace: '        return std::holds_alternative<OpenGeminiPayload>(payload);

        #endif

        '
  - description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
    regex:
      re_pattern: '\ \ \ \ \ \ case\ SuggestionType::kAtMemoryOpenGemini:\

        '
      replace: "      case SuggestionType::kAtMemoryOpenGemini:\n#if BUILDFLAG(IS_ANDROID)\n        return false;\n#else\n"
  - description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ return\ std::holds_alternative<AtMemoryPayload>\(payload\);\

        '
      replace: '        return std::holds_alternative<AtMemoryPayload>(payload);

        #endif

        '
  - description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
    regex:
