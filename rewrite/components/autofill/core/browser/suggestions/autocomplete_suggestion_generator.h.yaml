# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ std::optional<WebDataServiceBase::Handle>\ pending_query_;\

      \

      \

      '
    replace: '  std::optional<WebDataServiceBase::Handle> pending_query_;


      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ bool\ is_at_memory_enabled,\

      '
    replace: '                                bool is_at_memory_enabled,

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ void\ OnAutofillValuesReturned\(QueryHandler\ query_handler,\

      '
    replace: '  void OnAutofillValuesReturned(QueryHandler query_handler,

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ <optional>\

      '
    replace: '#include <optional>

      #include "build/build_config.h"

      '
