# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: 'DEFINE_JNI\(AtMemoryPayload\)\

      '
    replace: ''
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: 'bool\ Suggestion::IsSelectable\(\)\ const\ \{\

      '
    replace: "bool Suggestion::IsSelectable() const {\n#if BUILDFLAG(IS_ANDROID)\n  if (IsUnsupportedSuggestionTypeOnAndroid(type)) {\n    return false;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: 'bool\ Suggestion::IsAcceptable\(\)\ const\ \{\

      '
    replace: "bool Suggestion::IsAcceptable() const {\n#if BUILDFLAG(IS_ANDROID)\n  if (IsUnsupportedSuggestionTypeOnAndroid(type)) {\n    return false;\n  }\n#endif  // BUILDFLAG(IS_ANDROID)\n"
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: 'Suggestion::OpenGeminiPayload::\~OpenGeminiPayload\(\)\ =\ default;\

      '
    replace: 'Suggestion::OpenGeminiPayload::~OpenGeminiPayload() = default;

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: 'Suggestion::IdentityCredentialPayload::\~IdentityCredentialPayload\(\)\ =\ default;\

      \

      '
    replace: 'Suggestion::IdentityCredentialPayload::~IdentityCredentialPayload() = default;


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: 'base::android::ScopedJavaLocalRef<jobject>\

      Suggestion::AutofillAiPayload::CreateJavaObject\(\)\ const\ \{\

      \ \ JNIEnv\*\ env\ =\ base::android::AttachCurrentThread\(\);\

      \ \ return\ Java_AutofillAiPayload_Constructor\(env,\ guid\.value\(\),\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ requires_server_fetch\);\

      \}\

      '
    replace: '

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/android/main_autofill_jni_headers/AtMemoryPayload_jni\.h"\

      \#include\ "components/autofill/android/main_autofill_jni_headers/AutofillAiPayload_jni\.h"\

      '
    replace: ''
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/core/browser/integrators/at_memory/memory_data_type\.h"\

      '
    replace: '#include "components/autofill/core/browser/integrators/at_memory/memory_data_type.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/core/browser/field_types\.h"\

      '
    replace: '#include "components/autofill/core/browser/field_types.h"

      #if !BUILDFLAG(IS_ANDROID)

