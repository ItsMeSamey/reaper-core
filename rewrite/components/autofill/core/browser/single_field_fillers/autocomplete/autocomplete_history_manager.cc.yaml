# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/core/browser/at_memory/at_memory_enablement_util\.h"\

      '
    replace: '#include "components/autofill/core/browser/at_memory/at_memory_enablement_util.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "base/version_info/version_info\.h"\

      '
    replace: '#include "base/version_info/version_info.h"

      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/core/browser/single_field_fillers/autocomplete/autocomplete_history_manager\.h"\

      '
    replace: '#include "components/autofill/core/browser/single_field_fillers/autocomplete/autocomplete_history_manager.h"

      #include "build/build_config.h"

      '
