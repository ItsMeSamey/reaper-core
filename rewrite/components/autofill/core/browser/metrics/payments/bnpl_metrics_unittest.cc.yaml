# Android omits concrete optional Autofill providers and preserves ordinary form/payment paths.
substitutions:
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \(override\)\);\

      '
    replace: '              (override));

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\ \ \ \ \ \ :\ payments::AmountExtractionManager\(autofill_manager\)\ \{\}\

      \

      '
    replace: '      : payments::AmountExtractionManager(autofill_manager) {}


      #if !BUILDFLAG(IS_ANDROID)

      '
- description: Exclude concrete optional Android Autofill provider code while retaining ordinary form and payment paths
  regex:
    re_pattern: '\#include\ "components/autofill/core/browser/metrics/payments/bnpl_metrics\.h"\

      '
    replace: '#include "components/autofill/core/browser/metrics/payments/bnpl_metrics.h"

      #include "build/build_config.h"

      '
