substitutions:
- description: Bind Android build flags directly
  regex:
    pattern: '#include "components/autofill/core/browser/metrics/autofill_metrics.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/autofill/core/browser/metrics/autofill_metrics.h"

      '
  count: 1
- description: Exclude Android entity-manager readiness dependency
  regex:
    pattern: '#include "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/autofill/core/browser/data_manager/autofill_ai/entity_data_manager.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Exclude Android AI form-readiness classification
  regex:
    pattern: "  bool autofill_ai_form = std::ranges::any_of(\n      form, [](const std::unique_ptr<AutofillField>& field)\
      \ {\n        return field->Type().GetGroups().contains(FieldTypeGroup::kAutofillAi);\n      });\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  bool autofill_ai_form = std::ranges::any_of(\n      form, [](const std::unique_ptr<AutofillField>&\
      \ field) {\n        return field->Type().GetGroups().contains(FieldTypeGroup::kAutofillAi);\n      });\n\n#endif  //\
      \ !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Keep readiness required-type count limited to retained address/card data
  regex:
    pattern: "  if (autofill_ai_form) {\n    ++required_types;\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (autofill_ai_form) {\n    ++required_types;\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android entity-manager readiness access
  regex:
    pattern: "  if (autofill_ai_form && client.GetEntityDataManager() &&\n      !client.GetEntityDataManager()->GetEntityInstances().empty())\
      \ {\n    available_types++;\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (autofill_ai_form && client.GetEntityDataManager() &&\n      !client.GetEntityDataManager()->GetEntityInstances().empty())\
      \ {\n    available_types++;\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
