# Swap the upstream omnibox history embeddings disclaimer IDS to
# Brave-owned strings. The disclaimer text is replaced with the
# on-device-only wording; the trailing link text is replaced with
# IDS_BRAVE_EMPTY_STRING so the "Learn more" link renders at zero width.
# The IDS_BRAVE_* definitions are pulled in by the chromium_src override
# at brave/chromium_src/components/omnibox/browser/featured_search_provider.cc.

substitutions:
  - description:
      'Swap IDS_OMNIBOX_HISTORY_EMBEDDINGS_DISCLAIMER_IPH_LINK_TEXT to an empty
      string so the "Learn more" link view renders at zero width.'
    regex:
      re_pattern: '\bIDS_OMNIBOX_HISTORY_EMBEDDINGS_DISCLAIMER_IPH_LINK_TEXT\b'
      replace: 'IDS_BRAVE_EMPTY_STRING'

  - description: |
      Swap IDS_OMNIBOX_HISTORY_EMBEDDINGS_DISCLAIMER_IPH to the
      Brave-owned string and drop the upstream " " separator that follows.

      Without dropping the separator, match.contents would have a trailing
      space (the link text was swapped to IDS_BRAVE_EMPTY_STRING above) that
      fails AutocompleteMatch::SanitizeString in
      AutocompleteResult::AppendMatches.
    regex:
      re_pattern:
        'IDS_OMNIBOX_HISTORY_EMBEDDINGS_DISCLAIMER_IPH(\))\s*\+\s*u" "'
      replace: 'IDS_BRAVE_OMNIBOX_HISTORY_EMBEDDINGS_DISCLAIMER_IPH\1'

  - description: 'Android concrete AI source/provider removal: components/omnibox/browser/featured_search_provider.cc'
    regex:
      re_pattern: '\#include\ "base/strings/utf_string_conversions\.h"\

        \#include\ "build/build_config\.h"\

        \#include\ "components/history_embeddings/core/history_embeddings_features\.h"\

        \#include\ "components/omnibox/browser/aim_eligibility_service\.h"\

        \#include\ "components/omnibox/browser/autocomplete_input\.h"\

        \#include\ "components/omnibox/browser/autocomplete_match\.h"\

        \#include\ "components/omnibox/browser/autocomplete_match_classification\.h"\

        '
      replace: '#include "base/strings/utf_string_conversions.h"

        #include "build/build_config.h"

        #include "components/history_embeddings/core/history_embeddings_features.h"

        #if !BUILDFLAG(IS_ANDROID)

        #include "components/omnibox/browser/aim_eligibility_service.h"

        #endif

        #include "components/omnibox/browser/autocomplete_input.h"

        #include "components/omnibox/browser/autocomplete_match.h"

        #include "components/omnibox/browser/autocomplete_match_classification.h"

        '
