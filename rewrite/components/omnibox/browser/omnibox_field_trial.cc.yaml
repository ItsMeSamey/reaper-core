# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/omnibox_field_trial.cc'
  regex:
    re_pattern: '\#include\ "base/trace_event/memory_usage_estimator\.h"\

      \#include\ "build/build_config\.h"\

      \#include\ "components/history/core/browser/url_database\.h"\

      \#include\ "components/omnibox/browser/aim_eligibility_service\.h"\

      \#include\ "components/omnibox/browser/autocomplete_provider\.h"\

      \#include\ "components/omnibox/browser/autocomplete_provider_client\.h"\

      \#include\ "components/omnibox/browser/page_classification_functions\.h"\

      '
    replace: '#include "base/trace_event/memory_usage_estimator.h"

      #include "build/build_config.h"

      #include "components/history/core/browser/url_database.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/omnibox/browser/aim_eligibility_service.h"

      #endif

      #include "components/omnibox/browser/autocomplete_provider.h"

      #include "components/omnibox/browser/autocomplete_provider_client.h"

      #include "components/omnibox/browser/page_classification_functions.h"

      '
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/omnibox_field_trial.cc'
  regex:
    re_pattern: '\#include\ "components/omnibox/common/omnibox_feature_configs\.h"\

      \#include\ "components/omnibox/common/omnibox_features\.h"\

      \#include\ "components/search/search\.h"\

      \#include\ "components/search_engines/ai_mode_button_service\.h"\

      \#include\ "components/variations/active_field_trials\.h"\

      \#include\ "components/variations/hashing\.h"\

      \#include\ "components/variations/variations_associated_data\.h"\

      '
    replace: '#include "components/omnibox/common/omnibox_feature_configs.h"

      #include "components/omnibox/common/omnibox_features.h"

      #include "components/search/search.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/search_engines/ai_mode_button_service.h"

      #endif

      #include "components/variations/active_field_trials.h"

      #include "components/variations/hashing.h"

      #include "components/variations/variations_associated_data.h"

      '
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/omnibox_field_trial.cc'
  regex:
    re_pattern: '\ \ \ \ const\ AimEligibilityService\*\ aim_eligibility_service,\

      \ \ \ \ const\ AiModeButtonService\*\ ai_mode_button_service,\

      \ \ \ \ const\ TemplateURLService\*\ template_url_service\)\ \{\

      \ \ //\ `aim_eligibility_service`\ can\ be\ null\ in\ tests\.\

      \ \ if\ \(!aim_eligibility_service\)\ \{\

      \ \ \ \ return\ false;\

      '
    replace: "    const AimEligibilityService* aim_eligibility_service,\n    const AiModeButtonService* ai_mode_button_service,\n    const TemplateURLService* template_url_service) {\n#if BUILDFLAG(IS_ANDROID)\n  return false;\n#else\n  // `aim_eligibility_service` can be null in tests.\n  if (!aim_eligibility_service) {\n    return false;\n"
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/omnibox_field_trial.cc'
  regex:
    re_pattern: '\ \ return\ base::FeatureList::IsEnabled\(omnibox::kAim3pEntrypoint\)\ \&\&\

      \ \ \ \ \ \ \ \ \ aim_eligibility_service\->IsAimAllowedByFeatureAndPolicy\(\)\ \&\&\

      \ \ \ \ \ \ \ \ \ aim_eligibility_service\->IsAimAllowedByThirdPartyPolicy\(\);\

      \}\

      \

      bool\ IsAimStarterPackEnabled\(\

      \ \ \ \ const\ AimEligibilityService\*\ aim_eligibility_service\)\ \{\

      \ \ //\ AI\ starter\ pack\ should\ be\ available\ if\ any\ AI\ omnibox\ feature\ is\ available\.\

      \ \ return\ AimEligibilityService::GenericKillSwitchFeatureCheck\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ aim_eligibility_service,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ omnibox_feature_configs::Toolbelt::kOmniboxToolbelt\)\ \|\|\

      \ \ \ \ \ \ \ \ \ AimEligibilityService::GenericKillSwitchFeatureCheck\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ aim_eligibility_service,\ omnibox::kAiModeStartPack\);\

      \}\

      \

      //\ Rich\ autocompletion\.\

      '
    replace: "  return base::FeatureList::IsEnabled(omnibox::kAim3pEntrypoint) &&\n         aim_eligibility_service->IsAimAllowedByFeatureAndPolicy() &&\n         aim_eligibility_service->IsAimAllowedByThirdPartyPolicy();\n#endif\n}\n\nbool IsAimStarterPackEnabled(\n    const AimEligibilityService* aim_eligibility_service) {\n#if BUILDFLAG(IS_ANDROID)\n  return false;\n#else\n  // AI starter pack should be available if any AI omnibox feature is available.\n  return AimEligibilityService::GenericKillSwitchFeatureCheck(\n             aim_eligibility_service,\n             omnibox_feature_configs::Toolbelt::kOmniboxToolbelt) ||\n         AimEligibilityService::GenericKillSwitchFeatureCheck(\n             aim_eligibility_service, omnibox::kAiModeStartPack);\n#endif\n}\n\n// Rich autocompletion.\n"

- description: 'Android excludes optional Gemini/AI Mode seeded remote provider and accessor bodies while ordinary search remains: components/omnibox/browser/omnibox_field_trial.cc'
  regex:
    re_pattern: '//\ <\-\ Touch\ Down\ Trigger\ For\ Prefetch\

      //\ \-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\

      //\ Site\ Search\ Starter\ Pack\ \->\

      const\ base::FeatureParam<std::string>\ kGeminiUrlOverride\(\

      \ \ \ \ \&omnibox::kStarterPackExpansion,\

      \ \ \ \ "StarterPackGeminiUrlOverride",\

      \ \ \ \ "https://gemini\.google\.com/prompt\?"\

      \ \ \ \ "utm_source=chrome_omnibox\&utm_medium=owned\&utm_campaign=gemini_shortcut"\);\

      \

      bool\ IsStarterPackExpansionEnabled\(\)\ \{\

      \ \ return\ base::FeatureList::IsEnabled\(omnibox::kStarterPackExpansion\);\

      '
    replace: "// <- Touch Down Trigger For Prefetch\n// ---------------------------------------------------------\n// Site Search Starter Pack ->\n#if !BUILDFLAG(IS_ANDROID)\nconst base::FeatureParam<std::string> kGeminiUrlOverride(\n    &omnibox::kStarterPackExpansion,\n    \"StarterPackGeminiUrlOverride\",\n    \"https://gemini.google.com/prompt?\"\n    \"utm_source=chrome_omnibox&utm_medium=owned&utm_campaign=gemini_shortcut\");\n#endif  // !BUILDFLAG(IS_ANDROID)\n\nbool IsStarterPackExpansionEnabled() {\n  return base::FeatureList::IsEnabled(omnibox::kStarterPackExpansion);\n"
