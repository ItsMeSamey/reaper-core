substitutions:

  - description: "Read the actual keyword template type."
    regex:
      pattern: "#include \"components/omnibox/browser/search_suggestion_parser.h\""
      replace: "#include \"components/omnibox/browser/search_suggestion_parser.h\"\n#include \"components/omnibox/browser/autocomplete_provider.h\"\n#include \"components/search_engines/template_url.h\""

  - description: "Determine extension commands from the actual native keyword template."
    regex:
      pattern: "// static\njclass AutocompleteMatch::GetClazz"
      replace: "bool AutocompleteMatch::IsExtensionKeywordSuggestion(\n    const TemplateURLService* template_url_service) const {\n  if (type != AutocompleteMatchType::SEARCH_OTHER_ENGINE || !provider ||\n      (provider->type() != AutocompleteProvider::TYPE_KEYWORD &&\n       provider->type() != AutocompleteProvider::TYPE_UNSCOPED_EXTENSION)) {\n    return false;\n  }\n  const TemplateURL* template_url = GetTemplateURL(template_url_service);\n  return template_url &&\n         template_url->type() == TemplateURL::OMNIBOX_API_EXTENSION &&\n         destination_url.SchemeIs(\"chrome-extension\") &&\n         destination_url.host() == template_url->GetExtensionId();\n}\n\n// static\njclass AutocompleteMatch::GetClazz"

  - description: "Transfer command provenance separately from the navigable destination URL."
    regex:
      pattern: "  return ScopedJavaLocalRef<jobject>(*java_match_);\n}\n\nvoid AutocompleteMatch::UpdateJavaObjectNativeRef()"
      replace: "  Java_AutocompleteMatch_setIsExtensionKeywordSuggestion(\n      env, *java_match_, IsExtensionKeywordSuggestion(template_url_service));\n  return ScopedJavaLocalRef<jobject>(*java_match_);\n}\n\nvoid AutocompleteMatch::UpdateJavaObjectNativeRef()"
