substitutions:

  - description: "Verify command provenance uses the native keyword template and provider."
    regex:
      pattern: "TEST_F(AutocompleteMatchTest, MoreRelevant) {"
      replace: "#if BUILDFLAG(IS_ANDROID)\nTEST_F(AutocompleteMatchTest, AndroidExtensionKeywordProvenance) {\n  auto* service = search_engines_test_environment_.template_url_service();\n  service->Load();\n  ASSERT_TRUE(service->loaded());\n  constexpr char kExtensionId[] = \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\";\n  service->RegisterExtensionControlledTURL(\n      kExtensionId, \"keyword\", \"test\",\n      \"chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/?q={searchTerms}\",\n      base::Time::Now(), /*unscoped_mode_allowed=*/false);\n  auto provider = base::MakeRefCounted<FakeAutocompleteProvider>(\n      AutocompleteProvider::TYPE_KEYWORD);\n  AutocompleteMatch match(provider.get(), 1000, false,\n                          AutocompleteMatchType::SEARCH_OTHER_ENGINE);\n  match.keyword = u\"test\";\n  match.destination_url =\n      GURL(\"chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/?q=test\");\n  EXPECT_TRUE(match.IsExtensionKeywordSuggestion(service));\n  EXPECT_FALSE(match.IsExtensionKeywordSuggestion(nullptr));\n\n  TemplateURLData ordinary;\n  ordinary.SetKeyword(u\"ordinary\");\n  ordinary.SetURL(\n      \"chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/?q={searchTerms}\");\n  service->Add(std::make_unique<TemplateURL>(ordinary));\n  match.keyword = u\"ordinary\";\n  EXPECT_FALSE(match.IsExtensionKeywordSuggestion(service));\n  match.keyword = u\"test\";\n\n  match.type = AutocompleteMatchType::URL_WHAT_YOU_TYPED;\n  EXPECT_FALSE(match.IsExtensionKeywordSuggestion(service));\n  match.type = AutocompleteMatchType::SEARCH_OTHER_ENGINE;\n  match.keyword.clear();\n  EXPECT_FALSE(match.IsExtensionKeywordSuggestion(service));\n  match.keyword = u\"test\";\n  match.destination_url =\n      GURL(\"chrome-extension://bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb/?q=test\");\n  EXPECT_FALSE(match.IsExtensionKeywordSuggestion(service));\n  match.destination_url =\n      GURL(\"chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/?q=test\");\n  service->RemoveExtensionControlledTURL(kExtensionId,\n                                         TemplateURL::OMNIBOX_API_EXTENSION);\n  EXPECT_FALSE(match.IsExtensionKeywordSuggestion(service));\n}\n#endif  // BUILDFLAG(IS_ANDROID)\nTEST_F(AutocompleteMatchTest, MoreRelevant) {"
  - description: "Future535 2/1: reviewed literal edit"
    regex:
      re_pattern: "\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\nTEST_F\\(AutocompleteMatchTest,\\ AndroidExtensionKeywordProvenance\\)"
      replace: "#if BUILDFLAG(IS_ANDROID)\nTEST_F(AutocompleteMatchTest,\n       AndroidAiKeywordPlaceholderUnavailableAndCoreScopesRemainAvailable) {\n  TemplateURLData ai_data;\n  ai_data.starter_pack_id = static_cast<int>(\n      template_url_starter_pack_data::StarterPackId::kAiMode);\n  TemplateURL ai_template(ai_data);\n  EXPECT_TRUE(\n      AutocompleteMatch::GetKeywordPlaceholder(&ai_template, false).empty());\n  EXPECT_TRUE(\n      AutocompleteMatch::GetKeywordPlaceholder(&ai_template, true).empty());\n\n  TemplateURLData ask_brave_data;\n  ask_brave_data.starter_pack_id = static_cast<int>(\n      template_url_starter_pack_data::StarterPackId::kAskBraveSearch);\n  TemplateURL ask_brave_template(ask_brave_data);\n  EXPECT_TRUE(AutocompleteMatch::GetKeywordPlaceholder(&ask_brave_template,\n                                                     false)\n                  .empty());\n  EXPECT_TRUE(AutocompleteMatch::GetKeywordPlaceholder(&ask_brave_template, true)\n                  .empty());\n\n  constexpr auto kRetainedScopes[] = {\n      template_url_starter_pack_data::StarterPackId::kBookmarks,\n      template_url_starter_pack_data::StarterPackId::kHistory,\n      template_url_starter_pack_data::StarterPackId::kTabs};\n  for (auto scope : kRetainedScopes) {\n    TemplateURLData data;\n    data.starter_pack_id = static_cast<int>(scope);\n    TemplateURL retained_template(data);\n    EXPECT_FALSE(AutocompleteMatch::GetKeywordPlaceholder(&retained_template,\n                                                        false)\n                     .empty());\n  }\n}\n\nTEST_F(AutocompleteMatchTest, AndroidExtensionKeywordProvenance)"
    count: 1

  - description: "Use the explicit enum element type for retained omnibox scopes."
    count: 1
    regex:
      pattern: "constexpr auto kRetainedScopes[]"
      replace: "constexpr template_url_starter_pack_data::StarterPackId kRetainedScopes[]"
