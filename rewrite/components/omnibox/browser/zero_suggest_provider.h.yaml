# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/zero_suggest_provider.h'
  regex:
    re_pattern: '\#include\ <optional>\

      \#include\ <string>\

      \

      \#include\ "base/gtest_prod_util\.h"\

      \#include\ "components/omnibox/browser/autocomplete_enums\.h"\

      \#include\ "components/omnibox/browser/autocomplete_provider_debouncer\.h"\

      '
    replace: '#include <optional>

      #include <string>


      #include "build/build_config.h"

      #include "base/gtest_prod_util.h"

      #include "components/omnibox/browser/autocomplete_enums.h"

      #include "components/omnibox/browser/autocomplete_provider_debouncer.h"

      '
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/zero_suggest_provider.h'
  regex:
    re_pattern: '\ \ void\ RunZeroSuggestPrefetch\(const\ AutocompleteInput\&\ input,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ ResultType\ result_type\);\

      \ \ //\ Called\ by\ ''composebox_debouncer_''\

      \ \ void\ RunComposeboxPrefetch\(const\ AutocompleteInput\&\ input\);\

      \

      \ \ //\ Called\ either\ in\ Start\(\)\ with\ \|results\|\ populated\ from\ the\ cached\ response,\

      \ \ //\ where\ \|matches_\|\ are\ empty;\ or\ in\ OnURLLoadComplete\(\)\ with\ \|results\|\

      '
    replace: "  void RunZeroSuggestPrefetch(const AutocompleteInput& input,\n                              const ResultType result_type);\n  // Called by 'composebox_debouncer_'\n#if !BUILDFLAG(IS_ANDROID)\n  void RunComposeboxPrefetch(const AutocompleteInput& input);\n#endif\n\n  // Called either in Start() with |results| populated from the cached response,\n  // where |matches_| are empty; or in OnURLLoadComplete() with |results|\n"
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/zero_suggest_provider.h'
  regex:
    re_pattern: '\ \ std::unique_ptr<network::SimpleURLLoader>\ srp_web_prefetch_loader_;\

      \

      \ \ //\ Loader\ used\ to\ retrieve\ results\ for\ composebox\ prefetch\ requests\.\

      \ \ std::unique_ptr<network::SimpleURLLoader>\ composebox_prefetch_loader_;\

      \

      \ \ //\ Debouncer\ used\ to\ throttle\ the\ frequency\ of\ ZPS\ prefetch\ requests\ \(to\

      \ \ //\ minimize\ the\ performance\ impact\ on\ the\ remote\ Suggest\ service\)\.\

      \ \ std::unique_ptr<AutocompleteProviderDebouncer>\ debouncer_;\

      \ \ std::unique_ptr<AutocompleteProviderDebouncer>\ composebox_debouncer_;\

      \

      \ \ //\ The\ list\ of\ experiment\ stats\ corresponding\ to\ \|matches_\|\.\

      \ \ SearchSuggestionParser::ExperimentStatsV2s\ experiment_stats_v2s_;\

      '
    replace: "  std::unique_ptr<network::SimpleURLLoader> srp_web_prefetch_loader_;\n\n  // Loader used to retrieve results for composebox prefetch requests.\n#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<network::SimpleURLLoader> composebox_prefetch_loader_;\n#endif\n\n  // Debouncer used to throttle the frequency of ZPS prefetch requests (to\n  // minimize the performance impact on the remote Suggest service).\n  std::unique_ptr<AutocompleteProviderDebouncer> debouncer_;\n#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<AutocompleteProviderDebouncer> composebox_debouncer_;\n#endif\n\n  // The list of experiment stats corresponding to |matches_|.\n  SearchSuggestionParser::ExperimentStatsV2s experiment_stats_v2s_;\n"
