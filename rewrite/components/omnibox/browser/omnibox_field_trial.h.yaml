# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/omnibox_field_trial.h'
  regex:
    re_pattern: '\#include\ <utility>\

      \#include\ <vector>\

      \

      \#include\ "base/feature_list\.h"\

      \#include\ "base/metrics/field_trial_params\.h"\

      \#include\ "components/omnibox/browser/aim_eligibility_service\.h"\

      \#include\ "components/omnibox/browser/autocomplete_match_type\.h"\

      \#include\ "components/omnibox/browser/autocomplete_provider\.h"\

      \#include\ "components/omnibox/common/omnibox_features\.h"\

      '
    replace: '#include <utility>

      #include <vector>


      #include "build/build_config.h"

      #include "base/feature_list.h"

      #include "base/metrics/field_trial_params.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/omnibox/browser/aim_eligibility_service.h"

      #endif

      #include "components/omnibox/browser/autocomplete_match_type.h"

      #include "components/omnibox/browser/autocomplete_provider.h"

      #include "components/omnibox/common/omnibox_features.h"

      '
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/omnibox_field_trial.h'
  regex:
    re_pattern: 'class\ TimeDelta;\

      \}\ \ //\ namespace\ base\

      \

      class\ AiModeButtonService;\

      class\ TemplateURLService;\

      \

      '
    replace: 'class TimeDelta;

      }  // namespace base


      #if BUILDFLAG(IS_ANDROID)

      class AimEligibilityService;

      #endif

      class AiModeButtonService;

      class TemplateURLService;


      '

- description: 'Android excludes optional Gemini/AI Mode seeded remote provider and accessor bodies while ordinary search remains: components/omnibox/browser/omnibox_field_trial.h'
  regex:
    re_pattern: '//\ <\-\ Touch\ Down\ Trigger\ For\ Prefetch\

      //\ \-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\-\

      //\ Site\ Search\ Starter\ Pack\ \->\

      //\ When\ non\-empty,\ the\ value\ of\ this\ param\ overrides\ the\ `search_url`\ for\ the\

      //\ @gemini\ scope\.\ This\ happens\ when\ the\ URL\ gets\ served,\ it\ does\ not\ affect\ the\

      //\ DB\ or\ TemplateURLService''s\ copy\ of\ the\ URL\.\

      extern\ const\ base::FeatureParam<std::string>\ kGeminiUrlOverride;\

      \

      //\ Whether\ the\ expansion\ pack\ \(the\ `StarterPackId::kGemini`\ keyword/engine\)\ for\

      //\ the\ site\ search\ starter\ pack\ is\ enabled\.\

      '
    replace: '// <- Touch Down Trigger For Prefetch

      // ---------------------------------------------------------

      // Site Search Starter Pack ->

      #if !BUILDFLAG(IS_ANDROID)

      // When non-empty, the value of this param overrides the `search_url` for the

      // @gemini scope. This happens when the URL gets served, it does not affect the

      // DB or TemplateURLService''s copy of the URL.

      extern const base::FeatureParam<std::string> kGeminiUrlOverride;

      #endif  // !BUILDFLAG(IS_ANDROID)


      // Whether the expansion pack (the `StarterPackId::kGemini` keyword/engine) for

      // the site search starter pack is enabled.

      '
