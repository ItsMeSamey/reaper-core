# Android native history AI implementation exclusion.
substitutions:
- description: 'Android history AI430: components/omnibox/browser/autocomplete_match.cc step 1'
  regex:
    pattern: '#include "components/history_embeddings/core/history_embeddings_features.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/history_embeddings/core/history_embeddings_features.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: 'Android history AI430: components/omnibox/browser/autocomplete_match.cc step 2'
  regex:
    pattern: "      history_embeddings_answer_header_text(\n          match.history_embeddings_answer_header_text),\n      history_embeddings_answer_header_loading(\n          match.history_embeddings_answer_header_loading),\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      history_embeddings_answer_header_text(\n          match.history_embeddings_answer_header_text),\n      history_embeddings_answer_header_loading(\n          match.history_embeddings_answer_header_loading),\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: 'Android history AI430: components/omnibox/browser/autocomplete_match.cc step 3'
  regex:
    pattern: "  history_embeddings_answer_header_text =\n      std::move(match.history_embeddings_answer_header_text);\n  history_embeddings_answer_header_loading =\n      std::move(match.history_embeddings_answer_header_loading);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  history_embeddings_answer_header_text =\n      std::move(match.history_embeddings_answer_header_text);\n  history_embeddings_answer_header_loading =\n      std::move(match.history_embeddings_answer_header_loading);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: 'Android history AI430: components/omnibox/browser/autocomplete_match.cc step 4'
  regex:
    pattern: "  history_embeddings_answer_header_text =\n      match.history_embeddings_answer_header_text;\n  history_embeddings_answer_header_loading =\n      match.history_embeddings_answer_header_loading;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  history_embeddings_answer_header_text =\n      match.history_embeddings_answer_header_text;\n  history_embeddings_answer_header_loading =\n      match.history_embeddings_answer_header_loading;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: 'Android history AI430: components/omnibox/browser/autocomplete_match.cc step 5'
  regex:
    pattern: "  if (!history_embeddings::GetFeatureParameters().omnibox_scoped) {\n    return std::u16string();\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (!history_embeddings::GetFeatureParameters().omnibox_scoped) {\n    return std::u16string();\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: 'Android history AI430: components/omnibox/browser/autocomplete_match.cc step 6'
  regex:
    pattern: "      message_id = is_history_embeddings_enabled\n                       ? IDS_OMNIBOX_HISTORY_EMBEDDINGS_SCOPE_PLACEHOLDER_TEXT\n                       : IDS_OMNIBOX_HISTORY_SCOPE_PLACEHOLDER_TEXT;\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n      message_id = IDS_OMNIBOX_HISTORY_SCOPE_PLACEHOLDER_TEXT;\n#else\n      message_id = is_history_embeddings_enabled\n                       ? IDS_OMNIBOX_HISTORY_EMBEDDINGS_SCOPE_PLACEHOLDER_TEXT\n                       : IDS_OMNIBOX_HISTORY_SCOPE_PLACEHOLDER_TEXT;\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "Future535 0/1: reviewed literal edit"
  regex:
    re_pattern: "\\ \\ \\ \\ case\\ template_url_starter_pack_data::StarterPackId::kAiMode:\\\n\\ \\ \\ \\ \\ \\ message_id\\ =\\ IDS_OMNIBOX_AI_MODE_SCOPE_PLACEHOLDER_TEXT;\\\n\\ \\ \\ \\ \\ \\ break;\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    case template_url_starter_pack_data::StarterPackId::kAiMode:\n      message_id = IDS_OMNIBOX_AI_MODE_SCOPE_PLACEHOLDER_TEXT;\n      break;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
