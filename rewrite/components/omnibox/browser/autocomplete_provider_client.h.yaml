# Android native history AI implementation exclusion.
substitutions:
- description: 'Android history AI430: components/omnibox/browser/autocomplete_provider_client.h step 1'
  regex:
    pattern: '#include "components/history/core/browser/keyword_id.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/history/core/browser/keyword_id.h"

      '
  count: 1
- description: 'Android history AI430: components/omnibox/browser/autocomplete_provider_client.h step 2'
  regex:
    pattern: 'namespace history_embeddings {

      class HistoryEmbeddingsSearch;

      }

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      namespace history_embeddings {

      class HistoryEmbeddingsSearch;

      }

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: 'Android history AI430: components/omnibox/browser/autocomplete_provider_client.h step 3'
  regex:
    pattern: "  virtual history_embeddings::HistoryEmbeddingsSearch*\n  GetHistoryEmbeddingsSearch();\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  virtual history_embeddings::HistoryEmbeddingsSearch*\n  GetHistoryEmbeddingsSearch();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: 'Android history AI430: components/omnibox/browser/autocomplete_provider_client.h step 4'
  regex:
    pattern: "  // Returns true if history embeddings is enabled and user has opted in.\n  virtual bool IsHistoryEmbeddingsEnabled() const;\n\n  // Returns true if history embeddings is enabled and user can opt in/out.\n  virtual bool IsHistoryEmbeddingsSettingVisible() const;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Returns true if history embeddings is enabled and user has opted in.\n  virtual bool IsHistoryEmbeddingsEnabled() const;\n\n  // Returns true if history embeddings is enabled and user can opt in/out.\n  virtual bool IsHistoryEmbeddingsSettingVisible() const;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
