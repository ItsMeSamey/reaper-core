substitutions:

  - description: "Preserve the existing Brave dangling-pointer annotation."
    regex:
      pattern: "raw_ptr<AutocompleteProvider> provider = nullptr;"
      replace: "raw_ptr<AutocompleteProvider, DanglingUntriaged> provider = nullptr;"

  - description: "Expose Android keyword-match provenance without trusting a destination scheme."
    regex:
      pattern: "  // Returns a corresponding Java object, creating it if necessary."
      replace: "  // Whether this selected native match came from an extension keyword template.\n  bool IsExtensionKeywordSuggestion(\n      const TemplateURLService* template_url_service) const;\n\n  // Returns a corresponding Java object, creating it if necessary."
  - description: 'Android history AI430: components/omnibox/browser/autocomplete_match.h step 1'
    regex:
      pattern: "  // `HISTORY_EMBEDDINGS_ANSWER` matches.\n  std::u16string history_embeddings_answer_header_text;\n  // Whether the answer is still loading and should therefore show a throbber.\n  bool history_embeddings_answer_header_loading = false;\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  // `HISTORY_EMBEDDINGS_ANSWER` matches.\n  std::u16string history_embeddings_answer_header_text;\n  // Whether the answer is still loading and should therefore show a throbber.\n  bool history_embeddings_answer_header_loading = false;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: 'Android history AI430: components/omnibox/browser/autocomplete_match.h step 2'
    regex:
      pattern: '  // The text to show above the match contents & description for

        #if !BUILDFLAG(IS_ANDROID)

        '
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  // The text to show above the match contents & description for\n"
    count: 1
