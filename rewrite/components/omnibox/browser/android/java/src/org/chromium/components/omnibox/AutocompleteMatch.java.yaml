substitutions:

  - description: "Retain native extension keyword provenance separately from navigable URLs."
    regex:
      pattern: "    private long mNativeMatch;"
      replace: "    private long mNativeMatch;\n    private boolean mIsExtensionKeywordSuggestion;"

  - description: "Expose the selected native match kind without classifying arbitrary extension URLs."
    regex:
      pattern: "    /** Returns a reference to Native AutocompleteMatch object. */"
      replace: "    @CalledByNative\n    void setIsExtensionKeywordSuggestion(boolean isExtensionKeywordSuggestion) {\n        mIsExtensionKeywordSuggestion = isExtensionKeywordSuggestion;\n    }\n\n    /** Returns whether a native extension keyword match produced this suggestion. */\n    public boolean isExtensionKeywordSuggestion() {\n        return mIsExtensionKeywordSuggestion;\n    }\n\n    /** Returns a reference to Native AutocompleteMatch object. */"
