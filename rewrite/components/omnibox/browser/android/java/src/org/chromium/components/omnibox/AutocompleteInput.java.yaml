      \ \ \ \ \ \ \ \ mAllowExactKeywordMatch\ =\ other\.mAllowExactKeywordMatch;\

      \ \ \ \ \ \ \ \ mHasAttachments\ =\ other\.mHasAttachments;\

      \ \ \ \ \ \ \ \ mAutocompleteStateSupplier\.set\(other\.getAutocompleteState\(\)\);\

      \ \ \ \ \ \ \ \ mDisplayStateSupplier\.set\(other\.getDisplayState\(\)\);\

      \ \ \ \ \ \ \ \ mSelection\ =\ other\.mSelection;\ //\ Copied\.\

      \ \ \ \ \ \ \ \ mRefineActionUsage\ =\ other\.mRefineActionUsage;\

      \ \ \ \ \ \ \ \ mSuggestionsListScrolled\ =\ other\.mSuggestionsListScrolled;\

      \ \ \ \ \ \ \ \ mFocusReason\ =\ other\.mFocusReason;\

      \ \ \ \ \ \ \ \ mModelMode\ =\ other\.mModelMode;\

      \ \ \ \ \ \ \ \ mUserText\.set\(other\.mUserText\.get\(\)\);\

      \ \ \ \ \ \ \ \ mPreviewText\ =\ other\.mPreviewText;\

      \ \ \ \ \ \ \ \ mAllowUserTextAutocompletion\.set\(other\.mAllowUserTextAutocompletion\.get\(\)\);\

      '
    replace: "        mPageClassification = other.mPageClassification;\n        mPageTitle\
      \ = other.mPageTitle;\n        mAllowExactKeywordMatch = other.mAllowExactKeywordMatch;\n\
      \        mAutocompleteStateSupplier.set(other.getAutocompleteState());\n   \
      \     mDisplayStateSupplier.set(other.getDisplayState());\n        mSelection\
      \ = other.mSelection; // Copied.\n        mRefineActionUsage = other.mRefineActionUsage;\n\
      \        mSuggestionsListScrolled = other.mSuggestionsListScrolled;\n      \
      \  mFocusReason = other.mFocusReason;\n        mUserText.set(other.mUserText.get());\n\
      \        mPreviewText = other.mPreviewText;\n        mAllowUserTextAutocompletion.set(other.mAllowUserTextAutocompletion.get());\n"
- description: Physically remove AI model/tool/attachment state and Composebox classification
    implementation, preserving UserData ownership and all normal draft/focus/text/selection/site-search
    state. Retain concrete SEARCH/SEARCH_PREFETCH state and reject unsupported old
    AI request values before observable mutation.
  regex:
    re_pattern: '\

      \ \ \ \ //\ LINT\.ThenChange\(:Members\)\

      \

      \ \ \ \ private\ @PageClassification\ int\ getComposeboxEquivalentOfPageClassification\(\)\
      \{\

      \ \ \ \ \ \ \ \ return\ switch\ \(mPageClassification\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ LINT\.IfChange\(FuseboxSupportedPageClassifications\)\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ PageClassification\.INSTANT_NTP_WITH_OMNIBOX_AS_STARTING_FOCUS\
      \->\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PageClassification\.NTP_OMNIBOX_COMPOSEBOX;\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ PageClassification\.SEARCH_RESULT_PAGE_NO_SEARCH_TERM_REPLACEMENT\
      \->\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ PageClassification\.SRP_OMNIBOX_COMPOSEBOX;\

      \ \ \ \ \ \ \ \ \ \ \ \ case\ PageClassification\.OTHER\ \->\ PageClassification\.OTHER_OMNIBOX_COMPOSEBOX;\

      \ \ \ \ \ \ \ \ \ \ \ \ //\ LINT\.ThenChange\(/chrome/browser/ui/android/omnibox/java/src/org/chromium/chrome/browser/omnibox/fusebox/FuseboxCoordinator\.java:FuseboxSupportedPageClassifications\)\

      \ \ \ \ \ \ \ \ \ \ \ \ default\ \->\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ TODO\(crbug\.com/474808407\):\ address\
      the\ issue\ with\ top\ resumed\ activity\ change\ and\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ //\ remove\ condition,\ making\ assertion\ live\
      again\.\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(BuildConfig\.ENABLE_DEBUG_LOGS\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ assert\ false\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ :\ String\.format\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ Locale\.ROOT,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "Unrecognized\
      page\ classification:\ %d",\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mPageClassification\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ yield\ PageClassification\.OTHER_OMNIBOX_COMPOSEBOX;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \};\

      \ \ \ \ \}\

      \

      \ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Returns\ the\ page\ classification\ not\ adjusted\ for\ the\ tools\
      or\ models\.\

      \ \ \ \ \ \*\

      \ \ \ \ \ \*\ @return\ The\ raw\ page\ classification\.\

      \ \ \ \ \ \*/\

      '
    replace: "\n    // LINT.ThenChange(:Members)\n\n\n\n    /**\n     * Returns the\
      \ raw page classification for ordinary autocomplete.\n     *\n     * @return\
      \ The raw page classification.\n     */\n"
