      \ \*\ AutocompleteInput\ encompasses\ the\ input\ to\ autocomplete\ and\ fusebox\.\

      \ \*\

      \ \*\ <p>This\ class\ must\ have\ no\ dependencies\ on\ external\ services\
      or\ logic\ and\ should\ be\ fully\

      \ \*\ serializable\.\

      '
    replace: "import java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\n\
      import java.lang.annotation.Target;\nimport java.util.Objects;\n\n/**\n * AutocompleteInput\
      \ encompasses the input to ordinary autocomplete.\n *\n * <p>This class must\
      \ have no dependencies on external services or logic and should be fully\n *\
      \ serializable.\n"
