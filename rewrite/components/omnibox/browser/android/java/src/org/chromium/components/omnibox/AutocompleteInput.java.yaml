# Reaper Android AI physical-purge core caller adapters.
- description: Physically remove AI model/tool/attachment state and Composebox classification
    implementation, preserving UserData ownership and all normal draft/focus/text/selection/site-search
    state. Retain concrete SEARCH/SEARCH_PREFETCH state and reject unsupported old
    AI request values before observable mutation.
  regex:
    re_pattern: 'import\ org\.chromium\.base\.supplier\.ObservableSuppliers;\

      import\ org\.chromium\.base\.supplier\.SettableNonNullObservableSupplier;\

      import\ org\.chromium\.base\.supplier\.SettableNullableObservableSupplier;\

      import\ org\.chromium\.build\.BuildConfig;\

      import\ org\.chromium\.build\.annotations\.Initializer;\

      import\ org\.chromium\.build\.annotations\.NullMarked;\

      import\ org\.chromium\.build\.annotations\.Nullable;\

      '
    replace: 'import org.chromium.base.supplier.ObservableSuppliers;

      import org.chromium.base.supplier.SettableNonNullObservableSupplier;

      import org.chromium.base.supplier.SettableNullableObservableSupplier;

      import org.chromium.build.annotations.Initializer;

      import org.chromium.build.annotations.NullMarked;

      import org.chromium.build.annotations.Nullable;

      '
