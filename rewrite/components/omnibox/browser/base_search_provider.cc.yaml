# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/base_search_provider.cc'
  regex:
    re_pattern: '//\ Use\ of\ this\ source\ code\ is\ governed\ by\ a\ BSD\-style\ license\ that\ can\ be\

      //\ found\ in\ the\ LICENSE\ file\.\

      \

      \#include\ "components/omnibox/browser/base_search_provider\.h"\

      \

      \#include\ <stddef\.h>\

      '
    replace: '// Use of this source code is governed by a BSD-style license that can be

      // found in the LICENSE file.


      #include "build/build_config.h"

      #include "components/omnibox/browser/base_search_provider.h"


      #include <stddef.h>

      '
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/base_search_provider.cc'
  regex:
    re_pattern: '\#include\ "base/strings/string_util\.h"\

      \#include\ "base/strings/utf_string_conversions\.h"\

      \#include\ "components/omnibox/browser/actions/omnibox_action_in_suggest\.h"\

      \#include\ "components/omnibox/browser/aim_eligibility_service\.h"\

      \#include\ "components/omnibox/browser/autocomplete_provider_client\.h"\

      \#include\ "components/omnibox/browser/autocomplete_provider_listener\.h"\

      \#include\ "components/omnibox/browser/omnibox_field_trial\.h"\

      '
    replace: '#include "base/strings/string_util.h"

      #include "base/strings/utf_string_conversions.h"

      #include "components/omnibox/browser/actions/omnibox_action_in_suggest.h"

      #if !BUILDFLAG(IS_ANDROID)

      #include "components/omnibox/browser/aim_eligibility_service.h"

      #endif

      #include "components/omnibox/browser/autocomplete_provider_client.h"

      #include "components/omnibox/browser/autocomplete_provider_listener.h"

      #include "components/omnibox/browser/omnibox_field_trial.h"

      '
- description: 'Android concrete AI source/provider removal: components/omnibox/browser/base_search_provider.cc'
  regex:
    re_pattern: '\ \ \ \ \ \ accepted_suggestion,\ ShouldAppendExtraParams\(result\)\);\

      \ \ if\ \(!match\.destination_url\.is_valid\(\)\)\

      \ \ \ \ return;\

      \ \ if\ \(match\.IsSearchAimSuggestion\(\)\ \&\&\

      \ \ \ \ \ \ \(!omnibox_feature_configs::AiMode::Get\(\)\.allow_ai_mode_matches\ \|\|\

      \ \ \ \ \ \ \ !client_\->GetAimEligibilityService\(\)\->IsAimLocallyEligible\(\)\)\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \ \ match\.RecordAdditionalInfo\(kRelevanceFromServerKey,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ result\.relevance_from_server\(\)\ \?\ kTrue\ :\ kFalse\);\

      \ \ match\.RecordAdditionalInfo\(kShouldPrefetchKey,\

      '
    replace: "      accepted_suggestion, ShouldAppendExtraParams(result));\n  if (!match.destination_url.is_valid())\n    return;\n#if BUILDFLAG(IS_ANDROID)\n  if (match.IsSearchAimSuggestion()) {\n    return;\n  }\n#else\n  if (match.IsSearchAimSuggestion() &&\n      (!omnibox_feature_configs::AiMode::Get().allow_ai_mode_matches ||\n       !client_->GetAimEligibilityService()->IsAimLocallyEligible())) {\n    return;\n  }\n#endif\n  match.RecordAdditionalInfo(kRelevanceFromServerKey,\n                             result.relevance_from_server() ? kTrue : kFalse);\n  match.RecordAdditionalInfo(kShouldPrefetchKey,\n"
