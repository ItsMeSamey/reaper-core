# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/browser_sync/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//extensions/buildflags",\

      \ \ \ \ "//ui/base",\

      \ \ \]\

      \

      \ \ if\ \(is_chromeos\)\ \{\

      \ \ \ \ deps\ \+=\ \[\

      '
    replace: "    \"//extensions/buildflags\",\n    \"//ui/base\",\n  ]\n  if (is_android) {\n    deps -= [\n      \"//components/contextual_tasks/public\",\n      \"//components/notebooks/public\",\n      \"//components/skills:features\",\n      \"//components/skills/public\",\n    ]\n  }\n\n  if (is_chromeos) {\n    deps += [\n"
