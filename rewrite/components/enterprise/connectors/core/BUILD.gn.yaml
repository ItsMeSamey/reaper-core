# Android enterprise reporting producer compile-out; retain ordinary scan security.
substitutions:
- description: "0561 Android reporting producer exclusion: Direct scan-result data/API header ownership"
  regex:
    pattern: "    \"analysis_settings.h\",\n"
    replace: "    \"analysis_settings.h\",\n    \"cloud_content_scanning/common.h\",\n"
  count: 1
- description: "0561 Android reporting producer exclusion: Production Android emitter subtraction"
  regex:
    pattern: "    \"service_provider_config.h\",\n  ]\n\n  public_deps = ["
    replace: "    \"service_provider_config.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"realtime_reporting_client_base.cc\",\n      \"reporting_event_router.cc\",\n    ]\n  }\n\n  public_deps = ["
  count: 1
- description: "0561 Android reporting producer exclusion: Original emitters retained in existing testonly support"
  regex:
    pattern: "    \"test_connectors_service.h\",\n  ]\n\n  deps = ["
    replace: "    \"test_connectors_service.h\",\n  ]\n  if (is_android) {\n    sources += [\n      \"realtime_reporting_client_base.cc\",\n      \"reporting_event_router.cc\",\n    ]\n  }\n\n  deps = ["
  count: 1
- description: "0561 Android reporting producer exclusion: Android-only direct header owners for relocated reporter test sources"
  regex:
    pattern: "    \"//testing/gmock\",\n    \"//url\",\n  ]\n\n  if (enterprise_cloud_content_analysis || is_android) {"
    replace: "    \"//testing/gmock\",\n    \"//url\",\n  ]\n\n  if (is_android) {\n    deps += [\n      \"//base:i18n\",\n      \"//components/safe_browsing/core/common:features\",\n      \"//components/url_matcher\",\n      \"//services/network/public/cpp\",\n      \"//ui/base\",\n      \"//ui/base/clipboard:clipboard_types\",\n    ]\n  }\n\n  if (enterprise_cloud_content_analysis || is_android) {"
  count: 1
