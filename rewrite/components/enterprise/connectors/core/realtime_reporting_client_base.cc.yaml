substitutions:
- description: Own explicit Android platform macro provider
  regex:
    pattern: '#include "base/task/thread_pool.h"

      '
    replace: '#include "base/task/thread_pool.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Preserve shared virtual API but omit Android SaaS event upload implementation
  regex:
    pattern: "  CHECK(event.has_saas_usage_report_event());\n  ReportStandaloneEvent(std::move(event),\n                 \
      \       EnterpriseReportingEventType::kSaasUsageReportEvent,\n                        per_profile, dm_token, std::move(callback));\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  if (callback) {\n    std::move(callback).Run(\n        policy::CloudPolicyClient::Result(policy::DM_STATUS_REQUEST_FAILED));\n\
      \  }\n#else\n  CHECK(event.has_saas_usage_report_event());\n  ReportStandaloneEvent(std::move(event),\n            \
      \            EnterpriseReportingEventType::kSaasUsageReportEvent,\n                        per_profile, dm_token, std::move(callback));\n\
      #endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
