# Android enterprise reporting producer compile-out; retain ordinary scan security.
substitutions:
- description: "0561 Android reporting producer exclusion: Guard cancelled-file enterprise report only"
  regex:
    pattern: "void FilesRequestHandlerBase::ReportCanceledFile(size_t index) {\n  if (!base::FeatureList::IsEnabled(\n          enterprise_connectors::kEnableCancelUploadOnContentAnalysis)) {\n    return;\n  }\n\n  const FileInfo& file_info = delegate_->GetFileInfo(index);\n  MaybeReportDeepScanningVerdict(\n      delegate_->GetReportingEventRouter(), content_analysis_info(),\n      delegate_->GetSource(), delegate_->GetDestination(),\n      delegate_->GetPath(index).AsUTF8Unsafe(), file_info.sha256_or_cb,\n      file_info.mime_type, access_point_string(), content_transfer_method_,\n      content_analysis_info()->GetContentAreaAccountEmail(), file_info.size,\n      ScanRequestUploadResult::kUserCancelled,\n      enterprise_connectors::ContentAnalysisResponse(), EventResult::CANCELLED);\n}"
    replace: "void FilesRequestHandlerBase::ReportCanceledFile(size_t index) {\n#if !BUILDFLAG(IS_ANDROID)\n  if (!base::FeatureList::IsEnabled(\n          enterprise_connectors::kEnableCancelUploadOnContentAnalysis)) {\n    return;\n  }\n\n  const FileInfo& file_info = delegate_->GetFileInfo(index);\n  MaybeReportDeepScanningVerdict(\n      delegate_->GetReportingEventRouter(), content_analysis_info(),\n      delegate_->GetSource(), delegate_->GetDestination(),\n      delegate_->GetPath(index).AsUTF8Unsafe(), file_info.sha256_or_cb,\n      file_info.mime_type, access_point_string(), content_transfer_method_,\n      content_analysis_info()->GetContentAreaAccountEmail(), file_info.size,\n      ScanRequestUploadResult::kUserCancelled,\n      enterprise_connectors::ContentAnalysisResponse(), EventResult::CANCELLED);\n#endif  // !BUILDFLAG(IS_ANDROID)\n}"
  count: 1
- description: "0561 Android reporting producer exclusion: Guard report-only local argument with its only use"
  regex:
    pattern: "  bool result_is_warning = request_handler_result.final_result ==\n                           FinalContentAnalysisResult::WARNING;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  bool result_is_warning = request_handler_result.final_result ==\n                           FinalContentAnalysisResult::WARNING;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "0561 Android reporting producer exclusion: Guard only result reporting; keep MarkFileAsReported and request completion"
  regex:
    pattern: "  MaybeReportDeepScanningVerdict(\n      delegate_->GetReportingEventRouter(), content_analysis_info(),\n      delegate_->GetSource(), delegate_->GetDestination(),\n      delegate_->GetPath(index).AsUTF8Unsafe(), file_info.sha256_or_cb,\n      file_info.mime_type, access_point_string(), content_transfer_method_,\n      content_analysis_info()->GetContentAreaAccountEmail(), file_info.size,\n      upload_result, response,\n      CalculateEventResult(analysis_settings, request_handler_result.complies,\n                           result_is_warning, upload_result));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  MaybeReportDeepScanningVerdict(\n      delegate_->GetReportingEventRouter(), content_analysis_info(),\n      delegate_->GetSource(), delegate_->GetDestination(),\n      delegate_->GetPath(index).AsUTF8Unsafe(), file_info.sha256_or_cb,\n      file_info.mime_type, access_point_string(), content_transfer_method_,\n      content_analysis_info()->GetContentAreaAccountEmail(), file_info.size,\n      upload_result, response,\n      CalculateEventResult(analysis_settings, request_handler_result.complies,\n                           result_is_warning, upload_result));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "0561 Android reporting producer exclusion: Explicit Android build-config definition"
  regex:
    pattern: "#include \"base/task/bind_post_task.h\"\n"
    replace: "#include \"base/task/bind_post_task.h\"\n#include \"build/build_config.h\"\n"
  count: 1
