substitutions:
- description: Exclude SaaS collection/aggregation/storage/scheduling on Android
  regex:
    pattern: "    \"browser/reporting/user_security_signals_service.h\",\n  ]\n"
    replace: "    \"browser/reporting/user_security_signals_service.h\",\n  ]\n  if (is_android) {\n    sources -= [\n   \
      \   \"browser/reporting/saas_usage/saas_usage_aggregation_utils.cc\",\n      \"browser/reporting/saas_usage/saas_usage_report_factory.cc\"\
      ,\n      \"browser/reporting/saas_usage/saas_usage_report_scheduler.cc\",\n      \"browser/reporting/saas_usage/saas_usage_reporting_controller.cc\"\
      ,\n    ]\n  }\n"
  count: 1
- description: Omit dedicated removed component SaaS tests on Android
  regex:
    pattern: "    \"common/proto/connectors_unittest.cc\",\n  ]\n"
    replace: "    \"common/proto/connectors_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"browser/reporting/saas_usage/saas_usage_aggregation_utils_unittest.cc\"\
      ,\n      \"browser/reporting/saas_usage/saas_usage_report_factory_unittest.cc\",\n      \"browser/reporting/saas_usage/saas_usage_report_scheduler_unittest.cc\"\
      ,\n      \"browser/reporting/saas_usage/saas_usage_reporting_controller_unittest.cc\",\n    ]\n  }\n"
  count: 1
- description: Compile out dedicated Android enterprise report collection/scheduling/upload and launch controller
  regex:
    pattern: "  if (!is_chromeos) {\n    sources += [\n      \"browser/controller/browser_dm_token_storage.cc\","
    replace: "  if (is_android) {\n    sources -= [\n      \"browser/reporting/browser_launch/browser_launch_event_controller.cc\"\
      ,\n      \"browser/reporting/browser_report_generator.cc\",\n      \"browser/reporting/chrome_profile_request_generator.cc\"\
      ,\n      \"browser/reporting/os_report_generator.cc\",\n      \"browser/reporting/profile_report_generator.cc\",\n \
      \     \"browser/reporting/real_time_report_controller.cc\",\n      \"browser/reporting/real_time_report_generator.cc\"\
      ,\n      \"browser/reporting/real_time_uploader.cc\",\n      \"browser/reporting/report_generator.cc\",\n      \"browser/reporting/report_request_queue_generator.cc\"\
      ,\n      \"browser/reporting/report_scheduler.cc\",\n      \"browser/reporting/report_uploader.cc\",\n      \"browser/reporting/user_security_signals_service.cc\"\
      ,\n    ]\n  }\n\n  if (!is_chromeos) {\n    sources += [\n      \"browser/controller/browser_dm_token_storage.cc\","
  count: 1
- description: Omit dedicated report-only fake implementation on Android
  regex:
    pattern: "    \"browser/reporting/fake_browser_report_generator_delegate.h\",\n  ]\n"
    replace: "    \"browser/reporting/fake_browser_report_generator_delegate.h\",\n  ]\n  if (is_android) {\n    sources =\
      \ []\n  }\n"
  count: 1
- description: Omit tests whose dedicated Android report implementation is removed; keep policy/helper tests
  regex:
    pattern: "  if (!is_ios && !is_android) {\n    sources += [ \"browser/promotion/promotion_eligibility_checker_unittest.cc\"\
      \ ]\n  }\n"
    replace: "  if (is_android) {\n    sources -= [\n      \"browser/reporting/browser_launch/browser_launch_event_controller_unittest.cc\"\
      ,\n      \"browser/reporting/chrome_profile_request_generator_unittest.cc\",\n      \"browser/reporting/report_uploader_unittest.cc\"\
      ,\n      \"browser/reporting/user_security_signals_service_unittest.cc\",\n    ]\n  }\n\n  if (!is_ios && !is_android)\
      \ {\n    sources += [ \"browser/promotion/promotion_eligibility_checker_unittest.cc\" ]\n  }\n"
  count: 1
- description: Exclude dedicated report config/proto mapping/UMA after diagnostic caller closure
  regex:
    pattern: '      "browser/reporting/report_generator.cc",

      '
    replace: "      \"browser/reporting/report_generator.cc\",\n      \"browser/reporting/report_generation_config.cc\",\n\
      \      \"browser/reporting/report_request.cc\",\n      \"browser/reporting/report_util.cc\",\n"
  count: 1
- description: Omit removed Android report utility tests
  regex:
    pattern: '      "browser/reporting/report_uploader_unittest.cc",

      '
    replace: "      \"browser/reporting/report_uploader_unittest.cc\",\n      \"browser/reporting/report_util_unittest.cc\"\
      ,\n"
  count: 1

- description: "Drop dead Android reporting queue/provider/status attachments; retain enum-only proto declarations and ordinary enterprise policy interfaces."
  count: 1
  regex:
    pattern: "  public_deps = [\n    \"//components/enterprise/common/proto:browser_events_proto\",\n    \"//components/reporting/client:report_queue_configuration\",\n    \"//components/reporting/util:status\",\n  ]\n"
    replace: "  public_deps = [\n    \"//components/enterprise/common/proto:browser_events_proto\",\n    \"//components/reporting/client:report_queue_configuration\",\n    \"//components/reporting/util:status\",\n  ]\n  if (is_android) {\n    sources -= [ \"browser/reporting/real_time_uploader.h\" ]\n    deps -= [ \"//components/reporting/client:report_queue_provider\" ]\n    public_deps -= [\n      \"//components/reporting/client:report_queue_configuration\",\n      \"//components/reporting/util:status\",\n    ]\n    # Keep only the enum definitions used by retained reporting declarations.\n    public_deps += [ \"//components/reporting/proto:record_constants\" ]\n  }\n"
