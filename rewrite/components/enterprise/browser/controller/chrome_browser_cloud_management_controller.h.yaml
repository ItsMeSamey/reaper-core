substitutions:
- description: Omit Android SaaS browser scheduler ownership
  regex:
    pattern: "  std::unique_ptr<enterprise_reporting::SaasUsageReportScheduler>\n      saas_usage_report_scheduler_;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<enterprise_reporting::SaasUsageReportScheduler>\n      saas_usage_report_scheduler_;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove Android reporting-only declaration/ownership     GetReportingDelegateFactory() = 0;
  regex:
    pattern: "    // Gets the platform-specific reporting delegate factory.\n    virtual std::unique_ptr<enterprise_reporting::ReportingDelegateFactory>\n\
      \    GetReportingDelegateFactory() = 0;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    // Gets the platform-specific reporting delegate factory.\n    virtual std::unique_ptr<enterprise_reporting::ReportingDelegateFactory>\n\
      \    GetReportingDelegateFactory() = 0;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove Android reporting-only declaration/ownership     CreateBrowserLaunchEventController() = 0;
  regex:
    pattern: "    // Creates the platform-specific browser launch event controller.\n    virtual std::unique_ptr<enterprise_reporting::BrowserLaunchEventController>\n\
      \    CreateBrowserLaunchEventController() = 0;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    // Creates the platform-specific browser launch event controller.\n    virtual\
      \ std::unique_ptr<enterprise_reporting::BrowserLaunchEventController>\n    CreateBrowserLaunchEventController() = 0;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove Android reporting-only declaration/ownership void NotifyCloudReportingLaunched();
  regex:
    pattern: '  void NotifyCloudReportingLaunched();

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void NotifyCloudReportingLaunched();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove Android reporting-only declaration/ownership void InitializeReporting();
  regex:
    pattern: '  void InitializeReporting();

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void InitializeReporting();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove Android reporting-only declaration/ownership std::unique_ptr<enterprise_reporting::ReportScheduler>
    report_scheduler_;
  regex:
    pattern: '  std::unique_ptr<enterprise_reporting::ReportScheduler> report_scheduler_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<enterprise_reporting::ReportScheduler> report_scheduler_;\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove Android reporting-only declaration/ownership       browser_launch_controller_;
  regex:
    pattern: "  std::unique_ptr<enterprise_reporting::BrowserLaunchEventController>\n      browser_launch_controller_;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<enterprise_reporting::BrowserLaunchEventController>\n      browser_launch_controller_;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove Android reporting-only declaration/ownership std::unique_ptr<CloudPolicyClient> cloud_policy_client_;
  regex:
    pattern: '  std::unique_ptr<CloudPolicyClient> cloud_policy_client_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<CloudPolicyClient> cloud_policy_client_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Return unavailable Android scheduler without owning or linking its implementation
  regex:
    pattern: '    return report_scheduler_.get();

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n    return nullptr;\n#else\n    return report_scheduler_.get();\n#endif  // BUILDFLAG(IS_ANDROID)\n"
  count: 1
