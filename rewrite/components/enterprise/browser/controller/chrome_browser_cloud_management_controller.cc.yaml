substitutions:
- description: Omit Android SaaS browser-scheduler include
  regex:
    pattern: '#include "components/enterprise/browser/reporting/saas_usage/saas_usage_report_scheduler.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/saas_usage/saas_usage_report_scheduler.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android SaaS browser-scheduler include
  regex:
    pattern: '#include "components/enterprise/browser/reporting/saas_usage/saas_usage_reporting_delegate_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/saas_usage/saas_usage_reporting_delegate_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android SaaS scheduler teardown dependency
  regex:
    pattern: '  saas_usage_report_scheduler_.reset();

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  saas_usage_report_scheduler_.reset();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit Android SaaS browser scheduler creation
  regex:
    pattern: "  if (base::FeatureList::IsEnabled(enterprise_reporting::kSaasUsageReporting)) {\n    if (auto saas_usage_reporting_delegate_factory\
      \ =\n            delegate_->GetSaasUsageReportingDelegateFactory()) {\n      saas_usage_report_scheduler_ =\n      \
      \    enterprise_reporting::SaasUsageReportScheduler::Create(\n              \"browser\", saas_usage_reporting_delegate_factory.get());\n\
      \    }\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(enterprise_reporting::kSaasUsageReporting)) {\n\
      \    if (auto saas_usage_reporting_delegate_factory =\n            delegate_->GetSaasUsageReportingDelegateFactory())\
      \ {\n      saas_usage_report_scheduler_ =\n          enterprise_reporting::SaasUsageReportScheduler::Create(\n     \
      \         \"browser\", saas_usage_reporting_delegate_factory.get());\n    }\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit Android report-only include browser_launch/browser_launch_event_controller.h
  regex:
    pattern: '#include "components/enterprise/browser/reporting/browser_launch/browser_launch_event_controller.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/browser_launch/browser_launch_event_controller.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android report-only include real_time_report_controller.h
  regex:
    pattern: '#include "components/enterprise/browser/reporting/real_time_report_controller.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/real_time_report_controller.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Group Android-excluded report scheduler include with report-only controller include
  regex:
    pattern: '#include "components/enterprise/browser/reporting/real_time_report_controller.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/report_scheduler.h"

      '
    replace: '#include "components/enterprise/browser/reporting/real_time_report_controller.h"

      #include "components/enterprise/browser/reporting/report_scheduler.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android report-only include reporting_delegate_factory.h
  regex:
    pattern: '#include "components/enterprise/browser/reporting/reporting_delegate_factory.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/reporting_delegate_factory.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android report-only include reporting_features.h
  regex:
    pattern: '#include "components/enterprise/browser/reporting/reporting_features.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/enterprise/browser/reporting/reporting_features.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit dedicated reporting client observer teardown on Android
  regex:
    pattern: "  if (cloud_policy_client_)\n    cloud_policy_client_->RemoveObserver(this);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (cloud_policy_client_)\n    cloud_policy_client_->RemoveObserver(this);\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Remove Android reporting startup task while preserving controller policy initialization
  regex:
    pattern: "  // Post the task of InitializeReporting to run on best effort after launch\n  // is completed.\n  delegate_->GetBestEffortTaskRunner()->PostTask(\n\
      \      FROM_HERE,\n      base::BindOnce(\n          &ChromeBrowserCloudManagementController::InitializeReporting,\n\
      \          weak_factory_.GetWeakPtr()));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Post the task of InitializeReporting to run on best effort after launch\n \
      \ // is completed.\n  delegate_->GetBestEffortTaskRunner()->PostTask(\n      FROM_HERE,\n      base::BindOnce(\n   \
      \       &ChromeBrowserCloudManagementController::InitializeReporting,\n          weak_factory_.GetWeakPtr()));\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit retired report scheduler token invalidation callback on Android
  regex:
    pattern: "  // This causes the scheduler to stop refreshing itself since the DM token is\n  // no longer valid.\n  if\
      \ (report_scheduler_)\n    report_scheduler_->OnDMTokenUpdated();\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // This causes the scheduler to stop refreshing itself since the DM token is\n\
      \  // no longer valid.\n  if (report_scheduler_)\n    report_scheduler_->OnDMTokenUpdated();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit retired report scheduler teardown on Android
  regex:
    pattern: '  report_scheduler_.reset();

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  report_scheduler_.reset();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit retired report scheduler enrollment notification; preserve policy fetch
  regex:
    pattern: "  if (report_scheduler_) {\n    report_scheduler_->OnDMTokenUpdated();\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (report_scheduler_) {\n    report_scheduler_->OnDMTokenUpdated();\n  }\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit Android reporting-launched dispatch
  regex:
    pattern: "void ChromeBrowserCloudManagementController::NotifyCloudReportingLaunched() {\n  for (auto& observer : observers_)\
      \ {\n    observer.OnCloudReportingLaunched(report_scheduler_.get());\n  }\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid ChromeBrowserCloudManagementController::NotifyCloudReportingLaunched() {\n\
      \  for (auto& observer : observers_) {\n    observer.OnCloudReportingLaunched(report_scheduler_.get());\n  }\n}\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Compile out complete Android dedicated reporting bootstrap and client construction
  regex:
    pattern: "void ChromeBrowserCloudManagementController::InitializeReporting() {\n  cloud_policy_client_ = std::make_unique<policy::CloudPolicyClient>(\n\
      \      delegate_->GetDeviceManagementService(),\n      delegate_->GetSharedURLLoaderFactory(),\n      CloudPolicyClient::DeviceDMTokenCallback());\n\
      \  cloud_policy_client_->AddObserver(this);\n  auto reporting_delegate_factory = delegate_->GetReportingDelegateFactory();\n\
      \n  enterprise_reporting::ReportScheduler::CreateParams params;\n  params.client = cloud_policy_client_.get();\n  params.delegate\
      \ = reporting_delegate_factory->GetReportSchedulerDelegate();\n  params.report_generator =\n      std::make_unique<enterprise_reporting::ReportGenerator>(\n\
      \          reporting_delegate_factory.get());\n  params.real_time_report_controller =\n      std::make_unique<enterprise_reporting::RealTimeReportController>(\n\
      \          reporting_delegate_factory.get());\n\n  report_scheduler_ = std::make_unique<enterprise_reporting::ReportScheduler>(\n\
      \      std::move(params));\n\n#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(enterprise_reporting::kSaasUsageReporting))\
      \ {\n    if (auto saas_usage_reporting_delegate_factory =\n            delegate_->GetSaasUsageReportingDelegateFactory())\
      \ {\n      saas_usage_report_scheduler_ =\n          enterprise_reporting::SaasUsageReportScheduler::Create(\n     \
      \         \"browser\", saas_usage_reporting_delegate_factory.get());\n    }\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\
      \n  if (base::FeatureList::IsEnabled(\n          enterprise_reporting::kBrowserLaunchMetadataReporting)) {\n    browser_launch_controller_\
      \ =\n        delegate_->CreateBrowserLaunchEventController();\n    if (browser_launch_controller_) {\n      browser_launch_controller_->CollectAndUpload();\n\
      \    }\n  }\n\n  NotifyCloudReportingLaunched();\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid ChromeBrowserCloudManagementController::InitializeReporting() {\n  cloud_policy_client_\
      \ = std::make_unique<policy::CloudPolicyClient>(\n      delegate_->GetDeviceManagementService(),\n      delegate_->GetSharedURLLoaderFactory(),\n\
      \      CloudPolicyClient::DeviceDMTokenCallback());\n  cloud_policy_client_->AddObserver(this);\n  auto reporting_delegate_factory\
      \ = delegate_->GetReportingDelegateFactory();\n\n  enterprise_reporting::ReportScheduler::CreateParams params;\n  params.client\
      \ = cloud_policy_client_.get();\n  params.delegate = reporting_delegate_factory->GetReportSchedulerDelegate();\n  params.report_generator\
      \ =\n      std::make_unique<enterprise_reporting::ReportGenerator>(\n          reporting_delegate_factory.get());\n\
      \  params.real_time_report_controller =\n      std::make_unique<enterprise_reporting::RealTimeReportController>(\n \
      \         reporting_delegate_factory.get());\n\n  report_scheduler_ = std::make_unique<enterprise_reporting::ReportScheduler>(\n\
      \      std::move(params));\n\n#if !BUILDFLAG(IS_ANDROID)\n  if (base::FeatureList::IsEnabled(enterprise_reporting::kSaasUsageReporting))\
      \ {\n    if (auto saas_usage_reporting_delegate_factory =\n            delegate_->GetSaasUsageReportingDelegateFactory())\
      \ {\n      saas_usage_report_scheduler_ =\n          enterprise_reporting::SaasUsageReportScheduler::Create(\n     \
      \         \"browser\", saas_usage_reporting_delegate_factory.get());\n    }\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n\
      \n  if (base::FeatureList::IsEnabled(\n          enterprise_reporting::kBrowserLaunchMetadataReporting)) {\n    browser_launch_controller_\
      \ =\n        delegate_->CreateBrowserLaunchEventController();\n    if (browser_launch_controller_) {\n      browser_launch_controller_->CollectAndUpload();\n\
      \    }\n  }\n\n  NotifyCloudReportingLaunched();\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
