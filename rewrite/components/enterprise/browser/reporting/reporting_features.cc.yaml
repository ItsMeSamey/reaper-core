substitutions:
- description: Own explicit Android platform macro provider
  regex:
    pattern: '#include "base/feature_list.h"

      '
    replace: '#include "base/feature_list.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Omit Android SaaS feature implementation/enablement constant
  regex:
    pattern: "BASE_FEATURE(kSaasUsageReporting,\n#if !BUILDFLAG(IS_ANDROID) && !BUILDFLAG(IS_IOS) && !BUILDFLAG(IS_CHROMEOS)\n\
      \             base::FEATURE_ENABLED_BY_DEFAULT\n#else\n             base::FEATURE_DISABLED_BY_DEFAULT\n#endif\n);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nBASE_FEATURE(kSaasUsageReporting,\n#if !BUILDFLAG(IS_ANDROID) && !BUILDFLAG(IS_IOS)\
      \ && !BUILDFLAG(IS_CHROMEOS)\n             base::FEATURE_ENABLED_BY_DEFAULT\n#else\n             base::FEATURE_DISABLED_BY_DEFAULT\n\
      #endif\n);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit Android removed report feature declaration
  regex:
    pattern: "BASE_FEATURE(kBrowserLaunchMetadataReporting,\n             base::FEATURE_DISABLED_BY_DEFAULT);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nBASE_FEATURE(kBrowserLaunchMetadataReporting,\n             base::FEATURE_DISABLED_BY_DEFAULT);\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Omit Android removed report feature declaration
  regex:
    pattern: 'BASE_FEATURE(kUploadReportOnProfileOpen, base::FEATURE_DISABLED_BY_DEFAULT);

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      BASE_FEATURE(kUploadReportOnProfileOpen, base::FEATURE_DISABLED_BY_DEFAULT);

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
