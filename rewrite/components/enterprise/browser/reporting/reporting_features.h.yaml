substitutions:
- description: Omit unused Android SaaS feature declaration
  regex:
    pattern: '// Controls whether SaaS usage reporting is enabled.

      BASE_DECLARE_FEATURE(kSaasUsageReporting);

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      // Controls whether SaaS usage reporting is enabled.

      BASE_DECLARE_FEATURE(kSaasUsageReporting);

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android removed report feature API kBrowserLaunchMetadataReporting
  regex:
    pattern: 'BASE_DECLARE_FEATURE(kBrowserLaunchMetadataReporting);

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      BASE_DECLARE_FEATURE(kBrowserLaunchMetadataReporting);

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Omit Android removed report feature API kUploadReportOnProfileOpen
  regex:
    pattern: 'BASE_DECLARE_FEATURE(kUploadReportOnProfileOpen);

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      BASE_DECLARE_FEATURE(kUploadReportOnProfileOpen);

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
