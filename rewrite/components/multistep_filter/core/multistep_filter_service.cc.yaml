substitutions:
  - description: "Keep Android multistep settings disabled without removed AI APIs (1)"
    count: 1
    regex:
      re_pattern: "\\#include\\ \"base/functional/callback_helpers\\.h\"\\\n\\#include\\ \"base/strings/string_util\\.h\"\\\n\\#include\\ \"base/uuid\\.h\"\\\n\\#include\\ \"components/history/core/browser/history_service\\.h\"\\\n\\#include\\ \"components/multistep_filter/core/annotation_index/annotation_index_client\\.h\"\\\n\\#include\\ \"components/multistep_filter/core/data_models/url_filter_suggestion\\.h\"\\\n"
      replace: "#include \"base/functional/callback_helpers.h\"\n#include \"base/strings/string_util.h\"\n#include \"base/uuid.h\"\n#include \"build/build_config.h\"\n#include \"components/history/core/browser/history_service.h\"\n#include \"components/multistep_filter/core/annotation_index/annotation_index_client.h\"\n#include \"components/multistep_filter/core/data_models/url_filter_suggestion.h\"\n"
  - description: "Keep Android multistep settings disabled without removed AI APIs (2)"
    count: 1
    regex:
      re_pattern: "\\}\\\n\\\nSettingsState\\ MultistepFilterService::GetSettingsState\\(\\)\\ const\\ \\{\\\n\\ \\ const\\ optimization_guide::prefs::FeatureOptInState\\ opt_in_state\\ =\\ static_cast<\\\n\\ \\ \\ \\ \\ \\ optimization_guide::prefs::FeatureOptInState>\\(pref_service_\\->GetInteger\\(\\\n\\ \\ \\ \\ \\ \\ optimization_guide::prefs::GetSettingEnabledPrefName\\(\\\n"
      replace: "}\n\nSettingsState MultistepFilterService::GetSettingsState() const {\n#if BUILDFLAG(IS_ANDROID)\n  // Android omits the AI suggestion preference APIs entirely.\n  return SettingsState{\n      .opt_in_state = optimization_guide::prefs::FeatureOptInState::kDisabled,\n      .policy_state = SuggestionsPolicyState::kDisabled,\n  };\n#else\n  const optimization_guide::prefs::FeatureOptInState opt_in_state = static_cast<\n      optimization_guide::prefs::FeatureOptInState>(pref_service_->GetInteger(\n      optimization_guide::prefs::GetSettingEnabledPrefName(\n"
  - description: "Keep Android multistep settings disabled without removed AI APIs (3)"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\.opt_in_state\\ =\\ opt_in_state,\\\n\\ \\ \\ \\ \\ \\ \\.policy_state\\ =\\ policy_state,\\\n\\ \\ \\};\\\n\\}\\\n\\\nbool\\ MultistepFilterService::CanUseModelExecutionFeatures\\(\\)\\ const\\ \\{\\\n"
      replace: "      .opt_in_state = opt_in_state,\n      .policy_state = policy_state,\n  };\n#endif\n}\n\nbool MultistepFilterService::CanUseModelExecutionFeatures() const {\n"
