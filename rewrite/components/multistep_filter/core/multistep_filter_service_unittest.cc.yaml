substitutions:
  - description: "Keep Android multistep settings disabled without removed AI APIs (1)"
    count: 1
    regex:
      re_pattern: "\\#include\\ \"base/test/task_environment\\.h\"\\\n\\#include\\ \"base/test/test_future\\.h\"\\\n\\#include\\ \"base/uuid\\.h\"\\\n\\#include\\ \"components/multistep_filter/core/annotation_index/annotation_index_client\\.h\"\\\n\\#include\\ \"components/multistep_filter/core/annotation_index/mock_annotation_index_client\\.h\"\\\n\\#include\\ \"components/multistep_filter/core/data_models/filter_annotation\\.h\"\\\n"
      replace: "#include \"base/test/task_environment.h\"\n#include \"base/test/test_future.h\"\n#include \"base/uuid.h\"\n#include \"build/build_config.h\"\n#include \"components/multistep_filter/core/annotation_index/annotation_index_client.h\"\n#include \"components/multistep_filter/core/annotation_index/mock_annotation_index_client.h\"\n#include \"components/multistep_filter/core/data_models/filter_annotation.h\"\n"
  - description: "Keep Android multistep settings disabled without removed AI APIs (2)"
    count: 1
    regex:
      re_pattern: "TEST_F\\(MultistepFilterServiceTest,\\ GetSettingsState\\)\\ \\{\\\n\\ \\ using\\ optimization_guide::prefs::FeatureOptInState;\\\n\\\n\\ \\ //\\ 1\\.\\ Default\\ state\\ \\(Prefs\\ not\\ explicitly\\ modified\\)\\\n\\ \\ CreateService\\(\\);\\\n\\ \\ \\{\\\n"
      replace: "TEST_F(MultistepFilterServiceTest, GetSettingsState) {\n  using optimization_guide::prefs::FeatureOptInState;\n\n#if BUILDFLAG(IS_ANDROID)\n  // Android omits the AI suggestion preference APIs entirely.\n  CreateService();\n  const SettingsState settings = service_->GetSettingsState();\n  EXPECT_EQ(settings.opt_in_state, FeatureOptInState::kDisabled);\n  EXPECT_EQ(settings.policy_state, SuggestionsPolicyState::kDisabled);\n  EXPECT_FALSE(settings.IsSmartSuggestionsEnabled());\n#else\n  // 1. Default state (Prefs not explicitly modified)\n  CreateService();\n  {\n"
  - description: "Keep Android multistep settings disabled without removed AI APIs (3)"
    count: 1
    regex:
      re_pattern: "\\ \\ \\ \\ EXPECT_EQ\\(settings\\.policy_state,\\ SuggestionsPolicyState::kEnabled\\);\\\n\\ \\ \\ \\ EXPECT_TRUE\\(settings\\.IsSmartSuggestionsEnabled\\(\\)\\);\\\n\\ \\ \\}\\\n\\}\\\n\\\n\\}\\ \\ //\\ namespace\\ multistep_filter\\\n"
      replace: "    EXPECT_EQ(settings.policy_state, SuggestionsPolicyState::kEnabled);\n    EXPECT_TRUE(settings.IsSmartSuggestionsEnabled());\n  }\n#endif\n}\n\n}  // namespace multistep_filter\n"
  - description: "0666 Android excluded-feature test-consumer closure 1: components/multistep_filter/core/multistep_filter_service_unittest.cc"
    count: 1
    regex:
      pattern: "#include \"components/optimization_guide/core/model_execution/model_execution_prefs.h\"\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/optimization_guide/core/model_execution/model_execution_prefs.h\"\n#endif\n"
  - description: "0666 Android excluded-feature test-consumer closure 2: components/multistep_filter/core/multistep_filter_service_unittest.cc"
    count: 1
    regex:
      pattern: "    optimization_guide::model_execution::prefs::RegisterProfilePrefs(\n        pref_service_.registry());\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n    optimization_guide::model_execution::prefs::RegisterProfilePrefs(\n        pref_service_.registry());\n#endif\n"
