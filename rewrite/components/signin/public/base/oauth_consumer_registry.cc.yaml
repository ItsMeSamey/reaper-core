substitutions:
- description: Use the real Chromium Android compile-time guard; no preference or dummy consumer.
  regex:
    re_pattern: '\#include\ "base/notreached\.h"\

      '
    replace: '#include "base/notreached.h"

      #include "build/build_config.h"

      '
- description: Exclude the ContextualTasks product feature import on Android. Native owns the matching
    exact GN feature_list dependency.
  regex:
    re_pattern: '\#include\ "components/contextual_tasks/public/features\.h"\

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/contextual_tasks/public/features.h"

      #endif

      '
- description: Exclude the dedicated omitted Composebox product name; preserve shared Lens/Drive scope
    constants.
  regex:
    re_pattern: 'constexpr\ char\ kComposeboxQueryControllerName\[\]\ =\ "ComposeboxQueryController";\

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      constexpr char kComposeboxQueryControllerName[] = "ComposeboxQueryController";

      #endif

      '
- description: Physically exclude kComposeboxQueryController product construction/virtual dispatch on
    Android; preserve the existing unexpected-ID fail-closed contract and stable case metadata. Concrete
    requesters must be GN-unselected.
  regex:
    re_pattern: '\ \ \ \ case\ OAuthConsumerId::kComposeboxQueryController:\

      \ \ \ \ \ \ return\ OAuthConsumer\(\

      \ \ \ \ \ \ \ \ \ \ /\*name=\*/kComposeboxQueryControllerName,\

      \ \ \ \ \ \ \ \ \ \ /\*scopes=\*/\{GaiaConstants::kLensOAuth2Scope,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ kDriveReadOnlyOAuth2Scope\}\);\

      '
    replace: "    case OAuthConsumerId::kComposeboxQueryController:\n#if BUILDFLAG(IS_ANDROID)\n     \
      \ NOTREACHED();\n#else\n      return OAuthConsumer(\n          /*name=*/kComposeboxQueryControllerName,\n\
      \          /*scopes=*/{GaiaConstants::kLensOAuth2Scope,\n                      kDriveReadOnlyOAuth2Scope});\n\
      #endif\n"
- description: Physically exclude kContextualTasks product construction/virtual dispatch on Android; preserve
    the existing unexpected-ID fail-closed contract and stable case metadata. Concrete requesters must
    be GN-unselected.
  regex:
    re_pattern: '\ \ \ \ case\ OAuthConsumerId::kContextualTasks:\

      \ \ \ \ \ \ return\ GetOAuthConsumerForContextualTasks\(\);\

      '
    replace: "    case OAuthConsumerId::kContextualTasks:\n#if BUILDFLAG(IS_ANDROID)\n      NOTREACHED();\n\
      #else\n      return GetOAuthConsumerForContextualTasks();\n#endif\n"
