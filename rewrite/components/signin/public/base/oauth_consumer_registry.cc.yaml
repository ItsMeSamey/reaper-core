- description: "Reviewed Android552 source 9/1: exclude private-pass feature import"
  regex:
    re_pattern: "\\#include\\ \"components/wallet/core/common/wallet_features\\.h\"\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/wallet/core/common/wallet_features.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "Reviewed Android552 source 9/2: compile out dedicated private-pass scope literal"
  regex:
    re_pattern: "constexpr\\ char\\ kWalletPassesOAuth2Scope\\[\\]\\ =\\\n\\ \\ \\ \\ \"https://www\\.googleapis\\.com/auth/wallet_1p_passes\";\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nconstexpr char kWalletPassesOAuth2Scope[] =\n    \"https://www.googleapis.com/auth/wallet_1p_passes\";\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "Reviewed Android552 source 9/3: compile out dedicated private-pass registry name"
  regex:
    re_pattern: "constexpr\\ char\\ kWalletPassesName\\[\\]\\ =\\ \"wallet_passes\";\\\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nconstexpr char kWalletPassesName[] = \"wallet_passes\";\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: "Reviewed Android552 source 9/4: remove Android private-pass OAuth registration while retaining persisted numeric ID and existing dedicated unavailable-route convention; no token/scopes fallback"
  regex:
    re_pattern: "\\ \\ \\ \\ case\\ OAuthConsumerId::kWalletPasses:\\ \\{\\\n\\ \\ \\ \\ \\ \\ CHECK\\(base::FeatureList::IsEnabled\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ wallet::features::kWalletApiPrivatePassesEnabled\\)\\);\\\n\\ \\ \\ \\ \\ \\ return\\ signin::OAuthConsumer\\(\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ /\\*name=\\*/kWalletPassesName,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ /\\*scopes=\\*/\\{kWalletPassesOAuth2Scope\\}\\);\\\n\\ \\ \\ \\ \\}"
    replace: "    case OAuthConsumerId::kWalletPasses: {\n#if BUILDFLAG(IS_ANDROID)\n      NOTREACHED();\n#else\n      CHECK(base::FeatureList::IsEnabled(\n          wallet::features::kWalletApiPrivatePassesEnabled));\n      return signin::OAuthConsumer(\n          /*name=*/kWalletPassesName,\n          /*scopes=*/{kWalletPassesOAuth2Scope});\n#endif\n    }"
  count: 1
