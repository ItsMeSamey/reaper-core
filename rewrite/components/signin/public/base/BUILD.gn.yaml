# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/signin/public/base/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ "//third_party/icu:icui18n",\

      \ \ \ \ "//third_party/re2",\

      \ \ \]\

      \ \ public_deps\ =\ \[\

      \ \ \ \ ":hybrid_encryption_key_proto",\

      \ \ \ \ ":signin_buildflags",\

      '
    replace: "    \"//third_party/icu:icui18n\",\n    \"//third_party/re2\",\n  ]\n  if (is_android) {\n    deps -= [ \"//components/contextual_tasks/public:feature_list\" ]\n  }\n  public_deps = [\n    \":hybrid_encryption_key_proto\",\n    \":signin_buildflags\",\n"
- description: "Reviewed Android552 source 8/1: subtract private-pass feature dependency from ordinary signin base on Android"
  regex:
    re_pattern: "\\ \\ if\\ \\(is_android\\)\\ \\{\\\n\\ \\ \\ \\ deps\\ \\-=\\ \\[\\ \"//components/contextual_tasks/public:feature_list\"\\ \\]\\\n\\ \\ \\}\\\n"
    replace: "  if (is_android) {\n    deps -= [\n      \"//components/contextual_tasks/public:feature_list\",\n      \"//components/wallet/core/common:features\",\n    ]\n  }\n"
  count: 1
- description: "Reviewed Android552 source 8/2: subtract unused Android test-support Wallet feature dependency without removing tests"
  regex:
    re_pattern: "\\ \\ \\ \\ \"//components/signin/public/identity_manager\",\\\n\\ \\ \\]\\\n\\\n\\ \\ public_deps\\ =\\ \\["
    replace: "    \"//components/signin/public/identity_manager\",\n  ]\n\n  if (is_android) {\n    deps -= [ \"//components/wallet/core/common:features\" ]\n  }\n\n  public_deps = ["
  count: 1
