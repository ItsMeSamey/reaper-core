substitutions:
- description: Exclude only the survey invitation on Android while preserving desktop resource content.
  regex:
    pattern: "  <message name=\"IDS_SAFE_BROWSING_HATS_CUSTOM_INVITATION\" desc=\"The custom invitation string shown in the\
      \ Happiness Tracking Survey (HaTS) prompt banner for Safe Browsing warnings (such as red warning interstitials or suspicious\
      \ site warnings) on Android\">\n    Chrome just flagged a website you were trying to visit. Help us improve these warnings\
      \ by taking a 1-minute survey.\n  </message>\n"
    replace: "  <if expr=\"not is_android\">\n    <message name=\"IDS_SAFE_BROWSING_HATS_CUSTOM_INVITATION\" desc=\"The custom\
      \ invitation string shown in the Happiness Tracking Survey (HaTS) prompt banner for Safe Browsing warnings (such as\
      \ red warning interstitials or suspicious site warnings) on Android\">\n      Chrome just flagged a website you were\
      \ trying to visit. Help us improve these warnings by taking a 1-minute survey.\n    </message>\n  </if>\n"
  count: 1
