# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/site_token_provider/BUILD.gn'
  regex:
    re_pattern: '\

      import\("//third_party/protobuf/proto_library\.gni"\)\

      \

      proto_library\("proto"\)\ \{\

      \ \ sources\ =\ \[\ "proto/site_token_data\.proto"\ \]\

      \}\

      \

      source_set\("site_token_provider"\)\ \{\

      \ \ sources\ =\ \[\

      \ \ \ \ "features\.cc",\

      \ \ \ \ "features\.h",\

      \ \ \ \ "site_token_constants\.h",\

      \ \ \ \ "site_token_provider\.cc",\

      \ \ \ \ "site_token_provider\.h",\

      \ \ \ \ "site_token_provider_service\.cc",\

      \ \ \ \ "site_token_provider_service\.h",\

      \ \ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":proto",\

      \ \ \ \ "//base",\

      \ \ \ \ "//components/endpoint_fetcher",\

      \ \ \ \ "//components/keyed_service/core",\

      \ \ \ \ "//components/signin/public/identity_manager",\

      \ \ \ \ "//mojo/public/cpp/bindings",\

      \ \ \ \ "//services/network/public/cpp",\

      \ \ \ \ "//services/network/public/mojom",\

      \ \ \ \ "//url",\

      \ \ \]\

      \}\

      \

      source_set\("unit_tests"\)\ \{\

      \ \ testonly\ =\ true\

      \ \ sources\ =\ \[\ "site_token_provider_unittest\.cc"\ \]\

      \ \ deps\ =\ \[\

      \ \ \ \ ":proto",\

      \ \ \ \ ":site_token_provider",\

      \ \ \ \ "//base",\

      \ \ \ \ "//base/test:test_support",\

      \ \ \ \ "//components/endpoint_fetcher",\

      \ \ \ \ "//components/signin/public/identity_manager:test_support",\

      \ \ \ \ "//services/network:test_support",\

      \ \ \ \ "//services/network/public/cpp",\

      \ \ \ \ "//testing/gmock",\

      \ \ \ \ "//testing/gtest",\

      \ \ \]\

      \}\

      '
    replace: "\nimport(\"//third_party/protobuf/proto_library.gni\")\n\nif (!is_android) {\n  proto_library(\"proto\") {\n    sources = [ \"proto/site_token_data.proto\" ]\n  }\n\n  source_set(\"site_token_provider\") {\n    sources = [\n      \"features.cc\",\n      \"features.h\",\n      \"site_token_constants.h\",\n      \"site_token_provider.cc\",\n      \"site_token_provider.h\",\n      \"site_token_provider_service.cc\",\n      \"site_token_provider_service.h\",\n    ]\n    deps = [\n      \":proto\",\n      \"//base\",\n      \"//components/endpoint_fetcher\",\n      \"//components/keyed_service/core\",\n      \"//components/signin/public/identity_manager\",\n      \"//mojo/public/cpp/bindings\",\n      \"//services/network/public/cpp\",\n      \"//services/network/public/mojom\",\n      \"//url\",\n    ]\n  }\n\n  source_set(\"unit_tests\") {\n    testonly = true\n    sources = [ \"site_token_provider_unittest.cc\" ]\n    deps = [\n      \":proto\",\n      \":site_token_provider\",\n      \"//base\",\n      \"//base/test:test_support\",\n      \"//components/endpoint_fetcher\",\n      \"//components/signin/public/identity_manager:test_support\",\n      \"//services/network:test_support\",\n      \"//services/network/public/cpp\",\n      \"//testing/gmock\",\n      \"//testing/gtest\",\n    ]\n  }\n}\n"
