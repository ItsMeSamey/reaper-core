substitutions:
- description: Let an external validated installation owner dismiss only its own consent UI on cancellation.
  regex:
    pattern: "    @Override\n    public void onDismiss(PropertyModel model, int dismissalCause) {"
    replace: "    void dismissForExternalCancellation() {\n        mModalDialogManager.dismissDialog(mDialogModel, DialogDismissalCause.UNKNOWN);\n    }\n\n    @Override\n    public void onDismiss(PropertyModel model, int dismissalCause) {"
