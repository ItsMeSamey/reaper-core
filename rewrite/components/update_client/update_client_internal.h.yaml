substitutions:
- description: No Android PingManager constructor argument
  regex:
    pattern: '                   scoped_refptr<PingManager> ping_manager,

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n                   scoped_refptr<PingManager> ping_manager,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android PingManager ownership
  regex:
    pattern: '  scoped_refptr<PingManager> ping_manager_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  scoped_refptr<PingManager> ping_manager_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android telemetry-task override
  regex:
    pattern: "  void SendPing(const CrxComponent& crx_component,\n                PingParams ping_params,\n              \
      \  Callback callback) override;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void SendPing(const CrxComponent& crx_component,\n                PingParams ping_params,\n\
      \                Callback callback) override;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Use Android compile-time guards explicitly
  regex:
    pattern: '#include "base/containers/circular_deque.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/containers/circular_deque.h"

      '
  count: 1
