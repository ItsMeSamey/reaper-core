substitutions:
- description: Prove real CUP rejection does not collect Android validation metrics
  regex:
    pattern: "  histogram_tester.ExpectUniqueSample(\"UpdateClient.CupValidationResult\", false,\n                       \
      \               1);\n  histogram_tester.ExpectTotalCount(\"UpdateClient.CupValidationTime\", 1);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  histogram_tester.ExpectTotalCount(\"UpdateClient.CupValidationResult\", 0);\n \
      \ histogram_tester.ExpectTotalCount(\"UpdateClient.CupValidationTime\", 0);\n#else\n  histogram_tester.ExpectUniqueSample(\"\
      UpdateClient.CupValidationResult\", false,\n                                      1);\n  histogram_tester.ExpectTotalCount(\"\
      UpdateClient.CupValidationTime\", 1);\n#endif\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/request_sender.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/update_client/request_sender.h"

      '
  count: 1
