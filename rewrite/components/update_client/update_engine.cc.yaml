substitutions:
- description: Exclude event upload payload construction
  regex:
    pattern: "base::DictValue MakeEvent(UpdateClient::PingParams ping_params,\n                          const base::Version&\
      \ previous_version) {\n  base::DictValue event;\n  event.Set(\"eventtype\", ping_params.event_type);\n  event.Set(\"\
      eventresult\", ping_params.result);\n  if (ping_params.error_code) {\n    event.Set(\"errorcode\", ping_params.error_code);\n\
      \  }\n  if (ping_params.extra_code1) {\n    event.Set(\"extracode1\", ping_params.extra_code1);\n  }\n  if (!ping_params.app_command_id.empty())\
      \ {\n    event.Set(\"appcommandid\", ping_params.app_command_id);\n  }\n  event.Set(\"previousversion\", previous_version.GetString());\n\
      \  return event;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nbase::DictValue MakeEvent(UpdateClient::PingParams ping_params,\n              \
      \            const base::Version& previous_version) {\n  base::DictValue event;\n  event.Set(\"eventtype\", ping_params.event_type);\n\
      \  event.Set(\"eventresult\", ping_params.result);\n  if (ping_params.error_code) {\n    event.Set(\"errorcode\", ping_params.error_code);\n\
      \  }\n  if (ping_params.extra_code1) {\n    event.Set(\"extracode1\", ping_params.extra_code1);\n  }\n  if (!ping_params.app_command_id.empty())\
      \ {\n    event.Set(\"appcommandid\", ping_params.app_command_id);\n  }\n  event.Set(\"previousversion\", previous_version.GetString());\n\
      \  return event;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android reporter constructor argument
  regex:
    pattern: '    scoped_refptr<PingManager> ping_manager,

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    scoped_refptr<PingManager> ping_manager,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android reporter initialization
  regex:
    pattern: '      ping_manager_(ping_manager),

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      ping_manager_(ping_manager),\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Take the existing posted local continuation without event upload
  regex:
    pattern: "    if (!component->events().empty()) {\n      CHECK(component->crx_component());\n      ping_manager_->SendPing(component->session_id(),\n\
      \                              *component->crx_component(),\n                              component->GetEvents(), std::move(callback));\n\
      \      return;\n    }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    if (!component->events().empty()) {\n      CHECK(component->crx_component());\n\
      \      ping_manager_->SendPing(component->session_id(),\n                              *component->crx_component(),\n\
      \                              component->GetEvents(), std::move(callback));\n      return;\n    }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android event upload transport entry
  regex:
    pattern: "void UpdateEngine::SendPing(const CrxComponent& crx_component,\n                            UpdateClient::PingParams\
      \ ping_params,\n                            Callback callback) {\n  DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);\n\
      \  std::vector<base::DictValue> events;\n  events.push_back(MakeEvent(ping_params, crx_component.version));\n  ping_manager_->SendPing(\n\
      \      base::StrCat(\n          {\"{\", base::Uuid::GenerateRandomV4().AsLowercaseString(), \"}\"}),\n      crx_component,\
      \ std::move(events),\n      base::BindOnce(std::move(callback), Error::NONE));\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid UpdateEngine::SendPing(const CrxComponent& crx_component,\n               \
      \             UpdateClient::PingParams ping_params,\n                            Callback callback) {\n  DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);\n\
      \  std::vector<base::DictValue> events;\n  events.push_back(MakeEvent(ping_params, crx_component.version));\n  ping_manager_->SendPing(\n\
      \      base::StrCat(\n          {\"{\", base::Uuid::GenerateRandomV4().AsLowercaseString(), \"}\"}),\n      crx_component,\
      \ std::move(events),\n      base::BindOnce(std::move(callback), Error::NONE));\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Use Android compile-time guards explicitly
  regex:
    pattern: '#include "components/update_client/update_engine.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/update_client/update_engine.h"

      '
  count: 1
- description: Do not collect a previous fingerprint solely for an excluded Android event
  regex:
    pattern: '      component->set_previous_fp(component->crx_component()->fingerprint);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      component->set_previous_fp(component->crx_component()->fingerprint);\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
