substitutions:
- description: Do not compile optional operation-event generation on Android
  regex:
    pattern: '  event_adder_.Run(MakeSimpleOperationEvent(result, event_type_));

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  event_adder_.Run(MakeSimpleOperationEvent(result, event_type_));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Do not retain an Android patch-operation reporter
  regex:
    pattern: '      event_adder_(event_adder),

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      event_adder_(event_adder),\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Do not retain an Android telemetry event discriminator
  regex:
    pattern: '      event_type_(event_type),

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      event_type_(event_type),\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/delta_patch_operation.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/update_client/delta_patch_operation.h"

      '
  count: 1
