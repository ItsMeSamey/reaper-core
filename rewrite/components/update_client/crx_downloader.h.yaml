substitutions:
- description: No Android download telemetry model
  regex:
    pattern: "  struct DownloadMetrics {\n    enum Downloader { kNone = 0, kUrlFetcher, kBits, kBackgroundMac };\n\n    GURL\
      \ url;\n\n    Downloader downloader = kNone;\n\n    int error = 0;\n    int extra_code1 = 0;\n\n    int64_t downloaded_bytes\
      \ = -1;  // -1 means that the byte count is unknown.\n    int64_t total_bytes = -1;\n\n    uint64_t download_time_ms\
      \ = 0;\n  };\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  struct DownloadMetrics {\n    enum Downloader { kNone = 0, kUrlFetcher, kBits,\
      \ kBackgroundMac };\n\n    GURL url;\n\n    Downloader downloader = kNone;\n\n    int error = 0;\n    int extra_code1\
      \ = 0;\n\n    int64_t downloaded_bytes = -1;  // -1 means that the byte count is unknown.\n    int64_t total_bytes =\
      \ -1;\n\n    uint64_t download_time_ms = 0;\n  };\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android report collector API
  regex:
    pattern: '  const std::vector<DownloadMetrics> download_metrics() const;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const std::vector<DownloadMetrics> download_metrics() const;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android report collection storage
  regex:
    pattern: '  std::vector<DownloadMetrics> download_metrics_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::vector<DownloadMetrics> download_metrics_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Android completion/error routing carries only required local result data
  regex:
    pattern: "  void OnDownloadComplete(bool is_handled,\n                          const Result& result,\n              \
      \            const DownloadMetrics& download_metrics);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  void OnDownloadComplete(bool is_handled, const Result& result);\n#else\n  void\
      \ OnDownloadComplete(bool is_handled,\n                          const Result& result,\n                          const\
      \ DownloadMetrics& download_metrics);\n#endif\n"
  count: 1
- description: Android completion/error routing carries only required local result data
  regex:
    pattern: "  void HandleDownloadError(bool is_handled,\n                           const Result& result,\n            \
      \               const DownloadMetrics& download_metrics);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  void HandleDownloadError(bool is_handled, const Result& result);\n#else\n  void\
      \ HandleDownloadError(bool is_handled,\n                           const Result& result,\n                         \
      \  const DownloadMetrics& download_metrics);\n#endif\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/files/file_path.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/files/file_path.h"

      '
  count: 1
