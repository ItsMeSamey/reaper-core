substitutions:
- description: Adapt Android report-only fixture references while retaining ordinary update/download assertions and callbacks.
  regex:
    pattern: "  // Expect at least some progress reported by the loader.\n  EXPECT_LE(1, num_progress_calls_);\n\n  const\
      \ auto download_metrics = crx_downloader_->download_metrics();\n  ASSERT_EQ(2u, download_metrics.size());\n  EXPECT_EQ(no_file_url,\
      \ download_metrics[0].url);\n"
    replace: "  // Expect at least some progress reported by the loader.\n  EXPECT_LE(1, num_progress_calls_);\n\n#if !BUILDFLAG(IS_ANDROID)\n\
      \  const auto download_metrics = crx_downloader_->download_metrics();\n  ASSERT_EQ(2u, download_metrics.size());\n \
      \ EXPECT_EQ(no_file_url, download_metrics[0].url);\n"
  count: 1
- description: Adapt Android report-only fixture references while retaining ordinary update/download assertions and callbacks.
  regex:
    pattern: "  EXPECT_EQ(0, download_metrics[1].error);\n  EXPECT_EQ(1015, download_metrics[1].downloaded_bytes);\n  EXPECT_EQ(1015,\
      \ download_metrics[1].total_bytes);\n}\n\n// Tests that the download succeeds if the first url is correct and the\n"
    replace: "  EXPECT_EQ(0, download_metrics[1].error);\n  EXPECT_EQ(1015, download_metrics[1].downloaded_bytes);\n  EXPECT_EQ(1015,\
      \ download_metrics[1].total_bytes);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n}\n\n// Tests that the download succeeds if\
      \ the first url is correct and the\n"
  count: 1
- description: Adapt Android report-only fixture references while retaining ordinary update/download assertions and callbacks.
  regex:
    pattern: "\n  EXPECT_LE(1, num_progress_calls_);\n\n  EXPECT_EQ(1u, crx_downloader_->download_metrics().size());\n}\n\n\
      // Tests that the download fails if both urls don't serve content.\n"
    replace: "\n  EXPECT_LE(1, num_progress_calls_);\n\n#if !BUILDFLAG(IS_ANDROID)\n  EXPECT_EQ(1u, crx_downloader_->download_metrics().size());\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n}\n\n// Tests that the download fails if both urls don't serve content.\n"
  count: 1
- description: Adapt Android report-only fixture references while retaining ordinary update/download assertions and callbacks.
  regex:
    pattern: "  EXPECT_EQ(0, download_complete_result_.extra_code1);\n  EXPECT_TRUE(download_complete_result_.response.empty());\n\
      \n  const auto download_metrics = crx_downloader_->download_metrics();\n  ASSERT_EQ(2u, download_metrics.size());\n\
      \  EXPECT_EQ(expected_crx_url, download_metrics[0].url);\n"
    replace: "  EXPECT_EQ(0, download_complete_result_.extra_code1);\n  EXPECT_TRUE(download_complete_result_.response.empty());\n\
      \n#if !BUILDFLAG(IS_ANDROID)\n  const auto download_metrics = crx_downloader_->download_metrics();\n  ASSERT_EQ(2u,\
      \ download_metrics.size());\n  EXPECT_EQ(expected_crx_url, download_metrics[0].url);\n"
  count: 1
- description: Adapt Android report-only fixture references while retaining ordinary update/download assertions and callbacks.
  regex:
    pattern: "  EXPECT_EQ(net::ERR_FILE_NOT_FOUND, download_metrics[1].error);\n  EXPECT_EQ(-1, download_metrics[1].downloaded_bytes);\n\
      \  EXPECT_EQ(-1, download_metrics[1].total_bytes);\n}\n\n// A download cancelled while its fetch is in flight reports\
      \ CANCELLED once\n"
    replace: "  EXPECT_EQ(net::ERR_FILE_NOT_FOUND, download_metrics[1].error);\n  EXPECT_EQ(-1, download_metrics[1].downloaded_bytes);\n\
      \  EXPECT_EQ(-1, download_metrics[1].total_bytes);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n}\n\n// A download cancelled\
      \ while its fetch is in flight reports CANCELLED once\n"
  count: 1
