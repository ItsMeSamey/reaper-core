      eventresult\"), 0);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(pings_.empty());\n#else\n  ASSERT_EQ(pings_.size(), 1u);\n  EXPECT_EQ(pings_[0].FindInt(\"\
      eventtype\"), 60);\n  EXPECT_EQ(pings_[0].FindInt(\"eventresult\"), 0);\n#endif\n"
