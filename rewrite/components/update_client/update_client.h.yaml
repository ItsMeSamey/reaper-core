substitutions:
- description: Exclude optional event-upload API on Android
  regex:
    pattern: "  virtual void SendPing(const CrxComponent& crx_component,\n                        PingParams ping_params,\n\
      \                        Callback callback) = 0;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  virtual void SendPing(const CrxComponent& crx_component,\n                   \
      \     PingParams ping_params,\n                        Callback callback) = 0;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Use Android compile-time guards explicitly
  regex:
    pattern: '#include "base/functional/callback_forward.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/functional/callback_forward.h"

      '
  count: 1
