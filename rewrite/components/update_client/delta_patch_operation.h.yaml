substitutions:
- description: Exclude the Android patch-operation reporter member
  regex:
    pattern: '  base::RepeatingCallback<void(base::DictValue)> event_adder_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::RepeatingCallback<void(base::DictValue)> event_adder_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude the Android telemetry event discriminator
  regex:
    pattern: '  const int event_type_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const int event_type_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/files/file.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/files/file.h"

      '
  count: 1
