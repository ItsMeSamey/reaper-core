substitutions:
  - description: |
      Sign update_client requests with Brave's CUP key.

      Upstream's BuildSigner() selects between Google's ECDSA and ML-DSA-44 keys
      based on a feature flag. Brave has its own CUP key, so early-return the
      signer built from `kBraveKeyVersion` / `kBravePublicKey`.
    preempt_function_impl:
      function_name: BuildSigner
      code: |-
        if ((true)) return client_update_protocol::Cup(kBraveKeyVersion,
                                           base::as_byte_span(kBravePublicKey));
  - description: No Android report-only signature-validation timer
    regex:
      pattern: '    const base::TimeTicks start_time = base::TimeTicks::Now();

        '
      replace: "#if !BUILDFLAG(IS_ANDROID)\n    const base::TimeTicks start_time = base::TimeTicks::Now();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Signature verification and its real result remain; Android reporting is excluded
    regex:
      pattern: "    metrics::RecordCupValidationResult(valid);\n    metrics::RecordCupValidationTime(base::TimeTicks::Now()\
        \ - start_time);\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n    metrics::RecordCupValidationResult(valid);\n    metrics::RecordCupValidationTime(base::TimeTicks::Now()\
        \ - start_time);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: Include the explicit Android/callback contract
    regex:
      pattern: '#include "components/update_client/request_sender.h"

        '
      replace: '#include "build/build_config.h"

        #include "components/update_client/request_sender.h"

        '
    count: 1
