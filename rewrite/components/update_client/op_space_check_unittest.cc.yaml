substitutions:
- description: Keep real patch/disk/decompression checks and reject optional Android events
  regex:
    pattern: "  ASSERT_EQ(pings_.size(), 1u);\n  EXPECT_EQ(pings_[0].FindInt(\"eventtype\"), protocol_request::kEventDownload);\n\
      \  EXPECT_EQ(pings_[0].FindInt(\"eventresult\"), 0);\n  EXPECT_EQ(pings_[0].FindInt(\"errorcode\"),\n            static_cast<int>(CrxDownloaderError::DISK_FULL));\n\
      \  EXPECT_EQ(pings_[0].Find(\"extracode1\"), nullptr);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(pings_.empty());\n#else\n  ASSERT_EQ(pings_.size(), 1u);\n  EXPECT_EQ(pings_[0].FindInt(\"\
      eventtype\"), protocol_request::kEventDownload);\n  EXPECT_EQ(pings_[0].FindInt(\"eventresult\"), 0);\n  EXPECT_EQ(pings_[0].FindInt(\"\
      errorcode\"),\n            static_cast<int>(CrxDownloaderError::DISK_FULL));\n  EXPECT_EQ(pings_[0].Find(\"extracode1\"\
      ), nullptr);\n#endif\n"
  count: 2
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/op_space_check.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/update_client/op_space_check.h"

      '
  count: 1
