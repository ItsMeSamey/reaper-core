substitutions:
- description: No Android report-only unzip timing
  regex:
    pattern: '  unzip_begin_time_ = base::TimeTicks::Now();

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  unzip_begin_time_ = base::TimeTicks::Now();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Real unzip success/error handling remains without Android telemetry
  regex:
    pattern: "  if (result) {\n    metrics::RecordCRXUnzipTime(base::TimeTicks::Now() - unzip_begin_time_,\n             \
      \                   app_id_);\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (result) {\n    metrics::RecordCRXUnzipTime(base::TimeTicks::Now() - unzip_begin_time_,\n\
      \                                app_id_);\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android report-only unpacker identity initialization
  regex:
    pattern: "    : app_id_(app_id),\n      prod_id_(update_client::UTF8ToStringType(prod_id)),\n"
    replace: "    :\n#if !BUILDFLAG(IS_ANDROID)\n      app_id_(app_id),\n#endif\n      prod_id_(update_client::UTF8ToStringType(prod_id)),\n"
  count: 1
