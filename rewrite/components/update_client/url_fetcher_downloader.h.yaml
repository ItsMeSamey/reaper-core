substitutions:
- description: No Android report-only download timer
  regex:
    pattern: '  base::TimeTicks download_start_time_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::TimeTicks download_start_time_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android report-only partial-byte snapshot
  regex:
    pattern: '  int64_t downloaded_bytes_ = -1;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  int64_t downloaded_bytes_ = -1;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/files/file_path.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/files/file_path.h"

      '
  count: 1
