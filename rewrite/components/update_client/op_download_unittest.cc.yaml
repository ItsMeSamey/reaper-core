substitutions:
- description: Android fake downloader/factory/configurator needs only required local result
  regex:
    pattern: "                 base::expected<std::string, int> result,\n                 const CrxDownloader::DownloadMetrics&\
      \ metrics)"
    replace: "                 base::expected<std::string, int> result\n#if !BUILDFLAG(IS_ANDROID)\n                 , const\
      \ CrxDownloader::DownloadMetrics& metrics\n#endif\n      )"
  count: 1
- description: Android fake downloader/factory/configurator needs only required local result
  regex:
    pattern: "              base::expected<std::string, int> result,\n              const CrxDownloader::DownloadMetrics&\
      \ metrics)"
    replace: "              base::expected<std::string, int> result\n#if !BUILDFLAG(IS_ANDROID)\n              , const CrxDownloader::DownloadMetrics&\
      \ metrics\n#endif\n      )"
  count: 1
- description: Android fake downloader/factory/configurator needs only required local result
  regex:
    pattern: "      base::expected<std::string, int> result,\n      const CrxDownloader::DownloadMetrics& metrics)"
    replace: "      base::expected<std::string, int> result\n#if !BUILDFLAG(IS_ANDROID)\n      , const CrxDownloader::DownloadMetrics&\
      \ metrics\n#endif\n      )"
  count: 1
- description: Keep real result storage without an Android report
  regex:
    pattern: "        result_(result),\n        metrics_(metrics) {}"
    replace: "        result_(result)\n#if !BUILDFLAG(IS_ANDROID)\n        , metrics_(metrics)\n#endif\n        {}"
  count: 1
- description: Keep factory real result storage without an Android report
  regex:
    pattern: '      : dest_(dest), result_(result), metrics_(metrics) {}'
    replace: "      : dest_(dest), result_(result)\n#if !BUILDFLAG(IS_ANDROID)\n        , metrics_(metrics)\n#endif\n    \
      \    {}"
  count: 1
- description: No Android fake report model storage
  regex:
    pattern: '  const CrxDownloader::DownloadMetrics metrics_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const CrxDownloader::DownloadMetrics metrics_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 2
- description: Forward the same real fake-network result without a report
  regex:
    pattern: '      OnDownloadComplete(true, {.response = dest_}, metrics_);

      '
    replace: "      OnDownloadComplete(true, {.response = dest_}\n#if !BUILDFLAG(IS_ANDROID)\n                         , metrics_\n\
      #endif\n                         );\n"
  count: 1
- description: Forward the same real fake-network result without a report
  regex:
    pattern: '      OnDownloadComplete(true, {.error = result_.error()}, metrics_);

      '
    replace: "      OnDownloadComplete(true, {.error = result_.error()}\n#if !BUILDFLAG(IS_ANDROID)\n                    \
      \     , metrics_\n#endif\n                         );\n"
  count: 1
- description: Keep real fake-downloader construction without an Android report argument
  regex:
    pattern: '    return base::MakeRefCounted<FakeDownloader>(dest_, result_, metrics_);

      '
    replace: "    return base::MakeRefCounted<FakeDownloader>(dest_, result_\n#if !BUILDFLAG(IS_ANDROID)\n               \
      \                                , metrics_\n#endif\n                                               );\n"
  count: 1
- description: Construct the same fake download transport without an Android report argument
  regex:
    pattern: '        result, metrics));

      '
    replace: "        result\n#if !BUILDFLAG(IS_ANDROID)\n        , metrics\n#endif\n        ));\n"
  count: 1
- description: Keep real download success/error inputs without Android metric construction
  regex:
    pattern: "          data, {.url = GURL(\"http://test\"),\n                 .downloader =\n                     CrxDownloader::DownloadMetrics::Downloader::kUrlFetcher,\n\
      \                 .error = 0,\n                 .extra_code1 = 34,\n                 .downloaded_bytes = 56,\n     \
      \            .total_bytes = 78,\n                 .download_time_ms = 90}"
    replace: "          data\n#if !BUILDFLAG(IS_ANDROID)\n, {.url = GURL(\"http://test\"),\n                 .downloader =\n\
      \                     CrxDownloader::DownloadMetrics::Downloader::kUrlFetcher,\n                 .error = 0,\n     \
      \            .extra_code1 = 34,\n                 .downloaded_bytes = 56,\n                 .total_bytes = 78,\n   \
      \              .download_time_ms = 90}\n#endif\n"
  count: 1
- description: Keep real download success/error inputs without Android metric construction
  regex:
    pattern: "               base::unexpected(404),\n               {.url = GURL(\"http://test\"),\n                .downloader\
      \ =\n                    CrxDownloader::DownloadMetrics::Downloader::kUrlFetcher,\n                .error = 404,\n \
      \               .extra_code1 = 34,\n                .downloaded_bytes = 56,\n                .total_bytes = 78,\n  \
      \              .download_time_ms = 90}"
    replace: "               base::unexpected(404)\n#if !BUILDFLAG(IS_ANDROID)\n,\n               {.url = GURL(\"http://test\"\
      ),\n                .downloader =\n                    CrxDownloader::DownloadMetrics::Downloader::kUrlFetcher,\n  \
      \              .error = 404,\n                .extra_code1 = 34,\n                .downloaded_bytes = 56,\n        \
      \        .total_bytes = 78,\n                .download_time_ms = 90}\n#endif\n"
  count: 1
- description: Successful and failed real downloads do not emit Android events
  regex:
    pattern: "  ASSERT_EQ(pings_.size(), 1u);\n  EXPECT_EQ(pings_[0].FindInt(\"eventtype\"), 14);\n  EXPECT_EQ(pings_[0].FindInt(\"\
      eventresult\"), 0);\n  EXPECT_EQ(pings_[0].FindInt(\"errorcode\"), 404);\n  EXPECT_EQ(pings_[0].FindInt(\"extracode1\"\
      ), 34);\n  EXPECT_EQ(pings_[0].FindDouble(\"downloaded\"), 56);\n  EXPECT_EQ(pings_[0].FindDouble(\"total\"), 78);\n\
      \  EXPECT_EQ(pings_[0].FindDouble(\"download_time_ms\"), 90);\n  EXPECT_EQ(CHECK_DEREF(pings_[0].FindString(\"downloader\"\
      )), \"direct\");\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(pings_.empty());\n#else\n  ASSERT_EQ(pings_.size(), 1u);\n  EXPECT_EQ(pings_[0].FindInt(\"\
      eventtype\"), 14);\n  EXPECT_EQ(pings_[0].FindInt(\"eventresult\"), 0);\n  EXPECT_EQ(pings_[0].FindInt(\"errorcode\"\
      ), 404);\n  EXPECT_EQ(pings_[0].FindInt(\"extracode1\"), 34);\n  EXPECT_EQ(pings_[0].FindDouble(\"downloaded\"), 56);\n\
      \  EXPECT_EQ(pings_[0].FindDouble(\"total\"), 78);\n  EXPECT_EQ(pings_[0].FindDouble(\"download_time_ms\"), 90);\n \
      \ EXPECT_EQ(CHECK_DEREF(pings_[0].FindString(\"downloader\")), \"direct\");\n#endif\n"
  count: 1
- description: Successful and failed real downloads do not emit Android events
  regex:
    pattern: "  ASSERT_EQ(pings_.size(), 1u);\n  EXPECT_EQ(pings_[0].FindInt(\"eventtype\"), 14);\n  EXPECT_EQ(pings_[0].FindInt(\"\
      eventresult\"), 1);\n  EXPECT_EQ(pings_[0].Find(\"errorcode\"), nullptr);\n  EXPECT_EQ(pings_[0].FindInt(\"extracode1\"\
      ), 34);\n  EXPECT_EQ(pings_[0].FindDouble(\"downloaded\"), 56);\n  EXPECT_EQ(pings_[0].FindDouble(\"total\"), 78);\n\
      \  EXPECT_EQ(pings_[0].FindDouble(\"download_time_ms\"), 90);\n  EXPECT_EQ(CHECK_DEREF(pings_[0].FindString(\"downloader\"\
      )), \"direct\");\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(pings_.empty());\n#else\n  ASSERT_EQ(pings_.size(), 1u);\n  EXPECT_EQ(pings_[0].FindInt(\"\
      eventtype\"), 14);\n  EXPECT_EQ(pings_[0].FindInt(\"eventresult\"), 1);\n  EXPECT_EQ(pings_[0].Find(\"errorcode\"),\
      \ nullptr);\n  EXPECT_EQ(pings_[0].FindInt(\"extracode1\"), 34);\n  EXPECT_EQ(pings_[0].FindDouble(\"downloaded\"),\
      \ 56);\n  EXPECT_EQ(pings_[0].FindDouble(\"total\"), 78);\n  EXPECT_EQ(pings_[0].FindDouble(\"download_time_ms\"), 90);\n\
      \  EXPECT_EQ(CHECK_DEREF(pings_[0].FindString(\"downloader\")), \"direct\");\n#endif\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/op_download.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/update_client/op_download.h"

      '
  count: 1
- description: Strengthen successful Android output ownership/content positive control
  regex:
    pattern: '  EXPECT_TRUE(outcome_.has_value());

      #if BUILDFLAG(IS_ANDROID)

      '
    replace: "  EXPECT_TRUE(outcome_.has_value());\n#if BUILDFLAG(IS_ANDROID)\n  ASSERT_TRUE(outcome_.has_value());\n  EXPECT_EQ(outcome_.value(),\n\
      \            temp_dir_.GetPath().Append(FILE_PATH_LITERAL(\"OpDownloadTest_File\")));\n  std::string downloaded_data;\n\
      \  ASSERT_TRUE(base::ReadFileToString(outcome_.value(), &downloaded_data));\n  EXPECT_EQ(downloaded_data, data);\n"
  count: 1
- description: Regress benign cancellation during hash reply with empty-directory and unrelated-sibling controls
  regex:
    pattern: '}  // namespace update_client

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\nTEST_F(OpDownloadTest, AndroidCancelledVerifiedDownloadCleansOwnedPath) {\n  for\
      \ (bool keep_sibling : {false, true}) {\n    SCOPED_TRACE(keep_sibling);\n    base::ScopedTempDir download_dir;\n  \
      \  ASSERT_TRUE(download_dir.CreateUniqueTempDir());\n    const base::FilePath directory = download_dir.GetPath();\n\
      \    const base::FilePath file = directory.Append(FILE_PATH_LITERAL(\"update.crx\"));\n    const base::FilePath sibling\
      \ = directory.Append(FILE_PATH_LITERAL(\"keep.txt\"));\n    if (keep_sibling) {\n      ASSERT_TRUE(base::WriteFile(sibling,\
      \ \"keep\"));\n    }\n    const std::string data = \"ordinary update data\";\n    auto config = base::MakeRefCounted<TestConfigurator>(pref_.get());\n\
      \    config->SetCrxDownloaderFactory(\n        base::MakeRefCounted<FakeFactory>(file, data));\n    int completion_count\
      \ = 0;\n    base::expected<base::FilePath, CategorizedError> outcome;\n    auto cancel = DownloadOperation(\n      \
      \  config, \"appid\", /*is_foreground=*/false,\n        {GURL(\"http://localhost:111\")}, data.size(),\n        base::HexEncode(crypto::SHA256HashString(data)),\
      \ MakePingCallback(),\n        base::DoNothing(), MakeProgressCallback(), {},\n        base::BindLambdaForTesting(\n\
      \            [&](base::expected<base::FilePath, CategorizedError> result) {\n              ++completion_count;\n   \
      \           outcome = std::move(result);\n            }));\n\n    // The fake transport has written its successful result;\
      \ the real hash\n    // verification reply cannot run on this sequence until tasks are pumped.\n    ASSERT_TRUE(base::PathExists(file));\n\
      \    EXPECT_EQ(completion_count, 0);\n    std::move(cancel).Run();\n    task_environment_.RunUntilIdle();\n\n    EXPECT_EQ(completion_count,\
      \ 1);\n    ASSERT_FALSE(outcome.has_value());\n    EXPECT_EQ(outcome.error().category, ErrorCategory::kService);\n \
      \   EXPECT_EQ(outcome.error().code,\n              std::to_underlying(ServiceError::CANCELLED));\n    EXPECT_FALSE(base::PathExists(file));\n\
      \    EXPECT_EQ(base::DirectoryExists(directory), keep_sibling);\n    if (keep_sibling) {\n      std::string sibling_data;\n\
      \      ASSERT_TRUE(base::ReadFileToString(sibling, &sibling_data));\n      EXPECT_EQ(sibling_data, \"keep\");\n    }\n\
      \    EXPECT_TRUE(pings_.empty());\n  }\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n}  // namespace update_client\n"
  count: 1
- description: Explicitly include the owning ServiceError declaration in the Android cancellation regression fixture
  regex:
    pattern: '#include "components/update_client/test_configurator.h"

      '
    replace: '#include "components/update_client/test_configurator.h"

      #include "components/update_client/update_client_errors.h"

      '
  count: 1
