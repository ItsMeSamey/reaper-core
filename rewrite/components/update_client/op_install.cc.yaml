substitutions:
- description: Do not compile optional operation-event generation on Android
  regex:
    pattern: "  event_adder.Run(\n      MakeSimpleOperationEvent(result.result, protocol_request::kEventCrx3));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  event_adder.Run(\n      MakeSimpleOperationEvent(result.result, protocol_request::kEventCrx3));\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/op_install.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/update_client/op_install.h"

      '
  count: 1
