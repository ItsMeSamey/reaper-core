substitutions:
- description: Mechanically reproduce the reviewed source body using unique context, chunk 1
  regex:
    pattern: "  for (const ProtocolParser::Operation& operation : pipeline.operations) {\n    if (operation.type == \"download\"\
      ) {\n      // expects: `urls` (list of url objects), `size`, and `out` (hash object)\n      if (operation.urls.empty()\
      \ || operation.size <= 0 ||\n          operation.sha256_out.empty()) {\n        return MakeErrorOperations(event_adder,\n"
    replace: "  for (const ProtocolParser::Operation& operation : pipeline.operations) {\n    if (operation.type == \"download\"\
      ) {\n      // expects: `urls` (list of url objects), `size`, and `out` (hash object)\n      BRAVE_MAKE_OPERATIONS\n\
      \      if (operation.urls.empty() || operation.size <= 0 ||\n          operation.sha256_out.empty()) {\n        return\
      \ MakeErrorOperations(event_adder,\n"
  count: 1
- description: Do not wrap or retain an Android pipeline event reporter
  regex:
    pattern: "            base::BindRepeating(\n                [](base::RepeatingCallback<void(base::DictValue)> event_adder,\n\
      \                   const std::string& pipeline_id, base::DictValue event) {\n                  event.Set(\"pipeline_id\"\
      , pipeline_id);\n                  event_adder.Run(std::move(event));\n                },\n                event_adder,\
      \ pipeline.pipeline_id),\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n            base::NullCallback(),\n#else\n            base::BindRepeating(\n    \
      \            [](base::RepeatingCallback<void(base::DictValue)> event_adder,\n                   const std::string& pipeline_id,\
      \ base::DictValue event) {\n                  event.Set(\"pipeline_id\", pipeline_id);\n                  event_adder.Run(std::move(event));\n\
      \                },\n                event_adder, pipeline.pipeline_id),\n#endif\n"
  count: 1
- description: Exclude Android invalid-operation telemetry while preserving its error callback
  regex:
    pattern: "        event_adder.Run(MakeSimpleOperationEvent(\n            kInvalidOperationAttributesError, event_type));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n        event_adder.Run(MakeSimpleOperationEvent(\n            kInvalidOperationAttributesError,\
      \ event_type));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/pipeline.h"

      '
    replace: '#include "base/functional/callback_helpers.h"

      #include "components/update_client/pipeline.h"

      '
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/functional/callback_helpers.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/functional/callback_helpers.h"

      '
  count: 1
