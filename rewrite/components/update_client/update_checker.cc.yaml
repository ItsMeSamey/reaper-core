substitutions:
- description: Do not generate optional Android activity/rollcall pings
  regex:
    pattern: "        MakeProtocolPing(app_id, config_->GetPersistedData(),\n                         active_ids.contains(app_id)),\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n        std::nullopt,\n#else\n        MakeProtocolPing(app_id, config_->GetPersistedData(),\n\
      \                         active_ids.contains(app_id)),\n#endif\n"
  count: 1
- description: Keep the real update continuation without collecting Android activity bits
  regex:
    pattern: "                  config->GetPersistedData()->GetActiveBits(\n                      ids, base::BindOnce(std::move(check_for_updates_invoker),\n\
      \                                          updater_state_attributes));\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n                  std::move(check_for_updates_invoker)\n                      .Run(updater_state_attributes,\
      \ std::set<std::string>{});\n#else\n                  config->GetPersistedData()->GetActiveBits(\n                 \
      \     ids, base::BindOnce(std::move(check_for_updates_invoker),\n                                          updater_state_attributes));\n\
      #endif\n"
  count: 1
- description: No Android activity date collection
  regex:
    pattern: '  const int daynum = results.daystart_elapsed_days;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const int daynum = results.daystart_elapsed_days;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Do not update Android telemetry activity/rollcall dates
  regex:
    pattern: "  if (daynum != ProtocolParser::kNoDaystart) {\n    metadata->SetDateLastData(context->components_to_check_for_updates,\
      \ daynum,\n                              std::move(reply));\n    return;\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  if (daynum != ProtocolParser::kNoDaystart) {\n    metadata->SetDateLastData(context->components_to_check_for_updates,\
      \ daynum,\n                              std::move(reply));\n    return;\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Android does not read optional install identity/date or locale for wire construction
  regex:
    pattern: "        active_ids.contains(app_id) ? metadata->GetInstallId(app_id) : \"\",\n        crx_component->lang.empty()\
      \ ? config_->GetLang() : crx_component->lang,\n        metadata->GetInstallDate(app_id), install_source,\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n        \"\", \"\", kDateUnknown,\n#else\n        active_ids.contains(app_id) ? metadata->GetInstallId(app_id)\
      \ : \"\",\n        crx_component->lang.empty() ? config_->GetLang() : crx_component->lang,\n        metadata->GetInstallDate(app_id),\n\
      #endif\n        install_source,\n"
  count: 1
