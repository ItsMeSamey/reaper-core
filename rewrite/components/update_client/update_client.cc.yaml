substitutions:
- description: Reporter implementation is not admitted on Android
  regex:
    pattern: '#include "components/update_client/ping_manager.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/update_client/ping_manager.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Reporter implementation is not admitted on Android
  regex:
    pattern: '#include "components/update_client/task_send_ping.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/update_client/task_send_ping.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: No Android reporter constructor argument
  regex:
    pattern: '    scoped_refptr<PingManager> ping_manager,

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    scoped_refptr<PingManager> ping_manager,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Do not initialize reporter ownership on Android
  regex:
    pattern: '    : config_(config), ping_manager_(ping_manager) {

      '
    replace: "    : config_(config)\n#if !BUILDFLAG(IS_ANDROID)\n      , ping_manager_(ping_manager)\n#endif\n{\n"
  count: 1
- description: Build the Android engine without a reporter
  regex:
    pattern: '      config, update_checker_factory, ping_manager_.get(),

      '
    replace: "      config, update_checker_factory,\n#if !BUILDFLAG(IS_ANDROID)\n      ping_manager_.get(),\n#endif\n"
  count: 1
- description: Exclude the optional telemetry task entry on Android
  regex:
    pattern: "void UpdateClientImpl::SendPing(const CrxComponent& crx_component,\n                                PingParams\
      \ ping_params,\n                                Callback callback) {\n  DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);\n\
      \  VLOG(2) << __func__;\n\n  RunTask(base::MakeRefCounted<TaskSendPing>(\n      update_engine_.get(), crx_component,\
      \ ping_params,\n      base::BindOnce(&UpdateClientImpl::OnTaskComplete, this,\n                     std::move(callback))));\n\
      }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid UpdateClientImpl::SendPing(const CrxComponent& crx_component,\n           \
      \                     PingParams ping_params,\n                                Callback callback) {\n  DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);\n\
      \  VLOG(2) << __func__;\n\n  RunTask(base::MakeRefCounted<TaskSendPing>(\n      update_engine_.get(), crx_component,\
      \ ping_params,\n      base::BindOnce(&UpdateClientImpl::OnTaskComplete, this,\n                     std::move(callback))));\n\
      }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Do not construct PingManager on Android
  regex:
    pattern: '      config, base::MakeRefCounted<PingManager>(config),

      '
    replace: "      config,\n#if !BUILDFLAG(IS_ANDROID)\n      base::MakeRefCounted<PingManager>(config),\n#endif\n"
  count: 1
