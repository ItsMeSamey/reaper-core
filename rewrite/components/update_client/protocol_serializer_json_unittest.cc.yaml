substitutions:
- description: Do not call an absent Android usage-ping factory
  regex:
    pattern: '        MakeProtocolPing("id1", metadata.get(), {}), std::move(events)));

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n        std::nullopt,\n#else\n        MakeProtocolPing(\"id1\", metadata.get(), {}),\n\
      #endif\n        std::move(events)));\n"
  count: 1
- description: Desktop optional reporting expectations remain; Android omits these fields
  regex:
    pattern: "        R\"(\"events\":\\[{\"a\":1,\"b\":\"2\"},{\"error\":0}],)\"\n        R\"(\"iid\":\"ins_id\",)\"\n   \
      \     R\"(\"installdate\":-1,)\"\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n        R\"(\"events\":\\\\[{\"a\":1,\"b\":\"2\"},{\"error\":0}],)\"\n        R\"\
      (\"iid\":\"ins_id\",)\"\n        R\"(\"installdate\":-1,)\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android locale or activity/rollcall field expectations
  regex:
    pattern: "        R\"(\"lang\":\"lang\",)\"\n        R\"(\"ping\":{\"ping_freshness\":\"{[-\\w]{36}}\",\"rd\":1234},)\"\
      \n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n        R\"(\"lang\":\"lang\",)\"\n        R\"(\"ping\":{\"ping_freshness\":\"{[-\\\
      \\w]{36}}\",\"rd\":1234},)\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Require the protocol hardware object but no optional Android capability fields
  regex:
    pattern: "        R\"(\"dlpref\":\"cacheable\",\"extra\":\"params\",\"hw\":{\"avx\":(true|false),)\"\n        R\"(\"physmemory\"\
      :\\d+,\"sse\":(true|false),\"sse2\":(true|false),)\"\n        R\"(\"sse3\":(true|false),\"sse41\":(true|false),\"sse42\"\
      :(true|false),)\"\n        R\"(\"ssse3\":(true|false)},)\"\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n        R\"(\"dlpref\":\"cacheable\",\"extra\":\"params\",\"hw\":{},)\"\n#else\n\
      \        R\"(\"dlpref\":\"cacheable\",\"extra\":\"params\",\"hw\":{\"avx\":(true|false),)\"\n        R\"(\"physmemory\"\
      :\\\\d+,\"sse\":(true|false),\"sse2\":(true|false),)\"\n        R\"(\"sse3\":(true|false),\"sse41\":(true|false),\"\
      sse42\":(true|false),)\"\n        R\"(\"ssse3\":(true|false)},)\"\n#endif\n"
  count: 1
- description: Keep updater-state coverage with the Android empty hardware object
  regex:
    pattern: "      R\"(\"hw\":{\"avx\":(true|false),)\"\n      R\"(\"physmemory\":\\d+,\"sse\":(true|false),\"sse2\":(true|false),)\"\
      \n      R\"(\"sse3\":(true|false),\"sse41\":(true|false),\"sse42\":(true|false),)\"\n      R\"(\"ssse3\":(true|false)},)\"\
      \n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n      R\"(\"hw\":{},)\"\n#else\n      R\"(\"hw\":{\"avx\":(true|false),)\"\n    \
      \  R\"(\"physmemory\":\\\\d+,\"sse\":(true|false),\"sse2\":(true|false),)\"\n      R\"(\"sse3\":(true|false),\"sse41\"\
      :(true|false),\"sse42\":(true|false),)\"\n      R\"(\"ssse3\":(true|false)},)\"\n#endif\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/protocol_serializer_json.h"

      '
    replace: '#include "base/json/json_reader.h"

      #include "components/update_client/protocol_serializer_json.h"

      '
  count: 1
- description: Regress both omitted Android reporting and retained required update/install data
  regex:
    pattern: TEST(SerializeRequestJSON, DownloadPreference) {
    replace: "\n#if BUILDFLAG(IS_ANDROID)\nTEST(SerializeRequestJSON, AndroidOmitsOptionalTelemetryKeepsUpdateData) {\n  //\
      \ Exercise construction and the wire boundary independently. A passive DTO\n  // filled by another caller must not reintroduce\
      \ optional reporting fields.\n  auto app = MakeProtocolApp(\n      \"id1\", base::Version(\"1.0\"), \"\", \"\", \"install-id\"\
      , \"en-US\", 1234,\n      \"ondemand\", \"internal\", {{\"attr\", \"value\"}}, \"\", \"\", \"\", \"\", {},\n      /*cached_hashes=*/{},\
      \ MakeProtocolUpdateCheck(false, \"2\", false, true),\n      {{\"install\", \"needed-data\", \"\"}}, protocol_request::Ping(),\n\
      \      std::vector<base::DictValue>());\n  EXPECT_TRUE(app.lang.empty());\n  EXPECT_TRUE(app.install_id.empty());\n\
      \  EXPECT_EQ(kDateUnknown, app.install_date);\n  EXPECT_FALSE(app.ping);\n  EXPECT_FALSE(app.events);\n  app.lang =\
      \ \"en-US\";\n  app.install_id = \"install-id\";\n  app.install_date = 1234;\n  app.ping = protocol_request::Ping();\n\
      \  app.ping->date_last_active = 1234;\n  app.ping->date_last_roll_call = 1234;\n  app.events.emplace();\n  app.events->emplace_back().Set(\"\
      eventtype\", 3);\n  std::vector<protocol_request::App> apps;\n  apps.push_back(std::move(app));\n  auto request = MakeProtocolRequest(\n\
      \      false, \"{15160585-8ADE-4D3C-839B-1281A6035D1F}\", \"prod_id\", \"1.0\",\n      \"channel\", \"OS\", \"\", std::nullopt,\
      \ {}, {}, std::move(apps));\n  EXPECT_EQ(0, request.hw.physmemory);\n  request.hw.physmemory = 16;\n  request.hw.avx\
      \ = true;\n  auto root = base::JSONReader::Read(\n      ProtocolSerializerJSON().Serialize(request), base::JSON_PARSE_RFC);\n\
      \  ASSERT_TRUE(root);\n  ASSERT_TRUE(root->is_dict());\n  const auto* wire_request = root->GetDict().FindDict(\"request\"\
      );\n  ASSERT_TRUE(wire_request);\n  const auto* hw = wire_request->FindDict(\"hw\");\n  ASSERT_TRUE(hw);\n  EXPECT_TRUE(hw->empty());\n\
      \  EXPECT_EQ(\"prod_id\", *wire_request->FindString(\"@updater\"));\n  EXPECT_EQ(\"1.0\", *wire_request->FindString(\"\
      prodversion\"));\n  EXPECT_FALSE(wire_request->FindString(\"@os\")->empty());\n  EXPECT_FALSE(wire_request->FindString(\"\
      arch\")->empty());\n  const auto* os = wire_request->FindDict(\"os\");\n  ASSERT_TRUE(os);\n  EXPECT_EQ(\"OS\", *os->FindString(\"\
      platform\"));\n  EXPECT_FALSE(os->FindString(\"arch\")->empty());\n  const auto* wire_apps = wire_request->FindList(\"\
      apps\");\n  ASSERT_TRUE(wire_apps);\n  ASSERT_EQ(1u, wire_apps->size());\n  const auto& wire_app = wire_apps->front().GetDict();\n\
      \  for (const char* key : {\"lang\", \"iid\", \"installdate\", \"ping\", \"events\"}) {\n    EXPECT_FALSE(wire_app.contains(key))\
      \ << key;\n  }\n  EXPECT_EQ(\"id1\", *wire_app.FindString(\"appid\"));\n  EXPECT_EQ(\"1.0\", *wire_app.FindString(\"\
      version\"));\n  EXPECT_EQ(\"value\", *wire_app.FindString(\"attr\"));\n  EXPECT_EQ(\"ondemand\", *wire_app.FindString(\"\
      installsource\"));\n  EXPECT_EQ(\"internal\", *wire_app.FindString(\"installedby\"));\n  ASSERT_TRUE(wire_app.FindDict(\"\
      updatecheck\"));\n  EXPECT_EQ(\"2\", *wire_app.FindDict(\"updatecheck\")->FindString(\"targetversionprefix\"));\n  ASSERT_TRUE(wire_app.FindList(\"\
      data\"));\n  EXPECT_EQ(\"needed-data\", *wire_app.FindList(\"data\")->front().GetDict().FindString(\"index\"));\n}\n\
      #endif  // BUILDFLAG(IS_ANDROID)\n\nTEST(SerializeRequestJSON, DownloadPreference) {"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/json/json_reader.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/json/json_reader.h"

      '
  count: 1
- description: Missing required request fields fail assertions before any dereference
  regex:
    pattern: "  EXPECT_EQ(\"prod_id\", *wire_request->FindString(\"@updater\"));\n  EXPECT_EQ(\"1.0\", *wire_request->FindString(\"\
      prodversion\"));\n  EXPECT_FALSE(wire_request->FindString(\"@os\")->empty());\n  EXPECT_FALSE(wire_request->FindString(\"\
      arch\")->empty());\n"
    replace: "  for (const char* key : {\"@updater\", \"prodversion\", \"@os\", \"arch\"}) {\n    ASSERT_TRUE(wire_request->FindString(key))\
      \ << key;\n    EXPECT_FALSE(wire_request->FindString(key)->empty()) << key;\n  }\n  EXPECT_EQ(\"prod_id\", *wire_request->FindString(\"\
      @updater\"));\n  EXPECT_EQ(\"1.0\", *wire_request->FindString(\"prodversion\"));\n"
  count: 1
- description: Require actual OS targeting fields before examining their contents
  regex:
    pattern: "  EXPECT_EQ(\"OS\", *os->FindString(\"platform\"));\n  EXPECT_FALSE(os->FindString(\"arch\")->empty());\n"
    replace: "  for (const char* key : {\"platform\", \"arch\", \"version\"}) {\n    ASSERT_TRUE(os->FindString(key)) << key;\n\
      \    EXPECT_FALSE(os->FindString(key)->empty()) << key;\n  }\n  EXPECT_EQ(\"OS\", *os->FindString(\"platform\"));\n"
  count: 1
- description: Validate the actual app wire element before inspecting its dictionary
  regex:
    pattern: '  const auto& wire_app = wire_apps->front().GetDict();

      '
    replace: "  ASSERT_TRUE(wire_apps->front().is_dict());\n  const auto& wire_app = wire_apps->front().GetDict();\n"
  count: 1
- description: Missing required app/target/install-data fields fail assertions before dereference or front
  regex:
    pattern: "  EXPECT_EQ(\"id1\", *wire_app.FindString(\"appid\"));\n  EXPECT_EQ(\"1.0\", *wire_app.FindString(\"version\"\
      ));\n  EXPECT_EQ(\"value\", *wire_app.FindString(\"attr\"));\n  EXPECT_EQ(\"ondemand\", *wire_app.FindString(\"installsource\"\
      ));\n  EXPECT_EQ(\"internal\", *wire_app.FindString(\"installedby\"));\n  ASSERT_TRUE(wire_app.FindDict(\"updatecheck\"\
      ));\n  EXPECT_EQ(\"2\", *wire_app.FindDict(\"updatecheck\")->FindString(\"targetversionprefix\"));\n  ASSERT_TRUE(wire_app.FindList(\"\
      data\"));\n  EXPECT_EQ(\"needed-data\", *wire_app.FindList(\"data\")->front().GetDict().FindString(\"index\"));\n"
    replace: "  for (const char* key :\n       {\"appid\", \"version\", \"attr\", \"installsource\", \"installedby\"}) {\n\
      \    ASSERT_TRUE(wire_app.FindString(key)) << key;\n    EXPECT_FALSE(wire_app.FindString(key)->empty()) << key;\n  }\n\
      \  EXPECT_EQ(\"id1\", *wire_app.FindString(\"appid\"));\n  EXPECT_EQ(\"1.0\", *wire_app.FindString(\"version\"));\n\
      \  EXPECT_EQ(\"value\", *wire_app.FindString(\"attr\"));\n  EXPECT_EQ(\"ondemand\", *wire_app.FindString(\"installsource\"\
      ));\n  EXPECT_EQ(\"internal\", *wire_app.FindString(\"installedby\"));\n  const auto* update_check = wire_app.FindDict(\"\
      updatecheck\");\n  ASSERT_TRUE(update_check);\n  ASSERT_TRUE(update_check->FindString(\"targetversionprefix\"));\n \
      \ EXPECT_EQ(\"2\", *update_check->FindString(\"targetversionprefix\"));\n  const auto* install_data = wire_app.FindList(\"\
      data\");\n  ASSERT_TRUE(install_data);\n  ASSERT_EQ(1u, install_data->size());\n  ASSERT_TRUE(install_data->front().is_dict());\n\
      \  const auto& install_data_item = install_data->front().GetDict();\n  ASSERT_TRUE(install_data_item.FindString(\"index\"\
      ));\n  EXPECT_EQ(\"needed-data\", *install_data_item.FindString(\"index\"));\n"
  count: 1
- description: Keep a normal test boundary
  regex:
    pattern: '}



      #if BUILDFLAG(IS_ANDROID)

      TEST(SerializeRequestJSON, AndroidOmitsOptionalTelemetryKeepsUpdateData)'
    replace: '}


      #if BUILDFLAG(IS_ANDROID)

      TEST(SerializeRequestJSON, AndroidOmitsOptionalTelemetryKeepsUpdateData)'
  count: 1
- description: "Match Android protocol-test zero to unsigned physical-memory type (1)"
  count: 1
  regex:
    re_pattern: "\\ \\ EXPECT_EQ\\(0,\\ request\\.hw\\.physmemory\\);\\\n"
    replace: "  EXPECT_EQ(0u, request.hw.physmemory);\n"
