substitutions:
- description: Do not compile optional operation-event generation on Android
  regex:
    pattern: "        event_adder.Run(\n            MakeSimpleOperationEvent(result, protocol_request::kEventXz));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n        event_adder.Run(\n            MakeSimpleOperationEvent(result, protocol_request::kEventXz));\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/files/file_path.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/files/file_path.h"

      '
  count: 1
