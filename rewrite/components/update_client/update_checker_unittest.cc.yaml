substitutions:
- description: Retain functional success assertions without an Android locale report
  regex:
    pattern: "  ASSERT_TRUE(app->FindString(\"lang\"));\n  EXPECT_EQ(\"foolang\", *app->FindString(\"lang\"));\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_FALSE(app->contains(\"lang\"));\n#else\n  ASSERT_TRUE(app->FindString(\"\
      lang\"));\n  EXPECT_EQ(\"foolang\", *app->FindString(\"lang\"));\n#endif\n"
  count: 1
- description: Retain invalid-AP update success coverage without locale reporting
  regex:
    pattern: '  EXPECT_EQ("fake_lang", CHECK_DEREF(app.FindString("lang")));

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_FALSE(app.contains(\"lang\"));\n#else\n  EXPECT_EQ(\"fake_lang\", CHECK_DEREF(app.FindString(\"\
      lang\")));\n#endif\n"
  count: 1
- description: Check real update network success while proving optional Android wire reports absent
  regex:
    pattern: "  EXPECT_TRUE(app->contains(\"ping\"));\n  ASSERT_TRUE(app->FindIntByDottedPath(\"ping.r\").has_value());\n\
      \  EXPECT_EQ(-2, app->FindIntByDottedPath(\"ping.r\").value());\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  for (const char* key : {\"ping\", \"events\", \"iid\", \"installdate\"}) {\n  \
      \  EXPECT_FALSE(app->contains(key)) << key;\n  }\n#else\n  EXPECT_TRUE(app->contains(\"ping\"));\n  ASSERT_TRUE(app->FindIntByDottedPath(\"\
      ping.r\").has_value());\n  EXPECT_EQ(-2, app->FindIntByDottedPath(\"ping.r\").value());\n#endif\n"
  count: 1
- description: Retain normal update/CUP error assertions without Android rollcall
  regex:
    pattern: "  EXPECT_TRUE(app.contains(\"ping\"));\n  EXPECT_EQ(-2, app_as_val.GetDict().FindByDottedPath(\"ping.r\")->GetInt());\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_FALSE(app.contains(\"ping\"));\n#else\n  EXPECT_TRUE(app.contains(\"ping\"\
      ));\n  EXPECT_EQ(-2, app_as_val.GetDict().FindByDottedPath(\"ping.r\")->GetInt());\n#endif\n"
  count: 3
- description: Retain pause/resume completion coverage without Android rollcall
  regex:
    pattern: '  EXPECT_EQ(-2, app_as_val.GetDict().FindIntByDottedPath("ping.r").value());

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_FALSE(app.contains(\"ping\"));\n#else\n  EXPECT_EQ(-2, app_as_val.GetDict().FindIntByDottedPath(\"\
      ping.r\").value());\n#endif\n"
  count: 1
- description: Only desktop ping assertions require this extra app copy
  regex:
    pattern: '  const base::Value app_as_val = GetFirstAppAsValue(root.value());

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const base::Value app_as_val = GetFirstAppAsValue(root.value());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 4
- description: Keep dedicated usage-reporting fixture desktop-only
  regex:
    pattern: "TEST_P(UpdateCheckerTest, UpdateCheckLastRollCall) {\n  static constexpr char kFilename[] = \"updatecheck_reply_4.json\"\
      ;\n  EXPECT_TRUE(post_interceptor_->ExpectRequest(\n      std::make_unique<PartialMatch>(\"updatecheck\"),\n      GetTestFilePath(kFilename)));\n\
      \  EXPECT_TRUE(post_interceptor_->ExpectRequest(\n      std::make_unique<PartialMatch>(\"updatecheck\"),\n      GetTestFilePath(kFilename)));\n\
      \n  update_checker_ = UpdateChecker::Create(config_);\n\n  update_context_->components[kUpdateItemId] = MakeComponent();\n\
      \n  // Do two update-checks.\n  config_->GetActivityDataService()->SetDaysSinceLastRollCall(kUpdateItemId, 5);\n  update_checker_->CheckForUpdates(\n\
      \      update_context_, {{\"extra\", \"params\"}},\n      base::BindOnce(&UpdateCheckerTest::UpdateCheckComplete,\n\
      \                     base::Unretained(this)));\n  RunThreads();\n\n  update_checker_ = UpdateChecker::Create(config_);\n\
      \  update_checker_->CheckForUpdates(\n      update_context_, {{\"extra\", \"params\"}},\n      base::BindOnce(&UpdateCheckerTest::UpdateCheckComplete,\n\
      \                     base::Unretained(this)));\n  RunThreads();\n\n  EXPECT_EQ(2, post_interceptor_->GetHitCount())\n\
      \      << post_interceptor_->GetRequestsAsString();\n  ASSERT_EQ(2, post_interceptor_->GetCount())\n      << post_interceptor_->GetRequestsAsString();\n\
      \n  std::optional<base::DictValue> root1 = ParseRequest(0);\n  ASSERT_TRUE(root1);\n  const base::Value app1 = GetFirstAppAsValue(root1.value());\n\
      \  EXPECT_EQ(5, app1.GetDict().FindByDottedPath(\"ping.r\")->GetInt());\n  std::optional<base::DictValue> root2 = ParseRequest(1);\n\
      \  ASSERT_TRUE(root2);\n  const base::Value app2 = GetFirstAppAsValue(root2.value());\n  EXPECT_EQ(3383, app2.GetDict().FindByDottedPath(\"\
      ping.rd\")->GetInt());\n  EXPECT_TRUE(\n      app2.GetDict().FindByDottedPath(\"ping.ping_freshness\")->is_string());\n\
      }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nTEST_P(UpdateCheckerTest, UpdateCheckLastRollCall) {\n  static constexpr char kFilename[]\
      \ = \"updatecheck_reply_4.json\";\n  EXPECT_TRUE(post_interceptor_->ExpectRequest(\n      std::make_unique<PartialMatch>(\"\
      updatecheck\"),\n      GetTestFilePath(kFilename)));\n  EXPECT_TRUE(post_interceptor_->ExpectRequest(\n      std::make_unique<PartialMatch>(\"\
      updatecheck\"),\n      GetTestFilePath(kFilename)));\n\n  update_checker_ = UpdateChecker::Create(config_);\n\n  update_context_->components[kUpdateItemId]\
      \ = MakeComponent();\n\n  // Do two update-checks.\n  config_->GetActivityDataService()->SetDaysSinceLastRollCall(kUpdateItemId,\
      \ 5);\n  update_checker_->CheckForUpdates(\n      update_context_, {{\"extra\", \"params\"}},\n      base::BindOnce(&UpdateCheckerTest::UpdateCheckComplete,\n\
      \                     base::Unretained(this)));\n  RunThreads();\n\n  update_checker_ = UpdateChecker::Create(config_);\n\
      \  update_checker_->CheckForUpdates(\n      update_context_, {{\"extra\", \"params\"}},\n      base::BindOnce(&UpdateCheckerTest::UpdateCheckComplete,\n\
      \                     base::Unretained(this)));\n  RunThreads();\n\n  EXPECT_EQ(2, post_interceptor_->GetHitCount())\n\
      \      << post_interceptor_->GetRequestsAsString();\n  ASSERT_EQ(2, post_interceptor_->GetCount())\n      << post_interceptor_->GetRequestsAsString();\n\
      \n  std::optional<base::DictValue> root1 = ParseRequest(0);\n  ASSERT_TRUE(root1);\n  const base::Value app1 = GetFirstAppAsValue(root1.value());\n\
      \  EXPECT_EQ(5, app1.GetDict().FindByDottedPath(\"ping.r\")->GetInt());\n  std::optional<base::DictValue> root2 = ParseRequest(1);\n\
      \  ASSERT_TRUE(root2);\n  const base::Value app2 = GetFirstAppAsValue(root2.value());\n  EXPECT_EQ(3383, app2.GetDict().FindByDottedPath(\"\
      ping.rd\")->GetInt());\n  EXPECT_TRUE(\n      app2.GetDict().FindByDottedPath(\"ping.ping_freshness\")->is_string());\n\
      }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
