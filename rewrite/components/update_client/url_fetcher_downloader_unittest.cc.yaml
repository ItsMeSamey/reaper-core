substitutions:
- description: Adapt Android report-only fixture references while retaining ordinary update/download assertions and callbacks.
  regex:
    pattern: '#include "base/task/thread_pool/thread_pool_instance.h"

      #include "base/test/bind.h"

      #include "base/test/task_environment.h"

      #include "components/update_client/crx_downloader.h"

      #include "components/update_client/net/network_chromium.h"

      #include "components/update_client/network.h"

      '
    replace: '#include "base/task/thread_pool/thread_pool_instance.h"

      #include "base/test/bind.h"

      #include "base/test/task_environment.h"

      #include "build/build_config.h"

      #include "components/update_client/crx_downloader.h"

      #include "components/update_client/net/network_chromium.h"

      #include "components/update_client/network.h"

      '
  count: 1
- description: Adapt Android report-only fixture references while retaining ordinary update/download assertions and callbacks.
  regex:
    pattern: "  EXPECT_EQ(1, num_complete_calls_);\n  EXPECT_EQ(std::to_underlying(CrxDownloaderError::CANCELLED), result_.error);\n\
      \  EXPECT_EQ(0, test_url_loader_factory_.NumPending());\n  // The cancellation is recorded like any other completion.\n\
      \  ASSERT_EQ(1u, downloader->download_metrics().size());\n  EXPECT_EQ(std::to_underlying(CrxDownloaderError::CANCELLED),\n\
      \            downloader->download_metrics()[0].error);\n}\n\n// Cancelling after the download has completed does nothing.\n"
    replace: "  EXPECT_EQ(1, num_complete_calls_);\n  EXPECT_EQ(std::to_underlying(CrxDownloaderError::CANCELLED), result_.error);\n\
      \  EXPECT_EQ(0, test_url_loader_factory_.NumPending());\n#if !BUILDFLAG(IS_ANDROID)\n  // The cancellation is recorded\
      \ like any other completion.\n  ASSERT_EQ(1u, downloader->download_metrics().size());\n  EXPECT_EQ(std::to_underlying(CrxDownloaderError::CANCELLED),\n\
      \            downloader->download_metrics()[0].error);\n#endif  // !BUILDFLAG(IS_ANDROID)\n}\n\n// Cancelling after\
      \ the download has completed does nothing.\n"
  count: 1
