substitutions:
- description: No Android activity-ping helper declaration
  regex:
    pattern: "protocol_request::Ping MakeProtocolPing(const std::string& app_id,\n                                       \
      \ const PersistedData* metadata,\n                                        bool active);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nprotocol_request::Ping MakeProtocolPing(const std::string& app_id,\n           \
      \                             const PersistedData* metadata,\n                                        bool active);\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Use Android compile-time guards explicitly
  regex:
    pattern: '#include "base/containers/flat_map.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/containers/flat_map.h"

      '
  count: 1
