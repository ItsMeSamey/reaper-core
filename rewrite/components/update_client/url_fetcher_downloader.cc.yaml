substitutions:
- description: No Android report-only download timing
  regex:
    pattern: '  download_start_time_ = base::TimeTicks::Now();

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  download_start_time_ = base::TimeTicks::Now();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Do not store Android reporting bytes; real progress still forwards current/total
  regex:
    pattern: '  downloaded_bytes_ = current;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  downloaded_bytes_ = current;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android elapsed-time report measurement
  regex:
    pattern: "  const base::TimeTicks download_end_time(base::TimeTicks::Now());\n  const base::TimeDelta download_time =\n\
      \      download_end_time >= download_start_time_\n          ? download_end_time - download_start_time_\n          :\
      \ base::TimeDelta();\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const base::TimeTicks download_end_time(base::TimeTicks::Now());\n  const base::TimeDelta\
      \ download_time =\n      download_end_time >= download_start_time_\n          ? download_end_time - download_start_time_\n\
      \          : base::TimeDelta();\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Do not construct an Android URL/error/bytes/timing report
  regex:
    pattern: "  DownloadMetrics download_metrics;\n  download_metrics.url = url();\n  download_metrics.downloader = DownloadMetrics::kUrlFetcher;\n\
      \  download_metrics.error = error;\n  download_metrics.extra_code1 = extra_code1;\n  // Tests expected -1, in case of\
      \ failures and no content is available. A\n  // cancelled download reports the partial content it received.\n  download_metrics.downloaded_bytes\
      \ =\n      error ? (cancelled_ ? downloaded_bytes_ : -1) : content_size;\n  download_metrics.total_bytes = total_bytes_;\n\
      \  download_metrics.download_time_ms = download_time.InMilliseconds();\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  DownloadMetrics download_metrics;\n  download_metrics.url = url();\n  download_metrics.downloader\
      \ = DownloadMetrics::kUrlFetcher;\n  download_metrics.error = error;\n  download_metrics.extra_code1 = extra_code1;\n\
      \  // Tests expected -1, in case of failures and no content is available. A\n  // cancelled download reports the partial\
      \ content it received.\n  download_metrics.downloaded_bytes =\n      error ? (cancelled_ ? downloaded_bytes_ : -1) :\
      \ content_size;\n  download_metrics.total_bytes = total_bytes_;\n  download_metrics.download_time_ms = download_time.InMilliseconds();\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Preserve local download diagnostics without a telemetry-only timer
  regex:
    pattern: "  VLOG(1) << \"Downloaded \" << content_size << \" bytes in \"\n          << download_time.InMilliseconds()\
      \ << \"ms from \" << url().spec()\n          << \" to \" << result.response.value();\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  VLOG(1) << \"Downloaded \" << content_size << \" bytes from \" << url().spec()\n\
      \          << \" to \" << result.response.value();\n#else\n  VLOG(1) << \"Downloaded \" << content_size << \" bytes\
      \ in \"\n          << download_time.InMilliseconds() << \"ms from \" << url().spec()\n          << \" to \" << result.response.value();\n\
      #endif\n"
  count: 1
- description: Post the same actual network result and retry decision without telemetry
  regex:
    pattern: '                                is_handled, result, download_metrics));

      '
    replace: "                                is_handled, result\n#if !BUILDFLAG(IS_ANDROID)\n                           \
      \     , download_metrics\n#endif\n                                ));\n"
  count: 1
