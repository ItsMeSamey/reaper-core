substitutions:
- description: The Android pipeline has no event collector
  regex:
    pattern: '        base::BindRepeating(&Component::AppendEvent, base::Unretained(this)),

      '
    replace: "#if BUILDFLAG(IS_ANDROID)\n        base::NullCallback(),\n#else\n        base::BindRepeating(&Component::AppendEvent,\
      \ base::Unretained(this)),\n#endif\n"
  count: 1
- description: Exclude optional Android event collection helpers
  regex:
    pattern: "base::DictValue WrapFingerprint(const std::string& fp) {\n  base::DictValue wrapper;\n  wrapper.Set(\"fingerprint\"\
      , fp);\n  return wrapper;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nbase::DictValue WrapFingerprint(const std::string& fp) {\n  base::DictValue wrapper;\n\
      \  wrapper.Set(\"fingerprint\", fp);\n  return wrapper;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude optional Android event collection helpers
  regex:
    pattern: "void Component::AppendEvent(base::DictValue event) {\n  if (previous_version().IsValid()) {\n    event.Set(\"\
      previousversion\", previous_version().GetString());\n  }\n  if (next_version().IsValid()) {\n    event.Set(\"nextversion\"\
      , next_version().GetString());\n  }\n  events_.push_back(std::move(event));\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid Component::AppendEvent(base::DictValue event) {\n  if (previous_version().IsValid())\
      \ {\n    event.Set(\"previousversion\", previous_version().GetString());\n  }\n  if (next_version().IsValid()) {\n \
      \   event.Set(\"nextversion\", next_version().GetString());\n  }\n  events_.push_back(std::move(event));\n}\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude optional Android event collection helpers
  regex:
    pattern: "base::DictValue Component::MakeEventUpdateComplete() const {\n  base::DictValue event;\n  event.Set(\"eventtype\"\
      , update_context_->is_install\n                             ? protocol_request::kEventInstall\n                    \
      \         : protocol_request::kEventUpdate);\n  event.Set(\"eventresult\",\n            static_cast<int>(state() ==\
      \ ComponentState::kUpdated));\n  if (error_category() != ErrorCategory::kNone) {\n    event.Set(\"errorcat\", static_cast<int>(error_category()));\n\
      \  }\n  if (error_code()) {\n    event.Set(\"errorcode\", error_code());\n  }\n  if (extra_code1()) {\n    event.Set(\"\
      extracode1\", extra_code1());\n  }\n  if (!previous_fp().empty()) {\n    event.Set(\"previousfp\", WrapFingerprint(previous_fp()));\n\
      \  }\n  if (!next_fp().empty()) {\n    event.Set(\"nextfp\", WrapFingerprint(next_fp()));\n  }\n  return event;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nbase::DictValue Component::MakeEventUpdateComplete() const {\n  base::DictValue\
      \ event;\n  event.Set(\"eventtype\", update_context_->is_install\n                             ? protocol_request::kEventInstall\n\
      \                             : protocol_request::kEventUpdate);\n  event.Set(\"eventresult\",\n            static_cast<int>(state()\
      \ == ComponentState::kUpdated));\n  if (error_category() != ErrorCategory::kNone) {\n    event.Set(\"errorcat\", static_cast<int>(error_category()));\n\
      \  }\n  if (error_code()) {\n    event.Set(\"errorcode\", error_code());\n  }\n  if (extra_code1()) {\n    event.Set(\"\
      extracode1\", extra_code1());\n  }\n  if (!previous_fp().empty()) {\n    event.Set(\"previousfp\", WrapFingerprint(previous_fp()));\n\
      \  }\n  if (!next_fp().empty()) {\n    event.Set(\"nextfp\", WrapFingerprint(next_fp()));\n  }\n  return event;\n}\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude optional Android event collection helpers
  regex:
    pattern: "std::vector<base::DictValue> Component::GetEvents() const {\n  return base::ToVector(events_,\n            \
      \            [](const auto& event) { return event.Clone(); });\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nstd::vector<base::DictValue> Component::GetEvents() const {\n  return base::ToVector(events_,\n\
      \                        [](const auto& event) { return event.Clone(); });\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android update/error event recording
  regex:
    pattern: '    component.AppendEvent(component.MakeEventUpdateComplete());

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    component.AppendEvent(component.MakeEventUpdateComplete());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 2
- description: No Android install/update event recording
  regex:
    pattern: "\n  component.AppendEvent(component.MakeEventUpdateComplete());\n"
    replace: "\n#if !BUILDFLAG(IS_ANDROID)\n  component.AppendEvent(component.MakeEventUpdateComplete());\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/component.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/update_client/component.h"

      '
  count: 1
