substitutions:
- description: Do not compile optional operation-event generation on Android
  regex:
    pattern: "            event_adder.Run(\n                MakeEventActionRun(succeeded, error_code, extra_code1));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n            event_adder.Run(\n                MakeEventActionRun(succeeded, error_code,\
      \ extra_code1));\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android run-action event payloads
  regex:
    pattern: "base::DictValue MakeEventActionRun(bool succeeded,\n                                   int error_code,\n   \
      \                                int extra_code1) {\n  base::DictValue event;\n  event.Set(\"eventtype\", protocol_request::kEventAction);\n\
      \  event.Set(\"eventresult\", static_cast<int>(succeeded));\n  if (error_code) {\n    event.Set(\"errorcode\", error_code);\n\
      \  }\n  if (extra_code1) {\n    event.Set(\"extracode1\", extra_code1);\n  }\n  return event;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nbase::DictValue MakeEventActionRun(bool succeeded,\n                           \
      \        int error_code,\n                                   int extra_code1) {\n  base::DictValue event;\n  event.Set(\"\
      eventtype\", protocol_request::kEventAction);\n  event.Set(\"eventresult\", static_cast<int>(succeeded));\n  if (error_code)\
      \ {\n    event.Set(\"errorcode\", error_code);\n  }\n  if (extra_code1) {\n    event.Set(\"extracode1\", extra_code1);\n\
      \  }\n  return event;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/action_runner.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/update_client/action_runner.h"

      '
  count: 1
