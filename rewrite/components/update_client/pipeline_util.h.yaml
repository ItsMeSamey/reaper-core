substitutions:
- description: Exclude declarations of Android telemetry-only operation helpers
  regex:
    pattern: "namespace update_client {\n\n// Convenience function to make a simple event for an operation\n// from the error\
      \ contained by a base::expected, if one exists.\nbase::DictValue MakeSimpleOperationEvent(\n    base::expected<base::FilePath,\
      \ CategorizedError> result,\n    const int operation_type);\n\n// Make a simple event for an operation from a CategorizedError.\n\
      base::DictValue MakeSimpleOperationEvent(const CategorizedError& error,\n                                         const\
      \ int operation_type);\n\n}  // namespace update_client\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nnamespace update_client {\n\n// Convenience function to make a simple event for\
      \ an operation\n// from the error contained by a base::expected, if one exists.\nbase::DictValue MakeSimpleOperationEvent(\n\
      \    base::expected<base::FilePath, CategorizedError> result,\n    const int operation_type);\n\n// Make a simple event\
      \ for an operation from a CategorizedError.\nbase::DictValue MakeSimpleOperationEvent(const CategorizedError& error,\n\
      \                                         const int operation_type);\n\n}  // namespace update_client\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/types/expected.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/types/expected.h"

      '
  count: 1
