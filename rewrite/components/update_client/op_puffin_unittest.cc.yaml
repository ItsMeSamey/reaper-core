substitutions:
- description: Keep real patch/disk/decompression checks and reject optional Android events
  regex:
    pattern: "  ASSERT_EQ(pings_.size(), 1u);\n  EXPECT_EQ(pings_[0].FindInt(\"eventtype\"), protocol_request::kEventPuff);\n\
      \  EXPECT_EQ(pings_[0].FindInt(\"eventresult\"),\n            protocol_request::kEventResultError);\n  EXPECT_EQ(pings_[0].FindInt(\"\
      errorcat\"),\n            std::to_underlying(ErrorCategory::kUnpack));\n  EXPECT_EQ(pings_[0].FindInt(\"errorcode\"\
      ),\n            std::to_underlying(UnpackerError::kPatchOutHashMismatch));\n  EXPECT_EQ(pings_[0].Find(\"extracode1\"\
      ), nullptr);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(pings_.empty());\n#else\n  ASSERT_EQ(pings_.size(), 1u);\n  EXPECT_EQ(pings_[0].FindInt(\"\
      eventtype\"), protocol_request::kEventPuff);\n  EXPECT_EQ(pings_[0].FindInt(\"eventresult\"),\n            protocol_request::kEventResultError);\n\
      \  EXPECT_EQ(pings_[0].FindInt(\"errorcat\"),\n            std::to_underlying(ErrorCategory::kUnpack));\n  EXPECT_EQ(pings_[0].FindInt(\"\
      errorcode\"),\n            std::to_underlying(UnpackerError::kPatchOutHashMismatch));\n  EXPECT_EQ(pings_[0].Find(\"\
      extracode1\"), nullptr);\n#endif\n"
  count: 1
