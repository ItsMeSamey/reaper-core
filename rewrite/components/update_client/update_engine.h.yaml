substitutions:
- description: No Android concrete reporter include
  regex:
    pattern: '#include "components/update_client/ping_manager.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/update_client/ping_manager.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: No Android reporter constructor argument
  regex:
    pattern: '      scoped_refptr<PingManager> ping_manager,

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      scoped_refptr<PingManager> ping_manager,\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android reporter state
  regex:
    pattern: '  scoped_refptr<PingManager> ping_manager_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  scoped_refptr<PingManager> ping_manager_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android event upload entry
  regex:
    pattern: "  void SendPing(const CrxComponent& crx_component,\n                UpdateClient::PingParams ping_params,\n\
      \                Callback update_callback);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void SendPing(const CrxComponent& crx_component,\n                UpdateClient::PingParams\
      \ ping_params,\n                Callback update_callback);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Use Android compile-time guards explicitly
  regex:
    pattern: '#include "base/containers/queue.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/containers/queue.h"

      '
  count: 1
