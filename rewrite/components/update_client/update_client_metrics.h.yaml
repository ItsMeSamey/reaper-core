substitutions:
- description: No Android updater-metrics declarations
  regex:
    pattern: 'namespace update_client::metrics {


      void RecordCRXDownloadTime(base::TimeDelta time, const std::string& app_id);


      void RecordCRXUnzipTime(base::TimeDelta time, const std::string& app_id);


      void RecordCupValidationResult(bool valid);


      void RecordCupValidationTime(base::TimeDelta time);


      }  // namespace update_client::metrics

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      namespace update_client::metrics {


      void RecordCRXDownloadTime(base::TimeDelta time, const std::string& app_id);


      void RecordCRXUnzipTime(base::TimeDelta time, const std::string& app_id);


      void RecordCupValidationResult(bool valid);


      void RecordCupValidationTime(base::TimeDelta time);


      }  // namespace update_client::metrics

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/time/time.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/time/time.h"

      '
  count: 1
