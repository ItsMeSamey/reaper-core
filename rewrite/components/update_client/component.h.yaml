substitutions:
- description: Exclude Android event collection APIs
  regex:
    pattern: "  const std::vector<base::DictValue>& events() const { return events_; }\n\n  // Returns a clone of the component\
      \ events.\n  std::vector<base::DictValue> GetEvents() const;\n\n  void AppendEvent(base::DictValue event);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const std::vector<base::DictValue>& events() const { return events_; }\n\n  //\
      \ Returns a clone of the component events.\n  std::vector<base::DictValue> GetEvents() const;\n\n  void AppendEvent(base::DictValue\
      \ event);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android event payload helper declaration
  regex:
    pattern: '  base::DictValue MakeEventUpdateComplete() const;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::DictValue MakeEventUpdateComplete() const;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Exclude Android event collection storage
  regex:
    pattern: '  std::vector<base::DictValue> events_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::vector<base::DictValue> events_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/files/file_path.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/files/file_path.h"

      '
  count: 1
- description: No stale Android declaration referencing the excluded report model
  regex:
    pattern: "  base::DictValue MakeEventDownloadMetrics(\n      const CrxDownloader::DownloadMetrics& download_metrics) const;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::DictValue MakeEventDownloadMetrics(\n      const CrxDownloader::DownloadMetrics&\
      \ download_metrics) const;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android getter/setter for event-only previous fingerprint
  regex:
    pattern: "  std::string previous_fp() const { return previous_fp_; }\n  void set_previous_fp(const std::string& previous_fp)\
      \ {\n    previous_fp_ = previous_fp;\n  }\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::string previous_fp() const { return previous_fp_; }\n  void set_previous_fp(const\
      \ std::string& previous_fp) {\n    previous_fp_ = previous_fp;\n  }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android event-only previous fingerprint storage
  regex:
    pattern: '  std::string previous_fp_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::string previous_fp_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
