substitutions:
- description: No Android download report aggregation
  regex:
    pattern: "const std::vector<CrxDownloader::DownloadMetrics>\nCrxDownloader::download_metrics() const {\n  std::vector<DownloadMetrics>\
      \ retval = download_metrics_;\n  if (successor_) {\n    std::vector<DownloadMetrics> successor_metrics =\n        successor_->download_metrics();\n\
      \    retval.insert(retval.end(),\n                  std::make_move_iterator(successor_metrics.begin()),\n          \
      \        std::make_move_iterator(successor_metrics.end()));\n  }\n  return retval;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nconst std::vector<CrxDownloader::DownloadMetrics>\nCrxDownloader::download_metrics()\
      \ const {\n  std::vector<DownloadMetrics> retval = download_metrics_;\n  if (successor_) {\n    std::vector<DownloadMetrics>\
      \ successor_metrics =\n        successor_->download_metrics();\n    retval.insert(retval.end(),\n                  std::make_move_iterator(successor_metrics.begin()),\n\
      \                  std::make_move_iterator(successor_metrics.end()));\n  }\n  return retval;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Android completion/error methods carry only real result data
  regex:
    pattern: "    const Result& result,\n    const DownloadMetrics& download_metrics) {\n"
    replace: "    const Result& result\n#if !BUILDFLAG(IS_ANDROID)\n    , const DownloadMetrics& download_metrics\n#endif\n\
      ) {\n"
  count: 2
- description: Keep the posted error/retry path without a report argument
  regex:
    pattern: '                                  is_handled, result, download_metrics));

      '
    replace: "                                  is_handled, result\n#if !BUILDFLAG(IS_ANDROID)\n                         \
      \         , download_metrics\n#endif\n                                  ));\n"
  count: 1
- description: No Android duplicate telemetry-result assertion
  regex:
    pattern: '  CHECK_EQ(0, download_metrics.error);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  CHECK_EQ(0, download_metrics.error);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Hash verification still receives the real error result, not a report payload
  regex:
    pattern: '             DownloadMetrics download_metrics, CrxDownloaderError error) {

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n             DownloadMetrics download_metrics,\n#endif\n             CrxDownloaderError\
      \ error) {\n"
  count: 1
- description: No Android successful download report storage
  regex:
    pattern: '              downloader->download_metrics_.push_back(download_metrics);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n              downloader->download_metrics_.push_back(download_metrics);\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android report mutation on hash failure
  regex:
    pattern: '            download_metrics.error = result.error;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n            download_metrics.error = result.error;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Hash failures retain the posted retry path without telemetry
  regex:
    pattern: '                               true, result, download_metrics));

      '
    replace: "                               true, result\n#if !BUILDFLAG(IS_ANDROID)\n                               , download_metrics\n\
      #endif\n                               ));\n"
  count: 1
- description: Bind the real hash validation result without an Android report object
  regex:
    pattern: '          scoped_refptr<CrxDownloader>(this), result, download_metrics));

      '
    replace: "          scoped_refptr<CrxDownloader>(this), result\n#if !BUILDFLAG(IS_ANDROID)\n          , download_metrics\n\
      #endif\n          ));\n"
  count: 1
- description: No Android failed download report storage
  regex:
    pattern: "  CHECK_NE(0, download_metrics.error);\n\n  download_metrics_.push_back(download_metrics);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  CHECK_NE(0, download_metrics.error);\n\n  download_metrics_.push_back(download_metrics);\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
