substitutions:
- description: No Android report-only unzip timer state
  regex:
    pattern: '  base::TimeTicks unzip_begin_time_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  base::TimeTicks unzip_begin_time_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "base/files/file_path.h"

      '
    replace: '#include "build/build_config.h"

      #include "base/files/file_path.h"

      '
  count: 1
- description: No Android report-only unpacker identity storage
  regex:
    pattern: '  const std::string app_id_;

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const std::string app_id_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
