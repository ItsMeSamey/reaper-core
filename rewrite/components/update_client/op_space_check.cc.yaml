substitutions:
- description: Do not compile optional operation-event generation on Android
  regex:
    pattern: "              event_adder.Run(MakeSimpleOperationEvent(\n                  CategorizedError({.category = ErrorCategory::kDownload,\n\
      \                                    .code = static_cast<int>(\n                                        CrxDownloaderError::DISK_FULL)}),\n\
      \                  protocol_request::kEventDownload));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n              event_adder.Run(MakeSimpleOperationEvent(\n                  CategorizedError({.category\
      \ = ErrorCategory::kDownload,\n                                    .code = static_cast<int>(\n                     \
      \                   CrxDownloaderError::DISK_FULL)}),\n                  protocol_request::kEventDownload));\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Include the explicit Android/callback contract
  regex:
    pattern: '#include "components/update_client/op_space_check.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/update_client/op_space_check.h"

      '
  count: 1
