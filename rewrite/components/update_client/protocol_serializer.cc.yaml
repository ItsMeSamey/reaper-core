substitutions:
- description: Exclude optional Android usage-ping construction
  regex:
    pattern: "protocol_request::Ping MakeProtocolPing(const std::string& app_id,\n                                       \
      \ const PersistedData* metadata,\n                                        bool active) {\n  CHECK(metadata);\n  protocol_request::Ping\
      \ ping;\n\n  if (active) {\n    const int date_last_active = metadata->GetDateLastActive(app_id);\n    if (date_last_active\
      \ != kDateUnknown) {\n      ping.date_last_active = date_last_active;\n    } else {\n      ping.days_since_last_active_ping\
      \ =\n          metadata->GetDaysSinceLastActive(app_id);\n    }\n  }\n  const int date_last_roll_call = metadata->GetDateLastRollCall(app_id);\n\
      \  if (date_last_roll_call != kDateUnknown) {\n    ping.date_last_roll_call = date_last_roll_call;\n  } else {\n   \
      \ ping.days_since_last_roll_call = metadata->GetDaysSinceLastRollCall(app_id);\n  }\n  ping.ping_freshness = metadata->GetPingFreshness(app_id);\n\
      \n  return ping;\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nprotocol_request::Ping MakeProtocolPing(const std::string& app_id,\n           \
      \                             const PersistedData* metadata,\n                                        bool active) {\n\
      \  CHECK(metadata);\n  protocol_request::Ping ping;\n\n  if (active) {\n    const int date_last_active = metadata->GetDateLastActive(app_id);\n\
      \    if (date_last_active != kDateUnknown) {\n      ping.date_last_active = date_last_active;\n    } else {\n      ping.days_since_last_active_ping\
      \ =\n          metadata->GetDaysSinceLastActive(app_id);\n    }\n  }\n  const int date_last_roll_call = metadata->GetDateLastRollCall(app_id);\n\
      \  if (date_last_roll_call != kDateUnknown) {\n    ping.date_last_roll_call = date_last_roll_call;\n  } else {\n   \
      \ ping.days_since_last_roll_call = metadata->GetDaysSinceLastRollCall(app_id);\n  }\n  ping.ping_freshness = metadata->GetPingFreshness(app_id);\n\
      \n  return ping;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android hardware-report collector
  regex:
    pattern: "// Returns the amount of physical memory in GB, rounded to the nearest GB.\nint GetPhysicalMemoryGB() {\n  return\
      \ base::ClampRound(\n      base::SysInfo::AmountOfTotalPhysicalMemory().InGiBF());\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Returns the amount of physical memory in GB, rounded to the nearest GB.\nint\
      \ GetPhysicalMemoryGB() {\n  return base::ClampRound(\n      base::SysInfo::AmountOfTotalPhysicalMemory().InGiBF());\n\
      }\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Do not collect optional Android physical memory or CPU capability reporting
  regex:
    pattern: "  // HW platform information.\n  request.hw.physmemory = GetPhysicalMemoryGB();\n#if defined(ARCH_CPU_X86_FAMILY)\n\
      \  base::CPU cpu;\n  request.hw.sse = cpu.has_sse();\n  request.hw.sse2 = cpu.has_sse2();\n  request.hw.sse3 = cpu.has_sse3();\n\
      \  request.hw.ssse3 = cpu.has_ssse3();\n  request.hw.sse41 = cpu.has_sse41();\n  request.hw.sse42 = cpu.has_sse42();\n\
      \  request.hw.avx = cpu.has_avx();\n#endif\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // HW platform information.\n  request.hw.physmemory = GetPhysicalMemoryGB();\n\
      #if defined(ARCH_CPU_X86_FAMILY)\n  base::CPU cpu;\n  request.hw.sse = cpu.has_sse();\n  request.hw.sse2 = cpu.has_sse2();\n\
      \  request.hw.sse3 = cpu.has_sse3();\n  request.hw.ssse3 = cpu.has_ssse3();\n  request.hw.sse41 = cpu.has_sse41();\n\
      \  request.hw.sse42 = cpu.has_sse42();\n  request.hw.avx = cpu.has_avx();\n#endif\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android optional event storage in protocol construction
  regex:
    pattern: '  app.events = std::move(events);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  app.events = std::move(events);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android optional locale/install identity storage in protocol construction
  regex:
    pattern: "  app.lang = lang;\n  app.install_date = install_date;\n  app.install_id = install_id;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  app.lang = lang;\n  app.install_date = install_date;\n  app.install_id = install_id;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: No Android activity/rollcall storage in protocol construction
  regex:
    pattern: '  app.ping = std::move(ping);

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  app.ping = std::move(ping);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
