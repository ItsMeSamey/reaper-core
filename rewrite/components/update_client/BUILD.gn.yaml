  - description: Exclude the dedicated optional Android updater-metrics implementation
    regex:
      pattern: '      "pipeline_util.h",

        '
      replace: "      \"pipeline_util.h\",\n      \"update_client_metrics.cc\",\n      \"update_client_metrics.h\",\n"
    count: 1
  - description: Exclude only the dedicated ping transport fixture from initialized Android unit-test sources
    regex:
      pattern: "    \"utils_unittest.cc\",\n  ]\n"
      replace: "    \"utils_unittest.cc\",\n  ]\n\n  if (is_android) {\n    sources -= [ \"ping_manager_unittest.cc\" ]\n  }\n"
    count: 1
