substitutions:
  - description: Add the Brave update client sources.
    add_literal_to_list:
      target: update_client
      list_name: sources
      literal: brave_components_update_client_sources

  - description: Add the Brave update client deps.
    add_literal_to_list:
      target: update_client
      list_name: deps
      literal: brave_components_update_client_deps

  - description: Add the Brave update client public_deps.
    add_literal_to_list:
      target: update_client
      list_name: public_deps
      literal: brave_components_update_client_public_deps
  - description: Exclude dedicated telemetry implementations from the initialized Android source list
