substitutions:
- description: Import extension core condition for the portable PWG encoder.
  regex:
    re_pattern: import\("//printing/buildflags/buildflags\.gni"\)
    replace: 'import("//extensions/buildflags/buildflags.gni")

      import("//printing/buildflags/buildflags.gni")'
- description: Allow the existing portable PWG encoder for Android printer providers.
  regex:
    re_pattern: assert\(enable_print_preview\)
    replace: assert(enable_print_preview || (is_android && enable_extensions_core))
