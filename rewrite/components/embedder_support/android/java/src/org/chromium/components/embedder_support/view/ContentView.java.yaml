    replace: "\n    @Override\n    public AccessibilityNodeProvider getAccessibilityNodeProvider() {\n        WebContentsAccessibility wcax = getWebContentsAccessibility();\n        AccessibilityNodeProvider provider =\n                wcax == null ? null : wcax.getAccessibilityNodeProvider();\n        if (provider == null || mUserActivationDelegate == null) return provider;\n        WebContents owner = mWebContents;\n        return new AccessibilityNodeProvider() {\n            private boolean valid() {\n                return owner != null\n                        && owner == mWebContents\n                        && !owner.isDestroyed()\n                        && isAttachedToWindow();\n            }\n\n            @Override\n            public AccessibilityNodeInfo createAccessibilityNodeInfo(int virtualViewId) {\n                return valid() ? provider.createAccessibilityNodeInfo(virtualViewId) : null;\n            }\n\n            @Override\n            public List<AccessibilityNodeInfo>\
      \ findAccessibilityNodeInfosByText(\n                    String text, int id) {\n                return valid() ? provider.findAccessibilityNodeInfosByText(text, id) : List.of();\n            }\n\n            @Override\n            public AccessibilityNodeInfo findFocus(int focus) {\n                return valid() ? provider.findFocus(focus) : null;\n            }\n\n            @Override\n            public void addExtraDataToAccessibilityNodeInfo(\n                    int id, AccessibilityNodeInfo info, String key, Bundle arguments) {\n                if (valid()) provider.addExtraDataToAccessibilityNodeInfo(id, info, key, arguments);\n            }\n\n            @Override\n            public boolean performAction(int id, int action, Bundle arguments) {\n                if (!valid()) return false;\n                // Clearing a departed node's focus is cleanup, not an activation request.\n                boolean clear =\n                        action == AccessibilityNodeInfo.ACTION_CLEAR_ACCESSIBILITY_FOCUS\n\
      \                                || action == AccessibilityNodeInfo.ACTION_CLEAR_FOCUS;\n                if (!clear\n                        && mUserActivationDelegate != null\n                        && !mUserActivationDelegate.getAsBoolean()) return false;\n                // Selecting may synchronously close/reparent the page or replace its document.\n                return valid() && provider.performAction(id, action, arguments);\n            }\n        };\n    }\n\n    // Needed by ViewEventSink.InternalAccessDelegate\n    @Override\n"
