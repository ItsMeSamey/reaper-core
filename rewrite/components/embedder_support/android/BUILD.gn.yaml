substitutions:
- description: Remove the dedicated annotated-page-content virtual_structure_javatests target after its AI provider is retired.
  regex:
    pattern: "  android_library(\"virtual_structure_javatests\") {\n    testonly = true\n    sources = [ \"javatests/src/org/chromium/components/embedder_support/virtual_structure/PageContentProtoViewStructureBuilderTest.java\"\
      \ ]\n    deps = [\n      \":content_view_java\",\n      \":virtual_structure_java\",\n      \"//base:base_java\",\n\
      \      \"//base:base_java_test_support\",\n      \"//chrome/android:chrome_java\",\n      \"//chrome/browser/flags:java\"\
      ,\n      \"//chrome/browser/tab:java\",\n      \"//chrome/test/android:chrome_java_test_support_common\",\n      \"\
      //chrome/test/android:chrome_java_transit\",\n      \"//components/android_autofill/browser/test_support:java\",\n \
      \     \"//content/public/test/android:content_java_test_support\",\n      \"//net/android:net_java_test_support\",\n\
      \      \"//third_party/androidx:androidx_test_runner_java\",\n      \"//third_party/junit\",\n    ]\n  }\n\n"
    replace: ''
  count: 1
- description: Remove the dedicated annotated-page-content virtual_structure_junit_tests target after its AI provider is retired.
  regex:
    pattern: "  robolectric_library(\"virtual_structure_junit_tests\") {\n    sources = [ \"junit/src/org/chromium/components/embedder_support/virtual_structure/PageContentProtoViewStructureBuilderUnitTest.java\"\
      \ ]\n    deps = [\n      \":virtual_structure_java\",\n      \"//base:base_java_test_support\",\n      \"//base:base_junit_test_support\"\
      ,\n      \"//base:callback_java\",\n      \"//components/android_autofill/browser/test_support:java\",\n      \"//components/optimization_guide/content/browser/android:optimization_guide_content_java\"\
      ,\n      \"//components/optimization_guide/proto:optimization_guide_proto_java\",\n      \"//content/public/android:content_java\"\
      ,\n      \"//third_party/android_deps:org_mockito_mockito_core_java\",\n      \"//third_party/android_deps:protobuf_lite_runtime_java\"\
      ,\n      \"//third_party/junit\",\n    ]\n  }\n"
    replace: ''
  count: 1
- description: Remove only the annotated-page-content converter; retain the generic VirtualStructureProvider interface.
  regex:
    pattern: '      "java/src/org/chromium/components/embedder_support/virtual_structure/PageContentProtoViewStructureBuilder.java",

      '
    replace: ''
  count: 1
- description: Remove dependencies used only by the retired annotated-page-content converter.
  regex:
    pattern: "      \"//components/optimization_guide/content/browser/android:optimization_guide_content_java\",\n      \"\
      //components/optimization_guide/proto:optimization_guide_proto_java\",\n"
    replace: ''
  count: 1
- description: Apply pinned GN formatter normalization to the retained singleton source list.
  regex:
    pattern: "    sources = [\n      \"java/src/org/chromium/components/embedder_support/virtual_structure/VirtualStructureProvider.java\"\
      ,\n    ]"
    replace: '    sources = [ "java/src/org/chromium/components/embedder_support/virtual_structure/VirtualStructureProvider.java"
      ]'
  count: 1
- description: Apply pinned GN formatter normalization to the final target spacing.
  regex:
    pattern: "      \"//url:gurl_java\",\n    ]\n  }\n\n}\n"
    replace: "      \"//url:gurl_java\",\n    ]\n  }\n}\n"
  count: 1
