# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android concrete AI source/provider removal: components/BUILD.gn'
  regex:
    re_pattern: '\ \ \ \ \ \ "test/data/webp_transcode/",\

      \ \ \ \ \ \ "test/data/web_view/",\

      \ \ \ \ \]\

      \ \ \}\

      \

      \ \ if\ \(is_fuchsia\)\ \{\

      '
    replace: "      \"test/data/webp_transcode/\",\n      \"test/data/web_view/\",\n    ]\n    if (is_android) {\n      data -= [ \"test/data/contextual_tasks/\" ]\n    }\n  }\n\n  if (is_fuchsia) {\n"
