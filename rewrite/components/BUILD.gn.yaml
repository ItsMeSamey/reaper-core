- {"description":"Android PersonalContext/AtMemory selected-provider omission","regex":{"re_pattern":"\\ \\ \\ \\ \\ \\ \"//components/webcrypto:unit_tests\",\\\n\\ \\ \\ \\ \\ \\ \"//components/webrtc:unit_tests\",\\\n\\ \\ \\ \\ \\ \\ \"//components/webrtc_logging:unit_tests\",\\\n\\ \\ \\ \\ \\ \\ \"//components/webrtc_logging/browser:unit_tests\",\\\n\\ \\ \\ \\ \\ \\ \"//components/webrtc_logging/common:unit_tests\",\\\n\\ \\ \\ \\ \\]\\\n\\\n\\ \\ \\ \\ \\#\\ guest_contents\\ is\\ a\\ supporting\\ component\\ for\\ any\\ solution\\ that\\ embeds\\\n\\ \\ \\ \\ \\#\\ unowned\\ inner\\ WebContents\\.\\ As\\ it\\ is\\ for\\ embedding\\ WebContents,\\ only\\\n\\ \\ \\ \\ \\#\\ add\\ the\\ deps\\ when\\ use_blink\\ is\\ true\\.\\\n\\ \\ \\ \\ deps\\ \\+=\\ \\[\\\n\\ \\ \\ \\ \\ \\ \"//components/guest_contents/browser:unit_tests\",\\\n","replace":"      \"//components/webcrypto:unit_tests\",\n      \"//components/webrtc:unit_tests\",\n      \"//components/webrtc_logging:unit_tests\",\n      \"//components/webrtc_logging/browser:unit_tests\",\n      \"//components/webrtc_logging/common:unit_tests\",\n    ]\n    if (is_android) {\n      deps -= [\n        \"//components/personal_context/first_run:unit_tests\",\n      ]\n    }\n\n    # guest_contents is a supporting component for any solution that embeds\n    # unowned inner WebContents. As it is for embedding WebContents, only\n    # add the deps when use_blink is true.\n    deps += [\n      \"//components/guest_contents/browser:unit_tests\",\n"},"count":1}
