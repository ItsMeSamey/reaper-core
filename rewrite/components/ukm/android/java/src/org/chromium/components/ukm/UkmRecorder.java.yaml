substitutions:
  - description: "Remove unused event-array helper import"
    regex:
      pattern: "import static org.chromium.build.NullUtil.assumeNonNull;\n\n"
      replace: ""
    count: 1
  - description: "Remove unused native metric-reader callbacks"
    regex:
      pattern: "import org.jni_zero.CalledByNative;\n"
      replace: ""
    count: 1
  - description: "Remove unused nullable metric-list annotation"
    regex:
      pattern: "import org.chromium.build.annotations.Nullable;\n"
      replace: ""
    count: 1
  - description: "Remove metric collection containers"
    regex:
      pattern: "import java.util.ArrayList;\nimport java.util.List;\n\n"
      replace: ""
    count: 1
  - description: "Describe source-level metric-free Android adapter"
    regex:
      pattern: "/**\n * A class for the occurrence of a single UKM event. It is generated from its Builder class and must\n * have a non-null WebContents, an event name, and at least one metric. AddMetric and\n * AddBooleanMetric can be called any number of times to add metrics corresponding to the named\n * event in tools/metrics/ukm/ukm.xml.\n */"
      replace: "/**\n * Android compatibility adapter for callers of the UKM API.\n *\n * <p>URL-keyed metric collection is omitted from this Android build. Fluent calls retain their\n * signatures without retaining the WebContents, event name, or metric values, or entering JNI.\n */"
    count: 1
  - description: "Remove all retained event/source/metric state"
    regex:
      pattern: "    private final WebContents mWebContents;\n    private final String mEventName;\n    private @Nullable List<Metric> mMetrics;\n\n"
      replace: ""
    count: 1
  - description: "Do not retain constructor source or event arguments"
    regex:
      pattern: "        mWebContents = webContents;\n        mEventName = eventName;\n"
      replace: ""
    count: 1
  - description: "Do not allocate or store integer metrics"
    regex:
      pattern: "        if (mMetrics == null) {\n            mMetrics = new ArrayList<Metric>();\n        }\n        mMetrics.add(new Metric(name, value));\n"
      replace: ""
    count: 1
  - description: "Do not allocate or store boolean metrics"
    regex:
      pattern: "        if (mMetrics == null) {\n            mMetrics = new ArrayList<Metric>();\n        }\n        // Boolean metrics have implied value \"true\".\n        mMetrics.add(new Metric(name, 1));\n"
      replace: ""
    count: 1
  - description: "Remove event dispatch and native metric-reader implementation"
    regex:
      pattern: "    public void record() {\n        if (mWebContents.isDestroyed()) {\n            // https://crbug.com/356429588\n            assert false;\n            return;\n        }\n        assumeNonNull(mMetrics);\n        Metric[] metricsArray = mMetrics.toArray(new Metric[mMetrics.size()]);\n        UkmRecorderJni.get().recordEventWithMultipleMetrics(mWebContents, mEventName, metricsArray);\n    }\n\n    @CalledByNative\n    private static String getNameFromMetric(Metric metric) {\n        return metric.mName;\n    }\n\n    @CalledByNative\n    private static int getValueFromMetric(Metric metric) {\n        return metric.mValue;\n    }"
      replace: "    public void record() {}"
    count: 1
