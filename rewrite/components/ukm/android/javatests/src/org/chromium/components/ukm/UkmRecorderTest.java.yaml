substitutions:
  - description: "Use API identity and negative JNI/WebContents interaction assertions"
    regex:
      pattern: "import static org.mockito.Mockito.any;\nimport static org.mockito.Mockito.argThat;\nimport static org.mockito.Mockito.eq;\nimport static org.mockito.Mockito.verify;"
      replace: "import static org.junit.Assert.assertSame;\nimport static org.mockito.Mockito.verifyNoInteractions;"
    count: 1
  - description: "Provide independent WebContents for interleaved recorder contract"
    regex:
      pattern: "    private @Mock WebContents mWebContents;\n"
      replace: "    private @Mock WebContents mWebContents;\n    private @Mock WebContents mOtherWebContents;\n"
    count: 1
  - description: "Replace intentional old submission expectation with three metric-free behavioral contracts"
    regex:
      pattern: "    @Test\n    public void record_multipleMetrics() {\n        new UkmRecorder(mWebContents, TEST_EVENT_NAME)\n                .addMetric(METRIC_NAME1, 5)\n                .addMetric(METRIC_NAME2, 10)\n                .record();\n        verify(mUkmRecorderJniMock)\n                .recordEventWithMultipleMetrics(\n                        any(),\n                        eq(TEST_EVENT_NAME),\n                        argThat(\n                                metricsList ->\n                                        metricsList.length == 2\n                                                && metricsList[0].mName.equals(METRIC_NAME1)\n                                                && metricsList[0].mValue == 5\n                                                && metricsList[1].mName.equals(METRIC_NAME2)\n                                                && metricsList[1].mValue == 10));\n    }"
      replace: "    @Test\n    public void fluentMetrics_doNotReadWebContentsOrSubmitEvent() {\n        UkmRecorder recorder = new UkmRecorder(mWebContents, TEST_EVENT_NAME);\n        assertSame(recorder, recorder.addMetric(METRIC_NAME1, Integer.MIN_VALUE));\n        assertSame(recorder, recorder.addBooleanMetric(METRIC_NAME2));\n        assertSame(recorder, recorder.addMetric(METRIC_NAME1, Integer.MAX_VALUE));\n        recorder.record();\n\n        verifyNoInteractions(mUkmRecorderJniMock, mWebContents);\n    }\n\n    @Test\n    public void emptyAndRepeatedRecords_doNotReadWebContentsOrSubmitEvent() {\n        UkmRecorder recorder = new UkmRecorder(mWebContents, TEST_EVENT_NAME);\n        recorder.record();\n        recorder.record();\n        recorder.addBooleanMetric(METRIC_NAME1).record();\n        recorder.record();\n\n        verifyNoInteractions(mUkmRecorderJniMock, mWebContents);\n    }\n\n    @Test\n    public void interleavedRecorders_preserveFluentIdentityWithoutSubmission() {\n        UkmRecorder first = new UkmRecorder(mWebContents, TEST_EVENT_NAME);\n        UkmRecorder second = new UkmRecorder(mOtherWebContents, \"event2\");\n        assertSame(first, first.addMetric(METRIC_NAME1, 5));\n        assertSame(second, second.addBooleanMetric(METRIC_NAME2));\n        first.record();\n        assertSame(first, first.addBooleanMetric(METRIC_NAME2));\n        assertSame(second, second.addMetric(METRIC_NAME1, 10));\n        second.record();\n        first.record();\n\n        verifyNoInteractions(mUkmRecorderJniMock, mWebContents, mOtherWebContents);\n    }"
    count: 1
