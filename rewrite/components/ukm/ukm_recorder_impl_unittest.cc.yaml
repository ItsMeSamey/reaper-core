substitutions:
  - description: "Preserve reviewed Android source projection for components/ukm/ukm_recorder_impl_unittest.cc (operation 1)."
    regex:
      re_pattern: "\\#include\\ \"base/test/task_environment\\.h\"\\\n"
      replace: "#include \"base/test/task_environment.h\"\n#include \"build/build_config.h\"\n"
  - description: "Preserve reviewed Android source projection for components/ukm/ukm_recorder_impl_unittest.cc (operation 2)."
    regex:
      re_pattern: "\\}\\ \\ //\\ namespace\\ ukm\\\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\nTEST(UkmRecorderImplTest, GetNewSourceID) {\n  SourceId id1 = UkmRecorder::GetNewSourceID();\n  SourceId id2 = UkmRecorder::GetNewSourceID();\n  SourceId id3 = UkmRecorder::GetNewSourceID();\n  EXPECT_NE(id1, id2);\n  EXPECT_NE(id1, id3);\n  EXPECT_NE(id2, id3);\n}\n#endif\n\n}  // namespace ukm\n"
  - description: Include Android delegating recorder contract API
    regex:
      pattern: '#include "services/metrics/public/cpp/ukm_builders.h"

        '
      replace: '#if BUILDFLAG(IS_ANDROID)

        #include "services/metrics/public/cpp/delegating_ukm_recorder.h"

        #endif

        #include "services/metrics/public/cpp/ukm_builders.h"

        '
    count: 1
  - description: Preserve extension purge storage assertions using explicit Android test-only event fixtures
    regex:
      pattern: "  TestEvent1(id1).Record(&recorder);\n  TestEvent1(id2).Record(&recorder);\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  // Seed only the test recorder: the Android production builder is inert.\n  for\
        \ (SourceId id : {id1, id2}) {\n    auto entry = BlankUkmEntry(id);\n    entry->event_hash = TestEvent1::kEntryNameHash;\n\
        \    recorder.AddEntry(std::move(entry));\n  }\n#else\n  TestEvent1(id1).Record(&recorder);\n  TestEvent1(id2).Record(&recorder);\n\
        #endif\n"
    count: 1
  - description: Preserve WEBAPK_ID identity semantics without global Android URL collection
    regex:
      pattern: "  ASSERT_EQ(1ul, sources.size());\n  auto it = sources.find(id);\n  ASSERT_NE(sources.end(), it);\n  EXPECT_EQ(url,\
        \ it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n  EXPECT_EQ(SourceIdType::WEBAPK_ID, GetSourceIdType(id));\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(sources.empty());\n#else\n  ASSERT_EQ(1ul, sources.size());\n  auto\
        \ it = sources.find(id);\n  ASSERT_NE(sources.end(), it);\n  EXPECT_EQ(url, it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n\
        #endif\n  EXPECT_EQ(SourceIdType::WEBAPK_ID, GetSourceIdType(id));\n"
    count: 1
  - description: Preserve PAYMENT_APP_ID identity semantics without global Android URL collection
    regex:
      pattern: "  ASSERT_EQ(1ul, sources.size());\n  auto it = sources.find(id);\n  ASSERT_NE(sources.end(), it);\n  EXPECT_EQ(url,\
        \ it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n  EXPECT_EQ(SourceIdType::PAYMENT_APP_ID, GetSourceIdType(id));\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(sources.empty());\n#else\n  ASSERT_EQ(1ul, sources.size());\n  auto\
        \ it = sources.find(id);\n  ASSERT_NE(sources.end(), it);\n  EXPECT_EQ(url, it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n\
        #endif\n  EXPECT_EQ(SourceIdType::PAYMENT_APP_ID, GetSourceIdType(id));\n"
    count: 1
  - description: Preserve WEB_IDENTITY_ID identity semantics without global Android URL collection
    regex:
      pattern: "  ASSERT_EQ(1ul, sources.size());\n  auto it = sources.find(id);\n  ASSERT_NE(sources.end(), it);\n  EXPECT_EQ(url,\
        \ it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n  EXPECT_EQ(SourceIdType::WEB_IDENTITY_ID, GetSourceIdType(id));\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(sources.empty());\n#else\n  ASSERT_EQ(1ul, sources.size());\n  auto\
        \ it = sources.find(id);\n  ASSERT_NE(sources.end(), it);\n  EXPECT_EQ(url, it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n\
        #endif\n  EXPECT_EQ(SourceIdType::WEB_IDENTITY_ID, GetSourceIdType(id));\n"
    count: 1
  - description: Check no Android delegate registration, URL storage or generated event submission
    regex:
      pattern: '

        }  // namespace ukm

        '
      replace: "\n#if BUILDFLAG(IS_ANDROID)\nTEST(UkmRecorderImplTest, AndroidDelegatingRecorderDoesNotRegisterOrCollect) {\n\
        \  base::test::TaskEnvironment env;\n  TestAutoSetUkmRecorder first;\n  TestAutoSetUkmRecorder second;\n  EXPECT_FALSE(DelegatingUkmRecorder::Get()->HasMultipleDelegates());\n\
        \n  const SourceId id = UkmRecorderImpl::GetSourceIdFromScopeImpl(\n      GURL(\"https://example.com\"), SourceIdType::PAYMENT_APP_ID);\n\
        \  ASSERT_NE(kInvalidSourceId, id);\n  TestEvent1(id).SetCpuTime(1).Record(UkmRecorder::Get());\n  env.RunUntilIdle();\n\
        \n  EXPECT_TRUE(first.GetSources().empty());\n  EXPECT_TRUE(second.GetSources().empty());\n  EXPECT_EQ(0u, first.entries_count());\n\
        \  EXPECT_EQ(0u, second.entries_count());\n}\n\n#endif\n\n}  // namespace ukm\n"
    count: 1
  - description: "Reviewed future27 case9 and phase10 afterStats540 source 1/1: include_existing_test_only_peer_in_existing_Android_include_guard"
    regex:
      re_pattern: "\\#if\\ BUILDFLAG\\(IS_ANDROID\\)\\\n\\#include\\ \"services/metrics/public/cpp/delegating_ukm_recorder\\.h\"\\\n\\#endif\\\n"
      replace: "#if BUILDFLAG(IS_ANDROID)\n#include \"services/metrics/public/cpp/delegating_ukm_recorder.h\"\n#include \"services/metrics/public/cpp/test_recording_helper.h\"\n#endif\n"
    count: 1
  - description: "Reviewed future27 case9 and phase10 afterStats540 source 1/2: replace_disallowed_scope_call_with_same_public_ID_and_existing_authorized_peer"
    regex:
      re_pattern: "\\ \\ const\\ SourceId\\ id\\ =\\ UkmRecorderImpl::GetSourceIdFromScopeImpl\\(\\\n\\ \\ \\ \\ \\ \\ GURL\\(\"https://example\\.com\"\\),\\ SourceIdType::PAYMENT_APP_ID\\);\\\n\\ \\ ASSERT_NE\\(kInvalidSourceId,\\ id\\);\\\n\\ \\ TestEvent1\\(id\\)\\.SetCpuTime\\(1\\)\\.Record\\(UkmRecorder::Get\\(\\)\\);\\\n"
      replace: "  const SourceId id =\n      SourceIdObj::FromOtherId(UkmRecorder::GetNewSourceID(),\n                              SourceIdType::PAYMENT_APP_ID)\n          .ToInt64();\n  ASSERT_NE(kInvalidSourceId, id);\n  TestRecordingHelper(UkmRecorder::Get())\n      .UpdateSourceURL(id, GURL(\"https://example.com\"));\n  TestEvent1(id).SetCpuTime(1).Record(UkmRecorder::Get());\n"
    count: 1
