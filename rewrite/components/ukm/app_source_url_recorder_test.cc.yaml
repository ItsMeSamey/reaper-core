substitutions:
- description: Include explicit platform build flags
  regex:
    pattern: '#include "base/test/task_environment.h"

      '
    replace: '#include "base/test/task_environment.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Preserve app source identity test without Android singleton URL collection for expected_url
  regex:
    pattern: "  ASSERT_EQ(1ul, sources.size());\n\n  ASSERT_NE(kInvalidSourceId, id);\n  auto it = sources.find(id);\n  ASSERT_NE(sources.end(),\
      \ it);\n  EXPECT_EQ(expected_url, it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(sources.empty());\n  ASSERT_NE(kInvalidSourceId, id);\n#else\n  ASSERT_EQ(1ul,\
      \ sources.size());\n\n  ASSERT_NE(kInvalidSourceId, id);\n  auto it = sources.find(id);\n  ASSERT_NE(sources.end(),\
      \ it);\n  EXPECT_EQ(expected_url, it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n#endif\n"
  count: 1
- description: Preserve app source identity test without Android singleton URL collection for url
  regex:
    pattern: "  ASSERT_EQ(1ul, sources.size());\n\n  ASSERT_NE(kInvalidSourceId, id);\n  auto it = sources.find(id);\n  ASSERT_NE(sources.end(),\
      \ it);\n  EXPECT_EQ(url, it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  EXPECT_TRUE(sources.empty());\n  ASSERT_NE(kInvalidSourceId, id);\n#else\n  ASSERT_EQ(1ul,\
      \ sources.size());\n\n  ASSERT_NE(kInvalidSourceId, id);\n  auto it = sources.find(id);\n  ASSERT_NE(sources.end(),\
      \ it);\n  EXPECT_EQ(url, it->second->url());\n  EXPECT_EQ(1u, it->second->urls().size());\n#endif\n"
  count: 1
