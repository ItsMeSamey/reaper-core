substitutions:
  - description: "Use compile-time Android platform guards in singular adapter"
    regex:
      pattern: "#include \"base/sequence_checker.h\"\n"
      replace: "#include \"base/sequence_checker.h\"\n#include \"build/build_config.h\"\n"
    count: 1
  - description: "Do not allocate or bind a singular metrics pipe on Android"
    regex:
      pattern: "    CreateSingularUkmInterface(remote.InitWithNewPipeAndPassReceiver());"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n    CreateSingularUkmInterface(remote.InitWithNewPipeAndPassReceiver());\n#endif"
    count: 1
  - description: "Never submit a null Android compatibility entry to non-nullable Mojo"
    regex:
      pattern: "      singular_ukm_entry_->interface_->Submit(entry_.TakeEntry());"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n      singular_ukm_entry_->interface_->Submit(entry_.TakeEntry());\n#endif"
    count: 1
  - description: "Do not retain caller source ID or require a bound metrics pipe on Android"
    regex:
      pattern: "  SingularUkmEntry(SourceId source_id,\n                   mojo::PendingRemote<mojom::SingularUkmInterface> interface)\n      : source_id_(source_id), interface_(std::move(interface)) {\n    CHECK(interface_);\n  }"
      replace: "#if BUILDFLAG(IS_ANDROID)\n  SingularUkmEntry(SourceId,\n                   mojo::PendingRemote<mojom::SingularUkmInterface>)\n      : source_id_(kInvalidSourceId) {}\n#else\n  SingularUkmEntry(SourceId source_id,\n                   mojo::PendingRemote<mojom::SingularUkmInterface> interface)\n      : source_id_(source_id), interface_(std::move(interface)) {\n    CHECK(interface_);\n  }\n#endif"
    count: 1
