substitutions:
- description: Include explicit platform build flags
  regex:
    pattern: '#include "base/threading/thread.h"

      '
    replace: '#include "base/threading/thread.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Assert no Android singular submission after repeated builder destruction
  regex:
    pattern: "  // Expect only the last UkmEntry to be recorded by UKM.\n  EXPECT_EQ(ukm_recorder.entries_count(), 1u);\n\n\
      \  // Collect the metrics recorded.\n  const auto metrics = ukm_recorder.FilteredHumanReadableMetricForEntry(\n    \
      \  PageLoad::kEntryName, PageLoad::kCpuTimeName);\n\n  // Check the number and value of the found metrics.\n  ASSERT_EQ(metrics.size(),\
      \ 1u);\n  ASSERT_EQ(metrics[0].size(), 1u);\n  EXPECT_EQ(metrics[0].find(PageLoad::kCpuTimeName)->second, kTestCpuTime);\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Android builders do not submit an event when updated or destroyed.\n  EXPECT_EQ(ukm_recorder.entries_count(),\
      \ 0u);\n  EXPECT_TRUE(ukm_recorder.FilteredHumanReadableMetricForEntry(\n                  PageLoad::kEntryName, PageLoad::kCpuTimeName)\n\
      \                  .empty());\n#else\n  // Expect only the last UkmEntry to be recorded by UKM.\n  EXPECT_EQ(ukm_recorder.entries_count(),\
      \ 1u);\n\n  // Collect the metrics recorded.\n  const auto metrics = ukm_recorder.FilteredHumanReadableMetricForEntry(\n\
      \      PageLoad::kEntryName, PageLoad::kCpuTimeName);\n\n  // Check the number and value of the found metrics.\n  ASSERT_EQ(metrics.size(),\
      \ 1u);\n  ASSERT_EQ(metrics[0].size(), 1u);\n  EXPECT_EQ(metrics[0].find(PageLoad::kCpuTimeName)->second, kTestCpuTime);\n\
      #endif\n"
  count: 1
- description: Keep thread/sequence coverage while asserting no Android events
  regex:
    pattern: "  // Check the number and value of the found metrics.\n  ASSERT_EQ(metrics.size(), 2u);\n  EXPECT_THAT(metrics,\n\
      \              testing::UnorderedElementsAre(\n                  testing::Eq<TestAutoSetUkmRecorder::HumanReadableUkmMetrics>(\n\
      \                      {{PageLoad::kCpuTimeName, kTestCpuTime}}),\n                  testing::Eq<TestAutoSetUkmRecorder::HumanReadableUkmMetrics>(\n\
      \                      {{PageLoad::kCpuTimeName, kTestCpuTime2}})));\n"
    replace: "#if BUILDFLAG(IS_ANDROID)\n  // Sequence checks still apply, but neither thread submits Android UKM.\n  EXPECT_TRUE(metrics.empty());\n\
      \  EXPECT_EQ(ukm_recorder.entries_count(), 0u);\n#else\n  // Check the number and value of the found metrics.\n  ASSERT_EQ(metrics.size(),\
      \ 2u);\n  EXPECT_THAT(metrics,\n              testing::UnorderedElementsAre(\n                  testing::Eq<TestAutoSetUkmRecorder::HumanReadableUkmMetrics>(\n\
      \                      {{PageLoad::kCpuTimeName, kTestCpuTime}}),\n                  testing::Eq<TestAutoSetUkmRecorder::HumanReadableUkmMetrics>(\n\
      \                      {{PageLoad::kCpuTimeName, kTestCpuTime2}})));\n#endif\n"
  count: 1
- description: Check the Android empty adapter drops the receiver without a retained pipe
  regex:
    pattern: '

      }  // namespace ukm

      '
    replace: "\n#if BUILDFLAG(IS_ANDROID)\nTEST_F(SingularUkmEntryTest, AndroidReceiverIsNotRetained) {\n  mojo::Remote<mojom::SingularUkmInterface>\
      \ client;\n  CreateSingularUkmInterface(client.BindNewPipeAndPassReceiver());\n  client.FlushForTesting();\n  EXPECT_FALSE(client.is_connected());\n\
      }\n\n#endif\n\n}  // namespace ukm\n"
  count: 1
