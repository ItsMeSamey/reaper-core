substitutions:
- description: Include explicit platform build flags
  regex:
    pattern: '#include "base/test/task_environment.h"

      '
    replace: '#include "base/test/task_environment.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Include hashing only for explicit Android matcher fixture
  regex:
    pattern: '#include "build/build_config.h"

      '
    replace: '#include "build/build_config.h"

      #if BUILDFLAG(IS_ANDROID)

      #include "base/metrics/metrics_hashes.h"

      #endif

      '
  count: 1
- description: Keep matcher functionality independent of Android production collection
  regex:
    pattern: TEST(UkmGmockMatchersTest, HasMetric) {
    replace: "#if BUILDFLAG(IS_ANDROID)\nmojom::UkmEntryPtr EntryForMatcherTest() {\n  // Matcher coverage uses test data,\
      \ not the inert production Android builder.\n  auto entry = mojom::UkmEntry::New();\n  entry->source_id = NoURLSourceId();\n\
      \  entry->event_hash = base::HashMetricName(\"Event.Test\");\n  entry->metrics[base::HashMetricName(\"Metric.Test\"\
      )] = 42;\n  return entry;\n}\n\n#endif\n\nTEST(UkmGmockMatchersTest, HasMetric) {"
  count: 1
- description: Preserve all HasMetric matcher assertions with explicit Android-only test fixture
  regex:
    pattern: "TEST(UkmGmockMatchersTest, HasMetric) {\n  base::test::TaskEnvironment task_environment;\n  TestAutoSetUkmRecorder\
      \ ukm_recorder;\n\n  ukm::UkmEntryBuilder builder(ukm::NoURLSourceId(), \"Event.Test\");\n  builder.SetMetric(\"Metric.Test\"\
      , 42);\n  auto entry = builder.GetEntryForTesting();\n"
    replace: "TEST(UkmGmockMatchersTest, HasMetric) {\n  base::test::TaskEnvironment task_environment;\n  TestAutoSetUkmRecorder\
      \ ukm_recorder;\n\n#if BUILDFLAG(IS_ANDROID)\n  auto entry = EntryForMatcherTest();\n#else\n  ukm::UkmEntryBuilder builder(ukm::NoURLSourceId(),\
      \ \"Event.Test\");\n  builder.SetMetric(\"Metric.Test\", 42);\n  auto entry = builder.GetEntryForTesting();\n#endif\n"
  count: 1
- description: Preserve all HasMetricWithValue matcher assertions with explicit Android-only test fixture
  regex:
    pattern: "TEST(UkmGmockMatchersTest, HasMetricWithValue) {\n  base::test::TaskEnvironment task_environment;\n  TestAutoSetUkmRecorder\
      \ ukm_recorder;\n\n  ukm::UkmEntryBuilder builder(ukm::NoURLSourceId(), \"Event.Test\");\n  builder.SetMetric(\"Metric.Test\"\
      , 42);\n  auto entry = builder.GetEntryForTesting();\n"
    replace: "TEST(UkmGmockMatchersTest, HasMetricWithValue) {\n  base::test::TaskEnvironment task_environment;\n  TestAutoSetUkmRecorder\
      \ ukm_recorder;\n\n#if BUILDFLAG(IS_ANDROID)\n  auto entry = EntryForMatcherTest();\n#else\n  ukm::UkmEntryBuilder builder(ukm::NoURLSourceId(),\
      \ \"Event.Test\");\n  builder.SetMetric(\"Metric.Test\", 42);\n  auto entry = builder.GetEntryForTesting();\n#endif\n"
  count: 1
- description: Preserve all HasMetricWithValueExplanation matcher assertions with explicit Android-only test fixture
  regex:
    pattern: "TEST(UkmGmockMatchersTest, HasMetricWithValueExplanation) {\n  base::test::TaskEnvironment task_environment;\n\
      \  TestAutoSetUkmRecorder ukm_recorder;\n\n  ukm::UkmEntryBuilder builder(ukm::NoURLSourceId(), \"Event.Test\");\n \
      \ builder.SetMetric(\"Metric.Test\", 42);\n  auto entry = builder.GetEntryForTesting();\n"
    replace: "TEST(UkmGmockMatchersTest, HasMetricWithValueExplanation) {\n  base::test::TaskEnvironment task_environment;\n\
      \  TestAutoSetUkmRecorder ukm_recorder;\n\n#if BUILDFLAG(IS_ANDROID)\n  auto entry = EntryForMatcherTest();\n#else\n\
      \  ukm::UkmEntryBuilder builder(ukm::NoURLSourceId(), \"Event.Test\");\n  builder.SetMetric(\"Metric.Test\", 42);\n\
      \  auto entry = builder.GetEntryForTesting();\n#endif\n"
  count: 1
