substitutions:
  - description: Add the Brave search engines deps.
    add_literal_to_list:
      target: search_engines
      list_name: deps
      literal: brave_components_search_engines_deps
      import: //brave/components/search_engines/sources.gni

  - description: 'Android concrete AI source/provider removal: components/search_engines/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "util\.cc",\

        \ \ \ \ "util\.h",\

        \ \ \]\

        \

        \ \ public_deps\ =\ \[\

        \ \ \ \ ":ai_mode_button_config",\

        '
      replace: "    \"util.cc\",\n    \"util.h\",\n  ]\n  if (is_android) {\n    sources -= [\n      \"ai_mode_button_service.cc\",\n      \"ai_mode_button_service.h\",\n    ]\n  }\n\n  public_deps = [\n    \":ai_mode_button_config\",\n"
  - description: 'Android concrete AI source/provider removal: components/search_engines/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "//third_party/omnibox_proto",\

        \ \ \ \ "//third_party/search_engines_data:prepopulated_engines",\

        \ \ \]\

        \

        \ \ deps\ =\ \[\

        \ \ \ \ "//base:i18n",\

        '
      replace: "    \"//third_party/omnibox_proto\",\n    \"//third_party/search_engines_data:prepopulated_engines\",\n  ]\n  if (is_android) {\n    public_deps -= [ \":ai_mode_button_config\" ]\n  }\n\n  deps = [\n    \"//base:i18n\",\n"
  - description: 'Android concrete AI source/provider removal: components/search_engines/BUILD.gn'
    regex:
      re_pattern: '\ \ \ \ "ui_utils_unittest\.cc",\

        \ \ \ \ "util_unittest\.cc",\

        \ \ \]\

        \

        \ \ deps\ =\ \[\

        \ \ \ \ ":test_support",\

        '
      replace: "    \"ui_utils_unittest.cc\",\n    \"util_unittest.cc\",\n  ]\n  if (is_android) {\n    sources -= [ \"ai_mode_button_service_unittest.cc\" ]\n  }\n\n  deps = [\n    \":test_support\",\n"
