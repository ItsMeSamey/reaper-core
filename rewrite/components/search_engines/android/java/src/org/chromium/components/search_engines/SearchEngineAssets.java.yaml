# Reaper Source328 Actor-history and AI-starter-pack decoration implementation closure.
  - description: Reaper Android physical Actor-history and AI-starter-pack decoration
      closure; retain real ordinary history and favicon behavior and disclosed fixture
      assertions.
    regex:
      re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ switch\ \(starterPackId\)\ \{\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ case\ StarterPackId\.BOOKMARKS,\ StarterPackId\.HISTORY,\
        StarterPackId\.TABS\ \->\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ R\.drawable\.search_engine_default;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ case\ StarterPackId\.GEMINI\ \->\ R\.drawable\.search_engine_gemini;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ case\ StarterPackId\.AI_MODE\ \->\ R\.drawable\.search_engine_aimode;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ default\ \->\ Resources\.ID_NULL;\

        \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \};\

        \ \ \ \ \ \ \ \ if\ \(id\ ==\ Resources\.ID_NULL\)\ return\ null;\

        '
      replace: "                switch (starterPackId) {\n                    case StarterPackId.BOOKMARKS,\
        \ StarterPackId.HISTORY, StarterPackId.TABS ->\n                           \
        \ R.drawable.search_engine_default;\n                    default -> Resources.ID_NULL;\n\
        \                };\n        if (id == Resources.ID_NULL) return null;\n"
