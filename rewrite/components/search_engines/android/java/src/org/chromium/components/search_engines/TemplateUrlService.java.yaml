substitutions:
  - description: |
      Expose whether TemplateUrlService still has its native object.

      Android can recreate an activity while this Java object remains after
      native code clears its pointer. Callers must check before they call JNI.
    count: 1
    regex:
      re_pattern: '(public class TemplateUrlService\s*\{)'
      replace: |-
        \1
            /**
             * Returns whether the native service is available for JNI calls.
             *
             * The Java wrapper can outlive native teardown during activity
             * recreation. This does not indicate whether {@link #isLoaded()} returns true.
             */
            public boolean hasNativeService() {
                return mNativeTemplateUrlServiceAndroid != 0;
            }
  - description: "Reviewed resource8 after538 source 13/1: literal"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\*\\ Returns\\ the\\ URL\\ for\\ the\\ composeplate\\ button,\\ null\\ if\\ the\\ default\\ search\\ engine\\ isn't\\ Google\\.\\\n"
      replace: "     * Returns the composeplate URL, or null when composeplate is unavailable.\n     * Android does not build the composeplate/AIM entry.\n"
    count: 1
  - description: "Reviewed resource8 after538 source 13/2: literal"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ GURL\\ getComposeplateUrl\\(long\\ nativeTemplateUrlServiceAndroid,\\ TemplateUrlService\\ caller\\);"
      replace: "        @Nullable GURL getComposeplateUrl(\n                long nativeTemplateUrlServiceAndroid, TemplateUrlService caller);"
    count: 1
