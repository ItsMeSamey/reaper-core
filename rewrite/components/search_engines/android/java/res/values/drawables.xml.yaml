# Android physically omits concrete optional AI providers; retained browser/security/translation contracts stay selected.
substitutions:
- description: 'Android optional History/Search icon resource removal: components/search_engines/android/java/res/values/drawables.xml'
  regex:
    re_pattern: '\-\->\

      <resources>\

      \ \ \ \ <drawable\ name="search_engine_google">@drawable/ic_logo_googleg_20dp</drawable>\

      \ \ \ \ <drawable\ name="search_engine_gemini">@drawable/ic_spark_24dp</drawable>\

      \ \ \ \ <drawable\ name="search_engine_aimode">@drawable/search_spark</drawable>\

      \ \ \ \ <drawable\ name="search_engine_default">@drawable/ic_search_24dp</drawable>\

      </resources>\

      '
    replace: "-->\n<resources>\n    <drawable name=\"search_engine_google\">@drawable/ic_logo_googleg_20dp</drawable>\n    <drawable name=\"search_engine_default\">@drawable/ic_search_24dp</drawable>\n</resources>\n"
