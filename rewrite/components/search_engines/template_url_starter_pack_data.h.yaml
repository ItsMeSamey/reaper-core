# Android compile boundary for optional Gemini and AI Mode starter-pack providers; ordinary engines and stable schema remain.
substitutions:
- description: 'Preserve actual inherited ordinary Brave starter-pack enum patch before first recipe: components/search_engines/template_url_starter_pack_data.h'
  regex:
    re_pattern: '\ \ kPage\ =\ 5,\

      \ \ kAiMode\ =\ 6,\

      \

      \ \ kMaxStarterPackId\

      \};\

      \

      '
    replace: "  kPage = 5,\n  kAiMode = 6,\n\n  BRAVE_TEMPLATE_URL_STARTER_PACK_ID_ENUM\n  kMaxStarterPackId\n};\n\n"
- description: 'Android excludes optional Gemini/AI Mode seeded remote provider and accessor bodies while ordinary search remains: components/search_engines/template_url_starter_pack_data.h'
  regex:
    re_pattern: '\#include\ <vector>\

      \

      \#include\ "base/containers/enum_set\.h"\

      \#include\ "components/search_engines/search_engine_type\.h"\

      \

      struct\ TemplateURLData;\

      '
    replace: '#include <vector>


      #include "base/containers/enum_set.h"

      #include "build/build_config.h"

      #include "components/search_engines/search_engine_type.h"


      struct TemplateURLData;

      '
- description: 'Android excludes optional Gemini/AI Mode seeded remote provider and accessor bodies while ordinary search remains: components/search_engines/template_url_starter_pack_data.h'
  regex:
    re_pattern: 'extern\ const\ StarterPackEngine\ bookmarks;\

      extern\ const\ StarterPackEngine\ history;\

      extern\ const\ StarterPackEngine\ tabs;\

      extern\ const\ StarterPackEngine\ gemini;\

      extern\ const\ StarterPackEngine\ page;\

      extern\ const\ StarterPackEngine\ ai_mode;\

      \

      //\ Returns\ the\ current\ version\ of\ the\ starterpack\ data,\ so\ callers\ can\ know\ when\

      //\ they\ need\ to\ re\-merge\.\

      '
    replace: 'extern const StarterPackEngine bookmarks;

      extern const StarterPackEngine history;

      extern const StarterPackEngine tabs;

      #if !BUILDFLAG(IS_ANDROID)

      extern const StarterPackEngine gemini;

      #endif  // !BUILDFLAG(IS_ANDROID)

      extern const StarterPackEngine page;

      #if !BUILDFLAG(IS_ANDROID)

      extern const StarterPackEngine ai_mode;

      #endif  // !BUILDFLAG(IS_ANDROID)


      // Returns the current version of the starterpack data, so callers can know when

      // they need to re-merge.

      '
