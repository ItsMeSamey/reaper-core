# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: 'import\ org\.chromium\.base\.metrics\.RecordHistogram;\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ private\ static\ final\ String\ ANR_SKIPPED_UMA\ =\ "Crashpad\.AnrUpload\.Skipped";\

      \

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ RecordHistogram\.recordEnumeratedHistogram\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ANR_SKIPPED_UMA,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AnrSkippedReason\.FILESYSTEM_READ_FAILURE,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AnrSkippedReason\.MAX_VALUE\ \+\ 1\);\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ RecordHistogram\.recordEnumeratedHistogram\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ANR_SKIPPED_UMA,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AnrSkippedReason\.MISSING_VERSION,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AnrSkippedReason\.MAX_VALUE\ \+\ 1\);\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ RecordHistogram\.recordEnumeratedHistogram\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ANR_SKIPPED_UMA,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AnrSkippedReason\.NOT_SKIPPED,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AnrSkippedReason\.MAX_VALUE\ \+\ 1\);\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ RecordHistogram\.recordEnumeratedHistogram\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ ANR_SKIPPED_UMA,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AnrSkippedReason\.FILESYSTEM_WRITE_FAILURE,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ AnrSkippedReason\.MAX_VALUE\ \+\ 1\);\

      '
    replace: ''
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: 'import\ org\.chromium\.components\.crash\.anr\.AnrDataOuterClass\.AnrData;\

      '
    replace: 'import org.chromium.components.crash.anr.AnrDataOuterClass.AnrData;

      import org.jni_zero.CalledByNative;

      import org.jni_zero.JNINamespace;

      import org.jni_zero.JniType;

      '
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: 'import\ androidx\.annotation\.VisibleForTesting;\

      \

      import\ org\.jni_zero\.CalledByNative;\

      import\ org\.jni_zero\.JNINamespace;\

      import\ org\.jni_zero\.JniType;\

      \

      '
    replace: 'import androidx.annotation.VisibleForTesting;


      '
