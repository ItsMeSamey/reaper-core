# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\#include\ "base/time/time\.h"\

      '
    replace: '#include "base/time/time.h"

      #include "build/build_config.h"

      '
- description: Compile crash uploader code only outside Android
  regex:
    re_pattern: '\ \ crash_reporter::RequestSingleCrashUpload\(local_id\);\

      '
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  crash_reporter::RequestSingleCrashUpload(local_id);\n#endif\n"
