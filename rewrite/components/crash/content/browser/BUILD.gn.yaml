# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ "\.\./\.\./android/java/src/org/chromium/components/crash/browser/ProcessExitReasonFromSystem\.java",\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ "process_exit_reason_from_system_android\.cc",\

      '
    replace: ''
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ "process_exit_reason_from_system_android\.h",\

      '
    replace: ''
- description: Format changed Android crash source with the pinned formatter
  regex:
    re_pattern: '\ \ \ \ sources\ =\ \[\

      \ \ \ \ \ \ "\.\./\.\./android/java/src/org/chromium/components/crash/browser/ChildProcessCrashObserver\.java",\

      \ \ \ \ \]\

      '
    replace: '    sources = [ "../../android/java/src/org/chromium/components/crash/browser/ChildProcessCrashObserver.java" ]

      '
