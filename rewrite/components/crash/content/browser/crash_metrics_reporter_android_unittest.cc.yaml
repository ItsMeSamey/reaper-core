    replace: "TEST_F(CrashMetricsReporterTest, LocalForegroundCrashDoesNotRecordTelemetry) {\n  base::HistogramTester histogram_tester;\n  ChildExitObserver::TerminationInfo info;\n  info.process_host_id = 73;\n  info.process_type = content::PROCESS_TYPE_RENDERER;\n  info.app_state = base::android::APPLICATION_STATE_HAS_RUNNING_ACTIVITIES;\n  info.crash_signo = SIGSEGV;\n  info.was_killed_intentionally_by_browser = true;\n  info.renderer_has_visible_clients = true;\n  info.is_spare_renderer = true;\n  info.has_spare_renderer = true;\n  CrashMetricsReporterObserver observer;\n  auto* reporter = CrashMetricsReporter::GetInstance();\n  reporter->AddObserver(&observer);\n  reporter->ChildProcessExited(info);\n  observer.WaitForProcessed();\n  EXPECT_EQ(73, observer.process_host_id());\n  EXPECT_EQ(1, observer.callback_count());\n  EXPECT_EQ(CrashMetricsReporter::ReportedCrashTypeSet(\n                {CrashMetricsReporter::ProcessedCrashCounts::\n                     kRendererForegroundIntentionalKill,\n                 CrashMetricsReporter::ProcessedCrashCounts::\n                     kRendererForegroundVisibleCrash,\n                 CrashMetricsReporter::ProcessedCrashCounts::kRendererCrashAll}),\n            observer.recorded_crash_types());\n  histogram_tester.ExpectTotalCount(\"Stability.Android.ProcessedCrashCounts\", 0);\n  histogram_tester.ExpectTotalCount(\n      \"Stability.Android.KillSpareRendererAvailability.IntentionalKill\", 0);\n  reporter->RemoveObserver(&observer);\n}\n\nTEST_F(CrashMetricsReporterTest, LocalForegroundOomDoesNotRecordTelemetry) {\n  base::HistogramTester histogram_tester;\n  ChildExitObserver::TerminationInfo info;\n  info.process_host_id = 74;\n  info.process_type = content::PROCESS_TYPE_RENDERER;\n  info.app_state = base::android::APPLICATION_STATE_HAS_RUNNING_ACTIVITIES;\n  info.normal_termination = false;\n  info.renderer_has_visible_clients = true;\n  TestOomCrashProcessing(\n      info,\n      {CrashMetricsReporter::ProcessedCrashCounts::kRendererForegroundVisibleOom},\n      \"Stability.Android.ProcessedCrashCounts\");\n  histogram_tester.ExpectTotalCount(\n      \"Memory.Experimental.Renderer.TotalMemoryAfterOOM\", 0);\n  histogram_tester.ExpectTotalCount(\n      \"Stability.Android.KillSpareRendererAvailability.OOM\", 0);\n}\n\nTEST_F(CrashMetricsReporterTest, RemovedObserverDoesNotReceiveDeferredNotification) {\n  ChildExitObserver::TerminationInfo info;\n  info.process_host_id = 75;\n  info.process_type = content::PROCESS_TYPE_UTILITY;\n  info.app_state = base::android::APPLICATION_STATE_HAS_RUNNING_ACTIVITIES;\n  info.normal_termination = true;\n  CrashMetricsReporterObserver observer;\n  auto* reporter = CrashMetricsReporter::GetInstance();\n  reporter->AddObserver(&observer);\n  reporter->ChildProcessExited(info);\n  reporter->RemoveObserver(&observer);\n  base::RunLoop().RunUntilIdle();\n  EXPECT_EQ(0, observer.callback_count());\n  EXPECT_EQ(-1, observer.process_host_id());\n}\n\n"
