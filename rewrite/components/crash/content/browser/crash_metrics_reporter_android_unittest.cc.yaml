# Android keeps local crash diagnostics without uploader implementations.
substitutions:
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ recorded_crash_types_\ =\ reported_counts;\

      '
    replace: "    ++callback_count_;\n    process_host_id_ = rph_id;\n    recorded_crash_types_ = reported_counts;\n"
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ void\ WaitForProcessed\(\)\ \{\ wait_run_loop_\.Run\(\);\ \}\

      '
    replace: "  void WaitForProcessed() { wait_run_loop_.Run(); }\n  int callback_count() const { return callback_count_; }\n  int process_host_id() const { return process_host_id_; }\n"
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ base::RunLoop\ wait_run_loop_;\

      '
    replace: "  int callback_count_ = 0;\n  int process_host_id_ = -1;\n  base::RunLoop wait_run_loop_;\n"
- description: Exclude Android crash reporting implementation
  regex:
    re_pattern: '\ \ \ \ \ \ histogram_tester\.ExpectUniqueSample\(\

      \ \ \ \ \ \ \ \ \ \ histogram_name,\ CrashMetricsReporter::EMPTY_MINIDUMP_WHILE_RUNNING,\

      \ \ \ \ \ \ \ \ \ \ 1\);\

      '
    replace: '      histogram_tester.ExpectTotalCount(histogram_name, 0);

      '
- description: Replace uploader-specific histogram tests with real local classifications and observer lifetime regressions
