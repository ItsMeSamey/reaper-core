substitutions:
- description: "Preserve reviewed Android source projection for components/metrics_services_manager/metrics_services_manager.h (operation 1)."
  regex:
    re_pattern: '\ \ //\ yet\.\

      \ \ variations::SyntheticTrialRegistry\*\ GetSyntheticTrialRegistry\(\);\

      \

      \ \ //\ Returns\ the\ MetricsService,\ creating\ it\ if\ it\ hasn''t\ been\ created\ yet\ \(and\

      \ \ //\ additionally\ creating\ the\ MetricsServiceClient\ in\ that\ case\)\.\

      \ \ metrics::MetricsService\*\ GetMetricsService\(\);\

      '
    replace: "  // yet.\n  variations::SyntheticTrialRegistry* GetSyntheticTrialRegistry();\n\n  // These service getters return nullptr on Android, where their collector\n  // and reporting implementations are omitted from the build.\n  //\n  // Returns the MetricsService, creating it if it hasn't been created yet (and\n  // additionally creating the MetricsServiceClient in that case).\n  metrics::MetricsService* GetMetricsService();\n"
- description: "Preserve reviewed Android source projection for components/metrics_services_manager/metrics_services_manager.h (operation 2)."
  regex:
    re_pattern: '\ \ //\ Returns\ true\ iff\ DWA\ is\ allowed\ for\ all\ profiles\.\

      \ \ bool\ IsDwaAllowedForAllProfiles\(\);\

      \

      \ \ //\ Returns\ a\ low\ entropy\ provider\.\

      \ \ std::unique_ptr<const\ variations::EntropyProviders>\

      \ \ CreateEntropyProvidersForTesting\(\);\

      '
    replace: "  // Returns true iff DWA is allowed for all profiles.\n  bool IsDwaAllowedForAllProfiles();\n\n  // Local crash recovery and variations safe mode use the existing beacon\n  // independently of remote metrics services.\n  bool WasLastShutdownClean() const;\n  void LogHasSessionShutdownCleanly(bool clean);\n\n  // Returns a low entropy provider.\n  std::unique_ptr<const variations::EntropyProviders>\n  CreateEntropyProvidersForTesting();\n"
- description: "Preserve reviewed Android source projection for components/metrics_services_manager/metrics_services_manager.h (operation 3)."
  regex:
    re_pattern: '\ \ //\ Called\ when\ loading\ state\ changed\.\

      \ \ void\ LoadingStateChanged\(bool\ is_loading\);\

      \

      \

      \ \ //\ Used\ by\ \|GetOnRendererUnresponsiveCb\|\ to\ construct\ the\ callback\ that\ will\

      \ \ //\ be\ run\ by\ \|MetricsServicesWebContentsObserver\|\.\

      \ \ void\ OnRendererUnresponsive\(\);\

      \

      \ \ //\ The\ client\ passed\ in\ from\ the\ embedder\.\

      \ \ const\ std::unique_ptr<MetricsServicesManagerClient>\ client_;\

      \

      \

      \ \ //\ Ensures\ that\ all\ functions\ are\ called\ from\ the\ same\ thread\.\

      \ \ base::ThreadChecker\ thread_checker_;\

      '
    replace: "  // Called when loading state changed.\n  void LoadingStateChanged(bool is_loading);\n\n  // Used by |GetOnRendererUnresponsiveCb| to construct the callback that will\n  // be run by |MetricsServicesWebContentsObserver|.\n  void OnRendererUnresponsive();\n\n  // The client passed in from the embedder.\n  const std::unique_ptr<MetricsServicesManagerClient> client_;\n\n  // Ensures that all functions are called from the same thread.\n  base::ThreadChecker thread_checker_;\n"
