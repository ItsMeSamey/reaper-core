substitutions:
- description: Include explicit platform guard for the dedicated pass-consent method
  regex:
    pattern: '#include "components/sync/model/data_type_sync_bridge.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/sync/model/data_type_sync_bridge.h"

      '
  count: 1
- description: Compile out the dedicated wallet-private-pass consent method on Android; preserve generic consent and Sync
  regex:
    pattern: "void ConsentAuditorImpl::RecordWalletPrivatePassConsent(\n    const GaiaId& gaia_id,\n    const SessionId& session_id,\n\
      \    const sync_pb::UserConsentTypes::WalletPrivatePassConsent& consent) {\n  std::unique_ptr<sync_pb::UserConsentSpecifics>\
      \ specifics =\n      CreateUserConsentSpecifics(gaia_id, app_locale_, clock_, session_id);\n  specifics->mutable_wallet_private_pass_consent()->CopyFrom(consent);\n\
      \  consent_sync_bridge_->RecordConsent(std::move(specifics));\n}\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid ConsentAuditorImpl::RecordWalletPrivatePassConsent(\n    const GaiaId& gaia_id,\n\
      \    const SessionId& session_id,\n    const sync_pb::UserConsentTypes::WalletPrivatePassConsent& consent) {\n  std::unique_ptr<sync_pb::UserConsentSpecifics>\
      \ specifics =\n      CreateUserConsentSpecifics(gaia_id, app_locale_, clock_, session_id);\n  specifics->mutable_wallet_private_pass_consent()->CopyFrom(consent);\n\
      \  consent_sync_bridge_->RecordConsent(std::move(specifics));\n}\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
