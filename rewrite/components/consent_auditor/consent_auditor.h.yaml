substitutions:
- description: Include explicit platform guard for the dedicated pass-consent method
  regex:
    pattern: '#include "base/uuid.h"

      '
    replace: '#include "base/uuid.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Compile out the dedicated wallet-private-pass consent method on Android; preserve generic consent and Sync
  regex:
    pattern: "  // Records the Wallet Private Pass `consent` for the signed-in GAIA\n  // account with the ID `gaia_id` (as\
      \ defined in Account Info).\n  // The `session_id` is associated with the consent.\n  virtual void RecordWalletPrivatePassConsent(\n\
      \      const GaiaId& gaia_id,\n      const SessionId& session_id,\n      const sync_pb::UserConsentTypes::WalletPrivatePassConsent&\
      \ consent) = 0;\n\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Records the Wallet Private Pass `consent` for the signed-in GAIA\n  // account\
      \ with the ID `gaia_id` (as defined in Account Info).\n  // The `session_id` is associated with the consent.\n  virtual\
      \ void RecordWalletPrivatePassConsent(\n      const GaiaId& gaia_id,\n      const SessionId& session_id,\n      const\
      \ sync_pb::UserConsentTypes::WalletPrivatePassConsent& consent) = 0;\n\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
