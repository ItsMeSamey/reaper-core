substitutions:
- description: Include explicit platform guard for the dedicated pass-consent method
  regex:
    pattern: '#include "base/time/clock.h"

      '
    replace: '#include "base/time/clock.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Compile out the dedicated wallet-private-pass consent method on Android; preserve generic consent and Sync
  regex:
    pattern: "  void RecordWalletPrivatePassConsent(\n      const GaiaId& gaia_id,\n      const SessionId& session_id,\n \
      \     const sync_pb::UserConsentTypes::WalletPrivatePassConsent& consent)\n      override;\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void RecordWalletPrivatePassConsent(\n      const GaiaId& gaia_id,\n      const\
      \ SessionId& session_id,\n      const sync_pb::UserConsentTypes::WalletPrivatePassConsent& consent)\n      override;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
