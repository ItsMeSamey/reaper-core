substitutions:
- description: Include explicit platform guard for the dedicated pass-consent method
  regex:
    pattern: '#include "components/consent_auditor/consent_auditor.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/consent_auditor/consent_auditor.h"

      '
  count: 1
- description: Compile out the dedicated wallet-private-pass consent method on Android; preserve generic consent and Sync
  regex:
    pattern: "  MOCK_METHOD(void,\n              RecordWalletPrivatePassConsent,\n              (const GaiaId&,\n        \
      \       const SessionId&,\n               const sync_pb::UserConsentTypes::WalletPrivatePassConsent&));\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  MOCK_METHOD(void,\n              RecordWalletPrivatePassConsent,\n           \
      \   (const GaiaId&,\n               const SessionId&,\n               const sync_pb::UserConsentTypes::WalletPrivatePassConsent&));\n\
      #endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
