- description: Omit Android report-only challenge result/UMA processing
  regex:
    pattern: "void CloudPolicyClient::OnGenerateChromeProfileChallengeCompleted(\n    GenerateChromeProfileChallengeCallback\
      \ callback,\n    DMServerJobResult result) {\n  if (result.dm_status == DM_STATUS_SUCCESS &&\n      !result.response.has_generate_chrome_profile_challenge_response())\
      \ {\n    result.dm_status = DM_STATUS_RESPONSE_DECODING_ERROR;\n  }\n\n  base::UmaHistogramSparse(\"Enterprise.GenerateChromeProfileChallenge.Status\"\
      ,\n                           result.dm_status);\n\n  last_dm_status_ = result.dm_status;\n  if (last_dm_status_ !=\
      \ DM_STATUS_SUCCESS) {\n    NotifyClientError();\n  }\n\n  RemoveJob(result.job);\n\n  std::move(callback).Run(\n  \
      \    last_dm_status_,\n      result.response.generate_chrome_profile_challenge_response());\n}\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid CloudPolicyClient::OnGenerateChromeProfileChallengeCompleted(\n    GenerateChromeProfileChallengeCallback\
      \ callback,\n    DMServerJobResult result) {\n  if (result.dm_status == DM_STATUS_SUCCESS &&\n      !result.response.has_generate_chrome_profile_challenge_response())\
      \ {\n    result.dm_status = DM_STATUS_RESPONSE_DECODING_ERROR;\n  }\n\n  base::UmaHistogramSparse(\"Enterprise.GenerateChromeProfileChallenge.Status\"\
      ,\n                           result.dm_status);\n\n  last_dm_status_ = result.dm_status;\n  if (last_dm_status_ !=\
      \ DM_STATUS_SUCCESS) {\n    NotifyClientError();\n  }\n\n  RemoveJob(result.job);\n\n  std::move(callback).Run(\n  \
      \    last_dm_status_,\n      result.response.generate_chrome_profile_challenge_response());\n}\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
