substitutions:
- description: Omit matching Android report challenge callback implementation declaration
  regex:
    pattern: "  void OnGenerateChromeProfileChallengeCompleted(\n      GenerateChromeProfileChallengeCallback callback,\n\
      \      DMServerJobResult result);\n"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void OnGenerateChromeProfileChallengeCompleted(\n      GenerateChromeProfileChallengeCallback\
      \ callback,\n      DMServerJobResult result);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
  count: 1
- description: Own direct Android platform buildflag provider
  regex:
    pattern: '#include "base/values.h"

      '
    replace: '#include "base/values.h"

      #include "build/build_config.h"

      '
  count: 1
- description: "Android enterprise promotional implementation compile-out; preserve ordinary policy/CWS state (1)"
  count: 1
  regex:
    pattern: "  // policy client and notify observers.\n  void UpdateServiceAccount(const std::string& account_email);\n\n  virtual void DeterminePromotionEligibility(\n      PromotionEligibilityCallback callback);\n\n  virtual void GenerateChromeProfileChallenge(\n      GenerateChromeProfileChallengeCallback callback);\n"
    replace: "  // policy client and notify observers.\n  void UpdateServiceAccount(const std::string& account_email);\n\n#if !BUILDFLAG(IS_ANDROID)\n  virtual void DeterminePromotionEligibility(\n      PromotionEligibilityCallback callback);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n  virtual void GenerateChromeProfileChallenge(\n      GenerateChromeProfileChallengeCallback callback);\n"
- description: "Android enterprise promotional implementation compile-out; preserve ordinary policy/CWS state (2)"
  count: 1
  regex:
    pattern: "      ClientCertProvisioningRequestCallback callback,\n      DMServerJobResult result);\n\n  void OnPromotionEligibilityDetermined(PromotionEligibilityCallback callback,\n                                        DMServerJobResult result);\n\n#if !BUILDFLAG(IS_ANDROID)\n  void OnGenerateChromeProfileChallengeCompleted(\n"
    replace: "      ClientCertProvisioningRequestCallback callback,\n      DMServerJobResult result);\n\n#if !BUILDFLAG(IS_ANDROID)\n  void OnPromotionEligibilityDetermined(PromotionEligibilityCallback callback,\n                                        DMServerJobResult result);\n#endif  // !BUILDFLAG(IS_ANDROID)\n\n#if !BUILDFLAG(IS_ANDROID)\n  void OnGenerateChromeProfileChallengeCompleted(\n"
