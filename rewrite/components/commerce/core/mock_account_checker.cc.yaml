substitutions:
- description: Include owning platform macro declaration for Android mock-pref closure
  regex:
    pattern: '#include "components/commerce/core/pref_names.h"

      '
    replace: '#include "build/build_config.h"

      #include "components/commerce/core/pref_names.h"

      '
  count: 1
- description: Compile dedicated AI policy header dependency out of Android commerce test support
  regex:
    pattern: '#include "components/optimization_guide/core/feature_registry/feature_registration.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/feature_registry/feature_registration.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Retain ordinary commerce pref registration and exclude only removed ProductSpecifications AI-policy test pref
    on Android
  regex:
    pattern: "  registry->RegisterIntegerPref(\n      optimization_guide::prefs::kProductSpecificationsEnterprisePolicyAllowed,\n\
      \      0);"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  registry->RegisterIntegerPref(\n      optimization_guide::prefs::kProductSpecificationsEnterprisePolicyAllowed,\n\
      \      0);\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
