substitutions:
- description: Include owning platform macro declaration for the Android dependency cut
  regex:
    pattern: '#include "base/feature_list.h"

      '
    replace: '#include "base/feature_list.h"

      #include "build/build_config.h"

      '
  count: 1
- description: Exclude unused AI registration header on Android without changing commerce helper bodies
  regex:
    pattern: '#include "components/optimization_guide/core/feature_registry/feature_registration.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/optimization_guide/core/feature_registry/feature_registration.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
