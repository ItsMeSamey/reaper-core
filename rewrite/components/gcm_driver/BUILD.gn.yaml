# Android extension-only native GCM integration.
substitutions:
- description: Admit a separate native extension GCM driver without replacing platform GCM
  regex:
    re_pattern: import\("//components/gcm_driver/config\.gni"\)
    replace: 'import("//components/gcm_driver/config.gni")

      import("//extensions/buildflags/buildflags.gni")'
- description: Co-build native registration and receive client only for Android extensions
  regex:
    re_pattern: '\ \ if\ \(use_gcm_from_platform\)\ \{\

      \ \ \ \ assert\(is_android\)'
    replace: "  # Keep Android Web Push/InstanceID on their platform backend. Only the\n  # extension registration/receive service additionally uses the native client.\n  if (use_gcm_from_platform && is_android && enable_desktop_android_extensions) {\n    sources += [\n      \"gcm_account_mapper.cc\",\n      \"gcm_account_mapper.h\",\n      \"gcm_client_factory.cc\",\n      \"gcm_client_factory.h\",\n      \"gcm_client_impl.cc\",\n      \"gcm_client_impl.h\",\n      \"gcm_desktop_utils.cc\",\n      \"gcm_desktop_utils.h\",\n      \"gcm_driver_desktop.cc\",\n      \"gcm_driver_desktop.h\",\n      \"gcm_stats_recorder_impl.cc\",\n      \"gcm_stats_recorder_impl.h\",\n    ]\n  }\n\n  if (use_gcm_from_platform) {\n    assert(is_android)"
