# Finish unsupported Android GCM sends with the existing API error.
substitutions:
- description: Complete unsupported Android upstream sends and release their callbacks
  regex:
    re_pattern: 'void\ GCMDriverAndroid::SendImpl\(const\ std::string\&\ app_id,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::string\&\ receiver_id,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ OutgoingMessage\&\ message\)\ \{\

      \ \ NOTIMPLEMENTED\(\);\

      \}'
    replace: "void GCMDriverAndroid::SendImpl(const std::string& app_id,\n                                const std::string& receiver_id,\n                                const OutgoingMessage& message) {\n  // Android has no upstream GCM sending backend. Complete through the normal\n  // error path so callers do not retain a pending request indefinitely.\n  SendFinished(app_id, message.id, GCMClient::UNKNOWN_ERROR);\n}"
