# Android split pane request ownership and dialog placement.
substitutions:
- description: Pass the actual parent document before the JavaScript dialog can be shown
  regex:
    re_pattern: '\ \ dialog_jobject_\.Reset\(dialog_object\);\

      \}'
    replace: "  dialog_jobject_.Reset(dialog_object);\n  Java_JavascriptTabModalDialog_setDialogOwner(\n      env, dialog_jobject_, parent_web_contents->GetJavaWebContents());\n}"
