# Android split pane request ownership and dialog placement.
substitutions:
- description: Allow tab JavaScript dialogs to retain their own requester
  regex:
    re_pattern: '\ \ \ \ /\*\*\

      \ \ \ \ \ \*\ Showing\ a\ modal\ dialog\ for\ a\ JavaScript\ popup\ with\ the\ specified\ dialog\ type\.'
    replace: "    /** Returns an opaque tab identity only for a tab-scoped JavaScript dialog. */\n    protected @Nullable Object getDialogOwner() {\n        return null;\n    }\n\n    /**\n     * Showing a modal dialog for a JavaScript popup with the specified dialog type."
- description: Keep requester identity while the dialog is queued
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \.with\(ModalDialogProperties\.CONTROLLER,\ this\)\

      '
    replace: "                        .with(ModalDialogProperties.CONTROLLER, this)\n                        .with(ModalDialogProperties.TAB_MODAL_OWNER, getDialogOwner())\n"
