# Android split pane request ownership and dialog placement.
substitutions:
- description: Retain the actual parent WebContents as opaque dialog metadata
  regex:
    re_pattern: \ \ \ \ private\ long\ mNativeDialogPointer;
    replace: "    private long mNativeDialogPointer;\n    private @Nullable Object mDialogOwner;\n\n    @CalledByNative\n    private void setDialogOwner(Object owner) {\n        mDialogOwner = owner;\n    }\n\n    @Override\n    protected @Nullable Object getDialogOwner() {\n        return mDialogOwner;\n    }"
