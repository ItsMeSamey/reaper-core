substitutions:
- description: Android offline aggregate query teardown and regression coverage (1).
  regex:
    re_pattern: '\#include\ "components/offline_items_collection/core/offline_content_aggregator\.h"\

      \

      \#include\ <map>\

      \

      \#include\ "base/functional/bind\.h"\

      \#include\ "base/task/single_thread_task_runner\.h"\

      '
    replace: '#include "components/offline_items_collection/core/offline_content_aggregator.h"


      #include <map>

      #include <memory>

      #include <utility>


      #include "base/functional/bind.h"

      #include "base/task/single_thread_task_runner.h"

      '
- description: Android offline aggregate query teardown and regression coverage (2).
  regex:
    re_pattern: '\ \ void\ RunCallback\(const\ OfflineItemList\&\ items\)\ \{\

      \ \ \ \ std::move\(callback_\)\.Run\(items\);\

      \ \ \}\

      \

      \ private:\

      \ \ MultipleItemCallback\ callback_;\

      '
    replace: "  void RunCallback(const OfflineItemList& items) {\n    std::move(callback_).Run(items);\n  }\n\n#if BUILDFLAG(IS_ANDROID)\n  MultipleItemCallback TakeCallback() { return std::move(callback_); }\n  void UnregisterForTesting() { Unregister(); }\n#endif\n\n private:\n  MultipleItemCallback callback_;\n"
- description: Android offline aggregate query teardown and regression coverage (3).
  regex:
    re_pattern: '\ \ EXPECT_FALSE\(provider\.HasObserver\(\&aggregator_\)\);\

      \}\

      \

      //\ Tests\ that\ if\ the\ aggregator\ is\ in\ the\ mid\ of\ GetAllItems\(\)\ call\ and\ is\

      //\ waiting\ from\ multiple\ providers,\ it\ will\ remove\ deleted\ items\ from\ its\

      //\ response\ when\ notified\.\

      '
    replace: "  EXPECT_FALSE(provider.HasObserver(&aggregator_));\n}\n\n#if BUILDFLAG(IS_ANDROID)\nTEST_F(OfflineContentAggregatorTest,\n       DestroyingLastPendingProviderCompletesQueuedQueries) {\n  ScopedMockOfflineContentProvider provider1(\"1\", &aggregator_);\n  auto provider2 = std::make_unique<DelayedGetAllItemOfflineContentProvider>(\n      \"2\", &aggregator_);\n  const OfflineContentProvider::OfflineItemList items = {\n      OfflineItem(ContentId(\"1\", \"A\"))};\n  provider1.SetItems(items);\n\n  int completions = 0;\n  auto on_items = [&](const OfflineContentProvider::OfflineItemList& actual) {\n    EXPECT_EQ(items, actual);\n    ++completions;\n  };\n  aggregator_.GetAllItems(base::BindLambdaForTesting(on_items));\n  aggregator_.GetAllItems(base::BindLambdaForTesting(on_items));\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(0, completions);\n\n  provider2.reset();\n  EXPECT_EQ(0, completions);  // Unregistration must not respond synchronously.\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(2, completions);\n\n  aggregator_.GetAllItems(base::BindLambdaForTesting(on_items));\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(3, completions);\n}\n\nTEST_F(OfflineContentAggregatorTest,\n       ItemRemovedAfterFinalUnregisterBeforeQueuedCompletion) {\n  ScopedMockOfflineContentProvider provider1(\"1\", &aggregator_);\n  auto provider2 = std::make_unique<DelayedGetAllItemOfflineContentProvider>(\n      \"2\", &aggregator_);\n  const ContentId id(\"1\", \"A\");\n  provider1.SetItems({OfflineItem(id)});\n  int completions = 0;\n  aggregator_.GetAllItems(base::BindLambdaForTesting(\n      [&](const OfflineContentProvider::OfflineItemList& items) {\n        EXPECT_TRUE(items.empty());\n        ++completions;\n      }));\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(0, completions);\n\n  provider2.reset();\n  provider1.NotifyOnItemRemoved(id);\n  EXPECT_EQ(0, completions);\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(1, completions);\n}\n\nTEST_F(OfflineContentAggregatorTest,\n       ItemUpdatedAfterFinalUnregisterBeforeQueuedCompletion) {\n  ScopedMockOfflineContentProvider provider1(\"1\", &aggregator_);\n  auto provider2 = std::make_unique<DelayedGetAllItemOfflineContentProvider>(\n      \"2\", &aggregator_);\n  OfflineItem item(ContentId(\"1\", \"A\"));\n  item.title = \"before\";\n  provider1.SetItems({item});\n  int completions = 0;\n  aggregator_.GetAllItems(base::BindLambdaForTesting(\n      [&](const OfflineContentProvider::OfflineItemList& items) {\n        ASSERT_EQ(1u, items.size());\n        EXPECT_EQ(\"after\", items[0].title);\n        ++completions;\n      }));\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(0, completions);\n\n  provider2.reset();\n  item.title = \"after\";\n  provider1.NotifyOnItemUpdated(item, std::nullopt);\n  EXPECT_EQ(0, completions);\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(1, completions);\n}\n\nTEST_F(OfflineContentAggregatorTest,\n       RemovedProviderReplyDoesNotCompleteAnotherPendingProvider) {\n  DelayedGetAllItemOfflineContentProvider removed(\"1\", &aggregator_);\n  DelayedGetAllItemOfflineContentProvider remaining(\"2\", &aggregator_);\n  const OfflineContentProvider::OfflineItemList items = {\n      OfflineItem(ContentId(\"2\", \"B\"))};\n  int completions = 0;\n  aggregator_.GetAllItems(base::BindLambdaForTesting(\n      [&](const OfflineContentProvider::OfflineItemList& actual) {\n        EXPECT_EQ(items, actual);\n        ++completions;\n      }));\n\n  removed.UnregisterForTesting();\n  removed.RunCallback({OfflineItem(ContentId(\"1\", \"removed\"))});\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(0, completions);\n  remaining.RunCallback(items);\n  EXPECT_EQ(1, completions);\n}\n\nTEST_F(OfflineContentAggregatorTest,\n       RemovedProviderOldReplyCannotCompleteReregisteredProviderQuery) {\n  DelayedGetAllItemOfflineContentProvider provider(\"1\", &aggregator_);\n  int completions = 0;\n  aggregator_.GetAllItems(base::BindLambdaForTesting(\n      [&](const OfflineContentProvider::OfflineItemList& items) {\n        EXPECT_TRUE(items.empty());\n        ++completions;\n      }));\n  auto old_callback = provider.TakeCallback();\n  provider.UnregisterForTesting();\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(1, completions);\n\n  aggregator_.RegisterProvider(\"1\", &provider);\n  const OfflineContentProvider::OfflineItemList current = {\n      OfflineItem(ContentId(\"1\", \"current\"))};\n  aggregator_.GetAllItems(base::BindLambdaForTesting(\n      [&](const OfflineContentProvider::OfflineItemList& items) {\n        EXPECT_EQ(current, items);\n        ++completions;\n      }));\n  std::move(old_callback).Run({OfflineItem(ContentId(\"1\", \"stale\"))});\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(1, completions);\n  provider.RunCallback(current);\n  EXPECT_EQ(2, completions);\n  aggregator_.UnregisterProvider(\"1\");\n}\n\nTEST_F(OfflineContentAggregatorTest,\n       RemovingOneNamespaceKeepsSharedProviderPending) {\n  DelayedGetAllItemOfflineContentProvider shared(\"1\", &aggregator_);\n  DelayedGetAllItemOfflineContentProvider other(\"2\", &aggregator_);\n  aggregator_.RegisterProvider(\"alias\", &shared);\n  const OfflineContentProvider::OfflineItemList shared_items = {\n      OfflineItem(ContentId(\"1\", \"A\"))};\n  const OfflineContentProvider::OfflineItemList other_items = {\n      OfflineItem(ContentId(\"2\", \"B\"))};\n  const OfflineContentProvider::OfflineItemList expected = {other_items[0],\n                                                          shared_items[0]};\n  int completions = 0;\n  aggregator_.GetAllItems(base::BindLambdaForTesting(\n      [&](const OfflineContentProvider::OfflineItemList& items) {\n        EXPECT_EQ(expected, items);\n        ++completions;\n      }));\n\n  aggregator_.UnregisterProvider(\"alias\");\n  other.RunCallback(other_items);\n  task_runner_->RunUntilIdle();\n  EXPECT_EQ(0, completions);\n  shared.RunCallback(shared_items);\n  EXPECT_EQ(1, completions);\n}\n#endif  // BUILDFLAG(IS_ANDROID)\n\n// Tests that if the aggregator is in the mid of GetAllItems() call and is\n// waiting from multiple providers, it will remove deleted items from its\n// response when notified.\n"
