substitutions:
- description: Android offline aggregate query teardown and regression coverage (1).
  regex:
    re_pattern: '\#include\ "base/memory/weak_ptr\.h"\

      \#include\ "base/sequence_checker\.h"\

      \#include\ "base/supports_user_data\.h"\

      \#include\ "components/keyed_service/core/keyed_service\.h"\

      \#include\ "components/offline_items_collection/core/offline_content_provider\.h"\

      \

      '
    replace: '#include "base/memory/weak_ptr.h"

      #include "base/sequence_checker.h"

      #include "base/supports_user_data.h"

      #include "build/build_config.h"

      #include "components/keyed_service/core/keyed_service.h"

      #include "components/offline_items_collection/core/offline_content_provider.h"


      '
- description: Android offline aggregate query teardown and regression coverage (2).
  regex:
    re_pattern: '\

      \ \ void\ OnGetAllItemsDone\(OfflineContentProvider\*\ provider,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ OfflineItemList\&\ items\);\

      \ \ void\ OnGetItemByIdDone\(SingleItemCallback\ callback,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ const\ std::optional<OfflineItem>\&\ item\);\

      \

      '
    replace: "\n  void OnGetAllItemsDone(OfflineContentProvider* provider,\n                         const OfflineItemList& items);\n  void CompleteGetAllItems();\n  void OnGetItemByIdDone(SingleItemCallback callback,\n                         const std::optional<OfflineItem>& item);\n\n"
- description: Android offline aggregate query teardown and regression coverage (3).
  regex:
    re_pattern: '\ \ SEQUENCE_CHECKER\(sequence_checker_\);\

      \

      \ \ base::WeakPtrFactory<OfflineContentAggregator>\ weak_ptr_factory_\{this\};\

      \};\

      \

      \}\ \ //\ namespace\ offline_items_collection\

      '
    replace: "  SEQUENCE_CHECKER(sequence_checker_);\n\n  base::WeakPtrFactory<OfflineContentAggregator> weak_ptr_factory_{this};\n#if BUILDFLAG(IS_ANDROID)\n  base::WeakPtrFactory<OfflineContentAggregator> get_all_items_weak_ptr_factory_{\n      this};\n#endif\n};\n\n}  // namespace offline_items_collection\n"
