      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ weak_ptr_factory_\.GetWeakPtr\(\),\ provider\)\);\

      \ \ \ \ pending_providers_\.insert\(provider\);\

      \ \ \}\

      \

      \ \ if\ \(pending_providers_\.empty\(\)\)\ \{\

      '
    replace: "  for (auto provider_it : providers_) {\n    auto* provider = provider_it.second.get();\n\n#if BUILDFLAG(IS_ANDROID)\n    // Multiple namespaces can refer to the same provider. Query it once per\n    // batch, and retire all of this batch's replies together on completion.\n    if (!pending_providers_.insert(provider).second) {\n      continue;\n    }\n    provider->GetAllItems(base::BindOnce(\n        &OfflineContentAggregator::OnGetAllItemsDone,\n        get_all_items_weak_ptr_factory_.GetWeakPtr(), provider));\n#else\n    provider->GetAllItems(\n        base::BindOnce(&OfflineContentAggregator::OnGetAllItemsDone,\n                       weak_ptr_factory_.GetWeakPtr(), provider));\n    pending_providers_.insert(provider);\n#endif\n  }\n\n  if (pending_providers_.empty()) {\n"
- description: Android offline aggregate query teardown and regression coverage (3).
  regex:
    re_pattern: '\ \ \ \ OfflineContentProvider\*\ provider,\

      \ \ \ \ const\ OfflineItemList\&\ items\)\ \{\

      \ \ DCHECK_CALLED_ON_VALID_SEQUENCE\(sequence_checker_\);\

      \ \ aggregated_items_\.insert\(aggregated_items_\.end\(\),\ items\.begin\(\),\ items\.end\(\)\);\

      \ \ pending_providers_\.erase\(provider\);\

      \ \ if\ \(!pending_providers_\.empty\(\)\)\ \{\

      \ \ \ \ return;\

      \ \ \}\

      \

      \ \ auto\ item_vec\ =\ std::move\(aggregated_items_\);\

      \ \ auto\ callbacks\ =\ std::move\(multiple_item_get_callbacks_\);\

      \

      '
    replace: "    OfflineContentProvider* provider,\n    const OfflineItemList& items) {\n  DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);\n#if BUILDFLAG(IS_ANDROID)\n  // Ignore a reply from a provider removed while another provider is pending.\n  if (!pending_providers_.erase(provider)) {\n    return;\n  }\n#else\n  pending_providers_.erase(provider);\n#endif\n  aggregated_items_.insert(aggregated_items_.end(), items.begin(), items.end());\n  if (!pending_providers_.empty()) {\n    return;\n  }\n\n  CompleteGetAllItems();\n}\n\nvoid OfflineContentAggregator::CompleteGetAllItems() {\n  DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);\n#if BUILDFLAG(IS_ANDROID)\n  if (!pending_providers_.empty() || multiple_item_get_callbacks_.empty()) {\n    return;\n  }\n  // A removed provider may reply late, including after the same provider is\n  // registered again. Its old reply must never contribute to a new batch.\n  get_all_items_weak_ptr_factory_.InvalidateWeakPtrs();\n#endif\n  auto item_vec = std::move(aggregated_items_);\n  auto callbacks = std::move(multiple_item_get_callbacks_);\n\n"
