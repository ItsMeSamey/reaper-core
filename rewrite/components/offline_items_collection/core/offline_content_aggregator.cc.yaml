substitutions:
- description: Android offline aggregate query teardown and regression coverage (1).
  regex:
    re_pattern: '\

      \ \ OfflineContentProvider\*\ provider\ =\ provider_it\->second;\

      \ \ providers_\.erase\(provider_it\);\

      \ \ pending_providers_\.erase\(provider\);\

      \

      \ \ //\ Only\ clean\ up\ the\ connection\ to\ the\ provider\ if\ the\ provider\ isn''t\

      \ \ //\ associated\ with\ any\ other\ namespace\.\

      \ \ if\ \(!MapContainsValue\(providers_,\ provider\)\)\ \{\

      \ \ \ \ provider\->RemoveObserver\(this\);\

      \ \ \}\

      \}\

      \

      '
    replace: "\n  OfflineContentProvider* provider = provider_it->second;\n  providers_.erase(provider_it);\n#if !BUILDFLAG(IS_ANDROID)\n  pending_providers_.erase(provider);\n#endif\n\n  // Only clean up the connection to the provider if the provider isn't\n  // associated with any other namespace.\n  if (!MapContainsValue(providers_, provider)) {\n    provider->RemoveObserver(this);\n#if BUILDFLAG(IS_ANDROID)\n    // A provider can disappear without running its outstanding callback, e.g.\n    // when the OTR profile is destroyed while the original profile stays alive.\n    if (pending_providers_.erase(provider) && pending_providers_.empty()) {\n      base::SingleThreadTaskRunner::GetCurrentDefault()->PostTask(\n          FROM_HERE,\n          base::BindOnce(&OfflineContentAggregator::CompleteGetAllItems,\n                         get_all_items_weak_ptr_factory_.GetWeakPtr()));\n    }\n#endif\n  }\n}\n\n"
- description: Android offline aggregate query teardown and regression coverage (2).
