substitutions:
  - description: "Reviewed Android552 source 4/1: exclude demographics-only header"
    regex:
      re_pattern: "\\#include\\ \"components/metrics/demographics/user_demographics\\.h\"\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/metrics/demographics/user_demographics.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Reviewed Android552 source 4/2: exclude telemetry observer implementation without altering ordinary Sync lifecycle"
    regex:
      re_pattern: "class\\ PrefServiceSyncable::DemographicsPrefsClearer\\\n\\ \\ \\ \\ :\\ public\\ syncer::SyncServiceObserver\\ \\{\\\n\\ public:\\\n\\ \\ DemographicsPrefsClearer\\(PrefService\\*\\ pref_service,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ syncer::SyncService\\*\\ sync_service\\)\\\n\\ \\ \\ \\ \\ \\ :\\ pref_service_\\(pref_service\\)\\ \\{\\\n\\ \\ \\ \\ if\\ \\(sync_service\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ sync_observation_\\.Observe\\(sync_service\\);\\\n\\ \\ \\ \\ \\}\\\n\\ \\ \\}\\\n\\\n\\ \\ void\\ OnStateChanged\\(syncer::SyncService\\*\\ sync\\)\\ override\\ \\{\\\n\\ \\ \\ \\ switch\\ \\(sync\\->GetTransportState\\(\\)\\)\\ \\{\\\n\\ \\ \\ \\ \\ \\ case\\ syncer::SyncService::TransportState::DISABLED:\\\n\\ \\ \\ \\ \\ \\ \\ \\ metrics::ClearDemographicsPrefs\\(pref_service_\\);\\\n\\ \\ \\ \\ \\ \\ \\ \\ break;\\\n\\ \\ \\ \\ \\ \\ case\\ syncer::SyncService::TransportState::PAUSED:\\\n\\ \\ \\ \\ \\ \\ case\\ syncer::SyncService::TransportState::START_DEFERRED:\\\n\\ \\ \\ \\ \\ \\ case\\ syncer::SyncService::TransportState::INITIALIZING:\\\n\\ \\ \\ \\ \\ \\ case\\ syncer::SyncService::TransportState::PENDING_DESIRED_CONFIGURATION:\\\n\\ \\ \\ \\ \\ \\ case\\ syncer::SyncService::TransportState::CONFIGURING:\\\n\\ \\ \\ \\ \\ \\ case\\ syncer::SyncService::TransportState::ACTIVE:\\\n\\ \\ \\ \\ \\ \\ \\ \\ break;\\\n\\ \\ \\ \\ \\}\\\n\\ \\ \\}\\\n\\\n\\ \\ void\\ OnSyncShutdown\\(syncer::SyncService\\*\\ sync\\)\\ override\\ \\{\\\n\\ \\ \\ \\ sync_observation_\\.Reset\\(\\);\\\n\\ \\ \\}\\\n\\\n\\ private:\\\n\\ \\ const\\ raw_ptr<PrefService>\\ pref_service_;\\\n\\ \\ base::ScopedObservation<syncer::SyncService,\\ syncer::SyncServiceObserver>\\\n\\ \\ \\ \\ \\ \\ sync_observation_\\{this\\};\\\n\\};\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nclass PrefServiceSyncable::DemographicsPrefsClearer\n    : public syncer::SyncServiceObserver {\n public:\n  DemographicsPrefsClearer(PrefService* pref_service,\n                           syncer::SyncService* sync_service)\n      : pref_service_(pref_service) {\n    if (sync_service) {\n      sync_observation_.Observe(sync_service);\n    }\n  }\n\n  void OnStateChanged(syncer::SyncService* sync) override {\n    switch (sync->GetTransportState()) {\n      case syncer::SyncService::TransportState::DISABLED:\n        metrics::ClearDemographicsPrefs(pref_service_);\n        break;\n      case syncer::SyncService::TransportState::PAUSED:\n      case syncer::SyncService::TransportState::START_DEFERRED:\n      case syncer::SyncService::TransportState::INITIALIZING:\n      case syncer::SyncService::TransportState::PENDING_DESIRED_CONFIGURATION:\n      case syncer::SyncService::TransportState::CONFIGURING:\n      case syncer::SyncService::TransportState::ACTIVE:\n        break;\n    }\n  }\n\n  void OnSyncShutdown(syncer::SyncService* sync) override {\n    sync_observation_.Reset();\n  }\n\n private:\n  const raw_ptr<PrefService> pref_service_;\n  base::ScopedObservation<syncer::SyncService, syncer::SyncServiceObserver>\n      sync_observation_{this};\n};\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Reviewed Android552 source 4/3: exclude only demographics observer construction; retain dual-layer initialization"
    regex:
      re_pattern: "\\ \\ demographics_prefs_clearer_\\ =\\\n\\ \\ \\ \\ \\ \\ std::make_unique<DemographicsPrefsClearer>\\(this,\\ sync_service\\);\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  demographics_prefs_clearer_ =\n      std::make_unique<DemographicsPrefsClearer>(this, sync_service);\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
