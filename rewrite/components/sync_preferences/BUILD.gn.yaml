substitutions:
  - description: Add the Brave syncable prefs database public_deps.
    add_literal_to_list:
      target: common_syncable_prefs_database
      list_name: public_deps
      literal: brave_common_syncable_prefs_database_public_deps
      import: //brave/components/sync_preferences/sources.gni
  - description: "Reviewed Android552 source 3/1: remove demographics edge from ordinary Sync preferences target on Android"
    regex:
      re_pattern: "\\ \\ \\ \\ \"//components/sync\",\\\n\\ \\ \\]\\\n\\\n\\ \\ if\\ \\(is_chromeos\\)\\ \\{"
      replace: "    \"//components/sync\",\n  ]\n\n  if (is_android) {\n    deps -= [ \"//components/metrics/demographics\" ]\n  }\n\n  if (is_chromeos) {"
    count: 1
  - description: "Reviewed Android552 source 3/2: remove demographics edge from common Sync database target on Android"
    regex:
      re_pattern: "\\ \\ \\ \\ \"//components/variations/service\",\\\n\\ \\ \\]\\\n\\}\\\n\\\nstatic_library\\(\"test_support\"\\)"
      replace: "    \"//components/variations/service\",\n  ]\n\n  if (is_android) {\n    deps -= [ \"//components/metrics/demographics\" ]\n  }\n}\n\nstatic_library(\"test_support\")"
    count: 1
