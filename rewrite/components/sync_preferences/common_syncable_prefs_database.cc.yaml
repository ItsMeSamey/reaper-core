substitutions:
  - description: "Reviewed Android552 source 6/1: exclude demographics-only header"
    regex:
      re_pattern: "\\#include\\ \"components/metrics/demographics/user_demographics\\.h\"\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n#include \"components/metrics/demographics/user_demographics.h\"\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Reviewed Android552 source 6/2: exclude only demographics preference synchronization row; preserve numeric IDs and all ordinary entries"
    regex:
      re_pattern: "\\ \\ \\ \\ \\ \\ \\ \\ \\{metrics::kSyncDemographicsPrefName,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\{syncable_prefs_ids::kSyncDemographicsPrefName,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ syncer::PRIORITY_PREFERENCES,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ PrefSensitivity::kExemptFromUserControlWhileSignedIn,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ MergeBehavior::kNone\\}\\},\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n        {metrics::kSyncDemographicsPrefName,\n         {syncable_prefs_ids::kSyncDemographicsPrefName,\n          syncer::PRIORITY_PREFERENCES,\n          PrefSensitivity::kExemptFromUserControlWhileSignedIn,\n          MergeBehavior::kNone}},\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
