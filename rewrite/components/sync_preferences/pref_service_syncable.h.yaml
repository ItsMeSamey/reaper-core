substitutions:
  - description: "Reviewed Android552 source 5/1: make Android buildflag dependency explicit"
    regex:
      re_pattern: "\\#include\\ \"base/observer_list\\.h\"\\\n"
      replace: "#include \"base/observer_list.h\"\n#include \"build/build_config.h\"\n"
    count: 1
  - description: "Reviewed Android552 source 5/2: exclude Android-only-unused nested telemetry declaration"
    regex:
      re_pattern: "\\ \\ class\\ DemographicsPrefsClearer;\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  class DemographicsPrefsClearer;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
  - description: "Reviewed Android552 source 5/3: exclude owning telemetry member and incomplete-type destruction requirement"
    regex:
      re_pattern: "\\ \\ std::unique_ptr<DemographicsPrefsClearer>\\ demographics_prefs_clearer_;\\\n"
      replace: "#if !BUILDFLAG(IS_ANDROID)\n  std::unique_ptr<DemographicsPrefsClearer> demographics_prefs_clearer_;\n#endif  // !BUILDFLAG(IS_ANDROID)\n"
    count: 1
