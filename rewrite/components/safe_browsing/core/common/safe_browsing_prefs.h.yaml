substitutions:
- description: Use direct Android platform guard
  regex:
    pattern: '#include "base/values.h"

      '
    replace: '#include "base/values.h"


      #include "build/build_config.h"

      '
  count: 1
- description: Exclude the dedicated Android survey preference name
  regex:
    pattern: "// Boolean indicating whether users can receive surveys.\ninline constexpr char kSafeBrowsingSurveysEnabled[]\
      \ =\n    \"safebrowsing.surveys_enabled\";"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Boolean indicating whether users can receive surveys.\ninline constexpr char\
      \ kSafeBrowsingSurveysEnabled[] =\n    \"safebrowsing.surveys_enabled\";\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Match Android-excluded survey preference query
  regex:
    pattern: '// Returns whether a user can receive HaTS surveys.

      bool IsSafeBrowsingSurveysEnabled(const PrefService& prefs);'
    replace: '#if !BUILDFLAG(IS_ANDROID)

      // Returns whether a user can receive HaTS surveys.

      bool IsSafeBrowsingSurveysEnabled(const PrefService& prefs);

      #endif  // !BUILDFLAG(IS_ANDROID)'
  count: 1
