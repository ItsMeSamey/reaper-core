substitutions:
  - description: 'Ship kAntivirusTelemetryForDownloads disabled.'
    set_feature_flag_default_state:
      feature_name: kAntivirusTelemetryForDownloads
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: |
      Ship kClientSideDetectionClipboardCopyApi disabled.

      Upstream now guards the default state with an
      `#if BUILDFLAG(IS_IOS) || BUILDFLAG(IS_ANDROID)` conditional, a shape
      `set_feature_flag_default_state` cannot parse, so this is a plain regex
      replacement instead.
    regex:
      pattern: |-
        BASE_FEATURE(kClientSideDetectionClipboardCopyApi,
        #if BUILDFLAG(IS_IOS) || BUILDFLAG(IS_ANDROID)
                     base::FEATURE_DISABLED_BY_DEFAULT);
        #else
                     base::FEATURE_ENABLED_BY_DEFAULT);
        #endif
      replace: |-
        // kClientSideDetectionClipboardCopyApi feature state is enforced via plaster rewrite.
        BASE_FEATURE(kClientSideDetectionClipboardCopyApi,
                     base::FEATURE_DISABLED_BY_DEFAULT);

  - description: 'Ship kGooglePlayProtectInApkTelemetry disabled.'
    set_feature_flag_default_state:
      feature_name: kGooglePlayProtectInApkTelemetry
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kNotificationTelemetry disabled.'
    set_feature_flag_default_state:
      feature_name: kNotificationTelemetry
      value: base::FEATURE_DISABLED_BY_DEFAULT
  - description: Exclude Android survey-only native feature and trigger descriptors
    regex:
      pattern: "BASE_FEATURE(kRedWarningSurvey, base::FEATURE_DISABLED_BY_DEFAULT);\nconstexpr base::FeatureParam<std::string>\
        \ kRedWarningSurveyTriggerId{\n    &kRedWarningSurvey, \"RedWarningSurveyTriggerId\", /*default_value=*/\"\"};\nconstexpr\
        \ base::FeatureParam<std::string> kRedWarningSurveyReportTypeFilter{\n    &kRedWarningSurvey, \"RedWarningSurveyReportTypeFilter\"\
        ,\n    /*default_value=*/\n    \"URL_PHISHING,URL_MALWARE,URL_UNWANTED,URL_CLIENT_SIDE_PHISHING\"};\nconstexpr base::FeatureParam<std::string>\
        \ kRedWarningSurveyDidProceedFilter{\n    &kRedWarningSurvey, \"RedWarningSurveyDidProceedFilter\",\n    /*default_value=*/\"\
        TRUE,FALSE\"};\n\nBASE_FEATURE(kRedWarningSurveyAndroid, base::FEATURE_DISABLED_BY_DEFAULT);\nconstexpr base::FeatureParam<std::string>\
        \ kRedWarningSurveyAndroidTriggerId{\n    &kRedWarningSurveyAndroid, \"RedWarningSurveyAndroidTriggerId\",\n    /*default_value=*/\"\
        \"};\nconstexpr base::FeatureParam<std::string>\n    kRedWarningSurveyAndroidProceedTriggerId{\n        &kRedWarningSurveyAndroid,\
        \ \"RedWarningSurveyAndroidProceedTriggerId\",\n        /*default_value=*/\"\"};\nconstexpr base::FeatureParam<std::string>\
        \ kRedWarningSurveyAndroidHeedTriggerId{\n    &kRedWarningSurveyAndroid, \"RedWarningSurveyAndroidHeedTriggerId\",\n\
        \    /*default_value=*/\"\"};"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nBASE_FEATURE(kRedWarningSurvey, base::FEATURE_DISABLED_BY_DEFAULT);\nconstexpr base::FeatureParam<std::string>\
        \ kRedWarningSurveyTriggerId{\n    &kRedWarningSurvey, \"RedWarningSurveyTriggerId\", /*default_value=*/\"\"};\nconstexpr\
        \ base::FeatureParam<std::string> kRedWarningSurveyReportTypeFilter{\n    &kRedWarningSurvey, \"RedWarningSurveyReportTypeFilter\"\
        ,\n    /*default_value=*/\n    \"URL_PHISHING,URL_MALWARE,URL_UNWANTED,URL_CLIENT_SIDE_PHISHING\"};\nconstexpr base::FeatureParam<std::string>\
        \ kRedWarningSurveyDidProceedFilter{\n    &kRedWarningSurvey, \"RedWarningSurveyDidProceedFilter\",\n    /*default_value=*/\"\
        TRUE,FALSE\"};\n\nBASE_FEATURE(kRedWarningSurveyAndroid, base::FEATURE_DISABLED_BY_DEFAULT);\nconstexpr base::FeatureParam<std::string>\
        \ kRedWarningSurveyAndroidTriggerId{\n    &kRedWarningSurveyAndroid, \"RedWarningSurveyAndroidTriggerId\",\n    /*default_value=*/\"\
        \"};\nconstexpr base::FeatureParam<std::string>\n    kRedWarningSurveyAndroidProceedTriggerId{\n        &kRedWarningSurveyAndroid,\
        \ \"RedWarningSurveyAndroidProceedTriggerId\",\n        /*default_value=*/\"\"};\nconstexpr base::FeatureParam<std::string>\
        \ kRedWarningSurveyAndroidHeedTriggerId{\n    &kRedWarningSurveyAndroid, \"RedWarningSurveyAndroidHeedTriggerId\",\n\
        \    /*default_value=*/\"\"};\n#endif  // !BUILDFLAG(IS_ANDROID)"
    count: 1
  - description: Exclude Android survey-only native feature and trigger descriptors
    regex:
      pattern: "BASE_FEATURE(kSuspiciousSiteWarningSurvey, base::FEATURE_DISABLED_BY_DEFAULT);\nconstexpr base::FeatureParam<std::string>\
        \ kSuspiciousSiteWarningSurveyTriggerId{\n    &kSuspiciousSiteWarningSurvey, \"SuspiciousSiteWarningSurveyTriggerId\"\
        ,\n    /*default_value=*/\"\"};\nconstexpr base::FeatureParam<std::string>\n    kSuspiciousSiteWarningSurveyProceedTriggerId{\n\
        \        &kSuspiciousSiteWarningSurvey,\n        \"SuspiciousSiteWarningSurveyProceedTriggerId\",\n        /*default_value=*/\"\
        HguD8vrc50tK1KeaPYj0R37AzmWa\"};\nconstexpr base::FeatureParam<std::string>\n    kSuspiciousSiteWarningSurveyHeedTriggerId{\n\
        \        &kSuspiciousSiteWarningSurvey,\n        \"SuspiciousSiteWarningSurveyHeedTriggerId\",\n        /*default_value=*/\"\
        LZD24fmuf0tK1KeaPYj0Z79hw2qC\"};"
      replace: "#if !BUILDFLAG(IS_ANDROID)\nBASE_FEATURE(kSuspiciousSiteWarningSurvey, base::FEATURE_DISABLED_BY_DEFAULT);\n\
        constexpr base::FeatureParam<std::string> kSuspiciousSiteWarningSurveyTriggerId{\n    &kSuspiciousSiteWarningSurvey,\
        \ \"SuspiciousSiteWarningSurveyTriggerId\",\n    /*default_value=*/\"\"};\nconstexpr base::FeatureParam<std::string>\n\
        \    kSuspiciousSiteWarningSurveyProceedTriggerId{\n        &kSuspiciousSiteWarningSurvey,\n        \"SuspiciousSiteWarningSurveyProceedTriggerId\"\
        ,\n        /*default_value=*/\"HguD8vrc50tK1KeaPYj0R37AzmWa\"};\nconstexpr base::FeatureParam<std::string>\n    kSuspiciousSiteWarningSurveyHeedTriggerId{\n\
        \        &kSuspiciousSiteWarningSurvey,\n        \"SuspiciousSiteWarningSurveyHeedTriggerId\",\n        /*default_value=*/\"\
        LZD24fmuf0tK1KeaPYj0Z79hw2qC\"};\n#endif  // !BUILDFLAG(IS_ANDROID)"
    count: 1
