substitutions:
- description: Mechanically reproduce the reviewed source body using unique context, chunk 1
  regex:
    pattern: "}\n\nbool IsEnhancedProtectionEnabled(const PrefService& prefs) {\n  // SafeBrowsingEnabled is checked too due\
      \ to devices being out\n  // of sync or not on a version that includes SafeBrowsingEnhanced pref.\n  return prefs.GetBoolean(prefs::kSafeBrowsingEnhanced)\
      \ &&\n"
    replace: "}\n\nbool IsEnhancedProtectionEnabled(const PrefService& prefs) {\n  BRAVE_IS_ENHANCED_PROTECTION_ENABLED\n\
      \  // SafeBrowsingEnabled is checked too due to devices being out\n  // of sync or not on a version that includes SafeBrowsingEnhanced\
      \ pref.\n  return prefs.GetBoolean(prefs::kSafeBrowsingEnhanced) &&\n"
  count: 1
- description: Use direct Android platform guard
  regex:
    pattern: '#include "components/safe_browsing/core/common/safe_browsing_prefs.h"

      '
    replace: '#include "components/safe_browsing/core/common/safe_browsing_prefs.h"


      #include "build/build_config.h"

      '
  count: 1
- description: Exclude survey-only preference query from Android
  regex:
    pattern: "bool IsSafeBrowsingSurveysEnabled(const PrefService& prefs) {\n  return prefs.GetBoolean(prefs::kSafeBrowsingSurveysEnabled);\n\
      }"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nbool IsSafeBrowsingSurveysEnabled(const PrefService& prefs) {\n  return prefs.GetBoolean(prefs::kSafeBrowsingSurveysEnabled);\n\
      }\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Do not register an Android preference for the removed survey feature
  regex:
    pattern: '  registry->RegisterBooleanPref(prefs::kSafeBrowsingSurveysEnabled, true);'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  registry->RegisterBooleanPref(prefs::kSafeBrowsingSurveysEnabled, true);\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Do not list the removed Android survey preference in diagnostics
  regex:
    pattern: "  preferences_list.Append(\n      prefs->GetBoolean(prefs::kSafeBrowsingSurveysEnabled));\n  preferences_list.Append(prefs::kSafeBrowsingSurveysEnabled);"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  preferences_list.Append(\n      prefs->GetBoolean(prefs::kSafeBrowsingSurveysEnabled));\n\
      \  preferences_list.Append(prefs::kSafeBrowsingSurveysEnabled);\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
