substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "base/feature_list.h"

      #include "base/metrics/field_trial_params.h"

      '
    replace: '#include "base/feature_list.h"


      #include "build/build_config.h"

      #include "base/metrics/field_trial_params.h"

      '
  count: 1
- description: Exclude Android survey-only native feature and trigger descriptors
  regex:
    pattern: "// Enables HaTS surveys for users encountering red warnings.\nBASE_DECLARE_FEATURE(kRedWarningSurvey);\n// Specifies\
      \ whether we want to show HaTS surveys based on if the user bypassed\n// the warning or not. Note: specifying any combination\
      \ of TRUE and FALSE\n// corresponds to \"don't care.\"\nextern const base::FeatureParam<std::string> kRedWarningSurveyDidProceedFilter;\n\
      // Specifies which CSBRR report types (and thus, red warning types) we want to\n// show HaTS surveys for.\nextern const\
      \ base::FeatureParam<std::string> kRedWarningSurveyReportTypeFilter;\n// Specifies the HaTS survey's identifier.\nextern\
      \ const base::FeatureParam<std::string> kRedWarningSurveyTriggerId;\n\n// Enables HaTS surveys for Android users encountering\
      \ red warnings.\nBASE_DECLARE_FEATURE(kRedWarningSurveyAndroid);\n// Specifies the HaTS survey trigger ID for general\
      \ Android red warnings.\nextern const base::FeatureParam<std::string> kRedWarningSurveyAndroidTriggerId;\n// Specifies\
      \ the HaTS survey trigger ID for Android red warnings when the user\n// proceeded past the warning.\nextern const base::FeatureParam<std::string>\n\
      \    kRedWarningSurveyAndroidProceedTriggerId;\n// Specifies the HaTS survey trigger ID for Android red warnings when\
      \ the user\n// heeded the warning (did not proceed).\nextern const base::FeatureParam<std::string>\n    kRedWarningSurveyAndroidHeedTriggerId;"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Enables HaTS surveys for users encountering red warnings.\nBASE_DECLARE_FEATURE(kRedWarningSurvey);\n\
      // Specifies whether we want to show HaTS surveys based on if the user bypassed\n// the warning or not. Note: specifying\
      \ any combination of TRUE and FALSE\n// corresponds to \"don't care.\"\nextern const base::FeatureParam<std::string>\
      \ kRedWarningSurveyDidProceedFilter;\n// Specifies which CSBRR report types (and thus, red warning types) we want to\n\
      // show HaTS surveys for.\nextern const base::FeatureParam<std::string> kRedWarningSurveyReportTypeFilter;\n// Specifies\
      \ the HaTS survey's identifier.\nextern const base::FeatureParam<std::string> kRedWarningSurveyTriggerId;\n\n// Enables\
      \ HaTS surveys for Android users encountering red warnings.\nBASE_DECLARE_FEATURE(kRedWarningSurveyAndroid);\n// Specifies\
      \ the HaTS survey trigger ID for general Android red warnings.\nextern const base::FeatureParam<std::string> kRedWarningSurveyAndroidTriggerId;\n\
      // Specifies the HaTS survey trigger ID for Android red warnings when the user\n// proceeded past the warning.\nextern\
      \ const base::FeatureParam<std::string>\n    kRedWarningSurveyAndroidProceedTriggerId;\n// Specifies the HaTS survey\
      \ trigger ID for Android red warnings when the user\n// heeded the warning (did not proceed).\nextern const base::FeatureParam<std::string>\n\
      \    kRedWarningSurveyAndroidHeedTriggerId;\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude Android survey-only native feature and trigger descriptors
  regex:
    pattern: "// Enables HaTS surveys for users encountering suspicious site warnings.\nBASE_DECLARE_FEATURE(kSuspiciousSiteWarningSurvey);\n\
      extern const base::FeatureParam<std::string>\n    kSuspiciousSiteWarningSurveyTriggerId;\nextern const base::FeatureParam<std::string>\n\
      \    kSuspiciousSiteWarningSurveyProceedTriggerId;\nextern const base::FeatureParam<std::string>\n    kSuspiciousSiteWarningSurveyHeedTriggerId;"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n// Enables HaTS surveys for users encountering suspicious site warnings.\nBASE_DECLARE_FEATURE(kSuspiciousSiteWarningSurvey);\n\
      extern const base::FeatureParam<std::string>\n    kSuspiciousSiteWarningSurveyTriggerId;\nextern const base::FeatureParam<std::string>\n\
      \    kSuspiciousSiteWarningSurveyProceedTriggerId;\nextern const base::FeatureParam<std::string>\n    kSuspiciousSiteWarningSurveyHeedTriggerId;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
