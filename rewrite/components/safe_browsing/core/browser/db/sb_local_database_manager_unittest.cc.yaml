substitutions:
- description: Use the production extension-only factory with the existing deterministic database test runner.
  regex:
    pattern: '  void ResetSBDatabase() {'
    replace: "  void ResetExtensionOnlyDatabaseManager() {\n    StopLocalDatabaseManager();\n    sb_local_database_manager_ =\n        SBLocalDatabaseManager::CreateForExtensionBlocklist(\n            base_dir_.GetPath(), base::SequencedTaskRunner::GetCurrentDefault(),\n            base::SequencedTaskRunner::GetCurrentDefault(), erl_callback_);\n    sb_local_database_manager_->task_runner_ = task_runner_;\n    StartLocalDatabaseManager();\n    WaitForTasksOnTaskRunner();\n  }\n\n  void ResetSBDatabase() {"
- description: Verify a dedicated manager updates only extensions and preserves update notifications.
  regex:
    pattern: class SBLocalDatabaseManagerTest_ExtensionNetworkQuery
    replace: "TEST_F(SBLocalDatabaseManagerTest, ExtensionOnlyListsAndUpdates) {\n  ResetExtensionOnlyDatabaseManager();\n  ASSERT_EQ(1u, GetListInfos().size());\n  EXPECT_TRUE(GetListInfos()[0].fetch_updates());\n  EXPECT_EQ(GetChromeExtMalwareId(), GetListInfos()[0].list_id());\n  EXPECT_EQ(StoresToCheck({GetChromeExtMalwareId()}),\n            sb_local_database_manager_->GetStoresForFullHashRequests());\n  ASSERT_TRUE(sb_local_database_manager_->IsDatabaseReady());\n  auto states = sb_local_database_manager_->GetStoreStateMap();\n  EXPECT_EQ(1u, states->size());\n  EXPECT_TRUE(states->contains(GetChromeExtMalwareId()));\n\n  base::test::TestFuture<void> updated;\n  auto subscription = sb_local_database_manager_->RegisterDatabaseUpdatedCallback(\n      updated.GetRepeatingCallback());\n  DatabaseUpdated();\n  WaitForTasksOnTaskRunner();\n  EXPECT_TRUE(updated.IsReady());\n}\n\nclass SBLocalDatabaseManagerTest_ExtensionNetworkQuery"
- description: Check extension matches and restart behavior through the real dedicated factory for v4 and v5.
  regex:
    pattern: // This is similar to `TestCheckExtensionIDsOneIsBlocklisted`, but it uses a
    replace: "TEST_P(SBLocalDatabaseManagerTest_ExtensionSkipNetworkQuery,\n       ExtensionOnlyMatchAndDisableRestart) {\n  ResetExtensionOnlyDatabaseManager();\n  const FullHashStr bad_id(\"aapbdbdomjkkjkaonfhkkikfgjllcleb\");\n  const FullHashStr good_id(\"aapbdbdomjkkjkaonfhkkikfgjllclec\");\n  StoreAndHashPrefixes prefixes;\n  prefixes.emplace_back(GetChromeExtMalwareId(),\n                        GetParam().enable_v5 ? SBStore::ExtensionIdToHash(bad_id)\n                                             : bad_id);\n  ReplaceSBDatabase(prefixes, /*stores_available=*/true);\n  TestExtensionClient client({bad_id});\n  EXPECT_FALSE(sb_local_database_manager_->CheckExtensionIDs(\n      {bad_id, good_id}, &client));\n  WaitForTasksOnTaskRunner();\n  EXPECT_TRUE(client.on_check_extensions_result_called());\n\n  StopLocalDatabaseManager();\n  EXPECT_FALSE(sb_local_database_manager_->IsDatabaseReady());\n  TestExtensionClient disabled_client({});\n  EXPECT_TRUE(sb_local_database_manager_->CheckExtensionIDs(\n\
      \      {bad_id}, &disabled_client));\n  StartLocalDatabaseManager();\n  WaitForTasksOnTaskRunner();\n  EXPECT_TRUE(sb_local_database_manager_->IsDatabaseReady());\n  EXPECT_EQ(StoresToCheck({GetChromeExtMalwareId()}),\n            sb_local_database_manager_->GetStoresForFullHashRequests());\n}\n\nTEST_P(SBLocalDatabaseManagerTest_ExtensionSkipNetworkQuery,\n       ExtensionOnlyQueuedCancellationAndShutdown) {\n  ResetExtensionOnlyDatabaseManager();\n  StopLocalDatabaseManager();\n  StartLocalDatabaseManager();\n  TestExtensionClient cancelled({});\n  EXPECT_FALSE(sb_local_database_manager_->CheckExtensionIDs(\n      {\"aapbdbdomjkkjkaonfhkkikfgjllcleb\"}, &cancelled));\n  EXPECT_EQ(1u, GetQueuedChecks().size());\n  sb_local_database_manager_->CancelCheck(&cancelled);\n  EXPECT_TRUE(GetQueuedChecks().empty());\n  WaitForTasksOnTaskRunner();\n  EXPECT_FALSE(cancelled.on_check_extensions_result_called());\n\n  StopLocalDatabaseManager();\n  StartLocalDatabaseManager();\n  TestExtensionClient\
      \ disabled({});\n  EXPECT_FALSE(sb_local_database_manager_->CheckExtensionIDs(\n      {\"aapbdbdomjkkjkaonfhkkikfgjllcleb\"}, &disabled));\n  StopLocalDatabaseManager();\n  EXPECT_TRUE(disabled.on_check_extensions_result_called());\n\n  StartLocalDatabaseManager();\n  TestExtensionClient shutdown({});\n  EXPECT_FALSE(sb_local_database_manager_->CheckExtensionIDs(\n      {\"aapbdbdomjkkjkaonfhkkikfgjllcleb\"}, &shutdown));\n  ShutdownLocalDatabaseManager();\n  EXPECT_TRUE(GetQueuedChecks().empty());\n  EXPECT_FALSE(shutdown.on_check_extensions_result_called());\n}\n\n// This is similar to `TestCheckExtensionIDsOneIsBlocklisted`, but it uses a"
