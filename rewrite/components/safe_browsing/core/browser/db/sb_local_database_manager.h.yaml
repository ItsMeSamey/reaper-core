substitutions:
- description: Provide an extension-only list factory without changing the normal database.
  regex:
    pattern: "  SBLocalDatabaseManager(\n      base::PassKey"
    replace: "  // Uses only the Chrome extension malware list. This is a separate manager\n  // for embedders whose URL checks use another backend; use a distinct path.\n  static scoped_refptr<SBLocalDatabaseManager> CreateForExtensionBlocklist(\n      const base::FilePath& base_path,\n      scoped_refptr<base::SequencedTaskRunner> ui_task_runner,\n      scoped_refptr<base::SequencedTaskRunner> io_task_runner,\n      ExtendedReportingLevelCallback extended_reporting_level_callback);\n\n  SBLocalDatabaseManager(\n      base::PassKey"
