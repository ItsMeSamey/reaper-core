- description: 'Compile survey-only function only outside Android: void PingManager::SetHatsDelegateForTesting('
  regex:
    pattern: "void PingManager::SetHatsDelegateForTesting(\n    std::unique_ptr<SafeBrowsingHatsDelegate> hats_delegate) {\n\
      \  hats_delegate_ = std::move(hats_delegate);\n}"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid PingManager::SetHatsDelegateForTesting(\n    std::unique_ptr<SafeBrowsingHatsDelegate>\
      \ hats_delegate) {\n  hats_delegate_ = std::move(hats_delegate);\n}\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Do not retain a survey delegate in the Android security service
  regex:
    pattern: '      hats_delegate_(std::move(hats_delegate)),'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      hats_delegate_(std::move(hats_delegate)),\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
