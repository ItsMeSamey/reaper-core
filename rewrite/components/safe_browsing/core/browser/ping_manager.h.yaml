substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "base/containers/unique_ptr_adapters.h"

      #include "base/files/file_path.h"

      '
    replace: '#include "base/containers/unique_ptr_adapters.h"


      #include "build/build_config.h"

      #include "base/files/file_path.h"

      '
  count: 1
- description: Exclude survey-only Android declaration virtual void AttachThreatDetailsAndLaunchSurvey(
  regex:
    pattern: "  virtual void AttachThreatDetailsAndLaunchSurvey(\n      std::unique_ptr<ClientSafeBrowsingReportRequest> report,\n\
      \      bool is_tab_closed);"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  virtual void AttachThreatDetailsAndLaunchSurvey(\n      std::unique_ptr<ClientSafeBrowsingReportRequest>\
      \ report,\n      bool is_tab_closed);\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude survey-only Android declaration void SetHatsDelegateForTesting(
  regex:
    pattern: "  void SetHatsDelegateForTesting(\n      std::unique_ptr<SafeBrowsingHatsDelegate> hats_delegate);"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void SetHatsDelegateForTesting(\n      std::unique_ptr<SafeBrowsingHatsDelegate>\
      \ hats_delegate);\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude Android survey-specific security service state
  regex:
    pattern: "  // Launches HaTS surveys.\n  std::unique_ptr<SafeBrowsingHatsDelegate> hats_delegate_;"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Launches HaTS surveys.\n  std::unique_ptr<SafeBrowsingHatsDelegate> hats_delegate_;\n\
      #endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
