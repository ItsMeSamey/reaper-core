substitutions:
- description: Exclude dedicated Safe Browsing survey candidate filter implementation
  regex:
    pattern: "    \"//services/network/public/mojom\",\n    \"//url\",\n  ]\n}"
    replace: "    \"//services/network/public/mojom\",\n    \"//url\",\n  ]\n  if (is_android) {\n    sources -= [ \"safe_browsing_hats_delegate.cc\"\
      \ ]\n  }\n}"
  count: 1
- description: Exclude dedicated survey filter tests from Android
  regex:
    pattern: "    \":browser\",\n    \"//base/test:test_support\",\n    \"//testing/gtest\",\n  ]\n}"
    replace: "    \":browser\",\n    \"//base/test:test_support\",\n    \"//testing/gtest\",\n  ]\n  if (is_android) {\n \
      \   sources -= [ \"safe_browsing_hats_delegate_unittest.cc\" ]\n  }\n}"
  count: 1
