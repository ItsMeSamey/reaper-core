substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "base/gtest_prod_util.h"

      #include "components/safe_browsing/content/browser/base_ui_manager.h"

      '
    replace: '#include "base/gtest_prod_util.h"


      #include "build/build_config.h"

      #include "components/safe_browsing/content/browser/base_ui_manager.h"

      '
  count: 1
- description: Exclude survey-only Android declaration void AttachThreatDetailsAndLaunchSurvey(
  regex:
    pattern: "  void AttachThreatDetailsAndLaunchSurvey(\n      content::BrowserContext* browser_context,\n      std::unique_ptr<ClientSafeBrowsingReportRequest>\
      \ report,\n      bool is_tab_closed) override;"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void AttachThreatDetailsAndLaunchSurvey(\n      content::BrowserContext* browser_context,\n\
      \      std::unique_ptr<ClientSafeBrowsingReportRequest> report,\n      bool is_tab_closed) override;\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
