substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "base/gtest_prod_util.h"

      #include "base/memory/raw_ptr.h"

      '
    replace: '#include "base/gtest_prod_util.h"


      #include "build/build_config.h"

      #include "base/memory/raw_ptr.h"

      '
  count: 1
- description: Exclude Android survey candidate mutation
  regex:
    pattern: "  void SetIsHatsCandidate(bool is_hats_candidate) {\n    is_hats_candidate_ = is_hats_candidate;\n  }"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void SetIsHatsCandidate(bool is_hats_candidate) {\n    is_hats_candidate_ = is_hats_candidate;\n\
      \  }\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude survey-only Android declaration void MaybeAttachThreatDetailsAndLaunchSurvey(
  regex:
    pattern: '  void MaybeAttachThreatDetailsAndLaunchSurvey();'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  void MaybeAttachThreatDetailsAndLaunchSurvey();\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude Android survey candidate storage
  regex:
    pattern: '  bool is_hats_candidate_;'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  bool is_hats_candidate_;\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude Android survey-only tab-close metadata
  regex:
    pattern: '  bool is_tab_closed_ = false;'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  bool is_tab_closed_ = false;\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
