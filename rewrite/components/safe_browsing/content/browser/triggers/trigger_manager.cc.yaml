substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "components/safe_browsing/content/browser/triggers/trigger_manager.h"


      '
    replace: '#include "components/safe_browsing/content/browser/triggers/trigger_manager.h"


      #include "build/build_config.h"


      '
  count: 1
- description: On Android finish report collection only for real security reports, not removed surveys
  regex:
    pattern: '  if (should_send_report || is_hats_candidate) {'
    replace: "#if BUILDFLAG(IS_ANDROID)\n  if (should_send_report) {\n#else\n  if (should_send_report || is_hats_candidate)\
      \ {\n#endif"
  count: 1
- description: Exclude Android survey candidate propagation
  regex:
    pattern: '    collectors->threat_details->SetIsHatsCandidate(is_hats_candidate);'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n    collectors->threat_details->SetIsHatsCandidate(is_hats_candidate);\n#endif \
      \ // !BUILDFLAG(IS_ANDROID)"
  count: 1
