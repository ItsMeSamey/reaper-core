substitutions:
- description: 'Compile survey-only function only outside Android: void ThreatDetails::MaybeAttachThreatDetailsAndLaunchSurvey('
  regex:
    pattern: "void ThreatDetails::MaybeAttachThreatDetailsAndLaunchSurvey() {\n  if (!is_hats_candidate_) {\n    return;\n\
      \  }\n  // Copy fields useful for survey analysis.\n  auto report = std::make_unique<ClientSafeBrowsingReportRequest>();\n\
      \  report->set_type(report_->type());\n  report->set_repeat_visit(report_->repeat_visit());\n  report->set_did_proceed(report_->did_proceed());\n\
      \  report->set_url(report_->url());\n  report->set_page_url(report_->page_url());\n  report->set_referrer_url(report_->referrer_url());\n\
      \  if (report_->has_warning_shown_timestamp_msec()) {\n    report->set_warning_shown_timestamp_msec(\n        report_->warning_shown_timestamp_msec());\n\
      \  }\n  client_report_utils::FillInterstitialInteractionsHelper(\n      report.get(), interstitial_interactions_.get());\n\
      \  ui_manager_->AttachThreatDetailsAndLaunchSurvey(\n      browser_context_, std::move(report), is_tab_closed_);\n}"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid ThreatDetails::MaybeAttachThreatDetailsAndLaunchSurvey() {\n  if (!is_hats_candidate_)\
      \ {\n    return;\n  }\n  // Copy fields useful for survey analysis.\n  auto report = std::make_unique<ClientSafeBrowsingReportRequest>();\n\
      \  report->set_type(report_->type());\n  report->set_repeat_visit(report_->repeat_visit());\n  report->set_did_proceed(report_->did_proceed());\n\
      \  report->set_url(report_->url());\n  report->set_page_url(report_->page_url());\n  report->set_referrer_url(report_->referrer_url());\n\
      \  if (report_->has_warning_shown_timestamp_msec()) {\n    report->set_warning_shown_timestamp_msec(\n        report_->warning_shown_timestamp_msec());\n\
      \  }\n  client_report_utils::FillInterstitialInteractionsHelper(\n      report.get(), interstitial_interactions_.get());\n\
      \  ui_manager_->AttachThreatDetailsAndLaunchSurvey(\n      browser_context_, std::move(report), is_tab_closed_);\n}\n\
      #endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude survey delivery from Android threat collection
  regex:
    pattern: "  // Add report to HaTS survey response if applicable.\n  MaybeAttachThreatDetailsAndLaunchSurvey();"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Add report to HaTS survey response if applicable.\n  MaybeAttachThreatDetailsAndLaunchSurvey();\n\
      #endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Exclude Android survey candidate initialization
  regex:
    pattern: '      is_hats_candidate_(false),'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      is_hats_candidate_(false),\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 2
- description: Exclude tab-close metadata tracked solely for surveys
  regex:
    pattern: '  is_tab_closed_ = !web_contents_ || web_contents_->IsBeingDestroyed();'
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  is_tab_closed_ = !web_contents_ || web_contents_->IsBeingDestroyed();\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)"
  count: 1
