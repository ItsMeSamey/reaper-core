substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "components/safe_browsing/content/browser/base_ui_manager.h"


      '
    replace: '#include "components/safe_browsing/content/browser/base_ui_manager.h"


      #include "build/build_config.h"


      '
  count: 1
- description: 'Compile survey-only function only outside Android: void BaseUIManager::AttachThreatDetailsAndLaunchSurvey('
  regex:
    pattern: "void BaseUIManager::AttachThreatDetailsAndLaunchSurvey(\n    content::BrowserContext* browser_context,\n   \
      \ std::unique_ptr<ClientSafeBrowsingReportRequest> report,\n    bool is_tab_closed) {\n  DCHECK_CURRENTLY_ON(BrowserThread::UI);\n\
      \  return;\n}"
    replace: "#if !BUILDFLAG(IS_ANDROID)\nvoid BaseUIManager::AttachThreatDetailsAndLaunchSurvey(\n    content::BrowserContext*\
      \ browser_context,\n    std::unique_ptr<ClientSafeBrowsingReportRequest> report,\n    bool is_tab_closed) {\n  DCHECK_CURRENTLY_ON(BrowserThread::UI);\n\
      \  return;\n}\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
