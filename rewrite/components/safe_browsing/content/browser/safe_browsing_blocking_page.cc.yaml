substitutions:
- description: Exclude Android survey-only include components/safe_browsing/core/browser/safe_browsing_hats_delegate.h
  regex:
    pattern: '#include "components/safe_browsing/core/browser/safe_browsing_hats_delegate.h"

      '
    replace: '#if !BUILDFLAG(IS_ANDROID)

      #include "components/safe_browsing/core/browser/safe_browsing_hats_delegate.h"

      #endif  // !BUILDFLAG(IS_ANDROID)

      '
  count: 1
- description: Do not evaluate survey eligibility on Android security interstitials
  regex:
    pattern: "  const base::Feature& hats_feature =\n#if BUILDFLAG(IS_ANDROID)\n      kRedWarningSurveyAndroid;\n#else\n \
      \     kRedWarningSurvey;\n#endif\n  if (base::FeatureList::IsEnabled(hats_feature)) {\n    is_hats_candidate =\n   \
      \     SafeBrowsingHatsDelegate::IsSurveyCandidate(\n            threat_type_, kRedWarningSurveyReportTypeFilter.Get(),\
      \ proceeded(),\n            kRedWarningSurveyDidProceedFilter.Get()) &&\n        !is_proceed_anyway_disabled_ && is_safe_browsing_surveys_enabled_;\n\
      \  }"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  const base::Feature& hats_feature =\n#if BUILDFLAG(IS_ANDROID)\n      kRedWarningSurveyAndroid;\n\
      #else\n      kRedWarningSurvey;\n#endif\n  if (base::FeatureList::IsEnabled(hats_feature)) {\n    is_hats_candidate\
      \ =\n        SafeBrowsingHatsDelegate::IsSurveyCandidate(\n            threat_type_, kRedWarningSurveyReportTypeFilter.Get(),\
      \ proceeded(),\n            kRedWarningSurveyDidProceedFilter.Get()) &&\n        !is_proceed_anyway_disabled_ && is_safe_browsing_surveys_enabled_;\n\
      \  }\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
- description: Remove Android-only tab-close survey payload path while retaining report collection
  regex:
    pattern: "#if BUILDFLAG(IS_ANDROID)\n  // When an interstitial tab is closed on Android, the WebContents is\n  // synchronously\
      \ destroyed, which aborts any asynchronous ThreatDetails\n  // collection in TriggerManager before the survey can launch.\
      \ To ensure HaTS\n  // surveys are still triggered on tab close, assemble the minimal report\n  // metadata synchronously\
      \ here and dispatch it directly to the UI manager.\n  content::WebContents* wc = web_contents();\n  bool is_tab_closed\
      \ = wc ? wc->IsBeingDestroyed() : false;\n  if (is_hats_candidate && is_tab_closed) {\n    std::unique_ptr<ClientSafeBrowsingReportRequest>\
      \ survey_report =\n        CreateFallbackReport(unsafe_resources()[0], did_proceed, num_visits,\n                  \
      \           &local_interactions);\n    ui_manager()->AttachThreatDetailsAndLaunchSurvey(wc->GetBrowserContext(),\n \
      \                                                    std::move(survey_report),\n                                   \
      \                  /*is_tab_closed=*/true);\n    is_hats_candidate = false;\n  }\n#endif"
    replace: ''
  count: 1
- description: Match Android-excluded survey-only policy and sentiment state initialization
  regex:
    pattern: "      is_safe_browsing_surveys_enabled_(is_safe_browsing_surveys_enabled),\n      trust_safety_sentiment_service_trigger_(\n\
      \          std::move(trust_safety_sentiment_service_trigger)),"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n      is_safe_browsing_surveys_enabled_(is_safe_browsing_surveys_enabled),\n   \
      \   trust_safety_sentiment_service_trigger_(\n          std::move(trust_safety_sentiment_service_trigger)),\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)"
  count: 1
