substitutions:
- description: Use direct Android platform guard
  regex:
    pattern: '#include "base/functional/callback_helpers.h"

      '
    replace: '#include "base/functional/callback_helpers.h"


      #include "build/build_config.h"

      '
  count: 1
- description: Exclude Android survey-only policy and sentiment callback storage
  regex:
    pattern: "  // Whether the user has SafeBrowsingSurveysEnabled enabled.\n  bool is_safe_browsing_surveys_enabled_;\n \
      \ // Triggers trust and safety sentiment service when interstitial closes.\n  base::OnceCallback<void(bool, SBThreatType)>\n\
      \      trust_safety_sentiment_service_trigger_ = base::NullCallback();"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  // Whether the user has SafeBrowsingSurveysEnabled enabled.\n  bool is_safe_browsing_surveys_enabled_;\n\
      \  // Triggers trust and safety sentiment service when interstitial closes.\n  base::OnceCallback<void(bool, SBThreatType)>\n\
      \      trust_safety_sentiment_service_trigger_ = base::NullCallback();\n#endif  // !BUILDFLAG(IS_ANDROID)"
  count: 1
