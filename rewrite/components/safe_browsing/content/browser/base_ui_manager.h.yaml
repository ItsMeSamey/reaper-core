substitutions:
- description: Include direct platform build flags for Android source exclusion
  regex:
    pattern: '#include "base/memory/ref_counted.h"

      #include "base/types/pass_key.h"

      '
    replace: '#include "base/memory/ref_counted.h"


      #include "build/build_config.h"

      #include "base/types/pass_key.h"

      '
  count: 1
- description: Exclude survey-only Android declaration virtual void AttachThreatDetailsAndLaunchSurvey(
  regex:
    pattern: "  virtual void AttachThreatDetailsAndLaunchSurvey(\n      content::BrowserContext* browser_context,\n      std::unique_ptr<ClientSafeBrowsingReportRequest>\
      \ report,\n      bool is_tab_closed);"
    replace: "#if !BUILDFLAG(IS_ANDROID)\n  virtual void AttachThreatDetailsAndLaunchSurvey(\n      content::BrowserContext*\
      \ browser_context,\n      std::unique_ptr<ClientSafeBrowsingReportRequest> report,\n      bool is_tab_closed);\n#endif\
      \  // !BUILDFLAG(IS_ANDROID)"
  count: 1
