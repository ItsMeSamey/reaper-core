# Preserve stable native Android lazy tab identity and API behavior.
substitutions:
  - description: "Preserve native lazy-tab session identity and API behavior (literal 1)"
    regex:
      re_pattern: "\\\n\\#ifndef\\ COMPONENTS_SESSIONS_CONTENT_SESSION_TAB_HELPER_H_\\\n\\#define\\ COMPONENTS_SESSIONS_CONTENT_SESSION_TAB_HELPER_H_\\\n\\\n\\#include\\ \"base/callback_list\\.h\"\\\n\\#include\\ \"base/functional/callback\\.h\"\\\n"
      replace: "\n#ifndef COMPONENTS_SESSIONS_CONTENT_SESSION_TAB_HELPER_H_\n#define COMPONENTS_SESSIONS_CONTENT_SESSION_TAB_HELPER_H_\n\n#include <optional>\n\n#include \"base/callback_list.h\"\n#include \"base/functional/callback.h\"\n"
  - description: "Preserve native lazy-tab session identity and API behavior (literal 2)"
    regex:
      re_pattern: "\\\n\\ private:\\\n\\ \\ friend\\ class\\ content::WebContentsUserData<SessionTabHelper>;\\\n\\ \\ SessionTabHelper\\(content::WebContents\\*\\ contents,\\ DelegateLookup\\ lookup\\);\\\n\\\n\\ \\ sessions::SessionTabHelperDelegate\\*\\ GetDelegate\\(\\);\\\n\\\n"
      replace: "\n private:\n  friend class content::WebContentsUserData<SessionTabHelper>;\n  // A native tab may reserve its identity before it has WebContents.\n  SessionTabHelper(content::WebContents* contents,\n                   DelegateLookup lookup,\n                   std::optional<SessionID> initial_session_id = std::nullopt);\n\n  sessions::SessionTabHelperDelegate* GetDelegate();\n\n"
