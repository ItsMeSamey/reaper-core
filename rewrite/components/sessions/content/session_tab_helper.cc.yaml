# Preserve stable native Android lazy tab identity and API behavior.
substitutions:
  - description: "Preserve native lazy-tab session identity and API behavior (literal 1)"
    regex:
      re_pattern: "\\\n\\#include\\ \"components/sessions/content/session_tab_helper\\.h\"\\\n\\\n\\#include\\ \"base/memory/ptr_util\\.h\"\\\n\\#include\\ \"components/sessions/content/content_serialized_navigation_builder\\.h\"\\\n\\#include\\ \"components/sessions/content/session_tab_helper_delegate\\.h\"\\\n"
      replace: "\n#include \"components/sessions/content/session_tab_helper.h\"\n\n#include \"base/check.h\"\n#include \"base/memory/ptr_util.h\"\n#include \"components/sessions/content/content_serialized_navigation_builder.h\"\n#include \"components/sessions/content/session_tab_helper_delegate.h\"\n"
  - description: "Preserve native lazy-tab session identity and API behavior (literal 2)"
    regex:
      re_pattern: "namespace\\ sessions\\ \\{\\\n\\\nSessionTabHelper::SessionTabHelper\\(content::WebContents\\*\\ contents,\\\n\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ DelegateLookup\\ lookup\\)\\\n\\ \\ \\ \\ :\\ content::WebContentsObserver\\(contents\\),\\\n\\ \\ \\ \\ \\ \\ content::WebContentsUserData<SessionTabHelper>\\(\\*contents\\),\\\n\\ \\ \\ \\ \\ \\ delegate_lookup_\\(std::move\\(lookup\\)\\),\\\n\\ \\ \\ \\ \\ \\ session_id_\\(SessionID::NewUnique\\(\\)\\),\\\n\\ \\ \\ \\ \\ \\ window_id_\\(SessionID::InvalidValue\\(\\)\\)\\ \\{\\}\\\n\\\nSessionTabHelper::\\~SessionTabHelper\\(\\)\\ =\\ default;\\\n\\\n"
      replace: "namespace sessions {\n\nSessionTabHelper::SessionTabHelper(content::WebContents* contents,\n                                   DelegateLookup lookup,\n                                   std::optional<SessionID> initial_session_id)\n    : content::WebContentsObserver(contents),\n      content::WebContentsUserData<SessionTabHelper>(*contents),\n      delegate_lookup_(std::move(lookup)),\n      session_id_(initial_session_id ? *initial_session_id\n                                     : SessionID::NewUnique()),\n      window_id_(SessionID::InvalidValue()) {\n  CHECK(session_id_.is_valid());\n}\n\nSessionTabHelper::~SessionTabHelper() = default;\n\n"
