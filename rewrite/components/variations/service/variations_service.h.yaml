- description: "Preserve reviewed Android source projection for components/variations/service/variations_service.h (operation 3)."
  regex:
    re_pattern: '\

      \ \ web_resource::ResourceRequestAllowedNotifier\*\

      \ \ GetResourceRequestAllowedNotifierForTesting\(\)\ \{\

      \ \ \ \ return\ resource_request_allowed_notifier_\.get\(\);\

      \ \ \}\

      \

      \ \ //\ Wrapper\ around\ VariationsFieldTrialCreator::SetUpFieldTrials\(\)\.\

      '
    replace: "\n  web_resource::ResourceRequestAllowedNotifier*\n  GetResourceRequestAllowedNotifierForTesting() {\n#if BUILDFLAG(IS_ANDROID)\n    return nullptr;\n#else\n    return resource_request_allowed_notifier_.get();\n#endif\n  }\n\n  // Wrapper around VariationsFieldTrialCreator::SetUpFieldTrials().\n"
