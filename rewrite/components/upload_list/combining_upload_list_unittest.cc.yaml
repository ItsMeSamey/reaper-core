substitutions:
- description: Explicit string dependency for deterministic report IDs
  regex:
    pattern: '#include <array>

      '
    replace: '#include <array>

      #include <string>

      '
  count: 1
- description: Exercise a single unsorted list with mixed timestamps before the newest50 limit
  regex:
    pattern: 'TEST_F(CombiningUploadListTest, RequestSingleUpload) {

      '
    replace: "TEST_F(CombiningUploadListTest, SingleUnsortedListMostRecentLimit) {\n  auto local_list = base::MakeRefCounted<MockUploadList>();\n\
      \  EXPECT_CALL(*local_list, LoadUploadList()).WillOnce([] {\n    std::vector<std::unique_ptr<UploadList::UploadInfo>>\
      \ entries;\n    // Ascending input deliberately puts the newest entry beyond the UI limit.\n    for (int i = 1; i <=\
      \ 51; ++i) {\n      const base::Time time =\n          base::Time::FromSecondsSinceUnixEpoch(1614000000 + i);\n    \
      \  auto entry = std::make_unique<UploadList::UploadInfo>(std::to_string(i),\n                                      \
      \                    time);\n      if (i % 2 == 0) {\n        // Capture time takes precedence over a later upload time.\n\
      \        entry->capture_time = time;\n        entry->upload_time = time + base::Days(1);\n      }\n      entries.push_back(std::move(entry));\n\
      \    }\n    return entries;\n  });\n  auto combined_list = base::MakeRefCounted<CombiningUploadList>(\n      std::vector<scoped_refptr<UploadList>>{local_list});\n\
      \n  base::RunLoop run_loop;\n  combined_list->Load(run_loop.QuitClosure());\n  run_loop.Run();\n\n  const auto actual\
      \ = combined_list->GetUploads(50);\n  ASSERT_EQ(actual.size(), 50u);\n  for (size_t i = 0; i < actual.size(); ++i) {\n\
      \    const int expected = 51 - static_cast<int>(i);\n    const base::Time time =\n        base::Time::FromSecondsSinceUnixEpoch(1614000000\
      \ + expected);\n    EXPECT_EQ(actual[i]->upload_id, std::to_string(expected));\n    EXPECT_EQ(actual[i]->capture_time,\n\
      \              expected % 2 == 0 ? time : base::Time());\n    EXPECT_EQ(actual[i]->upload_time,\n              expected\
      \ % 2 == 0 ? time + base::Days(1) : time);\n  }\n}\n\nTEST_F(CombiningUploadListTest, RequestSingleUpload) {\n"
  count: 1
