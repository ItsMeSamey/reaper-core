# Close provider cursors without changing SAF lookup or exception outcomes.
substitutions:
- description: Close every acquired SAF child cursor on empty and exceptional traversal paths.
  regex:
    re_pattern: '\ \ \ \ \ \ \ \ \ \ \ \ if\ \(c\ ==\ null\ \|\|\ !c\.moveToFirst\(\)\)\ return\ null;\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ int\ nameIndex\ =\ c\.getColumnIndex\(DocumentsContract\.Document\.COLUMN_DISPLAY_NAME\);\

      \ \ \ \ \ \ \ \ \ \ \ \ int\ documentIdIndex\ =\ c\.getColumnIndex\(DocumentsContract\.Document\.COLUMN_DOCUMENT_ID\);\

      \

      \ \ \ \ \ \ \ \ \ \ \ \ boolean\ found\ =\ false;\

      \ \ \ \ \ \ \ \ \ \ \ \ while\ \(true\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!c\.isNull\(nameIndex\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ !c\.isNull\(documentIdIndex\)\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \&\&\ name\.equals\(c\.getString\(nameIndex\)\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ documentId\ =\ c\.getString\(documentIdIndex\);\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ found\ =\ true;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ break;\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!c\.moveToNext\(\)\)\ break;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \ \ \ \ c\.close\(\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(!found\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ null;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      '
    replace: "            if (c == null) return null;\n            try (Cursor cursor = c) {\n                if (!cursor.moveToFirst()) return null;\n\n                int nameIndex = cursor.getColumnIndex(DocumentsContract.Document.COLUMN_DISPLAY_NAME);\n                int documentIdIndex =\n                        cursor.getColumnIndex(DocumentsContract.Document.COLUMN_DOCUMENT_ID);\n\n                boolean found = false;\n                while (true) {\n                    if (!cursor.isNull(nameIndex)\n                            && !cursor.isNull(documentIdIndex)\n                            && name.equals(cursor.getString(nameIndex))) {\n                        documentId = cursor.getString(documentIdIndex);\n                        found = true;\n                        break;\n                    }\n                    if (!cursor.moveToNext()) break;\n                }\n                if (!found) {\n                    return null;\n                }\n            }\n"
  count: 1
- description: Close SAF root existence cursors before returning.
  regex:
    re_pattern: '\ \ \ \ private\ boolean\ contentUriExists\(Uri\ uri\)\ \{\

      \ \ \ \ \ \ \ \ try\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ Cursor\ c\ =\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ mResolver\.query\(\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ uri,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ new\ String\[\]\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ DocumentsContract\.Document\.COLUMN_DOCUMENT_ID,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \},\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ null,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ null,\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ null\);\

      \ \ \ \ \ \ \ \ \ \ \ \ if\ \(c\ !=\ null\ \&\&\ c\.moveToFirst\(\)\)\ \{\

      \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ return\ true;\

      \ \ \ \ \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ \}\ catch\ \(Exception\ e\)\ \{\

      \ \ \ \ \ \ \ \ \}\

      \ \ \ \ \ \ \ \ return\ false;\

      \ \ \ \ \}'
    replace: "    private boolean contentUriExists(Uri uri) {\n        try (Cursor c =\n                mResolver.query(\n                        uri,\n                        new String[] {\n                            DocumentsContract.Document.COLUMN_DOCUMENT_ID,\n                        },\n                        null,\n                        null,\n                        null)) {\n            if (c != null && c.moveToFirst()) {\n                return true;\n            }\n        } catch (Exception e) {\n        }\n        return false;\n    }"
  count: 1
