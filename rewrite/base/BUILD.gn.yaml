substitutions:
  - description: Add the Brave base java sources.
    add_literal_to_list:
      target: base_java
      list_name: sources
      literal: brave_java_base_sources

  - description: Add the Brave shared preferences java sources.
    add_literal_to_list:
      target: base_shared_preferences_java
      list_name: sources
      literal: brave_base_shared_preferences_java_sources

  - description: Include the SAF cursor lifetime regressions in the existing base JUnit runner.
    regex:
      re_pattern: '\ \ \ \ \ \ "android/junit/src/org/chromium/base/ValueChangedCallbackTest\.java",\

        '
      replace: "      \"android/junit/src/org/chromium/base/ValueChangedCallbackTest.java\",\n      \"//brave/android/junit/src/org/chromium/base/VirtualDocumentPathUnitTest.java\",\n"
    count: 1
  - description: Link the existing virtual document implementation into base JUnit tests.
    regex:
      re_pattern: '\ \ \ \ \ \ ":tristate_java",\

        \ \ \ \ \ \ "//base/test:leak_canary_java",\

        '
      replace: "      \":tristate_java\",\n      \":virtual_document_path_java\",\n      \"//base/test:leak_canary_java\",\n"
    count: 1
  - description: Route Java test activities to an explicitly owned display 1
    regex:
      pattern: "    ]\n\n    if (!is_cronet_build) {\n      sources +=\n          [ \"android/junit/src/org/chromium/base/ui/KeyboardUtilsTest.java\" ]\n      deps += [ \":ui_java\" ]\n    }\n  }\n"
      replace: "    ]\n\n    if (!is_cronet_build) {\n      sources += [\n        \"android/junit/src/org/chromium/base/ui/KeyboardUtilsTest.java\",\n        \"//brave/android/junit/src/org/chromium/base/test/BaseActivityTestRuleTest.java\",\n      ]\n      deps += [ \":ui_java\" ]\n    }\n  }\n"
    count: 1
  - description: 'Owned Android native test data and explicit no-device-recovery: edit 1'
    regex:
      pattern: "      \"test/android/junit/src/org/chromium/base/test/util/LeakCanaryCheckerTest.java\",\n      \"test/android/junit/src/org/chromium/base/test/util/RestrictionSkipCheckTest.java\",\n      \"test/android/junit/src/org/chromium/base/test/util/SkipCheckTest.java\",\n    ]\n    deps = [\n      \":base_java\",\n"
      replace: "      \"test/android/junit/src/org/chromium/base/test/util/LeakCanaryCheckerTest.java\",\n      \"test/android/junit/src/org/chromium/base/test/util/RestrictionSkipCheckTest.java\",\n      \"test/android/junit/src/org/chromium/base/test/util/SkipCheckTest.java\",\n      \"test/android/junit/src/org/chromium/base/test/util/UrlUtilsTest.java\",\n    ]\n    deps = [\n      \":base_java\",\n"
    count: 1
